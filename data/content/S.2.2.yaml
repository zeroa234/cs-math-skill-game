skill: S.2.2
version: 2
authors: [main-agent]
brief:
  why: |
    互联网协议最初假设通信双方彼此诚实合作：以太网谁声称自己是网关就信谁，BGP 谁广播自己连着某网段就转发，TCP 没加密时中间路由器都能拆开偷看。网络安全就是站在这套真实协议栈之上，从攻击者的视角拆解每一层哪里容易被冒充、注入、窃听或打满队列，再学会用网络分段、有状态防火墙、入侵检测、TLS 1.3 加密与 WPA 无线认证把防线一层层搭起来。本包建立在网络协议（C.3.2）和操作系统（C.2.1）之上，所有攻防机制都按具体报文和数字一步步推导。
  outcomes:
    - 区分被动窃听者、在途攻击者与离路攻击者的能力边界，说清 ARP 欺骗、DHCP 仿冒、BGP 劫持与 TCP 注入的成因和对应防护
    - 推导 SYN 洪泛与反射放大 DDoS 如何耗尽状态或带宽，并算清 SYN Cookie 如何靠密钥哈希免去半开表状态
    - 拆解 DNS 缓存投毒、Bailiwick 检查与 Kaminsky 攻击，并说明 DNSSEC 中 KSK、ZSK、RRSIG、DS 与 NSEC3 的信任链
    - 用子网、NAT、DMZ 与零信任“永不信任，始终验证”划定分段边界，写出默认拒绝的三区有状态防火墙规则表
    - 区分 NIDS/HIDS 及签名/异常/规约三种检测策略，手算基率谬误并防备检测逃逸与滥用，完成面向安全运营的日志与告警分诊
    - 追踪 TLS 1.3 握手、证书校验与临时 ECDHE 前向保密，对比 WEP、WPA2 个人/企业版与 WPA3 SAE 的防线演进
terms:
  - term: 在途攻击者
    def: 位于通信路径上的攻击者，既能偷看也能拦截、修改或丢弃经过自己的数据包（如控制了路由器或接入交换机）。
  - term: 离路攻击者
    def: 不在数据包正常传输路径上的攻击者，无法偷看正常回包，只能伪造源地址往目标盲发数据包抢答。
  - term: ARP 欺骗
    def: 攻击者在局域网发送伪造的 ARP 应答，把网关或受害者的 IP 绑定到自己的 MAC 地址，从而劫持本地流量。
  - term: 路由劫持
    def: 恶意或配置错误的自治系统通过 BGP 通告不属于自己的 IP 前缀或伪造更短路径，把全网流量引向自己。
  - term: SYN 洪泛
    def: 攻击者发送大量伪造源地址的 TCP SYN 建连请求却不回复最终 ACK，把服务器半开连接队列塞满导致拒绝服务。
  - term: DDoS
    def: 分布式拒绝服务攻击：攻击者操控大量傀儡主机或利用开放服务器反射放大流量，从多处同时向目标发起资源耗尽攻击。
  - term: SYN Cookie
    def: 服务器把连接五元组与密钥哈希值编码进初始序号 ISN 回复，不再提前分配半开表内存，等收到合法 ACK 时再现场校验建连。
  - term: DNS 缓存投毒
    def: 攻击者抢在权威服务器之前向递归解析器送入伪造的 DNS 应答，让解析器缓存错误的域名到 IP 映射。
  - term: DNSSEC
    def: 域名系统安全扩展：通过逐级签名的公钥与数字签名记录形成从根区到权威域的信任链，防止解析结果被篡改。
  - term: 网络分段
    def: 用子网、VLAN、隔离区和访问策略把大网络拆分成互设边界的若干区域，限制入侵发生后的横向移动范围。
  - term: DMZ
    def: 隔离区（非军事区）：夹在外网和内网之间的半受信任网段，用来放置必须对外公开服务的 Web 或邮件服务器，防攻破后直达核心内网。
  - term: 零信任
    def: 不再把“连进内网”当作可信凭据，而是对每一次资源访问都校验身份、设备状态与最小权限并持续监控的安全架构。
  - term: 有状态防火墙
    def: 不仅检查单个数据包的五元组，还维护活跃连接追踪表以自动放行合法已建连回包的网络边界过滤设备。
  - term: 入侵检测
    def: 旁路监听网络流量或主机系统行为，对比威胁特征或异常模式并产生安全告警与取证日志的监测机制。
  - term: 告警
    def: 入侵检测或安全监控系统发现可疑特征或异常行为后生成的一条待安全人员研判处理的事件记录。
  - term: 日志
    def: 系统、防火墙、DNS 或应用按时间顺序记录的连接、认证、请求与操作流水，是事后回溯与多源关联取证的基础。
  - term: 分诊
    def: 安全运营人员拿到海量告警后，按严重程度、真伪置信度与业务影响快速筛查并决定处置优先级的过程。
  - term: 基率谬误
    def: 当真实攻击在总事件中比例极低时，即使检测器误报率看似很小，海量正常流量产生的误报数量仍会远超真告警的统计陷阱。
  - term: 前向保密
    def: 每次会话临时协商一次性密钥且用完销毁，即使服务器长期私钥日后泄露，攻击者也无法解密过去录下的历史密文。
  - term: WPA2
    def: 基于 AES-CCMP 加密与四次握手认证的 Wi-Fi 安全协议，取代了存在严重密钥重用漏洞的早期 WEP 标准。
lessons:
  # ======================================================================== 协议攻击面
  - id: network-adversaries
    chapter: 协议攻击面
    title: 协议分层、寻址回顾与网络对手模型
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 咖啡店里有两个黑客想破坏你和银行网站的通信：甲黑客连进了同一个免费 Wi-Fi 控制了路由器；乙黑客远在另一个国家，控制不了你经过的任何一台路由器。下面哪件事**只有甲能做到、乙做不到**？
          options:
            - text: 偷看并悄悄篡改你发出的明文报文，且把银行真正的回包拦下来不让你看到
              correct: true
            - text: 往银行服务器发送源 IP 填成你电脑地址的伪造数据包
              why: 只要乙所在网络不做源地址过滤，离路攻击者也能伪造源 IP 盲发报文，只是看不到回包
            - text: 同时向银行服务器发海量连接请求把它挤卡顿
              why: 乙虽然不在你的路径上，依然能直接往公开的银行服务器发海量流量
          explain: 安全分析第一步永远是看“对手坐在哪”：坐在路径上的能偷看还能拦截改包，坐路径外的只能盲发拼运气。
      - card:
          title: 回顾报文头与三层寻址边界
          body: |
            从 C.3.2 我们已经知道，一个网络包就像套娃信封：外层以太网帧写着同一局域网内的 **MAC 地址**，中间 IP 首部写着跨网段的 **IP 地址**，里层 TCP/UDP 首部写着区分进程的**端口**。

            同时别忘了两种数据抽象的差别：单个**分组（packet）**是彼此独立路由的信件，而一条 **TCP 连接**则是靠双方状态和序号拼起来的字节流——攻击者只需伪造单个分组，就能去搅乱整条连接状态。
      - card:
          title: 网络对手的三种能力级别（CS161 第 25 章）
          body: |
            把对手按位置与能力拆成三类（大纲 1.6）：
            1. **被动窃听者（Passive / Eavesdropper）**：能听到链路上的数据包（例如共享 Wi-Fi 或旁路镜像），但不能修改或拦截报文。
            2. **在途攻击者（On-path attacker）**：坐在通信路径上，既能偷听，也能篡改、延迟、伪造或直接丢弃经过自己的报文。
            3. **离路攻击者（Off-path attacker）**：不在通信路径上，既听不到正常往返报文也挡不住真回包，只能自己伪造源 IP 盲发报文跟真服务器“抢答”。
      - item:
          id: q-adversary-type
          type: match
          prompt: 把下面三种真实攻击处境与最准确的网络对手模型连线。
          pairs:
            - [攻击者接管了受害者必经的校园出口路由器，能篡改明文网页并丢弃原响应, 在途攻击者]
            - [攻击者在图书馆打开抓包网卡，只静静录下周围飘过的未加密无线帧, 被动窃听者]
            - [攻击者在海外租用普通主机，伪造受害者 IP 向 DNS 递归器盲猜事务 ID, 离路攻击者]
          explain: “能不能截断或看到正常流量”是分界线：只看不改是被动窃听，能看能改能拦是在途，看不见也拦不住只能盲发是离路。
      - card:
          title: 例题：拆解一条跨网请求在路径上暴露了什么
          body: |
            假设你在咖啡店连 Wi-Fi 访问 `http://shop.example:80`，请求经过家里/咖啡店路由器 R1、运营商路由器 R2，最后抵达目标服务器 S。不同位置的人各能看见和改掉什么？
          reveal:
            - title: 第 1 步：链路层地址只活在每一跳局域网里
              body: 你的手机到 R1 之间，以太网帧写着手机 MAC 与 R1 的 MAC；过 R1 后帧头换新 MAC，因此远端的 R2 与离路攻击者看不见你的本地 MAC。
            - title: 第 2 步：网络层与传输层明文首部沿途可见且易伪造
              body: IP 首部写着源 IP 与目的 IP，TCP 首部写着端口、序号与确认号；坐在路径上的 R1、R2（在途攻击者）能直接偷看甚至截断篡改；离路攻击者看不见本次连接端口和当前序号，但只要网络不做源地址过滤，就能盲发伪造源 IP 的数据包。
      - card:
          title: 为什么老协议普遍怕冒充：信任与源地址伪造
          body: |
            早年互联网协议设计时首要目标是“互通”，报文头里的源 MAC、源 IP 甚至链路通知，很多时候接收方默认“填谁就信谁”。

            比如 IP 分组首部里的源 IP 地址只是发送方自己填上去的 32 位数字。如果没有出口网络做**入口源地址过滤（BCP 38）**核对“这个网口发出来的包，源 IP 确实属于这个网段”，离路攻击者就能随手把源 IP 写成别人。
      - item:
          id: q-bcp38
          type: choice
          prompt: 互联网运营商或企业网关在接入边缘部署“入口源地址过滤（BCP 38 / uRPF）”后，检查每个离开客户局域网的 IP 包。它具体拦住了什么？
          options:
            - text: 拦住源 IP 不属于该接入网段的伪造数据包，大幅压缩离路攻击者假冒别人 IP 发包的空间
              correct: true
            - text: 自动把所有未加密的 HTTP 网页升级成 HTTPS 加密通信
              why: 源地址过滤只校验 IP 首部里的源地址是否合法，不负责加解密应用载荷
            - text: 让局域网里的电脑不需要配置任何 MAC 地址就能通信
              why: 以太网内转发仍然依赖 MAC 地址
          explain: BCP 38 让靠近源头的路由器直接拒绝“冒用外网别人家 IP”的出站包，从源头卡死 IP 地址伪造与反射放大攻击。
      - item:
          id: q-onpath-power
          type: choice
          prompt: 某公共 Wi-Fi 上所有数据都未加密（明文 HTTP）。如果在途攻击者（On-path）与离路攻击者（Off-path）同时想把网页里的收款账号替换成自己的，为什么离路攻击者很难得手而在途攻击者轻而易举？
          options:
            - text: 在途攻击者看得见连接端口号和 TCP 序号并能直接拦截原响应再改包，离路攻击者看不见这些参数且拦不住真服务器回包
              correct: true
            - text: 因为离路攻击者的电脑装不了浏览器
              why: 与客户端软件无关，关键在于网络路径位置决定能否偷看报文头与阻断真包
            - text: 因为明文 HTTP 协议会自动识别攻击者是不是本地居民
              why: HTTP 明文没有任何身份校验，只是离路攻击者缺少会话参数并面对真回包竞争
          explain: 对未加密流量而言，在途攻击者几乎拥有“神视角 + 拦截权”，离路攻击者却得面对盲猜参数和竞速两个硬壁垒。
      - item:
          id: q-passive-vs-onpath
          type: choice
          prompt: 当通信双方在一条未加密的链路上对话时，**被动窃听者**能做到、但无法越界的动作是什么？
          options:
            - text: 能完整记录下经过这段链路的所有明文请求与响应内容，但不能拦截删改包或阻止真服务器响应到达
              correct: true
            - text: 能把银行网页回包里的收款账号替换成自己的账号并丢弃原包
              why: 拦截、丢弃和替换沿途报文是在途攻击者（On-path）的能力，单纯的被动窃听者只收听副本
            - text: 哪怕连自己所在的链路经过什么流量都完全看不见
              why: 看不见正常流量的是离路攻击者（Off-path），被动窃听者能听到所监听网段的流量
          explain: 被动窃听威胁的是**机密性**（偷看秘密），在途攻击者同时威胁**机密性与完整性/可用性**（能偷看也能篡改或丢包）。

  - id: arp-dhcp-spoofing
    chapter: 协议攻击面
    title: 局域网冒充：ARP 欺骗与 DHCP 攻击
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 同一办公室局域网里，你的电脑只知道默认网关的 IP 是 `192.168.1.1`，但不知道它的 MAC 地址，于是广播问了一句“谁是 192.168.1.1？”。旁边一台被黑客控制的同事电脑立刻大喊“我就是，MAC 是我的！”。在没有额外防御的普通交换机网络里，你的电脑会怎么办？
          options:
            - text: 乖乖信以为真，把写着同事 MAC 的映射记进本地 ARP 缓存，之后外网流量全发给他
              correct: true
            - text: 立刻弹出密码框要求同事输入网关管理员口令
              why: 标准 ARP 协议设计于局域网互通时代，报文里根本没有密码或数字签名字段
            - text: 交换机天生会自动比较谁说的是真话
              why: 普通二层交换机默认只看帧头的 MAC 地址学习端口，不会替你核查 ARP 载荷里的 IP-MAC 真伪
          explain: 局域网最危险的裂缝正是“先到先得、无任何认证”——攻击者靠几条伪造广播/单播就能把自己插进别人的通信路径里，变成在途攻击者。
      - card:
          title: 以太网、ARP 协议与 ARP 欺骗（CS161 第 26 章）
          body: |
            从 C.3.2 已知，ARP 把 IP 解析成同一以太网里的 MAC 地址；而且主机收到无端发来的 ARP 应答（Gratuitous ARP）时，往往会直接覆盖本地 ARP 缓存表，甚至不查自己刚才问过没有。

            于是**ARP 欺骗（ARP spoofing）**只需两步：攻击者一边不停告诉受害者“网关 IP 在我这”，一边告诉网关“受害者 IP 在我这”。双方流量就会先绕到攻击者网卡再转发出去，攻击者瞬间变成**在途攻击者**。
      - card:
          title: 例题：追踪一次局域网 ARP 欺骗后，主机缓存与流量怎么改道
          body: |
            假设局域网里有受害主机 `A`（IP `10.0.0.5`，MAC `AA:AA`）、网关 `G`（IP `10.0.0.1`，MAC `GG:GG`）和攻击者 `M`（IP `10.0.0.99`，MAC `MM:MM`）。攻击开始后数据包究竟怎么走？
          reveal:
            - title: 第 1 步：假 ARP 应答改写双方缓存表
              body: 攻击者 `M` 给 `A` 发假应答“我是 `10.0.0.1`，MAC 是 `MM:MM`”，同时给网关 `G` 发假应答“我是 `10.0.0.5`，MAC 是 `MM:MM`”。没有 DAI 保护时，`A` 的缓存表立刻把网关映射改成 `MM:MM`，`G` 的缓存表把 `A` 映射也改成 `MM:MM`。
            - title: 第 2 步：所有进出流量经由 `M` 绕一圈再送达
              body: "`A` 上网发出的每一帧目的 MAC 全写 `MM:MM`，交换机老实把帧送进 `M` 的网口；`M` 偷看或篡改后改写目的 MAC 为 `GG:GG` 转交给真网关。真网关回包同理先给 `MM:MM` 再回给 `A`，双方甚至丝毫察觉不到中间已经多了一跳窃听者！"
      - item:
          id: q-arp-mitm
          type: order
          prompt: 攻击者想在同一局域网内利用 ARP 欺骗窃听主机 A 和默认网关 G 之间的明文流量并保持通信不断线，请按正确步骤排序。
          steps:
            - 向主机 A 发送伪造 ARP 应答，声称网关 G 的 IP 对应攻击者的 MAC 地址
            - 向网关 G 发送伪造 ARP 应答，声称主机 A 的 IP 对应攻击者的 MAC 地址
            - 在攻击者机器开启数据包转发，收到双方报文偷看或篡改后再转给真正目标
          explain: 只骗一边只能拿到单向流量，两边都骗并开启转发才能稳稳坐在双向路径中间做中间人（在途攻击者）。
      - card:
          title: 交换机怎样守住局域网：静态绑定与 DAI
          body: |
            普通二层交换机按帧头学习“哪个物理网口对应哪个 MAC”，却看不懂 ARP 载荷（2.5 节）。

            企业级交换机用三招防守：
            1. **动态 ARP 检测（DAI）**：交换机查内部维护的合法 `IP–MAC–网口` 信任表，发现某网口发出的 ARP 应答声称的 IP 或 MAC 与登记不符，直接丢弃！
            2. **端口安全与静态绑定**：关键服务器和网关的 IP–MAC 写死静态 ARP 项，不随广播/伪造应答改写。
            3. **上层端到端加密**：即使链路层被骗成在途，只要应用用 TLS 加密认证，攻击者依然读不出也改不动。
      - card:
          title: DHCP 欺骗：抢先给你发个“假网关和假 DNS”（CS161 第 27 章）
          body: |
            新设备连进局域网还没有 IP 时会广播 `DHCP Discover`。**DHCP 攻击**有两招（3.4 节）：
            - **DHCP 饿死（Starvation）**：不断换假 MAC 向真 DHCP 服务器租走全部 IP，使正常新设备拿不到地址。
            - **流氓 DHCP 服务器（Rogue Server）**：抢在真服务器前回复 `DHCP Offer`，把“默认网关”和“DNS 服务器”全填成攻击者自己的 IP！以后受害者所有上网与域名查询都乖乖送上门。
      - item:
          id: q-dhcp-rogue
          type: choice
          prompt: 为什么在校园网或企业交换机上必须开启 **DHCP Snooping**（只允许连接合法机房服务器的那几个特定“信任端口”向下发 DHCP Offer）？
          options:
            - text: 防止接在普通用户工位网口上的恶意主机假冒 DHCP 服务器抢答，把受害者的默认网关或 DNS 指到攻击者机器
              correct: true
            - text: 因为启用 DHCP Snooping 后局域网里的电脑再也不用 IP 地址了
              why: 设备依然通过 DHCP 获取 IP，只是限制只有信任端口能发出服务器响应报文
            - text: 因为 DHCP 协议默认使用 4096 位公钥签名，开启 Snooping 可以加速验签
              why: 传统 DHCP 报文没有加密或数字签名，正因如此才需要交换机按物理端口划分信任边界
          explain: DHCP Snooping 在交换机上划出“信任端口 vs 非信任端口”：普通用户端口只准发请求不准当服务器，同时顺便建出供 DAI 校验的合法 IP–MAC 绑定表。
      - item:
          id: q-dhcp-starvation
          type: choice
          prompt: 攻击者在局域网里不断伪造上千个不同的假 MAC 地址向合法 DHCP 服务器狂发租用请求（DHCP 饿死攻击），通常想达到什么后续目的？
          options:
            - text: 耗尽合法 DHCP 服务器的可用 IP 地址池让真设备拿不到合法地址，趁机由自己架设的流氓 DHCP 服务器顶替抢答下发假网关和假 DNS
              correct: true
            - text: 让局域网里的每一台电脑瞬间增加 10 Gbps 物理带宽
              why: DHCP 饿死耗尽的是 IP 地址池资源，制造的是拒绝服务或趁虚劫持，不会增加带宽
            - text: 直接在远方互联网核心路由器上修改跨国 BGP 路由表
              why: DHCP 广播只停留在本地局域网广播域之内，穿过默认网关就不再转发
          explain: 饿死合法地址池是“清场”，随后流氓 DHCP 抢答下发自己的网关和 DNS 才是“上位接管本地流量”。
      - item:
          id: q-lan-defense-match
          type: match
          prompt: 把下面四种局域网安全威胁与最对症的防御手段配对。
          pairs:
            - [攻击者发送伪造 ARP 应答劫持同网段流量, 在交换机启用动态 ARP 检测（DAI）或配置关键主机静态绑定]
            - [恶意主机冒充 DHCP 服务器给新设备下发假网关和假 DNS, 在交换机启用 DHCP Snooping，仅允许信任端口下发 Offer]
            - [攻击者狂发假 MAC 的 DHCP 请求耗尽局域网地址池, 限制交换机单个接入端口允许学习的 MAC 数量（端口安全）]
            - [局域网即使存在在途窃听者也不希望泄露网页密码与正文, 全程使用带身份认证的端到端加密（如 HTTPS/TLS）]
          explain: 交换机层靠端口信任（DHCP Snooping / DAI / 端口安全）堵住二层冒充，应用层靠端到端加密作最后保底。

  - id: bgp-hijacking
    chapter: 协议攻击面
    title: 域间路由攻击：BGP 劫持、路由泄露与 RPKI
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 互联网由几万个独立运营的自治系统（AS）通过 BGP 互相通告“我能到达哪些 IP 网段”。如果某天国外一家小运营商因为配置手误（或恶意攻击），在 BGP 里对外广播“我直连着 Google 的 `8.8.8.0/24` 网段”，其它运营商的路由器默认会怎么处理？
          options:
            - text: 传统 BGP 没有自带所有权密码校验，邻近路由器很可能会信以为真并把发往该网段的流量改道送过去
              correct: true
            - text: 互联网中心总会立刻自动弹出身份证核验并秒级封号
              why: 互联网没有单一全球中心管理员，传统 BGP 完全建立在自治系统之间口头互信的基础上
            - text: 因为 IP 地址长度超过 100 位，路由表根本存不下
              why: IPv4 地址只有 32 位，网段通告是 BGP 的日常工作
          explain: 2008 年巴基斯坦电信误通告 YouTube 前缀、导致全球部分流量被吸进黑洞断网两小时的真实事故，正是 BGP 缺乏源验证的写照。
      - card:
          title: 回顾 BGP 选路与最长前缀匹配（CS161 第 29 章）
          body: |
            从 C.3.2 已知，路由器转发看**最长前缀匹配**，而自治系统之间用 **BGP** 通告前缀可达性与 `AS_PATH`（路径向量），选路偏好大致看：本地商业策略优先 → 最短 `AS_PATH` 跳数。

            这给攻击者留下了两把利器（大纲 4.4）：
            1. **通告更具体的前缀（More-specific prefix）**：合法主人通告 `/22`，攻击者改通告 `/24`！全网路由器按最长前缀匹配，统统把流量拐向攻击者。
            2. **伪造极短 `AS_PATH`**：假装自己一跳直连目标网段。
      - item:
          id: q-bgp-specific
          type: choice
          prompt: 合法银行 AS65001 对外通告自己拥有 `203.0.113.0/23` 网段。某恶意 AS65999 故意对外广播自己拥有更窄的一半 `203.0.113.0/24`。全网其他正常路由器收到两条通告后，发往 `203.0.113.55` 的流量通常会去哪？
          options:
            - text: 去恶意 AS65999，因为路由器转发表执行“最长前缀匹配”，`/24` 比 `/23` 更长更具体
              correct: true
            - text: 去合法银行 AS65001，因为 `/23` 覆盖范围比 `/24` 更大
              why: 正相反，最长前缀匹配永远优先匹配掩码位数更多的更窄网段
            - text: 流量会随机在两条路径之间平分一半
              why: 不同前缀长度不会触发等价多路径负载均衡，`/24` 会绝对胜出
          explain: "**路由劫持**最隐蔽的一招不是跟人家比路径短，而是拆出更长的子前缀——由于最长前缀匹配硬规则，全网路由器都会优先选中这个假路由。"
      - card:
          title: 流量劫持 vs 黑洞，以及路由泄露
          body: |
            把流量拐过来之后，这就是**路由劫持（route hijacking）**：恶意 AS 既可以做黑洞直接丢包制造断网（DoS），也可以只拦截不丢弃、把包再按正确路径转走，悄悄在途中偷看或篡改（变成广域网里的**在途攻击者**）。

            还有一种常见非恶意事故叫**路由泄露（Route Leak）**：小运营商从上游 ISP A 学到了全球路由，却手误又转头通告给了另一家平级/上游 ISP B，诱骗别人绕远经由自己的窄链路穿行，直接把自家网打瘫。
      - card:
          title: 例题：手算路由器转发表如何中了 BGP 子前缀劫持的圈套
          body: |
            假设全网正常情况是银行 `AS65001` 通告 `203.0.113.0/23`（涵盖 `.113.0.0` 到 `.113.1.255` 共 512 个 IP）。突然黑客 `AS65999` 广播一条 `203.0.113.0/24`（前 256 个 IP）。路由器收到一条报文，目的 IP 是 `203.0.113.55`，它为什么一定会绕去黑客那？
          reveal:
            - title: 第 1 步：逐条对比路由表里的网段匹配
              body: "`203.0.113.55` 前 23 位和 `203.0.113.0/23` 一致（命中），同时前 24 位也和 `203.0.113.0/24` 一致（也命中）。"
            - title: 第 2 步：按最长前缀匹配选下一跳
              body: 路由器根本不看谁在路径上更老实，甚至不管谁跳数更短——规则先按前缀掩码长度排序，`24 > 23`，于是直接选中黑客通告的 `/24` 下一跳！只有配合 RPKI ROA 的 `maxLength=/23` 校验，才能在收到假通告那一步就把它标成 `Invalid` 扔掉。
      - item:
          id: q-route-leak
          type: choice
          prompt: 某区域小运营商同时接入了两家大型骨干运营商甲和乙。有一天小运营商工程师配错了 BGP 导出策略，把从骨干甲学来的全球几万条路由原封不动又转发通告给了骨干乙。这种事故属于什么问题？
          options:
            - text: 路由泄露（Route Leak）：违背商业转发关系把别人的全局路由经自己转告，导致大批全球流量绕道涌进自己的窄带宽造成拥塞断网
              correct: true
            - text: 物理光缆颜色接反了
              why: 路由泄露是 BGP 商业策略边界配置错误，与光缆物理颜色无关
            - text: 小运营商借此免费把自己的 CPU 主频翻倍
              why: 转告别人全局路由只会让自家接入链路被过境流量瞬间挤瘫
          explain: 正常商业约定下，客户网只准向骨干上游通告“自己的网段”，不能把“一家骨干的路由”转告给“另一家骨干”。
      - card:
          title: BGP 防御：RPKI 源验证与 BGPsec 路径验证
          body: |
            如何堵住“谁都能随便声称拥有别人 IP 段”的洞（4.5 节）？业界正在推行三层防线：
            1. **前缀过滤列表**：上游只接受客户明确备案过的自有 IP 段，拦住明显假通告。
            2. **RPKI（资源公钥基础设施）**：地址分配机构给合法主人签发加密的 ROA 证书，写明“某前缀只准由 AS X 首次发起”；路由器验证签名不符（Invalid）就拒收。
            3. **BGPsec**：要求沿途每个转发通告的 AS 都用私钥签名，防止中间伪造缩短 `AS_PATH`。
      - item:
          id: q-rpki-limit
          type: choice
          prompt: 某上游路由器已经严格部署了 RPKI ROA 源验证（能确认“某个 IP 前缀确实是由合法拥有者 AS Originate 发起的”），但还没部署全路径签名 BGPsec。攻击者 AS65999 如果想绕过 RPKI 劫持银行 AS65001 的流量，还能怎么伪造？
          options:
            - text: 伪造一条终点写成合法 AS65001、但把自己的 AS65999 塞在倒数第二跳的虚假短路径通告，RPKI 只查源头就拦不住路径篡改
              correct: true
            - text: 只要把 IP 前缀写成一个负数，就能跳过 RPKI 检查
              why: RPKI 验证的是合法前缀与起源 AS 编号映射，语法非法的报文直接被丢弃
            - text: 部署 RPKI 后，全网所有数据包都会自动用 AES 加密
              why: RPKI 保护的是路由控制面的“前缀归属真实性”，不是用户数据包的传输加密
          explain: RPKI ROA 管得住“谁能首次宣称拥有该网段（源验证）”，但管不住中间人撒谎“我和那个合法 AS 是直连邻居（路径验证）”——后者正是 BGPsec 和 MANRS 规范要解决的问题。
      - item:
          id: q-bgp-match
          type: match
          prompt: 把下面三项路由安全机制与它们各自验证的核心问题连线。
          pairs:
            - [RPKI ROA 源验证, 验证通告该 IP 前缀的起源自治系统（AS）是否真正合法拥有它]
            - [BGPsec 路径验证, 沿途每个 AS 逐跳签名，防止中间节点凭空删改伪造 AS_PATH]
            - [商业关系过滤（防路由泄露）, 确保客户网不会把从一家上游学到的全局路由转卖通告给另一家上游]
          explain: 路由安全需要把“源头合法（RPKI）、路径没撒谎（BGPsec）、转告守规矩（商业过滤）”三件事分开守住。

  - id: tcp-injection-dos
    chapter: 协议攻击面
    title: 传输层攻击面：TCP 注入、SYN 洪泛与 DDoS
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一家公司把防火墙写得很紧，但服务器没启用加密。某离路攻击者猜到了你正在访问哪家新闻网站（知道对方 IP 和 80 端口），他只要瞎蒙对什么字段，就能凭空向你浏览器正在看的连接里塞进一段假消息，甚至强行发 RST 断开连接？
          options:
            - text: 猜对你的客户端源端口，以及正好落在当前接收窗口内的 32 位 TCP 序号（seq）
              correct: true
            - text: 只需要知道网站的域名，不需要任何端口号或 TCP 序号
              why: 传输层接收方会严格核对四元组（源/目的 IP 与端口）和 TCP 序号是否落在有效窗口内，不对的包直接丢弃
            - text: 必须先把物理网线拔下来才能往里发包
              why: 离路攻击者是在网络上向目标发送伪造了源 IP 的 IP 分组
          explain: 无加密的 TCP 连接唯一防“离路乱插包”的护盾，只是对方猜不猜得到端口号和当前 32 位序列号。
      - card:
          title: UDP vs TCP 安全权衡与报文注入（CS161 第 30 章）
          body: |
            从 C.3.2 我们对比过无连接的 UDP 与有连接的 TCP：UDP 没有握手、没有序号核对，极容易被离路攻击者伪造源 IP 冒充（这也埋下了后面 DNS 与放大攻击的隐患）。

            而 TCP 虽然有 32 位序号（共 $2^{32} \approx 42.9$ 亿个值），但如果操作系统老老实实每次都用可预测的固定规则选初始序号（ISN），或者对方连续狂发几万个包去撞 65,536 字节宽的接收窗口，一旦落进窗口就能注入假载荷或伪造 `RST` 强行拆线！所以现代系统强制要求**密码学随机化的 ISN**，并用 TLS 给载荷加密认证。
      - item:
          id: q-tcp-blind-prob
          type: number
          prompt: "假设某条未加密 TCP 连接的接收窗口大小恰好是 $2^{16} = 65{,}536$ 字节，而 32 位序列号共有 $2^{32}$ 个可能位置。如果已知四元组，离路攻击者随机乱蒙一个 `seq` 恰好落入接收窗口的概率是 $1 / N$，这里的整数 $N$ 是多少？"
          answer: 65536
          explain: "概率 = 窗口大小 / 序列号总空间 = 2^16 / 2^32 = 1 / 2^16 = 1 / 65536，所以 N = 65536。这也是为什么一旦泄露了近似序号或连续扫几万个包就可能盲注成功。"
      - item:
          id: q-tcp-rst
          type: choice
          prompt: 为什么现代操作系统的 TCP 协议栈在收到一个带 `RST`（强行复位断连）标志的包时，不仅要求四元组对得上，还必须严格验证 `seq` 序号落在当前接收窗口内，同时要求初始序号 ISN 密码学随机化？
          options:
            - text: 防止离路攻击者猜中初始序号后伪造一个极小的 `RST` 包，强行把别人正在传输的长连接（如 BGP 会话或大文件下载）一脚踢断
              correct: true
            - text: 因为如果初始序号从 0 开始，电脑在 0 号序号时会直接自动关机
              why: 从 0 或固定步长递增的问题是“容易被旁观者推算猜中”，导致容易遭受离路盲注与 RST 断连攻击
            - text: 随机化初始序号可以把 TCP 数据自动加密成 HTTPS
              why: 随机 ISN 只防离路盲猜序号，不能防看得到明文序号的在途窃听者
          explain: 历史上许多长期建立的 BGP 会话就是因为使用固定递增 ISN，被离路攻击者几十万个包扫出序号用 `RST` 踢断；密码学随机 ISN 把盲猜门槛拉回了完整 32 位空间。
      - card:
          title: 拒绝服务（DoS）与 SYN 洪泛（CS161 第 34 章）
          body: |
            **拒绝服务（DoS）**的核心不是“攻破密码偷数据”，而是“把你的有限资源占光，让正常用户进不来”。

            常见有两种打法：
            - **应用层 DoS**：发少量极耗 CPU/磁盘的请求（比如让服务器做复杂正则回溯或全表搜索）。
            - **SYN 洪泛（SYN Flood）**：正常 TCP 三次握手第一步收到 `SYN` 后，内核要分配一块内存记下这个“半开连接”等待对方第三次 `ACK`。攻击者伪造源 IP 狂发 `SYN` 却永远不回 `ACK`，瞬间把半开连接队列（Backlog）塞满，正常用户的 `SYN` 全被丢掉！
      - item:
          id: q-syn-backlog
          type: number
          prompt: 某服务器的 TCP 半开连接队列最多能同时挂着 1,024 条记录，一条半开记录默认等不到 ACK 要 60 秒才超时释放。攻击者每秒最少发送多少个伪造源 IP 的 SYN 包（取整），就能把这条队列持续占满？
          answer: 18
          explain: 队列每秒释放速率最大只有 1024 / 60 ≈ 17.07 条/秒；攻击者只要每秒发 18 个极小的 SYN 包就能让半开队列永远满载（正常用户彻底连不上）。
      - card:
          title: 例题：推导 SYN Cookie 如何不用半开队列完成握手
          body: |
            既然问题是“收到第一步 SYN 就先占内存”，怎么才能在真正收到第三步 ACK 前**一行内存都不存**，还能防住别人乱蒙 ACK 建假连接？一步步推导 **SYN Cookie** 的巧思：
            - 服务器手里有一把只有自己知道的定期轮换密钥 $K$。
          reveal:
            - title: 第 1 步：把“我确实给你回过 SYN-ACK”算进 32 位序号里
              body: 收到客户端 `SYN`（携带客户初始序号 `c_seq`）后，服务器不记半开表，而是算一个密钥哈希标签：$t = \text{Hash}(K, \text{srcIP}, \text{srcPort}, \text{dstIP}, \text{dstPort}, \text{时间片})$，加上 MSS 编码放进自己的 32 位初始序号 `s_seq` 里发回 `SYN-ACK`。
            - title: 第 2 步：收到第三步 ACK 时现场验票再分配内存
              body: 若是伪造源 IP 的洪泛攻击，根本收不到真客户端的回信，服务器零内存损失！若真客户端回复 `ACK`（确认号必为 `s_seq + 1`），服务器用包里的四元组与同一密钥 $K$ 重新算一遍哈希并减去 1 比对——核对一致才真正分配完整的连接状态表进入 `ESTABLISHED`！
      - card:
          title: 分布式拒绝服务（DDoS）与反射放大
          body: |
            单台肉鸡带宽有限，**DDoS（分布式拒绝服务）**同时指挥成千上万台被控设备一起打向目标，甚至借助**反射放大攻击**：

            由于 UDP 没有三次握手、不核实源 IP，攻击者把自己的源 IP 伪造成**受害者的 IP**，向互联网上开放的公共 DNS、NTP 或 Memcached 服务器发送几十字节的小查询；那些无辜服务器会把几千字节的大响应统统“反射”砸向受害者，流量瞬间放大几十倍！
      - item:
          id: q-ddos-reflection
          type: choice
          multi: true
          prompt: 在“UDP 反射放大 DDoS”攻击中，以下哪些因素共同促成了攻击流量能被放大几十倍砸向受害者？（多选）
          options:
            - text: 攻击者所在网络未做源 IP 校验，允许其把发出请求的源 IP 伪造成受害者地址
              correct: true
            - text: 反射服务器所用协议基于无连接的 UDP，不需要三次握手确认对方真能收到回包
              correct: true
            - text: 小请求报文能触发比自身体积大得多的大响应报文
              correct: true
            - text: 因为受害者服务器主动给攻击者发送了自己的私钥
              why: 反射放大利用的是协议报文长度不对称和 UDP 无源地址确认，与私钥无关
          explain: 堵住反射放大需要三端合力：接入网做 BCP 38 禁止伪造源 IP、公网服务关闭开放递归或限制 UDP 响应大小、受害者靠清洗中心吸收大流量。
      - card:
          title: 例题：拆解一次 UDP 反射放大 DDoS 的数据流与每步堵点
          body: |
            假设攻击者手里只有 100 Mbps 上行带宽，却想打瘫一条 5 Gbps 的游戏服务器。他是怎样借别人的手把流量放大 50 倍的，每一步又靠什么拦截？
          reveal:
            - title: 第 1 步：伪造源 IP 发出微小 UDP 询问
              body: 攻击者发送一条仅 60 字节的 UDP DNS 查询（请求全部解析记录），故意把源 IP 填成游戏服务器的 IP，发给互联网上成千上万台配置不当的开放 DNS 解析器。如果攻击者所在机房部署了 **BCP 38 入口源地址过滤**，这批包在出门第一步就会被丢弃。
            - title: 第 2 步：无辜反射器吐出巨型响应砸向受害者
              body: 没有做访问限制的开放 DNS 解析器以为真是游戏服务器来问的，毫不犹豫把 3,000 字节的巨型响应回发给游戏服务器——流量当场放大了 $3000 / 60 = 50$ 倍，100 Mbps 瞬间膨胀成 5 Gbps 堵死游戏服务器入口！治理之道是公网服务关闭开放递归并做速率限制，受害者侧则接入清洗中心在骨干网把畸形 UDP 流量先洗掉。

  - id: dns-poisoning
    chapter: 协议攻击面
    title: DNS 缓存投毒、Bailiwick 与 Kaminsky 攻击
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你的电脑向本地递归 DNS 服务器查询 `bank.com` 的 IP。本地服务器往外问权威服务器时，一个离路攻击者同时伪造了一份“权威服务器回包”，说 `bank.com` 的 IP 是黑客服务器。由于标准 DNS 用无连接的 UDP，只要黑客这份假回包抢在真回包之前到达且猜对了哪个编号，递归服务器就会信以为真并缓存好久？
          options:
            - text: 报文头里只有 16 位的查询事务 ID（Transaction ID）以及当时发请求的本地 UDP 源端口
              correct: true
            - text: DNS 报文自带 2048 位银行数字签名，离路攻击者绝不可能伪造
              why: 传统明文 DNS 没有任何密码学签名（后来的 DNSSEC 才加上签名）
            - text: 只要攻击者把字体改成红色就能让递归服务器信任
              why: DNS 报文是二进制协议格式，解析器核对的是查询域名、16 位事务 ID 和目的端口
          explain: 传统 DNS 建立在“谁先带着正确查询编号把 UDP 包送回我这个端口，我就信谁”的基础上，这就给**伪造域名缓存**开了后门。
      - card:
          title: DNS 报文格式与缓存投毒竞速（CS161 第 32 章）
          body: |
            从 C.3.2 已知，递归解析器替用户向权威服务器发一次 UDP 查询时，报头只带了一个 **16 位事务 ID（共 65,536 种可能）**。

            如果是**在途攻击者**，直接看一眼发出去的包就知道 ID 和端口，100% 精准抢答假 IP，这就是**DNS 缓存投毒（DNS cache poisoning）**：一旦解析器把假记录写进缓存，接下来在 TTL 过期前成千上万查 `bank.com` 的用户全会被引到假网站！而离路攻击者就得跟真权威服务器“抢答并盲猜”那 16 位 ID。
      - card:
          title: 归属域检查（Bailiwick Checking）
          body: |
            早期解析器还犯过一个更低级的错：你明明问的是 `attacker.com` 的 IP，攻击者自家的权威服务器在回包顺便附带一条额外记录（Additional section）说“顺便告诉你，`bank.com` 的 IP 是 `6.6.6.6`”，解析器竟然顺手全收进缓存了！

            为此引入了 **Bailiwick（归属域）检查**：一条权威应答里携带的所有资源记录，域名必须属于本次查询所问权威服务器管辖的子域之内；跨域“顺带夹带私货”一律丢弃。
      - item:
          id: q-bailiwick
          type: choice
          prompt: 你操控了一台合法属于 `evil.example` 的权威服务器。当某递归解析器老实来向你查询 `www.evil.example` 时，你在回包里诚实回答了 `www.evil.example` 的 IP，但故意在额外记录里塞了一条 `login.goodbank.com -> 1.2.3.4`。开启了 Bailiwick 检查的现代递归解析器会怎么处理？
          options:
            - text: 识别出 `login.goodbank.com` 不在 `evil.example` 的管辖域内，丢弃这条越权记录不写进缓存
              correct: true
            - text: 因为你是合法的 `evil.example` 权威，所以顺便改写所有银行的域名也完全合法
              why: 权威服务器只能为自己所辖的域名子树背书，无权越权替不相干的域名做声明
            - text: 自动把 `evil.example` 和 `goodbank.com` 合并成一个域名
              why: 域名树按层级严格分权管理
          explain: Bailiwick 规则把权威应答的影响半径死死锁在它自己合法管辖的子域范围内，堵死了“问 A 顺便毒害 B”的旁路。
      - card:
          title: 例题：为什么 Kaminsky 攻击能绕过长 TTL 限制
          body: |
            原本有人觉得离路投毒没那么可怕：如果真 `bank.com` 已经在缓存里且 TTL 还剩 24 小时，解析器根本不会往外发新查询，攻击者连猜事务 ID 的机会都没有！2008 年 Dan Kaminsky 发现了绝妙绕法：
          reveal:
            - title: 第 1 步：每次故意查一个不存在的随机子域
              body: 攻击者不断向递归解析器发起 `001.bank.com`、`002.bank.com`、`003.bank.com` 的查询。缓存里绝对没有这些随机子域，于是解析器每次都被迫真的向 `bank.com` 上级去发 UDP 查询！
            - title: 第 2 步：利用同一归属域下的 NS 记录夹带完成永久篡改
              body: 每次发查询，攻击者就趁机狂发几十上百个伪造的权威回包，里面填上“想查任何 `*.bank.com`，请去问我指定的假权威服务器 `ns.evil.com`（同一 `bank.com` 域管辖范围，合法通过 Bailiwick！）”。由于 16 位事务 ID 只有 65,536 个，每秒发上万个包几秒就能撞中一次——整个 `bank.com` 域从此落入黑客手里！
      - item:
          id: q-dns-port-rand
          type: choice
          prompt: Kaminsky 攻击曝光后，为什么所有现代 DNS 递归解析器立刻紧急打上了“UDP 源端口随机化”补丁（有的还加了 `0x20` 域名大小写随机混写）？
          options:
            - text: 在 16 位事务 ID 之外再增加约 16 位的随机源端口（总空间从 65,536 暴增到约 40 多亿），让离路盲猜竞速几乎不可能撞中
              correct: true
            - text: 源端口随机化可以把整个 DNS 报文变成不可破解的 AES 密文
              why: 报文依然是明文（在途攻击者照样能看见端口和 ID），随机化只是防住了看不见包头的离路盲猜
            - text: 换用随机源端口后，域名查询就不再需要事务 ID 了
              why: 事务 ID 仍然保留，两者是乘数关系共同扩大猜测空间
          explain: 16 位事务 ID（65,536）× 约 64,000 个可用 UDP 源端口 ≈ 41.9 亿种组合；再叠加上字母大小写随机（如 10 个字母的 `example.com` 再乘 1024 倍），离路盲猜成本瞬间飙升几个数量级。
      - item:
          id: q-dns-entropy
          type: number
          prompt: "如果递归解析器不仅随机化 16 位事务 ID 和 64,000 个可用 UDP 源端口，还开启了 `0x20` 编码（把查询域名里每个英文字母随机写成大写或小写，且要求权威回包原样照抄）。对于恰好有 10 个英文字母的 `example.com`，仅 `0x20` 这一项额外把猜测空间扩大了多少倍？（填整数）"
          answer: 1024
          explain: 每个字母有大写/小写 2 种可能，10 个英文字母共有 2^10 = 1024 种大小写组合，猜测难度再乘 1,024 倍。
      - item:
          id: q-kaminsky-why
          type: choice
          prompt: 在经典的 Kaminsky 攻击里，目标域名 `bank.com` 明明已经在递归解析器缓存里躺着（TTL 还有 20 小时），攻击者为什么不去反复查询 `bank.com`，而是故意不断查询 `x19a.bank.com`、`x20b.bank.com` 这种根本不存在的随机子域？
          options:
            - text: 缓存里没有这些随机子域，能强迫解析器立刻向上级权威发真实查询开启竞速窗口；同时伪造回包里顺带塞进同属于 `bank.com` 的假 NS 权威记录就能接管整个主域
              correct: true
            - text: 因为随机子域查询在网络上走的是不需要 IP 的特殊无线电通道
              why: 它走的依然是标准 UDP 53 端口 DNS 报文，目的是绕过主域名未过期的缓存命中限制
            - text: 因为 `bank.com` 主域名不允许使用 16 位事务 ID
              why: 任何标准 DNS 查询都带 16 位事务 ID，只是已有缓存命中时解析器根本不会往外发查询
          explain: Kaminsky 的绝招就是“查没缓存的随机子域逼出查询动作 + 借同一归属域下的 NS 授权记录顺带把整个 `bank.com` 域名树拐走”。

  - id: dnssec-trust
    chapter: 协议攻击面
    title: DNSSEC：用数字签名链锁住域名解析
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 上一课的源端口随机化虽然拦住了看不见报文的离路攻击者，但如果攻击者是咖啡店或运营商网络里的“在途攻击者”，他一眼就能看见你发出去的随机端口和事务 ID。要彻底防住连在途攻击者也伪造不了假 DNS 记录，根本出路是什么？
          options:
            - text: 让权威域名服务器用自己的私钥给 DNS 记录做数字签名，解析器用公开的信任链公钥验签
              correct: true
            - text: 把事务 ID 从 16 位加长到 128 位但继续明文不签名
              why: 在途攻击者直接看到你发出的明文包，无论 ID 多长都能直接抄下来抢答假 IP
            - text: 让所有用户自己背下全世界几亿个网站的 IP 地址
              why: 人类不可能记住动态变化的海量 IP，域名解析系统本身必须提供可验证真实性
          explain: 随机化防的是“盲猜”，防“偷看后照抄抢答”必须靠密码学签名验证来源真实性——这就是 **DNSSEC**。
      - card:
          title: DNSSEC 的直觉与新记录类型（CS161 第 33 章）
          body: |
            如果每条域名记录都能用域名所有者的私钥签上名，哪怕在途攻击者把回包改成假 IP，由于他没有私钥，造不出有效签名，解析器一验就穿帮！

            为此 **DNSSEC** 新增了几种核心记录类型（8.4 节）：
            - **RRSIG**：附在常规记录（如 A/AAAA 记录集合 RRset）旁边的数字签名。
            - **DNSKEY**：本域名区用来验签的公钥本身。
            - **DS（Delegation Signer）**：放在**上一级父域**里、指向子域公钥的哈希指纹——这就是把信任从上往下传递的锁链！
      - card:
          title: 为什么还要分两把钥匙：KSK 与 ZSK
          body: |
            每个域名区通常把公钥拆成两把分工合作（8.5 节）：
            - **ZSK（Zone Signing Key，区签名密钥）**：专门负责给该域名下的日常记录（如 `www`、`mail` 的 A 记录）签名，需要经常轮换，更换时只需改本域内的 `DNSKEY`，不用惊动父域！
            - **KSK（Key Signing Key，密钥签名密钥）**：只用来签发本域的 `DNSKEY` 列表，并把自己的哈希做成 `DS` 记录交到上一级父域保存；更换更少，减少跨层改父域注册的麻烦。
      - item:
          id: q-dnssec-records
          type: match
          prompt: 把 DNSSEC 中四个核心名词与它们的各自职责连线。
          pairs:
            - [RRSIG, 附在域名资源记录集旁边的数字签名，用于证明该记录未遭篡改]
            - [ZSK（区签名密钥）, 负责签发本域内日常主机记录（如 A/AAAA）的工作密钥，便于定期轮换]
            - [KSK（密钥签名密钥）, 负责签发本域的公钥集合，其哈希作为 DS 记录上传到父域]
            - [DS 记录, 存储在父域中的子域 KSK 公钥指纹，把信任链从父域委托给子域]
          explain: 记住信任传递的方向：父域存着子域的 DS 指纹 → 确认子域 KSK 可信 → KSK 签过本域 DNSKEY 列表（含 ZSK）→ ZSK 签过具体网站的 IP 记录。
      - card:
          title: 例题：从根区一路验签查出 `berkeley.edu`
          body: |
            假设本地 DNSSEC 解析器手里只事先内置了一把“全球根区（`.`）的信任锚公钥”。当你要查 `www.berkeley.edu` 的 IP 时，它是怎样把陌生网站一步步变成可信的？
          reveal:
            - title: 第 1 步：从根区验证 `.edu` 顶级域
              body: 根区返回 `.edu` 的 `DS` 记录及根区私钥签出的 `RRSIG`。解析器用内置根公钥验签通过后，就确信拿到的 `.edu` 公钥指纹是真的；接着向 `.edu` 要 `DNSKEY`，比对哈希匹配刚才的 `DS`，`.edu` 的公钥从此可信！
            - title: 第 2 步：如法炮制顺着链条往下验到具体主机记录
              body: 拿着可信的 `.edu` 公钥去验证 `.edu` 给出的 `berkeley.edu` 的 `DS` 记录，再拿该 `DS` 核对 `berkeley.edu` 自己的 `KSK`、`ZSK`，最后用 `ZSK` 验证 `www.berkeley.edu` 的 `A` 记录上的 `RRSIG`。整条链条环环相扣，在途攻击者改掉任何一环都会验签失败！
      - card:
          title: 怎么证明“某个域名真的不存在”：NSEC 与 NSEC3
          body: |
            还有一个刁钻问题（8.7 节）：如果一个用户查 `nosuch.bank.com`，真实权威回复“不存在（NXDOMAIN）”。总不能为全世界不存在的无穷多个随机名字提前签名吧？

            如果在途攻击者想伪造“该域名不存在”来制造拒绝服务怎么办？DNSSEC 的办法是把本域所有存在的名字按字典序排成一个闭环，再用 **NSEC** 记录签名声明“在 `alpha.bank.com` 和 `pay.bank.com` 之间没有任何其他名字”！而为了防止攻击者顺藤摸瓜把所有域名全枚举偷走（区枚举），改用先做加密哈希再签名的 **NSEC3** 记录。
      - item:
          id: q-nsec3
          type: choice
          prompt: 同样是为了给“某个查询的域名确实不存在（NXDOMAIN）”提供可验证的数字签名证明，为什么很多安全管理员更愿意配置 **NSEC3** 而不是原始 **NSEC**？
          options:
            - text: NSEC 会把区域内所有真实存在的相邻域名明文排成一圈，任何人都能顺着链条把全站所有子域名挨个枚举出来；NSEC3 先对域名做加盐哈希再链接，防区枚举
              correct: true
            - text: 因为 NSEC 不支持数字签名，只有 NSEC3 带有签名
              why: NSEC 同样带有 RRSIG 数字签名，差别在于里面放的是明文相邻域名还是哈希值
            - text: 因为 NSEC3 可以顺便把整个网页的 HTML 内容一起加密传输
              why: DNSSEC 只做域名记录的来源认证与防篡改，不加密 DNS 查询隐私（后者靠 DoH/DoT），也不传输网页 HTML
          explain: NSEC3 既让解析器能拿着签名核验“两个哈希区间之间确实空无一物（证明不存在）”，又不会直接把所有内部子域名名字明文拱手让人。
      - item:
          id: q-dnssec-no-encrypt
          type: choice
          prompt: 某公司给自己的域名全线开启了 DNSSEC。以下哪项安全保护是 DNSSEC **能提供**的，哪项**不能提供**？
          options:
            - text: 能保证客户端收到的域名 IP 解析结果真实未遭篡改；但不能把查询的域名内容本身加密（想隐藏查询隐私需用 DoT/DoH）
              correct: true
            - text: 只要开了 DNSSEC，之后连网页本身用 HTTP 明文传输也会自动变成 HTTPS 加密
              why: DNSSEC 只保护域名解析记录不被篡改，网站连接本身仍需要配置 TLS/HTTPS
            - text: 开了 DNSSEC 后，服务器再也不用怕 SYN 洪泛攻击了
              why: DNSSEC 是应用层域名解析安全扩展，解决不了传输层的半开队列耗尽问题
          explain: 牢记 DNSSEC 提供的是**完整性与真实性（防篡改、防投毒）**，而不是**机密性（隐私加密）**。
      - item:
          id: q-dnssec-zsk-ksk
          type: choice
          prompt: 既然一个域只需要一把私钥也能签名，DNSSEC 为什么还要大费周章把公钥拆成 **ZSK**（签本域 A/AAAA 记录）和 **KSK**（只签本域公钥列表，哈希交父域存 DS）两把？
          options:
            - text: ZSK 可以高频轮换而无需每次去父域改 DS 记录，KSK 长期稳定留在父域 DS 里负责给每次轮换的新 ZSK 背书
              correct: true
            - text: 因为电脑每次只能同时保存一把 ZSK，多出来的密钥必须存到打印机里
              why: 同一域名区的 DNSKEY 响应里可以同时包含 KSK 和 ZSK 两把公钥
            - text: 因为 KSK 负责传输网页图片，ZSK 负责传输网页文字
              why: DNSSEC 只签发域名解析记录，不负责传输网页正文图片与文字
          explain: 跨父域更新 DS 记录需要与上级域注册商协调且受缓存 TTL 制约；把日常频繁轮换的 ZSK 和锚定父域信任的 KSK 拆开，既安全又省事。

  # ======================================================================== 分段
  - id: network-segmentation
    chapter: 分段
    title: 子网、NAT、DMZ 与网络分段
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一家公司把前台访客 Wi-Fi、对外公开的官网 Web 服务器、以及存放全公司财务工资单的内网数据库全部插在同一张扁平无边界的大局域网里。某天官网 Web 程序被黑客发现了一个漏洞攻破。接下来最容易发生什么？
          options:
            - text: 黑客以官网服务器为跳板在局域网内自由扫描、发起 ARP 欺骗甚至直接连上财务数据库继续扩大战果（横向移动）
              correct: true
            - text: 官网被攻破后会自动触发财务数据库关机并报警
              why: 在没有任何分段边界和隔离策略的扁平网络里，内网机器互相畅通无阻
            - text: 只要在办公室内网就不可能发生黑客横向扫描
              why: 恰恰相反，黑客一旦落脚内网某个薄弱点，第一件事就是横向探测同网段高价值目标
          explain: 这就像轮船底舱如果不做防水隔舱，一个角落磕个洞就会灌满整艘船——网络安全用**分区域隔离**造防水隔舱。
      - card:
          title: 什么是网络分段（Network Segmentation）
          body: |
            **网络分段（network segmentation）**是用子网划分、VLAN 标签、路由边界和访问控制，把原本连成一片的平坦网络切分成多个各自独立的安全区域（如访客区、办公区、生产业务区、核心数据区）。

            这样即便访客电脑中了木马或者对外 Web 服务被攻破，攻击者也被挡在所属区域的边界之内，无法直接扫描或直连其他更敏感的区域，大大压缩横向移动的空间。
      - card:
          title: NAT 的隔离副产品与隔离区（DMZ）
          body: |
            从 C.3.2 学过 **NAT（网络地址转换）**与子网。虽然 NAT 最初是为了省公网 IP，但它顺便带来一道边界效果：外部互联网主机很难主动向 NAT 后面的内网私有 IP 发起直接连接（大纲 3.3）。

            而对外提供公开服务（例如公司官网和 API 网关）又必须让外网能连进来，绝不能直接放进核心内网。于是划出**DMZ（隔离区 / 非军事区）**：夹在外网与核心内网之间的缓冲地带。即使 DMZ 里的 Web 服务器沦陷，它也没有通向办公内网或全量敏感接口的任意访问权，最多只允许通过指定端口访问特定业务库。
      - item:
          id: q-dmz-purpose
          type: choice
          prompt: 某医院对外公开挂号网站必须让外网病人浏览器访问（443 端口），同时它又要向内部挂号数据库读写数据。架构师专门把这台对外 Web 服务器放进了 **DMZ（隔离区）**，而不是放进医院核心内网。这样设计的核心目的什么？
          options:
            - text: 一旦对外暴露的 Web 服务器被外部黑客攻破，攻击者被困在半受信任的 DMZ 隔离区内，无法直接触达医院办公网或核心内网其他系统
              correct: true
            - text: 因为放进 DMZ 后 Web 服务器就不再需要修补代码漏洞了
              why: 暴露在公网的 Web 服务器仍然要及时修漏洞，DMZ 属于纵深防御的第二道隔离墙
            - text: 因为 DMZ 里的服务器只允许收发 UDP 数据包，不能用 TCP
              why: 对外 HTTPS 网站使用的正是 TCP 443 端口
          explain: 纵深防御永远假设“面向公网的那台机器迟早可能被攻破”；DMZ 的价值在于控制它沦陷后的爆炸半径。
      - card:
          title: 分段的三层落地工具
          body: |
            按网络层次，分段通常用三种手段配合完成：
            - **二层（VLAN）**：把同一台物理交换机的不同端口划成互不互通的广播域，隔离 ARP 欺骗与二层嗅探。
            - **三层（IP 子网 + 路由 ACL）**：按部门/风险级别划出独立 CIDR 网段，所有跨网段流量强制经过防火墙检查。
            - **安全域分层**：把外网（不可信）、DMZ（半受信任）、内网核心区（高信任）严格区分，禁止高风险区向核心区任意主动建连。
      - item:
          id: q-seg-tools
          type: match
          prompt: 把下面四种分段需求与最直接落实它的技术手段配对。
          pairs:
            - [防止咖啡厅访客 Wi-Fi 与公司办公网在二层互相广播与发起 ARP 欺骗, 划入独立 VLAN 隔离广播域]
            - [把对外公开的网页服务器与后台办公主机隔开，减小公网机器沦陷后的爆炸半径, 放入 DMZ 隔离区网段]
            - [给研发环境、财务数据库和对外服务分配不同的 CIDR 网段以便集中过墙检查, 按安全域划分独立 IP 子网]
            - [避免内网主机随意直接把私有地址暴露给公网主动连接, 在出口网关启用 NAT 地址转换]
          explain: VLAN 隔二层广播域，子网+路由划三层边界，DMZ 隔对外服务，NAT 藏内网私网地址，共同构成层次化的分段防御。
      - card:
          title: 例题：当 DMZ Web 服务器真的被攻破后，分段挡住了什么
          body: |
            假设某医院外网挂号平台（位于 DMZ 网段 `172.16.10.0/24`）存在一个文件上传漏洞被黑客攻破拿到了系统权限。如果同时做好了二层 VLAN、三层子网与边界规则分段，黑客接下来每步会撞上哪堵墙？
          reveal:
            - title: 第 1 步：二层广播域与办公区切断
              body: 因为挂号网站和医生办公电脑处于不同的 **VLAN 与 IP 子网**，黑客在 DMZ 服务器里朝外发送 ARP 欺骗或局域网扫描，根本触碰不到办公内网主机。
            - title: 第 2 步：核心数据库仅开放极窄的指定端口
              body: 边界规则只允许 DMZ 访问内网挂号库特定端口（如 `5432`），且禁止 DMZ 主动连接财务区或管理员 SSH 端口 `22`，黑客即便想横向挪去别的核心库也会被防火墙直接丢弃。
      - item:
          id: q-seg-lateral
          type: choice
          prompt: 一家企业虽然部署了号称很强的外网出口边界防火墙，但内部所有办公电脑、打印机、财务库和测试服务器全在同一个 `10.0.0.0/16` 平面网段里直连互通。一个员工不小心点开了钓鱼邮件里的木马附件，为什么这依然会演变成全公司灾难？
          options:
            - text: 出口防火墙只看“进出外网”的边界，管不到同网段交换机内部的横向流量；缺少内部分段让木马能直接在内网横扫所有机器
              correct: true
            - text: 因为 `10.0.0.0/16` 是公网地址，全世界任何人都能直接连进来
              why: "`10.0.0.0/8` 属于 RFC 1918 私有地址，问题不在公网直连，而在内部缺乏东西向隔离分段"
            - text: 因为防火墙只能拦截图片，拦截不了电子邮件
              why: 问题的本质是假设“城堡内部全是好人”而忽视了内网横向移动
          explain: 传统“外硬内软”的鸡蛋壳结构一旦外壳被钓鱼绕过，内部扁平网络就会一马平川；分段正是为了把里面也建成一间间带门锁的隔间。
      - item:
          id: q-vlan-vs-subnet
          type: choice
          prompt: 公司前台访客 Wi-Fi 和财务核心主机被接到了同一栋楼的同一台物理交换机上。为了防止访客用手机发伪造 ARP 欺骗报文偷看财务主机二层流量，最基础的一步分段该做什么？
          options:
            - text: 在交换机上把访客端口和财务端口划分进不同的 VLAN（并配不同 IP 子网），把二层广播域彻底切开
              correct: true
            - text: 只要给访客电脑换一根不同颜色的网线就行
              why: 同一交换机上不同颜色的网线仍处在同一个二层广播域里，广播帧照样互达
            - text: 把财务电脑的屏幕亮度调低一些
              why: 物理屏幕亮度不影响局域网交换机帧转发
          explain: VLAN 在二层就切开了广播域，让访客发的 ARP 广播和二层帧根本到不了财务网口，再配合三层子网与防火墙控制跨网互访。

  - id: zero-trust
    chapter: 分段
    title: 零信任架构与微隔离
    minutes: 11
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 随着远程办公、笔记本电脑带回家和系统上云越来越普遍，员工可能从家里 Wi-Fi 访问公司核心系统，而公司内网里也可能混入一台已经被黑客控制的智能打印机。在这种环境下，单纯依靠“只要流量来自公司内网 IP 就无条件信任放行”还靠得住吗？
          options:
            - text: 靠不住，一旦有一台内网设备失陷或员工从外网接入，只看 IP 网段的边界信任就会彻底失效
              correct: true
            - text: 靠得住，只要把内网网关密码改复杂，打印机就不会被攻破
              why: 物联网设备或被钓鱼的终端一旦在墙内失陷，依然拥有内网 IP
            - text: 只要禁止所有人远程办公就能永远保证内网零入侵
              why: U盘、钓鱼邮件和供应链漏洞同样会让威胁出现在物理办公室内网里
          explain: 现代网络边界已经模糊，把“在不在内网”当成信任通行证已经过时——这就是**零信任**诞生的背景。
      - card:
          title: 零信任的核心原则：永不信任，始终验证
          body: |
            **零信任（Zero Trust）**架构（NIST SP 800-207）彻底抛弃“内网天然可信、外网天然不可信”的默认假设，立下三条铁律：
            1. **每次访问必验证**：不管请求来自公司内网还是公网咖啡厅，每次访问资源都必须核验**用户身份（如多因素认证）**与**设备健康状态**。
            2. **最小权限（Least Privilege）**：只授予完成当前任务恰好够用的最小权限，并且是临时、细粒度的。
            3. **假设已被攻破（Assume Breach）**：缩小信任面到单个应用或工作负载级别（**微隔离**），同时持续记录并监控每一次请求。
      - item:
          id: q-zt-core
          type: choice
          prompt: 下面哪一项工作流最准确地体现了“零信任架构”的思想？
          options:
            - text: 即使财务小王已经坐在公司内网工位上，每次访问薪资库仍需通过强身份认证与终端安全健康检查，且只被临时授权读取其负责部门的表单，所有操作实时记录告警审计
              correct: true
            - text: 只要连上公司 VPN 拿到一个 `10.x` 内网 IP，就可以免密访问内网所有测试、研发和财务服务器
              why: 这是典型的传统“一次进门全网免检”的边界信任模型，正好与零信任相反
            - text: 因为不信任任何人，所以直接拔掉所有员工的网线停止办公
              why: 零信任不是拒绝一切访问，而是把信任建立在每次动态验证的强证据之上，而非静态网络位置
          explain: 零信任的关键转变是把判定依据从“你在哪个网段（IP）”升级为“你是谁、你的设备现在安全吗、你此刻需要最小哪份权限”。
      - card:
          title: 例题：把传统边界架构改造成微隔离 + 零信任
          body: |
            假设一家公司原来只有一道外网边界防火墙，所有员工电脑连进办公网就能直连后台管理页面和全部 20 个数据库。按零信任改造怎么落地？
          reveal:
            - title: 第 1 步：把大内网拆成最小“微隔离”信任单元
              body: 不再按大部门通连，而是做到“订单服务只准连订单库、财务端只准访问财务应用入口”，用主机防火墙或服务网格强制验证双向身份证书（mTLS），堵住同网段盲目扫描。
            - title: 第 2 步：接入控制迁到身份与设备状态感知代理
              body: 后台管理页不再直接暴露给整个内网 IP 段，而是收归到身份感知访问代理后面：只有员工账号通过二次验证、电脑安装了最新系统补丁且开启磁盘加密，才能拿到短时效会话凭证，后台持续监控异常访问行为。
      - item:
          id: q-zt-microseg
          type: choice
          multi: true
          prompt: 与传统的“外墙防外人、墙内全互信”相比，零信任与微隔离能显著带来哪些收益？（多选）
          options:
            - text: 即使某台内网设备或账号已被攻破，攻击者也难以横向移动接触到其他业务系统
              correct: true
            - text: 无论员工在办公室还是居家远程办公，采用统一且一致的身份与设备校验策略
              correct: true
            - text: 每次细粒度访问都带有明确身份上下文，方便事后日志追踪与异常检测
              correct: true
            - text: 可以让程序员永远不用修补任何 SQL 注入或逻辑漏洞
              why: 应用层自身漏洞仍需修复；零信任限制的是凭证滥用与横向扩散面
          explain: 零信任把“大城堡”拆成无数个带门禁的小房间，从位置信任转向身份与设备状态动态信任。
      - item:
          id: q-zt-verify-always
          type: choice
          prompt: 某员工上午 9 点在公司用自己合规笔记本登录了内网系统；上午 10 点该员工的笔记本因为刚安装了一个来历不明的插件，安全健康检测变为“高风险/未达标”。按照零信任原则，系统此时应当怎么处理他接下来对核心财务数据的请求？
          options:
            - text: 持续评估并立即拒绝或降级其访问请求，要求先修复终端风险或重新通过强校验，而不是因为上午 9 点验证过就一整天放行
              correct: true
            - text: 既然上午 9 点已经拿到了内网 IP，就等到下个月再重新检查一次
              why: 零信任强调“持续监控与每次访问校验”，设备状态恶化后不能继续沿用旧的信任授权
            - text: 直接把该员工所有工作邮件全部自动删除
              why: 正确动作是按策略阻断或收紧敏感资源访问并告警运维核查，而不是销毁无关邮件数据
          explain: 零信任不只在“登录那一刻”检查，而是强调每次访问、最小权限与持续监测设备与身份状态。

  # ======================================================================== 防火墙
  - id: stateless-stateful-fw
    chapter: 防火墙
    title: 无状态包过滤 vs 有状态防火墙
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 早期的简单路由器规则表想放行“内网用户访问外网网页（目的端口 80）”，但它只认单个包本身而不记历史连接。为了让外网网页的回包能进内网，管理员不得不加了一条规则：“凡是**源端口是 80** 的外网包都放行进来”。黑客发现这个漏洞后，会怎么直接穿透进内网任意机器？
          options:
            - text: 黑客发一个根本不是回包的全新主动攻击包，只要故意把自己的**源端口**写成 `80` 就能大摇大摆穿进内网任意主机
              correct: true
            - text: 黑客必须先给管理员寄一封挂号信才能穿过规则
              why: 路由器按包头里的数字机械匹配，只要攻击者把发包的源端口设成 80 就符合规则了
            - text: 黑客没办法自己决定发送数据包时填什么源端口
              why: 拥有管理员权限或原始套接字的程序可以自由填写任何源端口
          explain: "**无状态包过滤**最大的死穴是分不清“这是内网先问外网后回来的应答包”，还是“外网恶客假装成回包的偷袭包”。"
      - card:
          title: 策略与五元组：无状态包过滤的局限（CS161 第 35 章）
          body: |
            防火墙的核心是先定好**安全策略（Security Policy）**——哪些网段允许谁去连谁——再靠技术手段强制执行（10.2–10.3 节）。

            最简单的**无状态包过滤**逐个孤立检查每个包的五元组（源 IP、目的 IP、协议、源端口、目的端口）与 TCP 标志位。哪怕加上“只放行带 `ACK` 标志位的外网包”也没用，因为攻击者随手就能自己捏造一个带 `ACK` 位且源端口是 80 的扫描包直接穿透扫描内网！
      - card:
          title: 有状态防火墙（Stateful Packet Filter）如何破局
          body: |
            为了分清谁先开的口，现代边界标配**有状态防火墙（stateful firewall）**：它在内存里维护一张**活跃连接追踪表**。

            1. 当内网主机 `10.0.1.5:51234` 主动向公网 `93.184.216.34:443` 发出第一个 `SYN`（且规则允许内网访问外网 443）时，防火墙放行并在状态表登记一条 `ESTABLISHED/跟踪中` 记录；
            2. 稍后外网发回严格匹配反向五元组（且序号合理）的回包时，防火墙查状态表命中后**自动放行**；
            3. 如果外网黑客凭空发来伪造源端口 443、源端口 80 或带 `ACK` 的探测包，状态表里查无此主动建连记录，立刻当场丢弃！
      - item:
          id: q-stateful-why
          type: choice
          prompt: 一台配置为“只允许内网主动访问外网 TCP 443、拒绝一切外网主动发起连入”的**有状态防火墙**，在收到外网 `198.51.100.10:443` 发往内网 `10.0.1.20:54321` 的 TCP 数据包时，怎么决定丢弃还是放行？
          options:
            - text: 先查连接状态表里是否存在一条对应方向（`10.0.1.20:54321 -> 198.51.100.10:443`）由内网先发起的活跃连接记录，有才放行，否则丢弃
              correct: true
            - text: 只要看到对方源端口是 443 就无条件放行，不用查任何连接状态
              why: 那正是无状态过滤的老漏洞，黑客把源端口改成 443 就能随便打穿进来
            - text: 把内网 `10.0.1.20` 发出的所有出站包也一起丢掉，免得有回包
              why: 放行合法出站并仅放行匹配其状态的回包，才是有状态防火墙的设计目的
          explain: 状态表把“谁主动建立的连接”记了下来：没有内网先发出去的出站记录，外网任何“假回包”全都进不来。
      - card:
          title: 例题：有状态防火墙怎么一步步识破“伪造 ACK 扫描”
          body: |
            假设防火墙策略只允许“内网主动访问外网 443 端口”，禁止任何外网主动连入。此时同时到达两个外网数据包：
            - 包甲：真网站 `93.184.216.34:443` 发给 `10.0.1.5:51234` 的回包（带 `ACK`）；
            - 包乙：黑客 `198.51.100.99:80` 发给 `10.0.1.5:22` 的探测包（也故意带 `ACK` 标志）。
          reveal:
            - title: 第 1 步：处理包甲（命中活跃连接追踪表）
              body: 几毫秒前 `10.0.1.5:51234` 刚往 `93.184.216.34:443` 发过 `SYN`，状态表里有这条 `ESTABLISHED` 记录。包甲的五元组刚好与该连接的反向路径严丝合缝，于是立刻放行！
            - title: 第 2 步：处理包乙（查表落空当场丢弃）
              body: 包乙虽然装模作样带着 `ACK` 标志还把源端口写成 `80`，但防火墙去连接追踪表里翻找 `10.0.1.5:22 -> 198.51.100.99:80` 的主动出站记录，结果根本不存在！包乙直接被拦截丢弃，黑客探测不到内网 22 端口开没开。
      - item:
          id: q-stateless-vs-stateful
          type: match
          prompt: 对比无状态包过滤与有状态防火墙对下面几种外网入站包的处理差异。
          pairs:
            - [内网浏览器访问外网网站后，网站发回的正常 HTML 响应包, 有状态防火墙查表匹配出站记录后自动放行]
            - [外网扫描器伪造源端口 80 且强行置上 ACK 标志位的探测包, 无状态规则常误放，有状态因状态表无记录直接拦截]
            - [每条连接都要占防火墙内存追踪，面临超大 SYN 洪泛时的隐患, 有状态防火墙若不配合防洪泛机制可能被撑爆状态表]
          explain: 有状态防火墙堵住了伪造回包的盲区，但也引入了“需要内存维护状态表”的新挑战（大流量下常需配合 SYN Proxy 或清洗）。
      - item:
          id: q-udp-stateful
          type: choice
          prompt: UDP 协议本身没有像 TCP 那样明确的 `SYN` 和 `FIN` 建连/拆线握手报文，那么有状态防火墙怎么处理内网向外部发出的 UDP DNS 查询（如去向 `8.8.8.8:53`）及其回包？
          options:
            - text: 内网发出 UDP 请求时在状态表临时记下一条带短暂超时时间（如几十秒）的五元组“伪状态”，收到匹配反向五元组的回包放行，超时后自动清除
              correct: true
            - text: UDP 因为没有 SYN 标志，所以有状态防火墙绝对无法放行任何 UDP 流量
              why: 现代有状态防火墙通过五元组加短超时机制照样能跟踪无连接 UDP 的请求-响应配对
            - text: 防火墙会先把 UDP 报文强行改写成 TCP 三次握手再发给 DNS 服务器
              why: 防火墙不能擅自把对方的 UDP 服务改成 TCP 协议
          explain: 哪怕底层是无连接的 UDP，防火墙也能靠“五元组 + 超时定时器”模拟出一份短寿命的会话状态，放行刚问出去的对应回包。

  - id: firewall-rules-tradeoffs
    chapter: 防火墙
    title: 防火墙规则设计、默认拒绝与局限
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 防火墙规则表通常按**从上到下第一条命中即停止（First-Match）**执行。某粗心管理员在规则表第 1 行写了一条 `拒绝 来自外网的所有流量`，又在第 2 行写了一条 `允许 外网访问 DMZ 网页的 443 端口`。结果外网用户能打开网页吗？
          options:
            - text: 打不开：流量刚扫到第 1 行就被全部拒绝并直接停止匹配，根本走不到第 2 行
              correct: true
            - text: 能打开：防火墙会自动扫描完整张表，挑最宽容的那一行生效
              why: 绝大多数包过滤防火墙采用首条匹配立即生效（First-Match），绝不会全表挑最宽容项
            - text: 防火墙遇到矛盾规则时会自动给用户弹窗询问
              why: 路由器与防火墙每秒转发成千上万数据包，只能机械按既定规则顺序执行
          explain: 规则**顺序**与规则本身一样致命！具体放行规则一定要写在宽泛的兜底拒绝规则之前。
      - card:
          title: 规则顺序与“默认拒绝”黄金原则（CS161 10.5 节）
          body: |
            编写安全防火墙策略有两条核心原则：
            1. **具体放行在前，宽泛兜底在后**：匹配自上而下找到第一条就立刻执行（ALLOW 或 DENY），不再往下看。
            2. **默认拒绝（Default Deny / 白名单）**：整张表的最后一行永远是 `允许外其余一律拒绝（ANY -> ANY: DENY）`！原因很简单：新系统、新服务或未知漏洞端口层出不穷，你永远列不完所有坏东西（黑名单总会漏），但你能明确列出“业务今天确实需要开放的几条路”。
      - card:
          title: 例题：写出内网 / DMZ / 外网三区有状态防火墙规则表
          body: |
            按原技能树综合练习题 (2) 的真实要求设计规则表：共有 `内网（Internal）`、`隔离区（DMZ）`、`外网（External）` 三个安全域。需求如下：
            - 内网员工可以访问外网 HTTP（80）与 HTTPS（443）；
            - 外网只能访问 DMZ 里 Web 服务器的 443 端口；
            - DMZ 的 Web 服务器可以访问内网数据库（TCP 5432）；
            - 其余所有未列出的主动发起访问一律拒绝。
          reveal:
            - title: 第 1 步：把明确的四条“允许”规则写在最前面
              body: |
                | 顺序 | 源区域 | 目的区域 | 协议/目的端口 | 动作 |
                |---|---|---|---|---|
                | 1 | 任意 | 任意 | 已建连状态回包（ESTABLISHED） | ALLOW |
                | 2 | 内网 | 外网 | TCP 80, 443 | ALLOW |
                | 3 | 外网 | DMZ | TCP 443 | ALLOW |
                | 4 | DMZ | 内网 | TCP 5432 | ALLOW |
            - title: 第 2 步：末尾加上“默认拒绝”兜底拦截所有意外路径
              body: |
                | 顺序 | 源区域 | 目的区域 | 协议/目的端口 | 动作 |
                |---|---|---|---|---|
                | 5 | 任意 | 任意 | 任意（ANY） | DENY |

                注意检查：外网能直接连内网吗？走不到第 2–4 行，直接落进第 5 行 DENY！外网能连 DMZ 的 SSH 22 端口或直接连 DMZ 上的 5432 吗？第 3 行只放了 443，所以也全部落入第 5 行 DENY！
      - item:
          id: q-fw-eval-trace
          type: choice
          prompt: 某三区（外网、DMZ、内网）有状态防火墙按顺序配置了 5 条规则：① 任意→任意 ESTABLISHED ALLOW；② 内网→外网 TCP 80/443 ALLOW；③ 外网→DMZ TCP 443 ALLOW；④ DMZ→内网 TCP 5432 ALLOW；⑤ 任意→任意 DENY。现在外网主机主动发起三条新连接尝试：① 外网 → DMZ TCP 443；② 外网 → DMZ TCP 22；③ 外网 → 内网 TCP 5432。哪几条会被放行？
          options:
            - text: 仅 ① 放行，② 和 ③ 均被第 5 行默认拒绝规则拦截
              correct: true
            - text: ① 和 ② 都会放行，因为只要目标是 DMZ 就全部互通
              why: 第 3 行明确限定目的端口只有 TCP 443，SSH 22 端口不匹配，落入第 5 行被拒
            - text: ③ 也会放行，因为第 4 行允许访问 TCP 5432
              why: 第 4 行只允许源区域为 `DMZ` 连向内网 5432，不允许 `外网` 直接连内网
          explain: 防火墙逐条核对源域、目的域、协议与目的端口四项全中才算匹配；只有同时满足才放行，否则一路掉进兜底 DENY。
      - item:
          id: q-default-deny
          type: choice
          prompt: 为什么安全工程几乎一致坚持采用“默认拒绝（只列出允许项，末尾拒绝其余全部）”，而反对“默认允许（只堵住已知危险端口，末尾放行其余全部）”？
          options:
            - text: 攻击与新开放的高危后台端口防不胜防，默认允许一旦新上线一个测试服务就会直接裸奔在公网；默认拒绝确保任何未显式批准的新端口天然封闭
              correct: true
            - text: 因为默认允许会消耗比默认拒绝多十倍的 CPU 电量
              why: 最后一行默认放行还是默认拒绝，在匹配计算量上几乎没有差别，差别全在“未预料服务暴露面”的风险上
            - text: 因为防火墙硬件不支持在规则表里写 DENY
              why: 任何防火墙都同时支持 ALLOW 与 DENY 规则
          explain: 白名单思维（默认拒绝）在面对未知遗漏时是安全失效（Fail-closed）：宁可忘了开规则让人报障来找你，也不能忘了关规则让数据库裸奔。
      - card:
          title: 应用层防火墙（WAF）与深度检查（10.4）
          body: |
            传统包过滤只看网络层和传输层头部，根本看不懂应用层语义。例如它放行了 HTTPS 443 端口，但一个合法 443 连接里传来的既可能是正常登录，也可能是恶意的 SQL 注入或恶意软件下载！

            为此有了检查应用层内容的应用代理 / **WAF（Web 应用防火墙）**：它在边界解析 HTTP/SQL 等应用协议语法，甚至先终结 TLS 解密检查载荷后再转发给后端。
      - card:
          title: 防火墙的三个先天盲区（10.6–10.7）
          body: |
            哪怕配了最严的边界防火墙，依然有三个天然局限无法靠它单独解决：
            1. 管不了绕过边界的内部物理接触（如员工带毒 U 盘或用手机热点直连外网）；
            2. 看不透端到端加密且未在防火墙处解密的隧道流量；
            3. 无法凭五元组区分“被允许开放的端口里传进来的合法业务请求和业务逻辑漏洞利用”。因此边界防火墙必须配合入侵检测和主机防护纵深防御。
      - item:
          id: q-fw-limits
          type: choice
          multi: true
          prompt: 已经部署了规范的边界有状态防火墙并严格执行默认拒绝，为什么企业依然**不能**高枕无忧以为万无一失？（多选）
          options:
            - text: 允许对外开放的业务端口（如 443）内部夹带的 Web 漏洞攻击载荷（如 SQL 注入），仅凭 IP 和端口的包过滤防火墙看不出来
              correct: true
            - text: 内部员工插进办公电脑的带毒 U 盘或从手机热点直接连出的流量完全不经过公司边界防火墙
              correct: true
            - text: 未做解密的端到端加密隧道载荷对传统包过滤防火墙是不透明的
              correct: true
            - text: 因为有状态防火墙每周日会自动清空全部规则变成全部放行
              why: 规范防火墙配置保存在持久存储中不会周期性自动清零，真正瓶颈在于视野盲区和绕过路径
          explain: 防火墙负责“门卫核对通行证和门牌号”，但它看不透密封包裹里的业务毒药，也拦不住翻后墙或内部直接递交的载体——所以还需要入侵检测和主机防护。

  # ======================================================================== 入侵检测
  - id: ids-nids-hids
    chapter: 入侵检测
    title: 入侵检测：NIDS、HIDS 与三种检测策略
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 边界防火墙好比大楼门口的安保闸机，没票不准进。但如果一个已经合法买票进来的人在大厅里鬼鬼祟祟撬自动贩卖机，只守在门口查票的闸机能发现吗？还需要什么角色？
          options:
            - text: 闸机管不了入场后的行为，还需要在大厅走廊和重要房间装监控摄像头（入侵检测系统）盯着异常动作并发出告警
              correct: true
            - text: 只要把门口闸机刷卡速度调慢一倍就能自动抓到偷东西的人
              why: 入口查票管的是准入资格，发现已经混入之后的恶意行为需要持续行为监测
            - text: 应该立刻把大厅里所有合法买票进来的客人全赶出去永久闭馆
              why: 安全监测要精准发现可疑威胁事件，而不是粗暴停止正常业务
          explain: 防火墙负责“挡在门外”，**入侵检测（IDS）**负责“盯着里面发生了什么可疑动作并拉响告警”。
      - card:
          title: 旁路监测 vs 阻断，以及 NIDS 与 HIDS（CS161 第 36 章）
          body: |
            传统**入侵检测系统（IDS）**通常旁路镜像一份流量或日志静默分析，只产生**告警**与取证**日志**而不直接断流（若串联进转发路径并直接丢包阻断，则叫 IPS）。

            按安放位置分成两大类（11.2–11.3 节）：一种看网络线缆，一种看操作系统内部。
      - card:
          title: NIDS（网络型）vs HIDS（主机型）的视野对比
          body: |
            - **NIDS（网络入侵检测）**：挂在关键交换机镜像口上，看所有进出网络的流量。优势是视野覆盖全网、不用动各台服务器；弱点是对加密流量只能看元数据，且看不见单机内发生了什么。
            - **HIDS（主机入侵检测）**：装在每台服务器操作系统内部，紧盯进程启动、系统调用、文件篡改和本地登录日志。优势是能看清解密后的真实行为；弱点是每台机都得装代理、一旦被攻破代理可能被停掉。
      - item:
          id: q-nids-vs-hids
          type: match
          prompt: 把下面四项安全观测需求与 NIDS 或 HIDS 的各自长短处对应起来。
          pairs:
            - [一个监控探针挂在核心交换机镜像口就能同时盯住上百台老旧设备, NIDS（网络级部署覆盖面广）]
            - [看清 HTTPS 流量在服务器内存解密后到底执行了哪个异常系统调用或脚本, HIDS（深入主机内核与进程上下文）]
            - [面对全程端到端 TLS 加密的外部攻击载荷时，只能看见连接五元组与包大小, NIDS 的主要视野局限]
            - [攻击者拿到服务器 root 权限后顺手把本机监控代理进程杀掉导致失明, HIDS 的主要被绕过风险]
          explain: NIDS 站在网络走廊“看谁在跟谁通信”，HIDS 站在房间里面“看这个进程在干什么”；两者互补，缺一不可。
      - card:
          title: 检测策略（一）：基于签名与基于异常（11.6–11.8）
          body: |
            看懂流量和主机行为后，怎么判断“这是坏人”？先看最常用的两条路：
            1. **基于签名（Signature-based）**：维护已知攻击特征库（类似特征码），匹配到已知恶意报文串或模式就报警。误报极低、能立刻说清是什么攻击，但对从未见过的全新未知攻击（0-day）几乎必漏！
            2. **基于异常（Anomaly-based）**：先统计正常业务平时的基线（如常规流量、常用端口、登录时段），偏离基线太远就报警。有机会揪出未知新攻击，但正常业务一搞促销就极易产生大量误报。
      - card:
          title: 检测策略（二）：基于规约（11.9）
          body: |
            还有第三条路——**基于规约（Specification-based）**：由安全专家事先写死合法协议或合法程序的“允许状态机与白名单规范”。只要行为或报文违背规范就报警。

            规约检测既能发现未知绕过攻击、误报率又远低于宽泛异常检测；代价是需要人工仔细梳理并维护每一套关键协议与程序的精确规范，工程成本较高。
      - item:
          id: q-ids-strategies
          type: match
          prompt: 把下面四种具体现象与最符合的入侵检测策略配对。
          pairs:
            - ["匹配已知攻击载荷特征串 `() { :; }; /bin/bash` 来抓 Shellshock 漏洞利用", 基于签名检测]
            - [凌晨 3 点某平时从不传大文件的财务账号突然向外网连续上传 40 GB 数据，触发偏离基线告警, 基于异常检测]
            - [严格按 HTTP 状态机与白名单字段校验请求，只要违背协议合法允许语法即判异常, 基于规约检测]
            - [公司上线新促销活动后正常访问量暴增五倍，导致检测器连续弹出几千条假警报, 基于异常检测的典型痛点]
          explain: 签名认“已知坏样子”，异常认“跟平时不一样”，规约认“违反严格允许的白名单规范”。
      - item:
          id: q-ids-new-attack
          type: choice
          prompt: 安全团队刚刚部署了一套纯“基于签名”的入侵检测设备并把特征库更新到今天最新版本。晚上黑客使用了全世界此前从未出现过的一个全新 0-day 漏洞载荷（载荷特征完全不在旧库里）打穿了系统。纯签名检测器为什么会漏报（False Negative）？
          options:
            - text: 基于签名的检测器只能认出特征库里已经登记过的已知坏特征，对未知新攻击没有匹配模板
              correct: true
            - text: 因为签名检测器在晚上会自动休眠停止工作
              why: 检测器 24 小时都在运行，问题在于“特征库里还没有这个新模式”
            - text: 因为任何 0-day 漏洞的流量字节长度都是零字节
              why: 0-day 载荷同样走真实网络包，只是它的特征此前没人见过、没写入规则库
          explain: 签名检测的天然短板就是**漏报未知攻击**：必须先有人见过、写出特征规则，它才能认出来；想抓未知威胁需要结合异常检测或行为关联规则。
      - item:
          id: q-ids-ips-diff
          type: choice
          prompt: 同样的特征匹配引擎，分别作为旁路 **NIDS** 和串联 **IPS** 部署在公司外网入口处。当引擎因为规则写得太宽泛而把正常的双十一结算请求误判成攻击时，两者导致的直接后果有什么区别？
          options:
            - text: 旁路 NIDS 只会多记一条假告警日志而不影响正常结账；串联 IPS 则会当场直接丢包阻断正常用户结账
              correct: true
            - text: 旁路 NIDS 会自动拔掉交换机电源，串联 IPS 只写日志不拦包
              why: 刚好相反：IDS 旁路侦听只记告警，IPS 串联在线路上具备主动丢包阻断能力
            - text: 两者都会导致所有员工邮箱密码被自动修改
              why: IDS/IPS 是流量检测与阻断设备，不改写应用用户口令
          explain: 正因串联阻断的误杀代价极高，现实中很多严苛特征只在确认几乎零误报时才切到 IPS 拦截，其余先放 NIDS 告警观察。

  - id: ids-baserate-evasion
    chapter: 入侵检测
    title: 基率谬误、误报漏报与检测逃逸/滥用
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 某公司买了一台号称“神级准确率”的入侵检测设备：真攻击检出率高达 **99%**，正常连接误报率只有极低的 **0.1%**（千分之一）。今天全网共有 100 万次连接，其中只有 10 次是真攻击。当这台设备疯狂弹出告警时，你猜在这些告警里，真正是真攻击的比例大约是多少？
          options:
            - text: 不到 1%（100 条告警里只有大约 1 条是真的，其余 99 条全都是误报！）
              correct: true
            - text: 99%（既然检出率 99%，那告警里十有八九也都是真攻击）
              why: 把“真攻击里抓出多少（检出率）”和“告警里有多少是真的（精确率）”混为一谈，这正是著名的基率谬误
            - text: 50% 左右，一半真一半假
              why: 算算绝对数量就会吓一跳：999,990 次正常连接乘以 0.1%，会生出将近 1,000 条假警报！
          explain: 哪怕误报率看起来只有千分之一，乘上近百万次的庞大正常流量基数后，假警报的数量照样把那寥寥几条真告警彻底淹没——这就是网络安全运营里最头痛的**基率谬误**。
      - card:
          title: 混淆矩阵与基率谬误（CS161 11.5 节）
          body: |
            判断检测器好坏看四个结果：真阳性（TP，真攻击抓到了）、假阳性/误报（FP，好人冤枉成坏人）、真阴性（TN，好人放过）、假阴性/漏报（FN，真攻击放跑了）。

            为什么 0.1% 的极低误报率依然灾难？因为安全检测中真攻击的**基础发生率（基率）极低**（比如百万分之一到十万分之一）。只要误报率比真实攻击占比高出一两个数量级，误报总量就会远远压倒真告警——这就是**基率谬误（base-rate fallacy）**！
      - card:
          title: 例题：手算技能树综合练习里的基率谬误题
          body: |
            按原技能树综合练习题 (4) 的精确数字算一遍：
            - 总事件数 $N = 1{,}000{,}000$，其中真实攻击 $10$ 次（正常事件 $999{,}990$ 次）；
            - 检测率（真阳性率）$= 99\%$，误报率（假阳性率）$= 0.1\%$。
            每当系统发出一条**告警**时，它是真攻击的概率有多大？
          reveal:
            - title: 第 1 步：分别算出真告警（TP）和误报（FP）的绝对条数
              body: 期望真告警 $\text{TP} = 10 \times 99\% = 9.9$ 条；期望误报 $\text{FP} = 999{,}990 \times 0.1\% = 999.99$ 条（约 1000 条）。
            - title: 第 2 步：算真攻击在全部告警中的占比（精确率）
              body: 总告警条数 $= 9.9 + 999.99 = 1009.89$ 条。真攻击占比 $= \frac{9.9}{1009.89} \approx 0.98\%$！也就是说超过 **99% 的告警都是虚惊一场**。如果不压低误报率或靠多条独立证据叠加，安全团队很快就会在海量**分诊**中告警疲劳、漏掉真黑客。
      - item:
          id: q-baserate-calc
          type: number
          prompt: 某检测器面对 100,000 次网络连接，其中只有 20 次是真实攻击（其余 99,980 次正常）。若检测率为 95%，误报率为 0.5%，这一天系统总共会发出多少条（真告警 + 误报）告警？（保留 1 位小数）
          answer: 518.9
          tolerance: 0.1
          explain: 真告警 TP = 20 × 0.95 = 19 条；误报 FP = 99,980 × 0.005 = 499.9 条；总告警 = 19 + 499.9 = 518.9 条（其中真攻击只占 19 / 518.9 ≈ 3.66%）。
      - card:
          title: 逃逸检测：分片、编码与 TTL 歧义（CS161 36–37 章）
          body: |
            聪明攻击者会专门钻旁路检测的空子（躲避检测）：
            - 把一个恶意命令拆成重叠或乱序的 IP 分片、换奇怪的 URL/Unicode 编码；
            - 或者把其中几个假冒分片的生存时间 `TTL` 故意设小，让路上的 NIDS 看见并拼进缓存，却在到达目标主机前刚好耗尽超时丢弃——于是 NIDS 眼里看到无害拼图，目标主机却拼出了真攻击载荷！
      - card:
          title: 滥用入侵检测：借自动封禁之刀杀人（CS161 第 37 章）
          body: |
            更危险的是反过来利用自动防护规则（第 12 章）：如果某台联动 IPS 一看到某个攻击特征串就立刻自动封杀该包的“源 IP”一小时，会怎样？

            由于无连接 UDP 的源 IP 极易伪造，离路攻击者只需把源 IP 伪造成**你公司的核心 DNS、大客户或合作方网关**，再朝你的网关发一个带触发特征的包，就能借 IPS 之手亲手把正常业务全部封死！
      - item:
          id: q-ids-abuse
          type: choice
          prompt: 某公司给接入网关配了一套“只要从任意报文里匹配到某已知攻击特征字符串，就立刻自动把该包的源 IP 拉进全网黑名单封锁 24 小时”的联动策略。黑客最容易怎样**滥用这套入侵检测联动机制**来攻击该公司？
          options:
            - text: 伪造该公司重要客户或上游合作服务器作为源 IP，发出一两个包含触发特征的无连接报文，诱导 IPS 亲手把合法业务封掉
              correct: true
            - text: 自己老老实实填自己的真实 IP 连续发包，等自己被封掉再开心离开
              why: 封掉攻击者自己的 IP 并不能损害业务；滥用的关键在于“借刀杀人”伪造无辜第三方或关键基础设施 IP
            - text: 因为封锁 24 小时会自动把公司所有数据备份删除
              why: 封禁 IP 导致的是合法连接被阻断（可用性受损），不会删除备份文件
          explain: 自动封禁必须建立在“源 IP 已通过完整三次握手或确实不可伪造”的前提上，否则任何自动封 IP 规则都会沦为黑客手里的 DoS 按钮（第 37 章核心教训）。
      - item:
          id: q-ids-evasion
          type: choice
          prompt: 为什么老式 NIDS 仅仅对着网络上单个小数据包做简单字符串匹配，很容易被攻击者通过“分片、乱序重叠或改变编码”绕过？
          options:
            - text: 因为旁路 NIDS 如果没有和目标主机操作系统一模一样地做 TCP 流重组、分片重组和协议解码，两者眼里拼出的最终内容就可能不一致
              correct: true
            - text: 因为 TCP 数据包在网络里传输时禁止拆分超过 10 个字节
              why: IP 分片和 TCP 分段本就是正常网络传输机制，可以按需把一句话拆成多片发送
            - text: 因为 NIDS 只能识别大写英文字母，看不见数字
              why: NIDS 支持全字节与正则表达式匹配，难在旁路状态与终点主机语义完全对齐
          explain: 消除歧义逃逸必须让检测器做完整规范化（Stream reassembly + Protocol normalization），必要时结合能直接看到主机最终输入结果的 HIDS。

  - id: tls-handshake-pfs
    chapter: 传输保护与网络监测
    title: TLS 1.3 握手、证书校验与前向保密
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 以前有一种老式 HTTPS 做法：每次客户端连上银行服务器，客户端生成一个临时密码，直接用**银行的同一把长期公钥**加密后发过去。后来黑客悄悄录下了过去 3 年全部加密流量存在硬盘里（当时解不开），直到今天黑客偷到了银行那把长期私钥。以前录下的那 3 年密文现在会怎样？
          options:
            - text: 全部沦陷：黑客拿长期私钥把当年每次协商临时密码的握手包全解开，过去 3 年的秘密一次性暴露无遗
              correct: true
            - text: 完全安全：已经过去 3 年的加密数据包会因为过期自动失效打不开
              why: 密文文件已经录在黑客自己的硬盘上，只要解开那次会话密钥的方法还在，任何时候都能离线还原
            - text: 只要银行今天立刻换一把新私钥，黑客硬盘里存的旧密文就会自动变乱码
              why: 更换新密钥只保护今后的新连接，保护不了当年用旧公钥加密握手录下来的旧密文
          explain: 这就是为什么现代传输安全死守**历史会话不被回溯解密**——绝不能用同一把长期静态密钥直接去加密交付每一次的会话密钥。
      - card:
          title: 为什么需要 TLS，以及 TLS 1.3 的第一步握手（CS161 第 31 章）
          body: |
            从 C.3.2 已知，TCP 只管可靠字节流，既不保密也不防篡改。**TLS 1.3（RFC 8446）**叠在 TCP 之上，目标是靠一个网络来回（1-RTT）同时做完**身份认证**与**会话密钥协商**：

            1. **ClientHello**：客户端发随机数、支持的加密套件列表，以及主动猜好的一份**临时（EC）DHE 公钥份额**（省下一次单独往返）。
            2. **ServerHello + 加密扩展**：服务器选定套件并回传自己的临时（EC）DHE 公钥，双方立刻各自算出同一把握手密钥，后面的证书和验证消息全加密传输！
      - card:
          title: TLS 1.3 证书认证与握手收尾
          body: |
            加密信道刚建起，紧接着同一趟服务器发回三条认证消息：
            3. **Certificate**：附上自己的数字证书链。
            4. **CertificateVerify**：用这本证书对应的**长期私钥**对前面所有握手摘要做一次数字签名，证明“这本证书真的是我的，不是路上抄来的”。
            5. **Finished**：对整段握手做消息认证校验；客户端验证无误并回传自己的 `Finished`，加密业务数据正式开跑！
      - item:
          id: q-tls13-order
          type: order
          prompt: 请把标准 TLS 1.3 完整 1-RTT 握手（不含 0-RTT）的主要消息顺序排好。
          steps:
            - 客户端发送 ClientHello（含随机数、加密套件与临时密钥协商份额）
            - 服务器回复 ServerHello（选定套件并附上自己的临时公钥份额）
            - 服务器发送 Certificate 证书链、CertificateVerify 签名及服务器 Finished
            - 客户端校验证书与签名并发送客户端 Finished，双方开始传输应用数据
          explain: TLS 1.3 把密钥交换参数直接塞进第一次 ClientHello 和 ServerHello，砍掉旧版 TLS 1.2 的额外往返，从第二次消息起后续证书信息也全部加密。
      - card:
          title: 拿到服务器证书后，客户端必须验哪五件事
          body: |
            光收到一张“写着自己是 `bank.com` 的证书”还不够——谁都能自己印一张假证书！浏览器或客户端必须逐项检查（31.1 节）：
            1. **信任链**：一路向上能连到本机操作系统/浏览器预先内置信任的根证书颁发机构（Root CA）。
            2. **签名真伪**：链上每一级 CA 的数字签名数学验证必须全通过。
            3. **有效期**：当前时间必须在证书起始与过期时间之内。
            4. **域名匹配**：证书里的域名（SAN 字段）必须与你访问的 `bank.com` 一致。
            5. **未被吊销**：通过 CRL 或 OCSP 确认私钥没泄露被作废。
      - item:
          id: q-cert-verify
          type: choice
          prompt: 黑客用钱在一家受浏览器信任的正规 CA 机构替自己合法注册的域名 `evil.com` 申请了一张完全有效、签发链完整、未过期也未被吊销的正规证书。当你在途被黑客劫持连接 `https://mybank.com` 时，黑客把这张 `evil.com` 真证书端给你，浏览器为什么还是会立刻弹红框警告？
          options:
            - text: 证书的信任链和签名虽然都真，但证书里绑定的域名是 `evil.com`，与你实际请求的 `mybank.com` 不匹配
              correct: true
            - text: 因为每张正规 CA 签发的证书只能用一次就销毁
              why: 同一张证书在其有效期内可以服务成千上万次连接，问题出在“张冠李戴”的域名不匹配
            - text: 因为浏览器只允许访问名字以字母 m 开头的网站
              why: 与字母无关，校验的是访问目标主机名是否在证书签发授权的 SAN 列表中
          explain: 证书验签要过五关缺一不可：少验“域名匹配”，任何一个买得起便宜域名的黑客都能拿自己的真证书冒充任何银行！
      - card:
          title: 前向保密（Forward Secrecy / PFS）
          body: |
            为什么在 `ClientHello` 与 `ServerHello` 里双方每次都要临时生成一次性（EC）DHE 密钥份额？这就是**前向保密（forward secrecy，PFS）**：

            双方每次连接现算出一把全新会话密钥，连接一关就从内存抹掉！服务器的长期证书私钥只用来在 `CertificateVerify` 里**签一次名证明身份**，绝不参与加密传送会话密钥。日后就算长期私钥被偷，历史录下的密文依然解不开。
      - card:
          title: 防重放攻击与 0-RTT 早期数据的取舍（31.2–31.3）
          body: |
            常规 1-RTT 握手靠双方现造的新鲜随机数和递增序列号天然防重放——在途攻击者把昨天录下的一条加密指令重新放回线路上，校验会直接失败被丢弃。

            为了省出极致速度，TLS 1.3 允许回访客户端在首个包顺带发 **0-RTT 早期数据**。但请注意：此时服务器还没把新鲜随机数挑战发过来，因此 **0-RTT 数据不能防重放**！工程上只许拿 0-RTT 发安全幂等读请求（如拉首页），绝不能拿来发转账、下单或改密码。
      - item:
          id: q-0rtt-replay
          type: choice
          prompt: 某手机购物 App 为了让用户点开秒杀界面快几十毫秒，给所有 API 接口都全面开启了 TLS 1.3 的 **0-RTT 早期数据**，包括“提交扣款订单”接口。在途攻击者录下这第一帧数据包后连续重放发送了 5 次，为什么这极其危险？
          options:
            - text: 0-RTT 数据随首个包一起发出，尚未经过服务器本轮新鲜随机数确认，不具备抗重放能力，攻击者重放会让服务器重复扣款下单
              correct: true
            - text: 因为开启 0-RTT 会让服务器把用户的银行卡密码明文打印在浏览器标题栏上
              why: 0-RTT 数据依然是用上次协商保存的预共享密钥加密的，问题不是明文泄露而是“同一份密文可以被重放执行多次”
            - text: 因为 0-RTT 模式强迫客户端改用 WEP 无线协议发送数据
              why: 0-RTT 是传输层 TLS 1.3 特性，与链路层 Wi-Fi 加密协议无关
          explain: RFC 8446 明确指出 0-RTT 早期数据没有完整抗重放保护，只能用于不产生副作用的幂等只读请求，且后端需做额外幂等校验。
      - item:
          id: q-pfs-why
          type: choice
          prompt: TLS 1.3 彻底移除了旧版不带临时密钥协商的 RSA 静态密钥传输套件，强制所有握手使用临时（EC）DHE 密钥交换。这一改动最核心的安全保障是什么？
          options:
            - text: 确保每次连接各自使用一次性协商并随时销毁的临时会话密钥，即实现前向保密（PFS）：日后长期私钥失窃也无法回溯解密历史录下的流量
              correct: true
            - text: 可以让服务器再也不需要向 CA 机构申请数字证书
              why: 服务器仍然需要证书与私钥在握手时做签名认证，防止在途中间人冒充
            - text: 能够彻底阻断一切 TCP SYN 洪泛攻击
              why: 前向保密保护的是历史会话密文的机密性，与传输层半开队列资源耗尽无关
          explain: “身份认证用长期证书签名，对称加密会话密钥靠一次性临时（EC）DHE 现算现销毁”——这是现代传输加密的黄金拆分。

  - id: network-monitoring
    chapter: 传输保护与网络监测
    title: 网络监测、安全日志与面向分诊的关联准备
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 某天凌晨 2 点，监测系统产生了一条孤零零的告警：`发现有人对内网服务器发起了 SSH 密码尝试`。在什么额外上下文都没有的情况下，如果你是值班安全工程师，为什么单看这一句话没法直接断定“服务器已被黑客拿下了”？
          options:
            - text: 这条记录没写是“1 分钟内猜错几百次还是管理员打错 1 次”、“最后有没有登录成功”，也没有配套的主机进程与外连日志来印证后果
              correct: true
            - text: 因为凌晨 2 点产生的任何安全记录在法律上都不算证据
              why: 时间点不决定真假，恰恰相反，非工作时间的成功登录往往更值得核查
            - text: 因为 SSH 协议默认不走 IP 网络传输
              why: SSH 正是走 TCP/IP 22 端口的远程管理协议
          explain: 好的监测系统不仅要“响一声”，更要留下足够详实的**日志**字段，让后续安全运营能顺着线索做**分诊**与多源关联。
      - card:
          title: 两种网络监测粒度和工具（CS161 11.4、CS155 L15）
          body: |
            长期把全网每一个原始数据包全盘录下来往往存不下（几百 Gbps 网速几分钟就把硬盘撑爆）。实际网络监测分两层记录（**日志**）：
            - **流日志（如 NetFlow / IPFIX）**：只记元数据——谁在几点几分连了谁的哪个端口、总共传了多少包多少字节（极省空间，适合查外连、扫端口与数据外泄总量）。
            - **协议摘要日志（如 Zeek / Bro）**：解析网络层后不存全包载荷，只抽出关键事务字段写进结构化日志——比如“谁查了哪个 DNS 域名”“TLS 证书写了谁”“HTTP 请求路径与状态码是什么”。
      - card:
          title: 面向安全运营的日志与分诊要素（对接攻防评估）
          body: |
            如果只想在告警里“看个 IP 就一封了之”，往往治标不治本——攻击者换个肉鸡 IP 五秒后继续来。

            高质量的网络监测与主机日志应当对齐时间（NTP），并至少留住四块可交叉印证的现场证据：
            1. **网络与代理日志**：五元组、域名/URL、传输字节数（判数据外泄）；
            2. **DNS 解析日志**：查询域名与返回值（抓恶意命令控制域名）；
            3. **认证与会话日志**：账号、源 IP、成败结果（区别误输、暴力破解还是低频撞库）；
            4. **主机进程与账号变更**：成功后有没有派生异常命令行、新建管理员或计划任务。
      - item:
          id: q-zeek-vs-netflow
          type: match
          prompt: 把下面三类调查需求与最能帮上忙的监测记录类型对应起来。
          pairs:
            - [空间预算有限，需要长久留存全公司内网主机和外部哪些 IP 传过多少 GB 数据, 流日志（NetFlow/IPFIX 元数据）]
            - [想查出中木马的电脑究竟请求解析过哪个恶意域名、握手证书填了什么名字, 协议摘要日志（如 Zeek/Bro 的 DNS/TLS 日志）]
            - [判断刚才那批连续失败的密码尝试之后，攻击者究竟有没有成功登进主机执行异常命令, 认证日志 + 主机进程与权限审计日志]
          explain: 流日志管“谁跟谁传了多少”，协议日志管“问了什么域名和接口”，认证与主机日志管“到底得手没有、进屋后干了啥”。
      - card:
          title: 例题：收到一条疑似入侵告警后怎么分诊
          body: |
            值班时收到两条告警，要求你做快速**分诊**：
            - **告警 A**：外网 IP `198.51.100.77` 在 10 分钟内对内网网关 22 端口尝试了 3,000 次 SSH 登录，全部返回 `Failed`。
            - **告警 B**：外网一个冷门 IP 在凌晨 3 点尝试了 3 次某员工账号就显示 `Accepted`，随后 2 分钟内主机日志出现 `curl` 下载脚本并向陌生域名发起高频 DNS 查询。
          reveal:
            - title: 第 1 步：先看“是否已经成功越界”定优先级
              body: 告警 A 虽然次数看着吓人（3,000 次典型暴力破解扫盲），但**全部失败**；告警 B 虽然只有 3 次尝试，却**已经成功登录**且出现了可疑后继进程和异常 DNS 外连，危害和紧急度远高于 A，必须排在第一优先级立刻处置！
            - title: 第 2 步：别只封一个 IP 就结案
              body: 处置告警 B 不能只封掉那一个来源 IP 了事——因为密码或私钥可能已泄露，攻击者随时换 IP 再登。必须顺着认证、主机进程、DNS 日志四线追踪：立刻冻结/轮换该账号凭据、隔离主机查杀持久化后门，并在全网 DNS 日志里查还有没有其他主机连过同一恶意域名。
      - item:
          id: q-triage-priority
          type: choice
          prompt: 值班安全工程师同时收到两条告警：① 告警 A：某外网 IP 在 10 分钟内对公司网关 22 端口尝试了 3,000 次 SSH 登录，全部返回 `Failed`；② 告警 B：某冷门外网 IP 在凌晨 3 点只试了 3 次某员工账号就显示 `Accepted` 登录成功，随后 2 分钟内主机上运行 `curl` 并发起陌生域名 DNS 查询。为什么告警 B 优先级更高，且不能仅“封掉来源 IP”就结案？
          options:
            - text: 成功登录意味着防线已被突破且已进入主机执行阶段；若不轮换失陷凭证与全网清查可疑域名/进程，攻击者换个源 IP 依然能回来
              correct: true
            - text: 因为 3,000 次失败扫描在法律上不构成攻击企图
              why: 暴力扫描同样是恶意试探，只是尚未攻破目标，紧迫性排在已失陷主机后面
            - text: 因为封禁一个 IP 会让路由器永久无法再处理任何 DNS 查询
              why: 封禁单个恶意源 IP 不会破坏正常 DNS，只是面对已失陷账号和域名回连时“只封源 IP”远远不够
          explain: 这正是网络安全监测接入后续安全运营（SOC）的核心思维：用成功状态与后续行为定危急，用多源日志关联斩草除根。
      - card:
          title: 例题：为什么把本地 DNS 查询、路由、TCP 和 TLS 放在一起看才能守住整条线
          body: |
            很多初学者容易孤立地背名词：比如“我有 TLS 所以不用管 ARP”“我有防火墙所以不用管日志”。用一条完整访问过程把前面知识串起来：
          reveal:
            - title: 第 1 步：解析与寻址阶段最怕欺骗和劫持
              body: 连 Wi-Fi 时要靠 **WPA2-Enterprise** 防空中偷听和假热点，拿地址与解析 MAC 靠 **DHCP Snooping + DAI** 防冒充，查域名靠 **随机源端口 + DNSSEC** 防投毒，跨自治系统靠 **RPKI** 防 BGP 路由劫持。
            - title: 第 2 步：建连、传输与内网防线各自兜底
              body: 建连防洪泛靠 **SYN Cookie**，传输机密与身份防篡改靠 **TLS 1.3 + 证书五项检查 + 前向保密**，进出边界靠 **DMZ + 默认拒绝的有状态防火墙**，墙内靠 **NIDS/HIDS 与多源日志分诊** 及时止损——每一层防不同的威胁，缺哪一层都会出缺口。
      - item:
          id: q-ioc-vs-ipblock
          type: choice
          prompt: 发现一台内网主机感染了木马并定时连向恶意控制域名 `c2.bad-example.net`（对应 IP `198.51.100.88`）。如果仅在防火墙里把 `198.51.100.88` 这一个 IP 封死就宣布处置完毕，最容易留下哪两个漏洞？
          options:
            - text: 攻击者随时能把恶意域名解析切到新 IP 卷土重来，且这台内网主机上的木马进程和可能已外泄的凭证根本没被清理
              correct: true
            - text: 因为防火墙屏蔽任何 IP 地址都会自动格式化整个公司的硬盘
              why: 防火墙阻断 IP 只拦网络流量，问题在于没有在主机端清掉木马和在 DNS 层/全网查历史关联失陷范围
            - text: 因为域名系统每秒会自动更换所有正常员工的姓名
              why: 问题是攻击者控制着域名的 A 记录指向，换个 IP 就能绕过单 IP 黑名单
          explain: 只封单个 IP 属于最脆弱的局部止血；完整的分诊处置还必须在全网 DNS 日志里反向排查还有谁连过 `c2.bad-example.net`，并对失陷主机做隔离取证与凭证重置。

  # ======================================================================== 无线链路安全
  - id: wifi-wpa-security
    chapter: 无线链路安全
    title: Wi-Fi 无线链路安全：从 WEP 到 WPA2/WPA3
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 在办公室有线以太网里，黑客想窃听你网线里的数据，至少得想办法插进同一台交换机或搞定 ARP 欺骗。而当你坐在咖啡馆连 Wi-Fi 时，为什么连“进同一个局域网”都还没必要，黑客坐在十米外的角落里就能静静录下周围飞过的所有无线信号？
          options:
            - text: 无线电波向四周开放传播，任何人只要在信号覆盖范围内打开无线网卡监听模式就能收到空中飘过的帧
              correct: true
            - text: 因为所有咖啡馆路由器都会把用户数据包同步发到公开微博上
              why: 并非路由器主动对外发微博，而是无线电波在空气中的物理广播特性使然
            - text: 因为无线路由器完全不使用 MAC 地址
              why: 802.11 Wi-Fi 帧同样包含 MAC 地址
          explain: 有线网络尚且有物理墙和网口挡着，**无线链路天生就是共享开放广播媒介**——因此链路层加密和准入认证在 Wi-Fi 里是生死线。
      - card:
          title: 开放无线媒介的威胁与 WEP 的崩塌（CS161 第 28 章）
          body: |
            没有链路保护的开放 Wi-Fi 里，不仅任何旁观者都能被动窃听，攻击者还能伪造完全同名的**假冒热点（Evil Twin）**诱骗手机连入（13.2–13.4 节）。

            最早的加密标准 **WEP** 用共享固定密钥拼上一个 **24 位随机初始化向量（IV）**生成流密码密钥流。问题在于 24 位只有 $2^{24} \approx 1677$ 万种可能！按生日悖论，往往只要抓几千个包（约 4800 帧碰撞率就过半）就会撞出两个用同一 IV 的帧；两个密文一异或，相同密钥流当场抵消，几分钟就能破解出整网密钥。
      - item:
          id: q-wep-iv
          type: choice
          prompt: 早期 WEP 标准虽然号称用了 RC4 加密，为什么黑客往往只需要在旁边静静抓几分钟无线数据包，就能直接把它的 Wi-Fi 密码解出来？
          options:
            - text: WEP 把共享静态密钥直接拼上只有 24 位的初始化向量（IV）作流密码加密，极短的 IV 很快就会重复使用导致密钥流重用被数学破解
              correct: true
            - text: 因为 WEP 标准规定每隔 10 分钟必须把密码明文广播给路人
              why: WEP 没有明文广播密码，是 24 位短 IV 碰撞和弱密钥调度让密文泄露了密钥字节
            - text: 因为 Wi-Fi 无线电波无法传输任何加密后的二进制比特
              why: WPA2/WPA3 都在同一物理无线电波上成功实现了强加密
          explain: 流密码的大忌就是“同一把钥匙配同一个 IV 用两次”；WEP 的 24 位 IV 空间太小，在高速无线网里几分钟就撞车。
      - card:
          title: WPA2 个人版四次握手与离线字典风险
          body: |
            现代标准的 **WPA2** 改用基于 AES 的 **CCMP** 认证加密，并在设备连入时通过**四次握手（4-way handshake）**验证双方都掌握主密钥，同时派生出本次连接专用的临时加密密钥和递增包序号。

            但家庭常用的 **WPA2-PSK（预共享密钥模式）**有一个结构性痛点：全屋或全咖啡馆共用同一句 Wi-Fi 密码！黑客只需要坐在旁边把一次四次握手包录下来，就可以拿回家用显卡离线每秒暴力试探几十万个常见弱口令。
      - card:
          title: KRACK 重放缺陷与 WPA3 SAE 握手
          body: |
            此外，2017 年曝光的 **KRACK** 漏洞发现：如果诱使客户端错误重装四次握手第 3 条消息里的密钥，会导致包序号归零重用，从而破坏流模式加密安全性（需打固件补丁修复）。

            新一代 **WPA3** 在个人版引入 **SAE（对等同时认证）**握手：即使有人录下全部空中握手过程，也无法拿回家离线跑字典暴力猜密码，必须每次实打实在线连路由器猜一次，大幅提高破解成本。
      - item:
          id: q-wpa3-sae
          type: choice
          prompt: 与家庭常用的 WPA2-PSK 相比，新一代 **WPA3** 在个人网络中引入的 **SAE 握手**主要堵住了哪一种威胁？
          options:
            - text: 阻止旁观者偷录一次空中握手报文后拿回家用显卡做离线字典暴力猜解 Wi-Fi 密码
              correct: true
            - text: 允许路由器不用任何密码就自动让全世界陌生人接入内网服务器
              why: SAE 依然需要密码验证，只是用抗离线猜解的密码验证密钥交换替代了传统四次握手的离线验证素材
            - text: 把无线电波改造成有线光纤以消除物理距离限制
              why: 无线物理媒介不变，改进的是密码学握手协议的抗离线爆破能力
          explain: WPA2-PSK 四次握手里留了可供离线校验口令对错的证据；WPA3 SAE 让每次试探都必须和路由器在线实时交互一次，使离线跑字典失效。
      - card:
          title: 企业级防线：WPA2-Enterprise（802.1X）
          body: |
            公司或大学校园绝不能让几千名员工共用同一句 Wi-Fi 密码（一有人离职或泄露全员得改密码，且还能互相偷听握手）。

            正统企业方案是 **WPA2-Enterprise（802.1X，13.5 节）**：
            - 每个员工用**自己独立的账号凭证或客户端证书**，经由无线接入点（AP）向后台认证服务器（RADIUS）单独验证；
            - 认证成功后为**这一个用户的这一次连接**单独派生出独一无二的会话密钥，做到哪怕同在一个公司 Wi-Fi 下，甲员工也解密不了乙员工的空中无线帧！
      - card:
          title: 例题：为什么从 WEP 换到 WPA2-Enterprise 能彻底封住空中嗅探与串听
          body: |
            对比咖啡馆或公司无线网里的三代方案，看看遇到“相邻座位的坏人打开抓包工具”时结果怎么变：
          reveal:
            - title: 第 1 步：WEP 的 24 位 IV 碰撞让所有人裸奔
              body: 24 位 IV 共 1677 万个值，抓几千帧（生日悖论约 4823 帧撞车率就达一半）就能恢复共享主密钥，所有人流量全透明。
            - title: 第 2 步：WPA2-PSK vs WPA2-Enterprise 决定“内部同事能否互听”
              body: 在共用口令的 WPA2-PSK 下，只要同事都知道这句口令且偷录了你连接时的四次握手，一样能算出你的临时密钥解密你的帧；而在 **WPA2-Enterprise（802.1X）**下，你的主会话密钥只由你个人的账户与 RADIUS 认证服务器动态派生，旁边同事既不知道你的个人密码，也完全解密不了你的空中流量。
      - item:
          id: q-wpa2-ent
          type: choice
          prompt: 为什么大学校园网和大型企业通常采用 **WPA2-Enterprise（802.1X）**，要求每位师生输入各自独立的学号/工号密码或安装证书连网，而不用所有人共享一个统一 Wi-Fi 密码（WPA2-PSK）？
          options:
            - text: 实现逐用户独立身份鉴权、离职单点吊销，并为每名用户每次连接派生互不相同的加密密钥，防止内部用户互相窃听或离线暴力破出全局共享密码
              correct: true
            - text: 因为 WPA2-Enterprise 不需要任何加密算法，速度更快
              why: 它同样使用强 AES-CCMP 链路加密，只是把“所有人共用一把共享密钥”升级为“每人每次独立认证派生独立会话密钥”
            - text: 因为个人版 WPA2-PSK 最多只允许 1 台手机连接
              why: 家庭路由器上的 PSK 也能同时连几十台设备，问题在于共用同一口令无法区分个人身份也防不住内部互听与离线猜密码
          explain: 个人共享密码就像整栋大楼共用同一把大门钥匙；Enterprise 802.1X 则是每人一张独立门禁卡，丢了只销这一张，且房间各自上锁。
      - item:
          id: q-wifi-match
          type: match
          prompt: 把下面四种无线网络机制或攻击与最准确的描述对应起来。
          pairs:
            - [WEP 24 位 IV 碰撞漏洞, 在无线信道下抓包几千到上万帧就极易重复使用密钥流导致破译]
            - [WPA2-PSK 离线字典攻击, 在空中偷录下四次握手报文后即可拿回本地高速暴力试探共享 Wi-Fi 口令]
            - [WPA3 SAE 握手, 即使连网用口令不太复杂，也能抵抗抓握手包拿回家离线暴力字典猜测]
            - [WPA2-Enterprise（802.1X）, 每位用户凭独立凭证向认证服务器鉴权，并各自拥有互不串通的无线加密会话密钥]
          explain: 从 WEP → WPA2-PSK → WPA2-Enterprise / WPA3，核心主线就是消除流密码 IV 重用、消除共享口令离线猜解并做到逐用户独立加密。

boss:
  items:
    - id: boss-adversary-match
      type: match
      prompt: 把四类网络攻防角色或威胁与它们的准确特征连线。
      pairs:
        - [在途攻击者, 位于通信必经链路上，能看到双向包头并直接拦截、丢弃或替换报文]
        - [离路攻击者, 不在通信路径上，既看不到回包也拦不住真服务器，只能伪造源 IP 盲发抢答]
        - [ARP 欺骗, 在本地局域网发假应答把网关和受害者的 MAC 全指向自己，抢入通信路径]
        - [BGP 前缀劫持, 恶意自治系统通告更窄更长的子网前缀，利用最长前缀匹配吸走全网流量]
      explain: 攻防分析先看位置（在途 vs 离路），再看利用了哪一层协议缺认证（二层 ARP、三层 BGP）。
    - id: boss-bgp-rpki
      type: choice
      prompt: 某大型云厂商拥有 `198.51.100.0/22`，并在 RPKI 中登记了只允许 `AS64500` 发起的 ROA 记录。下面哪种手段能通过已经部署了 RPKI ROA 源验证的路由器审查？
      options:
        - text: 恶意节点 `AS64599` 无法直接宣称 `198.51.100.0/24` 是自己发起的（源验证不通过），但如果不部署 BGPsec 路径签名，它仍可能谎称自己和 `AS64500` 直连而伪造较短路径
          correct: true
        - text: 恶意节点只要把源 MAC 地址改成全 F，RPKI 就会把所有外网路由判成合法
          why: MAC 地址只在本地二层以太网有效，跨自治系统的 BGP 路由器根本看不见也不认别的局域网 MAC
        - text: 部署 RPKI ROA 后，客户端和银行服务器之间再也不需要用 TLS/HTTPS 加密了
          why: RPKI 只验证路由通告里的前缀归属真实性，不加密也不认证用户应用层数据内容
        - text: 只要在 BGP 里拆出一个更窄的 `/24` 子网，RPKI ROA 就会自动失效放行
          why: RPKI ROA 包含最大允许前缀长度（maxLength），超限或由非授权 AS 发起的更长子前缀一样会被判 Invalid
      explain: RPKI ROA 防住“假冒前缀主人（起源验证）”，防“中间谎报邻接路径”需要路径签名（如 BGPsec）；同时控制面安全不能替代端到端传输加密。
    - id: boss-syn-cookie
      type: choice
      prompt: 面对每秒数百万个伪造源 IP 的 TCP SYN 洪泛攻击，为什么开启 **SYN Cookie** 后服务器能在不写爆半开连接队列的前提下依然正常服务真客户？
      options:
        - text: 服务器把四元组与私钥哈希结果编码进回复给对方的初始序号 `ISN` 里，暂不分配连接表内存；等真客户带着 `ISN + 1` 的 ACK 回来核对哈希有效后才分配内存建连
          correct: true
        - text: SYN Cookie 会把所有 TCP 连接强行转换成无状态的 UDP 协议，从此不再需要 ACK
          why: 客户端看到的仍是完完全全标准的三次握手（SYN → SYN-ACK → ACK）
        - text: 服务器收到第一个 SYN 时直接把对方的机器关机重启以防攻击
          why: 服务器根本无法远程关闭发送假源 IP 包的机器，也无权这么做
        - text: SYN Cookie 通过把客户端密码明文写进 IP 首部来实现身份核验
          why: 参与计算的是四元组、时间片与服务器本地保密的密钥哈希，与用户密码无关
      explain: SYN Cookie 的本质是“把本来记在服务器内存里的半开连接状态，通过密码学消息认证塞进对方必须原样加一寄回的序列号里”。
    - id: boss-dns-kaminsky
      type: choice
      prompt: 以下关于 DNS 缓存投毒、Bailiwick 检查与 DNSSEC 的说法，哪一项是**准确**的？
      options:
        - text: 源端口随机化主要防御“离路盲猜”的 Kaminsky 攻击，遇到“在途攻击者”依然挡不住；只有启用 DNSSEC 逐级数字签名才能让解析器验证记录未被在途篡改
          correct: true
        - text: 开启 Bailiwick 检查后，哪怕在同一域名 `bank.com` 内部，攻击者也不可能通过猜测事务 ID 来篡改 `bank.com` 的记录
          why: Bailiwick 只拦“跨域夹带”（如问 `evil.com` 夹带 `bank.com`），Kaminsky 攻击正是针对同一域名子域下手
        - text: DNSSEC 可以把用户访问了哪个网址加密藏起来，让本地运营商和咖啡店完全看不见你查过什么域名
          why: DNSSEC 只提供数字签名防篡改，域名查询本身仍可被看见（隐藏查询内容需用 DoT/DoH）
        - text: DNSSEC 中为了方便，全世界所有网站都共用同一把相同的 ZSK 私钥
          why: 每个域自己保管自己的 KSK 与 ZSK 私钥，父域只通过 DS 记录存子域公钥的哈希指纹来逐级委托信任
      explain: 把三道防线各自防什么理清：Bailiwick 防跨域私货 → 随机源端口+0x20 防离路盲猜 → DNSSEC 防在途篡改。
    - id: boss-seg-zt
      type: choice
      prompt: 关于“传统网络分段 + DMZ”和“零信任架构”的关系与落地，下面哪一项判断最准确？
      options:
        - text: 两者互补演进：用 VLAN/子网/DMZ 划出基础隔离带缩小爆炸半径，再叠加零信任“每次按身份和终端健康状态鉴权、最小权限与微隔离”，消除内网扁平互信的漏洞
          correct: true
        - text: 零信任架构要求把所有对外服务全都直接放进核心内网数据库同一台机器上
          why: 零信任恰恰强调更细粒度的隔离（微隔离），不会把高风险对外接口塞进核心区
        - text: 只要划好了 DMZ，内网员工访问财务系统就应该永久免登录认证
          why: 零信任反对一切“因身处某个内网区就默认免检”的设计
        - text: 零信任只关注外网口的一台硬件防火墙，和账号权限、设备状态完全无关
          why: 零信任恰恰把验证锚点从静态网络边界移到了“身份、设备状态和动态最小权限”上
      explain: 网络分段（宏隔离）负责大块切割，零信任（微隔离 + 每次鉴权）负责消除残留的“墙内盲信”。
    - id: boss-fw-rules
      type: choice
      prompt: 一套三区（外网、DMZ、内网）有状态防火墙按顺序配置如下：① 已建连回包（ESTABLISHED）ALLOW；② 外网 → 任意 DENY（错写在这里）；③ 外网 → DMZ TCP 443 ALLOW；④ 内网 → 外网 TCP 443 ALLOW；⑤ 任意 → 任意 DENY。现在会立刻出什么故障？
      options:
        - text: 外网用户访问 DMZ 的 HTTPS 443 网页全部不通，因为第 ② 条宽泛拒绝规则排在了第 ③ 条前面截胡了；同时内网访问外网 HTTPS 仍正常
          correct: true
        - text: 没有任何故障，因为防火墙会自动把第 ③ 条排到第 ② 条前面
          why: 防火墙严格按配置文件上下顺序执行首条匹配，不会擅自重排你的规则顺序
        - text: 内网访问外网 443 也会被第 ② 条全部拦截
          why: 第 ② 条源区域是 `外网`，而内网访问外网的出站首包源区域是 `内网`，会继续走到第 ④ 条 ALLOW，回包则命中第 ① 条 ESTABLISHED
        - text: 会导致内网数据库自动通过 SSH 22 端口向外网发送所有表结构
          why: 没有规则放行任何向外网的 22 端口主动流量，也不会触发自动导出
      explain: 写防火墙规则一定要“先具体允许、后宽泛拒绝”，顺手检查每一条的源/目的方向是否被上面的兜底规则提前拦截。
    - id: boss-fw-why-deny
      type: choice
      prompt: 在安全工程中，防火墙规则表末尾为什么要坚持使用“默认拒绝（Deny All）”？
      options:
        - text: 枚举“所有可能被攻击利用的危险端口与新服务”是不可能的（黑名单永远漏新洞），白名单式默认拒绝能确保只有明确审批需要的业务路径才开放
          correct: true
        - text: 因为默认拒绝可以把网络上的所有传输层数据自动改成量子加密
          why: 默认拒绝只做访问控制（放行/丢弃），不改变任何加解密算法
        - text: 因为不写默认拒绝，TCP 三次握手就无法分配 16 位端口号
          why: 端口号分配由操作系统内核协议栈负责，与防火墙兜底策略无关
        - text: 因为一旦写了默认拒绝，就可以永久关闭系统补丁升级和 TLS 加密
          why: 开放的业务端口依然需要打补丁与上 TLS 加密，安全永远是纵深叠加
      explain: 默认拒绝就是白名单哲学：没被明确写进允许列表的流量，统统按不安全拦截。
    - id: boss-ids-types
      type: match
      prompt: 把下面四种安全监测组件或现象与其正确类别配对。
      pairs:
        - [旁路挂在核心交换机镜像口上监测网络流量的探针, NIDS（网络入侵检测系统）]
        - [装在 Linux 主机上紧盯可疑系统调用与敏感文件篡改的代理, HIDS（主机入侵检测系统）]
        - [只能抓出已知攻击模式库里的威胁、遇到全新 0-day 会漏报, 基于签名的检测策略]
        - [把正常业务大促的突发增长误当成攻击而疯狂弹出假警报, 基于异常检测的典型误报场景]
      explain: 分清检测视角（网络 NIDS vs 主机 HIDS）和检测规则机理（签名认已知 vs 异常看基线偏移）。
    - id: boss-baserate
      type: number
      prompt: 某网络入侵检测系统一天共检查 500,000 次连接，其中只有 50 次是真攻击（其余 499,950 次为正常连接）。若该系统真攻击检出率为 90%，正常连接误报率为 0.2%，这一天产生的所有告警中，真正属于真实攻击的告警占比约为百分之多少？（填百分号前的数字，保留 1 位小数，如 4.3）
      answer: 4.3
      tolerance: 0.15
      explain: 真告警 TP = 50 × 0.90 = 45 条；误报 FP = 499,950 × 0.002 = 999.9 条；总告警 = 45 + 999.9 = 1044.9 条；真攻击占比 = 45 / 1044.9 ≈ 4.31%。即便误报率只有 0.2%，超过 95% 的告警仍是虚惊一场！
    - id: boss-ids-abuse
      type: choice
      prompt: 你是一家安全检测设备厂商的架构师，有客户提需求：“请默认开启‘NIDS 一检测到特定特征的 UDP 报文，就立刻自动封杀该报文的源 IP 一小时’”。你为什么必须提醒客户这藏着严重风险？
      options:
        - text: 无连接 UDP 的源 IP 极易被离路攻击者伪造；只要攻击者伪造该公司的上游 DNS、网关或大客户 IP 发一条触发报文，IPS 就会自废武功把正常核心服务封死
          correct: true
        - text: 因为 NIDS 无法解析超过 100 字节的 UDP 报文
          why: 正常 UDP 报文通常在数百到一千多字节内，解析器完全看得懂，致命的是“源 IP 没经过双向验证可信度”
        - text: 因为封杀源 IP 只能用物理剪刀去剪网线
          why: 封杀是在防火墙/IPS 规则表里自动下发拦截项
        - text: 因为一小时等于 3,600 秒，超过了 16 位整数上限 65,535
          why: 3,600 远小于 65,535，问题不在计时器数字而在自动联动被借刀杀人
      explain: 对没经过三次握手或有效认证证实源地址真实的报文做自动封 IP，正中“滥用入侵检测（CS161 第 37 章）”的下怀。
    - id: boss-tls-pfs
      type: choice
      prompt: 以下关于 TLS 1.3 握手、证书校验、0-RTT 与前向保密的组合判断，哪一项完全正确？
      options:
        - text: TLS 1.3 用 `CertificateVerify` 证明服务器持有证书私钥、用临时（EC）DHE 协商一次性会话密钥提供前向保密，客户端须校验信任链/签名/有效期/域名/吊销状态，且 0-RTT 因可被重放不应用于非幂等写操作
          correct: true
        - text: 只要网站用的是 HTTPS，哪怕浏览器提示证书域名不匹配或已过期，点击继续访问也不会有任何中间人风险
          why: 域名不匹配或吊销恰恰常常是中间人拿着假证书或偷来废证书劫持的明显征兆
        - text: TLS 1.3 的 0-RTT 模式具备完美抗重放能力，最适合直接放银行转账提交接口
          why: 0-RTT 在途数据包尚未经历双方新鲜随机数挑战，可被中间人截获重放，RFC 8446 明确警示仅适合幂等只读请求
        - text: 开启前向保密意味着服务器要把自己的长期私钥发给每一位来访的客户端备份
          why: 长期私钥绝不能离开服务器；前向保密靠的是每次临时现算用完即焚的（EC）DHE 会话密钥
      explain: 一次合格的传输保护既看机制（临时密钥保历史、证书五步保当下），也看工程边界（0-RTT 别放写操作）。
    - id: boss-wifi-sec
      type: choice
      prompt: 某大型研发企业准备淘汰掉车间和办公区里所有员工共用的旧 Wi-Fi 密码（过去甚至还有老设备挂在 WEP 上），升级无线安全。下列哪种演进方案最安全合理？
      options:
        - text: 彻底关停 WEP 与单一共用口令，部署 WPA2-Enterprise / WPA3-Enterprise（802.1X）配合独立员工凭证或设备证书逐人鉴权，并为每人每次连接生成独立会话密钥
          correct: true
        - text: 继续保留 WEP，只是把 24 位 IV 长度口头规定大家别在同一天重复连接
          why: 24 位 IV 硬件协议字段固定，高速通信几分钟内必然碰撞，不是人工约定能解决的
        - text: 把共用 Wi-Fi 密码改写成 12 位英文单词后贴在公司前台黑板上，大家继续共用同一密钥
          why: 所有人共用同一密钥（PSK）导致一人离职全员要改、且无线空间内缺乏逐用户密钥隔离
        - text: 彻底关掉所有无线加密，只在每台笔记本上开一个纯包过滤防火墙不加密码
          why: 开放未加密无线帧在十米外就能直接明文窃听所有非 TLS 流量和元数据，且极易被假 AP 钓鱼
      explain: 企业无线安全必须告别 WEP 和共用 PSK 钥匙，转向基于 802.1X 的独立身份认证与逐会话隔离加密。
