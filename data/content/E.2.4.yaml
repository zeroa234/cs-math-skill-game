skill: E.2.4
version: 2
authors: [gemini]
brief:
  why: 电磁波在空气里穿过楼宇、车辆和人群时，信号强弱会随距离剧烈衰减，还会因多径反射和终端移动快速起伏。这一站从无线传播和路径损耗讲起，依次拆解多径衰落、时间与空间分集、OFDM、MIMO、多址接入和蜂窝频率复用，最后把整套物理层拼进 4G LTE 与 5G NR。
  outcomes:
    - 用自由空间路径损耗、两径模型、对数距离模型和阴影衰落完成无线链路预算与覆盖半径估算
    - 计算均方根时延扩展、相干带宽、最大多普勒频移与相干时间，区分平坦/频率选择性与慢/快衰落
    - 分析瑞利衰落下 BPSK 的误码率恶化原因，对比时间、空间、频率分集及最大比合并的增益
    - 用 IFFT/FFT 和循环前缀解释 OFDM 如何抗多径，并权衡子载波间隔、峰均比与频偏敏感性
    - 用奇异值分解分析 MIMO 容量与自由度，区分空间复用、空间分集、波束赋形和接收机架构
    - 比较 FDMA、TDMA、CDMA、OFDMA 与多用户调度的资源划分方式，计算蜂窝复用信干比与话务阻塞率
    - 概括 4G LTE 与 5G NR 物理层在波形、子载波参数集、毫米波与大规模 MIMO 上的设计思路
terms:
  - term: 无线信道
    def: 发射天线与接收天线之间承载电磁波传播的开放空间媒质，其衰减与相移随位置和时间随机变化。
  - term: 波长
    def: 电磁波在一个振荡周期内传播的物理距离，等于光速除以载波频率，即 $\lambda = c/f$。
  - term: 大尺度衰落
    def: 信号平均功率随传播距离增加和大型障碍物遮挡在几十至数百波长尺度上发生的缓慢衰减。
  - term: 小尺度衰落
    def: 多条传播路径在接收端同相或反相干涉引起的信号幅度剧烈起伏，在半个波长距离内即可显著变化。
  - term: 各向同性天线
    def: 把发射功率向三维空间各个方向完全均匀辐射的理想点源参考天线，增益定义为 1（0 dBi）。
  - term: 天线增益
    def: 实际天线在主辐射方向上的功率密度与同等总功率各向同性天线之比，常用 dBi 表示。
  - term: 有效接收面积
    def: 天线从入射平面电磁波中截获能量的等效截面积，与天线增益和波长平方满足 $A_e = G_r\lambda^2/(4\pi)$。
  - term: 弗里斯传输公式
    def: 自由空间中描述接收功率与发射功率、收发天线增益、波长及距离关系的公式 $P_r = P_t G_t G_r(\lambda/4\pi d)^2$。
  - term: 自由空间路径损耗
    def: 理想无遮挡真空中仅因球面波扩散和有效接收面积随频率缩小造成的功率衰减，简称 FSPL。
  - term: 绕射
    def: 电磁波遇到尺寸与波长相当或更大的尖锐障碍物边缘时弯曲进入阴影区继续传播的现象。
  - term: 散射
    def: 电磁波遇到粗糙表面或尺寸小于波长的密集小物体时向各个方向弥散反射的现象。
  - term: 两径模型
    def: 同时考虑直射波与地面一次反射波干涉的传播模型，超过转折距离后平均接收功率按 $1/d^4$ 衰减。
  - term: 路径损耗指数
    def: 对数距离模型中描述平均路径损耗随距离增长快慢的经验指数 $n$，自由空间为 2，城区常取 3 至 4。
  - term: 阴影衰落
    def: 建筑物、地形等大型障碍物遮挡使相同距离处实测接收功率围绕路径损耗均值随机波动的现象。
  - term: 对数正态分布
    def: 取对数（或分贝值）后服从正态分布的随机变量分布，无线通信中常用来刻画阴影衰落。
  - term: 噪声系数
    def: 衡量接收机自身电路引入额外热噪声使信噪比恶化程度的指标，分贝值为输入与输出信噪比的分贝差。
  - term: 接收机灵敏度
    def: 接收机在满足规定误码率或信噪比门限的前提下能够正确解调的最低输入信号功率，常用 dBm 表示。
  - term: 衰落余量
    def: 链路预算中为抵御阴影衰落和小尺度衰落波动而预先留出的额外功率储备。
  - term: 最大允许路径损耗
    def: 在给定发射功率、天线增益、各类损耗、余量和灵敏度下，无线链路能够容忍的最高路径损耗，简称 MAPL。
  - term: 链路预算
    def: 用分贝加减法逐项核算发射端到接收端全部增益与损耗，以确定覆盖距离或余量的工程计算表。
  - term: 多径传播
    def: 同一发射电磁波经反射、绕射和散射沿多条不同路程的轨迹到达接收天线的传播现象。
  - term: 抽头延迟线
    def: 在有限带宽下把无线多径信道等效为若干等间隔延迟单元加复权重求和的离散时间滤波器模型。
  - term: 功率延迟分布
    def: 描述多径信道接收平均功率随各路径附加到达时延分布情况的函数，简称 PDP。
  - term: 时延扩展
    def: 多径信道中最早到达路径与最晚显著到达路径之间的时间跨度，决定码间干扰的严重程度。
  - term: 均方根时延扩展
    def: 以功率延迟分布为权重计算出的多径到达时延标准差 $\sigma_\tau$，是衡量频率选择性的核心指标。
  - term: 相干带宽
    def: 无线信道频率响应保持高度相关的最大频率范围，常按均方根时延扩展估算为 $B_c \approx 1/(5\sigma_\tau)$。
  - term: 平坦衰落
    def: 信号带宽小于信道相干带宽，信号所有频率分量经历几乎相同衰减与相移的衰落类型。
  - term: 频率选择性衰落
    def: 信号带宽大于信道相干带宽，不同频率分量经历不同衰落并在时域引起码间干扰的衰落类型。
  - term: 多普勒频移
    def: 发射端、接收端或散射体相对运动引起的接收载波频率偏移，等于 $(v/\lambda)\cos\theta$。
  - term: 多普勒扩展
    def: 多径从各个方向到达运动接收端时，不同路径多普勒频移展开形成的频谱展宽宽度 $2f_D$。
  - term: 相干时间
    def: 无线信道冲激响应保持高度相关的时间窗口，常按最大多普勒频移估算为 $T_c \approx 0.423/f_D$。
  - term: 慢衰落
    def: 码元周期远小于信道相干时间，信道在单个码元持续期间几乎保持不变的衰落类型。
  - term: 快衰落
    def: 码元周期大于信道相干时间，信道在单个码元持续期间就发生明显变化的衰落类型。
  - term: 瑞利衰落
    def: 无主导直射径、由大量独立散射径叠加形成的小尺度衰落，信号包络服从瑞利分布、功率服从指数分布。
  - term: 视距传播
    def: 发射天线与接收天线之间存在无遮挡直线通路的传播条件，简称 LOS。
  - term: 莱斯衰落
    def: 除大量散射径外还存在一条较强直射径或主导反射径时的小尺度衰落，包络服从莱斯分布。
  - term: 莱斯因子
    def: 莱斯信道中主导直射分量功率与所有散射分量总功率之比 $K$，衡量直射径的强弱程度。
  - term: 多普勒谱
    def: 描述平稳衰落信道时变复增益在多普勒频率域上功率分布的功率谱密度，经典各向同性散射呈 U 形。
  - term: 深衰落
    def: 多径分量近乎反相抵消，使信道瞬时接收功率远低于平均功率的极端衰落事件。
  - term: 平均误比特率
    def: 将瞬时信噪比对应的条件误比特率对信道衰落分布求数学期望后得到的长期统计误比特率。
  - term: 分集
    def: 让同一份信息通过多条衰落相互独立的支路传输，以大幅降低全部支路同时掉进深衰落概率的技术。
  - term: 分集阶数
    def: 独立衰落支路的等效数量，决定高信噪比下平均误码率在双对数坐标上随信噪比下降的斜率。
  - term: 时间分集
    def: 把同一信息分散到相隔超过相干时间的不同时刻发送，借助信道随时间变化获得独立支路的方法。
  - term: 交织
    def: 按特定顺序打乱码元发送次序、在接收端再还原的操作，用来把连续突发深衰落分散到不同码字里。
  - term: 编码增益
    def: 信道编码在相同分集阶数下把误码率曲线整体向左平移所节省的信噪比（分贝值）。
  - term: 空间分集
    def: 在发端或收端布置间距足够大的多根天线，利用空间位置差异获得近似独立衰落支路的技术。
  - term: 选择合并
    def: 接收分集在多个天线支路中仅挑出瞬时信噪比最高的一路进行解调的合并方式，简称 SC。
  - term: 等增益合并
    def: 将各接收支路先校准到同相位再以相同权重相加的合并方式，简称 EGC。
  - term: 最大比合并
    def: 将各支路同相校准并按各自信道幅度加权求和的合并方式，使输出瞬时信噪比等于各支路之和，简称 MRC。
  - term: 阵列增益
    def: 多天线相干叠加信号功率、非相干叠加噪声所带来的平均信噪比提升倍数。
  - term: 发射分集
    def: 在发射端使用多根天线并配合空时编码发送信号，使单天线接收端也能获得空间分集的技术。
  - term: Alamouti 码
    def: 面向两发一收系统的正交空时分组码，发端无需信道信息即可在接收端线性解耦获得 2 阶分集。
  - term: 宏分集
    def: 让终端同时与地理位置分散的多个基站通信，借不同方向路径共同抵抗大尺度阴影衰落的技术。
  - term: 频率分集
    def: 将同一信息分散到频率间隔大于相干带宽的不同频段上传输，以抵抗频率选择性深衰落的技术。
  - term: 均衡器
    def: 放在接收端用来补偿信道频率选择性失真、消除多径引起的码间干扰的信号处理模块。
  - term: RAKE 接收机
    def: 用于直接序列扩频系统的多支路接收结构，各支路对齐不同多径时延分别解扩后再做最大比合并。
  - term: 注水原理
    def: 在多个并行高斯子信道间分配总功率的最优策略：噪声越小的信道注水越多，过差的信道不分配功率。
  - term: 遍历容量
    def: 快衰落信道中码字跨越足够多相干时间后，对信道瞬时容量求期望得到的长期平均最高无差错速率。
  - term: 中断
    def: 慢衰落信道中某一次衰落实现的瞬时信道容量低于既定发送速率、导致可靠译码失败的事件，英文 outage。
  - term: 中断概率
    def: 无线链路瞬时容量低于目标传输速率（或瞬时信噪比低于解调门限）的统计发生概率。
  - term: 中断容量
    def: 在允许中断概率不超过给定值 $\varepsilon$ 的前提下，慢衰落信道所能支持的最高固定传输速率。
  - term: 导频
    def: 发端按约定位置插入、收端预先已知的参考符号，专门用于估计无线信道的幅度与相位。
  - term: 正交频分复用
    def: 把宽带信道划分成大量频谱重叠却彼此正交的窄带子载波并行传输数据的多载波技术，简称 OFDM。
  - term: 子载波
    def: OFDM 系统中用来承载单个窄带调制码元的正弦载波分量，各子载波在有用符号时长内彼此正交。
  - term: 子载波间隔
    def: OFDM 频域中相邻两个子载波中心频率之差 $\Delta f$，严格等于有用符号时长 $T_u$ 的倒数。
  - term: 循环前缀
    def: 把 OFDM 符号尾部一段波形复制到符号开头形成的保护间隔，能将信道线性卷积转化为圆周卷积，简称 CP。
  - term: 子载波间干扰
    def: 多径时延超过循环前缀或存在载波频偏时，OFDM 各子载波失去正交性而相互串扰的现象，简称 ICI。
  - term: 单抽头均衡
    def: 在 OFDM 频域对每个子载波只乘以一个复数系数的极简信道补偿方法，得益于循环前缀化卷积为乘法。
  - term: 峰均功率比
    def: 信号瞬时峰值功率与平均功率之比，OFDM 因多路子载波同相叠加而具有较高的峰均比，简称 PAPR。
  - term: 正交频分多址
    def: 将 OFDM 的时频子载波资源动态划分并同时分配给多个用户的多址接入方式，简称 OFDMA。
  - term: DFT 扩展 OFDM
    def: 在 OFDM 的 IFFT 映射前先对数据做离散傅里叶变换的波形，具备低峰均比特性，又称 SC-FDMA。
  - term: 多输入多输出
    def: 在发射端和接收端同时使用多根天线，借助空间维度提升传输速率或可靠性的无线技术，简称 MIMO。
  - term: 空间复用
    def: 在 MIMO 系统中同时经由不同天线发送相互独立的数据流，成倍提升频谱效率的传输模式。
  - term: 空间自由度
    def: 高信噪比下 MIMO 信道能并行支持的独立数据流个数，等于信道矩阵的秩，上限为 $\min(N_t, N_r)$。
  - term: 预编码
    def: 发射端根据信道信息对多路发送符号做线性矩阵变换，以实现并行解耦或能量定向聚焦的处理。
  - term: 天线阵列
    def: 按一定几何间距排布的多根天线单元集合，可通过控制各单元相位差实现空间分辨或定向辐射。
  - term: 角度分辨率
    def: 天线阵列在空间方向上能够区分两条独立入射路径的最小角间隔，反比于阵列归一化孔径。
  - term: 秩亏
    def: MIMO 信道矩阵因缺少散射或空间强相关导致实际秩小于 $\min(N_t, N_r)$、无法满额复用的现象。
  - term: V-BLAST
    def: 垂直贝尔实验室分层空时架构，各发射天线独立编码发送各自数据流，依靠接收端分离检测。
  - term: 迫零接收机
    def: 通过对信道矩阵求伪逆或正交投影完全消除流间干扰的线性 MIMO 检测器，但会在弱信道下放大噪声，简称 ZF。
  - term: 最小均方误差接收机
    def: 在抑制其他数据流干扰与控制噪声放大之间求最优折中、最大化输出信干噪比的线性检测器，简称 MMSE。
  - term: 串行干扰消除
    def: 先译出较强数据流并从总接收信号中减去其重建分量、再继续检测剩余数据流的非线性接收方法，简称 SIC。
  - term: D-BLAST
    def: 对角分层空时架构，将每个码字斜跨所有发射天线与时隙发送以兼顾空间分集与复用，在慢衰落下可达中断最优。
  - term: 分集–复用折中
    def: 描述 MIMO 系统在高信噪比下同时追求高空间复用增益与高分集阶数时相互制约关系的最优边界曲线，简称 DMT。
  - term: 波束赋形
    def: 调整天线阵列各单元的复权重，使电磁波能量在目标方向相干增强并在干扰方向相消的技术。
  - term: 大规模 MIMO
    def: 在基站端部署数十至上百根天线同时服务多用户、借极窄波束大幅提升频谱和能量效率的技术。
  - term: 信道硬化
    def: 大规模 MIMO 中大量天线对小尺度衰落进行空间平均，使等效信道增益趋于确定常数的统计现象。
  - term: 多址接入
    def: 允许多个终端按照频率、时间、码字或空间规则共享同一无线信道资源的接入机制。
  - term: 频分多址
    def: 把可用总频带划分为互不重叠的若干子频带，固定或动态分配给不同用户同时使用的多址方式，简称 FDMA。
  - term: 时分多址
    def: 将同一载波频带在时间轴上切分为周期重复的时隙，让多个用户轮流占用发送的多址方式，简称 TDMA。
  - term: 频分双工
    def: 上行链路与下行链路分别使用两个相隔一定保护间距的不同频段同时收发的双工方式，简称 FDD。
  - term: 时分双工
    def: 上行链路与下行链路共享同一频段、通过交替切换时间段来区分收发的双工方式，简称 TDD。
  - term: 扩展频谱
    def: 刻意把信号占用的射频带宽扩展到远大于原始信息带宽，以换取抗干扰和多址能力的技术。
  - term: 跳频
    def: 载波频率按收发双方约定的伪随机序列在多个频点间快速切换、借以躲避窄带干扰的扩频方式，简称 FHSS。
  - term: 直接序列扩频
    def: 用高速伪随机码序列直接乘以低速数据符号、将信号频谱展宽的扩频技术，简称 DSSS。
  - term: 码片
    def: 直接序列扩频中伪随机扩频序列的最小脉冲单元，码片速率远高于原始信息比特速率。
  - term: 扩频增益
    def: 扩频后信号带宽与原始信息速率之比（等于每比特包含的码片数），衡量解扩时压制干扰的倍数。
  - term: 码分多址
    def: 所有用户同频同时传输、依靠彼此正交或低互相关的扩频码在接收端分离信号的多址方式，简称 CDMA。
  - term: 远近效应
    def: CDMA 上行链路中靠近基站的强信号淹没远处弱信号、使解扩后远处用户信干比急剧恶化的现象。
  - term: 功率控制
    def: 基站实时反馈控制信号调节各终端发射功率，使不同距离用户到达基站的接收功率维持在相近水平的技术。
  - term: 叠加编码
    def: 基站在下行广播信道把发给不同用户的信号按不同功率线性叠加同频发送的编码方式。
  - term: 广播
    def: 无线网络中单个基站同时向多个接收终端发送信息的一对多下行传输模式。
  - term: 多用户分集
    def: 多个独立衰落用户中总有部分处于信道波峰，优先为瞬时信道最佳用户分配资源所带来的系统容量增益。
  - term: 调度
    def: 基站根据各用户的瞬时信道质量、业务时延与历史吞吐量，动态决定每个时频资源分给谁的决策过程。
  - term: 比例公平调度
    def: 每次选择瞬时可支持速率与历史平均吞吐量之比最大的用户，在多用户分集增益与用户公平间取得折中的算法。
  - term: 空分多址
    def: 利用基站多天线在空间上区分不同方向或信道的用户，使多个用户在同一时频资源并行传输的技术，简称 SDMA。
  - term: 蜂窝系统
    def: 将大范围服务区划分为许多低功率基站覆盖的相邻小区、通过空间隔离重复使用频谱的移动通信网络架构。
  - term: 频率复用
    def: 在相隔足够远、同频干扰可接受的不同蜂窝小区内重复分配同一组射频信道以成倍扩容的技术。
  - term: 频率复用簇
    def: 蜂窝网络中一组相邻小区，它们合起来恰好无重复地用完整个系统的全部可用频段，包含的小区数记为 $N$。
  - term: 同频干扰
    def: 使用相同载波频率的邻近蜂窝小区信号泄露到当前小区、在接收端造成的干扰，是蜂窝系统的主要干扰源。
  - term: 信干比
    def: 接收端有用信号功率与同频干扰总功率之比，记为 $S/I$ 或 SIR，常用分贝表示。
  - term: 扇区化
    def: 在基站处用多副定向天线把全向圆形小区划分为 3 个 120° 或 6 个 60° 扇区，以减少同频干扰小区数的技术。
  - term: 小区分裂
    def: 在高话务热点区域增设低功率基站、把大覆盖小区拆分为更小的小区以提升单位面积容量的方法。
  - term: 切换
    def: 移动终端在通话或传输数据过程中跨出当前小区边界时，无缝将无线连接转移到目标邻区基站的过程。
  - term: 话务量
    def: 单位时间内用户占用信道资源的总业务强度，等于平均呼叫到达率与平均占用时长的乘积，单位为爱尔兰（Erlang）。
  - term: 爱尔兰 B 公式
    def: 在无排队等待的呼损制系统中，根据共享信道数 $C$ 与总话务量 $A$ 计算新呼叫被阻塞概率的公式。
  - term: 长期演进
    def: 第四代移动通信主流空中接口标准（4G LTE），采用下行 OFDMA、上行 SC-FDMA 与固定 15 kHz 子载波间隔。
  - term: 资源块
    def: LTE 和 NR 中频域包含 12 个连续子载波的基本物理层资源分配单位，简称 RB。
  - term: 资源粒子
    def: OFDM 时频网格里一个子载波加一个符号构成的最小物理资源单元，简称 RE。
  - term: 自适应调制编码
    def: 根据实时信道质量反馈动态切换调制阶数（如 QPSK 至 256-QAM）与纠错码率以逼近信道容量的技术，简称 AMC。
  - term: 新空口
    def: 第五代移动通信无线接入标准（5G NR），具备可扩展参数集、灵活时隙结构、毫米波和大规模 MIMO 支持。
  - term: 参数集
    def: 5G NR 中用来规定子载波间隔 $\Delta f = 15\times 2^\mu\text{ kHz}$ 及对应符号与时隙时长的波形配置集合，英文 numerology。
  - term: 毫米波
    def: 波长在毫米量级、频率通常位于 24 GHz 以上的高频无线电波段，可提供极大连续带宽但绕射弱、损耗高。
  - term: 波束管理
    def: 5G 高频多天线系统中通过波束扫描、测量反馈与动态跟踪，使收发窄波束始终准确对准的控制过程。

lessons:
  - id: wireless-intro
    chapter: 无线信道与路径损耗
    title: 无线通信面对的三个难题
    minutes: 10
    flow:
      - guess:
          id: g-intro
          type: choice
          prompt: 你拿着手机从阳台走进电梯，信号格数在两三秒内掉到底。相比插在网口上的光纤，无线信号在空气里传播最根本的区别是什么？
          options:
            - text: 干燥空气会像串联电阻一样把无线电磁波能量全部吸收发热
              why: 在常见移动通信频段（几百 MHz 到几 GHz），干燥空气对电磁波的吸收极弱，信号变差主要是距离扩散、墙体遮挡和多径抵消。
            - text: 向四周扩散并经障碍物反射干涉，强弱随位置剧变
              correct: true
            - text: 空气里的传播速度比铜线和光纤慢很多
              why: 电磁波在空气中的传播速度接近光速 $3\times 10^8\text{ m/s}$，甚至比铜线和光纤中还快。
          explain: 有线电缆把电磁能量束缚在封闭通道里，而无线信号在开放空间里传播，不仅能量向四周扩散，还会被墙体、车辆和金属外壳遮挡与反射。
      - card:
          title: 开放空间里的无线信道
          body: |
            有线通信中，铜缆或光纤把信号与外界隔开，信道特性基本恒定。在无线通信里，发射天线与接收天线之间没有物理连线，这段开放空间媒质就是**无线信道（wireless channel）**。

            电磁波在空气中的传播速度约等于光速 $c = 3\times 10^8\text{ m/s}$。载波频率 $f$ 决定了一个振荡周期内波向前走过的物理距离，称为**波长（wavelength）**：

            $$\lambda = \frac{c}{f}$$

            例如 2.4 GHz Wi-Fi 的波长是 $12.5\text{ cm}$，而 3 GHz 频段的波长只有 $10\text{ cm}$。波长直接决定了天线尺寸和电磁波绕过障碍物的能力。
      - item:
          id: q-wavelength
          type: number
          prompt: 取光速 $c = 3\times 10^8\text{ m/s}$，5 GHz Wi-Fi 载波在空气中的波长是多少厘米（cm）？
          answer: 6
          tolerance: 0.05
          unit: cm
          hint: 用光速除以载波频率得到米数后，再换算成厘米需要乘以多少？
          explain: 由 $\lambda = c/f = (3\times 10^8)/(5\times 10^9) = 0.06\text{ m}$，换算成厘米为 6 cm。频率越高，波长越短。
      - card:
          title: 衰减的跨度与两种尺度
          body: |
            无线信号离开天线后能量衰减极快。手机发射功率约 $20\text{ dBm}$（0.1 W），几公里外基站收到的功率往往只有 $-90\text{ dBm}$（$10^{-12}\text{ W}$），相差 $110\text{ dB}$，即功率缩小了 $10^{11}$ 倍。

            这种变化分成两个空间尺度：一是随距离拉远和楼宇遮挡缓慢变化的**大尺度衰落（large-scale fading）**；二是你在房间里只挪动手机半个波长（几厘米），多条反射波由同相变成反相叠加引起的剧烈波动，称为**小尺度衰落（small-scale fading）**。
      - card:
          title: 无线系统要解决的三个核心问题
          body: |
            开放空间和稀缺频谱给无线通信带来三个彼此交织的难题，后面的各章正是逐一拆解它们：

            1. **衰落**：信号随时可能因多径反相跌入谷底，必须靠分集、编码和调制对抗随机波动；
            2. **干扰**：同频邻近小区、同一用户的多径拖尾都会彼此串扰，需要 OFDM、均衡和频率规划来管理；
            3. **多用户共享**：国家划给运营商的频谱带宽极有限，必须通过多址接入、多天线与蜂窝复用，把同一段频谱卖给千千万万部手机同时使用。
      - item:
          id: q-loss-db
          type: number
          prompt: 某基站发射功率为 $30\text{ dBm}$，信号经无线信道传播后到达手机天线口时的接收功率为 $-85\text{ dBm}$。整条无线信道造成的总功率衰减是多少 dB？
          answer: 115
          tolerance: 0.1
          unit: dB
          hint: 发射功率和接收功率都已经用 dBm 表示，衰减的分贝数等于两者的什么运算？
          explain: 用分贝表示时，功率比值变成减法：$30\text{ dBm} - (-85\text{ dBm}) = 115\text{ dB}$，相当于功率衰减到原来的 $10^{-11.5}$。
      - item:
          id: q-fading-scale
          type: choice
          prompt: 你坐在室内原地不动，只把 2.4 GHz 手机水平移动了大约 6 cm（约半个波长），实测接收信号突然下降了 18 dB。这种现象主要属于什么？
          options:
            - text: 大尺度衰落，因为手机挪动后到基站的直线距离变长了
              why: 移动 6 cm 对几百米外的基站而言距离变化微乎其微，不会造成 18 dB 的平均衰减。
            - text: 小尺度衰落，多径相位关系在半波长内翻转
              correct: true
            - text: 接收机内部热噪声突然增大了 60 倍
              why: 室温下接收机热噪声底由温度和带宽决定，不会因移动几厘米而剧烈跳变。
            - text: 载波频率被手部移动拉偏到了接收机通带之外
              why: 缓慢手持移动带来的频率偏移不到几赫兹，远不足以让信号跑出接收机通带。
          explain: 半个波长的位移就会让两条路径的相位差改变约 $180^\circ$，从同相相加变成反相抵消，这是典型的小尺度衰落。
      - item:
          id: q-three-problems
          type: match
          prompt: 把无线通信面对的三个难题与对应的现实困扰连起来。
          pairs:
            - [衰落, 信号因多径抵消或遮挡突然变弱]
            - [干扰, 邻近基站或延迟回波落入同一频段]
            - [多用户共享, 数百部手机要同时使用有限的无线频谱]
          hint: 想想哪一个是单个信号自己变弱，哪一个是别人信号串进来，哪一个是大家抢同一条路？
          explain: 衰落关乎单条链路的随机起伏，干扰来自其他用户或自身回波的叠加，多用户共享则是如何在有限频谱上容纳大量终端。

  - id: free-space
    chapter: 无线信道与路径损耗
    title: 自由空间路径损耗与天线增益
    minutes: 12
    flow:
      - guess:
          id: g-fspl
          type: choice
          prompt: 在空旷无遮挡的太空里，把两个相同无线电台之间的距离拉远到原来的 2 倍，接收到的信号功率会变成原来的几分之几？
          options:
            - text: 二分之一，功率随距离线性减小
              why: 电磁波能量铺在以发射点为中心的球面上，球表面积不是按距离一次方增长。
            - text: 四分之一，因为球面面积增大到原来的 4 倍
              correct: true
            - text: 八分之一，因为三维空间体积增大到原来的 8 倍
              why: 功率流穿过的是半径为 $d$ 的球面（面积 $4\pi d^2$），而不是整个球体体积。
          explain: 发射功率均匀铺在半径为 $d$ 的球面 $4\pi d^2$ 上，距离翻倍时球面积变成 4 倍，单位面积截获的功率降为 $1/4$（即多损耗 6 dB）。
      - card:
          title: 各向同性天线与天线增益
          body: |
            假设空旷空间里有一副向所有方向均匀辐射能量的理想点源，称为**各向同性天线（isotropic antenna）**。发射功率为 $P_t$ 时，距离 $d$ 处的功率密度为 $P_t / (4\pi d^2)$。

            现实天线会把能量集中到需要的方向（比如基站朝水平地面辐射，不朝天空浪费）。主方向功率密度与各向同性参考天线之比就是**天线增益（antenna gain）** $G$，分贝单位写作 dBi（相对于各向同性天线）。天线本身不凭空造出能量，增益来自把能量聚拢到更窄方向。
      - card:
          title: 弗里斯公式与自由空间路径损耗
          body: |
            接收天线能从平面波里捞走多少能量，取决于它的**有效接收面积（effective aperture）** $A_e = G_r \lambda^2 / (4\pi)$。把发射功率密度乘以 $A_e$，就得到**弗里斯传输公式（Friis transmission formula）**：

            $$P_r = P_t G_t G_r \left(\frac{\lambda}{4\pi d}\right)^2$$

            去掉天线增益后，发射功率与接收功率之比称为**自由空间路径损耗（free-space path loss, FSPL）**：

            $$\text{FSPL} = \left(\frac{4\pi d}{\lambda}\right)^2, \quad \text{FSPL(dB)} = 20\lg\left(\frac{4\pi d}{\lambda}\right)$$
      - item:
          id: q-freq-double
          type: choice
          prompt: 保持距离和收发天线的增益 $G_t, G_r$ 不变，把载波频率从 1 GHz 提高到 2 GHz，自由空间路径损耗会怎样变化？为什么？
          options:
            - text: 减少 6 dB，因为高频电磁波穿透障碍和传播能力更强
              why: 高频电磁波本身并不减少自由空间扩散衰减，相反，高频下相同增益天线的有效接收面积反而变小。
            - text: 保持不变，真空中没有空气吸收
              why: 球面扩散确实与频率无关，但固定增益接收天线的有效面积正比于 $\lambda^2$，随频率升高而缩小。
            - text: 增加 6 dB，有效接收面积缩小为 1/4
              correct: true
            - text: 增加 12 dB，因为收发两端有效面积各自缩小为 1/4
              why: 发射端固定的是增益 $G_t$，已包含发射方向集中程度；损耗式里只出现一次 $\lambda^2$。
          explain: 频率加倍使波长 $\lambda$ 减半，固定增益接收天线的有效接收面积 $A_e = G_r\lambda^2/(4\pi)$ 缩小为 $1/4$，故 FSPL 增为 4 倍，即增加 $10\lg 4 \approx 6.02\text{ dB}$。
      - card:
          title: 例题：算一条自由空间链路的接收功率
          body: |
            发射端以 $P_t = 30\text{ dBm}$、$G_t = 10\text{ dBi}$ 在 $f = 1\text{ GHz}$ 上发射，距离 $d = 500\text{ m}$ 处的接收天线增益 $G_r = 2\text{ dBi}$。求自由空间路径损耗与接收功率。
          reveal:
            - title: 第 1 步：由载波频率求波长
              body: |
                $$\lambda = \frac{c}{f} = \frac{3\times 10^8}{10^9} = 0.3\text{ m}$$
            - title: 第 2 步：代入分贝式求自由空间路径损耗
              body: |
                $$\frac{4\pi d}{\lambda} = \frac{4\pi \times 500}{0.3} \approx 20944$$
                $$\text{FSPL(dB)} = 20\lg(20944) \approx 86.4\text{ dB}$$
            - title: 第 3 步：用分贝加减法求接收功率
              body: |
                $$P_r(\text{dBm}) = P_t + G_t + G_r - \text{FSPL} = 30 + 10 + 2 - 86.4 = -44.4\text{ dBm}$$
      - item:
          id: q-fspl-900
          type: number
          prompt: 取光速 $c = 3\times 10^8\text{ m/s}$，900 MHz 信号在自由空间传播 1 km，自由空间路径损耗 $\text{FSPL} = 20\lg(4\pi d/\lambda)$ 是多少 dB（保留一位小数）？
          answer: 91.5
          tolerance: 0.1
          unit: dB
          hint: 先算出 900 MHz 对应的波长 $\lambda$（约 $1/3\text{ m}$），再把 $d = 1000\text{ m}$ 代入 $4\pi d/\lambda$ 取对数。
          explain: 波长 $\lambda = (3\times 10^8)/(9\times 10^8) = 1/3\text{ m}$，于是 $4\pi d/\lambda = 12000\pi \approx 37699.1$，取 $20\lg(37699.1) \approx 91.53\text{ dB}$。
      - item:
          id: q-friis-pr
          type: number
          prompt: 一条自由空间链路发射功率 $P_t = 23\text{ dBm}$，发射天线增益 $G_t = 6\text{ dBi}$，接收天线增益 $G_r = 3\text{ dBi}$，实测自由空间路径损耗为 $92\text{ dB}$。接收天线端口得到的功率是多少 dBm？
          answer: -60
          tolerance: 0.1
          unit: dBm
          hint: 在分贝域里，弗里斯公式的乘除运算变成了什么运算？
          explain: 分贝域里增益相加、损耗相减：$P_r = 23 + 6 + 3 - 92 = -60\text{ dBm}$。
      - item:
          id: q-iso-energy
          type: choice
          prompt: 某定向天线的增益标称 12 dBi（约 15.8 倍）。把它装到发射机上后，下面哪句判断正确？
          options:
            - text: 天线内部把发射机总辐射功率放大了 15.8 倍
              why: 无源天线不能产生能量，发射到整个球面的总功率不会超过馈入天线的功率。
            - text: 在所有方向上收到的信号都增强了 12 dB
              why: 能量守恒决定了某些方向变强时，其他方向必然变弱。
            - text: 主波束方向功率密度增至 15.8 倍，其他方向辐射相应减弱
              correct: true
            - text: 接收端只要把天线换成定向的，就能突破自由空间 $1/d^2$ 的扩散规律
              why: 提高天线增益只给功率乘以常数倍数，无法改变自由空间功率随 $1/d^2$ 衰减的斜率。
          explain: 天线是无源器件，增益靠压缩辐射方向图把有限功率集中到主波束，因此总辐射功率不变，非主方向功率减小。

  - id: propagation
    chapter: 无线信道与路径损耗
    title: 反射、绕射、两径模型与阴影衰落
    minutes: 13
    flow:
      - guess:
          id: g-prop
          type: choice
          prompt: 你在城市街道拐角后面，完全看不见基站铁塔，但手机依然能正常通话。电磁波主要靠什么方式到达你手里？
          options:
            - text: 手机自动提高了发射频率，让波直接穿透所有钢筋混凝土大楼
              why: 钢筋混凝土对几 GHz 电磁波衰减极大，且提高频率穿透反而更差。
            - text: 经周围楼墙反射、绕过棱角弯曲并经表面散射到达
              correct: true
            - text: 手机自动改用空气声波把语音中继传到了基站
              why: 移动通信始终靠电磁波传输，声波在空气里衰减太快且距离极短。
          explain: 真实城市环境并非真空，反射、绕射和散射共同让电磁波能绕开障碍物到达非视距位置，也同时带来了更陡的路径衰减与遮挡波动。
      - card:
          title: 反射、绕射与散射
          body: |
            电磁波在真实环境中主要有三种传播机制：

            - **反射（reflection）**：遇到比波长大得多的光滑表面（地面、大楼幕墙）时折返，常伴随相位反转；
            - **绕射（diffraction）**：遇到大楼棱角、山脊等尖锐障碍边缘时弯曲进入阴影区；波长越长，绕射能力越强；
            - **散射（scattering）**：遇到树叶、路灯杆、粗糙墙面等尺寸接近或小于波长的物体时向四面八方弥散。
      - card:
          title: 两径模型与 $1/d^4$ 规律
          body: |
            平坦地面上，接收天线同时收到一条直射波和一条经地面反射（相位反转 $180^\circ$）的反射波，构成**两径模型（two-ray model）**。

            近处两波路程差大，干涉使功率上下震荡；当距离超过转折距离 $d_c = 4 h_t h_r / \lambda$（$h_t, h_r$ 为收发天线高度）后，直射波与反相反射波几乎抵消，接收功率近似为：

            $$P_r \approx P_t G_t G_r \frac{h_t^2 h_r^2}{d^4}$$

            此时功率不再按 $1/d^2$（每十倍距 20 dB），而是按 $1/d^4$（每十倍距 40 dB）陡降，且与频率 $\lambda$ 近似无关。
      - item:
          id: q-tworay-dc
          type: number
          prompt: 一条开阔公路上的两径地面反射场景中，基站天线高 $h_t = 25\text{ m}$，车载天线高 $h_r = 2\text{ m}$，载波波长 $\lambda = 0.25\text{ m}$。按 $d_c = 4 h_t h_r / \lambda$ 计算转折距离 $d_c$ 是多少米？
          answer: 800
          tolerance: 1
          unit: m
          hint: 直接把 $h_t = 25$、$h_r = 2$ 和 $\lambda = 0.25$ 代入转折距离式子，分子和分母分别是多少？
          explain: 代入得 $d_c = 4 \times 25 \times 2 / 0.25 = 200 / 0.25 = 800\text{ m}$。超过 800 m 后平均接收功率按 $1/d^4$ 衰减。
      - card:
          title: 对数距离模型与阴影衰落
          body: |
            复杂城区的建筑分布无法逐面建模，工程上用经验统计公式描述平均衰减，称为对数距离路径损耗模型：

            $$\overline{PL}(d) = \overline{PL}(d_0) + 10 n \lg\!\left(\frac{d}{d_0}\right)$$

            其中 $d_0$ 是参考距离，$n$ 是**路径损耗指数（path loss exponent）**：自由空间 $n = 2$，开阔郊区约 2.5–3，密集城区约 3–4.5，室内有遮挡可达 4–6。

            在同一距离 $d$ 的不同街角，因建筑物遮挡厚薄不同，实测路径损耗还会叠加零均值正态随机量 $X_\sigma \sim \mathcal{N}(0, \sigma^2)$（单位 dB），这就是**阴影衰落（shadowing）**。分贝值服从正态分布，意味着线性功率服从**对数正态分布（log-normal distribution）**。
      - card:
          title: 例题：计算城区损耗与阴影跌破门限概率
          body: |
            某城区取参考距离 $d_0 = 100\text{ m}$ 处平均损耗 $80\text{ dB}$，路径损耗指数 $n = 3.2$，阴影衰落标准差 $\sigma = 8\text{ dB}$。求 $d = 1000\text{ m}$ 处的平均路径损耗，以及预留 $12\text{ dB}$ 余量时因阴影遮挡导致信号跌破门限的概率。
          reveal:
            - title: 第 1 步：代入对数距离模型求平均路径损耗
              body: |
                距离从 $100\text{ m}$ 到 $1000\text{ m}$ 增大 10 倍，$\lg(1000/100) = 1$：
                $$\overline{PL}(1000\text{ m}) = 80 + 10 \times 3.2 \times 1 = 112\text{ dB}$$
            - title: 第 2 步：把余量折算成阴影正态分布的标准差倍数
              body: |
                当额外阴影损耗 $X_\sigma > 12\text{ dB}$ 时接收功率低于门限。标准差 $\sigma = 8\text{ dB}$，对应的归一化门限为 $z = 12 / 8 = 1.5$。
            - title: 第 3 步：查标准正态右尾概率 $Q(z)$
              body: |
                $$P(X_\sigma > 12) = Q\!\left(\frac{12}{8}\right) = Q(1.5) \approx 6.68\%$$
                说明在 1 km 处约有 93.3% 的位置能满足接收门限。
      - item:
          id: q-logdist-inc
          type: number
          prompt: 某郊区信道遵循对数距离路径损耗模型 $\overline{PL}(d) = \overline{PL}(d_0) + 10n\lg(d/d_0)$，路径损耗指数 $n = 3.8$。当终端距离基站从 $50\text{ m}$ 移动到 $500\text{ m}$ 时，平均路径损耗增加多少 dB？
          answer: 38
          tolerance: 0.1
          unit: dB
          hint: 距离从 50 m 到 500 m 扩大了多少倍？这个倍数的常用对数是多少？
          explain: 距离增大 10 倍，故 $\lg(500/50) = 1$，损耗增加 $10 \times 3.8 \times 1 = 38\text{ dB}$。
      - item:
          id: q-shadow-prob
          type: number
          prompt: 某城区阴影衰落分贝值服从零均值正态分布，标准差 $\sigma = 6\text{ dB}$。若设计时只留了 $6\text{ dB}$ 阴影余量，已知标准正态右尾概率 $Q(1) \approx 0.1587$，接收功率跌破门限的概率约是多少（填百分比数值，保留一位小数）？
          answer: 15.9
          tolerance: 0.2
          unit: '%'
          hint: 额外阴影损耗超过 6 dB 相当于标准正态随机变量大于几个标准差？
          explain: $P(X_\sigma > 6) = Q(6/6) = Q(1) \approx 0.1587$，即约 15.9%。要压低这个概率，就必须增大阴影余量。
      - item:
          id: q-mech-match
          type: match
          prompt: 把现实中常见的无线传播现象与主要物理机制配对。
          pairs:
            - [反射, 电磁波被光滑玻璃幕墙整面折返]
            - [绕射, 电磁波贴着大楼屋顶边缘弯进背面的街道]
            - [散射, 电磁波撞上茂密树冠后向各个方向弥散]
            - [阴影衰落, 同距离两条街因高楼遮挡不同导致平均功率相差 10 dB]
          hint: 先区分障碍物尺寸远大于波长、处于尖锐边缘，还是大量细小不规则物体。
          explain: 光滑大平面对应反射，尖锐边缘弯进阴影区是绕射，粗糙细小物体引起散射，大障碍物遮挡引起的慢起伏是阴影衰落。

  - id: link-budget
    chapter: 无线信道与路径损耗
    title: 接收机灵敏度与无线链路预算
    minutes: 12
    flow:
      - guess:
          id: g-budget
          type: choice
          prompt: 一家运营商要在新城区建基站，发射功率已经定好，怎样才能在不换基站的前提下算出单个基站最远能覆盖几公里？
          options:
            - text: 用发射功率直接除以灵敏度即可得到公里数
              why: 发射功率与灵敏度之差只是总功率余度，还必须计入天线增益、线缆损耗、衰落余量和环境的路径损耗模型。
            - text: 核算全部增益损耗与余量得最大允许路径损耗，再反推距离
              correct: true
            - text: 只要载波频率确定，任何地形下基站的最大覆盖半径都是同一常数
              why: 城市高楼、郊区和农村的路径损耗指数差异很大，同样频段的覆盖半径可能相差数倍。
          explain: 工程上把全部增益与损耗列成收支账本（链路预算），先算出信道最多能吃掉多少 dB 路径损耗，再套路径损耗模型反求覆盖半径。
      - card:
          title: 噪声底、噪声系数与接收机灵敏度
          body: |
            室温（$T = 290\text{ K}$）下电阻热噪声的功率谱密度约为 $N_0 = k_B T \approx 4.0\times 10^{-21}\text{ W/Hz}$，换算成分贝是 $-174\text{ dBm/Hz}$。

            带宽为 $B$ 时，输入端热噪声功率为 $(-174 + 10\lg B)\text{ dBm}$。接收机内部放大器和混频器还会再加噪，使输出信噪比比输入恶化 $NF$（分贝），这叫**噪声系数（noise figure）**。为了正确解调，输出信噪比还必须不低于门限 $\text{SNR}_{\text{min}}$，于是最低可用输入功率，即**接收机灵敏度（receiver sensitivity）** 为：

            $$P_{\text{min}}(\text{dBm}) = -174 + 10\lg B + NF + \text{SNR}_{\text{min}}$$
      - item:
          id: q-sens
          type: number
          prompt: 室温热噪声谱密度取 $-174\text{ dBm/Hz}$。某接收机信号带宽 $B = 1\text{ MHz}$（$10\lg B = 60\text{ dBHz}$），噪声系数 $NF = 7\text{ dB}$，所需最低解调信噪比 $\text{SNR}_{\text{min}} = 9\text{ dB}$。求接收机灵敏度（单位 dBm）。
          answer: -98
          tolerance: 0.1
          unit: dBm
          hint: 接收机灵敏度由室温热噪声底、带宽分贝数、噪声系数和解调信噪比门限四项相加得到，逐项加起来是多少？
          explain: $P_{\text{min}} = -174 + 60 + 7 + 9 = -98\text{ dBm}$。带宽越宽或解调阶数要求越高，灵敏度数值越高（接收机越“挑剔”）。
      - card:
          title: 链路预算与最大允许路径损耗
          body: |
            把发射端到接收端所有的增益与损耗列成一张分贝账本，称为**链路预算（link budget）**。为防止阴影和突发波动导致断线，还要预留**衰落余量（fading margin）** $M$。

            把发射功率、收发天线增益加起来，扣掉馈线/穿透等其他损耗 $L_{\text{other}}$、衰落余量 $M$ 以及接收机灵敏度 $P_{\text{min}}$，剩下的就是信道最多能承受的**最大允许路径损耗（maximum allowable path loss, MAPL）**：

            $$\text{MAPL} = P_t + G_t + G_r - L_{\text{other}} - M - P_{\text{min}}$$
      - card:
          title: 例题：由链路预算反求小区覆盖半径
          body: |
            某基站 $P_t = 43\text{ dBm}$，$G_t = 15\text{ dBi}$，手机 $G_r = 0\text{ dBi}$，馈线等损耗 $L_{\text{other}} = 2\text{ dB}$，衰落余量 $M = 10\text{ dB}$。接收带宽 $10\text{ MHz}$，$NF = 6\text{ dB}$，$\text{SNR}_{\text{min}} = 4\text{ dB}$。该城区路径损耗模型为 $PL(d) = 128 + 35\lg d_{\text{km}}$，求最大覆盖半径。
          reveal:
            - title: 第 1 步：算出接收机灵敏度
              body: |
                $10\lg(10^7) = 70\text{ dBHz}$，所以：
                $$P_{\text{min}} = -174 + 70 + 6 + 4 = -94\text{ dBm}$$
            - title: 第 2 步：列链路预算求最大允许路径损耗
              body: |
                $$\text{MAPL} = 43 + 15 + 0 - 2 - 10 - (-94) = 140\text{ dB}$$
            - title: 第 3 步：代入路径损耗模型反解覆盖距离
              body: |
                令 $128 + 35\lg d_{\text{km}} = 140$，得 $\lg d_{\text{km}} = 12/35 \approx 0.343$，于是：
                $$d_{\text{km}} = 10^{0.343} \approx 2.20\text{ km}$$
      - item:
          id: q-mapl
          type: number
          prompt: 一条下行链路中，基站发射功率 $P_t = 40\text{ dBm}$，基站天线增益 $G_t = 14\text{ dBi}$，终端天线增益 $G_r = 0\text{ dBi}$，馈线与人体损耗共 $4\text{ dB}$，阴影衰落余量 $12\text{ dB}$，接收机灵敏度为 $-102\text{ dBm}$。求最大允许路径损耗 MAPL（单位 dB）。
          answer: 140
          tolerance: 0.1
          unit: dB
          hint: 减去负的灵敏度（$-(-102)$）等价于加上正数，把发射功率、增益和去掉负号后的灵敏度数值加总，再扣掉损耗和余量是多少？
          explain: $\text{MAPL} = 40 + 14 + 0 - 4 - 12 - (-102) = 38 + 102 = 140\text{ dB}$。
      - item:
          id: q-radius
          type: number
          prompt: 已知某基站链路预算算出的最大允许路径损耗 $\text{MAPL} = 148\text{ dB}$，该区域路径损耗公式为 $PL(d) = 130 + 36\lg d_{\text{km}}$。求该基站的最大覆盖半径 $d_{\text{km}}$（单位 km，保留两位小数）。
          answer: 3.16
          tolerance: 0.05
          unit: km
          hint: 先令 $130 + 36\lg d_{\text{km}} = 148$ 求出 $\lg d_{\text{km}}$，它恰好等于 $0.5$，那么 $10^{0.5}$ 约等于多少？
          explain: 由 $36\lg d_{\text{km}} = 148 - 130 = 18$ 得 $\lg d_{\text{km}} = 0.5$，因此 $d_{\text{km}} = \sqrt{10} \approx 3.16\text{ km}$。
      - item:
          id: q-ul-dl-limit
          type: choice
          prompt: 实际移动通信中，手机最大发射功率约 23 dBm，而宏基站发射功率常达 43 dBm（相差 20 dB）。尽管基站接收机噪声系数略优于手机，蜂窝小区的覆盖半径往往首先受哪条链路限制？
          options:
            - text: 下行链路，因为基站同时服务许多手机导致单机功率远低于手机
              why: 即使分摊到单个信道，宏基站总功率和天线增益仍明显高于电池供电的手机，下行通常不是覆盖瓶颈。
            - text: 上行链路，手机发射功率低，基站常先听不清边缘终端
              correct: true
            - text: 上下行覆盖半径必然完全相等，因为电磁波传播满足互易性
              why: 无线信道的路径损耗确实上下行近似互易，但两端发射功率和灵敏度不对称，导致上下行 MAPL 不同。
            - text: 取决于手机电池当前剩余电量是否低于 50%
              why: 正常电量下手机发射功放仍能输出额定最大功率，覆盖受限源于标称功率差距而非剩余电量。
          explain: 手机受电池体积和人体电磁辐射限值约束，最大发射功率比基站低约 20 dB，基站接收灵敏度仅好几 dB，因此小区边缘往往是“手机听得见基站、基站听不清手机”，上行先受限。

  - id: multipath-model
    chapter: 多径衰落与多普勒
    title: 多径信道、抽头延迟线与时延扩展
    minutes: 12
    flow:
      - guess:
          id: g-multipath
          type: choice
          prompt: 你在大礼堂里拍一下手，听到的不只是一声清脆的“啪”，而是一串拖长的回声。无线电脉冲在城市楼群间传播时，接收天线收到的是什么？
          options:
            - text: 只有直射路脉冲，反射波全部消失
              why: 建筑物幕墙、地面和车辆都会反射电磁波，反射分量携带着可观的能量到达天线。
            - text: 幅度、时延和相位各异的一串叠加脉冲副本
              correct: true
            - text: 波形完全不变的单个脉冲，只是载波频率被楼房压低了一半
              why: 静止建筑物不会把载波频率压低一半，多条路程差异产生的是时延和相位差。
          explain: 电磁波像声音在礼堂里一样，会经多面墙体和地面反射后先后到达接收端，形成多个时延、幅度和相位各异的叠加副本。
      - card:
          title: 多径传播与基带冲激响应
          body: |
            同一发射信号经直射、反射、绕射和散射沿多条路程到达接收天线，称为**多径传播（multipath propagation）**。

            设第 $i$ 条路径的幅度衰减为 $a_i(t)$、传播时延为 $\tau_i(t)$，载波频率为 $f_c$。把带通信号转换到复包络基带后，信道的时变单位冲激响应写作：

            $$h(\tau, t) = \sum_{i} a_i(t)\,e^{-j 2\pi f_c \tau_i(t)}\,\delta(\tau - \tau_i(t))$$

            注意相位项 $2\pi f_c \tau_i(t)$ 对微小路程差非常敏感：2 GHz 下路程差只要变动 $7.5\text{ cm}$（半个波长），相位就翻转 $180^\circ$。
      - card:
          title: 离散时间的抽头延迟线模型
          body: |
            真实数字通信系统的带宽 $W$ 是有限的，采样间隔 $T_s = 1/W$ 决定了接收机在时间上的最小分辨力。

            若两条物理路径到达时间差远小于 $1/W$，接收机分不开它们，会把落进同一 $1/W$ 时间格内的所有路径按复数相加合成一个等效复增益 $h_\ell[m]$。于是宽带无线信道可建模为一条**抽头延迟线（tapped delay line）**：

            $$y[m] = \sum_{\ell=0}^{L-1} h_\ell[m]\,x[m - \ell] + w[m]$$

            其中每个抽头间隔 $1/W$，抽头总数约为 $L = 1 + \lfloor W\tau_{\text{max}} \rfloor$。
      - item:
          id: q-taps
          type: number
          prompt: 某无线系统信号带宽 $W = 10\text{ MHz}$（时间分辨单元 $1/W = 0.1\ \mu\text{s}$），多径信道的最早路径与最晚显著路径时延差 $\tau_{\text{max}} = 1.5\ \mu\text{s}$。按公式 $L = 1 + W\tau_{\text{max}}$ 估算离散抽头延迟线共有多少个抽头？
          answer: 16
          tolerance: 0.1
          unit: 个
          hint: 先算最大时延扩展包含了多少个 $0.1\ \mu\text{s}$ 的抽头间隔，别忘了加上第 0 号主抽头。
          explain: $W\tau_{\text{max}} = 10\times 10^6 \times 1.5\times 10^{-6} = 15$，加上第 0 个抽头共 $L = 1 + 15 = 16$ 个抽头。
      - card:
          title: 功率延迟分布与均方根时延扩展
          body: |
            把信道各时延处的平均接收功率 $P(\tau)$ 画出来，称为**功率延迟分布（power delay profile, PDP）**。最早与最晚显著路径的时间跨度称为**时延扩展（delay spread）** $\tau_{\text{max}}$。

            为了不被极微弱的远端回波带偏，工程上更常用功率加权的时延标准差，即**均方根时延扩展（RMS delay spread）** $\sigma_\tau$：

            $$\bar{\tau} = \frac{\sum_k P_k \tau_k}{\sum_k P_k}, \quad \overline{\tau^2} = \frac{\sum_k P_k \tau_k^2}{\sum_k P_k}, \quad \sigma_\tau = \sqrt{\overline{\tau^2} - \bar{\tau}^2}$$

            室内办公室的 $\sigma_\tau$ 常在几十纳秒，而城区宏蜂窝可达数微秒。
      - card:
          title: 例题：求两径信道的均方根时延扩展
          body: |
            某多径信道有两条显著路径，到达时刻分别为 $\tau_1 = 0\ \mu\text{s}$ 和 $\tau_2 = 2\ \mu\text{s}$，两条路径平均功率相等（归一化权重各为 $0.5$）。求平均附加时延 $\bar{\tau}$ 与均方根时延扩展 $\sigma_\tau$。
          reveal:
            - title: 第 1 步：计算功率加权的平均附加时延
              body: |
                $$\bar{\tau} = 0.5 \times 0 + 0.5 \times 2 = 1\ \mu\text{s}$$
            - title: 第 2 步：计算时延平方的加权均值
              body: |
                $$\overline{\tau^2} = 0.5 \times 0^2 + 0.5 \times 2^2 = 2\ \mu\text{s}^2$$
            - title: 第 3 步：套方差开方公式得均方根时延扩展
              body: |
                $$\sigma_\tau = \sqrt{\overline{\tau^2} - \bar{\tau}^2} = \sqrt{2 - 1^2} = 1\ \mu\text{s}$$
      - item:
          id: q-rms-delay
          type: number
          prompt: 某多径信道有两条路径，到达时延为 $\tau_1 = 0\ \mu\text{s}$ 和 $\tau_2 = 4\ \mu\text{s}$，功率权重分别为 $0.75$ 和 $0.25$。计算该信道的均方根时延扩展 $\sigma_\tau$（单位 $\mu\text{s}$，保留两位小数）。
          answer: 1.73
          tolerance: 0.03
          unit: μs
          hint: 先求加权平均 $\bar{\tau}$ 和平方加权平均 $\overline{\tau^2}$，再用 $\sqrt{\overline{\tau^2} - \bar{\tau}^2}$ 开方。
          explain: $\bar{\tau} = 0.75\times 0 + 0.25\times 4 = 1\ \mu\text{s}$，$\overline{\tau^2} = 0.75\times 0 + 0.25\times 16 = 4\ \mu\text{s}^2$，于是 $\sigma_\tau = \sqrt{4 - 1} = \sqrt{3} \approx 1.73\ \mu\text{s}$。
      - item:
          id: q-narrowband-tap
          type: choice
          prompt: 若某系统信号带宽非常窄，使得 $1/W \gg \tau_{\text{max}}$，它的离散抽头延迟线模型会退化成什么形态？
          options:
            - text: 单抽头模型，但该抽头复增益仍因多径干涉剧烈起伏
              correct: true
            - text: 无衰落的理想加性高斯白噪声信道，多径影响随之完全消失
              why: 分辨不开不等于多径消失；所有路径落进同一个抽头后仍会按各自相位干涉相加，导致 $h_0[m]$ 随机起伏。
            - text: 抽头数量趋近无穷大，系统出现无法消除的码间干扰
              why: 抽头数约为 $1 + \lfloor W\tau_{\text{max}} \rfloor$，带宽越窄可分辨抽头反而越少。
            - text: 信道冲激响应变成纯实数，不再包含相位因子
              why: 各路径复相位 $e^{-j2\pi f_c \tau_i}$ 叠加合成的 $h_0[m]$ 依然是复数，具有随机相位。
          explain: 当 $W\tau_{\text{max}} \ll 1$ 时所有多径落入同一个时间分辨单元（单一抽头），不会把相邻码元拖混，但多径干涉仍使该抽头复增益剧烈波动。
      - item:
          id: q-phase-shift
          type: choice
          prompt: 在基带等效冲激响应 $h(\tau, t) = \sum_i a_i(t) e^{-j2\pi f_c \tau_i(t)}\delta(\tau - \tau_i(t))$ 中，手机仅移动几厘米时，哪一部分的变化最先引起接收信号幅度剧烈波动？
          options:
            - text: 路径衰减 $a_i(t)$ 因自由空间传播距离拉长而发生翻倍
              why: 几厘米位移相对几百米传播距离微不足道，幅度项 $a_i(t)$ 几乎不变。
            - text: 时延 $\tau_i(t)$ 改变几厘米路程导致码元错位好几个周期
              why: 光走 10 cm 仅需约 $0.33\text{ ns}$，远小于微秒级的常规码元周期，不会让脉冲跳到别的抽头。
            - text: 载波相位项大幅旋转，多径由相加变相消
              correct: true
            - text: 接收机热噪声 $N_0$ 随位置剧变
              why: 热噪声源于接收机内部电子热运动，与天线小范围空间位置无关。
          explain: 载波频率 $f_c$ 高达吉赫兹量级，微小路程差 $c\Delta\tau$ 只要达到半波长（几厘米），$2\pi f_c \Delta\tau$ 就翻转 $\pi$ 弧度，使同相叠加变成反相抵消。

  - id: coherence
    chapter: 多径衰落与多普勒
    title: 相干带宽、多普勒频移与衰落分类
    minutes: 13
    flow:
      - guess:
          id: g-coherence
          type: choice
          prompt: 救护车鸣着警笛朝你飞驰而来，擦身而过那一刻，你听到的笛声音调会突然变低。手机在高铁上高速移动时，收到的无线载波频率会发生什么？
          options:
            - text: 电磁波速度太快，高铁速度不会引起任何频率偏移
              why: 只要收发端存在相对运动，电磁波同样产生多普勒频移，高铁 300 km/h 在 2 GHz 频段可带来数百赫兹频偏。
            - text: 迎着波源前进的路径频率升高，背离波源的路径频率降低，多径合成后信号频谱变宽
              correct: true
            - text: 所有路径的载波频率都统一升高相同的数值，信号本身不再随时间起伏
              why: 周围散射波来自四面八方，不同入射角对应的频移有正有负，叠加后正好造成随时间起伏的衰落。
          explain: 相对运动会使电磁波产生多普勒频移，且不同方向到达的多径频移各不相同，这直接决定了无线信道随时间变化有多快。
      - card:
          title: 相干带宽与频率选择性
          body: |
            两条路径到达时延差为 $\Delta\tau$，对频率 $f$ 引入的相位差是 $2\pi f \Delta\tau$。频率相隔太远时，一处同相的两径在另一处会反相抵消。

            信道频率响应保持高度相关的范围称为**相干带宽（coherence bandwidth）** $B_c$，按相关系数 0.5 常估算为：

            $$B_c \approx \frac{1}{5\sigma_\tau}$$

            （相关系数 0.9 时约 $1/(50\sigma_\tau)$。）信号带宽 $B_s < B_c$ 时各频段同起同落，称**平坦衰落（flat fading）**；$B_s > B_c$ 时不同频段衰减不同，称**频率选择性衰落（frequency-selective fading）**，时域表现为码间干扰。
      - item:
          id: q-bc-calc
          type: number
          prompt: 某室内办公信道的均方根时延扩展 $\sigma_\tau = 0.25\ \mu\text{s}$。按工程经验式 $B_c = 1/(5\sigma_\tau)$ 计算该信道的相干带宽（单位 kHz）。
          answer: 800
          tolerance: 1
          unit: kHz
          hint: 把 $0.25\ \mu\text{s}$ 换成秒（$2.5\times 10^{-7}\text{ s}$），先算 $5\sigma_\tau$ 再取倒数，结果换成 kHz 是多少？
          explain: $5\sigma_\tau = 1.25\times 10^{-6}\text{ s}$，取倒数得 $B_c = 8\times 10^5\text{ Hz} = 800\text{ kHz}$。
      - card:
          title: 多普勒频移、多普勒扩展与相干时间
          body: |
            终端以速度 $v$ 移动，某条电磁波入射方向与运动方向夹角为 $\theta$，引起的频率偏移称为**多普勒频移（Doppler shift）**：

            $$f_d = \frac{v}{\lambda}\cos\theta = \frac{v f_c}{c}\cos\theta$$

            最大频移为 $f_D = v/\lambda$。当散射波从四面八方到达，频移分布在 $[-f_D, +f_D]$ 之间，展宽宽度 $B_D = 2f_D$ 称为**多普勒扩展（Doppler spread）**。

            信道冲激响应保持高度相关的时间窗口称为**相干时间（coherence time）**，常用几何平均经验式估算：

            $$T_c \approx \frac{0.423}{f_D}$$

            码元周期 $T_s < T_c$ 时称**慢衰落（slow fading）**，$T_s > T_c$ 时信道在一个码元内就剧烈变化，称**快衰落（fast fading）**。
      - card:
          title: 例题：判定移动终端的衰落类型
          body: |
            汽车以 $v = 72\text{ km/h}$ 行驶，载波频率 $f_c = 1.8\text{ GHz}$，信道均方根时延扩展 $\sigma_\tau = 0.5\ \mu\text{s}$。若信号带宽 $B_s = 1\text{ MHz}$、码元周期 $T_s = 1\ \mu\text{s}$，求 $B_c, f_D, T_c$ 并判断衰落类型。
          reveal:
            - title: 第 1 步：算相干带宽，判断频域衰落类型
              body: |
                $$B_c \approx \frac{1}{5 \times 0.5\ \mu\text{s}} = 400\text{ kHz}$$
                因 $B_s = 1\text{ MHz} > 400\text{ kHz}$，信道呈频率选择性衰落。
            - title: 第 2 步：统一速度单位为 m/s，求最大多普勒频移
              body: |
                $v = 72 / 3.6 = 20\text{ m/s}$，$\lambda = (3\times 10^8)/(1.8\times 10^9) = 1/6\text{ m}$：
                $$f_D = \frac{v}{\lambda} = \frac{20}{1/6} = 120\text{ Hz}$$
            - title: 第 3 步：算相干时间，判断时域衰落类型
              body: |
                $$T_c \approx \frac{0.423}{120} \approx 3.53\text{ ms}$$
                因 $T_s = 1\ \mu\text{s} \ll 3.53\text{ ms}$，信道呈慢衰落。
      - item:
          id: q-doppler-hsr
          type: number
          prompt: 取光速 $c = 3\times 10^8\text{ m/s}$。高铁以 $v = 360\text{ km/h}$ 行驶，基站载波频率 $f_c = 2.1\text{ GHz}$，求最大多普勒频移 $f_D$（单位 Hz）。
          answer: 700
          tolerance: 1
          unit: Hz
          hint: 先把 360 km/h 除以 3.6 换算成 m/s，再套用 $f_D = v f_c / c$。
          explain: $v = 360 / 3.6 = 100\text{ m/s}$，代入得 $f_D = 100 \times (2.1\times 10^9) / (3\times 10^8) = 700\text{ Hz}$。
      - item:
          id: q-tc-calc
          type: number
          prompt: 某移动场景下测得最大多普勒频移 $f_D = 150\text{ Hz}$。按常用经验式 $T_c = 0.423 / f_D$ 计算信道相干时间（单位 ms，保留两位小数）。
          answer: 2.82
          tolerance: 0.02
          unit: ms
          hint: 用 0.423 除以 150 得到的是秒，再乘以 1000 换成毫秒是多少？
          explain: $T_c = 0.423 / 150 = 0.00282\text{ s} = 2.82\text{ ms}$。速度越快或载频越高，相干时间越短。
      - item:
          id: q-fading-quad
          type: choice
          prompt: 无线通信中“快衰落”和“慢衰落”的划分取决于什么关系？
          options:
            - text: 取决于信号占用带宽是否超过了信道的相干带宽
              why: 信号带宽与相干带宽的比较划分的是平坦衰落与频率选择性衰落，属于频域维度。
            - text: 码元周期与相干时间的相对大小
              correct: true
            - text: 只取决于汽车行驶车速是否超过 60 km/h
              why: 同一车速下，低速长码元可能遇到快衰落，而高速微秒级短码元依然属于慢衰落。
            - text: 路径损耗指数 $n$ 是否大于 3
              why: 路径损耗指数描述的是大尺度平均衰减，与小尺度衰落快慢无关。
          explain: 快/慢衰落对比的是码元持续时长 $T_s$ 与信道保持相关的时长 $T_c$：只要一个码元里信道基本不变（$T_s \ll T_c$），就是慢衰落；否则就是快衰落。

  - id: rayleigh-rician
    chapter: 多径衰落与多普勒
    title: 瑞利衰落、莱斯衰落与多普勒谱
    minutes: 12
    flow:
      - guess:
          id: g-rayleigh
          type: choice
          prompt: 在密集闹市里，没有一条直线通向基站的通路，手机天线同时收到几十条来自不同方向、相位完全随机的反射波。合起来的信号包络最可能呈现什么统计规律？
          options:
            - text: 所有反射波会刚好互相抵消，接收功率永远恒等于零
              why: 随机相位合成的期望为零，但方差等于各径功率之和，瞬时幅度是在正值上随机起伏而非恒为零。
            - text: 信号幅度基本稳定在平均值附近，几乎不会跌落到平均功率的 1/10 以下
              why: 随机游走合成的复矢量经常靠近原点，跌落 10 dB 以上（功率不足均值 1/10）的概率接近 10%。
            - text: 同相和正交分量近似独立正态分布，合成幅度服从偏斜的非负分布，偶尔会跌得很深
              correct: true
          explain: 大量独立随机相位的正弦波叠加后，由中心极限定理，同相与正交分量趋近零均值正态分布，合成包络服从瑞利分布，存在不可忽视的深跌概率。
      - card:
          title: 瑞利衰落：包络与功率的分布
          body: |
            当收发之间没有强直射径、只有大量独立散射径时，窄带复信道增益 $h = I + jQ$ 的实部 $I$ 和虚部 $Q$ 由中心极限定理近似独立服从 $\mathcal{N}(0, \sigma^2)$。

            这种信道称为**瑞利衰落（Rayleigh fading）**。它的包络 $R = |h| = \sqrt{I^2 + Q^2}$ 服从瑞利分布，而接收瞬时功率 $P = |h|^2 = I^2 + Q^2$ 恰好服从均值为 $\bar{P} = 2\sigma^2$ 的指数分布：

            $$P(|h|^2 < x) = 1 - e^{-x/\bar{P}}$$

            例如归一化平均功率 $\bar{P} = 1$ 时，信号跌落超过 $10\text{ dB}$（$|h|^2 < 0.1$）的概率是 $1 - e^{-0.1} \approx 9.52\%$，跌落超过 $20\text{ dB}$（$|h|^2 < 0.01$）的概率约 $1.0\%$。
      - item:
          id: q-rayleigh-out
          type: number
          prompt: 某瑞利衰落信道的瞬时功率服从均值为 1 的指数分布 $P(|h|^2 < x) = 1 - e^{-x}$。求瞬时功率跌落到平均功率的 $1/20$（即 $x = 0.05$，约 $-13\text{ dB}$）以下的概率（填百分比数值，保留两位小数）。
          answer: 4.88
          tolerance: 0.1
          unit: '%'
          hint: 计算 $1 - e^{-0.05}$，注意当 $x$ 很小时 $1 - e^{-x}$ 略小于 $x$。
          explain: $1 - e^{-0.05} \approx 1 - 0.95123 = 0.04877$，即约 4.88%。
      - card:
          title: 视距传播与莱斯衰落
          body: |
            如果收发天线之间存在一条无遮挡的直线通路，称为**视距传播（line-of-sight, LOS）**。此时复信道增益变成“确定直射分量 + 零均值复高斯散射分量”，信道进入**莱斯衰落（Rician fading）**。

            直射径的强弱用**莱斯因子（Rician K-factor）** 衡量：

            $$K = \frac{P_{\text{LOS}}}{P_{\text{scatter}}}$$

            $K = 0$ 时没有直射径，退化为瑞利衰落；$K$ 越大，直射径越占主导，信号起伏越平缓；当 $K \to \infty$ 时衰落消失，退化为恒定的加性高斯白噪声信道。
      - card:
          title: 多普勒谱：经典的 U 形曲线
          body: |
            在移动场景中，平稳瑞利衰落增益 $h(t)$ 的自相关函数随时间差 $\Delta t$ 按零阶贝塞尔函数 $J_0(2\pi f_D \Delta t)$ 振荡衰减。对自相关函数做傅里叶变换，得到频域上的**多普勒谱（Doppler spectrum）**。

            在二维各向同性均匀散射假设（Clarke/Jakes 模型）下，多普勒功率谱密度在 $|f| < f_D$ 范围内满足：

            $$S(f) \propto \frac{1}{\sqrt{1 - (f/f_D)^2}}$$

            它在 $f = \pm f_D$ 两侧边缘翘起形成 U 形双峰：因为速度方向正前方（$\theta \approx 0$）和正后方（$\theta \approx \pi$）附近的 $\cos\theta$ 变化最平缓，把大量角度区间的能量挤进了频移边缘。
      - item:
          id: q-rician-k
          type: number
          prompt: 某郊区视距链路测得莱斯衰落信道中直射分量功率为 $8\text{ mW}$，所有散射分量总功率为 $2\text{ mW}$。求莱斯因子 $K$ 的分贝值 $10\lg K$（单位 dB，保留两位小数）。
          answer: 6.02
          tolerance: 0.05
          unit: dB
          hint: 先算直射功率与散射总功率的线性比值 $K$，再取 $10\lg K$。
          explain: $K = 8 / 2 = 4$，换算成分贝为 $10\lg 4 \approx 6.02\text{ dB}$。
      - item:
          id: q-rician-compare
          type: choice
          prompt: 相同平均接收功率下，莱斯因子 $K = 10$ 的莱斯信道与瑞利信道相比，信号表现有何不同？
          options:
            - text: 莱斯信道发生深度衰落的概率显著低于瑞利信道
              correct: true
            - text: 莱斯信道因为多了一条直射径干涉，深衰落比瑞利信道更频繁
              why: 强直射径把复平面上的信号点拉离原点，散射分量很难将其抵消回零，反而大幅减少深衰落。
            - text: 两者深衰落概率相同，区别仅在于平均载波频率不同
              why: $K$ 因子改变的是包络概率分布形状而非载波频率。
            - text: 莱斯信道包络永远不会低于直射径幅度的两倍
              why: 散射波仍可能与直射波反相，使合成包络低于直射径幅度，只是跌近零的概率极小。
          explain: 当 $K = 10$ 时，约 91% 的能量集中在稳定直射径上，随机散射分量很难把总包络拉到接近零的深谷，深衰落概率远小于瑞利信道。
      - item:
          id: q-jakes-u
          type: choice
          prompt: 在经典的各向同性散射多普勒谱（U 形谱）中，能量为什么集中在 $f = \pm f_D$ 两个边缘，而不是集中在 $f = 0$ 处？
          options:
            - text: 电磁波只能从运动正前方和正后方入射，两侧建筑不反射信号
              why: 模型假设各方向到达功率均匀分布，两侧同样有大量散射波。
            - text: 接收机带通滤波器刻意把零频分量滤掉了
              why: U 形谱是信道本身的物理多普勒分布，与接收机滤波器无关。
            - text: 在 $0$ 与 $\pi$ 附近 $\cos\theta$ 变化最慢，更多角度挤到边缘
              correct: true
            - text: 载波频率越高，垂直运动方向的零频移分量就会自动衰减为零
              why: 垂直于运动方向（$\theta = \pm \pi/2$）的波频移为零，能量并未消失，只是分布得更稀疏。
          explain: 由 $f_d = f_D\cos\theta$，微分关系 $|df_d/d\theta| = f_D|\sin\theta|$ 在 $\theta = 0,\pi$ 处趋近于零，意味着单位频率间隔对应的角度跨度极大，功率谱密度在边缘形成双峰。

  - id: fading-ber
    chapter: 多径衰落与多普勒
    title: 瑞利衰落下的误码率为什么恶化这么多
    minutes: 12
    flow:
      - guess:
          id: g-fading-ber
          type: choice
          prompt: 在恒定的加性高斯白噪声信道里，BPSK 平均信噪比 10 dB 时误比特率已低至约 $4\times 10^{-6}$。如果把平均信噪比同样设为 10 dB，但换成慢瑞利衰落信道，猜猜平均误比特率会怎样？
          options:
            - text: 依然保持在 $10^{-6}$ 量级，因为长期平均信噪比完全没变
              why: 误码率是信噪比的强烈非线性函数，好的时候错不了多少，差的时候却错一大片，平均后远差于平均信噪比对应的误码率。
            - text: 恶化到约 $2\%$，深衰落瞬间拉高了整体误码
              correct: true
            - text: 反而更低，信号变强足以弥补变弱
              why: 信号变强时误码率最多降到 0，而掉进深衰落时误码率逼近 50%，两者严重不对称。
          explain: 瑞利衰落里即使平均信噪比很高，信道仍会有约 $1/\bar{\gamma}$ 的概率掉进深衰落，在那些瞬间几乎随机乱猜，把长期平均误码率拖垮了几个数量级。
      - card:
          title: 瑞利衰落下 BPSK 的精确误比特率
          body: |
            恒定 AWGN 信道上，瞬时信噪比为 $\gamma$ 时，BPSK 的条件误比特率是 $Q(\sqrt{2\gamma})$，随 $\gamma$ 呈指数级骤降。

            在慢平坦瑞利衰落信道中，瞬时信噪比 $\gamma = |h|^2 \bar{\gamma}$ 服从均值为 $\bar{\gamma}$ 的指数分布。对所有可能的衰落状态求期望，就得到**平均误比特率（average BER）**：

            $$P_b = \int_0^\infty Q(\sqrt{2\gamma}) \frac{1}{\bar{\gamma}} e^{-\gamma/\bar{\gamma}} d\gamma = \frac{1}{2}\left(1 - \sqrt{\frac{\bar{\gamma}}{1 + \bar{\gamma}}}\right)$$

            当平均信噪比很大（$\bar{\gamma} \gg 1$）时，用泰勒展开 $\sqrt{\frac{\bar{\gamma}}{1+\bar{\gamma}}} = (1 + 1/\bar{\gamma})^{-1/2} \approx 1 - \frac{1}{2\bar{\gamma}}$，立刻得到核心高信噪比近似：

            $$P_b \approx \frac{1}{4\bar{\gamma}}$$
      - card:
          title: 典型错误事件：深衰落主导了误码
          body: |
            为什么 AWGN 下误码率按 $e^{-\gamma}$ 指数下降，而瑞利衰落下只按 $1/\bar{\gamma}$ 缓慢下降？

            把信道掉进极低功率区间 $|h|^2 < 1/\bar{\gamma}$ 称为**深衰落（deep fade）**。一旦发生深衰落，瞬时信噪比 $\gamma < 1$，无论平时平均功率有多大，这一刻解调误码率都在 $10\%$ 以上。

            由指数分布 $P(|h|^2 < 1/\bar{\gamma}) = 1 - e^{-1/\bar{\gamma}} \approx 1/\bar{\gamma}$，深衰落出现的概率正好按 $1/\bar{\gamma}$ 缩放。因此，无线链路里绝大多数错误都集中在信道掉进深衰落的少数瞬间。
      - item:
          id: q-ber-approx
          type: number
          prompt: BPSK 在慢平坦瑞利衰落信道中传输，平均线性信噪比 $\bar{\gamma} = 50$（约 $17\text{ dB}$）。使用高信噪比近似式 $P_b \approx 1/(4\bar{\gamma})$ 计算平均误比特率（填百分比数值，保留一位小数）。
          answer: 0.5
          tolerance: 0.02
          unit: '%'
          hint: 先算 $1/(4\times 50)$ 得到小数，再乘以 100 换成百分比。
          explain: $P_b \approx 1 / (4 \times 50) = 1/200 = 0.005 = 0.5\%$（用精确式算得 $0.495\%$，非常吻合）。
      - card:
          title: 例题：比较 10 dB 下的 AWGN 与瑞利衰落
          body: |
            当平均信噪比 $\bar{\gamma} = 10\text{ dB}$（线性值 10）时，计算瑞利衰落下 BPSK 的精确平均误比特率和高信噪比近似值，并估算达到 $P_b = 10^{-3}$ 时瑞利信道需要多少 dB 平均信噪比。
          reveal:
            - title: 第 1 步：代入精确式与近似式（10 dB）
              body: |
                精确值：$P_b = \frac{1}{2}\left(1 - \sqrt{\frac{10}{11}}\right) \approx 0.0233$（$2.33\%$）。
                近似值：$1 / (4 \times 10) = 0.025$（$2.5\%$）。而 AWGN 下仅为 $Q(\sqrt{20}) \approx 3.87\times 10^{-6}$。
            - title: 第 2 步：反求达到 $10^{-3}$ 误码率所需的信噪比
              body: |
                由 $1/(4\bar{\gamma}) = 10^{-3}$ 得 $\bar{\gamma} = 250$，换算成分贝：
                $$10\lg 250 \approx 24.0\text{ dB}$$
            - title: 第 3 步：对比功率代价
              body: |
                AWGN 达到 $10^{-3}$ 只需约 $6.8\text{ dB}$，瑞利衰落却要 $24.0\text{ dB}$——仅仅靠蛮力加大发射功率，要多花约 $17\text{ dB}$（50 倍功率）。
      - item:
          id: q-ber-slope
          type: number
          prompt: 已知高信噪比下瑞利衰落 BPSK 的平均误比特率近似满足 $P_b \approx 1/(4\bar{\gamma})$。要把平均误比特率从 $10^{-2}$ 降到 $10^{-4}$，平均信噪比需要提高多少 dB？
          answer: 20
          tolerance: 0.1
          unit: dB
          hint: 误码率要缩小到原来的 $1/100$，按反比关系线性信噪比 $\bar{\gamma}$ 需增大多少倍？换成分贝是多少？
          explain: $P_b$ 降为 $1/100$ 要求线性信噪比增大 100 倍，即 $10\lg 100 = 20\text{ dB}$。每降一个数量级误码率就要多花 10 dB 功率，可见单靠抬功率对抗衰落极不划算。
      - item:
          id: q-ber-why-bad
          type: choice
          prompt: 高信噪比下，瑞利衰落信道的平均误码率曲线为什么比 AWGN 信道平缓得多（每降 10 倍误码率要多花 10 dB）？
          options:
            - text: 瑞利信道里的热噪声功率比 AWGN 信道高出 100 倍
              why: 两者热噪声模型完全相同，都是加性高斯白噪声，差异来自信号幅度乘上了随机衰落增益。
            - text: 深衰落以 $1/\bar{\gamma}$ 概率出现并主导误码
              correct: true
            - text: BPSK 星座点在瑞利信道中距离缩小到了零
              why: 发射端的星座图结构并未改变，只是接收时被信道复增益随机缩放。
            - text: 瑞利分布不允许瞬时信噪比超过平均信噪比
              why: 指数分布有长右尾，约有 $e^{-1} \approx 36.8\%$ 的时间瞬时信噪比高于平均值，只是变强无法抵消深衰落的错误。
          explain: 只要单条路径有 $1/\bar{\gamma}$ 量级的概率发生深衰落，错误率就被锁在 $O(1/\bar{\gamma})$ 的反比斜率上；要打破这一瓶颈，不能只加功率，必须靠分集。
      - item:
          id: q-ber-exact-vs-approx
          type: choice
          prompt: 对于瑞利衰落下的 BPSK，高信噪比近似 $1/(4\bar{\gamma})$ 与精确公式 $\frac{1}{2}(1 - \sqrt{\bar{\gamma}/(1+\bar{\gamma})})$ 相比，数值关系如何？
          options:
            - text: 近似值略高于精确值，且高信噪比下趋于一致
              correct: true
            - text: 近似值总是远低于精确值，且相对误差随信噪比增大而发散
              why: 泰勒展开的第二项为正号使 $\sqrt{\bar{\gamma}/(1+\bar{\gamma})} > 1 - 1/(2\bar{\gamma})$，故精确值略小，且相对误差按 $O(1/\bar{\gamma})$ 趋零。
            - text: 只有在 $\bar{\gamma} < 1$ 的极低信噪比区间近似式才成立
              why: 当 $\bar{\gamma} = 0.1$ 时近似式会给出大于 1 的无意义概率 2.5，该近似仅适用于 $\bar{\gamma} \gg 1$。
            - text: 两者在任意正信噪比下恒等，不存在截断误差
              why: 只有保留泰勒展开无穷多项才严格相等，截断到第一项存在微小余项。
          explain: 因 $(1 + x)^{-1/2} = 1 - \frac{1}{2}x + \frac{3}{8}x^2 - \cdots > 1 - \frac{1}{2}x$（对 $x = 1/\bar{\gamma} > 0$），所以精确误比特率略小于 $1/(4\bar{\gamma})$，作为保守工程估算既方便又安全。

  - id: time-diversity
    chapter: 分集技术
    title: 分集思想、时间分集与交织
    minutes: 12
    flow:
      - guess:
          id: g-time-div
          type: choice
          prompt: 单条无线路径掉进深衰落的概率是 1%，如果把同一条消息分别放在两个互不相关的时刻各发一遍，猜猜接收端两条都同时掉进深衰落的概率大约是多少？
          options:
            - text: 变成 0.5%，因为发两遍相当于把出错概率平分减半
              why: 两条独立路径同时出错的概率不是除以 2，而是两个概率相乘。
            - text: 降到 0.01%，独立事件联合概率相乘
              correct: true
            - text: 还是 1%，重复发送无法改变信道统计特性
              why: 只要两次发送间隔超过相干时间，两次衰落近似独立，同时落入谷底的概率会呈指数级下降。
          explain: 把同一份信息交给多条独立衰落的路径，只要不全军覆没就能恢复数据；独立事件同时失败的概率按乘方骤降，这就是分集的出发点。
      - card:
          title: 分集与分集阶数
          body: |
            只靠加大发射功率对抗瑞利衰落代价太高。更有效的思路是**分集（diversity）**：让同一份信息经过 $L$ 条衰落统计独立的支路传输，接收端把它们合并起来。

            单支路深衰落概率约 $1/\bar{\gamma}$，若 $L$ 条支路彼此独立，所有支路同时掉进深衰落的概率就降为 $(1/\bar{\gamma})^L$。高信噪比下平均误码率满足 $P_e \propto \bar{\gamma}^{-L}$。

            这里的指数 $L$ 称为**分集阶数（diversity order）**，也称分集增益：它在双对数误码率图上把曲线斜率从 $-1$ 掰陡到 $-L$。每提高 10 dB 信噪比，误码率不再只降 10 倍，而是降 $10^L$ 倍。
      - item:
          id: q-div-prob
          type: number
          prompt: 某无线信道单条支路发生深衰落的概率为 $0.1$。若采用 $L = 4$ 阶独立分集传输，所有 4 条支路同时掉进深衰落的概率是多少（填小数）？
          answer: 0.0001
          tolerance: 1e-6
          hint: 4 个相互独立的事件同时发生，它们的联合概率怎么由单个概率 0.1 算出来？
          explain: 独立事件同时发生的概率等于各自概率之积：$0.1^4 = 0.0001$（万分之一）。
      - card:
          title: 时间分集与交织器
          body: |
            信道随终端移动而变化，相隔超过相干时间 $T_c$ 的两个时刻衰落近似独立。把信息分散到相隔大于 $T_c$ 的多个时刻发送，称为**时间分集（time diversity）**。

            直接重复发 $L$ 次会让速率掉成 $1/L$。更高效的做法是纠错编码配合**交织（interleaving）**：发端按行写入矩阵、按列读出发送，使原相邻比特在时间上拉开超过 $T_c$，收端再还原。连续深衰落被拆成零星单比特错，便于纠错码修复，同时带来把误码率曲线向左平移的**编码增益（coding gain）**。
      - card:
          title: 例题：估算交织带来的等待时延
          body: |
            某移动终端的信道相干时间 $T_c = 10\text{ ms}$。为获得 4 阶时间分集，交织器把同一码字的 4 个关键符号依次间隔 $T_c$ 发送，求从第 1 个符号发出到第 4 个符号收齐至少跨越多少毫秒；若终端静止（$T_c = 2\text{ s}$），时间分集还适用吗？
          reveal:
            - title: 第 1 步：数清 4 个独立时刻之间的间隔段数
              body: |
                第 1 个到第 4 个符号之间有 $4 - 1 = 3$ 个间隔，每段至少 $T_c = 10\text{ ms}$，总跨度至少 $3 \times 10 = 30\text{ ms}$。
            - title: 第 2 步：对照实时业务的时延容忍度
              body: |
                语音通话通常要求单向时延低于约 $100\text{ ms}$，$30\text{ ms}$ 可以接受。
            - title: 第 3 步：检查终端静止时的情况
              body: |
                若 $T_c = 2\text{ s}$，3 个间隔需要等待 $6\text{ s}$，实时语音和交互数据无法忍受如此长的等待。此时必须转向空间分集或频率分集。
      - item:
          id: q-div-slope
          type: number
          prompt: 某分集系统提供 $L = 3$ 阶分集，高信噪比下误比特率近似按 $P_b \propto \bar{\gamma}^{-3}$ 下降。若将平均信噪比提高 $10\text{ dB}$（线性值变为原来的 10 倍），平均误比特率大约缩小为原来的 $1/X$，求 $X$。
          answer: 1000
          tolerance: 1
          hint: 线性信噪比增大到 10 倍后，代入反比三次方关系 $\bar{\gamma}^{-3}$，误码率缩小了几个 10 倍？
          explain: 线性信噪比变为 $10\bar{\gamma}$ 时，$(10\bar{\gamma})^{-3} = 10^{-3} \bar{\gamma}^{-3}$，误比特率缩小为原来的 $1/1000$，故 $X = 1000$。
      - item:
          id: q-interleave-delay
          type: number
          prompt: 步行场景中信道相干时间 $T_c = 25\text{ ms}$。某重复编码加交织方案将同一个码元重复发送 3 次，要求相邻两次发送的时间间隔至少为 $2 T_c$ 以保证近似独立。从发出第 1 份到发出第 3 份至少间隔多少毫秒？
          answer: 100
          tolerance: 0.5
          unit: ms
          hint: 发送 3 份副本之间共有几段间隔？每段间隔 $2 T_c$ 是多少毫秒？
          explain: 每段间隔 $2 T_c = 50\text{ ms}$，3 份副本之间有 2 段间隔，共至少 $2 \times 50 = 100\text{ ms}$。
      - item:
          id: q-coding-vs-div
          type: choice
          prompt: 关于分集增益（分集阶数）与编码增益在双对数误码率曲线上的区别，下面哪句描述准确？
          options:
            - text: 两者都只改变曲线斜率，不能左移
              why: 编码增益的作用正是把曲线水平左移（节省固定 dB 功率），不改变高信噪比斜率。
            - text: 分集阶数定斜率，编码增益使曲线左移
              correct: true
            - text: 编码增益决定高信噪比斜率，分集阶数只在低信噪比有效
              why: 正好说反了；分集阶数是高信噪比渐近斜率，编码增益表现为平行左移的信噪比节省量。
            - text: 重复编码的速率损失小，编码增益总是高于现代纠错码
              why: 重复编码速率只有 $1/L$，在同等分集阶数下效率远低于带交织的现代纠错码或旋转星座码。
          explain: 在 $P_e$ 对 $\text{SNR(dB)}$ 的双对数图上，分集阶数 $L$ 决定斜率（每 10 dB 降 $L$ 个数量级），编码增益则体现为曲线整体向左平移所省下的分贝数。

  - id: antenna-diversity
    chapter: 分集技术
    title: 空间分集、最大比合并与 Alamouti 码
    minutes: 13
    flow:
      - guess:
          id: g-ant-div
          type: choice
          prompt: 手机放在桌上纹丝不动，信道几乎不随时间变化，时间分集派不上用场。如果在接收端并排装两根相距半个波长的天线，为什么能降低深衰落风险？
          options:
            - text: 两根天线把载波频率自动拉低了一半，减小了路径损耗
              why: 天线数量不改变载波频率和单条路径的大尺度损耗。
            - text: 相隔半波长的两个位置上多径相位组合近似独立，两根天线很少同时掉进谷底
              correct: true
            - text: 其中一根天线专门吸收环境热噪声，让另一根天线完全无噪声
              why: 两根天线的接收机前端各自产生独立热噪声，不能把另一路的噪声吸走。
          explain: 小尺度衰落在半波长尺度内就会剧烈变化，拉开足够间距的多根天线相当于同时采样多条独立衰落支路，这就是空间分集。
      - card:
          title: 空间分集与三种接收合并方式
          body: |
            在发端或收端布置间距不少于半波长（$\lambda/2$，基站高塔因角度扩展窄需更大间距）的多根天线获取独立支路，称为**空间分集（spatial diversity）**，不占额外时间或带宽。

            接收端有 $L$ 根天线时，常见三种合并方式：
            - **选择合并（SC）**：仅挑瞬时信噪比最高的一路解调；
            - **等增益合并（EGC）**：校准各路相位后等权重相加；
            - **最大比合并（MRC）**：校准相位并按信道幅度加权（$w_i = h_i^*$），输出瞬时信噪比最大：

            $$\gamma_{\text{MRC}} = \sum_{i=1}^{L} \gamma_i$$
      - item:
          id: q-mrc-snr
          type: number
          prompt: 某 4 天线接收机测得 4 条支路的瞬时线性信噪比分别为 $2, 5, 8, 5$。采用最大比合并（MRC）后，合并输出的瞬时线性信噪比是多少？
          answer: 20
          tolerance: 0.05
          hint: 最大比合并把各支路按信道共轭加权后，输出瞬时信噪比与各支路瞬时信噪比之间是什么关系？
          explain: MRC 的输出瞬时信噪比等于各支路瞬时信噪比之和：$\gamma_{\text{MRC}} = 2 + 5 + 8 + 5 = 20$（若用选择合并只有 8）。
      - card:
          title: MRC 的双重收益：分集增益与阵列增益
          body: |
            相比单天线，接收端 $L$ 支路 MRC 同时带来两份好处：一是 $L$ 阶分集增益，高信噪比下 BPSK 在 $L$ 支路独立瑞利衰落下的平均误比特率近似为：

            $$P_b \approx \binom{2L-1}{L} \frac{1}{(4\bar{\gamma})^L}$$

            例如 $L = 2$ 时，$P_b \approx \frac{3}{16\bar{\gamma}^2}$。二是**阵列增益（array gain）**：$L$ 根天线一共截获了 $L$ 倍的信号能量，平均输出信噪比提高 $L$ 倍（$10\lg L\text{ dB}$）。
      - item:
          id: q-half-wave
          type: number
          prompt: 取光速 $c = 3\times 10^8\text{ m/s}$。一台工作在 $2.5\text{ GHz}$ 的终端希望配置两根天线获得近似独立的空间分集，按半波长 $\lambda/2$ 估算两天线至少相隔多少厘米（cm）？
          answer: 6
          tolerance: 0.05
          unit: cm
          hint: 先用 $c/f$ 算出 $2.5\text{ GHz}$ 的全波长（厘米），再除以 2 是多少？
          explain: 全波长 $\lambda = (3\times 10^8)/(2.5\times 10^9) = 0.12\text{ m} = 12\text{ cm}$，半波长为 $6\text{ cm}$。
      - card:
          title: 发射分集、Alamouti 码与宏分集
          body: |
            手机不便装多天线时，可把多天线放到基站做**发射分集（transmit diversity）**。若两天线直接同发一符号，空中相加仍等价单条瑞利路径，没有分集。

            两发一收的 **Alamouti 码（Alamouti code）** 在第 1 周期发 $[x_1, x_2]$、第 2 周期发 $[-x_2^*, x_1^*]$。发端无需信道信息，收端线性组合即可解耦，每符号等效信噪比为 $(|h_1|^2 + |h_2|^2)\bar{\gamma}/2$——拿到 2 阶分集，因总功率平分，比 1 发 2 收 MRC 少 3 dB 阵列增益。终端同时连多座基站对抗大尺度阴影遮挡，称为**宏分集（macro-diversity）**。
      - card:
          title: 例题：估算两支路 MRC 的误码率改善
          body: |
            BPSK 传输经过两条独立瑞利衰落支路，每支路平均信噪比 $\bar{\gamma} = 10\text{ dB}$（线性值 10）。对比单天线与两支路 MRC 的高信噪比近似误比特率，并计算 3 GHz 下半波长天线间距。
          reveal:
            - title: 第 1 步：算单天线与两支路 MRC 的近似误比特率
              body: |
                单天线：$P_{b,1} \approx \frac{1}{4 \times 10} = 2.5\times 10^{-2}$。
                两支路 MRC：$P_{b,2} \approx \frac{3}{16 \times 10^2} = 1.875\times 10^{-3}$（精确值为 $1.60\times 10^{-3}$）。
                同样 10 dB 平均信噪比下，误码率一下子降了超过 13 倍。
            - title: 第 2 步：由频率求半波长最小间距
              body: |
                $\lambda = (3\times 10^8)/(3\times 10^9) = 0.1\text{ m} = 10\text{ cm}$，故 $\lambda/2 = 5\text{ cm}$。
      - item:
          id: q-mrc-ber-25
          type: number
          prompt: BPSK 在两条独立同分布瑞利衰落支路上采用最大比合并（MRC），已知高信噪比近似式 $P_b \approx 3/(16\bar{\gamma}^2)$。当每支路平均线性信噪比 $\bar{\gamma} = 25$ 时，按近似式算出平均误比特率，填入 $P_b \times 10^4$ 的数值（即以 $10^{-4}$ 为单位）。
          answer: 3
          tolerance: 0.05
          hint: 先算 $16 \times 25^2$ 等于多少，再把 $3$ 除以它并乘以 $10^4$。
          explain: $16 \times 25^2 = 16 \times 625 = 10000$，因此 $P_b \approx 3/10000 = 3\times 10^{-4}$，填入 3。
      - item:
          id: q-alamouti-vs-mrc
          type: choice
          prompt: 在总发射功率相同且发端不知道信道的前提下，两发一收 Alamouti 发射分集与一发两收 MRC 接收分集相比，性能差异是什么？
          options:
            - text: Alamouti 码只有 1 阶分集，但额外提供 3 dB 阵列增益
              why: Alamouti 码同样获得完整的 2 阶分集，吃亏的是阵列增益而非分集阶数。
            - text: 均有 2 阶分集，但 Alamouti 少 3 dB 阵列增益
              correct: true
            - text: 两者误码率曲线完全重合，不存在 3 dB 差距
              why: 一发两收总接收面积翻倍获得 3 dB 阵列增益；两发一收发端盲发须平分总功率，少收一半平均功率。
            - text: Alamouti 码需要接收端把完整信道矩阵实时反馈给发射端才能工作
              why: Alamouti 码的最大优点正是发射端无需信道信息，只需接收端估计信道即可线性解耦。
          explain: 两者等效输出都正比于 $|h_1|^2 + |h_2|^2$（均为 2 阶分集），但 Alamouti 两根发射天线各分一半总功率且仅有一根接收天线，因此比一发两收 MRC 少了 $10\lg 2 \approx 3\text{ dB}$ 阵列增益。

  - id: frequency-diversity
    chapter: 分集技术
    title: 频率分集、均衡器与 RAKE 接收机
    minutes: 12
    flow:
      - guess:
          id: g-freq-div
          type: choice
          prompt: 宽带无线信号占据了远大于相干带宽的频谱，不同频段有的掉进谷底、有的正好在波峰。宽带多径信道到底是纯粹的祸害，还是可以转化成帮手？
          options:
            - text: 纯粹是祸害，可分辨多径越多，接收端误码率下限就会越差
              why: 多径确实带来码间干扰，但每一条可分辨的独立多径也是一条天然的分集支路。
            - text: 既带来码间干扰，也能转化为频率分集
              correct: true
            - text: 只要带宽够宽，多径会自动全部同相叠加，无需任何接收端处理
              why: 宽带多径在时域错开到达形成码间干扰，必须靠均衡、RAKE 或编码 OFDM 才能把能量收集起来。
          explain: 多径时延扩展超过符号周期时虽然会引起码间干扰，但同时让接收机分辨出多个独立衰落的抽头，转化为宝贵的频率分集。
      - card:
          title: 频率分集的本质与抽头数
          body: |
            把同一份信息分散到频率间隔大于相干带宽 $B_c$ 的不同频段上传输，或者使用带宽 $W > B_c$ 的宽带信号，让信号经历多个独立衰落的频段，称为**频率分集（frequency diversity）**。

            从时域看，带宽 $W$ 对应时间分辨率 $1/W$。当信道最大时延扩展为 $\tau_{\text{max}}$ 时，抽头延迟线包含约：

            $$L = 1 + \lfloor W\tau_{\text{max}} \rfloor$$

            个近似独立衰落的抽头。也就是说，频率选择性信道天然蕴含了 $L$ 阶潜在的频率分集，关键在于接收机如何消除码间干扰并把各抽头的能量合并起来。
      - item:
          id: q-freq-taps
          type: number
          prompt: 某宽带系统占用带宽 $W = 5\text{ MHz}$，无线信道的最大时延扩展 $\tau_{\text{max}} = 0.8\ \mu\text{s}$。按 $L = 1 + W\tau_{\text{max}}$ 估算该信道可提供的独立可分辨多径抽头数。
          answer: 5
          tolerance: 0.1
          hint: 先算 $W\tau_{\text{max}}$ 等于几，再把第 0 号主抽头加进去。
          explain: $W\tau_{\text{max}} = 5\times 10^6 \times 0.8\times 10^{-6} = 4$，加上主抽头共 $L = 1 + 4 = 5$ 个独立可分辨抽头，最多可提供 5 阶频率分集。
      - card:
          title: 提取频率分集的三种架构
          body: |
            从宽带频率选择性信道里拿到分集增益，有三种主流方案：

            1. **单载波时域均衡**：收端用**均衡器（equalizer）** 补偿失真。线性均衡器会放大噪声；最大似然序列估计（MLSE）能拿满 $L$ 阶分集，但复杂度随抽头数 $L$ 指数增长；
            2. **扩频加 RAKE 接收机**：用短码片分辨多径，收端用**RAKE 接收机（RAKE receiver）** 设多条“耙齿”分别对齐各路径解扩，再做最大比合并；
            3. **编码 OFDM**：把宽带拆成平坦窄带子载波免去复杂时域均衡，再靠跨子载波纠错编码和频域交织拿分集。
      - card:
          title: 例题：RAKE 接收机的多径路程分辨力
          body: |
            某直接序列扩频系统的码片速率为 $4\text{ Mcps}$（每秒 400 万个码片）。计算码片时长 $T_c$ 以及 RAKE 接收机能分辨开两条多径所需的最小传播路程差 $\Delta d = c T_c$。
          reveal:
            - title: 第 1 步：由码片速率求单个码片时长
              body: |
                $$T_c = \frac{1}{4\times 10^6} = 0.25\ \mu\text{s}$$
            - title: 第 2 步：乘以光速换算成最小可分辨路程差
              body: |
                $$\Delta d = c T_c = 3\times 10^8 \times 0.25\times 10^{-6} = 75\text{ m}$$
                两路径路程差大于 75 m 时，RAKE 的两个耙齿就能把它们清晰分开并合并能量。
      - item:
          id: q-rake-dist
          type: number
          prompt: 取光速 $c = 3\times 10^8\text{ m/s}$。某扩频系统码片速率为 $5\text{ Mcps}$（单个码片时长 $T_c = 0.2\ \mu\text{s}$）。若两条多径的到达时延差至少等于 $T_c$ 才能被 RAKE 接收机分辨，两条路径的传播路程差至少是多少米？
          answer: 60
          tolerance: 0.5
          unit: m
          hint: 电磁波在 $0.2\ \mu\text{s}$ 时间内能走多远？把光速乘以 $T_c$。
          explain: 最小路程差 $\Delta d = c T_c = 3\times 10^8 \times 0.2\times 10^{-6} = 60\text{ m}$。
      - item:
          id: q-ofdm-uncoded
          type: choice
          prompt: 一个没有加任何信道编码的宽带 OFDM 系统运行在频率选择性信道上（带宽远大于相干带宽）。关于它能否获得频率分集，下面哪句判断正确？
          options:
            - text: 能获得完整的频率分集，因为总带宽覆盖了许多独立衰落频段
              why: 每个比特只落在某一个窄带子载波上，该子载波掉进深衰落时其他子载波帮不上忙。
            - text: 不能，须配合跨子载波编码和交织才能拿分集
              correct: true
            - text: 只有把子载波数量减少到 1 个，才能拿到频率分集
              why: 单子载波就是单载波传输，需要靠复杂均衡才能提取分集。
            - text: 未编码 OFDM 反而比窄带单载波的误码率低几个数量级
              why: 未编码时每个子载波各自经历窄带平坦瑞利衰落，整体平均误码率与窄带单载波相同，仍按 $1/(4\bar{\gamma})$ 衰减。
          explain: OFDM 把宽带拆成了互不干扰的窄带平坦子载波，降低了均衡复杂度，但若不跨子载波编码，每个比特仍绑死在单一瑞利子载波上，分集阶数仍是 1。
      - item:
          id: q-freq-div-match
          type: match
          prompt: 把三种频率选择性信道处理技术与它们的核心工作原理配对。
          pairs:
            - [最大似然序列估计均衡, 搜索最可能的发射符号序列，能拿到全部分集但复杂度随抽头数指数增长]
            - [RAKE 接收机, 用多条耙齿分别对准不同延迟的扩频路径解扩并做最大比合并]
            - [编码加频域交织 OFDM, 把宽带拆成平坦子载波避免时域均衡，靠纠错码跨子载波获取分集]
          hint: 区分哪一个靠维特比搜索序列、哪一个靠扩频耙齿合并、哪一个靠频域拆窄带加编码。
          explain: 三种技术从不同角度利用了带宽大于相干带宽带来的多径自由度，现代宽带蜂窝系统因复杂度优势普遍选择编码 OFDM。

  - id: fading-capacity
    chapter: 分集技术
    title: 衰落信道容量、注水原理与信道估计
    minutes: 13
    flow:
      - guess:
          id: g-cap
          type: choice
          prompt: 你手里有 10 瓦发射总功率，要分配给两条并行的无线子信道：信道 A 噪声很小，信道 B 噪声极大。为了使总传输速率最大，应该怎样分功率？
          options:
            - text: 把大部分功率投给噪声大的信道 B，帮它把短板补齐
              why: 往噪声极大的差信道砸功率只能换来极少比特，反而拉低总容量。
            - text: 两条信道严格各分 5 瓦，平均分配总是最优
              why: 只有两条信道噪声相同时平均分配才最优，质量悬殊时应向好信道倾斜。
            - text: 把更多功率分给噪声小的信道 A，若信道 B 太差甚至一点功率都不给
              correct: true
          explain: 香农容量对功率是上凸的对数函数，单位功率在低噪声信道上换回的比特数更多，因此最优策略是“锦上添花”而非“平均主义”。
      - card:
          title: 并行高斯信道与注水原理
          body: |
            回顾加性高斯白噪声信道的香农容量：$C = W\log_2(1 + \text{SNR})$。

            如果一条线性时不变频率选择性高斯信道被分成 $K$ 条带宽相同的并行窄带子信道，第 $i$ 条的等效噪声功率为 $N_i$（或者说信道增益平方为 $|H_i|^2$，归一化噪声 $N_0/|H_i|^2$），总功率约束 $\sum P_i = P$。用拉格朗日乘子最大化总容量 $\sum \log_2(1 + P_i/N_i)$，得到最优功率分配——**注水原理（waterfilling）**：

            $$P_i^* = \max(0, \mu - N_i)$$

            把各子信道的噪声高度 $N_i$ 看作凹凸不平的容器底部，倒入总体积为 $P$ 的水，水面稳定在统一高度 $\mu$：坑越深（噪声越小）装水越多，高出水面的差信道不分配功率。
      - item:
          id: q-waterfill
          type: number
          prompt: 两条等带宽并行高斯子信道共享总功率 $P = 10$，两信道的噪声功率分别为 $N_1 = 1$ 和 $N_2 = 3$。按注水原理 $P_i = \mu - N_i$（两条都分配正功率），子信道 1 应分配多少功率 $P_1$？
          answer: 6
          tolerance: 0.05
          hint: 两条信道的水位 $\mu$ 相同且 $P_1 + P_2 = 10$，先由 $(P_1 + N_1) + (P_2 + N_2) = 2\mu$ 求出统一水位 $\mu$ 是多少？
          explain: 统一水位 $\mu = (P + N_1 + N_2)/2 = (10 + 1 + 3)/2 = 7$，故 $P_1 = 7 - 1 = 6$，$P_2 = 7 - 3 = 4$。好信道多分到了功率。
      - card:
          title: 遍历容量与中断容量
          body: |
            随机衰落下的容量指标取决于业务时延约束：

            - **遍历容量（ergodic capacity）**：快衰落或允许长时延时，码字跨越多段相干时间，平均可达速率为：
              $$C_{\text{erg}} = \mathbb{E}\!\left[W\log_2(1 + |h|^2\bar{\gamma})\right]$$
              由对数上凸性，它略低于同均值 AWGN 容量。
            - **中断（outage）** 与 **中断容量（outage capacity）**：慢衰落中单码字落在固定衰落块内，若瞬时容量低于发送速率 $R$ 即发生中断，其概率称**中断概率（outage probability）** $p_{\text{out}}(R)$。允许 $p_{\text{out}} \le \varepsilon$ 的最高速率即 $\varepsilon$-中断容量 $C_\varepsilon$。
      - card:
          title: 例题：算慢瑞利衰落的中断概率与速率折损
          body: |
            慢瑞利衰落信道（$|h|^2$ 服从均值 1 的指数分布）平均线性信噪比 $\bar{\gamma} = 20$，目标频谱效率 $R/W = 2\text{ b/s/Hz}$。求中断概率 $p_{\text{out}}$，并比较若要求 $p_{\text{out}} = 1\%$ 时能支持的速率。
          reveal:
            - title: 第 1 步：把速率门限折算成信道增益平方门限
              body: |
                发生中断的条件是 $\log_2(1 + |h|^2 \bar{\gamma}) < 2$，解得：
                $$|h|^2 < \frac{2^2 - 1}{20} = \frac{3}{20} = 0.15$$
            - title: 第 2 步：代入指数分布求中断概率
              body: |
                $$p_{\text{out}} = 1 - e^{-0.15} \approx 13.9\%$$
            - title: 第 3 步：看严苛中断率下的速率折损
              body: |
                若要求 $p_{\text{out}} \le 1\%$，则 $(2^{R/W} - 1)/20 \approx 0.01005$，算出 $R/W \approx 0.264\text{ b/s/Hz}$，远低于同信噪比 AWGN 的 $\log_2 21 \approx 4.39\text{ b/s/Hz}$。加入 $L$ 阶分集能把中断概率从 $O(1/\bar{\gamma})$ 压成 $O(1/\bar{\gamma}^L)$，大幅抬升中断容量。
      - item:
          id: q-outage-calc
          type: number
          prompt: 某慢瑞利衰落信道（$|h|^2$ 服从均值 1 的指数分布）平均线性信噪比 $\bar{\gamma} = 50$，发端以频谱效率 $R/W = 3\text{ b/s/Hz}$ 传输。按中断概率公式 $p_{\text{out}} = 1 - \exp(-(2^{R/W}-1)/\bar{\gamma})$ 计算中断概率（填百分比数值，保留一位小数）。
          answer: 13.1
          tolerance: 0.15
          unit: '%'
          hint: 先算 $(2^3 - 1)/50 = 7/50 = 0.14$，再计算 $1 - e^{-0.14}$ 并换成百分比。
          explain: $2^3 - 1 = 7$，故门限 $|h|^2 < 7/50 = 0.14$，中断概率 $p_{\text{out}} = 1 - e^{-0.14} \approx 0.1306$，即 13.1%。
      - card:
          title: 信道不确定性与导频开销
          body: |
            前面的合并和相干解调都假设接收机准确知道信道复增益 $h$。现实中接收机事先并不知道 $h$，必须在发送帧中按约定位置插入已知的参考符号，称为**导频（pilot）**，接收端对比收到的导频与已知导频来估计信道。

            导频带来两重折损：第一，导频占用原本用来发数据的时间或子载波，带来开销；第二，导频受噪声污染，信道估计存在误差，会降低后续数据解调的有效信噪比。信道变化越快（相干时间 $T_c$ 越短），导频就必须插得越密，留给数据的比例越少。
      - item:
          id: q-pilot-overhead
          type: number
          prompt: 某无线帧每帧共包含 20 个符号，其中 2 个符号固定用来发送已知导频以估计信道，其余 18 个符号传输有效数据。有效数据符号占整帧的百分比是多少？
          answer: 90
          tolerance: 0.1
          unit: '%'
          hint: 用有效数据符号数除以整帧总符号数，再换成百分比。
          explain: $18 / 20 = 0.9 = 90\%$，导频占用了 10% 的传输开销。
      - item:
          id: q-ergodic-vs-outage
          type: choice
          prompt: 对于需要严格低时延、单数据包必须落在一个相干时间内发完的慢衰落无线业务，应该用哪种容量指标衡量链路性能？
          options:
            - text: 遍历容量，因为只要多发几个包就能平均掉深衰落
              why: 严格低时延业务来不及把一个码字跨多个相干时间编码，单包落进深衰落就会立即丢包。
            - text: 中断容量，刻画允许丢包率下可支持的速率
              correct: true
            - text: 自由空间路径损耗，因为它决定了每赫兹能传多少比特
              why: 路径损耗只决定平均接收功率，不反映慢衰落下的中断统计规律。
            - text: 两者完全相等，慢衰落与快衰落不影响容量定义
              why: 慢衰落低中断率下的中断容量往往远低于遍历容量，必须靠空间或频率分集来缩小差距。
          explain: 当码字不能跨越多个独立衰落块时，无法指望时间平均，工程上用 $\varepsilon$-中断容量（例如 1% 或 10% 中断概率对应的速率）作为设计依据。

  - id: ofdm-principle
    chapter: OFDM
    title: 正交子载波与 IFFT/FFT 数字实现
    minutes: 12
    flow:
      - guess:
          id: g-ofdm
          type: choice
          prompt: 宽带单载波信号在城市多径信道里会被拖出长尾巴，造成严重码间干扰。如果把同一段 20 MHz 频带拆成几十条慢速窄带车道并行发数据，猜猜每条车道上的码间干扰会怎样变化？
          options:
            - text: 明显减轻，因为每条窄带车道的码元时长大幅拉长，远大于多径时延扩展
              correct: true
            - text: 变得更加严重，因为车道越多，多径反射次数就会成倍增加
              why: 物理环境里的多径时延扩展与发射信号分成几条窄带无关；拉长每个码元的持续时间反而让相对拖尾变短。
            - text: 保持不变，因为总发射速率没有降低
              why: 决定单条信道是否平坦的是该支路的带宽（或码元时长），不是所有支路合起来的总速率。
          explain: 把一条高速宽带流拆成 $N$ 条并行的低速窄带流，每条的码元时长拉长到 $N$ 倍，带宽缩窄到 $1/N$，原本频率选择性的宽带信道就变成了 $N$ 条平坦衰落子信道。
      - card:
          title: 从频分复用到正交频分复用
          body: |
            把宽带 $B$ 拆成 $N$ 条窄带车道，每条由一个正弦波承载数据，称为**子载波（subcarrier）**，相邻频率差称为**子载波间隔（subcarrier spacing）** $\Delta f = B / N$。

            传统频分复用须留空白保护带，浪费频谱。**正交频分复用（OFDM）** 让有用符号时长 $T_u$ 满足 $\Delta f = 1 / T_u$：此时各子载波的 $\text{sinc}$ 频谱紧密重叠，但每个子载波中心正好落在其余所有子载波的零点上，在 $[0, T_u]$ 上积分内积严格为零，互不串扰。
      - item:
          id: q-ofdm-df
          type: number
          prompt: 某 OFDM 系统占用总带宽 $B = 16\text{ MHz}$，均匀划分为 $N = 128$ 个子载波。求子载波间隔 $\Delta f$（单位 kHz）。
          answer: 125
          tolerance: 0.1
          unit: kHz
          hint: 子载波间隔等于总带宽除以子载波个数，先算 $16000 / 128$ 是多少？
          explain: $\Delta f = B / N = 16\text{ MHz} / 128 = 16000\text{ kHz} / 128 = 125\text{ kHz}$。
      - card:
          title: 用 IFFT 和 FFT 替代成百上千个振荡器
          body: |
            如果一个系统有 1024 个子载波，难道要装 1024 个模拟振荡器和滤波器吗？并不需要。

            把有用符号时长 $T_u$ 按采样间隔 $T_s = T_u / N = 1/B$ 均匀采成 $N$ 个点，第 $n$ 个时域样值为：

            $$x[n] = \frac{1}{\sqrt{N}} \sum_{k=0}^{N-1} X[k]\,e^{j 2\pi k n / N}, \quad n = 0, 1, \dots, N-1$$

            这正是频域调制符号序列 $X[k]$ 的 $N$ 点**离散傅里叶逆变换（IFFT）**。接收端采样后做一次 $N$ 点快速傅里叶变换（FFT），就能把所有 $N$ 个子载波一次性分离还原，运算量仅 $O(N\log_2 N)$。
      - card:
          title: 例题：估算 OFDM 子载波规格与单符号比特数
          body: |
            某 OFDM 系统带宽 $B = 10\text{ MHz}$，共 $N = 256$ 个子载波，每个子载波均采用 16-QAM（每码元 4 比特）。求子载波间隔、有用符号时长以及单个 OFDM 符号携带的总比特数。
          reveal:
            - title: 第 1 步：算子载波间隔 $\Delta f$
              body: |
                $$\Delta f = \frac{B}{N} = \frac{10\text{ MHz}}{256} = 39.0625\text{ kHz}$$
            - title: 第 2 步：取倒数得有用符号时长 $T_u$
              body: |
                $$T_u = \frac{1}{\Delta f} = \frac{256}{10\text{ MHz}} = 25.6\ \mu\text{s}$$
            - title: 第 3 步：统计单个 OFDM 符号的总比特数
              body: |
                每个子载波携带 4 比特，256 个子载波并行发送共携带 $256 \times 4 = 1024$ 比特。
      - item:
          id: q-ofdm-tu
          type: number
          prompt: 某 OFDM 系统的子载波间隔为 $\Delta f = 125\text{ kHz}$。为了保持相邻子载波正交，有用符号时长 $T_u = 1/\Delta f$ 应是多少微秒（$\mu\text{s}$）？
          answer: 8
          tolerance: 0.05
          unit: μs
          hint: 有用符号时长是子载波间隔的倒数，用 $1 / (125\times 10^3)$ 得到秒数后再换成微秒。
          explain: $T_u = 1 / (125\times 10^3\text{ Hz}) = 8\times 10^{-6}\text{ s} = 8\ \mu\text{s}$。
      - item:
          id: q-ofdm-bits
          type: number
          prompt: 一个 OFDM 符号包含 200 个用于传输数据的子载波，每个数据子载波采用 64-QAM 调制（每个码元携带 6 比特）。单个 OFDM 符号一共携带多少比特？
          answer: 1200
          tolerance: 0.1
          unit: 比特
          hint: 200 个子载波并行传送，每个子载波在同一符号内送出 6 比特，总数怎么算？
          explain: $200 \times 6 = 1200$ 比特。实际系统里还会扣掉用于导频和保护的子载波。
      - item:
          id: q-ofdm-ortho
          type: choice
          prompt: OFDM 的相邻子载波在频域上明显重叠，接收端却能把它们无串扰地分离开来，核心依靠什么数学条件？
          options:
            - text: 相邻子载波之间插了宽度等于 $\Delta f$ 的空白保护带
              why: OFDM 正是省去了保护带、让子载波频谱紧密重叠才实现高频谱效率。
            - text: $\Delta f = 1/T_u$，使各子载波中心落在其余零点上
              correct: true
            - text: 每个子载波发射功率依次递减一半，强弱不同就不会串扰
              why: 功率不同不能消除频谱重叠带来的干扰，正交性靠的是频率间隔与符号时长的精确匹配。
            - text: 只允许使用 BPSK 调制，高阶 QAM 无法保持正交
              why: 子载波正交性取决于基函数 $e^{j2\pi k\Delta f t}$ 的积分内积，与上面加载的是 QPSK 还是 256-QAM 无关。
          explain: 只要 $\Delta f = 1/T_u$，任意两个不同子载波在 $[0, T_u]$ 上的内积严格为零，等价于 DFT 矩阵各列正交，因此 FFT 可以把它们无串扰解耦。

  - id: cyclic-prefix
    chapter: OFDM
    title: 循环前缀与单抽头频域均衡
    minutes: 12
    flow:
      - guess:
          id: g-cp
          type: choice
          prompt: 理想无多径信道里，OFDM 接收端直接做 FFT 就能分离全部子载波。一旦经过有延迟拖尾的多径信道，前一个 OFDM 符号的尾巴会扫进当前符号里。在两个符号之间只插一段全零静音空白能把问题全部解决吗？
          options:
            - text: 能，全零空白既挡住了前一个符号的拖尾，也能保住当前符号内部的子载波正交性
              why: 全零空白确实挡住了前一个符号的拖尾（ISI），但当前符号自己延迟的副本在边界处截断，破坏了完整周期正交性，仍会产生子载波间干扰。
            - text: 不能，挡得住前一符号拖尾，但挡不住当前符号缺角引发的 ICI
              correct: true
            - text: 不能，全零空白会让接收机完全失去供电而停机
              why: 发射短时零电平不会让接收机停机，真正的问题是线性卷积不能直接对应频域逐点相乘。
          explain: 全零保护间隔能挡住符号间干扰，但多径延迟会在 FFT 窗口里切掉当前符号头部的一截，破坏子载波间正交性；把符号末尾复制粘贴到开头才能一举两得。
      - card:
          title: 循环前缀：把线性卷积变成圆周卷积
          body: |
            多径线性卷积同时引发两种破坏：前符号拖尾渗入当前符号引起码间干扰（ISI）；当前符号延迟路径在 FFT 窗口内失去完整周期，破坏正交性，引起**子载波间干扰（ICI）**。

            解法是添加**循环前缀（cyclic prefix, CP）**：把每个 OFDM 符号末尾时长 $T_{\text{cp}}$ 的波形复制到符号开头，要求 $T_{\text{cp}} \ge \tau_{\text{max}}$。接收端先丢掉前面 $T_{\text{cp}}$ 受污染段，剩下的有用窗口里线性卷积就严格等价于圆周卷积。
      - card:
          title: 单抽头频域均衡与 CP 开销
          body: |
            由信号与系统的卷积定理，时域点数为 $N$ 的圆周卷积经 $N$ 点 FFT 后，在频域变成简单的逐点相乘：

            $$Y[k] = H[k]\,X[k] + W[k], \quad k = 0, 1, \dots, N-1$$

            其中 $H[k]$ 是信道冲激响应的第 $k$ 个 DFT 系数。接收端还原第 $k$ 个子载波只需乘以单个复数 $1/H[k]$，称为**单抽头均衡（one-tap equalization）**，比宽带单载波复杂时域均衡简单得多。

            代价是循环前缀重复发送已有波形、不携带新比特，带来时间和功率开销：

            $$\text{CP 开销} = \frac{T_{\text{cp}}}{T_u + T_{\text{cp}}}$$
      - item:
          id: q-cp-overhead
          type: number
          prompt: 某 OFDM 系统的有用符号时长为 $T_u = 64\ \mu\text{s}$，循环前缀时长为 $T_{\text{cp}} = 16\ \mu\text{s}$。循环前缀占整个 OFDM 符号总时长 $T_u + T_{\text{cp}}$ 的百分比是多少？
          answer: 20
          tolerance: 0.1
          unit: '%'
          hint: 整个符号的总时长等于有用时长加循环前缀时长，用 $T_{\text{cp}}$ 除以总时长是多少？
          explain: 总符号时长 $T_{\text{sym}} = 64 + 16 = 80\ \mu\text{s}$，CP 占比 $16 / 80 = 0.2 = 20\%$。
      - card:
          title: 例题：根据最大时延扩展选循环前缀与算速率
          body: |
            某 OFDM 系统有用符号时长 $T_u = 32\ \mu\text{s}$，信道最大时延扩展 $\tau_{\text{max}} = 4\ \mu\text{s}$，设计取 $T_{\text{cp}} = 8\ \mu\text{s}$ 留出同步余量。求总符号时长、CP 开销及每秒发送的 OFDM 符号数。
          reveal:
            - title: 第 1 步：确认 CP 是否覆盖最大时延扩展
              body: |
                $T_{\text{cp}} = 8\ \mu\text{s} \ge \tau_{\text{max}} = 4\ \mu\text{s}$，能完全消除 ISI 和 ICI。
            - title: 第 2 步：算总符号时长与 CP 开销
              body: |
                $$T_{\text{sym}} = T_u + T_{\text{cp}} = 32 + 8 = 40\ \mu\text{s}$$
                $$\text{开销} = \frac{8}{40} = 20\%$$
            - title: 第 3 步：求每秒发送的 OFDM 符号数
              body: |
                $$\frac{1}{40\times 10^{-6}\text{ s}} = 25000\text{ 个/秒}$$
      - item:
          id: q-cp-samples
          type: number
          prompt: 某 OFDM 系统时域采样率为 $10\text{ MHz}$（相邻采样点间隔 $0.1\ \mu\text{s}$），无线信道的最大时延扩展为 $\tau_{\text{max}} = 2.4\ \mu\text{s}$。为了完全消除多径引起的 ISI 与 ICI，循环前缀至少需要包含多少个采样点？
          answer: 24
          tolerance: 0.1
          unit: 个
          hint: 把最大时延扩展 $2.4\ \mu\text{s}$ 除以采样间隔 $0.1\ \mu\text{s}$ 等于多少？
          explain: $L_{\text{cp}} \ge \tau_{\text{max}} / T_s = 2.4 / 0.1 = 24$ 个采样点。
      - item:
          id: q-cp-rate
          type: number
          prompt: 某 OFDM 系统加上循环前缀后的总符号时长 $T_{\text{sym}} = T_u + T_{\text{cp}} = 50\ \mu\text{s}$。每个符号内有 100 个数据子载波，均采用 QPSK（每码元 2 比特）。求该系统的原始数据速率（单位 Mb/s）。
          answer: 4
          tolerance: 0.05
          unit: Mb/s
          hint: 先算单个 OFDM 符号一共装了多少比特，再除以总符号时长 $50\ \mu\text{s}$。
          explain: 单符号携带 $100 \times 2 = 200$ 比特，速率 $R = 200 / (50\times 10^{-6}\text{ s}) = 4\times 10^6\text{ b/s} = 4\text{ Mb/s}$。
      - item:
          id: q-cp-role
          type: choice
          prompt: 当循环前缀时长 $T_{\text{cp}}$ 大于等于信道最大时延扩展 $\tau_{\text{max}}$ 时，循环前缀实现单抽头均衡的关键机理是什么？
          options:
            - text: 把信道所有反射径全部吸收掉，使多径信道变成纯直射信道
              why: 循环前缀只是发射端复制的一段波形，无法改变物理空间的反射路径。
            - text: 在 FFT 窗口内把线性卷积变为圆周卷积
              correct: true
            - text: 把每个子载波发射功率放大一倍以压过码间干扰
              why: 循环前缀反而消耗了一部分发射能量，不提供功率放大。
            - text: 让接收机跳过 FFT 步骤，直接在时域逐比特判决
              why: 接收机仍需做 FFT 变到频域，才能利用圆周卷积对应的频域逐点相乘做单抽头均衡。
          explain: 只要 $T_{\text{cp}} \ge \tau_{\text{max}}$，线性卷积在有用窗口内与圆周卷积完全一致，经 FFT 化为 $Y[k] = H[k]X[k] + W[k]$，从而只需单抽头复数除法即可均衡。

  - id: ofdm-design
    chapter: OFDM
    title: OFDM 间隔权衡、峰均比与 OFDMA
    minutes: 13
    flow:
      - guess:
          id: g-ofdm-design
          type: choice
          prompt: 既然循环前缀占比是 $T_{\text{cp}}/(T_u + T_{\text{cp}})$，为了把开销压到几乎为零，是不是把有用符号时长 $T_u$ 选得越长越好（比如 1 秒）？
          options:
            - text: 是的，$T_u$ 越长频谱效率越高，而且不会带来任何副作用
              why: 符号拖得太长时，信道在单个符号内部就会随终端移动发生变化，子载波正交性随之瓦解。
            - text: 不是，$T_u$ 过长会使子载波过密，易受多普勒与频偏串扰
              correct: true
            - text: 不是，$T_u$ 越长则循环前缀时长就必须同步缩短到零
              why: 循环前缀下限由物理多径时延扩展决定，与 $T_u$ 变长无关，真正限制 $T_u$ 上限的是多普勒与频偏。
          explain: $T_u$ 拉长等价于子载波间隔 $\Delta f = 1/T_u$ 变窄：只要多普勒频移或本振误差接近 $\Delta f$，相邻子载波就会发生严重串扰，且长符号还会加大通信时延。
      - card:
          title: 子载波间隔的双向夹击
          body: |
            选定 OFDM 规格时，子载波间隔 $\Delta f$ 受到上下两道边界夹击：

            - **下限（防多普勒与频偏）**：终端高速移动带来最大多普勒频移 $f_D$，若 $\Delta f$ 太小，$T_u$ 逼近甚至超过相干时间 $T_c$，符号内信道变化直接引起严重子载波间干扰（ICI），因此必须要求 $\Delta f \gg f_D$；
            - **上限（控 CP 开销与保平坦）**：若 $\Delta f$ 太大，一方面子载波宽过相干带宽 $B_c$，另一方面 $T_u = 1/\Delta f$ 缩得太短，而 $T_{\text{cp}} \ge \tau_{\text{max}}$ 不能缩，导致 CP 开销过大。

            合起来，良好设计的 OFDM 必须满足经验不等式：

            $$f_D \ll \Delta f \ll B_c, \quad T_{\text{cp}} \ge \tau_{\text{max}}$$
      - item:
          id: q-df-doppler
          type: number
          prompt: 取光速 $c = 3\times 10^8\text{ m/s}$。某车载 OFDM 系统载频 $f_c = 3\text{ GHz}$，车速 $v = 108\text{ km/h}$（$30\text{ m/s}$）。为抑制多普勒引起的子载波间干扰，要求子载波间隔至少是最大多普勒频移 $f_D$ 的 20 倍。子载波间隔 $\Delta f$ 至少应选多少 kHz？
          answer: 6
          tolerance: 0.1
          unit: kHz
          hint: 先用 $f_D = v f_c / c$ 算出最大多普勒频移（Hz），再乘以 20 并换算成 kHz。
          explain: $f_D = 30 \times (3\times 10^9) / (3\times 10^8) = 300\text{ Hz}$，要求 $\Delta f \ge 20 f_D = 6000\text{ Hz} = 6\text{ kHz}$。
      - card:
          title: 峰均功率比（PAPR）与载波频偏
          body: |
            OFDM 虽把多径均衡变得简单，却有两个固有弱点：

            1. **高** **峰均功率比（peak-to-average power ratio, PAPR）**：时域波形是 $N$ 个独立正弦子载波的叠加。虽然大多数时刻它们相互抵消、幅度平缓，但偶尔所有子载波相位碰巧对齐，瞬时峰值功率最高可达平均功率的 $N$ 倍（$10\lg N\text{ dB}$）。为防止发射机功率放大器削波失真，功放必须大幅回退工作点，导致电源效率降低、手机发烫耗电。
            2. **频偏敏感**：发射与接收本地振荡器只要偏差零点几倍 $\Delta f$，采样点就偏离 $\text{sinc}$ 零点，所有子载波互相泄漏。
      - card:
          title: OFDMA 与低峰均比的 DFT 扩展 OFDM
          body: |
            将 OFDM 延伸到多用户就得到**正交频分多址（OFDMA）**：基站把二维时频网格上的不同子载波组分给不同用户，还可专挑各自衰落最好的子载波获取多用户频率增益。

            为减轻手机上行功放承受高 PAPR 的压力，LTE 上行和 NR 覆盖受限场景采用**DFT 扩展 OFDM（DFT-s-OFDM）**（LTE 称 SC-FDMA）：送入 IFFT 前先做小点数 DFT，把每符号能量摊到多个子载波上，使时域包络接近低起伏单载波，同时保留 CP 与频域单抽头均衡。
      - item:
          id: q-papr-calc
          type: number
          prompt: 若一个 OFDM 符号包含 $N = 128$ 个等幅子载波，在某一瞬间所有子载波相位恰好同相叠加。按 $10\lg N$ 计算此时的理论最大峰均功率比 PAPR（单位 dB，保留一位小数）。
          answer: 21.1
          tolerance: 0.1
          unit: dB
          hint: $N = 128 = 2^7$，已知 $\lg 2 \approx 0.301$，算 $10\lg 128$ 约是多少？
          explain: 当 $N$ 个等幅正弦波同相相加时，幅度为 $N$ 倍、峰值功率为 $N^2$ 倍，而平均功率为 $N$ 倍，故 $\text{PAPR}_{\text{max}} = N^2 / N = N = 128$，即 $10\lg 128 \approx 21.07\text{ dB}$。
      - item:
          id: q-dfts-why
          type: choice
          prompt: 4G LTE 上行和 5G NR 覆盖受限上行使用 DFT 扩展 OFDM（DFT-s-OFDM）的主要工程原因是什么？
          options:
            - text: 手机功放受电池与散热限制，需要压低发射波形的峰均功率比以提高效率
              correct: true
            - text: 它能把信道容量翻倍，突破香农定理的上限
              why: 预加一次线性 DFT 变换是酉变换，不改变高斯信道容量，更不能突破香农上限。
            - text: 它可以完全省去循环前缀，把带宽利用率提到 100%
              why: DFT-s-OFDM 依然依赖循环前缀将线性卷积转化为圆周卷积，以便基站做频域均衡。
            - text: 只有它支持高阶 64-QAM 调制，普通 CP-OFDM 不支持
              why: 普通 CP-OFDM 同样支持 QPSK 乃至 256-QAM、1024-QAM 等高阶调制。
          explain: 电池供电的手机功放效率至关重要；DFT 扩展把多载波时域包络拉回近似单载波，大幅降低 PAPR，让手机在小区边缘能以更高平均功率发射。
      - item:
          id: q-ofdm-tradeoff
          type: choice
          prompt: 在信道最大时延扩展 $\tau_{\text{max}}$ 固定不变的前提下，若将 OFDM 的子载波间隔 $\Delta f$ 增大到原来的 2 倍（同时保持 $T_{\text{cp}} = \tau_{\text{max}}$），会出现什么后果？
          options:
            - text: 抗多普勒能力变差，同时循环前缀时间开销比例减小
              why: $\Delta f$ 变大让抗多普勒能力变强，而有用符号时长 $T_u$ 减半会使 CP 占比反而变大。
            - text: 抗多普勒增强，但 CP 占比增大
              correct: true
            - text: 抗多普勒能力与循环前缀占比同时得到改善
              why: $T_u = 1/\Delta f$ 减半后，$T_{\text{cp}}/(T_u + T_{\text{cp}})$ 的分母变小，CP 开销必然上升。
            - text: 循环前缀时长自动翻倍，总符号时长保持不变
              why: $T_{\text{cp}}$ 由物理多径时延扩展决定，并不随 $\Delta f$ 增大而自动翻倍。
          explain: $\Delta f$ 增大使抗频偏和多普勒的余量翻倍，但也把 $T_u$ 压缩了一半；由于 $T_{\text{cp}}$ 受制于物理多径不能缩，开销比例随之升高，这就是核心权衡。

  - id: mimo-capacity
    chapter: MIMO
    title: MIMO 信道矩阵、奇异值分解与空间复用
    minutes: 13
    flow:
      - guess:
          id: g-mimo
          type: choice
          prompt: 传统无线链路要让传输速率翻倍，如果带宽不能再加宽，只靠加大发射功率（从 10 dB 提速到两倍速率）往往需要把发射功率放大十几倍。如果在发射端和接收端各装 4 根天线，在同一频段同时发 4 路不同数据，高信噪比下容量大约能变成单天线的几倍？
          options:
            - text: 最多增加 $\log_2 4 = 2$ 倍，因为多天线只相当于把功率放大了 4 倍
              why: 那只是做波束赋形或分集的结果；若信道矩阵满秩且发送不同数据流，空间维度直接把容量的前置系数乘以 4。
            - text: 约 4 倍，因为空间维度开辟出了 4 条互不干扰的并行通道
              correct: true
            - text: 约 16 倍，因为发射 4 根乘接收 4 根一共有 16 条链路
              why: $4\times 4$ 矩阵最多只有 4 个非零奇异值（秩不超过 $\min(N_t, N_r)$），独立并行流上限是 4 而非 16。
          explain: 多天线在富散射环境中可以开辟出最多 $\min(N_t, N_r)$ 条独立的空间通道，让容量随天线数线性增长，而不再困在对数增长的瓶颈里。
      - card:
          title: MIMO 信道模型与奇异值分解
          body: |
            在发射端配置 $N_t$ 根天线、接收端配置 $N_r$ 根天线的无线系统称为**多输入多输出（multiple-input multiple-output, MIMO）**。窄带平坦衰落下的基带接收向量写成矩阵形式：

            $$\mathbf{y} = \mathbf{H}\mathbf{x} + \mathbf{w}$$

            其中 $\mathbf{H} \in \mathbb{C}^{N_r \times N_t}$ 是信道矩阵，$H_{ij}$ 表示从第 $j$ 根发天线到第 $i$ 根收天线的复增益。

            借用线性代数里的奇异值分解，把矩阵拆成 $\mathbf{H} = \mathbf{U}\mathbf{\Sigma}\mathbf{V}^H$（$\mathbf{U}, \mathbf{V}$ 为酉矩阵，$\mathbf{\Sigma}$ 对角线上是奇异值 $\sigma_1 \ge \sigma_2 \ge \cdots \ge \sigma_r > 0$，$r = \text{rank}(\mathbf{H})$）。发射端先把原始符号乘以 $\mathbf{V}$ 做**预编码（precoding）**，接收端再把接收向量乘以 $\mathbf{U}^H$，整条耦合信道立刻解耦成 $r$ 条互不干扰的并行高斯子信道：

            $$\tilde{y}_i = \sigma_i \tilde{x}_i + \tilde{w}_i, \quad i = 1, 2, \dots, r$$
      - item:
          id: q-mimo-dof
          type: number
          prompt: 某 $4$ 发 $2$ 收（$N_t = 4, N_r = 2$）MIMO 系统处于富散射环境中，信道矩阵 $\mathbf{H}$ 满秩。高信噪比下它最多能并行传送多少条独立的空间数据流（即空间自由度）？
          answer: 2
          tolerance: 0.1
          hint: 一个 $2 \times 4$ 矩阵的秩最大不会超过行数和列数中的哪一个？
          explain: 矩阵的秩满足 $r \le \min(N_t, N_r) = \min(4, 2) = 2$，因此空间自由度为 2。
      - card:
          title: 空间复用容量与高信噪比线性增长
          body: |
            把不同独立数据流放到这 $r$ 条并行子信道上同时发射，称为**空间复用（spatial multiplexing）**，并行流个数 $r$ 称为**空间自由度（spatial degrees of freedom）**。

            总功率为 $P$、每根接收天线噪声功率为 $N_0$ 时，对各子信道按注水原理分配功率 $P_i$，确定性 MIMO 信道容量为：

            $$C = \sum_{i=1}^{r} \log_2\!\left(1 + \frac{P_i \sigma_i^2}{N_0}\right)$$

            高信噪比下均分功率近似最优，当 $\mathbf{H}$ 满秩（$r = \min(N_t, N_r)$）时，容量渐近按 $\min(N_t, N_r)\log_2\text{SNR}$ 随最小天线数**线性**增长——不增加带宽，也不靠指数级堆功率就能成倍提速。
      - card:
          title: 例题：用奇异值分解算 $2\times 2$ MIMO 容量
          body: |
            某 $2\times 2$ 信道奇异值为 $\sigma_1 = 2$、$\sigma_2 = 1$（$\sigma_1^2 = 4, \sigma_2^2 = 1$），总发射信噪比 $P/N_0 = 10$。对比等功率分配与注水分配的频谱效率。
          reveal:
            - title: 第 1 步：算等功率分配（每路 $P_i/N_0 = 5$）
              body: |
                $$C_{\text{eq}} = \log_2(1 + 5\times 4) + \log_2(1 + 5\times 1) = \log_2 21 + \log_2 6 \approx 4.39 + 2.58 = 6.98\text{ b/s/Hz}$$
            - title: 第 2 步：算各子信道等效噪声并求注水水位
              body: |
                归一化噪声 $1/\sigma_1^2 = 0.25$、$1/\sigma_2^2 = 1$。水位 $\mu = (10 + 0.25 + 1)/2 = 5.625$，于是 $P_1/N_0 = 5.375$、$P_2/N_0 = 4.625$。
            - title: 第 3 步：算注水容量并对比
              body: |
                $$C_{\text{wf}} = \log_2(1 + 5.375\times 4) + \log_2(1 + 4.625\times 1) = \log_2 22.5 + \log_2 5.625 \approx 4.49 + 2.49 = 6.98\text{ b/s/Hz}$$
                高信噪比下等功率分配几乎与注水一样好；低信噪比时注水会把全部功率集中到最强的 $\sigma_1$ 通道上，优势显著。
      - item:
          id: q-mimo-cap-exact
          type: number
          prompt: 某 $2\times 2$ 确定性 MIMO 信道的两个奇异值为 $\sigma_1 = 3$、$\sigma_2 = 1$。两条解耦后的并行子信道采用等功率分配，每条的发射信噪比均为 $P_i/N_0 = 7$。求总频谱效率 $\log_2(1 + 7\sigma_1^2) + \log_2(1 + 7\sigma_2^2)$（单位 b/s/Hz）。
          answer: 9
          tolerance: 0.05
          unit: b/s/Hz
          hint: 分别算出 $1 + 7\times 3^2$ 和 $1 + 7\times 1^2$，它们正好都是 2 的幂次，取以 2 为底的对数再相加。
          explain: 第一条子信道 $\log_2(1 + 63) = \log_2 64 = 6$，第二条 $\log_2(1 + 7) = \log_2 8 = 3$，总频谱效率 $6 + 3 = 9\text{ b/s/Hz}$。
      - item:
          id: q-mimo-highsnr
          type: number
          prompt: 某 $3\times 3$ 满秩 MIMO 系统处于高信噪比状态，线性 $\text{SNR} = 256$（约 $24\text{ dB}$）。用高信噪比粗估式 $\min(N_t, N_r)\log_2\text{SNR}$ 估算该系统的频谱效率（单位 b/s/Hz）。
          answer: 24
          tolerance: 0.1
          unit: b/s/Hz
          hint: 先求 $\log_2 256$ 等于几，再乘以 $3\times 3$ 系统的空间自由度 $\min(3, 3)$。
          explain: $\log_2 256 = 8$，空间自由度 $\min(3, 3) = 3$，粗估频谱效率为 $3 \times 8 = 24\text{ b/s/Hz}$。
      - item:
          id: q-mimo-lowsnr
          type: choice
          prompt: 当总发射信噪比很低（处于功率受限区）且发射端已知 MIMO 信道矩阵 $\mathbf{H}$ 时，注水原理会怎样分配功率？
          options:
            - text: 仍然把总功率均匀分给所有 $\min(N_t, N_r)$ 条子信道
              why: 功率稀缺时，分给小奇异值通道的功率换回的容量远不如集中到最大奇异值通道。
            - text: 把全部功率集中到最大奇异值对应的单一方向上（波束赋形）
              correct: true
            - text: 把功率优先分配给最小奇异值通道以拉平各路速率
              why: 注水原理永远优先往噪声最小（奇异值最大）的深坑里注水。
            - text: 停止发射所有子信道，因为低信噪比下信道容量恒为零
              why: 任何正信噪比下高斯信道容量都严格大于零，只是应把功率集中在最强模式。
          explain: 低信噪比时容器水面很低，水只够灌进最深的一个坑（最小等效噪声 $1/\sigma_1^2$），即只沿最大奇异值方向发一路波束赋形流，不盲目做多流复用。

  - id: mimo-channel
    chapter: MIMO
    title: MIMO 信道的物理建模、角度分辨率与秩亏
    minutes: 12
    flow:
      - guess:
          id: g-mimo-phy
          type: choice
          prompt: 假如把一台 $4\times 4$ MIMO 发射机和一台 $4\times 4$ 接收机搬到空旷无遮挡、没有任何建筑物和地面的太空里相距 1 公里通信，它们还能拿到 4 倍空间复用增益吗？
          options:
            - text: 能，因为太空里没有多径干扰，最适合 4 条空间数据流并行
              why: 没有丰富散射体时，所有 4 根发天线到达 4 根收天线的电磁波几乎走同一条直线，矩阵列向量线性相关，无法复用 4 路流。
            - text: 不能，纯远场视距下所有天线路径高度相关，信道矩阵秩退化为 1
              correct: true
            - text: 能，只要把 4 根天线的发射功率调成互不相同就行
              why: 调整发端功率不能提高物理信道矩阵 $\mathbf{H}$ 的秩。
          explain: 多径散射在单天线里常被视为麻烦，但在 MIMO 空间复用里却是不可或缺的帮手：没有来自多方向的散射，空间通道就会塌缩成一条。
      - card:
          title: 远场纯视距信道与秩亏
          body: |
            把多根天线按固定间距 $d$ 排成一排，称为**天线阵列（antenna array）**。

            在远场纯视距（无散射）环境中，收发距离远大于阵列尺寸，来自所有发射阵元的射线几乎平行到达接收阵，各阵元间仅相差由入射角决定的确定相位。信道矩阵写成外积形式：

            $$\mathbf{H} = a\,\mathbf{e}_r(\Omega_r)\,\mathbf{e}_t^H(\Omega_t)$$

            这是两个向量的外积，无论装了多少根天线，它的秩永远只有 1。这种因缺乏散射或天线靠得太近导致实际秩小于 $\min(N_t, N_r)$ 的现象称为**秩亏（rank deficiency）**。它不能做多流复用，只能把能量对准单一方向获取 $N_t N_r$ 倍的功率阵列增益。
      - item:
          id: q-los-rank
          type: number
          prompt: 一对相距 500 m 的 $4\times 4$ 均匀线性天线阵列处于无散射纯视距环境，信道矩阵每个矩阵项的幅值均为 1。该信道矩阵的秩是多少？
          answer: 1
          tolerance: 0.05
          hint: 远场纯视距下信道矩阵可以写成单个列向量与单个行向量的乘积 $\mathbf{e}_r \mathbf{e}_t^H$，外积矩阵的秩总是几？
          explain: 外积矩阵的每一列都是 $\mathbf{e}_r$ 的标量倍，线性无关列只有 1 个，因此矩阵秩为 1，无法支持多路空间复用。
      - card:
          title: 角度分辨率与富散射 MIMO 统计模型
          body: |
            阵列在空间上分辨不同方向散射径的能力，取决于总孔径 $L_a = N d$ 与波长 $\lambda$ 的比值。用方向余弦 $\Omega = \cos\phi$ 描述入射角时，阵列的**角度分辨率（angular resolution）** 为：

            $$\Delta\Omega = \frac{\lambda}{L_a}$$

            这与光学望远镜的角分辨规律一脉相承：阵越长、波长越短，能分辨的独立散射方向越多。只有当环境中存在足够多分布在宽角度范围内的独立散射体时，$\mathbf{H}$ 的各个矩阵项才近似独立同分布复高斯 $\mathcal{CN}(0, 1)$（独立瑞利 MIMO 模型），以概率 1 满秩。
      - card:
          title: 例题：比较视距增益与阵列角度分辨率
          body: |
            一根均匀线阵包含 $N = 8$ 根天线，相邻间距 $d = \lambda/2$。求该阵列的归一化孔径 $L_a/\lambda$ 与方向余弦分辨率 $\Delta\Omega$；若用两个这样的 $8\times 8$ 阵列在纯视距（矩阵项幅值均为 1）下对准通信，唯一非零奇异值的平方 $\sigma_1^2$ 是多少？
          reveal:
            - title: 第 1 步：算归一化阵长与角度分辨率
              body: |
                $$L_a / \lambda = N \cdot (d/\lambda) = 8 \times 0.5 = 4$$
                $$\Delta\Omega = \frac{1}{L_a / \lambda} = \frac{1}{4} = 0.25$$
            - title: 第 2 步：由矩阵项平方和求唯一非零奇异值平方
              body: |
                矩阵秩为 1，所有奇异值平方之和等于全部矩阵项幅值平方之和 $\sum_{i,j}|H_{ij}|^2 = 8 \times 8 \times 1 = 64$，故 $\sigma_1^2 = 64$（对应 $10\lg 64 \approx 18.1\text{ dB}$ 收发总阵列增益），其余 7 个奇异值全为 0。
      - item:
          id: q-los-sigma
          type: number
          prompt: 某 $4\times 4$ 远场纯视距 MIMO 信道矩阵秩为 1，且矩阵中 16 个矩阵项的幅值均为 1。收发两端对准这唯一非零模式通信时，该非零奇异值的平方 $\sigma_1^2 = N_t N_r$ 等于多少？
          answer: 16
          tolerance: 0.1
          hint: 矩阵所有奇异值平方之和等于全部矩阵项幅值平方之和；这里只有 1 个非零奇异值。
          explain: $\sum \sigma_i^2 = \sum |H_{ij}|^2 = 4 \times 4 = 16$，因仅有一个非零奇异值，故 $\sigma_1^2 = 16$（收发联合阵列增益约 12 dB）。
      - item:
          id: q-ang-res
          type: number
          prompt: 一条均匀线性天线阵列有 10 根阵元，相邻间距为半波长 $\lambda/2$，阵列归一化孔径 $L_a/\lambda = 5$。按 $\Delta\Omega = \lambda / L_a$ 计算它的方向余弦分辨率（填小数）。
          answer: 0.2
          tolerance: 0.01
          hint: 用 1 除以归一化孔径 $L_a/\lambda = 5$ 得到多少？
          explain: $\Delta\Omega = 1 / 5 = 0.2$。方向余弦取值在 $[-1, 1]$ 共宽 2，因此这条 10 阵元线阵最多能把全空间分辨成约 $2 / 0.2 = 10$ 个独立角度扇区。
      - item:
          id: q-keyhole
          type: choice
          prompt: 实际无线测量中遇到一种“钥匙孔（keyhole）”场景：发端周围散射很丰富、收端周围散射也很丰富，但两边的所有电波都必须穿过隧道或建筑间的一条窄缝才能到达对方。此时信道矩阵的秩会怎样？
          options:
            - text: 仍然满秩，因为两端本地天线各自衰落互不相关
              why: 即使两端本地天线互不相关，窄缝强迫所有能量汇成一个标量波前再发散，矩阵分解成外积导致秩塌缩。
            - text: 退化为 1（秩亏），窄缝缩成单一通道
              correct: true
            - text: 变成原天线数的一半，空间复用速率刚好减半
              why: 单一窄缝只允许一个空间模式通过，秩直接塌缩到 1，而不是减半。
            - text: 秩变为 0，收端完全收不到任何无线信号能量
              why: 信号仍能穿过窄缝到达接收端，只是所有发射流在窄缝处混叠成了一个标量，无法分辨出多路流。
          explain: 钥匙孔信道可写成 $\mathbf{H} = \mathbf{h}_r \mathbf{h}_t^H$，尽管两端各自独立瑞利衰落、相关系数为零，矩阵秩却强制为 1，说明天线不相关只是满秩的必要非充分条件。

  - id: mimo-receivers
    chapter: MIMO
    title: V-BLAST、迫零、MMSE、SIC 与 D-BLAST
    minutes: 13
    flow:
      - guess:
          id: g-mimo-rx
          type: choice
          prompt: 如果发射端不知道无线信道矩阵 $\mathbf{H}$，无法事先做奇异值分解预编码，而是让每根发射天线直接各自独立发送一路数据流，接收端能把混在空中的多路信号拆开吗？
          options:
            - text: 不能，发射端不知道信道矩阵时多路信号在空中永久混死无法分离
              why: 只要接收端知道信道矩阵且接收天线不少于发射天线，就能用线性矩阵逆或逐层消除把多路流拆开。
            - text: 能，收端已知信道且收天线足够时可用投影或消除分离
              correct: true
            - text: 只能靠不同发射天线错开时间轮流发，不能在同一时刻发送
              why: 错开时间就退化成了时分传输，失去了 MIMO 的空间复用增益。
          explain: 发端无需知道信道也能做空间复用：把多路数据流分别交给不同发射天线直接发射，由接收端利用多根接收天线做空间分离检测。
      - card:
          title: V-BLAST 与迫零、MMSE 线性接收机
          body: |
            每根发天线独立编码、各发一条流的架构叫 **V-BLAST**。收端收到 $\mathbf{y} = \sum_{k=1}^{N_t} \mathbf{h}_k x_k + \mathbf{w}$ 后，常用两种线性检测器：

            - **迫零接收机（ZF）**：将接收向量投影到其他干扰列的正交补上（方阵时左乘 $\mathbf{H}^{-1}$），完全清零流间干扰。清零 $N_t - 1$ 条干扰流后每流剩 $N_r - N_t + 1$ 阶分集，但病态信道下会显著放大噪声。
            - **最小均方误差接收机（MMSE）**：在抑干扰与控噪声放大间取最优折中，最大化每流输出信干噪比（SINR）。
      - item:
          id: q-zf-div
          type: number
          prompt: 某 2 发 5 收（$N_t = 2, N_r = 5$）独立瑞利 MIMO 系统采用 V-BLAST 发送两条独立数据流，接收端用迫零（ZF）接收机分离各流。按公式 $N_r - N_t + 1$，每条数据流能获得几阶分集？
          answer: 4
          tolerance: 0.05
          hint: 接收端有 5 根天线，消除另外 1 条干扰流要消耗 1 个空间自由度，还剩多少阶分集？
          explain: $N_r - N_t + 1 = 5 - 2 + 1 = 4$ 阶分集。若只发 1 条流做 MRC 可拿 5 阶分集，发 2 条流时 ZF 为清零干扰花掉了 1 阶。
      - card:
          title: 串行干扰消除（SIC）与快衰落遍历容量
          body: |
            线性接收机把其他流一律当噪声丢弃，其实译出一条流后即可算出它在空中产生的信号。

            **串行干扰消除（SIC）** 采取逐层剥离策略：先用 MMSE（或 ZF）译出最强流 $\hat{x}_1$，再从总接收向量减去 $\mathbf{h}_1 \hat{x}_1$，剩余干扰流减 1、下一流可用分集阶数加 1，如此重复直到全部译完。信息论证明：快衰落下，各天线独立编长码配合 MMSE-SIC（V-BLAST）无需发端信道信息即可严格达到 MIMO 遍历容量。
      - item:
          id: q-sic-order
          type: choice
          prompt: 在 V-BLAST 配合串行干扰消除（SIC）时，接收端通常应该先检测哪一条数据流？
          options:
            - text: 信号最弱的那条流，先把最难的解决掉
              why: 最弱的流译错概率最高，一旦译错再减回接收信号会把误差传播给后面所有流。
            - text: 编号为 1 的天线固定最先检测，顺序不影响性能
              why: 检测顺序决定最先面对最多干扰的那条流有多可靠，固定顺序在慢衰落下容易先译弱流导致错误传播。
            - text: 译出后输出信干噪比最高（最强）的那条流，以降低错误传播风险
              correct: true
            - text: 随机挑一条流，这样可以自动获得时间分集
              why: 随机挑顺序不会带来时间分集，反而可能先挑中深衰落流造成连锁译错。
          explain: SIC 最怕前一级判错导致“减错信号”引发错误传播；优先检测最强、最可靠的数据流，译对后干净地剥离它的干扰，后面的弱流就能在更少干扰、更高分集阶数下译出。
      - card:
          title: D-BLAST：面向慢衰落的中断最优架构
          body: |
            V-BLAST 在快衰落里表现优异，但在慢衰落里有一个短板：每条码字一直绑在同一根发射天线上，只要那根天线对应的列向量恰好掉进深衰落，整条流就中断了；而且先译的那条流只拿到最小的分集阶数，拖垮整体错误率。

            **D-BLAST（Diagonal BLAST）** 把每个码字切成小块，沿着时间与发射天线的“对角线”斜着轮流在所有发射天线上发送。这样每条流都能体验所有发射天线的信道，配合 MMSE-SIC 在慢衰落下可达到中断最优。不过它的首尾斜角会留出无法填满的空白边界开销，实现复杂度高于 V-BLAST。
      - card:
          title: 例题：看迫零接收机如何放大弱通道的噪声
          body: |
            考虑一个 $2\times 2$ 确定性信道 $\mathbf{H} = \begin{bmatrix} 1 & 0 \\ 0 & 0.5 \end{bmatrix}$，每根接收天线加性白噪声功率 $N_0 = 1$，两条数据流发射功率分别为 $P_1 = 4, P_2 = 4$。算迫零接收机左乘 $\mathbf{H}^{-1}$ 后第 2 条流的输出噪声功率和输出信噪比。
          reveal:
            - title: 第 1 步：求出信道矩阵的逆矩阵
              body: |
                $$\mathbf{H}^{-1} = \begin{bmatrix} 1 & 0 \\ 0 & 2 \end{bmatrix}$$
            - title: 第 2 步：算第 2 条流经 $\mathbf{H}^{-1}$ 后的有效噪声功率
              body: |
                接收信号第 2 分量乘以 $2$ 后变为 $x_2 + 2 w_2$，噪声功率被放大为 $2^2 N_0 = 4$。
            - title: 第 3 步：算输出信噪比
              body: |
                $$\text{SNR}_2 = \frac{P_2}{4 N_0} = \frac{4}{4} = 1$$
                如果信道矩阵两列夹角很窄（病态矩阵），噪声放大系数会变得更大，这正是 MMSE 接收机优于迫零的原因。
      - item:
          id: q-zf-noise
          type: number
          prompt: 某 $2\times 2$ 信道矩阵为 $\mathbf{H} = \begin{bmatrix} 1 & 0 \\ 0 & 0.25 \end{bmatrix}$，每根接收天线噪声功率 $N_0 = 1$，第 2 根发射天线发送功率 $P_2 = 32$。接收端左乘 $\mathbf{H}^{-1}$ 做迫零检测，求第 2 条流的输出线性信噪比。
          answer: 2
          tolerance: 0.05
          hint: 对角元 $0.25$ 取倒数是 4，噪声幅度乘 4 后噪声功率放大了多少倍？再用 $P_2$ 除以放大后的噪声功率。
          explain: $\mathbf{H}^{-1}$ 第 2 行把信号与噪声同乘 4，有效噪声功率变为 $4^2 \times 1 = 16$，故输出信噪比 $\text{SNR}_2 = 32 / 16 = 2$。
      - item:
          id: q-mmse-vs-zf
          type: choice
          prompt: 在中低信噪比或信道矩阵两列高度相关的情况下，MMSE 线性接收机相比迫零（ZF）接收机为什么更受青睐？
          options:
            - text: MMSE 接收机能够同时完全消除干扰且一点不放大噪声
              why: 任何线性滤波器都不可能既把强相关干扰严格归零又不放大噪声，MMSE 是在两者之间折中。
            - text: 容忍少量干扰抑制噪声放大，最大化 SINR
              correct: true
            - text: MMSE 不需要估计信道矩阵，迫零需要估计信道矩阵
              why: 两种相干接收机都需要接收端知道信道矩阵 $\mathbf{H}$，MMSE 还需要知道噪声方差。
            - text: MMSE 的矩阵求逆运算量比迫零低一个数量级
              why: 两者都需要做 $N_t \times N_t$ 矩阵求逆，计算复杂度在同一量级。
          explain: 迫零只顾把流间干扰强压到零，遇到接近奇异的信道时噪声会暴增；MMSE 把干扰加噪声总功率作为目标最小化，因此始终获得高于或等于迫零的输出 SINR。

  - id: dmt-beamforming
    chapter: MIMO
    title: 分集–复用折中、波束赋形与大规模 MIMO
    minutes: 13
    flow:
      - guess:
          id: g-dmt
          type: choice
          prompt: 一对 $2\times 2$ 天线系统既可以用来发同一份数据的冗余副本（拿满 $2\times 2 = 4$ 阶分集保可靠），也可以同时发 2 条独立流（拿满 2 倍空间复用提速率）。猜猜它能不能在同一个码字里同时拿到 4 阶分集和 2 倍复用？
          options:
            - text: 可以，只要码长足够长，可靠性和速率可以同时拉满到各自最大值
              why: 空间自由度是有限资源，把天线用于提速就会减少对抗深衰落的冗余度，两者存在根本折中。
            - text: 不能，追求更高的空间复用增益必然牺牲一部分分集阶数
              correct: true
            - text: 不能，2×2 系统只能二选一，中间任何折中点都不存在
              why: 通过合适的空时编码，可以在最高分集和最高复用之间连续选择折中工作点。
          explain: 多天线带来的空间资源是一笔固定预算，可以全押在可靠性（分集）上，也可以全押在速率（复用）上，或者按折中曲线按需分配。
      - card:
          title: 空间复用 vs 空间分集，以及分集–复用折中
          body: |
            多天线有两种经典用法：**空间复用**在不同天线上发送独立数据流以成倍提速；**空间分集**在不同天线上发送同一信息的冗余副本以压低误码率。

            Zheng 与 Tse 证明了独立瑞利衰落 $N_t \times N_r$ MIMO 的最优**分集–复用折中（diversity-multiplexing tradeoff, DMT）**：设目标速率随信噪比按 $R(\text{SNR}) = r\log_2\text{SNR}$ 增长（复用增益 $r$），此时中断概率按 $\text{SNR}^{-d^*(r)}$ 下降（分集增益 $d^*(r)$）。最优折中曲线是连接整点：

            $$d^*(k) = (N_t - k)(N_r - k), \quad k = 0, 1, \dots, \min(N_t, N_r)$$

            的分段折线。$r = 0$ 时拿到最大分集 $N_t N_r$；$r = \min(N_t, N_r)$ 时复用拉满，分集阶数降到 0。
      - item:
          id: q-dmt-max
          type: number
          prompt: 对一个 $3\times 3$ 独立瑞利衰落 MIMO 信道，当复用增益取 $r = 0$（固定速率、全部自由度用来抗衰落）时，理论最高分集阶数 $d_{\max} = N_t N_r$ 是多少？
          answer: 9
          tolerance: 0.05
          hint: 3 根发射天线到 3 根接收天线之间一共构成了多少条独立衰落路径？
          explain: $d^*(0) = N_t N_r = 3 \times 3 = 9$。3 发 3 收共有 9 条独立衰落支路，全部用于分集时最高可达 9 阶分集。
      - item:
          id: q-dmt-r1
          type: number
          prompt: 对 $3\times 3$ 独立瑞利 MIMO 信道，按分集–复用折中公式 $d^*(k) = (N_t - k)(N_r - k)$，当复用增益取 $r = 1$ 时，最高还能保留多少阶分集？
          answer: 4
          tolerance: 0.05
          hint: 把 $N_t = 3$、$N_r = 3$ 和 $k = 1$ 代入 $(N_t - k)(N_r - k)$ 计算。
          explain: $d^*(1) = (3 - 1)(3 - 1) = 4$。每拿走 1 单位空间复用增益，剩余分集阶数就会按折中曲线下降。
      - card:
          title: 波束赋形：把电波能量捏成手电筒
          body: |
            如果发射端（或接收端）知道用户所在的方位或信道向量，可以给天线阵列的每一根阵元乘上精心设计的复权重（调节相位和幅度），让电磁波在目标方向同相叠加、在其他方向互相抵消，这称为**波束赋形（beamforming）**。

            对 $N_t$ 根发射天线，把总功率经波束赋形精准对准单天线用户，接收功率比单天线放大 $N_t$ 倍，带来 $10\lg N_t\text{ dB}$ 的定向阵列增益，同时大幅减少泄漏给邻近用户的干扰。
      - card:
          title: 大规模 MIMO 与信道硬化
          body: |
            4G 早期基站通常只有 2 到 8 根天线，而 5G 转向了**大规模 MIMO（Massive MIMO）**：基站集成 32、64 甚至上百根阵元。当基站天线数 $M$ 远大于用户数 $K$ 时，会出现两个有利效应：

            1. **信道硬化（channel hardening）**：大数定律把 $M$ 根天线的随机小尺度衰落平均掉，等效信道增益趋于确定常数，不再剧烈起伏；
            2. **有利传播**：不同用户的高维信道向量近乎正交，简单线性预编码就能同时形成互不干扰的窄波束。
      - item:
          id: q-bf-gain
          type: number
          prompt: 某基站采用 16 根发射天线排成阵列，已知目标用户的信道相位后进行精准发端波束赋形（保持总发射功率不变）。相比单根发射天线，发端波束赋形带来的理论最大阵列增益 $10\lg N_t$ 约是多少 dB（保留一位小数）？
          answer: 12.0
          tolerance: 0.1
          unit: dB
          hint: 16 根阵元在目标方向同相叠加使有效接收功率增为 16 倍，$10\lg 16$ 约是多少？
          explain: 保持总发射功率不变时，每阵元发 $P/16$、幅度为 $1/4$，16 路同相叠加后总幅度为 $16 \times (1/4) = 4$，功率为 $4^2 = 16$ 倍，即 $10\lg 16 \approx 12.04\text{ dB}$。
      - item:
          id: q-massive-mimo
          type: choice
          prompt: 大规模 MIMO 中“信道硬化”现象给无线系统设计带来了什么实际好处？
          options:
            - text: 信道不再有自由空间路径损耗，基站覆盖距离变为无限大
              why: 信道硬化平均掉的是小尺度多径随机起伏，大尺度路径损耗和阴影遮挡依然存在。
            - text: 小尺度衰落经空间平均趋于常数，简化资源分配
              correct: true
            - text: 接收端不再需要做任何模数转换即可直接读取比特
              why: 基带数字信号处理仍需常规射频与模数转换环节。
            - text: 只需要 1 根天线就能实现信道硬化
              why: 信道硬化依赖大量独立天线单元的大数平均效应，单天线无法产生。
          explain: 当基站天线数很大时，$\|\mathbf{h}\|^2 / M$ 的方差按 $1/M$ 缩小并趋近常数，小尺度波动被“熨平”，系统甚至可以只按大尺度慢变信息做功率控制和资源分配。

  - id: fdma-tdma
    chapter: 多址接入
    title: FDMA、TDMA 与双工方式
    minutes: 11
    flow:
      - guess:
          id: g-ma
          type: choice
          prompt: 一座基站覆盖范围内的 50 部手机都要同时联网说话，如果大家在同一时刻用同一频率一起喊，信号会糊成一团。最直接的两种分开办法是什么？
          options:
            - text: 要么给每人划一条互不重叠的频率车道，要么让大家按严格时钟轮流占据不同时间段
              correct: true
            - text: 让所有手机同时提高发射功率，谁声音大谁就能全部被听清
              why: 大家都抬高功率只会把彼此的干扰一起抬高，除了最强的那一个，其余用户都会被淹没。
            - text: 把所有手机的无线电波改成不同颜色的可见光
              why: 蜂窝移动通信工作在射频微波波段，不靠可见光分用户。
          explain: 按频率切块就是频分多址（FDMA），按时间分段轮流用就是时分多址（TDMA），这是早期窄带蜂窝系统最经典的多用户共享办法。
      - card:
          title: 多址接入：FDMA 与 TDMA
          body: |
            让多个终端共享同一基站无线信道的规则称为**多址接入（multiple access）**。

            - **频分多址（FDMA）**：把可用频带划成互不重叠的窄带子信道，通话期间一人独占一条。相邻子信道间须留**保护频带**防邻道泄漏，1G 模拟系统（如北美 AMPS 模拟蜂窝，30 kHz/信道）即用 FDMA。
            - **时分多址（TDMA）**：多用户共用同一载波，时间轴分成周期重复的帧和时隙，轮流突发发送。时隙间须留**保护时间**防传播时延差引起碰撞，并依赖精密时间同步。
      - item:
          id: q-fdma-users
          type: number
          prompt: 某 FDMA 无线系统拥有 $6\text{ MHz}$ 总带宽，每个用户有效信号带宽为 $25\text{ kHz}$，相邻信道间需预留 $5\text{ kHz}$ 保护频带（即每用户平均占用 $30\text{ kHz}$）。该系统最多可同时容纳多少个用户？
          answer: 200
          tolerance: 0.1
          unit: 个
          hint: 把总带宽 $6\text{ MHz}$ 换算成 $6000\text{ kHz}$，再除以每个用户平均占用的 $30\text{ kHz}$。
          explain: $6000\text{ kHz} / 30\text{ kHz} = 200$ 个用户。保护频带减少了可用容量，是 FDMA 必须付出的开销。
      - card:
          title: 2G GSM 实例与双工方式（FDD / TDD）
          body: |
            2G 全球移动通信系统（GSM）结合了 FDMA 与 TDMA：把频带分成 $200\text{ kHz}$ 载波，每载波每帧 8 个时隙（10 MHz 可提供 $50 \times 8 = 400$ 条信道）。

            “多址”区分多用户，“双工”区分同一用户的发与收：
            - **频分双工（FDD）**：上下行占两个不同频段同时收发，需双工滤波器且频谱比例固定；
            - **时分双工（TDD）**：上下行同频分时交替，可灵活适配不对称流量；同频互易性也契合大规模 MIMO。
      - item:
          id: q-tdma-slot
          type: number
          prompt: 某 TDMA 系统的帧时长为 $4.8\text{ ms}$，平均分成 8 个时隙，每个时隙末尾留出 $0.05\text{ ms}$ 保护时间防止不同距离终端的信号碰撞。每个时隙用于发送有效数据的时长是多少毫秒（ms）？
          answer: 0.55
          tolerance: 0.01
          unit: ms
          hint: 先算每时隙总时长（$4.8 / 8$），再减去 $0.05\text{ ms}$ 保护时间。
          explain: 每时隙总时长 $4.8 / 8 = 0.60\text{ ms}$，扣除 $0.05\text{ ms}$ 保护时间后，有效发送时长为 $0.55\text{ ms}$。
      - item:
          id: q-tdd-advantage
          type: choice
          prompt: 5G 大规模 MIMO 宏基站普遍优先选用时分双工（TDD）而非频分双工（FDD），最关键的物理层原因是什么？
          options:
            - text: 上下行同频互易，可由上行导频推知下行信道
              correct: true
            - text: TDD 电磁波在空气中的传播速度比 FDD 更快，路径损耗更小
              why: 电磁波在空气里的速度与双工方式无关，始终约等于光速。
            - text: TDD 不需要任何收发转换保护时间，时间利用率恒等于 100%
              why: TDD 在下行切换成上行时必须留出转换保护间隔，防止远端下行尾波干扰基站上行接收。
            - text: TDD 允许同一天线在同一纳秒内同时满功率发射和接收
              why: TDD 正是通过错开时间来避免收发同时进行；同一时刻同频收发属于全双工而非 TDD。
          explain: 大规模 MIMO 天线多达 64 根，若用 FDD，基站发下行导频让手机逐一测量并反馈 64 个复数开销极大；TDD 上下行同频互易，手机只发 1 路简单上行导频，基站就能算出下行波束权重。
      - item:
          id: q-fdma-tdma-match
          type: match
          prompt: 把概念与它的正确作用或开销配对。
          pairs:
            - [FDMA 保护频带, 防止相邻子频带滤波滚降引起邻道干扰]
            - [TDMA 保护时间, 吸收不同距离终端传播时延差以防时隙碰撞]
            - [FDD, 上下行用不同频段成对工作，需双工器隔离收发]
            - [TDD, 上下行共用同一频段分时切换，可灵活匹配不对称流量]
          hint: 区分频域隔离与时域隔离、多用户共享与上下行双工。
          explain: FDMA 靠保护频带隔离频域，TDMA 靠保护时间隔离时域，FDD 与 TDD 则分别在频域和时域解决上下行双工问题。

  - id: cdma
    chapter: 多址接入
    title: 扩频通信、CDMA 与远近效应
    minutes: 13
    flow:
      - guess:
          id: g-cdma
          type: choice
          prompt: 鸡尾酒会上几十对客人在同一个房间里同时聊天（同频同时）。如果每一对客人都只用一种彼此互不相干的独特外语交谈，听话的人专心只听自己的母语，其他人的声音听起来像什么？
          options:
            - text: 像均匀的背景嗡嗡白噪声，只要房间里人不太挤且没人贴着耳朵大吼，就能听清搭档的话
              correct: true
            - text: 所有外语会合成一句清晰的大合唱，反而帮他提高音量
              why: 不相关的语言彼此叠加形成的是随机背景干扰，而不是有用信号增强。
            - text: 只要有两个人用不同外语同时说话，任何人都一个字也听不清
              why: 人类大脑和扩频相关接收机一样，能把不相关的干扰平均压低，同时把匹配的目标信号相干累加放大。
          explain: 这正是码分多址（CDMA）的直觉：所有用户占用同一频带同时发言，靠各不相同的“语言”（扩频码）在接收端相关提取目标信号、压低其他用户干扰。
      - card:
          title: 扩展频谱：跳频与直接序列扩频
          body: |
            把发射带宽刻意展宽到远大于原始信息速率，称为**扩展频谱（spread spectrum）**。两种基本方式：

            - **跳频（FHSS）**：收发按约定伪随机序列在多个频点间快速切换，躲避窄带干扰或单频深衰落（如蓝牙）。
            - **直接序列扩频（DSSS）**：把数据符号 $b \in \{+1, -1\}$ 乘上高速伪随机 $\pm 1$ 序列，其最小脉冲单元叫**码片（chip）**（$R_c \gg R_b$）。

            扩频带宽与原始速率之比称**扩频增益（processing gain）**：

            $$G_p = \frac{W}{R_b} = \frac{R_c}{R_b} = \frac{T_b}{T_c}$$
      - item:
          id: q-gp-calc
          type: number
          prompt: 某直接序列扩频系统原始数据速率 $R_b = 15\text{ kb/s}$，扩频码片速率 $R_c = 3.84\text{ Mcps}$。求该系统的扩频增益 $G_p = R_c / R_b$。
          answer: 256
          tolerance: 0.1
          hint: 先把 $3.84\text{ Mcps}$ 统一换算成 $3840\text{ kcps}$，再除以 $15\text{ kb/s}$。
          explain: $G_p = 3840 / 15 = 256$（约 $24.1\text{ dB}$），意味着每 1 个数据比特被展开成 256 个高速码片发送。
      - card:
          title: 码分多址（CDMA）与软容量
          body: |
            让多个用户分配不同的正交码（如 Walsh 码）或低互相关伪随机码，同频同时发射，接收端用目标用户的本地扩频码做相关解扩，这就是**码分多址（CDMA）**。

            解扩时，目标用户的 $G_p$ 个码片同相叠加，信号功率放大 $G_p^2$ 倍；而其他 $K - 1$ 个用户的扩频码与本地码不相关，等效成随机游走，每个干扰用户功率只放大 $G_p$ 倍。于是功率控制完美（所有用户到达基站功率相等）且忽略热噪声时，解扩后线性信干比为：

            $$\text{SIR} = \frac{G_p}{K - 1}$$

            CDMA 不像 FDMA/TDMA 那样有硬性的信道个数上限，多加一个用户只是让全体干扰背景微升一点，称为“软容量”。
      - item:
          id: q-cdma-sir
          type: number
          prompt: 某 CDMA 上行系统扩频增益 $G_p = 64$，功率控制使所有活跃用户到达基站的功率完全相等。忽略热噪声，当小区内共有 $K = 17$ 个用户同时发送时，每个用户解扩后的线性信干比 $\text{SIR} = G_p / (K - 1)$ 是多少？
          answer: 4
          tolerance: 0.05
          hint: 17 个活跃用户里，对某一个目标用户而言，其余作为干扰的用户有几个？用 $G_p$ 除以干扰用户数。
          explain: 其余干扰用户有 $K - 1 = 16$ 个，故解扩后线性信干比 $\text{SIR} = 64 / 16 = 4$（约 $6.0\text{ dB}$）。
      - card:
          title: 远近效应与快速功率控制
          body: |
            在 CDMA 上行里，手机 A 距基站 50 m、手机 B 距基站 1 km。按 $1/d^4$ 路径损耗，同功率发射时手机 A 到达基站的功率比 B 强 $20^4 = 160000$ 倍（52 dB）。

            即使扩频增益 $G_p = 128$（21 dB），解扩后 A 的干扰仍比 B 的信号强 31 dB，把远处用户淹没，这就是**远近效应（near-far effect）**。解法是**功率控制（power control）**：基站每秒上千次测量各手机到达功率，发信号通知近处降功率、远处升功率，使所有用户到达基站的功率保持相近。
      - card:
          title: 例题：估算 CDMA 完美功控下的用户容量
          body: |
            某 CDMA 系统语音速率 $R_b = 9.6\text{ kb/s}$，码片速率 $R_c = 1.2288\text{ Mcps}$。若要求解扩后信干比 $\text{SIR} \ge 4$（6 dB），忽略热噪声并假设功率控制完美，单小区最多支持多少个同时通话的用户？
          reveal:
            - title: 第 1 步：计算扩频增益 $G_p$
              body: |
                $$G_p = \frac{1.2288\times 10^6}{9.6\times 10^3} = 128$$
            - title: 第 2 步：由 $\text{SIR} = G_p / (K - 1) \ge 4$ 反解用户数 $K$
              body: |
                $$K - 1 \le \frac{128}{4} = 32 \implies K \le 33$$
                实际系统还要计入热噪声、邻小区干扰，并借助语音激活检测和扇区化进一步调整容量。
      - item:
          id: q-near-far
          type: number
          prompt: 某 CDMA 上行链路未开启功率控制，近处干扰用户到达基站的功率恰好是远处目标用户的 100 倍。已知扩频增益 $G_p = 64$，仅考虑这 1 个近处干扰用户，远处目标用户解扩后的线性信干比 $G_p / 100$ 是多少（填小数）？
          answer: 0.64
          tolerance: 0.01
          hint: 扩频解扩把单干扰功率相对有用信号压低了 $G_p = 64$ 倍，但原干扰比有用信号强 100 倍，比值是多少？
          explain: 解扩后干扰功率与信号功率之比为 $100 / 64$，故 $\text{SIR} = 64 / 100 = 0.64$（约 $-1.9\text{ dB}$），信号被单个近处用户淹没，这正是上行必须快速功控的原因。
      - item:
          id: q-cdma-dl-vs-ul
          type: choice
          prompt: 在 3G CDMA 系统中，为什么上行链路（手机到基站）必须依赖极严密的闭环功率控制，而下行链路（基站到手机）的远近效应没有那么致命？
          options:
            - text: 下行信号同源发出，经同一路径到达手机衰减同步
              correct: true
            - text: 下行采用的是 FDMA 频分多址，根本没有用扩频码
              why: 3G 码分多址系统（如宽带码分多址 WCDMA）上下行都采用直接序列扩频与 CDMA。
            - text: 手机接收机的扩频增益比基站高出 1000 倍
              why: 同一业务速率和码片速率下，上下行扩频增益处于同一量级。
            - text: 下行频段无线电磁波在空气中不会发生大尺度路径损耗
              why: 下行电磁波同样服从路径损耗与衰落规律，关键在于发往所有用户的信号同源同路径衰减。
          explain: 下行链路里，基站把发给全小区用户的正交扩频信号合在一起发射，到达某部手机时有用信号和同小区干扰经历了相同的路径损耗（且正交码在平坦径下几乎零互相关），不会出现某干扰比有用信号强 50 dB 的远近失衡。

  - id: multiuser
    chapter: 多址接入
    title: 多用户容量、叠加编码、机会调度与 SDMA
    minutes: 13
    flow:
      - guess:
          id: g-multiuser
          type: choice
          prompt: 基站周围有 20 部手机都在下载大文件，每部手机的无线信道都在独立地起起伏伏。为了把基站的总下载吞吐量做到最高，每个时隙应该把无线资源优先派给谁？
          options:
            - text: 固定按 1 到 20 号顺序轮流派发，绝不看当前信道好坏
              why: 固定轮询常常在某部手机正好掉进深衰落时把宝贵时隙浪费给它。
            - text: 优先把资源派给当前瞬时信道刚好处于波峰的用户，借衰落起伏赚取额外吞吐量
              correct: true
            - text: 永远只派给此刻信道最差、处于深衰落的用户
              why: 专挑衰落谷底发送会导致全网大部分时间都在低速苦撑，总吞吐量反而垫底。
          explain: 在单用户系统里衰落总被当成敌人，但在多用户系统里，几十个独立衰落的用户总有人正好站在波峰上，顺势挑选波峰用户反而能把衰落变成增益。
      - card:
          title: 上行多址与下行广播的信息论容量
          body: |
            从信息论看，正交划分（FDMA/TDMA）并非多用户容量天花板：

            - **上行多址信道（MAC）**：两用户同频同时向单天线基站发送，基站用 SIC 逐个剥离，最大和容量为：
              $$R_1 + R_2 \le \log_2(1 + \text{SNR}_1 + \text{SNR}_2)$$
              严格高于不抬峰值功率的等时间 TDMA。
            - 下行**广播（broadcast）**信道：基站对近强、远弱两用户采用**叠加编码（superposition coding）** 按不同功率叠发；弱用户把强用户的低功率分量当噪声译码，强用户先译弱用户并减去（SIC）再译自己，同样优于纯正交划分。
      - item:
          id: q-mac-sum
          type: number
          prompt: 上行多址信道中，两位用户同频同时向单天线基站发送信号，到达基站的线性信噪比分别为 $\text{SNR}_1 = 15$ 和 $\text{SNR}_2 = 16$。按和容量公式 $\log_2(1 + \text{SNR}_1 + \text{SNR}_2)$ 计算最大总频谱效率（单位 b/s/Hz）。
          answer: 5
          tolerance: 0.05
          hint: 把 $1 + 15 + 16$ 加起来得到 32，再求 $\log_2 32$ 是多少？
          explain: $1 + 15 + 16 = 32 = 2^5$，故和容量为 $\log_2 32 = 5\text{ b/s/Hz}$。
      - card:
          title: 多用户分集与比例公平调度
          body: |
            基站按各用户信道质量动态决定每时隙分给谁，称为**调度（scheduling）**。$K$ 个独立衰落用户里总有人处于波峰，专选最优用户能拿**多用户分集（multiuser diversity）** 增益，有效信噪比约随 $\ln K$ 增长。

            为避免边缘弱用户长期饿死，工程采用**比例公平调度（PF）**：每时隙选比值

            $$\frac{R_k[t]}{T_k[t]}$$

            最大者（$R_k[t]$ 为瞬时速率，$T_k[t]$ 为历史平均吞吐量），挑“相对平时最划算”的用户，兼顾效率与公平。
      - card:
          title: 例题：比例公平调度与多天线空分多址（SDMA）
          body: |
            某时隙有两个候选用户：近处用户 A 瞬时速率 $20\text{ Mb/s}$、历史平均吞吐量 $10\text{ Mb/s}$；边缘用户 B 瞬时速率 $12\text{ Mb/s}$、历史平均吞吐量 $4\text{ Mb/s}$。比例公平调度选谁？如果基站有多根天线又该如何同时服务两者？
          reveal:
            - title: 第 1 步：计算两位用户的优先级指标 $R_k / T_k$
              body: |
                用户 A：$20 / 10 = 2.0$；用户 B：$12 / 4 = 3.0$。
            - title: 第 2 步：比较得出调度结果
              body: |
                虽然用户 A 瞬时速率更高，但用户 B 此刻正站在自己平时速率 3 倍的波峰上，比例公平调度选用户 B。
            - title: 第 3 步：基站多天线下的空分多址（SDMA）
              body: |
                如果基站配有多根天线，就不必二选一：上行可用多天线 MMSE-SIC 同时分开多个用户的信号，下行可用多用户预编码（如迫零波束赋形）把各自波束精准指向不同用户且互消干扰，让多人在同一时频资源并行传输，称为**空分多址（space-division multiple access, SDMA）**（也称多用户 MIMO）。
      - item:
          id: q-pf-metric
          type: number
          prompt: 比例公平调度按 $R_k / T_k$ 选用户。当前时隙用户甲的瞬时可支持速率 $R_{\text{甲}} = 30\text{ Mb/s}$、历史平均吞吐量 $T_{\text{甲}} = 15\text{ Mb/s}$；用户乙的瞬时速率 $R_{\text{乙}} = 18\text{ Mb/s}$、历史平均吞吐量 $T_{\text{乙}} = 6\text{ Mb/s}$。求用户乙的优先级指标 $R_{\text{乙}} / T_{\text{乙}}$。
          answer: 3
          tolerance: 0.05
          hint: 用用户乙的瞬时速率 18 除以他的历史平均吞吐量 6。
          explain: 用户乙的指标 $18 / 6 = 3$，高于用户甲的 $30 / 15 = 2$，因此本时隙调度用户乙。
      - item:
          id: q-mu-diversity
          type: choice
          prompt: 在单天线基站服务 $K$ 个独立衰落用户的系统里，如果把原本平滑的恒定信道换成起伏更大的瑞利衰落信道（平均信噪比不变），采用机会调度后系统总吞吐量会怎样变化？
          options:
            - text: 必然下降，因为小尺度衰落永远只对无线系统有害
              why: 单用户时衰落有害，但多用户机会调度只挑波峰发送，起伏越大波峰越高。
            - text: 反而可能上升，易挑出更高波峰用户
              correct: true
            - text: 保持不变，因为多用户分集只取决于发射总功率
              why: 多用户分集增益来自 $K$ 个独立随机变量的最大值随分布尾部和 $K$ 增大而抬升。
            - text: 直接降为零，因为调度器无法追踪变化的信道
              why: 只要相干时间远大于调度周期和反馈时延，基站就能准确获取各用户的瞬时速率反馈。
          explain: 机会调度专门捕捉独立衰落中的上扬波峰；在相同平均功率下，衰落分布的动态范围越宽、用户数越多，最大值 $\max_k |h_k|^2$ 的期望就越高。
      - item:
          id: q-sdma-vs-su
          type: choice
          prompt: 基站装有 8 根天线，小区里有 8 台各只有 1 根天线的普通手机。通过空分多址（SDMA / 多用户 MIMO），基站在同一时频资源上最多能同时支持多少条独立空间数据流？
          options:
            - text: 最多 1 条，因为每部手机只有 1 根天线
              why: 对单部手机做点对点通信确实最多 1 条流，但 8 部位置分散的手机合起来等效于 8 根分散的接收天线。
            - text: 最多 8 条，可向 8 台手机形成空间波束
              correct: true
            - text: 最多 64 条，因为 8 根基站天线乘以 8 台手机等于 64
              why: 空间自由度受限于 $\min(M, K) = \min(8, 8) = 8$，不能超过基站天线总数。
            - text: 最多 2 条，因为 SDMA 只能在上下行各分 1 条流
              why: SDMA 在单个方向（如全下行或全上行）即可同时服务多达 $M$ 个单天线用户。
          explain: 空分多址把多天线能力释放到多用户维度：即使每台终端只有单天线，只要用户彼此空间可分，8 天线基站也能同时并行传输最多 8 条独立数据流，将总自由度提升至 $\min(M, K)$。

  - id: cellular-reuse
    chapter: 蜂窝系统与频率复用
    title: 蜂窝架构、频率复用与同频干扰
    minutes: 12
    flow:
      - guess:
          id: g-cellular
          type: choice
          prompt: 早期无线电话只在一座城市最高峰建一座超大功率发射塔，整座城共享仅有的 50 条频段信道，第 51 个人就打不进电话。把一座巨塔换成几十座低功率小基站覆盖不同街区，怎么就能同时服务几千人？
          options:
            - text: 每座小基站自己凭空造出了原本没有的新频段
              why: 国家划拨给运营商的总频谱带宽并没有增加，扩容靠的是空间上重复使用同一批频段。
            - text: 相隔足够远的小区可重复使用同一组频段
              correct: true
            - text: 小基站把通话压缩成了完全不占带宽的直流电信号
              why: 任何传输信息的信号都必须占用带宽，蜂窝扩容的核心原理是空间上的频率复用。
          explain: 无线电波功率随距离按 $1/d^3$ 至 $1/d^4$ 快速衰减；把大区切成许多低功率小区，让相距足够远的小区反复用同一组频段，总容量就随小区数量成倍增长。
      - card:
          title: 蜂窝系统与频率复用簇
          body: |
            把整个服务区铺满相邻的低功率小区（工程上常用正六边形近似圆形覆盖且无缝拼接），称为**蜂窝系统（cellular system）**。在相隔足够远的小区里重复分配同一组射频信道，称为**频率复用（frequency reuse）**。

            把全系统可用频谱无重复地分给一组相邻的 $N$ 个小区，这 $N$ 个小区合称一个**频率复用簇（cluster）**。受正六边形网格几何对称性约束，簇大小 $N$ 只能取特定值：

            $$N = i^2 + ij + j^2 \quad (i, j \text{ 为非负整值})$$

            常见取值是 $N = 1, 3, 4, 7, 12$。相邻两个使用相同频段的小区中心距离 $D$ 与小区半径 $R$ 满足经典几何关系：

            $$\frac{D}{R} = \sqrt{3N}$$
      - item:
          id: q-reuse-dr
          type: number
          prompt: 某六边形蜂窝网络采用簇大小 $N = 12$（对应 $i = 2, j = 2$）的频率复用方案。按公式 $D/R = \sqrt{3N}$ 计算最近同频小区中心距离与小区半径之比 $D/R$。
          answer: 6
          tolerance: 0.05
          hint: 把 $N = 12$ 代入 $\sqrt{3N}$，先算 $3 \times 12$ 再开平方。
          explain: $D/R = \sqrt{3 \times 12} = \sqrt{36} = 6$。最近同频基站相距 6 倍小区半径。
      - item:
          id: q-cell-cap
          type: number
          prompt: 某蜂窝系统共有 300 个双工信道，按簇大小 $N = 4$ 均匀分配给每簇的 4 个小区。若整座城市一共铺设了 20 个蜂窝小区（刚好 5 个完整簇），全城最多可同时支持多少个通话信道？
          answer: 1500
          tolerance: 0.5
          unit: 个
          hint: 全部 300 个信道在每一个完整簇里都能用上一遍，整座城市有 5 个完整簇，总容量是多少？
          explain: 每个小区分配 $300 / 4 = 75$ 个信道，20 个小区合共 $75 \times 20 = 1500$ 个信道（或直接用 $5$ 个簇 $\times 300 = 1500$）。
      - card:
          title: 同频干扰与信干比（SIR）
          body: |
            复用同一频段的小区虽然拉开了距离 $D$，它们的信号仍会以微弱功率泄漏到当前小区，形成**同频干扰（co-channel interference）**。在密集蜂窝网中，同频干扰往往远大于热噪声，成为质量瓶颈。

            有用信号功率与总干扰功率之比称为**信干比（signal-to-interference ratio, SIR）**。正六边形网格里，最近的第一圈同频干扰小区恰好有 6 个，距离都约为 $D$。当手机处于小区边缘（距本基站 $R$），路径损耗指数为 $n$ 时，忽略更远圈层，近似信干比为：

            $$\frac{S}{I} \approx \frac{R^{-n}}{6 D^{-n}} = \frac{(D/R)^n}{6} = \frac{(3N)^{n/2}}{6}$$
      - card:
          title: 例题：比较簇大小 $N = 3$ 与 $N = 4$ 的容量和干扰
          body: |
            某蜂窝网路径损耗指数 $n = 4$，仅考虑第一圈 6 个同频干扰小区。分别算 $N = 3$ 的线性信干比与分贝值，并说明把簇大小从 $N = 7$ 缩小到 $N = 3$ 的利弊。
          reveal:
            - title: 第 1 步：由 $N = 3$ 算 $D/R$ 与线性信干比
              body: |
                $D/R = \sqrt{3 \times 3} = 3$，代入 $n = 4$：
                $$\frac{S}{I} \approx \frac{3^4}{6} = \frac{81}{6} = 13.5$$
            - title: 第 2 步：换算成分贝值
              body: |
                $$10\lg(13.5) \approx 11.3\text{ dB}$$
            - title: 第 3 步：权衡簇大小 $N$ 的利弊
              body: |
                簇越小，每个小区能分到的信道数（总信道 $/ N$）越多，系统总容量越大；但 $D/R = \sqrt{3N}$ 变小，同频基站靠得更近，同频干扰增强、信干比下降。
      - item:
          id: q-sir-n4
          type: number
          prompt: 某蜂窝系统采用簇大小 $N = 4$、路径损耗指数 $n = 4$。只考虑第一圈 6 个最近同频干扰小区，按公式 $S/I = (3N)^{n/2}/6$ 计算小区边缘的线性信干比。
          answer: 24
          tolerance: 0.1
          hint: 先算 $3N = 12$，因为 $n = 4$ 所以指数 $n/2 = 2$，再把 $12^2$ 除以 6。
          explain: $S/I = (3 \times 4)^{4/2} / 6 = 12^2 / 6 = 144 / 6 = 24$（约 $13.8\text{ dB}$）。
      - item:
          id: q-sir-pathloss
          type: choice
          prompt: 在簇大小 $N$ 不变的前提下，如果把蜂窝系统从开阔郊区（$n = 3$）搬到高楼密集城区（$n = 4$），忽略热噪声、只看第一圈同频干扰，小区边缘的信干比 $S/I$ 反而会怎样变化？
          options:
            - text: 升高，因为高楼对更远的同频干扰基站衰减得比近处本小区信号更快
              correct: true
            - text: 降低，因为路径损耗指数越大，本小区信号衰减越严重所以质量必然变差
              why: 本小区信号确实变弱，但距离 $D > R$ 的干扰基站衰减得还要剧烈得多，比值 $(D/R)^n$ 反而随 $n$ 增大而增大。
            - text: 保持不变，因为信干比只由六边形几何比值 $D/R$ 决定
              why: 干扰比值 $(D/R)^n / 6$ 明确依赖路径损耗指数 $n$。
            - text: 直接降为零，因为城区高楼挡住了所有同频信号
              why: 即使 $n = 4$，本小区和邻区信号都按幂律衰减而非完全归零。
          explain: 因为 $D/R = \sqrt{3N} > 1$，指数 $n$ 越大，$(D/R)^n$ 增长越快——遮挡物帮我们更快地压制了远方的同频干扰，在干扰受限网里反而提高了 $S/I$（前提是本小区仍高过热噪声灵敏度）。

  - id: cellular-capacity
    chapter: 蜂窝系统与频率复用
    title: 扇区化、小区分裂、切换与话务量
    minutes: 12
    flow:
      - guess:
          id: g-cell-cap
          type: choice
          prompt: 商业中心人流量翻了四倍，运营商手里的频谱宽度一赫兹也没多，而且不能再缩小簇大小 $N$（否则同频干扰超标）。把原有大基站的覆盖半径缩小到原来的一半，多建几座低功率小基站，整片商圈能承载的总用户数大约变成原来的几倍？
          options:
            - text: 保持不变，因为国家划拨给运营商的总频谱宽度没变
              why: 缩小半径后，同样面积上排下的小区数成倍增加，每个小小区都能复用整套信道。
            - text: 约 2 倍，因为单小区覆盖半径缩小到原来的一半
              why: 覆盖面积正比于半径的平方 $R^2$，半径减半时面积缩小到 $1/4$ 而非 $1/2$。
            - text: 约 4 倍，同等面积可排下 4 倍小区
              correct: true
          explain: 半径从 $R$ 缩为 $R/2$，单小区覆盖面积缩为 $1/4$，同等面积可部署 4 倍数量的小区，每个小区承载相同的信道数，总面积容量扩大到 4 倍。
      - card:
          title: 扇区化、小区分裂与切换
          body: |
            应对高用户密度，蜂窝网常用两招扩容：

            - **扇区化（sectorization）**：把全向天线换成 3 副 $120^\circ$（或 6 副 $60^\circ$）定向天线。三扇区下第一圈同频干扰从 6 个减为 2 个，信干比提升 $10\lg 3 \approx 4.77\text{ dB}$，允许改用更小簇 $N$。
            - **小区分裂（cell splitting）**：在热点区增设低功率基站缩小半径，单位面积容量按 $(R_{\text{旧}}/R_{\text{新}})^2$ 增长。

            两者都会让终端更频繁穿过边界，须靠**切换（handover）** 把链路无缝移交邻区。
      - item:
          id: q-split-cap
          type: number
          prompt: 某城区原本用半径 $R = 1\text{ km}$ 的宏小区覆盖。现通过小区分裂将所有小区半径统一缩小为 $0.5\text{ km}$（总面积、总频谱和频率复用簇大小 $N$ 保持不变），理论上这片区域的总信道容量变为原来的多少倍？
          answer: 4
          tolerance: 0.05
          unit: 倍
          hint: 圆形或正六边形的面积与半径的几次方成正比？半径减半后，同样面积里能装下几个小小区？
          explain: 面积正比于 $R^2$，半径减半使单小区面积变为 $1/4$，区域内小区总数增至 4 倍，故总容量变为原来的 4 倍。
      - card:
          title: 话务量、爱尔兰 B 公式与集群效率
          body: |
            用户并非时刻都在通话，衡量业务强度的量是**话务量（traffic intensity）**，单位爱尔兰（Erlang）：

            $$A = \lambda_{\text{call}} H$$

            其中 $\lambda_{\text{call}}$ 为单位时间平均呼叫次数，$H$ 为平均通话时长。$C$ 条信道共用、占满即拒（无排队）时，阻塞概率由**爱尔兰 B 公式（Erlang B formula）** 给出：

            $$B(C, A) = \frac{A^C / C!}{\sum_{k=0}^{C} A^k / k!}$$

            核心结论是集群效率：60 条信道合用比拆成 3 个 20 条独立扇区能承载更多话务量。
      - card:
          title: 例题：算话务量、爱尔兰 B 阻塞率与蜂窝多天线
          body: |
            某小区每小时发起 120 次通话，平均每次 3 分钟；另有一微基站只有 $C = 2$ 条共享信道，话务量 $A = 1\text{ Erlang}$。分别求两者的话务量与阻塞概率，并看蜂窝里多天线的系统角色。
          reveal:
            - title: 第 1 步：统一时间单位算话务量
              body: |
                $H = 3\text{ 分钟} = 0.05\text{ 小时}$，所以 $A = 120 \times 0.05 = 6\text{ Erlang}$。
            - title: 第 2 步：代入爱尔兰 B 公式算 $C = 2, A = 1$ 的阻塞率
              body: |
                $$B(2, 1) = \frac{1^2 / 2!}{1 + 1 + 1^2/2!} = \frac{0.5}{2.5} = 20\%$$
            - title: 第 3 步：蜂窝网络中多天线的系统视角
              body: |
                在 $N = 1$ 全频复用的现代蜂窝网里，边缘用户往往不是受限于热噪声，而是受限于邻区同频干扰。此时基站多天线不仅能做空间复用提速，更常用来用窄波束减少对邻区辐射，或在收端把空间自由度用于对准强邻区干扰做零陷抑制，大幅提升全网边缘速率。
      - item:
          id: q-erlang-a
          type: number
          prompt: 某蜂窝小区在晚高峰每小时平均有 240 次呼叫请求，平均每次通话持续 2.5 分钟。求该小区的话务量 $A$（单位 Erlang）。
          answer: 10
          tolerance: 0.1
          unit: Erlang
          hint: 先把 2.5 分钟除以 60 换算成小时（$1/24$ 小时），再乘以每小时 240 次呼叫。
          explain: $H = 2.5 / 60 = 1/24\text{ 小时}$，话务量 $A = 240 \times (1/24) = 10\text{ Erlang}$。
      - item:
          id: q-erlang-b
          type: number
          prompt: 某应急基站共有 $C = 2$ 条共享语音信道，当前话务量 $A = 2\text{ Erlang}$。按爱尔兰 B 公式 $B(C, A) = \frac{A^C/C!}{\sum_{k=0}^C A^k/k!}$ 计算新呼叫被阻塞的概率（填百分比数值）。
          answer: 40
          tolerance: 0.2
          unit: '%'
          hint: 分子是 $2^2/2! = 2$，分母把 $k = 0, 1, 2$ 的三项 $1 + 2 + 2$ 加起来等于几？
          explain: 分子为 $2^2/2 = 2$，分母为 $2^0/0! + 2^1/1! + 2^2/2! = 1 + 2 + 2 = 5$，故 $B(2, 2) = 2/5 = 40\%$。
      - item:
          id: q-sector-tradeoff
          type: choice
          prompt: 把全向基站改成 $120^\circ$ 三扇区基站后，下面哪一项是扇区化带来的主要副作用？
          options:
            - text: 第一圈同频干扰基站数从 6 个增加到 18 个
              why: 120° 定向天线只照亮 1/3 圆周，第一圈有效同频干扰反而从 6 个减少到 2 个。
            - text: 信道池被切成三小份导致集群效率下降，且终端在扇区间移动增加切换次数
              correct: true
            - text: 基站发射的电磁波波长变成原来的三倍
              why: 天线方向图不改变载波频率或电磁波波长。
            - text: 小区总频谱带宽被强制削减为原来的 1/3
              why: 扇区化并不减少总频谱，反而因为干扰降低常能把簇 $N$ 从 7 缩到 3 或 4，净提升总容量。
          explain: 把总信道拆成 3 个互不借用的小池子，根据爱尔兰 B 规律集群效率会下降，且车绕基站转弯时须频繁在扇区间切换，这是换取干扰抑制必须付出的代价。

  - id: lte-phy
    chapter: 4G/5G物理层概述
    title: 4G LTE 物理层：把前面技术拼成一张网
    minutes: 11
    flow:
      - guess:
          id: g-lte
          type: choice
          prompt: 4G LTE 是第一代放弃 CDMA、全面转向全 IP 宽带分组传输的蜂窝标准。面对高速下载和省电上传的不同需求，LTE 在下行和上行选了完全相同的波形吗？
          options:
            - text: 相同，上下行全部使用不加额外变换的纯 CP-OFDM 波形
              why: 手机功放吃不消纯 OFDM 的高峰均比，4G LTE 在上行刻意换用了低峰均比的变体。
            - text: 不同，下行 OFDMA、上行低峰均比 SC-FDMA
              correct: true
            - text: 不同，下行用 OFDM，上行退回到了 1G 模拟调频
              why: 4G 上下行都是全数字宽带多载波体制，上行用的是基于 DFT 扩展的 SC-FDMA。
          explain: 基站接市电且功放余量大，下行直接用灵活的 OFDMA；手机靠电池供电，上行改用低峰均比的 SC-FDMA（即 DFT-s-OFDM），这是非常务实的工程折中。
      - card:
          title: LTE 的波形、帧结构与资源块
          body: |
            4G **长期演进（LTE）** 把 OFDM、MIMO 与调度整合成统一物理层：

            - **波形与复用**：下行用 OFDMA，上行用 SC-FDMA 降终端 PAPR；全网采用 $N = 1$ 同频复用。
            - **时频网格**：常规子载波间隔固定 $\Delta f = 15\text{ kHz}$（$T_u \approx 66.7\ \mu\text{s}$，常规 CP 约 $4.7\ \mu\text{s}$）。无线帧长 $10\text{ ms}$，分 10 个 $1\text{ ms}$ 子帧、每子帧 2 个 $0.5\text{ ms}$ 时隙（各 7 符号）。
            - **资源单元**：1 子载波 $\times$ 1 符号称**资源粒子（RE）**；12 个连续子载波（$180\text{ kHz}$）$\times$ 1 时隙称**资源块（RB）**。
      - item:
          id: q-lte-rb-bw
          type: number
          prompt: 4G LTE 常规配置下，子载波间隔固定为 $\Delta f = 15\text{ kHz}$，一个资源块（RB）在频域包含 12 个连续子载波。求一个资源块的频域宽度（单位 kHz）。
          answer: 180
          tolerance: 0.1
          unit: kHz
          hint: 把 12 个子载波乘以每个子载波 15 kHz 的间隔是多少？
          explain: $12 \times 15\text{ kHz} = 180\text{ kHz}$。LTE 支持 1.4、3、5、10、15、20 MHz 多种载波带宽，均按 180 kHz 的资源块向上拼装。
      - card:
          title: 灵活带宽、自适应调制编码与多天线
          body: |
            常见 20 MHz LTE 载波配 100 个资源块，有效占用 $100 \times 180\text{ kHz} = 18\text{ MHz}$（90% 利用率，两侧各留 1 MHz 保护带）。

            为适应快变信道，LTE 采用**自适应调制编码（AMC）**：终端每毫秒反馈信道质量，信号好时切到 64-QAM/256-QAM 配高码率提速，信号差时退回 QPSK 配低码率保连通，并结合混合自动重传（HARQ）合并重传能量。LTE-Advanced 下行最高支持 8 层 MIMO 空间复用与多用户波束赋形。
      - item:
          id: q-lte-10m
          type: number
          prompt: 4G LTE 的 10 MHz 载波配置了 50 个资源块（RB），每个资源块频域宽度为 180 kHz。实际用于发送数据的总有效带宽是多少 MHz？
          answer: 9
          tolerance: 0.05
          unit: MHz
          hint: 用 50 个资源块乘以每块 0.18 MHz（180 kHz）是多少？
          explain: $50 \times 0.18\text{ MHz} = 9\text{ MHz}$，同样占标称载波带宽的 90%，剩余 1 MHz 留作两侧保护频带。
      - item:
          id: q-lte-amc
          type: choice
          prompt: 一位用户拿着 4G 手机从基站正下方一路走进地下车库，信号信噪比从 25 dB 跌到 3 dB。LTE 的自适应调制编码（AMC）机制会自动做出什么调整？
          options:
            - text: 保持 64-QAM 不变，只把子载波间隔从 15 kHz 缩小到 1 kHz
              why: LTE 的常规子载波间隔固定为 15 kHz，且低信噪比下强行用 64-QAM 会导致误码率急剧升高至不可用。
            - text: 自动把调制方式从高阶 QAM 降为 QPSK 并降低编码码率，牺牲速率保住可靠连通
              correct: true
            - text: 切换成更高阶的 256-QAM，试图用更快速度抢在掉线前发完数据
              why: 更高阶调制星座点更密、所需信噪比门限更高，信噪比变差时升阶只会立刻全部判错。
            - text: 关闭循环前缀，把省出的时间全拿来重复发送导频
              why: 循环前缀用来抗多径，不能因为信噪比变差就关闭。
          explain: AMC 的核心是“看菜吃饭”：高信噪比用高阶调制加高码率提速率，低信噪比退回星座点稀疏的 QPSK 加强纠错码保可靠。
      - item:
          id: q-lte-grid-match
          type: match
          prompt: 把 4G LTE 物理层的四个核心概念与对应的规格或作用配对。
          pairs:
            - [子载波间隔, 常规模式固定为 15 kHz]
            - [资源粒子 RE, 时频网格里 1 个子载波乘 1 个 OFDM 符号]
            - [资源块 RB, 频域 12 个连续子载波共 180 kHz]
            - [上行 SC-FDMA, 用 DFT 扩展降低手机发射信号的峰均比]
          hint: 区分频域基本间隔、最小网格单元、12 子载波调度块与上行波形。
          explain: 这四项共同奠定了 4G LTE 物理层简洁高效的时频网格骨架，也为 5G NR 的可扩展设计提供了直接起点。

  - id: nr-phy
    chapter: 4G/5G物理层概述
    title: 5G NR 物理层：可扩展参数集、毫米波与波束管理
    minutes: 12
    flow:
      - guess:
          id: g-nr
          type: choice
          prompt: 4G LTE 固定采用 15 kHz 子载波间隔，在 2 GHz 频段跑得很好。如果 5G 要同时覆盖 700 MHz 广域农村、3.5 GHz 城市高速宽带，还要冲上 28 GHz 毫米波并支持工业机器人 1 毫秒级超低时延，继续死守固定的 15 kHz 会遇到什么麻烦？
          options:
            - text: 没有麻烦，15 kHz 在所有频段和时延场景下都是最优解
              why: 28 GHz 频段的多普勒频移和振荡器相位噪声比 2 GHz 大十几倍，15 kHz 子载波太窄会导致严重 ICI，且 1 ms 子帧对超低时延太慢。
            - text: 高频段多普勒和相位噪声大需要更宽的子载波间隔，低时延业务也需要更短的符号和时隙
              correct: true
            - text: 15 kHz 无法支持 256-QAM 调制
              why: 调制阶数取决于信噪比，与 15 kHz 间隔本身无关，真正的问题是高频损伤和时延粒度。
          explain: 5G 面对三大差异巨大的场景（高速宽带 eMBB、超可靠低时延 URLLC、海量物联网 mMTC）和跨度几十倍的频段，固定参数集不再够用，必须引入可扩展设计。
      - card:
          title: 5G 新空口与可扩展参数集
          body: |
            5G **新空口（New Radio, NR）** 以 CP-OFDM 为核心（上行支持 CP-OFDM，覆盖受限可选 DFT-s-OFDM），打破 15 kHz 限制引入可扩展**参数集（numerology）**：

            $$\Delta f = 15 \times 2^\mu\text{ kHz} \quad (\mu = 0, 1, 2, 3, 4)$$

            即 15 至 240 kHz 可选。每时隙固定 14 符号，时隙时长按 $1/2^\mu\text{ ms}$ 缩短：低频广覆盖用 $\mu = 0, 1$ 保留较长 CP；高频与低时延用 $\mu = 2, 3$ 抗相位噪声与多普勒，并支持 2/4/7 符号微时隙和自包含时隙。
      - item:
          id: q-nr-df
          type: number
          prompt: 5G NR 采用可扩展参数集 $\Delta f = 15 \times 2^\mu\text{ kHz}$。当 $\mu = 2$ 时，子载波间隔 $\Delta f$ 是多少 kHz？
          answer: 60
          tolerance: 0.1
          unit: kHz
          hint: 把 $\mu = 2$ 代入 $15 \times 2^\mu$，先算 $2^2 = 4$ 再乘以 15。
          explain: $\Delta f = 15 \times 2^2 = 15 \times 4 = 60\text{ kHz}$，此时有用符号时长缩短为 LTE 的 1/4（约 $16.7\ \mu\text{s}$）。
      - item:
          id: q-nr-slot
          type: number
          prompt: 5G NR 常规循环前缀下，每个时隙固定包含 14 个 OFDM 符号，时隙总时长为 $1 / 2^\mu\text{ ms}$。当毫米波场景采用 $\mu = 3$（120 kHz 子载波间隔）时，一个时隙持续多少毫秒（ms，填小数）？
          answer: 0.125
          tolerance: 0.002
          unit: ms
          hint: 把 $\mu = 3$ 代入 $1 / 2^\mu$，算 $1/8$ 等于多少小数。
          explain: $1 / 2^3 = 1/8 = 0.125\text{ ms}$（125 微秒），比 LTE 1 ms 子帧短了 8 倍，大幅压缩空口传输时延。
      - card:
          title: 毫米波、大规模 MIMO 与波束管理
          body: |
            5G NR 开辟了 24 GHz 以上的**毫米波（mmWave）** 高频段（频率范围 FR2），单载波即可提供 100 至 400 MHz 连续带宽。但频率从 3 GHz 升到 30 GHz 时，固定天线增益下的自由空间损耗增加 $20\text{ dB}$（100 倍），且绕射极弱、易被遮挡。

            破局之道藏在短波长里：30 GHz 半波长仅 5 mm，同等面板可排下上百阵元构成**大规模 MIMO** 阵列，用高增益窄波束补回损耗，并靠**波束管理（beam management）** 持续扫描、测量与跟踪对准。
      - card:
          title: 例题：用自由空间公式看毫米波的损耗与阵列补偿
          body: |
            对比 $f_1 = 2.8\text{ GHz}$ 与毫米波 $f_2 = 28\text{ GHz}$ 在相同距离、相同全向天线增益下的自由空间路径损耗差，并看在相同物理面积的二维平面上能多排多少倍半波长阵元。
          reveal:
            - title: 第 1 步：算自由空间路径损耗增加的分贝数
              body: |
                频率提高 10 倍，波长缩小为 $1/10$，由 $\text{FSPL(dB)} = 20\lg(4\pi d/\lambda)$，损耗增加：
                $$20\lg 10 = 20\text{ dB}$$
            - title: 第 2 步：算同等二维面积内阵元数量的倍数
              body: |
                波长缩为 $1/10$，二维平面阵元间距长宽各缩为 $1/10$，同样物理尺寸的天线面板上可容纳 $10 \times 10 = 100$ 倍数量的阵元。
            - title: 第 3 步：算波束赋形阵列增益补偿
              body: |
                仅发射端 100 倍阵元做窄波束赋形就能提供 $10\lg 100 = 20\text{ dB}$ 增益，如果收发两端都用阵列，甚至能比低频全向链路拿到更高的净信噪比——代价是必须持续做精准波束管理。
      - item:
          id: q-mmwave-loss
          type: number
          prompt: 保持收发距离和固定天线增益不变，把 5G 载波从 $3\text{ GHz}$ 提升到 $30\text{ GHz}$ 毫米波频段。根据自由空间路径损耗公式，路径损耗增加了多少 dB？
          answer: 20
          tolerance: 0.1
          unit: dB
          hint: 频率增大到 10 倍使波长缩小到 1/10，在 $20\lg(4\pi d/\lambda)$ 中对应增加了多少 dB？
          explain: $20\lg(30 / 3) = 20\lg 10 = 20\text{ dB}$。因此毫米波必须搭配大规模天线阵列波束赋形来补偿高路径损耗。
      - item:
          id: q-lte-vs-nr
          type: choice
          prompt: 对比 4G LTE 与 5G NR 的物理层核心设计，下面哪句概括准确？
          options:
            - text: LTE 上下行都只用 CP-OFDM，而 NR 上行强制只用 SC-FDMA
              why: 正好相反：LTE 上行只用 SC-FDMA，而 NR 上行同时支持 CP-OFDM（主打）和可选 DFT-s-OFDM。
            - text: LTE 固定 15 kHz；NR 可扩展参数集并引入毫米波
              correct: true
            - text: NR 放弃了 OFDM 和循环前缀，全面回归 3G 的 CDMA 扩频架构
              why: 5G NR 的基础波形依然是带循环前缀的 CP-OFDM，未回归 CDMA。
            - text: LTE 和 NR 的唯一区别是把基站和手机发射功率提高了 100 倍
              why: 基站和手机发射功率受电磁安全法规严格限制，5G 的跃升来自更大带宽、灵活参数集、大规模 MIMO 与架构演进。
          explain: 从 4G 到 5G，物理层保留了 OFDM + MIMO 骨架，通过可扩展参数集、灵活微时隙、双波形上行、毫米波大带宽和大规模 MIMO 波束管理实现了跨越式演进。

boss:
  items:
    - id: b-fspl
      type: number
      prompt: 取光速 $c = 3\times 10^8\text{ m/s}$。载波频率 $2\text{ GHz}$ 的无线信号在自由空间传播 $1\text{ km}$，自由空间路径损耗 $\text{FSPL} = 20\lg(4\pi d/\lambda)$ 约是多少 dB（保留一位小数）？
      answer: 98.5
      tolerance: 0.2
      unit: dB
      hint: 先由 $c/f$ 算出 $2\text{ GHz}$ 的波长 $\lambda = 0.15\text{ m}$，再把 $d = 1000\text{ m}$ 代入 $20\lg(4\pi d/\lambda)$。
      explain: $\lambda = (3\times 10^8)/(2\times 10^9) = 0.15\text{ m}$，$4\pi d/\lambda = 4000\pi/0.15 \approx 83775.8$，取 $20\lg(83775.8) \approx 98.47\text{ dB} \approx 98.5\text{ dB}$。
    - id: b-logdist
      type: number
      prompt: 实际城区环境采用对数距离路径损耗模型 $\overline{PL}(d) = \overline{PL}(d_0) + 10n\lg(d/d_0)$，路径损耗指数 $n = 3.5$。当收发距离从 $100\text{ m}$ 增加到 $1\text{ km}$ 时，平均路径损耗增加多少 dB？
      answer: 35
      tolerance: 0.1
      unit: dB
      hint: 从 $100\text{ m}$ 到 $1000\text{ m}$ 距离增大了多少倍？代入 $10 n \lg(d/d_0)$ 即可。
      explain: 距离增大 10 倍，$\lg 10 = 1$，因此路径损耗增加 $10 \times 3.5 \times 1 = 35\text{ dB}$。
    - id: b-shadow
      type: choice
      prompt: 在大尺度无线传播模型中，同距离不同位置因楼宇和地形遮挡引起的阴影衰落，其线性功率通常服从什么概率分布？
      options:
        - text: 均匀分布，表示遮挡衰减在上下限间等概率出现
          why: 多个独立遮挡物的衰减因子相乘，由中心极限定理在分贝域趋近钟形正态分布而非平坦均匀分布。
        - text: 对数正态分布（分贝值呈正态）
          correct: true
        - text: 瑞利分布，因为阴影衰落由半波长内的多径干涉产生
          why: 瑞利分布刻画的是小尺度无直射多径包络，不是大尺度障碍物遮挡。
        - text: 指数分布，表示大部分位置完全没有遮挡损耗
          why: 指数分布描述的是瑞利小尺度衰落的瞬时功率，不是大尺度阴影衰落。
      explain: 电磁波穿越多道墙体和障碍物时衰减因子连乘，取对数（分贝）后变成许多独立随机量相加，由中心极限定理服从正态分布，故线性功率服从对数正态分布。
    - id: b-bc
      type: number
      prompt: 某无线信道的均方根时延扩展为 $\sigma_\tau = 2\ \mu\text{s}$。按经验公式 $B_c = 1/(5\sigma_\tau)$ 估算该信道的相干带宽（单位 kHz）。
      answer: 100
      tolerance: 0.5
      unit: kHz
      hint: 先算分母 $5 \times 2\ \mu\text{s} = 10\ \mu\text{s}$，再取倒数换算成 kHz。
      explain: $B_c \approx 1 / (5 \times 2\times 10^{-6}\text{ s}) = 10^5\text{ Hz} = 100\text{ kHz}$。
    - id: b-doppler
      type: number
      prompt: 取光速 $c = 3\times 10^8\text{ m/s}$。移动终端以 $108\text{ km/h}$ 速度行驶，载波频率为 $2\text{ GHz}$，求最大多普勒频移 $f_D$（单位 Hz）。
      answer: 200
      tolerance: 0.5
      unit: Hz
      hint: 先把 $108\text{ km/h}$ 除以 3.6 换成 m/s，再用速度除以波长 $\lambda = 0.15\text{ m}$。
      explain: $v = 108 / 3.6 = 30\text{ m/s}$，$\lambda = 0.15\text{ m}$，故 $f_D = v / \lambda = 30 / 0.15 = 200\text{ Hz}$。
    - id: b-tc
      type: number
      prompt: 某移动无线信道的最大多普勒频移为 $f_D = 200\text{ Hz}$。按常用经验式 $T_c = 0.423 / f_D$ 估算信道相干时间（单位 ms，保留两位小数）。
      answer: 2.12
      tolerance: 0.05
      unit: ms
      hint: 用 0.423 除以 200 得到秒数，再乘以 1000 换成毫秒。
      explain: $T_c \approx 0.423 / 200 = 0.002115\text{ s} \approx 2.12\text{ ms}$（约 2.1 ms）。
    - id: b-fading-type
      type: match
      prompt: 把四种无线小尺度衰落类型与它们对应的判断条件配对。
      pairs:
        - [平坦衰落, 信号带宽小于相干带宽]
        - [频率选择性衰落, 信号带宽大于相干带宽，引起码间干扰]
        - [慢衰落, 码元周期小于相干时间]
        - [快衰落, 码元周期大于相干时间，单个码元内信道即变化]
      hint: 带宽对比决定平坦或频率选择性，码元时长对比决定慢衰落或快衰落。
      explain: 频域比较信号带宽与相干带宽 $B_c$，时域比较码元周期与相干时间 $T_c$，两者组合构成无线衰落的四象限分类。
    - id: b-rayleigh-ber
      type: number
      prompt: BPSK 在慢平坦瑞利衰落信道下的平均误比特率精确式为 $P_b = \frac{1}{2}(1 - \sqrt{\bar{\gamma}/(1+\bar{\gamma})})$，高信噪比近似为 $1/(4\bar{\gamma})$。当平均信噪比为 $20\text{ dB}$（线性值 $\bar{\gamma} = 100$）时，平均误比特率是多少（填百分比数值，保留两位小数）？
      answer: 0.25
      tolerance: 0.01
      unit: '%'
      hint: $\bar{\gamma} = 100$ 时，先算高信噪比近似 $1/(4\times 100)$，换成百分比是多少？
      explain: 精确值 $\frac{1}{2}(1 - \sqrt{100/101}) \approx 2.48\times 10^{-3} = 0.248\%$，高信噪比近似 $1/400 = 0.25\%$（容差同时覆盖 0.25% 与 0.248%），远差于同信噪比 AWGN 信道。
    - id: b-mrc-ber
      type: choice
      prompt: 在平均信噪比 $20\text{ dB}$（$\bar{\gamma} = 100$）的瑞利衰落信道中，单天线 BPSK 误比特率约 $2.5\times 10^{-3}$，而采用两支路最大比合并（MRC）后降到约 $1.84\times 10^{-5}$（近似 $3/(16\bar{\gamma}^2) \approx 1.9\times 10^{-5}$）。这核心说明了分集的什么作用？
      options:
        - text: 把接收机热噪声功率谱密度降低到了原来的一百分之一
          why: MRC 不改变接收机前端的物理热噪声谱密度，它改变的是误码率随信噪比下降的幂次规律。
        - text: 把高信噪比误码率下降斜率（分集阶数）从 1 提到 2
          correct: true
        - text: 仅提供 3 dB 功率平移，不改变误码率曲线的高信噪比斜率
          why: 单纯加 3 dB 功率只能让 $1/(4\bar{\gamma})$ 减半到 $1.25\times 10^{-3}$，不可能直降两个数量级到 $1.8\times 10^{-5}$。
        - text: 消除了无线信道中的多径传播，使信道变成了理想视距链路
          why: 物理多径依然存在，MRC 是靠两条独立支路几乎不同时掉进深衰落来大幅压低误码率。
      explain: 从 $O(1/\bar{\gamma})$ 变成 $O(1/\bar{\gamma}^2)$，双对数误码率曲线斜率由 $-1$ 变陡为 $-2$，每增加 10 dB 信噪比误码率降 100 倍而非 10 倍，这是分集的根本威力。
    - id: b-ofdm-df
      type: number
      prompt: 某 OFDM 系统总带宽为 $20\text{ MHz}$，划分为 $64$ 个子载波。求子载波间隔 $\Delta f$（单位 kHz）。
      answer: 312.5
      tolerance: 0.2
      unit: kHz
      hint: 用总带宽 $20000\text{ kHz}$ 除以子载波数 64。
      explain: $\Delta f = 20\text{ MHz} / 64 = 20000\text{ kHz} / 64 = 312.5\text{ kHz}$（这正是 Wi-Fi 802.11a/g 的经典配置）。
    - id: b-ofdm-tu
      type: number
      prompt: 承接常见 20 MHz 带宽、64 子载波的 OFDM 配置（子载波间隔 $\Delta f = 312.5\text{ kHz}$），求保持子载波正交所需的有用符号时长 $T_u = 1/\Delta f$（单位 $\mu\text{s}$）。
      answer: 3.2
      tolerance: 0.05
      unit: μs
      hint: 求 $1 / (312.5\times 10^3)$ 的秒数，再换算成微秒。
      explain: $T_u = 1 / (312.5\times 10^3\text{ Hz}) = 3.2\times 10^{-6}\text{ s} = 3.2\ \mu\text{s}$。
    - id: b-ofdm-cp
      type: choice
      prompt: 关于 OFDM 中循环前缀（CP）的作用及循环前缀时长 $T_{\text{cp}}$ 必须满足的条件，下面哪句表述准确？
      options:
        - text: 化线性卷积为圆周卷积消除 ISI 与 ICI，需 $T_{\text{cp}} \ge \tau_{\text{max}}$
          correct: true
        - text: 用来拉宽每个子载波的频谱以获得频率分集；要求 $T_{\text{cp}}$ 小于均方根时延扩展
          why: CP 太短于最大时延扩展时无法挡住前符号拖尾，ISI 和 ICI 都会重现。
        - text: 用来把 OFDM 的峰均功率比降到 0 dB；要求 $T_{\text{cp}}$ 等于有用符号时长的一半
          why: 复制尾部波形不改变子载波叠加的峰值幅度，对降低 PAPR 没有帮助。
        - text: 用来替代发射端的 IFFT 运算；要求 $T_{\text{cp}}$ 大于信道相干时间
          why: CP 是在 IFFT 之后追加的保护间隔，且整个符号必须远短于相干时间而非大于相干时间。
      explain: 只要 $T_{\text{cp}} \ge \tau_{\text{max}}$，去前缀后的有用窗口里多径线性卷积严格等价于圆周卷积，经 FFT 后解耦为单抽头频域乘法，同时消除 ISI 与 ICI。
    - id: b-mimo-cap
      type: number
      prompt: 高信噪比下满秩 MIMO 信道容量按 $\min(N_t, N_r)\log_2\text{SNR}$ 粗估。对于一个 $4\times 4$ 满秩 MIMO 系统，当平均信噪比为 $20\text{ dB}$（线性值 $\text{SNR} = 100$）时，粗估频谱效率约是多少 b/s/Hz（保留一位小数）？
      answer: 26.6
      tolerance: 0.2
      unit: b/s/Hz
      hint: 已知 $\log_2 100 \approx 6.644$，再乘以 $4\times 4$ 系统的最小天线数 $\min(4, 4) = 4$。
      explain: $4 \times \log_2 100 \approx 4 \times 6.6439 \approx 26.58 \approx 26.6\text{ b/s/Hz}$，约为单天线容量 $\log_2(101) \approx 6.66\text{ b/s/Hz}$ 的 4 倍。
    - id: b-mimo-div-mux
      type: choice
      prompt: 关于 MIMO 系统中“空间复用”与“空间分集”的本质区别，哪一项描述正确？
      options:
        - text: 空间复用只在接收端用多天线，空间分集只在发射端用多天线
          why: 空间复用要求收发两端都配多天线（自由度为 $\min(N_t, N_r)$），而空间分集发端、收端或两端均可实施。
        - text: 复用发独立数据流提速，分集发冗余副本提可靠
          correct: true
        - text: 两者可同时取满最大值，不存在折中
          why: 分集–复用折中定理（DMT）表明，拉高复用增益 $r$ 必然减少可用分集阶数 $d^*(r)$。
        - text: 空间复用需要纯视距无散射环境，空间分集只能在光纤中实现
          why: 空间复用恰恰需要富散射以保证信道矩阵满秩，纯视距下秩为 1 无法多流复用。
      explain: 空间复用追求更高的空间自由度和速率，空间分集追求更陡的误码率下降斜率和可靠性，两者共享有限的多天线自由度。
    - id: b-ma-match
      type: match
      prompt: 把四种多址接入方式与它们划分共享信道资源的维度配对。
      pairs:
        - [FDMA, 按互不重叠的子频带划分]
        - [TDMA, 按周期轮换的时间时隙划分]
        - [CDMA, 按彼此正交或低互相关的扩频码划分]
        - [OFDMA, 按时频网格里的正交子载波资源块划分]
      hint: 依次对照频率、时间、扩频码和二维时频资源块四个维度。
      explain: 从 1G 的 FDMA、2G 的 TDMA、3G 的 CDMA 到 4G/5G 的 OFDMA，多址接入不断在频率、时间、码字与空间维度上精细化演进。
    - id: b-cellular-sir
      type: number
      prompt: 某六边形蜂窝网络采用簇大小 $N = 7$，只考虑第一圈 6 个最近同频干扰小区，路径损耗指数 $n = 4$。按 $S/I = (3N)^{n/2}/6$ 算出小区边缘的信干比并换算成分贝 $10\lg(S/I)$（单位 dB，保留一位小数）。
      answer: 18.7
      tolerance: 0.15
      unit: dB
      hint: 先算 $3N = 21$，再算线性信干比 $21^2 / 6 = 73.5$，最后求 $10\lg 73.5$。
      explain: $D/R = \sqrt{21}$，$(D/R)^4 = 21^2 = 441$，线性 $S/I = 441 / 6 = 73.5$，换算成分贝为 $10\lg 73.5 \approx 18.66\text{ dB} \approx 18.7\text{ dB}$。
    - id: b-cellular-n
      type: choice
      prompt: 在蜂窝网络规划中，若保持总可用频谱和小区大小不变，把频率复用簇大小 $N$ 调小（例如从 7 改到 3），会带来什么结果？
      options:
        - text: 系统容量增大，但同频干扰增强
          correct: true
        - text: 频谱复用率降低、系统容量减小，同时同频干扰减弱
          why: 簇越小，每个小区能分到的信道数（总信道 $/ N$）越多，容量是增大而非减小。
        - text: 系统容量与同频干扰信干比同时得到改善
          why: 缩小 $N$ 会同步缩短 $D/R = \sqrt{3N}$，拉近同频干扰源，容量与信干比是此消彼长的折中。
        - text: 既不改变系统容量也不影响同频干扰，只调整基站编号方式
          why: 簇大小 $N$ 直接决定每小区可用信道数和复用距离 $D/R$，是蜂窝规划最核心的权衡。
      explain: 簇大小 $N$ 越小，每小区可用信道数按 $1/N$ 增加，但 $D/R = \sqrt{3N}$ 缩小导致同频干扰急剧上升，必须配合扇区化、功率控制或干扰协调来维持通信质量。
    - id: b-4g5g
      type: choice
      prompt: 关于 4G LTE 与 5G NR 物理层在波形、子载波间隔和多天线上的特点对比，哪一项正确？
      options:
        - text: LTE 下行 OFDMA/上行 SC-FDMA、固定 15 kHz；NR 可扩展参数集、支持毫米波与大规模 MIMO 波束管理
          correct: true
        - text: LTE 采用 CDMA 波形和 60 kHz 固定间隔；NR 改用 FDMA 和 15 kHz 固定间隔
          why: LTE 早已转向 OFDM（15 kHz），而 NR 采用的正是 $15\times 2^\mu\text{ kHz}$ 可扩展 OFDM 波形。
        - text: LTE 已全面使用 28 GHz 毫米波与 240 kHz 间隔；NR 为节电退回 15 kHz 单天线体制
          why: 毫米波与可扩展高子载波间隔是 5G NR 引入的新特性，LTE 主要工作在 6 GHz 以下且常规间隔固定 15 kHz。
        - text: LTE 与 NR 均禁止在上行使用 DFT 扩展 OFDM，上下行都只允许纯 CP-OFDM
          why: LTE 上行强制采用 SC-FDMA（即 DFT-s-OFDM），NR 上行也保留了 DFT-s-OFDM 选项用于覆盖受限场景。
      explain: LTE 用固定 15 kHz、下行 OFDMA/上行 SC-FDMA 搭建了 4G 宽带基础；NR 进一步引入可扩展参数集、双波形上行、毫米波频段以及大规模 MIMO 和波束管理。
