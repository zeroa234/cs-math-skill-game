skill: H.2.8
version: 2
authors: [main-agent]
brief:
  why: 一块芯片有几十亿个晶体管，从功能描述到能交给工厂的版图，几乎每一步都由软件里的算法完成。这一站讲这些算法：逻辑综合怎样化简和映射布尔函数，物理设计怎样把网表划分、布图、布局、布线，静态时序分析和电路仿真怎样算延迟和电压，物理验证怎样检查版图。它们大多是规模极大的图和优化问题，算法分析与设计里的图搜索、动态规划和启发式方法在这里都用得上。
  outcomes:
    - 用 Quine–McCluskey 求质蕴涵项和最简与或式，构造简化有序二元决策图，用因式分解和提取公因式减少字面量
    - 用树上的动态规划求技术映射的最小代价覆盖，说明为什么要在扇出处把网络拆成树
    - 计算割和 Kernighan–Lin 交换增益，说明 FM 和多级划分的做法
    - 用波兰表达式和尺寸优化算布图外框，说明模拟退火、引脚分配和电源网络
    - 估算半周长线长和斯坦纳树长度，用二次布局解线性方程组求单元位置，做简单的合法化
    - 用迷宫布线求最短走线，计算溢出和通道密度，用左边算法排通道，说明协商拥塞、开关盒布线、多重图形和零偏斜时钟树
    - 按拓扑次序计算到达时间、要求到达时间和松弛量，找出关键路径，估算 Elmore 延迟和插缓冲器的效果
    - 说明编译式和事件驱动逻辑仿真，用改进节点分析和牛顿–拉夫逊法求非线性电路的工作点，用后向欧拉法做一步时间积分
    - 说明 DRC 的宽度、间距、包围检查和图层布尔运算，说明 LVS 怎样提取器件、建立连接和比较网表
terms:
  - term: 电子设计自动化
    def: 用软件完成芯片设计的各个步骤，从逻辑综合到布局布线和验证，简称 EDA。
  - term: 逻辑综合
    def: 把用硬件描述语言写的电路行为转换成由单元库里的门组成的网表。
  - term: 门
    def: 实现基本逻辑运算的电路，如与门、或门、非门（反相器）、与非门。
  - term: 引脚
    def: 门、单元或模块上用来接线的端点。
  - term: 版图
    def: 芯片每一层材料的几何图形，工厂照着它制造芯片。
  - term: 单元
    def: 单元库里现成的门或小电路，网表和布局都以它为基本单位。
  - term: 时钟
    def: 按固定周期在 0、1 之间跳变的信号，存数据的单元在每次跳变时把输入存下来。
  - term: 时序
    def: 信号能否在规定的时间（通常是一个时钟周期）内按时到达的要求。
  - term: 网表
    def: 记录电路里有哪些单元、它们的引脚之间怎样相连的清单，不含位置信息。
  - term: 物理设计
    def: 把网表变成版图的过程，包括划分、布图规划、布局、时钟树综合、布线和物理验证。
  - term: 划分
    def: 把网表切成几部分，让被切断的连线尽量少，同时各部分的大小大致相当。
  - term: 布图规划
    def: 在摆放单个单元之前，先定出各个大模块在芯片上的位置和形状。
  - term: 布局
    def: 确定每个单元在芯片上的具体位置，目标是线长短、不拥塞、满足时序。
  - term: 布线
    def: 给每个线网找出具体的金属走线和通孔，把它的所有引脚连起来。
  - term: 线网
    def: 网表里把若干个引脚连在一起的一根“线”，可以连两个或更多引脚。
  - term: 端口
    def: 芯片或模块对外的引脚。
  - term: 度
    def: 图里一个顶点连着的边数。
  - term: 扇出
    def: 一个门的输出接到的门输入的个数。
  - term: 超图
    def: 一条边可以同时连接任意多个顶点的图；网表就是一张超图，每个线网是一条超边。
  - term: 函数
    def: 把每一组输入对应到一个输出的规则；布尔函数的输入和输出都只取 0 或 1。
  - term: 变量
    def: 函数的输入，用字母表示，如 a、b、c；在布尔函数里每个变量只取 0 或 1。
  - term: 乘积项
    def: 若干个变量或其反变量相与得到的项，如 $a\overline b c$。
  - term: 最小项
    def: 包含全部变量（每个变量取原变量或反变量）的乘积项，恰好在一种输入组合下为 1。
  - term: 质蕴涵项
    def: 只在函数为 1 处为 1、并且再去掉任何一个变量就不成立的乘积项。
  - term: 简化有序二元决策图
    def: 按固定的变量顺序逐个判断变量、合并相同子图并删去多余节点后得到的布尔函数表示，简称 ROBDD。
  - term: 字面量
    def: 逻辑式中出现的一个变量或反变量，每出现一次算一个，用来估计电路的大小。
  - term: 核
    def: 一个逻辑式除以某个乘积项后得到的、至少有两项且不能再提出公共因子的商，用来寻找可以共享的公共子式。
  - term: 主题图
    def: 把逻辑网络全部拆成二输入与非门和反相器后得到的图，技术映射在它上面做覆盖。
  - term: 技术映射
    def: 用单元库里现成的门去覆盖主题图，选出总代价（面积或延迟）最小的实现。
  - term: 割
    def: 划分以后两部分之间被切断的边（或线网）的数目。
  - term: 平衡约束
    def: 划分时要求各部分的大小（顶点数或面积）不超出规定范围的条件。
  - term: 多级划分
    def: 先把图逐层合并缩小、在最小的图上划分，再逐层展开并细化的划分方法。
  - term: 模块
    def: 布图规划里的大块，如处理器核、存储器，有的形状固定，有的面积固定、长宽可调。
  - term: 切分布图
    def: 可以反复用一刀横切或竖切、一直切到每块只有一个模块的布图。
  - term: 波兰表达式
    def: 把切分布图按“先写两个对象、再写拼法”的顺序写下来的表示法，V 表示左右并排，H 表示上下叠放。
  - term: 模拟退火
    def: 随机改动解，变好就接受、变差按概率 $e^{-\Delta/T}$ 接受，并逐渐降低温度 $T$ 的优化方法。
  - term: 引脚分配
    def: 决定每个信号从模块边上或芯片外围的哪个位置进出，让连线短、交叉少。
  - term: IR 压降
    def: 电流流过电源网络的电阻造成的电压下降，会让单元得到的电压偏低、变慢。
  - term: 半周长线长
    def: 包住一个线网全部引脚的最小矩形的半个周长，简称 HPWL，是布局最常用的线长估计。
  - term: 直角斯坦纳最小树
    def: 只走横线竖线、允许在引脚之外加分叉点、总长最短的连接树，简称 RSMT。
  - term: 拥塞
    def: 某个区域要经过的线太多、超过了能提供的布线资源的情况。
  - term: 二次布局
    def: 把连线长度换成坐标差的平方，求导令为零、解线性方程组得到单元位置的布局方法。
  - term: 力导向布局
    def: 把连线当成弹簧、求各单元受力平衡位置的布局方法。
  - term: 最小割布局
    def: 反复把区域和网表一分为二、每次让割最小的布局方法。
  - term: 合法化
    def: 把全局布局的结果挪到单元行和格位上、消除重叠，并让总移动距离尽量小。
  - term: 详细布局
    def: 合法化之后在局部交换、重排、镜像单元，继续缩短线长或改善时序。
  - term: 全局布线
    def: 只决定每个线网经过哪些全局布线单元，不定具体轨道的粗布线。
  - term: 全局布线单元
    def: 全局布线时把芯片划成的小方格，英文 gcell。
  - term: 详细布线
    def: 在全局布线给出的区域里给线网分配具体的金属轨道和通孔。
  - term: 布线容量
    def: 相邻两个全局布线单元的公共边界上能并排走的线的条数。
  - term: 溢出
    def: 一条边上经过的线网数超出布线容量的部分。
  - term: 迷宫布线
    def: 从源点一圈圈标号扩展到目标、再沿标号回溯的布线算法（Lee 算法），即网格上的宽度优先搜索。
  - term: A 星搜索
    def: 按“已走代价 + 到目标的估计代价”先扩展最小者的搜索；估计不高估时仍保证最短。
  - term: 汉南网格
    def: 过每个引脚画横线和竖线得到的网格，一定有一棵直角斯坦纳最小树的分叉点都在它的交点上。
  - term: 拆线重布
    def: 把经过溢出处的线网拆掉、提高拥挤处的代价后重新布线，反复进行。
  - term: 协商拥塞
    def: 给每条边的代价加上随溢出累积的历史项，让线网在多轮重布中自己让出拥挤资源的方法。
  - term: 整数线性规划
    def: 变量限定为整数（常为 0 或 1）、目标和约束都是线性式的优化问题，简称 ILP。
  - term: 通道
    def: 两排单元之间留出的横向走线区域，上下两边有引脚。
  - term: 通道密度
    def: 通道里各列同时被线网区间覆盖的最大数目，是所需轨道数的下限。
  - term: 垂直约束图
    def: 同一列上边引脚的线网指向下边引脚的线网的有向图，规定横线的上下次序，简称 VCG。
  - term: 左边算法
    def: 按区间左端从小到大往轨道上放线网、不重叠就放进当前轨道的通道布线算法。
  - term: 狗腿
    def: 让一个线网的横线在中途拐弯、分成两段放在不同轨道上的做法。
  - term: 开关盒
    def: 四条边上都有引脚、尺寸固定的矩形布线区域。
  - term: 单元上方布线
    def: 利用单元没有用到的上层金属，直接从单元上空走线，简称 OTC 布线。
  - term: 多重图形
    def: 把同一层上靠得太近的图形分到两张或更多掩模上分别曝光的制造方法。
  - term: 触发器
    def: 在时钟边沿那一刻把输入存下来、保持到下一个边沿的存储单元。
  - term: 时钟偏斜
    def: 同一个时钟到达不同触发器的时间之差，最晚减最早。
  - term: H 树
    def: 从中心画 H、在四个端点上再画小一半的 H、如此递归的时钟网络，各端点路径长度相同。
  - term: 缓冲器
    def: 把信号重新放大、不改变逻辑值的小门，用来切开长线或驱动大负载。
  - term: 静态时序分析
    def: 不给具体的输入，只按电路结构和各段延迟算出每个点最晚的到达时间并检查时序，简称 STA。
  - term: 到达时间
    def: 信号在电路某一点最晚稳定下来的时刻，由所有输入路径中最慢的一条决定。
  - term: 建立时间
    def: 触发器要求数据在时钟边沿之前至少保持稳定的时间。
  - term: 要求到达时间
    def: 为满足时序，信号最晚必须到达某一点的时刻，从终点的周期减建立时间往回推得到。
  - term: 松弛量
    def: 要求到达时间减去到达时间，为负表示时序违例。
  - term: 松弛
    def: 静态时序分析里松弛量的简称，等于要求到达时间减去到达时间。
  - term: 关键路径
    def: 松弛量最小（最慢）的那条路径，决定了电路能跑的最高频率。
  - term: Elmore 延迟
    def: 把 RC 树里从源点到目标路径上每个电阻乘以它下游的全部电容再求和得到的延迟估计。
  - term: 时序驱动布局
    def: 按时序分析的结果给关键线网加权或加约束的布局方法。
  - term: 物理综合
    def: 布局后根据真实的线长和负载修改网表来修时序，如调整门尺寸、插缓冲器、复制门。
  - term: 逻辑仿真
    def: 给电路加上输入，按各门的逻辑功能算出各点的逻辑值，用来检查功能。
  - term: 编译
    def: 把一段描述预先整体翻译成可以直接运行的形式，运行时不再逐句解释。
  - term: 编译式仿真
    def: 把门按拓扑次序排好，每个周期把每个门都算一遍的逻辑仿真。
  - term: 事件驱动仿真
    def: 只在信号变化时重新计算受影响的门，并按门延迟把新的变化排进时间队列的逻辑仿真。
  - term: 毛刺
    def: 由路径延迟不同引起的、信号在稳定前出现的短暂错误脉冲。
  - term: 改进节点分析
    def: 以节点电压和电压源电流为未知量列电路方程的方法，SPICE 类仿真器都用它，简称 MNA。
  - term: 牛顿–拉夫逊法
    def: 在当前猜测处用切线代替曲线、取切线的零点作为下一个猜测的迭代求根方法。
  - term: 伴随模型
    def: 在某一步迭代或时间步里，把非线性元件或电容替换成的“电导并联电流源”的线性等效电路。
  - term: 收敛
    def: 迭代的结果越来越接近某个值，相邻两步的变化小到可以忽略。
  - term: 后向欧拉法
    def: 用 $(v_{n+1} - v_n)/h$ 代替下一时刻的变化率、推进一步的数值积分方法，步长大也不会越算越大。
  - term: 设计规则
    def: 工厂规定的版图几何规则，如每层的最小宽度、最小间距、包围和伸出长度。
  - term: 设计规则检查
    def: 用程序逐条检查版图是否违反设计规则，简称 DRC。
  - term: 规则文件
    def: 写明 DRC 或 LVS 要做哪些图层运算和检查的脚本。
  - term: 版图与原理图比对
    def: 从版图提取出电路网表，与原理图网表逐个器件、逐条连接比较是否一致，简称 LVS。
  - term: 器件提取
    def: 按图层运算从版图里认出晶体管、电阻等器件，并量出它们的尺寸。
lessons:
  - id: eda-intro
    chapter: 逻辑综合与布尔优化
    title: 电子设计自动化在做什么
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一块芯片有几十亿个晶体管。从工程师写下电路的功能描述，到得到能交给工厂的版图，中间大部分工作由谁完成？
          options:
            - text: 一系列软件，按算法自动完成
              correct: true
            - text: 工程师逐个画晶体管
              why: 几十亿个晶体管不可能手画；工程师写描述、定约束、查结果，中间的转换由软件完成
            - text: 工厂拿到功能描述后，自己设计出版图再制造
              why: 工厂只按交来的版图制造，不负责设计
          explain: 从功能描述到版图要经过综合、布局、布线、验证等很多步，每一步都是规模极大的组合优化问题，靠软件里的算法完成。
      - card:
          title: 电子设计自动化
          body: |
            用软件来设计芯片，叫**电子设计自动化（EDA, electronic design automation）**。芯片里的电路由逻辑**门（gate）**搭成：与门在输入全为 1 时输出 1，或门有一个输入为 1 就输出 1，非门（也叫反相器）把 0 和 1 互换，与非门是与门后面接一个非门。门上接线的端点叫**引脚（pin）**。

            工厂照**版图（layout）**制造芯片，版图是每一层材料的几何图形。
      - item:
          id: layout-meaning
          type: choice
          prompt: 设计方把什么交给工厂，工厂照着它制造芯片？
          options:
            - text: 版图，即每一层材料的几何图形
              correct: true
            - text: 门和它们连接关系的清单
              why: 连接清单里没有位置和形状，工厂没法照着做；它要先经过布局、布线等步骤变成版图
            - text: 电路功能的文字描述，工厂会按描述自己画出图形
              why: 工厂只按交来的版图制造，不负责设计
          explain: 版图规定了每一层图形画在哪里、有多大，工厂照着它一层层做出来。从功能描述到版图之间的每一步，正是 EDA 软件要做的事。
      - card:
          title: 从描述到版图
          body: |
            设计分几个层次：先写系统规格和结构，再用硬件描述语言写出电路的行为；**逻辑综合（logic synthesis）**把它变成**网表（netlist）**，即“用了哪些门、它们的引脚怎样相连”的清单。单元库里每个现成的门或小电路叫一个**单元（cell）**；网表里连在一起的一组引脚叫一个**线网（net）**。**物理设计（physical design）**把网表变成版图，最后验证、交给工厂。这一站讲这些步骤背后的算法。
      - item:
          id: netlist-meaning
          type: choice
          prompt: 逻辑综合的输出“网表”里记录的是什么？
          options:
            - text: 门和它们的连接关系
              correct: true
            - text: 每个门在芯片上的坐标
              why: 坐标是布局之后才有的；网表只记录连接关系
            - text: 每一层版图的几何图形
              why: 几何图形是物理设计的结果，网表里没有
          explain: 网表是一张连接清单：每个门是一个单元，每条把若干引脚连在一起的线叫一个线网。物理设计再决定它们放在哪里、线怎样走。
      - card:
          title: 时钟和时序
          body: |
            数字电路按一个公共的节拍工作。这个节拍信号叫**时钟（clock）**，它按固定周期在 0、1 之间跳变，存数据的单元在每次跳变时把输入存下来；把时钟送到每个存数据单元的树状网络叫时钟树。信号从一个存数据单元出发、经过若干门到达下一个，必须在一个周期内到达，这类要求叫**时序（timing）**。时钟频率越高，周期越短，时序越难满足。
      - card:
          title: 物理设计的几步
          body: |
            物理设计依次是：**划分（partitioning）**把大网表切成几块；**布图规划（floorplanning）**定出各大块的位置和形状；**布局（placement）**定出每个单元的位置；时钟树综合；**布线（routing）**给每个线网找出具体的走线；再反复修改，直到满足时序（这一步叫 timing closure）；最后是物理验证。

            每一步都在若干约束下优化某个目标：面积、线长、延迟、功耗、拥塞。
      - item:
          id: flow-order-pd
          type: order
          prompt: 把物理设计的几步按先后排好。
          steps:
            - 划分
            - 布图规划
            - 布局
            - 时钟树综合
            - 布线
            - 物理验证
          explain: 先把网表分块、定好大块的位置，再放每个单元；时钟树要在单元位置定下后建；布线连上所有线网（包括时钟树）；最后检查版图是否合规、和网表一致。
      - card:
          title: 设计风格
          body: |
            同样的流程，按芯片的做法不同而有不同的约束。全定制：每个晶体管都可以自由设计，最灵活也最费人力。标准单元：单元高度统一，排成一行行，布局就是在行里给单元找位置。门阵列：晶体管位置已经固定，只能设计连线。FPGA：芯片做好了，布局布线是把逻辑放进固定的逻辑块、选好已有的连线开关。

            约束越多，问题越规整，算法越容易做，但芯片的性能和面积越难做到最好。
      - item:
          id: style-constraint
          type: choice
          prompt: 在门阵列上做设计，物理设计算法可以改变什么？
          options:
            - text: 只能定逻辑放在哪些预制的管子上、怎样连线
              correct: true
            - text: 可以随意改变每个晶体管的尺寸
              why: 门阵列的晶体管已经做好，尺寸和位置都固定，能改的只有连线
            - text: 什么都改不了，晶体管和连线都已做好，不需要物理设计
              why: 门阵列只预先做好晶体管，上面几层连线要按每个设计定制；决定逻辑映射到哪些晶体管、怎样连线，正是它的物理设计
          explain: 门阵列预先做好了晶体管阵列，每个设计只定制上面几层金属连线。算法的自由度小了，问题也简单了。
      - item:
          id: objective-conflict
          type: choice
          prompt: 布局时把单元挤得越紧，总线长通常越短。为什么不能无限地挤？
          options:
            - text: 太挤会让局部的线多到布不下，也可能违反时序和功耗要求
              correct: true
            - text: 挤紧了芯片面积反而变大
              why: 挤紧会让面积更小；问题是局部线太多（拥塞），布线时走不通
            - text: 单元之间必须留出相等的距离
              why: 没有这种要求；单元可以紧挨着放，限制来自布线资源和其他目标
          explain: 物理设计是多目标的：线长、拥塞、时序、功耗互相牵制。只追求一个目标，别的就会出问题。
  - id: complexity-graphs
    chapter: 逻辑综合与布尔优化
    title: 规模、难度和图的语言
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个网表有一千万个单元。某个布局算法的运行时间和单元数的平方成正比。这样的算法能用吗？
          options:
            - text: 很难用，平方增长太慢
              correct: true
            - text: 能用，现在的计算机每秒能算几十亿次
              why: $10^7$ 的平方是 $10^{14}$，每秒算 $10^9$ 次也要一天多，而布局要反复跑很多次
            - text: 能用，平方增长和线性增长差不多
              why: 规模一大差别就很悬殊：一千万个单元时，平方比线性多出一千万倍的计算
          explain: EDA 的问题规模动辄上千万，只有接近线性（如 $n\log n$）的算法才跑得动；平方级的只能用在小块上。
      - card:
          title: 规模和复杂度
          body: |
            运行时间随规模 $n$ 增长的快慢用大 O 记号描述。芯片设计里 $n$ 是单元、线网的个数，常在百万到上亿，$O(n^2)$ 在全芯片上已经太慢，实用的算法多是 $O(n\log n)$ 或接近线性的。

            更难的是，划分、布局、布线的最优解问题大多是 NP 难的：目前不知道有多项式时间的精确算法。所以 EDA 普遍用启发式算法：不保证最优，但能在可接受的时间里给出足够好的解。
      - item:
          id: n2-hours
          type: number
          prompt: 一个算法对 $n$ 个单元要做约 $n^2$ 次基本运算。$n = 10^7$，计算机每秒做 $10^9$ 次。大约要多少小时？
          answer: 27.8
          tolerance: 0.1
          unit: h
          hint: 一共多少次运算？换成秒再换成小时是多少？
          explain: $10^{14}/10^9 = 10^5$ s，除以 3600 约 27.8 h。换成 $n\log_2n \approx 2.3\times10^8$ 次的算法只要 0.23 s。
      - card:
          title: 用图描述电路
          body: |
            电路的连接关系用图来描述：单元是顶点，连接是边。可一个线网常常同时连着三四个甚至几十个引脚，一条普通的边只能连两个顶点。能连任意多个顶点的“边”叫超边，由超边组成的图叫**超图（hypergraph）**，网表就是一张超图。

            很多算法只会处理普通的图，于是把超边换成普通边：团模型把一个线网里的引脚两两相连，星模型加一个虚拟的中心点、每个引脚连到它。
      - item:
          id: clique-edges
          type: number
          prompt: 一个线网连着 5 个引脚。用团模型（引脚两两之间连一条边）换成普通的图，要多少条边？
          answer: 10
          hint: 5 个顶点两两配对有多少对？
          explain: $\binom52 = 5\times4/2 = 10$ 条。线网的引脚多时团模型的边数按平方增长，所以大线网常改用星模型（5 个引脚只要 5 条边）。
      - card:
          title: 网表里的常用词
          body: |
            芯片或模块对外的引脚叫**端口（port）**。图里一个顶点连着几条边，叫它的**度（degree）**；一个门的输出接到几个门的输入，叫它的**扇出（fan-out）**。沿着边从一个顶点走到另一个顶点，经过的一串顶点是一条路径；连通而没有圈的图是树。划分、布局、布线都在这样的图上做。
      - card:
          title: 例题：一个线网三种算法
          body: 一个线网连着 $k$ 个引脚。分别用团模型、星模型表示，各要多少条边？$k = 20$ 时差多少？
          reveal:
            - title: 第 1 步：团模型
              body: 两两相连，$\binom k2 = k(k - 1)/2$ 条；$k = 20$ 时 190 条。
            - title: 第 2 步：星模型
              body: 加一个中心点，每个引脚一条，$k$ 条；$k = 20$ 时 20 条。
            - title: 第 3 步：怎样选
              body: 引脚少时两者差不多，团模型不用加点；引脚多时团模型边数暴涨，还会让这个线网在优化里占过大的分量，这时用星模型。
      - item:
          id: star-vs-clique
          type: number
          prompt: 一个线网连着 12 个引脚。团模型比星模型多用多少条边？
          answer: 54
          hint: 团模型和星模型各要几条边？
          explain: 团模型 $12\times11/2 = 66$ 条，星模型 12 条，多 54 条。
      - item:
          id: why-heuristic
          type: choice
          prompt: 布局的最优解问题是 NP 难的。实际的布局工具怎么办？
          options:
            - text: 用启发式算法，在合理时间内找足够好的解
              correct: true
            - text: 用穷举法，只是要算很久
              why: 一百个单元的摆法已有 $100!$ 种，上百万个单元穷举在宇宙寿命内也算不完
            - text: 不做布局，随机摆放
              why: 随机摆放线长极长、布不通；启发式算法比随机好得多，只是不保证最优
          explain: NP 难意味着目前没有已知的多项式时间精确算法。工程上接受“足够好”的解，用划分、解析方法、模拟退火等启发式算法。
  - id: two-level
    chapter: 逻辑综合与布尔优化
    title: 两级逻辑最小化
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: $F = \overline a\,\overline b\,\overline c + \overline a\,b\,\overline c$（$\overline a$ 表示 a 取反）。这个式子能化简吗？
          options:
            - text: 能，两项只差 b，合起来是 $\overline a\,\overline c$
              correct: true
            - text: 不能，两项各有三个变量，已经最简
              why: 两项只在 b 上不同，$b + \overline b = 1$，b 可以消掉
            - text: 能，结果是 $\overline a$
              why: 两项都有 $\overline c$，c 消不掉；只有 b 被消掉
          explain: $\overline a\,\overline c(\overline b + b) = \overline a\,\overline c$。只差一个变量的两项可以合并，这是两级化简的基本动作。
      - card:
          title: 与或式和最小项
          body: |
            输入、输出都只取 0 或 1 的**函数（function）**叫布尔函数，它的输入叫**变量（variable）**。布尔函数可以写成若干**乘积项（product term）**（几个变量或其取反相与）再相或，叫与或式，用一级与门加一级或门实现，叫两级逻辑。含全部变量的乘积项叫**最小项（minterm）**，按 abc 的二进制值编号，如 $\overline a\,b\,\overline c$ 是 010，即 $m_2$。$F = \sum m(0, 2, 3, 7)$ 表示 F 在这四个输入下为 1。

            两级最小化要找乘积项最少（其次变量最少）的与或式。
      - item:
          id: minterm-number
          type: number
          prompt: 三个变量按 a、b、c 的顺序编号，最小项 $a\,\overline b\,c$ 的编号是几？
          answer: 5
          hint: a、b、c 各取 1 还是 0？拼成的二进制数是多少？
          explain: a = 1、b = 0、c = 1，二进制 101，即 5，记作 $m_5$。
      - card:
          title: 质蕴涵项和覆盖
          body: |
            一个乘积项为 1 时 F 一定为 1，就叫 F 的蕴涵项。不能再去掉任何一个变量（去掉后就会覆盖到 F 为 0 的输入）的蕴涵项叫**质蕴涵项（prime implicant）**。

            Quine–McCluskey 方法：把最小项按 1 的个数分组，相邻组只差一位的两两合并，反复合并到不能再合并，剩下的就是全部质蕴涵项；再从中选最少的几个，盖住 F 的每一个最小项。只有一个质蕴涵项能盖住的最小项，那个质蕴涵项必选，叫必要质蕴涵项。
      - card:
          title: 例题：化简 Σm(0, 2, 3, 7)
          body: 用 Quine–McCluskey 方法化简 $F(a, b, c) = \sum m(0, 2, 3, 7)$。
          reveal:
            - title: 第 1 步：两两合并
              body: 000 和 010 合成 0-0（$\overline a\,\overline c$）；010 和 011 合成 01-（$\overline a\,b$）；011 和 111 合成 -11（$bc$）。再没有能合并的了，这三个都是质蕴涵项。
            - title: 第 2 步：找必要质蕴涵项
              body: $m_0$ 只被 $\overline a\,\overline c$ 盖住，$m_7$ 只被 $bc$ 盖住，这两个必选。
            - title: 第 3 步：检查剩下的
              body: 选了这两个，$m_2$、$m_3$ 也已经盖住，$\overline a\,b$ 不需要。$F = \overline a\,\overline c + bc$。
      - item:
          id: pi-count
          type: number
          prompt: $F(a, b, c) = \sum m(0, 1, 2, 5, 6, 7)$ 一共有几个质蕴涵项？
          answer: 6
          hint: 哪些最小项只差一位、能两两合并？合并后还能不能再合并？
          explain: 能合并的对：0、1 得 $\overline a\,\overline b$；0、2 得 $\overline a\,\overline c$；1、5 得 $\overline b\,c$；2、6 得 $b\,\overline c$；5、7 得 $ac$；6、7 得 $ab$。它们之间再不能合并，共 6 个，而且每个最小项都被两个质蕴涵项盖住，没有必要质蕴涵项。
      - item:
          id: min-terms
          type: number
          prompt: $F(a, b, c) = \sum m(0, 1, 2, 5, 6, 7)$ 的最简与或式最少要几个乘积项？
          answer: 3
          hint: 先列出每个质蕴涵项盖住哪几个最小项，最少要几个才能把 6 个全部盖住？
          explain: 一项盖 2 个，至少 3 项；$\overline a\,\overline b + b\,\overline c + ac$ 正好盖住全部 6 个。$\overline a\,\overline c + \overline b\,c + ab$ 也行，最简式不唯一。
      - item:
          id: why-multilevel
          type: choice
          prompt: 两级最小化已经有精确算法，为什么逻辑综合工具还要做多级优化？
          options:
            - text: 实际电路是多级的，共用子式才能再省面积和延迟
              correct: true
            - text: 两级最小化的结果常常是错的
              why: 两级最小化的结果和原函数完全等价；问题是两级形式本身往往不是最省的实现
            - text: 两级逻辑在芯片上做不出来，必须拆成多级才能实现
              why: 两级逻辑可以实现，但输入多时每个门要接的输入很多、面积也大，多级结构更省
          explain: 两级式里大量乘积项重复用到同样的子式，变成多级结构后可以只算一次。所以综合先做两级化简，再做多级优化。
  - id: bdd-sat
    chapter: 逻辑综合与布尔优化
    title: 二元决策图和可满足性
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 要判断两个各有 64 个输入的电路功能是否完全相同。把 $2^{64}$ 种输入都试一遍，行吗？
          options:
            - text: 不行，要换别的办法
              correct: true
            - text: 行，计算机每秒能算几十亿次
              why: $2^{64} \approx 1.8\times10^{19}$，每秒 $10^9$ 次也要几百年
            - text: 行，只要随机试一千种输入
              why: 随机试只能发现不同，不能证明相同；两个电路可能只在极少数输入上不同
          explain: 穷举不可行，随机测试证明不了相等。EDA 用两类方法整体推理：把函数表示成规范的图（BDD）直接比较，或把“存在使两者不同的输入”写成可满足性问题去求解。
      - card:
          title: 二元决策图
          body: |
            按固定的变量顺序，对每个变量分“取 0”“取 1”两支，一直分到结果 0 或 1，得到一棵决策树。把完全相同的子图合并、两支指向同一处的节点删掉，得到**简化有序二元决策图（ROBDD, reduced ordered binary decision diagram）**，常简称 BDD。

            同一个函数在同一个变量顺序下的 ROBDD 是唯一的，所以判断两个电路是否等价，只要看它们的 ROBDD 是不是同一个图。
      - item:
          id: bdd-small
          type: number
          prompt: 函数 $f = ab + c$，变量顺序 a、b、c。它的 ROBDD 除了 0、1 两个终点外有几个节点？
          answer: 3
          hint: a = 0 时 f 等于什么？a = 1、b = 1 时呢？哪些子图可以共用？
          explain: a = 0 时 f = c；a = 1 时看 b：b = 1 得 1，b = 0 得 c。“看 c”的节点被两处共用，所以只有 a、b、c 各一个节点。
      - card:
          title: 变量顺序很要紧
          body: |
            ROBDD 的大小强烈依赖变量顺序。$f = a_1b_1 + a_2b_2 + a_3b_3$：按 $a_1, b_1, a_2, b_2, a_3, b_3$ 的顺序只要 6 个节点；按 $a_1, a_2, a_3, b_1, b_2, b_3$ 的顺序要 14 个，因为读完所有 $a$ 以后，要记住哪些 $a_i$ 是 1，情况数翻倍增长。对 $n$ 对变量，前者是 $2n$ 个，后者是 $2^{n + 1} - 2$ 个。

            找最好的顺序本身是难题，工具用启发式方法动态调整顺序。有些函数（如乘法器的中间位）在任何顺序下都很大，这时改用可满足性求解。
      - item:
          id: bdd-order
          type: number
          prompt: $f = a_1b_1 + a_2b_2$。按 $a_1, a_2, b_1, b_2$ 的顺序建 ROBDD，除终点外有几个节点？
          answer: 6
          hint: 读完 $a_1$、$a_2$ 以后，要分几种情况继续看 $b$？
          explain: 读完两个 $a$ 有 4 种情况：都为 0 时 f = 0，只有 $a_1$ 为 1 时 f = $b_1$，只有 $a_2$ 为 1 时 f = $b_2$，都为 1 时 f = $b_1 + b_2$。节点：$a_1$ 1 个、$a_2$ 2 个、$b_1$ 2 个、$b_2$ 1 个，共 6 个；交替顺序 $a_1, b_1, a_2, b_2$ 只要 4 个。
      - card:
          title: 可满足性
          body: |
            可满足性问题问的是：给一个布尔式，有没有一组输入让它为 1。电路验证常把式子写成合取范式：若干子句相与，每个子句是几个变量或其取反相或。求解器（DPLL 及其改进）一个个变量试着定下 0 或 1，一旦某个子句只剩一个没定的变量就立刻定下它（单元传播），矛盾时回退，并把导致矛盾的原因记成新子句，避免重犯。

            判断两个电路等价：把两者的输出接到一个异或门上，问“异或输出为 1”可不可满足。不可满足就说明两者完全等价。
      - card:
          title: 例题：数一数能满足的取值
          body: 合取范式 $(a + b)(\overline a + c)(\overline b + \overline c)$ a、b、c 取哪些值能让它为 1？
          reveal:
            - title: 第 1 步：先试 a = 1
              body: 第二个子句要 c = 1；第三个子句于是要 b = 0；第一个子句已被 a 满足。得到 a = 1、b = 0、c = 1。
            - title: 第 2 步：再试 a = 0
              body: 第一个子句要 b = 1；第三个子句于是要 c = 0；第二个子句已被 $\overline a$ 满足。得到 a = 0、b = 1、c = 0。
            - title: 第 3 步：结论
              body: 一共 2 组。每一步都是被某个子句“逼”出来的，这就是单元传播。
      - item:
          id: miter
          type: choice
          prompt: 把电路 A 和电路 B 的输出接到一个异或门，交给可满足性求解器，求解器回答“不可满足”。这说明什么？
          options:
            - text: 两个电路对所有输入输出都相同
              correct: true
            - text: 两个电路对所有输入输出都不同
              why: 异或为 1 表示两者不同；“异或为 1 不可满足”是说找不到任何让两者不同的输入
            - text: 两个电路里至少有一个设计错了
              why: 不可满足只说明两者在任何输入下输出都相同；它们可以都对，也可以错得一模一样，等价性检查不判断谁对
          explain: 异或输出 1 当且仅当两个电路输出不同。不存在这样的输入，两个电路就在所有输入下相同，即等价。
  - id: multilevel
    chapter: 逻辑综合与布尔优化
    title: 多级逻辑优化
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: $f = ac + ad + bc + bd$ 要用 4 个二输入与门和一个四输入或门。有没有更省的写法？
          options:
            - text: 有，$f = (a + b)(c + d)$
              correct: true
            - text: 没有，它已经是最简与或式，四个乘积项一个都省不掉
              why: 它确实是最简的两级式，但写成多级的 $(a + b)(c + d)$ 门更少
            - text: 有，$f = abcd$
              why: $abcd$ 只在四个变量都为 1 时为 1；而 $a = 1$、$c = 1$、$b = d = 0$ 时 f 就为 1，两者不等
          explain: 提出公因子：$ac + ad = a(c + d)$，$bc + bd = b(c + d)$，再提出 $(c + d)$。两级最简不等于实现最省，多级结构可以更省。
      - card:
          title: 字面量和因式分解
          body: |
            多级优化常用**字面量（literal）**的个数估计面积：变量（或它的取反）在式子里出现一次算一个。$ac + ad + bc + bd$ 有 8 个，$(a + b)(c + d)$ 只有 4 个。

            把与或式写成括号套括号的形式叫因式分解。做法是找一个能整除的因子：把乘积项看成代数式，用普通的多项式除法 $f = q\cdot d + r$ 去除（不用布尔代数特有的 $a\cdot a = a$ 等规则），这叫代数除法，速度快，适合大电路。
      - item:
          id: factor-literals
          type: number
          prompt: $f = abc + abd + e$ 因式分解成 $ab(c + d) + e$。字面量减少了几个？
          answer: 2
          hint: 分解前后各数一遍字面量，各是多少？
          explain: 分解前 $3 + 3 + 1 = 7$ 个，分解后 $a$、$b$、$c$、$d$、$e$ 共 5 个，减少 2 个。
      - card:
          title: 提取公共子式
          body: |
            几个输出共用同一个子式时，只算一次、把结果分给大家，叫提取公共子式。例如 $f_1 = ab + ac$，$f_2 = bd + cd$，两者都含 $(b + c)$：令 $x = b + c$，则 $f_1 = ax$，$f_2 = dx$。

            要找值得提取的子式，工具先求每个式子的**核（kernel）**：用一个乘积项去除（只看含有它的那些项），商至少有两项、而且再也提不出公共因子时，这个商就是一个核。$f_1$ 除以 $a$ 得 $b + c$，就是 $f_1$ 的一个核。不同式子的核有交集，就是共享的候选。
      - card:
          title: 例题：提取前后的字面量
          body: $f_1 = ab + ac$，$f_2 = bd + cd$。提取 $x = b + c$ 前后，三个式子一共多少个字面量？
          reveal:
            - title: 第 1 步：提取前
              body: $f_1$ 有 4 个，$f_2$ 有 4 个，共 8 个。
            - title: 第 2 步：提取后
              body: $x = b + c$ 有 2 个，$f_1 = ax$ 有 2 个，$f_2 = dx$ 有 2 个，共 6 个。
            - title: 第 3 步：看收益
              body: 少了 2 个字面量，也就少了门。子式被越多的输出共用，收益越大。
      - item:
          id: extract-literals
          type: number
          prompt: $f_1 = ac + bc$，$f_2 = ad + bd$，$f_3 = ae + be$。提取 $x = a + b$ 以后，四个式子（$x$、$f_1$、$f_2$、$f_3$）一共多少个字面量？
          answer: 8
          hint: 提取后每个 $f_i$ 写成什么？各有几个字面量？
          explain: $x = a + b$ 有 2 个，$f_1 = cx$、$f_2 = dx$、$f_3 = ex$ 各 2 个，共 8 个；提取前是 12 个。
      - card:
          title: 无关项
          body: |
            有些输入组合在电路里根本不会出现（比如一个四位的十进制计数器永远不会到 1010 以上），或者出现时输出不会被用到。这些组合上的输出可以随便取，叫无关项。化简时把它们当成 1 或 0，看哪种让式子更简单就怎么取，常能省下不少字面量。
      - item:
          id: dont-care
          type: choice
          prompt: 一个电路的输入永远不会出现 $abc = 111$。化简 $F$ 时，这一组输入的输出该怎样处理？
          options:
            - text: 当成无关项，取 0 或 1 看哪种更简单
              correct: true
            - text: 必须当成 0，因为它不会出现
              why: 不会出现的输入，输出取什么都不影响电路功能，没有理由一定取 0
            - text: 必须当成 1，不会出现的输入要按最坏情况处理
              why: 同样没有理由固定取 1；取值完全由化简的需要决定
          explain: 不出现的输入组合，输出怎样都对功能没有影响。把它留给化简算法自由选择，常能合并出更大的项。
  - id: tech-mapping
    chapter: 技术映射
    title: 用单元库覆盖逻辑网络
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 化简好的逻辑要用单元库里现成的门来实现。库里有反相器、二输入与非门，也有三输入、四输入与非门和与或非门。怎样选门最省面积？
          options:
            - text: 比较各种盖法的总面积
              correct: true
            - text: 全部用二输入与非门和反相器，因为它们最小
              why: 单个门小，但门数多、总面积往往更大；一个三输入与非门常比两个二输入与非门加一个反相器省
            - text: 随便选，同一个函数用什么门面积都一样
              why: 不同的盖法总面积差别很大，这正是要用算法比较的原因
          explain: 一块逻辑可以用不同的门组合实现，总面积不同。技术映射就是在所有盖法里找总代价最小的那一种。
      - card:
          title: 主题图和模式
          body: |
            把逻辑网络全部拆成二输入与非门和反相器，得到**主题图（subject graph）**；单元库里每个单元也写成同样由与非门、反相器组成的小图，叫它的模式。**技术映射（technology mapping）**就是用模式去覆盖主题图：每个节点恰好被一个模式盖住，模式的输入接在别的模式的输出上，总面积最小。下面用 INV 表示反相器，NAND2 表示二输入与非门，AND2 表示二输入与门；模式里的 `*` 表示这里接任何子图，由别的模式去盖。

            一般的图上找最优覆盖很难，但如果主题图是一棵树，可以用动态规划精确求解。
      - card:
          title: 树上的动态规划
          body: |
            从输入往输出逐个节点计算：

            $$\text{best}(v) = \min_{\text{能匹配到 } v \text{ 的模式 } p}\left[\text{cost}(p) + \sum_{u \in p\text{ 的输入}}\text{best}(u)\right]$$

            输入端的 best 为 0。每个节点只依赖它下面的子树，算完根节点就得到整棵树的最小代价，回溯记录下来的选择就得到覆盖方案。对 $n$ 个节点、每个节点尝试固定个数的模式，时间是 $O(n)$。
      - item:
          id: dp-why-tree
          type: choice
          prompt: 为什么主题图是树时，动态规划能得到最优覆盖？
          options:
            - text: 子树互不重叠，最优解可以由子树的最优解组合
              correct: true
            - text: 树的节点数比一般的图少，动态规划的表格装得下
              why: 关键不是节点多少，而是子问题互不影响，最优子结构成立
            - text: 树上只有一种覆盖方法
              why: 树上同样有很多种覆盖方法，动态规划正是在其中挑最好的
          explain: 树上每个节点的输出只被一个父节点使用，下面两棵子树没有共享部分，最优解由子树的最优解组合而成，这正是动态规划需要的最优子结构。
      - card:
          title: 例题：盖住一个四输入与非
          body: 主题图 $\text{NAND2}(\text{INV}(\text{NAND2}(a, b)), \text{INV}(\text{NAND2}(c, d)))$，即 $\overline{abcd}$。库：INV（反相器）2，NAND2 3，AND2（INV 接在 NAND2 后）4，NAND3（模式 $\text{NAND2}(\text{INV}(\text{NAND2}(*, *)), *)$）4，NAND4（模式正好是整棵树）6。求最小代价。
          reveal:
            - title: 第 1 步：下面两个子树
              body: $\text{INV}(\text{NAND2}(a, b))$ 的最好盖法是一个 AND2，代价 4（拆开是 $2 + 3 = 5$）；$c$、$d$ 那边同样是 4。
            - title: 第 2 步：根节点的几种模式
              body: 用 NAND2：$3 + 4 + 4 = 11$；用 NAND3 盖住根和 $a$、$b$ 那一支：$4 + 4 = 8$（另一支仍是 AND2）；用 NAND4 盖住整棵树：6。
            - title: 第 3 步：取最小
              body: 最小代价 6，用一个 NAND4。
      - item:
          id: map-no-nand4
          type: number
          prompt: 主题图 $\text{NAND2}(\text{INV}(\text{NAND2}(a, b)), \text{INV}(\text{NAND2}(c, d)))$。库里只有 INV（代价 2）、NAND2（3）、AND2（INV 接在 NAND2 后，4）和 NAND3（模式 $\text{NAND2}(\text{INV}(\text{NAND2}(*, *)), *)$，4）。最小代价是多少？
          answer: 8
          hint: 根节点能套用哪些模式？各自还要加上哪些子树的代价？
          explain: 根用 NAND2：$3 + 4 + 4 = 11$；根用 NAND3 盖住一支，另一支用 AND2：$4 + 4 = 8$。最小 8。
      - card:
          title: 一般的网络怎么办
          body: |
            真实的逻辑网络不是树：一个门的输出常同时接到好几个门（扇出大于 1），子图之间就有共享。常用的办法是在每个扇出大于 1 的节点处切开，把网络拆成若干棵树，每棵树分别用动态规划映射。这样每棵树内是最优的，整体不一定最优，但快而且效果不错。
      - item:
          id: dag-split
          type: choice
          prompt: 把逻辑网络拆成树做技术映射时，在哪里切开？
          options:
            - text: 在输出同时接到多个门的节点处
              correct: true
            - text: 在每个反相器处
              why: 反相器只要扇出为 1 就可以留在树里；切开的依据是扇出
            - text: 在每个输入端处切开
              why: 输入端本来就是树的叶子，在那里切开什么也没改变；共享来自输出接到多个门的节点，要在那里切
          explain: 扇出大于 1 的节点同时被几处使用，放在任何一棵树里都会让别处无法共享。从这里切开，它成为几棵树共同的输入，剩下的每块都是树。
  - id: partition-goals
    chapter: 电路划分
    title: 把网表切成几块
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个大网表要分给两块芯片（或芯片上的两个区域）。怎样切最好？
          options:
            - text: 两块大小差不多，同时跨两块的连线尽量少
              correct: true
            - text: 只要跨两块的连线最少就好，两块大小差多少无所谓
              why: 不限大小时，把一个单元单独放一块、其余放另一块，跨块连线可能最少，但这样的划分没有用
            - text: 只要两块大小相等，怎么切都行
              why: 跨块的连线又长又慢，切得不好会让大量连线跨块
          explain: 划分有两个要求：各块大小平衡，跨块的连接最少。两者要同时满足，问题才有意义，也才难。
      - card:
          title: 割和平衡
          body: |
            把网表的单元分成 $k$ 块叫**划分（partitioning）**，最常见的是分成两块，叫二划分。两端在不同块里的边叫割边，割边的条数（或权重之和）叫**割（cut）**。目标是割最小，同时满足**平衡约束（balance constraint）**：每块的大小在规定范围内，比如两块各占一半，或者相差不超过 10%。

            为什么要划分：大问题拆成小问题才算得动；跨块的连线又长又慢，割小意味着布线容易、延迟小。
      - item:
          id: cut-small
          type: number
          prompt: 4 个顶点、5 条边：(1,2)、(2,3)、(3,4)、(4,1)、(1,3)。分成 A = {1, 3}、B = {2, 4}，割是多少？
          answer: 4
          hint: 哪些边的两端分在不同的块里？
          explain: (1,2)、(2,3)、(3,4)、(4,1) 都跨块，只有 (1,3) 在 A 内，割为 4。改成 A = {1, 2}、B = {3, 4}，割只有 3。
      - card:
          title: 超图的割
          body: |
            网表里一个线网常连着好几个单元，是超图里的一条超边。一条线网只要有引脚分在不同的块里，就被切断了，要跨块走线，所以超图的割通常数被切断的线网个数，而不是把线网拆成两两的边去数。

            划分的最优解问题是 NP 难的，实用的是启发式算法：从一个初始划分出发，不断交换或移动单元来减小割。
      - card:
          title: 例题：数被切断的线网
          body: 6 个单元，4 个线网：{1, 2, 3}、{3, 4}、{4, 5, 6}、{1, 6}。划分成 A = {1, 2, 3}、B = {4, 5, 6}。有几个线网被切断？
          reveal:
            - title: 第 1 步：逐个线网看
              body: 线网 {1, 2, 3} 全在 A，没切断；{3, 4} 一个在 A 一个在 B，切断；{4, 5, 6} 全在 B，没切断；{1, 6} 切断。
            - title: 第 2 步：计数
              body: 被切断的线网 2 个。
            - title: 第 3 步：和边的数法比
              body: 如果把 {1, 2, 3} 拆成三条边，它没被切断时不影响结果；但一个被切断的大线网拆成边后会被数好几次，夸大了它的代价。
      - item:
          id: net-cut
          type: number
          prompt: 6 个单元，5 个线网：{1, 2}、{2, 3, 4}、{4, 5}、{5, 6}、{1, 6}。划分成 A = {1, 2, 3}、B = {4, 5, 6}。有几个线网被切断？
          answer: 2
          hint: 每个线网的引脚是不是都在同一块里？
          explain: 线网 {2, 3, 4} 有引脚在两块，切断；{1, 6} 切断；{1, 2} 全在 A，{4, 5}、{5, 6} 全在 B。共 2 个。
      - item:
          id: balance-why
          type: choice
          prompt: 只追求割最小、不加平衡约束，最可能得到什么结果？
          options:
            - text: 几乎所有单元都在一块，另一块只剩一两个
              correct: true
            - text: 两块正好一样大
              why: 没有约束时，把连接最少的一两个单元单独分出去，割往往最小，结果极不平衡
            - text: 割变成 0
              why: 只要网表是连通的，任何一种分法都至少切断一条连接，割不会是 0
          explain: 把一两个连接很少的单元单独分出去，割就很小，可这样的划分毫无用处。平衡约束迫使算法在两块大小接近的前提下找割最小的切法。
  - id: kl-fm
    chapter: 电路划分
    title: Kernighan–Lin 和 Fiduccia–Mattheyses
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 已经有了一个两块大小相等的划分。想减小割、又保持两块一样大，最直接的一步改动是什么？
          options:
            - text: 从两块里各挑一个顶点互换
              correct: true
            - text: 把一个顶点从一块移到另一块
              why: 单独移一个会让两块大小不等；要保持相等，就得成对交换
            - text: 重新随机分一次
              why: 随机重分会丢掉已有的好结构，很难比现在更好
          explain: 一换一，两块大小不变。问题是挑哪一对：交换后割减少得最多的那一对。
      - card:
          title: 交换增益
          body: |
            对顶点 $v$，记 $E_v$ 为它连到另一块的边数（外部），$I_v$ 为连在本块内的边数（内部），$D_v = E_v - I_v$。把 A 中的 $a$ 和 B 中的 $b$ 互换，割减少

            $$g = D_a + D_b - 2w(a, b)$$

            $w(a, b)$ 是 $a$、$b$ 之间的边数（没有边为 0）。减 $2w$ 是因为 $a$–$b$ 这条边原来跨块、换完以后仍然跨块，可 $D_a$、$D_b$ 都把它算成了“换过去能消掉的外部边”。
      - card:
          title: 例题：一次交换
          body: 6 个顶点、8 条边：(1,2)(1,3)(2,3)(3,4)(4,5)(4,6)(5,6)(2,5)。初始 A = {1, 2, 4}，B = {3, 5, 6}。求割、交换 3 和 4 的增益、交换后的割。
          reveal:
            - title: 第 1 步：初始割
              body: 跨块的边是 (1,3)(2,3)(3,4)(4,5)(4,6)(2,5)，割为 6。
            - title: 第 2 步：两个 D 值
              body: 顶点 3 的边 (1,3)(2,3)(3,4) 都连到 A，$D_3 = 3 - 0 = 3$；顶点 4 的边 (3,4)(4,5)(4,6) 都连到 B，$D_4 = 3$。
            - title: 第 3 步：增益和新割
              body: 3、4 之间有一条边，$g = 3 + 3 - 2 = 4$。交换后 A = {1, 2, 3}，B = {4, 5, 6}，跨块的只剩 (3,4)(2,5)，割为 $6 - 4 = 2$。
      - item:
          id: kl-gain
          type: number
          prompt: 6 个顶点、8 条边：(1,2)(1,3)(2,3)(3,4)(4,5)(4,6)(5,6)(2,5)。划分 A = {1, 2, 4}，B = {3, 5, 6}。交换顶点 1 和 5，增益（割减少多少）是多少？
          answer: 1
          hint: 顶点 1 有几条边连到 B、几条在 A 内？顶点 5 呢？两者之间有没有边？
          explain: 顶点 1：(1,3) 外部、(1,2) 内部，$D_1 = 0$；顶点 5：(4,5)(2,5) 外部、(5,6) 内部，$D_5 = 1$；1 和 5 之间没有边。$g = 0 + 1 - 0 = 1$，交换后割为 5。
      - card:
          title: 一趟 KL 算法
          body: |
            Kernighan–Lin 算法一趟这样做：算出所有顶点的 $D$ 值；找增益最大的一对交换（哪怕增益是负的也换），把这两个顶点锁住、不再参与；更新受影响顶点的 $D$ 值，再找下一对……直到所有顶点都锁住。然后回头看累计增益，取累计增益最大的那个前缀，只保留前面那几次交换。

            允许暂时变差的交换，是为了跳出“每一步都变好”会卡住的局部最优。一趟做完再从新的划分开始下一趟，直到某一趟没有改进。
      - item:
          id: kl-prefix
          type: number
          prompt: KL 算法一趟里依次交换了 4 对，增益分别是 +3、−1、+2、−4。应该保留前几次交换？
          answer: 3
          hint: 前 1、2、3、4 次交换的累计增益各是多少？
          explain: 累计增益依次是 3、2、4、0，最大是前 3 次的 4，所以保留前 3 次，割减少 4。第 2 次虽然增益为负，却让第 3 次的 +2 成为可能。
      - card:
          title: Fiduccia–Mattheyses 算法
          body: |
            Fiduccia–Mattheyses（FM）算法做了两点改进：每次只移动一个顶点，而不是交换一对，用平衡约束（如两块大小相差不超过一定比例）代替“必须一样大”；直接处理超图，增益按线网算。顶点按增益放进一排“桶”里，取最大增益和移动后更新都只要常数时间，一趟的时间和引脚总数成正比。

            它是现代划分工具的核心，常嵌在多级划分框架里使用。
      - item:
          id: fm-vs-kl
          type: choice
          prompt: 和 KL 算法相比，FM 算法最主要的好处是什么？
          options:
            - text: 一趟接近线性时间，还能直接处理超图
              correct: true
            - text: FM 每一趟都试遍所有移动，所以保证找到最优划分
              why: FM 仍是启发式算法，不保证最优；它的好处是快、能处理超图和不等大的平衡约束
            - text: FM 不需要平衡约束
              why: FM 照样有平衡约束，只是允许两块大小在一个范围内变化
          explain: KL 每一步要在所有顶点对里找最好的一对，代价高；FM 每步只挑一个顶点，用桶在常数时间内找到最大增益，大网表上快得多。
  - id: multilevel-partition
    chapter: 电路划分
    title: 多级划分
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: FM 算法每次只移动一个顶点。网表有一百万个顶点时，靠一个个顶点地移动来改进划分，有什么困难？
          options:
            - text: 很难整体搬动一大团顶点
              correct: true
            - text: 一百万个顶点 FM 根本跑不动
              why: FM 一趟接近线性时间，一百万个顶点跑得动；问题是一次一个的移动很难做出大的结构调整
            - text: 没有困难，顶点越多 FM 越准
              why: 顶点越多，一次移动的影响越小，越容易卡在局部最优
          explain: 一大团紧密相连的顶点应该整体换块，可单独移出其中任何一个都会让割变大，FM 就不会去移。先把这团缩成一个点，就能一步移过去。
      - card:
          title: 粗化、初始划分、细化
          body: |
            **多级划分（multilevel partitioning）**分三个阶段。粗化：把联系紧密的顶点两两合并（常按边权最大的配对），图缩小一半左右，反复做，直到只剩几十到几百个顶点。初始划分：在这张很小的图上随便用什么方法求一个好划分，代价很低。细化：一层层展开回原来的图，每展开一层，用 FM 在这一层上微调。

            粗的层次上一次移动相当于搬动原图里一大团顶点，细的层次上再修边角。hMETIS 等工具用的就是这个框架。
      - item:
          id: coarsen-levels
          type: number
          prompt: 一个网表有一百万个顶点，每次粗化让顶点数减半，要缩到 100 个以下才停。至少要粗化几层？
          answer: 14
          hint: 减半多少次，$10^6$ 会小于等于 100？
          explain: 需要 $10^6/2^k \le 100$，即 $2^k \ge 10^4$，$k \ge 13.3$，取 14 层，最后剩约 61 个顶点。层数只按对数增长，所以多级划分很快。
      - card:
          title: 例题：配对合并
          body: 一条链 1–2–3–4–5–6，边权依次是 1、5、1、5、1。按“优先合并边权最大的一对，每个顶点只合并一次”做一层粗化，结果是什么？
          reveal:
            - title: 第 1 步：挑边权最大的边
              body: (2,3) 和 (4,5) 的权都是 5，各合并成一个点：{2,3}、{4,5}。
            - title: 第 2 步：剩下的顶点
              body: 1 和 6 的邻居都已经合并过，它们自己保持不变。
            - title: 第 3 步：新图
              body: 4 个点：1、{2,3}、{4,5}、6；原来的边 (1,2) 变成 1–{2,3}，(3,4) 变成 {2,3}–{4,5}，(5,6) 变成 {4,5}–6，权都是 1。紧密的两对被保护在一起，不会在后面的划分里被切开。
      - item:
          id: why-refine
          type: choice
          prompt: 多级划分在展开的每一层都用 FM 细化一次，而不是只在最后的原图上细化。为什么？
          options:
            - text: 粗层次上一次移动能搬一大团顶点
              correct: true
            - text: 只在原图上细化太慢
              why: FM 在原图上也接近线性时间；关键是粗层次上的移动能做出原图上一步做不到的大调整
            - text: 粗化会改变图的连接关系，必须每层修正错误
              why: 粗化只是合并顶点，不会产生错误；每层细化是为了在不同尺度上改进划分
          explain: 在粗的层次上移一个点，等于在原图上整体搬动它代表的一大团顶点。从粗到细每层都改进一次，既有大的结构调整，又有细的修边。
      - item:
          id: coarse-match
          type: choice
          prompt: 粗化时为什么优先合并边权大的两个顶点？
          options:
            - text: 联系紧的顶点该在同一块
              correct: true
            - text: 边权大的顶点度数小，合并起来快
              why: 边权大小和度数没有直接关系；合并的依据是两者联系有多紧
            - text: 为了让粗化后的图边数最多
              why: 合并边权大的边，正是把这条边藏进了合并点里，粗图上留下的跨点连接反而更少
          explain: 两个顶点之间连接很多，把它们切开代价就大。先合并，它们在后面的划分里就作为一个整体，割里不会出现这些边。
  - id: floorplan
    chapter: 布局
    title: 布图规划和它的表示
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一块芯片上有处理器核、存储器、接口几个大块，要先决定它们放在哪里、做成什么形状。为什么这一步要在摆放每个单元之前做？
          options:
            - text: 大块的位置决定连线长短和面积，要先定
              correct: true
            - text: 因为大块的形状是固定的，不需要考虑
              why: 很多块的长宽比可以调整，选什么形状正是这一步要定的
            - text: 没有必要，直接摆放全部单元，结果和先定大块一样好
              why: 上千万个单元一起摆规模太大；先定大块的位置，问题被分解成小得多的几块
          explain: 布图规划先在大块的层次上定出位置和形状，后面的布局在各块内部进行。大块放得不好，连线会很长，面积也会浪费。
      - card:
          title: 布图规划的目标
          body: |
            芯片上的大块叫**模块（module）**。**布图规划（floorplanning）**给每个模块定出位置和形状。有的块形状固定（硬模块，比如现成的存储器），有的面积固定、长宽比可调（软模块）。目标是芯片外框面积小、块之间的连线短，同时满足长宽比、某些块必须靠边或靠在一起等约束。

            块之间放不满的空白叫死区，面积等于外框面积减去各块面积之和。
      - item:
          id: dead-space
          type: number
          prompt: 三个模块面积分别是 3、5、6，布图规划后的外框是 4 × 4。死区面积是多少？
          answer: 2
          hint: 外框面积减去什么？
          explain: 外框 16，模块合计 14，死区 2，占外框的 12.5%。
      - card:
          title: 切分布图和波兰表达式
          body: |
            如果整个外框可以反复用一刀横切或竖切，一直切到每个小矩形里只有一个模块，就叫**切分布图（slicing floorplan）**。用 V 表示竖着切（左右并排：宽相加、高取大），H 表示横着切（上下叠放：宽取大、高相加），把切分过程按“先写两个对象、再写拼法”的顺序写下来，叫**波兰表达式（Polish expression）**：如 `abVcH` 表示 a、b 左右并排，再和 c 上下叠放。

            有些布图（比如四块围成风车形）不能这样切，叫非切分布图，要用序列对等别的表示。
      - card:
          title: 例题：算一个波兰表达式的外框
          body: 模块 a 宽 2 高 3，b 宽 3 高 2，c 宽 4 高 1。求 `abVcH` 的外框尺寸和死区。
          reveal:
            - title: 第 1 步：先算 abV
              body: 左右并排：宽 $2 + 3 = 5$，高 $\max(3, 2) = 3$。
            - title: 第 2 步：再和 c 做 H
              body: 上下叠放：宽 $\max(5, 4) = 5$，高 $3 + 1 = 4$。
            - title: 第 3 步：面积和死区
              body: 外框 $5\times4 = 20$，模块合计 $6 + 6 + 4 = 16$，死区 4。
      - item:
          id: polish-area
          type: number
          prompt: 模块 a 宽 2 高 3，b 宽 3 高 2，c 宽 4 高 1。V 表示左右并排（宽相加、高取大），H 表示上下叠放（宽取大、高相加）。波兰表达式 `abcHV` 的外框面积是多少？
          answer: 18
          hint: 先算哪两个、用哪种拼法？
          explain: 从左往右读，第一个拼法 H 作用在它前面的 b、c 上，先算 `bcH`：宽 $\max(3, 4) = 4$，高 $2 + 1 = 3$；再和 a 做 V：宽 $2 + 4 = 6$，高 $\max(3, 3) = 3$。外框 $6\times3 = 18$，死区只有 2。
      - item:
          id: slicing-limit
          type: choice
          prompt: 为什么有的布图不能用波兰表达式表示？
          options:
            - text: 它不能反复一刀切成两半，比如四块围成风车形
              correct: true
            - text: 模块太多，表达式写不下
              why: 波兰表达式的长度和模块数成正比，多少个模块都写得下；限制在于布图的结构能不能一刀刀切开
            - text: 模块的形状不是矩形
              why: 布图规划里的模块都当作矩形；不能表示的原因是切分结构
          explain: 波兰表达式描述的是“一刀横切或竖切”的递归过程。风车形布图里任何一刀都会切到某个模块，这样的布图只能用序列对等非切分表示。
  - id: floorplan-algos
    chapter: 布局
    title: 布图规划算法、引脚和电源网络
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 面积为 4 的软模块可以做成 1 × 4、2 × 2 或 4 × 1。它要和一个 3 × 1 的模块左右并排。猜猜选哪种形状外框最小？
          options:
            - text: 4 × 1
              correct: true
            - text: 2 × 2，正方形最省面积
              why: 2 × 2 和 3 × 1 并排，外框 5 × 2 = 10，比 4 × 1 的 7 × 1 = 7 大；正方形单独看最紧凑，和别的块拼起来就不一定
            - text: 三种都一样，面积都是 4
              why: 模块自己的面积不变，但外框要按较高的那块算高度，形状不同死区就不同
          explain: 并排时宽相加、高取大。4 × 1 和 3 × 1 一样高，外框 7 × 1，正好等于两块面积之和，没有死区。
      - card:
          title: 尺寸优化：从可选形状里挑
          body: |
            软模块常给出几种可选的宽和高。拼两块时，把两边的选项两两组合，每种组合按 V 或 H 的规则算出外框；再删去被别的组合“完全压过”的（宽和高都不更小的），剩下的就是这一层的可选外框。沿着波兰表达式自底向上做一遍，最后在顶层挑面积最小的那个，再往回查每块该用哪种形状。

            这样的尺寸优化（floorplan sizing）对切分布图是精确的，计算量随选项数多项式增长。
      - item:
          id: sizing-v
          type: number
          prompt: 模块 a 可选 1 × 4、2 × 2、4 × 1（宽 × 高），模块 b 可选 1 × 3、3 × 1。两块左右并排（宽相加、高取大），外框面积最小是多少？
          answer: 7
          hint: 六种组合各是多宽多高？
          explain: 六种组合的外框面积是 8、16、9、10、15、7。最小的是 a 取 4 × 1、b 取 3 × 1：宽 7、高 1，面积 7。
      - card:
          title: 聚类生长和模拟退火
          body: |
            聚类生长（cluster growth）按连接的紧密程度给模块排个先后，一块一块放上去，每次放在让外框和连线都增加最少的位置。它很快，但早放下的块不再挪动。

            **模拟退火（simulated annealing）**从一个布图出发，反复随机改一小处（比如交换波兰表达式里的两个模块），变好就接受，变差则以概率 $e^{-\Delta/T}$ 接受，$\Delta$ 是代价增加了多少，$T$ 叫温度，随着算法进行逐渐降低。
      - item:
          id: sa-accept
          type: number
          prompt: 模拟退火中，一次改动让代价增加了 $\Delta = 2$，当前温度 $T = 4$。按 $e^{-\Delta/T}$，接受这次改动的概率是多少？保留两位小数。
          answer: 0.61
          tolerance: 0.005
          hint: $\Delta/T$ 是多少？
          explain: $e^{-2/4} = e^{-0.5} \approx 0.61$。同样的 $\Delta = 2$ 到 $T = 1$ 时只剩 $e^{-2} \approx 0.14$：温度高时常接受变差的改动，能跳出局部最优；温度低时几乎只接受变好的。
      - item:
          id: sa-why-worse
          type: choice
          prompt: 模拟退火为什么要以一定概率接受让代价变差的改动？
          options:
            - text: 只接受变好的容易停在局部最优
              correct: true
            - text: 变差的改动其实也会让最终结果变好
              why: 单看一步，变差就是变差；接受它的意义是让搜索有机会离开一个坑，去找更深的坑
            - text: 为了让算法跑得更快
              why: 接受变差的改动通常让搜索走得更久；它换来的是解的质量，不是速度
          explain: 贪心地只往下走会停在第一个“四周都更高”的位置。温度高时允许往上走一点，越过小山包；温度降低后再慢慢稳定在一个好的解上。
      - card:
          title: 引脚分配
          body: |
            模块的位置定下后，还要决定每个信号从模块边上的哪个点进出，叫**引脚分配（pin assignment）**。芯片外围的输入输出焊盘也一样。目标是让连线短、少交叉。把“信号”和“可用位置”看成二分图的两边，边的权重是连过去的距离，引脚分配就成了一个带权的匹配问题。
      - item:
          id: pin-match
          type: choice
          prompt: 两个信号 s1、s2 要分到模块边上的两个位置 p、q。s1 到 p、q 的连线长 2、5；s2 到 p、q 的连线长 3、7。总线长最短的分法是哪种？
          options:
            - text: s1 → q，s2 → p，总长 8
              correct: true
            - text: s1 → p，s2 → q，总长 9
              why: 各自选最近的看起来合理，但 s1 和 s2 都想要 p；s2 换到 q 要多走 4，s1 换到 q 只多走 3，所以让 s1 让出 p
            - text: 两种分法一样长
              why: 一种是 2 + 7 = 9，一种是 5 + 3 = 8，不一样
          explain: 只有两种分法：2 + 7 = 9 和 5 + 3 = 8。贪心地先给 s1 选最近的 p 反而更差，这正是要当成匹配问题整体求解的原因。
      - card:
          title: 电源和地线网络
          body: |
            每个单元都要接电源和地。常见做法是在核心区四周做一圈电源环，再用上层粗金属铺成纵横交错的电源网格，连到每一行单元的电源轨。电流流过网格的电阻会产生压降，叫**IR 压降（IR drop）**，压降大的地方单元得到的电压偏低、变慢。

            只有一层金属时，电源和地两棵树要画在同一层上，互相交错又不能交叉，这是平面布线问题。
      - item:
          id: ir-drop
          type: number
          prompt: 一段电源网格的电阻是 0.02 Ω，流过 0.5 A 电流。压降是多少毫伏？
          answer: 10
          tolerance: 0.001
          unit: mV
          hint: 电阻上的电压等于什么乘什么？
          explain: $V = IR = 0.5\times0.02 = 0.01$ V，即 10 mV。电源 1.0 V 时这是 1%，设计时通常要求最坏处的压降不超过电源的几个百分点。
  - id: placement-objectives
    chapter: 布局
    title: 布局要优化什么
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 布局要在每个单元摆好之前就估计“线会有多长”，而真正的走线要到布线才知道。估计一个线网的长度，下面哪种办法最快？
          options:
            - text: 用包住它所有引脚的最小矩形，取半个周长
              correct: true
            - text: 先把这个线网真的布一遍再量
              why: 布局要在每一步改动后重新估算几百万个线网，真去布线太慢；要的是一个算得飞快、又和真实线长差不多的估计
            - text: 数一数它连着几个引脚
              why: 引脚数不反映引脚离得多远；两个相距很远的引脚比三个挨在一起的引脚费线得多
          explain: 包围矩形的半周长只要找出横纵坐标的最大最小值，几乎不花时间；对两三个引脚的线网它就是最短走线的长度。
      - card:
          title: 半周长线长
          body: |
            一个线网的所有引脚坐标里，横坐标最大减最小，加上纵坐标最大减最小，就是包围矩形的半个周长，叫**半周长线长（HPWL, half-perimeter wirelength）**。把所有线网的 HPWL 加起来，就是布局最常用的总线长估计。

            走线只能横平竖直（曼哈顿走线，两点距离等于横坐标差加纵坐标差）时，两个或三个引脚的线网，最短连线正好等于 HPWL；引脚更多时 HPWL 只是最短连线长度的下限，真实的走线不会比它短。
      - item:
          id: hpwl-four
          type: number
          prompt: 一个线网连着 (2, 3)、(6, 1)、(5, 7)、(3, 4) 四个引脚。它的半周长线长是多少？
          answer: 10
          hint: 横坐标的最大、最小是多少？纵坐标呢？
          explain: 横坐标从 2 到 6，差 4；纵坐标从 1 到 7，差 6；HPWL = 4 + 6 = 10。
      - card:
          title: 斯坦纳树和生成树
          body: |
            多引脚线网真正的最短连法可以在引脚之外加几个分叉点，这些点叫斯坦纳点；只走横竖线、总长最短的这种树叫**直角斯坦纳最小树（RSMT, rectilinear Steiner minimum tree）**。求它是 NP 难的。只在引脚之间连线的最小生成树（按曼哈顿距离）容易求，但通常比 RSMT 长。
      - card:
          title: 例题：三个引脚的三种估计
          body: 引脚 (0, 0)、(4, 0)、(2, 3)。比较 HPWL、按曼哈顿距离的最小生成树和 RSMT。
          reveal:
            - title: 第 1 步：HPWL
              body: 横向 $4 - 0 = 4$，纵向 $3 - 0 = 3$，HPWL = 7。
            - title: 第 2 步：最小生成树
              body: 三对距离是 4、5、5。最小生成树取 4 和 5，总长 9。
            - title: 第 3 步：加一个斯坦纳点
              body: 在 (2, 0) 分叉：到 (0, 0) 长 2，到 (4, 0) 长 2，到 (2, 3) 长 3，共 7，和 HPWL 相等，比生成树短 2。
      - item:
          id: rmst-vs-rsmt
          type: number
          prompt: 引脚 (0, 0)、(4, 1)、(1, 4)、(5, 5)。按曼哈顿距离求最小生成树的总长。
          answer: 15
          hint: 先算出六对引脚之间的曼哈顿距离，再从最短的开始连，不成圈就留下。
          explain: 六对距离是 5、5、10、6、5、5。按 Kruskal 从短的取，前三条 5 不成圈（例如 (0,0)–(4,1)、(0,0)–(1,4)、(4,1)–(5,5)），总长 15。允许加斯坦纳点的 RSMT 是 13，HPWL 是 10，三者的大小关系是 HPWL ≤ RSMT ≤ 最小生成树。
      - card:
          title: 密度和时序
          body: |
            只追求线长，单元会挤成一团。布局把芯片分成小格，算每格里单元面积占格子面积的比例，叫密度；超过目标密度的部分要散开，否则局部线太多布不下，叫**拥塞（congestion）**。

            时序上，给关键的线网乘一个较大的权重，求加权的总线长，让它们优先变短。
      - item:
          id: density-overflow
          type: number
          prompt: 一个 10 × 10 的布局格子里放了总面积 85 的单元，目标密度是 0.7。这个格子超出目标的单元面积是多少？
          answer: 15
          hint: 目标密度允许放多少面积？
          explain: 允许 $0.7\times100 = 70$，实际 85，超出 15。布局算法会把这部分单元推到旁边密度低的格子里。
      - item:
          id: weighted-wl
          type: choice
          prompt: 时序驱动的布局给关键路径上的线网乘大权重，再最小化加权总线长。这样做的效果是什么？
          options:
            - text: 关键线网会变短，代价是别的线网可能变长一些
              correct: true
            - text: 所有线网都同样变短
              why: 总的布局空间是固定的，给一部分线网加权，优化器就会牺牲没加权的线网来缩短它们
            - text: 关键线网会变长，留出余量
              why: 权重越大，这个线网在代价里占的分量越大，优化器越想把它缩短
          explain: 加权让优化器在线网之间分配“长度预算”：时序紧的线网短一些，余量大的线网长一点也无妨。
  - id: global-placement
    chapter: 布局
    title: 全局布局
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个单元只连着三个固定的引脚，它们的横坐标是 0、2、10。要让它到三个引脚的距离平方和最小，单元的横坐标应该是多少？
          options:
            - text: 4，三个坐标的平均值
              correct: true
            - text: 2，中间那个引脚的位置
              why: 中位数让距离之和（不平方）最小；平方以后远处的 10 分量更重，最优点被拉向它
            - text: 5，最左和最右的正中间
              why: 正中间只看两端，忽略了中间那个引脚；平方和对 $x$ 求导等于零给出的是平均值
          explain: $(x - 0)^2 + (x - 2)^2 + (x - 10)^2$ 对 $x$ 求导得 $2(3x - 12)$，等于零时 $x = 4$，正是平均值。
      - card:
          title: 二次布局
          body: |
            把每条连线的长度换成坐标差的平方，总代价 $\sum w_{ij}\big[(x_i - x_j)^2 + (y_i - y_j)^2\big]$ 是坐标的二次函数，形状像一个碗；只要有固定引脚把它钉住，就只有一个最低点。对每个可动单元的坐标求导、令它等于零，得到一组线性方程；固定的输入输出引脚给出方程的常数项。解这组方程就得到全部单元的位置，这叫**二次布局（quadratic placement）**。

            横纵两个方向互不相干，可以分开解。
      - card:
          title: 例题：两个单元串在两个引脚之间
          body: 引脚 P 固定在 $x = 0$，Q 固定在 $x = 9$。连线 P–1、1–2、2–Q，权重都是 1。求单元 1、2 的横坐标。
          reveal:
            - title: 第 1 步：写出代价
              body: $\Phi = x_1^2 + (x_2 - x_1)^2 + (9 - x_2)^2$。
            - title: 第 2 步：求导令为零
              body: 对 $x_1$：$2x_1 - 2(x_2 - x_1) = 0$，即 $2x_1 = x_2$。对 $x_2$：$2(x_2 - x_1) - 2(9 - x_2) = 0$，即 $2x_2 - x_1 = 9$。
            - title: 第 3 步：解方程组
              body: 把 $x_2 = 2x_1$ 代入第二式：$3x_1 = 9$，$x_1 = 3$，$x_2 = 6$。两个单元把 0 到 9 等分，像三根一样的弹簧串起来。
      - item:
          id: quad-x2
          type: number
          prompt: 引脚 P 固定在 $x = 0$，Q 固定在 $x = 12$。单元 1 连 P（权重 1），单元 1 连单元 2（权重 1），单元 2 连 Q（权重 2）。二次布局下单元 2 的横坐标是多少？
          answer: 9.6
          tolerance: 0.001
          hint: 三条连线在代价里各贡献哪一项？权重 2 乘在哪一项上？
          explain: 对 $x_1$ 求导得 $x_2 = 2x_1$；对 $x_2$ 求导得 $2(x_2 - x_1) = 4(12 - x_2)$。代价是 $x_1^2 + (x_2 - x_1)^2 + 2(12 - x_2)^2$。把 $x_1 = x_2/2$ 代入第二式得 $x_2 = 48 - 4x_2$，即 $5x_2 = 48$，$x_2 = 9.6$，$x_1 = 4.8$。权重 2 的那根“弹簧”更硬，把单元 2 拉得离 Q 更近。
      - card:
          title: 二次布局的毛病和补救
          body: |
            二次布局只管线长，解出来的单元常常挤在芯片中间、互相重叠。所以要接着把它们散开：按密度加一个把单元推出拥挤处的“力”，再重新解方程，反复几轮。**力导向布局（force-directed placement）**就是这个想法：连线像弹簧，力和距离成正比，弹簧的平衡点正是二次代价的最低点。
      - item:
          id: quad-overlap
          type: choice
          prompt: 二次布局解出的结果为什么不能直接用？
          options:
            - text: 它只最小化线长，单元会扎堆重叠
              correct: true
            - text: 方程组通常没有解
              why: 只要有固定引脚把系统“钉住”，方程组就有唯一解；问题不在解不出来
            - text: 它算出的线长比 HPWL 还长
              why: 二次代价和 HPWL 是不同的度量，不能直接比；真正的问题是没有考虑单元不能重叠
          explain: 线长最短意味着连在一起的单元越近越好，于是大家都往中间挤。后续的散开和合法化步骤负责消除重叠。
      - card:
          title: 最小割布局
          body: |
            另一条路是**最小割布局（min-cut placement）**：把芯片区域一刀分成两半，同时把网表划分成两部分、让割最小，各放一边；再对每一半横竖交替地切下去，直到每块区域里只剩几个单元。电路划分用的 KL、FM 和多级划分算法在这里直接用上。

            模拟退火也能做布局，结果好但慢，早期的标准单元布局器用过它。
      - item:
          id: mincut-levels
          type: number
          prompt: 用最小割布局摆 1024 个单元，每一层把每块区域一分为二（单元也平分），切到每块区域只剩 4 个单元为止。要切几层？
          answer: 8
          hint: 1024 个单元要分成多少块，每层块数怎样变？
          explain: 每块 4 个单元，需要 $1024/4 = 256 = 2^8$ 块；每层块数翻倍，所以切 8 层。
      - item:
          id: quad-mean
          type: number
          prompt: 一个可动单元连着四个固定引脚，权重都是 1，引脚的横坐标是 1、3、4、12。二次布局下这个单元的横坐标是多少？
          answer: 5
          tolerance: 0.001
          hint: 平方和对 $x$ 求导等于零时，$x$ 和四个坐标是什么关系？
          explain: $\sum 2(x - x_i) = 0$ 给出 $x = (1 + 3 + 4 + 12)/4 = 5$。如果按 HPWL 这类线性线长，最优位置是 3 到 4 之间的任意一点（中位数），远处的 12 不会把它拉过去。
  - id: legalization
    chapter: 布局
    title: 合法化和详细布局
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 全局布局给出的单元位置是实数坐标，单元之间还有少量重叠。标准单元必须放在一行行等宽的格子上。下一步最自然的做法是什么？
          options:
            - text: 挪到最近的空格位上
              correct: true
            - text: 推倒重来，换一个布局算法
              why: 全局布局已经定好了大致的相对位置和线长，只差对齐和消除重叠；重来会丢掉这些成果
            - text: 保留重叠，交给布线去处理
              why: 重叠的单元在版图上会短路，制造出来不能用；必须在布线之前消除
          explain: 全局布局负责“大概放在哪”，合法化负责“精确放在哪”：对齐到行和格位、消除重叠，同时尽量少改变原来的位置。
      - card:
          title: 合法化
          body: |
            标准单元高度统一，排在一行行里，每行再分成等宽的格位（site）。把全局布局的结果挪到行和格位上、消除全部重叠，叫**合法化（legalization）**，目标是总的移动距离最小，因为挪得越远，全局布局优化好的线长和时序就丢得越多。

            一种简单的贪心做法（Tetris 算法）：按横坐标从左到右处理单元，每个单元放到它想去的位置附近、还空着的最左格位上。
      - card:
          title: 例题：一行里的 Tetris 合法化
          body: 同一行，格位宽 1，从 0 开始编号。单元 A 想去 0.3、宽 2；B 想去 1.0、宽 2；C 想去 5.2、宽 1。按横坐标从小到大，每个单元放到“离想去的位置最近的格位”和“已占位置的右端”中较大的那个。
          reveal:
            - title: 第 1 步：放 A
              body: 最近的格位是 0，行是空的，A 占 [0, 2)，移动 0.3。
            - title: 第 2 步：放 B
              body: 最近的格位是 1，但 [0, 2) 已被 A 占了，只能从 2 开始，B 占 [2, 4)，移动 1.0。
            - title: 第 3 步：放 C
              body: 最近的格位是 5，空着，C 占 [5, 6)，移动 0.2。总移动 $0.3 + 1.0 + 0.2 = 1.5$。
      - item:
          id: tetris-disp
          type: number
          prompt: 同一行，格位宽 1，从 0 编号。单元 D 想去 0.6、宽 3；E 想去 2.2、宽 1；F 想去 3.9、宽 2。按横坐标从小到大，每个单元放到“最近的格位”和“已占位置右端”中较大的那个。总移动距离是多少？
          answer: 3.3
          tolerance: 0.001
          hint: D 放在哪个格位、占到哪里？E 还能放在 2 吗？
          explain: D 最近的格位是 1，占 [1, 4)，移动 0.4；E 最近的是 2，但已被 D 占了，只能放 4，移动 1.8；F 最近的是 4，已被 E 占到 5，只能放 5，移动 1.1。合计 $0.4 + 1.8 + 1.1 = 3.3$。贪心按顺序放，后放的单元被前面的挤着往右走。
      - card:
          title: 详细布局
          body: |
            合法化之后，**详细布局（detailed placement）**在局部继续改进：交换两个单元、在一小段行里重新排列几个相邻单元的顺序、把单元左右镜像让引脚离要连的线更近、把单元挪进附近的空隙。每一步都保持合法，只接受让线长（或时序）变好的改动。窗口小，所以可以用穷举或动态规划在窗口内求最优。

            布局后还常把扫描链（测试时把存数据的单元串成一串的连线）按单元的新位置重新排序，叫扫描链重组，能省下不少线长。
      - item:
          id: detail-window
          type: number
          prompt: 详细布局在一段行里取 4 个相邻单元，穷举它们的所有左右排列顺序，挑线长最短的。要试多少种顺序？
          answer: 24
          hint: 4 个不同的东西排成一排有几种排法？
          explain: $4! = 24$ 种。窗口取 8 个单元就是 40320 种，所以窗口通常很小，靠在整行里滑动窗口覆盖全部单元。
      - item:
          id: legal-goal
          type: choice
          prompt: 合法化为什么要让单元的总移动距离尽量小？
          options:
            - text: 挪得越远，全局布局的成果丢得越多
              correct: true
            - text: 移动距离小，合法化算法就一定找得到解
              why: 能不能放下取决于行里还有没有足够的空位；移动距离是优化目标，不决定有没有解
            - text: 挪动距离越小，线长就一定越短
              why: 移动距离和线长是两回事：少挪只是尽量保住全局布局的线长，挪动小的方案也可能让个别线网变长
          explain: 合法化不重新决定布局，只做“对齐和去重叠”。移动距离是衡量它破坏了多少原有成果的指标。
      - item:
          id: rows-count
          type: number
          prompt: 一个标准单元库的单元高 2.72 μm。核心区高 27.2 μm，能排多少行单元？
          answer: 10
          tolerance: 0.001
          hint: 一行占多高？
          explain: $27.2/2.72 = 10$ 行。相邻两行常常上下翻转放置，让两行共用一条电源轨或地轨。
  - id: global-routing-basics
    chapter: 布线
    title: 全局布线的问题和表示
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一块芯片有几百万个线网、十几层金属。布线工具一般先粗后细：先定每个线网大致穿过哪些区域，再定具体的走线位置。为什么不一步到位？
          options:
            - text: 一步到位的问题太大，先粗略分配能先看出哪里会挤，再在小区域里精确布线
              correct: true
            - text: 粗布一遍就够了，细的一步可有可无
              why: 粗的一步只定区域，不给出具体的金属线和通孔，制造需要的是精确的几何图形
            - text: 先粗后细是为了让线更长
              why: 分两步是为了把问题拆小、先处理拥挤，不是为了让线变长
          explain: 先粗后细把一个巨大的问题拆成两层：粗的一层只关心每个区域有多少条线经过、会不会超出容量，细的一层在每个小区域内排出具体走线。
      - card:
          title: 全局布线和详细布线
          body: |
            **全局布线（global routing）**把芯片划成一个个小方格，叫**全局布线单元（gcell）**，只决定每个线网经过哪些 gcell。**详细布线（detailed routing）**再在每个 gcell 里给线网分配具体的金属轨道（同一层上等距排好的走线位置）和层间的连接孔（通孔，via）。

            两个相邻 gcell 之间的边界上能并排走几条线，叫这条边的**布线容量（routing capacity）**，由边界长度除以金属线的间距决定。
      - item:
          id: gcell-tracks
          type: number
          prompt: 两个相邻 gcell 的公共边界长 4 μm，某层金属的线距（相邻两条线中心的距离）是 0.4 μm。这一层在这条边界上的布线容量是几条？
          answer: 10
          tolerance: 0.001
          hint: 4 μm 里能排几个 0.4 μm？
          explain: $4/0.4 = 10$ 条。几层金属的容量相加，就是这条边在全局布线图里的容量。
      - card:
          title: 目标和溢出
          body: |
            一条边上经过的线网数超过容量的部分叫**溢出（overflow）**。全局布线首先要让总溢出为零，否则详细布线时很可能有线网走不通；其次让总线长短、通孔少；对时序关键的线网还要让延迟小。

            布线区域有几种表示：把 gcell 当顶点、相邻 gcell 之间连边的网格图最常用；早期芯片在两排单元之间留出走线带，用走线带和交叉口组成的图表示。
      - item:
          id: overflow-total
          type: number
          prompt: 三条 gcell 边的容量都是 10，全局布线后经过它们的线网数分别是 8、12、15。总溢出是多少？
          answer: 7
          hint: 每条边只算超出容量的部分，没超出的算 0。
          explain: 8 没有超出，算 0；12 超 2；15 超 5。总溢出 $0 + 2 + 5 = 7$。溢出不能互相抵消，第一条边的空位帮不了别的边。
      - card:
          title: 全局布线的流程
          body: |
            先把多引脚线网拆成若干个两引脚的线段（常用最小生成树或斯坦纳树来拆），再一条条布；全部布完后找出溢出的边，把经过它们的线拆掉、换路重布，直到没有溢出或再也改不动。线网的布线先后会影响结果：先布的占了好路，后布的只能绕。
      - item:
          id: net-order
          type: choice
          prompt: 全局布线一条一条地布线网。为什么先后顺序会影响结果？
          options:
            - text: 先布的线网占用了容量，后布的只能绕远或遇到溢出
              correct: true
            - text: 后布的线网会自动把先布的挤开
              why: 一条条布线时，后布的线网只看到剩下的容量，不会自动改动已布好的线；要改得靠拆线重布
            - text: 顺序只影响运行时间，不影响结果
              why: 不同顺序下每个线网看到的剩余容量不同，走出来的路和总溢出都会不同
          explain: 这就是顺序依赖问题。常见的缓解办法是先布短的或关键的线网，再用拆线重布修补。
      - item:
          id: grid-graph-size
          type: number
          prompt: 一块芯片划成 100 × 100 个 gcell，每层只考虑上下左右相邻的 gcell 之间的边。这张网格图一层有多少条边？
          answer: 19800
          hint: 每一行有多少条横边？一共有几行？竖边呢？
          explain: 每行 100 个 gcell 之间有 99 条横边，100 行共 9900 条；竖边同理 9900 条；合计 19800 条。
  - id: single-net
    chapter: 布线
    title: 单个线网的布线：迷宫、A* 和斯坦纳树
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 网格上有一些格子被挡住了，要从起点 S 走到终点 T，每步只能上下左右走一格。怎样保证找到的是最短的路？
          options:
            - text: 从 S 一圈圈往外扩：先标出走 1 步能到的格子，再标 2 步的，直到碰到 T
              correct: true
            - text: 每一步都朝 T 的方向走，碰到障碍再拐
              why: 朝目标直冲可能钻进死胡同，绕出来的路不一定最短；要保证最短，得按步数一层层地找
            - text: 随机走很多次，取最短的一次
              why: 随机走不能保证试到最短的那条，网格大时更是如此
          explain: 按步数一圈圈往外扩，第一次碰到 T 时的圈数就是最短步数。这正是图上的宽度优先搜索。
      - card:
          title: 迷宫布线
          body: |
            **迷宫布线（maze routing）**也叫 Lee 算法，分两步。扩展：从源点出发，给相邻的空格标 1，再给标 1 的格子的空邻居标 2……这一圈圈的标号像水波一样扩散，直到到达目标。回溯：从目标出发，每次走到标号小 1 的邻格，回到源点，经过的格子就是走线。

            它就是网格图上的宽度优先搜索，所以只要路存在就一定找到，而且是最短的。
          sim:
            name: graph
            params:
              mode: bfs
              start: s
              directed: false
              nodes: [{ id: s, x: 60, y: 50 }, { id: a, x: 170, y: 50 }, { id: b, x: 280, y: 50 }, { id: c, x: 60, y: 150 }, { id: t, x: 280, y: 150 }]
              edges: [[s, a], [a, b], [s, c], [b, t]]
      - item:
          id: lee-bfs
          type: sim
          sim: graph
          prompt: 一张 3 行 4 列的布线网格，第 2 行中间两格被挡住。图里每个点是一个空格，连线表示上下左右相邻。按迷宫布线的扩展顺序（从 s 开始一圈圈往外）点一遍各个格子。
          params:
            mode: bfs
            start: s
            directed: false
            nodes: [{ id: s, x: 40, y: 40 }, { id: a, x: 130, y: 40 }, { id: b, x: 220, y: 40 }, { id: c, x: 310, y: 40 }, { id: d, x: 40, y: 110 }, { id: e, x: 310, y: 110 }, { id: f, x: 40, y: 180 }, { id: g, x: 130, y: 180 }, { id: h, x: 220, y: 180 }, { id: t, x: 310, y: 180 }]
            edges: [[s, a], [a, b], [b, c], [s, d], [c, e], [d, f], [e, t], [f, g], [g, h], [h, t]]
          goal: {}
          solution: [s, a, d, b, f, c, g, e, h, t]
          explain: 标号 1 是 a、d，标号 2 是 b、f，标号 3 是 c、g，标号 4 是 e、h，标号 5 才到 t。从 t 回溯可以走上面那条（经 e、c、b、a），也可以走下面那条（经 h、g、f、d），都是 5 步。
      - card:
          title: 例题：绕开障碍的迷宫
          body: |
            下面是 5 × 5 的网格，# 是障碍。按 Lee 算法从 S 扩展，T 会被标几号？

            ```
            S . . . .
            # # # # .
            . . . . .
            . # # # #
            . . . . T
            ```
          reveal:
            - title: 第 1 步：第一行只能往右
              body: 第二行只有最右一格是空的。S 往右标 1、2、3、4，到右上角。
            - title: 第 2 步：沿右边下去，再往左
              body: 往下依次标 5、6，到第三行最右；第四行只有最左一格空，所以第三行往左标 7、8、9、10。
            - title: 第 3 步：下到底再往右
              body: 第四行最左标 11，第五行最左标 12，再往右标 13、14、15、16，到达 T。最短路 16 步，是两点曼哈顿距离 8 的两倍。
      - item:
          id: lee-length
          type: number
          prompt: 5 × 5 网格，从上到下各行是 `S . . # .`、`. # . # .`、`. # . . .`、`. # # # .`、`. . . # T`（# 是障碍，每步上下左右走一格）。从 S（左上角）到 T（右下角）最短要几步？
          answer: 8
          hint: 第二列和第四列的障碍分别挡住了哪几行？从 S 出发，能沿哪一列往下、在哪一行横穿？
          explain: 从 S 往右到第三列（2 步），沿第三列往下到第三行（2 步），往右到第五列（2 步），再往下到第五行（2 步），共 8 步，等于曼哈顿距离，说明障碍没有逼它绕远。
      - card:
          title: A 星搜索和汉南网格
          body: |
            迷宫布线朝四面八方扩展，网格大时很费时间。**A 星搜索（A-star search）**（常写作 A*）给每个格子算“已走步数 + 到目标的曼哈顿距离”，总是先扩展这个和最小的格子。曼哈顿距离从不高估剩余步数，所以 A 星搜索仍保证最短，却少扩展很多背离目标的格子。

            多引脚线网要找斯坦纳树。汉南（Hanan）证明：过每个引脚画横线和竖线，交点组成的**汉南网格（Hanan grid）**里一定有一棵 RSMT，候选的斯坦纳点只需在这些交点里找。
      - item:
          id: hanan-points
          type: number
          prompt: 一个线网有 4 个引脚，它们的横坐标互不相同，纵坐标也互不相同。汉南网格上除了引脚本身，还有多少个交点可以作为候选斯坦纳点？
          answer: 12
          hint: 4 条竖线和 4 条横线有多少个交点？其中几个就是引脚？
          explain: $4\times4 = 16$ 个交点，减去 4 个引脚，剩 12 个候选点。
      - item:
          id: astar-f
          type: choice
          prompt: A 星搜索用“已走步数 + 曼哈顿距离”来排序。如果把曼哈顿距离换成它的 3 倍，会怎样？
          options:
            - text: 可能高估剩下的步数，找到的路不再保证最短
              correct: true
            - text: 找得更快，而且仍然保证最短
              why: 更快可能是对的，但 3 倍的估计会超过真实的剩余步数，搜索可能在找到真正最短的路之前就停下
            - text: 和原来完全一样
              why: 估计值变大会改变扩展顺序，结果和速度都会变
          explain: A 星搜索保证最短的条件是估计值不超过真实剩余代价。曼哈顿距离满足这一点（每步最多拉近 1），放大 3 倍就可能违反。
  - id: full-netlist
    chapter: 布线
    title: 全网表布线和现代全局布线器
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 两个线网都想走同一条只剩一条空位的捷径，另一条路要绕远一些。怎样分配，总线长才最短？
          options:
            - text: 看谁绕远代价更大，让绕远代价小的那个去绕
              correct: true
            - text: 谁先布谁走捷径
              why: 先来先得省事，但先布的那个可能绕远只多一点点，后布的绕远却多很多；要比较两种分法的总代价
            - text: 两个都走捷径，超出一点无妨
              why: 容量用满再挤进一条线，这条边就溢出了，详细布线时会有线网走不通
          explain: 全网表布线要在线网之间分配稀缺的布线资源，同一个资源给谁，要看整体代价，不能只看谁先来。
      - card:
          title: 拆线重布
          body: |
            一条条布完后总会有溢出的边。**拆线重布（rip-up and reroute）**把经过溢出边的线网拆掉，在提高了这些边的代价之后重新布，反复进行。拆哪些、按什么顺序重布，是各种布线器的区别所在。

            早期做法是拆线后直接重布；更好的做法是让代价记住“这里一直很挤”，这就是协商拥塞。
      - card:
          title: 协商拥塞
          body: |
            **协商拥塞（negotiated congestion）**来自 FPGA 布线器 PathFinder：每条边的代价写成 $(b + h)\times p$。$b$ 是基本代价（如长度）；$h$ 是历史代价，这条边每轮溢出一次就加一点，越加越大；$p$ 是当前代价，现在用的线网越多它越大。每一轮所有线网都按新代价重布，常年拥挤的边越来越贵，真正有别的路可走的线网会自己让开。
      - item:
          id: pathfinder-cost
          type: number
          prompt: 按协商拥塞的代价 $(b + h)\times p$：某条边基本代价 $b = 1$，历史代价已累积到 $h = 2$，当前代价 $p = 1.5$。这条边的代价是多少？
          answer: 4.5
          tolerance: 0.001
          hint: 先加还是先乘？
          explain: $(1 + 2)\times1.5 = 4.5$。同样长度、从没拥挤过的边（$h = 0$、$p = 1$）代价只有 1，所以线网会被引向那里。
      - item:
          id: history-role
          type: choice
          prompt: 协商拥塞里的历史代价 $h$ 起什么作用？
          options:
            - text: 让常年拥挤的边越来越贵
              correct: true
            - text: 记录每条线网走过的路，下次照原样布
              why: $h$ 记在边上，不记在线网上；它的作用是改变下一轮的代价，让走法变化
            - text: 只用来统计溢出，不影响布线
              why: $h$ 直接乘进代价，每一轮的走法都受它影响
          explain: 只看当前占用（$p$），线网会在两条挤的路之间来回跳；历史代价让一条边“记住”自己一直很挤，几轮后真正离不开它的线网才留下。
      - card:
          title: 整数线性规划
          body: |
            也可以把全局布线写成**整数线性规划（ILP, integer linear programming）**：给每个线网列几条候选走线，用 0 或 1 的变量表示选不选；每个线网恰好选一条；每条边上被选中的走线条数不超过容量；目标是总线长最小。它能求最优，但变量多时求解很慢，实际只用在小区域或作为子问题。
      - item:
          id: ilp-vars
          type: number
          prompt: 一个全局布线的 ILP：100 个线网，每个线网列出 3 条候选走线，每条候选走线用一个取 0 或 1 的变量表示选不选。一共有多少个这样的变量？
          answer: 300
          hint: 每个线网有几个变量？
          explain: $100\times3 = 300$ 个。约束有两类：每个线网一条“三个变量之和等于 1”（共 100 条），每条边一条“经过它的被选走线条数不超过容量”。候选多一点解更好，但变量和求解时间跟着涨。
      - card:
          title: 现代全局布线器
          body: |
            现代全局布线器（如 FastRoute、NCTU-GR）大致这样做：先用斯坦纳树把每个线网拆成两引脚段；先试几种固定形状的走法（L 形拐一次、Z 形拐两次），快而且通孔少；仍然溢出的段再用迷宫布线绕开；外面套协商拥塞的多轮拆线重布。还会顺带考虑通孔数和多层分配。
      - item:
          id: monotone-paths
          type: number
          prompt: 在网格上从 (0, 0) 到 (3, 2)，只向右或向上走（不绕远）。一共有多少条不同的路？
          answer: 10
          hint: 一共走几步，其中几步向上？
          explain: 一共 5 步，其中 2 步向上，选哪 2 步向上有 $\binom52 = 10$ 种。L 形只占其中 2 条（先横后竖、先竖后横），Z 形是拐两次的那些；迷宫布线则在全部走法甚至绕远的路里找。
  - id: channel-routing
    chapter: 布线
    title: 通道布线
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 两排单元之间留着一条横向的走线带，上下两边的引脚都朝它伸出来。某一列上边的引脚属于线网 1，下边的属于线网 2，两条线网都要在走线带里横着走一段。哪条横线应该在上面？
          options:
            - text: 线网 1 的横线在上面
              correct: true
            - text: 线网 2 的横线在上
              why: 线网 2 的引脚在下边，它的竖线从下往上伸到自己的横线；如果它的横线在上，这根竖线就会穿过线网 1 往下伸的竖线
            - text: 无所谓，横线和竖线在不同层，不会碰
              why: 横线和竖线确实在不同层，但同一列上两根竖线在同一层，会重叠短路
          explain: 同一列上，上边引脚的竖线往下、下边引脚的竖线往上，两根竖线在同一层。为了不重叠，上边那个线网的横线必须排在下边那个线网的横线之上。
      - card:
          title: 通道和它的术语
          body: |
            早期的标准单元芯片在两排单元之间留出横向的走线区域，叫**通道（channel）**。通道里画出若干条横向的轨道（track），每个线网在一条轨道上走一段横线（干线），再用竖线（支线）连到上下边的引脚，横竖两种线放在两层金属上，交点处用通孔连接。

            通道布线的目标是用最少的轨道把所有线网连好，因为轨道数决定了通道的高度。
      - card:
          title: 通道密度
          body: |
            把每个线网的横线看成从它最左的引脚列到最右的引脚列的一段区间。某一列上同时被覆盖的区间数（区间两端的列也算，线网要在那一列接引脚），就是这一列至少要有的轨道数；所有列里的最大值叫**通道密度（channel density）**，是轨道数的下限：轨道再少，这一列就放不下。

            区间之间的重叠关系可以画成水平约束图：两段重叠就连一条边，重叠的线网不能放同一条轨道。
      - item:
          id: channel-density
          type: number
          prompt: 一条通道有 8 列（第 0 到 7 列）。上边引脚依次是 1、1、3、0、2、4、0、4，下边是 2、3、0、2、0、3、4、0（0 表示没有引脚）。通道密度是多少？
          answer: 3
          hint: 先写出每个线网从第几列到第几列，再看哪一列被最多的区间覆盖。
          explain: 线网 1 在第 0–1 列，2 在 0–4 列，3 在 1–5 列，4 在 5–7 列。第 1 列同时被 1、2、3 覆盖，是最大值 3，所以通道密度是 3。
      - card:
          title: 垂直约束图
          body: |
            同一列上边引脚是线网 a、下边是线网 b 时，a 的横线必须在 b 之上，画一条 a → b 的有向边。这些边组成**垂直约束图（VCG, vertical constraint graph）**。

            **左边算法（left-edge algorithm）**从最上面的轨道开始，按区间左端从小到大把线网往当前轨道上放：只要和这条轨道上已放的区间不重叠、并且它在 VCG 里的上方线网都已经放在更上面的轨道，就放进来；放不下的留给下一条轨道。
      - card:
          title: 例题：用左边算法排上面那条通道
          body: 线网区间：1 在 0–1、2 在 0–4、3 在 1–5、4 在 5–7。VCG 的边：1 → 2（第 0 列）、1 → 3（第 1 列）、4 → 3（第 5 列）。
          reveal:
            - title: 第 1 步：第一条轨道
              body: 按左端排序是 1、2、3、4。1 没有上方线网，放下；2 和 3 的上方有 1，还没放在更上面的轨道，跳过；4 没有上方线网，区间 5–7 和 0–1 不重叠，放下。第一条轨道：1、4。
            - title: 第 2 步：第二条轨道
              body: 2 的上方 1 已放好，放下；3 的区间 1–5 和 2 的 0–4 重叠，跳过。第二条轨道：2。
            - title: 第 3 步：第三条轨道
              body: 3 的上方 1、4 都已放好，放下。共用 3 条轨道，等于通道密度，已经是最少。
      - item:
          id: left-edge-tracks
          type: number
          prompt: 一条通道里四个线网的区间是 a：0–2、b：3–6、c：1–4、d：5–7，没有垂直约束。用左边算法（按左端从小到大往轨道上放，不重叠就放进当前轨道）要几条轨道？
          answer: 2
          hint: 第一条轨道先放谁？下一个能放进去的是谁？
          explain: 按左端排序 a、c、b、d。第一条轨道放 a（0–2），c（1–4）重叠跳过，b（3–6）不重叠放下，d（5–7）和 b 重叠跳过；第二条轨道放 c 和 d。共 2 条，等于通道密度。没有垂直约束时，左边算法总能用到等于密度的轨道数。
      - card:
          title: 垂直约束有圈时
          body: |
            如果第 2 列上边是线网 A、下边是 B，第 6 列上边是 B、下边是 A，VCG 里就有 A → B → A 的圈：A 既要在 B 之上，又要在 B 之下。

            办法是**狗腿（dogleg）**：让一个线网的横线在中间某列拐一下，分成两段放在不同的轨道上。A 在第 2 列附近用上面的轨道，过了中间换到下面的轨道，两个约束就都满足了。狗腿还常常能减少总轨道数。
      - item:
          id: vcg-cycle
          type: choice
          prompt: 垂直约束图里有 A → B → A 的圈（某列上边 A 下边 B，另一列上边 B 下边 A）。为什么不用狗腿、只加轨道解决不了？
          options:
            - text: 两列要求的上下次序相反，一条横线满足不了
              correct: true
            - text: 轨道数已经等于通道密度，不允许再加
              why: 轨道数可以多于通道密度，通道高一点就行；问题是上下次序本身互相矛盾
            - text: 有圈说明 A 和 B 的区间重叠，加了轨道也还是重叠
              why: 区间重叠只要求两者放在不同轨道上，加轨道正好能满足；麻烦在于两列要求的上下次序相反
          explain: 每个线网只有一条横线时，它和 B 的上下关系只能有一种，而两列分别要求两种。只有让横线中途换轨道，才能在不同的列上满足相反的次序。
  - id: switchbox-otc
    chapter: 布线
    title: 开关盒、单元上方布线和今天的详细布线
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 通道布线时，通道不够高可以加轨道。可如果一块矩形区域四条边上都有引脚，四周又都被别的东西占住了，还能靠加轨道解决吗？
          options:
            - text: 不能，区域大小已固定
              correct: true
            - text: 能，往任意方向扩一点就行
              why: 四周都被占住时，区域不能再扩；这正是这类问题比通道布线难的地方
            - text: 能，把一部分引脚挪到区域外面
              why: 引脚位置由周围的单元和布线决定，在这一步不能随便挪
          explain: 通道只在上下两边有引脚，高度可调；四边都有引脚、尺寸固定的区域只能在给定的轨道里找走法，有时根本走不通。
      - card:
          title: 开关盒布线
          body: |
            四条边上都有引脚、尺寸固定的矩形布线区叫**开关盒（switchbox）**，通常出现在两条通道的交叉处。开关盒布线不能增加轨道，目标是在给定的横竖轨道里把所有线网连通，同时少用通孔、线短；走不通时要回到上一步，调整周围的布局或布线。

            常用的办法是从一边逐列扫描，每一列决定哪些线网继续横走、哪些拐弯、哪些在这里接到边上的引脚。
      - item:
          id: switchbox-fixed
          type: choice
          prompt: 开关盒布线和通道布线最大的区别是什么？
          options:
            - text: 开关盒四边都有引脚且尺寸固定，不能靠加轨道解决
              correct: true
            - text: 开关盒只有横线，没有竖线
              why: 开关盒里横竖线都有，四边都有引脚，竖线和横线都要用到
            - text: 开关盒就是小一号的通道，加轨道就能解决
              why: 开关盒四周都被占住，尺寸是给定的，没法像通道那样加高；只能在已有的轨道里找走法
          explain: 通道的高度是变量，算法的目标是少用轨道；开关盒的大小是常量，算法的目标是能不能布通、布得好不好。
      - card:
          title: 单元上方布线
          body: |
            金属层多了以后，单元自己只用到最下面一两层，上面的层可以直接从单元上空走线，叫**单元上方布线（OTC, over-the-cell routing）**。部分线网挪到单元上方，通道里需要的轨道就少了，通道变窄甚至取消。

            今天的芯片基本没有通道：整个芯片划成 gcell，详细布线在 gcell 里按每层的首选方向（一层横、一层竖）分配轨道，相邻 gcell 之间按全局布线给的路线接上。
      - item:
          id: otc-height
          type: number
          prompt: 一条通道原来要 8 条轨道，轨道间距 0.5 μm。把一部分线网挪到单元上方后只要 5 条轨道。通道高度减少了多少微米？
          answer: 1.5
          tolerance: 0.001
          unit: μm
          hint: 通道高度等于轨道数乘什么？
          explain: 原来 $8\times0.5 = 4$ μm，现在 $5\times0.5 = 2.5$ μm，减少 1.5 μm。每条通道都省下这一截，芯片整体就小了。
      - card:
          title: 详细布线今天的难点
          body: |
            先进工艺里，最小间距的线用一次光刻（把图形印到硅片上的工序）已经印不出来，要把同一层的图形分到两张（或更多）掩模（决定哪里透光的模板）上分别曝光，叫**多重图形（multiple patterning）**。间距太近的两条线必须分到不同掩模，详细布线就要保证这些“不能同色”的关系能用两种颜色分完，也就是让“太近”关系组成的图是二分图。

            此外还有：通孔规则复杂、引脚太小难以接入、线宽和间距随层变化、要顾及良率的推荐规则。
      - item:
          id: dp-odd-cycle
          type: choice
          prompt: 双重图形要把一层的线条分到两张掩模上，间距太近的两条线必须分到不同的掩模。把线条当顶点、“太近”的关系当边，下面哪种情况一定分不成？
          options:
            - text: 三条线两两都太近，组成一个三角形
              correct: true
            - text: 四条线依次太近，组成一个四边形的圈
              why: 四个点的圈可以交替用两种颜色分完（1、2、1、2），偶数长度的圈没问题
            - text: 十条线排成一串，相邻的太近
              why: 一串可以交替着色，不管多长都能分成两种
          explain: 能用两种颜色分完的图就是二分图，判据是没有奇数长度的圈。三角形是长度 3 的圈，第三条线不管放哪张掩模都会和另一条同色。详细布线遇到这种情况就得改线，拉开其中一对的距离。
      - item:
          id: preferred-dir
          type: choice
          prompt: 详细布线常让相邻两层金属的首选方向一横一竖。为什么？
          options:
            - text: 横竖交替时，一层的线很少挡住另一层，层间用通孔就能转向
              correct: true
            - text: 为了让每条线都尽量长
              why: 首选方向是为了减少同层线互相阻挡、提高轨道的利用率，不是为了让线变长
            - text: 因为光刻只能印一个方向的线
              why: 一层上也可以画别的方向的短线，只是不规整的图形更难制造、占的轨道多；首选方向主要是布线效率上的考虑
          explain: 同一层的线都朝一个方向，就能整齐地排在轨道上；需要转弯时换到相邻层。这让轨道数和通孔数都容易估算。
  - id: special-routing
    chapter: 布线
    title: 区域布线、斜线和时钟布线
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 时钟信号要同时送到芯片上成千上万个存数据的单元。如果它到达各处的时间有先有后，会出什么问题？
          options:
            - text: 各处同一拍的时刻不一致，可能出错
              correct: true
            - text: 没关系，时钟只要能到，早一点晚一点都一样
              why: 同步电路默认各处在同一时刻采样；时钟到得有早有晚，等于缩短或拉长了某些路径可用的时间
            - text: 只会让功耗变大
              why: 先后到达的主要后果是时序问题，可能违反建立或保持要求
          explain: 时钟到达时间的差别会直接加进时序计算。时钟布线的首要目标就是让它尽量同时到达。
      - card:
          title: 区域布线和非曼哈顿布线
          body: |
            区域布线（area routing）不区分通道，在整块区域、多层上直接给线网找路，迷宫布线和 A* 是它的基本工具，印制电路板布线也属于这一类。

            非曼哈顿布线允许 45° 斜线（八个方向）。从 (0, 0) 到 (3, 4)，横竖走要 7；先斜着走 3 格（每格长 $\sqrt2$）再竖走 1，只要 $1 + 3\sqrt2 \approx 5.24$。斜线省线长，但制造和设计规则更麻烦，所以芯片上用得不多。
      - item:
          id: octilinear
          type: number
          prompt: 允许 45° 斜线时，从 (0, 0) 到 (5, 2) 的最短走线是多长？保留两位小数。
          answer: 5.83
          tolerance: 0.005
          hint: 斜着走几格能同时消掉横向和纵向的差？剩下的怎么走？
          explain: 斜着走 2 格消掉纵向的 2，长 $2\sqrt2 \approx 2.83$；再横走 3，合计 $3 + 2\sqrt2 \approx 5.83$。横竖走要 7，直线距离是 $\sqrt{29} \approx 5.39$。
      - card:
          title: 时钟偏斜和 H 树
          body: |
            同步电路里存数据的单元叫**触发器（flip-flop）**，它在时钟的边沿那一刻把输入存下来。时钟到达不同触发器的时间之差（最晚减最早）叫**时钟偏斜（clock skew）**。

            如果触发器排得很规整，可以用 **H 树（H-tree）**：从中心画一个 H，四个端点再各画一个小一半的 H，如此递归。从根到每个端点的路径长度完全相同，偏斜为零；代价是线长多、对不规则分布的触发器不合适。
      - item:
          id: skew-value
          type: number
          prompt: 时钟到达四个触发器的时间是 1.20、1.35、1.28、1.31 ns。时钟偏斜是多少纳秒？
          answer: 0.15
          tolerance: 0.0005
          unit: ns
          hint: 最晚和最早各是多少？
          explain: 最晚 1.35，最早 1.20，偏斜 0.15 ns。
      - card:
          title: 零偏斜合并
          body: |
            触发器分布不规则时，自底向上两两合并：把两棵已经各自零偏斜的子树用一段线连起来，在线上找一个接点，使接点到两边终点的延迟相等。只按线长算延迟时，设两棵子树从各自根部到终点的延迟是 $t_1$、$t_2$，连线长 $L$，接点离子树 1 的距离为 $x$，要 $t_1 + x = t_2 + (L - x)$。

            DME（deferred-merge embedding，延迟合并嵌入）算法把这种合并做得线长最省：先算出接点可以在哪些位置，再自顶向下选定。
      - card:
          title: 例题：找零偏斜接点
          body: 子树 1 的延迟 $t_1 = 2$，子树 2 的延迟 $t_2 = 4$（单位相同，按线长算），两根部之间的连线长 $L = 10$。接点离子树 1 多远？
          reveal:
            - title: 第 1 步：写出相等条件
              body: $2 + x = 4 + (10 - x)$。
            - title: 第 2 步：解出 x
              body: $2x = 12$，$x = 6$。接点离延迟小的子树 1 更远，用多出的线长给它补上延迟。
            - title: 第 3 步：验算
              body: 子树 1 一侧 $2 + 6 = 8$，子树 2 一侧 $4 + 4 = 8$，相等。
      - item:
          id: zero-skew-tap
          type: number
          prompt: 两棵零偏斜子树，延迟分别是 $t_1 = 3$、$t_2 = 1$（按线长算），两根部之间的连线长 $L = 8$。按 $t_1 + x = t_2 + (L - x)$，接点离子树 1 的距离 $x$ 是多少？
          answer: 3
          tolerance: 0.001
          hint: 把条件整理成 $2x = \ ?$
          explain: $3 + x = 1 + 8 - x$，$2x = 6$，$x = 3$。两侧都是 6。子树 1 本来就慢，接点离它更近。
      - card:
          title: 现代时钟树综合
          body: |
            实际的时钟树要驱动几万到几百万个触发器，光靠导线会太慢、波形太缓。时钟树综合在树上分层插入**缓冲器（buffer）**，即把信号重新放大、不改变逻辑值的小门，在零偏斜的骨架上同时控制偏斜、到达时间和功耗；还会故意留一点有益的偏斜，借时间给最紧的路径。

            早期还有均值中值法（method of means and medians）按中值把终点分成两半，从全体终点的平均位置连到两半各自的平均位置，再对每一半递归，树大致平衡但偏斜不为零。
      - item:
          id: htree-levels
          type: number
          prompt: 一棵 H 树每一层的每个 H 把一个端点分成 4 个端点。要送到 64 个终点，需要几层 H？
          answer: 3
          hint: 每多一层，端点数乘几？
          explain: 每一层的 H 把上一层的 1 个端点换成 4 个，所以每层乘 4：1 层 4 个，2 层 16 个，3 层 64 个，$4^3 = 64$。
  - id: sta-algorithms
    chapter: 静态时序分析
    title: 到达时间、要求时间和松弛量
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 两个触发器之间的逻辑有几十个输入，路径成千上万条。要知道信号最晚什么时候到达终点，需要把所有输入组合都仿真一遍吗？
          options:
            - text: 不需要，沿着电路的连接把每段延迟加起来，在汇合处取最大就行
              correct: true
            - text: 需要，否则不知道最慢的情况
              why: 几十个输入的组合数是 2 的几十次方，根本仿真不完；按结构累加延迟、汇合处取最大，就得到了最坏情况的上限
            - text: 只要仿真最长的那条路径
              why: 不先算一遍，并不知道哪条最长；按结构累加正是用来找出它的
          explain: 不给任何具体的输入、只看电路结构和每段延迟来求最坏情况，这就是静态时序分析。它只要把电路图走一遍。
      - card:
          title: 静态时序分析
          body: |
            **静态时序分析（STA, static timing analysis）**把电路看成有向无环图：门的输入输出是顶点，门内和连线的延迟是边上的权。从输入端出发，信号在每个点最晚什么时候稳定，叫这个点的**到达时间（arrival time）**：

            $$AT(v) = \max_{u \to v}\big(AT(u) + d(u, v)\big)$$

            按拓扑排序的次序处理顶点，每个点的前驱都已算好，每条边只看一次，时间和图的大小成正比，所以能用在上亿个门的芯片上。
      - card:
          title: 演示：按拓扑次序处理
          body: 输入 a、b 进入门 g1；g1 和 a 进入 g2；b 单独进入 g3；g2、g3 进入 out。点下面的图，看拓扑排序的次序：一个点在它的所有前驱之后才出现。
          sim:
            name: graph
            params:
              mode: topo
              directed: true
              nodes: [{ id: a, x: 40, y: 50 }, { id: b, x: 40, y: 160 }, { id: g1, x: 140, y: 100 }, { id: g2, x: 240, y: 50 }, { id: g3, x: 240, y: 170 }, { id: out, x: 330, y: 110 }]
              edges: [[a, g1], [b, g1], [g1, g2], [a, g2], [b, g3], [g2, out], [g3, out]]
      - item:
          id: sta-topo
          type: sim
          sim: graph
          prompt: 一段逻辑：a、b 进入 g1，g1 和 b 进入 g2，g2 和 a 进入 out。按静态时序分析能处理的先后（拓扑排序）点一遍。
          params:
            mode: topo
            directed: true
            nodes: [{ id: a, x: 40, y: 50 }, { id: b, x: 40, y: 170 }, { id: g1, x: 140, y: 110 }, { id: g2, x: 240, y: 150 }, { id: out, x: 330, y: 70 }]
            edges: [[a, g1], [b, g1], [g1, g2], [b, g2], [g2, out], [a, out]]
          goal: {}
          solution: [a, b, g1, g2, out]
          explain: g1 要等 a、b，g2 要等 g1、b，out 要等 g2、a。a 和 b 谁先都行，之后只能是 g1、g2、out。
      - card:
          title: 要求时间、松弛量和关键路径
          body: |
            终点触发器要求数据在时钟边沿之前至少稳定一段时间，叫**建立时间（setup time）**。不计时钟偏斜时，时钟周期 $T$ 减去建立时间，就是终点的**要求到达时间（required arrival time）**。从终点往回推：$RAT(u) = \min_{u \to v}\big(RAT(v) - d(u, v)\big)$。

            **松弛量（slack）**（也叫时序裕量）等于要求到达时间减去到达时间，为负就是时序违例。松弛量最小的那条路径叫**关键路径（critical path）**。
      - card:
          title: 例题：一段逻辑的时序
          body: a 在 0 ns、b 在 1 ns 到达。g1 = f(a, b) 延迟 2 ns，g2 = f(g1, a) 延迟 1 ns，g3 = f(b) 延迟 2.5 ns，out = f(g2, g3) 延迟 1 ns。时钟周期 6 ns，建立时间 0.4 ns。
          reveal:
            - title: 第 1 步：按拓扑次序算到达时间
              body: $AT(g1) = \max(0, 1) + 2 = 3$；$AT(g2) = \max(3, 0) + 1 = 4$；$AT(g3) = 1 + 2.5 = 3.5$；$AT(out) = \max(4, 3.5) + 1 = 5$。
            - title: 第 2 步：终点的松弛量
              body: 要求到达时间 $6 - 0.4 = 5.6$，松弛量 $5.6 - 5 = 0.6$ ns，没有违例。
            - title: 第 3 步：往回推，找关键路径
              body: g2、g3 的输出要在 $5.6 - 1 = 4.6$ 之前，g1 的输出要在 $4.6 - 1 = 3.6$ 之前。g3 的松弛量 $4.6 - 3.5 = 1.1$，g1、g2 都是 0.6。关键路径是 b → g1 → g2 → out。
      - item:
          id: sta-at
          type: number
          prompt: a 在 0.2 ns、b 在 0 ns 到达。g1 = f(a, b) 延迟 1.5 ns，g2 = f(g1, b) 延迟 1 ns，out = f(g2, a) 延迟 0.5 ns。out 的到达时间是多少纳秒？
          answer: 3.2
          tolerance: 0.001
          unit: ns
          hint: 每个门取输入里最晚的那个，再加自己的延迟。
          explain: $AT(g1) = \max(0.2, 0) + 1.5 = 1.7$；$AT(g2) = \max(1.7, 0) + 1 = 2.7$；$AT(out) = \max(2.7, 0.2) + 0.5 = 3.2$ ns。
      - item:
          id: sta-slack
          type: number
          prompt: 一条路径到达终点触发器的时间是 3.2 ns，时钟周期 4 ns，触发器建立时间 0.3 ns。松弛量是多少纳秒？
          answer: 0.5
          tolerance: 0.001
          unit: ns
          hint: 要求到达时间是多少？
          explain: 要求到达时间 $4 - 0.3 = 3.7$ ns，松弛量 $3.7 - 3.2 = 0.5$ ns。周期缩到 3.4 ns 时松弛量变成 $-0.1$，就违例了。
      - card:
          title: 延迟从哪里来
          body: |
            门的延迟取决于输入信号变化的快慢和输出要驱动的负载，单元库用查表给出。连线的延迟用电阻和电容估算：把一根线切成几段，每段一个电阻、一个对地电容，组成一棵树。**Elmore 延迟（Elmore delay）**把从源点到目标点路径上的每个电阻，乘以它下游的全部电容，再加起来。

            版图做完后，工具从版图里提取每根线的电阻和电容（叫寄生电阻电容提取），存成 SPEF 一类的文件；算出的各段延迟存成 SDF 文件，交给时序分析和仿真使用。
      - item:
          id: elmore
          type: number
          prompt: 一根线分成两段：第一段电阻 2 kΩ、末端对地电容 5 fF；第二段电阻 1 kΩ、末端电容 10 fF。线的末端的 Elmore 延迟是多少皮秒？
          answer: 40
          tolerance: 0.001
          unit: ps
          hint: 第一段电阻下游有哪些电容？第二段呢？
          explain: 第一段电阻下游有 $5 + 10 = 15$ fF，贡献 $2\ \text{kΩ}\times15\ \text{fF} = 30$ ps；第二段下游只有 10 fF，贡献 10 ps；合计 40 ps。
      - item:
          id: negative-slack
          type: choice
          prompt: 静态时序分析报告某条路径的松弛量是 −0.2 ns。这说明什么？
          options:
            - text: 信号比要求晚到 0.2 ns，在这个时钟频率下会违例
              correct: true
            - text: 信号比要求早到 0.2 ns，还有余量
              why: 松弛量是要求时间减到达时间，为负说明到达时间更大，即晚到了
            - text: 这条路径不需要满足时序
              why: 松弛量为负正是没满足时序的标志；不需要检查的路径要专门声明为例外，不会报负松弛量
          explain: 修违例的办法有：降低时钟频率、换更快的单元、插缓冲器、改布局让关键线变短，这些就是时序驱动的优化。
  - id: timing-driven
    chapter: 静态时序分析
    title: 时序驱动的布局布线和物理综合
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一根很长的线延迟太大。在线的中间加一个把信号重新放大的小门，整条线的延迟会怎样？
          options:
            - text: 可能变小
              correct: true
            - text: 一定变大，因为多了一个门的延迟
              why: 多了一个门的延迟是对的，但长线的延迟大致和长度的平方成正比，切成两半后线的延迟减少得更多
            - text: 不变，信号走的路一样长
              why: 线的总长没变，但电阻和电容是一起增长的，延迟和长度的平方有关；切断后每段只要驱动一半的电容
          explain: 分布式的导线电阻、电容都和长度成正比，延迟约为 $\tfrac12 rcL^2$。切成两段，每段 $\tfrac12 rc(L/2)^2$，两段合起来只有原来的一半，再加一个门的延迟，长线时仍然划算。
      - card:
          title: 时序驱动的布局
          body: |
            **时序驱动布局（timing-driven placement）**让布局知道哪些线网在关键路径上。常见的做法有两种。给线网加权：先做一次静态时序分析，松弛量小的线网权重大，再最小化加权线长，反复几轮。加约束：给关键路径的总延迟定上限，在满足上限的前提下优化线长。

            权重常按“关键程度”算，例如 $1 - \text{slack}/T$：松弛量越接近 0，关键程度越接近 1。
      - item:
          id: criticality
          type: number
          prompt: 按关键程度 $1 - \text{slack}/T$ 给线网加权。时钟周期 $T = 5$ ns，某线网所在路径的松弛量是 0.5 ns。它的关键程度是多少？
          answer: 0.9
          tolerance: 0.001
          hint: $\text{slack}/T$ 是多少？
          explain: $1 - 0.5/5 = 0.9$。松弛量 4 ns 的线网关键程度只有 0.2，权重小，布局时让它为关键线网让路。
      - card:
          title: 时序驱动的布线
          body: |
            一个线网的源点要连到好几个终点。总线长最短的树（最小生成树一类）可能让某个终点绕很远；每个终点都走最短路的树（最短路径树）线长又太大。时序驱动布线在两者之间折中：Prim–Dijkstra 折中法用一个系数在两种树之间连续调节，对关键的终点优先保证短路径。
      - item:
          id: tree-tradeoff
          type: choice
          prompt: 一个线网的某个终点在关键路径上。按总线长最短来连这个线网，可能出什么问题？
          options:
            - text: 关键终点可能被绕远，源点到它的延迟变大
              correct: true
            - text: 按总线长最短来连，每个终点也就离源点最近
              why: 总线长最短和每个终点都近是两个目标；最小生成树为了省总线长，常让某个终点绕一大圈
            - text: 线网连不通
              why: 生成树一定把所有点连通；问题只是某些终点离源点路径长
          explain: 总线长最短和每个终点离源点都近是两个不同的目标。时序驱动布线对关键终点更看重后者。
      - card:
          title: 物理综合
          body: |
            布局之后有了真实的位置和线长，再回头改网表来修时序，叫**物理综合（physical synthesis）**。常用的手段：门尺寸调整（关键路径上换驱动更强的门，代价是输入电容和面积变大）；插缓冲器（把长线切开，或替关键终点隔开大负载）；门复制（一个门驱动太多负载时复制一份分担）；交换等价的输入引脚，让最晚到的信号接最快的引脚；局部改写逻辑结构。
      - card:
          title: 例题：插一个缓冲器值不值
          body: 一根长线不插缓冲器时延迟 $\tfrac12 rcL^2 = 400$ ps。在正中间插一个缓冲器，缓冲器自己的延迟 30 ps。
          reveal:
            - title: 第 1 步：每段线的延迟
              body: 每段长 $L/2$，延迟 $\tfrac12 rc(L/2)^2 = 400/4 = 100$ ps。
            - title: 第 2 步：总延迟
              body: 两段 $2\times100 = 200$ ps，加缓冲器 30 ps，共 230 ps。
            - title: 第 3 步：比较
              body: 比 400 ps 少 170 ps。线越长，插缓冲器越划算；线很短时，缓冲器自己的延迟反而占了大头。
      - item:
          id: buffer-three
          type: number
          prompt: 一根长线不插缓冲器时延迟 $\tfrac12 rcL^2 = 450$ ps。均匀插 2 个缓冲器把它分成 3 段，每个缓冲器延迟 30 ps。总延迟是多少皮秒？
          answer: 210
          tolerance: 0.001
          unit: ps
          hint: 每段长 $L/3$，延迟是原来的几分之一？
          explain: 每段延迟 $450/9 = 50$ ps，三段 150 ps，加 2 个缓冲器 60 ps，共 210 ps。
      - item:
          id: flow-loop
          type: choice
          prompt: 为什么性能驱动的设计流程要在布局、布线之后反复做静态时序分析和物理综合，而不是综合时一次做好？
          options:
            - text: 综合时线长和负载只能估计
              correct: true
            - text: 综合工具不能做时序分析
              why: 综合时也做时序分析，只是线的延迟靠估计；物理信息越全，分析越准
            - text: 布线以后时序一定会变好，需要再确认一次
              why: 布线后线长确定，时序常常比估计时更差，这正是要反复修的原因
          explain: 线的延迟在先进工艺里占了很大比例。只有知道单元放在哪、线怎么走，才能准确算延迟，所以要“综合—布局—分析—修改”反复进行，直到时序满足。
  - id: logic-sim
    chapter: 电路仿真算法
    title: 逻辑仿真
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个有一百万个门的电路，每个时钟周期里通常只有百分之几的门的输出会变。仿真时每个周期都把一百万个门全部重新算一遍，浪费在哪里？
          options:
            - text: 大部分门的输入没变，输出也不会变，重新算是白算
              correct: true
            - text: 不浪费，每个门都必须算才知道结果
              why: 一个门的输入都没变，它的输出一定不变，不用算就知道
            - text: 浪费在存储上，计算本身很快
              why: 主要浪费的是计算：一百万个门里大部分每个周期都在重复算出同样的值
          explain: 只算输入发生了变化的门，计算量就和电路的活跃程度成正比，而不是和门的总数成正比。这就是事件驱动仿真的出发点。
      - card:
          title: 逻辑仿真
          body: |
            **逻辑仿真（logic simulation）**给电路加上输入，按门的逻辑功能算出各点的值，检查功能对不对。信号的值除了 0、1，还常用 X 表示未知（比如没有初始化的触发器），用 Z 表示没有被驱动（高阻）。

            **编译式仿真（compiled-code simulation）**先把门按拓扑次序排好，整体翻译成一段可以直接运行的程序，每个周期从头到尾把每个门算一遍。它简单，不用安排谁先算谁后算，但只给出每个周期结束时的稳定值。
      - item:
          id: x-and
          type: choice
          prompt: 逻辑仿真里一个与门的两个输入是 0 和 X（未知）。输出是什么？
          options:
            - text: 0，因为与门只要有一个输入是 0，输出就是 0
              correct: true
            - text: X，因为有一个输入未知
              why: 不管 X 实际是 0 还是 1，和 0 相与都得 0，所以输出是确定的
            - text: 1，未知当作 1 处理
              why: 仿真器不会把 X 当成 1；它的规则是只有结果真正取决于未知输入时才输出 X
          explain: 输入 1 和 X 时输出才是 X（结果取决于 X）。正确处理 X 能让仿真发现“没有初始化就被使用”的问题。
      - card:
          title: 事件驱动仿真
          body: |
            **事件驱动仿真（event-driven simulation）**只在信号变化时做事：一个信号在某时刻变了，就是一个事件；把受它影响的门找出来重新求值，如果某个门的输出要变，就按这个门的延迟在将来的时刻排一个新事件。事件按时间排在一个队列里，按先后取出处理。

            它能按门的延迟模拟出中间的变化，比如短暂的错误脉冲，叫**毛刺（glitch）**。真实的门有惯性，比门延迟还窄的脉冲常常传不过去，仿真器可以按这种惯性延迟把它滤掉。
      - card:
          title: 例题：一个会出毛刺的电路
          body: g1 = NOT(a)，out = AND(a, g1)，两个门的延迟都是 1。开始时 a = 0，所以 g1 = 1、out = 0。a 在 t = 0 变成 1。
          reveal:
            - title: 第 1 步：t = 0 的事件
              body: a 变成 1，影响 g1 和 out。g1 将变成 0，排在 t = 1；out 的输入是 a = 1、g1 = 1，将变成 1，也排在 t = 1。
            - title: 第 2 步：t = 1 的事件
              body: g1 变成 0，out 变成 1。g1 的变化又影响 out：输入 a = 1、g1 = 0，out 将变成 0，排在 t = 2。
            - title: 第 3 步：t = 2
              body: out 变回 0。out 在 1 到 2 之间出现了宽度为 1 的毛刺；只看稳定值的编译式仿真看不到它。
      - item:
          id: glitch-width
          type: number
          prompt: g1 = NOT(a) 延迟 2，out = AND(a, g1) 延迟 1。开始 a = 0（g1 = 1、out = 0），a 在 t = 0 变成 1。按事件驱动仿真，out 在 t = 1 变成 1，什么时刻变回 0？
          answer: 3
          hint: g1 什么时刻变成 0？out 看到这个变化后还要多久？
          explain: g1 在 t = 2 变成 0，out 再过 1 个延迟，在 t = 3 变回 0。毛刺宽度 2，正好是两条路径的延迟差：a 直接到 out 是 1，经过 g1 到 out 是 $2 + 1 = 3$。
      - item:
          id: event-saving
          type: number
          prompt: 一个电路有 1000 个门，仿真 100 个周期。编译式仿真每个周期算每个门一次；事件驱动仿真平均每个周期只需重新算 2% 的门。编译式的求值次数是事件驱动的多少倍？
          answer: 50
          hint: 两种方式各要算多少次？
          explain: 编译式 $1000\times100 = 100000$ 次，事件驱动 $1000\times0.02\times100 = 2000$ 次，相差 50 倍。事件驱动每次还要维护事件队列，活跃度很高时这份开销会抵掉一部分优势。
      - item:
          id: compiled-vs-event
          type: choice
          prompt: 要检查一个同步电路每个周期结束时的结果对不对，不关心中间的毛刺。哪种逻辑仿真更合适？
          options:
            - text: 编译式仿真，每个周期按拓扑次序算一遍，简单而快
              correct: true
            - text: 事件驱动仿真，它总是更快
              why: 事件驱动在活跃度低时省计算，但要维护事件队列；只要周期末的值时，编译式不用排队，常常更快
            - text: 两种都不行，要用电路仿真
              why: 电路仿真算的是电压随时间的连续变化，精确但慢得多；只看逻辑值时用不着
          explain: 编译式仿真天然对应“每个周期算一次稳定值”。要看门延迟带来的时序和毛刺，才需要事件驱动；要看真实电压波形，再用电路仿真。
  - id: circuit-sim
    chapter: 电路仿真算法
    title: 电路仿真：节点方程、牛顿迭代和数值积分
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 5 V 电源经过一个电阻接到二极管上，二极管的电流随电压按指数增长。要求二极管两端的电压，能像只有电阻的电路那样直接解一个线性方程吗？
          options:
            - text: 不能，要反复迭代
              correct: true
            - text: 能，把二极管当成一个固定电阻就行
              why: 二极管的“电阻”随电压剧烈变化，没有一个固定值；当成固定电阻只是一次猜测，要在新电压下重新算
            - text: 不能，这种电路没有确定的解
              why: 这个电路有唯一的工作点，只是要用迭代的办法求出来
          explain: 非线性元件让节点方程变成非线性方程。电路仿真器的做法是在当前猜测处把它近似成线性的，解一次，再用新结果重新近似，反复进行。
      - card:
          title: 节点分析
          body: |
            电路仿真先列方程：选一个节点当地（0 V），对其余每个节点写“流出的电流之和为零”。电阻的电流是两端电压差除以电阻。只有电阻和电流源时，这组方程是线性的，写成 $G\,v = i$，$G$ 由各电阻的电导（电阻的倒数，电流等于电导乘电压差）组成，$v$ 是未知的节点电压。

            电压源的电流不能由电压直接写出，**改进节点分析（MNA, modified nodal analysis）**把每个电压源的电流也当作未知量，再给每个电压源补一个方程，SPICE 一类仿真器都这样列方程。
      - item:
          id: nodal-divider
          type: number
          prompt: 5 V 电源经 1 kΩ 电阻接到节点 1，节点 1 经 2 kΩ 电阻接地。对节点 1 列电流方程，求它的电压（伏）。
          answer: 3.333
          tolerance: 0.001
          unit: V
          hint: 流出节点 1 的两路电流各怎么写？
          explain: $(v_1 - 5)/1000 + v_1/2000 = 0$，两边乘 2000 得 $3v_1 = 10$，$v_1 \approx 3.333$ V。
      - item:
          id: mna-unknowns
          type: number
          prompt: 一个电路除了地以外有 6 个节点，含 2 个独立电压源。用改进节点分析列方程，一共有多少个未知量？
          answer: 8
          hint: 节点电压有几个？每个电压源再加几个？
          explain: 6 个节点电压加 2 个电压源电流，共 8 个未知量，对应 8 个方程。
      - card:
          title: 牛顿–拉夫逊迭代
          body: |
            二极管让方程变成 $f(v) = 0$ 且 $f$ 里有指数项。**牛顿–拉夫逊法（Newton–Raphson method）**从一个猜测 $v_k$ 出发，用这一点的切线代替曲线，切线与零的交点就是下一个猜测：$v_{k+1} = v_k - f(v_k)/f'(v_k)$。

            在电路里，这一步等于把二极管换成一个电导 $G = dI/dv$ 并联一个电流源，叫**伴随模型（companion model）**，然后解一次线性节点方程。反复下去，结果的变化小到可以忽略时，称为**收敛（converge）**。
      - card:
          title: 例题：迭代一步
          body: 3 V 电源经 1 kΩ 接二极管，$I = I_S(e^{v/V_T} - 1)$，$I_S = 10^{-14}$ A，$V_T = 25$ mV。节点方程 $f(v) = (3 - v)/1000 - I_S(e^{v/V_T} - 1) = 0$。从 $v_0 = 0.7$ V 开始。
          reveal:
            - title: 第 1 步：算 f(v₀)
              body: $e^{0.7/0.025} = e^{28} \approx 1.446\times10^{12}$，二极管电流约 14.46 mA，电阻电流 2.3 mA，$f(v_0) \approx 0.0023 - 0.01446 = -0.01216$ A。
            - title: 第 2 步：算 f′(v₀)
              body: $f'(v) = -1/1000 - (I_S/V_T)e^{v/V_T} \approx -0.001 - 0.5785 = -0.5795$ A/V。
            - title: 第 3 步：更新
              body: $v_1 = 0.7 - (-0.01216)/(-0.5795) \approx 0.6790$ V。继续迭代得 0.6634、0.6559、0.6546……收敛到约 0.6545 V。
      - item:
          id: newton-step
          type: number
          prompt: 用牛顿–拉夫逊法解 $f(v) = v^2 - 2 = 0$，从 $v_0 = 1.5$ 开始，迭代一步得到的 $v_1$ 是多少？保留四位小数。
          answer: 1.4167
          tolerance: 0.00005
          hint: $f(1.5)$ 和 $f'(1.5)$ 各是多少？
          explain: $f(1.5) = 0.25$，$f'(v) = 2v = 3$，$v_1 = 1.5 - 0.25/3 \approx 1.4167$。再迭代一步是 1.41422，已经和 $\sqrt2 = 1.41421$ 很接近：离解近时，每一步有效数字大约翻倍。
      - item:
          id: diode-current
          type: number
          prompt: 3 V 电源经 1 kΩ 电阻接二极管，迭代收敛后二极管两端电压是 0.6545 V。电路的电流是多少毫安？
          answer: 2.3455
          tolerance: 0.005
          unit: mA
          hint: 电阻两端的电压是多少？
          explain: $(3 - 0.6545)/1000 = 2.3455$ mA。用二极管公式 $I_S e^{0.6545/0.025}$ 算约 2.343 mA，差别来自电压只保留了四位小数（用 0.654523 V 算就是 2.3455 mA）。收敛时两边算出的电流相等。
      - card:
          title: 随时间变化：数值积分
          body: |
            有电容时 $i = C\,dv/dt$，方程里有电压随时间的变化率。仿真器把时间切成步长 $h$，用前后两步的差除以 $h$ 代替变化率。**后向欧拉法（backward Euler）**取 $i_{n+1} = C(v_{n+1} - v_n)/h$，电容就变成电导 $C/h$ 并联一个由上一步电压决定的电流源，每一步又是一次线性（或牛顿）求解。梯形法取前后两点的平均，更准。
      - item:
          id: backward-euler
          type: number
          prompt: 电容经电阻放电，$dv/dt = -v/\tau$，$\tau = 1$ ms，$v(0) = 1$ V。用后向欧拉法 $v_1 = v_0/(1 + h/\tau)$，步长 $h = 0.1$ ms，第一步后 $v_1$ 是多少伏？保留三位小数。
          answer: 0.909
          tolerance: 0.0005
          unit: V
          hint: $h/\tau$ 是多少？
          explain: $v_1 = 1/1.1 \approx 0.909$ V。准确值 $e^{-0.1} \approx 0.905$；前向欧拉法给 0.900，梯形法给 0.905。后向欧拉法步长再大，算出的电压也只会衰减；前向欧拉法在 $h > 2\tau$ 时会越算越大。
  - id: drc
    chapter: 物理验证
    title: 版图层、设计规则和 DRC
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 版图上两条金属线靠得太近，比工厂允许的最小间距还近一点。电路图上它们本来就不相连。这会有什么问题？
          options:
            - text: 制造时两条线可能连在一起短路，或者良率下降
              correct: true
            - text: 没问题，电路图上它们不相连，制造出来也不会连
              why: 制造按版图的几何图形来做，光刻和刻蚀有误差，太近的两条线可能粘连；电路图管不了这一点
            - text: 只会让线的电阻变大
              why: 间距影响的是两条线会不会碰在一起（以及耦合电容），不是线本身的电阻
          explain: 工厂按自己的工艺能力规定每层图形的最小宽度、最小间距等，叫设计规则。违反规则的版图制造出来很可能不能用。
      - card:
          title: 版图层和设计规则
          body: |
            版图由很多层图形叠成：阱、有源区、多晶硅、接触孔、各层金属和通孔，每层对应制造中的一道光刻。工厂给每层定出几何上的**设计规则（design rule）**：最小宽度、同层最小间距、一层包住另一层的最小余量（如金属要把通孔四周都盖住一圈，叫包围）、一层伸出另一层的最小长度（如多晶硅栅要伸出有源区）。

            早期的教学规则用一个长度单位 λ 写成倍数，换工艺时只要改 λ；先进工艺的规则直接用纳米写，而且多得多。
      - item:
          id: lambda-rule
          type: number
          prompt: 一套 λ 规则规定金属 1 的最小宽度是 3λ，最小间距是 3λ。λ = 0.09 μm 时，并排的两条最窄金属 1 线，从第一条左边缘到第二条右边缘至少多宽（微米）？
          answer: 0.81
          tolerance: 0.0005
          unit: μm
          hint: 两条线宽加一个间距，一共几个 λ？
          explain: $3\lambda + 3\lambda + 3\lambda = 9\lambda = 9\times0.09 = 0.81$ μm。规则写成 λ 的倍数，换一个 λ 就能整套换算。
      - card:
          title: 设计规则检查
          body: |
            **设计规则检查（DRC, design rule check）**用程序在版图上逐条检查规则，把违例的地方标出来。基本检查有：宽度检查（图形最窄处是否小于规定值）、间距检查（两个图形之间是否太近）、包围检查（内层图形四周的余量够不够）、交叠检查。

            很多规则针对的不是原始图层，而是由图层运算得到的新图层，比如“栅”是多晶硅和有源区的重叠部分。物理验证还包括电路规则检查（ERC），查栅极悬空、电源和地短路这类电学问题。
      - item:
          id: spacing-check
          type: number
          prompt: 同一层上两个金属矩形，一个横向占 0 到 0.50 μm，另一个占 0.68 到 1.20 μm，纵向范围相同。最小间距规则是 0.20 μm。它们的间距是多少微米？
          answer: 0.18
          tolerance: 0.0005
          unit: μm
          hint: 第一个的右边缘和第二个的左边缘差多少？
          explain: $0.68 - 0.50 = 0.18$ μm，小于 0.20 μm，DRC 会在这里报一个间距违例。
      - item:
          id: enclosure-check
          type: number
          prompt: 一个 0.20 μm × 0.20 μm 的通孔放在 0.28 μm × 0.28 μm 的金属方块正中。规则要求金属对通孔的包围至少 0.05 μm。实际包围是多少微米？
          answer: 0.04
          tolerance: 0.0005
          unit: μm
          hint: 金属比通孔宽出多少，分到两边各多少？
          explain: 宽出 $0.28 - 0.20 = 0.08$ μm，居中时每边 0.04 μm，不到 0.05 μm，违例。金属方块要至少 0.30 μm 宽才合规。
      - card:
          title: 图层布尔运算和规则文件
          body: |
            DRC 工具提供图层之间的布尔运算：与（取重叠）、非（从一层里减去另一层）、或、异或，以及把图形整体放大或缩小（sizing）。规则写在**规则文件（runset）**里，是一段脚本。开源版图工具 KLayout 的 DRC 脚本是这样写的：

            ```
            active = input(1, 0)
            poly   = input(5, 0)
            gate   = active & poly
            gate.width(0.3).output("gate_width", "Gate width violations")
            psd    = active - poly
            ```

            前两行读入图层，`&` 求重叠得到栅，`width(0.3)` 找出比 0.3 μm 窄的地方写进报告，`-` 是从一层减去另一层。
      - item:
          id: boolean-layer
          type: choice
          prompt: 规则文件里 `gate = active & poly` 得到的是什么？
          options:
            - text: 两层重叠处，即栅
              correct: true
            - text: 有源区和多晶硅合在一起的全部图形
              why: 合在一起是“或”（`|`）；`&` 是“与”，只留下两层都有的地方
            - text: 有源区去掉多晶硅以后剩下的部分
              why: 去掉一层是“非”（`-`），得到的是源区和漏区；`&` 留下的是重叠处
          explain: 多晶硅压在有源区上的地方形成晶体管的栅。先用布尔运算得到“栅”这一层，才能写“栅长不小于多少”这样的规则。
      - item:
          id: waiver
          type: choice
          prompt: DRC 报出的一个违例，设计者确认它在这里不影响制造（比如只是工厂的推荐规则）。通常怎么处理？
          options:
            - text: 记录理由后把它标记为豁免，下次运行时自动沿用
              correct: true
            - text: 直接删掉规则文件里的这条规则
              why: 删掉规则会让别处真正的违例也查不出来；豁免只针对这一个具体位置
            - text: 不用管，DRC 报的违例都可以忽略
              why: 大部分违例必须改；只有确认不影响制造的个别情况才豁免，而且要有记录
          explain: KLayout 的做法是在标记浏览器里把这个违例设为“已豁免”并另存一个豁免文件，下次运行会重新套用。豁免要尽量少用、晚用。
  - id: lvs
    chapter: 物理验证
    title: 版图与原理图比对
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 版图通过了 DRC，每条线都够宽、够远。它就一定实现了原理图上的电路吗？
          options:
            - text: 不一定，DRC 不查连接对不对
              correct: true
            - text: 一定，通过 DRC 说明版图没有错
              why: 两条该连的线没连上、或者接错了位置，每个图形本身照样可以满足宽度和间距规则
            - text: 一定，版图是照着原理图画的
              why: 照着画也可能画错，正因为人和工具都会出错，才需要一个独立的比对
          explain: DRC 回答“能不能造出来”，LVS 回答“造出来的是不是想要的电路”。两者都要通过。
      - card:
          title: LVS 做什么
          body: |
            **版图与原理图比对（LVS, layout versus schematic）**分两步：先从版图里把电路“读”出来，得到一个版图网表；再把它和原理图的网表比较，看器件和连接是否一一对应。

      - card:
          title: 从版图认出晶体管
          body: |
            MOS 晶体管有源极、栅极、漏极和衬底四端，栅极上的电压决定源漏之间通不通；NMOS 和 PMOS 是极性相反的两种。版图上，多晶硅横跨有源区（做源漏的区域）的那一块就是栅。读电路要做**器件提取（device extraction）**：按图层运算认出器件，比如多晶硅压在 p 型有源区上、又在 n 阱里，就是一个 PMOS；还要量出尺寸：W 是栅沿多晶硅方向的长度，L 是多晶硅线条本身的宽度（电流从源到漏要穿过的那段）。
      - item:
          id: extract-wl
          type: number
          prompt: 版图上一条多晶硅横跨有源区，重叠部分（栅）沿多晶硅方向长 1.2 μm、垂直多晶硅方向宽 0.15 μm。提取出的晶体管 W/L 是多少？
          answer: 8
          tolerance: 0.001
          hint: 沿多晶硅方向的那一边是 W 还是 L？
          explain: 栅长 L 是电流从源到漏要穿过的那段，即多晶硅的宽 0.15 μm；W 是沿多晶硅方向的 1.2 μm。$W/L = 1.2/0.15 = 8$。
      - card:
          title: 连接关系和器件类别
          body: |
            连接关系由“哪些图层在哪里相连”决定：金属 1 经接触孔连到有源区和多晶硅，经通孔连到金属 2……规则文件把这些写成一条条 `connect(层1, 层2)`；版图上的文字标签给线网起名字。

            提取出的器件分成器件类别：四端的 MOS 管（源、栅、漏、衬底）、电阻、电容、二极管、双极晶体管。比较时，类别要对得上，主要的尺寸（MOS 的 W、L，电阻的阻值）要在容差内。
      - item:
          id: wrong-connect
          type: choice
          prompt: 规则文件里漏写了 `connect(metal1, via1)` 和 `connect(via1, metal2)`。LVS 会看到什么？
          options:
            - text: 两层金属之间都断开，大量失配
              correct: true
            - text: 没影响，通孔在版图上本来就连着两层
              why: 工具只按规则文件知道哪些层导电相连；没写这两条，它不知道通孔把上下两层接通
            - text: 只是报 DRC 违例
              why: 这是 LVS 的连接定义出错，不是几何规则；表现为提取出的网表和原理图对不上
          explain: 版图网表完全由规则文件里的图层运算和连接关系决定。规则文件写错，提取结果就错，比对会报出大量假的失配，所以规则文件本身也要验证。
      - card:
          title: 网表比较
          body: |
            两个网表的线网名字常常不一样，比较主要看拓扑：从容易确定的线网（电源、地、有名字的端口）开始，看它周围连着什么器件，把周围结构唯一相同的器件和线网配成对；配好的又帮着确定它们的邻居。遇到左右一模一样、无法区分的结构（比如时钟树），就先试一种配对，不行再回退。

            比较前要做网表微调：把并联的同尺寸 MOS 管合并（版图常把一个宽管子画成几根“手指”），串联的电阻合并，去掉没有器件的悬空线网。
      - item:
          id: merge-parallel
          type: number
          prompt: 版图上一个 NMOS 画成 4 根并联的手指，每根 W = 0.5 μm、L 相同，源、栅、漏都分别接在一起。原理图里是一个管子。合并后 W 是多少微米？
          answer: 2
          tolerance: 0.001
          unit: μm
          hint: 并联的管子电流相加，相当于宽度怎样？
          explain: 并联的同 L 管子等效成一个 W 相加的管子：$4\times0.5 = 2$ μm。不合并的话，版图有 4 个器件、原理图有 1 个，会报失配。
      - card:
          title: KLayout 的 LVS 脚本
          body: |
            KLayout 的 LVS 脚本依次做这些事：读入图层，用布尔运算得到栅、源漏等派生层；`extract_devices(mos4("PMOS"), {...})` 提取器件；`connect(...)` 定义连接；`schematic("inv.cir")` 读入原理图网表；`netlist.simplify` 做合并、清理等微调；最后 `compare` 比较并给出报告，列出配对成功的、没配上的和尺寸不符的器件和线网。
      - item:
          id: lvs-order
          type: order
          prompt: 把一次 LVS 的步骤按先后排好。
          steps:
            - 读入版图图层，用布尔运算得到派生层
            - 提取器件
            - 按连接规则把图层连成线网
            - 读入原理图网表，两边都做合并等微调
            - 比较两个网表，输出报告
          explain: 先有图层才能认器件，认出器件、连好线网才有版图网表；原理图网表读入后两边都做微调，最后比较。
      - item:
          id: lvs-vs-drc
          type: choice
          prompt: 一个反相器的版图里，PMOS 的漏和 NMOS 的漏本该连在一起作为输出，却漏画了连接它们的那段金属。每个图形都满足宽度和间距规则。哪项检查能发现？
          options:
            - text: LVS，提取出的网表里输出被分成两个线网，和原理图对不上
              correct: true
            - text: DRC，少了一段金属属于几何违例
              why: 少画的地方没有图形，DRC 只检查存在的图形是否满足规则，空着的地方不会报错
            - text: 两者都发现不了，只能靠仿真
              why: LVS 就是为这种连接错误设计的：版图网表少了一个连接，和原理图比较时立刻失配
          explain: DRC 和 LVS 互补：DRC 管几何上能否制造，LVS 管连接上是否和设计一致。
boss:
  items:
    - id: b-prime-implicants
      type: number
      prompt: $F(a, b, c) = \sum m(1, 3, 4, 5, 6)$（最小项按 a、b、c 的顺序编号，a 是最高位）。它一共有几个质蕴涵项？
      answer: 4
      hint: 先把相邻（只差一位）的最小项两两合并，再看哪些合并结果不能再变大。
      explain: 001 和 011 合成 $\overline a c$，001 和 101 合成 $\overline b c$，100 和 101 合成 $a\overline b$，100 和 110 合成 $a\overline c$；它们都不能再和别的合并，共 4 个。最简式要 3 个乘积项，有两种选法（$\overline a c + a\overline b + a\overline c$ 或 $\overline a c + \overline b c + a\overline c$），所以最简式不唯一。
    - id: b-tech-map
      type: number
      prompt: 主题图 $\text{INV}(\text{NAND2}(\text{INV}(\text{NAND2}(a, b)), c))$，即 $abc$。单元库：INV 代价 2，NAND2 代价 3，AND2（模式 $\text{INV}(\text{NAND2}(*, *))$）代价 4，NAND3（模式 $\text{NAND2}(\text{INV}(\text{NAND2}(*, *)), *)$）代价 5。用树上的动态规划求最小总代价。
      answer: 7
      hint: 先求 $\text{INV}(\text{NAND2}(a, b))$ 和中间那个 NAND2 节点各自的最小代价，再看根节点能套用哪些模式。
      explain: $\text{INV}(\text{NAND2}(a, b))$ 最好用 AND2，代价 4。中间节点：用 NAND2 是 $3 + 4 = 7$，用 NAND3 是 5，取 5。根节点：用 INV 是 $2 + 5 = 7$，用 AND2 盖住根和中间节点是 $4 + 4 = 8$。最小 7（一个 NAND3 后接一个 INV）。
    - id: b-kl-gain
      type: number
      prompt: 图有 6 个顶点、8 条边：(1,2)(1,4)(2,4)(2,3)(3,5)(3,6)(5,6)(4,5)。划分 A = {1, 2, 3}，B = {4, 5, 6}。按 Kernighan–Lin，交换顶点 3 和 4 的增益是多少？
      answer: 2
      hint: 顶点 3 和 4 各自的外部边数减内部边数是多少？它们之间有边吗？
      explain: 原来的割是 (1,4)(2,4)(3,5)(3,6)，共 4。$D_3 = 2 - 1 = 1$（外部 (3,5)(3,6)，内部 (2,3)），$D_4 = 2 - 1 = 1$（外部 (1,4)(2,4)，内部 (4,5)），3 和 4 之间没有边，增益 $1 + 1 - 0 = 2$。交换后割是 (2,3)(4,5)，共 2，正好少了 2。
    - id: b-hpwl
      type: number
      prompt: 一个线网连接 (1, 1)、(4, 2)、(2, 5) 三个引脚。它的半周长线长是多少？
      answer: 7
      hint: 横坐标和纵坐标各自的最大值减最小值是多少？
      explain: 横向 $4 - 1 = 3$，纵向 $5 - 1 = 4$，HPWL = 7。三个引脚时它也等于直角斯坦纳最小树的长度。
    - id: b-quadratic
      type: number
      prompt: 二次布局（让各连线长度的平方和最小），一维。单元 1 连固定引脚 $x = 0$ 和单元 2；单元 2 还连固定引脚 $x = 10$ 和 $x = 4$；所有连线权重都是 1。单元 1 的横坐标是多少？
      answer: 2.8
      tolerance: 0.001
      hint: 代价有哪四项？对两个坐标分别求导等于零能得到哪两个方程？
      explain: 代价是 $x_1^2 + (x_2 - x_1)^2 + (x_2 - 10)^2 + (x_2 - 4)^2$。对 $x_1$：$2x_1 - 2(x_2 - x_1) = 0$，得 $x_2 = 2x_1$。对 $x_2$：$(x_2 - x_1) + (x_2 - 10) + (x_2 - 4) = 0$，得 $3x_2 - x_1 = 14$。代入得 $5x_1 = 14$，$x_1 = 2.8$，$x_2 = 5.6$。
    - id: b-lee
      type: number
      prompt: 4 行 5 列的网格，从上到下各行是 `S . # . T`、`. . # . #`、`# . # . .`、`. . . . .`（# 是障碍，每步上下左右走一格）。用迷宫布线从 S（左上角）到 T（右上角）最短要几步？
      answer: 10
      hint: 第三列的障碍从第几行到第几行？从哪一行才能横穿过去？
      explain: 第三列前三行都是障碍，只能从最下面一行绕过去：S 往右 1 步、沿第二列往下 3 步到底行，往右 2 步到第四列，沿第四列往上 3 步回到第一行，再往右 1 步到 T，共 10 步。曼哈顿距离只有 4。
    - id: b-zero-skew
      type: number
      prompt: 两棵零偏斜子树的延迟是 $t_1 = 1$、$t_2 = 4$（按线长算），两根部之间的连线长 $L = 11$。按 $t_1 + x = t_2 + (L - x)$ 找零偏斜接点，它离子树 1 的距离 $x$ 是多少？
      answer: 7
      tolerance: 0.001
      hint: 接点该离快的那棵子树更远还是更近？两侧的延迟怎样相等？
      explain: $1 + x = 4 + 11 - x$，$2x = 14$，$x = 7$。两侧延迟都是 8。子树 1 快，接点离它远，用线长给它补上延迟。
    - id: b-sta-slack
      type: number
      prompt: 输入 a 在 0 ns、b 在 0.5 ns 到达。g1 = f(a, b) 延迟 1 ns，g2 = f(g1, b) 延迟 2 ns，g3 = f(a) 延迟 1.5 ns，out = f(g2, g3) 延迟 1 ns，out 接到终点触发器。时钟周期 5 ns，建立时间 0.3 ns。松弛量是多少纳秒？
      answer: 0.2
      tolerance: 0.001
      unit: ns
      hint: 按拓扑次序算出 out 的到达时间，再和要求到达时间比。
      explain: $AT(g1) = \max(0, 0.5) + 1 = 1.5$，$AT(g2) = \max(1.5, 0.5) + 2 = 3.5$，$AT(g3) = 1.5$，$AT(out) = \max(3.5, 1.5) + 1 = 4.5$。要求到达时间 $5 - 0.3 = 4.7$，松弛量 0.2 ns。
    - id: b-critical-path
      type: choice
      prompt: 输入 a 在 0 ns、b 在 0.5 ns 到达。g1 = f(a, b) 延迟 1 ns，g2 = f(g1, b) 延迟 2 ns，g3 = f(a) 延迟 1.5 ns，out = f(g2, g3) 延迟 1 ns。关键路径是哪条？
      options:
        - text: b → g1 → g2 → out
          correct: true
        - text: a → g1 → g2 → out
          why: a 在 0 ns 到达，比 b 早 0.5 ns，g1 的到达时间由较晚的 b 决定；从 a 出发这条路径的松弛量多 0.5 ns
        - text: a → g3 → out
          why: 这条路径到 out 只要 $1.5 + 1 = 2.5$ ns，松弛量很大；out 的到达时间由 g2 那一支决定
        - text: b → g2 → out
          why: g2 的两个输入里，g1 在 1.5 ns 到达，比直接进来的 b（0.5 ns）晚，所以 g2 的到达时间由经过 g1 的那一支决定
      explain: 关键路径是松弛量最小的那条：从最晚到达的 b 出发，每个门都取较晚的那个输入，b → g1 → g2 → out 到达 4.5 ns。
    - id: b-newton
      type: number
      prompt: 5 V 电源经 1 kΩ 电阻接二极管，$I = I_S(e^{v/V_T} - 1)$，$I_S = 10^{-14}$ A，$V_T = 25$ mV。节点方程 $f(v) = (5 - v)/1000 - I_S(e^{v/V_T} - 1) = 0$。从 $v_0 = 0.7$ V 用牛顿–拉夫逊法迭代一步，$v_1$ 是多少伏？保留四位小数。
      answer: 0.6825
      tolerance: 0.0005
      unit: V
      hint: $e^{28}$ 约是多少？$f(0.7)$ 和 $f'(0.7)$ 各是多少？
      explain: $I_S e^{28} \approx 0.01446$ A，$f(0.7) \approx 0.0043 - 0.01446 = -0.01016$；$f'(0.7) = -0.001 - (I_S/V_T)e^{28} \approx -0.5795$。$v_1 = 0.7 - 0.01016/0.5795 \approx 0.6825$ V。继续迭代收敛到约 0.670 V，电流约 4.33 mA。
    - id: b-drc-lvs
      type: choice
      prompt: 一个版图通过了 DRC，却没通过 LVS。最可能是哪种问题？
      options:
        - text: 某处连接错了或少了
          correct: true
        - text: 某两条金属线的间距比规则要求的小
          why: 间距不够是几何规则问题，DRC 就会报；这个版图已经通过了 DRC
        - text: 某个通孔的金属包围不够
          why: 包围余量也是 DRC 检查的几何规则，通过 DRC 说明没有这类问题
        - text: 版图和原理图里线网的名字不一样
          why: LVS 主要按连接的拓扑配对，名字不同不影响比较；名字只用来消除对称结构的歧义
      explain: DRC 只查几何规则，LVS 查版图提取出的网表和原理图是否一致。几何上合规、连接上出错，正是“过了 DRC、没过 LVS”的典型情况。
    - id: b-merge-fingers
      type: number
      prompt: 原理图里有一个 W = 3 μm 的 PMOS。版图把它画成若干根并联的手指，每根 W = 0.75 μm、L 和原理图相同。LVS 合并并联器件后要和原理图对上，版图应该有几根手指？
      answer: 4
      hint: 并联合并后 W 怎样变化？
      explain: 并联的同 L 管子合并后 W 相加，$3/0.75 = 4$ 根。少画一根，合并后 W = 2.25 μm，LVS 会报尺寸不符。
