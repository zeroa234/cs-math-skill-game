skill: H.3.1
version: 2
authors: [main-agent]
brief:
  why: |
    在没有操作系统撑腰、内存只有几千字节的微控制器（MCU）上，一行 C 代码直接拨动芯片引脚电压、定时敲击节拍并接住外部按键与传感器变化。从芯片上电复位自启动、用 volatile 指针按位操作 GPIO、软硬件消抖、示波器观测与 Flash/RAM 预算、UART 与 ADC/DAC 外设，一直到定时器分频计数与 NVIC 中断临界区保护，带你亲手写通真正能跑的裸机固件。
  outcomes:
    - 理解微控制器无 OS 裸机启动顺序、地址空间分配及资源限制下的静态 RAM/Flash/功耗预算
    - 掌握内存映射 I/O（MMIO）与 volatile 指针读写 GPIO 寄存器（按位掩码保留无关引脚），设计机械按键定时软件消抖状态机
    - 掌握 UART 异步帧（起始/数据/停止位）有效字节率及同步串口对比，掌握 ADC/DAC 量程与步进换算及步进电机查表状态机
    - 掌握定时器预分频、周期计数与比较匹配重装值计算，会计算 PWM 占空比与输入捕获脉宽时间
    - 遵循中断服务程序（ISR）快进快出准则，并用 volatile 与关中断/原子临界区保护主循环与中断间共享变量
terms:
  - term: 微控制器
    def: '简称 MCU，把处理器核心、闪存（Flash）、随机内存（RAM）及定时器、串口、GPIO 等外设全部封装在一颗小芯片里的微型计算机'
  - term: 裸机
    def: '直接在微控制器硬件上运行固件、中间没有 Linux 等操作系统内核替你调度进程与分配内存的运行形态'
  - term: 二进制
    def: '仅用 0 和 1 两位基本符号编码数值、硬件开关位与机器指令的记数体系'
  - term: 内存映射 I/O
    def: '英文 MMIO，硬件把外部引脚与串口控制开关编进普通内存地址号段里，C 代码读写那个特定地址就等价于直接拧动物理外设硬件开关'
  - term: GPIO
    def: 'General-Purpose Input/Output，通用输入输出引脚，由方向寄存器决定充当对外输出高/低电压还是对外读取开关电平'
  - term: 上拉电阻
    def: '接在输入引脚与正供电端之间的弱阻值电阻，在外部按键松开悬空时把引脚电位稳稳拉定到已知高电平 1'
  - term: 消抖
    def: '消除机械按键金属触点在按下或松开瞬间弹跳产生的一连串假脉冲，仅在连续多次采样保持稳定新态后才确认一次真实拨动'
  - term: UART
    def: '通用异步收发器，仅凭 TX/RX 两根信号线按事先约定的统一波特率和起止位帧格式逐位串行传收数据'
  - term: ADC
    def: '模数转换器，按采样精度将外部连续变化的电压切分编码成微控制器可直接运算的数字整数'
  - term: DAC
    def: '数模转换器，把微控制器算出的离散整数按基准电压步长输出回连续模拟电平'
  - term: DMA
    def: '直接内存访问控制器，能在不惊动 CPU 核心逐字搬运的前提下自动在内存与外设之间批量搬运数据以省电提速'
  - term: 有限状态机
    def: '把控制器分成有限个明确历史状态，按当前状态与外部输入事件查询转移表确定动作与下一步去向的建模写法'
  - term: 预分频
    def: '位于高速主时钟和定时器计数器之间的整除降频器，按设定分频系数放慢计数脚步以撑出更长定时窗口'
  - term: 输出比较
    def: '定时器内置硬件比较器，在自由计数值恰好追平预先写入的比较阈值那一拍自动翻转输出电平或触发定时事件'
  - term: 脉宽调制
    def: '简称 PWM，在固定周期的高速脉冲里调节高电平所占比例（占空比），等效调节给电机或 LED 的平均电压能量'
  - term: 输入捕获
    def: '在外部引脚遇到上升或下降跳变边沿的一瞬间，硬件自动把当前正在跑的定时器计数值瞬间冻存锁进捕获寄存器以便精确测脉宽'
  - term: 中断
    def: '外部事件或内部定时器一满足条件就立刻由硬件发信号喊停当前主流程、转而先紧急响应处理的异步事件机制'
  - term: 中断服务程序
    def: '简称 ISR，硬件响起对应中断请求后自动跳转执行的那段精简响应函数，要求短小不阻塞、清标志并快速返回'
  - term: 原子操作
    def: '在微控制器指令或临界保护级别下“不可被中断切到一半打断”的完整读–改–写操作，防止多处同时改动共享状态互相覆盖'

lessons:
  # ==== 裸机程序 ====
  - id: bare-metal
    chapter: 裸机程序
    title: 复位启动、二进制与地址空间映射及裸机 C 程序组织
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            把编译好的 C 固件烧进一颗全新的 **STM32 / ARM Cortex-M 微控制器**，刚一通上 `3.3 V` 电池电源，没有电脑里的操作系统帮你点“双击启动”，这颗光秃秃的芯片第一微秒是怎么找到你的 `main()` 函数开始跑的？
          options:
            - text: 上电后从固定复位入口表读出初始栈顶指针与复位地址，再跳进 `main()`
              correct: true
            - text: 芯片上电后靠蓝牙联网下载一个 Windows 再运行
              why: 微控制器没有联网下载、安装操作系统这回事：程序靠片内固化的只读闪存（Flash），复位入口表也写死在固定位置，上电即刻自启动。
            - text: 它随机从内存任意一行蒙着闭眼跳进去碰运气
              why: 复位入口严格写死在固定起始位置，保证每一次通电都从完全确定起点初始化并交接给 C 运行入口
          explain: |
            没有操作系统的世界里，从硬件复位那微秒到永不返回的 `for (;;) {}` 死循环，全归你亲手掌控——这就是 **微控制器 裸机 启动**。
      - card:
          title: '微控制器、裸机与统一寻址空间'
          body: |
            - **微控制器**（MCU）：把 CPU 核（含通用寄存器与指令指针）、只读 **Flash 闪存**（存指令代码与常量）、高速 **RAM 内存**（存运行时变量与函数调用栈）和定时器/引脚电路合封进一颗芯片；
            - **裸机**：程序不经操作系统独自接管芯片直接运行，末尾几乎总是一个永不退出主循环；
            - **二进制** 与十六进制：计算机底层全由 `0/1` 位元编码，C 嵌入式里常用 `0x40020000` 十六进制精准指代 32 位寄存器；
            - **内存映射 I/O**：整个 32 位统一编号范围划出一块号段专门分给外设控制开关（不再仅仅分给存储格子）。
          reveal:
            - title: 上电复位后进入 C 语言 `main()` 之前启动代码做了什么？
              body: |
                1. 从起始硬件入口表读出 **初始栈顶指针 `MSP`** 和 **复位入口地址**；
                2. 配好系统基本主时钟；
                3. 把已赋初始值的全局变量（`.data` 段）从只读 **Flash** 复制一份搬进可改写的 **RAM**，并把未初始化全局区（`.bss` 段）统一清成 `0`；
                4. 这才真正调用用户写的 `main()` 函数，用清晰的分支、循环与模块化函数接口持续轮询或响应外设事件，接管整颗芯片硬件。
            - title: 为什么嵌入式工程师天天数十六进制 `0x` 和 `1u << k`？
              body: |
                因为每位十六进制刚好对应整整 `4` 位 **二进制**，写一个 `0x20` 能直接看出第 `5` 比特为 `1`（`0010_0000`），而写十进制 `32` 或一长串 32 个 `0/1` 容易数错脚位。配合 C 语言无符号常量 `1u << n` 左移掩码，代码既清晰又绝不会在符号位上移出未定义错误。
      - item:
          id: reset-boot-order
          type: order
          prompt: |
            把微控制器在**裸机**上电复位后，从通电那一刻直到进入 C 代码正式干活的启动顺序按先后排好：
          steps:
            - 硬件从固定复位入口表取出初始栈指针与起跑入口地址并设好基本时钟
            - 把带初值的全局数据（`.data`）从 Flash 拷入 RAM 并将 `.bss` 段清零
            - 跳转进入用户编写的 `main()` 并驻留主循环持续运行
          explain: |
            如果忘做 `.data` 拷贝或 `.bss` 清零，C 代码里写的 `int count = 0;` 上电全会变成乱七八糟的随机垃圾。
      - item:
          id: baremetal-ram-vs-flash
          type: choice
          prompt: |
            你写好了一套嵌入式固件，里面定义了一张永远不修改的 `10 KB` 字符点阵字库表 `const uint8_t font[]`，以及一块运行时不停刷新改写的传感器缓冲区 `int16_t buf[256]`。在有限的微控制器片内资源中，它们各自理应存放在哪里？
          options:
            - text: 只读的 `const` 字库与程序代码放在 Flash；频繁改写的缓冲与函数栈放在 RAM
              correct: true
            - text: 全部塞进断电立刻蒸发丢失的 RAM，把 Flash 完全空着当摆设
              why: RAM 掉电即失而且容量很小（通常只有几 KB），只读固件与 `const` 查找表放进 Flash 才能既省 RAM 又在下次通电照样启动
            - text: 把随时需要高速改写的新数据直接往每毫秒擦写就损毁的 Flash 里写，觉得 Flash 容量大更合适
              why: Flash 按扇区擦写慢且寿命有限，实时暂存变量与堆栈一律工作在高速 RAM 中
          explain: |
            嵌入式开发里 `const` 关键字很关键：没加 `const` 的大表会被启动代码搬进 RAM 占用双份空间，加上 `const` 就留在 Flash 里按地址只读。
      - item:
          id: baremetal-loop-why
          type: choice
          prompt: |
            在电脑上写 C 程序 `main()` 到末尾通常会 `return 0;` 退出交给操作系统接管；为什么在**裸机**固件里几乎总要在 `main()` 最后加上一条永远不退出的死循环 `for (;;) { ... }` 或 `while (1) { ... }`？
          options:
            - text: 裸机没有操作系统兜底，`main()` 返回后 CPU 会把后面的空白内存当指令执行而跑飞
              correct: true
            - text: 编译器要求 `main()` 以死循环结束，写 `return` 会报错
              why: 编译器不会因为 `main()` 里写了 `return` 就报错；没有操作系统接住返回值、CPU 继续往下执行才是不退出循环的原因
            - text: 为了故意让芯片过热瞬间烧掉
              why: 配合休眠待命与硬件事件唤醒，永不退出循环可在没活时沉睡省电、有事时醒来干活
          explain: |
            桌面软件“算完即退”，嵌入式固件“上电常驻”——这是两者最根本的运行模型分水岭。
      - card:
          title: CPU 核心寄存器、调用栈与统一编号空间
          body: |
            单片机 CPU 核心里藏着高速通用寄存器、记录下一条指令位置的**程序计数器（`PC`）**以及管理函数调用嵌套的**栈指针（`SP`）**。
            从 `0x00000000` 起整片 `4 GB` 统一编号区间通常被芯片厂划成三大块：**代码只读闪存区（Flash）**、**读写数据内存区（SRAM）**，以及最上面一段专门插接外设控制开关的 **外设寄存器区（MMIO）**。
      - item:
          id: baremetal-terms-match
          type: match
          prompt: |
            把微控制器启动与芯片存储分段相关的基础要素对号入座。
          pairs:
            - ["**微控制器**（MCU）", "把 CPU 核、Flash、RAM 与各类定时器/串口外设集成在一颗芯片内"]
            - ["**裸机**（Bare-Metal）", "没有操作系统接管，固件直奔统一地址号段操纵底层硬件"]
            - ["**内存映射 I/O**（MMIO）", "外设开关寄存器占用统一地址号段，读写特定地址即操作物理硬件"]
            - ["`.data` 与 `.bss` 初始化", "进入 main 前把全局变量初值搬入 RAM 并把未赋值变量统一归零"]
          explain: |
            摸清“CPU 看什么都是地址，一部分地址归存储、另一部分地址连外设”，操作外设就只是普通的地址读写。

  # ==== GPIO ====
  - id: gpio
    chapter: GPIO
    title: GPIO 引脚、方向与输出寄存器位掩码操作及 volatile C 实战
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一个 32 位的硬件控制寄存器 `GPIO_OUT` 控制着同一排整整 `32` 根物理引脚电平：已知目前第 `1` 脚正在亮着绿灯（即寄存器目前值第 1 位为 1，其余全 0，数值等于 `2`）。现在你的 C 代码想顺手把**第 `5` 脚**接的红灯也拉高点亮，**同时绝不把正在亮的绿灯（第 1 脚）弄灭**。下面哪种 C 语言写法正确？
          options:
            - text: 用按位或赋值：`GPIO_OUT |= (1u << 5);`，只把第 5 位置 1
              correct: true
            - text: 直接赋值 `GPIO_OUT = (1u << 5);`，以为别的位不变
              why: 直接等号覆盖会把第 5 位以外的 31 根引脚全部清零，没写到的位不会保持原值，正在亮的绿灯（第 1 脚）也会随之熄灭。
            - text: 直接加个 1 变成 `GPIO_OUT += 1;`
              why: 加 1 改动的是最低第 0 脚（还会产生二进制进位乱串位），不是精准操控独立第 5 脚
          explain: |
            `|=` 先读出原值，只把第 5 位置 1 再写回，第 1 位保持不动，结果是 `2 | 32 = 34`。这一课学 **GPIO 寄存器位操作**（保留无关位），以及指向寄存器的指针为什么要加 **`volatile`**。
      - card:
          title: '**GPIO** 方向寄存器、按位“读–改–写”与 `volatile` C 实操'
          body: |
            芯片每个外设端口提供多种功能，通用数字引脚叫 **GPIO**（General-Purpose Input/Output）：
            - **先设方向再输出**：芯片复位后引脚往往默认为高阻安全输入态，必须先在**方向寄存器（`GPIO_DIR`）**把对应位设为 `1`（输出），再去**输出数据寄存器（`GPIO_OUT`）**写 `1` 才会真正点亮 LED（常见接法还有串联限流电阻保护二极管）；
            - **读–改–写保无关位**：置位用 `reg |= (1u << n)`；清零某位而不伤及邻居用 `reg &= ~(1u << n)`；翻转用 `reg ^= (1u << n)`。
          reveal:
            - title: 标准 C 代码与 `volatile` 的坑（WSL `gcc` 编译实测）
              body: |
                ```c
                #define GPIO_DIR (*(volatile uint32_t *)0x40020000u)
                #define GPIO_OUT (*(volatile uint32_t *)0x40020004u)
                int main(void) {
                    GPIO_DIR |= (1u << 5); /* 第 5 脚设为输出，不动其余 31 位 */
                    GPIO_OUT |= (1u << 5); /* 第 5 脚输出高电平点亮 LED */
                    for (;;) { }
                }
                ```
                **为什么必须加 `volatile`？**：① 硬件寄存器里的值随时可能被外部引脚电压或硬件状态位暗中修改；② 往硬件寄存器写数据本身就是实打实的物理动作（点亮灯/翻转电机使能），如果漏写 `volatile`，优化编译器会以为“这只是块没人读的普通内存变量”，从而把连续读写优化掉、合并或重排顺序。
            - title: 推挽输出（Push-Pull）vs 开漏输出（Open-Drain）与 LED 接法选择
              body: |
                推挽输出能主动把引脚打高到 `VDD` 也能猛拉低到 `0 V`，适合直接推动 LED 和数字控制线；开漏输出只能往下接地，高电平必须依靠外部上拉电阻拉起来（防止多根控制线互撞短路，适合总线上拉共享）。接 LED 时记得计算限流电阻：$R = (V_{IO} - V_{LED}) / I_{LED}$，把单脚电流守在 `5~10 mA` 安全区以内。
            - title: 为什么片厂总把“置 1 / 清 0 寄存器（BSRR）”单独另配一份？
              body: |
                在普通 `GPIO_OUT` 上写 `GPIO_OUT |= (1u << 5);` 其实暗藏一步“先读、再或、再写回”三步动作，要是在这两步中间正好撞上另一个事件同时修改第 `3` 脚，后写回就会把第 `3` 脚误覆盖。于是许多现代微控制器干脆另配一只只写原子置位/复位寄存器（`BSRR`）：往低 16 位写入 `(1u << 5)` 只置第 5 脚而硬件保证绝不触碰任何其他引脚，省掉加锁之苦。
      - item:
          id: gpio-bit5-mask-value
          type: number
          prompt: |
            在 32 位 **GPIO** 寄存器中，已知原本第 `1` 位已被别的任务设为 `1`（所以寄存器原先十进制值为 `2`）。执行读–改–写操作 `GPIO_OUT |= (1u << 5);` 点亮第 5 脚（从 0 开始编号）后，新寄存器的十进制数值变成多少？
          answer: 34
          hint: '分别算出把第 5 位（$2^5$）置 1 对应的掩码数值，再与原本留在那里的第 1 位数值按位或合并。'
          explain: |
            `1u << 5` 等于 $2^5 = 32$；原先值 `2` 与 `32` 按位或 `2 | 32 = 34`（若原先开了第 2 脚 `4` 则变 `36`、开了第 3 脚 `8` 则变 `40`，其余引脚保持不变）。
      - item:
          id: volatile-register-c4
          type: choice
          prompt: |
            用 C 语言通过指针直接访问内存映射硬件寄存器 `#define GPIO_OUT (*(volatile uint32_t *)0x40020004u)` 时，为什么指针指向的类型**必须加上 `volatile` 关键字**？
          options:
            - text: 寄存器值可能被外部硬件随时改变，读写本身有物理副作用；要禁止编译器合并、删减或重排这些访问顺序
              correct: true
            - text: 加了 `volatile` 能让 CPU 主频翻倍，程序跑得更快
              why: '`volatile` 只约束编译器生成代码时的内存访存语义，不改变硬件时钟主频'
            - text: 如果不写 `volatile` 编译器永远不认识十六进制数字 `0x40020004`
              why: 没写 `volatile` 照样能编译过。最危险的正是能编译过却在开启 `-O2` 优化后被编译器悄悄删掉关键硬件循环检查或写入。
          explain: |
            开 `-O0` 调试模式看着好好的，一开 `-O2` 发布版本电机转不动、按键死循环——九成都是忘了在硬件寄存器或标志上加 `volatile`。
      - item:
          id: gpio-clear-bit5
          type: choice
          prompt: |
            刚刚通过 `GPIO_OUT |= (1u << 5)` 点亮了第 5 脚的 LED。现在想单独把**第 5 脚熄灭成 `0`**，同时依然绝不能改变第 0~4 脚和第 6~31 脚的现有高低状态。正确的 C 语句是？
          options:
            - text: '`GPIO_OUT &= ~(1u << 5);`'
              correct: true
            - text: '`GPIO_OUT &= (1u << 5);`'
              why: 少了取反 `~`：和 `1u << 5` 按位与，会把第 5 位以外的 31 根引脚全部清零，第 5 位反而保持 1。
            - text: '`GPIO_OUT |= (1u << 5);`'
              why: 按位或 `|` 只能把对应位强行置 1，永远清不成 0
          explain: |
            口诀：**置 `1` 用按位或 `|= mask`，清 `0` 用按位与反码 `&= ~mask`，翻转用异或 `^= mask`**。
      - item:
          id: led-resistor-why
          type: choice
          prompt: |
            在面包板上从 MCU 的 **GPIO** 引脚连接一只普通发光二极管（LED）到地时，为什么总要在电路上串进一只 `220 Ω ~ 1 kΩ` 左右的保护限流电阻？
          options:
            - text: LED 导通后压降约 1.8~2.2 V 且近似短路，串联限流电阻限制电流以免烧毁芯片引脚与 LED
              correct: true
            - text: LED 导通压降高达 12 V，串电阻能把 3.3 V 升到 12 V
              why: 无源电阻只能分压限流而不能升压；串联电阻是为了吃掉 `3.3 V - V_LED` 的剩余压降，把电流限制在芯片引脚安全毫安范围内
            - text: 因为如果不串电阻，GPIO 引脚只能输出低电平 `0` 而无法输出高电平 `1`
              why: 没限流电阻直接直连 GPIO 引脚，极大电流轻则拉垮电源电平、重则永久烧坏 IO 驱动管与 LED。
          explain: |
            面包板搭原型第一条安全线：查 LED 导通压降、算 $(V_{DD} - V_{LED}) / R$ 控制在安全毫安范围以内。

  - id: buttons
    chapter: GPIO
    title: 上拉/下拉确定默认电平、机械按键弹跳与软件消抖状态机
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            把一只机械小按键一端接地 `0 V`，另一端直接插在芯片的一个 **GPIO 输入脚**上（中间没加其他任何元件）。当你松开手指没按下去时，输入引脚像一根悬空天线一样飘在半空。此时程序读取该引脚读出来的一定稳稳等于高电平 `1` 吗？
          options:
            - text: 不一定。悬空引脚易受电磁感应影响，可能随机跳成 `0` 或 `1`；要加上拉电阻稳住电平
              correct: true
            - text: 一定。开关断开时，悬空引脚天然稳定在高电平 `1`
              why: 高阻态输入引脚如同悬浮天线，没有上拉或下拉电阻牵引就会在 0 和 1 之间随杂散电容与电磁噪声飘移乱触发。
            - text: 一定稳稳等于低电平 `0`，所以按键另一端接地的电路永远无法分辨按下和松开
              why: 悬空引脚既不稳在 `0` 也不稳在 `1`，而是随机浮动；加上拉电阻后松开稳为 `1`、按下接地稳为 `0`
          explain: |
            按键接口双保险：**电气层靠上拉/下拉定住默态，软件层靠周期采样消抖过滤机械弹跳**。
      - card:
          title: '**上拉电阻**与低电平有效按键接法'
          body: |
            为了让按键“松开”和“按下”永远对应两个斩钉截铁的干净电压：
            - **上拉电阻（Pull-up）**：在引脚与正电源 `VCC` 之间接一只 `10 kΩ`（或芯片内部启用内置弱上拉），按键另一头接地 `GND`：
              - **松开时**：开关断开，微弱电流把引脚轻柔却稳稳顶在 **`1`（高电平）**；
              - **按下时**：开关闭合直接把引脚拉死到地面 **`0`（低电平）**（电阻限制了电源直通地面的极小电流不短路）。
            - （对偶有接下拉电阻到地、按键接 `VCC` 按下变 `1` 的“高有效接法”，原理一致）。
      - card:
          title: 机械触点弹跳成因与软件定时消抖写法
          body: |
            金属弹片物理撞击闭合或断开瞬间会在几毫秒内反复微弹震动十几次，直接读取就会把“按一下”当成“连按八下”。必须做软硬件 **消抖**：
            设周期滴答（如每 `1 ms`）采样一次引脚，仅当连续 $N$ 次（如 20 次或教学简化 3 次）稳稳读到新电平才正式更新状态（下段核心函数已在 `gcc` 实测通过）：
            ```c
            static uint8_t stable = 1, cnt = 0;
            void every_1ms(uint8_t raw) {
                if (raw != stable) {
                    if (++cnt >= 20) { stable = raw; cnt = 0; }
                } else { cnt = 0; }
            }
            ```
          reveal:
            - title: 手推一遍每 1 ms 采到抖动序列 `0, 0, 1, 0, 0, 0` 时内部计数器怎么工作？
              body: |
                原本稳定为松开态 `stable = 1`、`cnt = 0`（约定连续 3 次翻转）。第 1 拍采到 `0` 不等于 `1`，计数器加到 `cnt = 1`；第 2 拍再采到 `0`，`cnt = 2`；第 3 拍机械弹片刚好反弹抖成旧态 `1`，瞬间命中 `else` 分支把 `cnt` 一把清零（前功尽弃重新盯防）；随后第 4、5、6 拍连续三次扎扎实实采到 `0`，`cnt` 爬到 `3` 终于稳妥放行 `stable = 0`。
            - title: 硬件 RC 消抖 vs 周期采样软件消抖，实际项目怎么选？
              body: |
                如果电路板面积宽裕、或者按下去直连唤醒芯片的外部边沿引脚，加一只串联小电阻与对地电容构成简单 RC 慢爬滤掉几毫秒高频弹跳能直接挡住杂脉冲；如果手上有几十个按键矩阵扫描，省掉几十颗电容靠一块每 `1 ms` 响一次的定时器统一轮流扫计数状态机则最省硬件物料成本。
            - title: 高电平有效接法（按下变 `1`、松手变 `0`）该配“下拉电阻”怎么接？
              body: |
                若把按键一端直接连上电源正极 `VDD`，另一端送进单片机引脚并从引脚另引出一只 `10 kΩ` **下拉电阻**接地 `GND`：平时松手通过电阻稳稳保持低电平 `0`，一旦手指按下开关就把引脚猛拉高成 `1`——和上拉刚好镜像对偶，只要不让引脚悬空就行。
      - item:
          id: debounce-trace-6th
          type: number
          prompt: |
            按键软件定时**消抖**测试：按键原本稳定松开（`stable = 1`），约定每隔 `1 ms` 采样一次且必须连续 `3` 次稳读到同一个新电平（`threshold = 3`，中途见到旧态则计数归零重来）才确认正式按下改变状态。现依次按第 1~6 次采集到序列 `0, 0, 1, 0, 0, 0`。请问在第几次采样时终于正式确认按下状态？
          answer: 6
          hint: '一旦中途出现了一次恢复旧态 `1`（第 3 次），刚刚攒下的连续计数器会怎么处理？从那之后还要再连收几个 `0`？'
          explain: |
            第 1 次 `0` 记 `cnt=1`，第 2 次 `0` 记 `cnt=2`，第 3 次弹跳回旧值 `1` 立刻把 `cnt` 清回 **`0`**。之后第 4、5、6 次连续三次读到 `0`，故在**第 `6` 次**采样终于确认状态切换到 `0`。（若序列为 `0, 1, 0, 0, 0` 则在第 `5` 次确认，已由 Python 生成器及 `gcc` C 函数双重验证）。
      - item:
          id: pullup-floating-why
          type: choice
          prompt: |
            给机械按键接入微控制器 **GPIO** 引脚时，为什么要专门打开芯片内置的**上拉电阻**或外接一只 `10 kΩ` 上拉电阻？
          options:
            - text: 防止开关松开时引脚悬空受电磁杂波影响在 `0/1` 之间跳动，保证松开为 `1`、按下为 `0`
              correct: true
            - text: 直接用 0 Ω 导线把引脚接到 3.3 V，按下时也不会短路
              why: 若用 0 Ω 导线直连 3.3 V，按键一按下接地就会把正电源直接对地短路。`10 kΩ` 上拉电阻正是为了在按下时限制电流（仅 `0.33 mA`）允许引脚安全拉低到 `0`
            - text: 只要接了上拉电阻，机械触点闭合瞬间的毫秒级金属弹跳就会在物理上完全消失，不再需要任何消抖
              why: 阻性上拉只解决松开时的静态悬空电平，不能消灭金属片碰撞弹跳，依然要靠硬件 RC 滤波或软件定时采样消抖
          explain: |
            上拉管“静态悬空不乱飘”，消抖管“按键动作不连击”——两件事各司其职缺一不可。
      - item:
          id: debounce-reason-c4
          type: choice
          prompt: |
            为什么机械按键闭合和断开瞬间必须做硬件或软件**消抖**，而且软件消抖通常挑“每隔 `1 ms` 周期连续扫满 `N` 次相同再更新”而不是死等延时循环？
          options:
            - text: 触点弹跳在数毫秒内产生多个假脉冲会被误判成多次按键；周期采样计数确认既不阻塞又能滤掉毛刺
              correct: true
            - text: 必须用约 20 ms 的延时循环死等触点稳定
              why: 死等延时期间 CPU 什么也干不了，按键之外的任务全停；周期采样加计数确认同样能滤掉弹跳，却不阻塞主循环。
            - text: 消抖是为了加快机械开关内部生锈氧化的速度
              why: 稳定采样消抖是数字交互可靠识别的基础防线
          explain: |
            不要在主循环里用阻塞的 `delay_ms(20)` 等待按键稳定，改用按 `1 ms` 计数的 `every_1ms()` 状态机，不阻塞主循环。

  # ==== 调试与资源限制 ====
  - id: observe
    chapter: 调试与资源限制
    title: 逐步细化开发、软件调试观测与硬件示波器/逻辑分析仪及静态预算
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            微控制器板子接好通电后串口居然一点输出也没有（屏幕上黑漆漆一片 `0` 反馈）。硬件板子上没插显示屏，手边只有示波器/逻辑分析仪和板载一颗小 LED 灯。面对这个“黑盒盲人摸象”困局，第一步科学的**调试**思路是什么？
          options:
            - text: 先设一个可观测的检查点：闪 LED、往 RAM 记时间或接逻辑分析仪看波形，二分定位故障
              correct: true
            - text: 只静态阅读 C 源代码核对语法，不测引脚电压与波形
              why: 嵌入式 bug 常常卡在时钟没开、引脚复用选错、上拉漏接或优化重排，必须**先观测硬件真实事实再下判断**。
            - text: 一上来先把串口代码写满三千行并一次性同时全改十个地方
              why: 坚持**逐步细化（Successive Refinement）**先点亮一盏灯测通最小心跳，再叠外设模块。
          explain: |
            没有好用的屏幕打印时，**非侵入式观测 + 硬件工具 + 严守资源上限**是看清真实硬件行为的主要办法。
      - card:
          title: 逐步细化、质量设计与软硬件**调试**观测手段
          body: |
            - **逐步细化开发**：按产品生命周期从需求分解出发，先写伪码流程再一格格实现（每次只验一个小模块：Blink LED → 按键 → 串口 → 定时采样）；
            - **功能观测两板斧**：① 用闲置引脚翻转 LED 或进 **内存轨迹数组** 记录微秒级状态序列（比慢吞吞阻塞 `printf` 强百倍、几乎不破坏时序）；② **硬件调试器（SWD/JTAG）** 单步看寄存器，**示波器/逻辑分析仪** 直接看真电压波形和几路数字通讯时序图。
          reveal:
            - title: 为什么不要依赖往高速循环里塞 `printf` 来调试嵌入式微秒时序？
              body: |
                `115200` 波特下送一条 `30` 字节调试日志就要占用接近 `2.6 毫秒`。原本微秒级才能重现的按键竞争或高速串口错误，插了慢速 `printf` 之后反而改变了时序，甚至让 bug 不再出现（海森堡 bug）；而往闲置 GPIO 拉高再拉低只花几十纳秒，逻辑分析仪可以直接看出耗时几微秒。
            - title: 嵌入式产品生命周期与最小可行硬件验证原则
              body: |
                从需求分析、芯片选型、原理图评审到固件写码与老化测试，永远遵循“先测电源地线电压 → 再闪最简 LED 证明主频跑通 → 再按功能逐步加外设”。别把十个未测过的驱动一次性堆进工程里，到时故障定位会耗费十倍时间。
            - title: 逻辑分析仪、示波器与 SWD 单步各自什么时候派上用场？
              body: |
                **示波器**专看真实连续电压与电源跌落毛刺（例如串口波形有没有因为电容太大爬坡变圆角、电机启动有没有瞬间拉垮 3.3 V 电源）；**逻辑分析仪**擅长同时咬住 8 路数字引脚连续抓几秒自动翻成十六进制协议包；**SWD/JTAG 在线调试器**让你像在 PC 上打断点一样直接看清微控制器内部寄存器与全局变量快照，但在电机/无线高速实时任务下打断点暂停可能会触发外设看门狗或通信超时，此时必须切换回非侵入式 LED 脉冲与 RAM 环形记录法。
      - item:
          id: printf-vs-gpio-timing
          type: choice
          prompt: |
            调试一个每 `50 µs` 触发一次的高速采样定时任务时，程序员往任务里加了一句向串口打印 40 个字符的 `printf` 看状态，结果原本偶尔出错的功能突然不再出现，同时芯片也严重卡死丢包。最合理的解释是？
          options:
            - text: 串口 `printf` 一次耗时数毫秒，远超 `50 µs` 节拍周期
              correct: true
            - text: '`printf` 申请的堆内存和定时器计数器地址冲突'
              why: 真正的原因是阻塞打印本身耗时数毫秒，把被测时序改掉了；`printf` 并不会改变堆和定时器所在的内存位置
            - text: 逻辑分析仪抓一次 GPIO 跳变耗时 10 秒钟
              why: 一条 `GPIO_OUT ^= mask` 仅耗时十几纳秒，是最轻巧的非侵入探针
          explain: |
            **观察工具越轻巧，时序真相越保真**。
      - item:
          id: ram-budget-kb
          type: number
          prompt: |
            资源受限下的静态规划：一颗小微控制器片上可用总 **RAM** 一共只有 `8 KiB`（`8192` 字节）。已知当前固件已用固定静态变量与通讯缓冲区共占去 `3 KiB`，并为最深多层调用栈（Stack）严格保留 `2 KiB` 安全垫。留给你后续还能安全增配给新环形缓冲区的 RAM 最多还剩多少 KiB？
          answer: 3
          hint: '用微控制器全部片内总 RAM 容量减去已经静态占用的两块固定份额。'
          explain: |
            `8 - 3 - 2 = 3 KiB`；裸机系统极少使用动态 `malloc`（防碎片和耗尽崩溃），所有缓冲区都提前按静止峰值静态算清预算。
      - item:
          id: hw-debug-tool-choice
          type: choice
          prompt: |
            你在微控制器引脚接了一根 `I2C` 温度传感器线却一直读不到正确应答（ACK），怀疑是时钟频率不对或波形拉不低。手边最能直接把这几根真实电线上的跳变沿、毛刺、脉宽与高低电平一览无余的工具是？
          options:
            - text: 示波器（看模拟电压坡度与毛刺）或逻辑分析仪（多路抓数字脉冲并按协议解码）
              correct: true
            - text: 只在电脑串口助手里反复查看空无一物的接收窗口，不去测量物理引脚电平
              why: 软件窗口看不见板子上漏焊的上拉电阻和被寄生电容拉钝的信号边沿，必须用硬件电信号测量仪器抓波形。
            - text: 只用普通数字万用表直流档去测每秒翻转十万次的 `SCL` 时钟线，指望直接读出每个比特的时序
              why: 万用表直流档只能显示几百毫秒的平均电压，看不清微秒级数字脉宽与应答位，必须用逻辑分析仪或示波器。
          explain: |
            “代码看着没毛病却通讯失败”时，拿逻辑分析仪一夹线路波形往往 10 秒钟真相大白。
      - item:
          id: debug-methods-match
          type: match
          prompt: |
            把嵌入式质量工程与调试观察工具跟各自最拿手的用途配对。
          pairs:
            - ["逐步细化（Successive Refinement）", "先跑通单模块小功能核实无误，再逐层叠加避免多模块同时报错一团乱麻"]
            - ["GPIO 口触发脉冲 + 逻辑分析仪", "以纳秒级极小侵入开销精确测出函数耗时与多路串行协议通信帧真值"]
            - ["RAM 内存环形日志追踪（Trace）", "在毫秒或微秒级高速关键路径里默默记录变量跳变序列供事后查阅"]
            - ["示波器（Oscilloscope）", "检查模拟电压波形幅度、电源纹波毛刺及上下电平边沿爬升是否过缓"]
          explain: |
            会写固件是基础，能用仪器测出肉眼看不见的微秒级时间差，是嵌入式调试的核心能力。

  - id: sleep
    chapter: 调试与资源限制
    title: 微控制器功耗预算、时钟门控与睡眠唤醒机制
    minutes: 11
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一个靠纽扣电池供电的智能环境温湿度节点，每隔 `100 毫秒` 只需要花 `2 毫秒` 唤醒采一次传感器并打包数据；剩下 **`98 毫秒`** 完全处于无事可做的等待窗口。如果偷懒写成忙等死循环 `while (not_time_yet) {}` 硬转完那 98 毫秒，和干脆让芯片进深睡眠等硬件闹钟唤醒比，耗电相差多少倍？
          options:
            - text: 忙等时电流接近全速；闲时进睡眠、靠定时唤醒，平均功耗能降一个数量级
              correct: true
            - text: 完全一样省电，CPU 空转几乎不耗能
              why: CPU 时钟继续翻转，空循环同样在反复充放开关晶体管，功耗接近满载。
            - text: 芯片不允许睡眠，睡下去片内 Flash 里的程序就会丢失
              why: 睡眠/停机低功耗模式专门保持 RAM/寄存器上下文并留住极微安唤醒电路等待事件到来
          explain: |
            忙等时芯片一直全速运行，电流和工作时一样大；进了睡眠，那 98 毫秒里只剩很小的睡眠电流。这一课学怎么用睡眠模式、定时唤醒和关掉不用的外设时钟，把平均电流压到微安级。
      - card:
          title: 降低微控制器系统功耗的四种工程手段
          body: |
            记住芯片功耗主要取决于切换频率、供电与闲置空耗（$P_{dyn} \propto C V^2 f$）：
            1. **睡眠 / 停机模式 + 事件唤醒**：无事可干时让 CPU 核休眠，靠极省电的低速定时器或外部引脚电平触发硬件唤醒信号醒来；
            2. **关闭不用外设的时钟门控（Clock Gating）**：用不到 SPI 或第二组 ADC 时直接切断它们那路分枝时钟；
            3. **按需降低系统主频**（或降低供电电压）；
            4. **用硬件外设 / DMA 替 CPU 忙等**（能用硬件定时对比和 DMA 搬运完再响铃，绝不让 CPU 空轮询耗电）。
          reveal:
            - title: 算一笔电池平均功耗账：为什么降低唤醒占空比能明显省电？
              body: |
                假设芯片全速干活吃 `11 mA`，进浅睡眠休眠只吃 `0.1 mA`：
                如果每周期 `10 毫秒` 里花 `1 毫秒` 干活、睡 `9 毫秒`（干活占比 `0.1`），则平均电流只有 $0.1\times 11 + 0.9\times 0.1 = 1.19\text{ mA}$；换成在 `1000` 个时间单位里睡 `900` 单位（`0.9`）吃 `0.2 mA`、忙 `100` 单位（`0.1`）吃 `20 mA` 等场景也一样——压低“唤醒醒着时间占比（占空比）”就是电池续航生命线。
            - title: 既然主频越快干完活睡得越久，“降主频”真能省电吗？什么时候省、什么时候反亏？
              body: |
                这是低功耗设计常见迷思。如果降了主频但必须保持同样的供电电压 $V$，那么完成固定工作量所需的开关翻折总次数不变，早干完早睡反倒和降频平手甚至更快进入深睡眠。只有当**降主频允许同步把核心供电电压 $V_{DD}$ 一起往下压**（动态能量随 $V^2$ 下降），或者在等待外部固定慢时钟期间省下空等开销时，降低时钟才带来大幅节能。另外切记：进深睡眠前把浮空无用的 GPIO 设为固定电平或模拟态，能避免 IO 漏电白白偷走数百微安。
      - item:
          id: avg-current-calc-1
          type: number
          prompt: |
            一颗无线测温节点在每 `10` 个单位时间窗口内，花 `1` 成时间（占比 `0.1`）以 `11 mA` 全速采集运算，其余 `9` 成时间（占比 `0.9`）切入深度睡眠仅消耗 `0.9 mA`。它的综合平均工作电流大约是多少毫安（mA，填小数）？
          answer: 1.91
          tolerance: 0.02
          hint: '将工作态电流和睡眠态电流按各自所占的时间比例（权重）分别相乘后再相加。'
          explain: |
            $0.1 \times 11 + 0.9 \times 0.9 = 1.1 + 0.81 = 1.91\text{ mA}$（注：若改为干活 `11 mA` 睡 `1 mA` 且占比同为 `0.1 / 0.9` 则恰为 $1.1 + 0.9 = 2.0\text{ mA}$）。
      - item:
          id: avg-current-sleep-2ma
          type: number
          prompt: |
            另一款传感节点在工作活跃期占总时间比例 `0.1` 时电流 `11 mA`，深度睡眠占时间比例 `0.9` 时消耗 `1 mA`。它的综合平均供电电流是多少毫安（mA）？
          answer: 2
          hint: '按活跃和睡眠两部分各自的时间占比加权求和即可。'
          explain: |
            $0.1 \times 11 + 0.9 \times 1 = 1.1 + 0.9 = 2.0\text{ mA}$。
      - item:
          id: avg-current-calc-2
          type: number
          prompt: |
            换一套更省电的睡眠参数：工作活跃期占总时间比例 `0.2` 时耗电 `9 mA`，休眠待机期占时间比例 `0.8` 时耗电 `1 mA`。该设备整个运行周期的平均消耗电流是多少毫安（mA，填小数）？
          answer: 2.6
          hint: '算一下加权平均：`工作占比 × 工作电流 + 休眠占比 × 休眠电流`。'
          explain: |
            $0.2 \times 9 + 0.8 \times 1 = 1.8 + 0.8 = 2.6\text{ mA}$（如果换成深睡眠 `0.01 mA` 还能把那项直接省成几乎为零）。
      - item:
          id: low-power-methods-c4
          type: choice
          prompt: |
            工程上想要有效降低一套基于微控制器的物联网节点设备功耗，以下哪组办法最切中要害？
          options:
            - text: 空闲时进睡眠等事件唤醒；关掉不用的外设时钟；调低主频；用 DMA 取代轮询
              correct: true
            - text: 把主频拉到最高，干得越快总耗电越少
              why: 主频越高、忙等越多，动态开关功耗越大；空闲时间应该进睡眠，而不是让核心继续空转
            - text: 拔掉全部唤醒线让芯片永远睡死再也不工作
              why: 必须保留最低能耗的心跳唤醒源或关键外设唤醒引脚，做到“该醒秒醒、没事深睡”
          explain: |
            “关时钟 + 降频 + 硬件/DMA 替忙等 + 深睡事件秒醒”四连招。

  # ==== 外设 ====
  - id: serial
    chapter: 外设
    title: I/O 同步、UART 异步串口帧格式与波特率有效带宽及 SPI 同步串口
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            微控制器主板和电脑串口模块之间只连了一根数据线发信号（没有专门的一根同步“时钟线”告诉对方什么时候该咬一口读取下一比特）。那电脑每秒听见一串 `0` 和 `1` 飞过来，怎么做到既不错位又能精准切分出第 1 字节和第 2 字节？
          options:
            - text: 靠双方事先约定相同的波特率，用起始位 `0` 对齐，收完 8 位再送停止位
              correct: true
            - text: 靠量好铜线长度刚好 1.23 米，两端节奏自动对齐
              why: 节奏由双方事先约定的波特率决定，与导线长度无关；每帧靠起始位重新对齐，所以两端必须用同一波特率。
            - text: 每发完 1 比特就必须停机十秒让工程师用肉眼核对
              why: 一颗起始位一对齐，连续用约定波特率每隔固定微秒数稳稳咬出后面 8 位即可。
          explain: |
            没有时钟线，双方只能事先约好相同的波特率，再靠起始位对齐、停止位收尾来切分每个字节。这一课还要分清“**波特（bps）**”和真正的“**每秒字节数（Bytes/s）**”：每个字节还要多送起始位和停止位。
      - card:
          title: '**UART** 异步帧格式 `8N1` 与波特率有效字节数计算'
          body: |
            - **UART**（通用异步收发器）平时线路闲着停在 `1`（高电平），常用 **`8N1`** 配置（无校验位）：每送 1 个真正字节需打包整整 **`10` 位**：
              `1` 位起始位（低电平 `0`） + **`8` 位有效数据位** + `1` 位停止位（高电平 `1`）；
            - **真正每秒最多传送多少字节？**：设定波特率 `115200 bps` 时：
              $$\text{最大有效字节速率} = \frac{115200}{1 + 8 + 1} = \frac{115200}{10} = \mathbf{11520\text{ 字节/秒}}$$
              （如果改配成 `9600` 波特 `8N1`，则只有 $9600 / 10 = 960\text{ B/s}$）。
          reveal:
            - title: 与同步串口（SPI 驱动 Nokia 5110 液晶屏）及外设同步机制对比
              body: |
                - **同步串口（如 SPI）**：多出一根专门的时钟线 `SCLK`。发送方每推一格数据就拨高一下时钟沿，接收方严格按时钟沿采样，再也不用起始位/停止位凑 10 比特（每帧只发 8 位净数据，速率可达几 MHz 到几十 MHz，刷新点阵屏够用）；
                - **I/O 同步策略**：盲等待周期（算死外设要 10 µs 就硬等）、忙等轮询（盯住 `BUSY/READY` 状态位转圈）和事件通知（就绪才发信号叫醒，CPU 零空耗）。
            - title: 串口线波形图：用 `8N1` 发送字母 `'A'`（`0x41 = 0100_0001`）长什么样？
              body: |
                UART 规矩是**低位先发（LSB First）**：闲置高电平 `1` → 突然拉低 `0` 当**起始位** → 依次送出 `1, 0, 0, 0, 0, 0, 1, 0` 这 `8` 比特 → 最后拉回高电平 `1` 当**停止位**。总共整整 `10` 个等宽波特小格；用示波器或逻辑分析仪一量单格宽度（约 `8.68 µs`），马上就知道实测是不是 `115200` 波特。
            - title: 如果串口线两头约定波特率差了 5% 以上会发生什么？多机怎么连？
              body: |
                因为接收方从起始位中心出发，每隔固定本地节拍连咬后面 9 拍直到停止位。如果两头晶振频率偏差超过约 `3% ~ 5%`，咬到第 8~10 比特时采样点已经漂出正确窗口踩进下一格邻比特里，造成整帧“帧错误（Framing Error）”乱码。所以 UART 常用高稳石英晶振，或用 `TX/RX` 组网多机协议时加上起始包头与 CRC 校验。
            - title: “UART 协议”和常见“TTL / RS-232 电平”经常被新手混为一谈，区别在哪？
              body: |
                `UART` 指的是“收发时序与起止帧格式规矩”，而芯片引脚直接送出的是 `0 V / 3.3 V`（或 `5 V`）单端 **TTL 数字电平**；如果拉十米长工业线怕干扰想跑标准老式电脑接口，则需要外接一颗电荷泵转换芯片（如 MAX3232）把信号抬摆成抗噪更强的 `±12 V` **RS-232 电平**——接反直接把 3.3 V 芯片引脚打穿。切记永远核对电平再接串口。
      - item:
          id: uart-115200-c4
          type: number
          prompt: |
            **UART** 串口通信设为 `115200` 波特、`8` 位数据位、无校验位、`1` 位停止位（`8N1`）。线路全速无间隔发送时，每秒最多能传送多少**字节（Bytes）**有效数据？
          answer: 11520
          hint: '先算清为了传出 1 个完整字节的 8 位净载荷，串口实际还必须前后加塞几位起始和停止协议位，再拿波特率除以单帧总比特数。'
          explain: |
            每字节共花 `1 (Start) + 8 (Data) + 1 (Stop) = 10` 比特传输窗口；`115200 / 10 = 11520` 字节/秒。
      - item:
          id: uart-9600-calc
          type: number
          prompt: |
            常见旧款蓝牙/GPS 模块默认 **UART** 配置为 `9600` 波特、`8N1`（1 起始 + 8 数据 + 1 停止）。理想满速每秒钟最多传几字节（Bytes）？
          answer: 960
          hint: '单帧依然一共占用 `1 + 8 + 1 = 10` 个比特周期，拿波特率除它。'
          explain: |
            `9600 / 10 = 960` 字节/秒——在 `9600` 下塞几千字的日志几乎立刻卡死实时循环。
      - item:
          id: uart-vs-spi-choice
          type: choice
          prompt: |
            要用微控制器快速刷新一块带有几十万像素点的液晶显示屏（例如 Nokia 5110 或 OLED），为什么几乎总是选用 **同步串口（如 SPI）** 而不是用两根线的异步 **UART**？
          options:
            - text: 同步串口带有专门的时钟线按沿采样，省掉起止位 20% 的开销，速率能到几兆赫兹以上
              correct: true
            - text: UART 要两根线，SPI 只要一根，线少传得快
              why: SPI 反而要 3~4 根线（时钟、数据、片选）；它快是因为有共同的时钟线，不用起止位，也不受收发两端晶振误差的限制。
            - text: 因为 SPI 总线上从不需要任何金属导线连过去
              why: 同步串口通常用时钟线 `SCLK`、数据线及片选线 `CS` 等 3~4 根铜线连接
          explain: |
            低速调试/模块连线选 2 线 UART 省引脚；快速刷屏、读传感器与高速闪存选带 `SCLK` 时钟线的同步串口。
      - item:
          id: io-sync-match
          type: match
          prompt: |
            把微控制器与外设打交道时的四类接口/同步机制配对准确。
          pairs:
            - ["**UART**（异步串口）", "无共享时钟线，靠约定波特率与 `起始+数据+停止位` 每字节重新对齐"]
            - ["同步串口（如 SPI）", "带专用 `SCLK` 时钟沿同步信号，无起止位开销且传输速率极高"]
            - ["忙等待轮询（Busy-Wait）", "主循环不断反复查硬件 `READY/BUSY` 状态标志，写法最简单但浪费算力"]
            - ["分布式多片互联", "多颗微控制器通过串口组网各自承担采控任务协同工作"]
          explain: |
            串口通了，微控制器就不再是孤岛，既能上报 PC 调试，也能串接千万种外部智能芯片。

  - id: converters
    chapter: 外设
    title: 微控制器片内 DAC 电平近似与 ADC 数据采集转换计算
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            数字引脚本来只能输出 `0 V`（关灭）和 `3.3 V`（拉满），可怎么让微控制器把一段连续变化的音乐波形从耳机口播出来，又怎么把外部 `0 ~ 2.56 V` 连续变化的电压变成程序里能参与比较的整数呢？
          options:
            - text: 输出靠 DAC 把数字码换成模拟台阶波形；采集靠 ADC 按参考电压和位数把电压量化成整数
              correct: true
            - text: 往数字引脚贴两块磁铁就能无源变出音频和电压数字
              why: 需要专用的**数模转换（DAC）**与**模数转换（ADC）**外设连接连续自然世界和离散数字世界。
            - text: C 语言只要写一句 `int v = 2.5;` 引脚就能直接输出连续 2.5 伏，因为变量已经声明成小数
              why: 普通 GPIO 引脚只识别高/低数字 1/0 两种状态，必须通过外设 DAC 或过滤后 PWM 才能输出中间模拟电压。
          explain: |
            在芯片内部接好 **ADC / DAC**，微控制器才能处理连续变化的电压。
      - card:
          title: '片内 DAC 波形输出与 ADC 数据采集量化'
          body: |
            - **DAC** 在数字域逼近连续信号：给定参考范围 `V_ref` 与 `N` 位精度（共 $2^N$ 阶梯），每写入数字码 `D` 就输出接近 $V_{out} = D \cdot \frac{V_{ref}}{2^N}$ 的电压（如 R-2R 电阻梯形网络查表输出正弦音调）；
            - **ADC** 采集与量化步长：把 `0 ~ V_ref` 均匀划分，最小分辨电压步长 $\text{LSB} = \frac{V_{ref}}{2^N}$。例如 `8 位`（256 级）、参考电压 `2.56 V` 时每格恰好 `0.01 V`（输入 `0.91 V` 编成 `91`，`1.28 V` 编成 `128`）。
          reveal:
            - title: TM4C123 等微控制器片内 12 位 ADC 怎样高效采集而不堵死 CPU？
              body: |
                真实 TM4C123/STM32 片内常搭载 **12 位（$2^{12} = 4096$ 级）高精度 ADC**，在 `3.3 V` 参考下最小一步分辨电压仅 $3.3 / 4096 \approx 0.806\text{ mV}$（比 8 位精密 16 倍）。配置定时器硬件触发启动采样，采完顺手交给 **DMA** 搬去 RAM 缓冲区攒满半槽再敲醒 CPU，全程几乎零 CPU 开销。
            - title: 为什么片内 ADC 采样还经常要求外部前级“信号内阻不要太大”或延长采样时间？
              body: |
                微控制器内部逐次逼近型（SAR）ADC 转换前需要先把模拟引脚连到片内一颗微小“采样保持电容（$C_{hold}$）”充电。如果前级传感器分压电阻高达几百千欧，有限几个微秒采样窗口内充不满片内小电容，就会出现“明明电压是 2.0 V、采出来偏低且跟前一通道串扰”的误差。加宽采样保持周期或前接低内阻运放缓冲即可根治。
            - title: 没有片内贵价 DAC 时，用普通电阻排出的“R-2R 梯形网络”怎么合成波形？
              body: |
                仅需两种精确阻值（$R$ 与 $2R$）像梯子一样串联并联，把微控制器端口上的 `4~8` 根普通 GPIO 数字开关引脚接上去：每一高权重引脚贡献上一位恰好一半的加权电流。于是只要往端口写一个字节数字码，梯子出口就瞬间叠加出严格成正比的阶梯电压（加一颗滤波电容平滑掉锯齿就是简易音乐发声器）。
      - item:
          id: adc-8bit-128
          type: number
          prompt: |
            一颗微控制器配的 **8 位 ADC**（共有 `256` 级编码），采用精密基准电压 $V_{ref} = 2.56\text{ V}$（每格正好 `0.01 V`）。若某时刻输入传感器引脚测得 `1.28 V` 直流电压，转换完成后读取到的结果数字码是多少？
          answer: 128
          hint: '先算出单格电压分辨率（`基准电压 / 总格数`），再算输入的 `1.28 V` 刚好跨过了几个这么大的步距。'
          explain: |
            步长 $2.56 / 256 = 0.01\text{ V}$；输入 `1.28 V` 恰好是满量程一半：`1.28 / 0.01 = 128`（即 `91` 对应 `0.91 V`）。
      - item:
          id: adc-8bit-91
          type: number
          prompt: |
            使用一颗 **8 位（256 级）、参考电压 `2.56 V`** 的微控制器片内 **ADC**（每格步距恰好为 `0.01 V`）：某温度探头当前输出电压为 `0.91 V`。ADC 转换寄存器的整数编码读数是多少？
          answer: 91
          hint: '用输入模拟电压除以最小单格步距（`0.01 V`）。'
          explain: |
            `0.91 / 0.01 = 91`（如果硬件遇到更精细需求则会换用 TM4C123 / STM32 上常见的 12 位 `4096` 级 ADC）。
      - item:
          id: dac-waveform-steps
          type: choice
          prompt: |
            在微控制器里想用一颗 **DAC** 外设播出一首平稳的 `440 Hz` 单音正弦音乐，程序通常怎么配合定时器产生波形？
          options:
            - text: 预先把一个周期的正弦采样点存入 Flash 查表，靠定时器按固定节拍逐个写入 DAC 寄存器
              correct: true
            - text: 只把固定常数 `440` 写进 DAC 数据寄存器一次，之后不再更新，引脚就会自动输出 `440 Hz` 正弦波
              why: DAC 只能保持你写给它的当前直流电压数字（写 `440` 只会输出恒定直流电压），必须按固定采样率不断更新采样表里的瞬时幅值才形成交流正弦波。
            - text: 在主循环里不用任何定时器，靠全速死循环把采样点一口气写进 DAC，不管每次循环耗时多长
              why: 没有定时器控制严格等间隔刷新周期，输出的波形频率会随代码分支和主频而完全失准
          explain: |
            查表 + 硬件定时更新 + 模拟滤波台阶 = 极轻巧嵌入式数字音频发生器。
      - item:
          id: dma-benefit-choice
          type: choice
          prompt: |
            当一块 12 位高速 **ADC** 每秒钟采样 50 万次电压并塞进芯片内存缓冲区时，如果每次转换完都靠 CPU 跳进代码逐个拷贝，CPU 的负担会变得很重。启用 **DMA（直接内存访问）** 有什么作用？
          options:
            - text: DMA 在 ADC 数据寄存器与 RAM 缓冲区之间自动搬运，CPU 不介入，可腾出来运算或休眠
              correct: true
            - text: DMA 会把所有收集到的数字统统直接删掉丢垃圾桶
              why: DMA 忠实把指定数量外设字搬进预先申请好的内存缓冲数组里，全部攒满才通知 CPU 一次整包收割
            - text: 开了 DMA 之后 CPU 就可以完全断电，采样、搬运和处理数据都不再需要 CPU，微控制器也不需要主循环了
              why: DMA 只负责在总线上搬数据，转换仍由 ADC 完成，CPU 也不能断电；它省掉的是逐次搬运的开销
          explain: |
            高速 ADC、音频 I2S、摄像头 SPI 刷屏——只要是成批流水线搬砖工作，交给 DMA 准没错。

  - id: state-machine
    chapter: 外设
    title: 索引结构有限状态机（FSM）与步进电机相序表驱动实战
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            你想让一颗步进电机精准转出平滑步伐，需要按照特定 4 拍通电顺序轮流给四根线圈线送出脉冲模式 `0x05 → 0x06 → 0x0A → 0x09`。代码要是全用大串套娃 `if / else if / else if` 判断当前模式再写下一个，一旦扩展成复杂十字路口红绿灯或几十种模式就会变得极难维护。有没有更工整的数据结构驱动写法？
          options:
            - text: 用索引式状态机：把各状态的输出、驻留时长与跳转编号做成一份 `const` 查表
              correct: true
            - text: 直接随机拿随机数函数给电机四个脚乱加电流
              why: 步进电机必须严格按绕组相序依次通电吸引转子一步步转动，乱通电只会原地抖动发热不转。
            - text: 给四个线圈永远同时通上恒定不变的直流高电平 `0x0F`，转子就会被磁场推着连续旋转起来
              why: 四相一直保持固定静态通电，转子只会停在原地发热；必须按相序轮流切换通电状态才能一步步旋转。
          explain: |
            Valvano 课最受好评的经典模式之一——**查表索引实现有限状态机与步进电机控制**。
      - card:
          title: '有限状态机索引表驱动结构与步进电机控制'
          body: |
            用 **有限状态机** 索引查表写控制逻辑，把全部复杂规则收进只读 Flash 结构体数组：
            系统在任一时刻只处于有限个状态中的一个；每个状态规定此刻输出什么、停多久，以及读到不同输入时跳到哪个状态。把这些规定写成一张表，控制逻辑就和数据分开了：
            ```c
            struct State {
                uint32_t out;     // 本状态输出给外设的引脚模式
                uint32_t wait_ms; // 在本状态停留几毫秒
                uint8_t next[4];  // 遇到输入 0..3 时跳向几号下一状态
            };
            ```
            **执行发动机只有极简四行**：`GPIO_OUT = FSM[s].out;` → `delay(FSM[s].wait_ms);` → `in = read_input();` → `s = FSM[s].next[in];`。（控制步进电机正转只需下标 `+1 mod 4`、反转 `-1` 就调转方向）。
          reveal:
            - title: 为什么嵌入式系统偏爱“查表结构体数组（Table-Driven FSM）”而非万层 `if-else`？
              body: |
                1. **不增逻辑分支 Bug**：添加新十字路口灯态或增加步进半步 8 拍细分控制，只需往结构体表里多填几行静态常量行，驱动那 4 行主发动机代码一行不用改。
                2. **可放进只读 Flash 零耗 RAM**：加上 `const` 后整张表安全躺在便宜宽敞的 Flash 里，运行时极省内存且每步耗时严格恒定可预测。
            - title: 步进电机单相激磁 vs 双相全步（`0x05/0x06/0x0A/0x09`）区别在哪？
              body: |
                同时给两相邻线圈通电的双相全步模式（比如 `0101→0110→1010→1001`）始终让两个磁极合力牵引转子，比单相每次仅通一个线圈的力矩高出约 `41%`（$\sqrt{2}$ 倍），且定位抗抖动更稳。只需改查表里的 `out` 常量就能在单相、双相与半步 8 拍模式间切换。
            - title: 为什么步进电机走得太快或超重负载时会“丢步”，怎样靠编码器挽救？
              body: |
                查表法本来是**开环控制**：MCU 每发一拍脉冲就默认转子稳稳迈出了一步角度（如 `1.8°`），全靠电磁吸力跟紧磁场。一旦脉冲换相速度拉得太急、或者外力矩太重把转子拽脱磁极，转子就悄悄掉队失步却没人知道。给要求精确定位的 3D 打印或数控轴加装光学旋转编码器反馈读数，就能在失步瞬间立刻检测并补走，构成闭环控制。
      - item:
          id: fsm-table-fields
          type: choice
          prompt: |
            使用结构体数组在微控制器中实现**表驱动有限状态机（Table-Driven FSM）**时，每个状态结构体条目里通常核心需要存放哪几样元素？
          options:
            - text: ① 引脚输出值 `out`；② 停留时间；③ 各输入对应的状态索引 `next[]`
              correct: true
            - text: 必须存放全套 3D 游戏引擎源码
              why: 只需描述当前输出动作、节拍等待和输入转移去向这三类紧凑属性即可驱动复杂流程
            - text: 表里只需存每种状态的引脚电压与停留时间，跳到哪个状态交给读到的输入自动决定，完全不用写索引
              why: 状态机必须确定无歧义地指明每种可能输入对应的下一个确定状态编号
          explain: |
            状态表就是把“流程图”原封不动翻译成编译期定死的 C 只读常量数组。
      - item:
          id: stepper-phase-next
          type: choice
          prompt: |
            步进电机 4 相全步驱动状态依次循环为索引 `0 (输出 0x05) → 1 (输出 0x06) → 2 (输出 0x0A) → 3 (输出 0x09)` 顺时针转动一步一格。当电机正停在状态 `2` 时，突然要求它切换成**逆时针反转一步**，状态转移应该跳向几号并输出什么？
          options:
            - text: 退回状态 `1`（输出 `0x06`）
              correct: true
            - text: 跳去状态 `3`（输出 `0x09`），继续顺着走
              why: 状态 `2 -> 3` 是继续正转顺时针向前迈步；倒车反转只需把表索引减 1（从 2 退回 1）。
            - text: 永远停在状态 `2` 不动，输出保持不变，转子就会自己反向旋转
              why: 步进电机只有相邻相序磁极轮流切换吸引转子才会步进旋转，保持同一输出只会牢牢锁死原地保持不动。
          explain: |
            所以查表步进电机在表项里常设 `next[CW]` 和 `next[CCW]` 两个方向字段，一键正反转丝毫不乱步。
      - item:
          id: fsm-const-flash-why
          type: choice
          prompt: |
            在资源吃紧的微控制器上声明状态转移查表数组 `const struct State FSM[8] = { ... };` 时，加不加 **`const`** 修饰符对芯片内存消耗有什么实在区别？
          options:
            - text: 加 `const` 的表留在 Flash，不占 RAM
              correct: true
            - text: 不加 `const` 反而能把 Flash 擦空，省出更多存放代码的空间
              why: 不加 `const` 会被归为可改写全局变量，启动代码被迫把它存一份在 Flash 又额外搬一份占死在 RAM 中
            - text: '`const` 会让代码禁止执行任何跳转查表，状态机就跑不起来'
              why: 只读表的字段本就不需要运行期改写，加 `const` 是嵌入式开发省 RAM 的必选规范
          explain: |
            凡是查表、字库、正弦波形与状态机定义表，都先写 `const`。

  # ==== 定时器 ====
  - id: timer
    chapter: 定时器
    title: 预分频、SysTick 精确计时与比较匹配重装值计算
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一颗 `16 MHz` 主频的单片机如果每次定时都用原始心跳脉冲直接计数，才数满 65536 下（16 位寄存器满）不到短短 `4 毫秒` 就溢出回零了。要是想稳稳精准量出 `100 毫秒` 乃至 `1 秒` 的长定时间隔，怎么不用写卡死 CPU 的软件空循环就能做到？
          options:
            - text: 加分频器把计数脉冲放慢，再由硬件比较匹配
              correct: true
            - text: 用一条软件空循环反复自减，数到零就算定时到了，反正编译器会按主频把这段循环的时间算准
              why: 编译器不会把空循环折算成确定的秒数：它依赖主频和优化等级，循环期间 CPU 也被占住。分频器把计数脉冲放慢后，计数器与比较值才能给出确定的定时。
            - text: 每数完一次拿笔在纸上亲自划一个正字记录到天亮
              why: 硬件定时计数与周期重装寄存器能以零软件插手达到微秒乃至亚微秒级零误差定时。
          explain: |
            分频器先把时钟按固定倍数分慢，计数器数满一次的时间就变长了，再配合硬件比较就能精确定时，不用 CPU 空转。这一课算清分频后的计数频率、比较值为什么要减 1（如 `249`），以及 `SysTick` 节拍。
      - card:
          title: '预分频、计数频率与输出比较重装值（含 `-1` 坑）'
          body: |
            硬件从 `0` 计数定时的核心靠 **预分频** 降频与 **输出比较** 匹配三步法：
            1. **求计数频率**：$$f_{cnt} = \frac{f_{clk}}{\text{预分频系数}}$$（例如 `16 MHz` 主频除以系数 `64` 得 **`250 kHz`**，即每 `4 µs` 跳 1 格）；
            2. **算所需总跳数**：$$N = f_{cnt} \times T_{target}$$（要定时 `1 ms = 0.001 s`，需跳 $250000 \times 0.001 = \mathbf{250}$ 格）；
            3. **算写入比较寄存器 / 重装寄存器值（经典 `-1`）**：因为计数器从 **`0`** 数起到匹配值 `ARR`（包含 `0` 和 `ARR` 边界，总共经手 `ARR + 1` 个跳数再翻转清零），所以**比较值必须写 `N - 1 = 250 - 1 = 249`**。
          reveal:
            - title: 再换一套实操算一遍：8 MHz、8 分频、想要 `500 µs`（0.5 ms）比较事件写几？
              body: |
                1. 计数频率 $= 8\text{ MHz} / 8 = 1\text{ MHz}$（恰好 `1 µs` 跳 1 次）；
                2. `500 µs` 共需要数满 `500` 个节拍；
                3. 从 `0` 数起且包含两端点 → **重装/比较值设为 `500 - 1 = 499`**。（若错写 `500` 实际就会每 `501 µs` 响一次，累积 1000 秒误差整整慢 2 秒）。
            - title: ARM Cortex-M 内置 24 位 SysTick 定时器三件套怎么用？
              body: |
                Cortex-M 内核自带一颗专供系统节拍的 **24 位向下递减计数器 `SysTick`**（不占芯片厂商额外定时器外设）：只有三个核心寄存器——① `LOAD`（写 `N - 1` 重装初值）；② `VAL`（当前倒数到几）；③ `CTRL`（总开关 + 是否允许到零后自动触发周期通知事件，通常做成每 `1 ms` 滴答一次的心跳基准）。
            - title: 如果要定时长达 10 秒，可 `24` 位或 `16` 位硬件寄存器装不下这么大数怎么办？
              body: |
                不要硬塞超出 `65535`（16 位）或 `16,777,215`（24 位）的值进寄存器，否则高位会被截断。标准工程做法是：先用硬件定时器稳定做出精准 **`1 ms` 基础滴答周期节拍**，然后在节拍回调或软定时器表里把一个普通 `uint32_t ms_ticks;` 变量每毫秒加 `1`（32 位毫秒数可以连续记满 49 天不溢出），由此派生出几十种互不干扰的长周期任务。
      - item:
          id: timer-249-c4
          type: number
          prompt: |
            单片机系统主频 `16 MHz`（`16,000,000 Hz`），定时器**预分频**系数设为 `64`，计数器从 `0` 开始每记满设定次数就清零并产生一次 `1 ms` 周期比较事件。请问比较寄存器应写入的数值是多少？
          answer: 249
          hint: '先用主频除以预分频求每秒计数次数，算出 1 毫秒里一共需要经历多少个计数值——最后不要忘记计数器包含起点 `0` 在内，写入值要减 `1`。'
          explain: |
            计数频率 $16\text{ MHz} / 64 = 250\text{ kHz}$；`1 ms` 需计满 $250,000 \times 0.001 = 250$ 个滴答；因为从 `0` 数到比较值共花 `比较值 + 1` 拍，故比较寄存器设为 **`250 - 1 = 249`**。
      - item:
          id: timer-499-extra
          type: number
          prompt: |
            巩固 `-1` 陷阱换组参数计算：系统时钟 `8 MHz`，定时器预分频设 `8`，要求每 `500 µs`（微秒）触发一次比较匹配事件（同样从 `0` 向上计数到比较值清零）。比较寄存器应当写入多少？
          answer: 499
          hint: '先算出分频后的计数频率（兆赫对应每微秒跳几拍），求出 `500 µs` 所需总滴答步数，再按从 0 计数的规则求比较阈值。'
          explain: |
            计数频率 $8\text{ MHz} / 8 = 1\text{ MHz}$（每 `1 µs` 跳 1 格），`500 µs` 需计 `500` 次，从 `0` 数到 `499` 恰好经历 `500` 格。
      - item:
          id: timer-real-period-ms
          type: number
          prompt: |
            逆向排错检查：某程序员把一台计数频率固定为 `250 kHz` 的定时器比较寄存器写成了 `249`（即每经历 `250` 次滴答归零一次）。实际硬件每次溢出间隔的真实物理时间是多少毫秒（ms）？
          answer: 1
          hint: '总经历跳数为写入值加 1，再除以每秒计数的赫兹数换算成毫秒。'
          explain: |
            经历 $(249 + 1) = 250$ 次滴答，耗时 $250 / 250,000\text{ Hz} = 0.001\text{ s} = 1\text{ ms}$。
      - item:
          id: systick-vs-forloop
          type: choice
          prompt: |
            对比在 C 代码里手写“软件空循环 `for (i=0; i<10000; i++);`”与借助微控制器硬件 **SysTick**（或通用定时器）产生延时，为什么稍严谨的固件从不指望空 `for` 循环？
          options:
            - text: 空 `for` 循环耗时随优化等级、主频和其他任务漂移，`-O2` 下可能被整段删掉
              correct: true
            - text: 软件 `for` 循环每执行一次就恰好占用一个时钟周期，所以只要数够次数就一定是准确的秒数
              why: 一条空循环指令往往要占几个时钟周期，循环次数和秒数之间没有固定关系；优化器还会把没有副作用的空循环删掉。
            - text: 因为 C 语言语法根本不允许在嵌入式里写 `for` 循环
              why: 控制固定循环次数的逻辑没问题，但把循环次数当作物理秒数延时不可靠
          explain: |
            调延时永远交给硬件 **SysTick / 定时器** 计数寄存器，再也不猜编译器空转了几拍。

  - id: pwm-capture
    chapter: 定时器
    title: 输出比较做 PWM 占空比调速与输入捕获测脉宽（回绕求差陷阱）
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            用 `12 V` 直流电源去带一只直流小风扇。手上只有一颗开关管每秒按固定节奏快如闪电地通断开关：一个 `100 毫秒` 的周期里通电 `25 毫秒`、断电 `75 毫秒`（不停高速循环，电机由于惯性根本感受不到一抖一抖的切换）。这台风扇感受到的等效平均电压大概是多少伏？
          options:
            - text: 平均 `3 V`（12 V × 25%）
              correct: true
            - text: 还是 12 V 满压，因为开关管导通时引脚上量到的电压一直是 12 V，认为平均电压与占空比无关
              why: 电机线圈与转动惯性自动对高频方波做了时间平均积分，平均直流电平正好等于供电乘以**占空比**。
            - text: '`9 V`，断电的 75% 时间决定平均电压'
              why: 通电的 25% 时间才有 12 V，其余 75% 时间是 0，平均是 12 × 0.25 = 3 V；用断电时间去算就把两段弄反了
          explain: |
            同一套定时器计数器既能“向外发 **PWM** 控制亮度与电机速度”，又能反过来“把外部超声波/编码器脉冲抓进 **输入捕获** 量时间长度”。
      - card:
          title: '**脉宽调制**（PWM）占空比与**输入捕获**计数回绕计算'
          body: |
            - **脉宽调制**（PWM）：定时器一个完整周期计 `Period` 步，在 `Duty` 步之前引脚输出高、后面拉低——高电平时间比例 **占空比 = `Duty / Period × 100%`**（如 `250 / 1000 = 25%`，`3 / 10 = 30%`）；
            - **输入捕获**（Input Capture）：测量外部信号跳变时间差。哪怕计时器（例如 `8 位` 从 `0..255` 转一圈只有 `256` 格）在中间**溢出回绕归零**了一次，只要实际脉宽没超过一整圈，在无符号模算术下直接用：
              $$\text{真实跳数} = (\text{结束捕获值} - \text{开始捕获值}) \bmod 2^N$$
              例如 8 位计数器起点抓到 `250`、终点回绕后抓到 `14` → $(14 - 250) \bmod 256 = \mathbf{20}$ 拍。
          reveal:
            - title: 驱动直流电机与舵机这种感性负载时必须加的硬件保护（续流二极管）
              body: |
                电机里面是大铜线圈（电感 `L`），PWM 开关管突然啪一下关断时电流试图归零却无法瞬间消失，线圈会反向产生上百伏尖峰电压，把芯片引脚或 MOS 管直接击穿。因此感性负载旁**必须并联反向续流二极管（Flyback Diode）**在关断瞬间给线圈电流一条安全兜圈泄放回路。
            - title: 为什么调高 PWM 频率会降低占空比调节的精细度？
              body: |
                假设定时器计数时钟固定是 `1 MHz`：如果希望 PWM 频率设在 `1 kHz`，每周期拥有 `1000` 个计数刻度，占空比能细腻到 `0.1%` 一档；要是盲目把频率拉高到 `100 kHz`，每周期一共只剩 `10` 个计数刻度，占空比就只剩粗糙的 `10%` 十档可调。频率与分辨率永远是一对互换权衡。
            - title: 用输入捕获测“舵机/编码器/超声波高电平”时怎样两步无误差量准？
              body: |
                首先将定时器输入捕获通道配置成“捕捉上升沿”并清零或记下首次时间戳 `t_rise`；一旦上升沿事件标志到来，立刻把抓取极性翻成“捕捉下降沿”；下降沿抵达时再锁出 `t_fall`。利用相同位宽的无符号减法 `t_fall - t_rise` 自动消化掉计数器溢出一圈的回绕，乘以单步微秒数即得精确高电平脉宽。
      - item:
          id: pwm-12v-avg-3v
          type: number
          prompt: |
            用 `12 V` 直流电源通过高速 **脉宽调制**（PWM）开关控制一只小风扇，当前设置的占空比为 `25%`（高电平导通占四分之一周期）。风扇承受的等效平均供电电压是多少伏？
          answer: 3
          hint: '用直流电源满电压乘以开关导通的占空比小数（例如 25% 即 0.25）。'
          explain: |
            $12\text{ V} \times 0.25 = 3\text{ V}$（若改为占空比 50% 则等效 `6 V`）。
      - item:
          id: pwm-duty-30
          type: number
          prompt: |
            一颗定时器产生周期固定为 `10` 个计步的 **脉宽调制**（PWM）脉冲波形，其中高电平持续 `3` 个计步、低电平持续 `7` 个计步。这路 PWM 信号的占空比是多少（填整数百分比，例如 `40%` 填 `40`）？
          answer: 30
          hint: '用单个周期内高电平占用的时间步长除以整周期总步长，再换算为百分比。'
          explain: |
            `3 / 10 × 100% = 30%`（若持续 25 格在 100 格周期内则为 `25%`）。
      - item:
          id: input-capture-wrap-20
          type: number
          prompt: |
            微控制器的 **8 位**自由计数器（范围 `0 ~ 255` 循环滚转，计满 256 步归零，每个计步恰等于 `1 µs`）开启**输入捕获**测一道外部正脉冲宽度：上升沿到来时瞬间捕获锁得计数 `250`，紧接着不到一圈后下降沿到来时捕获锁得计数 `14`（中间经过一次 `255 → 0` 回绕）。这道外部脉冲实际持续了多少微秒（µs）？
          answer: 20
          hint: '别被回绕吓住：先算从起点到溢出处经过几步（`256 - 起点`），再加上归零后走到终点的 `14` 步（即模 `256` 减法）。'
          explain: |
            从 `250` 到 `255` 再进 `0` 经过 `256 - 250 = 6` 步，从 `0` 走到 `14` 又走 `14` 步，合计 `(14 - 250) mod 256 = 20` 步 → **`20 µs`**。（用 C 无符号恰好同位宽整数直接 `end - start` 即自动模溢出得出正确值 `20`）。
      - item:
          id: pwm-why-works-motor
          type: choice
          prompt: |
            用高速 **PWM** 方波去控制一只小 LED 灯泡亮度或直流小马达转速时，为什么肉眼看不到灯泡在闪烁、马达也好像在平滑变速？
          options:
            - text: PWM 频率够快（高于人眼暂留或电机响应带宽）时，负载会把脉宽积分成平稳亮度或转速
              correct: true
            - text: 因为 PWM 方波经过开关管之后会自动滤成纯平的 300 V 交流电压，负载拿到的已经是稳定电压
              why: 电线上依然是 0 与满电源电压之间高速跳变的矩形方波，产生平滑等效调节靠的是后端人眼与线圈积分平均作用
            - text: 只有占空比等于 0% 时 LED 才会亮到最刺眼
              why: 占空比越大（高电平占比高），输出平均能量就越高、灯越亮、电机越快
          explain: |
            调频够快（LED 常 >200 Hz，电机常 10~25 kHz 躲开人耳听觉哨叫），就能拿纯数字 0/1 开关做出丝滑可调模拟动力输出。

  # ==== 中断 ====
  - id: interrupts
    chapter: 中断
    title: 中断概念、NVIC 嵌套与边沿触发、ISR 精简原则及轮询对比
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            你正全神贯注在厨房慢吞吞炖一锅复杂的汤（主循环计算任务），同时在门口等一个重要快递，可又不知道快递几点敲门：一种办法是每隔 3 秒放下锅铲跑去门口张望一次（忙等轮询）；另一种办法是直接给门上装个大铃铛，安心一直熬汤直到**铃声突然响起才立刻暂停手头动作、开门签收记下收件单号然后迅速回锅**。在单片机上装个铃铛叫什么机制？
          options:
            - text: 硬件打断信号（门铃响时停下手头的工作、保存现场、办完短任务再回来）
              correct: true
            - text: 忙等轮询：每隔 3 秒放下锅里的活，跑到门口看一次
              why: 轮询浪费大量 CPU 周期反复空查状态标志，而门铃式异步事件响应让突发处理延迟可控又零空转开销。
            - text: 永久关机再也不开机
              why: 硬件突发接管会自动压栈保存当前现场，办完关键短任务即原封不动回到被打断那行继续往下跑
          explain: |
            这就像门铃：外设有事时硬件打断 CPU，保存现场，处理完再回来接着做。这一课学**硬件事件打断（NVIC / 边沿触发）**、紧急响应程序的写法规矩，以及什么时候反而该用简单轮询。
      - card:
          title: '**中断**响应、NVIC 与**中断服务程序**（ISR）核心纪律'
          body: |
            当引脚踩中上升/下降**边沿**或串口收到新字节时，ARM Cortex-M 内置的嵌套优先级控制器（**NVIC**）令 CPU 硬件自动压栈存好现场，立刻按编号表跳进对应的 **中断服务程序**（ISR）：
            - **ISR 编写三条规则**：① **短平快**：只清硬件标志、速抄新字节并设旗帜；② **耗时分析退回主循环**：不在 ISR 里漫长运算或死等延时；③ **严禁阻塞与调 `printf`**。
      - item:
          id: isr-golden-rules-c4
          type: choice
          prompt: |
            编写微控制器外部引脚或串口接收**中断服务程序（ISR）**时，以下哪种代码结构最合规范？
          options:
            - text: ISR 只清标志、抄字节、置通知，解析和打印放主循环
              correct: true
            - text: 直接在 ISR 里面死循环 `while (!next_packet);` 等待下一分钟的包，顺便调用慢吞吞 `printf` 打印三百行
              why: 占死在高优先级 ISR 里阻塞等待和调非重入慢库会活活卡死整颗微控制器的其余全部定时器和通讯中断。
            - text: 进了 ISR 不要清中断标志位，好让硬件连续触发十万次
              why: 不清外设硬件标志会导致中断刚一退出立刻又再次冲入，主循环永远一行都跑不到。
          explain: |
            口诀：**ISR“拿了数据清标志、立起旗帜赶紧走”**。
      - card:
          title: 边沿触发 vs 电平触发、硬件标志清除与轮询取舍
          body: |
            配置外部引脚中断要盯清两点：**边沿触发**只在信号跳变那瞬触发一次（清完中断挂起标志就算完），而**电平触发**只要引脚保持有效电平就会持续不断拉响警报直到外部撤走或关使能；高优先紧急事件还能在更高优先级下打断正在跑的低级 ISR。电平触发适合几个外设共用一根中断线：只要还有外设没处理完，这根线就一直有效，不会漏掉。
          reveal:
            - title: 中断总比轮询好吗？什么时候用轮询更合适？
              body: |
                轮询并不是任何时候都更差：中断每次跳进跳出都要消耗压栈保存寄存器、跳转和清流水线等额外几十纳秒开销：
                - 当某个事件**每几微秒就到达一次**（例如几十 MHz 的数据流），频繁响应中断反而被反复压栈出栈占满 CPU。此时在主循环里紧盯着状态位轮询，或把**响应延迟要求宽松、逻辑固定简单**的任务交给轮询，反而更快，也没有竞态问题。
            - title: 中断进入与退出瞬间，硬件自动帮你压栈了哪几个核心寄存器？
              body: |
                比如在 ARM Cortex-M 上，只要中断请求打进来且被 NVIC 批准响应，处理器硬件无需软件写一行汇编，直接自动在当前栈里瞬时压入 `R0~R3`、`R12`、`LR`、被中断点返回地址 `PC` 以及状态标志 `xPSR` 共 8 个字（恰与 C 函数调用规范吻合），所以你甚至能直接拿纯正的普通 C 函数充当 ISR，函数 `return` 时硬件自动反向退栈无缝续接原主程序。
      - item:
          id: when-polling-better-c4
          type: choice
          prompt: |
            中断虽然好用，但在以下哪种真实工程场景下，反过来**直接用普通循环轮询（Polling）比使用中断更合适**？
          options:
            - text: 事件每几微秒就来一次，或延迟要求宽松、流程简单时
              correct: true
            - text: 每 1 小时才偶尔到来 1 次的过流急停保护报警，认为稀有事件就该用轮询反复查更省事
              why: 低频且要求极快实时急停的稀少事件正是最该交给高优先级硬件中断第一时间处理的场景
            - text: 需要靠电池深度睡眠一年、只等一次外部按键唤醒时，轮询更省电
              why: 深睡眠期间 CPU 停止运行，不能轮询，必须靠硬件中断线唤醒芯片
          explain: |
            低频偶发/急停/睡眠唤醒用**中断**；高频极短或固定初始化等待用**轮询**。
      - item:
          id: nvic-priority-meaning
          type: choice
          prompt: |
            ARM Cortex-M 等嵌入式微控制器里面的嵌套中断控制器（**NVIC**）主要帮你管什么事？
          options:
            - text: 管理中断的开关和优先级，高优先级可打断低优先级
              correct: true
            - text: 负责把中断请求翻译成 C 函数调用，并自动生成入口表里每一行对应的函数体
              why: NVIC 是硬件内置的中断入口分发和优先级打断裁决管家
            - text: 每次触发中断就自动擦掉片内全部 Flash 固件程序
              why: NVIC 根据中断编号入口表精确把程序跳往对应服务函数入口，绝不擦除代码
          explain: |
            在入口表里“每路外设各占位、按轻重缓急分配优先级”，多外设并发绝不会乱作一团。

  - id: shared
    chapter: 中断
    title: 中断与主循环共享变量、`volatile`、临界区关中断与原子保护
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            主循环里正在写一句看似毫无问题的自增语句 `count++;`（假设它是 `uint32_t` 或横跨两次读取的双字节 16 位计数，在 8 位单片机上要分两条机器指令才能读完+写回）。就在主循环刚把低字节加完、还没来得及加高字节的那一微秒，定时器**中断**突然插进来修改了 `count` 并退出，接着主循环把刚才半旧的半截数写回去覆盖掉——结果丢了一个计数。怎么拦住这种“切到半截”的撕裂事故？
          options:
            - text: 共享变量加 `volatile`，读写前后短暂关中断
              correct: true
            - text: 只要把变量名字改成英语单词 `safe_count`，编译器就会把它当成不可打断的变量处理
              why: 变量名字起给程序员看的，不加 `volatile` 编译器还会把变量缓存进寄存器看不到修改，不加关中断/互斥保护硬件照样在中间切走。
            - text: 不加保护，默认中断只会在主循环完整读完多字节变量之后才触发
              why: 外部或定时中断发生在任意两条机器指令之间，必须显式用关中断或互斥保护共享数据一致性。
          explain: |
            `count++` 在 8 位机上要分几条指令完成，中断插在中间，主循环就会写回半旧的值。所以共享变量要加 `volatile`，主循环做多字节读取或读–改–写时还要短暂关中断。这一课讲**中断与主循环之间怎么安全地共享变量**。
      - card:
          title: '共享状态、`volatile` 与原子操作保护区'
          body: |
            中断（ISR）与主循环就像共用一块白板的两个异步并发执行体，共享变量必须双管齐下防撕裂：
            1. **可见性防优化**：共享变量一定要加 **`volatile`** 修饰，禁止编译器把值死缓存在主循环 CPU 寄存器里而永远看不见 ISR 在内存里做的最新改动；
            2. **多字节读写防撕裂**：在主循环准备读取/修改多字节变量前，执行极短暂的 **关中断 → 速读写 → 立刻恢复开中断**（或使用硬件独占保护指令），构成不可切分的 **原子操作**。
          reveal:
            - title: 为什么关中断保护区间必须缩到“仅包裹那 2~3 行变量拷贝”，切忌全程关中断？
              body: |
                关中断期间所有外部报警与通信接收都会被暂时屏闭憋着无法响应。正确写法是在主循环先**关中断 → 一行拷贝 `uint32_t local_cnt = shared_cnt; shared_cnt = 0;` → 立刻开中断恢复**，然后安心抱着自己的私家 `local_cnt` 慢悠悠做乘法统计和串口打印去。既安全无撕裂交接又只耽误几个时钟周期（不到 1 µs）。
            - title: 遇到大数据块（如整帧传感器数组或网络包）时怎么不用每次拷贝半天又能零撕裂交接？
              body: |
                用**双缓冲乒乓切换（Ping-Pong Double Buffering）**。准备 `buf[0]` 和 `buf[1]` 两块大小相同的数组：采集 DMA / ISR 专心往 `buf[active]` 里写当前帧，主循环安心从另一块 `buf[1 - active]` 里慢慢分析上一帧。仅在整帧集齐的一刹那翻转那个 1 比特开关切换编号，完全不拷贝大数组。
            - title: 为什么单生产者单消费者环形缓冲区（Ring Buffer）经常甚至无需全程关中断？
              body: |
                环形队列维护两个分离的索引：**写下标 `head`** 仅允许由中断服务程序推进写入新字节并递增，**读下标 `tail`** 仅允许由主循环推进读取字节并递增。只要底层的单字节索引更新满足原子宽度且数组容量留够突发余量，生产方与消费方各自只改自己的那一半指针、永远互不冲突踩踏。
      - item:
          id: shared-var-protect-c4
          type: choice
          prompt: |
            一个由**中断服务程序**负责累加、同时被**主循环**定时读取并清零的多字节共享计数器 `volatile uint32_t rx_bytes;`，主循环里读取并清零它最安全标准的做法是？
          options:
            - text: 变量加 `volatile`；读取清零前短暂关对应中断，拷出副本并清零后再开
              correct: true
            - text: 不写 `volatile`，在主循环里用分支慢慢读一半就打印，靠打印看计数有没有丢
              why: 既可能因编译器把 `rx_bytes` 优化进寄存器而读不出 ISR 的修改，又可能在读写半途中被 ISR 插入覆盖丢失计数。
            - text: 从头到尾一直关闭芯片全局中断，永久不打开
              why: 全局永远关中断会导致串口和定时器等所有 ISR 全数瘫痪；仅在复制清零那极短两行期间屏蔽即可
          explain: |
            `volatile`（解决编译器缓存假象） + 极短关中断/原子指令（解决硬件中途打断撕裂），两道防线缺一不可。
      - item:
          id: volatile-missing-bug
          type: choice
          prompt: |
            程序员写了一句全局变量 `int ready = 0;`（漏加 `volatile`），打算由串口中断 ISR 收到数据包后把 `ready` 改成 `1`，而主循环写了 `while (ready == 0) { }` 原地等。打开 `-O2` 优化编译后芯片居然永久卡死哪怕中断真的执行过把内存改成了 1。为什么？
          options:
            - text: 优化器把读取提到循环外，不再读内存
              correct: true
            - text: 因为 ISR 和主循环各有一份 `ready` 的副本，ISR 改的只是它自己那一份
              why: 全局变量在 RAM 里只有一份，ISR 确实把它改成了 1；问题在主循环：编译器没看见 `volatile`，把 `ready` 读进寄存器后就不再读 RAM
            - text: 因为 C 语言里 `0` 永远不等于数字 `0`
              why: 加上 `volatile int ready = 0;` 后编译器每循环一圈都会老老实实重读 RAM 最新数值
          explain: |
            记住这桩真实经典惨案：**凡是硬件寄存器、或被中断和主循环同时碰到的共享变量，不加 `volatile` 开优化就等原地卡死。**
      - item:
          id: ring-buffer-handoff
          type: choice
          prompt: |
            除了单标志变量之外，高速串口中断源源不断塞入字节、主循环慢慢解析协议时，最常用哪种免长时关中断的经典缓冲交接数据结构？
          options:
            - text: 环形缓冲区：ISR 只推写指针，主循环只推读指针
              correct: true
            - text: 让 ISR 和主循环共同读写同一个不加保护的全局单字节变量，主循环每 100 毫秒才去读一次
              why: 高速串口在 100 毫秒内会收到上千个字节，只留单个变量会被后续字节不断覆盖丢失，必须用定长环形队列（FIFO）缓冲。
            - text: 每次只保留最后 1 个字符，前面收到的全部覆盖扔掉不管
              why: 定长环形数组既能兜住十几至上百字节突发不丢包，又占用完全固定可预算的静态 RAM。
          explain: |
            环形缓冲区 + `volatile` + 极短原子保护，构成了绝大部分嵌入式裸机串口与传感器驱动队列骨架。

boss:
  items:
    - id: boss-boot-order
      type: order
      prompt: |
        复位启动检验：把微控制器裸机上电后到正式运行业务主循环的启动阶段按严格先后顺序排好（裸机程序）：
      steps:
        - 从固定复位入口表取得初始栈顶指针与起跑入口并设置基础时钟
        - 将 `.data` 初值从 Flash 拷贝至 RAM 并把 `.bss` 段清零
        - 跳转进入用户 `main()` 并驻留主死循环驱动外设
      explain: |
        先把存储和栈打扫妥当，C 运行环境才成立。
    - id: boss-gpio-c4
      type: number
      prompt: |
        32 位 `GPIO_OUT` 寄存器当前第 `1` 脚为 `1`（值为 `2`）。执行 `GPIO_OUT |= (1u << 5);` 点亮第 5 脚且不改动其余引脚后，寄存器的新十进制数值是多少？
      answer: 34
      explain: |
        `2 | (1 << 5) = 2 | 32 = 34`，利用按位或赋值保护了原第 1 脚等其余全部 31 根引脚不灭。
    - id: boss-volatile-why-c4
      type: choice
      prompt: |
        为什么直接访问硬件外设寄存器指针以及中断共享标志变量时，**必须写上 `volatile` 关键字**？
      options:
        - text: 因为寄存器值和共享标志可能被硬件或中断随时修改且写入有物理副作用，必须禁止编译器将访问缓存进寄存器、删减、合并或乱序重排
          correct: true
        - text: 因为写了 `volatile` 之后，32 位或 64 位多字节变量在 8 位/16 位单片机上的非原子读写就会自动变成关中断原子操作
          why: '`volatile` 只要求编译器每次真实访存而不缓存在寄存器里，并不提供关中断或互斥原子保护，多字节共享变量仍需配合极短关中断保护区'
        - text: 因为如果不写 `volatile` 编译器在 `-O0` 下也会拒绝编译任何指针解引用语法
          why: 缺了 `volatile` 照样能编译过，最致命的是开启 `-O2` 等编译优化后出现“写入被合并吞掉或循环死读寄存器旧值”等隐蔽故障
        - text: 因为只有主循环里的局部变量需要写 `volatile`，硬件外设寄存器和中断标志反而不需要写
          why: 普通局部变量不会被异步打断修改，恰恰是硬件外设寄存器与中断共享标志必须加 `volatile`
      explain: |
        物理寄存器读写副作用 + 异步修改可见性 = 必须 `volatile`。
    - id: boss-timer-249-c4
      type: number
      prompt: |
        主频 `16 MHz` 单片机把定时器预分频设成 `64`，从 `0` 向上计数到比较值并清零。要每整 `1 ms` 产生一次比较中断，比较寄存器应该设成多少？
      answer: 249
      explain: |
        `16 MHz / 64 = 250 kHz`，`1 ms` 计 `250` 次；从 `0` 计起须写 `250 - 1 = 249`。
    - id: boss-uart-11520-c4
      type: number
      prompt: |
        微控制器 **UART** 配置为 `115200` 波特率、8 位数据、无校验、1 位停止位（`8N1`）。线路全速传送时，每秒最多能传走多少**字节（Bytes）**有效数据？
      answer: 11520
      explain: |
        每字节占用 `1 起始 + 8 数据 + 1 停止 = 10` 比特，`115200 / 10 = 11520` 字节/秒。
    - id: boss-debounce-c4
      type: number
      prompt: |
        软件每隔 `1 ms` 采样一次按键并消抖，规则为“原本稳定松开 `1`，必须连续 `3` 次稳读新电平 `0` 才确认按下（中途见到 `1` 则计数归零重来）”。从第 1 次起依次采到 `0, 1, 0, 0, 0`，请问在第几次采样时正式确认按下？
      answer: 5
      explain: |
        第 1 次 `0` 计 `1`，第 2 次弹回 `1` 清回 `0`，接着第 3、4、5 次连续三次 `0`，故于第 `5` 次采样确认按下。
    - id: boss-isr-shared-lowpower-c4
      type: choice
      prompt: |
        下列关于微控制器中断规范、共享保护及低功耗手法的组合判断，哪一项**全部正确**？
      options:
        - text: ISR 短快不阻塞，耗时活放主循环；共享变量加 `volatile` 并短暂关中断；降功耗靠睡眠与关时钟
          correct: true
        - text: 可以在 ISR 里放心 `while` 阻塞等下一包并调用 `printf`；降功耗只需要永远死循环满速空转就行
          why: ISR 阻塞或调用慢重入库函数会拖垮全系统响应；死循环忙等会让功耗保持在满载，没有休眠省电效果
        - text: 多字节共享变量只要声明了 `volatile`，主循环分两步读取高低字节时就绝不可能被中断从中间打断读出撕裂值
          why: '`volatile` 只能阻止编译器缓存寄存器，不能阻止两次内存读取之间被中断打断，仍需极短关中断保护区或原子指令保护'
        - text: 只要事件高频到每 2 微秒一次也必须用中断，用轮询就是错的
          why: 事件极高频或流程极简单且允许放松延迟时，用轮询省去上下文压栈切换反而更简单高效
      explain: |
        祝贺通关《单片机与微控制器》。从复位启动、GPIO `volatile` 位掩码与消抖状态机到硬件定时、串口与中断并发安全，你已具备扎实的裸机固件工程基本功。
