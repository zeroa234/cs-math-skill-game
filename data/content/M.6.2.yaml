skill: M.6.2
version: 2
authors: [main-agent]
brief:
  why: |
    概率论告诉你“已知硬币均匀时，连续十次正面有多稀奇”；现实问题往往反过来：手里只有十次抛掷的结果，怎样反推出硬币到底偏不偏、这个结论有多稳？这一关从样本和抽样分布起步，讲清点估计的评价标准、充分统计量与矩估计、大样本相合性与统计决策权衡、最大似然与数值求解、置信区间与自助法，直到假设检验、p 值与 Wald 检验，为回归建模和机器学习打下统计推断的底座。
  outcomes:
    - 区分总体参数与样本统计量，理解抽样分布、顺序统计量与卡方、t、F 分布的来源与自由度
    - 使用偏差、方差与均方误差评价点估计，并用因子分解定理和矩估计构造估计量
    - 掌握相合性、Delta 方法、两类错误与功效权衡，以及贝叶斯后验更新与决策直觉
    - 为常见分布推导最大似然估计，处理边界支撑与多参数情形，理解数值求 MLE 与 Fisher 信息
    - 正确解释并计算精确区间、大样本区间、自助法区间与新观测的预测区间
    - 按标准流程完成假设检验与 p 值解读，利用区间对偶性与 Wald 检验处理单双总体问题
terms:
  - term: 简单随机样本
    def: '从总体中抽取的独立同分布观测序列，每个样本在相同分布下独立产生'
  - term: 统计量
    def: '完全由样本数据算出来的函数或数值，式子里不能含有未知的总体参数'
  - term: 抽样分布
    def: '同一个统计量在反复抽样下所有可能取值所服从的概率分布'
  - term: 顺序统计量
    def: '把样本按从小到大重新排列后得到的第 k 个观测值，如最小值和最大值'
  - term: 卡方分布
    def: 'k 个彼此独立的标准正态随机变量的平方和所服从的分布，参数 k 称为自由度'
  - term: t 分布
    def: '样本均值标准化后改用样本标准差估计总体标准差时所服从的对称重尾分布'
  - term: F 分布
    def: '两个各自除以自身自由度的独立卡方随机变量之比所服从的非负分布'
  - term: 自由度
    def: '计算统计量时能够自由变动的独立信息个数，如样本方差里的 n − 1'
  - term: 标准误
    def: '某个估计量或统计量自身抽样分布的标准差，衡量它在不同样本间的波动幅度'
  - term: 点估计
    def: '用样本算出的单个数值或公式去猜测未知总体参数，包含估计量与估计值两层含义'
  - term: 偏差
    def: '点估计量的期望减去参数真值的差，即系统性偏离方向；不为零时称为有偏估计'
  - term: 均方误差
    def: '估计量与参数真值之差的平方的期望，等于估计量方差与偏差平方之和'
  - term: 充分统计量
    def: '把样本中与未知参数相关的全部信息都压缩进去而不损失任何信息的统计量'
  - term: 因子分解定理
    def: '判断统计量是否充分的准则：联合密度或概率可拆成只含统计量与纯样本函数两项乘积'
  - term: 矩估计
    def: '让样本各阶原点矩等于对应的总体理论矩，再解方程得到未知参数估计值的方法'
  - term: 相合性
    def: '当样本量 n 趋于无穷时，估计量依概率收敛到未知参数真值的渐近性质'
  - term: Delta 方法
    def: '利用一阶泰勒线性近似，把估计量的渐近正态方差传播到它的光滑函数上的方法'
  - term: 零假设
    def: '假设“没有效果或参数等于基准值”，检验开始时默认站在它这一边看数据是否矛盾'
  - term: 备择假设
    def: '当样本证据足够反常时想要支持的对立主张，通常对应研究者关心的差异或效应'
  - term: 显著性水平
    def: '事先设定的容忍上限 α，即在零假设为真时错误拒绝它的最大允许概率'
  - term: 第一类错误
    def: '零假设实际上为真，但检验却错误地拒绝了它，其最大允许概率即显著性水平 α'
  - term: 第二类错误
    def: '零假设实际上为假，但检验却没能拒绝它，发生概率通常记作 β'
  - term: 检验功效
    def: '当备择假设为真时检验能够正确拒绝零假设的概率，等于 1 − β'
  - term: 损失函数
    def: '用非负数衡量预测或估计结果偏离真值所付出代价的函数，如平方误差损失'
  - term: 后验分布
    def: '看到样本数据并用贝叶斯定理更新之后，未知参数所服从的条件概率分布'
  - term: 贝叶斯估计
    def: '把先验分布和样本似然结合成后验分布后，使后验期望损失最小的估计值'
  - term: 可信区间
    def: '贝叶斯推断中让未知参数以后验概率落入其中的区间，不同于频率派置信区间'
  - term: 似然函数
    def: '把固定观测样本的概率或联合密度看作未知参数 θ 的函数，用来比较参数合理解释程度'
  - term: 对数似然
    def: '对似然函数取自然对数得到的函数，能把连乘化为连加而不改变极大值点的位置'
  - term: 最大似然估计
    def: '在参数允许范围内选取使观测样本出现似然最大的参数值作为点估计，简写为 MLE'
  - term: 偏导数
    def: '多参数函数对其中一个参数求导时，把其余参数暂时当作固定常数得到的导数'
  - term: 牛顿法
    def: '利用一阶与二阶导数在局部做二次近似并一步步逼近函数极值点或方程根的数值方法'
  - term: Fisher 信息
    def: '衡量样本对未知参数提供多少信息量的指标，等于对数似然二阶导数负值的期望'
  - term: 置信区间
    def: '按固定规则由样本算出的随机区间，重复抽样下以预定概率覆盖固定的未知参数真值'
  - term: 预测区间
    def: '针对下一次新抽样观测值给出的随机范围，同时包含参数估计误差和个体随机波动'
  - term: 自助法
    def: '把已抽到的样本视作经验总体、反复有放回重抽以估计标准误或构造区间的方法'
  - term: p 值
    def: '假设零假设成立时，抽样得到至少与当前样本同样极端结果的概率；不是零假设为真的概率'
  - term: Wald 检验
    def: '用点估计与原假设值之差除以它的渐近标准误来判断参数是否显著偏离的大样本检验方法'
  - term: 似然比检验
    def: '比较无约束最大对数似然与零假设约束下最大对数似然的落差来判断假设是否成立的检验方法，简称 LRT'
lessons:
  # =====================================================================
  # 第 1 章：抽样分布
  # =====================================================================
  - id: sampling-order
    chapter: 抽样分布
    title: 统计量与顺序统计量
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            你想知道全国成年人平均每天睡几小时，随机抽查了 500 人，算出平均数是 7.1 小时。如果明天换另一批人再随机抽 500 个，算出来的平均数还会恰好是 7.1 小时吗？
          options:
            - text: 通常不会，每次重抽的样本均值都会在真实均值附近小幅波动
              correct: true
            - text: 一定会，只要样本量达到 500 人以上，大数定律就保证每次抽样算出的样本均值都分毫不差地等于 7.1 小时
              why: 大数定律说的是样本量趋于无穷时样本均值收敛到总体真均值，有限样本下换一批人重抽依然会有抽样波动
            - text: 不会，而且两次抽样的均值毫无关联，完全可能一次算出来是 7.1 小时、下一次算出来是 2.0 小时
              why: 500 人的样本均值标准误已经很小，结果会紧密集中在总体真实均值周围，不会大幅跳动
          explain: |
            抽样得到的数字本身也带随机性。把“统计量在不同样本下怎样分布”说清楚，就是数理统计的起点。
      - card:
          title: 简单随机样本与统计量
          body: |
            总体的规律通常带有不知道的常数（称为总体参数，如全体均值 $\mu$）。为了猜出它，我们独立地按同一分布抽取 $n$ 个观测 $X_1, X_2, \dots, X_n$，记为**简单随机样本（simple random sample）**，即一组**独立同分布**的随机变量。
            只用样本就能算出来、公式里**不含未知总体参数**的量，叫做**统计量（statistic）**。例如样本均值 $\bar{X} = \frac{1}{n}\sum_{i=1}^n X_i$ 和样本方差 $S^2 = \frac{1}{n-1}\sum_{i=1}^n (X_i - \bar{X})^2$ 都是统计量；而 $\bar{X} - \mu$ 含有未知的 $\mu$，就不是统计量。
      - item:
          id: identify-statistic
          type: choice
          prompt: |
            设 $X_1, \dots, X_n$ 来自均值为 $\mu$、方差为 $\sigma^2$（均未知）的正态总体。下面哪条式子**属于统计量**？
          options:
            - text: $\frac{1}{n}\sum_{i=1}^n X_i^2$（样本二阶原点矩）
              correct: true
            - text: $\frac{\bar{X} - \mu}{\sigma}$
              why: 式子里含有未知的 $\mu$ 和 $\sigma$，拿到样本数据后无法直接算出数值
            - text: $\sum_{i=1}^n (X_i - \mu)^2$
              why: 式子里含有未知总体均值 $\mu$，不能仅靠样本观测值算出结果
            - text: $\frac{S^2}{\sigma^2}$
              why: 分母含有未知总体方差 $\sigma^2$，虽然它的概率分布完全已知，但本身不是统计量
          explain: |
            统计量只能由样本观测值 $X_1, \dots, X_n$ 和已知常数构成，拿到一批具体数字就必须能直接算出结果。
      - card:
          title: 抽样分布与顺序统计量
          body: |
            统计量是样本的函数，所以它自身也是随机变量。一个统计量在反复抽样下所有可能取值所服从的概率规律，称为它的**抽样分布（sampling distribution）**。
            最常用的一类统计量只需把样本按从小到大排成一列：$X_{(1)} \le X_{(2)} \le \dots \le X_{(n)}$。排好队后的第 $k$ 个数 $X_{(k)}$ 叫第 $k$ 个**顺序统计量（order statistic）**。其中 $X_{(1)} = \min X_i$ 是样本最小值，$X_{(n)} = \max X_i$ 是样本最大值，两者之差 $X_{(n)} - X_{(1)}$ 称为样本极差。
      - card:
          title: 例子：求样本最大值与最小值的累积分布函数
          body: |
            假设 $X_1, \dots, X_n$ 独立同分布且累积分布函数为 $F(x)$。怎样写出最大值 $X_{(n)}$ 和最小值 $X_{(1)}$ 的分布？
          reveal:
            - title: 第 1 步：把“最大值不超过 x”翻译成每个样本都不超过 x
              body: |
                最大值都小于等于 $x$，等价于**每一个**观测都小于等于 $x$。利用独立性相乘：
                $$F_{(n)}(x) = P(X_{(n)} \le x) = P(X_1 \le x, \dots, X_n \le x) = [F(x)]^n$$
            - title: 第 2 步：用补事件算最小值超过 x 的概率
              body: |
                最小值大于 $x$，等价于**每一个**观测都大于 $x$。于是 $P(X_{(1)} > x) = [1 - F(x)]^n$，再用 1 减去它即得分布函数：
                $$F_{(1)}(x) = 1 - [1 - F(x)]^n$$
      - item:
          id: max-order-stat-prob
          type: number
          prompt: |
            三个彼此独立同分布的传感器误差 $X_1, X_2, X_3$ 都服从区间 $[0, 1]$ 上的均匀分布（在该区间内 $F(x) = x$）。最大的那个误差 $X_{(3)}$ 不超过 $0.6$ 的概率是多少？
          answer: 0.216
          hint: 三个里的最大值不超过 0.6，等价于三个数各自都不超过 0.6。
          explain: |
            因为 $X_1, X_2, X_3$ 独立，所以 $P(X_{(3)} \le 0.6) = [F(0.6)]^3 = 0.6^3 = 0.216$。
      - item:
          id: min-order-stat-exp
          type: number
          prompt: |
            4 个同型号独立元件的寿命 $X_1, X_2, X_3, X_4$ 均服从参数 $\lambda = 1$ 的指数分布（$P(X_i > t) = e^{-t}$）。当这 4 个元件串联工作时，系统寿命就是最短寿命 $X_{(1)}$。那么系统能撑过 $t = 0.5$ 小时的概率是多少？（保留至少三位小数）
          answer: 0.135335
          tolerance: 0.001
          hint: 最小值大于 0.5 意味着 4 个元件必须全部各自大于 0.5。
          explain: |
            利用独立性，$P(X_{(1)} > 0.5) = [P(X_1 > 0.5)]^4 = (e^{-0.5})^4 = e^{-2} \approx 0.1353$。可见独立指数分布的最小值仍服从指数分布，失效率相加为 $4\lambda$。
      - item:
          id: order-stat-median-range
          type: number
          prompt: |
            一次抽样测得 5 个数据为 `24, 11, 18, 30, 15`。重排后，第 3 个顺序统计量（样本中位数 $X_{(3)}$）与样本极差（$X_{(5)} - X_{(1)}$）的和是多少？
          answer: 37
          hint: 先按从小到大排序，再分别读出中间那个数和首尾之差。
          explain: |
            排序后为 $11, 15, 18, 24, 30$。样本中位数 $X_{(3)} = 18$，样本极差 $X_{(5)} - X_{(1)} = 30 - 11 = 19$，两者之和为 $18 + 19 = 37$。

  - id: sampling-dists
    chapter: 抽样分布
    title: 顺序统计量密度与卡方、t、F 抽样分布
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一个大班有 100 名学生，已知总体成绩的标准差是 15 分。如果每次随机抽 25 人算一次平均分，你猜这些平均分彼此之间的标准差还是 15 分吗？
          options:
            - text: 比 15 分小得多，因为同一组里的偏高和偏低成绩会互相抵消一部分
              correct: true
            - text: 还是 15 分，因为样本只是总体的微缩模型，波动不变
              why: 单个同学的波动才是 15 分；取 25 个人的平均后，随机误差相互抵消，平均分稳定得多
            - text: 反而变成 25 × 15 分，因为把 25 个人的波动叠加在了一起
              why: 算平均时除以了样本量 $n$，标准差会按 $\sqrt{n}$ 缩小而不是放大
          explain: |
            独立同分布样本的均值方差是 $\sigma^2/n$，因此标准差会缩小为 $\sigma/\sqrt{n} = 15/5 = 3$ 分。
      - card:
          title: 顺序统计量的概率密度
          body: |
            对于连续随机变量，对分布函数求导就能得到顺序统计量的**概率密度**。最值最简单：
            - 最大值密度：$f_{(n)}(x) = \frac{d}{dx}[F(x)]^n = n[F(x)]^{n-1}f(x)$
            - 最小值密度：$f_{(1)}(x) = \frac{d}{dx}(1-[1-F(x)]^n) = n[1-F(x)]^{n-1}f(x)$
            一般地，第 $k$ 个顺序统计量 $X_{(k)}$ 的密度，相当于在 $x$ 附近放 1 个点、左边放 $k-1$ 个、右边放 $n-k$ 个，因此乘上组合系数后得到：
            $$f_{(k)}(x) = \frac{n!}{(k-1)!(n-k)!}[F(x)]^{k-1}[1-F(x)]^{n-k}f(x)$$
      - item:
          id: order-pdf-expectation
          type: number
          prompt: |
            设 $X_1, X_2$ 独立同分布于 $[0, 1]$ 上的均匀分布（$F(x)=x, f(x)=1$）。由公式得较大值 $X_{(2)}$ 的密度为 $f_{(2)}(x) = 2x$（$0 \le x \le 1$）。用定积分求 $E[X_{(2)}] = \int_0^1 x \cdot 2x\,dx$ 等于多少？（填小数或分数）
          answer: 0.666667
          tolerance: 0.001
          hint: 写出被积函数 $2x^2$ 的原函数再代入上下限 $1$ 和 $0$。
          explain: |
            $\int_0^1 2x^2\,dx = \left[\frac{2}{3}x^3\right]_0^1 = \frac{2}{3} \approx 0.667$。类似地，$E[X_{(1)}] = \frac{1}{3}$，两个期望恰好把区间 $[0, 1]$ 等分成三段。
      - card:
          title: 样本均值的抽样分布与标准误
          body: |
            当总体均值为 $\mu$、方差为 $\sigma^2$ 时，样本均值 $\bar{X}$ 满足 $E[\bar{X}] = \mu$、$\mathrm{Var}(\bar{X}) = \frac{\sigma^2}{n}$。
            统计量抽样分布的标准差称为**标准误（standard error）**。因此样本均值的真实标准误是 $\frac{\sigma}{\sqrt{n}}$；当 $\sigma$ 未知并用样本标准差 $s$ 替代时，估计标准误写作 $\mathrm{SE}(\bar{X}) = \frac{s}{\sqrt{n}}$。如果总体本身是正态分布，或者样本量较大（由**中心极限定理**），标准化后的 $\frac{\bar{X}-\mu}{\sigma/\sqrt{n}}$ 就服从或近似服从标准正态分布 $N(0, 1)$。
      - item:
          id: sample-mean-se
          type: number
          prompt: |
            某批次电子元件重量服从正态分布，已知总体标准差 $\sigma = 12$ 克。每次随机抽取 $n = 16$ 个计算样本均值 $\bar{X}$，则 $\bar{X}$ 抽样分布的标准误是多少克？
          answer: 3
          hint: 标准误等于总体标准差除以样本量的平方根。
          explain: |
            样本均值的标准误为 $\sigma/\sqrt{n} = 12/\sqrt{16} = 12/4 = 3$ 克。
      - card:
          title: 卡方分布与 t 分布
          body: |
            正态总体抽样还会自然引出几个基本抽样分布，其中**自由度（degrees of freedom）**表示计算式里能独立变化的维度个数：
            - **卡方分布（chi-squared distribution）** $\chi^2(k)$：$k$ 个独立标准正态随机变量的平方和。对正态样本，$(n-1)S^2/\sigma^2 \sim \chi^2(n-1)$。
            - **t 分布（Student's t-distribution）** $t(n-1)$：用样本标准差 $S$ 替换未知 $\sigma$ 后，$T = \frac{\bar{X}-\mu}{S/\sqrt{n}}$ 服从 $t(n-1)$，两尾比正态更厚。
      - item:
          id: t-dist-df-reason
          type: choice
          prompt: |
            对 $n = 10$ 个独立同分布的正态样本算样本方差 $S^2$，进而构造 $T = \frac{\bar{X}-\mu}{S/\sqrt{10}}$。它服从多少自由度的 $t$ 分布？为什么？
          options:
            - text: 自由度为 9，因为先用样本算出了 $\bar{X}$，导致 10 个离差满足总和为 0 的线性约束，只有 9 个能自由变化
              correct: true
            - text: 自由度为 10，因为样本里的 10 个观测值彼此独立，代入方差公式时每个数都能任意变动
              why: 虽然有 10 个原始观测，但计算 $S^2$ 时用样本均值 $\bar{X}$ 代替了未知的 $\mu$，损失了 1 个自由度
            - text: 自由度为 8，因为样本均值 $\bar{X}$ 和样本标准差 $S$ 都是由样本估计的，各自消耗 1 个自由度
              why: $T$ 的自由度由分母中的样本方差 $S^2$ 决定，而计算 $S^2$ 只用到了 $\bar{X}$ 这 1 个估计量，只损失 1 个自由度
            - text: 自由度为 11，因为除了 10 个样本观测值之外，分子里还包含总体均值参数 $\mu$
              why: 总体均值 $\mu$ 是固定未知常数，不构成自由变动的观测维度
          explain: |
            $n$ 个离差 $X_i - \bar{X}$ 的和恒等于 0，只要知道了前 $n - 1$ 个，最后一个就被唯一确定了，因此只剩 $n - 1 = 9$ 个自由度。
      - card:
          title: F 分布与三大分布对比
          body: |
            需要同时比较两组独立正态样本的方差时，会用到第三个基本抽样分布——**F 分布（F-distribution）** $F(m, n)$：它定义为两个相互独立的卡方随机变量各自除以自身自由度之后的比值，即 $\frac{U/m}{V/n}$（其中 $U \sim \chi^2(m)$、$V \sim \chi^2(n)$）。卡方、$t$ 与 $F$ 构成了正态推断的基石。
      - item:
          id: match-sampling-dists
          type: match
          prompt: |
            把下面四种统计量构造和对应的抽样分布连起来。
          pairs:
            - ["k 个独立标准正态平方和", "卡方分布"]
            - ["用 S 替代 σ 的正态样本均值比", "t 分布"]
            - ["两独立方差估计（各自除自由度）之比", "F 分布"]
            - ["已知 σ 时的正态样本均值标准化", "标准正态分布"]
          explain: |
            这四大分布构成了正态总体下均值与方差推断的全部基础，后续构造置信区间和做假设检验都要直接用到它们。

  # =====================================================================
  # 第 2 章：估计
  # =====================================================================
  - id: point-estimators
    chapter: 估计
    title: 点估计量、偏差与均方误差
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            为了用 5 个观测值猜出总体方差 $\sigma^2$，有人除以 5，有人除以 4。你觉得为什么统计课本常建议在样本方差公式里除以 $n - 1 = 4$？
          options:
            - text: 除以 $n$ 会系统性低估总体方差，除以 $n - 1$ 才能让期望恰好等于 $\sigma^2$
              correct: true
            - text: 因为样本均值 $\bar{X}$ 已经占用了 1 个样本点，必须把这个点从数据里删掉，只用剩下 $n - 1$ 个点来算方差
              why: 计算样本方差时全部 $n$ 个样本点的离差 $(X_i - \bar{X})^2$ 都参与了求和，并没有删掉任何一个样本点
            - text: 因为除以 $n - 1$ 能缩小估计量的抽样方差，让每次抽样算出的样本方差比除以 $n$ 时波动更小
              why: 除以更小的分母 $n - 1$ 会把数值放大 $\frac{n}{n-1}$ 倍，抽样方差反而略微变大，它的作用是消除偏差而非减小方差
          explain: |
            由于每个样本自己的平均数 $\bar{X}$ 总会贴近自己那几个点，离差平方和 $\sum (X_i - \bar{X})^2$ 的期望只有 $(n-1)\sigma^2$，所以除以 $n-1$ 才能消除系统性低估。
      - card:
          title: 点估计量与点估计值
          body: |
            用样本算一个数字去猜未知总体参数 $\theta$，统称为**点估计（point estimation）**。其中要分清两个角色：
            - **估计量（estimator）**：用随机变量写出的通用公式 $\hat{\Theta} = g(X_1, \dots, X_n)$，比如 $\bar{X}$。在抽样前，它的取值随抽样结果而随机变动。
            - **估计值（estimate）**：把实际测到的具体数据代入公式算出来的那个数字 $\hat{\theta} = g(x_1, \dots, x_n)$，比如 $\bar{x} = 5.10$。它是一个确定的数。
      - item:
          id: estimator-vs-estimate
          type: choice
          prompt: |
            某工厂抽取 20 个零件测得平均直径为 10.04 毫米。下面哪一句把“估计量”和“估计值”区分对了？
          options:
            - text: 公式 $\bar{X}$ 是随抽样波动的随机估计量，算出的 10.04 毫米是这次具体样本代入后得到的确定估计值
              correct: true
            - text: 算出的 10.04 毫米是跨样本波动的估计量，而全体零件的真实平均直径 $\mu$ 是由样本算出的估计值
              why: $\mu$ 是未知的总体参数真值，不是由样本算出的估计值；10.04 是单次样本算出的具体估计值
            - text: 样本容量 $n = 20$ 是点估计量，而 10.04 毫米是未代入数据前的随机统计量
              why: 20 只是预设的样本量；10.04 是代入数据后的确定估计值，通用公式 $\bar{X}$ 才是统计量和估计量
            - text: 估计量和估计值都是确定的常数，区别仅在于估计量有单位而估计值没有单位
              why: 估计量随样本变化而随机波动，估计值是某一次抽样后算出的具体常数，两者都带有相应量纲
          explain: |
            评价一个方法好不好（比如算它的期望和方差），研究的是公式（估计量）；向别人汇报这次测到了多少，给出的是具体数字（估计值）。
      - card:
          title: 偏差与无偏估计
          body: |
            评价一个估计量 $\hat{\Theta}$ 准不准，先看它长期平均会不会整体偏高或偏低。**偏差（bias）**定义为估计量的期望与参数真值之差：
            $$\mathrm{Bias}(\hat{\Theta}) = E[\hat{\Theta}] - \theta$$
            如果对一切可能的参数 $\theta$ 都有 $\mathrm{Bias}(\hat{\Theta}) = 0$（即 $E[\hat{\Theta}] = \theta$），就称 $\hat{\Theta}$ 是**无偏估计**。比如样本均值 $E[\bar{X}] = \mu$ 无偏，样本方差 $S^2 = \frac{1}{n-1}\sum(X_i - \bar{X})^2$ 也是无偏的；若把分母换成 $n$，期望就只有 $\frac{n-1}{n}\sigma^2$，会产生负偏差。
      - item:
          id: sample-variance-unbiased
          type: number
          prompt: |
            测得 4 个独立样本：`10, 12, 14, 16`。用除以 $n - 1$ 的无偏样本方差公式计算 $s^2$，结果是多少？（填小数或分数）
          answer: 6.666667
          tolerance: 0.001
          hint: 先算均值 $\bar{x} = 13$，再求各点到 13 的平方和，最后除以 $4 - 1 = 3$。
          explain: |
            $\bar{x} = 13$，离差平方和为 $(-3)^2 + (-1)^2 + 1^2 + 3^2 = 20$，除以自由度 $4 - 1 = 3$ 得 $s^2 = 20/3 \approx 6.667$。
      - card:
          title: 均方误差与偏差–方差分解
          body: |
            无偏只是“靶心周围平均不歪”，但如果每发子弹散得很开（方差大），单次估计依然不准。把系统偏离和随机离散合在一起衡量的指标，叫**均方误差（mean squared error, MSE）**：
            $$\mathrm{MSE}(\hat{\Theta}) = E[(\hat{\Theta} - \theta)^2]$$
            展开可以分解为两项之和：
            $$\mathrm{MSE}(\hat{\Theta}) = \mathrm{Var}(\hat{\Theta}) + [\mathrm{Bias}(\hat{\Theta})]^2$$
            有时故意引入一点点偏差来换取方差大幅下降，总 MSE 反而更小。这就是统计学与机器学习里反复出现的偏差–方差权衡。
      - card:
          title: 例子：用 MSE 比较两个估计量
          body: |
            假设真值 $\theta = 5$。估计量 A 无偏，方差为 $10$；估计量 B 的期望是 $6$，方差为 $3$。哪个整体更准？
          reveal:
            - title: 第 1 步：计算 A 的均方误差
              body: |
                A 无偏，所以 $\mathrm{Bias}(A) = 0$。代入公式：
                $$\mathrm{MSE}(A) = \mathrm{Var}(A) + 0^2 = 10$$
            - title: 第 2 步：计算 B 的偏差并合成均方误差
              body: |
                B 的偏差为 $6 - 5 = 1$。代入偏差–方差分解：
                $$\mathrm{MSE}(B) = 3 + 1^2 = 4$$
                虽然 B 有一点偏差，但 $\mathrm{MSE}(B) = 4 < 10$，整体平方误差小得多。
      - item:
          id: mse-calc-item
          type: number
          prompt: |
            已知参数真值 $\theta = 10$。某估计量 $\hat{\Theta}$ 的期望是 $12$，方差是 $5$。它的均方误差 $\mathrm{MSE}(\hat{\Theta})$ 是多少？
          answer: 9
          hint: 先算偏差 $E[\hat{\Theta}] - \theta$，再把方差和偏差的平方加起来。
          explain: |
            偏差为 $12 - 10 = 2$，因此 $\mathrm{MSE} = \mathrm{Var} + \mathrm{Bias}^2 = 5 + 2^2 = 9$。
      - item:
          id: bias-variance-tradeoff-choice
          type: choice
          prompt: |
            如果两个估计量都可以用来估计同一个未知参数，下面哪种说法符合均方误差（MSE）的评价逻辑？
          options:
            - text: 有偏估计量只要能大幅降低方差，它的均方误差就可能比无偏估计量更小
              correct: true
            - text: 无偏估计量的均方误差一定小于任何有偏估计量，因为一旦存在系统性偏差，平方误差就会随着样本量增大而无限累积
              why: 均方误差还包含方差一项；无偏但方差很大时，MSE 往往高于低方差的有偏估计量
            - text: 均方误差等于估计量的抽样标准差与偏差两项直接相加
              why: MSE 等于方差加上偏差的平方，两项都是参数单位的平方量纲
            - text: 有偏估计量的偏差和方差都不会随样本量变化，因此增大样本量无法降低它的均方误差
              why: 许多有偏估计量（如除以 $n$ 的样本方差）的偏差和方差都会随 $n$ 增大而趋于 0
          explain: |
            均方误差把“不歪”（低偏差）和“不抖”（低方差）放在同一把尺子上比较，允许我们在必要时用轻微偏差换取更稳定的结果。

  - id: sufficiency-mom
    chapter: 估计
    title: 充分统计量与矩估计
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            你连续抛同一枚硬币 100 次，想估计它的正面概率 $p$。如果朋友只告诉你“一共出现了 62 次正面”，没告诉你具体哪几次是正面，你觉得关于 $p$ 的信息丢失了吗？
          options:
            - text: 没有丢失，独立同分布伯努利试验里，正面总次数已经包含关于 $p$ 的全部信息
              correct: true
            - text: 丢失了，因为第 1 次出正面和第 100 次出正面对参数 $p$ 的权重不同，不知道具体先后顺序就无法写出似然函数
              why: 每次抛掷相互独立且成功概率同为 $p$，联合概率只通过总成功次数 $\sum x_i$ 依赖 $p$，与先后次序无关
            - text: 丢失了，因为如果前 62 次连续出现正面、后 38 次连续反面，推出来的 $p$ 估计值会比交替出现时大得多
              why: 在独立同分布假设下，只要总正面数都是 62，任何一种排列顺序对应的似然函数都只差一个不含 $p$ 的常数因子
          explain: |
            一旦知道了正面总数 $\sum X_i = 62$，在它固定的条件下，具体顺序的概率只剩一个组合数的倒数，和参数 $p$ 没有关系。这就是“充分统计量”的直觉。
      - card:
          title: 充分统计量与因子分解定理
          body: |
            如果知道统计量 $T(X_1, \dots, X_n)$ 的值以后，原始样本的条件分布不再依赖未知参数 $\theta$，就说明 $T$ 把样本中关于 $\theta$ 的全部信息都压缩干净了，称为**充分统计量（sufficient statistic）**。
            逐个算条件分布很麻烦，实际常用 Fisher–Neyman **因子分解定理（factorization theorem）**：$T(\mathbf{x})$ 是 $\theta$ 的充分统计量，当且仅当联合概率（或联合密度）能拆成两项乘积：
            $$f(\mathbf{x}; \theta) = g\big(T(\mathbf{x}); \theta\big) \cdot h(\mathbf{x})$$
            其中 $g$ 只通过 $T(\mathbf{x})$ 和 $\theta$ 发生关系，而 $h(\mathbf{x})$ 完全不含参数 $\theta$。
      - item:
          id: factorization-poisson
          type: choice
          prompt: |
            设 $X_1, \dots, X_n$ 独立同分布于 $\mathrm{Poisson}(\lambda)$，联合概率质量函数为：
            $$f(\mathbf{x}; \lambda) = e^{-n\lambda} \lambda^{\sum x_i} \cdot \frac{1}{\prod_{i=1}^n x_i!}$$
            根据因子分解定理，下面哪个统计量对 $\lambda$ 是充分的？
          options:
            - text: $T(\mathbf{x}) = \sum_{i=1}^n X_i$（样本总和，或其除以 $n$ 后的样本均值 $\bar{X}$）
              correct: true
            - text: $T(\mathbf{x}) = X_1 + X_n$（只保留首尾两个观测值之和）
              why: 中间 $X_2, \dots, X_{n-1}$ 对应的幂次 $\lambda^{\sum_{i=2}^{n-1} x_i}$ 依然含 $\lambda$，无法被归入不含 $\lambda$ 的 $h(\mathbf{x})$
            - text: $T(\mathbf{x}) = \prod_{i=1}^n X_i!$（各观测值阶乘的连乘积）
              why: 这一项恰恰落在不含 $\lambda$ 的 $h(\mathbf{x})$ 部分里，本身不携带关于 $\lambda$ 的位置信息
            - text: $T(\mathbf{x}) = X_{(n)} - X_{(1)}$（样本最大值与最小值之差）
              why: 联合分布里 $\lambda$ 只通过总和 $\sum x_i$ 出现，单靠极差无法唯一确定样本总和
          explain: |
            联合概率里的含参部分 $e^{-n\lambda}\lambda^{\sum x_i}$ 只依赖于样本和 $\sum x_i$，而 $\frac{1}{\prod x_i!}$ 不含 $\lambda$，所以 $\sum X_i$（以及与之等价的 $\bar{X}$）是充分统计量。
      - card:
          title: 矩估计法（Method of Moments）
          body: |
            有了评价标准和压缩信息的工具，怎么从零构造一个点估计？最直观的通用做法是**矩估计（method of moments）**。
            做法很简单：算总体分布的前 $k$ 阶理论矩（例如一阶矩 $E[X]$，二阶原点矩 $E[X^2]$），再让它们等于样本算出的对应样本矩 $m_1 = \bar{X}$、$m_2 = \frac{1}{n}\sum X_i^2$，联立解出参数。矩估计思路直接、常有现成解析式，虽然不一定达到最小方差，却是很好的起始估计。
      - card:
          title: 例子：用矩估计求均匀分布端点
          body: |
            假设 $X_1, \dots, X_n \stackrel{\text{i.i.d.}}{\sim} \mathrm{Uniform}(0, \theta)$。已知抽到的 4 个样本是 `1.2, 2.8, 3.5, 4.5`，怎样用矩估计猜 $\theta$？
          reveal:
            - title: 第 1 步：写出总体一阶矩并令它等于样本均值
              body: |
                $\mathrm{Uniform}(0, \theta)$ 的理论期望是 $E[X] = \frac{\theta}{2}$。令 $\frac{\hat{\theta}}{2} = \bar{X}$，解得 $\hat{\theta}_{\text{MoM}} = 2\bar{X}$。
            - title: 第 2 步：代入具体样本算出数值
              body: |
                样本均值 $\bar{x} = \frac{1.2 + 2.8 + 3.5 + 4.5}{4} = 3.0$，因此 $\hat{\theta}_{\text{MoM}} = 2 \times 3.0 = 6.0$。
      - item:
          id: mom-exp-item
          type: number
          prompt: |
            设 $X_1, \dots, X_n$ 独立同分布于指数分布 $\mathrm{Exp}(\lambda)$，其理论期望 $E[X] = \frac{1}{\lambda}$。现测得一组等待时间的样本均值 $\bar{x} = 2.5$ 分钟，则 $\lambda$ 的矩估计值 $\hat{\lambda}_{\text{MoM}}$ 是多少？
          answer: 0.4
          hint: 令 $1/\hat{\lambda} = \bar{x}$ 并解出 $\hat{\lambda}$。
          explain: |
            令一阶理论矩等于一阶样本矩：$\frac{1}{\hat{\lambda}} = \bar{x} = 2.5$，解得 $\hat{\lambda}_{\text{MoM}} = \frac{1}{2.5} = 0.4$。
      - item:
          id: mom-uniform-ab-item
          type: number
          prompt: |
            某分布为两参数均匀分布 $\mathrm{Uniform}(a, b)$，其理论期望为 $\frac{a+b}{2}$、理论方差为 $\frac{(b-a)^2}{12}$。现测得样本均值 $\bar{x} = 5$，且用样本均值替代二阶中心矩（令 $\frac{(b-a)^2}{12} = 3$）。由此解出上端点矩估计值 $\hat{b}$ 是多少？（注意 $b > a$）
          answer: 8
          hint: 先由 $(b-a)^2/12 = 3$ 求出区间宽度 $b - a$，再和 $(a+b)/2 = 5$ 联立。
          explain: |
            由 $\frac{(\hat{b}-\hat{a})^2}{12} = 3$ 得 $\hat{b} - \hat{a} = 6$；又由 $\frac{\hat{a}+\hat{b}}{2} = 5$ 得 $\hat{a} + \hat{b} = 10$。两式相加除以 2 得 $\hat{b} = 8$（同时 $\hat{a} = 2$）。
      - item:
          id: sufficiency-summary-choice
          type: choice
          prompt: |
            关于充分统计量和矩估计，下面哪一句描述准确？
          options:
            - text: 充分统计量保留了样本中关于参数的全部信息；矩估计通过令样本矩等于总体理论矩来解出参数
              correct: true
            - text: 矩估计解出来的估计量一定是充分统计量的函数，并且在任何有限样本下都能自动保证无偏性和最小方差
              why: 矩估计有时并不充分（例如 $\mathrm{Uniform}(0, \theta)$ 的 $2\bar{X}$ 就没用到充分统计量 $X_{(n)}$），经非线性反解后也常常有偏
            - text: 只要样本是独立同分布抽取的，样本均值 $\bar{X}$ 对任何概率分布族都是未知参数的充分统计量
              why: 样本均值对正态、泊松、二项等分布充分，但对均匀分布 $\mathrm{Uniform}(0, \theta)$ 或柯西分布并不是充分统计量
            - text: 因子分解定理只适用于带概率质量函数的离散型分布，连续型分布必须直接积分求条件分布
              why: 因子分解定理对离散联合概率质量函数和连续联合概率密度函数同样成立
          explain: |
            因子分解定理帮我们认出哪些数据摘要没丢信息；矩估计则提供了一种随时能动手的快速估计方案。

  # =====================================================================
  # 第 3 章：渐近理论与决策
  # =====================================================================
  - id: consistency-delta
    chapter: 渐近理论与决策
    title: 相合性与 Delta 方法
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            前面看到，除以 $n$ 的样本方差 $\hat{\sigma}^2 = \frac{1}{n}\sum (X_i - \bar{X})^2$ 在小样本下系统性偏小（有偏）。如果样本量从 10 涨到 100 万，它还会一直偏离真实方差 $\sigma^2$ 吗？
          options:
            - text: 不会，系数 $(n-1)/n$ 随样本量增大趋近于 1，它会收敛到真实方差 $\sigma^2$
              correct: true
            - text: 会一直偏离，因为有偏估计量的系统性偏差是固定不变的常数，即使把样本量增加到一百万也无法向真实方差 $\sigma^2$ 靠近
              why: 除以 $n$ 的样本方差偏差为 $-\sigma^2/n$，会随 $n \to \infty$ 缩小到 0，同时方差也趋于 0，因此在大样本下收敛到真值
            - text: 会偏离得越来越远，因为分母里的 $n$ 趋于无穷大，整个分式最终会收敛到 0
              why: 分子里有 $n$ 项离差平方和也在按 $n$ 的比例增长，除以 $n$ 后收敛到平均平方离差 $\sigma^2$ 而非 0
          explain: |
            有限样本下的“无偏”和样本趋于无穷时的“收敛到真值”是两回事。描述大样本下是否收敛的性质，叫相合性。
      - card:
          title: 相合性与渐近正态性
          body: |
            当样本量 $n \to \infty$ 时，如果估计量序列 $\hat{\theta}_n$ 依概率收敛到参数真值 $\theta$（也就是说偏离超过任意正数 $\varepsilon$ 的概率趋近于 0），就称 $\hat{\theta}_n$ 具有**相合性（consistency）**，也叫一致估计。
            判断相合性的一个方便条件是：如果 $n \to \infty$ 时 $\mathrm{MSE}(\hat{\theta}_n) = \mathrm{Var}(\hat{\theta}_n) + [\mathrm{Bias}(\hat{\theta}_n)]^2 \to 0$，它就必定相合。进一步，许多常用估计量乘上 $\sqrt{n}$ 后还满足渐近正态性：
            $$\sqrt{n}(\hat{\theta}_n - \theta) \xrightarrow{d} N(0, v^2)$$
            也就是在大样本下，$\hat{\theta}_n$ 近似服从均值 $\theta$、方差 $v^2/n$ 的正态分布。
      - item:
          id: consistency-vs-unbiased
          type: choice
          prompt: |
            下面关于“无偏性”和“相合性”的关系，哪一项是正确的？
          options:
            - text: 有偏估计量也可能是相合的（如除以 $n$ 的样本方差），只要偏差和方差都随 $n \to \infty$ 趋于 0 即可
              correct: true
            - text: 无偏性和相合性互为充要条件：凡是有限样本下无偏的估计量，大样本下都依概率收敛到真值
              why: 两者不等价：只取第一个观测值 $X_1$ 来估计总体均值是无偏的，但方差始终等于 $\sigma^2$、不随 $n$ 缩小，因此不相合
            - text: 只要估计量的方差随样本量增大趋于 0，即使偏差恒等于固定常数 2，该估计量依然具有相合性
              why: 方差趋于 0 但偏差恒为 2 时，估计量会收敛到 $\theta + 2$ 而不是真值 $\theta$
            - text: 样本均值 $\bar{X}$ 对一切连续型分布都具有相合性，包括期望不存在的柯西分布
              why: 柯西分布没有有限期望，其样本均值与单个观测服从相同的分布，不会随样本量增大而集中
          explain: |
            抓稳关键反例：$X_1$ 是无偏却不相合的，$\frac{1}{n}\sum(X_i - \bar{X})^2$ 是有偏却相合的。大样本里更看重相合性。
      - item:
          id: se-sample-size-scale
          type: number
          prompt: |
            某估计量的标准误按 $c/\sqrt{n}$ 的速度缩小。当样本量 $n = 25$ 时，测得它的标准误是 $0.6$。如果想把标准误压缩到 $0.15$，样本量 $n$ 需要提高到多少？
          answer: 400
          hint: 要让标准误缩小到原来的 $1/4$，根号下的 $n$ 要放大多少倍？
          explain: |
            标准误从 $0.6$ 降到 $0.15$ 是原来的 $1/4$，由于标准误反比于 $\sqrt{n}$，所以 $\sqrt{n}$ 必须变成原来的 4 倍，样本量需要放大 $4^2 = 16$ 倍，即 $25 \times 16 = 400$。
      - card:
          title: Delta 方法：把分布传播给函数
          body: |
            假如我们已经知道 $\hat{\theta}_n$ 的渐近方差（例如知道样本均值 $\bar{X}$ 的标准误），但我们真正关心的参数是它的光滑非线性函数 $g(\theta)$，比如 $\theta^2$、$1/\theta$ 或对数赔率 $\ln\frac{p}{1-p}$。怎么求 $g(\hat{\theta}_n)$ 的大样本分布和标准误？
            只要导数 $g'(\theta) \neq 0$，把函数在真值 $\theta$ 处做一阶**线性近似**：
            $$g(\hat{\theta}_n) - g(\theta) \approx g'(\theta)(\hat{\theta}_n - \theta)$$
            两边同时传播方差，就得到 **Delta 方法（Delta method）**：如果 $\sqrt{n}(\hat{\theta}_n - \theta) \xrightarrow{d} N(0, \sigma^2)$，那么：
            $$\sqrt{n}\big(g(\hat{\theta}_n) - g(\theta)\big) \xrightarrow{d} N\big(0, [g'(\theta)]^2 \sigma^2\big)$$
      - card:
          title: 例子：用 Delta 方法估算变换后的标准误
          body: |
            假设某批零件平均边长的估计值 $\bar{X}$ 服从渐近正态，真值 $\mu = 3$，标准误 $\mathrm{SE}(\bar{X}) = 0.2$。想估计正方形面积 $g(\mu) = \mu^2$，它的近似标准误是多少？
          reveal:
            - title: 第 1 步：求出变换函数在均值处的导数
              body: |
                函数 $g(\mu) = \mu^2$ 的导数是 $g'(\mu) = 2\mu$。代入 $\mu = 3$ 得斜率放大倍数 $g'(3) = 6$。
            - title: 第 2 步：把标准误乘上斜率的大小
              body: |
                由 Delta 方法的方差关系 $\mathrm{Var}(g(\bar{X})) \approx [g'(\mu)]^2 \mathrm{Var}(\bar{X})$，两边开平方即得近似标准误：
                $$\mathrm{SE}(\bar{X}^2) \approx |g'(3)| \cdot \mathrm{SE}(\bar{X}) = 6 \times 0.2 = 1.2$$
      - item:
          id: delta-reciprocal-se
          type: number
          prompt: |
            已知某种服务平均耗时 $\mu = 2$ 秒，样本均值 $\bar{X}$ 的标准误为 $\mathrm{SE}(\bar{X}) = 0.2$ 秒。用速度指标 $g(\mu) = 1/\mu$（每秒处理次数）做变换时，利用 Delta 方法算出的 $1/\bar{X}$ 的近似标准误是多少？
          answer: 0.05
          hint: 先求 $g(\mu) = \mu^{-1}$ 在 $\mu = 2$ 处的导数大小 $|g'(2)|$，再乘上 $\mathrm{SE}(\bar{X})$。
          explain: |
            $g'(\mu) = -\frac{1}{\mu^2}$，在 $\mu = 2$ 处有 $|g'(2)| = \frac{1}{4} = 0.25$。因此 $\mathrm{SE}(1/\bar{X}) \approx 0.25 \times 0.2 = 0.05$。
      - item:
          id: delta-zero-deriv-failure
          type: choice
          prompt: |
            应用一阶 Delta 方法时有一个前提条件 $g'(\theta) \neq 0$。如果恰巧在真值处 $g'(\theta) = 0$（例如 $g(\theta) = \theta^2$ 且真值 $\theta = 0$），会发生什么？
          options:
            - text: 一阶线性项完全消失，方法得出渐近方差为 0 的退化结果，需要改用二阶泰勒展开
              correct: true
            - text: 函数 $g(\hat{\theta}_n)$ 的标准误确实精确等于 0，没有任何波动
              why: 即使 $\theta = 0$，样本估计值 $\hat{\theta}_n$ 依然波动，其平方 $\hat{\theta}_n^2$ 仍以 $1/n$ 尺度分布（类似卡方分布），不会恒为 0
            - text: 估计量会失去相合性，不再收敛到 $g(\theta)$
              why: 由连续映射定理，只要 $g$ 连续，相合性依然成立，只是收敛速度和极限分布形状变了
            - text: 必须改用阶乘展开，因为泰勒展开只能在 $x=1$ 处用
              why: 泰勒展开可以在任意光滑点 $\theta$ 处做，只是一阶导数为 0 时主力落在二阶项 $\frac{1}{2}g''(\theta)(\hat{\theta}-\theta)^2$ 上
          explain: |
            一阶近似在极值点处是一条水平线，看不到二阶弯曲造成的波动；此时 $\hat{\theta}_n^2$ 在 $\theta=0$ 附近实际趋向缩放后的卡方分布而非正态分布。

  - id: errors-and-power
    chapter: 渐近理论与决策
    title: 零假设与两类错误
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            你设计了一套烟雾报警器，在收到传感数据后只能报“起火”或“正常”两种决定。为了不错过任何一次真火灾，你把触发阈值调得很低，稍微有一点烟尘就响。这样会带来什么代价？
          options:
            - text: 漏报火灾的概率降低了，但平时没起火却误报警的概率会显著上升
              correct: true
            - text: 只要固定传感器采样次数不变，把触发阈值调低就能同时压低误报率和漏报率，让两类错误一起趋近于零
              why: 只要正常油烟信号与真实起火信号的分布存在重叠，固定样本量下调低门槛必然会在减少漏报的同时增加误报
            - text: 误报率和漏报率会按相同比例一起下降
              why: 固定样本量时两者此消彼长，降低其中一种错误率需要以升高另一种错误率为代价
          explain: |
            二元统计决策总要面对这两种反向风险：没情况却报警的“误报”和真有情况却没发现的“漏报”。
      - card:
          title: 从质检判例到零假设与备择假设
          body: |
            某饮料厂规定每瓶饮料标准净含量为 $500$ 毫升。质检员随机抽查一批饮料称重，要根据样本均值做出“产线正常”或“灌装偏少、停机检修”的决定。
            在统计学里，我们先把“产线正常、没有系统性偏差（$\mu = 500$）”立为默认站在它这一边的基准主张，称为**零假设（null hypothesis）**，记作 $H_0$；把“存在我们想要抓出来的真实偏差（如 $\mu < 500$ 或 $\mu \neq 500$）”立为对立主张，称为**备择假设（alternative hypothesis）**，记作 $H_1$。检验的思路是：除非样本偏离 $500$ 毫升太多、在 $H_0$ 下很难发生，否则不轻易推翻 $H_0$。
      - card:
          title: 显著性水平与两类错误
          body: |
            因为只能看见有限样本，针对 $H_0$ 的决定可能犯两类不同方向的错误：
            - **第一类错误（Type I error）**：$H_0$ 实际上为真（产线正常），检验却错误地拒绝了 $H_0$（误报停机）。事先设定的第一类错误最大允许概率上限，称为**显著性水平（significance level）**，记作 $\alpha$（常取 $0.05$ 或 $0.01$）。
            - **第二类错误（Type II error）**：$H_0$ 实际上为假（$H_1$ 成立，灌装确实失准），检验却没能拒绝 $H_0$（漏报放行），发生概率记作 $\beta$。
      - item:
          id: match-decision-matrix
          type: match
          prompt: |
            在质量检验决策中（$H_0$：批次合格；$H_1$：批次不合格），把下面四种情形和对应的统计术语配对。
          pairs:
            - ["批次其实合格，却被判为不合格", "第一类错误（概率 α）"]
            - ["批次其实不合格，却被放行通过", "第二类错误（概率 β）"]
            - ["批次确实不合格，且成功被检出", "正确检出（概率 1 − β）"]
            - ["批次确实合格，且正确放行", "正确保留（概率 1 − α）"]
          explain: |
            把这四个格子画成 $2 \times 2$ 决策表：第一列（$H_0$ 为真）两格概率之和为 1，第二列（$H_1$ 为真）两格概率之和也为 1。
      - card:
          title: 例子：调整判定门槛时 α 与 β 怎样拉锯
          body: |
            在样本量 $n$ 固定的前提下，如果我们害怕误报停机造成损失，把显著性水平从 $\alpha = 0.05$ 收紧到 $\alpha = 0.01$，两类错误会怎样变化？
          reveal:
            - title: 第 1 步：看拒绝门槛往哪个方向移动
              body: |
                收紧 $\alpha$ 意味着要求证据更极端才肯拒绝 $H_0$（例如双侧标准正态临界值从 $1.96$ 提高到 $2.58$），拒绝域变小了。
            - title: 第 2 步：看对第二类错误 β 的影响
              body: |
                因为拒绝门槛变严，当产线真有轻微偏移（$H_1$ 为真）时，样本统计量更难跨过 $2.58$ 这道高门槛，于是“没能拒绝 $H_0$”的漏报概率 $\beta$ 反而会上升。
      - item:
          id: alpha-beta-tradeoff-choice
          type: choice
          prompt: |
            在样本量 $n$ 和测量噪声 $\sigma$ 都固定不变的前提下，如果把检验的显著性水平从 $\alpha = 0.05$ 收紧到 $\alpha = 0.01$，会发生什么？
          options:
            - text: 拒绝 $H_0$ 的临界门槛变高，犯第一类错误的概率上限降为 0.01，但犯第二类错误的概率 $\beta$ 会随之增大
              correct: true
            - text: 拒绝门槛变得更严格，因此第一类错误率 $\alpha$ 和第二类错误率 $\beta$ 会同时降到 0.01 以下
              why: 固定样本量下门槛升高会让真实有偏差的样本也更难跨过门槛，漏报概率 $\beta$ 会上升而不是下降
            - text: 第二类错误率 $\beta$ 会自动等于 $1 - \alpha = 0.99$，因为两类错误的概率之和恒等于 1
              why: $\alpha$ 是在 $H_0$ 为真条件下的错误概率，$\beta$ 是在 $H_1$ 为真条件下的错误概率，两者条件不同，加和并不等于 1
            - text: 只要把 $\alpha$ 改成 0.01，样本均值的抽样标准误就会自动缩小为原来的五分之一
              why: 抽样标准误 $\sigma/\sqrt{n}$ 只取决于总体标准差和样本量 $n$，不会因为调整判定阈值 $\alpha$ 而改变
          explain: |
            固定样本量时，$\alpha$ 和 $\beta$ 就像跷跷板的两头：把误报门槛压低，漏报风险就会翘起来；而且 $\alpha$ 与 $\beta$ 分别属于 $H_0$ 为真和 $H_1$ 为真两个不同条件下的概率，不能写成 $\alpha + \beta = 1$。

  - id: power-and-sample-size
    chapter: 渐近理论与决策
    title: 检验功效与样本量规划
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            既然在固定样本量下，压低误报率 $\alpha$ 就会推高漏报率 $\beta$，那如果我们既不肯放宽误报上限 $\alpha = 0.05$，又想把真有偏差时的检出把握提高到 80% 以上，该怎么办？
          options:
            - text: 增加样本量 $n$，让样本均值的抽样分布变窄，把零假设与备择假设的分布峰分得更开
              correct: true
            - text: 保持原来的小样本数据不变，只靠把检验统计量的分子和分母同时乘以 10 来放大信号
              why: 分子分母同乘常数不会改变统计量的数值和分布重叠程度，无法减少任何一类错误
            - text: 在看到样本数据之后，临时根据数据偏向哪一边来事后修改零假设的基准值 $\mu_0$
              why: 看完数据再改假设会破坏显著性水平 $\alpha$ 的概率含义，导致误报率失控
          explain: |
            增大样本量 $n$ 会让标准误 $\sigma/\sqrt{n}$ 缩小，$H_0$ 与 $H_1$ 下的两座抽样分布钟形曲线不再大幅重叠，从而同时保住低 $\alpha$ 和低 $\beta$。
      - card:
          title: 检验功效与功效函数
          body: |
            当备择假设 $H_1$ 为真时，检验能够正确拒绝 $H_0$ 的概率 $1 - \beta$，称为**检验功效（power）**，也就是“真有偏差信号时把它检出来的能力”。
            由于备择假设通常包含一整段参数取值（如 $\mu \neq \mu_0$），在不同真实参数 $\theta$ 下拒绝 $H_0$ 的概率 $W(\theta) = P_\theta(\text{拒绝 } H_0)$ 组成了**功效函数（power function）**。在 $\theta = \theta_0$ 处，功效函数的值就是第一类错误率 $\alpha$；当真实参数离基准值越远（效应 $|\theta - \theta_0|$ 越大）、样本量 $n$ 越大或总体噪声 $\sigma$ 越小时，功效 $W(\theta)$ 就越接近 $1$。
      - item:
          id: power-from-beta
          type: number
          prompt: |
            在某个真实效应下，一次检测发生第二类错误（漏报）的概率是 $\beta = 0.15$。那么这次检验在该效应下的检验功效是多少？
          answer: 0.85
          hint: 在备择假设为真的前提下，只有“正确拒绝零假设”和“犯第二类错误”两种互补结果。
          explain: |
            检验功效等于 $1 - \beta = 1 - 0.15 = 0.85$，也就是在备择假设成立时有 85% 的概率正确拒绝 $H_0$。
      - card:
          title: 样本量规划公式是怎么来的
          body: |
            在正态均值检验 $H_0: \mu = \mu_0$（总体标准差 $\sigma$ 已知）中，假设我们希望当真实均值偏移了 $\Delta = |\mu_1 - \mu_0|$ 时，既守住双侧显著性水平 $\alpha$，又达到目标功效 $1 - \beta$。
            从几何上看，拒绝门槛离基准值 $\mu_0$ 的距离是 $z_{\alpha/2}$ 个标准误；为了让 $\mu_1$ 处有 $1-\beta$ 的概率跨过这道门槛，$\mu_1$ 到门槛的距离还要留出 $z_\beta$ 个标准误。两段加起来，真实间距 $\Delta$ 应满足：
            $$\Delta \approx (z_{\alpha/2} + z_\beta)\frac{\sigma}{\sqrt{n}} \implies n \approx \left(\frac{(z_{\alpha/2} + z_\beta)\sigma}{\Delta}\right)^2$$
      - card:
          title: 例子：同时保住 α 和功效所需的样本量
          body: |
            取双侧显著性水平 $\alpha = 0.05$（$z_{0.025} \approx 1.96$）、目标功效 $80\%$（$\beta = 0.20, z_{0.20} \approx 0.84$）。设总体标准差 $\sigma = 10$，想检出的最小真实差值为 $\Delta = 5$，至少要抽多少个样本？
          reveal:
            - title: 第 1 步：代入临界值、标准差与目标差值
              body: |
                将 $z_{\alpha/2} + z_\beta = 1.96 + 0.84 = 2.80$、$\sigma = 10$、$\Delta = 5$ 代入公式：
                $$n \approx \left(\frac{2.80 \times 10}{5}\right)^2 = 5.6^2 = 31.36$$
            - title: 第 2 步：向上取整得到实际样本量
              body: |
                样本个数必须是整数，若只取 $31$ 个则功效会略低于 $80\%$，因此向上取整需要 $32$ 个观测。
      - item:
          id: sample-size-calc
          type: number
          prompt: |
            用公式 $n = \left(\frac{(z_{\alpha/2} + z_\beta)\sigma}{\Delta}\right)^2$ 规划实验。已知 $\sigma = 8$，想检出差值 $\Delta = 4$，且查表得阈值系数和 $z_{\alpha/2} + z_\beta = 3.0$。至少需要抽取多少个样本？
          answer: 36
          hint: 把已知数字直接代入平方公式里算一遍。
          explain: |
            $n = \left(\frac{3.0 \times 8}{4}\right)^2 = 6^2 = 36$ 个样本。若想检出小一半的差值（$\Delta = 2$），样本量就要翻 4 倍到 144。
      - item:
          id: power-factors-choice
          type: choice
          prompt: |
            下面哪项操作会让检验功效（power）**下降**？
          options:
            - text: 把样本量从 100 减到 25，同时把 $\alpha$ 从 0.05 收紧到 0.01
              correct: true
            - text: 保持显著性水平 $\alpha = 0.05$ 不变，将实验样本量从 $n = 25$ 扩大到 $n = 100$ 以减小标准误
              why: 样本量增大后标准误缩小，同样的真实效应更容易跨过临界值，功效会上升
            - text: 待检出的真实参数偏移量 $\Delta = |\mu_1 - \mu_0|$ 比原先设想的数值更大
              why: 真实效应离零假设基准值越远，备择分布落在拒绝域内的面积越大，功效会上升
            - text: 改进测量仪器以降低单次观测的噪声标准差 $\sigma$
              why: 噪声标准差 $\sigma$ 越小，标准误 $\sigma/\sqrt{n}$ 越小，信噪比和检验功效都更高
          explain: |
            样本量变少会加大抽样波动，同时把显著性水平 $\alpha$ 压得更严（门槛变高），两件事都会让检出真实信号变得更难，从而降低功效。

  - id: bayesian-decision
    chapter: 渐近理论与决策
    title: 贝叶斯更新、后验估计与可信区间
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            拿出一枚刚拆封的新硬币抛 3 次，恰好全是正面。频率派的最大化想法会直接猜正面概率是 $3/3 = 1$；但大多数人直觉还是猜它在 $0.5$ 到 $0.7$ 之间。为什么？
          options:
            - text: 因为抛硬币前你心里已有“普通硬币大多接近均匀”的先验认识
              correct: true
            - text: 因为样本量小于 30 时概率乘法法则不成立，3 次全正面的观测数据在统计推断里不能提供关于参数的方向信息
              why: 3 次独立抛掷依然遵循乘法法则并提供偏向正面的证据，只是数据量还小，没能压过先前的经验
            - text: 因为二项分布里的成功概率参数 $p$ 在数学定义上不允许取到边界值 1
              why: 退化情形下 $p$ 可以等于 1；大家不猜 1 是因为仅凭 3 次正面不足以推翻“普通硬币近似对称”的先验信念
          explain: |
            把观测前的先验信念和观测到的数据证据用贝叶斯定理结合起来，就是贝叶斯推断的起点。
      - card:
          title: 主观概率与贝叶斯更新
          body: |
            在前面几课里，未知参数 $\theta$ 是一个固定但不知道的常数，只有抽样数据是随机的（频率派视角）。
            在贝叶斯视角下，概率用来度量对未知事物的不确定信念，因此也可以给参数 $\theta$ 配一个概率分布：观测前叫**先验分布** $p(\theta)$；看到样本 $\mathbf{x}$ 后，利用**贝叶斯定理**更新得到的条件分布称为**后验分布（posterior distribution）**：
            $$p(\theta \mid \mathbf{x}) \propto p(\theta) \cdot p(\mathbf{x} \mid \theta)$$
            其中 $p(\mathbf{x} \mid \theta)$ 恰好就是把参数代入样本概率算出来的乘积。
      - card:
          title: 损失函数与贝叶斯估计
          body: |
            有了后验分布 $p(\theta \mid \mathbf{x})$，如果要拿出一个具体的数字 $a$ 当作最终点估计，该选哪个数？这取决于猜错了有多大代价。用**损失函数（loss function）** $L(\theta, a) \ge 0$ 度量用 $a$ 代替真值 $\theta$ 付出的损失。
            使后验期望损失 $E[L(\theta, a) \mid \mathbf{x}]$ 达到最小的那个数，就是**贝叶斯估计（Bayes estimator）**：
            - 当采用**平方误差损失** $L(\theta, a) = (a - \theta)^2$ 时，求导令为 0 恰好得出：最优估计 $a^*$ 就是**后验均值** $E[\theta \mid \mathbf{x}]$。
            - 当采用一阶离差损失 $L(\theta, a) = |a - \theta|$ 时，最优估计则是**后验中位数**。
      - item:
          id: bayes-loss-discrete
          type: number
          prompt: |
            经过贝叶斯更新后，参数 $\theta$ 只有两种可能：$\theta = 0.2$ 的后验概率是 $0.3$，$\theta = 0.8$ 的后验概率是 $0.7$。若采用平方误差损失 $L(\theta, a) = (a - \theta)^2$，最优的贝叶斯估计值（即后验均值）是多少？
          answer: 0.62
          hint: 按后验概率为权重计算两个可能值的加权平均。
          explain: |
            平方损失下最优的贝叶斯估计是后验均值：$E[\theta \mid \mathbf{x}] = 0.3 \times 0.2 + 0.7 \times 0.8 = 0.06 + 0.56 = 0.62$。
      - card:
          title: 例子：Beta 先验与二项更新
          body: |
            对于区间 $[0, 1]$ 上的正面概率 $p$，常用形式为 $p(\theta) \propto \theta^{\alpha - 1}(1 - \theta)^{\beta - 1}$ 的 Beta($\alpha, \beta$) 先验，它的均值是 $\frac{\alpha}{\alpha+\beta}$。在观测到 $n$ 次试验里有 $k$ 次成功后，后验分布怎么变？
          reveal:
            - title: 第 1 步：把先验和二项概率项相乘
              body: |
                二项数据给出的权重正比于 $\theta^k(1-\theta)^{n-k}$。乘上先验 $\theta^{\alpha-1}(1-\theta)^{\beta-1}$，指数直接相加，得到后验仍然是一个 Beta 分布：
                $$p(\theta \mid k) \propto \theta^{(\alpha + k) - 1}(1-\theta)^{(\beta + n - k) - 1}$$
                即 $\mathrm{Beta}(\alpha + k, \beta + n - k)$。
            - title: 第 2 步：代入具体数值算后验均值
              body: |
                取先验 $\mathrm{Beta}(2, 2)$（先验均值 $0.5$，相当于提前假想过 2 次正面、2 次反面）。投 10 次看到 7 次正面后，后验变为 $\mathrm{Beta}(2+7, 2+3) = \mathrm{Beta}(9, 5)$，平方损失下的贝叶斯估计为 $\frac{9}{9+5} = \frac{9}{14} \approx 0.643$——被先验轻轻拉回了 0.5 方向。
      - item:
          id: beta-binomial-update
          type: number
          prompt: |
            对硬币正面概率 $\theta$ 选用均匀先验 $\mathrm{Beta}(1, 1)$。随后实测 4 次得到 3 次正面、1 次反面。此时后验分布为 $\mathrm{Beta}(1+3, 1+1) = \mathrm{Beta}(4, 2)$，其后验均值是多少？（填小数或分数）
          answer: 0.666667
          tolerance: 0.001
          hint: $\mathrm{Beta}(\alpha', \beta')$ 的均值公式是 $\alpha' / (\alpha' + \beta')$。
          explain: |
            $\mathrm{Beta}(4, 2)$ 的后验均值为 $\frac{4}{4+2} = \frac{2}{3} \approx 0.667$。随着 $n$ 变大，先验里的 1 会被数据淹没，后验均值会慢慢靠近 $k/n$。
      - card:
          title: 可信区间与两种损失的直觉
          body: |
            拿到后验分布后，可以直接从后验密度中切出一块包含 $95\%$ 后验概率的区域 $[L, U]$（满足 $P(L \le \theta \le U \mid \mathbf{x}) = 0.95$），称为 $95\%$ **可信区间（credible interval）**。
            注意区分概念：在贝叶斯框架里，$\theta$ 是带有分布的随机变量，所以真的可以说“看到这批数据后，我认为 $\theta$ 落在这个可信区间里的概率是 95%”；而在频率派框架里，参数是固定常数，置信区间的 95% 指的是“构造规则在长期重复抽样中有 95% 的机会盖住真值”。
      - item:
          id: credible-vs-confidence
          type: choice
          prompt: |
            关于贝叶斯可信区间和损失函数下的贝叶斯估计，下面哪一句表述正确？
          options:
            - text: 给定观测数据后，95% 可信区间表示未知参数落入该区间的后验概率为 95%
              correct: true
            - text: 无论是选用平方误差损失函数还是选用一阶离差损失函数，求出来的最优贝叶斯点估计都恒等于后验密度最高处的后验众数
              why: 平方损失给出后验均值，一阶离差损失给出后验中位数；只有 0-1 损失才对应后验众数
            - text: 当样本量趋于无穷大时，先验分布的权重始终与样本似然持平，后验均值永远停留在先验均值与样本均值正中间
              why: 只要先验在真值附近不为 0，大样本下似然项随 $n$ 增长会主导后验，先验的影响会逐渐消退
            - text: 贝叶斯框架要求先看完当前这批样本的平均值，再把先验分布的中心设在当前样本均值上
              why: 先验分布应当在纳入当前样本之前根据历史经验、领域知识或无信息原则确定，不能拿当前数据重复当先验
          explain: |
            贝叶斯推断通过把参数视为不确定量，给出了概率化的区间解释，同时通过损失函数把估计问题转化成了明确的决策最优化问题。

  # =====================================================================
  # 第 4 章：似然
  # =====================================================================
  - id: likelihood-mle
    chapter: 似然
    title: 似然函数与单参数最大似然估计
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            你向一个箱子里摸球 10 次（有放回），摸出 8 次红球、2 次白球。箱子只有两种可能配方：A 配方红球占 80%，B 配方红球占 20%。哪个配方让“摸出 8 红 2 白”这件事更有可能发生？
          options:
            - text: A 配方，80% 红球比例下摸出 8 红 2 白的概率远高于 20% 配方
              correct: true
            - text: 两个配方出现 8 红 2 白的可能性完全相同，因为单次样本已经发生，事后比较不同参数下的出现概率没有意义
              why: 不同参数下同一组样本出现的概率相差悬殊，比较这组概率高低正是根据样本反推参数的依据
            - text: B 配方，因为小概率事件一旦在试验中发生，携带的信息量反而比大概率事件更高
              why: 似然比较看的是哪一个参数让已发生的观测结果更容易出现，B 配方下 10 次出 8 次红球的概率很低，难以解释手头样本
          explain: |
            从候选参数里挑出“最能合理解释手头这组观测数据”的那一个，这就是最大似然的直觉。
      - card:
          title: 似然函数与对数似然
          body: |
            设 $X_1, \dots, X_n$ 独立同分布，单个观测的概率或密度为 $f(x; \theta)$。样本还没抽出来时，把参数固定看样本取值，得到联合分布。反过来，数据 $\mathbf{x} = (x_1, \dots, x_n)$ 已经拿到并固定，把联合乘积看作未知参数 $\theta$ 的函数，就叫**似然函数（likelihood function）**：
            $$L(\theta; \mathbf{x}) = \prod_{i=1}^n f(x_i; \theta)$$
            注意：$L(\theta; \mathbf{x})$ 不是关于 $\theta$ 的概率密度，对所有 $\theta$ 求和或积分不一定等于 1。把 $L(\theta)$ 取**自然对数**得到**对数似然（log-likelihood）**：
            $$\ell(\theta) = \ln L(\theta) = \sum_{i=1}^n \ln f(x_i; \theta)$$
            因为 $\ln$ 严格单调递增，让 $\ell(\theta)$ 最大的点与让 $L(\theta)$ 最大的点完全相同，而连乘变成连加后求导简便得多。
      - item:
          id: prob-vs-likelihood
          type: choice
          prompt: |
            关于概率函数 $P(\mathbf{X}=\mathbf{x} \mid \theta)$ 和似然函数 $L(\theta \mid \mathbf{x})$ 的区别，哪一句说得准确？
          options:
            - text: 概率是把参数 $\theta$ 固定看不同样本的分布（所有样本之和为 1）；似然是把观测 $\mathbf{x}$ 固定看 $\theta$ 谁更合情理（关于 $\theta$ 的积分不必为 1）
              correct: true
            - text: 似然函数就是参数 $\theta$ 的概率密度函数，对 $\theta$ 积分必须等于 1
              why: 把参数看成带密度分布并积分等于 1 的是贝叶斯后验分布；似然本身不归一
            - text: 对数似然把乘积变成相加后，最大值点的位置会向右移动一个固定量
              why: 严格单调递增变换保序，极值点位置 $\hat{\theta}$ 丝毫不变
            - text: 似然函数只能用来求离散分布的参数，连续分布的密度不能相乘
              why: 连续分布只需把概率质量函数换成各自的概率密度 $f(x_i; \theta)$ 相乘，同样构成似然函数
          explain: |
            “固定参数看数据”叫概率，“固定数据挑参数”叫似然。对数变换只拉平数值尺度防止连乘下溢，不改变最优点。
      - card:
          title: 求单参数最大似然估计的四个步骤
          body: |
            选取使似然函数（或对数似然）取到最大值的参数值 $\hat{\theta}$，称为**最大似然估计（maximum likelihood estimate, MLE）**。当似然函数光滑且最大值在开区间内部取到时，按四步求解：
            1. 写出似然函数 $L(\theta) = \prod_{i=1}^n f(x_i; \theta)$；
            2. 两边取自然对数得对数似然 $\ell(\theta) = \sum_{i=1}^n \ln f(x_i; \theta)$；
            3. 对 $\theta$ 求一阶导数并令它等于 0（似然方程 $\ell'(\theta) = 0$），解出候选驻点 $\hat{\theta}$；
            4. 检查二阶导数 $\ell''(\hat{\theta}) < 0$（确认是极大值而非极小值）。
      - card:
          title: 例子：求泊松分布参数的 MLE 并检查无偏性
          body: |
            设 $X_1, \dots, X_n$ 独立同分布于 $\mathrm{Poisson}(\lambda)$（$\lambda > 0$），单次概率质量函数为 $P(X=x) = \frac{\lambda^x e^{-\lambda}}{x!}$。求 $\lambda$ 的 MLE 并判断它是否无偏。
          reveal:
            - title: 第 1 步：写出似然与对数似然
              body: |
                联合似然为 $L(\lambda) = \prod_{i=1}^n \frac{\lambda^{x_i} e^{-\lambda}}{x_i!}$。取自然对数并把乘法拆成加法：
                $$\ell(\lambda) = \left(\sum_{i=1}^n x_i\right)\ln\lambda - n\lambda - \sum_{i=1}^n \ln(x_i!)$$
            - title: 第 2 步：求导令零、核验二阶导与无偏性
              body: |
                对 $\lambda$ 求导：$\ell'(\lambda) = \frac{\sum x_i}{\lambda} - n = 0$，解得 $\hat{\lambda}_{\text{MLE}} = \bar{X}$。
                当样本不全为 0 时，$\ell''(\lambda) = -\frac{\sum x_i}{\lambda^2} < 0$，确为极大值。又因为每个泊松随机变量期望为 $\lambda$，有 $E[\hat{\lambda}] = E[\bar{X}] = \lambda$，所以这个 MLE 是无偏的。
      - item:
          id: mle-bernoulli-calc
          type: number
          prompt: |
            进行 20 次独立伯努利试验（成功概率为未知参数 $p$），共观察到 12 次成功。按对数似然 $\ell(p) = 12 \ln p + 8 \ln(1-p)$ 求导，最大似然估计 $\hat{p}_{\text{MLE}}$ 是多少？
          answer: 0.6
          hint: 令 $\frac{12}{p} - \frac{8}{1-p} = 0$ 解出 $p$。
          explain: |
            解方程 $\frac{12}{p} = \frac{8}{1-p}$ 得 $12(1-p) = 8p \implies 20p = 12 \implies \hat{p}_{\text{MLE}} = 0.6$，正好就是样本成功比例。
      - item:
          id: mle-exp-calc
          type: number
          prompt: |
            设 3 个独立同分布观测来自 $\mathrm{Exp}(\lambda)$（密度 $f(x;\lambda) = \lambda e^{-\lambda x}$），具体数值为 `1.5, 2.0, 2.5`。利用对数似然 $\ell(\lambda) = 3\ln\lambda - \lambda\sum x_i$ 求出 $\hat{\lambda}_{\text{MLE}}$。
          answer: 0.5
          hint: 求导得 $3/\lambda - \sum x_i = 0$，解出 $\hat{\lambda} = 1/\bar{x}$。
          explain: |
            $\sum x_i = 6.0$，$\bar{x} = 2.0$，令 $\ell'(\lambda) = \frac{3}{\lambda} - 6.0 = 0$ 得 $\hat{\lambda}_{\text{MLE}} = \frac{3}{6} = 0.5$。
      - item:
          id: mle-second-deriv-check
          type: choice
          prompt: |
            求单参数最大似然估计时，解出 $\ell'(\hat{\theta}) = 0$ 之后为什么还要检查二阶导数 $\ell''(\hat{\theta}) < 0$？
          options:
            - text: 一阶导数为 0 只说明是平坦驻点，还需二阶导数小于 0 才能确认对数似然在该处向下凹、确实取到极大值而非极小值
              correct: true
            - text: 只有验证了二阶导数严格小于 0，才能保证求出来的最大似然估计量在有限样本下是无偏估计
              why: 二阶导数只确认该驻点是局部极大值；MLE 在有限样本下是否无偏需要单独计算期望 $E[\hat{\theta}]$
            - text: 如果不检查二阶导数，对数似然函数 $\ell(\theta)$ 的极大值点就会和原似然函数 $L(\theta)$ 不一致
              why: 自然对数严格单调递增，$\ell(\theta)$ 和 $L(\theta)$ 的极大值点位置始终一致
            - text: 当二阶导数大于 0 时，说明该驻点已经是全局最大值，只是需要把算出来的估计值添一个负号
              why: 二阶导数大于 0 说明函数在该点向上凹、取到极小值，应排除该驻点并检查其他驻点或区间边界
          explain: |
            求导归零找的是平坦点，只有结合开口向下（二阶导为负）的几何检查，才能确认找到的是似然峰顶。

  - id: mle-support-multi
    chapter: 似然
    title: 边界支撑与多参数最大似然
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            设随机数从区间 $[0, \theta]$ 上均匀抽取。你抽了 3 个数分别是 `1.4, 3.2, 2.8`。如果只考虑让这 3 个数都落进 $[0, \theta]$ 里且出现的概率密度 $\frac{1}{\theta^3}$ 尽可能大，你猜 $\theta$ 该取多少？
          options:
            - text: 取 $\theta = 3.2$，既能包住全部 3 个样本，又让密度 $1/\theta^3$ 尽可能大
              correct: true
            - text: 取矩估计值 $\theta = 2\bar{x} \approx 4.93$，因为只有让参数等于样本均值的两倍，联合似然函数 $1/\theta^3$ 才能在区间内部取到一阶导数为零的驻点
              why: 在 $\theta \ge 3.2$ 上 $1/\theta^3$ 的导数恒为负，没有内部驻点；而且 $\theta = 4.93$ 处的似然值小于 $\theta = 3.2$ 处
            - text: 取 $\theta = 1.4$，因为分母里的 $\theta$ 越小密度越大，而样本里的最小值就是 1.4
              why: 若取 $\theta = 1.4$，观测值 3.2 和 2.8 就落在了 $[0, 1.4]$ 区间外，联合密度直接变成 0
          explain: |
            当随机变量的可能取值范围（支撑）本身就依赖未知参数 $\theta$ 时，最大似然点常常落在区间的边界上，求导归零不再适用。
      - card:
          title: 支撑依赖参数时的直接最大化
          body: |
            并不是所有似然问题都能靠“求导令为 0”解决。看 $\mathrm{Uniform}(0, \theta)$：每个点的密度是 $\frac{1}{\theta}$（当 $0 \le x_i \le \theta$，否则为 0）。于是 $n$ 个样本的似然函数为：
            $$L(\theta) = \begin{cases} \theta^{-n}, & \theta \ge \max(x_1, \dots, x_n) = X_{(n)} \\ 0, & \theta < X_{(n)} \end{cases}$$
            对 $\theta \ge X_{(n)}$ 求导得 $-n\theta^{-n-1} < 0$，导数不会等于 0。由于在合法区域内函数严格单调递减，唯一能让它取最大的点就在左边界上：$\hat{\theta}_{\text{MLE}} = X_{(n)}$。注意这个边界估计略偏低（$E[X_{(n)}] = \frac{n}{n+1}\theta$），但 $n$ 很大时依然相合。
      - item:
          id: mle-uniform-boundary
          type: number
          prompt: |
            4 个独立观测来自均匀分布 $\mathrm{Uniform}(0, \theta)$，测得样本为 `2.1, 4.8, 3.5, 1.9`。参数 $\theta$ 的最大似然估计 $\hat{\theta}_{\text{MLE}}$ 是多少？
          answer: 4.8
          hint: $\theta$ 首先不能小于任何一个观测到的数，同时要让 $\theta^{-4}$ 尽可能大。
          explain: |
            所有观测都落在 $[0, \theta]$ 内等价于 $\theta \ge 4.8$；在此区间上 $\theta^{-4}$ 随 $\theta$ 增大而单调下降，因此在边界 $\hat{\theta}_{\text{MLE}} = X_{(4)} = 4.8$ 处取到最大值。
      - card:
          title: 多参数最大似然估计
          body: |
            当分布含有不止一个未知参数（例如正态分布 $N(\mu, \sigma^2)$ 未知均值 $\mu$ 和方差 $v = \sigma^2$），对数似然就是多元函数 $\ell(\mu, v)$。我们把其余参数暂时看作常数、只对其中一个参数求导，即求**偏导数（partial derivative）**，然后令所有偏导数同时为 0 联立求解。
      - card:
          title: 例子：求解正态分布双参数 MLE
          body: |
            对 $n$ 个独立同分布正态样本 $N(\mu, v)$（记方差 $v = \sigma^2 > 0$），对数似然为 $\ell(\mu, v) = -\frac{n}{2}\ln(2\pi) - \frac{n}{2}\ln v - \frac{1}{2v}\sum_{i=1}^n (x_i - \mu)^2$。
          reveal:
            - title: 第 1 步：对 μ 求偏导并令为 0
              body: |
                把 $v$ 看成常数对 $\mu$ 求偏导：$\frac{\partial \ell}{\partial \mu} = \frac{1}{v}\sum_{i=1}^n (x_i - \mu) = 0$。解得 $\hat{\mu}_{\text{MLE}} = \bar{X}$，对任意 $v > 0$ 都一样。
            - title: 第 2 步：代回 μ 估计并对方差 v 求偏导
              body: |
                把 $\mu = \bar{X}$ 代入后对 $v$ 求偏导：
                $$\frac{\partial \ell}{\partial v} = -\frac{n}{2v} + \frac{1}{2v^2}\sum_{i=1}^n (x_i - \bar{X})^2 = 0$$
                两边乘 $2v^2/n$ 解得 $\hat{\sigma}^2_{\text{MLE}} = \frac{1}{n}\sum_{i=1}^n (X_i - \bar{X})^2$。它除以 $n$ 而非 $n-1$，因此有轻微负偏，但仍是相合的。
      - item:
          id: normal-mle-variance
          type: number
          prompt: |
            已知一组来自正态分布的样本为 `2, 4, 6`。用正态分布的**最大似然估计**公式（注意分母）计算方差估计值 $\hat{\sigma}^2_{\text{MLE}}$ 是多少？（填小数或分数）
          answer: 2.666667
          tolerance: 0.001
          hint: 样本均值是 4，注意最大似然方差估计除以 $n$ 而不是 $n - 1$。
          explain: |
            $\bar{x} = 4$，离差平方和为 $(2-4)^2 + 0 + (6-4)^2 = 8$。正态方差的 MLE 除以 $n = 3$，得到 $\hat{\sigma}^2_{\text{MLE}} = 8/3 \approx 2.667$。
      - card:
          title: MLE 的不变性性质
          body: |
            最大似然估计有一条实用的**函数不变性**：如果 $\hat{\theta}$ 是参数 $\theta$ 的 MLE，那么对任何光滑函数 $g(\theta)$，参数 $\eta = g(\theta)$ 的最大似然估计就直接等于 $g(\hat{\theta})$，不必重新列出似然方程再求一遍导。例如算出 $\hat{\sigma}^2_{\text{MLE}}$ 后，标准差 $\sigma$ 的 MLE 就是 $\sqrt{\hat{\sigma}^2_{\text{MLE}}}$。
      - item:
          id: mle-invariance-exp
          type: number
          prompt: |
            对指数分布 $\mathrm{Exp}(\lambda)$ 算出速率参数的最大似然估计 $\hat{\lambda}_{\text{MLE}} = 0.4$。那么平均等待时间 $\mu = 1/\lambda$ 的最大似然估计 $\hat{\mu}_{\text{MLE}}$ 是多少？
          answer: 2.5
          hint: 直接利用不变性把 $\hat{\lambda}_{\text{MLE}}$ 代入 $g(\lambda) = 1/\lambda$。
          explain: |
            由 MLE 的函数不变性，$\hat{\mu}_{\text{MLE}} = 1/\hat{\lambda}_{\text{MLE}} = 1/0.4 = 2.5$。不过要注意，不变性保住了最大似然身份，却不保证变换后仍无偏。
      - item:
          id: uniform-mle-deriv-fail
          type: choice
          prompt: |
            在求 $\mathrm{Uniform}(0, \theta)$ 的 MLE 时，为什么不能靠“对数似然求导令为 0”来求解？
          options:
            - text: 对数似然在合法区间 $\theta \ge X_{(n)}$ 上严格单调递减，内部导数处处不为 0，最大值落在左边界
              correct: true
            - text: 因为均匀分布的联合对数似然函数 $\ell(\theta) = -n\ln\theta$ 在区间 $(X_{(n)}, +\infty)$ 内处处不可导，无法写出似然方程的一阶导数公式
              why: 在 $\theta > X_{(n)}$ 的开区间内，$\ell(\theta) = -n\ln\theta$ 光滑可导，只是导数 $-n/\theta$ 恒为负数、不等于 0
            - text: 均匀分布不存在最大似然估计，凡是支撑区间带未知参数的分布都只能使用矩估计法求解
              why: 均匀分布有明确的 MLE，即样本最大值 $X_{(n)}$，并且它的均方误差比矩估计 $2\bar{X}$ 更小
            - text: 对数变换改变了均匀分布似然函数的单调性，只有不取对数直接对 $L(\theta)$ 求导才能找到内部驻点
              why: 对数变换严格单调递增，不改变单调方向；直接对 $L(\theta) = \theta^{-n}$ 求导同样处处为负，最优点仍在边界 $X_{(n)}$
          explain: |
            微积分中“导数为 0”只找内部极值；遇到边界随参数移动的模型（例如支撑区间边界、非负约束），一定要检查区间端点上的单调性。

  - id: numeric-mle
    chapter: 似然
    title: 网格搜索与牛顿法求数值 MLE
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            现实中很多概率分布（比如柯西分布、伽马分布、混合分布）把对数似然求导令为 0 后，方程里混着对数和分式，解不出像 $\bar{X}$ 那样简洁的解析式。遇到这种“算不出闭合公式”的似然方程，统计软件会怎么找到 $\hat{\theta}$？
          options:
            - text: 从初始猜测值出发，借助网格搜索或基于导数的数值算法一步步逼近对数似然的峰值
              correct: true
            - text: 先把对数似然函数里的 $\ln f(x_i; \theta)$ 全部替换成常数 1，强行把非线性似然方程改写成一元一次方程来求精确解析解
              why: 把对数密度换成常数会抹掉所有参数与数据的关系，数值求解是在原对数似然上做局部逼近或网格评估
            - text: 只要似然方程没有闭合解析公式，最大似然估计点在数学上就不存在，只能改用样本中位数作为唯一的替代估计
              why: 没有闭合解析式不代表极值点不存在，对数似然函数的峰值依然可以用数值优化算法算到所需精度
          explain: |
            解析公式算不出来时，数值优化就派上用场了：软件把最大化 $\ell(\theta)$ 变成在计算机里搜索曲线最高点。
      - card:
          title: 网格搜索求 MLE 的思路
          body: |
            最直接的数值办法是**网格搜索**：在参数可能存在的合理范围内铺上一串等距候选点 $\theta_1, \theta_2, \dots, \theta_M$，把每个点的对数似然 $\ell(\theta_j)$ 算出来排个队，挑最大的那个点当近似解。
            网格搜索不怕曲线有多个波峰，也不需要求导，能大致圈定全局最大值所在的位置；缺点是一旦参数变成十几个、几十个，网格点数量会按指数增长，计算量过大。
      - card:
          title: 统计软件里的数值优化工作流
          body: |
            为了算得又快又准，统计软件（如 R 语言中的 `optim` 或 Python 中的科学计算优化器）普遍把问题反过来写：去**最小化负对数似然** $-\ell(\theta)$（因为标准优化库默认都写“求最小值”）。
            在软件中跑数值 MLE 时，一般要准备三样东西：目标函数（算出 $-\ell(\theta)$）、出发初值 $\theta_0$（常用矩估计提供），以及边界约束（例如方差必须 $>0$）。软件收敛后，往往顺带返回目标函数在最优点处的二阶变化率矩阵，方便马上估算标准误。
      - item:
          id: why-min-neg-loglik
          type: choice
          prompt: |
            在 R 或 Python 的统计优化软件里求数值 MLE 时，为什么大家通常编写函数返回“**负**对数似然 $-\ell(\theta)$”交给优化器最小化？
          options:
            - text: 取对数把连乘化为连加防数值下溢，加负号则是为了配合优化器默认“求最小值”的接口
              correct: true
            - text: 因为原始似然函数 $L(\theta)$ 存在许多局部极大值，而乘上 $-1$ 变成负对数似然 $-\ell(\theta)$ 后就能消除所有局部极值、保证目标函数只有一个谷底
              why: 乘上 $-1$ 只是把每个局部峰顶翻转成局部谷底，不会改变驻点个数，也不会把多峰函数变成单谷函数
            - text: 因为加上负号以后，对数似然的最优参数位置会整体平移到正半轴，从而自动满足方差或速率参数大于 0 的约束
              why: 目标函数乘上 $-1$ 只翻转纵轴高度，极值点所在的横坐标 $\hat{\theta}$ 位置不会发生任何平移
            - text: 因为只要把目标函数写成负对数似然，各类局部优化器就不需要提供初始猜测值 $\theta_0$
              why: 无论是最大化 $\ell(\theta)$ 还是最小化 $-\ell(\theta)$，局部数值优化器都必须从给定的初始点 $\theta_0$ 出发逐步更新
          explain: |
            最大化 $\ell(\theta)$ 等价于最小化 $-\ell(\theta)$。对数防下溢、负号对接口，是工程计算的标准习惯。
      - card:
          title: 牛顿法：利用曲率快速找根
          body: |
            如何一步步更快地找到让一阶导数 $\ell'(\theta) = 0$ 的驻点？常用的局部算法是**牛顿法（Newton's method）**。
            从当前猜测 $\theta_k$ 出发，利用函数在该点的一阶斜率 $\ell'(\theta_k)$ 和二阶弯曲率 $\ell''(\theta_k)$ 做二次近似（切线逼近导函数零点），更新下一步：
            $$\theta_{k+1} = \theta_k - \frac{\ell'(\theta_k)}{\ell''(\theta_k)}$$
            只要出发点离真峰值不太远且对数似然向下凹（$\ell'' < 0$），牛顿法往往只需几步就能逼近到很高精度。
      - card:
          title: 例子：手算一步牛顿法求 MLE
          body: |
            对某组指数样本算得 $\ell'(\theta) = \frac{4}{\theta} - 2$、$\ell''(\theta) = -\frac{4}{\theta^2}$（真实极值点在 $\theta = 2$）。如果从初值 $\theta_0 = 1$ 出发，牛顿法第一步会跳到哪里？
          reveal:
            - title: 第 1 步：计算初值处的一阶导与二阶导
              body: |
                代入 $\theta_0 = 1$：一阶导 $\ell'(1) = \frac{4}{1} - 2 = 2$；二阶导 $\ell''(1) = -\frac{4}{1^2} = -4$。
            - title: 第 2 步：代入牛顿法更新公式
              body: |
                $$\theta_1 = 1 - \frac{2}{-4} = 1 + 0.5 = 1.5$$
                走了一步，就已经从 1.0 推进到更接近真实极值点 2.0 的 1.5 了。
      - item:
          id: newton-step-calc
          type: number
          prompt: |
            设某单参数对数似然的导数为 $\ell'(\theta) = \frac{6}{\theta} - 2$，二阶导数为 $\ell''(\theta) = -\frac{6}{\theta^2}$。从初值 $\theta_0 = 2$ 出发做**一步**牛顿法更新，得到的 $\theta_1$ 是多少？（填小数或分数）
          answer: 2.666667
          tolerance: 0.001
          hint: 先算 $\ell'(2)$ 和 $\ell''(2)$，再代入 $\theta_1 = \theta_0 - \ell'(\theta_0)/\ell''(\theta_0)$。
          explain: |
            在 $\theta_0 = 2$ 处，$\ell'(2) = \frac{6}{2} - 2 = 1$，$\ell''(2) = -\frac{6}{4} = -1.5$。更新得 $\theta_1 = 2 - \frac{1}{-1.5} = 2 + \frac{2}{3} = \frac{8}{3} \approx 2.667$（逐步逼近真解 $\theta = 3$）。
      - item:
          id: numeric-mle-pitfalls
          type: order
          prompt: |
            用数值优化方法（如网格搜索配合牛顿法）求解无解析解的 MLE 时，把下面 4 个步骤按正确先后排好。
          steps:
            - "写出对数似然函数（或在优化器中写成负对数似然）"
            - "用网格搜索或矩估计确定一个合理的初始参数猜测"
            - "沿着牛顿法或数值优化步骤重复更新直到一阶导数接近 0"
            - "检查最优点处的二阶弯曲度是否为负（及多初值排查局部极值）"
          explain: |
            多峰似然（例如混合正态分布）容易停在局部峰顶或平坦区，所以用矩估计或粗网格选好初值、最后复核曲率与多初值一致性很重要。

  - id: fisher-asymptotic
    chapter: 似然
    title: Fisher 信息与 MLE 的渐近分布
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            比较两份同样从 $n=100$ 个样本算出的对数似然曲线 $\ell(\theta)$：A 曲线的峰顶像一座尖塔一样陡峭，稍微离开最优点数值就大幅下降；B 曲线的峰顶像一块缓坡一样平坦，左右偏一点数值变化很小。你猜哪份数据对参数 $\theta$ 的估计更精确（标准误更小）？
          options:
            - text: A 曲线，峰顶越尖锐说明数据对参数偏离越敏感，参数真值被锁得越紧
              correct: true
            - text: B 曲线，平缓代表各种参数看起来都不错，容错率高，标准误更小
              why: 如果偏离真值很远似然也不怎么下降，说明这批样本分辨不出谁好谁坏，标准误反而更大
            - text: 一样精确，只要样本量都是 $n=100$，最大似然估计的标准误就完全相同
              why: 不同分布或不同参数位置下，每个观测含有的信息量不同，峰顶陡峭程度决定了最终方差大小
          explain: |
            对数似然曲线在峰顶处向下弯曲得越明显（曲率 $-\ell''(\theta)$ 越大），样本就越能把参数固定在峰顶附近。
      - card:
          title: Fisher 信息量与峰顶曲率
          body: |
            衡量曲线在峰顶向下弯曲的程度，就看二阶导数的负值 $-\ell''(\theta)$。对单个观测取平均期望，定义为 **Fisher 信息（Fisher information）**：
            $$I(\theta) = E\left[-\frac{d^2}{d\theta^2}\ln f(X; \theta)\right]$$
            对于 $n$ 个独立同分布样本，各观测的对数似然相加，信息量也直接相加：$I_n(\theta) = n\,I(\theta)$。在满足正则性条件（如支撑不依赖参数）时，任何无偏估计的方差都不会低于 $\frac{1}{nI(\theta)}$ 的下界。
      - card:
          title: 例子：计算伯努利分布的 Fisher 信息
          body: |
            单个伯努利试验 $X \sim \mathrm{Bernoulli}(p)$，对数似然是 $\ell_1(p) = X\ln p + (1-X)\ln(1-p)$。怎样求它的 Fisher 信息 $I(p)$？
          reveal:
            - title: 第 1 步：求两次导数并取负号
              body: |
                一阶导数 $\ell_1'(p) = \frac{X}{p} - \frac{1-X}{1-p}$；再求一次导数并加负号：
                $$-\ell_1''(p) = \frac{X}{p^2} + \frac{1-X}{(1-p)^2}$$
            - title: 第 2 步：对随机变量 X 取期望
              body: |
                利用 $E[X] = p$、$E[1-X] = 1-p$，代入即得：
                $$I(p) = \frac{p}{p^2} + \frac{1-p}{(1-p)^2} = \frac{1}{p} + \frac{1}{1-p} = \frac{1}{p(1-p)}$$
                于是 $n$ 次试验的总信息量 $I_n(p) = \frac{n}{p(1-p)}$，倒数恰好就是样本比例的方差 $\frac{p(1-p)}{n}$。
      - item:
          id: fisher-bernoulli-calc
          type: number
          prompt: |
            伯努利分布单个观测的 Fisher 信息为 $I(p) = \frac{1}{p(1-p)}$。当 $p = 0.5$ 且做 $n = 25$ 次独立试验时，总 Fisher 信息 $I_n(0.5) = n\,I(0.5)$ 是多少？
          answer: 100
          hint: 先算 $p = 0.5$ 时的单次信息 $1/(0.5 \times 0.5)$，再乘以 $25$。
          explain: |
            $I(0.5) = \frac{1}{0.25} = 4$，$25$ 次独立试验信息相加得 $I_{25}(0.5) = 25 \times 4 = 100$。顺便算其倒数 $1/100 = 0.01$，正是 $\mathrm{Var}(\hat{p}) = 0.25/25$。
      - card:
          title: 单参数 MLE 的渐近分布与观测信息
          body: |
            在一般正则条件（支撑固定、真值在内点、三阶导数有界等）下，随着样本量 $n$ 增大，最大似然估计 $\hat{\theta}_n$ 不仅具有相合性，而且满足渐近正态分布：
            $$\sqrt{n}(\hat{\theta}_n - \theta) \xrightarrow{d} N\left(0, \frac{1}{I(\theta)}\right)$$
            也就是说，大样本下 $\hat{\theta}_n$ 近似服从 $N\left(\theta, \frac{1}{nI(\theta)}\right)$。实际问题里真值 $\theta$ 未知，常直接用最优点处的**观测 Fisher 信息** $J(\hat{\theta}) = -\ell''(\hat{\theta})$ 来估计方差，得出实用标准误公式：
            $$\mathrm{SE}(\hat{\theta}) \approx \frac{1}{\sqrt{J(\hat{\theta})}} = \frac{1}{\sqrt{-\ell''(\hat{\theta})}}$$
      - item:
          id: fisher-exp-se
          type: number
          prompt: |
            对指数分布 $\mathrm{Exp}(\lambda)$ 的单个观测，$\ln f(x;\lambda) = \ln\lambda - \lambda x$，求二阶导取负得单次 Fisher 信息 $I(\lambda) = 1/\lambda^2$。当样本量 $n = 25$、参数 $\lambda = 2$ 时，$n$ 次总信息量 $I_n(2) = 25/4 = 6.25$。由此算出 $\hat{\lambda}_{\text{MLE}}$ 的大样本近似标准误 $\frac{1}{\sqrt{I_n(2)}}$ 是多少？
          answer: 0.4
          hint: 对总信息量 $6.25$ 开平方再取倒数。
          explain: |
            $\sqrt{I_n(2)} = \sqrt{6.25} = 2.5$，因此近似标准误为 $1/2.5 = 0.4$。
      - item:
          id: observed-fisher-se
          type: number
          prompt: |
            对某复杂模型跑完数值优化后，在最优点 $\hat{\theta}$ 处测得对数似然的二阶导数为 $\ell''(\hat{\theta}) = -100$。利用观测 Fisher 信息 $J(\hat{\theta}) = -\ell''(\hat{\theta})$，该参数的近似标准误是多少？
          answer: 0.1
          hint: 观测信息 $J(\hat{\theta}) = 100$，标准误等于 $1/\sqrt{J(\hat{\theta})}$。
          explain: |
            $J(\hat{\theta}) = -(-100) = 100$，所以近似标准误为 $\frac{1}{\sqrt{100}} = 0.1$。
      - card:
          title: 多参数 MLE 的渐近协方差
          body: |
            如果有 $d$ 个未知参数 $(\theta_1, \dots, \theta_d)$，各二阶偏导负值的期望按行和列排成一张 $d \times d$ 的数表，即多参数 **Fisher 信息矩阵** $\mathbf{I}_n(\boldsymbol{\theta})$（若还没学线性代数，先把它理解成记录每对参数曲率交叉关系的表格）。
            多参数 MLE $\hat{\boldsymbol{\theta}}$ 同样具有渐近多元正态性：把这张信息表求逆后得到的表 $\mathbf{I}_n(\boldsymbol{\theta})^{-1}$，就是 $\hat{\boldsymbol{\theta}}$ 的近似协方差表——主对角线第 $j$ 项就是第 $j$ 个参数估计值的渐近方差 $\mathrm{SE}(\hat{\theta}_j)^2$，非对角项则反映不同参数估计误差之间的相关性。
      - item:
          id: fisher-multi-choice
          type: choice
          prompt: |
            关于 Fisher 信息与多参数 MLE 渐近性质，下面哪一句正确？
          options:
            - text: 多参数信息矩阵求逆后，主对角线上的数字给出各参数的渐近方差，开平方就是大样本标准误
              correct: true
            - text: 观测 Fisher 信息 $J(\hat{\theta}) = -\ell''(\hat{\theta})$ 越大，说明估计量标准误越大
              why: 信息量和方差成反比，$J(\hat{\theta})$ 越大说明峰越尖，标准误 $1/\sqrt{J(\hat{\theta})}$ 越小
            - text: 不管参数有几个，对某个参数的标准误都可以直接无视其余参数、只算一维信息
              why: 只有当参数之间信息表交叉项为 0（正交）时才能分开看；一般情形必须用多参数信息表求逆，体现其余参数未知带来的额外不确定性
            - text: Fisher 信息越小，说明样本越多、结果越可靠
              why: 样本越多总信息量 $nI(\theta)$ 越大，估计越稳定
          explain: |
            多参数估计里，不知道一个参数往往会让另一个参数的估计变宽（表现在信息矩阵非对角项非零、求逆后对角元变大）。记住“信息大、方差小”就抓住了核心关系。

  # =====================================================================
  # 第 5 章：置信区间
  # =====================================================================
  - id: ci-normal-exact
    chapter: 置信区间
    title: 正态置信区间与新观测预测区间
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一批零件测完算出总体平均长度 $\mu$ 的 95% 置信区间是 `[4.92, 5.28]` 毫米。如果有人说：“这说明真实均值 $\mu$ 有 95% 的概率落在这个已经算出来的固定区间里”，这种说法严谨吗？
          options:
            - text: 不严谨，总体真值 $\mu$ 是固定常数；95% 指的是这套区间构造规则在长期重复抽样中有 95% 的比例能盖住真值
              correct: true
            - text: 非常严谨，一旦把样本数据代入公式算出 `[4.92, 5.28]`，未知总体均值 $\mu$ 就会变成一个在这两个端点之间服从均匀分布的随机变量，落在里面的概率恰好是 95%
              why: 真值 $\mu$ 在频率派框架下不是随机变量；一旦算出具体区间 `[4.92, 5.28]`，真值要么在里面，要么不在
            - text: 不严谨，95% 指的是全批零件里恰好有 95% 的单个零件长度在 `[4.92, 5.28]` 之间
              why: 置信区间针对的是总体平均数 $\mu$ 的不确定范围，不是单个零件取值的分布范围
          explain: |
            就像投圈套固定木桩：木桩（$\mu$）不动，每次抽样算出的区间（圈）在动。95% 是这套区间构造方法在重复抽样下的长期覆盖率。
      - card:
          title: 置信区间的含义与枢轴量
          body: |
            只报一个点估计 $\bar{x} = 5.10$ 看不出误差有多大。用样本算出一个随机范围 $[L(X), U(X)]$，使得在反复独立抽样下，该区间覆盖未知固定参数 $\theta$ 的概率等于预设置信水平 $1 - \alpha$（如 $95\%$），这就是**置信区间（confidence interval）**。
            构造它的常用手段是找一个分布完全已知（不含未知参数）的统计量函数（称为枢轴量）。当置信水平提高（例如从 90% 提到 99%）时，为了更保险，区间必须拉宽；当样本量 $n$ 增大时，标准误变小，区间就会收窄。
      - card:
          title: 正态总体均值的 z 区间与 t 区间
          body: |
            设 $X_1, \dots, X_n \stackrel{\text{i.i.d.}}{\sim} N(\mu, \sigma^2)$：
            - **总体方差 $\sigma$ 已知时**：$\frac{\bar{X}-\mu}{\sigma/\sqrt{n}} \sim N(0, 1)$，因此双侧 $1 - \alpha$ 置信区间为 $\bar{x} \pm z_{\alpha/2}\frac{\sigma}{\sqrt{n}}$（$95\%$ 时 $z_{0.025} \approx 1.96$）。
            - **总体方差 $\sigma$ 未知时**：用样本标准差 $s$ 代替 $\sigma$，统计量改服从 $t(n-1)$ 分布，因此改查 $t$ 分位数得到更宽的精确区间：
            $$\bar{x} \pm t_{\alpha/2,\,n-1}\frac{s}{\sqrt{n}}$$
      - item:
          id: z-ci-upper
          type: number
          prompt: |
            已知正态总体标准差 $\sigma = 4$，抽样 $n = 16$ 个测得样本均值 $\bar{x} = 50$。用 $z_{0.025} = 1.96$ 计算总体均值 $\mu$ 的 95% 置信区间的**上限**是多少？
          answer: 51.96
          hint: 上限等于 $\bar{x} + z_{0.025} \cdot (\sigma/\sqrt{n})$。
          explain: |
            标准误 $\sigma/\sqrt{n} = 4/\sqrt{16} = 1$，误差限 $1.96 \times 1 = 1.96$，所以 95% 置信区间为 $[48.04, 51.96]$，上限是 $51.96$。
      - card:
          title: 例子：计算 10 个零件的 95% 置信区间与预测区间
          body: |
            测得 10 个零件长度（mm）：`4.8, 5.1, 5.3, 4.9, 5.4, 5.0, 5.2, 4.7, 5.1, 5.5`（设总体正态、$\sigma$ 未知，查表 $t_{0.025, 9} = 2.262$）。把全体均值 $\mu$ 的 95% 置信区间，和**下一个新零件长度**的 95% **预测区间（prediction interval）**摆在一起算。
          reveal:
            - title: 第 1 步：算样本均值、样本标准差与标准误
              body: |
                均值 $\bar{x} = 51.0/10 = 5.10$；离差平方和 $\sum(x_i-5.10)^2 = 0.60$；样本方差 $s^2 = 0.60/9 \approx 0.0667$，样本标准差 $s \approx 0.2582$；均值标准误 $\mathrm{SE} = s/\sqrt{10} \approx 0.08165$。
            - title: 第 2 步：算总体均值 μ 的 95% 置信区间
              body: |
                误差限 $2.262 \times 0.08165 \approx 0.1847$，所以 $\mu$ 的 95% 置信区间是 $5.10 \pm 0.185 = [4.915, 5.285]$。
            - title: 第 3 步：对比“下一个新零件”的 95% 预测区间
              body: |
                如果关心**下一个单独的新零件** $X_{n+1}$ 会落在哪，公式变成 $\bar{x} \pm t_{\alpha/2,\,n-1}\cdot s\sqrt{1 + \frac{1}{n}}$。多出来的那个 $1$ 来自单个零件自身的随机波动。代入 $\sqrt{1.1} \approx 1.0488$，预测区间误差限 $2.262 \times 0.2582 \times 1.0488 \approx 0.613$，得到 $[4.487, 5.713]$——比均值置信区间宽得多。
      - item:
          id: t-ci-margin
          type: number
          prompt: |
            正态总体方差未知，抽取 $n = 25$ 个样本，测得 $\bar{x} = 80$、$s = 10$，查得 $t_{0.025, 24} = 2.064$。那么总体均值 $\mu$ 的 95% 置信区间半宽（误差限 $t_{0.025, 24}\frac{s}{\sqrt{n}}$）是多少？
          answer: 4.128
          hint: 先算标准误 $s/\sqrt{n}$，再乘上 $t$ 临界值 2.064。
          explain: |
            标准误 $10/\sqrt{25} = 2$，半宽为 $2.064 \times 2 = 4.128$（即置信区间为 $[75.872, 84.128]$）。
      - item:
          id: pred-interval-margin
          type: number
          prompt: |
            正态总体方差未知，已知样本量 $n = 25$、样本标准差 $s = 10$、临界值 $t_{0.025, 24} = 2.064$。若要构造**下一个新观测值**的 95% 预测区间，其半宽 $t_{0.025, 24} \cdot s\sqrt{1 + \frac{1}{n}}$ 是多少？（保留至少两位小数）
          answer: 21.048753
          tolerance: 0.01
          hint: 预测区间公式把 $\sqrt{1/n}$ 换成了 $\sqrt{1 + 1/n} = \sqrt{1.04}$。
          explain: |
            $2.064 \times 10 \times \sqrt{1 + 1/25} = 20.64 \times \sqrt{1.04} \approx 21.049$。哪怕样本量扩大到无穷大，均值置信区间会缩成零宽，但预测区间依然保留 $z \cdot \sigma$ 的宽度来覆盖单个新个体的随机波动。
      - item:
          id: ci-interpretation-choice
          type: choice
          prompt: |
            关于置信区间与预测区间，下面哪一句表述正确？
          options:
            - text: 95% 置信区间指构造方法在重复抽样下有 95% 比例覆盖固定真值 $\mu$；预测区间更宽是因为还要容纳新个体的随机波动
              correct: true
            - text: 当样本量 $n$ 趋于无穷大时，总体均值的 95% 置信区间和下一个新观测值的 95% 预测区间都会一起收缩成同一个点
              why: 均值置信区间宽度会缩到 0，但单个新个体依然有 $\sigma$ 级别的随机起伏，预测区间不会缩到 0
            - text: 如果把置信水平从 95% 提高到 99%，算出来的置信区间会变得更窄、更精确
              why: 要想包含真值的把握从 95% 提到 99%，必须采用更大的临界分位数，区间会变宽
            - text: 某次算出均值的 95% 置信区间为 $[10, 20]$，说明下次重抽相同大小样本时，新样本均值必有 95% 的概率落进 $[10, 20]$
              why: 置信水平 95% 指的是随机区间覆盖未知真值 $\mu$ 的概率，而不是本次固定区间覆盖下次样本均值的概率
          explain: |
            把“估计均值的误差（$s/\sqrt{n}$）”和“单个新个体的波动（$s$）”分开，就不会再把置信区间和预测区间搞混。

  - id: ci-large-mle
    chapter: 置信区间
    title: 大样本置信区间与 MLE 渐近区间
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一项网络调查随机问了 400 个人，其中 240 人表示赞成（样本比例 $\hat{p} = 0.6$）。这些结果不是正态分布（每人只回答 0 或 1），还能用 $\hat{p} \pm 1.96\,\mathrm{SE}$ 造出一个近似的 95% 置信区间吗？
          options:
            - text: 可以，样本量 $n = 400$ 较大，由中心极限定理，样本比例 $\hat{p}$ 的抽样分布已接近正态分布
              correct: true
            - text: 不可以，大样本正态近似置信区间要求每一个原始个体观测值本身都服从正态分布，而二元 0/1 调查数据无论样本量多大都只能呈双峰分布
              why: 正态近似要求的是“样本均值或样本比例的抽样分布”接近正态，而不是单个 0/1 观测本身服从正态
            - text: 可以，而且只要样本量超过 100，二项比例的 95% 误差限就恒等于固定常数 $\pm 0.05$，不需要用 $\hat{p}$ 计算标准误
              why: 误差限等于 $1.96\sqrt{\hat{p}(1-\hat{p})/n}$，随样本量 $n$ 和比例 $\hat{p}$ 的具体数值而变化
          explain: |
            即使个体数据不服从正态分布（如 0/1、偏态金额等），只要样本量够大且方差有限，中心极限定理和 MLE 渐近正态性都能用来构造大样本置信区间。
      - card:
          title: 大样本均值与比例置信区间
          body: |
            当总体分布未知或不满足正态假设、但样本量 $n$ 足够大时：
            - **一般总体均值区间**：由中心极限定理和相合性，用 $\bar{x} \pm z_{\alpha/2}\frac{s}{\sqrt{n}}$ 即可近似覆盖 $1-\alpha$（95% 常用 $z_{0.025} = 1.96$）。
            - **二项比例的 Wald 区间**：对于成功比例 $\hat{p} = \frac{1}{n}\sum X_i$，其方差为 $p(1-p)/n$，代换估算标准误 $\mathrm{SE}(\hat{p}) = \sqrt{\frac{\hat{p}(1-\hat{p})}{n}}$，得大样本 95% 区间：
            $$\hat{p} \pm 1.96\sqrt{\frac{\hat{p}(1-\hat{p})}{n}}$$
            （注意当 $n$ 很小或 $\hat{p}$ 接近 0 或 1 时，该近似会变差。）
      - item:
          id: wald-prop-halfwidth
          type: number
          prompt: |
            随机抽检 $n = 100$ 件产品，发现合格比例 $\hat{p} = 0.5$。用二项比例大样本公式计算 95% 置信区间的半宽 $1.96\sqrt{\frac{\hat{p}(1-\hat{p})}{n}}$，结果是多少？
          answer: 0.098
          hint: 先算 $\sqrt{0.5 \times 0.5 / 100} = 0.05$，再乘以 $1.96$。
          explain: |
            $\mathrm{SE}(\hat{p}) = \sqrt{0.25/100} = 0.05$，乘以 $1.96$ 得半宽 $0.098$（即 95% 置信区间为 $[0.402, 0.598]$）。
      - card:
          title: 用 Fisher 信息构造 MLE 渐近 95% 置信区间
          body: |
            把思路推广到任意参数模型：由最大似然估计的渐近正态性，只要正则条件成立且样本量较大，最大似然估计 $\hat{\theta}$ 近似服从 $N(\theta, \mathrm{SE}(\hat{\theta})^2)$，其中标准误可以通过总 Fisher 信息 $I_n(\hat{\theta})$ 或观测 Fisher 信息 $J(\hat{\theta}) = -\ell''(\hat{\theta})$ 拿到：
            $$\hat{\theta} \pm 1.96 \cdot \frac{1}{\sqrt{J(\hat{\theta})}}$$
            当未知参数有多个时，也只需取出信息表求逆后的主对角条目对应的标准误 $\mathrm{SE}(\hat{\theta}_j)$，即可分别为每个参数写出渐近 95% 置信区间。
      - item:
          id: mle-asymp-ci-lower
          type: number
          prompt: |
            对一批大样本求得某参数的最大似然估计 $\hat{\theta} = 4.0$，在最优点算得观测 Fisher 信息为 $J(\hat{\theta}) = 25$。由此构造的 95% 渐近置信区间（取 $z_{0.025} = 1.96$）的**下限**是多少？
          answer: 3.608
          hint: 标准误是 $1/\sqrt{25} = 0.2$，下限等于 $\hat{\theta} - 1.96 \cdot \mathrm{SE}$。
          explain: |
            $\mathrm{SE} = 1/\sqrt{25} = 0.2$，误差限 $1.96 \times 0.2 = 0.392$，因此下限是 $4.0 - 0.392 = 3.608$（区间为 $[3.608, 4.392]$）。
      - item:
          id: large-sample-caveat
          type: choice
          prompt: |
            在下面哪种情况下，直接套用大样本比例正态近似区间 $\hat{p} \pm 1.96\sqrt{\hat{p}(1-\hat{p})/n}$ 最容易出严重偏差？
          options:
            - text: 样本量只有 $n = 15$ 且成功次数是 $k = 0$（$\hat{p} = 0$），算出的标准误和区间宽度直接塌缩成 0
              correct: true
            - text: 样本量 $n = 1000$，观测比例 $\hat{p} = 0.48$
              why: 这里 $np = 480$ 且 $n(1-p) = 520$ 都很大，正态近似很准确
            - text: 样本量 $n = 500$，观测比例 $\hat{p} = 0.20$
              why: 这里 $np = 100$ 远大于 10，正态近似通常表现良好
            - text: 原本是双侧 95% 区间，后来改成算双侧 90% 区间
              why: 只改置信水平（将 1.96 换成 1.645）本身不会破坏大样本近似前提
          explain: |
            当 $k = 0$ 时，$\hat{p} = 0$ 会让 $\sqrt{\hat{p}(1-\hat{p})/n}$ 直接算成 0，得出 $[0, 0]$ 的零宽度区间；这说明小样本和接近 0 或 1 的边界比例不宜直接套用普通 Wald 区间。
      - item:
          id: ci-choice-comparison
          type: choice
          prompt: |
            手里有一组测量数据，需要选择构造总体均值置信区间的方法。下面哪项选择最合适？
          options:
            - text: 正态小样本且方差未知时用 $t$ 区间；大样本下一般总体可用渐近正态 $z$ 区间
              correct: true
            - text: 当总体方差未知时，$t$ 置信区间一定比同置信水平的 $z$ 置信区间更窄，因为用样本标准差 $s$ 代替总体标准差 $\sigma$ 消除了总体参数的不确定性
              why: 用样本标准差 $s$ 估计未知 $\sigma$ 增加了额外的不确定性，同一置信水平下 $t$ 临界值大于 $z$ 临界值，因此 $t$ 区间更宽
            - text: 只要样本量只有 $n = 8$，不管总体是否严重偏态，直接用标准正态分位数 $1.96$ 构造的 $z$ 区间都比 $t$ 区间覆盖率更准
              why: 小样本且偏态时中心极限定理尚未生效，且 $z$ 区间比 $t$ 区间更窄，实际覆盖率会明显低于标称的 95%
            - text: 即使总体严格服从正态分布而且总体标准差 $\sigma$ 精确已知，在样本量小于 30 时也不能使用 $z$ 置信区间
              why: 当总体正态且 $\sigma$ 已知时，标准化均值在任意样本量 $n$ 下都精确服从 $N(0,1)$，此时 $z$ 区间就是精确区间
          explain: |
            记住经验界线：正态小样本且方差未知用 $t$，非正态小样本别硬套 $z$（可以转向下一课的自助法），大样本均值或 MLE 可使用渐近正态区间。

  - id: ci-bootstrap
    chapter: 置信区间
    title: 自助法置信区间与参数变换
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            你手里只有 30 个用户消费金额的数据（明显右偏，有很多小额订单和几个大额订单），你想给“消费额中位数”算一个 95% 置信区间，但中位数既没有现成的正态公式，也不好手写分布推导。有没有办法用电脑直接从这 30 个数里模拟出它的波动范围？
          options:
            - text: 把这 30 个样本看作经验总体，有放回地反复重抽 30 个数并重算中位数，用模拟分布的分位数构造区间
              correct: true
            - text: 从这 30 个数据里无放回地每次抽取 30 个数重算中位数，重复 2000 次后再用这 2000 个中位数的样本标准差套用正态区间公式
              why: 从 30 个数里无放回抽取 30 个数，每一次拿到的都是完全相同的原样本，算出的中位数没有任何波动
            - text: 把这 30 个数从小到大排序后，直接拿第 1 个数（最小值）和第 30 个数（最大值）作为总体中位数的 95% 置信区间
              why: 样本最小值和最大值反映的是单个消费额的极端跨度，随样本量增大反而越来越宽，不是中位数的置信区间
          explain: |
            直接把已有的样本看作经验总体反复有放回重抽，借电脑模拟出统计量的抽样分布——这就是自助法。
      - card:
          title: 偏态与厚尾数据的挑战（以 t 分布数据为例）
          body: |
            前面用的正态渐近区间在数据对称、方差有限时很准；但遇到厚尾数据（比如来自低自由度 $t$ 分布或帕累托分布的样本，极端大值常出没）时，有限样本的抽样分布往往仍偏斜或带有更宽的尾部，硬套对称的 $\hat{\theta} \pm 1.96\,\mathrm{SE}$ 覆盖率容易打折。
            这时可以改用**自助法（bootstrap）**：既然不知道总体的真实面貌，就用手里这批样本去充当“替代总体”，在计算机里反复抽样来直接观察统计量的波动。
      - card:
          title: 非参数自助法与参数自助法
          body: |
            自助法分两条路径：
            - **非参数自助法（nonparametric bootstrap）**：不假设总体分布族，直接从原样本 $x_1, \dots, x_n$ 中**有放回地**随机抽 $n$ 个数构成自助样本，算统计量 $\hat{\theta}^*$。重复 $B$ 次（如 $2000$ 次），取第 $2.5\%$ 与第 $97.5\%$ 分位数作为 95% **百分位数置信区间**。
            - **参数自助法（parametric bootstrap）**：若已知参数模型（如含尺度与形状双参数的帕累托分布，或 $t$ 分布），先由原样本算 MLE $\hat{\theta}$，再从拟合分布 $F_{\hat{\theta}}$ 里反复生成 $B$ 组大小为 $n$ 的样本，用模拟分位数构造区间。
      - item:
          id: bootstrap-order
          type: order
          prompt: |
            把用**非参数自助法百分位数方法**构造 95% 置信区间的标准流程按先后顺序排列。
          steps:
            - "从原始的 n 个样本中有放回地随机抽取 n 个值，组成一个自助样本"
            - "在这个自助样本上用相同公式计算出统计量估计值"
            - "将前两步独立重复 B 次（例如 2000 次），收集一列自助估计值"
            - "把这 B 个估计值从小到大排序，取第 2.5% 和第 97.5% 分位数作为置信区间上下限"
          explain: |
            自助法之所以叫“有放回抽样”正是因为如果无放回抽 $n$ 个数，每次都会拿到同一批原数字，算出的结果没有波动。
      - item:
          id: param-vs-nonparam-boot
          type: choice
          prompt: |
            下面关于参数自助法和帕累托等厚尾两参数模型应用的说法，哪一项准确？
          options:
            - text: 参数自助法先用原样本估计分布参数，再从拟合出的分布里生成模拟样本；非参数自助法直接对原始观测有放回重抽
              correct: true
            - text: 参数自助法不需要知道样本大小 $n$，每次只需随机生成 1 个数即可
              why: 每次模拟都必须生成和原样本同样大小 $n$ 的样本集，才能反映样本量 $n$ 对应的抽样误差
            - text: 帕累托分布只要有位置和形状两个参数，它的自助法就必须无放回抽样
              why: 无论是参数生成还是非参数重抽，本质都是独立抽取长度为 $n$ 的完整模拟样本
            - text: 非参数自助法即使在原样本只有 2 个观测值时，也能准确还原重尾分布的极端分位数
              why: 原样本本身太小或遗漏了厚尾极端值时，非参数重抽无法产生未观测到的新尾部，此时合理的参数模型更稳健
          explain: |
            没有强分布把握时用非参数自助法最省心；有可靠厚尾参数家族（如帕累托分布）时用参数自助法能平滑尾部、更好处理双参数协同不确定性。
      - card:
          title: 参数变换后再构造区间
          body: |
            很多参数有固有边界：比如标准差 $\sigma > 0$、概率 $p \in (0, 1)$。如果在原尺度直接套对称的 $\hat{\sigma} \pm 1.96\,\mathrm{SE}$，样本较小时下限常常掉到 0 以下，算出负的标准差。
            更好的做法是先做无约束变换：对正数取 $\phi = \ln\theta$（值域变成整个实轴 $(-\infty, +\infty)$），或对比例取 $\phi = \ln\frac{p}{1-p}$（logit）。在 $\phi$ 尺度下因为对称性更好、没有边界阻挡，算出置信区间 $[L_\phi, U_\phi]$（用 Delta 方法、自助法标准误或正态近似），最后再反变换回去：$[e^{L_\phi}, e^{U_\phi}]$。这样得到的区间既能反映右偏形态，也不会越出参数的取值范围。
      - item:
          id: transform-ci-upper
          type: number
          prompt: |
            某正参数 $\theta > 0$ 先做了对数变换 $\phi = \ln\theta$。在 $\phi$ 尺度上算出的 95% 置信区间为 $[0.0, 2.0]$。把它用 $e^\phi$ 反变换回原始 $\theta$ 尺度后，区间的上限 $e^2$ 是多少？（保留至少三位小数）
          answer: 7.389056
          tolerance: 0.005
          hint: 下限是 $e^0 = 1$，算一算 $e^2 \approx 2.71828^2$。
          explain: |
            反变换得到 $[e^0, e^2] = [1, 7.389]$。注意它不再关于点估计 $e^1 \approx 2.718$ 左右对称，而且下限严格大于 0，贴合正参数分布右偏的实际情况。
      - item:
          id: bootstrap-transform-why
          type: choice
          prompt: |
            对严格大于 0 的参数（比如标准差或尺度参数）构造置信区间时，为什么经常先对 $\ln\theta$ 算对称区间或自助法正态区间，再取指数 $e^{(\cdot)}$ 变回来？
          options:
            - text: 对数变换把 $(0, +\infty)$ 映射到整条实轴，对称近似更准，且指数反变换后的上下限自然大于 0
              correct: true
            - text: 因为自助法百分位数区间不具备单调变换不变性，如果在原始正参数尺度上直接排序取第 2.5% 和第 97.5% 分位数，算出的下限也经常会变成负数
              why: 百分位数法本身保持单调变换不变，正样本算出的正统计量分位数不会是负数；对数变换主要是为了改善基于标准误的对称正态近似区间
            - text: 因为对参数取自然对数以后，按照 Delta 方法传播出来的渐近标准误恒等于 0，能把置信区间宽度压缩到最小
              why: 对数变换后的标准误按 Delta 方法约为 $\mathrm{SE}(\hat{\theta})/\hat{\theta}$，不会变成 0
            - text: 因为先在对数尺度构造 95% 区间再取指数反变换，可以把原始尺度上的置信水平自动提升到 99%
              why: 单调反变换保持覆盖概率不变，变换后的置信水平依然是 95%
          explain: |
            在无约束空间做近似、最后单调映射回原空间，是解决正参数和比例参数置信区间“超出边界与偏斜”的常用技巧。

  # =====================================================================
  # 第 6 章：检验
  # =====================================================================
  - id: hypothesis-logic
    chapter: 检验
    title: 假设检验的步骤与 p 值含义
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一枚硬币抛 20 次出现了 14 次正面。若假设“硬币均匀（$p = 0.5$）”为真，算出“出现至少这么偏向一侧的结果”的概率是 $0.115$（大于 0.05），因此决定“不拒绝硬币均匀”。这能证明“这枚硬币严格均匀”吗？
          options:
            - text: 不能，这只说明 20 次样本还不足以推翻 $p = 0.5$，真实概率也可能是 0.58 等邻近值
              correct: true
            - text: 能证明，在假设检验中只要算出的 $p$ 值大于显著性水平 $\alpha = 0.05$，就等价于在数学上确认了零假设 $p = 0.5$ 成立的概率至少有 95%
              why: 不拒绝 $H_0$ 只是当前样本证据不够强（可能是样本量 $n=20$ 太小、检验功效不足），并不给出 $H_0$ 为真的概率
            - text: 能证明，因为 $p = 0.115$ 表示这枚硬币有 $1 - 0.115 = 88.5\%$ 的概率是一枚均匀硬币
              why: $0.115$ 是在假定 $p=0.5$ 成立的前提下算出的样本极端概率，不是“硬币均匀”的概率
          explain: |
            假设检验就像法庭的“无罪推定”：证据不足时判“证据不足、不予认定（不拒绝 $H_0$）”，但不等于证明零假设精确成立。
      - card:
          title: 假设检验的逻辑与五步流程
          body: |
            假设检验采用“统计版反证法”：先默认**零假设** $H_0$ 成立，算一个反映数据偏离程度的**检验统计量**，看在这个默认前提下拿到当前样本有多稀奇。标准流程有五步：
            1. 提出相互对立的 $H_0$ 与**备择假设** $H_1$（分双侧 $p \neq p_0$ 或单侧 $p > p_0$），并预先定好**显著性水平** $\alpha$（如 $0.05$）；
            2. 选定在 $H_0$ 下分布已知的检验统计量（如 $z$ 或 $t$）；
            3. 代入样本数值算出统计量的观测值；
            4. 算出对应的 **p 值**，或看观测值有没有落进预先划定的拒绝域；
            5. 给出统计结论：若 $p \le \alpha$ 则**拒绝 $H_0$**，否则只能说**没有足够证据拒绝 $H_0$**。
      - item:
          id: testing-five-steps
          type: order
          prompt: |
            把执行一次标准假设检验的五个核心步骤按正确逻辑顺序排好。
          steps:
            - "写出零假设 H₀、备择假设 H₁，并提前设定显著性水平 α"
            - "确定零假设成立时所用的检验统计量及其分布"
            - "代入观测样本数据算出检验统计量的具体数值"
            - "根据统计量数值计算 p 值或对照临界拒绝域"
            - "比较 p 值与 α（或临界值），作出拒绝或不拒绝 H₀ 的结论"
          explain: |
            先立假设和门槛 $\alpha$、再算统计量和 $p$ 值、最后做决定，顺序不可颠倒（切忌看完了 $p$ 值再回头修改 $\alpha$ 或假设方向）。
      - card:
          title: p 值的精确含义与常见误区
          body: |
            **p 值（p-value）**的定义是：*假定零假设 $H_0$ 确实为真*，在同样抽样规则下得到“至少像当前观测这么极端（或更偏向 $H_1$）”的结果的概率。
            $p$ 值越小，说明“如果 $H_0$ 是真的，出现手头样本就越罕见”，因此越有理由怀疑并拒绝 $H_0$。但务必避开两个典型误区：
            - **误区一**：把 $p = 0.03$ 误解成“$H_0$ 为真的概率只有 3%”。错，频率派里 $H_0$ 要么真要么假，没有概率；$0.03$ 是“假设 $H_0$ 真时，数据这么极端的条件概率”。
            - **误区二**：把“统计显著（$p < 0.05$）”当成“实际效果很大”。样本量上百万时，哪怕均值只差 $0.001$，$p$ 值也可以很小，但实际业务意义很有限。
      - item:
          id: pvalue-meaning-choice
          type: choice
          prompt: |
            在一次检验里得到 $p = 0.02$（设显著性水平 $\alpha = 0.05$）。下面哪一句对 $p = 0.02$ 的解读是正确的？
          options:
            - text: 假定零假设成立时，抽样得到至少像本次样本这么极端结果的概率是 0.02，因此在 $\alpha = 0.05$ 下拒绝零假设
              correct: true
            - text: 给定本次观测到的样本数据后，零假设在现实中成立的后验概率只有 2%，而备择假设成立的概率达到了 98%
              why: 这混淆了条件概率的方向：$p$ 值是 $P(\text{这么极端的数据} \mid H_0)$，不是 $P(H_0 \mid \text{数据})$
            - text: 如果按照 $p \le 0.05$ 的规则拒绝零假设，该检验规则在长期重复抽样下的第一类错误率上限就自动降到了 0.02
              why: 只要事先设定的判定规则是“$p \le 0.05$ 就拒绝”，该规则长期犯第一类错误的概率上限仍是 $\alpha = 0.05$
            - text: 因为 $p = 0.02 < 0.05$，说明备择假设对应的真实参数效应量在现实业务中一定很大
              why: $p$ 值同时受效应大小和样本量 $n$ 影响；当样本量很大时，微小的效应也会算出很小的 $p$ 值
          explain: |
            记住条件概率的方向：$p$ 值始终是“在假定 $H_0$ 成立的前提下，观测数据达到或超过当前极端程度的概率”。
      - item:
          id: two-sided-pvalue-calc
          type: number
          prompt: |
            在一个双侧 $z$ 检验（$H_1: \mu \neq \mu_0$）中，算得检验统计量 $z = -1.96$。已知标准正态分布右尾概率 $P(Z \ge 1.96) = 0.025$。那么这次双侧检验的 $p$ 值是多少？
          answer: 0.05
          hint: “至少像 -1.96 这么极端”对双侧备择假设来说，包含左尾 $\le -1.96$ 和右尾 $\ge +1.96$ 两边。
          explain: |
            由标准正态分布的对称性，左尾 $P(Z \le -1.96) = 0.025$，双侧备择假设要把同样极端的两头加起来：$p = 2 \times 0.025 = 0.05$。
      - item:
          id: statistical-vs-practical
          type: choice
          prompt: |
            某大型网站做了 200 万人的测试，新按钮把点击率从 10.00% 提高到 10.03%，算得 $p = 0.0001$。怎么评价这一结果？
          options:
            - text: 在统计学上显著（拒绝“毫无变化”的零假设），但 0.03 个百分点的提升在实际业务中可能很小，需结合收益与改造成本权衡
              correct: true
            - text: 因为 $p = 0.0001$ 远小于 0.05，说明新按钮在实际业务中带来了很大比例的点击率增长
              why: 样本量 $n = 200$ 万会把标准误压得很小，即使 0.03 个百分点的微弱差异也能算出很小的 $p$ 值
            - text: 因为点击率只提高了 0.03 个百分点，所以算出 $p = 0.0001$ 一定是检验统计量的公式用错了
              why: 只要真实差异不为零且样本量足够大，$z$ 统计量就会很大、$p$ 值就会很小，计算本身没有错
            - text: 当样本量超过 10 万时，中心极限定理不再适用，不能再做假设检验
              why: 样本量越大中心极限定理近似越准，只是决策时不能只看 $p$ 值，还要结合效应大小和置信区间
          explain: |
            $p$ 值回答“有没有超出抽样误差的证据”，效应大小与置信区间才回答“变化大不大、值不值得做”。

  - id: tests-normal-duality
    chapter: 检验
    title: 均值与比例检验及区间对偶性
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            同一个样本数据下，我们算出了总体均值 $\mu$ 的 95% 置信区间是 `[4.915, 5.285]`。现在换用 $\alpha = 0.05$ 做双侧 $t$ 检验，测试零假设 $H_0: \mu = 5.30$。不用重新查 $t$ 分布，你能猜出检验结论吗？
          options:
            - text: 一定拒绝 $H_0$，因为 5.30 落在了 95% 置信区间的外部
              correct: true
            - text: 一定不能拒绝 $H_0$，因为 5.30 离 5.285 只差了一点点
              why: 只要超出临界点对应的区间边界，对应的 $|t|$ 统计量就严格大于临界值 $t_{\alpha/2}$，必须拒绝
            - text: 置信区间和假设检验毫无数学联系，必须完全重新算一遍才知道
              why: 两者底层使用的是同一个 $t$ 统计量不等式，只是把不等号分别解给 $\mu$ 和 $\bar{X}$
          explain: |
            双侧检验和置信区间就像同一枚硬币的正反面，检验值是不是在区间外，等价于统计量有没有进入拒绝域。
      - card:
          title: 比例检验与正态总体均值检验
          body: |
            常用的几个单样本检验：
            - **比例的大样本 $z$ 检验**（$H_0: p = p_0$）：在 $H_0$ 成立时，标准误用 $p_0$ 算出，因此检验统计量为 $z = \frac{\hat{p} - p_0}{\sqrt{p_0(1-p_0)/n}}$（$n$ 较大时近似 $N(0,1)$）。
            - **正态均值 $z$ 检验（$\sigma$ 已知）**：$z = \frac{\bar{X} - \mu_0}{\sigma/\sqrt{n}} \sim N(0, 1)$。
            - **正态均值 $t$ 检验（$\sigma$ 未知）**：用样本标准差 $S$ 替换 $\sigma$，$t = \frac{\bar{X} - \mu_0}{S/\sqrt{n}} \sim t(n-1)$。
      - card:
          title: 例子：零件长度的单样本 t 检验与区间对照
          body: |
            回到 10 个零件样本（$\bar{x} = 5.10$，$s \approx 0.2582$，标准误 $s/\sqrt{10} \approx 0.08165$），以 $\alpha = 0.05$ 双侧检验 $H_0: \mu = 5.3$ 对 $H_1: \mu \neq 5.3$（临界值 $t_{0.025, 9} = 2.262$）。
          reveal:
            - title: 第 1 步：代入数据算 t 统计量
              body: |
                $$t = \frac{5.10 - 5.3}{0.08165} \approx -2.45$$
            - title: 第 2 步：比对拒绝域并对照置信区间
              body: |
                $|t| \approx 2.45 > 2.262$（双侧 $p \approx 0.037 < 0.05$），落入拒绝域，因此拒绝 $H_0$。与此同时，之前算的 95% 置信区间是 $[4.915, 5.285]$，候选值 $5.3$ 恰好落在这个区间之外，两者结论完全一致。
      - item:
          id: prop-z-test-calc
          type: number
          prompt: |
            检验一枚硬币是否均匀（$H_0: p = 0.5$）。抛掷 $n = 100$ 次看到 62 次正面（$\hat{p} = 0.62$）。用零假设下的标准误 $\sqrt{0.5 \times 0.5 / 100} = 0.05$ 计算检验统计量 $z = \frac{\hat{p} - p_0}{\mathrm{SE}_0}$ 的值是多少？
          answer: 2.4
          hint: 计算 $(0.62 - 0.50) / 0.05$。
          explain: |
            $z = \frac{0.62 - 0.5}{0.05} = \frac{0.12}{0.05} = 2.4$。$|z| = 2.4 > 1.96$，在 $\alpha = 0.05$ 水平下拒绝硬币均匀的零假设。
      - item:
          id: normal-z-known-sigma
          type: number
          prompt: |
            已知某生产线产品重量总体标准差 $\sigma = 6$ 克。检验 $H_0: \mu = 100$，抽样 $n = 36$ 个测得样本均值 $\bar{x} = 98$ 克。计算 $z$ 统计量 $\frac{\bar{x} - \mu_0}{\sigma/\sqrt{n}}$ 的值。
          answer: -2
          hint: 先算标准误 $6/\sqrt{36} = 1$，注意分子是观测均值减去假设均值。
          explain: |
            $z = \frac{98 - 100}{6/6} = -2$。因为 $|z| = 2 > 1.96$，在双侧 $5\%$ 显著性水平下拒绝 $H_0$。
      - card:
          title: 置信区间与假设检验的对偶性
          body: |
            为什么在上面的零件例子里，“$\mu_0 = 5.3$ 落在 95% 置信区间外”和“双侧 $\alpha = 0.05$ 检验拒绝 $H_0: \mu = 5.3$”会得出同一个结论？因为两者的数学不等式是同一个：
            $$\left|\frac{\bar{X} - \mu_0}{S/\sqrt{n}}\right| \le t_{\alpha/2,\,n-1} \iff \bar{X} - t_{\alpha/2,\,n-1}\frac{S}{\sqrt{n}} \le \mu_0 \le \bar{X} + t_{\alpha/2,\,n-1}\frac{S}{\sqrt{n}}$$
            这就是**区间–检验对偶性**：参数候选值 $\theta_0$ 落在 $1 - \alpha$ 双侧置信区间内部，当且仅当在显著性水平 $\alpha$ 下双侧检验**不拒绝** $H_0: \theta = \theta_0$。置信区间把所有“不与当前样本显著矛盾的参数候选值”一次性列了出来。
      - item:
          id: ci-test-duality-item
          type: choice
          prompt: |
            根据一批样本算得某药物平均降温幅度的 95% 置信区间为 $[1.2, 2.8]$ 摄氏度。在同一批数据下以 $\alpha = 0.05$ 做双侧检验，测试 $H_0: \mu = 3.0$，结论是什么？
          options:
            - text: 拒绝 $H_0$，因为 3.0 落在 95% 置信区间的外部
              correct: true
            - text: 不拒绝 $H_0$，因为 3.0 比 2.8 大，说明效果更强
              why: 3.0 在置信区间外说明样本均值显著低于 3.0，反而是与假设值 3.0 相矛盾的证据
            - text: 无法判断，置信区间里没写样本量和标准差
              why: 95% 置信区间已经整合了样本量和标准误信息，依据对偶性无需原始数据即可直接判断双侧 $\alpha = 0.05$ 检验结果
            - text: '只有测试 $H_0: \mu = 0$ 时才能用置信区间代替检验'
              why: 对任意基准数值 $\mu_0$，双侧置信区间都与相应的 $\alpha$ 双侧检验一一等价
          explain: |
            由于 $[1.2, 2.8]$ 不包含 3.0，双侧检验的 $p$ 值必小于 0.05，因此必然拒绝 $H_0: \mu = 3.0$。
      - card:
          title: 双总体对比与非参数检验
          body: |
            当我们要比较两组样本（例如新旧两种工艺的零件强度）时，在正态假设下可以用双样本 $t$ 检验比较两总体均值之差 $\mu_1 - \mu_2$，用样本方差之比 $S_1^2/S_2^2$ 构造 $F$ 检验比较两总体方差。
            但如果样本量很小（如 $n = 9$），数据又明显右偏或混有极端离群值，样本均值和样本标准差就会被那个离群值拉偏，正态 $t$ 检验不再稳健。这时可以改用不假设正态分布的**非参数检验**：例如只数数据在中位数上下正负号个数的**符号检验**，或者先把数据从小到大排好名次（秩）、再用名次和代替原始数值做检验的**秩和检验**。
      - item:
          id: nonparametric-when-choice
          type: choice
          prompt: |
            下面哪种情况最适合放弃正态假设下的参数 $t$ 检验，改用基于秩次或符号的非参数检验？
          options:
            - text: 样本量只有 $n = 9$，分布明显右偏且含有一个极端离群值
              correct: true
            - text: 样本量达到 $n = 500$ 且数据呈对称钟形分布，希望尽可能利用每个观测值的精确数值大小来获得最高的检验功效
              why: 大样本对称数据下 $t$ 检验很稳健，且利用具体数值大小比只看排名保留更多信息、功效更高
            - text: 已知总体严格服从正态分布且总体标准差 $\sigma$ 精确已知
              why: 此时正态 $z$ 检验是精确且功效最高的方法
            - text: 实验目的只是计算总体方差的无偏点估计，不需要对任何假设做显著性检验
              why: 符号检验和秩和检验是假设检验方法，不是用来求总体方差无偏点估计的工具
          explain: |
            参数检验前提成立时信息利用率更高；当小样本且分布严重偏斜或受离群值影响时，基于名次的非参数检验更稳健。

  - id: wald-and-multi
    chapter: 检验
    title: 从单参数到多参数的 Wald 检验
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            对于非正态的复杂模型（例如比较两组网页的转化率之差 $p_1 - p_2$），我们手头既算出了最大似然估计差值 $\hat{\Delta} = \hat{p}_1 - \hat{p}_2$，又靠大样本公式或信息矩阵算出了它的近似标准误 $\mathrm{SE}(\hat{\Delta})$。你猜怎么快速判断 $H_0: \Delta = 0$？
          options:
            - text: 用估计差值除以它的渐近标准误，看偏离零假设达到多少个标准误
              correct: true
            - text: 只要两个网页的实验样本量 $n_1$ 和 $n_2$ 不完全相等，大样本正态近似就会失效，必须先把人数较多那一组的数据随机删到和另一组一样多
              why: 独立两组的差值标准误 $\sqrt{\mathrm{SE}_1^2 + \mathrm{SE}_2^2}$ 不要求两组样本量相等，删掉样本反而白白损失信息
            - text: 直接比较两组样本容量的大小，哪一组的访问人数更多，哪一组的真实转化率就一定显著更高
              why: 样本容量只是参与实验的人数，跟转化率参数本身的高低没有关系
          explain: |
            利用大样本渐近正态性构造出来的通用检验，叫做 Wald 检验。无论是单参数还是多参数同时检验，它都能用这一套统一模板处理。
      - card:
          title: Wald 检验的通用配方
          body: |
            针对大样本下的参数检验 $H_0: \theta = \theta_0$，**Wald 检验（Wald test）**只需要把不加限制的最大似然估计 $\hat{\theta}$ 和它的渐近标准误 $\mathrm{SE}(\hat{\theta})$ 代入下式：
            $$W = \frac{\hat{\theta} - \theta_0}{\mathrm{SE}(\hat{\theta})}$$
            在 $H_0$ 成立且样本较大时，$W$ 近似服从标准正态分布 $N(0, 1)$；等价地，把统计量平方写作 $W^2 = \frac{(\hat{\theta} - \theta_0)^2}{\mathrm{Var}(\hat{\theta})}$，它在 $H_0$ 下近似服从自由度为 1 的 $\chi^2(1)$ 分布（双侧 $5\%$ 临界值对应 $|W| > 1.96$，即 $W^2 > 3.8416$）。
      - item:
          id: wald-stat-num
          type: number
          prompt: |
            某参数的大样本 MLE 为 $\hat{\theta} = 2.6$，通过观测 Fisher 信息算得标准误 $\mathrm{SE}(\hat{\theta}) = 0.2$。检验 $H_0: \theta = 2.0$ 时，Wald 统计量 $W = \frac{\hat{\theta} - \theta_0}{\mathrm{SE}(\hat{\theta})}$ 等于多少？
          answer: 3
          hint: 算一算 $(2.6 - 2.0)$ 是几个标准误。
          explain: |
            $W = \frac{2.6 - 2.0}{0.2} = 3$。偏移达到 3 个标准误，远大于 1.96，有很强证据拒绝 $H_0$。
      - item:
          id: wald-chisq-num
          type: number
          prompt: |
            接单维平方形式定义：若一次检验算得 $W = 3$，对应的卡方形式 Wald 统计量 $W^2$ 等于多少？
          answer: 9
          hint: 直接把单维标准正态形式的统计量平方。
          explain: |
            单个标准正态随机变量的平方服从 $\chi^2(1)$ 分布，所以 $W^2 = 3^2 = 9$（$1.96^2 \approx 3.8416$）。
      - card:
          title: 从单参数走向多参数差值与联立检验
          body: |
            面对多个参数 $(\theta_1, \dots, \theta_d)$，如果关心两个参数之差 $H_0: \theta_1 - \theta_2 = 0$，只需用信息表求逆或独立方差相加规则算出差值的标准误 $\mathrm{SE}(\hat{\theta}_1 - \hat{\theta}_2)$，就能继续套用单维 Wald 公式。
            如果是同时检验多个等式（比如 $H_0: \theta_1 = \theta_2 = \theta_3$ 共 $q$ 个约束），把各参数差值和协方差表求逆后拼成加权平方和统计量 $W_q^2$，它在 $H_0$ 下近似服从自由度为 $q$ 的卡方分布 $\chi^2(q)$。
      - card:
          title: 例子：两组比例差的 Wald 检验
          body: |
            某 A/B 实验：对照组 100 人成交 45 人（$\hat{p}_2 = 0.45$），实验组 100 人成交 60 人（$\hat{p}_1 = 0.60$）。用 Wald 检验测试 $H_0: p_1 - p_2 = 0$。
          reveal:
            - title: 第 1 步：算差值估计与独立组差值的标准误
              body: |
                估计差值 $\hat{\Delta} = 0.60 - 0.45 = 0.15$。两组独立，方差直接相加：
                $$\mathrm{SE}(\hat{\Delta}) = \sqrt{\frac{0.60 \times 0.40}{100} + \frac{0.45 \times 0.55}{100}} = \sqrt{0.0024 + 0.002475} \approx 0.06982$$
            - title: 第 2 步：计算 Wald 统计量并做决定
              body: |
                $$W = \frac{0.15 - 0}{0.06982} \approx 2.148,\quad W^2 \approx 4.615$$
                由于 $|W| > 1.96$（等价于 $W^2 > 3.8416$），在 $5\%$ 显著性水平下拒绝两组成交率相同的零假设。
      - item:
          id: wald-two-group-diff
          type: number
          prompt: |
            独立测试两组策略的留存率。估计差值为 $\hat{\Delta} = 0.24$，两组各自独立估计的标准误分别为 $0.06$ 和 $0.08$，因此差值的合并标准误为 $\sqrt{0.06^2 + 0.08^2}$。检验 $H_0: \Delta = 0$ 时的 Wald 统计量 $W = \frac{\hat{\Delta}}{\mathrm{SE}(\hat{\Delta})}$ 是多少？
          answer: 2.4
          hint: 先算 $\sqrt{0.0036 + 0.0064} = 0.10$，再用 $0.24$ 除以它。
          explain: |
            独立两组差值的方差相加：$\mathrm{SE}(\hat{\Delta}) = \sqrt{0.06^2 + 0.08^2} = 0.10$，于是 $W = \frac{0.24}{0.10} = 2.4$（$|W| > 1.96$，显著）。
      - card:
          title: 比较 Wald 检验与 Neyman–Pearson 似然比思想
          body: |
            除了在 $\hat{\theta}$ 处看偏离了多少个标准误（Wald 检验），另一条常用的思路源自 **Neyman–Pearson 引理**的似然比思想：如果直接比较“在 $H_0$ 约束下的最大对数似然 $\ell(\hat{\theta}_0)$”与“不加约束的全局最大对数似然 $\ell(\hat{\theta})$”，看峰顶落差 $2[\ell(\hat{\theta}) - \ell(\hat{\theta}_0)]$ 有多大，就得到**似然比检验（likelihood ratio test, LRT）**。
            在大样本下，Wald 检验和似然比检验都趋近同一个 $\chi^2$ 分布；但 Wald 只需拟合一次无约束模型（不必另行在 $H_0$ 下解约束优化），因此在复杂统计建模里特别常用。
      - item:
          id: wald-vs-lrt-choice
          type: choice
          prompt: |
            对比 Wald 检验和似然比检验，下面哪一项描述了 Wald 检验的特点？
          options:
            - text: Wald 检验只需在无约束模型下求一次 MLE 及其标准误，再和 $\theta_0$ 对比；而似然比检验还要在 $H_0$ 约束下再求一次受限最大值
              correct: true
            - text: Wald 检验不需要估计标准误，只看两个点的似然函数值之差
              why: 只看无约束与有约束对数似然之差的是似然比检验；Wald 检验恰恰依赖在无约束处算出的标准误
            - text: Wald 检验只适用于参数个数恰好为 1 的模型，不能检验多个参数
              why: 借助信息矩阵求逆，多参数形式 $W_q^2$ 可以同时检验 $q$ 个相等或对比约束
            - text: 在小样本非对称曲率模型中，Wald 检验永远比任何精确检验更准确
              why: 小样本里，标准误近似和参数非线性会导致 Wald 检验失去尺度不变性，此时似然比或精确检验往往更稳
          explain: |
            Wald 检验胜在方便（拟合一次全模型即可检验任意假设），但大样本假设和尺度选择需要留心。
      - item:
          id: match-inference-pillars
          type: match
          prompt: |
            把数理统计推断里的四个核心工具和各自解决的核心问题连起来。
          pairs:
            - ["最大似然估计（MLE）", "挑选最能合理解释手头样本的参数点估计"]
            - ["Delta 方法", "利用导数近似传播参数函数变换后的标准误"]
            - ["置信区间", "给出在重复抽样下按规定比例覆盖真值的范围"]
            - ["Wald 检验", "用估计值偏离零假设的标准误倍数做显著性判定"]
          explain: |
            从抽样分布、点估计与大样本方法，到最大似然、置信区间与检验，这几块工具环环相扣，将在回归建模和机器学习中反复登场。
boss:
  items:
    - id: b-order-stat
      type: number
      prompt: |
        设 3 个独立同分布的随机变量 $X_1, X_2, X_3$ 均服从 $[0, 1]$ 上的均匀分布（$F(x) = x$）。最大的那个值 $X_{(3)}$ **大于** $0.5$ 的概率是多少？
      answer: 0.875
      hint: 先求它的补事件“三个数全部不超过 0.5”的概率，再用 1 减去它。
      explain: |
        $P(X_{(3)} \le 0.5) = 0.5^3 = 0.125$，所以 $P(X_{(3)} > 0.5) = 1 - 0.125 = 0.875$。
    - id: b-mse-decomp
      type: number
      prompt: |
        已知某个点估计量的偏差 $\mathrm{Bias}(\hat{\theta}) = -3$，抽样方差 $\mathrm{Var}(\hat{\theta}) = 16$。它的均方误差 $\mathrm{MSE}(\hat{\theta})$ 是多少？
      answer: 25
      hint: 回想偏差–方差分解：$\mathrm{MSE} = \mathrm{Var} + \mathrm{Bias}^2$。
      explain: |
        $\mathrm{MSE}(\hat{\theta}) = 16 + (-3)^2 = 16 + 9 = 25$。偏差无论正负，平方后都会加进总均方误差里。
    - id: b-delta-se
      type: number
      prompt: |
        已知样本均值估计为 $\hat{\mu} = 5$，其大样本标准误 $\mathrm{SE}(\hat{\mu}) = 0.1$。如果改为估计 $g(\mu) = \mu^2$，利用 Delta 方法近似得出的 $\mathrm{SE}(\hat{\mu}^2)$ 是多少？
      answer: 1
      hint: 求 $g(\mu) = \mu^2$ 在 $\mu = 5$ 处的导数，再乘以 $\mathrm{SE}(\hat{\mu})$。
      explain: |
        $g'(\mu) = 2\mu$，在 $\mu = 5$ 处导数为 $10$，因此近似标准误为 $|10| \times 0.1 = 1$。
    - id: b-bayes-beta
      type: number
      prompt: |
        假设成功率参数 $\theta$ 的先验分布为 $\mathrm{Beta}(2, 3)$。观测 5 次独立试验中有 4 次成功、1 次失败后，后验分布更新为 $\mathrm{Beta}(6, 4)$。在平方误差损失下，最优的贝叶斯估计（后验均值）是多少？
      answer: 0.6
      hint: $\mathrm{Beta}(\alpha', \beta')$ 的均值是 $\alpha' / (\alpha' + \beta')$。
      explain: |
        $\mathrm{Beta}(6, 4)$ 的后验均值为 $\frac{6}{6+4} = 0.6$。
    - id: b-mle-poisson
      type: number
      prompt: |
        某个路口连续 4 小时记录到的车辆违章次数分别独立服从 $\mathrm{Poisson}(\lambda)$，观测值为 `2, 5, 3, 6`。参数 $\lambda$ 的最大似然估计 $\hat{\lambda}_{\text{MLE}}$ 是多少？
      answer: 4
      hint: 泊松分布参数 $\lambda$ 的最大似然估计就是样本均值。
      explain: |
        令对数似然导数 $\frac{\sum x_i}{\lambda} - 4 = 0$ 得 $\hat{\lambda}_{\text{MLE}} = \frac{2+5+3+6}{4} = 4$。
    - id: b-fisher-ci-upper
      type: number
      prompt: |
        某大样本模型求得参数的最大似然估计为 $\hat{\theta} = 10$，在该处测得观测 Fisher 信息为 $J(\hat{\theta}) = 64$。用正态近似（$z_{0.025} = 1.96$）构造 95% 置信区间，区间**上限**是多少？
      answer: 10.245
      hint: 先求标准误 $1/\sqrt{64} = 0.125$，再计算 $\hat{\theta} + 1.96 \cdot \mathrm{SE}$。
      explain: |
        标准误 $\mathrm{SE} = 1/\sqrt{64} = 0.125$，误差限 $1.96 \times 0.125 = 0.245$，因此上限为 $10 + 0.245 = 10.245$。
    - id: b-pred-vs-ci
      type: choice
      prompt: |
        对同一组正态分布零件测出 95% 均值置信区间和 95% 新零件预测区间，为什么预测区间总是明显更宽？
      options:
        - text: 预测区间既要包含总体均值 $\mu$ 的估计误差，还要叠加下一个新个体自身的随机波动
          correct: true
        - text: 因为预测区间在计算时使用的是自由度为 $n-1$ 的重尾 $t$ 分布分位数，而总体均值的置信区间即使在方差未知时也直接使用标准正态分布的 $z$ 分位数
          why: 方差未知时两个区间用的都是同一个 $t_{\alpha/2, n-1}$ 分位数，真正造成变宽的是根号里的 $1 + 1/n$ 与 $1/n$ 之差
        - text: 因为预测区间的默认置信水平固定按 99.9% 计算，比均值置信区间的 95% 水平高得多
          why: 两者比较时都处于同一 95% 水平下，宽度差异来自目标对象（单一新个体 vs 全体平均）的不同
        - text: 因为样本量变大后预测区间的宽度会随样本量 $n$ 成正比地持续拉宽
          why: 样本量变大时 $1 + 1/n$ 趋向 $1$，预测区间会略微收窄并趋近固定个体波动宽度，不会随 $n$ 拉宽
      explain: |
        $\bar{x} \pm t \cdot s\sqrt{1 + 1/n}$ 中的 $1$ 代表新个体自己的起伏，$1/n$ 代表估计均值 $\mu$ 时的误差。就算把样本量增加到一百万，单个个体依然会有波动。
    - id: b-pvalue-wald
      type: choice
      prompt: |
        对比例假设 $H_0: p = 0.20$ 做大样本检验，测得 $n = 100$、$\hat{p} = 0.30$，算得 $z = 2.5$、双侧 $p \approx 0.0124$。设 $\alpha = 0.05$，下面哪项判断正确？
      options:
        - text: 若 $H_0$ 为真则出现至少这么极端结果的机会约 1.24%，故拒绝 $H_0$；同时 0.20 不会落在对应的 95% 大样本置信区间内
          correct: true
        - text: 这说明零假设 $p = 0.20$ 为真的概率是 1.24%，且若改算 95% 置信区间也会把基准值 0.20 包含在里面
          why: $p$ 值不是 $H_0$ 为真的概率；而且当 $|z| > 1.96$ 时假设值与置信区间边界矛盾，0.20 落在区间外
        - text: 因为 $p < 0.05$，所以已经用反证法证明了观测比例 $p = 0.30$ 就是毫无抽样误差的总体真实比例
          why: 拒绝 $p = 0.20$ 只是排除了基准值 0.20，并不代表点估计值 0.30 没有抽样误差
        - text: 如果样本量扩大到 $n = 10000$ 但 $\hat{p}$ 还是 0.30，统计量 $z$ 反而会缩小到 0.25
          why: 标准误分母含 $1/\sqrt{n}$，样本量扩大 100 倍会让 $z$ 统计量扩大 10 倍变成 $25$
      explain: |
        $p = 0.0124 < 0.05$ 拒绝原假设；注意分清“拒绝 $H_0$”不是证明 $H_0$ 假概率等于 $1-p$，且与置信区间外侧判断完全对应。
    - id: b-wald-stat
      type: number
      prompt: |
        某调查抽样 $n = 100$ 人测得支持比例 $\hat{p} = 0.30$。检验零假设 $H_0: p = 0.20$，在 $H_0$ 成立时的标准误 $\mathrm{SE}_0 = \sqrt{0.20 \times 0.80 / 100} = 0.04$，那么 $z$ 统计量 $\frac{\hat{p} - p_0}{\mathrm{SE}_0}$ 等于多少？
      answer: 2.5
      hint: 计算 $(0.30 - 0.20) / 0.04$。
      explain: |
        $z = \frac{0.30 - 0.20}{0.04} = \frac{0.10}{0.04} = 2.5$。
