skill: E.3.5
version: 2
authors: [main-agent]
brief:
  why: 电网里随时可能有线路被雷击、树枝碰线、设备绝缘老化而短路。短路电流是正常电流的几倍到几十倍，几百毫秒内就能烧毁设备、让发电机失去同步。继电保护是一套自动装置：测出故障，判断它在哪里，只把出故障的那一段切掉，其余照常供电。这一关讲保护的四个基本要求、互感器，线路的电流保护、距离保护和纵联保护，变压器、发电机和母线的保护，自动重合闸，最后是微机保护怎样从采样值算出电流电压。假设你学过电力系统分析（三相短路电流、正序负序零序）和电机（变压器、同步发电机）。
  outcomes:
    - 说出继电保护的任务和四个基本要求，分清主保护和后备保护、保护范围
    - 用电流互感器、电压互感器的变比换算一次值和二次值，说清二次侧为什么不能开路或短路
    - 整定三段式电流保护，算可靠系数、返回系数和灵敏系数，说出方向元件、零序保护的用途
    - 用测量阻抗说明距离保护的原理，换算二次整定阻抗，判断一点在不在方向圆特性里
    - 说清纵联差动、变压器差动和母线差动为什么能区分区内区外故障，励磁涌流怎样识别
    - 说出重合闸的作用和方式，用傅里叶算法从一个周期的采样值算出幅值和相角
terms:
  - term: 继电保护
    def: '电力系统出故障或运行不正常时，自动测出并切除故障元件、或发出信号的装置和技术'
  - term: 断路器
    def: '能在正常和短路时接通、断开电路的开关，有灭弧能力；继电保护通过跳开它来切除故障'
  - term: 故障状态
    def: '电力系统发生短路或断线，电流电压严重偏离正常值，必须尽快切除的状态'
  - term: 不正常运行状态
    def: '没有短路，但运行参数超出允许值的状态，如过负荷、频率降低、过电压；通常先发信号'
  - term: 选择性
    def: '保护只切除故障元件，让停电范围尽量小；离故障最近的保护先动作'
  - term: 速动性
    def: '保护尽可能快地切除故障，减轻设备损坏、保持系统稳定'
  - term: 灵敏性
    def: '保护对保护范围内的故障和不正常状态反应的能力，用灵敏系数衡量'
  - term: 可靠性
    def: '该动作时不拒动、不该动作时不误动'
  - term: 主保护
    def: '满足系统稳定和设备安全要求、能最快有选择地切除被保护元件故障的保护'
  - term: 后备保护
    def: '主保护或断路器拒动时用来切除故障的保护，分本元件的近后备和相邻元件的远后备'
  - term: 互感器
    def: '把一次侧的大电流、高电压按固定比例变成二次侧的小电流（5 A 或 1 A）、低电压（100 V）的变压器'
  - term: 电流互感器
    def: '串在一次电路里，把大电流按变比变成二次额定 5 A 或 1 A 的小电流，二次侧不允许开路'
  - term: 电压互感器
    def: '并在一次电路上，把高电压按变比变成二次额定 100 V 的低电压，二次侧不允许短路'
  - term: 整定
    def: '事先确定保护的动作值（动作电流、整定阻抗）和动作时间'
  - term: 动作电流
    def: '能使电流保护动作的最小电流，测到的电流大于它保护就动作'
  - term: 可靠系数
    def: '整定时乘上的配合系数：电流保护躲过故障电流或负荷时大于 1（1.1～1.3），距离Ⅱ段和下级Ⅰ段配合时小于 1（约 0.8）'
  - term: 返回系数
    def: '保护动作后电流降低到能让它返回的值，与动作电流之比；电流保护的返回系数小于 1'
  - term: 灵敏系数
    def: '保护范围内最不利情况下的故障量与整定值之比，电流保护是最小短路电流除以动作电流'
  - term: 电流速断保护
    def: '按躲过本线路末端最大短路电流整定、不带延时的电流保护，只保护线路首端一部分'
  - term: 限时电流速断保护
    def: '带一个短延时、能保护本线路全长的电流保护，和下一条线路的速断配合'
  - term: 过电流保护
    def: '按躲过最大负荷电流整定、按阶梯时限配合的电流保护，作本线路和下一线路的后备'
  - term: 功率方向元件
    def: '比较电压和电流的相位，判断短路功率是从母线流向线路（正方向）还是反过来的元件'
  - term: 电压死区
    def: '出口附近三相短路时母线电压接近零，功率方向元件因为没有电压而无法判别方向的区域'
  - term: 消弧线圈
    def: '接在中性点和地之间的电感，用电感电流抵消单相接地时的电容电流，让接地电弧容易熄灭'
  - term: 分量
    def: '把一个量按方向、频率或对称性拆开后的组成部分，如电阻分量、直流分量、基波分量、负序分量'
  - term: 剩磁
    def: '铁磁材料去掉外磁场后仍保留的磁感应强度；在变压器铁芯里就是断电后剩下的磁通密度'
  - term: 阻抗
    def: '交流电路中电压相量和电流相量之比 Z = U/I，可以写成 R + jX，模是电压和电流有效值之比'
  - term: 距离保护
    def: '用测量阻抗判断故障点远近的保护，测量阻抗落进整定阻抗决定的动作区时动作'
  - term: 测量阻抗
    def: '保护安装处的电压和电流之比 Z_m = U_m / I_m，金属性短路时等于故障点到安装处的线路阻抗'
  - term: 整定阻抗
    def: '距离保护的动作边界，用一次值或二次值表示；测量阻抗落进它对应的动作区时保护动作'
  - term: 方向圆特性
    def: '以整定阻抗为直径、过原点的圆形动作区，测量阻抗落在圆内才动作，反方向故障不动作'
  - term: 过渡电阻
    def: '短路点的电弧电阻和接地电阻，会让测量阻抗偏移、保护范围缩短'
  - term: 系统振荡
    def: '两侧电源失去同步时电流电压周期性摆动、测量阻抗缓慢移动的状态'
  - term: 振荡闭锁
    def: '系统振荡时暂时闭锁距离保护、振荡中又发生短路时再开放的逻辑'
  - term: 纵联保护
    def: '用通道交换线路两端的信息、比较两端电量来区分区内区外故障的保护'
  - term: 电流差动保护
    def: '把两端或各侧电流按同一正方向相加，差动电流超过定值和制动量才动作的保护'
  - term: 不平衡电流
    def: '正常运行或外部故障时，差动回路里因变比、相位、互感器误差和励磁涌流出现的不为零的差流'
  - term: 励磁涌流
    def: '变压器空载合闸或电压恢复时铁芯饱和引起的大电流，含很大的直流和二次谐波、波形有间断'
  - term: 二次谐波制动
    def: '差流里二次谐波与基波的比值超过整定值（常取 15%～20%）就闭锁差动保护的判据'
  - term: 断路器失灵保护
    def: '保护发出跳闸命令后断路器没有断开、短延时后仍有故障电流时，跳开同一母线其他断路器的保护'
  - term: 自动重合闸
    def: '断路器因保护动作跳闸后，经过一段时间自动再合上的装置，一般只重合一次'
  - term: 潜供电流
    def: '单相跳开后，健全相通过相间电容和互感仍向故障点供给的电流，使电弧不易熄灭'
  - term: 微机保护
    def: '用采样、模数转换和算法（如全周傅里叶算法）算出电气量、再按程序判断动作的保护装置'
assumes: []
lessons:
  - id: protection-basics
    chapter: 继电保护的基本要求
    title: 保护要做什么
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一条 110 kV 线路被雷击，三相之间发生短路。下面哪种做法最合理？
          options:
            - text: 自动装置在零点几秒内测出故障，只跳开这条线路两端的开关
              correct: true
            - text: 等值班员发现后手动拉开总开关
              why: 人从发现到操作要几秒到几分钟，短路电流这么久早就烧坏设备；拉总开关还会让没故障的线路一起停电
            - text: 短路电流很快会自己消失，不用处理
              why: 电源一直在供电，短路电流会持续下去，直到开关把电路断开
          explain: 短路电流可达正常电流的几倍到几十倍，要靠自动装置快速、只切除故障的那一段。这样的装置就是继电保护。
      - card:
          title: 三种运行状态
          body: |
            电力系统有三种状态：

            - 正常运行：电压、频率、电流都在允许范围里；
            - **不正常运行状态（abnormal state）**：没有短路，但某些量超出允许值，比如过负荷、频率降低、过电压，设备还能撑一会儿；
            - **故障状态（fault state）**：发生短路或断线，最常见的是单相接地短路。短路电流很大，电压大幅下降，要立刻处理。

            **继电保护（protective relaying）**的任务：故障时自动、迅速、有选择地切除故障元件；不正常运行时发出信号，或经过延时去减负荷、跳闸。
      - item:
          id: state-kind
          type: choice
          prompt: 一台变压器负荷是额定值的 1.2 倍，持续了半小时，其他一切正常。这属于哪种状态，保护通常怎么处理？
          options:
            - text: 不正常运行，先发信号
              correct: true
            - text: 故障状态，保护立刻跳闸
              why: 过负荷没有短路，电流只比额定值大一些，设备能承受一段时间；立刻跳闸会无谓地停电
            - text: 正常运行，什么都不用做
              why: 负荷超过额定值，绕组温度会持续升高，长期下去会损坏绝缘，属于不正常运行
          explain: 过负荷是典型的不正常运行状态：发信号，必要时延时减负荷或跳闸。
      - card:
          title: 保护怎样工作：测量、逻辑、执行
          body: |
            继电保护靠故障前后电气量的变化发现故障：电流突然变大（电流保护），电压降低（低电压保护），电压电流之比即**阻抗（impedance）**变小（距离保护），或比较元件两端的电流（差动保护）。

            保护装置分三部分：

            1. 测量部分：把测到的量和整定值比较，判断是否超过；
            2. 逻辑部分：按测量结果和时间配合决定要不要动作、动作哪个开关；
            3. 执行部分：发出跳闸命令或信号。

            真正切断电路的是**断路器（circuit breaker）**，它能断开短路电流并熄灭电弧。故障切除时间 = 保护动作时间 + 断路器跳闸时间。
      - item:
          id: clearing-time
          type: number
          prompt: '一套保护从故障发生到发出跳闸命令用了 30 ms，断路器从收到命令到熄灭电弧用了 50 ms。故障切除时间是多少毫秒？'
          answer: 80
          hint: 切断故障要经过哪两段时间？
          explain: 切除时间 = 保护动作时间 + 断路器跳闸时间 = 30 + 50 = 80 ms。两部分都要快，才算快速切除。
      - item:
          id: parts-order
          type: order
          prompt: 把保护装置处理一次故障的步骤按先后排列。
          steps:
            - 互感器把一次电流、电压变成小信号送进装置
            - 测量部分把它和整定值比较
            - 逻辑部分按时间配合决定是否跳闸
            - 执行部分发出跳闸命令
            - 断路器断开电路、熄灭电弧
          explain: 测量 → 逻辑 → 执行，最后由断路器真正切断故障。
      - item:
          id: quantity-used
          type: match
          prompt: 把保护类型和它主要利用的故障特征配对。
          pairs:
            - [电流保护, 电流突然增大]
            - [低电压保护, 电压降低]
            - [距离保护, 电压与电流之比变小]
            - [差动保护, 元件两端电流不再相等]
          explain: 短路让电流增大、电压降低、测到的阻抗变小；对一个元件，正常时流进等于流出，内部故障时两端电流之和就不再为零。

  - id: four-requirements
    chapter: 继电保护的基本要求
    title: 四个基本要求
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一条线路末端的用户线路短路了。电源侧有好几级开关，最好跳开哪一个？
          options:
            - text: 离短路点最近的开关
              correct: true
            - text: 电源出口的总开关，最保险
              why: 总开关一跳，所有线路都停电，停电范围最大
            - text: 所有开关同时跳开
              why: 切除故障只需要断开故障点和电源之间最近的一个开关，多跳的都是不必要的停电
          explain: 只切离故障最近的开关，其余用户照常供电。这叫选择性。
      - card:
          title: 选择性、速动性
          body: |
            **选择性（selectivity）**：只切除故障元件，停电范围最小。离故障最近的保护先动作；它或它的断路器拒动时，再由上一级保护动作。

            **速动性（speed）**：尽快切除故障。快可以减少设备损坏，缩短电压降低的时间，提高系统并列运行的稳定性。高压线路的主保护常要求几十毫秒内动作。

            两者常有矛盾：上下级保护如果都瞬时动作，就分不清谁该先动；常用的办法是给上一级加一点延时，让下一级先动。
      - item:
          id: selectivity-case
          type: choice
          prompt: 线路 AB 和 BC 串联，A 侧是电源。BC 线路上短路时，A 处和 B 处的保护都测到了大电流。按选择性，应该怎样？
          options:
            - text: B 处保护跳开 BC；B 处拒动时，A 处保护延时后再跳开 AB
              correct: true
            - text: A 处保护先跳，因为它离电源近
              why: A 一跳，AB 线路上的用户也停电；故障在 BC 上，应由离故障最近的 B 处先动作
            - text: A、B 两处同时跳，越快越好
              why: 只跳 B 就能切除故障；A 同时跳会让 AB 上的负荷无谓停电
          explain: 离故障最近的 B 处先动作；A 处是 BC 的远后备，带延时，B 拒动时才动作。
      - card:
          title: 灵敏性、可靠性
          body: |
            **灵敏性（sensitivity）**：对保护范围里的故障反应得够不够。用**灵敏系数（sensitivity coefficient）**衡量，对反应电流增大的保护：

            $$K_{\text{sen}} = \frac{\text{保护范围内最小短路电流}}{\text{动作电流}}$$

            一般要求 $K_{\text{sen}} \ge 1.3$ 到 $1.5$，留出误差余量。

            **可靠性（reliability）**：该动作时不拒动，不该动作时不误动。

            四者之间要权衡：定值降低更灵敏，但更容易误动；加延时能保证选择性，但牺牲速动性。
      - item:
          id: ksen
          type: number
          prompt: '一套电流保护的动作电流是 1000 A，保护范围末端在最小运行方式（投入的电源和线路最少、短路电流最小的情况）下的最小短路电流是 1500 A。灵敏系数是多少？（保留一位小数）'
          answer: 1.5
          tolerance: 0.0001
          hint: 灵敏系数的分子取哪个电流？分母取哪个？
          explain: K_sen = 1500 / 1000 = 1.5，满足一般 1.3 到 1.5 的要求。
      - card:
          title: 主保护、后备保护和保护范围
          body: |
            每个元件（线路、变压器、母线）都有自己的保护范围，相邻范围要有重叠，不留死角。

            **主保护（main protection）**：能最快、有选择地切除本元件故障的保护。**后备保护（backup protection）**：主保护或断路器拒动时用来切除故障：

            - 近后备：同一元件上另装一套保护；
            - 远后备：由上一级元件的保护延时动作，顺带切除。

            远后备不用增加设备，但动作慢、停电范围大；近后备快，但要多装一套装置，还要配合断路器失灵保护。
      - item:
          id: contradiction
          type: choice
          prompt: 为了让保护更灵敏，把动作电流从 1000 A 降到 600 A。最可能带来什么问题？
          options:
            - text: 大负荷时电流也超过定值，误动
              correct: true
            - text: 保护会变慢，因为要判断更多的电流
              why: 动作电流是电流的门槛，和动作时间是两件事；降低门槛不会让它变慢
            - text: 短路时保护拒动
              why: 门槛越低，短路时越容易超过它，拒动的可能反而更小
          explain: 灵敏性和可靠性（不误动）有矛盾：定值太低，正常运行时的大电流也会让保护动作。
      - item:
          id: four-match
          type: match
          prompt: 把四个基本要求和它的含义配对。
          pairs:
            - [选择性, 只切除故障元件]
            - [速动性, 尽快切除故障]
            - [灵敏性, 对范围内的故障反应充分]
            - [可靠性, 不拒动也不误动]
          explain: 四个要求合起来，才能既保设备、又少停电。

  - id: instrument-transformers
    chapter: 互感器与保护装置
    title: 电流互感器和电压互感器
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 110 kV 线路上短路电流可达几千安。保护装置里的电子电路能直接接这么高的电压、这么大的电流吗？
          options:
            - text: 不能，要先按比例缩小
              correct: true
            - text: 能，只要把导线加粗
              why: 问题不只是导线：几千安电流和几万伏电压会直接击穿、烧毁电子元件，也危及人身安全
            - text: 能，保护装置本来就工作在一次电压下
              why: 保护装置在控制室里，用的是低电压、小电流的二次信号，和一次高压电路是隔离的
          explain: 用互感器把一次量按比例缩小并隔离，二次额定电流 5 A 或 1 A、二次额定电压 100 V。
      - card:
          title: 电流互感器
          body: |
            **互感器（instrument transformer）**是专门给测量和保护用的变压器。**电流互感器（current transformer，CT）**的一次绕组串在线路里，匝数很少；二次绕组匝数多，接保护装置的电流线圈。变比写成 $600/5$，表示一次 600 A 对应二次 5 A：

            $$I_2 = \frac{I_1}{n_{\text{TA}}},\qquad n_{\text{TA}} = \frac{600}{5} = 120$$

            二次侧额定电流 5 A 或 1 A。CT 二次侧接的负载阻抗很小，接近短路状态工作。
          reveal:
            - title: 第 1 步：求变比
              body: |
                例：CT 变比 $1000/5$，一次短路电流 3000 A。$n_{\text{TA}} = 1000/5 = 200$。
            - title: 第 2 步：换算二次电流
              body: |
                $I_2 = 3000/200 = 15\text{ A}$。
      - item:
          id: ct-secondary
          type: number
          prompt: '电流互感器变比 600/5，一次侧故障电流 6000 A。二次电流是多少安？'
          answer: 50
          hint: 先求变比，再把一次电流除以它。
          explain: n = 600/5 = 120，I₂ = 6000/120 = 50 A。
      - card:
          title: 电压互感器
          body: |
            **电压互感器（voltage transformer，VT）**并在一次电路上，把高电压按变比变成二次额定 100 V。110 kV 系统常用变比 $110\,\text{kV}/100\,\text{V}$，即 $n_{\text{TV}} = 1100$：

            $$U_2 = \frac{U_1}{n_{\text{TV}}}$$

            VT 二次侧接的是电压线圈，阻抗很大，接近开路状态工作。
      - item:
          id: vt-secondary
          type: number
          prompt: '电压互感器变比 110 kV/100 V。一次线电压降到 99 kV 时，二次电压是多少伏？'
          answer: 90
          hint: 变比是多少？一次电压除以它。
          explain: n = 110000/100 = 1100，U₂ = 99000/1100 = 90 V。
      - card:
          title: 二次侧的两条禁令
          body: |
            - **CT 二次侧严禁开路**：正常时二次电流产生的磁动势抵消一次的磁动势，铁芯里磁通很小。二次一开路，一次电流全部变成励磁电流，铁芯严重饱和，二次绕组匝数又多，感应出几千伏的尖峰高电压，危及人身和设备，铁芯也会过热。
            - **VT 二次侧严禁短路**：VT 本来工作在接近开路状态，二次一短路就流过很大电流，烧毁 VT。所以 VT 二次侧装熔断器或空气开关，CT 二次侧不装。

            短路电流太大时 CT 铁芯会饱和，二次电流不再按比例跟随一次电流，保护要考虑这种误差。
      - item:
          id: ct-open
          type: choice
          prompt: 检修人员要更换一块接在 CT 二次侧的电流表。正确的做法是？
          options:
            - text: 先把 CT 二次侧端子短接，再拆下电流表
              correct: true
            - text: 直接拆下电流表，二次电流只有几安，没有危险
              why: 一拆就是二次开路，一次电流全部用来励磁，二次侧会感应出很高的电压
            - text: 先把 CT 二次侧的一根线断开再拆
              why: 断开一根线同样是开路，后果一样危险
          explain: CT 二次侧要始终有闭合回路：先短接，再拆表。
      - item:
          id: vt-short
          type: choice
          prompt: 为什么电压互感器二次侧要装熔断器，电流互感器二次侧却不装？
          options:
            - text: VT 二次短路会烧毁 VT，要熔断器；CT 二次熔断等于开路，反而危险
              correct: true
            - text: CT 二次电流太小，熔断器熔不断
              why: 原因不在电流大小，而在 CT 二次侧绝对不能开路，熔断器熔断恰好造成开路
            - text: 两者都应该装，只是习惯上省了
              why: CT 二次装熔断器是错误的接法：熔断时等于二次开路
          explain: VT 怕短路，CT 怕开路。熔断器的作用是在短路时把电路断开，所以只能用在 VT 二次侧。

  - id: current-three-zones
    chapter: 电流保护
    title: 三段式电流保护
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一条单侧电源的线路，短路点离电源越远，短路电流越大还是越小？
          options:
            - text: 越小，因为中间串的线路阻抗越大
              correct: true
            - text: 越大，因为线路越长积累的电流越多
              why: 短路电流由电源电压除以电源到短路点的总阻抗决定，线路越长阻抗越大，电流越小
            - text: 和距离无关
              why: 线路有阻抗，短路点越远，回路里的阻抗越大
          explain: 短路电流 ≈ 电源电动势 /（系统阻抗 + 线路每公里的阻抗 × 故障点到电源的公里数），离电源越远越小。电流保护正是利用这一点来区分故障的远近。
      - card:
          title: 电流速断（Ⅰ段）
          body: |
            短路电流随距离增大而减小。如果让保护在电流超过某个值时立即跳闸，这个值只要大于本线路末端（也就是下一条线路首端）可能的最大短路电流，下一条线路故障时它就不会动，有选择性：

            $$I^{\text{I}}_{\text{set}} = K^{\text{I}}_{\text{rel}}\, I_{k.B.\max},\qquad K^{\text{I}}_{\text{rel}} = 1.2\text{～}1.3$$

            这叫**电流速断保护（instantaneous overcurrent protection）**，不带延时。代价是它只能保护线路首端的一部分：靠近末端的故障电流小于定值，它不动。系统运行方式变小、或者发生两相短路时，保护范围还会缩短。
      - item:
          id: instant-setting
          type: number
          prompt: '线路 AB 末端 B 处三相短路的最大短路电流是 2000 A，可靠系数取 1.25。A 处电流速断保护的动作电流是多少安？'
          answer: 2500
          hint: 速断要躲过哪一点的最大短路电流？
          explain: I_set = 1.25 × 2000 = 2500 A。B 点以外故障时电流不超过 2000 A，速断不会动作。
      - card:
          title: 限时电流速断（Ⅱ段）
          body: |
            **限时电流速断保护（time-delayed instantaneous overcurrent protection）**：要保护本线路全长，定值就得低于本线路末端的短路电流，这样它会伸进下一条线路。办法是和下一条线路的速断配合：定值略大于下一条线路速断的定值，并多等一个时间级差 $\Delta t$（约 0.3～0.5 s），让下一条线路的速断先动。
      - item:
          id: why-not-full
          type: choice
          prompt: 为什么电流速断保护不能保护本线路全长？
          options:
            - text: 它的定值要躲过本线路末端的最大短路电流，末端附近故障时电流达不到定值
              correct: true
            - text: 因为它不带延时，来不及反应末端的故障
              why: 不带延时说的是动作时间；范围由动作电流决定，跟快慢无关
            - text: 因为末端故障时没有电流流过保护
              why: 末端故障时短路电流照样流过首端的保护，只是比定值小
          explain: 本线路末端和下一线路首端的短路电流几乎一样，要保证下一线路故障时不动，就只能让定值大于末端电流，于是末端附近一段保护不到。

      - card:
          title: 定时限过电流（Ⅲ段）
          body: |
            **过电流保护（overcurrent protection）**：定值只要躲过最大负荷电流，非常灵敏，能保护本线路和下一条线路全长，作后备。各级过电流保护按阶梯时限配合：离电源越近，时间越长。

            三段合起来：Ⅰ段快但范围短，Ⅱ段保全长、稍慢，Ⅲ段作后备、最慢。
      - item:
          id: zones-match
          type: match
          prompt: 把三段电流保护和它保护的范围配对。
          pairs:
            - [电流速断（Ⅰ段）, 本线路首端一部分，不带延时]
            - [限时电流速断（Ⅱ段）, 本线路全长，伸到下一线路首端]
            - [定时限过电流（Ⅲ段）, 本线路和下一线路全长，作后备]
          explain: Ⅰ段按躲末端最大短路电流整定，只保首端；Ⅱ段和下一级Ⅰ段配合，保全长；Ⅲ段按躲负荷整定，范围最大。
      - item:
          id: stair-time
          type: number
          prompt: '三段串联的线路，离电源最远那段线路的过电流保护动作时间是 0.5 s，时间级差取 0.5 s。离电源最近那段线路的过电流保护动作时间是多少秒？（保留一位小数）'
          answer: 1.5
          tolerance: 0.0001
          hint: 每往电源方向走一级，时间加多少？最近那段比最远那段多几级？
          explain: 最远 0.5 s，中间 1.0 s，最近 1.5 s。阶梯时限保证离故障最近的先动作。
  - id: current-settings
    chapter: 电流保护
    title: 三段式整定计算
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 过电流保护的动作电流按“躲过最大负荷电流”整定。如果刚好取最大负荷电流本身，会有什么问题？
          options:
            - text: 电动机重新启动时电流更大，会误动
              correct: true
            - text: 没有问题，正常负荷不会超过最大负荷电流
              why: 外部故障切除后电压恢复，电动机重新启动，电流会超过平时的最大负荷；还要考虑误差
            - text: 保护会拒动，因为定值太低反而判不准
              why: 定值越低越容易动作，取得太低的问题是误动，不是拒动
          explain: 要乘上大于 1 的系数，躲过电动机重新启动的电流和计算误差，还要考虑保护动作后能可靠返回。
      - card:
          title: 过电流保护的整定
          body: |
            外部故障被别的保护切除后，本线路的过电流保护要能可靠返回，而这时电动机正在自启动，电流比平时大：

            $$I^{\text{III}}_{\text{set}} = \frac{K_{\text{rel}} K_{\text{ss}}}{K_{\text{re}}}\, I_{L.\max}$$

            **可靠系数（reliability coefficient）** $K_{\text{rel}}$ 取 1.15～1.25；自启动系数 $K_{\text{ss}} \ge 1$，由负荷里电动机的多少决定；**返回系数（resetting ratio）** $K_{\text{re}}$ 是保护返回电流和**动作电流（operating current）**之比，取 0.85～0.95。除以小于 1 的 $K_{\text{re}}$，保证返回电流也大于自启动电流。

            二次动作电流 = 一次动作电流 ÷ CT 变比。
          reveal:
            - title: 第 1 步：一次动作电流
              body: |
                例：$I_{L.\max} = 300\text{ A}$，$K_{\text{rel}} = 1.2$，$K_{\text{ss}} = 1.5$，$K_{\text{re}} = 0.85$。$I_{\text{set}} = 1.2 \times 1.5 \times 300 / 0.85 \approx 635\text{ A}$。
            - title: 第 2 步：二次动作电流
              body: |
                CT 变比 $600/5 = 120$，二次动作电流 $635/120 \approx 5.29\text{ A}$。
            - title: 第 3 步：校验灵敏系数
              body: |
                本线路末端最小短路电流若为 1200 A，$K_{\text{sen}} = 1200/635 \approx 1.89 \ge 1.5$，作近后备够灵敏。
      - item:
          id: oc-primary
          type: number
          prompt: '线路最大负荷电流 400 A，过电流保护按 1.2 倍最大负荷电流整定（已把各系数合在一起）。一次动作电流是多少安？'
          answer: 480
          hint: 1.2 倍乘在哪个电流上？
          explain: I_set = 1.2 × 400 = 480 A。
      - item:
          id: oc-secondary
          type: number
          prompt: '一套过电流保护的一次动作电流是 480 A，电流互感器变比 600/5。二次动作电流是多少安？'
          answer: 4
          hint: 二次值是一次值除以什么？
          explain: 变比 600/5 = 120，480 / 120 = 4 A。
      - card:
          title: 限时电流速断的整定和校验
          body: |
            线路 AB 的Ⅱ段和下一条线路 BC 的Ⅰ段配合：

            $$I^{\text{II}}_{\text{set.A}} = K^{\text{II}}_{\text{rel}}\, I^{\text{I}}_{\text{set.B}},\qquad K^{\text{II}}_{\text{rel}} = 1.1\text{～}1.2$$

            动作时间 $t^{\text{II}}_A = t^{\text{I}}_B + \Delta t$。整定后必须校验它能不能保护本线路全长：用本线路末端 B 在最小运行方式下两相短路的电流 $I_{k.B.\min}$，

            $$K_{\text{sen}} = \frac{I_{k.B.\min}}{I^{\text{II}}_{\text{set.A}}} \ge 1.3\text{～}1.5$$

            不满足时，Ⅱ段改和下一条线路的Ⅱ段配合，时间再加一个级差。
      - item:
          id: second-zone
          type: number
          prompt: '下一条线路 BC 的电流速断定值是 1200 A，A 处限时电流速断的可靠系数取 1.1。A 处限时电流速断的动作电流是多少安？'
          answer: 1320
          hint: Ⅱ段的定值要比哪一套保护的定值大一点？
          explain: I_set.A^II = 1.1 × 1200 = 1320 A。
      - item:
          id: second-zone-ksen
          type: number
          prompt: 'A 处限时电流速断的动作电流 1320 A，本线路末端 B 在最小运行方式下两相短路电流 1800 A。灵敏系数是多少？（保留两位小数）'
          answer: 1.36
          tolerance: 0.005
          hint: 灵敏系数取最不利的那个短路电流，除以动作电流。
          explain: K_sen = 1800 / 1320 ≈ 1.36，大于 1.3，能保护本线路全长。

  - id: directional-current
    chapter: 电流保护
    title: 双侧电源和方向元件
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一条线路两端都接电源。保护背后的母线上（反方向）短路时，流过这条线路保护的电流方向和线路内部短路时一样吗？
          options:
            - text: 不一样，背后短路时电流从线路流向母线，方向反过来
              correct: true
            - text: 一样，电流总是从母线流向线路
              why: 双侧电源时，背后短路由对侧电源经这条线路供给短路电流，电流从线路流向母线
            - text: 背后短路时没有电流流过
              why: 对侧电源会通过这条线路向短路点送电流
          explain: 单靠电流大小分不清是前面还是背后的故障，要加一个判别方向的元件。
      - card:
          title: 为什么要判方向
          body: |
            单侧电源时，短路电流总是从电源流向故障点，阶梯时限就能保证选择性。两侧都有电源时，同一套保护可能被背后的故障电流驱动，只靠电流大小和时间无法配合。

            办法：在电流保护里加一个**功率方向元件（directional element）**，只有短路功率从母线流向线路（正方向）时才允许动作。这样，两侧的保护按方向分成两组，每组各自按阶梯时限配合，就和单侧电源一样了。
      - item:
          id: direction-need
          type: choice
          prompt: 双侧电源线路上，给电流保护加功率方向元件的目的是什么？
          options:
            - text: 只在正方向故障时动作
              correct: true
            - text: 让保护动作得更快
              why: 方向元件只是多加一个判据，作用是保证选择性，不缩短动作时间
            - text: 降低动作电流，提高灵敏度
              why: 方向元件判断的是方向，不改变电流定值
          explain: 加了方向判别，反方向故障时保护被闭锁，两侧的保护按方向分组配合。
      - card:
          title: 90° 接线和电压死区
          body: |
            功率方向元件比较加在它上面的电压和电流的相位。常用 **90° 接线**：A 相方向元件接 A 相电流 $\dot I_a$ 和 B、C 两相之间的线电压 $\dot U_{bc}$，B 相接 $\dot I_b$ 和 $\dot U_{ca}$，C 相接 $\dot I_c$ 和 $\dot U_{ab}$。三相对称、功率因数为 1 时，$\dot I_a$ 正好超前 $\dot U_{bc}$ 90°，因此得名。

            用线电压的好处：两相短路时，故障相的线电压虽然降低，另外两相参与的线电压仍有足够大小，方向判得出来。但保护出口附近三相短路时，三个线电压都接近零，方向元件无从判别，这一段叫**电压死区（voltage dead zone）**。常用记忆电压（保留故障前一小段时间的电压）来消除它。
      - item:
          id: ninety-wiring
          type: choice
          prompt: 按 90° 接线，A 相功率方向元件接入的是哪一组电压和电流？
          options:
            - text: A 相电流和 B、C 两相之间的线电压 U_bc
              correct: true
            - text: A 相电流和 A 相电压
              why: 那是 0° 接线；A 相接地短路时 A 相电压接近零，方向判不出来
            - text: A 相电流和 A、B 两相之间的线电压 U_ab
              why: U_ab 接在 C 相的方向元件上；A 相用的是不含 A 相的线电压 U_bc
          explain: 90° 接线让每相方向元件用不含本相的线电压，故障相电压降低时仍有电压可比较。
      - item:
          id: dead-zone
          type: choice
          prompt: 功率方向元件的电压死区出现在什么故障下？
          options:
            - text: 保护安装处附近的三相短路
              correct: true
            - text: 线路末端的两相短路
              why: 末端故障时保护处的电压降得不多，方向元件有足够的电压
            - text: 反方向远处的单相接地
              why: 远处故障时安装处电压不会降到接近零
          explain: 出口附近三相短路，三个线电压都接近零，方向元件没有可比较的电压。
  - id: zero-sequence
    chapter: 电流保护
    title: 接地故障：零序电流保护
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 正常运行时三相电流对称，三个相电流相加等于多少？
          options:
            - text: 等于零
              correct: true
            - text: 等于一相电流的 3 倍
              why: 三个相电流大小相等、相位互差 120°，按相量相加正好抵消，不是简单的数值相加
            - text: 等于一相电流
              why: 三个互差 120° 的等长相量首尾相接围成一个三角形，回到起点，和为零
          explain: 对称时三相电流之和为零。发生接地短路时，有电流经大地流回中性点，三相之和就不再为零。
      - card:
          title: 零序电流从哪里来
          body: |
            本包的电流、电压相量都取有效值（模是有效值，不是峰值）。电力系统分析里讲过，三相电流之和 $\dot I_a + \dot I_b + \dot I_c = 3\dot I_0$，$\dot I_0$ 是零序电流。正常运行和相间短路时 $3\dot I_0 \approx 0$；接地短路时 $3\dot I_0$ 很大，一相断线也会出现，而且它要有回路才能流通：中性点直接接地时经中性点和大地返回，中性点不接地的电网里只能经对地电容流通，数值小得多。

            零序电流保护只反应接地故障，正常负荷电流不进入它，所以定值可以取得很低，灵敏度高、动作时间也可以比相间电流保护短。和电流保护一样分三段，必要时加零序功率方向元件。
      - item:
          id: three-i0
          type: number
          prompt: '中性点直接接地系统里 A 相接地短路，测得 $\dot I_a = 900\angle 0°$ A，B、C 两相电流为零。零序电流 $I_0$ 是多少安？'
          answer: 300
          hint: 三相电流之和等于几倍的零序电流？
          explain: 3I₀ = 900 + 0 + 0 = 900 A，I₀ = 300 A。
      - card:
          title: 零序电流和零序电压怎样取得
          body: |
            取得的方法：把三相电流互感器的二次侧并联起来（零序电流滤过器），流出的就是 $3I_0$；电缆线路可以用一个套住三相的零序电流互感器。零序电压 $3U_0$ 由电压互感器接成开口三角得到：三个副绕组首尾相接，留一个口不闭合，正常时三个电压相量和为零，一相接地时开口处出现 $3U_0$。
      - card:
          title: 中性点不接地系统的单相接地
          body: |
            中低压配电网（如 10 kV）常常中性点不接地。这时一相接地并不形成短路回路：故障相对地电压变成零，另外两相对地电压升高到线电压，线电压仍然对称，规程允许继续运行一段时间（常见 1～2 小时）。

            流过接地点的只有三相对地电容的电流：

            $$I_C = 3\omega C_0 U_\varphi$$

            $C_0$ 是全系统每相对地电容，$U_\varphi$ 是相电压。保护通常先发信号：零序电压一出现就报警（绝缘监视），再按零序电流的大小和方向选出故障线路。电容电流大时电弧不易熄灭，要在中性点接**消弧线圈（arc suppression coil）**，用电感电流抵消电容电流，一般过补偿 5%～10%。
          reveal:
            - title: 第 1 步：相电压和角频率
              body: |
                例：35 kV 中性点不接地电网，每相对地电容 $C_0 = 1\ \mu\text{F}$。$U_\varphi = 35000/\sqrt3 \approx 20207$ V，$\omega = 2\pi \times 50 \approx 314.2$。
            - title: 第 2 步：代入公式
              body: |
                $I_C = 3 \times 314.2 \times 1 \times 10^{-6} \times 20207 \approx 19.0$ A。
            - title: 第 3 步：看结果
              body: |
                电容电流和电压、电网规模（总电容）都成正比；电网越大，接地电弧越难自己熄灭。
      - item:
          id: cap-current
          type: number
          prompt: '一个 10 kV 中性点不接地电网，全系统每相对地电容 $C_0 = 2\ \mu\text{F}$，频率 50 Hz。单相接地时的电容电流是多少安？（保留一位小数）'
          answer: 10.9
          tolerance: 0.05
          hint: 相电压是线电压除以多少？ω 是多少？
          explain: U_φ = 10000/√3 ≈ 5774 V，ω = 2π × 50 ≈ 314.2。I_C = 3 × 314.2 × 2 × 10⁻⁶ × 5774 ≈ 10.9 A。
      - item:
          id: ungrounded-volts
          type: choice
          prompt: 中性点不接地系统 A 相金属性接地后，B、C 两相的对地电压怎样变化？
          options:
            - text: 升高到线电压
              correct: true
            - text: 保持相电压不变
              why: 接地后中性点对地电压变成负的 A 相电压，B、C 两相对地电压是它们的相电压再加上这个偏移
            - text: 也降到零，因为三相都和大地连通了
              why: 只有 A 相和地连在一起；B、C 两相对地电压反而升高
          explain: 中性点电位偏移到 −U_A，B、C 对地电压变成 U_B − U_A、U_C − U_A，都是线电压。所以这种系统的设备绝缘要按线电压设计。
      - item:
          id: overcomp
          type: number
          prompt: '某电网单相接地电容电流 20 A，消弧线圈按过补偿 10% 整定。消弧线圈的电感电流是多少安？'
          answer: 22
          hint: 过补偿 10% 指电感电流比电容电流多百分之多少？
          explain: I_L = 20 × (1 + 10%) = 22 A。过补偿而不是欠补偿，是为了避免线路切除后电容电流减小时进入串联谐振。

  - id: distance-principle
    chapter: 距离保护
    title: 用阻抗量距离
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 电流保护的范围会随系统运行方式变化：电源少开几台机组，短路电流变小，速断的范围就缩短。有没有一个量只和故障点的远近有关？
          options:
            - text: 电压与电流之比
              correct: true
            - text: 短路电流本身
              why: 短路电流还取决于电源和系统阻抗，运行方式一变就变
            - text: 保护安装处的电压
              why: 电压也随电源的强弱和短路电流变化，单独用它分不清远近
          explain: 金属性短路（短路点直接相碰，没有电弧和接地电阻）时，安装处电压 = 电流 × 故障点到安装处的线路阻抗，两者相除只剩线路阻抗，和电源强弱无关。
      - card:
          title: 测量阻抗
          body: |
            保护装置把安装处的电压和电流相除，得到**测量阻抗（measured impedance）**：

            $$Z_m = \frac{\dot U_m}{\dot I_m}$$

            正常运行时 $Z_m$ 是负荷阻抗，数值大、角度小（功率因数高）；线路上距安装处 $l$ 公里处金属性短路时，$Z_m = z_1 l$，$z_1$ 是线路每公里的正序阻抗，数值小、角度接近线路阻抗角（如 70°～85°）。

            **距离保护（distance protection）**：当 $Z_m$ 小于**整定阻抗（setting impedance）** $Z_{\text{set}}$ 时动作，等于说“故障点在整定的距离以内”。为了各相短路都能量准，相间距离元件用线电压和两相电流之差，接地距离元件要加零序电流补偿。
      - item:
          id: measured-z
          type: number
          prompt: '线路正序阻抗每公里 0.4 Ω。在距保护安装处 50 km 处发生金属性三相短路，测量阻抗（一次值）的大小是多少欧？'
          answer: 20
          hint: 测量阻抗等于故障点到安装处的哪一段阻抗？
          explain: Z_m = 0.4 × 50 = 20 Ω。
      - item:
          id: secondary-z
          type: number
          prompt: '距离保护测得二次电压 57.7 V、二次电流 5 A。二次测量阻抗是多少欧？（保留两位小数）'
          answer: 11.54
          tolerance: 0.005
          hint: 测量阻抗是哪两个量相除？
          explain: Z_m = 57.7 / 5 = 11.54 Ω。
      - card:
          title: 三段式距离保护
          body: |
            距离保护也分三段：

            - Ⅰ段：整定为本线路阻抗的 80%～85%，不带延时；
            - Ⅱ段：保护本线路全长，伸进下一条线路，和下一条线路的Ⅰ段配合，带一个时间级差（约 0.5 s）；
            - Ⅲ段：按躲过最小负荷阻抗整定，作本线路和下一线路的后备，按阶梯时限配合。

            和电流保护相比，Ⅰ段的范围由阻抗决定，基本不随系统运行方式变化。
      - card:
          title: 阻抗平面和方向圆
          body: |
            把 $Z_m = R + jX$ 画在复平面（阻抗平面）上，动作范围就是平面上的一块区域。常用的**方向圆特性（mho characteristic）**：以 $Z_{\text{set}}$ 为直径、过原点的圆，$Z_{\text{set}}$ 的方向取最大灵敏角 $\varphi_{\text{sen}}$（接近线路阻抗角）。$Z_m$ 落在圆内就动作。

            它自带方向性：反方向故障时 $Z_m$ 落在第三象限附近，不在圆里。沿角度 $\varphi$ 的方向，圆的边界离原点 $Z_{\text{set}}\cos(\varphi_{\text{sen}} - \varphi)$，所以判断很简单：$|Z_m| < Z_{\text{set}}\cos(\varphi_{\text{sen}} - \varphi_m)$ 就在圆内。

            以原点为圆心的全阻抗圆没有方向性，要配方向元件；四边形（直线）特性能更好地容纳故障点的电阻。
          reveal:
            - title: 第 1 步：算这个方向上圆的边界
              body: |
                例：$Z_{\text{set}} = 10\angle 80°$ Ω，$Z_m = 8\angle 50°$ Ω。两者夹角 30°，这个方向上圆的边界在 $10\cos 30° \approx 8.66$ Ω。
            - title: 第 2 步：比较
              body: |
                $|Z_m| = 8 < 8.66$，在圆内，保护动作。
      - item:
          id: mho-inside
          type: choice
          prompt: '方向圆特性的整定阻抗 $Z_{\text{set}} = 10\angle 75°$ Ω。下面哪个测量阻抗会让它动作？'
          options:
            - text: 7∠60° Ω
              correct: true
            - text: 9∠30° Ω
              why: 沿 30° 方向圆的边界在 10cos45° ≈ 7.07 Ω，9 Ω 在圆外
            - text: 11∠75° Ω
              why: 沿最大灵敏角方向圆的边界就是 10 Ω，11 Ω 超出了
            - text: 5∠−105° Ω
              why: 这是反方向（第三象限）的阻抗，cos(75° + 105°) 为负，方向圆不包含它
          explain: 7∠60° 和整定方向差 15°，边界在 10cos15° ≈ 9.66 Ω，7 Ω 在圆内。

  - id: distance-settings
    chapter: 距离保护
    title: 距离保护的整定和影响因素
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 距离保护Ⅰ段如果整定为本线路阻抗的 100%，会有什么问题？
          options:
            - text: 互感器、测量和线路阻抗的数值都有误差，下一条线路首端故障时可能误动
              correct: true
            - text: 没问题，100% 正好保护全线
              why: 本线路末端和下一线路首端在阻抗上几乎挨着，误差一来就分不清；Ⅰ段不带延时，会失去选择性
            - text: 保护会变慢
              why: 整定阻抗决定范围，不决定动作时间
          explain: 留出 15%～20% 的余量，Ⅰ段只保 80%～85%，末端由Ⅱ段带延时保护。
      - card:
          title: 一次值换成二次值
          body: |
            整定阻抗先按一次值算，再换成保护装置看到的二次值。二次电压是一次电压除以 $n_{\text{TV}}$，二次电流是一次电流除以 $n_{\text{TA}}$，所以

            $$Z_2 = \frac{U_1/n_{\text{TV}}}{I_1/n_{\text{TA}}} = Z_1\,\frac{n_{\text{TA}}}{n_{\text{TV}}}$$

            Ⅱ段和下一条线路Ⅰ段配合：$Z^{\text{II}}_{\text{set}} = K_{\text{rel}}(Z_{AB} + Z^{\text{I}}_{\text{set.next}})$，$K_{\text{rel}}$ 约 0.8（中间母线上没有别的电源接入时）；校验 $K_{\text{sen}} = Z^{\text{II}}_{\text{set}}/Z_{AB}$，一般要求不小于 1.25。
          reveal:
            - title: 第 1 步：一次整定阻抗
              body: |
                例：线路阻抗 25 Ω，Ⅰ段按 85% 整定：$Z_1 = 0.85 \times 25 = 21.25$ Ω。
            - title: 第 2 步：两个变比
              body: |
                CT $400/5$，$n_{\text{TA}} = 80$；VT $110\,\text{kV}/100\,\text{V}$，$n_{\text{TV}} = 1100$。
            - title: 第 3 步：换成二次值
              body: |
                $Z_2 = 21.25 \times 80/1100 \approx 1.55$ Ω。
      - item:
          id: zone1-secondary
          type: number
          prompt: '线路正序阻抗 20 Ω，距离Ⅰ段按 80% 整定，电流互感器 600/5，电压互感器 110 kV/100 V。二次整定阻抗是多少欧？（保留两位小数）'
          answer: 1.75
          tolerance: 0.005
          hint: 二次阻抗是二次电压除以二次电流。电压缩小了多少倍，电流缩小了多少倍？
          explain: 一次 0.8 × 20 = 16 Ω；n_TA = 120，n_TV = 1100；二次 16 × 120 / 1100 ≈ 1.75 Ω。
      - item:
          id: zone2-setting
          type: number
          prompt: '线路 AB 阻抗 20 Ω，下一条线路 BC 的距离Ⅰ段整定为 25.5 Ω，B 母线上没有别的电源接入，可靠系数取 0.8。A 处距离Ⅱ段的一次整定阻抗是多少欧？（保留一位小数）'
          answer: 36.4
          tolerance: 0.0001
          hint: Ⅱ段要伸到哪里为止？可靠系数乘在哪个和上？
          explain: 0.8 × (20 + 25.5) = 36.4 Ω。灵敏系数 36.4/20 = 1.82，大于 1.25。
      - card:
          title: 过渡电阻
          body: |
            短路点常常不是金属性的，中间隔着电弧或接地电阻，叫**过渡电阻（fault resistance）** $R_g$。单侧电源时测量阻抗变成 $Z_k + R_g$，多出一个电阻**分量（component）**，在阻抗平面上向右移，可能移出方向圆，保护范围缩短；双侧电源时对侧电源送来的电流还会让它向上或向下偏。方向圆在 $R$ 方向较窄，容纳过渡电阻的能力差，四边形特性好一些。
      - item:
          id: arc-resistance
          type: choice
          prompt: 单侧电源线路上，短路点有过渡电阻时，距离保护的测量阻抗和保护范围会怎样？
          options:
            - text: 测量阻抗多出一个电阻分量，可能移出动作区，保护范围缩短
              correct: true
            - text: 测量阻抗变小，保护范围变长
              why: 过渡电阻串在故障回路里，测量阻抗是 Z_k + R_g，只会变大
            - text: 没有影响，距离保护只看电抗
              why: 方向圆和四边形特性都同时看电阻和电抗两个分量
          explain: Z_m = Z_k + R_g 向右偏，本来在范围内的故障可能被判成范围外。
      - card:
          title: 系统振荡和振荡闭锁
          body: |
            **系统振荡（power swing）**：两侧电源失去同步时，电流和电压周期性摆动，测量阻抗在阻抗平面上缓慢地移动，可能穿过动作区，保护误动。

            振荡和短路的区别：振荡时三相仍对称、阻抗变化慢；短路时阻抗突变，不对称短路还会出现负序分量。**振荡闭锁（power swing blocking）**按这些区别，在振荡时闭锁距离保护，振荡中又发生短路时再开放。
      - item:
          id: swing-vs-fault
          type: choice
          prompt: 振荡闭锁靠什么区分系统振荡和短路？
          options:
            - text: 阻抗变化快慢和有无负序分量
              correct: true
            - text: 振荡时电流比短路时大，看电流大小就能分开
              why: 振荡电流可能很大，也可能不大，单看大小分不清
            - text: 振荡时测量阻抗不变
              why: 振荡时测量阻抗随两侧电动势的相角差周期变化，正因为它在动，才可能误入动作区
          explain: 阻抗变化快慢、有无负序分量是两条常用判据。
      - item:
          id: distance-eval
          type: choice
          prompt: 和三段式电流保护相比，距离保护的主要优点是什么？
          options:
            - text: 范围不随运行方式变化
              correct: true
            - text: 不需要电压互感器
              why: 距离保护要用电压和电流两个量，必须有电压互感器，还要防电压回路断线
            - text: 能无延时切除本线路全长的故障
              why: Ⅰ段只保 80%～85%，末端靠Ⅱ段带延时；无延时保全长要靠纵联保护
          explain: 测量阻抗只看故障点距离，电源强弱变化时Ⅰ段范围不变；代价是装置复杂，受过渡电阻、振荡、电压回路断线影响。

  - id: pilot-protection
    chapter: 输电线路纵联保护
    title: 比较线路两端：纵联保护
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一条线路两端各有一个电流表。线路外部短路时，短路电流从一端流进、从另一端流出；线路内部短路时呢？
          options:
            - text: 两端的电流都流向线路内部的短路点
              correct: true
            - text: 和外部短路一样，一进一出
              why: 内部短路时两侧电源都向短路点送电流，两端电流都流进线路
            - text: 两端都没有电流
              why: 短路电流从两侧电源流向短路点，必然经过两端
          explain: 内部故障两端电流同向流进，外部故障一进一出。比较两端就能分清区内区外，不用靠延时。
      - card:
          title: 纵联保护的原理
          body: |
            只用一端的电气量，分不清本线路末端和下一线路首端的故障，所以Ⅰ段只保 80%～85%。**纵联保护（pilot protection）**把线路两端的信息通过通道交换，比较两端：

            - 内部故障：两端电流都从母线流进线路，短路功率方向都是正方向；
            - 外部故障：一端流进、一端流出。

            于是本线路任何一点故障都能无延时切除，不用和相邻线路配合。它不能作相邻线路的后备，所以线路上还要配距离保护、零序保护作后备。
      - item:
          id: why-pilot
          type: choice
          prompt: 纵联保护为什么能无延时切除本线路全长的故障？
          options:
            - text: 比较两端，区内区外一比就分开
              correct: true
            - text: 它的动作电流定得特别低，故障一出现就动作
              why: 灵敏与否不是关键；关键在于两端信息让它直接判断故障在不在本线路
            - text: 它用了更快的断路器
              why: 断路器是同一个；快在保护不用等待和下一级配合
          explain: 单端保护分不清本线末端和下线首端，只好用延时；纵联保护用两端比较代替了时间配合。
      - card:
          title: 两端怎样交换信息
          body: |
            纵联保护需要通道：

            - 导引线：两端之间敷设专用的导线，只适合几公里到十几公里的短线路；
            - 电力线载波：把几十到几百千赫兹的高频信号耦合到输电线本身上传送；
            - 微波：用微波接力通信；
            - 光纤：抗电磁干扰、容量大，现在高压线路最常用，可以直接传送两端电流的采样值。

            按比较的内容分两类：方向比较式，两端各自判断短路功率方向，只交换“正方向”或“反方向”的结论；电流差动式，交换两端电流本身。
      - card:
          title: 方向比较式和电流差动式
          body: |
            方向比较式：两端方向元件都判为正方向才跳闸。常用闭锁式：判为反方向的一端发出闭锁信号，收到闭锁信号的一端不跳。

            **电流差动保护（current differential protection）**：两端电流都以流进线路为正，差动电流

            $$I_d = |\dot I_M + \dot I_N|$$

            外部故障时一进一出，$I_d \approx 0$；内部故障时等于流进故障点的总电流。为了防止外部故障时互感器误差造成的差流误动，用制动电流 $I_r = |\dot I_M - \dot I_N|$ 做比率制动：$I_d > K\,I_r$ 才动作。长线路的电容电流也会形成差流，要补偿。
          reveal:
            - title: 第 1 步：外部故障
              body: |
                例：$\dot I_M = 1000\angle 0°$ A，$\dot I_N = 1000\angle 180°$ A（从 N 端流出）。$I_d = |1000 - 1000| = 0$。
            - title: 第 2 步：内部故障
              body: |
                $\dot I_M = 1000\angle 0°$ A，$\dot I_N = 800\angle -10°$ A。实部 $1000 + 800\cos 10° \approx 1787.8$，虚部 $-800\sin 10° \approx -138.9$，$I_d \approx 1793$ A。
            - title: 第 3 步：判断
              body: |
                外部故障差流为零，内部故障差流很大，两者一比就分开了。
      - item:
          id: diff-internal
          type: number
          prompt: '线路内部短路，两端电流（都以流进线路为正）是 $\dot I_M = 600\angle 0°$ A、$\dot I_N = 400\angle 0°$ A。差动电流是多少安？'
          answer: 1000
          hint: 差动电流是两端电流的相量和的大小。两个相量同相时怎么加？
          explain: I_d = |600 + 400| = 1000 A，就是流进故障点的总电流。
      - item:
          id: diff-external
          type: number
          prompt: '线路外部短路，穿越电流 1000 A：M 端测得流进线路 1000 A，N 端测得流进线路 −950 A（同相，互感器有误差）。差动电流是多少安？'
          answer: 50
          hint: 两端电流按流进线路为正相加。
          explain: I_d = |1000 + (−950)| = 50 A。这是误差造成的不平衡差流，所以要用比率制动：此时制动电流 1950 A 很大，差流相对它很小，保护不动。
      - item:
          id: channel-choice
          type: choice
          prompt: 一条 200 km 的 500 kV 线路要装纵联电流差动保护，最合适的通道是？
          options:
            - text: 光纤
              correct: true
            - text: 导引线
              why: 导引线要沿线敷设专用导线，只适合短线路，200 km 太长
            - text: 不需要通道，两端各自判断就行
              why: 纵联保护的本质就是交换两端的信息，没有通道就退化成单端保护
          explain: 光纤抗干扰、容量大，可以直接传两端电流的采样值，是现在高压线路纵联差动的主要通道。
  - id: transformer-differential
    chapter: 变压器保护
    title: 变压器的纵差动保护
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一台变压器正常运行。高压侧流进的功率和低压侧流出的功率大致相等，那么高压侧电流和低压侧电流也相等吗？
          options:
            - text: 不相等，电压高的一侧电流小
              correct: true
            - text: 相等，因为两侧功率相等，电流也就相等
              why: 功率是电压乘电流；高压侧电压高，电流就小，110/10.5 kV 的变压器两侧电流相差约 10 倍
            - text: 低压侧电流更小
              why: 说反了：电压低的一侧电流大
          explain: 功率相同时，电流和电压成反比。要比较两侧电流，必须先按变比折算，这正是变压器差动保护要处理的第一个问题。
      - card:
          title: 变压器的故障和保护配置
          body: |
            油箱里面的故障：绕组相间短路、匝间短路、绕组对铁芯的接地短路、铁芯烧损。油箱外面：套管和引出线上的短路。不正常运行状态：过负荷、外部短路引起的过电流、油面降低、过励磁。

            主要保护：

            - 瓦斯保护：油箱内故障产生气体或油流冲击，轻瓦斯发信号、重瓦斯跳闸，对匝间短路很灵敏，但反应不了油箱外的故障；
            - 纵差动保护：比较各侧电流，保护范围是各侧电流互感器之间的全部区域，包括套管和引线；
            - 后备保护：过电流（常加复合电压启动）、零序保护、过负荷信号。
      - item:
          id: gas-scope
          type: choice
          prompt: 变压器高压套管上发生短路，下面哪种保护能反应？
          options:
            - text: 纵差动保护
              correct: true
            - text: 瓦斯保护
              why: 瓦斯保护靠油箱里产生的气体和油流动作，套管在油箱外，短路时不产生这些
            - text: 过负荷保护
              why: 过负荷保护只发信号，而且是为长时间超负荷设的，不是短路的主保护
          explain: 差动保护的范围是各侧电流互感器之间，套管和引线都在里面；瓦斯保护和差动保护互相补充。
      - card:
          title: 额定电流和差动原理
          body: |
            三相变压器的额定电流

            $$I_N = \frac{S_N}{\sqrt3\,U_N}$$

            差动保护把两侧电流都折算到同一基准，以流进变压器为正相加。正常运行和外部故障时，流进等于流出（折算后），差流接近零；内部故障时差流等于流进故障点的电流。

            但正常时差流并不严格为零，这些**不平衡电流（unbalanced current）**来自：两侧电流互感器的变比不能恰好配上；Y/d 接线的两侧电流相位差 30°；有载调压改变了变比；两侧互感器特性不同，外部短路时饱和程度不同；还有空载合闸的励磁涌流。办法是变比和相位补偿、比率制动和涌流识别。
          reveal:
            - title: 第 1 步：高压侧额定电流
              body: |
                例：$S_N = 31.5$ 兆伏安（MVA），$110/10.5$ kV。$I_{N1} = \frac{31.5 \times 10^6}{\sqrt3 \times 110 \times 10^3} \approx 165.3$ A。
            - title: 第 2 步：低压侧额定电流
              body: |
                $I_{N2} = \frac{31.5 \times 10^6}{\sqrt3 \times 10.5 \times 10^3} \approx 1732$ A。
            - title: 第 3 步：两侧之比
              body: |
                $1732/165.3 \approx 10.48 = 110/10.5$，正是电压比。
      - item:
          id: rated-hv
          type: number
          prompt: '一台 40 MVA、110/10.5 kV 的三相变压器，高压侧额定电流是多少安？（保留一位小数）'
          answer: 209.9
          tolerance: 0.05
          hint: 三相视在功率写成 √3 乘哪两个量？已知功率和线电压，线电流怎样求？
          explain: I = 40 × 10⁶ / (√3 × 110 × 10³) ≈ 209.9 A。
      - item:
          id: ct-mismatch
          type: number
          prompt: '31.5 MVA、110/10.5 kV 变压器，高压侧额定电流 165.3 A，选用 200/5 的电流互感器。额定运行时这只互感器的二次电流是多少安？（保留两位小数）'
          answer: 4.13
          tolerance: 0.005
          hint: 二次电流 = 一次电流 ÷ 变比。
          explain: 165.3 / 40 ≈ 4.13 A。低压侧 1732 A 配 2000/5 时二次是 4.33 A，两侧二次电流对不上，要用平衡系数补偿。
      - item:
          id: unbalance-source
          type: choice
          prompt: 下面哪一项不是变压器差动保护不平衡电流的来源？
          options:
            - text: 变压器内部绕组匝间短路
              correct: true
            - text: 两侧电流互感器的变比配不上
              why: 这是不平衡电流的典型来源：标准变比是一档一档的，很难恰好让两侧二次电流相等
            - text: Y/d 接线使两侧电流相位差 30°
              why: 这也是来源之一；不做相位补偿，正常运行就会出现很大的差流
          explain: 匝间短路是要保护的内部故障，它产生的是真正的故障差流；其余两项是正常运行或外部故障时就存在的不平衡电流。

  - id: inrush-backup
    chapter: 变压器保护
    title: 励磁涌流和后备保护
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 变压器低压侧开路，高压侧刚合上开关的一瞬间，高压侧会流过电流吗？
          options:
            - text: 会，而且可能是额定电流的好几倍，过一会儿才衰减下去
              correct: true
            - text: 不会，低压侧开路就没有电流
              why: 高压绕组本身要建立磁通，有励磁电流；合闸瞬间铁芯饱和，这个电流可以非常大
            - text: 会，但只有额定电流的百分之几
              why: 那是稳态的空载电流；合闸瞬间铁芯可能深度饱和，冲击电流大得多
          explain: 合闸瞬间这个很大的电流叫励磁涌流。它只从一侧流进，差动保护看起来就像内部故障。
      - card:
          title: 励磁涌流
          body: |
            空载合闸或外部故障切除、电压恢复时，铁芯磁通里会出现直流分量，加上**剩磁（remanence）**，铁芯深度饱和，励磁电流急剧增大，可达额定电流的 6～8 倍，叫**励磁涌流（magnetizing inrush current）**。它只流过电源一侧，对差动保护来说就是差流，不加处理会误动。

            涌流的特点：含很大的直流分量，波形偏向时间轴一侧；含大量二次谐波（100 Hz）；波形之间有间断（间断角）。内部短路电流基本是工频正弦，二次谐波很少。
      - card:
          title: 怎样识别涌流
          body: |
            - **二次谐波制动（second-harmonic restraint）**：测差流里二次谐波和基波的比值，超过整定值（常取 15%～20%）就闭锁差动保护；
            - 间断角鉴别：涌流波形有间断，短路电流没有；
            - 波形对称识别：涌流波形前后半周不对称。

            差动保护里还常有一个差动速断：差流大到涌流不可能达到的程度（如额定电流的几倍以上）时，不管谐波直接跳闸，防止严重内部故障时互感器饱和产生谐波、导致差动被误闭锁。
      - item:
          id: harmonic-ratio
          type: number
          prompt: '差动电流里基波分量 2.0 A、二次谐波分量 0.7 A。二次谐波与基波的比值是百分之几？'
          answer: 35
          hint: 比值等于二次谐波除以基波，再换成百分数。
          explain: 0.7 / 2.0 = 35%，大于常用的 15%～20% 整定值，判为励磁涌流，闭锁差动。
      - item:
          id: inrush-or-fault
          type: choice
          prompt: 变压器差动电流里二次谐波只占基波的 5%，差流远大于定值。保护应该怎样处理？
          options:
            - text: 内部故障，跳闸
              correct: true
            - text: 判为励磁涌流，闭锁差动
              why: 涌流的二次谐波含量通常很高；5% 低于常用的 15%～20% 门槛，不满足闭锁条件
            - text: 等涌流衰减后再判断
              why: 这样会拖延内部故障的切除；差流大、谐波少正是内部短路的特征
          explain: 二次谐波含量低说明差流接近正弦，是故障电流。
      - card:
          title: 相间和接地后备保护
          body: |
            变压器的后备保护既保变压器本身，也作相邻母线和线路的远后备：

            - 相间短路后备：过电流保护。单纯过电流要躲过最大负荷，灵敏度不够时改用复合电压启动的过电流：只有电压降低或出现负序电压、同时电流超过定值才动作，于是电流定值可以按额定电流整定，灵敏度提高。
            - 接地短路后备：中性点直接接地运行时，用中性点回路的零序电流保护；中性点不接地运行的分级绝缘变压器，用零序电压和间隙零序电流保护，防止中性点过电压。
            - 过负荷：一般只发信号。
      - item:
          id: composite-voltage
          type: choice
          prompt: 变压器后备过电流保护为什么常加“复合电压启动”？
          options:
            - text: 躲开大负荷，定值能取低
              correct: true
            - text: 为了让保护动作更快
              why: 复合电压启动解决的是灵敏度和误动的矛盾，不改变动作时间
            - text: 为了识别励磁涌流，涌流时电压会降低
              why: 涌流靠二次谐波识别；复合电压启动用在后备过电流上
          explain: 过负荷时电压基本正常、没有负序电压，复合电压元件不启动，过电流就不会误动，所以电流定值可以只躲额定电流。

  - id: generator-protection
    chapter: 发电机与母线保护
    title: 发电机保护
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一台汽轮发电机的汽门突然关闭，发电机仍然接在电网上。会发生什么？
          options:
            - text: 变成电动机运行，吸收有功
              correct: true
            - text: 发电机立刻停转，因为没有了蒸汽推动
              why: 它和电网保持同步，电网会带着它继续以同步转速转动
            - text: 什么都不会变
              why: 没有了原动机的推力，有功功率的方向会反过来
          explain: 这叫逆功率运行，汽轮机叶片缺少蒸汽冷却会过热。逆功率保护就是为它设的。
      - card:
          title: 发电机的故障和不正常状态
          body: |
            发电机贵重，又直接影响系统稳定，保护配置得最全：

            - 定子绕组相间短路：纵差动保护，原理和变压器差动一样，比较机端和中性点两侧的电流，没有涌流问题；
            - 定子匝间短路：横差动或纵向零序电压保护；
            - 定子单相接地：最常见的故障，用零序电压保护；
            - 转子励磁回路一点接地发信号，两点接地跳闸；
            - 不正常运行：失磁、负序电流（三相负荷不对称会在转子里感应倍频电流使它过热）、过电压、逆功率、失步、过负荷。
      - card:
          title: 定子接地和零序电压
          body: |
            发电机中性点通常不接地或经高阻接地。定子绕组在离中性点 $\alpha$（以绕组全长为 1）处接地时，零序电压约为 $\alpha U_\varphi$：越靠近机端越大，越靠近中性点越小。

            零序电压保护的整定值不能太低（要躲过正常时的不平衡电压），设整定值是相电压的 $k$ 倍，它只能保护从机端开始的 $1 - k$ 的绕组，靠近中性点的一段是死区。要实现 100% 保护，再加利用三次谐波电压的保护，专门覆盖中性点附近。

            分布式电源（如光伏、风电）并网时还要有并网保护：电网停电时检测到电压、频率超出范围，迅速把电源断开，防止孤岛运行危及检修人员。
      - item:
          id: stator-coverage
          type: number
          prompt: '发电机定子接地的零序电压保护，整定值为相电压的 5%。它能保护从机端算起百分之多少的定子绕组？'
          answer: 95
          hint: 接地点离中性点越近，零序电压越小。零序电压等于整定值时接地点在哪里？
          explain: 接地点离中性点 α 处零序电压约 αU_φ，α ≥ 5% 时才能动作，所以保护范围是 1 − 5% = 95%，中性点附近 5% 是死区。
      - item:
          id: gen-protection-match
          type: match
          prompt: 把发电机的故障或不正常状态和对应的保护配对。
          pairs:
            - [定子绕组相间短路, 纵差动保护]
            - [定子单相接地, 零序电压保护]
            - [三相负荷不对称使转子过热, 负序电流保护]
            - [汽门关闭后从电网吸收有功, 逆功率保护]
          explain: 每种故障或不正常状态都有专门的保护；纵差动是定子相间短路的主保护。
      - item:
          id: loss-of-field
          type: choice
          prompt: 发电机失磁（励磁电流消失）后仍并在电网上，主要的危害是什么？
          options:
            - text: 从电网吸收大量无功功率，系统电压下降，发电机转子和定子过热，可能失步
              correct: true
            - text: 发电机输出的有功功率立刻变成零
              why: 失磁后发电机转入异步运行，短时间内仍能送出一部分有功，问题在于大量吸收无功
            - text: 定子绕组短路
              why: 失磁是励磁回路的问题，不是定子绕组短路
          explain: 失磁后发电机靠电网提供励磁，吸收大量无功，拉低系统电压，所以要有失磁保护。

  - id: bus-protection
    chapter: 发电机与母线保护
    title: 母线保护和断路器失灵
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一条母线上接着一个电源和三条出线。正常运行时，流进母线的电流和流出母线的电流（按相量）有什么关系？
          options:
            - text: 相等，相量和为零
              correct: true
            - text: 流出的更多，因为出线多
              why: 母线本身不产生也不消耗电流，按基尔霍夫电流定律，流进多少就流出多少
            - text: 流进的更多，母线上有损耗
              why: 母线是一段导体，电流不会在上面消失
          explain: 母线是一个节点。所有支路电流都以流进母线为正时，相量和为零；母线上短路时，这个和就等于短路电流。
      - card:
          title: 母线保护的原则和母线差动
          body: |
            母线故障不多，但一旦发生，要跳开所有接在母线上的断路器，影响很大；如果只靠各条线路对侧保护的后备延时切除，时间长，可能破坏系统稳定。所以重要的母线要装专用的母线保护。

            母线差动保护把所有支路的电流（都以流进母线为正）相加：

            $$I_d = \left|\sum_i \dot I_i\right|$$

            外部故障时 $I_d \approx 0$；母线上故障时 $I_d$ 等于总短路电流。外部故障时故障支路的互感器流过很大电流，可能饱和而产生差流，所以同样要用比率制动或高阻抗差动来防误动。
      - item:
          id: bus-sum
          type: number
          prompt: '母线上电源支路流进 1000 A，三条出线分别流出 300 A、500 A、200 A（都同相）。以流进母线为正，差动电流是多少安？'
          answer: 0
          hint: 流出的支路电流取正还是负？
          explain: 1000 − 300 − 500 − 200 = 0，正常（或外部故障时）母线差流为零。
      - item:
          id: bus-internal
          type: number
          prompt: '母线上发生短路，电源支路流进 4000 A，一条接有电源的线路也向母线送来 1500 A（同相），其他出线电流很小可以忽略。差动电流是多少安？'
          answer: 5500
          hint: 母线故障时各个电源送来的电流都流进母线。
          explain: I_d = 4000 + 1500 = 5500 A，等于流进故障点的总电流，母线差动动作。
      - card:
          title: 断路器失灵保护
          body: |
            保护发出了跳闸命令，断路器却没有断开（机构卡住、跳闸线圈断线），故障还在。如果等远后备，时间长、停电范围大。

            **断路器失灵保护（breaker failure protection）**：保护动作后，经过一个短延时（一般 0.2～0.3 s）仍然测到这条支路有故障电流，就判定这台断路器失灵，跳开同一条母线上所有其他的断路器，把故障隔离。它比远后备快，停电范围也只限于这条母线。
      - item:
          id: breaker-failure
          type: choice
          prompt: 一条线路故障，线路保护已经发出跳闸命令，可这条线路的断路器没有断开。断路器失灵保护会怎样？
          options:
            - text: 短延时后仍测到故障电流，就跳开同一母线上其他所有断路器
              correct: true
            - text: 立刻再发一次同样的跳闸命令，直到断开为止
              why: 断路器失灵说明它断不开，反复发命令解决不了，要靠周围的断路器把故障隔开
            - text: 什么也不做，等对侧和上一级的远后备保护
              why: 失灵保护正是为了不等远后备：远后备时间长、停电范围大
          explain: 失灵保护用周围的断路器代替失灵的那一台，在零点几秒内隔离故障。

  - id: reclosing
    chapter: 自动重合闸
    title: 自动重合闸
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 架空线路上一次雷击使绝缘子闪络，保护跳开断路器后电弧熄灭。过零点几秒再把断路器合上，多数情况下会怎样？
          options:
            - text: 恢复正常供电
              correct: true
            - text: 一定会再次短路
              why: 雷击引起的闪络是瞬时性故障，电弧熄灭、空气绝缘恢复后，故障就不存在了
            - text: 不能合，跳闸后必须人工巡线
              why: 对瞬时性故障，人工巡线要很长时间；自动再合一次多数能成功
          explain: 架空线路的故障多数是瞬时性的（雷击闪络、鸟害、树枝碰线）。跳闸后自动再合一次，多数能恢复供电。
      - card:
          title: 重合闸的作用和要求
          body: |
            **自动重合闸（auto-reclosing）**：断路器因保护动作跳闸后，经过一段时间自动重新合上。作用：瞬时性故障时迅速恢复供电，提高供电可靠性；双侧电源线路快速重合还能提高系统的暂态稳定；断路器误跳时也能纠正。

            要求：手动跳闸不重合；重合在永久性故障上时只合一次，不能反复冲击；重合前要等足够的时间，让故障点电弧熄灭、绝缘恢复，断路器也要准备好再次跳闸。电缆线路的故障多是永久性的，一般不用重合闸。
      - item:
          id: reclose-benefit
          type: number
          prompt: '某条架空线路一年跳闸 20 次，其中 75% 是瞬时性故障。装了三相一次重合闸后，假设瞬时性故障都能重合成功，一年里有几次跳闸能自动恢复供电？'
          answer: 15
          hint: 只有哪一类故障能重合成功？
          explain: 20 × 75% = 15 次。剩下 5 次是永久性故障，重合后保护会再次跳闸。
      - card:
          title: 三相一次重合闸、前加速和后加速
          body: |
            三相一次重合闸：不论哪种故障，保护跳开三相，延时后重合一次。重合在永久性故障上时，保护再跳三相，不再重合。

            重合闸和保护配合有两种方式：

            - 后加速：第一次按正常的选择性（有延时）跳闸，重合后如果故障仍在，保护不带延时立即跳闸。用得最多，能尽快切除永久性故障；
            - 前加速：第一次不管选择性，靠电源的那一级保护先瞬时跳闸，重合后再按选择性动作，用在简单的辐射形配电线路上。
      - item:
          id: post-accel
          type: choice
          prompt: 重合闸后加速指的是什么？
          options:
            - text: 重合到永久故障后立即跳闸
              correct: true
            - text: 重合闸的等待时间缩短
              why: 加速的是重合以后保护的动作，不是重合前的等待时间
            - text: 第一次故障时保护不顾选择性先瞬时跳闸
              why: 那是前加速；后加速是第一次正常有选择地跳，重合后再加速
          explain: 后加速保证第一次跳闸有选择性，又能尽快切除重合到的永久性故障。
      - card:
          title: 单相重合闸和潜供电流
          body: |
            高压线路上最多的是单相接地故障。单相重合闸：单相接地时只跳开故障相，另外两相继续送电，延时后重合这一相；相间故障时跳三相、不重合（或按设定处理）。两相仍在送电，系统两侧不会完全断开，有利于稳定。能按故障类型自动选择单相或三相方式的叫综合重合闸。

            单相跳开后，健全的两相通过相间电容和互感，仍会向故障点供给一个电流，叫**潜供电流（secondary arc current）**，它让故障点电弧不易熄灭。所以单相重合闸的等待时间要比三相重合闸长。
      - item:
          id: single-phase-delay
          type: choice
          prompt: 为什么单相重合闸的等待时间要比三相重合闸长？
          options:
            - text: 健全相通过电容和互感向故障点供给潜供电流，电弧熄灭需要更长时间
              correct: true
            - text: 单相断路器动作比三相断路器慢
              why: 断路器的动作速度不是原因；关键在故障相没有完全失电
            - text: 为了等待对侧手动操作
              why: 重合闸是自动的；等待是为了让故障点电弧熄灭、绝缘恢复
          explain: 三相都跳开时故障点完全失电；单相跳开时健全相还在耦合供电，电弧要更久才熄灭。

  - id: numerical-relays
    chapter: 微机保护原理
    title: 微机保护：从采样值到幅值和相角
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个 50 Hz 的正弦电流，每个周期等间隔采 12 个点。只拿这 12 个数，能算出这个电流的有效值和相角吗？
          options:
            - text: 能，用一个周期的采样值算出基波的大小和相位
              correct: true
            - text: 不能，必须看到连续的波形
              why: 正弦波由大小、频率、相位三个数决定，频率已知时，一个周期里足够多的采样点就能算出另外两个
            - text: 能，取 12 个数里最大的那个就是峰值
              why: 采样点不一定正好落在峰值上，而且谐波和直流分量会让最大值偏离基波的峰值
          explain: 微机保护正是这样做的：采样、模数转换，再用算法算出基波的幅值和相角。
      - card:
          title: 微机保护装置的构成
          body: |
            **微机保护（numerical relay）**由几部分组成：

            1. 模拟量输入：互感器二次信号经过小变换器变成几伏的电压，先过低通滤波防止混叠，再采样保持、模数转换（ADC）；
            2. 主机（CPU 或数字信号处理器）：执行保护算法和逻辑；
            3. 开关量输入输出：读断路器位置等，发出跳闸和信号；
            4. 通信和人机接口：整定、显示、故障录波，接入变电站自动化系统。

            比起机电式和晶体管式保护，它能自检、记录故障波形、远方通信，一套硬件靠不同软件实现多种保护。
      - item:
          id: sample-rate
          type: number
          prompt: '工频 50 Hz，每个周期采样 20 个点。采样频率是多少赫兹？'
          answer: 1000
          hint: 每秒有多少个周期？每个周期采几个点？
          explain: 50 × 20 = 1000 Hz。采样频率的一半是 500 Hz，低于它的成分才能正确反映，所以前面要用低通滤波滤掉 500 Hz 及以上的成分。
      - item:
          id: highest-harmonic
          type: number
          prompt: '采样频率 1000 Hz。不发生混叠时，能正确反映的最高次谐波是工频（50 Hz）的几次谐波？（谐波次数取整数，且频率要低于采样频率的一半）'
          answer: 9
          hint: 采样频率的一半是多少赫兹？低于它的最高次谐波是多少赫兹？
          explain: 一半是 500 Hz。10 次谐波正好 500 Hz，不低于一半；9 次谐波 450 Hz 可以，所以最高是 9 次。
      - card:
          title: 全周傅里叶算法
          body: |
            一个周期采 $N$ 个点 $x_0, x_1, \dots, x_{N-1}$，算基波的两个分量：

            $$a = \frac2N\sum_{k=0}^{N-1} x_k\cos\frac{2\pi k}{N},\qquad b = \frac2N\sum_{k=0}^{N-1} x_k\sin\frac{2\pi k}{N}$$

            若信号是 $X_m\cos(\omega t + \varphi)$，算出 $a = X_m\cos\varphi$、$b = -X_m\sin\varphi$，于是幅值（峰值）$X_m = \sqrt{a^2 + b^2}$，有效值 $X_m/\sqrt2$，相角 $\varphi$ 由 $\cos\varphi = a/X_m$、$\sin\varphi = -b/X_m$ 定出。

            直流分量和整数次谐波在一个周期里求和正好为零，被全部滤掉。代价是要等满一个周期（50 Hz 时 20 ms）的数据。
          reveal:
            - title: 第 1 步：写出采样值
              body: |
                例：$x(t) = 10\cos(\omega t + 30°)$，$N = 12$，$x_k = 10\cos(30° k + 30°)$：$x_0 = 8.66$，$x_1 = 5$，$x_2 = 0$，$x_3 = -5$……
            - title: 第 2 步：按公式求和
              body: |
                算得 $a = 8.66$，$b = -5$。
            - title: 第 3 步：幅值和相角
              body: |
                $X_m = \sqrt{8.66^2 + 5^2} = 10$，有效值 $10/\sqrt2 \approx 7.07$；$\cos\varphi = 0.866$、$\sin\varphi = 0.5$，$\varphi = 30°$。
      - item:
          id: fourier-amp
          type: number
          prompt: '全周傅里叶算法算出某电流基波的 $a = 6$ A、$b = -8$ A。这个基波电流的有效值是多少安？（保留两位小数）'
          answer: 7.07
          tolerance: 0.005
          hint: 先由 a、b 求幅值（峰值），有效值再除以多少？
          explain: 幅值 √(36 + 64) = 10 A，有效值 10/√2 ≈ 7.07 A。
      - item:
          id: fourier-dc
          type: choice
          prompt: 全周傅里叶算法为什么能滤掉直流分量和整数次谐波？
          options:
            - text: 它们乘 cos、sin 后整周求和为零
              correct: true
            - text: 因为采样前的低通滤波器把它们全部滤掉了
              why: 低通滤波器只滤掉采样频率一半以上的成分，低次谐波和直流还在，是算法本身把它们滤掉的
            - text: 因为它只取采样值里最大的那个
              why: 傅里叶算法用的是所有采样值的加权和，不是只取最大值
          explain: 不同频率的正弦（以及常数）乘基波的 cos、sin 后在整周期上互相抵消，求和为零，所以只剩基波分量。
boss:
  items:
    - id: b-backup
      type: choice
      prompt: 远后备保护和近后备保护相比，哪一项说法正确？
      options:
        - text: 远后备不用增加设备，但动作慢、停电范围大
          correct: true
        - text: 远后备比近后备动作快
          why: 远后备要等下一级保护配合，带的延时更长
        - text: 远后备装在被保护元件本身上
          why: 装在本元件上的另一套保护是近后备；远后备是上一级元件的保护
        - text: 有了远后备就不需要断路器失灵保护
          why: 远后备动作慢、停电范围大；重要场合仍要用近后备加断路器失灵保护
      explain: 远后备由上一级保护延时动作，不需额外装置，代价是慢和停电范围大。
    - id: b-ct
      type: number
      prompt: '电流互感器变比 800/5，一次侧短路电流 4000 A。二次电流是多少安？'
      answer: 25
      explain: 变比 160，4000 / 160 = 25 A。
    - id: b-instant
      type: number
      prompt: '线路末端最大三相短路电流 1500 A，电流速断保护的可靠系数取 1.3。动作电流是多少安？'
      answer: 1950
      explain: 1.3 × 1500 = 1950 A。
    - id: b-overcurrent
      type: number
      prompt: '线路最大负荷电流 250 A，过电流保护取可靠系数 1.2、自启动系数 2、返回系数 0.85。一次动作电流是多少安？（保留到个位）'
      answer: 706
      tolerance: 0.5
      explain: 1.2 × 2 × 250 / 0.85 ≈ 705.9 A，约 706 A。
    - id: b-ungrounded
      type: choice
      prompt: 中性点不接地系统发生单相金属性接地。下面哪一项正确？
      options:
        - text: 线电压仍对称，可短时运行
          correct: true
        - text: 形成很大的短路电流，必须立即跳闸
          why: 中性点不接地时没有短路回路，接地点只有电容电流
        - text: 故障相对地电压升高到线电压
          why: 故障相对地电压降到零，升高到线电压的是另外两相
        - text: 系统里不出现零序电压
          why: 接地后中性点电位偏移，全系统出现零序电压，绝缘监视正是靠它报警
      explain: 单相接地不破坏线电压的对称，规程允许短时运行；保护先发信号，再选出故障线路。
    - id: b-distance
      type: number
      prompt: '线路正序阻抗 25 Ω，距离Ⅰ段按 85% 整定，电流互感器 400/5，电压互感器 110 kV/100 V。二次整定阻抗是多少欧？（保留两位小数）'
      answer: 1.55
      tolerance: 0.005
      explain: 一次 0.85 × 25 = 21.25 Ω；二次 21.25 × 80 / 1100 ≈ 1.55 Ω。
    - id: b-mho
      type: choice
      prompt: '方向圆特性的整定阻抗 $Z_{\text{set}} = 8\angle 70°$ Ω。下面哪个测量阻抗在动作区内？'
      options:
        - text: 6∠55° Ω
          correct: true
        - text: 7∠20° Ω
          why: 沿 20° 方向圆的边界在 8cos50° ≈ 5.14 Ω，7 Ω 在圆外
        - text: 9∠70° Ω
          why: 沿最大灵敏角方向边界就是 8 Ω，9 Ω 超出
        - text: 4∠−110° Ω
          why: 这是反方向的阻抗，cos(70° + 110°) 为负，方向圆不包含它
      explain: 6∠55° 和整定方向差 15°，边界在 8cos15° ≈ 7.73 Ω，6 Ω 在圆内。
    - id: b-pilot
      type: number
      prompt: '纵联电流差动保护，两端电流都以流进线路为正：$\dot I_M = 700\angle 0°$ A，$\dot I_N = 500\angle 0°$ A。差动电流是多少安？'
      answer: 1200
      explain: I_d = |700 + 500| = 1200 A，差流大，判为区内故障。
    - id: b-transformer
      type: number
      prompt: '一台 63 MVA、220/10.5 kV 的三相变压器，高压侧额定电流是多少安？（保留一位小数）'
      answer: 165.3
      tolerance: 0.05
      explain: I = 63 × 10⁶ / (√3 × 220 × 10³) ≈ 165.3 A。
    - id: b-inrush
      type: choice
      prompt: 变压器差动保护靠什么区分励磁涌流和内部故障？
      options:
        - text: 涌流含大量二次谐波、波形有间断，内部故障电流接近工频正弦
          correct: true
        - text: 涌流比内部故障电流大得多
          why: 涌流可达额定电流好几倍，内部故障电流也可能很大，单凭大小分不清
        - text: 涌流两侧都有，内部故障只有一侧有
          why: 说反了：涌流只从电源一侧流进；内部故障时可能两侧都向故障点送电流
        - text: 涌流只出现在低压侧
          why: 涌流出现在合闸的那一侧，一般是电源侧，和高低压无关
      explain: 二次谐波制动、间断角鉴别都是利用涌流波形和故障电流波形的不同。
    - id: b-breaker-fail
      type: choice
      prompt: 断路器失灵保护动作后跳开哪些断路器？
      options:
        - text: 同母线的其他断路器
          correct: true
        - text: 只再跳一次失灵的那台断路器
          why: 它已经断不开了，要靠周围的断路器隔离故障
        - text: 全站所有断路器
          why: 只需隔离失灵断路器所在的母线，跳全站会扩大停电
        - text: 对侧变电站的所有断路器
          why: 对侧切除是远后备的做法，慢且范围大；失灵保护在本站就近隔离
      explain: 失灵保护跳开同一母线上的其余断路器，停电范围限于这条母线。
    - id: b-reclose
      type: choice
      prompt: 重合闸重合到永久性故障上，下面哪种做法正确？
      options:
        - text: 后加速跳闸，不重合
          correct: true
        - text: 再重合一次，直到成功为止
          why: 反复重合会让系统和设备多次承受短路冲击；一次重合不成功就判为永久性故障
        - text: 保护按原来的延时动作，然后再重合
          why: 永久性故障应尽快切除，常用后加速立即跳闸，而且不再重合
        - text: 闭锁保护，等人工处理
          why: 故障仍在，保护必须动作切除它
      explain: 三相一次重合闸只重合一次；重合不成功时后加速立即跳闸。
    - id: b-fourier
      type: number
      prompt: '全周傅里叶算法算出某电压基波的 $a = 3$ V、$b = 4$ V。基波电压的有效值是多少伏？（保留两位小数）'
      answer: 3.54
      tolerance: 0.005
      explain: 幅值 √(9 + 16) = 5 V，有效值 5/√2 ≈ 3.54 V。
