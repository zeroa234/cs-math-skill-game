skill: P.1.3
version: 2
authors: [main-agent]
brief:
  why: |
    在 Python 里，列表和变量可以原地改动，一旦有两个名字指向同一个列表，改一处就会意外改掉另一处。函数式、逻辑式与声明式编程换了一套思路：默认不改旧数据，只算出新结果；把行为写进函数参数里组合起来；用代数数据类型和模式匹配让分支不遗漏；或者只说出规则与目标，让系统去搜索答案。本关用 OCaml、Prolog 和 SQL 各自最拿手的部分带你上手这套思考方式。
  outcomes:
    - 用 OCaml 的表达式、let 绑定与递归函数写无副作用计算，并用类型报错和打印排查问题
    - 用不可变列表的共享结构保留历史版本，并分清何时才把 ref、可变字段或数组圈在小范围里
    - 用高阶函数、柯里化、map、filter、fold 与管道处理列表和其他结构，写出尾递归并看懂代数定律
    - 用变体、Option、记录、元组与代数数据类型建模二叉树，靠编译器检查模式匹配是否漏分支
    - 用 Prolog 的 Horn 子句写出事实、规则和列表递归，追踪合一与回溯，并写出声明式 SQL 聚合查询
terms:
  - term: 编译
    def: '在程序运行之前，把整份源代码检查并翻译成计算机能直接执行的程序的过程'
  - term: 编译器
    def: '负责在运行前执行编译、检查类型与语法并翻译出可执行程序的工具'
  - term: 递归
    def: '函数在自己的定义里调用自己，配合不再继续调用的终止条件把问题一步步缩小'
  - term: 副作用
    def: '函数除了算出返回值之外，对外部环境造成的改变，例如修改变量、改动列表或打印输出'
  - term: 内存
    def: '电脑运行程序时存放代码和数据的空间，每个数据占据其中一块位置'
  - term: 引用
    def: '在 OCaml 里用 ref 造出的可控可变盒子，通过 ! 取值、:= 改写里面的内容'
  - term: 数组
    def: '长度固定、元素按编号连续摆放在一起的序列，在 OCaml 里用 [|...|] 写出，按下标读写很快'
  - term: 高阶函数
    def: '把另一个函数作为参数接收，或者把函数当作返回值交出来的函数'
  - term: 柯里化
    def: '把接收多个参数的函数看成一次只收一个参数、并返回一个接收剩余参数的新函数的写法'
  - term: 折叠
    def: '用一个累积值和组合函数，依次扫过序列里的每个元素，最后汇总成一个结果的操作'
  - term: 栈帧
    def: '调用栈上专门为某一次尚未结束的函数调用分配的一小块记录，保存它的参数和做到哪一步'
  - term: 尾递归
    def: '递归调用恰好是函数执行的最后一步，返回时不再有额外计算，编译器可以复用当前栈帧'
  - term: 栈溢出
    def: '调用栈里叠放的未返回调用太多、超过了可用空间上限而导致程序崩溃的错误'
  - term: 变体
    def: '用有限个名字列出所有可能情况的类型，每个分支还可以各自携带不同的数据'
  - term: 模式匹配
    def: '按值的形状拆开数据并选择对应分支的写法，编译器会检查有没有漏掉可能的情况'
  - term: 代数数据类型
    def: '把“多种情况选其一”的变体和“多个字段合在一起”的记录或元组组合起来的数据类型，常带递归定义'
  - term: 谓词
    def: 'Prolog 里表示一条性质或关系的名称与参数框架，常连同参数个数记作 名称/元数，如 parent/2'
  - term: 查询优化器
    def: '数据库内部负责把声明式 SQL 自动转换成高效执行计划与扫描路径的组件'
  - term: 声明式编程
    def: '只描述目标结果需要满足什么条件或关系，而不手写一步步修改状态的循环步骤的编程方式'
  - term: Horn 子句
    def: '逻辑编程里的基本语句形式，最多只有一个结论（头部），其余都是需要同时满足的前提（体部）'
  - term: 合一
    def: '逻辑系统把两个带变量的项双向比对并绑定变量，使它们变得完全相同的过程'
  - term: 回溯
    def: '当前规则或分支走不通（或要找下一个解）时，退回最近的选择点并改试另一条规则的过程'
lessons:
  # ==== 不可变数据 ====
  - id: expressions
    chapter: 不可变数据
    title: 用表达式、绑定与类型思考
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            你在 Python 里写 `x = 10`，接着写 `x = x + 1`，`x` 就改成了 `11`。在默认不可变的 OCaml 里写下两行：
            `let x = 10` 和 `let y = x + 1`，猜猜它更像在做什么？
          options:
            - text: 给算出来的 10 起名 x，再算出新值 11 起名 y，10 本身并没有被改掉
              correct: true
            - text: 把 x 所在格子里的值偷偷覆写成 11，然后把别名改为 y
              why: OCaml 的 let 不是往格子里改写，而是给计算结果贴上一个不可更改的标签
            - text: 只记下公式“y 以后等于 x 加 1”，等打印 y 的时候再去算
              why: 普通 let 绑定会立刻算出右边表达式的结果，再把名字绑定到这个值上
          explain: |
            在函数式风格里，我们习惯用表达式直接算出新值并起一个新名字，而不是反复修改旧变量。这一课一起看 OCaml 的表达式、`let` 绑定、静态类型和排查错误。
      - card:
          title: 表达式、let 绑定与类型检查
          body: |
            OCaml 程序在运行前会先经过**编译（compile）**，由**编译器（compiler）**把类型和语法全部检查一遍。`let 名字 = 表达式` 把名字贴到算出的值上。

            整数加减乘和整除用 `+ - * /`，浮点数用 `+. -. *. /.`（转浮点用 `float_of_int`）。`let () = ...` 用于运行打印：`%d` 输出整数，`%.1f` 输出一位小数。

            ```ocaml
            let width = 5
            let height = 2
            let area = width * height
            let ratio = 2.0 +. 3.5
            let () = Printf.printf "%d %.1f\n" area ratio
            ```
      - item:
          id: type-check-mismatch
          type: choice
          prompt: |
            如果你在 OCaml 里写下 `let bad = 2 + 3.5`，还没运行就会发生什么？
          options:
            - text: 类型检查直接报错，提示 3.5 是 float 而 + 需要 int
              correct: true
            - text: 自动把 2 转成浮点数 2.0，算出 5.5
              why: OCaml 不会隐式把 int 变成 float，必须显式写 float_of_int 2 +. 3.5
            - text: 把 3.5 截断成整数 3，算出 5
              why: OCaml 不会悄悄丢掉小数部分，不同数值类型不能混用 +
          explain: |
            OCaml 的 `+` 只收两个 `int`，`+.` 只收两个 `float`。类型不匹配会在运行前就被编译器拦住。
      - card:
          title: 定义函数与“自己调自己”的递归
          body: |
            用 `let f a b = ...` 定义函数，最后算出的表达式就是返回值，不用写 `return`。调用函数直接空格隔开参数，比如 `square 3`。

            不靠循环改变量时，重复计算常用**递归（recursion）**：在 `let` 后面加 `rec`，写清“最小情况直接给答案”和“把问题缩小再调自己”。

            ```ocaml
            let rec fact n =
              if n <= 1 then 1
              else n * fact (n - 1)

            let () = Printf.printf "%d\n" (fact 4)
            ```
      - item:
          id: fact-trace
          type: number
          prompt: |
            看下面这段 OCaml 递归函数，`fact 4` 算出的整数是多少？
          code: |
            let rec fact n =
              if n <= 1 then 1
              else n * fact (n - 1)
          lang: ocaml
          answer: 24
          hint: 从 `fact 4 = 4 * fact 3` 一层层展开到 `fact 1 = 1` 再乘回去。
          explain: |
            `fact 4 = 4 * fact 3 = 4 * 3 * fact 2 = 4 * 3 * 2 * 1 = 24`。
      - card:
          title: 分步看懂调试：类型报错与打印排查
          body: |
            写 OCaml 卡住时，先看报错信息里的“期待类型 vs 实际类型”，再检查括号和条件分支，最后加打印看中间值。
          reveal:
            - title: 第 1 步：读懂“期待类型 vs 实际类型”
              body: |
                报错 `This expression has type float but an expression was expected of type int`，意思是“你给了 `float`，但 `+` 这里只要 `int`”。先改运算符（`+.`）或显式转换（`float_of_int`）。
            - title: 第 2 步：条件分支两头类型必须一致
              body: |
                `if cond then a else b` 整个表达式只能有一种类型；如果 `a` 是整数、`b` 是字符串，也会在编译前报错。而且只要 `then` 返回的不是无值结果 `()`（unit），就必须写出 `else`。
            - title: 第 3 步：加括号与打印检查递归边界
              body: |
                写 `fact n - 1` 会被当成 `(fact n) - 1` 导致无限调用。要写 `fact (n - 1)`。排查逻辑错误时，在递归入口加 `Printf.printf "n=%d\n" n` 或用 `assert (fact 0 = 1)` 守住边界。
      - item:
          id: if-branch-type
          type: choice
          prompt: |
            下面哪段 OCaml 代码可以通过类型检查？
          options:
            - text: |
                `if 3 > 2 then "ok" else "no"`
              correct: true
            - text: |
                `if 3 > 2 then 1 else "no"`
              why: then 分支是 int，else 分支是 string，整个 if 表达式找不到统一的类型
            - text: |
                `if 3 > 2 then 1`
              why: 带有非 unit 返回值的 if 必须配 else，否则条件不成立时不知道返回什么值
            - text: |
                `let x = 2 + 3.5`
              why: + 只能相加两个 int，不能把 int 和 float 直接相加
          explain: |
            OCaml 里 `if ... then ... else ...` 是一个会算出值的表达式，两条分支必须返回同一类型。
      - item:
          id: area-calc
          type: number
          prompt: |
            下面这段 OCaml 代码最后打印出的整数是多少？
          code: |
            let square x = x * x
            let sum_squares a b = square a + square b
            let () = Printf.printf "%d\n" (sum_squares 3 4)
          lang: ocaml
          answer: 25
          hint: 先分别计算 `square 3` 和 `square 4`，再相加。
          explain: |
            `square 3` 得 `9`，`square 4` 得 `16`，`sum_squares 3 4` 返回 `9 + 16 = 25`。

  - id: immutable
    chapter: 不可变数据
    title: 不可变列表与共享结构
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            你在 Python 里写 `a = [2, 3]`，再写 `b = a`，然后执行 `a.insert(0, 1)`。猜猜这时 `b` 变成了什么？
          options:
            - text: "[1, 2, 3]——因为 a 和 b 是同一个列表的别名，改 a 连 b 一起改了"
              correct: true
            - text: "[2, 3]——因为 b = a 已经把列表复制了一份"
              why: Python 的赋值只复制名字指向，不会自动拷贝列表
            - text: 会直接报错，提醒你 b 还在使用这个列表
              why: Python 允许多个别名同时修改同一个可变列表
          explain: |
            别名加上原地修改是很多隐蔽 bug 的来源。这一课来看 OCaml 的不可变列表怎样做到“既能长出新列表，又绝对不碰旧列表”。
      - card:
          title: "列表默认不可变，:: 只造新头部"
          body: |
            OCaml 列表元素之间用分号隔开：`[2; 3]`（`List.length xs` 可数长度）。`::` 在旧列表前接新元素造出新列表，**绝不修改旧列表**；而 `a @ b` 拼接两张表则要复制 `a`。

            两者共享尾部安全无**副作用（side effect）**——“副作用”指算完返回值外还改动外部状态。

            ```ocaml
            let old_list = [2; 3]
            let new_list = 1 :: old_list
            let () = Printf.printf "%d %d\n" (List.length old_list) (List.length new_list)
            ```
      - item:
          id: cons-length
          type: choice
          prompt: |
            执行下面三行 OCaml 代码，打印出的两个长度分别是多少？
          code: |
            let old_list = [2; 3]
            let new_list = 1 :: old_list
            let () = Printf.printf "%d %d\n" (List.length old_list) (List.length new_list)
          lang: ocaml
          options:
            - text: 2 和 3
              correct: true
            - text: 3 和 3
              why: "1 :: old_list 不会修改 old_list，old_list 仍然是长度为 2 的 [2; 3]"
            - text: 2 和 2
              why: new_list 在 old_list 前面多接了一个元素 1，长度变成 3
          explain: |
            `old_list` 依然是 `[2; 3]`（长度 2），`new_list` 是 `[1; 2; 3]`（长度 3），并且直接复用了 `old_list` 的尾巴 `[2; 3]`。
      - card:
          title: "例题：用 head :: tail 递归求和"
          body: |
            OCaml 列表就像一节节火车车厢：空列表 `[]` 是车尾，非空列表总能拆成第一节车厢 `x` 和后面一串车厢 `xs`。按这个结构写递归，完全不用循环。
          reveal:
            - title: 第 1 步：写出空列表的停止条件
              body: |
                空列表 `[]` 没有任何元素，总和当然是 `0`：`| [] -> 0`。没有这一步，递归永远停不下来。
            - title: 第 2 步：把非空列表拆成“头 x”和“尾 xs”
              body: |
                `| x :: xs -> x + sum xs`。例如 `[4; 5; 6]` 会拆成 `x = 4`、`xs = [5; 6]`；下一步 `xs` 再拆成 `5` 和 `[6]`。
            - title: 第 3 步：用 function 简写写出完整函数
              body: |
                `function | [] -> ...` 是“接收一个参数并立刻按形状拆开”的简写：

                ```ocaml
                let rec sum = function
                  | [] -> 0
                  | x :: xs -> x + sum xs

                let () = Printf.printf "%d\n" (sum [4; 5; 6])
                ```
      - item:
          id: list-sum-item
          type: number
          prompt: |
            用 `sum` 递归计算列表总和：`[] -> 0`，`x :: xs -> x + sum xs`。调用 `sum [10; 20; 5; 1]` 的返回值是多少？
          answer: 36
          explain: |
            `10 + (20 + (5 + (1 + 0))) = 36`。
      - item:
          id: append-vs-cons
          type: choice
          prompt: |
            为什么在 OCaml 里用 `1 :: old_list` 在表头加元素通常比用 `old_list @ [1]` 在表尾拼接更快？
          options:
            - text: "1 :: old_list 只需新建一个节点指向原来的 old_list，不用拷贝旧列表"
              correct: true
            - text: "@ 运算符每次都会把列表排序一遍"
              why: "@ 只是拼接两个列表，不会排序"
            - text: ":: 会直接把 1 插进 old_list 原来的位置，所以最快"
              why: ":: 不会修改 old_list，只是新建头部并共享 old_list"
          explain: |
            列表是一节节单向往后指的：头插 `::` 只需新造第一节并指向原来的旧列表，一步完成；而 `@` 必须把左边列表的每一节都重新复制一遍才能接上尾巴。
      - item:
          id: head-tail-match
          type: choice
          prompt: |
            列表 `[7]` 用模式 `x :: xs` 拆开后，`x` 和 `xs` 分别是什么？
          options:
            - text: x 是 7，xs 是空列表 []
              correct: true
            - text: x 是 [7]，xs 是 []
              why: ":: 左边是单个元素，不是单元素列表"
            - text: 无法匹配，因为只有一个元素没有尾巴
              why: "单元素列表 [7] 等价于 7 :: []，尾巴正是空列表 []"
          explain: |
            `[7]` 就是 `7 :: []`，所以头元素 `x = 7`，剩余列表 `xs = []`。

  - id: mutation
    chapter: 不可变数据
    title: 把 ref、可变字段与数组圈在小范围
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            既然不可变这么安全，为什么 OCaml 还是保留了可修改的格子（ref）和按下标随时直接读写的固定长度序列？猜猜最实际的原因是什么？
          options:
            - text: 计数器、按编号直接改写或追求局部速度时，可控的可变状态更省事更快
              correct: true
            - text: 因为 OCaml 的编译器做不到不可变加法，必须靠修改格子
              why: 不可变表达式和递归完全能写算术和列表，不需要可变格子
            - text: 为了让所有人把程序写得和 Python 一样，全盘改回全局变量
              why: 函数式语言只建议把可变状态圈在很小的局部，绝不是满地全局变量
          explain: |
            工程上既需要“默认不可变”的清晰，也需要偶尔“受控地改一处”。OCaml 提供了三种显式标出可变的地方：`ref`、记录里的 `mutable` 字段，以及按编号连续存放的可变序列。
      - card:
          title: ref 可变盒子与记录里的 mutable 字段
          body: |
            需要一个能改的计数器时，可以造一个**引用（ref）**：`let r = ref 10`。用 `!r` 读里面的值，用 `r := !r + 5` 把新值放进去。

            如果一个带多个具名字段的记录（用 `type 名字 = { 字段 : 类型 }` 定义）只需要某一项能改，就在那一项前加 `mutable`，改写时用 `<-`。**内存（memory）**里只更新那一格，其余字段保持不可变。

            ```ocaml
            type counter = { label : string; mutable hits : int }
            let r = ref 10
            let () = r := !r + 5
            let box = { label = "api"; hits = 0 }
            let () = box.hits <- box.hits + 2
            let () = Printf.printf "%d %d\n" !r box.hits
            ```
      - item:
          id: ref-and-mutable
          type: number
          prompt: |
            看下面这段使用 `ref` 和 `mutable` 字段的 OCaml 代码，打印出来的 `!r + box.hits` 之和是多少？
          code: |
            type counter = { label : string; mutable hits : int }
            let r = ref 10
            let () = r := !r + 5
            let box = { label = "api"; hits = 0 }
            let () = box.hits <- box.hits + 2
            let () = Printf.printf "%d\n" (!r + box.hits)
          lang: ocaml
          answer: 17
          hint: "`!r` 从 10 加上了 5，`box.hits` 从 0 加上了 2。"
          explain: |
            `!r` 变成 `15`，`box.hits` 变成 `2`，两者之和是 `15 + 2 = 17`。
      - card:
          title: 数组与 for 循环
          body: |
            列表按编号找第 1000 个元素要一节节往后数；如果需要瞬间按下标读写，可以使用**数组（array）**。数组用 `[| 2; 4; 6 |]` 写出，读写元素写 `a.(i)` 和 `a.(i) <- 新值`。

            数组长度建好就固定了，改写元素会直接原地更新。OCaml 也配了 `for` 循环，适合把可变计算关在单个函数内部，对外仍然表现为纯函数。
          reveal:
            - title: 第 1 步：对比列表和数组的写法
              body: |
                列表写 `[2; 4; 6]`，长度可增减（用 `::`），按头尾拆最快；数组写 `[| 2; 4; 6 |]`，长度固定，按任意下标 `a.(i)` 读写都是常数步数。
            - title: 第 2 步：用 for 循环逐格改写数组（; 表示顺序执行）
              body: |
                循环体写好后，用分号 `;` 把循环和后面的打印按先后顺序连起来：

                ```ocaml
                let a = [| 2; 4; 6 |]
                let () =
                  for i = 0 to Array.length a - 1 do
                    a.(i) <- a.(i) + i
                  done;
                  Printf.printf "%d %d %d\n" a.(0) a.(1) a.(2)
                ```
      - item:
          id: array-loop-val
          type: number
          prompt: |
            下面这段带 `for` 循环的 OCaml 程序跑完后，元素 `a.(2)` 变成了多少？
          code: |
            let a = [| 2; 4; 6 |]
            let () =
              for i = 0 to Array.length a - 1 do
                a.(i) <- a.(i) + i
              done
          lang: ocaml
          answer: 8
          hint: 下标 `i = 2` 时，原来的 `a.(2)` 是 `6`，加上 `i` 等于多少？
          explain: |
            循环把每个元素加上它自己的下标：`a.(0) = 2 + 0 = 2`，`a.(1) = 4 + 1 = 5`，`a.(2) = 6 + 2 = 8`。
      - item:
          id: ref-operator-match
          type: match
          prompt: |
            把 OCaml 里四种数据操作和它们的写法连起来。
          pairs:
            - ["读取 ref 里的当前值", "!r"]
            - ["改写 ref 里的内容", "r := 99"]
            - ["改写数组或 mutable 字段", "a.(0) <- 99"]
            - ["构造不可变列表头部", "99 :: xs"]
          explain: |
            `!` 读 `ref`，`:=` 改 `ref`，`<-` 改数组元素或记录的 `mutable` 字段；而 `::` 是不可变列表的前插。
      - item:
          id: alias-ref-pitfall
          type: choice
          prompt: |
            如果你写了 `let a = ref 1` 和 `let b = a`，接着执行 `a := 5`，那么 `!b` 的值是什么？
          options:
            - text: 5，因为 a 和 b 指向同一个 ref 盒子
              correct: true
            - text: 1，因为 let b = a 复制出了一份新的 ref 盒子
              why: let b = a 只是让 b 绑定到同一个 ref 值，没有新建盒子
            - text: 会编译报错，因为 OCaml 禁止给 ref 起第二个名字
              why: OCaml 允许别名存在，所以更要把可变状态圈在小范围里
          explain: |
            正因为多个名字指向同一个 `ref` 或数组时仍会发生联动修改，才要把 `ref` 和数组只关在需要的函数或局部里面。

  # ==== 高阶函数 ====
  - id: higher-currying
    chapter: 高阶函数
    title: 函数当参数与柯里化
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            在 Python 里你用过 `sorted(words, key=len)`，把函数 `len` 直接当参数传进 `sorted`。在函数式编程里，把函数当作普通值到处传递有什么用？
          options:
            - text: 把“走过数据的固定骨架”和“每一步具体做什么”拆开，同一套骨架就能反复复用
              correct: true
            - text: 只是为了把代码行数写短一点，本质上和复制粘贴函数一样
              why: 拆分出变化的行为能减少重复代码，也更容易组合和测试
            - text: 因为 OCaml 不允许定义超过两个函数，所以必须套着传
              why: OCaml 可以定义任意多个函数，传函数是为了抽象公共流程
          explain: |
            把函数当参数或返回值，是高阶编程的起点。这一课还要看一个看起来很特别但极其顺手的机制：柯里化。
      - card:
          title: 高阶函数与匿名函数 fun
          body: |
            能把函数当作参数收进来，或者把函数当作结果交出去的函数，叫**高阶函数（higher-order function）**。

            如果某个小操作只用一次，不必单独 `let` 起名，可以用 `fun x -> 表达式` 现场写出一个匿名函数。比如 `apply_twice` 把同一个函数连跑两次：

            ```ocaml
            let apply_twice f x = f (f x)
            let res = apply_twice (fun x -> x * 2) 3
            let () = Printf.printf "%d\n" res
            ```
      - item:
          id: apply-twice-num
          type: number
          prompt: |
            定义 `let apply_twice f x = f (f x)`，那么 `apply_twice (fun x -> x * 2) 3` 算出的整数是多少？
          answer: 12
          hint: 先算内层 `f 3`，再把结果喂给外层的 `f`。
          explain: |
            `f 3 = 3 * 2 = 6`，再算一次 `f 6 = 6 * 2 = 12`。
      - card:
          title: 柯里化：一次只收一个参数
          body: |
            在 OCaml 里，写 `let add x y = x + y`，实际上等价于：先收下 `x`，返回一个“等待 `y` 的新函数”。这种把多参数函数拆成一连串单参数函数的机制叫**柯里化（currying）**。

            正因为这样，只传第一个参数 `let add5 = add 5` 不会报错，而是直接得到一个“给参数加 5”的新函数。
          reveal:
            - title: 第 1 步：把两参函数看成嵌套函数
              body: |
                `let add = fun x -> (fun y -> x + y)`，它的类型是 `int -> (int -> int)`，意思是“收一个整数，交出一个收整数得整数的函数”。
            - title: 第 2 步：部分应用（只喂第一个参数）
              body: |
                `let add5 = add 5` 把 `x` 固定成 `5`，留下 `fun y -> 5 + y`，类型是 `int -> int`。以后随时都可以给 `add5` 喂不同的 `y`。
            - title: 第 3 步：再喂第二个参数算出结果
              body: |
                ```ocaml
                let add x y = x + y
                let add5 = add 5
                let () = Printf.printf "%d\n" (add5 7)
                ```
      - item:
          id: currying-apply
          type: number
          prompt: |
            在 OCaml 里定义 `let mul x y = x * y` 和 `let triple = mul 3`，那么 `triple 8` 的结果是多少？
          answer: 24
          explain: |
            `mul 3` 返回函数 `fun y -> 3 * y`，再传入 `8` 就算出 `3 * 8 = 24`。
      - item:
          id: currying-why
          type: choice
          prompt: |
            在 OCaml 里 `let f x y = x - y`，下面哪项是对 `f 10` 的正确描述？
          options:
            - text: 一个新函数：收下参数 y，算出 10 - y
              correct: true
            - text: 直接报错“缺少参数 y”，因为函数参数必须一次给齐
              why: 柯里化函数允许先给前面几个参数，得到等待剩余参数的函数
            - text: 把 y 默认设为 0，直接返回整数 10
              why: OCaml 不会自动给未传参数补 0，部分应用返回的是函数而不是整数
          explain: |
            只给一部分参数叫做部分应用（partial application），依赖柯里化自然实现，结果是等待剩余参数的函数。
      - item:
          id: higher-order-role
          type: choice
          prompt: |
            函数 `let compose f g x = f (g x)` 为什么算高阶函数？
          options:
            - text: 因为它把函数 f 和 g 当作参数接收进来组合调用
              correct: true
            - text: 因为它里面用了算术表达式
              why: 普通整数函数也有算术表达式，这不是高阶函数的特征
            - text: 因为它必须用递归定义
              why: compose 并没有调用自己，它是高阶函数是因为参数 f 和 g 本身就是函数
          explain: |
            只要参数或返回值里出现了函数，它就是高阶函数，跟是否递归无关。

  - id: map-filter
    chapter: 高阶函数
    title: Map 与 Filter：转换和筛选分开
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            假设你有一份成绩单 `[55; 60; 75]`，想先挑出及格（`>= 60`）的成绩，再给每门及格成绩加 `5` 分。如果把“挑出元素”和“改写元素”拆成两个小步骤，猜猜哪个顺序和结果是对的？
          options:
            - text: 先按 >= 60 挑出 [60; 75]，再各加 5 得 [65; 80]
              correct: true
            - text: 先全加 5 得 [60; 65; 80]，再按 >= 60 挑，结果也一样所以顺序随便
              why: 55 加 5 后变成了 60 会误过及格线，先加再挑会多出本来不及格的分数
            - text: 挑完后列表会变短，所以 filter 不能接 map
              why: filter 返回的仍然是列表，正好直接喂给下一步的 map
          explain: |
            把“逐个变换”和“按条件保留”拆开，不仅逻辑清楚，还能看出先后顺序对业务含义的差别。这正是 `map` 和 `filter` 两个基本积木。
      - card:
          title: Map：逐个转换，形状与顺序不变
          body: |
            `map f xs` 把列表 `xs` 里的每个元素 `x` 变成 `f x`，得到同样长度的新列表。就像流水线上给每个包裹统一贴标，不删也不换顺序。

            拆成头 `x` 和尾 `xs` 三行递归就能写出来，标准库叫 `List.map`（下面 `List.iter` 按顺序打印每个数）：

            ```ocaml
            let rec my_map f = function
              | [] -> []
              | x :: xs -> f x :: my_map f xs

            let doubled = my_map (fun x -> x * 2) [1; 3; 5]
            let () = List.iter (Printf.printf "%d ") doubled; print_newline ()
            ```
      - item:
          id: map-output
          type: choice
          prompt: |
            定义 `let rec my_map f = function [] -> [] | x :: xs -> f x :: my_map f xs`。如果调用 `my_map (fun x -> x + 10) [2; 5; 8]`，会得到什么列表？
          options:
            - text: "[12; 15; 18]"
              correct: true
            - text: "[18; 15; 12]"
              why: my_map 把 f x 接在 my_map f xs 的前面，保持原来的先后顺序
            - text: "35"
              why: map 返回的是每个元素变换后的新列表，不是求和
          explain: |
            `map` 对每个元素各自应用 `f`，保持原顺序与原长度，结果是 `[12; 15; 18]`。
      - card:
          title: Filter：按条件留人，不改元素本身
          body: |
            `filter p xs` 接收一个返回布尔值的判断函数 `p`，只留下使 `p x` 为 `true` 的元素。它只管去留，不改动留下的元素值；标准库里叫 `List.filter`。
          reveal:
            - title: 第 1 步：空列表直接返回空列表
              body: |
                `| [] -> []`，没有任何元素可挑。
            - title: 第 2 步：看头元素 x 满不满足 p x
              body: |
                满足就把 `x` 留下来：`x :: my_filter p xs`；不满足就跳过 `x`，只递归处理尾巴：`my_filter p xs`。
            - title: 第 3 步：拼出完整函数并测试
              body: |
                ```ocaml
                let rec my_filter p = function
                  | [] -> []
                  | x :: xs -> if p x then x :: my_filter p xs else my_filter p xs

                let kept = my_filter (fun x -> x >= 60) [55; 60; 75]
                let () = List.iter (Printf.printf "%d ") kept; print_newline ()
                ```
      - item:
          id: filter-count
          type: number
          prompt: |
            对列表 `[12; 7; 20; 3; 15]` 运行 `List.filter (fun x -> x >= 10)`，返回的新列表有几个元素？
          answer: 3
          hint: 逐个检查哪些数大于或等于 `10`。
          explain: |
            满足 `x >= 10` 的有 `12`、`20`、`15`，共 `3` 个元素。
      - item:
          id: map-filter-sum
          type: number
          prompt: |
            对成绩单 `[55; 60; 75]`：先用 `List.filter (fun x -> x >= 60)` 筛出及格分数，再用 `List.map (fun x -> x + 5)` 加分，最后把得到的新列表所有元素相加，总和是多少？
          answer: 145
          explain: |
            先筛出 `[60; 75]`，再加 5 分变成 `[65; 80]`，总和是 `65 + 80 = 145`。
      - item:
          id: map-vs-filter-diff
          type: match
          prompt: |
            把高阶操作写法和它对 `[1; -2; 3]` 算出的结果连起来。
          pairs:
            - ["List.map (fun x -> x * 2) [1; -2; 3]", "[2; -4; 6]"]
            - ["List.filter (fun x -> x > 0) [1; -2; 3]", "[1; 3]"]
            - ["List.map (fun x -> x > 0) [1; -2; 3]", "[true; false; true]"]
            - ["List.filter (fun x -> x > 5) [1; -2; 3]", "[]"]
          explain: |
            `map` 逐个转换且长度永远不变（甚至可以把整数转成布尔）；`filter` 只保留满足条件的元素，可能变短甚至变成 `[]`。

  - id: fold-tail
    chapter: 高阶函数
    title: Fold 折叠与尾递归
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            `map` 把列表变成同长度的新列表，`filter` 把列表变短。那如果要把整个列表“收口”成一个数（比如总和、最大值，或按顺序做减法），猜猜需要什么额外东西？
          options:
            - text: 一个起步的初始累积值，加上一个“把当前累积值和下一元素合并”的函数
              correct: true
            - text: 只能先把列表转成数组再用 for 循环，纯函数做不到
              why: 递归带一个累积参数就能一步步把列表汇总成一个值
            - text: 只要传一个比较大小的函数就够了，不需要起步值
              why: 如果列表是空的，没有起步值就不知道该返回什么
          explain: |
            这个“拿起步值滚雪球扫过整个列表”的模式叫做**折叠（fold）**。而且当减法不满足交换律时，从左往右滚还是从右往左滚，结果会完全不同。
      - card:
          title: 左折叠 fold_left 与右折叠 fold_right
          body: |
            **折叠（fold）**用一个起始累积值 `acc` 和合并函数 `f`，把列表的元素逐个折进结果里。

            最常用的是从左往右扫的 `fold_left`：每看一个元素 `x`，就算出新的累积值 `f acc x`，再带着新 `acc` 继续往后扫。
          reveal:
            - title: 第 1 步：写出空列表和递归一步的规则
              body: |
                `let rec foldl f acc = function [] -> acc | x :: xs -> foldl f (f acc x) xs`。遇到空列表时，累积值 `acc` 就是最终答案。
            - title: 第 2 步：追踪 foldl ( - ) 10 [2; 3]
              body: |
                起步 `acc = 10` → 读到 `2` 算 `10 - 2 = 8` → 读到 `3` 算 `8 - 3 = 5` → 到 `[]` 返回 `5`。
            - title: 第 3 步：把运算符当函数传给 fold（例如 ( - )）
              body: |
                给 `+ - *` 加上空格和圆括号，如 `( - )`、`( + )`，就能把普通运算符当成二元函数传进 `foldl`：

                ```ocaml
                let rec foldl f acc = function
                  | [] -> acc
                  | x :: xs -> foldl f (f acc x) xs

                let left_res = foldl ( - ) 10 [2; 3]
                let right_res = List.fold_right ( - ) [2; 3] 10
                let () = Printf.printf "%d %d\n" left_res right_res
                ```
      - item:
          id: foldl-trace-num
          type: number
          prompt: |
            定义 `let rec foldl f acc = function [] -> acc | x :: xs -> foldl f (f acc x) xs`，对起步值 `1` 运行 `foldl ( * ) 1 [2; 3; 4]`，结果是多少？
          answer: 24
          hint: 依次计算 `((1 * 2) * 3) * 4`。
          explain: |
            `1 * 2 = 2` → `2 * 3 = 6` → `6 * 4 = 24`。
      - item:
          id: fold-right-num
          type: number
          prompt: |
            OCaml 的 `List.fold_right ( - ) [2; 3] 10` 从右向左把列表折进初始值 `10`，相当于算 `2 - (3 - 10)`。结果是多少？
          answer: 9
          hint: 先算括号里的 `3 - 10 = -7`，再算 `2 - (-7)`。
          explain: |
            `3 - 10 = -7`，接着 `2 - (-7) = 9`，和左折叠 `((10 - 2) - 3) = 5` 完全不同。
      - card:
          title: 为什么 foldl 不怕长列表：尾递归与栈帧复用
          body: |
            之前写的 `sum` 是 `x + sum xs`：在 `sum xs` 算完回来之前，调用栈必须为每一层留一张**栈帧（stack frame）**记住“等会儿还要加上 `x`”。列表有一百万个元素就会叠一百万层，触发**栈溢出（stack overflow）**。

            而 `foldl` 把 `f acc x` 当场算成新 `acc` 再递归，递归调用是最后一步——这叫**尾递归（tail recursion）**。编译器能原地复用同一张栈帧，一百万个元素也只占一层空间。

            ```ocaml
            let rec foldl f acc = function
              | [] -> acc
              | x :: xs -> foldl f (f acc x) xs

            let sum_tail xs = foldl ( + ) 0 xs
            let () = Printf.printf "%d\n" (sum_tail [10; 20; 30])
            ```
      - item:
          id: tail-rec-spot
          type: choice
          prompt: |
            下面哪一个递归函数是**尾递归**（递归调用后没有剩余计算）？
          options:
            - text: |
                `let rec count acc = function [] -> acc | _ :: xs -> count (acc + 1) xs`
              correct: true
            - text: |
                `let rec len = function [] -> 0 | _ :: xs -> 1 + len xs`
              why: len xs 返回后还要算 1 + ...，调用栈必须保留每层等待的 + 1
            - text: |
                `let rec fact n = if n <= 1 then 1 else n * fact (n - 1)`
              why: fact (n - 1) 返回后还要再乘上 n，不是最后一步
          explain: |
            `count (acc + 1) xs` 在递归调用前就把 `acc + 1` 算好了，递归返回的值直接就是最终返回值，无需再做任何运算，因此是尾递归。
      - item:
          id: fold-express-other
          type: choice
          prompt: |
            只用 `List.fold_left` 能不能算出列表的长度？
          options:
            - text: "可以：`List.fold_left (fun acc _ -> acc + 1) 0 xs`（`_` 表示忽略用不到的当前元素）"
              correct: true
            - text: 不行，fold_left 只能把元素本身相加或相乘
              why: 合并函数可以忽略元素内容（用 _ 占位），每遇到一个元素就让 acc + 1
            - text: 不行，因为结果类型必须和列表元素类型一模一样
              why: 累积值 acc 的类型完全可以和元素类型不同，例如把字符串列表折叠成整数长度
          explain: |
            折叠非常通用：求和、求积、计数、求最大值甚至反转列表，都可以用 `fold_left` 一次扫过完成。

  - id: beyond-pipeline
    chapter: 高阶函数
    title: 管道、超越列表与代数定律
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            如果想对一个列表先把每个数加 1，再全部乘以 2，下面两种做法你觉得算出来一不一样：
            做法 A 扫两遍列表；做法 B 只扫一遍，对每个数直接算 `(x + 1) * 2`？
          options:
            - text: 对纯函数来说结果完全一样，只扫一遍还省掉了一轮中间列表
              correct: true
            - text: 不一样，扫两遍必须改变中间数值的精度
              why: 整数加 1 再乘 2，跟分两步算的结果完全相等
            - text: 做法 B 会出错，因为 OCaml 禁止把两个函数合成一个
              why: 函数复合正是函数式编程里最常见的优化规律之一
          explain: |
            因为高阶函数没有副作用，它们满足漂亮的“代数定律”——你可以像化简数学式子一样合并步骤。同时这一课也会把管道 `|>` 和“超越列表”的高阶函数串起来。
      - card:
          title: 管道运算符 |> 把流程从上往下写顺
          body: |
            连续套三层调用 `List.fold_left (+) 0 (List.map f (List.filter p xs))` 得从里往外读，很拗口。OCaml 的管道运算符 `x |> f` 就是 `f x`：把左边算出的结果送进右边函数当最后一个参数。

            配合柯里化，每一步刚好只差最后一个列表参数，就能从上到下连成一条清晰的流水线：

            ```ocaml
            let total =
              [55; 60; 75]
              |> List.filter (fun x -> x >= 60)
              |> List.map (fun x -> x + 5)
              |> List.fold_left ( + ) 0
            let () = Printf.printf "%d\n" total
            ```
      - item:
          id: pipeline-value
          type: number
          prompt: |
            算一算下面这条 OCaml 管道最后得到的整数是多少？（`x mod 2` 和 Python 的 `x % 2` 一样，计算余数）
          code: |
            let ans =
              [1; 2; 3; 4]
              |> List.filter (fun x -> x mod 2 = 0)
              |> List.map (fun x -> x * 10)
              |> List.fold_left ( + ) 0
          lang: ocaml
          answer: 60
          hint: 先留偶数 `[2; 4]`，再各自乘 `10`，最后全部相加。
          explain: |
            `filter` 留下 `[2; 4]`，`map` 变成 `[20; 40]`，`fold_left (+) 0` 相加得 `60`。
      - card:
          title: 超越列表与代数定律
          body: |
            `map` 不只是列表专利，任何“装了值的结构”（比如二元组、树或可能为空的盒子）都能写自己的 `map` 和 `fold`，而且同样满足规律：
          reveal:
            - title: 第 1 步：把 map 推广到自定义结构
              body: |
                比如写 `let pair_map f (a, b) = (f a, f b)` 就能把 `(3, 4)` 映射成 `(6, 8)`。只要数据结构能被拆开再重新包好，就能定义它的 `map` 和 `fold`。
            - title: 第 2 步：两条 map 代数定律
              body: |
                1. 恒等律：`List.map (fun x -> x) xs = xs`（什么都不改地映射，列表不变）。
                2. 复合律（融合）：`List.map f (List.map g xs) = List.map (fun x -> f (g x)) xs`。
            - title: 第 3 步：用复合律把两次遍历合并成一次
              body: |
                ```ocaml
                let slow = [1; 2; 3] |> List.map (fun x -> x + 1) |> List.map (fun x -> x * 2)
                let fast = [1; 2; 3] |> List.map (fun x -> (x + 1) * 2)
                let () = Printf.printf "%b\n" (slow = fast)
                ```
      - item:
          id: fusion-match
          type: choice
          prompt: |
            根据 map 的复合代数定律，`[1; 2; 3] |> List.map (fun x -> x * 3) |> List.map (fun x -> x - 1)` 合并成单次 `List.map` 后，里面的匿名函数该怎么写？
          options:
            - text: fun x -> (x * 3) - 1
              correct: true
            - text: fun x -> (x - 1) * 3
              why: 管道里先执行 * 3 再执行 - 1，合并后顺序不能颠倒
            - text: fun x -> x * 3 - 1 + 1
              why: 多出来的 + 1 会改变结果
          explain: |
            管道先做 `g(x) = x * 3`，再做 `f(y) = y - 1`，合成后的函数是 `f(g(x)) = (x * 3) - 1`。
      - item:
          id: pipe-desugar
          type: choice
          prompt: |
            表达式 `5 |> (fun x -> x + 2) |> (fun y -> y * 3)` 等价于哪一种常规写法？
          options:
            - text: (fun y -> y * 3) ((fun x -> x + 2) 5)
              correct: true
            - text: (fun x -> x + 2) ((fun y -> y * 3) 5)
              why: 管道是从左到右依次把值塞进下一个函数，不是从右到左
            - text: 5 + 2 * 3
              why: 5 先加 2 得 7，再乘 3 得 21，而 5 + 2 * 3 按优先级只得 11
          explain: |
            `|>` 是左结合的：`5` 先喂给 `x + 2` 算出 `7`，再把 `7` 喂给 `y * 3` 算出 `21`。
      - item:
          id: fusion-reason
          type: choice
          prompt: |
            为什么在有副作用的命令式代码里，不能随便把“两次遍历”合并成“一次遍历”？
          options:
            - text: 如果第一轮里有打印或改写外部状态，合并后交叉执行顺序会变掉
              correct: true
            - text: 因为命令式语言没有圆括号，写不出合成函数
              why: 语法不是问题，真正阻碍等价替换的是副作用依赖执行顺序
            - text: 因为命令式数组不能连续修改两次
              why: 数组当然能改两次，问题在于副作用交错会改变外部可观察到的顺序
          explain: |
            纯函数没有副作用，所以 `map f (map g xs)` 和 `map (fun x -> f (g x)) xs` 永远等价——这也是不可变数据带来的最大好处之一。

  # ==== 模式匹配 ====
  - id: variants-options
    chapter: 模式匹配
    title: 变体、模式匹配与 Option
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            在 Python 里查找字典找不到键时，有人返回 `None`，有人返回 `-1`，结果调用方忘了判断就拿去算术，运行到一半崩溃。OCaml 想在运行前就逼着你处理“可能没有值”的情况，猜猜它会怎么设计？
          options:
            - text: 用一个专门的类型区分“有值 Some x”和“无值 None”，拆开时不写 None 分支就过不了编译检查
              correct: true
            - text: 规定所有函数找不到时统一返回 0 或空字符串
              why: 0 可能是合法的查找结果，混用 0 会分不清“真找到 0”还是“没找到”
            - text: 运行到出错那一行时自动弹出询问框让用户手输一个值
              why: 程序必须在编译前由类型和分支规则把边界定清楚
          explain: |
            在 OCaml 里，用“只可能取这几种情况之一”的**变体**搭配**模式匹配**，就能让编译器帮你把漏掉的分支全找出来。
      - card:
          title: 变体：列出所有可能情况，还能各自带数据
          body: |
            **变体（variant）**用 `|` 列出一个类型的全部合法形态，每个形态的名字（首字母必须大写）叫构造子，后面还能用 `of` 附上专属数据。

            接着用 `match ... with` 做**模式匹配（pattern matching）**：按数据的形状拆出里面的值并走对应分支。

            ```ocaml
            type shape =
              | Circle of float
              | Rect of float * float

            let area s =
              match s with
              | Circle r -> 3.14 *. r *. r
              | Rect (w, h) -> w *. h

            let () = Printf.printf "%.1f\n" (area (Rect (3.0, 4.0)))
            ```
      - item:
          id: variant-area
          type: number
          prompt: |
            给定 `type shape = Circle of float | Rect of float * float` 与 `area`（圆算 `3.14 *. r *. r`，矩形算 `w *. h`），`area (Rect (5.0, 2.0))` 返回多少？
          answer: 10
          explain: |
            `Rect (5.0, 2.0)` 匹配第二个分支 `Rect (w, h)`，算出 `5.0 *. 2.0 = 10.0`。
      - card:
          title: Option 类型与穷尽性检查
          body: |
            OCaml 没有处处都能塞进去的 `null`，而是自带变体 `'a option`（带单引号的 `'a` 表示任意类型，所以它能包任何类型的值）：要么是 `Some v`，要么是 `None`。

            你无法直接对 `int option` 做加法，必须先用 `match` 把 `Some` 和 `None` 都处理掉；不想逐个列举剩余分支时，也能用 `_ -> ...` 兜底。要是漏掉情况，编译器立刻提示。
          reveal:
            - title: 第 1 步：写出安全除法 safe_div
              body: |
                除数为 `0` 时返回 `None`，否则把商包在 `Some` 里返回：`if b = 0 then None else Some (a / b)`。
            - title: 第 2 步：用 match 拆开 Some 和 None
              body: |
                ```ocaml
                let safe_div a b =
                  if b = 0 then None else Some (a / b)

                let show_div a b =
                  match safe_div a b with
                  | Some q -> string_of_int q
                  | None -> "cannot divide by zero"

                let () = Printf.printf "%s | %s\n" (show_div 10 2) (show_div 10 0)
                ```
      - item:
          id: option-add-mistake
          type: choice
          prompt: |
            已知 `let safe_div a b = if b = 0 then None else Some (a / b)`。为什么直接写 `safe_div 10 2 + 1` 在 OCaml 里过不了类型检查？
          options:
            - text: safe_div 返回的是 int option，不能直接当成 int 参加加法
              correct: true
            - text: 因为 safe_div 里面有 if，不能放在加法左边
              why: 只要整个表达式类型是 int，带 if 也可以参加加法
            - text: 因为 10 除以 2 会变成浮点数 float
              why: OCaml 里整数用 / 做整除，结果还是 int，问题在于外面套了 option
          explain: |
            `int option` 和 `int` 是两种完全不同的类型，必须先用 `match` 拆开 `Some` 和 `None` 才能拿到里面的 `int`。
      - item:
          id: exhaustiveness-check
          type: choice
          prompt: |
            假设 `type light = Red | Yellow | Green`，下面哪个 `match` 会因为“不够穷尽（漏掉分支）”被编译器提醒？
          options:
            - text: |
                `match x with Red -> "stop" | Green -> "go"`
              correct: true
            - text: |
                `match x with Red -> "stop" | Yellow -> "wait" | Green -> "go"`
              why: 三个构造子都写全了，没有遗漏
            - text: |
                `match x with Red -> "stop" | _ -> "other"`
              why: 通配符 _ 会接住剩下的所有情况（Yellow 和 Green），所以也是穷尽的
          explain: |
            `light` 有 3 种可能，第一项只写了 `Red` 和 `Green`，遇到 `Yellow` 时无处可走，编译器会在编译时发现这个漏洞。
      - item:
          id: option-default-calc
          type: number
          prompt: |
            如果定义 `safe_div a b = if b = 0 then None else Some (a / b)`，以及 `unwrap_or d opt = match opt with Some x -> x | None -> d`，那么 `unwrap_or 100 (safe_div 20 0) + unwrap_or 100 (safe_div 20 4)` 的值是多少？
          answer: 105
          hint: 先分别看 `safe_div 20 0` 是 `None`，`safe_div 20 4` 是 `Some 5`。
          explain: |
            `unwrap_or 100 None` 得 `100`，`unwrap_or 100 (Some 5)` 得 `5`，相加得 `105`。

  - id: records-matching
    chapter: 模式匹配
    title: 元组、记录与进阶模式匹配
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            如果一个学生的信息有姓名、年龄、成绩三项，用普通元组 `("Lin", 19, 92)` 也能装，为什么规模大了以后大家更喜欢带字段名的“记录”？
          options:
            - text: 元组只能靠位置记哪个是年龄哪个是成绩，记录有字段名不容易搞混
              correct: true
            - text: 因为元组最多只能装两个元素
              why: 元组可以装两个、三个甚至更多元素
            - text: 因为记录里的所有字段默认都可以随意原地修改
              why: OCaml 记录的所有字段默认也是不可变的，除非显式标上 mutable
          explain: |
            元组适合临时绑在一起的几个小值，记录适合长期使用的具名字段。它们都能用模式匹配一次拆开，还支持不可变更新和守卫条件。
      - card:
          title: 元组与记录的解构、功能性更新
          body: |
            OCaml 的记录用 `{ name = "Lin"; score = 88 }` 创建，默认不可变。如果要改其中一项，用 `{ s with score = 95 }`：旧记录 `s` 原封不动，只生成一条改了 `score` 的新记录。

            赋值或函数参数里还能直接写模式把元组或记录解开，比如 `let (x, y) = (10, 20)` 拆开元组，或者在函数参数 `let show { name; score } = ...` 里一次取出同名字段 `name` 和 `score`。

            ```ocaml
            type student = { name : string; score : int }
            let s1 = { name = "Lin"; score = 88 }
            let s2 = { s1 with score = 95 }
            let () = Printf.printf "%s:%d %s:%d\n" s1.name s1.score s2.name s2.score
            ```
      - item:
          id: record-with-check
          type: number
          prompt: |
            执行下面这段记录更新代码后，`s1.score + s2.score` 的结果是多少？
          code: |
            type student = { name : string; score : int }
            let s1 = { name = "Lin"; score = 88 }
            let s2 = { s1 with score = 95 }
          lang: ocaml
          answer: 183
          explain: |
            `{ s1 with score = 95 }` 不会改掉 `s1`，所以 `s1.score` 还是 `88`，`s2.score` 是 `95`，和为 `88 + 95 = 183`。
      - card:
          title: 进阶模式匹配：嵌套、when 守卫与 as
          body: |
            `match` 的模式可以层层嵌套，也能在 `->` 前加上 `when` 条件（叫做守卫），或者用 `as` 给整块匹配到的值顺便起个名字。
          reveal:
            - title: 第 1 步：嵌套模式一次拆两层
              body: |
                `match opt_pair with Some (0, y) -> y | Some (x, y) -> x + y | None -> 0`，既拆开了 `Some`，又同时把里面的二元组拆开了。
            - title: 第 2 步：用 when 加上数值条件
              body: |
                `| { score; _ } when score >= 90 -> "A"`。注意带 `when` 的分支在编译器眼里可能不成立，后面仍要补上无守卫的兜底分支；也可以写 `| (x :: _) as whole -> ...` 用 `whole` 保留整条列表。
            - title: 第 3 步：跑一个分级例子
              body: |
                ```ocaml
                let grade = function
                  | Some s when s >= 90 -> "A"
                  | Some s when s >= 60 -> "Pass"
                  | Some _ -> "Fail"
                  | None -> "Missing"

                let () = Printf.printf "%s %s\n" (grade (Some 75)) (grade None)
                ```
      - item:
          id: match-order-trap
          type: choice
          prompt: |
            在写 `grade` 分级函数时，如果在最前面不小心加了一行 `| Some _ -> "Other"`，后面接着写 `| Some s when s >= 90 -> "A"`，会发生什么？
          options:
            - text: 所有 Some 都会被第一行抢先接住，后面的 Some s when ... 变成永远走不到的死分支
              correct: true
            - text: 编译器会自动挑条件最具体的那一条执行，所以顺序无所谓
              why: match 永远从上到下按顺序试第一个匹配的分支
            - text: 会直接报语法错误，不允许同时使用 _ 和 when
              why: 语法上允许，但编译器会提示后面的分支不可达（unused match case）
          explain: |
            模式匹配永远**从上到下**试第一个能对上的模式。把太宽泛的 `Some _` 放最前面会挡住后面所有具体分支。
      - item:
          id: nested-pattern-eval
          type: number
          prompt: |
            函数 `let f = function Some (0, y) -> y * 10 | Some (x, y) -> x + y | None -> -1`，那么 `f (Some (0, 4)) + f (Some (3, 4))` 等于多少？
          answer: 47
          hint: 分别算 `f (Some (0, 4))` 命中哪一条分支，`f (Some (3, 4))` 命中哪一条分支。
          explain: |
            `Some (0, 4)` 命中第一条得 `4 * 10 = 40`；`Some (3, 4)` 命中第二条得 `3 + 4 = 7`；合计 `47`。
      - item:
          id: tuple-vs-record-match
          type: match
          prompt: |
            把下面四种情况和最合适的写法配对。
          pairs:
            - ["函数临时同时返回商和余数两个整数", "二元组 (q, r)"]
            - ["表示有 5 个明确属性的用户档案", "记录 { name; age; ... }"]
            - ["不改旧数据，只更新用户档案的邮箱", "{ user with email = ... }"]
            - ["检查匹配分支还需满足数值范围", "pattern when cond -> ..."]
          explain: |
            小而临时的多值组合用元组，带名字的多字段用记录，不可变修改用 `with`，额外条件用 `when`。

  - id: adt-trees
    chapter: 模式匹配
    title: 代数数据类型与二叉树
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            如果让你用一种自定义类型来表示“一棵二叉树（要么是空叶子，要么是一个节点带着左子树、值和右子树）”，或者表示“自然数（0，或者某个自然数的后继）”，最自然靠什么做到？
          options:
            - text: 让变体类型的分支反过来引用这个类型自己（递归定义）
              correct: true
            - text: 提前用固定序列把最大可能出现的 1000 层节点全开出来
              why: 固定长度序列既浪费空间又限制深度，无法自由表达任意深度的树
            - text: 把整棵树拼成一长串逗号隔开的字符串
              why: 字符串丢掉了树的结构和类型安全，每次处理都要重新解析
          explain: |
            把“多种情况（和类型）”与“多个字段打包（积类型）”组合起来，并且允许类型引用自己，就得到了**代数数据类型（algebraic data type）**。
      - card:
          title: 用递归变体表示自然数
          body: |
            **代数数据类型（algebraic data type）**既能列举分支（像 `+`），又能把多个值捆成一组（像 `×`），还允许引用自身。

            比如自然数就是“要么是 `Zero`，要么是某个自然数的下一个 `Succ n`”：

            ```ocaml
            type nat = Zero | Succ of nat

            let rec int_of_nat = function
              | Zero -> 0
              | Succ n -> 1 + int_of_nat n

            let two = Succ (Succ Zero)
            let () = Printf.printf "%d\n" (int_of_nat two)
            ```
      - item:
          id: nat-add-val
          type: number
          prompt: |
            给定 `type nat = Zero | Succ of nat` 与加法 `let rec add a b = match a with Zero -> b | Succ n -> Succ (add n b)`，计算 `add (Succ (Succ Zero)) (Succ Zero)` 对应的整数是多少？
          answer: 3
          explain: |
            `Succ (Succ Zero)` 是 `2`，`Succ Zero` 是 `1`，按结构把外层的 `Succ` 挪过去一共包了 3 层 `Succ`，结果是 `3`。
      - card:
          title: 例题：用代数数据类型写二叉树的深度与翻转
          body: |
            二叉树只有两种形状：空叶子 `Leaf`，或者带左子树、本节点值和右子树的 `Node (l, v, r)`。只要对两种形状分别写出规则，函数就会沿着树走到底。
          reveal:
            - title: 第 1 步：定义任意元素类型的二叉树
              body: |
                `type 'a tree = Leaf | Node of 'a tree * 'a * 'a tree`。这里的 `'a` 表示节点里放整数、字符串都可以。
            - title: 第 2 步：写深度 depth（空树 0，节点 1 + 左右最大深度）
              body: |
                `| Leaf -> 0 | Node (l, _, r) -> 1 + max (depth l) (depth r)`。注意叶子本身深度记为 `0`。
            - title: 第 3 步：写左右翻转 mirror 并运行测试
              body: |
                ```ocaml
                type 'a tree = Leaf | Node of 'a tree * 'a * 'a tree

                let rec depth = function
                  | Leaf -> 0
                  | Node (l, _, r) -> 1 + max (depth l) (depth r)

                let rec mirror = function
                  | Leaf -> Leaf
                  | Node (l, v, r) -> Node (mirror r, v, mirror l)

                let sample = Node (Node (Leaf, 1, Leaf), 2, Node (Leaf, 3, Node (Leaf, 4, Leaf)))
                let () = Printf.printf "%d %d\n" (depth sample) (depth (mirror sample))
                ```
      - item:
          id: tree-depth-calc
          type: number
          prompt: |
            给定 `depth Leaf = 0` 与 `depth (Node (l, _, r)) = 1 + max (depth l) (depth r)`，下面这棵 `sample` 树的 `depth sample` 是多少？
          code: |
            let sample = Node (Node (Leaf, 1, Leaf), 2, Node (Leaf, 3, Node (Leaf, 4, Leaf)))
          lang: ocaml
          answer: 3
          hint: 最长一条路是从根 `2` 走到 `3` 再走到 `4`，一共经过几个 `Node`？
          explain: |
            左子树深度为 `1`（只有节点 `1`），右子树深度为 `2`（`3` 下面还有 `4`），`1 + max 1 2 = 3`。
      - item:
          id: mirror-check
          type: choice
          prompt: |
            若 `mirror Leaf = Leaf`，`mirror (Node (l, v, r)) = Node (mirror r, v, mirror l)`，对 `t = Node (Node (Leaf, 1, Leaf), 2, Leaf)` 调用 `mirror t`，得到的树是什么？
          options:
            - text: Node (Leaf, 2, Node (Leaf, 1, Leaf))
              correct: true
            - text: Node (Node (Leaf, 2, Leaf), 1, Leaf)
              why: mirror 不会交换父节点 2 和子节点 1 的上下层级，只交换左右子树
            - text: 原来的节点 1 会直接被删掉
              why: mirror 只是把每个 Node 的左右子树互换，不会丢失节点
          explain: |
            原来的左子树 `Node (Leaf, 1, Leaf)` 和右子树 `Leaf` 互换位置，根节点 `2` 保持在顶部。
      - item:
          id: adt-exhaustiveness
          type: choice
          prompt: |
            写树上的函数 `sum_tree` 时，如果不小心漏写了 `| Leaf -> 0` 这条分支，只写了 `Node (l, v, r)`，OCaml 会怎么样？
          options:
            - text: 在运行前就给出“模式匹配不穷尽，漏了 Leaf”的警告或报错
              correct: true
            - text: 遇到 Leaf 时自动把它当成 0 返回
              why: OCaml 不会猜测你想在 Leaf 返回什么，必须由你写明
            - text: 只把所有 Node 连成列表，不会检查分支是否齐全
              why: 模式匹配的核心保障之一就是编译期穷尽性检查
          explain: |
            变体加上穷尽性检查能保证每一种合法形态（包括 `Leaf` 和 `None`）都在代码里被明确处理。

  # ==== 规则与查询式表达 ====
  - id: prolog-basics
    chapter: 规则与查询式表达
    title: 事实、规则与 Horn 子句
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            如果只写下“谁是谁的父母”的事实，再写一条“如果 X 是 Y 的父母，且 Y 是 Z 的父母，那么 X 是 Z 的祖父母”的规则，不用写循环，电脑能自己回答“谁是 ann 的祖父母”吗？
          options:
            - text: 可以，系统会自动翻找事实并套用规则来拼出答案
              correct: true
            - text: 不能，计算机必须看到 for 循环才知道怎么一张张表去搜
              why: 在逻辑式语言里，搜索过程由语言引擎自带，程序员只负责给事实和规则
            - text: 只能回答“是不是”，绝对找不出具体名字 Who
              why: 查询里的未知变量会让引擎直接把匹配到的名字找出来
          explain: |
            只写“什么关系成立”，不手写搜索循环——这就是**声明式编程（declarative programming）**。这一课用 Prolog 认识事实、规则、查询和 Horn 子句。
      - card:
          title: 事实、规则与查询
          body: |
            只描述目标需要满足什么条件、由系统决定怎么算出结果，叫**声明式编程（declarative programming）**。

            在 Prolog 里，像 `parent(tom, bob)` 这样表示关系的条目叫**谓词（predicate）**，它带 2 个参数常记作 `parent/2`。小写开头是具体名字，大写开头是未知变量（如 `X`）。句尾必须有 `.`，`:-` 读作“如果”，逗号 `,` 读作“并且”：

            ```prolog
            parent(tom, bob).
            parent(bob, ann).
            parent(bob, pat).

            grandparent(X, Z) :- parent(X, Y), parent(Y, Z).
            ```
      - item:
          id: prolog-query-gp
          type: choice
          prompt: |
            已知事实 `parent(tom, bob).` `parent(bob, ann).` `parent(bob, pat).` 与规则 `grandparent(X, Z) :- parent(X, Y), parent(Y, Z).`。提问 `?- grandparent(tom, Who).`，能找到哪些 `Who`？
          options:
            - text: ann 和 pat
              correct: true
            - text: 只有 ann
              why: parent(bob, pat) 也是事实，回溯后会接着找出 pat
            - text: bob、ann 和 pat
              why: bob 是 tom 的孩子，不是隔代的孙辈
          explain: |
            先匹配 `parent(tom, Y)` 得 `Y = bob`，再找 `parent(bob, Who)`，依次得到 `ann` 和 `pat`。
      - card:
          title: 什么是 Horn 子句？
          body: |
            Prolog 的每一条事实、规则和查询，本质上都是逻辑里的**Horn 子句（Horn clause）**：最多只有一个结论（头部），其余都是需要同时满足的前提条件（体部）。

            - **事实（fact）**：只有头部、没有前提，如 `parent(tom, bob).`。
            - **规则（rule）**：有头部也有体部，如 `grandparent(X, Z) :- parent(X, Y), parent(Y, Z).`。
            - **目标 / 查询（goal / query）**：只有要证明的子目标、没有头部，如 `?- grandparent(X, ann).`。
          reveal:
            - title: 第 1 步：为什么叫“最多一个结论”？
              body: |
                一般逻辑里允许写“A 或者 B 至少一个成立”，搜索起来分支爆炸。限定“右边有几个条件同时成立时，左边那一个结论成立”（最多一个结论），引擎就能顺着子目标一条条往下证明。
            - title: 第 2 步：把一条大目标拆成子目标
              body: |
                问 `?- grandparent(tom, Who).` 就是把“找祖孙”拆成两个子目标：`parent(tom, Y)` 和 `parent(Y, Who)`，两个都找到具体名字才算成功。
      - item:
          id: horn-match
          type: match
          prompt: |
            把 Horn 子句的四种常见写法和角色连起来。
          pairs:
            - ["事实（无条件成立）", "parent(tom, bob)."]
            - ["规则（头部 :- 子目标1, 子目标2）", "grandparent(X, Z) :- parent(X, Y), parent(Y, Z)."]
            - ["查询 / 目标（提出要验证的结论）", "?- grandparent(X, ann)."]
            - ["小写名字 vs 大写变量", "tom 是常量，Who 是变量"]
          explain: |
            Prolog 靠大小写区分常量和变量，靠有头/无头/有体区分事实、规则和查询，背后统一都是 Horn 子句。
      - item:
          id: prolog-comma-meaning
          type: choice
          prompt: |
            在 Prolog 规则 `eligible(X) :- age_ok(X), pass_exam(X).` 里，中间的逗号 `,` 代表什么？
          options:
            - text: 逻辑“并且”：age_ok(X) 和 pass_exam(X) 必须同时成立
              correct: true
            - text: 逻辑“或者”：满足其中一个就能得出 eligible(X)
              why: “或者”在 Prolog 里通常用分号 ; 或写成两条独立规则，逗号是“并且”
            - text: 把两条无关的事实写在同一行省地方
              why: 规则体里的子目标共用变量 X，必须同时满足同一个 X
          explain: |
            规则体里的 `,` 表示合取（AND），所有子目标都要为真（且共享同名变量）。
      - item:
          id: prolog-var-case
          type: choice
          prompt: |
            如果有人不小心把查询写成 `?- parent(tom, who).`（`who` 用了小写），Prolog 会怎么理解？
          options:
            - text: 把 who 当成字面名字“who”，问“tom 是不是一个叫 who 的人的父母”
              correct: true
            - text: 把 who 当成变量，列出 tom 的所有孩子
              why: Prolog 只有大写字母或下划线开头的名字才算变量，小写是固定常量
            - text: 自动把 who 转成大写 Who
              why: Prolog 严格区分大小写，不会自动替换
          explain: |
            在 Prolog 里，常量小写开头（如 `tom`），变量大写或 `_` 开头（如 `Who`、`_`）。写成小写 `who` 就只会匹配字面常量 `who`。

  - id: unification-search
    chapter: 规则与查询式表达
    title: 合一、回溯与搜索顺序
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            在普通函数里传参是“单向”的：把右边的具体值塞给左边的参数名。如果两边各自都有未知变量，比如把 `pair(X, 2)` 和 `pair(1, Y)` 对齐，猜猜 Prolog 会怎么做？
          options:
            - text: 双向同时绑定：让 X 等于 1、Y 等于 2，使两边变成一模一样的 pair(1, 2)
              correct: true
            - text: 只能从左往右赋值，所以 Y 无法得到值而报错
              why: Prolog 的对齐是双向的，不管变量在左边还是右边都能一起填上
            - text: 直接判为不相等，因为左边有 X 而右边有 Y
              why: 未绑定变量就像空白占位符，能和另一边的对应位置对齐
          explain: |
            这种双向把两项对齐并填上变量的过程，叫**合一（unification）**；一条路走完或走不通再退回去改试另一条规则，叫**回溯（backtracking）**。
      - card:
          title: 双向对齐的合一
          body: |
            **合一（unification）**会递归比对两个项的结构：
            - `pair(X, 2)` 和 `pair(1, Y)` 合一成功：`X = 1, Y = 2`。
            - `f(X, X)` 和 `f(1, 2)` 合一**失败**，因为同一个 `X` 不能同时等于 `1` 和 `2`。
            - `f(X, X)` 和 `f(1, 1)` 合一成功：`X = 1`。

            规则推进时，Prolog 就是用合一去配规则头部，并把子目标依次拆下去。
      - item:
          id: unify-check
          type: choice
          prompt: |
            下面哪一对项在 Prolog 里能**合一成功**？
          options:
            - text: "edge(A, b) 与 edge(a, B)"
              correct: true
            - text: "edge(A, A) 与 edge(a, b)"
              why: 同一个变量 A 不能既绑定成 a 又绑定成 b
            - text: "edge(a, b) 与 node(a, b)"
              why: 名字不同（edge 和 node），结构不匹配
            - text: "edge(a, b) 与 edge(a, b, c)"
              why: 参数个数不同（2 个 vs 3 个），无法合一
          explain: |
            `edge(A, b)` 和 `edge(a, B)` 名字、参数个数都相同，只要把 `A = a`、`B = b` 就完全一致。
      - card:
          title: 例题：追踪递归 ancestor/2 的合一与回溯
          body: |
            用两条规则定义祖先关系：`ancestor(X, Y)` 要么是直接父母 `parent(X, Y)`，要么“先找中间人 `Z`”。看看查询 `?- ancestor(X, ann).` 怎样找出所有解。
          reveal:
            - title: 第 1 步：先试第 1 条规则得到第一个解
              body: |
                匹配 `ancestor(X, ann) :- parent(X, ann).`，查事实库命中 `parent(bob, ann).`，立刻找到第一个解 `X = bob`。
            - title: 第 2 步：回溯改试第 2 条规则
              body: |
                要找下一个解，引擎做**回溯（backtracking）**退回选择点，改用第 2 条规则：`parent(X, Z), ancestor(Z, ann)`。尝试 `parent(tom, bob)` 得 `X = tom, Z = bob`，再查 `ancestor(bob, ann)` 成立，得到第二个解 `X = tom`。
            - title: 第 3 步：写成可运行的 Prolog 程序验证
              body: |
                `findall(X, 目标, Xs)` 把所有满足目标的 `X` 收进列表 `Xs`，`writeln` 打印结果，`halt` 退出，`initialization(main)` 让程序启动时自动跑 `main`：

                ```prolog
                parent(tom, bob).
                parent(bob, ann).
                parent(bob, pat).

                ancestor(X, Y) :- parent(X, Y).
                ancestor(X, Y) :- parent(X, Z), ancestor(Z, Y).

                main :-
                    findall(X, ancestor(X, ann), Xs),
                    writeln(Xs),
                    halt.
                :- initialization(main).
                ```
      - item:
          id: ancestor-order-check
          type: order
          prompt: |
            已知 `parent(tom, bob).` `parent(bob, ann).` 与两条规则：`ancestor(X, Y) :- parent(X, Y).` 和 `ancestor(X, Y) :- parent(X, Z), ancestor(Z, Y).`。按顺序排列 `?- ancestor(X, ann).` 找出两个解的过程。
          steps:
            - "先尝试第 1 条规则 parent(X, ann)"
            - "命中事实 parent(bob, ann)，输出第一个解 X = bob"
            - "回溯后尝试第 2 条规则 parent(X, Z), ancestor(Z, ann)"
            - "通过 parent(tom, bob) 与 ancestor(bob, ann)，输出第二个解 X = tom"
          explain: |
            Prolog 按文件里规则从上到下、子目标从左到右的顺序做深度优先搜索，找到一个解或走入死胡同时回溯再试下一条分支。
      - item:
          id: left-recursion-trap
          type: choice
          prompt: |
            如果有人把 `ancestor` 的第 2 条规则写反成 `ancestor(X, Y) :- ancestor(X, Z), parent(Z, Y).`（并且放在前面），查询 `?- ancestor(X, ann).` 会怎样？
          options:
            - text: 一直优先递归调用最左边的 ancestor(X, Z)，一直卡在无限递归里停不下来
              correct: true
            - text: Prolog 会自动重排子目标顺序，结果完全不受影响
              why: Prolog 严格按从左到右、从上到下的确定顺序搜索，不会自动改成尾递归或换序
            - text: 比原写法更快一倍
              why: 把递归目标放最左边（左递归）且不先缩小问题会反复套娃导致停不下来
          explain: |
            虽然逻辑上 `P ∧ Q` 和 `Q ∧ P` 等价，但 Prolog 引擎按“从上到下、从左到右”实际执行，规则和子目标的先后顺序会直接决定能不能停下来。
      - item:
          id: backtracking-reset
          type: choice
          prompt: |
            在 Prolog 搜索里，当“回溯”退回上一个选择点时，在失败分支里刚刚绑定给变量的值会怎样？
          options:
            - text: 自动撤销绑定，变量变回未绑定状态再去试下一条路
              correct: true
            - text: 永久保留在变量里，后面的规则直接拿来覆盖
              why: 如果不撤销，错误分支绑的脏值会污染后续正确分支
            - text: 立刻清空整个事实库
              why: 回溯只撤回变量的临时绑定，不会删掉程序里的事实
          explain: |
            回溯时必须把失败路径上做出的变量绑定还原，才能干净地探索另一条分支。

  - id: prolog-lists-db
    chapter: 规则与查询式表达
    title: Prolog 列表、动态事实库与边界
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            OCaml 用 `x :: xs` 把列表拆成头和尾，SQL 可以对表增删改行。那 Prolog 里怎么拆列表？如果要让程序在运行时往事实库里临时加一条新事实，会带来什么问题？
          options:
            - text: 用 [H|T] 拆头尾；运行期增删事实会引入依赖顺序的副作用
              correct: true
            - text: Prolog 完全不支持列表，也不允许改任何事实
              why: Prolog 既可以用 [H|T] 拆列表，也提供了 assertz/retract 修改动态事实库
            - text: 加了新事实后，以前算出的结果会自动跟着全部自动重算
              why: Prolog 不会像电子表格那样自动重算历史查询，修改前后查出的结果不同
          explain: |
            这一课看 Prolog 的列表匹配 `[H|T]`、运行期动态事实库（`assertz`/`retract`），以及逻辑式编程擅长什么、边界在哪里。
      - card:
          title: 用 [H|T] 拆列表写成员检查
          body: |
            Prolog 的列表也用方括号，如 `[a, b, c]`；用 `[H|T]` 把第一个元素绑给 `H`、剩下列表绑给 `T`。这里的 `_` 是匿名变量（表示不关心的值，和 OCaml 里的 `_` 占位用法类似）。

            括号里 `(条件 -> 真分支 ; 假分支)` 是“条件成立走前面，否则走后面”（单独在规则里写分号 `;` 才表示“或者”）：

            ```prolog
            member_of(X, [X|_]).
            member_of(X, [_|T]) :- member_of(X, T).

            main :-
                (member_of(b, [a, b, c]) -> writeln(yes) ; writeln(no)),
                (member_of(z, [a, b, c]) -> writeln(yes) ; writeln(no)),
                halt.
            :- initialization(main).
            ```
      - item:
          id: prolog-head-tail
          type: choice
          prompt: |
            把 `[H|T]` 和列表 `[10, 20, 30]` 合一后，`H` 和 `T` 分别是什么？
          options:
            - text: H = 10，T = [20, 30]
              correct: true
            - text: H = [10, 20]，T = 30
              why: "[H|T] 的左边永远是单个头元素，右边是剩余列表"
            - text: H = 10，T = 20
              why: T 代表整个剩下的列表 [20, 30]，不是第二个元素
          explain: |
            `[H|T]` 匹配非空列表时，`H` 是第一个元素 `10`，`T` 是剩余部分组成的列表 `[20, 30]`。
      - card:
          title: 动态事实库与逻辑式编程的边界
          body: |
            有些任务需要在运行中记录新状态（比如记住房间里已经拿走钥匙）。Prolog 用 `:- dynamic 谓词/参数个数` 声明可改的谓词，再用 `assertz` 尾部追加事实、`retract` 删掉事实：

            ```prolog
            :- dynamic available/1.
            available(room1).

            main :-
                assertz(available(room2)),
                retract(available(room1)),
                findall(R, available(R), Rs),
                writeln(Rs),
                halt.
            :- initialization(main).
            ```

            **边界**：一旦大量使用 `assertz`/`retract` 或剪枝 `!`（cut），结果就不再只由纯逻辑决定，而是强依赖执行先后。所以日常应尽量把事实库改写控制在小范围，大规模数据查询则交给专业数据库语言 SQL。
      - item:
          id: dynamic-db-result
          type: choice
          prompt: |
            在 Prolog 动态事实库中，初始只有一条事实 `available(room1).`，依次执行 `assertz(available(room2))` 和 `retract(available(room1))` 后，执行 `findall(R, available(R), Rs)` 得到的 `Rs` 是什么？
          options:
            - text: "[room2]"
              correct: true
            - text: "[room1, room2]"
              why: retract(available(room1)) 已经把 room1 这条事实删掉了
            - text: "[]"
              why: room2 通过 assertz 加进了事实库且没有被删掉
          explain: |
            起初有 `room1`；`assertz` 加上 `room2` 变成两项；`retract` 删掉 `room1`，所以只剩 `[room2]`。
      - item:
          id: prolog-strength-limit
          type: choice
          prompt: |
            下面哪类任务**最发挥不出**纯 Prolog 逻辑规则的优势？
          options:
            - text: 需要按毫秒精确控制硬件引脚电平和大量像素原地刷新
              correct: true
            - text: 家谱关系、课程先修链或排班约束的可行解搜索
              why: 关系推理和约束搜索正是 Prolog 最拿手的领域
            - text: 小型语法规则与带变量的表达式匹配推导
              why: 模式合一和回溯非常适合写结构匹配与规则推导
          explain: |
            关系查找、排班、先修推理这类组合搜索非常适合 Prolog；而低层硬件时序、大块像素数组原地修改还是用带明确流程的语言更合适。
      - item:
          id: closed-world-idea
          type: choice
          prompt: |
            在 Prolog 事实库里没有写 `parent(alice, bob).`，查询 `?- parent(alice, bob).` 会返回 false。这种假设（“库里推不出来的就当做不成立”）叫什么思路？
          options:
            - text: 封闭世界假设（没写进事实和规则里的就不算成立）
              correct: true
            - text: Prolog 遇到事实库里没有的名字会直接报错崩溃，不会返回 false
              why: 找不到匹配只会让该查询失败（false），不会崩溃
            - text: 电脑会自己上网去查 alice 是不是 bob 的父母
              why: 逻辑引擎只在当前已知事实与规则内部推理
          explain: |
            逻辑数据库遵循封闭世界假设：只要现有事实和规则推不出为真，查询结果就是失败。

  - id: declarative-sql
    chapter: 规则与查询式表达
    title: 声明式查询：用 SQL 描述结果
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            假如有一张选课成绩表 `Enroll(sid, course, grade)`，有的同学缺考导致 `grade` 是空值 `NULL`。用 SQL 的 `AVG(grade)` 算平均分时，猜猜这条 `NULL` 行会怎么处理？
          options:
            - text: 直接忽略 NULL 行，只把有真实分数的行加起来除以有分数的人数
              correct: true
            - text: 把 NULL 当成 0 分算进去，拉低平均分
              why: SQL 区分“考了 0 分”和“没有成绩（NULL）”，AVG 会跳过 NULL
            - text: 整张表只要有一行 NULL，整个查询就直接报错
              why: 聚合函数会跳过 NULL 正常算出平均分，除非整组全是 NULL（结果才是 NULL）
          explain: |
            SQL 是软件工程里用得最广泛的**声明式编程**语言：你只描述“表里按哪几列分组、筛哪些、怎么排”，由数据库的查询优化器决定怎么扫描和计算。
      - card:
          title: 用 SQL 描述你要的结果，不写循环步骤
          body: |
            用 Python 命令式查成绩，要自己建字典累加人数和总分、写循环再手动排序。

            声明式 SQL 则用 `SELECT` 指定要显示的列（可用 `AS` 起别名）、`FROM` 指定表，直接写出 `GROUP BY` 分组和 `HAVING` 筛组条件，由数据库内部的**查询优化器（query optimizer）**自动选扫描路径：

            ```sql
            SELECT course, AVG(grade) AS avg_grade
            FROM Enroll
            GROUP BY course
            HAVING AVG(grade) >= 80
            ORDER BY avg_grade DESC;
            ```
      - item:
          id: sql-where-vs-having
          type: choice
          prompt: |
            用 SQL 查表 `Enroll(sid, course, grade)` 时，想筛出平均分不低于 80 的课程，为什么必须写 `GROUP BY course HAVING AVG(grade) >= 80`，而不能写成 `WHERE AVG(grade) >= 80`？
          options:
            - text: WHERE 在分组之前筛单行，那时还没算出每门课的 AVG；HAVING 才在 GROUP BY 分组后筛分组结果
              correct: true
            - text: WHERE 只能比较字符串，不能比较数字
              why: WHERE 完全能写 grade >= 80 比较单行数字，只是不能用分组后的聚合值 AVG(grade)
            - text: HAVING 和 WHERE 功能一模一样，只是拼写习惯不同
              why: 两者的执行时机完全不同：WHERE 筛原始行，HAVING 筛分组后的汇总行
          explain: |
            记住这个逻辑先后：`FROM` 取表 → `WHERE` 筛行 → `GROUP BY` 分组 → `HAVING` 筛组 → `SELECT` 选列 → `ORDER BY` 排序。
      - card:
          title: 例题：手算 GROUP BY、HAVING 与 NULL 跳过
          body: |
            给定表 `Enroll` 里的 8 条记录，一步步算出 `SELECT course, AVG(grade) ... GROUP BY course HAVING AVG(grade) >= 80 ORDER BY avg_grade DESC` 会吐出哪几行。
          reveal:
            - title: 第 1 步：把记录按 course 分成 4 组
              body: |
                - `Databases`：70, 90, `NULL`
                - `Logic`：92, 88
                - `Systems`：78, 80
                - `NoGrades`：`NULL`
            - title: 第 2 步：对每组跳过 NULL 算 AVG(grade)
              body: |
                - `Databases`：`(70 + 90) / 2 = 80.0`（跳过 `NULL`，除以 2 而不是 3）。
                - `Logic`：`(92 + 88) / 2 = 90.0`
                - `Systems`：`(78 + 80) / 2 = 79.0`
                - `NoGrades`：全为 `NULL`，`AVG` 得 `NULL`
            - title: 第 3 步：执行 HAVING >= 80 并降序排列
              body: |
                留下 `Logic (90.0)` 和 `Databases (80.0)`；`Systems (79.0)` 和 `NoGrades (NULL)` 被筛掉。降序输出第一行是 `Logic`，第二行是 `Databases`。
      - item:
          id: sql-databases-avg
          type: number
          prompt: |
            如果 `Enroll` 表里某门课有三条记录：分别是 `70`、`90` 和 `NULL`，SQL 的 `AVG(grade)` 算出的平均分是多少？
          answer: 80
          hint: "`AVG` 会忽略 `NULL`，只对非空分数求平均。"
          explain: |
            跳过 `NULL` 后只剩 `70` 和 `90`，`(70 + 90) / 2 = 80`。
      - item:
          id: sql-join-need
          type: choice
          prompt: |
            如果另一张表 `Student(id, name)` 存了学生姓名，而 `Enroll(sid, course, grade)` 只存了学生编号 `sid`，想同时列出学生姓名和课程成绩，应该靠哪个操作把两张表连起来？
          options:
            - text: 用 JOIN 按 Student.id = Enroll.sid 把两张表拼起来
              correct: true
            - text: 直接写 FROM Student, AVG(Enroll)
              why: AVG 是聚合函数不是表名，两张表关联需要 JOIN（或条件匹配）
            - text: SQL 一次只能读一张表，必须导出到 Python 里再拼
              why: 关系数据库的核心强项之一就是用 JOIN 声明两张表的连接关系
          explain: |
            SQL 通过 `JOIN ... ON Student.id = Enroll.sid` 声明两张表如何按编号对应，依然不用手写双层循环。
      - item:
          id: sql-clause-order
          type: order
          prompt: |
            把一条标准 SQL 聚合查询在**执行逻辑上**处理数据的先后顺序排好。
          steps:
            - "FROM：确定要查哪张表"
            - "WHERE：先过滤掉不想要的原始行"
            - "GROUP BY：按指定列把行分成若干组"
            - "HAVING：筛掉汇总值不达标的组"
            - "ORDER BY：把最终保留的结果排好序"
          explain: |
            虽然书写时 `SELECT` 写在最前面，但数据库逻辑上先 `FROM` / `WHERE` 取行，再 `GROUP BY` / `HAVING` 分组筛组，最后才挑出要显示的列并按 `ORDER BY` 排序。

boss:
  items:
    - id: boss-immutable-tail
      type: choice
      prompt: |
        下面关于 OCaml 不可变列表和尾递归的说法，哪一项**正确**？
      options:
        - text: "1 :: old_list 不会改掉 old_list，且只有递归调用后没有剩余计算才算尾递归"
          correct: true
        - text: "1 :: old_list 会把 1 原地插进 old_list，所以比 @ 快"
          why: ":: 不修改 old_list，它更快是因为新建一个头节点直接共享尾部，不用复制左半边"
        - text: 只要函数里写了 let rec，无论后面有没有 + 1，编译器都会自动变成尾递归
          why: 像 1 + len xs 在递归返回后还有加法，不算尾递归，仍会消耗多层栈帧
        - text: OCaml 里绝对不允许出现任何可变数据，连数组也没有
          why: OCaml 保留了 ref、mutable 字段和数组，只是要求显式标出并圈在小范围
      explain: |
        `::` 共享不可变尾部而不破坏旧列表；只有递归调用是函数最后一步时，才是能复用栈帧的尾递归。
    - id: boss-pipeline-score
      type: number
      prompt: |
        计算下面这条 OCaml 管道的结果：
      code: |
        let score =
          [10; 25; 30; 15]
          |> List.filter (fun x -> x >= 20)
          |> List.map (fun x -> x - 5)
          |> List.fold_left ( + ) 0
      lang: ocaml
      answer: 45
      explain: |
        `filter` 留下 `[25; 30]`，`map` 减 5 得 `[20; 25]`，`fold_left (+) 0` 相加得 `45`。
    - id: boss-currying-laws
      type: choice
      prompt: |
        结合柯里化与高阶函数的代数定律，下面哪项说法**不对**？
      options:
        - text: List.map f (List.map g xs) 无论如何都必须扫描两次列表，不能合并成一次 map
          correct: true
        - text: 对纯函数来说，List.map f (List.map g xs) 等价于 List.map (fun x -> f (g x)) xs
          why: 纯函数无副作用，连续两次 map 与把两个函数先复合再一次 map 结果完全相同，因此这项说法本身是对的
        - text: 定义 let add x y = x + y 后，add 5 会返回一个等待 y 的新函数
          why: 柯里化支持只传部分参数得到等待剩余参数的新函数，这项说法也是对的
        - text: List.fold_left (-) 10 [2; 3] 的结果是 5，和 List.fold_right (-) [2; 3] 10 的结果 9 不同
          why: 减法不满足结合律，左折叠与右折叠顺序不同结果确实是 5 和 9，这项说法是对的
      explain: |
        对无副作用的纯函数，`List.map f (List.map g xs)` 可以按复合定律融合成单次遍历 `List.map (fun x -> f (g x)) xs`。
    - id: boss-tree-depth
      type: number
      prompt: |
        给定 `type 'a tree = Leaf | Node of 'a tree * 'a * 'a tree`，以及：
        `depth Leaf = 0`，`depth (Node (l, _, r)) = 1 + max (depth l) (depth r)`。
        对于 `t = Node (Node (Node (Leaf, 1, Leaf), 2, Leaf), 3, Node (Leaf, 4, Leaf))`，`depth t` 是多少？
      answer: 3
      explain: |
        左子树路径 `3 -> 2 -> 1` 经过 3 个节点（左子树深度 `2`），右子树只有 `4`（深度 `1`），总深度 `1 + max 2 1 = 3`。
    - id: boss-adt-option-match
      type: match
      prompt: |
        把模式匹配与代数数据类型里的概念和作用一一配对。
      pairs:
        - ["'a option", "用 Some v 或 None 显式表示值可能缺失"]
        - ["穷尽性检查", "编译前检查 match 是否漏掉了某个构造分支"]
        - ["{ r with x = 2 }", "保留原记录不变，生成仅改了 x 的新记录"]
        - ["when 守卫", "在模式匹配分支上附加布尔条件判断"]
      explain: |
        这些机制一起把“空值、漏分支、误改旧记录”提前消灭在运行之前。
    - id: boss-prolog-unify
      type: choice
      prompt: |
        在 Prolog 中，哪一组项**能够合一成功**，且得到唯一确定的变量绑定？
      options:
        - text: "book(Title, 2024) 与 book(ocaml, Year)"
          correct: true
        - text: "book(X, X) 与 book(ocaml, prolog)"
          why: 同一个变量 X 无法同时绑定成 ocaml 和 prolog
        - text: "book(ocaml, 2024) 与 paper(ocaml, 2024)"
          why: 谓词名称 book 与 paper 不同，无法合一
        - text: "book(X) 与 book(ocaml, 2024)"
          why: 参数个数不同（1 个 vs 2 个），无法合一
      explain: |
        `book(Title, 2024)` 和 `book(ocaml, Year)` 结构完全对齐，合一后得 `Title = ocaml, Year = 2024`。
    - id: boss-prolog-trace
      type: order
      prompt: |
        已知事实 `parent(tom, bob).` `parent(bob, ann).` 与规则：
        第 1 条 `ancestor(X, Y) :- parent(X, Y).`；
        第 2 条 `ancestor(X, Y) :- parent(X, Z), ancestor(Z, Y).`。
        按 Prolog 搜索与回溯的顺序排列执行 `?- ancestor(X, ann).` 的过程。
      steps:
        - "尝试第 1 条规则 parent(X, ann)，命中得出 X = bob"
        - "回溯并退回变量绑定，改试第 2 条规则 parent(X, Z), ancestor(Z, ann)"
        - "匹配 parent(tom, bob) 令 X = tom、Z = bob"
        - "继续验证 ancestor(bob, ann) 成立，得出第二个解 X = tom"
      explain: |
        Prolog 按规则先后尝试并利用回溯撤销旧绑定后走下一条规则，因此先后找出 `bob` 与 `tom`。
    - id: boss-sql-having
      type: choice
      prompt: |
        要从表 `Enroll(sid, course, grade)` 里找出“平均分不低于 80 的课程并按平均分从高到低排”，下面哪条 SQL **完全正确**？
      options:
        - text: "SELECT course, AVG(grade) AS avg_grade FROM Enroll GROUP BY course HAVING AVG(grade) >= 80 ORDER BY avg_grade DESC;"
          correct: true
        - text: "SELECT course, AVG(grade) AS avg_grade FROM Enroll WHERE AVG(grade) >= 80 GROUP BY course ORDER BY avg_grade DESC;"
          why: WHERE 在分组前运行，不能在 WHERE 里用聚合结果 AVG(grade)
        - text: "SELECT course, AVG(grade) AS avg_grade FROM Enroll GROUP BY course HAVING AVG(grade) >= 80 ORDER BY avg_grade ASC;"
          why: ASC 是升序（从低到高），题目要求降序应写 DESC
        - text: "SELECT course, AVG(grade) AS avg_grade FROM Enroll HAVING AVG(grade) >= 80 ORDER BY avg_grade DESC;"
          why: 没有写 GROUP BY course，会把整张表合并成一行而不是按课程分别统计
      explain: |
        必须先 `GROUP BY course` 按课程分组，再用 `HAVING` 过滤分组后的 `AVG(grade) >= 80`，最后 `ORDER BY avg_grade DESC` 降序输出。
    - id: boss-mutation-ref
      type: number
      prompt: |
        在 OCaml 中执行下面这段局部可变代码后，打印出的整数是多少？
      code: |
        let r = ref 4
        let a = [| 10; 20; 30 |]
        let () =
          r := !r + 3;
          a.(1) <- a.(1) + !r;
          Printf.printf "%d\n" a.(1)
      lang: ocaml
      answer: 27
      explain: |
        `!r` 先变成 `4 + 3 = 7`，接着 `a.(1)` 从 `20` 更新为 `20 + 7 = 27`。
    - id: boss-prolog-list
      type: choice
      prompt: |
        在 Prolog 中，关于列表匹配 `[H|T]` 与动态事实库（`assertz`/`retract`），下面哪项正确？
      options:
        - text: "[H|T] 与 [5, 6, 7] 合一得 H = 5、T = [6, 7]；assertz/retract 会带来依赖执行顺序的副作用"
          correct: true
        - text: "[H|T] 与 [5, 6, 7] 合一得 H = [5, 6]、T = 7"
          why: "[H|T] 左边只匹配单个头元素 5，右边是剩余列表 [6, 7]"
        - text: "[H|T] 不能匹配单元素列表 [5]，因为没有尾巴"
          why: 单元素列表 [5] 会匹配 H = 5 和空列表 T = []
        - text: 动态修改事实库没有任何副作用，结果永远与调用先后无关
          why: 运行时增删事实会直接改变后续查询看到的事实库状态，必须谨慎圈在小范围
      explain: |
        `[H|T]` 把列表拆成头元素和剩余列表；动态修改事实库会引入顺序相关副作用。祝贺通关《函数式、逻辑式与声明式编程》。
