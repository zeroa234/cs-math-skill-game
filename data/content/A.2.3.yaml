skill: A.2.3
version: 2
authors: [main-agent]
brief:
  why: |
    传统机器学习要靠专家手工挑特征、线性边界也分不开“异或”和同心圆环。深度学习把简单神经元叠成深层网络，让机器自己从原始输入层层抽象出有用表示。这一关从单神经元与感知机起步，动手操作隐藏层画非线性边界，学透小批量 SGD、动量/Adam、ReLU 与 He 初始化、权重衰减/暂退法/批归一化、万能近似与卷积层次表示，最后推出计算图、反向传播四大基本方程与 PyTorch 标准训练循环。
  outcomes:
    - 理解感知机与 Sigmoid/ReLU 神经元差异，解释单层线性阈值分不开异或（XOR）而多层网络能突破的原因
    - 掌握小批量随机梯度下降、动量法与 Adam 更新方程，能凭损失曲线症状诊断学习率过大或过小
    - 阐明深层 Sigmoid 梯度消失原因与 ReLU 配合 He 初始化（Var = 2/n_in）保持各层方差稳定的机制
    - 正确使用权重衰减、暂退法、早停与批归一化抑制过拟合，理解万能近似定理与 CNN 局部共享视觉层级
    - 写出计算图前/后向传播四大方程并用 PyTorch 规范写出包含 zero_grad() 的完整训练循环
terms:
  - term: 参数
    def: '神经网络中由训练数据拟合学习得到的可调数值，包括各层的连接权重 w 和偏置 b'
  - term: 感知机
    def: '早期人工二元阈值单元：对输入加权求和加偏置，结果大于阈值输出 1、否则硬切输出 0'
  - term: 神经元
    def: '接收多个输入信号做加权求和、加上偏置再经过平滑激活函数输出的神经网络基本计算单元'
  - term: 激活函数
    def: '加在线性加权和之后负责引入曲线折弯能力与调节数值范围的非线性标量函数（如 Sigmoid、tanh、ReLU）'
  - term: 隐藏层
    def: '夹在输入层与输出层之间、专门用来提取中间抽象特征并组合出非线性决策面的中间神经元层'
  - term: 多层感知机
    def: '由输入层、一层或多层带非线性激活函数的隐藏全连接层以及输出层依次前向堆叠而成的神经网络（MLP）'
  - term: 前向传播
    def: '输入特征向量从第一层开始逐层做矩阵乘法、加偏置与非线性激活，一直计算到最终预测与损失的过程'
  - term: 小批量梯度下降
    def: '每步只从训练集随机抽一小批样本（Mini-batch）估算平均梯度就立即更新一次参数，兼顾速度与方向稳定的训练方法'
  - term: 动量法
    def: '在每步梯度更新中混入前几步积累下来的“速度惯性”，加速冲过平坦谷底并压平横向陡坡震荡的优化方法'
  - term: Adam
    def: '同时维护梯度一阶矩（动量均值）与二阶矩（梯度平方指数平均）并做初始偏差修正的自适应学习率优化器'
  - term: 梯度消失
    def: '深层网络从输出层向底层回传梯度信号时，由于连乘许多小于 1 的导数或过小权重而导致浅层权重几乎不动的问题'
  - term: ReLU
    def: '修正线性单元激活函数 max(0, z)：正半轴导数恒等于 1 不易衰减、负半轴归零截断并带来稀疏性'
  - term: He 初始化
    def: '针对 ReLU 激活把一半负输入归零的特点，将权重初始化方差设为 2 / n_in 以保住前向激活与梯度方差稳定的方案'
  - term: 权重衰减
    def: '在优化目标中加入与权重平方和成正比的惩罚（等价于 L2 正则化），限制网络权重规模以缓解过拟合'
  - term: 暂退法
    def: '训练每一步按概率 p 随机临时关闭部分隐藏神经元并按 1/(1-p) 放大保留值，防止神经元彼此协同固化（Dropout）'
  - term: 早停
    def: '持续监测独立验证集误差，一旦验证表现不再进步甚至开始恶化就停下训练、保留历史最优权重的方法（Early Stopping）'
  - term: 批归一化
    def: '在每个小批量内部对层间激活值减均值除方差后再做可学习的缩放平移，从而稳住训练并允许更大学习率的方法（Batch Norm / BN）'
  - term: 万能近似定理
    def: '只要单隐层包含足够多的非线性神经元，前馈神经网络理论上能以任意精度逼近任何有界连续函数'
  - term: 卷积神经网络
    def: '利用局部感受野、空间平移共享卷积核与池化缩减空间，逐层从边缘组合到高级语义的深度视觉架构（CNN）'
  - term: 池化
    def: '对卷积特征图的局部邻域取最大值或平均值做空间压缩，降低后续计算量并换取局部微移不变性的操作'
  - term: 计算图
    def: '把复杂函数拆成一连串加减乘与激活等基础运算节点和有向连接边构成的有向无环图，供自动微分追踪求导'
  - term: Hadamard 积
    def: '两个相同形状向量或矩阵按对应位置分量逐个相乘（记作 s ⊙ t），常见于误差项乘激活导数'
  - term: 反向传播
    def: '先一次前向算完并记下各中间结果，再沿着计算图从输出损失出发按链式法则由后往前一次性复用算清所有参数梯度的高效算法'

lessons:
  # =====================================================================
  # 第 1 章：神经网络
  # =====================================================================
  - id: perceptron-and-sigmoid-neuron
    chapter: 神经网络
    title: 感知机、Sigmoid 神经元与线性可分极限
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            考虑二维平面上的四个开关组合点：`(0,0)` 与 `(1,1)` 贴着红点（输出 0），而 `(0,1)` 与 `(1,0)` 贴着蓝点（输出 1）——这就是经典的“异或（XOR）”规律。能画得出一条**直线**，把两个红点和两个蓝点各自干净分在直线两边吗？
          options:
            - text: 不可能：两类点呈对角交叉排列，任何单条直线都必定把至少一点划错
              correct: true
            - text: 只要慢慢多轮微调权重和偏置斜率，单条直线就能绕过中心拐角分开这四个对角点
              why: 一条直线方程 $w_1 x_1 + w_2 x_2 + b = 0$ 在平面上只能画出平坦单侧半平面，数学上严格不可解 XOR
            - text: 只要把输出激活函数从阶跃改成 Sigmoid，单个线性神经元就能把平面弯成曲线来分 XOR
              why: 单调递增的 Sigmoid 只是给直线一侧打分换算平滑概率，它等高线 $w_1 x_1 + w_2 x_2 + b = 0$ 依然只是一条直线
          explain: |
            单个**神经元**不管怎么改偏置，本质上都在输入空间里切直一刀；遇到像异或这样的交叉规律，必须靠多层神经元接力配合才能画出弯曲边界。
      - card:
          title: 感知机与 Sigmoid 神经元：从硬台阶到可微斜坡
          body: |
            最早的人工单元叫**感知机**：对输入 $x_1, \dots, x_m$ 各自乘权重 $w_j$ 求和加偏置 $b$，只要总分 $w_1 x_1 + \dots + w_m x_m + b > 0$ 就输出 `1`，否则硬切回 `0`。像**与门（AND）**（全 1 才出 1）、**或门（OR）**和**与非门（NAND）**（全 1 出 0、其余出 1）这类单一线性规则都能由单只感知机直接实现。
            然而感知机的硬台阶在跃变处不连续——权重微调时输出要么不变、要么直接从 0 跳成 1，没法引导梯度下降。把硬台阶换成平滑过渡的 **Sigmoid** 函数 $\sigma(z) = \frac{1}{1+e^{-z}}$（或其它光滑非阶跃**激活函数**），就得到**神经元**：模型**参数**（权重与偏置）有微小改动时输出也随之平滑微变，从而能够算梯度并逐步学习。
      - card:
          title: 试试看：亲手摆出 XOR 感受单层神经元的极限
          body: |
            先在下方的单个神经元模拟器（已选中 **XOR** 问题）里拖动 $w_1$、$w_2$ 与偏置 $b$：不管怎样旋转平移那条直分界线，总最多只能分对 3/4 个点，始终会落下最后一个角点。切回线性可分的简单规则，直分界线才能全部分对。
          sim:
            name: neuron
            params: { gate: xor }
      - item:
          id: neuron-and-gate-sim
          type: sim
          sim: neuron
          prompt: 现在目标切换成了线性可分的逻辑“与门（AND）”（只有 $(1, 1)$ 输出为 1，其余三点为 0）。请拖动滑动条 $w_1$、$w_2$ 与偏置 $b$，找到一条能分对全部 **4/4** 个点的分界线。
          params:
            gate: and
          goal:
            accuracy: 1
          solution:
            w1: 1
            w2: 1
            b: -1.5
          explain: |
            取如 $w_1 = 1, w_2 = 1, b = -1.5$ 时，只有 $(1,1)$ 得出正值 $1+1-1.5 = +0.5 > 0$（判 1），其余三点均 $< 0$（判 0），准确分开 AND 门。
      - item:
          id: perceptron-vs-sigmoid-choice
          type: choice
          prompt: |
            把早期硬阈值阶跃感知机升级成带 Sigmoid 等光滑激活函数的神经元时，核心改进在于什么？
          options:
            - text: 权重和偏置做微小改动时，输出也平滑微变，从而可定义偏导梯度并用梯度下降学习
              correct: true
            - text: Sigmoid 允许仅仅依靠单个神经元（不带任何隐藏层）就学出十字交叉的异或（XOR）边界
              why: $\sigma(\mathbf{w}^\top\mathbf{x}+b) = 0.5$ 对应直线 $\mathbf{w}^\top\mathbf{x}+b = 0$，单个神经元不管套什么单调函数都仍是线性分类器
            - text: 硬阈值感知机因为缺少激活函数，连简单的“与门（AND）”和“或门（OR）”逻辑也无法实现
              why: 单层感知机可以实现 AND、OR、NAND 等全部线性可分基本门电路，做不到的是非线性的 XOR
            - text: Sigmoid 的导数在实数轴各处都很大，在两端饱和区也不会出现梯度趋零的问题
              why: Sigmoid 在两端饱和趋于平坦、中间坡度最大仅 0.25，优点在于全局光滑可微、微小调参引发可控微调
          explain: |
            从“非 0 即 1 的急转突变”变成“处处光滑响应小改动的曲线斜坡”，才打开了多参数一起靠梯度微调的大门。
      - item:
          id: neuron-linear-calc
          type: number
          prompt: |
            设某个神经元权重为 $w_1 = 2, w_2 = -1$、偏置 $b = -1$，采用最简 Sigmoid 激活在阈值 0.5 判别正类（即只需 $z = w_1 x_1 + w_2 x_2 + b > 0$）。当输入样本为 $x = (3, 2)$ 时，这个加权线性打分 $z$ 等于多少？
          answer: 3
          hint: 计算 $2 \times 3 + (-1) \times 2 - 1$。
          explain: |
            $z = 2\times 3 - 1\times 2 - 1 = 6 - 2 - 1 = 3 > 0$，于是 $\sigma(3) \approx 0.953 > 0.5$，判为正类。
      - item:
          id: xor-by-nand-choice
          type: choice
          prompt: |
            为什么用三个感知机或神经元组合两层就能解决单层解决不了的 XOR（已知 $\mathrm{XOR}(x_1, x_2) = \mathrm{AND}(\mathrm{OR}(x_1, x_2),\ \mathrm{NAND}(x_1, x_2))$）？
          options:
            - text: 第一层画两条直线分别提取“OR”与“NAND”新特征，第二层再合并切出中间夹带
              correct: true
            - text: 因为第一层的隐藏神经元会在前向计算时把所有输入坐标随机丢弃一半、退化成零向量
              why: 第一层恰恰把原特征线性组合后折叠成新的 2 维表示（比如 `(1,1)` 和 `(0,0)` 在新特征轴下就能被一条直线切开）
            - text: 因为只要把输入特征整体乘以一个负常数，单条直线就能自动弯折出两道平行夹角边界
              why: 给全体坐标同乘负常数仍然只旋转/翻转直线方向，直线弯曲必须由非线性隐藏层组合达成
            - text: 必须把神经元数量堆叠到上千层以上，单靠两层全连接神经元不可能切出平行线夹带
              why: 只需 1 个含 2 个神经元的隐藏层加上 1 个输出神经元就能把二维平面上的 XOR 切出夹带
          explain: |
            第一层学出新特征空间，把原来纠缠在一起的点拆开挪位，后面一层就能直接用直线切出答案。

  - id: mlp-architecture-and-digits
    chapter: 神经网络
    title: 多层感知机（MLP）、手写数字与深度学习架构
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            二维平面上有一圈红点紧紧包在圆心区域，外圈环绕着一圈蓝点。前面试过单层神经元只能画直分界线，把隐藏层关成 0 个神经元后直接训练也难以分开。往中间夹入一层带 4–6 个非线性激活的隐藏单元，它凭什么就能画出一个圆环把中心圈住？
          options:
            - text: 每个隐藏神经元先切一条不同角度的斜直界，输出层再把它们围拢拼成封闭多边形
              correct: true
            - text: 因为隐藏层在前向计算时会自动把所有平面坐标改写成极坐标半径平方公式来判别内外圆
              why: 多层感知机没有预设任何圆形或极坐标公式，它是凭几条带角度的直折叠“拼围栏”围出圆形区域
            - text: 即使隐藏层不装任何非线性激活函数、纯粹把两层线性矩阵直接乘一起，也同样能围出封闭圆圈
              why: 任意多个纯线性层矩阵接在一起仍等价于单个线性矩阵 $W_2 W_1 x$，等值面还是单一平面直线
          explain: |
            一层切半平面，两层围成凸多边形甚至任意连通域，这就是**多层感知机（MLP）**的几何直观。
      - card:
          title: 神经网络架构与隐藏层前向计算
          body: |
            把大量神经元排成“层”，上一层全连向下一层，就构成了前馈**多层感知机（MLP）**：
            - 最左是接收原始特征的**输入层**（如 `28×28 = 784` 个手写灰度像素直接摊平成 784 维输入）；
            - 中间夹着一层或多层负责自动组合特征的**隐藏层**（若不加非线性的**激活函数**，多层矩阵连乘依然坍缩成线性模型）；
            - 最右端是给出最终预测的**输出层**（如对应数字 `0..9` 共 10 个输出概率单元）。
            数据自左向右一路乘权重、加偏置并过激活直到给出答案，这一趟叫**前向传播**。
      - item:
          id: mlp-why-nonlinear-hidden
          type: choice
          prompt: |
            假如某个同学把一个 5 层全连接网络的全部隐藏激活函数全换成了恒等映射 $\phi(z) = z$（不放 Sigmoid/tanh/ReLU），只留输出层做分类。这个 5 层深网络实际能画出的决策边界和谁等价？
          options:
            - text: 等价于一个单层线性模型 $\mathbf{W}_{\text{eq}}\mathbf{x}+\mathbf{b}_{\text{eq}}$，因为线性矩阵乘积仍为线性映射
              correct: true
            - text: 只要堆叠到 5 层以上，哪怕全不加非线性激活函数也能组合出多边形弯曲决策边界
              why: 五次矩阵乘法只是把五个矩阵相乘合成一个大矩阵，线性嵌套依然线性，不会产生弯折
            - text: 网络会在梯度下降中自己学出分段弯折效果，只要把训练轮数从几十轮提高到几千轮就行
              why: 没有任何非线性分段折拐函数时，整套网络只存在唯一平直超平面
            - text: 5 层恒等全连接网络无法完成矩阵乘法，根本算不出任何前向预测概率结果
              why: 矩阵乘法前向输出完全能算出来，只是表达能力没比 1 层线性模型更高
          explain: |
            非线性激活函数就是让多层矩阵不在乘法里“塌缩成单层线性”的关键折弯环节。
      - card:
          title: 手写数字分类、简单实现与迈向深层网络
          body: |
            经典手写数字 **MNIST** 数据集（`28×28` 像素）分类只需 `784 -> 30 -> 10` 的单隐藏层小网络就能达到 95% 以上测试率：靠矩阵一次乘整批样本，Python 写十来行向量乘法就能快速完成前向预测。
            那为什么要叫“**深**度学习”而不一直只留一层超宽隐藏层？因为现实中的图片、语音与文字通常呈**层次结构**：浅层先抽出像素笔画和边缘轮廓，中间层把笔画拼成半圆弧或偏旁部首，更深层再组合成完整的数字或复杂概念，用较少层间参数复用了基础结构。
      - card:
          title: 动手实验：看看 0 个与 6 个隐藏单元画圆形边界的差距
          body: |
            下面的“小小神经网络”模拟器加载了中心红点、外围蓝环的 `circle` 数据集，最初默认把隐藏神经元设成 `0`（等价纯线性分界）。先别加隐藏层点一次“训练”，看准确率是不是卡在 50% 左右——准备好看清线性上限了吗？
          sim:
            name: mlp
            params: { dataset: circle, hidden: 0, epochs: 400, lr: 1 }
      - item:
          id: mlp-circle-sim
          type: sim
          sim: mlp
          prompt: 现在请把“隐藏层神经元”加到 `4–6`（保留 `tanh` 激活函数、学习率调成 `1`、训练轮数 `600`），点击 **训练**，观察网络把直线折叠围成圈并将准确率推过 **90%**。
          params:
            dataset: circle
            hidden: 0
            epochs: 400
            lr: 1
          goal:
            accuracy: 0.9
          solution:
            hidden: 6
            activation: tanh
            lr: 1
            epochs: 600
            seed: 1
          explain: |
            没有隐藏层时怎么训练准确率也只停留在 50% 上下；加上 6 个 tanh 隐藏单元后网络很快围出环形分界线，准确率提升到接近 100%。
      - item:
          id: mnist-architecture-params
          type: number
          prompt: |
            按经典手写数字结构建立一个全连接网络：输入展平为 $784$ 维像素，单一隐藏层设 $30$ 个神经元（每个都带 $1$ 个独立偏置），输出层有 $10$ 个分类神经元（各带 $1$ 个偏置）。忽略激活计算本身，光输入层到隐藏层这一段连接权重矩阵加上隐藏层偏置共有多少个可调参数？
          answer: 23550
          hint: 计算权重矩阵行数×列数 $784 \times 30$，再加上隐藏层的 $30$ 个偏置。
          explain: |
            输入→隐藏层权重矩阵有 $784 \times 30 = 23{,}520$ 个连接权重，加上该隐藏层自己的 $30$ 个偏置，合计 $23{,}550$ 个参数（再加隐藏→输出层 $30\times 10 + 10 = 310$，全网共 $23{,}860$ 个参数）。
      - item:
          id: deep-hierarchy-advantage
          type: choice
          prompt: |
            为什么在识别照片、语音等现实感知任务里，多堆几层较窄的深度网络常常比只用单层、宽度庞大的隐藏层效果更好且参数更省？
          options:
            - text: 自然概念呈“边缘→局部部件→整体语义”层级，深层能逐级复用底层部件以减少参数
              correct: true
            - text: 因为层数够深以后就不再需要在隐藏层加入任何激活函数，纯线性嵌套就能识别自然图片
              why: 没有非线性激活再深也塌缩回一层线性；深层能力来自线性映射与非线性折叠逐级复用复合
            - text: 因为只要把深度堆得足够深，每个隐藏层都可以强制固定只放 1 个神经元而依然表达万物
              why: 每层常宽达几十到上千单元，重在逐级抽象出不同粒度的特征表示
            - text: 单隐藏层网络理论上连连续光滑函数都无法逼近，只有堆到三层以上才具备函数逼近能力
              why: 万能近似定理指出极宽的单隐层理论能逼近任何连续函数，但可能需要指数增长的神经元个数；深层能大幅压缩参数规模
          explain: |
            用层级复合代替浅层死记（先抽边缘部件、再拼整体语义），这正是“深度”两字在表示学习中的关键优势。

  # =====================================================================
  # 第 2 章：训练
  # =====================================================================
  - id: loss-sgd-and-minibatch
    chapter: 训练
    title: 损失选择（交叉熵 vs MSE）与小批量随机梯度下降
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            手头有 60,000 张手写数字图片拿来训练网络。对比“每看完全部 60,000 张图片算完总平均梯度再迈出一步”（全批量梯度下降），和“每次随机抽出 64 张图片算完梯度就立即更新参数”（小批量随机梯度下降），走完同样时间谁往往收敛得更快？
          options:
            - text: 每次抽 64 张就更新的小批量策略：64 张样本均值已够指明下山方向，同时间内更新步数高出近千倍
              correct: true
            - text: 必须看满全盘 60,000 张训练样本才肯更新一步的全批量策略在收敛速度上必定快一千倍
              why: 数据里有大量相似手写样本，前 64 张已有丰富梯度信号；全批量每更新一步耗时较长，小批量在同等时间能迭代许多次
            - text: 只抽 64 张完全无法估算总体梯度期望，因此每一步的下降方向必然与全样本总体目标方向相反
              why: 随机抽样小批量的平均梯度恰好是全量总体梯度的无偏估计，虽然带有一定统计抖动，长期期望方向一致
          explain: |
            有噪声但步频高的**小批量梯度下降**既能利用并行矩阵乘法优势，还能借适度随机抖动跨过平缓停滞区。
      - card:
          title: 神经网络里的交叉熵 vs 平方损失
          body: |
            给 Sigmoid 或多分类 **Softmax** 输出选训练目标时，早期拿**均方误差（MSE）** $C = \frac{1}{2}\sum (y_j - a_j)^2$ 常让学得较慢：当神经元起初预测偏差很大（如输出 $a = 0.99$ 而真值 $y = 0$）时，S 型激活平缓区的导数 $\sigma'(z) = a(1-a) \approx 0.01$ 会把修正步长缩小近百倍。
            改用**交叉熵** $C = -\sum [y_j \ln a_j + (1-y_j)\ln(1-a_j)]$（以及多分类对应的交叉熵配 Softmax 归一化 $p_k = \frac{e^{z_k}}{\sum_c e^{z_c}}$）：求导时 $\sigma'(z)$ 恰与分母消除，梯度正比于真实误差 $a_j - y_j$——偏差越大，修正推力越强。
      - card:
          title: 例子：对比预测大错时均方误差与交叉熵的梯度大小
          body: |
            设单神经元当前线性打分 $z = 4.6$，经 Sigmoid 算出较自信的错误预测 $a = \sigma(4.6) \approx 0.99$，而真实标签却是 $y = 0$。算一算分别套用 MSE 与交叉熵时对线性分数 $z$ 的修正推力 $\partial C / \partial z$ 相差多少倍？
          reveal:
            - title: 为什么交叉熵在偏差较大时不出现导数饱和减速？
              body: |
                此时激活曲线处于平缓区：$\sigma'(4.6) = a(1-a) \approx 0.99 \times 0.01 = 0.0099$。
                若用均方误差 $\frac{1}{2}(a - y)^2$：误差 $(a - y) = 0.99$，乘以 $\sigma'$ 得到 $\partial C_{\text{MSE}}/\partial z \approx 0.99 \times 0.0099 \approx 0.0098$——偏差接近 1，梯度却不到 $0.01$，修正速度受阻。
                若换用交叉熵：$a(1-a)$ 恰好消掉分母，直接剩下 $\partial C_{\text{CE}}/\partial z = a - y = 0.99$——修正推力是平方损失的 **100 倍**。
      - item:
          id: ce-vs-mse-ratio
          type: number
          prompt: |
            假设某 Sigmoid 神经元错把反例（真值 $y = 0$）预测出了高概率 $a = 0.9$。用交叉熵时对加权输入 $z$（对数几率）的梯度幅值为 $|a - y| = 0.9$；而用平方损失 $\frac{1}{2}(a-y)^2$ 时梯度还要再乘一次导数 $a(1 - a)$，缩小到仅多少？（求平方损失的 $|\partial C / \partial z|$ 数值）
          answer: 0.081
          hint: 计算 $|a - y| \times a(1 - a) = 0.9 \times 0.9 \times 0.1$。
          explain: |
            $\sigma'(z) = a(1-a) = 0.9 \times 0.1 = 0.09$，所以平方损失的梯度仅 $|\partial C/\partial z| = 0.9 \times 0.09 = 0.081$，降为交叉熵 $0.9$ 的十分之一；若 $a = 0.99$ 则相差一百倍。
      - card:
          title: 小批量随机梯度下降（Mini-batch SGD）与轮次（Epoch）
          body: |
            为兼顾硬件并行效率与梯度估计方差，实践采用基于**随机梯度下降（SGD）**与全批量**梯度下降（GD）**折中的**小批量梯度下降**（batch size 常取 `32`、`64`、`128` 等 2 的幂次）：
            1. 每个训练**轮次（Epoch）**先随机打乱全部训练集顺序，切分成若干互不重叠的小批量（如 60,000 个样本每批 64 张约得 938 个小批量）；
            2. 对每个小批量利用图形处理器（**GPU**）并行矩阵乘法算一趟平均损失梯度，马上更新权重 $\boldsymbol{\theta} \leftarrow \boldsymbol{\theta} - \eta \mathbf{g}_{\text{batch}}$；
            3. 走完所有小批量即完成 1 个 epoch，如此多轮迭代直到验证损失趋稳。
      - item:
          id: minibatch-steps-per-epoch
          type: number
          prompt: |
            训练集共有 1000 条打乱后的图片，采用等分、小批量大小设为 `50` 的小批量随机梯度下降训练，并完整训练 3 个轮次（Epoch）。整个训练过程参数一共会执行多少次更新步骤？
          answer: 60
          hint: 1 个轮次分成 $1000 / 50 = 20$ 个小批量，共更新 20 次；再乘上 3 个轮次。
          explain: |
            每个轮次执行 $1000 / 50 = 20$ 次梯度更新，跑完 3 个完整轮次共发生 $20 \times 3 = 60$ 次参数更新。
      - item:
          id: softmax-output-property
          type: choice
          prompt: |
            在做 `0..9` 十类手写数字识别时，通常把最后输出层 10 个裸打分 $z_1, \dots, z_{10}$ 送进 **Softmax** 函数 $p_k = \frac{e^{z_k}}{\sum_{j=1}^{10} e^{z_j}}$ 再去和真标签算交叉熵。Softmax 完成了什么核心转化？
          options:
            - text: 通过指数归一化把实数打分转为总和等于 1、非负的十类预测概率分布
              correct: true
            - text: Softmax 会强制把 10 个输出中排前五的打分保留为 1，其余五个全部硬清零成 0
              why: 指数函数 $e^{z_k}$ 恒大于 0，除以正总和后每个分量都在 $(0, 1)$ 之间且全加总等于 1
            - text: 在输出端加上 Softmax 以后，所有中间隐藏层激活函数都必须跟着删除才能运行
              why: 隐藏层仍照常使用 ReLU 或 tanh 等激活，Softmax 专放在多分类最终输出端负责转成互斥类别概率分布
            - text: Softmax 会把原有的 10 维类别输出向量强行压缩成单个实数再按 0.5 阈值切两类
              why: 它把 $K$ 维打分向量逐一映射到同样 $K$ 维的概率向量里，恰用于多分类互斥场景
          explain: |
            二分类输出一个概率用 Sigmoid + 二元交叉熵；$K$ 类互斥单选分类则标配 Softmax + 多类交叉熵（即 $-\ln p_{y_{\text{true}}}$）。
      - item:
          id: minibatch-benefit-choice
          type: choice
          prompt: |
            相比于把批大小设为 `1`（纯单样本 SGD）和设成整个数据集总数 $N$（全批量 GD），工业界最常用的适中小批量（如 `64` 或 `128`）凭什么更受青睐？
          options:
            - text: 小批量兼顾 GPU 矩阵并行算力与适当更新频率，并借轻微噪声避开平缓停滞区
              correct: true
            - text: 因为全批量 GD 每步看到的样本更多，所以在相同物理时间内总是比小批量完成更多次参数更新
              why: 全批量算完整套样本才更新 1 步，单位挂钟时间的参数更新步数远远少于小批量 SGD
            - text: 批大小设为 `1` 时每步单个样本向量最能充分吃满现代 GPU 上千并行核心的矩阵吞吐能力
              why: 单条向量逐点计算利用率低，攒成几十到上百条拼成矩阵才能充分发挥硬件并行计算优势
            - text: 只要把小批量大小改成 64，即使把全部训练标签打乱成随机数字，模型也能稳定达到 100% 验证准确率
              why: 批大小只改变优化步进节奏与噪音尺度，如果标签和特征全无规律，任何模型也无法凭空学出泛化规则
          explain: |
            硬件适合几十上百条拼矩阵并行，优化需要适度步频与噪声，两者在中等小批量尺度上取得良好平衡。

  - id: optimizers-momentum-adam
    chapter: 训练
    title: 优化器演进：动量法、Adam 与学习率诊断
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            想象一个狭长陡峭的山谷：东西方向坡壁陡峭，而南北主沟底一路平缓倾斜向下通往谷底。普通 SGD 每次只沿当下最陡法向迈步，常在东西两壁间来回摆动，沿南北主谷却推进缓慢。如果给滚动位置加上“速度惯性”，会发生什么？
          options:
            - text: 东西向正负交替的摆动在惯性累加中相互抵消，南北向一致的下坡分量不断累积并加速
              correct: true
            - text: 加上速度惯性之后，参数在东西两陡壁之间会越摆越高，再也无法沿着平坦主沟底向前推进
              why: 来回交替正负相抵削平了陡壁抖动，连续同向的微小下坡分量则因累加形成平稳前进速度
            - text: 计算惯性速度向量必须先求出损失函数的整个二阶海塞逆矩阵才能算出第一步更新方向
              why: 经典动量只保存一个与参数同维度的过去梯度滑动向量，无需二阶求逆，额外内存和计算很少
          explain: |
            这正是缓解病态山谷震荡的**动量法**，也是现代自适应优化器的基础思想之一。
      - card:
          title: 带动量 SGD 与自适应步长 Adam 优化器
          body: |
            为改善普通梯度在病态曲面上震荡和推进慢的问题：
            - **动量法（Momentum）**：引入速度向量 $\mathbf{v}$（常取摩擦系数 $\beta \approx 0.9$），先累积历史速度再更新参数：
              $$\mathbf{v}_t = \beta \mathbf{v}_{t-1} + \mathbf{g}_t,\qquad \boldsymbol{\theta}_t = \boldsymbol{\theta}_{t-1} - \eta \mathbf{v}_t$$
            - **Adam 优化器**：融合了动量法与 **RMSProp**（均方根传递自适应缩放）思想：既跟踪梯度一阶均值 $\mathbf{m}_t = \beta_1 \mathbf{m}_{t-1} + (1-\beta_1)\mathbf{g}_t$，又用逐分量平方跟踪波动幅度（二阶矩）$\mathbf{v}_t = \beta_2 \mathbf{v}_{t-1} + (1-\beta_2)\mathbf{g}_t^2$（常取 $\beta_1=0.9, \beta_2=0.999$）。因初值从 0 起步，经**偏差修正** $\hat{\mathbf{m}}_t = \mathbf{m}_t/(1-\beta_1^t)$、$\hat{\mathbf{v}}_t = \mathbf{v}_t/(1-\beta_2^t)$ 后再逐维缩放更新：$\boldsymbol{\theta}_t = \boldsymbol{\theta}_{t-1} - \eta \frac{\hat{\mathbf{m}}_t}{\sqrt{\hat{\mathbf{v}}_t} + \varepsilon}$。
      - card:
          title: 例子：手动推算一步动量更新与辨识学习率失调症状
          body: |
            通过小手算感受动量和 **Adam** 偏差修正怎么运转，再记住调**学习率 $\eta$** 时的两类典型损失曲线形态。
          reveal:
            - title: 第 1 步：算动量两步累加与 Adam 初始第 1 步偏差修正
              body: |
                假设参数 $\theta_0 = 2.0$，初速度 $v_0 = 0$，动量系数 $\beta = 0.9$，学习率 $\eta = 0.1$。若前两步梯度依次为 $g_1 = 2.0, g_2 = 2.0$：第 1 步得 $v_1 = 0.9(0)+2 = 2$，$\theta_1 = 2.0 - 0.1(2) = 1.8$；第 2 步得 $v_2 = 0.9(2)+2 = 3.8$，步长增至 $0.38$ 到达 $1.42$，推进更快。
                至于 Adam 第 1 步（$t=1$），若不做 $\hat{m}_1 = m_1/(1 - 0.9^1)$ 修正，从 $m_0 = 0$ 起步会被 $(1-\beta_1)=0.1$ 缩小十倍，除法修正刚好在初期把偏小估计拉回无偏尺度。
            - title: 第 2 步：盯紧损失曲线排查学习率过大 vs 过小
              body: |
                - **学习率过大**：参数一步迈过谷底对岸半山腰，损失曲线剧烈上下震荡、越跳越高甚至溢出成 `NaN`；
                - **学习率过小**：损失虽然单调下降，但下降非常缓慢，跑满几十轮仍滞留在高坡，迟迟不到谷底。
      - item:
          id: momentum-2steps-calc
          type: number
          prompt: |
            某标量参数初始 $\theta_0 = 10$，初速度 $v_0 = 0$，动量公式 $\mathbf{v}_t = \beta \mathbf{v}_{t-1} + g_t$（取 $\beta = 0.5$）且 $\theta_t = \theta_{t-1} - \eta \mathbf{v}_t$（取 $\eta = 0.1$）。假设连续两步算得梯度均恰好等于 $g_1 = 2, g_2 = 2$。走完第 **2** 步后参数 $\theta_2$ 变成多少？
          answer: 9.5
          hint: 先算第 1 步：$v_1 = 2$、$\theta_1 = 9.8$；再算第 2 步：$v_2 = 0.5\times 2 + 2 = 3$。
          explain: |
            第 1 步：$v_1 = 0.5(0)+2 = 2$，$\theta_1 = 10 - 0.1(2) = 9.8$；第 2 步：$v_2 = 0.5(2)+2 = 3$，$\theta_2 = 9.8 - 0.1(3) = 9.5$（普通无动量 SGD 两步只会走到 $9.6$，动量已经开始加速）。
      - item:
          id: adam-bias-correction-choice
          type: choice
          prompt: |
            在 Adam 优化器的每步更新公式中，先用 $\hat{m}_t = m_t / (1 - \beta_1^t)$ 与 $\hat{v}_t = v_t / (1 - \beta_2^t)$ 做一次除法，这步**偏差修正**专门解决什么问题？
          options:
            - text: 弥补一二阶矩从零向量起步时的初期低估偏差，且随着步数增大自然趋近于 1
              correct: true
            - text: 为了保证全部神经网络参数在训练结束前一刻同时强制收缩并归零成空矩阵
              why: 随着步数 $t$ 变大，$\beta^t \to 0$，分母 $1 - \beta^t \to 1$，偏差修正渐渐消失只剩平稳估计，不会让参数归零
            - text: 当不同维度的梯度方差恰好完全相等时，用偏差修正因子直接替代计算图反向求导本身
              why: 梯度 $g_t$ 依然需要正常通过计算图回传算出，Adam 负责拿梯度做步长调控
            - text: 为了保证即使把初始学习率设为 $\eta = 1000$ 也永不溢出，能强制压平一切振荡发散
              why: 若初始基础学习率 $\eta$ 设得过大，即使有自适应缩放和偏差修正同样会震荡发散
          explain: |
            记住 $1 - \beta^t$ 在起步 $t=1$ 时把仅吸收 $(1-\beta)$ 分量的一阶/二阶估计拉回真实尺度，等 $t \gg 1$ 后因子趋于 1 自动淡出。
      - item:
          id: lr-symptoms-choice
          type: choice
          prompt: |
            分别观察两位工程师画出的训练损失随轮次变化曲线：甲同学的损失前 3 步快速翻倍抬升并很快报 `NaN`；乙同学的损失稳定微幅下降，跑满 100 轮仍离目标很远。两位各自大概率出在哪儿？
          options:
            - text: 甲的学习率 $\eta$ 过大导致震荡发散；乙的学习率 $\eta$ 过小导致进展过慢
              correct: true
            - text: 甲的学习率设得过小导致步长微弱，乙的学习率设得过大导致每次迈步都要飞跃谷底到对岸
              why: 步长太大才会跨过谷底不断放大乃至溢出 NaN；步长太小则是稳但缓慢下降
            - text: 甲和乙一定是把训练集标签全部清零替换成了空值，这与学习率 $\eta$ 设定毫无关系
              why: 丢掉标签不会自然引发几步指数级抬升 `NaN`，短期翻倍发散与平稳慢降正是学习率过大/过小的典型特征
            - text: 甲应当马上把小批量大小改写成 1，并顺便把当前学习率再放大 100 倍来加速走出谷壁
              why: 这只会加剧震荡发散；解决甲的发散应降低学习率并核对初始化，解决乙应适度调大学习率或换用动量/Adam
          explain: |
            看损失曲线是调深层网络的常用手段：发散报 `NaN` 先降学习率，平稳进展慢则适度提学习率或使用自适应优化器。
      - item:
          id: adam-vs-sgd-advantage
          type: choice
          prompt: |
            对于不同权重维度有的梯度稀疏、有的梯度幅值较大的深层或嵌入网络，Adam 相对统一共享单一学习率的普通 SGD 往往更容易快速上手的原因是什么？
          options:
            - text: Adam 用历史梯度平方滑动平均做分母缩放，为每个参数动态配置自适应步长
              correct: true
            - text: Adam 会在更新阶段自动删除所有高维稀疏列并把全网压缩成 1 维标量参数，免除向量运算
              why: Adam 对参数矩阵中的每个标量权重分别维护一二阶状态向量，参数总数和维数都不减少
            - text: Adam 通过精确计算目标损失的三阶导数，承诺在任何非凸神经网络上都能找到全局最低点
              why: Adam 仅使用一阶梯度及其历史平方统计，在非凸深度学习目标中同样无法承诺全局最优
            - text: 在训练深层模型时，使用 Adam 优化器便不再允许同时配合权重衰减或学习率逐轮调整策略
              why: 现代实践常把解耦权重衰减（AdamW）与学习率递减策略配合使用
          explain: |
            逐分量自适应缩放步长正是 Adam（及 RMSProp）减少繁琐学习率精调、较快获得可用基线的关键特点。

  - id: initialization-hyperparams-vanishing
    chapter: 训练
    title: 激活函数（ReLU vs Sigmoid）、He 初始化与超参数
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            搭好一个 8 层隐藏层的深网络做数字分类，每一层都使用 Sigmoid 激活函数并按标准正态分布随机初始化权重。训练监控显示：靠输出端的那第 8 层权重不断更新，可最靠近输入图片的第 1、第 2 层权重几乎停止不动。深层网络到底卡在哪儿？
          options:
            - text: 从尾向前连乘传播梯度时，每倒退一层都要乘小于等于 0.25 的 Sigmoid 导数，底层梯度衰减趋零
              correct: true
            - text: 因为第 1、第 2 层距离输入层最近，它们在自动求导构建阶段就被默认锁死禁止更新
              why: 所有可训练参数同等参与求梯更新，底层不动是因为传回来的梯度已缩小成极微小量（梯度消失）
            - text: 因为 Sigmoid 函数的输出范围跨度达到百万级别，把前几层权重数值直接算爆溢出
              why: Sigmoid 把信号严格压在 $(0, 1)$ 区间里，导数最大处 $z=0$ 也只有 $0.25$，越往两端饱和区越趋近于 $0$
          explain: |
            理解这一经典的**梯度消失**现象，才能明白现代深层网络改用 **ReLU** 与针对性初始化方差的依据。
      - card:
          title: 为什么放弃 Sigmoid 改用 ReLU，以及梯度不稳定根源
          body: |
            考虑一条串联多个深层的通路：要传到底层第 1 层的更新信号，必须把后面各层权重乘激活导数连续相乘：$\prod_{l} w_{l} \sigma'(z_l)$。
            因为 Sigmoid 导数最大只有 $\sigma'(0) = 0.25$（两端更趋近 0），连乘七八层后梯度按指数级萎缩趋于 0（**梯度消失**）；反之若权重设得过大，连乘也会指数放大成 `NaN`（梯度爆炸）。
            改用分段线性 **ReLU** 函数 $\max(0, z)$：只要 $z > 0$，导数恒等于 **1**，且比较大小计算轻量，又能把负激活归零形成稀疏表示；其它常见优化障碍还包括梯度为 0 的**鞍点**停滞以及尺度未对齐。
      - item:
          id: relu-vs-sigmoid-reasons
          type: choice
          prompt: |
            现代深层网络隐藏层普遍优先用 ReLU（或同类非饱和变体）代替早期的 Sigmoid 激活函数，下列哪一项概括了核心原因？
          options:
            - text: ReLU 在正区间导数恒为 1 缓解梯度连乘衰减消失，且门槛比大小计算更轻量
              correct: true
            - text: Sigmoid 的计算复杂且最大导数高达 100，容易使反向梯度按百的幂次方溢出
              why: Sigmoid 的导数最大值只有 $0.25$ 并在两侧饱和接近 0，主要问题是信号趋近零（梯度消失），而非导数大于 1
            - text: ReLU 是全程处处光滑的纯线性矩阵变换，叠多少层都与单层线性回归完全一致
              why: ReLU 在 $z=0$ 处有清晰的非线性折拐点，多组带偏置的 ReLU 能拼出任意分段线性凸逼近乃至复杂非线形形状
            - text: 只有 Sigmoid 能满足多分类输出和为 1 的约束，而在输出端用 ReLU 永远算不出回归预测
              why: 多类互斥概率归一化是输出端 Softmax 的工作；隐层选 ReLU 核心是为了梯度传播顺畅与高效计算
          explain: |
            正区斜率恒为 1（抗消失）加负半轴截零稀疏与低计算开销，使 ReLU 支撑了更深层次网络的训练。
      - card:
          title: 保持层间方差一致的 He 初始化与超参数策略
          body: |
            随机权重若尺度不当，深层信号不是趋于 `0` 就是指数发散成 `NaN`。对有 $n_{\text{in}}$ 路输入的层，Sigmoid/tanh 原点区常用 Xavier 初始化 $\mathrm{Var}(w) = 1/n_{\text{in}}$；而 **ReLU** 会把约**一半负输入置零**砍半方差能量，故须改用 **He 初始化**：
            $$\mathrm{Var}(w) = \frac{2}{n_{\text{in}}}$$
            乘 `2` 正好补平截半损失以维持各层方差一致。调超参数时应由简到繁：先小模型快跑看学习曲线，再按对数级步进先大范围筛选学习率。
      - card:
          title: 例子：用数值估算体验 Sigmoid 连乘衰减与 He 方差账
          body: |
            设一条 6 层的网络各层权重均接近 $1.0$，比较每层激活全是中心区 Sigmoid（导数 $0.25$）与正区间 ReLU（导数 $1.0$）传到底层的梯度倍数；再验算一段含 $n_{\text{in}} = 200$ 单元的 ReLU 层该给多大的初始标准差。
          reveal:
            - title: 第 1 步：6 层链式连乘后两类激活导数的对比
              body: |
                经过 6 个处于理想工作区的 Sigmoid 单元：$0.25^6 = 1/4096 \approx 0.00024$，传到浅层信号已衰减四千倍以上；一旦偏离原点落入饱和区，乘积会变得更小。换成正激活区的 ReLU 后，$1^6 = 1$，梯度不打折直通到底层。
            - title: 第 2 步：代入 n_in=200 计算 He 初始化的权重方差与标准差
              body: |
                依据 $\mathrm{Var}(w) = \frac{2}{n_{\text{in}}}$：对于输入维数 $n_{\text{in}} = 200$，目标权重方差为 $\frac{2}{200} = 0.01$，对应高斯初始化的标准差就是 $\sqrt{0.01} = 0.1$。前向经过该层加上 ReLU 截半后：输出期望能量 $200 \times 0.01 \times \frac{1}{2} = 1$，激活幅度保持稳定。
      - item:
          id: he-init-variance-calc
          type: number
          prompt: |
            设计一个隐藏层使用 ReLU 激活函数，它的输入来自上一层总共 $n_{\text{in}} = 500$ 个单元。按 **He 初始化**原则设零均值高斯初始权重时，每个权重的目标方差 $\mathrm{Var}(w) = \frac{2}{n_{\text{in}}}$ 应设成多少？
          answer: 0.004
          hint: 计算 $2 / 500$。
          explain: |
            $\mathrm{Var}(w) = 2 / 500 = 0.004$（对应的权重标准差为 $\sqrt{0.004} \approx 0.0632$）；若误用不考虑 ReLU 截半的 $1/500 = 0.002$，逐层信号则会按 $0.5^L$ 逐渐萎缩。
      - item:
          id: he-vs-xavier-why-2
          type: choice
          prompt: |
            同样是为了让各深层的激活值方差既不沿深度增长也不萎缩，为什么面向 ReLU 层的 He 初始化 $\mathrm{Var}(w) = \frac{2}{n_{\text{in}}}$ 要恰好比线性/tanh 的 Xavier 初始化 $\frac{1}{n_{\text{in}}}$ 多出一个分子系数 `2`？
          options:
            - text: ReLU 将约一半负输入置零使方差能量减半，分子乘 `2` 刚好补平以保持各层方差稳定
              correct: true
            - text: 因为 ReLU 每遇到一个负输入就会把对应的连接权重参数自动乘以 2 倍来弥补误差
              why: 权重不会自己乘 2，被置零的是负区神经元输出激活 $a = \max(0, z)$，由此带来方差减半，故需用初始分布方差倍增来抵消
            - text: 因为必须让每层前向方差随着层数按 $2^L$ 指数放大，才能防止浅层信号传不过去
              why: 方差按 $2^L$ 指数扩大会导致激活和梯度溢成 NaN；多乘 2 是为了抵消 ReLU 的 $1/2$ 截断让乘积恰好回到稳定的 `1` 倍
            - text: 这只是为了让实际训练时选用的每个小批量大小都自动放大成原来的 2 倍而设的技巧
              why: 初始化方差只取决于相连层神经元个数 $n_{\text{in}}$ 与激活函数统计特性，与 batch size 无关
          explain: |
            因子 `2` 展示了统计分布分析如何直接指导深层训练的数值稳定性。
      - item:
          id: hyperparam-search-practice
          type: choice
          prompt: |
            开始一个全新视觉识别项目的超参数调优时（需要探索学习率 `lr`、正则化系数和网络宽度），下面哪套工程工作流合理？
          options:
            - text: 先拿精简子集跑通管线，用对数尺度由粗到细优先定位学习率，再看验证集调组合
              correct: true
            - text: 一上来就把学习率按 `0.0011, 0.0012` 细粒度全量跑满三天三夜，跑完再检查管线是否有问题
              why: 先拿小规模简化任务迅速打通并画学习曲线核查（甚至看微数据集能否顺利过拟合），能省掉大量无效等待时间
            - text: 学习率搜索只需要在线性等距网格 `0.10, 0.11, 0.12` 内挑选，禁止跨数量级尝试
              why: 最佳学习率跨度常很大（可能在 `0.0003` 或 `0.3` 之间），先按十倍或对数均匀抽样大范围摸底才有效率
            - text: 一旦测试集拿到了高分就马上回过头来对照测试集分数反复微调隐藏节点个数直到新高
              why: 超参数决策必须只看验证集；若拿着测试集反复挑选就会发生测试集过拟合失真
          explain: |
            由粗到细、先用小基线快速验证管线畅通再放大、对照验证学习曲线优先定位学习率，是常用的调参实践流程。

  # =====================================================================
  # 第 3 章：正则化和深层表示
  # =====================================================================
  - id: regularization-dropout-batchnorm
    chapter: 正则化和深层表示
    title: 深度学习正则化：权重衰减、暂退法、早停与批归一化
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            在隐藏层装了几百万个参数的深层神经网络上，训练集准确率已达到 99.9%，可验证集早就停止提升，最近几十轮甚至开始下降。如果在不缩减网络结构的前提下，训练每一步**随机按一定比例临时关闭一半隐藏神经元**，只让剩下的神经元前向计算与更新，反倒能让测试效果明显改善。这是什么原理？
          options:
            - text: 打破神经元之间脆弱的协同共适应，迫使每个单元独立学出稳定特征，等价于平均众多子网
              correct: true
            - text: 因为每步随机关闭一半神经元之后，参与梯度计算的实际训练样本总数自动翻了十倍
              why: 训练数据集样本数量完全没变；改变的是网内单元彼此之间的共适应习惯
            - text: 因为随机关闭部分神经元能够把训练集上原本非负的平方或交叉熵损失数值强行压缩成负数
              why: 丢弃神经元反而让训练集更难拿满分（抑制了死记硬背），换来验证集和测试集泛化能力提升
          explain: |
            这正是**暂退法（Dropout）**的思路——再加上**权重衰减**、**早停**、数据增强与**批归一化**，构成防过拟合与稳住训练的常用工具组。
      - card:
          title: 权重衰减（L2 正则）、早停与数据增强
          body: |
            神经网络容量高、容易过拟合，常用三项常规正则策略各有侧重：
            - **权重衰减**：在损失函数加上 $\frac{\lambda}{2} \sum w^2$（L2 正则），每次梯度更新等于先把原有权重往零按一定比例缩回一小点，限制模型有效容量；
            - **早停（Early Stopping）**：一边训练一边监测独立验证集误差，一旦验证误差不再下降甚至开始回升，立刻停止并回退保留历史最低验证误差快照；
            - **数据增强**：不改变类别含义的前提下对训练图片做温和裁剪、左右翻转或轻微加噪，低成本扩充训练多样性。
      - item:
          id: weight-decay-update-calc
          type: choice
          prompt: |
            把权重衰减加入小批量更新规则：原本一步梯度下降写为 $w \leftarrow w - \eta g$，加上惩罚 $\frac{\lambda}{2} w^2$ 之后变成 $w \leftarrow (1 - \eta\lambda)w - \eta g$。它直观上对权重做了什么动作？
          options:
            - text: 每次先按因子 $(1 - \eta\lambda)$ 把已有权重朝 0 轻微收缩，无梯度支撑的权重渐渐衰减
              correct: true
            - text: 每次都在执行梯度减法更新之前，先把网络里的全部连接权重故意乘以 $1 + \eta\lambda$ 放大一圈
              why: 减去 $\eta \lambda w$ 相当于先乘一个略小于 1 的数做衰减收缩，所以才叫做“权重衰减”
            - text: 会强制把网络所有隐藏层与输出层神经元的激活输出值都替换并锁定成固定常数 1
              why: 权重衰减作用在连接权重参数 $w$ 上，鼓励权重保持较小幅度而不是无约束增长
            - text: 等价于在每一步读取小批量样本时，把所有训练样本的真实类别标签全部反转正负号
              why: 惩罚项仅取决于模型自身权重模长，不改动输入与标签内容
          explain: |
            权重越大罚得越重、缺乏梯度支撑的冗余权重逐渐趋零——简洁的收缩机制防止高容量网络在后期过度拟合噪声。
      - card:
          title: 暂退法（Dropout）、批归一化（Batch Norm）与分布偏移
          body: |
            - **暂退法**：训练前向时以概率 $p$ 把隐藏单元置 `0`（并用**反向暂退法（Inverted Dropout）**让保留单元除以 `1 - p` 补平期望尺度，推理时全开不缩），打破神经元之间的共适应；
            - **批归一化（Batch Norm / BN）**：按小批量对层间激活减均值除标准差，再乘以可学习的缩放和平移参数 $\gamma, \beta$，稳住各层分布波动并允许较大学习率（推理时切回训练累积的移动平均统计量）；
            - **分布偏移提醒**：上线后若输入特征分布变化，上述正则无法自行解决，须持续监测并重新采集样本微调。
      - card:
          title: 例子：对照训练与推理期的暂退法（Inverted Dropout）缩放账
          body: |
            假设某隐藏层原本输出 4 个神经元激活向量 $h = (2.0, 4.0, 2.0, 8.0)$，求和传给下游权重全是 $1.0$ 时，期望总接收能量为 $16.0$。现在采用暂退概率 $p = 0.5$，训练时随机丢掉了第 2 和第 4 个神经元（只留第 1、3 个）。怎样让训练期与推理全开时的期望信号尺度正好对齐？
          reveal:
            - title: 为什么训练时存活神经元要除以保留率 (1 - p) 放大？
              body: |
                如果训练时不放大，直接放行留存的 $(2.0, 0, 2.0, 0)$，平均只能把原有一半左右（这里 $2 + 2 = 4$，随机平均期望为全开的一半 $8$）的能量传给下一层；等测试部署打开全部 4 个神经元时，下游突然接收到平时训练习惯的两倍能量（$16$），激活尺度发生偏差。
                使用**反向暂退法（Inverted Dropout）**：训练期把留存单元除以保留概率 `1 - p = 0.5`（即乘 2），变为 $(4.0, 0, 4.0, 0)$——它的随机平均期望正好对齐测试阶段全开不放大时的 $16$，测试代码也无需做任何额外乘法。
      - item:
          id: dropout-inverted-calc
          type: number
          prompt: |
            采用流行的反向暂退法（Inverted Dropout），若设置隐藏层暂退丢弃率 $p = 0.2$（即每个单元以 `80%` 概率保留）。某个在当轮训练中被幸运保留下来的激活值原为 `4.0`，按除以保留概率 $1 - p$ 进行期望缩放后，实际继续往后传递的数值变成多少？
          answer: 5
          hint: 保留概率是 $1 - 0.2 = 0.8$，算一算 $4.0 / 0.8$。
          explain: |
            把留存值除以 $1 - 0.2 = 0.8$ 得 $4.0 / 0.8 = 5.0$，恰好让随机丢弃 20% 后的期望激活之和 $(0.8 \times 5 + 0.2 \times 0) = 4.0$ 与测试期全部开启时的期望保持一致。
      - item:
          id: four-reg-techniques-match
          type: match
          prompt: |
            把深度学习中常用的四项防过拟合与稳训技术与各自的核心功能配对。
          pairs:
            - ["暂退法（Dropout）", "训练时随机失活部分神经元，防止单元彼此协同固化"]
            - ["权重衰减（L2）", "惩罚大权重平方和以降低模型有效复杂度"]
            - ["早停（Early Stopping）", "在独立验证误差出现回升拐点时及时叫停并保存最优快照"]
            - ["批归一化（BatchNorm）", "按小批量把层间激活均值和方差拉齐，稳住深层训练并用更大步长"]
          explain: |
            这四者各司其职、经常组合使用：权重衰减约束幅度、暂退打断共适应、早停守住泛化较好时刻、批归一化稳住深层激活尺度。
      - item:
          id: batchnorm-train-vs-eval
          type: choice
          prompt: |
            在网络里装了批归一化（BatchNorm）和暂退法（Dropout）之后，到线上用单条输入做部署推理（`eval` 评估模式）时，这两个组件的行为和训练期（`train` 模式）相比必须切换什么？
          options:
            - text: 推理时停止随机关闭单元，批归一化改用训练期累积的全局移动均值与方差
              correct: true
            - text: 推理时依然每跑一次就随机丢掉一半神经元，这样相同图片连续测十次会给出不同预测概率分布
              why: 线上预测必须确定可靠且启用全部神经元之力（随机丢弃只在训练时抑制共适应），评估期必须关掉 Dropout
            - text: 如果线上一次只输入 1 张测试图片，批归一化也应当只用这 1 张图自己的批方差（0）做标准化除法
              why: 单条样本内部方差是 0 没法除，而且单条推理结果不能受同批其他样本左右，因此部署期必须切回历史移动统计量
            - text: 权重衰减惩罚项会在预测部署阶段每隔一分钟自动清零并继续修改模型连接权重参数
              why: 权重衰减属于训练期优化梯度里的惩罚项，推理部署阶段所有权重均固定只做前向计算
          explain: |
            忘记调用 `model.eval()` 关掉随机丢弃并切换批归一化移动统计量，是深度学习上线翻车最常见的工程错误之一。

  - id: universal-approximation
    chapter: 正则化和深层表示
    title: 万能近似定理与深度几何视角
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            假设只想用“仅有 **1** 个隐藏层”的前馈神经网络去拟合一条在 `[0, 1]` 区间上剧烈起伏的任意复杂波浪曲线 $f(x)$，并且可以自由增加那一层的神经元个数（比如放 1 万个神经元）。理论上仅靠这一层，这条波浪曲线能逼近拟合出来吗？
          options:
            - text: 能：用每对相反斜率的单元拼出不同高度的小阶梯“凸起块”，排满区间即可逼近连续曲线
              correct: true
            - text: 不可能：单隐藏层不管放多少万个神经元，能拼出的图形上限最多只是一个简单的字母 V 字折线
              why: 只需 2 个神经元就能搭出一个“小阶梯凸起块”，放上 $2M$ 个就能并排搭建出 $M$ 个各自不同高低细窄的方块拼起连续波形
            - text: 只有在强制去掉所有隐藏单元的偏置参数 $b$、让每条激活都经过原点时才能逼近波浪线
              why: 没有不同位置的偏置 $b$ 来挪动激活台阶发生的 $x$ 坐标，所有神经元都堆在原点 $x=0$ 处，无法沿整条区间自由摆放小块
          explain: |
            两个神经元配对拼成一个“局部方块台阶”——这正是 Nielsen 第四章用直观几何图景解释**万能近似定理**的方法。
      - card:
          title: 万能近似定理的构造直觉与核心限制
          body: |
            **万能近似定理**证明：仅用单个隐藏层、配足 Sigmoid 或 ReLU **神经元**，前馈网络原则上就能以任意精度逼近有界区间上的任意连续函数。直觉上一正一反两只陡峭台阶可拼出孤立“局部凸起块”，并排拼满即成任意曲线。
            但务必注意两重局限：它只证明理想权重**静态存在**，不保证随机梯度能顺利学到；而且把一切压入单层往往需要随维度指数增长的庞大神经元数量。
      - card:
          title: 例子：用一对反号高斜率神经元造出一个局部矩形方块
          body: |
            看清楚一维怎么造只在区间 $x \in [0.4, 0.6]$ 内凸起高度为 $h = 3.0$ 的阶梯块：设每个隐藏激活近似成阶跃台阶，只动用 **2** 个神经元就能拼出。
          reveal:
            - title: 配对偏置抵消打造孤立小方块与多维扩充
              body: |
                第 1 个神经元设大权重 $w_1 = 1000$、偏置 $b_1 = -400$（台阶升起点落在 $-b_1/w_1 = 0.4$），输出乘权重 $+3.0$；
                第 2 个神经元也设 $w_2 = 1000$、偏置 $b_2 = -600$（台阶落在 $0.6$），输出乘等大反号权重 $-3.0$。
                结果：$x < 0.4$ 时两个都静默为 $0$，合计 $0$；$0.4 < x < 0.6$ 时仅第 1 个亮起，合计输出 $+3.0$；过了 $0.6$ 时第 2 个亮起并加上 $-3.0$ 恰把前者抵消归零。再推至高维：先取 2 对拼一个局部方盒，多放几排即可拟合全图——代价就是单层神经元总数随维度迅速膨胀。
      - item:
          id: bump-step-position-calc
          type: number
          prompt: |
            构造一维局部“凸起方块”时，当隐藏神经元使用很大的陡峭权重 $w = 500$、且想把台阶正好立在横坐标位置 $x = 0.3$ 处（令 $w x + b = 0$），应当把这个神经元的偏置 $b = -w x$ 设成多少？
          answer: -150
          hint: 代入 $-500 \times 0.3$。
          explain: |
            令 $500 \times 0.3 + b = 0$ 解得 $b = -150$；这样台阶一侧紧贴左方归 0，过了 0.3 立刻顶升跃迁。
      - item:
          id: universality-two-caveats
          type: choice
          prompt: |
            既然万能近似定理说“只要单层隐藏层够宽，几乎任意连续函数都能逼近”，为什么现实中的深度学习研究者还是宁愿叠几十上百层网络而不做超级单层大宽表？
          options:
            - text: 该定理仅证明参数存在而非易学、易泛化，且单层常需指数级宽度，远不如深层复用省参
              correct: true
            - text: 因为万能近似定理只对正好等于 $y = 2x + 1$ 的一次斜直线才成立，二次抛物线就失效了
              why: 该定理的威力恰在于它适用于所有有界连续非线形函数（不止直或二次），真正的实际限制在于单层所需的指数宽度与优化泛化开销
            - text: 因为一旦多加第 2 层，网络在数学上反而完全丧失拟合连续函数的能力
              why: 增加隐藏层不会缩水表达家族，相反地通过逐级复合折叠让表达效率和结构归纳偏置剧增
            - text: 因为电脑只能表示单个数字 0 和 1，算不出超过 1000 个神经元的加法
              why: 单隐层可以拼成任何宽度在代码里运行，只是从参数经济性与数据泛化效率来说远不如深度分层抽象划算
          explain: |
            区分“理论能否表达（存在性）”和“需要多少参数/样本且能否学得好（可学习性与样本效率）”是理解深网络架构分水岭的必修课。
      - item:
          id: relu-universality-note
          type: choice
          prompt: |
            万能近似定理最初是用平滑 S 型函数论证的，如果把隐藏单元全换成 ReLU 函数 $\max(0, z)$，这个定理还成立吗？背后怎么把两个 ReLU 凑出平滑凸包/方块？
          options:
            - text: 依然成立：用不同折点和相反斜率的 ReLU 射线加减组合出封闭三角凸峰并拼接任意连续曲线
              correct: true
            - text: 不成立，因为 ReLU 在正半轴上是直的，所以不管多少个 ReLU 相加依然永远只是一根斜直线
              why: 两个不同起折点 $x_1 < x_2$、正反相减的 ReLU 合起来在中间形成弯折平坡/凸峰，多组组合照样能拟合连续曲线
            - text: 只有在强制要求输入与输出全部为负整数时，ReLU 前馈网络才满足万能近似构造性质
              why: 搭配不同正负输出权重后，ReLU 组合的线性加权和可以取任意实数值覆盖有界连续曲线
            - text: Sigmoid 能近似任意函数纯粹是因为 $\sigma(z)$ 自带正弦波那样的无限周期震荡高频性质
              why: Sigmoid 本身单调不周期，靠的是不同偏置位置的单向台阶相减变成局域矩形凸块，与周期无关
          explain: |
            “台阶（Sigmoid）拼方块”换成“射线（ReLU）拼折线凸峰”，万能近似逻辑在现代 ReLU 网络中依然成立。
      - item:
          id: single-wide-overfit-risk
          type: choice
          prompt: |
            用肥大的单隐层网络强行拼出上万个互不相干的小“局部凸起盒”去逼近真实分类规律，面对有限训练样本时最大缺点是什么？
          options:
            - text: 各个局部盒之间不共享抽象特征，在未见过的测试空隙区缺乏外推依据，很耗样本且易过拟合
              correct: true
            - text: 把单个隐藏层宽度扩大一万倍以后，反而会让模型可训练总参数数量急剧下降到只剩 3 个
              why: 参数个数会随着隐藏单元数量显著增加，不会下降
            - text: 宽单层网络会在每次前向推理之后自动把训练集拆成 10 折交叉验证重新训练
              why: 网络尺寸与模型训练验证评估划分机制毫无关系
            - text: 像素级局部小盒自带空间平移不变性，能在图片任意角落精准泛化识别目标物体
              why: 全连接像素局部盒记住了固定像素位置，物体平移几个像素就得重新分配位置记忆，而带来平移空间复用的正是卷积结构
          explain: |
            理解局部拼盒的碎片化局限，就知道为什么面对图片、语音等有空间/时间局部结构的数据需要权重共享与层级卷积架构。

  - id: cnn-deep-representations
    chapter: 正则化和深层表示
    title: 卷积神经网络（CNN）、局部共享与深层视觉表示
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            用全连接网络处理一张 `256×256` 的高清彩色照片，光输入展平就有将近 20 万个像素，要是连向下一层 `1000` 个单元，第一层就要耗费 **2 亿个独立权重**。而且在左上角学会认一只“猫耳朵”后，猫耳朵挪到照片右下角，全连接网络却像第一次见到一样得重新学。视觉识别网络怎样改造连接结构来解决这两大难题？
          options:
            - text: 每个单元只看局部小窗口（局部感受野），并用同一套小卷积核权重复用扫遍全图
              correct: true
            - text: 把每张输入照片都强行裁剪只留下正中间 `1×1` 一个像素点，把周边全部多余像素直接丢弃
              why: 只留单个像素会丢失全部纹理和形状结构，我们需要的是用小窗口扫描整幅全图的局部结构关系
            - text: 让每个隐藏层必须比上一层多增加上百倍全连接权重参数，从而保证全图每像素全覆连接
              why: 参数继续爆炸只会既难训练又容易记死训练样本过拟合，解决视觉问题的钥匙在于稀疏局部连接与权重空间共享
          explain: |
            这就是**卷积神经网络（CNN）**的核心设计：局部感受野、空间权重共享，再加上压缩空间并抗微移的**池化**缩放。
      - card:
          title: CNN 三大组件：局部感受野、共享卷积核与池化
          body: |
            **卷积神经网络（CNN）**针对空间网格数据设计三大机制：
            - **局部感受野与共享卷积核**：每个单元只扫一小片窗口（如 `3×3` 或 `5×5`），整张图各处共用一套卷积核权重与偏置，极大省参且自带平移等变性；
            - **多特征通道**：可并行配置多个不同共享滤波器各自捕捉边线或纹理；
            - **池化**：如 `2×2` 最大池化从相邻 4 格取最大值压缩空间，算力折减四倍并一定程度上抵抗局部微移。
      - card:
          title: 例子：算清 28×28 输入经 5×5 卷积与 2×2 池化的大小与参数账
          body: |
            假设一张经典 `28×28` 单通道灰度图，先送进一个无边界填充（valid）的 `5×5` 共享卷积层（共配有 `20` 个独立特征映射/卷积核），输出接一次步长为 2 的 `2×2` 最大池化，再对比传统全连接省了多少参数？
          reveal:
            - title: 第 1 步：算输出特征图尺寸与池化后大小
              body: |
                宽或高为 $28$ 的网格用无填充 `5×5` 窗口每次走 1 格滑动，一共能滑出 $28 - 5 + 1 = 24$ 个合法位置，得到 `20` 张 `24×24` 的特征图。
                紧接着经过不重叠的步长 2、窗口 `2×2` 最大池化后，每张图边长直接折半：$24 / 2 = 12$，变成 `20` 张 `12×12` 的浓缩特征图。
            - title: 第 2 步：比比参数量的巨大差异
              body: |
                每个 `5×5` 卷积核只有 $5 \times 5 = 25$ 个权重加 $1$ 个偏置 $= 26$ 个参数。哪怕配足 `20` 个卷积核全图扫描这 `20 × 24 × 24 = 11520` 个卷积激活输出，总共也只需要 $20 \times (25 + 1) = 520$ 个参数。如果用等价的密集全连接直连，光同样宽度的隐层就需要超过 $784 \times 11520 \approx 900$ 万个参数——相差超过一万倍。
      - item:
          id: conv-output-size-and-params
          type: number
          prompt: |
            设一张 `10×10` 的单通道灰度网格，使用 `3×3` 的卷积核（无填充、步长为 `1`）一共配置了 `4` 个不同的独立共享特征滤波器（各自配 1 个偏置），请问这整个卷积层加起来一共有多少个可学习参数（权重与偏置合计）？
          answer: 40
          hint: 每个 `3×3` 核有 $3\times 3 = 9$ 个权重加 1 个偏置，再乘以滤波器总数 4。
          explain: |
            每个滤波器含 $3\times 3 + 1 = 10$ 个参数，全图滑窗共享这套参数（与图尺寸 10×10 无关），因此 4 个滤波器合计仅有 $4 \times 10 = 40$ 个参数。
      - card:
          title: 深度学习视觉层次表示与现代深层扩展
          body: |
            可视化训练好的多层卷积特征图时呈现明显规律：最浅的第 1 层滤波器自发长出了水平/斜线边缘检测器；第 2 层把边缘组合成眼角、车轮或圆弧部件；越往后层感受野越宽广，最终组装出整张狗脸、汽车或文字语义，最后常接全连接层配合暂退法和交叉熵分类（以及如残差网络 **ResNet** 的跳跃连接跨层转发信息，以便训练上百层）。其他主流深网还包括擅长序列记忆的循环神经网络（**RNN**）和靠自注意力长距离关联的现代架构。
      - item:
          id: cnn-weight-sharing-reason
          type: choice
          prompt: |
            卷积层里让同一张输出特征图上的所有空间位置**共享完全相同的卷积核权重**，除了把参数量大幅降低外，还赋予了视觉模型什么核心结构优势？
          options:
            - text: 同一特征无论出现在画面左上还是右下角，都能用同一套权重识别，自带平移等变性
              correct: true
            - text: 空间权重共享会强迫整张输入照片上所有像素不管明暗色彩如何变化都输出一个相同的常数值
              why: 不同的滑窗位置依然结合自己覆盖下的局部像素产出各自局部响应值，共享的是规则（权重）而非抹平输入内容
            - text: 共享卷积核可以让网络不再需要激活函数、池化层或任何正则化就能直接区分 1000 类高精度自然照片
              why: 现代 CNN 仍须用 ReLU 等非线性激活串联多层卷积及正则才能抽取出复杂高级语义
            - text: 只要在输入端用上一个 `3×3` 卷积核，不需要梯度下降训练也能直接凭初始随机数获得 100% 验证准确率
              why: 卷积核内具体权重（如横线竖线还是圆形边缘）仍需借助梯度训练一步步从数据里学出来
          explain: |
            局部假设（相邻像素强相关）加平移共享先验（猫耳在哪都长得像猫耳），是深层卷积处理高维图片的根基。
      - item:
          id: max-pool-size-calc
          type: number
          prompt: |
            一张 `24×24` 的特征图进入窗口大小 `2×2`、步长为 `2`（互不重叠分块）的最大池化层压缩后，输出新特征图的单边边长变成多少像素？
          answer: 12
          hint: 步长 2 的 `2×2` 块每两个紧邻格取最大并成 1 格，边长 $24 / 2$。
          explain: |
            `2×2` 不重叠网格把宽和高各自压缩为 $24/2 = 12$，网格总数降至 $12\times 12 = 144$（压缩到四分之一）。
      - item:
          id: cnn-feature-hierarchy
          type: choice
          prompt: |
            用深度多层卷积神经网络做自然图片多物体识别，观察从第 1 层到最后一层学到的中间神经元响应特征，下面哪项演变规律一致被观察到？
          options:
            - text: 浅层捕捉边线角点纹理，中层组合成局部轮廓部件，深层则稳定响应整只宠物或具体语义
              correct: true
            - text: 第 1 层就直接识别出“正在奔跑的牧羊犬”全局概念，而越往深层越退化成只看单个独立像素点
              why: 感受野从小到大、抽象粒度由底层边缘纹理逐级拼合升华为复杂全局语义，这才是分层表示学习的真实规律
            - text: 批归一化和 ReLU 只能在全连接层里使用，卷积层后面如果接 ReLU 会破坏二维图像结构
              why: 卷积层算完后同样必须紧接 ReLU（与常用 BatchNorm），否则多层线性卷积合起来只等效于单层大卷积核
            - text: 所有不同空间的二维卷积特征图无需经过池化压缩、展平或全局池化，就能直接等同于单个分类标签
              why: 卷积产出二维空间网格图，必须经池化压缩、展平或全局平均池化汇入分类输出层给出类别分数
          explain: |
            “像素 → 局部边缘 → 零部件 → 全局高层概念”的渐进层次抽象，正是深度表示学习区别于手工特征工程的思路。

  # =====================================================================
  # 第 4 章：反向传播
  # =====================================================================
  - id: backprop-computation-graph
    chapter: 反向传播
    title: 前向矩阵、计算图与反向传播直觉
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            假设一套深网络有 100 万个连接权重，如果想知道“把其中第 54321 号权重微微拨动 $\varepsilon = 0.0001$ 会对最终损失产生多大改变（即它的偏导数）”，数值近似法要按 100 万个权重**逐个微扰并重跑一遍全网前向预测**，即重算一百万遍前向。为什么真实训练只需 1 趟前向加 1 趟从尾到头的回传，就能一次性算完全部梯度？
          options:
            - text: 按计算图用链式法则从输出往回传误差信号，前层复用后层结果，免去重复计算后缀通路
              correct: true
            - text: 因为框架每步只在最后几个输出层里随机抽样算出 5 个权重梯度，其余 99 万多个参数不再求导
              why: 全部一百万个可训练参数都会被算清各自精确偏导，一趟回传就能一次全部得到
            - text: 因为正则化项把激活函数导数全部消除了，全网一百万个参数的偏导数在数学上完全相等
              why: 每个参数连接不同的特征边与上层敏感度，它们各自的梯度互不相等且都能通过动态规划复用路径一次性求出来
          explain: |
            利用计算图和微积分链式法则“从果溯因、逐层复用公共中间灵敏度”的高效过程，正是**反向传播（Backpropagation）**。
      - card:
          title: 前向矩阵标记、成本两条假设与 Hadamard 积
          body: |
            先统一符号：记第 $l$ 层输入加权总和为 $\mathbf{z}^l = \mathbf{W}^l \mathbf{a}^{l-1} + \mathbf{b}^l$，过逐项激活得该层输出 $\mathbf{a}^l = \sigma(\mathbf{z}^l)$（约定 $\mathbf{a}^0 = \mathbf{x}$）。
            为让单样本回传自然汇总成批平均，损失函数 $C$ 需满足两条假设：第一，总代价写成**每个训练样本代价的平均值** $C = \frac{1}{n}\sum_x C_x$；第二，每个样本代价 $C_x$ **仅取决于网络最终一层激活输出** $\mathbf{a}^L$。
            推导中常把两个同形状向量对应坐标相乘，记作 **Hadamard 积**（逐分量相乘） $\mathbf{s} \odot \mathbf{t}$（例如 $(1, 2)^\top \odot (3, 4)^\top = (3, 8)^\top$）。
      - item:
          id: cost-two-assumptions-choice
          type: choice
          prompt: |
            推导出标准单样本反向传播公式并扩展成小批量平均时，为什么要求代价函数 $C$ 满足“能写成所有样本代价均值 $\frac{1}{n}\sum_x C_x$”以及“$C_x$ 只写成输出激活 $\mathbf{a}^L$ 的函数”？
          options:
            - text: 样本均值使总梯度等于单样本梯度平均；只取决于 $\mathbf{a}^L$ 让回传从末尾层统一起步
              correct: true
            - text: 因为只要把损失函数写成各样本代价的平均数，网络在计算图阶段就不再需要做前向传播运算
              why: 依然需要每个样本通过网络完成前向计算得到各自 $\mathbf{a}^L$，这两条规则保证求导能按“单样本算出再取均、且仅在终点启动回传链条”模块化进行
            - text: 如果代价函数不写成输出激活的函数，线性代数里就根本没法对第 $l$ 层的连接矩阵求转置
              why: 矩阵转置只取决于相邻两层维度连接，这里讨论的是把局部单步计算图模块化对接的起点条件
            - text: 这两条结构假设的作用是确保任意模型在第 1 个轮次结束时验证集准确率都严格大于 99%
              why: 损失结构假设用来支撑合法微分和单样本平均梯度算子，不决定具体任务难易或模型测试成绩上限
          explain: |
            加上 L2 权重衰减项时虽额外涉及权重本身，只需在最后一步给 $\partial C/\partial W$ 单独添上 $\lambda W$ 即可兼容。
      - card:
          title: 计算图视角与反向传播的核心中间量 δˡ
          body: |
            画成**计算图**看清每步连接：每条权重、输入节点流向中间加权 $\mathbf{z}^l$ 再流向 $\mathbf{a}^l$ 直到代价 $C$。为了避免重复写冗长的链式展开，定义第 $l$ 层神经元的**误差敏感度（简称误差项）** $\delta^l_j$ 为“微调第 $l$ 层第 $j$ 个单元加权输入 $z^l_j$ 时，最终代价 $C$ 的变化率”：
            $$\delta^l_j \equiv \frac{\partial C}{\partial z^l_j}$$
            只要知道每层神经元的敏感度 $\boldsymbol{\delta}^l$，该层每个权重和偏置的偏导就能直接读出——这种以 $\boldsymbol{\delta}^l$ 为接力棒、先算终点误差再倒推前层的机制，就是**反向传播**的核心。
      - card:
          title: 例子：体验简单计算图上的乘加前向值与 Hadamard 乘
          body: |
            计算图中节点串联：先在末层算出输出对激活敏感度向量 $\nabla_{\mathbf{a}} C = (-4.0,\ 6.0)^\top$，而该层神经元在工作点处的激活导数向量为 $\sigma'(\mathbf{z}^L) = (0.5,\ 0.2)^\top$。对比两维向量的内积与 Hadamard 逐分量乘有什么不同？
          reveal:
            - title: 点积给出标量，Hadamard 积精确保留每个神经元自己的位置敏感度
              body: |
                点积 $(-4.0)\times 0.5 + 6.0\times 0.2 = -0.8$ 把所有神经元合成单个标量，分不清各个通道的误差贡献；
                而 **Hadamard 逐分量乘积** $(-4.0,\ 6.0)^\top \odot (0.5,\ 0.2)^\top = (-2.0,\ 1.2)^\top$ 则明确给出第 1 个输出神经元灵敏度是 `-2.0`，第 2 个输出神经元灵敏度是 `+1.2`。
      - item:
          id: hadamard-product-calc
          type: number
          prompt: |
            设第 $L$ 层对激活的偏导向量为 $\mathbf{s} = (3, -5, 2)^\top$，该层逐分量激活导数向量为 $\mathbf{t} = (0.4, 0.2, 0.0)^\top$。算得两者 **Hadamard 积** $\boldsymbol{\delta}^L = \mathbf{s} \odot \mathbf{t}$ 后，结果的**第一个分量**（第 1 个神经元的误差敏感度）等于多少？
          answer: 1.2
          hint: Hadamard 积是相同下标对应坐标各自相乘，第一个分量等于 $s_1 \cdot t_1$。
          explain: |
            $(3, -5, 2)^\top \odot (0.4, 0.2, 0.0)^\top = (1.2, -1.0, 0.0)^\top$，第 1 个分量为 $3 \times 0.4 = 1.2$（第 3 项因导数为 0 而归零）。
      - item:
          id: forward-layer-dims-calc
          type: number
          prompt: |
            在矩阵写法 $\mathbf{z}^l = \mathbf{W}^l \mathbf{a}^{l-1} + \mathbf{b}^l$ 中，若上一层激活向量 $\mathbf{a}^{l-1}$ 有 `4` 个单元，当前第 $l$ 层要输出 `3` 个单元（即 $\mathbf{z}^l$ 维数为 `3`）。权重矩阵 $\mathbf{W}^l$ 一共有多少个矩阵权重数值（行×列）？
          answer: 12
          hint: 要把 4 维向量乘出 3 维向量，矩阵尺寸是 $3 \times 4$。
          explain: |
            按列向量前向记法，$\mathbf{W}^l$ 的第 $j$ 行对应当前层第 $j$ 个神经元连向前层 $k$ 个单元的权重，尺寸为 $3 \times 4$，共 $12$ 个权重数值。
      - item:
          id: delta-definition-choice
          type: choice
          prompt: |
            在推导反向传播过程时，把第 $l$ 层每个神经元的误差敏感度定义为 $\delta^l_j \equiv \frac{\partial C}{\partial z^l_j}$（对加权和而非直接对激活值求导），这样设定的主要便利是什么？
          options:
            - text: 算出 $\delta^l_j$ 后，只需再乘 `1` 或前层激活 $a_k$ 就能直接写出偏置与权重梯度
              correct: true
            - text: 因为加权和误差敏感度 $\delta^l_j$ 在整个网络的所有隐藏层里被强制锁定等于固定常数 0
              why: 如果 $\delta$ 全为 0 就没有参数能更新，定义它的目的是先吸收当层的 $\sigma'(z^l)$，再简洁传出权重与偏置梯度
            - text: 因为对线性净输入 $z^l$ 求偏导在代数上等价于跳过网络末尾损失层直接篡改训练样本真实标签
              why: $z^l$ 是节点进入非线性激活前的线性汇总，用它作为中间量让链式求导更紧凑
            - text: 只要改用 $\delta^l$ 作中间量，整个多层网络求梯度就可以绕开微积分链式法则直接猜结果
              why: 整套递推关系恰好是多元微积分链式法则在不同层之间逐步接力的结果
          explain: |
            选对了接力中间量 $\delta^l = \partial C / \partial z^l$，多层网络的梯度求解就简化为四条整齐的矩阵方程。

  - id: backprop-four-equations
    chapter: 反向传播
    title: 反向传播四大基本方程与手算完整前后向
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            假设已经知道了后一层（第 $l+1$ 层）各神经元的误差敏感度向量 $\boldsymbol{\delta}^{l+1}$。现在想倒推回来算出紧邻它前面的第 $l$ 层敏感度 $\boldsymbol{\delta}^l$：前向传递时是乘着权重矩阵 $\mathbf{W}^{l+1}$ 从第 $l$ 层向前传；那么误差信号从右往左回传第 $l$ 层时，应当怎么沿矩阵反向传递？
          options:
            - text: 乘权重矩阵的转置 $(\mathbf{W}^{l+1})^\top$ 拉回前层，再逐分量乘第 $l$ 层激活导数 $\sigma'(\mathbf{z}^l)$
              correct: true
            - text: 直接照抄前向阶段的做法、乘一次未转置的原矩阵 $\mathbf{W}^l$ 就行，无需再乘当前层激活导数
              why: 前向矩阵是 $(n_{l+1} \times n_l)$，不转置连矩阵乘法的维度都与长度 $n_{l+1}$ 的误差向量 $\boldsymbol{\delta}^{l+1}$ 对不上；且过激活节点时必须乘本地导数 $\sigma'(z^l)$
            - text: 把后续所有层的权重矩阵全部先求出逆矩阵 $(\mathbf{W}^{l+1})^{-1}$，再用逆矩阵来求解每层灵敏度
              why: 网络每层神经元数量常不同，矩阵一般不是方阵也不可逆；链式求导自然给出转置乘法 $(\mathbf{W}^{l+1})^\top$
          explain: |
            前向乘 $\mathbf{W}$，反向乘 $\mathbf{W}^\top$ 再逐分量乘激活导数——这是计算图链式法则的直接结果。
      - card:
          title: 反向传播四大基本方程（BP1–BP4）
          body: |
            根据多元微积分链式法则与上节符号，全连接前馈网络的梯度计算可概括为四个方程：
            1. **输出层误差（BP1）**：$\boldsymbol{\delta}^L = \nabla_{\mathbf{a}} C \odot \sigma'(\mathbf{z}^L)$（若为二次损失 $\frac{1}{2}\|\mathbf{a}^L - \mathbf{y}\|_2^2$，则 $\nabla_{\mathbf{a}} C = \mathbf{a}^L - \mathbf{y}$）；
            2. **逐层回传误差（BP2）**：$\boldsymbol{\delta}^l = \bigl((\mathbf{W}^{l+1})^\top \boldsymbol{\delta}^{l+1}\bigr) \odot \sigma'(\mathbf{z}^l)$；
            3. **偏置变化率（BP3）**：$\frac{\partial C}{\partial b^l_j} = \delta^l_j$（偏置梯度就等于该神经元的敏感度）；
            4. **权重变化率（BP4）**：$\frac{\partial C}{\partial w^l_{jk}} = a^{l-1}_k \delta^l_j$，矩阵外积记为 $\nabla_{\mathbf{W}^l} C = \boldsymbol{\delta}^l (\mathbf{a}^{l-1})^\top$。
      - card:
          title: 例子：完整手算两层 ReLU 网络的前向传播与反向传播
          body: |
            设一个两层网络：隐藏层 2 个 ReLU 单元 $\mathbf{h} = \mathrm{ReLU}(\mathbf{W}_1 \mathbf{x} + \mathbf{b}_1)$，输出标量 $\hat{y} = \mathbf{w}_2^\top \mathbf{h} + b_2$，损失 $L = \frac{1}{2}(\hat{y} - y)^2$。
            取 $\mathbf{x} = (1, 2)^\top, y = 1$，$\mathbf{W}_1 = \begin{pmatrix} 1 & -1 \\ 0.5 & 1 \end{pmatrix}, \mathbf{b}_1 = \begin{pmatrix} 0 \\ 0 \end{pmatrix}$，$\mathbf{w}_2 = (1, -2)^\top, b_2 = 0.5$。算出前向与全网梯度。
          reveal:
            - title: 第 1 步：前向计算 z、h、ŷ 与损失 L
              body: |
                计算隐层线性加权 $\mathbf{z} = \mathbf{W}_1\mathbf{x} = \begin{pmatrix} 1\cdot 1 + (-1)\cdot 2 \\ 0.5\cdot 1 + 1\cdot 2 \end{pmatrix} = \begin{pmatrix} -1 \\ 2.5 \end{pmatrix}$。
                经过 $\mathrm{ReLU}(t) = \max(0, t)$ 得隐藏激活 $\mathbf{h} = (0,\ 2.5)^\top$（第 1 个单元归零）。
                线性输出 $\hat{y} = 1\times 0 + (-2)\times 2.5 + 0.5 = -4.5$，最终损失 $L = \frac{1}{2}(-4.5 - 1)^2 = \frac{1}{2}(-5.5)^2 = 15.125$。
            - title: 第 2 步：沿 BP1–BP4 反向求全部权重与偏置梯度
              body: |
                输出线性端梯度 $\delta_2 = \frac{\partial L}{\partial \hat{y}} = \hat{y} - y = -5.5$。
                直接读出第二层梯度：$\frac{\partial L}{\partial b_2} = -5.5$，$\frac{\partial L}{\partial \mathbf{w}_2} = \delta_2 \mathbf{h} = -5.5 \times (0, 2.5)^\top = (0,\ -13.75)^\top$。
                再用 BP2 倒回隐层激活 $\frac{\partial L}{\partial \mathbf{h}} = \delta_2 \mathbf{w}_2 = (-5.5,\ 11)^\top$，Hadamard 乘 ReLU 导数（在 $z_1 = -1$ 处为 `0`，在 $z_2 = 2.5$ 处为 `1`）：$\boldsymbol{\delta}_1 = (0,\ 11)^\top$。
                最后由 BP4 外积得第一层权重梯度：$\frac{\partial L}{\partial \mathbf{W}_1} = \boldsymbol{\delta}_1 \mathbf{x}^\top = \begin{pmatrix} 0 \\ 11 \end{pmatrix} (1\ \ 2) = \begin{pmatrix} 0 & 0 \\ 11 & 22 \end{pmatrix}$。
      - item:
          id: manual-fwd-loss-calc
          type: number
          prompt: |
            已知两层 ReLU 网络中，输入 $\mathbf{x}=(1,2)^\top$、真值 $y=1$，参数 $\mathbf{W}_1=\begin{pmatrix}1&-1\\0.5&1\end{pmatrix}, \mathbf{b}_1=\mathbf{0}, \mathbf{w}_2=(1,-2)^\top, b_2=0.5$，采用损失 $L=\frac{1}{2}(\hat{y}-y)^2$。经过前向计算得出隐层 $\mathbf{h}=(0, 2.5)^\top$ 与预测值 $\hat{y} = -4.5$，该样本的最终标量损失 $L$ 等于多少？
          answer: 15.125
          hint: 计算 $\frac{1}{2}(-4.5 - 1)^2$。
          explain: |
            误差 $\hat{y} - y = -5.5$，平方为 $30.25$，乘以 $\frac{1}{2}$ 得 $L = 15.125$。
      - item:
          id: manual-bwd-w2-grad
          type: number
          prompt: |
            某两层 ReLU 网络算得隐藏激活为 $\mathbf{h} = (0, 2.5)^\top$、线性输出误差 $\frac{\partial L}{\partial \hat{y}} = \hat{y} - y = -5.5$（其中标量输出 $\hat{y} = \mathbf{w}_2^\top \mathbf{h} + b_2$）。由公式 $\frac{\partial L}{\partial \mathbf{w}_2} = \frac{\partial L}{\partial \hat{y}} \cdot \mathbf{h}$，第二层第二个权重 $w_{2,2}$（对应乘在 $h_2 = 2.5$ 上）的偏导数梯度是多少？
          answer: -13.75
          hint: 计算 $(-5.5) \times 2.5$。
          explain: |
            由方程 BP4：$\frac{\partial L}{\partial w_{2,2}} = a_2 \delta_2 = 2.5 \times (-5.5) = -13.75$（而对应已失活 $h_1 = 0$ 的第一条连线梯度为 $0$）。
      - item:
          id: manual-bwd-w1-grad
          type: number
          prompt: |
            在两层 ReLU 网络（$\mathbf{h} = \mathrm{ReLU}(\mathbf{W}_1 \mathbf{x})$）中，已知 $\frac{\partial L}{\partial \mathbf{h}} = (-5.5, 11)^\top$，ReLU 隐层加权和为 $z_1 = -1$、$z_2 = 2.5$，输入 $\mathbf{x} = (1, 2)^\top$。依据 $\frac{\partial L}{\partial W_{1, 22}} = \delta_{1, 2} \cdot x_2$，第一层权重矩阵右下角项 $W_{1, 22}$（第 2 单元连第 2 输入 $x_2$）的梯度是多少？
          answer: 22
          hint: 在 $z_2 = 2.5 > 0$ 处 ReLU 导数为 `1`，所以 $\delta_{1,2} = 11 \times 1 = 11$，再乘上前端输入 $x_2 = 2$。
          explain: |
            先通过 ReLU 局部导数得 $\boldsymbol{\delta}_1 = (0, 11)^\top$（第一行被 $-1 < 0$ 的 ReLU 截断清零），然后乘输入 $x_2 = 2$ 即得 $11 \times 2 = 22$（整个梯度矩阵就是 $\begin{pmatrix} 0 & 0 \\ 11 & 22 \end{pmatrix}$）。
      - item:
          id: four-equations-match
          type: match
          prompt: |
            把反向传播四大基本方程各自的数学公式与含义配对起来。
          pairs:
            - ["δᴸ = ∇ₐC ⊙ σ'(zᴸ)", "在输出端算出最终误差敏感度起点（BP1）"]
            - ["δˡ = ((Wˡ⁺¹)ᵀδˡ⁺¹) ⊙ σ'(zˡ)", "沿着权重转置由后向前传递误差敏感度（BP2）"]
            - ["∂C/∂bˡⱼ = δˡⱼ", "偏置的梯度直接就等于本神经元自身敏感度（BP3）"]
            - ["∂C/∂wˡⱼₖ = aˡ⁻¹ₖ · δˡⱼ", "某条连线的权重梯度等于入口激活乘出口敏感度（BP4）"]
          explain: |
            “入口激活值 × 出口误差敏感度”就是权重梯度，“后层误差 × 转置矩阵 × 本地激活导数”就是逐层回传。

  - id: backprop-speed-and-pytorch-loop
    chapter: 反向传播
    title: 反向传播复杂度、自动微分与 PyTorch 训练循环
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            大模型参数常达几十亿个，却能顺畅地逐轮更新权重。要是每次算梯度都像逐个数值差分那样每调一个权重跑一遍全网前向计算（共 $W$ 遍全网计算），那跑完**仅仅 1 步**参数更新就慢到不可实用。反向传播凭什么把计算全网梯度的代价压到和算一次前向预测接近？
          options:
            - text: 一次前向缓存中间激活，再用差不多等长的一次反向扫描同时算出全部参数梯度
              correct: true
            - text: 因为现代框架每步只随随便便挑出排最前面的 5 个权重更新，剩下 99.9% 参数不再计算偏导
              why: 现代反向传播同步给出了全部 100% 参数各自精确的偏导数梯度
            - text: 因为反向传播完全不需要内存留存前向传播算出来的任何中间激活张量或局部数值记录
              why: 恰恰是用适度空间记录前向中间激活与激活导数（以空间换时间），才能让反向扫描不必重复前向计算整个图
          explain: |
            前向 $O(W)$ 算一次预测，反向 $O(W)$ 算齐所有梯度——正是这一复杂度改善（反向模式自动微分）支撑了大规模训练。
      - card:
          title: 为什么算全网梯度只要一次前向加一次反向，以及执行追踪
          body: |
            从“只有 1 个标量损失 $L$、却需要同时对几百万上亿个权重求偏导（多对一结构）”的角度看，反向模式自动微分的效率优势显著：
            - **逐个数值差分**：为每个权重扰动重跑一次前向需要 $W$ 趟计算，总开销是 $O(W^2)$，难以用于大模型；
            - **反向传播（Backprop）**：1 趟前向保留各层净输入 $\mathbf{z}^l$ 与激活 $\mathbf{a}^l$；再 1 趟倒序经过每个矩阵与逐分量乘累加（总计仅相当于约 2 趟前向的计算代价 $O(W)$），**一口气同时给出所有权重与偏置的梯度**；代价只是在正向期间暂存中间激活以供回传外积乘法取用。
      - card:
          title: 例子：Python 追踪单个支路的前反向与 PyTorch 五步循环
          body: |
            把前面两层网络第 2 个激活支路写成简短 Python 看每行怎算梯度；而在真实框架（如 **PyTorch**）里，你不用自己手写导数方程，框架自动建**计算图**，标准的五步训练骨架如下：
            ```python
            for xb, yb in train_loader:
                opt.zero_grad()          # 第 1 步：清空上一步残留在 .grad 里的梯度
                loss = loss_fn(model(xb), yb)  # 第 2–3 步：前向输出 + 算损失
                loss.backward()          # 第 4 步：自动沿计算图反向传播算全部梯度
                opt.step()               # 第 5 步：优化器按设定规则迈出更新步
            ```
          reveal:
            - title: 为什么每一步前面都不能忘掉 optimizer.zero_grad()？
              body: |
                为了方便多小批量累加梯度以模拟超大批量（梯度累积技巧），PyTorch 默认在每次调用 `.backward()` 时把新算出的梯度**累加（`+=`）**到张量现有的 `.grad` 属性上，而不是覆盖清零。
                如果忘了先运行 `opt.zero_grad()`，第 2 步的梯度就会把第 1 步的历史旧梯度掺进去一起累加，导致更新方向扭曲失准。
      - item:
          id: autograd-trace-sim
          type: sim
          sim: trace
          prompt: 先手推再看程序如何实现上一课两层 ReLU 神经元支路的一趟前向加反向（对应 $z_2 = 0.5 x_1 + x_2$ 支路）：算完第 4 行 `yhat`、第 7 行 `d_w22` 与第 8 行 `d_W21` 各自等于多少？
          params:
            code: |
              x1, x2 = 1.0, 2.0
              z2 = 0.5 * x1 + 1.0 * x2
              h2 = z2 if z2 > 0 else 0.0
              yhat = -2.0 * h2 + 0.5
              err = yhat - 1.0
              loss = 0.5 * err * err
              d_w22 = err * h2
              d_W21 = (err * (-2.0)) * x1
              print(yhat, d_w22, d_W21)
          goal:
            ask:
              - { line: 4, var: yhat }
              - { line: 7, var: d_w22 }
              - { line: 8, var: d_W21 }
          explain: |
            正向前四行一步步算出 $z_2=2.5, h_2=2.5, \hat{y} = -4.5$；第 5 行得 $\text{err} = -5.5$，随后第 7 行读出 $\partial L/\partial w_{2,2} = -5.5\times 2.5 = -13.75$，第 8 行复用 `err` 倒推得 $\partial L/\partial W_{1, 21} = 11.0\times 1.0 = 11.0$。
      - item:
          id: pytorch-loop-order
          type: order
          prompt: |
            把一个标准 PyTorch 小批量梯度训练步内部的五个动作按正确的从上到下执行顺序排好（假设已经取到了当前这一批数据 `xb, yb`）。
          steps:
            - "清空参数上遗留的旧梯度：opt.zero_grad()"
            - "做一次前向计算获得预测结果：preds = model(xb)"
            - "计算当前批次平均标量损失：loss = loss_fn(preds, yb)"
            - "沿计算图反向传播求齐所有参数梯度：loss.backward()"
            - "按优化器规则修改网络权重完成一步更新：opt.step()"
          explain: |
            口诀：清旧账（`zero_grad`） → 前向算分与损失 → 反向求导（`backward`） → 改权重（`step`）；漏步或颠倒顺序就会使更新失效。
      - item:
          id: zero-grad-why-choice
          type: choice
          prompt: |
            在写 PyTorch 深度学习训练代码时，如果粗心删掉了每次循环开头那行 `optimizer.zero_grad()`，紧接着运行几十个小批量后通常会出现什么错误后果？
          options:
            - text: 每次 backward() 算出的新梯度会被累加（+=）到旧梯度上，历史残留梯度越攒越大导致更新失真
              correct: true
            - text: 会因为所有参数张量的 `.grad` 字段在反向传播前就被系统自动清零，导致权重从第 1 步起一动不动
              why: 清零的恰恰是 `zero_grad()`；删掉它反而让旧梯度滞留不散、不断加总越攒越歪
            - text: PyTorch 框架会在 `loss.backward()` 执行完毕后瞬间自动帮所有参数张量清零 `.grad` 缓冲区
              why: 框架不会自动清空（因为保留了累加语义来方便多小批量积累梯度），必须在更新前或更新后手动调用 `zero_grad()`
            - text: 它会在运行时自动把当前配置的 Adam 优化器悄悄改写成纯无监督 k-means 聚簇更新器
              why: 优化器类型保持不变，扰乱训练的是传入 `opt.step()` 的 `.grad` 张量混入了前面老步次的陈旧残影
          explain: |
            “默认累加梯度”是 PyTorch 为显存受限场景留出的梯度累积特性，代价就是在常规每批一更新循环里不能漏写 `opt.zero_grad()`。
      - item:
          id: backprop-complexity-compare
          type: choice
          prompt: |
            一个神经网络包含 $W = 10^6$（一百万）个可学习权重。比较“使用中心有限差分逐个微扰所有权重各重算前向求梯度”与“运行标准反向传播”各自完成一步全体梯度计算的时间规模，两者时间复杂度差距有多大？
          options:
            - text: 逐个微扰计算量正比于 $W^2$，反向传播仅需与一次前向同阶的 $O(W)$ 线性时间
              correct: true
            - text: 两者的时间复杂度完全相同，反而是反向传播必须按参数平方 $W^2$ 轮循环才会结束
              why: 这正是反向模式自动微分（动态规划复用路径）的价值：把原本二次阶耗时压回与单次预测同级别的线性耗时 $O(W)$
            - text: 因为有限差分可以一次性微扰全部一百万个权重然后只跑 1 次前向就分出每个权重各自偏导
              why: 同时改变全部权重只能知道总体合计改变量，分辨不清每条连线各自贡献多少，必须分开单个扰动
            - text: 反向传播只能算最后一层输出权重的梯度，前面所有隐藏层其实还是靠数值微扰逐个估算
              why: 借助 BP2 逐层转置传回误差 $\boldsymbol{\delta}^l$，从深到浅每一层的全部参数都能在那一趟倒推里同时算清
          explain: |
            正因为每步全局梯度能在单次前向的常数倍时间里解决（$O(W)$），大规模神经网络训练才在工程上成为可能。

  # =====================================================================
  # 结业挑战
  # =====================================================================
boss:
  items:
    - id: b-mlp-linear-vs-xor
      type: choice
      prompt: |
        关于单层神经元与带隐藏层的深度网络之间的边界能力区别，哪一句结论准确？
      options:
        - text: 单层单元只能画线性超平面（分不开异或 XOR）；加非线性隐藏层后能组合出任意非线性区域
          correct: true
        - text: 只要给一个 10 层全连接神经网络每层都装上线性恒等激活 $\phi(z) = z$，就能比单隐层 ReLU 更灵活地圈出圆心区域
          why: 没装非线性折弯函数的多层全连接只是把一串矩阵连乘起来，依然坍缩回单一平坦直线分界
        - text: 单个硬阈值感知机自带光滑局部梯度性质，比 Sigmoid 和 ReLU 更适合用于 20 层深网络梯度更新
          why: 阶跃感知机处处导数要么为 0 要么在跳变处无定义，无法直接供常规梯度微调训练
        - text: 单隐藏层网络理论上连最简单的一维有界连续函数都无法逼近，必须先写上十亿个参数才能装下抛物线
          why: 万能近似定理说明足够宽的单隐层理论上能逼近任意连续函数，只是实际工程里相比深度分层表示更耗费参数和样本
      explain: |
        直线靠单层，封闭曲面靠非线性激活叠加多层隐藏表示——从 XOR 扩展到深层层级是一以贯之的几何思路。
    - id: b-bwd-w1-grad-num
      type: number
      prompt: |
        手算验证两层 ReLU 反向传播：已知 $\mathbf{x} = (1, 2)^\top$，真值 $y = 1$，$\mathbf{W}_1 = \begin{pmatrix} 1 & -1 \\ 0.5 & 1 \end{pmatrix}, \mathbf{b}_1 = \mathbf{0}$，$\mathbf{w}_2 = (1, -2)^\top, b_2 = 0.5$，损失 $L = \frac{1}{2}(\hat{y}-y)^2$。算得预测输出 $\hat{y} = -4.5$ 且各隐层加权为 $\mathbf{z}=(-1, 2.5)^\top$。那么第一层权重矩阵**左下角**项 $W_{1, 21}$（第 2 单元连第 1 输入 $x_1$）的梯度 $\frac{\partial L}{\partial W_{1, 21}}$ 等于多少？
      answer: 11
      hint: 输出梯度 $\delta_2 = -5.5$，倒回第二神经元得 $11 \times \mathrm{ReLU}'(2.5) = 11$，再乘入口输入 $x_1 = 1$。
      explain: |
        $\delta_2 = \hat{y}-y = -5.5$，回传 $w_{2,2} = -2$ 得 $\partial L/\partial h_2 = 11$，因 $z_2=2.5>0$ 导数 `1`，故 $\delta_{1,2}=11$，最后乘以入站输入 $x_1 = 1$ 得 $11$。
    - id: b-relu-he-init
      type: choice
      prompt: |
        为了避免深层网络出现底层权重几乎不动（**梯度消失**）的障碍，人们通常把隐层激活换为 ReLU 并采用 He 初始化。为什么这组搭档能起效？
      options:
        - text: ReLU 正区导数为 1 防衰减，He 取 $2/n_{\text{in}}$ 补平负区置零方差
          correct: true
        - text: 因为 ReLU 无论正负输入导数全都恒等于 `100`，从而能让回传梯度在每一层持续放大直到溢出成无穷大
          why: ReLU 正区斜率等于 `1`、负区等于 `0`，既不衰减也不盲目放大；He 初始化则是按 `2/n_in` 令各层方差维持齐平
        - text: He 初始化的核心规则是把全部隐藏层每一条连接权重强制赋成完全相同的固定常数 `0`
          why: 全 0 初始化会让同层神经元走向对称停滞（所有单元学出一样特征），必须按恰当方差零均值随机打破对称
        - text: Sigmoid 的中心最大导数本来就恒等于 `1`，现代架构改用 ReLU 纯粹只是为了少写几行指数函数代码
          why: Sigmoid 的导数 $p(1-p)$ 在中心最高也只有 $0.25$，远离中心即逼近 $0$，连乘数层必然指数衰减
      explain: |
        护住梯度斜率（ReLU 正区恒 1）加护住每层激活统计尺度（He 因子 2），保障了深层网络的稳定训练。
    - id: b-adam-vs-lr-diagnosis
      type: choice
      prompt: |
        对比优化器设计并读懂训练故障信号：关于带动量 SGD、Adam 以及学习率调偏现象，哪一条表述准确？
      options:
        - text: 动量抵消陡壁震荡；Adam 结合一二阶矩做偏差修正与逐维缩步；学习率过大易发散报 NaN，过小则停滞
          correct: true
        - text: Adam 优化器在实现时去掉了所有历史一阶动量记忆，只是把初始全局学习率固定放大一千倍保持不动
          why: Adam 融合了“自适应平方尺度”（二阶估计）与“动量”（一阶平均）两者之长
        - text: 如果训练损失从第一轮起就不降反增、两轮内直接溢出成 `NaN`，最应当立刻把学习率再乘以 10 加速收敛
          why: 抬升和 NaN 是步幅跨越谷底导致指数震荡发散的典型表现，应当降低学习率
        - text: 偏差修正因子 $1/(1-\beta_1^t)$ 会在训练步数 $t$ 增大到十万步后发散趋于无穷大而中止更新
          why: 随着 $\beta_1 \in (0,1)$ 与步数 $t$ 增大，$\beta_1^t \to 0$，分母稳稳趋于 `1`，修正因子平滑隐退
      explain: |
        会写动量/Adam 核心方程、分清发散（太大）与缓慢爬坡（太小），能显著提高调参诊断效率。
    - id: b-reg-techniques-compare
      type: choice
      prompt: |
        当高容量深层神经网络过拟合训练集导致验证误差回升时，下面关于四项技术作用与机制的说法哪项准确？
      options:
        - text: 权重衰减限制权重大幅增长；暂退法在训练期按 $1/(1-p)$ 缩放激活并停用于推理；早停选最优验证快照；批归一化按批统计拉齐激活并在推理时切换移动平均
          correct: true
        - text: 批归一化只允许在测试预测单张图片时打开使用，在训练循环期间必须关闭否则无法反向求导
          why: 训练期依托小批量均值与方差标准化稳住层间分布波动，推理单样本才切换回训练期累积保存的移动均值方差
        - text: 采用反向暂退法丢弃率 $p = 0.5$ 时，训练保留单元禁止除以 `1 - p`，测试期再手动乘以 100
          why: 反向暂退法是在训练期把留存激活除以 `1 - p`，换取部署评估期零额外缩放直接运行
        - text: 早停做法是用所有保留下来的验证集样本直接求梯度并参与每一轮参数更新，以防错过最佳权重
          why: 验证集不参与梯度更新，仅充当决定何时停止并保存检查点的独立评估集
      explain: |
        记住这四项工具在“训练模式 vs 评估推理模式”下的行为差异和切换要求。
    - id: b-cnn-params-calc
      type: number
      prompt: |
        在一段视觉网络中，输入为单通道 `16×16` 灰度特征图，使用 `10` 个共享的 `4×4` 卷积核（无填充、步长为 1，每个核自配 `1` 个独立偏置），紧接着再做一个不重叠、步长为 `2` 的 `2×2` 最大池化。忽略后续层，光这个卷积核群本身合计有多少个可训练权重与偏置参数？（提示：卷积参数只看核大小与核数量）
      answer: 170
      hint: 每个 `4×4` 共享核有 $4\times 4 + 1 = 17$ 个参数，共有 `10` 个这样的核。
      explain: |
        每个 `4×4` 共享滤波器有 $16$ 个权重和 $1$ 个偏置共 $17$ 个参数，整个图层配 10 个特征滤波器共需 $10 \times 17 = 170$ 个参数（共享核无论扫多少像素格，参数量都不随图片长宽增加）。
    - id: b-pytorch-backprop-order
      type: choice
      prompt: |
        在手写 PyTorch 训练循环时，为什么每步都要调用 `optimizer.zero_grad()`，而且反向传播耗时为何能维持在单次前向的常数倍而非 $W$ 倍？
      options:
        - text: 因为 `.backward()` 默认累加梯度须先清零；而反向传播缓存中间激活并以 $O(W)$ 一次算出全体梯度
          correct: true
        - text: 因为如果漏写 `zero_grad()`，PyTorch 就会把优化器内部的学习率改写成 0 导致训练完全停滞
          why: 遗忘 `zero_grad()` 不会抹零学习率，反而会让 `.grad` 因为反复叠加历史梯度而越走越歪
        - text: 因为 `loss.backward()` 底层其实是在一轮里对上亿个参数分别做上亿次数值微扰前向试算，只是借硬件加速了而已
          why: 底层是基于动态构建计算图的反向模式自动微分（等价 BP1–BP4），一次反向扫描仅 $O(W)$ 即可算清全部张量梯度
        - text: 如果忘记在训练前切换 `model.train()` 和测试前切换 `model.eval()`，所有权重矩阵的行列维度都会立刻报错崩溃
          why: 切换 `train()`/`eval()` 控制的是 Dropout 与 BatchNorm 的随机失活和批统计口径切换，并不改变张量权重形状
      explain: |
        至此已打通 $O(W)$ 计算图反向传播、ReLU/He/Adam/BN 训练稳定性以及 PyTorch 工程循环规范。
