skill: E.2.1
version: 2
authors: [gemini]
brief:
  why: |
    手机语音降噪、无线基带解调、医疗心电滤波与雷达回波检测，背后都依赖在计算机或芯片里直接处理离散数列。这一关承接信号与系统的基础，系统建立离散时间信号与随机序列、z 变换与零极点系统分析、DTFT/DFS/DFT、采样重建与过采样、基 2 FFT、FIR 与 IIR 数字滤波器设计、多速率多相处理以及窗函数谱估计的完整工程方法。
  outcomes:
    - 能分析离散序列周期性、计算卷积和与常系数差分方程递推响应，并刻画宽平稳随机信号的自相关与输出功率谱
    - 能熟练求解双边与单边 z 变换、判断收敛域并用部分分式展开求逆变换，区分全通与最小相位系统
    - 能用 DTFT、DFS、DFT、补零插值、重叠相加/保留法及离散余弦变换处理频域分析与快速线性卷积
    - 能完成带限采样重建、混叠折返计算与过采样噪声整形分析，并掌握 DIT/DIF 基 2 FFT 及工程实现要点
    - 能按指标设计线性相位 FIR（窗函数、Kaiser 窗、等波纹与频率采样）与 IIR（冲激不变、双线性预畸变与频率变换）滤波器
    - 能设计抽取、内插、有理倍采样率转换与多相省算结构，并用加窗 DFT、STFT、周期图与 Welch 方法评估信号频谱
terms:
  - term: 逆系统
    def: '与原系统级联后能将任意输入原样还原的系统，对 LTI 系统满足 $h[n]*h_i[n]=\delta[n]$'
  - term: 初始静止
    def: '差分方程在输入尚未开始（$n<n_0$）之前输出恒为零的边界条件，保证因果差分方程对应线性时不变系统'
  - term: 宽平稳随机信号
    def: '统计均值不随时间变化且任意两时刻的相关性只取决于时间差 $m$ 的离散随机序列，简称 WSS 序列'
  - term: 均值
    def: '随机信号在各时刻取值的统计平均数 $m_x=E\{x[n]\}$，反映信号围绕哪一个中心水平波动'
  - term: 方差
    def: '随机信号偏离均值的平方平均数 $\sigma_x^2=E\{(x[n]-m_x)^2\}$，衡量波动的强弱或交流功率大小'
  - term: 自相关序列
    def: '衡量同一随机信号在相隔 $m$ 个样本处的相似程度的函数 $\phi_{xx}[m]=E\{x[n+m]x^*[n]\}$'
  - term: 互相关序列
    def: '衡量两个不同随机信号在相对错开 $m$ 个样本时的相似程度的函数 $\phi_{xy}[m]=E\{x[n+m]y^*[n]\}$'
  - term: 白噪声
    def: '不同时刻样本互不相关、自相关仅在零延迟处非零且功率谱在全频带平坦的随机序列'
  - term: 幂级数展开法
    def: '将有理函数 $X(z)$ 按收敛域方向做多项式长除展开为 $z^{-1}$ 或 $z$ 的幂级数，直接读出系数作为时域序列的方法'
  - term: 单边 z 变换
    def: '仅从 $n=0$ 求和到 $+\infty$ 的 z 变换，便于求解带非零初始条件的差分方程'
  - term: 群延迟
    def: '相频响应对角频率的负导数 $\tau(\omega)=-\frac{d\arg H(e^{j\omega})}{d\omega}$，表示窄带信号包络通过系统延迟的样本数'
  - term: 全通系统
    def: '在所有频率上幅频响应恒为常数（通常为 $1$）、仅改变信号相位的稳定有理 LTI 系统'
  - term: 最小相位系统
    def: '所有极点与所有零点都严格位于单位圆内的因果稳定系统，其逆系统同样因果稳定且能量最集中在起始阶段'
  - term: 离散傅里叶级数
    def: '记作 DFS，把周期为 $N$ 的离散周期序列表示为 $N$ 个离散谐波复指数加权和的频域表示'
  - term: 频域采样
    def: '在 $[0,2\pi)$ 上按等间隔 $\omega_k=2\pi k/N$ 抽取连续频谱 $X(e^{j\omega})$ 的样本，对应时域以 $N$ 为周期延拓'
  - term: 补零
    def: '在有限长序列末尾追加若干个 $0$ 以增大 DFT 点数，相当于对同一条 DTFT 曲线做更密集的插值采样'
  - term: 圆周移位
    def: '在长度 $N$ 的有限窗口内把移出边界的样本从另一端卷回的模 $N$ 移位运算，记作 $x[((n-m))_N]$'
  - term: 重叠相加法
    def: '英文 Overlap-Add，将长输入切成无重叠短段分别用 FFT 做线性卷积，再把相邻段超出边界的尾巴相加拼回的方法'
  - term: 重叠保留法
    def: '英文 Overlap-Save，将长输入切成含 $M-1$ 点重叠的段分别做 $N$ 点圆周卷积，丢弃每段开头混叠点后拼接的方法'
  - term: 离散余弦变换
    def: '简称 DCT，通过对有限长序列做偶对称延拓避免端点跳变、只用实数余弦基把能量高度集中到低频的变换'
  - term: 过采样
    def: '以远高于奈奎斯特下限的采样率 $M f_N$ 采集信号，使量化噪声摊薄到更宽频带以便数字滤除的技术'
  - term: 噪声整形
    def: '通过反馈环路改变系统对量化误差的传递函数，把量化噪声推向信号频带之外的高频区域的技术'
  - term: 旋转因子
    def: 'DFT 与 FFT 中反复出现的复单位根 $W_N^{kn}=e^{-j\frac{2\pi}{N}kn}$，具备周期性与半周期反号对称性'
  - term: 按时间抽取 FFT
    def: '简称 DIT-FFT，按时域下标奇偶逐级二分输入序列、先乘旋转因子再做加减蝶形的快速算法'
  - term: 按频率抽取 FFT
    def: '简称 DIF-FFT，按频域下标奇偶逐级二分输出频点、先做加减再对差值乘旋转因子的快速算法'
  - term: 原位运算
    def: '英文 in-place computation，蝶形运算算出的两个输出直接覆盖原输入的两个存储位置，不需额外整帧缓冲的做法'
  - term: 位倒序重排
    def: '英文 bit-reversal，将样本序号的二进制位左右翻转后重新排列，使 DIT-FFT 输入或 DIF-FFT 输出按自然序对接的步骤'
  - term: Goertzel 算法
    def: '把单个 DFT 频点改写为二阶递推滤波器的算法，只需计算极少数指定频率分量时比整帧 FFT 更省算力'
  - term: 线性调频 z 变换
    def: '英文 Chirp-z Transform，利用恒等式把任意长度或任意弧段上的 DFT/z 变换改写为卷积并用 FFT 加速的算法'
  - term: 广义线性相位
    def: '频率响应可写为实幅度函数乘以线性相位因子 $A(e^{j\omega})e^{-j\alpha\omega+j\beta}$ 的性质，保证通带内群延迟为常数'
  - term: 吉布斯现象
    def: '用矩形窗直接截断理想滤波器的无穷长冲激响应后，频域阶跃边缘出现固定约 9% 过冲且增大阶数也无法消除的现象'
  - term: 主瓣宽度
    def: '窗函数频谱中心主峰两侧第一零点之间的宽度，决定窗函数法滤波器的过渡带宽度和谱分析的双音分辨能力'
  - term: 旁瓣峰值
    def: '窗函数频谱除中心主峰以外最高副峰相对主峰的衰减量，决定滤波器的最小阻带衰减和谱分析的泄漏水平'
  - term: Kaiser 窗
    def: '带可调形状因子 $\beta$ 的灵活窗函数，可根据目标阻带衰减和过渡带宽度直接算出所需阶数与 $\beta$'
  - term: 等波纹逼近
    def: '英文 equiripple，按极小极大准则使加权逼近误差在通带和阻带内以相同最大幅度交替振荡的最优 FIR 设计方法'
  - term: 交错定理
    def: '保证阶数为 $M$ 的等波纹最优 FIR 滤波器加权误差至少有规定数量的正负交替极大值点的数学判据'
  - term: Parks-McClellan 算法
    def: '基于 Remez 交换逐步逼近求解等波纹最优线性相位 FIR 滤波器系数的经典数值设计算法'
  - term: 频率采样法
    def: '在单位圆上按等间隔抽取理想频率响应的 $N$ 个频点再做逆 DFT 得到 FIR 系数的设计方法，常设过渡带样本减波纹'
  - term: 冲激响应不变法
    def: '对连续模拟滤波器的单位冲激响应按周期 $T_d$ 等间隔采样来构造数字 IIR 滤波器的方法，仅适合带限低通或带通'
  - term: 频率预畸变
    def: '在使用双线性映射前先用 $\Omega=\frac{2}{T_d}\tan(\omega/2)$ 预先放大模拟原型关键频率，抵消非线性频率压缩的步骤'
  - term: 巴特沃斯滤波器
    def: '英文 Butterworth filter，通带与阻带幅频响应均单调平滑、在 $\Omega=0$ 处最大平坦的经典模拟原型滤波器'
  - term: 切比雪夫滤波器
    def: '英文 Chebyshev filter，允许在通带（I 型）或阻带（II 型）内等波纹波动，以换取比同阶巴特沃斯更陡过渡带的原型'
  - term: 椭圆滤波器
    def: '英文 Elliptic filter，通带与阻带同时存在等波纹波动，在给定幅度指标下所需阶数最低的模拟原型滤波器'
  - term: 频率变换
    def: '把设计好的归一化低通滤波器通过全通有理代换直接转为任意截止频率的低通、高通、带通或带阻滤波器的方法'
  - term: 降采样
    def: '每隔 $M$ 个样本保留一个、其余丢弃的速率降低操作 $x_d[n]=x[Mn]$，记作 $\downarrow M$'
  - term: 抽取
    def: '英文 decimation，先通过截止频率 $\pi/M$ 的抗混叠低通滤波器再执行 $M$ 倍降采样的完整降速率过程'
  - term: 升采样
    def: '在相邻两个样本之间插入 $L-1$ 个零值的速率提高操作，记作 $\uparrow L$，会在频域产生 $L-1$ 个频谱镜像'
  - term: 频谱镜像
    def: '升采样把原频谱沿频率轴压缩为 $1/L$ 后，在 $[0,\pi]$ 内额外冒出的周期复制副本'
  - term: 内插
    def: '英文 interpolation，先执行 $L$ 倍升采样再通过截止频率 $\pi/L$、增益为 $L$ 的低通滤波器消除镜像的完整升速率过程'
  - term: 贵族恒等式
    def: '英文 noble identities，说明何时可以把滤波操作与降采样或升采样交换先后次序的等效变换法则'
  - term: 多相分解
    def: '英文 polyphase decomposition，把滤波器按系数序号模 $M$ 拆成 $M$ 条并行短子滤波器、配合贵族恒等式大幅降算力的结构'
  - term: 频谱泄漏
    def: '英文 spectral leakage，有限长截断或非整周期采样导致单频正弦的能量顺着窗频谱旁瓣散落到相邻频点的现象'
  - term: 栅栏效应
    def: '英文 picket-fence effect，仅在离散 DFT 频点上观察频谱时真实峰值可能恰好落在两个频点之间而被低估的现象'
  - term: 短时傅里叶变换
    def: '简称 STFT，用滑动窗截取信号的一小段逐帧做傅里叶变换，用来跟踪频率随时间变化的非平稳信号的分析工具'
  - term: 语谱图
    def: '英文 spectrogram，以时间为横轴、频率为纵轴、颜色深浅表示短时傅里叶变换幅值平方的时频二维图'
  - term: 周期图
    def: '英文 periodogram，直接对有限长随机信号段取 DFT 幅值平方再除以段长 $L$ 得到的功率谱基础估计量'
  - term: Bartlett 方法
    def: '把总长度为 $Q$ 的随机信号切成 $K$ 段互不重叠的短段分别算周期图再求平均，以牺牲分辨率换取方差降为 $1/K$ 的方法'
  - term: Welch 方法
    def: '把随机信号切成允许 50% 重叠并施加平滑窗的多个短段，分别计算加窗周期图再求平均的改进谱估计方法'

lessons:
  # ==================== 第 1 章：离散时间信号与系统 ====================
  - id: dt-signals-lti-systems
    chapter: 离散时间信号与系统
    title: 离散序列、系统性质与卷积和
    minutes: 12
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 连续余弦波 $\cos(0.4t)$ 每隔 $2\pi/0.4=5\pi$ 秒重复一次，是周期信号。如果只取整数点得到离散序列 $\cos(0.4n)$，它还是周期序列吗？
          options:
            - text: 是，因为每过 $5\pi$ 个样本就会回到同一个值
              why: 离散序号 $n$ 必须是整数，$n+5\pi$ 不是合法的整数样本点
            - text: 不是，因无正整数 $N$ 使 $0.4N$ 为 $2\pi$ 整数倍
              correct: true
            - text: 是，只要振幅不超过 1 的余弦序列都是周期的
              why: 周期性由角频率与 $2\pi$ 的比值决定，与振幅无关
          explain: 离散正弦 $\cos(\omega_0 n)$ 要求存在正整数 $N$ 和整数 $k$ 使 $\omega_0 N = 2\pi k$，也就是 $\frac{\omega_0}{2\pi}$ 必须是有理数。$\frac{0.4}{2\pi}$ 是无理数，因此 $\cos(0.4n)$ 永远不会精确重复。
      - card:
          title: 离散正弦的周期条件与基本序列
          body: |
            **数字信号处理（DSP）**的对象是只在整数时刻 $n$ 有定义的离散序列 $x[n]$。常用的基本积木包括单位脉冲序列 $\delta[n]$、单位阶跃序列 $u[n]$、实指数序列 $a^n u[n]$ 和离散正弦 $\cos(\omega_0 n + \phi)$。

            离散正弦与连续正弦有两个关键差别：第一，角频率 $\omega_0$ 增加 $2\pi$ 后，$e^{j(\omega_0+2\pi)n}=e^{j\omega_0 n}$，所以不同离散频率只落在长度为 $2\pi$ 的区间内（如 $[-\pi,\pi]$）。第二，$\cos(\omega_0 n)$ 为周期序列当且仅当 $\frac{\omega_0}{2\pi}=\frac{k}{N}$ 为有理数，化成最简分数后分母 $N$ 就是最小正周期。
      - item:
          id: q1
          type: number
          prompt: 离散正弦序列 $x[n]=\cos\left(\frac{3\pi}{8}n\right)$ 的最小正周期 $N$ 是多少？
          answer: 16
          hint: 计算 $\frac{\omega_0}{2\pi}$ 并化成最简分数，分母就是最小正周期。
          explain: $\frac{\omega_0}{2\pi}=\frac{3\pi/8}{2\pi}=\frac{3}{16}$，分子 $3$ 与分母 $16$ 互质，因此每前进 $16$ 个样本相位恰好增加 $3\times 2\pi$，最小正周期 $N=16$。
      - card:
          title: LTI 系统的卷积和、因果、稳定与逆系统
          body: |
            对线性时不变（LTI）系统，任何输入都能拆成移位脉冲的加权和 $x[n]=\sum_{k=-\infty}^{\infty} x[k]\delta[n-k]$，由此得到输出为离散卷积和：

            $$y[n] = \sum_{k=-\infty}^{\infty} x[k]h[n-k] = (x * h)[n]$$

            卷积满足交换律、结合律和分配律，直接对应子系统的级联与并联化简。由 $h[n]$ 可判定性质：系统因果当且仅当 $n<0$ 时 $h[n]=0$；BIBO 稳定当且仅当绝对可和 $\sum_{n=-\infty}^{\infty}|h[n]|<\infty$。如果存在**逆系统（inverse system）** $h_i[n]$ 使 $h[n]*h_i[n]=\delta[n]$，就能无损还原输入，例如累加器 $h[n]=u[n]$ 的逆系统是一阶差分 $h_i[n]=\delta[n]-\delta[n-1]$。
      - card:
          title: 例题：手算离散卷积和与检验稳定性
          body: 已知 $x[n]=[1, 2, 1]$（$n=0,1,2$），$h[n]=[1, -1, 2]$（$n=0,1,2$），求卷积输出 $y[n]$；另判别 $h_2[n]=0.6^n u[n]$ 是否 BIBO 稳定。
          reveal:
            - title: 第 1 步：确定输出支撑长度
              body: 长度为 $L_x=3$ 与 $L_h=3$ 的有限序列卷积，非零范围是 $n=0$ 到 $3+3-2=4$，共 $5$ 个点。
            - title: 第 2 步：逐点移位加权求和
              body: 把 $x[k]$ 当权重去叠加移位后的 $h[n-k]$：$1\cdot[1,-1,2,0,0] + 2\cdot[0,1,-1,2,0] + 1\cdot[0,0,1,-1,2] = [1, 1, 1, 3, 2]$。
            - title: 第 3 步：用等比级数检验稳定性
              body: 对 $h_2[n]=0.6^n u[n]$，$\sum_{n=0}^{\infty}|0.6^n|=\frac{1}{1-0.6}=2.5<\infty$，绝对可和，因此 BIBO 稳定。
      - item:
          id: q2
          type: number
          prompt: 设 $x[n]=[2, 1, 3]$（$n=0,1,2$）输入到单位脉冲响应为 $h[n]=[1, -1, 2]$（$n=0,1,2$）的 LTI 系统，输出 $y[3]$ 等于多少？
          answer: -1
          hint: 哪些 $(k, m)$ 满足 $k + m = 3$，并且两个序列在那里都有值？
          explain: 当 $n=3$ 时，合法项为 $k=1,m=2$ 和 $k=2,m=1$，所以 $y[3]=x[1]h[2]+x[2]h[1]=1\times 2 + 3\times (-1)=-1$。
      - item:
          id: q3
          type: choice
          prompt: 以下四个离散时间系统中，哪一个既满足线性又满足时不变性？
          options:
            - text: $y[n] = x[n] + 2$，因为每次都加同一个常数，规律不随时间变化
              why: 输入翻倍时输出没有翻倍，且零输入产生非零输出 2，违反线性
            - text: $y[n] = n x[n]$，因为满足可加性与齐次性
              why: 系数 $n$ 随时刻变化，把输入延迟一步后乘的是 $n$ 而不是 $n-1$，不是时不变系统
            - text: $y[n] = x[2n]$，因为它只是把输入均匀压缩了 2 倍
              why: 时间压缩系统不是时不变的：输入先右移 2 步再压缩，只相当于输出右移 1 步
            - text: $y[n] = 3x[n] - x[n-1]$，常系数加权和满足线性与时不变
              correct: true
          explain: $y[n]=3x[n]-x[n-1]$ 只是对输入及其常延时版本做常系数加权相加，因此同时满足线性与时不变性。
      - item:
          id: q4
          type: match
          prompt: 将每个单位脉冲响应与对应的 LTI 系统性质配对。
          pairs:
            - ['$h[n] = 0.6^n u[n]$', '因果且 BIBO 稳定']
            - ['$h[n] = (-1.2)^n u[n]$', '因果但 BIBO 不稳定']
            - ['$h[n] = \delta[n+1]$', '非因果']
            - ['$h[n] = \delta[n] - \delta[n-1]$', '累加器 $u[n]$ 的逆系统']
          explain: $n<0$ 非零即非因果；公比绝对值小于 1 才绝对可和；累加器与一阶差分卷积得 $\delta[n]$。

  - id: difference-equations-systems
    chapter: 离散时间信号与系统
    title: 线性常系数差分方程与递推求解
    minutes: 11
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 系统按公式 $y[n] = x[n] + 0.5y[n-1]$ 计算输出。如果输入只在 $n=0$ 给一个 $1$（之后全是 $0$），且 $n<0$ 时输出一直为 $0$，输出会在几步后完全变成 $0$？
          options:
            - text: 第 1 步后就会变成 0，因为输入在 $n=1$ 已经归零
              why: 输出里带有 $0.5y[n-1]$ 反馈项，历史输出会不断把一半能量传给下一步
            - text: 永远不会精确归零，但每步衰减为原来的一半
              correct: true
            - text: 会越来越大，因为一直在加过去的自己
              why: 反馈系数是 $0.5<1$，每一步都会缩小一半而不是放大
          explain: 只要存在反馈项 $0.5y[n-1]$，即便输入归零，输出仍按 $1, 0.5, 0.25, 0.125, \dots$ 无限持续衰减下去。
      - card:
          title: 线性常系数差分方程与初始静止条件
          body: |
            工程里绝大多数离散时间系统都用**线性常系数差分方程（LCCDE）**描述：

            $$\sum_{k=0}^{N} a_k y[n-k] = \sum_{m=0}^{M} b_m x[n-m]$$

            仅给出方程本身还不能唯一确定输出，必须规定边界条件。当规定系统处于**初始静止（initial rest）**——即若对 $n<n_0$ 有 $x[n]=0$，则对 $n<n_0$ 必有 $y[n]=0$——方程才唯一对应一个因果且线性时不变的系统。如果存在非零初始状态（如 $y[-1]\neq 0$），则系统对输入不再满足线性（零输入也会产生非零输出）。
      - item:
          id: q1
          type: choice
          prompt: 关于差分方程 $y[n] = x[n] + 0.5y[n-1]$，在哪种条件下它代表一个因果 LTI 系统？
          options:
            - text: 强制设 $y[-1]=1$ 以提供初始能量，这样系统更容易启动
              why: 非零初始条件会产生零输入响应，输入翻倍时总输出并不翻倍，破坏线性
            - text: 满足初始静止条件，即输入出现前所有历史输出均为 0
              correct: true
            - text: 把方程改写为 $y[n-1]=2y[n]-2x[n]$ 并从未来向过去反推
              why: 向过去反推会依赖未来输入，得到的是非因果系统
            - text: 只要方程系数 $0.5$ 不随时间变化，任何初始值都构成 LTI 系统
              why: 常系数只是必要条件，非零初始储能会破坏零输入对应零输出的线性要求
          explain: 只有附加初始静止条件并沿时间正向递推时，常系数差分方程才唯一定义因果 LTI 系统。
      - card:
          title: 非递推 FIR 与递推 IIR 方程
          body: |
            令 $a_0=1$，把 $y[n]$ 移到等号左侧：

            $$y[n] = -\sum_{k=1}^{N} a_k y[n-k] + \sum_{m=0}^{M} b_m x[n-m]$$

            当 $N=0$（右侧不含过去的输出 $y[n-k]$）时，输出只由当前和过去有限个输入加权相加，称为非递推方程，其脉冲响应长度有限，属于 FIR 系统。当 $N\ge 1$ 且反馈不被抵消时，当前输出依赖过去的输出，称为递推方程，脉冲响应通常持续无穷长，属于 IIR 系统。
      - card:
          title: 例题：递推求 $y[n]=x[n]+0.5y[n-1]$ 的脉冲响应与阶跃响应
          body: 已知系统满足 $y[n]=x[n]+0.5y[n-1]$ 且初始静止（$n<0$ 时 $y[n]=0$），分别求脉冲响应 $h[n]$（输入 $\delta[n]$）和阶跃响应 $s[n]$（输入 $u[n]$）。
          reveal:
            - title: 第 1 步：输入 $\delta[n]$ 逐项递推求 $h[n]$
              body: $h[0]=\delta[0]+0.5h[-1]=1+0=1$；$h[1]=0+0.5\times 1=0.5$；$h[2]=0+0.5\times 0.5=0.25$；归纳得 $h[n]=0.5^n u[n]$。
            - title: 第 2 步：核对因果性与稳定性
              body: $n<0$ 时 $h[n]=0$，因果；$\sum_{n=0}^{\infty}|0.5^n|=\frac{1}{1-0.5}=2<\infty$，BIBO 稳定。
            - title: 第 3 步：输入 $u[n]$ 逐项递推求阶跃响应 $s[n]$
              body: $s[0]=1+0=1$，$s[1]=1+0.5(1)=1.5$，$s[2]=1+0.5(1.5)=1.75$，$s[3]=1+0.5(1.75)=1.875$，随 $n\to\infty$ 趋近稳态值 $2$。
      - item:
          id: q2
          type: number
          prompt: 初始静止系统 $y[n]=x[n]+0.8y[n-1]$ 的单位脉冲响应 $h[n]$ 满足绝对可和，其总和 $\sum_{n=0}^{\infty}|h[n]|$ 等于多少？
          answer: 5
          hint: 输入 $\delta[n]$ 时，$h[0]$、$h[1]$、$h[2]$ 依次是多少？它们组成什么数列？
          explain: 逐项递推得 $h[0]=1$、$h[1]=0.8$、$h[2]=0.64$，即 $h[n]=0.8^n u[n]$；$\sum_{n=0}^{\infty}0.8^n=\frac{1}{1-0.8}=5$，总和有限说明系统 BIBO 稳定。
      - item:
          id: q3
          type: number
          prompt: 某初始静止系统 $y[n]=x[n]+0.4y[n-1]$ 在单位阶跃输入 $x[n]=u[n]$ 下，$n=2$ 时的输出 $s[2]$ 是多少？
          answer: 1.56
          hint: $s[-1]$ 是多少？每一步的输入 $x[n]$ 又是多少？
          explain: 从 $s[-1]=0$ 开始：$s[0]=1+0=1$，$s[1]=1+0.4\times 1=1.4$，$s[2]=1+0.4\times 1.4=1.56$。
      - item:
          id: q4
          type: choice
          prompt: 对比 3 点滑动平均 $y[n]=\frac{1}{3}(x[n]+x[n-1]+x[n-2])$ 与 $y[n]=x[n]+0.5y[n-1]$，哪项说法正确？
          options:
            - text: 两者都有过去项，所以都属于无穷长脉冲响应的 IIR 系统
              why: 滑动平均只用到过去输入 $x[n-1],x[n-2]$，没有输出反馈，脉冲响应长度仅为 3
            - text: 滑动平均为有限长 FIR，对阶跃输入在第 2 步达稳态 1
              correct: true
            - text: 滑动平均因为没有反馈项，无法对高频噪声起到平滑抑制作用
              why: 对相邻 3 点取平均会抵消快变抖动，本身就是一个经典的低通平滑 FIR 滤波器
            - text: 只要差分方程右边出现 $x[n-2]$，就必须给定 $y[-1]$ 和 $y[-2]$ 才能递推
              why: 非递推方程完全不依赖历史输出，只需要历史输入值
          explain: 3 点滑动平均是非递推 FIR 系统，$h[n]=[\frac{1}{3},\frac{1}{3},\frac{1}{3}]$；输入 $u[n]$ 时 $y[0]=\frac{1}{3}, y[1]=\frac{2}{3}, y[2]=1$，之后保持 1。

  - id: dt-random-signals-corr
    chapter: 离散时间信号与系统
    title: 离散随机信号、自相关与输出功率谱
    minutes: 12
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 一段麦克风背景热噪声每个采样点的取值都是随机的，相邻样本之间毫无关联。如果把这段噪声送进两点平均滤波器 $y[n]=0.5x[n]+0.5x[n-1]$，输出噪声的波动会怎么变化？
          options:
            - text: 波动不变，因为两个权重加起来还是 1
              why: 直流成分保持不变，但互不相关的随机正负抖动在求平均时会部分抵消
            - text: 波动变小，且相邻两个输出之间开始相关
              correct: true
            - text: 波动变大，因为把两个随机样本叠加到了一起
              why: 每个样本都先乘了 $0.5$，平方和 $0.5^2+0.5^2=0.5<1$，噪声能量反而减半
          explain: 两点平均把独立噪声的波动能量减半，同时 $y[n]$ 和 $y[n-1]$ 共享了样本 $x[n-1]$，所以原本独立的噪声经过滤波后变得彼此相关。
      - card:
          title: 宽平稳随机信号的均值、方差与相关序列
          body: |
            真实通信噪声、雷达杂波和量化误差无法写成确定公式，需用统计量刻画：**均值（mean）** $m_x=E\{x[n]\}$ 是统计平均中心；**方差（variance）** $\sigma_x^2=E\{(x[n]-m_x)^2\}$ 是偏离均值的平方平均，度量波动功率。

            若均值不随 $n$ 变、且相关性只依赖时间差 $m$，称为**宽平稳随机信号（wide-sense stationary, WSS）**。其**自相关序列（autocorrelation sequence）**为 $\phi_{xx}[m]=E\{x[n+m]x^*[n]\}$；两信号间的**互相关序列（cross-correlation sequence）**为 $\phi_{xy}[m]=E\{x[n+m]y^*[n]\}$。
      - item:
          id: q1
          type: choice
          prompt: 设实值零均值宽平稳随机序列 $x[n]$ 的自相关序列为 $\phi_{xx}[m]$，下列哪项一定成立？
          options:
            - text: $\phi_{xx}[0]$ 等于信号均值 $m_x$，可能为负数
              why: $\phi_{xx}[0]=E\{|x[n]|^2\}\ge 0$ 代表总平均功率，对零均值信号它等于方差 $\sigma_x^2$
            - text: $\phi_{xx}[0]=\sigma_x^2$，且偶对称 $\phi_{xx}[-m]=\phi_{xx}[m]$
              correct: true
            - text: 只要 $m>0$，$\phi_{xx}[m]$ 必然大于 $\phi_{xx}[0]$
              why: 信号与自己零错位时最相似，满足 $|\phi_{xx}[m]|\le \phi_{xx}[0]$
            - text: $\phi_{xx}[m]$ 只在 $m\ge 0$ 有定义，因为不能拿过去和未来作比较
              why: 滞后量 $m$ 可正可负，宽平稳性质保证向左错开 $m$ 与向右错开 $m$ 的相关性对称
          explain: 零均值时 $\phi_{xx}[0]=E\{x^2[n]\}=\sigma_x^2$，且对实值 WSS 信号有 $\phi_{xx}[-m]=E\{x[n-m]x[n]\}=\phi_{xx}[m]$。
      - card:
          title: 白噪声通过 LTI 系统的相关与功率谱变换
          body: |
            最常用的噪声模型是零均值**白噪声（white noise）** $e[n]$：不同时刻互不相关，自相关 $\phi_{ee}[m]=\sigma_e^2\delta[m]$，其 DTFT **功率谱密度（PSD）**在全频带恒等于常数 $\Phi_{ee}(e^{j\omega})=\sigma_e^2$。

            当任意 WSS 信号通过实系数稳定 LTI 系统 $h[n]$ 时，输出仍是 WSS 信号，满足三条核心规律：
            1. 均值：$m_y = m_x \sum_k h[k] = m_x H(e^{j0})$；
            2. 功率谱：$\Phi_{yy}(e^{j\omega}) = |H(e^{j\omega})|^2 \Phi_{xx}(e^{j\omega})$；
            3. 若输入为白噪声，输出方差简化为 $\sigma_y^2 = \phi_{yy}[0] = \sigma_e^2 \sum_n h^2[n]$。
      - card:
          title: 例题：方差为 4 的白噪声通过两点平均滤波器
          body: 零均值白噪声 $e[n]$ 的方差 $\sigma_e^2=4$，送入系统 $h[n]=[0.5, 0.5]$（$n=0,1$），求输出方差 $\phi_{yy}[0]$、滞后 1 步的自相关 $\phi_{yy}[1]$，以及 $\omega=\pi$ 处的输出功率谱。
          reveal:
            - title: 第 1 步：计算输出方差 $\phi_{yy}[0]$
              body: 直接套用白噪声通过 LTI 的方差公式：$\phi_{yy}[0]=\sigma_e^2(h[0]^2+h[1]^2)=4\times(0.25+0.25)=2$，噪声功率减半。
            - title: 第 2 步：计算滞后 1 步的自相关 $\phi_{yy}[1]$
              body: $y[n+1]=0.5e[n+1]+0.5e[n]$，$y[n]=0.5e[n]+0.5e[n-1]$，只有共享项 $e[n]$ 的乘积期望非零，得 $\phi_{yy}[1]=0.5\times 0.5\times \sigma_e^2=0.25\times 4=1$；滞后 $|m|\ge 2$ 时无共享样本，自相关为 $0$。
            - title: 第 3 步：验证频域功率谱
              body: $H(e^{j\omega})=0.5+0.5e^{-j\omega}$。在 $\omega=0$ 处 $H(e^{j0})=1$，$\Phi_{yy}(e^{j0})=1^2\times 4=4$；在 $\omega=\pi$ 处 $H(e^{j\pi})=0.5-0.5=0$，因此 $\Phi_{yy}(e^{j\pi})=0$，高频噪声被完全滤除。
      - item:
          id: q2
          type: number
          prompt: 方差为 $\sigma_e^2=4$ 的零均值白噪声通过 $h[n]=[1, 0.5]$（$n=0,1$）后，输出滞后 1 步的自相关 $\phi_{yy}[1]$ 等于多少？
          answer: 2
          hint: $y[n+1]$ 和 $y[n]$ 里，哪一个白噪声样本同时出现？它在两边的系数各是多少？
          explain: $y[n+1]=e[n+1]+0.5e[n]$，$y[n]=e[n]+0.5e[n-1]$。只有共享项 $e[n]$ 的乘积期望非零：系数 $0.5$ 乘 $1$，再乘 $E\{e^2[n]\}=4$，得 $\phi_{yy}[1]=0.5\times 1\times 4=2$。
      - item:
          id: q3
          type: number
          prompt: 若某宽平稳随机信号带有恒定直流均值 $m_x=6$，通过离散系统 $h[n]=[0.5, 0.5]$ 后，输出的均值 $m_y$ 等于多少？
          answer: 6
          hint: 输出均值等于输入均值乘以系统的直流增益 $H(e^{j0})=\sum h[n]$。
          explain: $H(e^{j0})=0.5+0.5=1$，所以 $m_y=m_x H(e^{j0})=6\times 1=6$。两点平均削弱了高频随机抖动，但完整保留了直流均值。
      - item:
          id: q4
          type: choice
          prompt: 一段方差为 $\sigma_e^2$ 的零均值白噪声通过稳定实系统 $h[n]$，怎样求输出功率谱密度 $\Phi_{yy}(e^{j\omega})$？
          options:
            - text: 直接用 $|H(e^{j\omega})|\cdot \sigma_e^2$，按幅频响应线性放大
              why: 功率谱对应能量的平方量纲，应当乘以幅频响应的平方而不是一次方
            - text: 乘以幅频响应平方：$\Phi_{yy}(e^{j\omega}) = |H(e^{j\omega})|^2 \sigma_e^2$
              correct: true
            - text: 输出依然是全频带平坦的白噪声，只是常数高度变成 $\sigma_e^2 H(e^{j0})$
              why: 只有全通系统才保持白噪声平坦，一般滤波器会按 $|H(e^{j\omega})|^2$ 重塑功率谱形状
            - text: 必须把 $\sigma_e^2$ 与 $H(e^{j\omega})$ 在频域做卷积才能得到输出功率谱
              why: 时域滤波卷积对应频域直接相乘，不是频域卷积
          explain: 宽平稳信号经 LTI 滤波后满足 $\Phi_{yy}(e^{j\omega})=|H(e^{j\omega})|^2\Phi_{xx}(e^{j\omega})$，对白噪声 $\Phi_{ee}(e^{j\omega})=\sigma_e^2$，即 $|H(e^{j\omega})|^2\sigma_e^2$。

  # ==================== 第 2 章：z变换 ====================
  - id: z-transform-roc
    chapter: z变换
    title: z 变换定义与收敛域的几何规律
    minutes: 12
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 两个不同的序列 $x_1[n]=0.5^n u[n]$（右侧）和 $x_2[n]=-0.5^n u[-n-1]$（左侧），经过求等比级数之和，算出来的代数式都是 $\frac{1}{1-0.5z^{-1}}$。怎样区分它们？
          options:
            - text: 没法区分，说明 z 变换不是一一对应的
              why: 只要补上使级数收敛的复数 $z$ 的取值范围，两者就能唯一区分
            - text: 靠各自的收敛域区分：前者是 $|z|>0.5$，后者是 $|z|<0.5$
              correct: true
            - text: 靠极点位置区分：前者极点在 $+0.5$，后者极点在 $-0.5$
              why: 两个代数式的分母完全相同，极点都在 $z=0.5$
          explain: 代数式本身不含时间方向信息，必须把代数式和**收敛域（ROC）**成对给出，才能唯一确定原时域序列。
      - card:
          title: 双边 z 变换与单位圆上的 DTFT
          body: |
            双边 z 变换把离散序列映射到复平面上的函数：

            $$X(z) = \sum_{n=-\infty}^{\infty} x[n] z^{-n}$$

            把复变量写成极坐标 $z = r e^{j\omega}$，上式就变成对加权序列 $x[n]r^{-n}$ 做 DTFT。即使原序列本身不绝对可和（DTFT 不存在），只要能挑出合适的衰减半径 $r$ 使 $\sum |x[n]|r^{-n}<\infty$，z 变换依然存在。特别地，当且仅当**收敛域（ROC）**包含单位圆 $|z|=1$ 时，把 $z=e^{j\omega}$ 代入就能直接得到该序列的 DTFT。
      - item:
          id: q1
          type: number
          prompt: 有限长序列 $x[n]=[2, -1, 3]$（对应 $n=0, 1, 2$）的 z 变换在 $z=2$ 处的取值 $X(2)$ 是多少？
          answer: 2.25
          hint: 写出 $X(z)=2 - z^{-1} + 3z^{-2}$，再代入 $z=2$ 计算。
          explain: $X(2)=2 - 2^{-1} + 3\times 2^{-2}=2 - 0.5 + 0.75=2.25$。有限长因果序列的 z 变换在除 $z=0$ 外的所有复平面上都收敛。
      - card:
          title: 收敛域（ROC）的几何形状与性质
          body: |
            由于收敛条件 $\sum |x[n]||z|^{-n}<\infty$ 只取决于半径 $|z|$，ROC 在复平面上必然是以原点为中心的圆环或圆盘，并且绝不能包含任何极点（极点处分母为零、函数发散）。按序列支撑类型分四类：

            | 序列类型 | ROC 形状 | 关键边界 |
            |---|---|---|
            | 有限长序列 | 整个 $z$ 平面（可能除 $0$ 或 $\infty$） | 无有限非零极点 |
            | 右侧序列（含因果） | 最外层极点之外：$|z|>r_{\max}$ | 向外延伸至 $\infty$ |
            | 左侧序列（含反因果） | 最内层极点之内：$|z|<r_{\min}$ | 向内包含 $0$ |
            | 双边序列 | 两个极点之间的圆环：$r_1<|z|<r_2$ | 若 $r_1\ge r_2$ 则无交集，不存在 |
      - card:
          title: 例题：双边序列的收敛域与 DTFT 存在性判断
          body: 比较两个双边序列：$x_a[n] = 0.5^n u[n] - 2^n u[-n-1]$ 与 $x_b[n] = 0.8^n u[n] + 0.4^n u[-n-1]$，判断它们的 z 变换和 DTFT 是否存在。
          reveal:
            - title: 第 1 步：分别写出 $x_a[n]$ 两项的收敛域
              body: 右侧项 $0.5^n u[n]$ 要求 $|0.5z^{-1}|<1 \implies |z|>0.5$；左侧项 $-2^n u[-n-1]$ 要求 $|z/2|<1 \implies |z|<2$。
            - title: 第 2 步：取交集并检查单位圆
              body: 两者交集为圆环 $0.5<|z|<2$，非空且包含单位圆 $|z|=1$。因此 $x_a[n]$ 既有 z 变换（在 $z=1$ 处值为 $\frac{1}{1-0.5}+\frac{1}{1-2}=2-1=1$），也有 DTFT。
            - title: 第 3 步：检验 $x_b[n]$ 的收敛域交集
              body: 右侧项 $0.8^n u[n]$ 要求 $|z|>0.8$，左侧项 $0.4^n u[-n-1]$ 要求 $|z|<0.4$。两者没有任何公共区域，因此 $x_b[n]$ 的双边 z 变换不存在。
      - item:
          id: q2
          type: choice
          prompt: 某有理 z 变换 $X(z)$ 有两个极点 $z=0.5$ 和 $z=2$，并且已知对应序列的 DTFT 存在。那么它的收敛域与序列类型分别是什么？
          options:
            - text: 收敛域为 $|z|>2$，是因果右侧序列
              why: $|z|>2$ 不包含单位圆 $|z|=1$，对应的 DTFT 不存在
            - text: 收敛域为 $|z|<0.5$，是反因果左侧序列
              why: $|z|<0.5$ 同样不包含单位圆 $|z|=1$，DTFT 不存在
            - text: 收敛域为 $0.5<|z|<2$，是双边序列
              correct: true
            - text: 收敛域为 $|z|\neq 0.5$ 且 $|z|\neq 2$，因为只需挖掉极点即可
              why: ROC 必须是连通的圆环或圆盘，不能跨越极点把不相邻区域拼在一起
          explain: DTFT 存在等价于 ROC 包含单位圆 $|z|=1$。在两个极点 $0.5$ 与 $2$ 之间，唯一包含 $|z|=1$ 的连通圆环是 $0.5<|z|<2$，对应双边序列。
      - item:
          id: q3
          type: number
          prompt: 双边序列 $x_a[n]=0.5^n u[n]-2^n u[-n-1]$ 的 z 变换为 $X_a(z)=\frac{1}{1-0.5z^{-1}}+\frac{1}{1-2z^{-1}}$（$0.5<|z|<2$）。其在直流频率 $\omega=0$（即 $z=1$）处的 DTFT 值 $X_a(e^{j0})$ 是多少？
          answer: 1
          hint: 单位圆在收敛域内，直接把 $z=1$ 代入两项相加即可。
          explain: $X_a(1)=\frac{1}{1-0.5}+\frac{1}{1-2}=2+(-1)=1$。从时域核对：右侧和为 $2$，左侧和为 $-(\frac{1}{2}+\frac{1}{4}+\dots)=-1$，总和同样是 $1$。
      - item:
          id: q4
          type: match
          prompt: 将下列序列与它们对应的 z 变换收敛域（ROC）配对。
          pairs:
            - ['$x[n] = \delta[n] + 3\delta[n-2]$', '除 $z=0$ 外的整个 $z$ 平面']
            - ['$x[n] = \delta[n+1] + 2\delta[n]$', '除 $z=\infty$ 外的整个 $z$ 平面']
            - ['$x[n] = 0.8^n u[n] + 0.4^n u[-n-1]$', '无公共收敛域（z 变换不存在）']
            - ['$x[n] = (-0.7)^n u[n]$', '$|z| > 0.7$']
          explain: 含 $z^{-k}$ 的有限右侧序列在 $z=0$ 发散；含 $z^{+k}$ 的有限左侧序列在 $z=\infty$ 发散；$|z|>0.8$ 与 $|z|<0.4$ 交集为空。

  - id: inverse-z-and-properties
    chapter: z变换
    title: 逆 z 变换、变换性质与单边 z 变换
    minutes: 13
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 已知 $X(z)=\frac{1}{(1-0.5z^{-1})(1-0.25z^{-1})}$ 且收敛域 $|z|>0.5$。如果不靠查复杂公式，把分母展开成 $1 - 0.75z^{-1} + 0.125z^{-2}$ 再用 $1$ 去做多项式长除，商式里 $z^{-1}$ 前面的系数代表什么？
          options:
            - text: 代表极点位置 $0.75$，和时域序列取值无关
              why: 幂级数 $X(z)=\sum x[n]z^{-n}$ 中每个 $z^{-n}$ 的系数直接就是时域样本 $x[n]$
            - text: 直接就是时域样本 $x[1]$ 的值
              correct: true
            - text: 代表序列所有样本的累加和
              why: 所有样本之和是 $X(1)$，而不是单项 $z^{-1}$ 的系数
          explain: 根据 z 变换定义 $X(z)=x[0]+x[1]z^{-1}+x[2]z^{-2}+\dots$，按降幂展开后的系数逐项对应 $x[0], x[1], x[2], \dots$。
      - card:
          title: 逆 z 变换的三种实用方法
          body: |
            从 $X(z)$ 与 ROC 还原时域序列 $x[n]$，工程中最常用三种方法：
            1. **观察法**：直接对照常用变换对，例如 $\frac{1}{1-az^{-1}}$ 在 $|z|>|a|$ 对应 $a^n u[n]$，在 $|z|<|a|$ 对应 $-a^n u[-n-1]$。
            2. **幂级数展开法（power series expansion）**：通过多项式长除展开成 $z^{-1}$ 的幂级数（对应右侧 $|z|>R$）或 $z$ 的幂级数（对应左侧 $|z|<R$），直接读出前几项样本值，非常适合核对答案。
            3. **部分分式展开**：将真分式拆成若干一阶极点项 $\sum \frac{A_k}{1-d_k z^{-1}}$，再按 ROC 逐项决定每一项取右侧还是左侧序列。
      - card:
          title: 例题：用部分分式展开与长除法互验逆 z 变换
          body: 求 $X(z)=\frac{1}{(1-0.5z^{-1})(1-0.25z^{-1})}$ 在收敛域 $|z|>0.5$ 下的逆 z 变换 $x[n]$，并用前两项与卷积/长除核对。
          reveal:
            - title: 第 1 步：用留数/遮盖法求部分分式系数
              body: 设 $X(z)=\frac{A}{1-0.5z^{-1}}+\frac{B}{1-0.25z^{-1}}$。令 $z^{-1}=2$（即 $z=0.5$）遮盖第一项分母，得 $A=\frac{1}{1-0.25\times 2}=2$；令 $z^{-1}=4$（即 $z=0.25$）遮盖第二项分母，得 $B=\frac{1}{1-0.5\times 4}=-1$。
            - title: 第 2 步：按 ROC $|z|>0.5$ 还原时域闭式
              body: ROC 位于两个极点 $0.5$ 和 $0.25$ 之外，两项都取右侧因果序列：$x[n]=(2\cdot 0.5^n - 0.25^n)u[n]$。
            - title: 第 3 步：核对前几项并与长除/卷积互验
              body: 闭式算出 $x[0]=2-1=1$，$x[1]=2(0.5)-0.25=0.75$，$x[2]=2(0.25)-0.0625=0.4375$。另一方面 $X(z)$ 是 $0.5^n u[n]$ 与 $0.25^n u[n]$ 的乘积（时域卷积），前两项也是 $1$ 和 $0.5+0.25=0.75$，完全吻合。
      - item:
          id: q1
          type: number
          prompt: 已知 $X(z)=\frac{1}{(1-0.5z^{-1})(1-0.25z^{-1})}$，收敛域为 $|z|>0.5$，其逆 z 变换序列在 $n=3$ 处的取值 $x[3]$ 等于多少？
          answer: 0.234375
          hint: 收敛域在两个极点之外，两项各取右侧还是左侧序列？
          explain: 部分分式展开得 $x[n]=(2\cdot 0.5^n - 0.25^n)u[n]$，所以 $x[3]=2\times 0.125 - 0.015625 = 0.234375$。
      - item:
          id: q2
          type: number
          prompt: 如果把同一个代数式 $X(z)=\frac{1}{(1-0.5z^{-1})(1-0.25z^{-1})}=\frac{2}{1-0.5z^{-1}}-\frac{1}{1-0.25z^{-1}}$ 的收敛域改为圆环 $0.25<|z|<0.5$，那么 $x[-1]$ 等于多少？
          answer: -4
          hint: 圆环 $0.25<|z|<0.5$ 在极点 $0.5$ 内侧（左侧序列）、在极点 $0.25$ 外侧（右侧序列）。
          explain: $0.5$ 项取左侧 $-2\cdot 0.5^n u[-n-1]$，$0.25$ 项取右侧 $-0.25^n u[n]$。当 $n=-1$ 时右侧项为 0，左侧项为 $-2\cdot 0.5^{-1}=-4$。
      - card:
          title: z 变换核心性质与单边 z 变换
          body: |
            双边 z 变换的常用性质把复杂时域操作化为代数运算：时移 $x[n-n_0]\leftrightarrow z^{-n_0}X(z)$、尺度乘指数 $z_0^n x[n]\leftrightarrow X(z/z_0)$、时间反转 $x[-n]\leftrightarrow X(z^{-1})$、卷积 $x_1*x_2\leftrightarrow X_1(z)X_2(z)$，以及因果序列的初值定理 $x[0]=\lim_{z\to\infty}X(z)$。

            处理带非零初始储能（如 $y[-1]=4$）的差分方程时，需要用**单边 z 变换（unilateral z-transform）** $\mathcal{Z}_+\{x[n]\}=\sum_{n=0}^{\infty}x[n]z^{-n}$。它的右移性质会自动带出初始条件：

            $$\mathcal{Z}_+\{y[n-1]\} = z^{-1}Y_+(z) + y[-1]$$
      - item:
          id: q3
          type: number
          prompt: 系统满足 $y[n] - 0.5y[n-1] = \delta[n]$，已知初始状态 $y[-1]=4$。用单边 z 变换求解 $n\ge 0$ 时的输出，则 $y[1]$ 等于多少？
          answer: 1.5
          hint: 对方程两边取单边 z 变换：$Y_+(z) - 0.5(z^{-1}Y_+(z)+4) = 1$，解出 $Y_+(z)$ 再求 $y[1]$（也可以直接递推验证）。
          explain: $Y_+(z)(1-0.5z^{-1}) = 1 + 2 = 3$，得 $Y_+(z)=\frac{3}{1-0.5z^{-1}}$，所以 $y[n]=3\cdot 0.5^n u[n]$，$y[0]=3$，$y[1]=1.5$。
      - item:
          id: q4
          type: match
          prompt: 将每个时域操作与对应的双边 z 变换结果配对。
          pairs:
            - ['时移 $x[n-3]$', '$z^{-3}X(z)$']
            - ['乘指数序列 $0.5^n x[n]$', '$X(2z)$（ROC 半径缩小为 $0.5$ 倍）']
            - ['时间反转 $x[-n]$', '$X(z^{-1})$（ROC 半径取倒数）']
            - ['离散卷积 $x_1[n]*x_2[n]$', '$X_1(z)X_2(z)$']
          explain: 尺度性质 $z_0^n x[n]\leftrightarrow X(z/z_0)$ 中 $z_0=0.5$ 给出 $X(2z)$，其余三项分别为时移、时间反转与卷积性质。

  - id: system-function-freq-response
    chapter: z变换
    title: 有理系统函数与零极点几何看频响
    minutes: 12
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 如果把一个因果系统的零点正好放在单位圆上的 $z=1$（对应 $\omega=0$），极点放在圆内 $z=0.8$，猜猜它对直流信号（$\omega=0$）和高频信号（$\omega=\pi$）分别会怎样？
          options:
            - text: 放大直流信号、衰减高频信号，是一个低通滤波器
              why: $z=1$ 处放的是分子零点而不是极点，系统在该处增益会被拉到零
            - text: 完全阻断直流信号、放行高频信号，是一个高通滤波器
              correct: true
            - text: 极点在 $0.8$ 离 $1$ 很近，两者恰好抵消，所有频率增益都等于 1
              why: 极点在 $0.8$ 并不等于 $1$，在 $z=1$ 处分子严格为 0 而分母是 $0.2$，不会抵消
          explain: 单位圆上离零点越近幅值越小（正好踩在零点上为 0），离极点越近幅值越大。零点在 $z=1$ 会完全堵死直流，形成高通效果。
      - card:
          title: 从差分方程到有理系统函数与稳定判据
          body: |
            对线性常系数差分方程两边取 z 变换，直接得到有理系统函数：

            $$H(z) = \frac{Y(z)}{X(z)} = \frac{\sum_{m=0}^{M} b_m z^{-m}}{\sum_{k=0}^{N} a_k z^{-k}} = \frac{b_0}{a_0} \frac{\prod_{m=1}^{M}(1 - c_m z^{-1})}{\prod_{k=1}^{N}(1 - d_k z^{-1})}$$

            分子根 $c_m$ 是零点，分母根 $d_k$ 是极点。对因果系统，ROC 是最外层极点之外 $|z|>\max_k|d_k|$；而 BIBO 稳定要求 ROC 包含单位圆 $|z|=1$。合起来就得到最核心的工程判据：**因果有理系统 BIBO 稳定，当且仅当全部极点严格位于单位圆内部（$|d_k|<1$）**。
      - item:
          id: q1
          type: choice
          prompt: 某因果离散系统满足 $H(z)=\frac{1}{1 - 1.3z^{-1} + 0.4z^{-2}}$，该系统是否 BIBO 稳定？
          options:
            - text: 不稳定，因为分母系数 $-1.3$ 的绝对值大于 1
              why: 不能直接拿多项式系数与 1 比较，必须求分母多项式的根（极点）再看极点模长
            - text: 稳定，两极点 $0.8$ 与 $0.5$ 均在圆内
              correct: true
            - text: 不稳定，因为分子没有零点来抵消分母的增长
              why: 稳定性只由极点与收敛域决定，与分子零点无关
            - text: 稳定，因为这是一个无反馈的 FIR 系统
              why: 分母含 $z^{-1}$ 和 $z^{-2}$，属于带反馈的二阶 IIR 系统
          explain: 因式分解 $1-1.3z^{-1}+0.4z^{-2}=(1-0.8z^{-1})(1-0.5z^{-1})$，极点为 $0.8$ 和 $0.5$，均严格在单位圆内，故因果且 BIBO 稳定。
      - card:
          title: 零极点图上的几何距离与幅频/相频响应
          body: |
            当稳定系统的 $z$ 沿单位圆 $e^{j\omega}$ 从 $\omega=0$（点 $1$）逆时针转到 $\omega=\pi$（点 $-1$）时，因式 $|e^{j\omega}-c_m|$ 正是单位圆上点 $e^{j\omega}$ 到零点 $c_m$ 的几何距离，$|e^{j\omega}-d_k|$ 是到极点 $d_k$ 的距离：

            $$|H(e^{j\omega})| = \left|\frac{b_0}{a_0}\right| \frac{\prod_{m=1}^{M} |e^{j\omega} - c_m|}{\prod_{k=1}^{N} |e^{j\omega} - d_k|}$$

            由此获得直觉设计法：想在某频率 $\omega_0$ 处形成尖峰（谐振），就在单位圆内紧贴 $e^{\pm j\omega_0}$ 放一对共轭极点（如 $0.9e^{\pm j\pi/3}$）；想完全滤掉某频率（陷波），就把零点直接压在单位圆上 $e^{\pm j\omega_0}$ 处。
      - card:
          title: 例题：用几何与代数双途径算 $H(z)=\frac{1-z^{-1}}{1-0.8z^{-1}}$ 的频响
          body: 已知因果系统 $H(z)=\frac{1-z^{-1}}{1-0.8z^{-1}}=\frac{z-1}{z-0.8}$，求它在 $\omega=0$ 和 $\omega=\pi$ 处的幅频响应，并说明它的滤波类型。
          reveal:
            - title: 第 1 步：标出零极点并确认稳定性
              body: 零点在 $z=1$（单位圆上 $\omega=0$ 处），极点在 $z=0.8$（单位圆内 $|0.8|<1$，系统稳定）。
            - title: 第 2 步：在 $\omega=0$（$z=1$）处求值
              body: $z=1$ 到零点 $1$ 的距离为 $0$，到极点 $0.8$ 的距离为 $0.2$，所以 $|H(e^{j0})|=0/0.2=0$。
            - title: 第 3 步：在 $\omega=\pi$（$z=-1$）处求值并判断类型
              body: $z=-1$ 到零点 $1$ 的距离为 $|-1-1|=2$，到极点 $0.8$ 的距离为 $|-1-0.8|=1.8$，故 $|H(e^{j\pi})|=\frac{2}{1.8}=\frac{10}{9}\approx 1.111$。低频归零、高频通过，是一个典型的一阶直流隔断高通滤波器。
      - item:
          id: q2
          type: number
          prompt: 系统 $H(z)=\frac{1-z^{-1}}{1-0.8z^{-1}}$ 在奈奎斯特频率 $\omega=\pi$ 处的幅频响应 $|H(e^{j\pi})|$ 等于多少？（可填分数或保留三位小数）
          answer: 1.111111
          tolerance: 0.002
          hint: 把 $z=e^{j\pi}=-1$ 代入 $\frac{z-1}{z-0.8}$ 取绝对值。
          explain: $|H(e^{j\pi})|=\left|\frac{-1-1}{-1-0.8}\right|=\frac{2}{1.8}=\frac{10}{9}\approx 1.111$。
      - item:
          id: q3
          type: choice
          prompt: 对于一阶直流隔断高通系统 $H(z)=\frac{1-z^{-1}}{1-0.8z^{-1}}$，如果想把直流阻断凹陷变“窄”，只切掉极低频而让稍高于直流的频率尽快恢复接近 1 的增益，应该怎样微调极点 $p=0.8$？
          options:
            - text: 把极点移向原点（例如移到 $p=0.2$），离零点越远越尖锐
              why: 极点移到 $0.2$ 后远离 $z=1$，零点造成的凹陷会变得很宽，压低大段中低频
            - text: 把极点更贴近单位圆内的 $z=1$（例如 $p=0.95$）
              correct: true
            - text: 把极点推到单位圆外的 $p=1.05$，增强高频补偿
              why: 极点模长大于 1 会使因果系统立即变得不稳定
            - text: 把零点也移到 $z=-1$ 处抵消直流
              why: 零点移到 $z=-1$ 会把阻断频点挪到高频 $\omega=\pi$，变成低通而不是高通
          explain: 极点靠近 $z=1$（但保持 $|p|<1$）时，只要 $\omega$ 稍微离开 $0$，到零点与到极点的距离比值就迅速逼近 $1$，从而形成很窄的直流陷波。
      - item:
          id: q4
          type: choice
          prompt: 一个实系数二阶谐振器在单位圆内有一对共轭极点 $p_{1,2}=0.9e^{\pm j\pi/3}$。当 $\omega$ 扫描 $[0,\pi]$ 时，它的幅频响应在哪里最可能出现明显尖峰？
          options:
            - text: 在 $\omega=0$ 处，因为极点实部 $0.9\cos(\pi/3)=0.45>0$
              why: 决定峰值位置的是极点在单位圆上的辐角 $\pi/3$，而不是实部正负
            - text: 在 $\omega=\pi/3$ 附近，此处距极点最近
              correct: true
            - text: 在 $\omega=\pi$ 处，因为离两个极点的总距离最远
              why: 离极点越远分母越大，幅频响应反而越小
            - text: 不会出现峰值，因为共轭极点的虚部彼此抵消了
              why: 极点在单位圆上方 $\pi/3$ 处形成局部最小分母，幅度显著抬高
          explain: 当 $z=e^{j\omega}$ 经过极点辐角 $\omega=\pi/3$ 时，到该极点的距离降到最小值 $1-0.9=0.1$，分母极小从而抬出谐振峰。

  - id: allpass-minimum-phase
    chapter: z变换
    title: 群延迟、全通系统与最小相位分解
    minutes: 12
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 两个 FIR 滤波器 $H_1(z)=1-0.5z^{-1}$ 和 $H_2(z)=-0.5+z^{-1}$，把它们在所有频率上的幅频响应 $|H(e^{j\omega})|$ 画出来，结果完全重合。既然幅度一模一样，它们对信号的作用完全相同吗？
          options:
            - text: 完全相同，滤波器的效果只看幅频响应曲线
              why: 两者相位和脉冲响应能量分布不同，$H_1$ 把大部分能量放在 $n=0$，而 $H_2$ 推迟到了 $n=1$
            - text: 不同，它们的相位和延迟不同，能量分布不同
              correct: true
            - text: 不同，$H_2$ 会在高频产生不稳定振荡
              why: 两者都是长度 2 的 FIR 系统，都必然稳定
          explain: 幅频响应相同并不意味着系统相同。$H_1$ 的零点在单位圆内 $z=0.5$，$H_2$ 的零点在单位圆外 $z=2$，后者多引入了一段额外的相位延迟。
      - card:
          title: 群延迟与全通系统
          body: |
            只看幅频响应不够，还要看不同频率通过系统时延迟了多少步。定义**群延迟（group delay）**为相频响应对频率的负导数：

            $$\tau(\omega) = -\frac{d\,\arg H(e^{j\omega})}{d\omega}$$

            如果一个稳定有理系统对所有频率都满足 $|H_{\text{ap}}(e^{j\omega})|=1$，只改相位不改幅度，就称为**全通系统（all-pass system）**。一阶实全通系统的标准形式是：

            $$H_{\text{ap}}(z) = \frac{z^{-1} - a}{1 - a z^{-1}} \quad (|a|<1)$$

            它的极点在圆内 $z=a$，零点恰好在圆外共轭倒数位置 $z=1/a$。可以证明，任何因果稳定全通系统的群延迟在所有频率上都严格为正，总会额外拖慢信号。
      - item:
          id: q1
          type: number
          prompt: 一阶全通系统 $H_{\text{ap}}(z)=\frac{z^{-1}-a}{1-az^{-1}}$ 的群延迟公式为 $\tau(\omega)=\frac{1-a^2}{1+a^2-2a\cos\omega}$。当 $a=0.5$ 时，它在直流 $\omega=0$ 处的群延迟是多少个样本？
          answer: 3
          hint: 把 $a=0.5$ 与 $\cos 0=1$ 代入公式计算分子和分母。
          explain: 分子 $1-0.5^2=0.75$，分母 $1+0.25-2(0.5)(1)=0.25$，所以 $\tau(0)=\frac{0.75}{0.25}=3$ 个样本。在 $\omega=\pi$ 处则为 $\frac{0.75}{2.25}=\frac{1}{3}$ 个样本，处处为正。
      - card:
          title: 最小相位系统与 $H(z)=H_{\min}(z)H_{\text{ap}}(z)$ 分解
          body: |
            因果稳定系统的全部极点在单位圆内；若全部零点也严格位于圆内，就称为**最小相位系统（minimum-phase system）**，它具备三条性质：
            1. 逆系统 $1/H_{\min}(z)$ 同样因果稳定，可实时做信道均衡；
            2. 在所有同幅频响应因果系统中，群延迟最小；
            3. 能量最集中在起始处（如 $h_1=[1,-0.5]$ 开头占 $80\%$，同幅度的 $h_2=[-0.5,1]$ 仅占 $20\%$）。

            任意因果稳定有理系统都可唯一分解为 $H(z)=H_{\min}(z)H_{\text{ap}}(z)$：将圆外零点 $z_0$ 镜像折回圆内 $1/z_0^*$，差值由全通因子补齐。
      - card:
          title: 例题：把含圆外零点的系统分解为最小相位与全通的级联
          body: 将因果稳定系统 $H(z)=\frac{1-2z^{-1}}{1-0.4z^{-1}}$ 分解为 $H_{\min}(z)H_{\text{ap}}(z)$，并核对两者在单位圆上的幅度相同。
          reveal:
            - title: 第 1 步：找出圆外零点及其圆内共轭倒数镜像
              body: 极点 $z=0.4$ 已在圆内；零点 $z=2$ 在圆外，其倒数镜像为 $z=0.5$。
            - title: 第 2 步：构造全通因子把圆外零点替换掉
              body: 注意 $1-2z^{-1} = -2(z^{-1}-0.5) = -2(1-0.5z^{-1})\cdot \frac{z^{-1}-0.5}{1-0.5z^{-1}}$。
            - title: 第 3 步：写出分解结果并核对性质
              body: 得 $H_{\min}(z)=\frac{-2(1-0.5z^{-1})}{1-0.4z^{-1}}$（零点 $0.5$、极点 $0.4$ 全在圆内），$H_{\text{ap}}(z)=\frac{z^{-1}-0.5}{1-0.5z^{-1}}$（全频带幅度恒为 $1$），因此 $|H_{\min}(e^{j\omega})|=|H(e^{j\omega})|$。
      - item:
          id: q2
          type: choice
          prompt: 下列哪个因果系统的逆系统 $H_i(z)=1/H(z)$ 也是因果且 BIBO 稳定的？
          options:
            - text: $H(z)=\frac{1-2z^{-1}}{1-0.4z^{-1}}$，因为它的极点在单位圆内
              why: 逆系统的极点在 $z=2$（圆外），如果要求逆系统因果，则它不稳定
            - text: $H(z)=\frac{1-0.5z^{-1}}{1-0.4z^{-1}}$，因为零点和极点都严格在单位圆内
              correct: true
            - text: $H(z)=\frac{z^{-1}-0.5}{1-0.5z^{-1}}$，因为全通系统的幅度恒为 1 不会归零
              why: 全通系统的零点在圆外 $z=2$，其逆系统的极点就在圆外 $z=2$，不能既因果又稳定
            - text: $H(z)=\frac{1-0.5z^{-1}}{1-1.2z^{-1}}$，因为它的零点在圆内
              why: 原系统自身的极点在 $1.2$（圆外），原系统本身就不满足因果稳定
          explain: 只有最小相位系统（极点和零点全在单位圆内）才能同时保证原系统和逆系统都是因果且 BIBO 稳定的。
      - item:
          id: q3
          type: number
          prompt: 同幅频响应的两个 FIR 系统 $h_1=[1, -0.5]$（最小相位）和 $h_2=[-0.5, 1]$，总能量均为 $1.25$。最小相位系统在 $n=0$ 这一步释放的能量占总能量的百分比是多少？（填整数，不含百分号）
          answer: 80
          hint: 用 $h_1[0]^2$ 除以总能量 $h_1[0]^2+h_1[1]^2$，再化成百分比。
          explain: $h_1[0]^2 / (1^2 + (-0.5)^2) = 1 / 1.25 = 0.8$，即 $80\%$；而最大相位版本 $h_2$ 在 $n=0$ 只释放了 $0.25/1.25=20\%$。
      - item:
          id: q4
          type: choice
          prompt: 通信信道可以建模为 $H(z)=H_{\min}(z)H_{\text{ap}}(z)$。在接收端，如果只要求把失真的幅频响应拉平、允许保留额外的相位延迟，只需要用哪一个因果稳定滤波器去补偿？
          options:
            - text: 直接用 $1/H_{\text{ap}}(z)$ 即可，因为它能同时抵消全部幅度和相位失真
              why: $1/H_{\text{ap}}(z)$ 在圆外有极点（因果不稳定），且全通的幅度本身已是 1
            - text: 用 $1/H_{\min}(z)$，因为它是因果稳定的且把总幅频响应拉平为 1
              correct: true
            - text: 必须把原信道改成非因果才能拉平幅频响应
              why: 只需补偿最小相位因子 $H_{\min}(z)$，其逆系统天然是因果稳定的
            - text: 用全通滤波器 $H_{\text{ap}}(z)$ 再串联一次即可抵消幅度起伏
              why: 全通系统不改变幅度，串联后幅频起伏依旧存在
          explain: 串联因果稳定的 $1/H_{\min}(z)$ 后，总系统变为 $H(z)/H_{\min}(z)=H_{\text{ap}}(z)$，幅频响应在全频带被拉平为 $1$。

  # ==================== 第 3 章：DTFT与DFT ====================
  - id: dtft-properties-symmetry
    chapter: DTFT与DFT
    title: DTFT 的收敛、共轭对称与核心定理
    minutes: 12
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 把一个低通滤波器的冲激响应 $h_{\text{lp}}[n]$ 的奇数项全部取反，也就是逐点乘以交替符号序列 $(-1)^n$（即 $1,-1,1,-1,\dots$），得到的新滤波器会变成什么类型？
          options:
            - text: 变成高通滤波器，因为乘以 $(-1)^n=e^{j\pi n}$ 把频谱整体搬移了 $\pi$
              correct: true
            - text: 变成全阻断滤波器，因为正负号交替会把所有频率抵消掉
              why: 直流 $\omega=0$ 确实会被抵消，但原本在 $\omega=0$ 的通带整体搬到了高频 $\omega=\pi$
            - text: 依然是低通滤波器，只是输出波形上下翻转了
              why: 整体乘 $-1$ 才是上下翻转；乘 $(-1)^n$ 是随时间高速翻转的调制，会搬移频谱中心
          explain: $(-1)^n = e^{j\pi n}$，根据 DTFT 的频移定理，时域乘以 $e^{j\omega_0 n}$ 使频谱平移 $\omega_0$，于是 $\omega=0$ 的通带搬到 $\omega=\pi$，低通直接变高通。
      - card:
          title: DTFT 分析/综合公式与收敛条件
          body: |
            离散时间傅里叶变换（DTFT）把离散序列写成连续频率 $\omega\in[-\pi,\pi]$ 上复指数的叠加：

            $$X(e^{j\omega}) = \sum_{n=-\infty}^{\infty} x[n]e^{-j\omega n}, \qquad x[n] = \frac{1}{2\pi}\int_{-\pi}^{\pi} X(e^{j\omega})e^{j\omega n}\,d\omega$$

            $X(e^{j\omega})$ 必然以 $2\pi$ 为周期。若 $x[n]$ 绝对可和（$\sum|x[n]|<\infty$），级数一致收敛，频谱连续光滑。有些重要序列（如理想低通的 $\mathrm{sinc}$ 冲激响应）只满足平方可和（能量有限 $\sum|x[n]|^2<\infty$），此时级数按均方误差收敛，截断重建时在频谱跳变沿会出现波纹过冲。
      - item:
          id: q1
          type: number
          prompt: 长度 4 的矩形脉冲 $x[n]=[1, 1, 1, 1]$（$n=0,1,2,3$）的 DTFT 为 $X(e^{j\omega})=\sum_{n=0}^{3}e^{-j\omega n}$。它在 $\omega=\pi/2$ 处的幅值 $|X(e^{j\pi/2})|$ 等于多少？
          answer: 0
          hint: 把 $e^{-j\pi/2}=-j$ 代入四项 $1 + (-j) + (-j)^2 + (-j)^3$ 相加。
          explain: 四项依次是 $1, -j, -1, +j$，实部和虚部两两抵消，总和为 $0$。矩形脉冲在 $\omega=\frac{2\pi k}{L}$（$k=1,2,3$）处都是零点。
      - card:
          title: 实序列的共轭对称与核心变换定理
          body: |
            当 $x[n]$ 是实序列时，$X(e^{-j\omega})=X^*(e^{j\omega})$（共轭对称），推导出四条实用对称性：实部与幅度 $|X(e^{j\omega})|$ 是偶函数，虚部与相位 $\angle X(e^{j\omega})$ 是奇函数，因此画实信号频谱只需看 $[0,\pi]$ 一半区间。

            四条核心定理是后续滤波与谱分析的工具箱：
            - **时移**：$x[n-n_d]\leftrightarrow e^{-j\omega n_d}X(e^{j\omega})$（幅度不变，相位减线性项）；
            - **频移（调制）**：$e^{j\omega_0 n}x[n]\leftrightarrow X(e^{j(\omega-\omega_0)})$；
            - **卷积与加窗对偶**：时域卷积对应频域相乘；时域相乘（加窗）对应频域周期卷积 $\frac{1}{2\pi}\int_{-\pi}^{\pi}X(e^{j\theta})W(e^{j(\omega-\theta)})d\theta$；
            - **帕塞瓦尔定理**：$\sum_{n=-\infty}^{\infty}|x[n]|^2 = \frac{1}{2\pi}\int_{-\pi}^{\pi}|X(e^{j\omega})|^2\,d\omega$。
      - card:
          title: 例题：用共轭对称与帕塞瓦尔定理简化频域计算
          body: 1）已知实序列 $x[n]$ 在 $\omega=\pi/3$ 处满足 $X(e^{j\pi/3})=3-4j$，求 $X(e^{-j\pi/3})$ 及其幅值；2）求 $x_2[n]=0.5^n u[n]$ 对应的频域积分 $\frac{1}{2\pi}\int_{-\pi}^{\pi}|X_2(e^{j\omega})|^2 d\omega$。
          reveal:
            - title: 第 1 步：利用实序列共轭对称求负频率值
              body: 因为 $x[n]$ 为实序列，$X(e^{-j\pi/3})=X^*(e^{j\pi/3})=3+4j$。
            - title: 第 2 步：计算幅值验证偶对称
              body: $|X(e^{-j\pi/3})|=\sqrt{3^2+4^2}=5$，与 $|3-4j|=5$ 完全一致。
            - title: 第 3 步：用帕塞瓦尔定理免去复杂频域积分
              body: 无需硬算积分，直接算时域总能量：$\sum_{n=0}^{\infty}(0.5^n)^2=\sum_{n=0}^{\infty}0.25^n=\frac{1}{1-0.25}=\frac{4}{3}$。
      - item:
          id: q2
          type: number
          prompt: 已知实序列 $x[n]$ 的 DTFT 在 $\omega=\pi/3$ 处为 $X(e^{j\pi/3})=3-4j$，求 $|X(e^{-j\pi/3})|$。
          answer: 5
          hint: 实序列的幅度谱是偶函数，$|X(e^{-j\omega})|=|X(e^{j\omega})|$。
          explain: $X(e^{-j\pi/3})=3+4j$，模长为 $\sqrt{3^2+4^2}=5$。
      - item:
          id: q3
          type: number
          prompt: 设 $x[n]=0.5^n u[n]$，其 DTFT 为 $X(e^{j\omega})=\frac{1}{1-0.5e^{-j\omega}}$。利用帕塞瓦尔定理求积分 $\frac{1}{2\pi}\int_{-\pi}^{\pi}|X(e^{j\omega})|^2\,d\omega$。（可填分数如 4/3）
          answer: 1.333333
          tolerance: 0.002
          hint: 帕塞瓦尔定理把频域能量积分直接转换成时域平方和 $\sum_{n=0}^{\infty}0.25^n$。
          explain: 时域能量 $\sum_{n=0}^{\infty}0.5^{2n}=\frac{1}{1-0.25}=\frac{4}{3}\approx 1.333$，由帕塞瓦尔定理即等于该频域积分。
      - item:
          id: q4
          type: choice
          prompt: 时域上把一段无限长信号 $x[n]$ 乘以有限长窗序列 $w[n]$（即截断），在频域上会产生什么效果？
          options:
            - text: 频谱 $X(e^{j\omega})$ 与窗频谱 $W(e^{j\omega})$ 逐点相乘，高频直接归零
              why: 时域卷积才对应频域相乘；时域相乘在频域对应的是周期卷积
            - text: 频谱与窗频谱做周期卷积，尖锐谱线被展宽
              correct: true
            - text: 频谱形状完全不变，只按窗长 $L$ 等比例缩小幅度
              why: 只有无穷宽常数窗的频谱才是冲激，有限长窗的频谱有主瓣和旁瓣，会改变原频谱形状
            - text: 频谱从连续曲线变成只剩 $L$ 个离散点
              why: 有限长序列的 DTFT 依然是关于 $\omega$ 连续的周期函数，不是离散点
          explain: 根据相乘（调制/加窗）定理，时域相乘 $x[n]w[n]$ 对应频域周期卷积 $\frac{1}{2\pi}(X \circledast W)$，这是窗函数法滤波器和频谱泄漏的共同根源。

  - id: dfs-and-freq-sampling
    chapter: DTFT与DFT
    title: 离散傅里叶级数与频域采样定理
    minutes: 11
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 我们知道时域采样太稀会导致频域混叠。反过来，如果有一个连续的频谱 $X(e^{j\omega})$，我们在 $[0,2\pi)$ 上只等间隔采 $N$ 个频率点，再拿这 $N$ 个点反推时域序列，会发生什么？
          options:
            - text: 时域会以 $N$ 为周期不断延拓，$N$ 不足则发生混叠
              correct: true
            - text: 时域序列会被直接截断成前 $N$ 个点，后面的样本自动丢弃
              why: 频域采样不会简单截断尾部，而是把超出 $N$ 的尾部折返叠加到前面，造成时域混叠
            - text: 时域序列完全不变，因为只要采够 2 个频率点就能恢复任意有限长序列
              why: 长度 $L$ 的序列有 $L$ 个自由度，频域采样点数必须满足 $N\ge L$ 才能无混叠恢复
          explain: 时域与频域完全对偶：在一个域里离散采样，必然导致另一个域里周期延拓。频域采 $N$ 点会让时域以 $N$ 为周期平移叠加。
      - card:
          title: 离散傅里叶级数（DFS）与旋转因子
          body: |
            计算机无法存储连续的 $\omega$，必须先理解周期为 $N$ 的离散周期序列 $\tilde{x}[n]$（满足 $\tilde{x}[n+N]=\tilde{x}[n]$）。它可以用 $N$ 个谐波复指数精确表示，称为**离散傅里叶级数（discrete Fourier series, DFS）**。引入记号 $W_N = e^{-j\frac{2\pi}{N}}$：

            $$\tilde{X}[k] = \sum_{n=0}^{N-1} \tilde{x}[n] W_N^{kn}, \qquad \tilde{x}[n] = \frac{1}{N}\sum_{k=0}^{N-1} \tilde{X}[k] W_N^{-kn}$$

            系数 $\tilde{X}[k]$ 同样以 $N$ 为周期。若把周期序列 $\tilde{x}[n]$ 看作普通序列去求 DTFT，其频谱就是集中在 $\omega_k = \frac{2\pi k}{N}$ 处的一串脉冲：$\tilde{X}(e^{j\omega}) = \frac{2\pi}{N}\sum_{k=-\infty}^{\infty}\tilde{X}[k]\delta\left(\omega - \frac{2\pi k}{N}\right)$。
      - item:
          id: q1
          type: number
          prompt: 周期 $N=4$ 的序列 $\tilde{x}[n]$ 在一个周期内取值为 $[1, 0, -1, 0]$（$n=0,1,2,3$）。它的 DFS 系数 $\tilde{X}[1]$ 等于多少？
          answer: 2
          hint: 此时 $W_4 = e^{-j\pi/2} = -j$，代入 $\tilde{X}[1]=\sum_{n=0}^{3}\tilde{x}[n](-j)^n$。
          explain: $\tilde{X}[1] = 1\cdot(-j)^0 + 0 + (-1)\cdot(-j)^2 + 0 = 1 - (-1) = 2$。完整一个周期的 DFS 系数为 $[0, 2, 0, 2]$。
      - card:
          title: 频域采样与时域周期延拓
          body: |
            现在考虑非周期序列 $x[n]$ 及其连续 DTFT $X(e^{j\omega})$。如果在 $[0,2\pi)$ 上做**频域采样（frequency-domain sampling）**，取出 $N$ 个等间隔频点 $\tilde{X}[k] = X(e^{j\frac{2\pi}{N}k})$，再对 $\tilde{X}[k]$ 做逆 DFS，得到的周期序列 $\tilde{x}[n]$ 并不是原序列本身，而是原序列的周期延拓叠加：

            $$\tilde{x}[n] = \sum_{r=-\infty}^{\infty} x[n + rN]$$

            如果 $x[n]$ 是长度为 $L$ 的有限长序列（非零范围 $0\le n\le L-1$）：当 $N\ge L$ 时，相邻副本互不重叠，取主值区间 $0\le n\le N-1$ 就能无失真恢复 $x[n]$；一旦 $N<L$，尾部副本就会折回叠加到头部，发生时域混叠。
      - card:
          title: 例题：6 点序列在频域只采 4 点会发生什么？
          body: 已知长度 $L=6$ 的序列 $x[n]=[1, 2, 3, 4, 5, 6]$（$n=0\dots 5$），在其 DTFT 上只等间隔采样 $N=4$ 个频点再做 4 点逆 DFS，求主值区间 $n=0,1,2,3$ 的结果 $\tilde{x}[n]$。
          reveal:
            - title: 第 1 步：列出周期延拓公式
              body: $N=4<L=6$，发生时域混叠，每一点等于原序列相隔 $4$ 的所有样本之和：$\tilde{x}[n]=\sum_r x[n+4r]$。
            - title: 第 2 步：逐点叠加尾部折返项
              body: $\tilde{x}[0]=x[0]+x[4]=1+5=6$；$\tilde{x}[1]=x[1]+x[5]=2+6=8$；$\tilde{x}[2]=x[2]=3$；$\tilde{x}[3]=x[3]=4$。
            - title: 第 3 步：给出避免混叠的最小采样点数
              body: 得到混叠后的主值 $[6, 8, 3, 4]$。要想从频域采样无失真还原 $x[n]$，频域采样点数必须满足 $N\ge L=6$。
      - item:
          id: q2
          type: number
          prompt: 长度 $L=6$ 的序列 $x[n]=[1, 2, 3, 4, 5, 6]$ 的 DTFT 在 $[0,2\pi)$ 上只等间隔采样 $N=5$ 点并做 5 点逆变换，结果中 $n=0$ 处的值 $\tilde{x}[0]$ 是多少？
          answer: 7
          hint: 频域采 5 点，时域以几为周期折返？哪个样本会落回 $n=0$？
          explain: 时域以 5 为周期折返，$x[5]=6$ 落回 $n=0$，与 $x[0]=1$ 相加，得 $\tilde{x}[0]=1+6=7$。
      - item:
          id: q3
          type: number
          prompt: 若要通过等间隔采样 $X(e^{j\omega})$ 后无时域混叠地还原一个长度为 $L=15$ 的有限长序列，频域采样点数 $N$ 至少需要多少？
          answer: 15
          hint: 无时域混叠要求延拓周期 $N$ 不小于序列长度 $L$。
          explain: 只有当 $N\ge L=15$ 时，时域周期延拓副本才互不重叠，从而能精确恢复原序列。
      - item:
          id: q4
          type: choice
          prompt: 两个周期均为 $N$ 的序列 $\tilde{x}_1[n]$ 和 $\tilde{x}_2[n]$，把它们的 DFS 系数逐点相乘 $\tilde{X}_1[k]\tilde{X}_2[k]$，在时域对应的运算是什么？
          options:
            - text: 无限长的普通线性卷积，结果不再是周期序列
              why: 两个周期序列的无限长线性卷积会发散，DFS 乘积对应一个周期内的周期卷积
            - text: 在一个周期 $0\le m\le N-1$ 内求和的周期卷积 $\sum_{m=0}^{N-1}\tilde{x}_1[m]\tilde{x}_2[n-m]$
              correct: true
            - text: 时域两个周期序列直接逐点相乘 $\tilde{x}_1[n]\tilde{x}_2[n]$
              why: 时域逐点相乘对应频域的周期卷积（带 $1/N$ 因子），正好相反
            - text: 频谱平移 $N/2$ 个点，相位保持不变
              why: 系数逐点相乘是滤波/卷积作用，不是频移操作
          explain: DFS 的周期卷积定理指出，频域 DFS 系数逐点相乘对应时域单周期内的周期卷积，这是 DFT 圆周卷积性质的直接前身。

  - id: dft-definition-properties
    chapter: DTFT与DFT
    title: 有限长序列的 DFT、补零插值与圆周卷积
    minutes: 13
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 给定 4 点序列 $x[n]=[1, 1, 1, 1]$，算完它的 4 点 DFT 后，如果我们在末尾补上 4 个零变成 $[1, 1, 1, 1, 0, 0, 0, 0]$ 再做 8 点 DFT，新多出来的那 4 个频点是从哪里来的？
          options:
            - text: 原连续 DTFT 曲线在原来 4 点之间采出的插值点
              correct: true
            - text: 它们带来了新的高频信息，把真实物理分辨率提高了一倍
              why: 补进去的全是 0，没有增加任何新信号观测，连续 DTFT 曲线本身一动没动
            - text: 因为末尾补的是 0，多出来的 4 个频点也必定全是 0
              why: 原 4 点序列的 DTFT 并不是处处为 0，只是原来的 4 个采样点恰好踩在了零点上
          explain: 在序列末尾补零不改变它的 DTFT $X(e^{j\omega})$，只是把频域采样步长从 $2\pi/4$ 加密成 $2\pi/8$，因此多出的频点是对同一条 DTFT 曲线的插值。
      - card:
          title: 有限长序列的 DFT 与补零插值
          body: |
            把 DFS 限制在主值区间 $0\le n,k\le N-1$，就得到有限长序列的 $N$ 点离散傅里叶变换（DFT）及**逆离散傅里叶变换（IDFT）**：

            $$X[k] = \sum_{n=0}^{N-1} x[n]W_N^{kn}, \qquad x[n] = \frac{1}{N}\sum_{k=0}^{N-1} X[k]W_N^{-kn}$$

            本质上，$X[k]$ 就是该有限长序列连续 DTFT 在 $N$ 个等距点上的采样：$X[k] = \left.X(e^{j\omega})\right|_{\omega = 2\pi k/N}$。在序列末尾追加若干零值进行**补零（zero-padding）**，不会改变求和式里的非零项，因此 DTFT 曲线保持不变，只是把取样网格加密，让曲线轮廓看得更细，但不提升区分两个临近频率的真实分辨率。
      - item:
          id: q1
          type: choice
          prompt: 对序列 $x[n]=[1, 1, 1, 1]$ 计算 4 点 DFT，再将其补零为 8 点 $[1, 1, 1, 1, 0, 0, 0, 0]$ 计算 8 点 DFT。下列哪项描述准确？
          options:
            - text: 4 点 DFT 为 $[4,0,0,0]$；8 点偶数点不变，奇数点采出非零插值
              correct: true
            - text: 4 点 DFT 为 $[4, 0, 0, 0]$；8 点 DFT 只是多补了 4 个零，变成 $[4, 0, 0, 0, 0, 0, 0, 0]$
              why: 矩形脉冲的连续 DTFT 在 $\omega=\pi/4, 3\pi/4$ 处并不为零，补零后采样网格正好落到了这些非零位置
            - text: 4 点 DFT 为 $[1, 1, 1, 1]$；8 点 DFT 会把每个点幅值加倍
              why: $x=[1,1,1,1]$ 是常数脉冲，能量集中在直流 $k=0$ 处（值为 4），其余 3 点全抵消为 0
            - text: 补零改变了原始信号的能量，使 8 点 DFT 的直流分量变成 8
              why: 末尾加的都是 0，直流求和 $\sum x[n]$ 仍等于 4
          explain: 4 点 DFT 是 $[4, 0, 0, 0]$；补零到 8 点后偶数索引对应原来的 4 个频率（值仍为 $4,0,0,0$），奇数索引采到了连续 DTFT 旁瓣与主瓣坡面上的非零插值点（$|X_8[1]|\approx 2.613, |X_8[3]|\approx 1.082$）。
      - card:
          title: 圆周移位、共轭对称与圆周卷积
          body: |
            由于 DFT 隐含以 $N$ 为周期延拓，它的移位不是普通线性平移，而是模 $N$ 卷绕的**圆周移位（circular shift）** $x[((n-m))_N]$——从右端移出的样本会从左端重新进来。时域圆周右移 $m$ 步，频域乘以 $W_N^{km}$。

            对实序列的 $N$ 点 DFT，共轭对称写成 $X[N-k]=X^*[k]$（例如 $N=8$ 时 $X[6]=X^*[2]$）。更重要的是，两个 $N$ 点 DFT 逐点相乘 $X_1[k]X_2[k]$，逆变换回来的是 $N$ 点圆周卷积：

            $$y_c[n] = (x_1 \circledast_N x_2)[n] = \sum_{m=0}^{N-1} x_1[m]\,x_2[((n-m))_N]$$
      - card:
          title: 例题：对比 4 点圆周卷积与线性卷积的折返关系
          body: 已知 $x_1[n]=[1, 2, 0, 1]$ 与 $x_2[n]=[2, 1, 1, 0]$（均为 4 点序列），求它们的 4 点圆周卷积 $y_c[n]$，并看清它与普通线性卷积 $y_l[n]$ 的联系。
          reveal:
            - title: 第 1 步：先算普通的 7 点线性卷积 $y_l[n]$
              body: $y_l[0]=2$，$y_l[1]=1+4=5$，$y_l[2]=1+2+0=3$，$y_l[3]=0+2+0+2=4$，$y_l[4]=0+0+1=1$，$y_l[5]=1$，$y_l[6]=0$，即 $y_l=[2, 5, 3, 4, 1, 1, 0]$。
            - title: 第 2 步：把超出 $N=4$ 的尾巴按模 4 折回叠加到头部
              body: $y_c[0]=y_l[0]+y_l[4]=2+1=3$；$y_c[1]=y_l[1]+y_l[5]=5+1=6$；$y_c[2]=y_l[2]+y_l[6]=3+0=3$；$y_c[3]=y_l[3]=4$。
            - title: 第 3 步：核对结论
              body: 4 点圆周卷积结果为 $[3, 6, 3, 4]$。它本质上就是线性卷积以 $N=4$ 为周期做时域混叠的结果。
      - item:
          id: q2
          type: number
          prompt: 已知 4 点序列 $x_1=[1, 2, 0, 1]$ 与 $x_2=[2, 1, 1, 0]$ 的线性卷积为 $[2, 5, 3, 4, 1, 1, 0]$。它们 4 点圆周卷积的第 2 个样本 $y_c[1]$ 等于多少？
          answer: 6
          hint: 把线性卷积里索引 $1$ 和 $1+4=5$ 两个位置的值相加。
          explain: $y_c[1] = y_l[1] + y_l[5] = 5 + 1 = 6$。圆周卷积就是线性卷积按模 $N$ 折返叠加。
      - item:
          id: q3
          type: choice
          prompt: 一个 8 点实序列做 8 点 DFT，已知 $X[2]=3-5j$，则 $X[6]$ 必然等于什么？
          options:
            - text: $3+5j$，由实序列共轭对称决定
              correct: true
            - text: $-3+5j$，因为实部和虚部都关于 $N/2$ 反号
              why: 实部是偶对称不变号，只有虚部反号（取共轭）
            - text: $3-5j$，因为 $X[2]$ 和 $X[6]$ 位于对称位置值完全相同
              why: 只有幅度相等，相位反号，因此复数必须取共轭
            - text: 无法确定，除非知道原序列是否偶对称
              why: 任何实值序列的 DFT 都自动满足共轭对称，不需要序列本身偶对称
          explain: 对实序列的 8 点 DFT，$X[8-2]=X[6]=X^*[2]=3+5j$。
      - item:
          id: q4
          type: choice
          prompt: 为什么工程上说“补零不能提高区分两个临近正弦频率的真实分辨率”？
          options:
            - text: 因为补零会引入新的混叠噪声把弱信号淹没
              why: 时域补零不会引起时域或频域混叠，它只是忠实插值原有的 DTFT
            - text: 补零不改变 DTFT 主瓣宽度，只加密采样点
              correct: true
            - text: 因为补零后 DFT 只能算偶对称频点，丢失了一半频率信息
              why: 补零后所有原频点都保留，还额外插出了中间的频点
            - text: 因为末尾补零会导致旋转因子失去周期性
              why: 更大点数 $N$ 的旋转因子照样以 $N$ 为周期
          explain: 如果原观测时长太短导致两条正弦的 DTFT 主瓣已经融成一个峰，补再多零也只是把那个融在一起的峰画得更光滑，无法拆开成两个峰。

  - id: dft-linear-conv-and-dct
    chapter: DTFT与DFT
    title: 用 DFT 算线性卷积与离散余弦变换
    minutes: 12
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 用 DFT 相乘再反变换算出来的默认是圆周卷积。如果输入信号长 $L=5$、滤波器长 $P=4$，想用 DFT 精准算出它们的普通线性卷积而不发生尾巴折返混叠，至少要把两条序列都补零到多长再做 DFT？
          options:
            - text: 补到较长者 $5$ 点即可，因为滤波器比信号短
              why: 线性卷积总长是 $5+4-1=8$，用 5 点圆周卷积会把后 3 个点折回前头
            - text: 补到 $5+4-1=8$ 点，使线性卷积结果刚好装进一个周期不重叠
              correct: true
            - text: 补到 $5\times 4=20$ 点，防止交叉项互相干扰
              why: 卷积长度是相加减 1 而不是相乘，补到 8 点已完全无混叠
          explain: 长度为 $L$ 和 $P$ 的序列做线性卷积，结果长度为 $L+P-1$。只要选取 $N\ge L+P-1$ 并将两者补零至 $N$ 点，圆周卷积就与线性卷积逐点完全一致。
      - card:
          title: 补零免混叠与长信号的分段快速卷积
          body: |
            单次用 DFT 算线性卷积只需选 $N\ge L+P-1$，两序列补零至 $N$ 点即可免去圆周折返。面对数百万点的流式信号，需把长输入切段逐块与长度 $M$ 的滤波器卷积：
            - **重叠相加法（Overlap-Add, OLA）**：输入切成互不重叠的 $L$ 点短段，每段补零至 $N\ge L+M-1$ 做线性卷积，再把相邻块重合的 $M-1$ 个尾部样本相加。
            - **重叠保留法（Overlap-Save, OLS）**：直接做 $N$ 点圆周卷积，每块含前段末尾 $M-1$ 个旧点与 $N-M+1$ 个新点，丢弃开头 $M-1$ 个混叠点后拼接。
      - card:
          title: 例题：比较重叠相加与重叠保留的切块配置
          body: 已知 FIR 滤波器长度 $M=3$，采用 $N=8$ 点 FFT 处理长信号流。分别计算重叠相加法和重叠保留法每块处理的新样本数以及重叠/丢弃的点数。
          reveal:
            - title: 第 1 步：重叠相加法（OLA）的切块配置
              body: 要求每块输入长 $L$ 满足 $L+M-1\le N$，即 $L+3-1\le 8 \implies L=6$。每块读入 $6$ 个新样本并补 $2$ 个零做 8 点 FFT；输出 8 点中最后 $M-1=2$ 个点与下一块开头 2 点相加。
            - title: 第 2 步：重叠保留法（OLS）的切块配置
              body: 每块送入 8 点不补零：开头重复取上一段末尾的 $M-1=2$ 个旧样本，后面接 $N-M+1=6$ 个新样本。做 8 点圆周卷积后，扔掉开头 $2$ 个混叠点，保留后 $6$ 个准确输出。
            - title: 第 3 步：对比两者共同效率
              body: 两种方法在相同 $N=8, M=3$ 下，每做一次 8 点 FFT 都正好产出 $6$ 个准确输出样本，只是 OLA 在输出端做加法，OLS 在输入端做重叠切窗。
      - item:
          id: q1
          type: number
          prompt: 用重叠保留法配合 $N=8$ 点 FFT 实现长度 $M=3$ 的 FIR 滤波，每做一次 8 点圆周卷积后，应该保留多少个无混叠的有效输出样本？
          answer: 6
          hint: 开头有 $M-1$ 个样本会被圆周卷绕污染，用总长 $N$ 减去 $M-1$。
          explain: $N-M+1 = 8-3+1 = 6$。每块丢弃前 $2$ 个受混叠影响的点，保留后 $6$ 个有效输出。
      - item:
          id: q2
          type: choice
          prompt: 使用重叠相加法（OLA）时，若输入每段切为 $L=6$ 点、滤波器长 $M=3$ 点，相邻两块卷积输出的重叠部分要怎样处理？
          options:
            - text: 直接丢弃后一块开头的 2 个点，因为它们和前一块尾巴重复了
              why: 丢弃开头是重叠保留法的做法；OLA 的每一块都是独立补零的线性卷积，需要叠加
            - text: 把前一块输出末尾的 2 个点与后一块输出开头的 2 个点逐点相加
              correct: true
            - text: 把重叠的 2 个点取算术平均，防止输出能量加倍
              why: 线性系统满足叠加原理，前一块的拖尾与后一块的起始是两段不同输入的线性贡献，必须直接相加而不是取平均
            - text: 把滤波器长度缩短为 1，从而消除所有重叠
              why: 改变滤波器长度会完全破坏原滤波器的频率响应
          explain: 根据叠加原理，输入拆成多段不重叠子信号之和，总输出等于各段线性卷积之和，因此相邻段重叠的 $M-1=2$ 个点直接相加。
      - card:
          title: 离散余弦变换（DCT）与能量压缩
          body: |
            压缩图片块或音频帧时，DFT 首尾直接相连会造出边界跳变（如 `[1,2,3,4]` 从 4 跌回 1），在高频撒出大量非零系数。

            **离散余弦变换（discrete cosine transform, DCT）**（常用 DCT-II）隐含左右镜像偶对称延拓，消除了边界跳变且全程用实数运算：

            $$X^c[k] = 2\sum_{n=0}^{N-1} x[n]\cos\!\left(\frac{\pi k(2n+1)}{2N}\right), \qquad 0\le k\le N-1$$

            斜坡 `[1,2,3,4]` 经 4 点 DCT-II 后，超过 $99\%$ 的能量都聚在 $k=0,1$ 两项里，丢掉高频几乎不失真。
      - item:
          id: q3
          type: number
          prompt: 对 4 点常数序列 $x[n]=[2, 2, 2, 2]$ 按公式 $X^c[k]=2\sum_{n=0}^{3}x[n]\cos\left(\frac{\pi k(2n+1)}{8}\right)$ 计算 DCT-II，其直流系数 $X^c[0]$ 等于多少？
          answer: 16
          hint: 当 $k=0$ 时，每一项的余弦值都是 $\cos(0)=1$，把四项相加再乘前面的系数 2。
          explain: $X^c[0]=2\times(2+2+2+2)=16$，且其余系数 $X^c[1]=X^c[2]=X^c[3]=0$，全部能量集中在一个系数里。
      - item:
          id: q4
          type: choice
          prompt: 相比同样长度的 DFT，图片与音频压缩标准偏爱 DCT 的核心原因是什么？
          options:
            - text: DCT 对任意序列都能无损还原，而 DFT 因为用了复数会丢失信息
              why: DFT 同样能够完全无损还原，两者的差别在于能量集中度与实数运算
            - text: 偶对称延拓消除了块边界突变，实系数更高度集中在低频
              correct: true
            - text: DCT 的计算复杂度是 $O(N)$，远低于 FFT 的 $O(N\log N)$
              why: 快速 DCT 同样依赖 FFT 思想，复杂度也是 $O(N\log N)$
            - text: DCT 不受块大小限制，哪怕非平滑白噪声也能压缩掉 99% 的数据
              why: 能量集中依赖信号的空间或时间相关性，完全不相关的白噪声经任何正交变换能量都依然均匀分散
          explain: 偶对称延拓消除了首尾拼接造成的阶跃跳变，使 DCT 的高频分量衰减比 DFT 快得多，从而以极少系数高保真重建平滑块。

  # ==================== 第 4 章：采样与重建 ====================
  - id: sampling-aliasing-reconstruction
    chapter: 采样与重建
    title: 周期采样、频域混叠与理想带限重建
    minutes: 12
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 一段模拟声音里同时包含 $1\text{ kHz}$ 和 $3\text{ kHz}$ 两个正弦波。如果用 $f_s=4\text{ kHz}$ 的采样率去采它，采样之后在频谱上能分辨出几个频率？
          options:
            - text: 依然是 $1\text{ kHz}$ 和 $3\text{ kHz}$ 两个频率，因为 $4\text{ kHz}$ 大于 $3\text{ kHz}$
              why: 采样率必须大于最高频率的两倍（$6\text{ kHz}$），而不是仅仅大于最高频率本身
            - text: 只能看到 $1\text{ kHz}$，因为 $3\text{ kHz}$ 混叠折返到了 $1\text{ kHz}$
              correct: true
            - text: 只能看到 $3\text{ kHz}$，因为高频分量把低频分量覆盖掉了
              why: $1\text{ kHz}$ 低于 $2\text{ kHz}$ 不会混叠，是超过 $2\text{ kHz}$ 的 $3\text{ kHz}$ 折返落在了 $4-3=1\text{ kHz}$ 处
          explain: $4\text{ kHz}$ 采样的奈奎斯特频率是 $2\text{ kHz}$。$3\text{ kHz}$ 折返到 $|4-3|=1\text{ kHz}$，采出的样本序列与真正的 $1\text{ kHz}$ 完全重合，无法区分。
      - card:
          title: 周期采样的频域表示与奈奎斯特采样定理
          body: |
            以周期 $T=1/f_s$ 对连续信号 $x_c(t)$ 等间隔采样得到 $x[n]=x_c(nT)$。它在频域产生的效果是把连续频谱 $X_c(j\Omega)$ 按采样角频率 $\Omega_s=2\pi/T$ 周期复制并缩放：

            $$X(e^{j\omega}) = \frac{1}{T}\sum_{k=-\infty}^{\infty} X_c\!\left(j\frac{\omega - 2\pi k}{T}\right), \qquad \omega = \Omega T = \frac{2\pi f}{f_s}$$

            若 $x_c(t)$ 是最高频率为 $\Omega_N$（$f_{\max}$）的带限信号，相邻复制副本互不重叠的条件正是奈奎斯特采样定理：$\Omega_s > 2\Omega_N$（即 $f_s > 2f_{\max}$）。一旦某频率 $f > f_s/2$，就会落入 $[0, f_s/2]$ 内的折叠视在频率 $f_{\text{alias}} = \min_k |f - k f_s|$，发生无法还原的混叠。
      - item:
          id: q1
          type: number
          prompt: 一个 $2300\text{ Hz}$ 的连续余弦信号，以 $f_s=1000\text{ Hz}$ 的采样率采样后，在 $[0, 500\text{ Hz}]$ 内看到的视在混叠频率是多少 Hz？
          answer: 300
          hint: 找最接近 $2300$ 的 $1000$ 的整数倍，求它们差的绝对值。
          explain: 取 $k=2$，$|2300 - 2\times 1000| = 300\text{ Hz}$，在离散样本上 $\cos(2\pi\cdot 2300 n/1000)=\cos(2\pi\cdot 300 n/1000)$。
      - card:
          title: 理想带限重建与辛克插值公式
          body: |
            只要满足无混叠条件 $f_s>2f_{\max}$，原信号频谱 $X_c(j\Omega)$ 就完整保留在主频带 $|\Omega|<\pi/T$（即 $|f|<f_s/2$）内。重建只需两步：把离散样本变成加权冲激串 $\sum x[n]\delta(t-nT)$，再送入截止频率为 $\Omega_c=\pi/T$（$f_c=f_s/2$）、通带增益为 $T$ 的理想低通滤波器。

            该理想低通滤波器的冲激响应为 $h_r(t)=\frac{\sin(\pi t/T)}{\pi t/T}=\mathrm{sinc}(t/T)$，因此时域重建写成著名的理想带限插值公式：

            $$x_r(t) = \sum_{n=-\infty}^{\infty} x[n]\,\mathrm{sinc}\!\left(\frac{t - nT}{T}\right)$$

            每个采样点贡献一朵以 $nT$ 为中心、在其他所有采样瞬间 $mT$（$m\neq n$）恰好过零的辛克波形，叠加后严丝合缝地还原出任意时刻的连续波形。
      - card:
          title: 例题：双正弦混叠分析与理想重建指标核对
          body: 信号 $x_c(t)=\cos(2\pi\cdot 1000 t)+\cos(2\pi\cdot 3000 t)$ 以 $f_s=4000\text{ Hz}$ 采样，分析离散数字频率、采样后能分辨的频率以及理想重建滤波器的规格。
          reveal:
            - title: 第 1 步：把两个模拟频率换算为数字角频率 $\omega=2\pi f/f_s$
              body: $1000\text{ Hz}$ 对应 $\omega_1=\frac{2\pi\times 1000}{4000}=\frac{\pi}{2}$；$3000\text{ Hz}$ 对应 $\omega_2=\frac{2\pi\times 3000}{4000}=\frac{3\pi}{2}$。
            - title: 第 2 步：利用离散正弦 $2\pi$ 周期性与偶对称性看混叠
              body: $\cos(\frac{3\pi}{2}n)=\cos((\frac{3\pi}{2}-2\pi)n)=\cos(-\frac{\pi}{2}n)=\cos(\frac{\pi}{2}n)$。两条余弦在每个整数点 $n$ 上取值一模一样，合成 $x[n]=2\cos(\frac{\pi}{2}n)$。
            - title: 第 3 步：写出理想重建结果与无混叠最低采样率
              body: 通过截止在 $f_s/2=2000\text{ Hz}$、增益为 $T=0.25\text{ ms}$ 的理想低通（辛克插值）后，重建出的信号是 $2\cos(2\pi\cdot 1000 t)$，$3000\text{ Hz}$ 分量永久丢失。若要两者都不混叠，需要 $f_s > 2\times 3000 = 6000\text{ Hz}$。
      - item:
          id: q2
          type: number
          prompt: 信号含 $1\text{ kHz}$ 与 $3\text{ kHz}$ 两个正弦分量，以 $4\text{ kHz}$ 采样后只看到 $1\text{ kHz}$。若要让两个频率都无混叠地保留下来，采样率至少必须大于多少 kHz？
          answer: 6
          hint: 按奈奎斯特采样定理，采样率必须严格大于最高频率的两倍。
          explain: 最高频率 $f_{\max}=3\text{ kHz}$，故需要 $f_s > 2\times 3 = 6\text{ kHz}$。
      - item:
          id: q3
          type: choice
          prompt: 已知连续信号已经无混叠地按周期 $T=1/f_s$ 采样为 $x[n]$，理想 D/C 重建阶段所用的理想低通滤波器应具备什么规格？
          options:
            - text: 截止频率为 $f_s$，通带增益为 $1$，冲激响应为矩形脉冲
              why: 截止在 $f_s$ 会把位于 $f_s$ 附近的第一个镜像副本一并放出来，且增益 $1$ 会让重建幅度缩小为 $1/T$
            - text: 截止 $f_s/2$、增益 $T$，对应辛克核
              correct: true
            - text: 截止频率为 $f_s/4$，通带增益为 $2T$，以留出一倍保护间隔
              why: 截止在 $f_s/4$ 会把原信号位于 $[f_s/4, f_s/2]$ 的合法高频直接切掉
            - text: 不需要滤波器，直接把离散点用折线连起来就是理想重建
              why: 折线连接是一阶保持近似，频谱衰减不够快，会残余高频镜像
          explain: 采样使频谱高度乘以 $1/T$ 并以 $f_s$ 为周期复制，因此理想重建滤波器必须截止在 $f_s/2$ 且通带增益取 $T$ 来恢复原幅度。
      - item:
          id: q4
          type: choice
          prompt: 理想重建公式 $x_r(t)=\sum_n x[n]\mathrm{sinc}((t-nT)/T)$ 为什么在任意采样时刻 $t=mT$ 处都能精确还原出 $x[m]$？
          options:
            - text: 因为辛克函数在 $|t|>T$ 之外恒为零，每个区间只受单个样本控制
              why: 辛克函数拖尾延伸到正负无穷，只是在所有非零整数点处恰好穿零
            - text: 因 $\mathrm{sinc}(m-n)$ 在 $n=m$ 为 $1$、其余整数为 $0$
              correct: true
            - text: 因为采样之前已经把信号归一化到了单位幅度
              why: 精准插值与信号幅度大小无关，靠的是辛克核在整数格点上的穿零正交性
            - text: 因为理想低通滤波器把所有高于 $f_s/2$ 的采样点直接删掉了
              why: 滤波器滤除的是频域高频镜像，不是删掉时域采样点
          explain: 当 $t=mT$ 时，$\mathrm{sinc}(m-n)=\delta[m-n]$，求和式里除 $n=m$ 那一项保留 $x[m]\cdot 1$ 外，其余所有项都乘以 $0$ 消失。

  - id: discrete-processing-analog-oversampling
    chapter: 采样与重建
    title: 模拟信号的离散处理与过采样噪声整形
    minutes: 12
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 一个模数转换器（ADC）只有 12 位精度，但硬件时钟很快。如果我们把采样率提高到原来所需奈奎斯特速率的 4 倍（4 倍过采样），再在数字域用低通滤波器把多出来的宽频带切掉，有效信噪比会怎样？
          options:
            - text: 不变，因为 ADC 还是 12 位，每次采样的量化台阶大小没变
              why: 总量化噪声功率确实没变，但它被摊薄到了 4 倍宽的频带上，数字低通会切掉其中 $3/4$ 的噪声
            - text: 提高约 $6\text{ dB}$（等效增 1 位），因滤掉了带外噪声
              correct: true
            - text: 会下降一半，因为采样越快，每秒钟引入的量化误差次数越多
              why: 每次误差独立，总平均功率仍为 $\Delta^2/12$，分散到更宽频带后落在信号带内的噪声反而更少
          explain: 量化噪声功率 $\Delta^2/12$ 均匀铺在 $[0, f_s/2]$ 上。把 $f_s$ 提高 $M$ 倍后，信号带宽占比缩为 $1/M$，经数字低通滤除带外噪声后，带内噪声功率降为 $1/M$。
      - card:
          title: 用数字滤波器等效处理模拟信号与分数延迟
          body: |
            把理想 C/D 采样、数字 LTI 滤波器 $H(e^{j\omega})$ 和理想 D/C 重建串联起来，对带限于 $|\Omega|<\pi/T$ 的模拟输入，整条链路等效为一个连续时间 LTI 系统：

            $$H_{\text{eff}}(j\Omega) = \begin{cases} H(e^{j\Omega T}), & |\Omega| < \pi/T \\ 0, & |\Omega| \ge \pi/T \end{cases}$$

            数字截止角频率 $\omega_c$ 对应的模拟截止频率就是 $f_c=\frac{\omega_c}{2\pi}f_s$。这套等价关系反过来也能帮离散序列做连续时间处理：例如离散序列本身没法直接移位半个样本，但通过 D/C → 连续延迟 $\Delta T$ → C/D，就得到理想的**分数延迟**离散滤波器 $H(e^{j\omega})=e^{-j\omega\Delta}$。
      - item:
          id: q1
          type: number
          prompt: 一个数字低通滤波器的数字截止角频率为 $\omega_c=\pi/4$，放在采样率 $f_s=16\text{ kHz}$ 的 C/D → $H(e^{j\omega})$ → D/C 系统中运行。它对输入模拟信号的等效截止频率是多少 kHz？
          answer: 2
          hint: 利用映射关系 $f_c = \frac{\omega_c}{2\pi} f_s$ 计算。
          explain: $\frac{\pi/4}{2\pi}\times 16\text{ kHz} = \frac{1}{8}\times 16\text{ kHz} = 2\text{ kHz}$。只需改变系统时钟 $f_s$，同一套数字滤波系数就能按比例缩放模拟截止频率。
      - card:
          title: 实用模数/数模转换链路与量化信噪比
          body: |
            真实硬件由抗混叠模拟低通、采样保持（**零阶保持 ZOH**）和 $B$ 位均匀量化**模数转换器（ADC）**组成；**数模转换器（DAC）**阶梯波受 ZOH 的 $\mathrm{sinc}$ 衰减，常在数字端预先做逆 $\mathrm{sinc}$ 补偿。

            满量程正弦波经 $B$ 位均匀量化（步长 $\Delta$，量化噪声近似均值为 0、方差 $\Delta^2/12$ 的白噪声）时，**量化信噪比（SQNR）**满足：

            $$\text{SQNR} \approx 6.02 B + 1.76 \text{ dB}$$

            每多 1 位增加约 $6.02\text{ dB}$。
      - item:
          id: q2
          type: number
          prompt: 按满量程正弦波量化信噪比公式 $\text{SQNR}\approx 6.02B+1.76\text{ dB}$，一个 12 位均匀量化 ADC 的理论 SQNR 是多少 dB？（精确到整数或两位小数）
          answer: 74
          tolerance: 0.1
          hint: 每多 1 位，SQNR 增加多少分贝？公式里还有哪个常数？
          explain: $6.02\times 12 + 1.76 = 72.24 + 1.76 = 74.00\text{ dB}$。
      - card:
          title: 过采样与 $\Sigma\text{-}\Delta$ 噪声整形
          body: |
            为了用低位数高速 ADC 拿到高信噪比，现代音频芯片采用两项技术：
            - **过采样（oversampling）**：以 $M$ 倍速率采样再数字滤波，带内噪声降为 $1/M$，采样率每翻倍提升 $+3.01\text{ dB}$（$+0.5$ 位）；
            - **噪声整形（noise shaping）**：在 $\Sigma\text{-}\Delta$ 调制环路中让信号直接通过、让量化误差经高通因子 $(1-z^{-1})$ 滤波，把噪声推向带外高频再滤除；一阶噪声整形每翻倍采样率可换来 $+9\text{ dB}$（$+1.5$ 位）增益。
      - card:
          title: 例题：算清 16 位音频 SQNR 与过采样提升量
          body: 1）计算 16 位光盘音频和 12 位工业 ADC 对满量程正弦波的理论 SQNR；2）若 12 位 ADC 采用 $M=4$ 倍纯过采样（不含噪声整形），带内 SQNR 提高多少分贝？
          reveal:
            - title: 第 1 步：代入满量程正弦 SQNR 公式
              body: 16 位：$\text{SQNR}_{16} = 6.02\times 16 + 1.76 = 98.08\text{ dB}$；12 位：$\text{SQNR}_{12} = 6.02\times 12 + 1.76 = 74.00\text{ dB}$。
            - title: 第 2 步：计算 $M=4$ 倍过采样后的带内噪声缩减
              body: 噪声功率铺宽 4 倍，数字低通只保留 $1/4$ 的频带，噪声功率降为 $1/4$，信噪比提升 $10\log_{10}(4)\approx 6.02\text{ dB}$。
            - title: 第 3 步：换算有效位数并对比噪声整形
              body: 提升 $6.02\text{ dB}$ 恰好相当于增加 1 位有效分辨率（变为 13 位，$80.02\text{ dB}$）。若进一步加一阶噪声整形，4 倍（翻两次倍）可带来约 $18\text{ dB}$（3 位）的提升。
      - item:
          id: q3
          type: number
          prompt: 不使用噪声整形时，将采样率提高为原来的 $M=16$ 倍并配合数字低通滤除带外噪声，能使带内 SQNR 提高约多少 dB？（保留一位小数，提示 $\log_{10}2\approx 0.301$）
          answer: 12.0
          tolerance: 0.15
          hint: 带内噪声功率降为原来的 $1/16$，计算 $10\log_{10}(16)=40\log_{10}(2)$。
          explain: $10\log_{10}(16) = 4\times 3.0103 \approx 12.04\text{ dB}$，恰好等价于增加 2 位有效分辨率。
      - item:
          id: q4
          type: choice
          prompt: 在一阶 $\Sigma\text{-}\Delta$ 过采样 ADC 中，噪声整形环路为什么能比纯过采样获得高得多的信噪比提升？
          options:
            - text: 它通过反馈把量化步长 $\Delta$ 缩小为原来的 $1/M$，从源头消除了量化误差
              why: 环路内部的量化器甚至只有 1 位，步长很大，总量化噪声功率并未减少
            - text: 对量化误差施加高通滤波推至带外，再由数字低通滤除
              correct: true
            - text: 它在模拟输入端先用数字滤波器把噪声滤干净再送入 ADC
              why: 模拟信号在进 ADC 之前还不是数字序列，且量化噪声是在 ADC 量化环节才产生的
            - text: 它把高频信号折叠到低频区，用信号能量覆盖掉了量化底噪
              why: 折叠高频是混叠失真，过采样恰恰避免混叠，噪声整形移动的是噪声频谱而不是信号频谱
          explain: 噪声整形利用反馈对信号与量化误差呈现不同传递函数：信号原样通过，误差经过高通 $(1-z^{-1})$ 被挤向高频，随后被数字低通滤波和抽取一举清除。

  # ==================== 第 5 章：快速傅里叶变换 ====================
  - id: fft-dit-dif
    chapter: 快速傅里叶变换
    title: 基 2 按时间抽取与按频率抽取 FFT
    minutes: 13
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 直接按定义算一次 $N=1024$ 点的 DFT 大约要做 $N^2 \approx 105$ 万次复数乘法。如果改用基 2 快速傅里叶变换（FFT），复数乘法次数大约会降到多少？
          options:
            - text: 大约降到一半，约 52 万次
              why: FFT 利用分治把 $O(N^2)$ 降到了 $O(N\log_2 N)$，降幅远不止一半
            - text: 约 5120 次，快了 200 多倍
              correct: true
            - text: 降到 1024 次，每个样本只乘一次
              why: 需要 $\log_2 1024=10$ 级蝶形运算，每级 $N/2=512$ 次乘法，共 $5120$ 次，而不是 $1024$ 次
          explain: 基 2 FFT 的复数乘法量约为 $\frac{N}{2}\log_2 N = 512\times 10 = 5120$ 次，相比直接计算的 $1{,}048{,}576$ 次快了 $204.8$ 倍，而且算出的结果与直接 DFT 数学上完全一致。
      - card:
          title: 旋转因子的对称性与基 2 按时间抽取 FFT（DIT-FFT）
          body: |
            直接算 $N$ 点 DFT 共有 $N$ 个频点、每个频点累加 $N$ 项，需要 $N^2$ 次复数乘法和 $N(N-1)$ 次复数加法。之所以浪费，是因为反复重算了**旋转因子（twiddle factor）** $W_N^{kn}=e^{-j\frac{2\pi}{N}kn}$，而它有两条关键性质：
            - **周期性**：$W_N^{k+N} = W_N^k$；
            - **半周期反号对称性**：$W_N^{k+N/2} = -W_N^k$。

            当 $N=2^\nu$ 时，**按时间抽取 FFT（decimation-in-time FFT, DIT-FFT）**把输入 $x[n]$ 拆成偶数序号 $x[2r]$ 和奇数序号 $x[2r+1]$ 两段长为 $N/2$ 的序列，分别算它们的 $N/2$ 点 DFT 记为 $G[k]$ 和 $H[k]$，再借助对称性合并：

            $$X[k] = G[k] + W_N^k H[k], \qquad X[k + N/2] = G[k] - W_N^k H[k] \quad (0\le k < N/2)$$

            一对输入 $(G[k], H[k])$ 只需算一次乘法 $W_N^k H[k]$ 就同时产出两个频点，这就是 DIT 蝶形。逐级二分 $\log_2 N$ 次，总复数乘法仅需 $\frac{N}{2}\log_2 N$，复数加法 $N\log_2 N$。
      - card:
          title: 例题：用 4 点 DIT-FFT 手算 $x[n]=[1, 2, 3, 4]$ 的 DFT
          body: 对 $x[n]=[1, 2, 3, 4]$ 按基 2 DIT-FFT 流程分两级算出 4 点 DFT，核对每个蝶形的数值。
          reveal:
            - title: 第 1 步：按时域奇偶分成两段 2 点序列并算 2 点 DFT
              body: 偶序列 $g=[x[0], x[2]]=[1, 3]$，2 点 DFT 为 $G[0]=1+3=4$，$G[1]=1-3=-2$；奇序列 $h=[x[1], x[3]]=[2, 4]$，2 点 DFT 为 $H[0]=2+4=6$，$H[1]=2-4=-2$。
            - title: 第 2 步：准备第 2 级旋转因子 $W_4^0$ 与 $W_4^1$
              body: $W_4^0 = e^0 = 1$，$W_4^1 = e^{-j\pi/2} = -j$。
            - title: 第 3 步：执行两个 DIT 蝶形得到全部 4 个频点
              body: $k=0$ 蝶形：$X[0]=G[0]+1\cdot H[0]=4+6=10$，$X[2]=4-6=-2$。$k=1$ 蝶形：$W_4^1 H[1]=(-j)(-2)=2j$，故 $X[1]=G[1]+2j=-2+2j$，$X[3]=G[1]-2j=-2-2j$。
      - item:
          id: q1
          type: number
          prompt: 计算 $N=1024$ 点的基 2 FFT，按公式 $\frac{N}{2}\log_2 N$ 估算需要多少次复数乘法？
          answer: 5120
          hint: 先算 $\log_2 1024 = 10$，再乘以 $N/2 = 512$。
          explain: $\frac{1024}{2}\times \log_2(1024) = 512 \times 10 = 5120$ 次，相比直接计算的 $1024^2=1{,}048{,}576$ 次快了 $204.8$ 倍。
      - item:
          id: q2
          type: choice
          prompt: 在 4 点 DIT-FFT 计算 $x=[1, 2, 3, 4]$ 时，已知偶子序列 DFT 为 $G=[4, -2]$、奇子序列 DFT 为 $H=[6, -2]$，旋转因子 $W_4^1=-j$。则 $X[1]$ 与 $X[3]$ 分别是多少？
          options:
            - text: $X[1]=-2-2j$，$X[3]=-2+2j$
              why: 注意 $W_4^1 H[1] = (-j)\times(-2) = +2j$，负负得正
            - text: $X[1]=-2+2j$，$X[3]=-2-2j$
              correct: true
            - text: $X[1]=2+2j$，$X[3]=2-2j$
              why: 偶子序列的 $G[1]=x[0]-x[2]=1-3=-2$，实部是 $-2$ 而不是 $+2$
            - text: $X[1]=-4$，$X[3]=0$
              why: 忘记乘以旋转因子 $W_4^1=-j$，直接把 $-2$ 与 $-2$ 做实数加减了
          explain: 先算 $W_4^1 H[1]=(-j)(-2)=2j$，再由蝶形公式得 $X[1]=G[1]+2j=-2+2j$，$X[3]=G[1]-2j=-2-2j$。
      - card:
          title: 按频率抽取 FFT（DIF-FFT）与借用 FFT 算 IFFT
          body: |
            如果不拆分输入、而是把输出频点分成偶数频点 $X[2r]$ 和奇数频点 $X[2r+1]$，就得到**按频率抽取 FFT（decimation-in-frequency FFT, DIF-FFT）**。它的蝶形把输入前半段与后半段直接配对：

            $$a' = a + b, \qquad b' = (a - b) W_N^k$$

            DIT 与 DIF 的总计算量完全相同，差别在于：DIT **先乘旋转因子再做加减**，输入位倒序、输出自然序；DIF **先做加减再对差值乘旋转因子**，输入自然序、输出位倒序。

            硬件里通常不必另造一套**逆快速傅里叶变换（IFFT）**电路：把频谱 $X[k]$ 先取共轭，送进正向 FFT，再把输出取共轭并除以 $N$，就精确得到逆变换：

            $$x[n] = \frac{1}{N}\left(\text{FFT}\!\left\{X^*[k]\right\}\right)^*$$
      - item:
          id: q3
          type: choice
          prompt: 对比标准基 2 DIT-FFT 蝶形与 DIF-FFT 蝶形的运算次序，以下哪项准确？
          options:
            - text: DIT 蝶形比 DIF 蝶形少一半复数乘法，因此工程里几乎不用 DIF
              why: 两者复数乘法次数完全相同，都是 $\frac{N}{2}\log_2 N$
            - text: DIT 先乘旋转因子再加减；DIF 先加减再对差乘旋转因子
              correct: true
            - text: DIT 只能算实数序列，DIF 专门用于复数序列
              why: 两者都通用复数输入序列，是对同一 DFT 矩阵的两种对称因子分解
            - text: DIT 算的是正向 DFT，DIF 算的是逆向 IFFT
              why: 两者都是正向 DFT 算法，都可以用来快速算 IFFT
          explain: DIT（按时间抽取）先乘旋转因子再加减，输入需位倒序；DIF（按频率抽取）先加减再对差支路乘旋转因子，输出呈位倒序。
      - item:
          id: q4
          type: order
          prompt: 若芯片中只内置了正向 FFT 运算单元，要把频谱 $X[k]$ 还原为时域序列 $x[n]$（IFFT），请按正确先后顺序排列步骤。
          steps:
            - 对输入频谱 $X[k]$ 逐点取复共轭得到 $X^*[k]$
            - 将 $X^*[k]$ 送入正向 FFT 运算单元执行计算
            - 对 FFT 运算单元的输出逐点取复共轭
            - 将结果逐点除以点数 $N$ 得到 $x[n]$
          explain: 因为 $\left(\sum X^*[k]W_N^{kn}\right)^* = \sum X[k]W_N^{-kn}$，再除以 $N$ 正好等于 IDFT 定义式。

  - id: fft-implementation-and-general
    chapter: 快速傅里叶变换
    title: FFT 工程实现、通用算法与有限字长效应
    minutes: 12
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 在 8 点 DIT-FFT 开始前，需要把输入样本按“位倒序”重新排队：把序号写成 3 位二进制再左右翻转。那么原本排在 3 号（二进制 `011`）的样本，会被挪到几号位置？
          options:
            - text: 挪到 5 号（二进制 `101`）
              why: '`011` 左右翻转后最高位和中间位都是 1、最低位是 0，即 `110`'
            - text: 挪到 6 号（二进制 `110`）
              correct: true
            - text: 留在 3 号不动，因为 3 是奇数
              why: 只有回文二进制序号（如 `000`、`010`、`101`、`111`）才留在原地不动
          explain: 3 的 3 位二进制是 `011`，左右镜像反转变成 `110`，对应十进制 6，因此 3 号与 6 号样本互换位置。
      - card:
          title: 原位运算、位倒序重排与旋转因子查表
          body: |
            基 2 FFT 之所以能放进片上小存储空间，归功于**原位运算（in-place computation）**：每个蝶形读入两个存储单元的值，算完两个输出后直接写回原位置，整帧只需 $N$ 个复数单元。

            原位运算的代价是输入和输出不能同时保持自然顺序：在 DIT-FFT 中，输入必须先做**位倒序重排（bit-reversal）**——将 $\nu=\log_2 N$ 位二进制序号左右翻转（例如 $N=8$ 时自然序 `0..7` 变为 `[0, 4, 2, 6, 1, 5, 3, 7]`），之后经 $\nu$ 级蝶形（每级 $N/2$ 个蝶形）就能按自然序输出频谱。工程实现还把 $\cos/\sin$ 旋转因子提前算好存进查找表，避免在运算过程中现场计算三角函数。
      - item:
          id: q1
          type: number
          prompt: 实现一个 $N=64$ 点的基 2 FFT，总共包含 $\log_2 N$ 级蝶形运算，每一级有多少个蝶形单元？
          answer: 32
          hint: 每个蝶形同时处理一对（2 个）样本，用总点数 $N$ 除以 2。
          explain: $N=64$ 有 $\log_2 64=6$ 级，每级有 $N/2=32$ 个蝶形，各级之间以原位覆盖方式传递数据。
      - card:
          title: 非 2 次幂点数、Goertzel 与线性调频 z 变换
          body: |
            当点数 $N$ 不是 $2$ 的幂时，有三类常用方案：
            - **混合基 FFT**：将合数 $N=N_1 N_2\cdots N_m$ 拆为短 DFT 组合，复杂度保持 $O(N\sum N_i)$。
            - **Goertzel 算法（Goertzel algorithm）**：用二阶实系数递推谐振器计算单个频点 $X[k]$，只测极少数频率（如电话 **DTMF** 双音多频按键：12 个键只用到 8 个频率；一般要求 $K<\log_2 N$）时比整帧 FFT 更省算力和存储。
            - **线性调频 z 变换（Chirp-z / Bluestein）**：借 $nk=\frac{1}{2}[n^2+k^2-(k-n)^2]$ 将任意素数点 DFT 改写为线性卷积，再用 2 次幂 FFT 在 $O(N\log N)$ 内精确求出。
      - card:
          title: 例题：8 点位倒序对照与定点 FFT 防溢出缩放
          body: 1）写出 8 点 DIT-FFT 的完整位倒序序号序列；2）若 64 点定点 FFT 每一级蝶形输入前都乘以缩放因子 $1/2$ 以防加法溢出，总缩放倍率是多少？
          reveal:
            - title: 第 1 步：逐项反转 3 位二进制序号
              body: '`000→000(0)`、`001→100(4)`、`010→010(2)`、`011→110(6)`、`100→001(1)`、`101→101(5)`、`110→011(3)`、`111→111(7)`，得重排序列 `[0, 4, 2, 6, 1, 5, 3, 7]`。'
            - title: 第 2 步：分析每级蝶形为何可能发生定点溢出
              body: 蝶形输出 $a + W b$ 的模长最多可增至 $|a|+|b|$，每一级幅度最多翻 2 倍；在定点存储单元（固定字长）中若不缩放，经过几级就会溢出失真。
            - title: 第 3 步：计算逐级乘 $1/2$ 的总倍率与噪声权衡
              body: $N=64$ 共 $\log_2 64=6$ 级，每级缩为 $1/2$，总倍率为 $(1/2)^6 = 1/64 = 1/N$。逐级缩放消除了溢出风险，但也会让每级舍入噪声在输出端累积，因此工程上常在有限字长下于溢出保护与信噪比之间折中（或采用块浮点缩放）。
      - item:
          id: q2
          type: choice
          prompt: 嵌入式单片机需要从 205 个电话语音样本中只检测 8 个固定按键音（DTMF）频率的能量，存储空间非常紧张。以下哪种算法最契合这个场景？
          options:
            - text: 补零到 256 点做整帧基 2 FFT，同时算出全部 256 个频点
              why: 整帧 FFT 要额外开辟 256 点复数缓冲，还要算 248 个用不上的频点，存储空间和算力浪费更大
            - text: Goertzel 算法，用二阶递推直接算出所需的 8 个指定频点
              correct: true
            - text: 直接把 205 点拆成基 4 FFT，因为 205 接近 256
              why: 205 不能被 4 整除，不能直接做基 4 FFT
            - text: 必须用线性调频 z 变换先转为 512 点卷积再做两次 FFT
              why: Chirp-z 适合一次性求大批量或素数全频谱，只求 8 个点时开销远大于 Goertzel
          explain: 当所需频点数 $K$ 远小于 $\log_2 N$（或需精确匹配非 2 次幂帧长 $N=205$）时，Goertzel 算法以极小存储和 $O(KN)$ 运算直接给出目标频点。
      - item:
          id: q3
          type: choice
          prompt: 线性调频 z 变换（Chirp-z / Bluestein 算法）能让任意素数长度 $N$ 的 DFT 也在 $O(N\log N)$ 时间内完成，它的核心数学桥梁是什么？
          options:
            - text: 把素数 $N$ 直接四舍五入成最近的 2 的幂次并截掉尾部样本
              why: 截掉尾部样本会改变原 DFT 的精确结果，Bluestein 算法算出的是精确无损的 $N$ 点 DFT
            - text: 把 DFT 改写为线性卷积，再用 2 次幂 FFT 计算
              correct: true
            - text: 利用实序列对称性把素数分解为两个偶数之和
              why: 把 $N$ 拆成和不能把二维旋转因子矩阵拆成乘积，无法直接降维
            - text: 用定点移位替代所有复数乘法，使乘法次数降为零
              why: Chirp-z 仍需复数乘法，加速来自把任意点 DFT 转化为 2 次幂长度的快速卷积
          explain: Bluestein 恒等式把乘积项 $nk$ 换成平方项与差平方项 $(k-n)^2$，从而化为线性卷积，借用长度 $\ge 2N-1$ 的基 2 FFT 实现 $O(N\log N)$ 精确计算。
      - item:
          id: q4
          type: choice
          prompt: 在固定字长的定点处理器上运行基 2 FFT 时，为什么常在每一级蝶形引入 $1/2$ 缩放因子？它的主要代价是什么？
          options:
            - text: 为了防止蝶形加法溢出；代价是舍入噪声占比上升
              correct: true
            - text: 为了加快旋转因子乘法速度；代价是频率分辨率降低一半
              why: 右移 1 位并不改变点数或频率分辨率，主要目的是防溢出，代价是信噪比损失
            - text: 为了消除位倒序重排步骤；代价是输出频谱相位反转
              why: 缩放是纯实数幅度因子，不改变位倒序结构，也不反转相位
            - text: 为了使原位运算不再覆盖输入样本；代价是存储空间加倍
              why: 缩放仍在原位进行，不需要额外存储空间
          explain: 每级蝶形幅度最多翻倍，逐级乘 $1/2$（二进制右移 1 位）可保证绝不溢出，但也会把小信号压向最低有效位，使有限字长舍入噪声占比上升。

  # ==================== 第 6 章：FIR滤波器设计 ====================
  - id: generalized-linear-phase-fir
    chapter: FIR滤波器设计
    title: 滤波器指标、广义线性相位与四类 FIR
    minutes: 12
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 医学心电图滤波需要尽量不把脉冲波形的形状“抹歪”。如果滤波器对低频延迟 10 个样本、对高频延迟 25 个样本，波形会怎样？
          options:
            - text: 波形形状完全不变，只是整体慢了一点
              why: 不同频率延迟不同，原本在同一时刻对齐的谐波会被拉散，导致波形严重畸变
            - text: 各频率错位，波形出现相位失真
              correct: true
            - text: 波形幅度自动归零，因为相位差把信号全抵消了
              why: 信号能量还在，只是各频率分量不再同步到达，造成时域波形展宽或振铃
          explain: 要保持复杂波形（如心电脉冲、数字通信码元）不发生相位畸变，需要通带内所有频率经历相同的群延迟，即线性相位。
      - card:
          title: 滤波器指标与广义线性相位
          body: |
            设计任何数字低通滤波器，都要先写清四项指标：通带截止频率 $\omega_p$、阻带起始频率 $\omega_s$（两者之差 $\Delta\omega=\omega_s-\omega_p$ 为过渡带宽）、通带允许最大波纹 $\delta_1$（幅度落在 $1\pm\delta_1$ 内）和阻带最大波纹 $\delta_2$（幅度不超过 $\delta_2$，常以阻带衰减 $A_s=-20\log_{10}\delta_2\text{ dB}$ 表示）。

            为了避免相位失真，FIR 滤波器常要求具备**广义线性相位（generalized linear phase）**：

            $$H(e^{j\omega}) = A(e^{j\omega})\,e^{-j\alpha\omega + j\beta}$$

            其中 $A(e^{j\omega})$ 为实函数（允许正负变号），$\beta\in\{0,\pm\pi/2\}$ 为常数，因此除零点跳变外群延迟恒为常数 $\alpha$。对阶数为 $M$（长度 $L=M+1$）的因果实 FIR，只要脉冲响应关于中心 $\alpha=M/2$ 对称或反对称（$h[n]=\pm h[M-n]$），就严格拥有广义线性相位。
      - item:
          id: q1
          type: number
          prompt: 一个长度为 $L=21$（阶数 $M=20$）的偶对称因果线性相位 FIR 滤波器，其恒定群延迟 $\alpha$ 是多少个样本？
          answer: 10
          hint: 对称中心在 $M/2=(L-1)/2$ 处。
          explain: $\alpha = M/2 = 20/2 = 10$ 个样本。偶数阶（奇数长度）的群延迟正好是整数个样本，在需要时间对齐的系统里十分方便。
      - card:
          title: 四类线性相位 FIR 滤波器及其强制零点
          body: |
            按对称性（偶对称 $+$ / 奇对称 $-$）与阶数 $M$（偶 / 奇）的组合，线性相位 FIR 分为四类，每类在 $\omega=0$ 或 $\omega=\pi$ 处有天然的强制零点限制：

            | 类型 | 对称条件 | 阶数 $M$（长度 $L$） | 强制零点 | 适用滤波类型 |
            |---|---|---|---|---|
            | **I 型** | $h[n]=h[M-n]$ | 偶（奇数长） | 无强制零点 | 通用：低通/高通/带通/带阻 |
            | **II 型** | $h[n]=h[M-n]$ | 奇（偶数长） | $\omega=\pi$（$z=-1$） | 低通、带通（不能做高通/带阻） |
            | **III 型** | $h[n]=-h[M-n]$ | 偶（奇数长） | $\omega=0$ 且 $\omega=\pi$ | 微分器、希尔伯特变换器（把各频率成分的相位都移 90°）、带通 |
            | **IV 型** | $h[n]=-h[M-n]$ | 奇（偶数长） | $\omega=0$（$z=1$） | 微分器、希尔伯特变换器、高通 |

            另外，由于 $h[n]=\pm h[M-n]$，线性相位 FIR 的零点呈倒数对称分布：若 $z_0$ 是零点，则 $1/z_0$（以及实系数时的 $z_0^*$ 和 $1/z_0^*$）必然也是零点。
      - card:
          title: 例题：验证 II 型与 III 型 FIR 的强制零点
          body: 分别检验 II 型序列 $h_{\text{II}}=[1, 2, 2, 1]$（$M=3$）在 $\omega=\pi$ 处的响应，以及 III 型序列 $h_{\text{III}}=[1, 2, 0, -2, -1]$（$M=4$）在 $\omega=0$ 和 $\omega=\pi$ 处的响应。
          reveal:
            - title: 第 1 步：代入 $\omega=\pi$（$e^{-j\pi n}=(-1)^n$）检查 II 型
              body: $H_{\text{II}}(e^{j\pi}) = 1 - 2 + 2 - 1 = 0$。偶数长偶对称序列的奇偶项成对抵消，因此 II 型在高频 $\omega=\pi$ 处永远为零，无法设计高通滤波器。
            - title: 第 2 步：检查 III 型在 $\omega=0$ 与 $\omega=\pi$ 的响应
              body: $H_{\text{III}}(e^{j0}) = 1 + 2 + 0 - 2 - 1 = 0$；$H_{\text{III}}(e^{j\pi}) = 1 - 2 + 0 - (-2) - 1 = 0$。两处同时归零，不能做低通或高通。
            - title: 第 3 步：核对零点镜像规律
              body: 如果一个实系数线性相位 FIR 在单位圆内 $z=0.5$ 处有一个实零点，由倒数对称性它在单位圆外 $z=1/0.5=2$ 处也必有一个零点，因此非平凡线性相位 FIR 一般不是最小相位系统。
      - item:
          id: q2
          type: choice
          prompt: 工程师要设计一个数字高通滤波器，希望采用严格线性相位 FIR 结构。以下哪两类结构不能选用？
          options:
            - text: I 型和 IV 型，因为它们在 $\omega=\pi$ 处存在强制零点
              why: I 型无强制零点，IV 型只在 $\omega=0$ 处有零点，两者都允许 $\omega=\pi$ 高频通过
            - text: II 型和 III 型，它们在 $\omega=\pi$ 强制归零
              correct: true
            - text: III 型和 IV 型，因为反对称序列不能产生实数输出
              why: 只要系数 $h[n]$ 是实数，输出就是实数，IV 型非常适合做高通或微分器
            - text: I 型和 II 型，因为偶对称结构只适合低通滤波器
              why: I 型在 $\omega=0$ 和 $\omega=\pi$ 都没有强制零点，是最通用的线性相位 FIR 类型
          explain: 高通滤波器必须在高频 $\omega=\pi$ 处畅通无阻，而 II 型和 III 型在 $\omega=\pi$ 处恒为零，因此不能用于高通或带阻设计。
      - item:
          id: q3
          type: number
          prompt: 若一个实系数线性相位 FIR 滤波器在复平面 $z=0.5$ 处有一个零点，根据零点的倒数对称性，它在实轴上必然成对出现的另一个零点位于 $z=$ 多少？
          answer: 2
          hint: 对称条件 $H(z)=\pm z^{-M}H(z^{-1})$ 说明若 $H(z_0)=0$，则 $H(1/z_0)=0$。
          explain: $1/0.5 = 2$。单位圆外的镜像零点与圆内零点成对出现，保证相位线性。
      - item:
          id: q4
          type: match
          prompt: 将四类线性相位 FIR 滤波器与各自的典型特征配对。
          pairs:
            - ['I 型（偶对称、偶数阶 $M$）', '无强制零点、整数样本群延迟，四类通带全适用']
            - ['II 型（偶对称、奇数阶 $M$）', '在 $\omega=\pi$ 强制为零、半整数群延迟，不能做高通']
            - ['III 型（反对称、偶数阶 $M$）', '在 $\omega=0$ 与 $\omega=\pi$ 均强制为零，适用带通与微分器']
            - ['IV 型（反对称、奇数阶 $M$）', '仅在 $\omega=0$ 强制为零，适用高通与宽带微分器']
          explain: 牢记 $h[n]=\pm h[M-n]$ 在 $z=1$ 和 $z=-1$ 处是否正负抵消，就能直接推出四类滤波器的零点限制。

  - id: fir-window-and-kaiser
    chapter: FIR滤波器设计
    title: 窗函数法、吉布斯现象与 Kaiser 窗设计
    minutes: 13
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 理想低通滤波器的冲激响应是无限长的辛克序列。如果我们直接拿剪刀（矩形窗）截取中间一段 $h[n]$，并且不断把截取长度从 21 点加长到 201 点甚至 2001 点，通带边缘那个大约 9% 的波纹高度（过冲）会逐渐消失吗？
          options:
            - text: 会逐渐消失，只要阶数足够高，矩形截断就能把波纹压到任意小
              why: 增大阶数只会让波纹变得更窄、挤向截止边缘，最大过冲峰值始终停留在约 9%（阻带衰减卡在 21 dB）
            - text: 不会消失，过渡带变窄但约 9% 过冲不变
              correct: true
            - text: 阶数越大波纹反而越高，最终导致滤波器发散
              why: 截断后的 FIR 依然有限长且稳定，峰值收敛到固定常数约 9%，不会发散
          explain: 这就是吉布斯现象：矩形窗频谱的第一旁瓣相对主瓣高度固定在约 $-13\text{ dB}$，增加长度 $M$ 只能压缩过渡带宽，无法压低阻带最大波纹（约 $21\text{ dB}$ 衰减）。
      - card:
          title: 窗函数法原理、吉布斯现象与经典窗权衡
          body: |
            理想线性相位低通的冲激响应是无限长非因果的 $h_d[n]=\frac{\sin[\omega_c(n-M/2)]}{\pi(n-M/2)}$。窗函数法将其乘以长度为 $M+1$ 的有限对称窗 $w[n]$ 得到因果线性相位 FIR：$h[n]=h_d[n]w[n]$。频域上，这是理想矩形响应与窗频谱 $W(e^{j\omega})$ 的周期卷积。

            若用矩形窗直接截断，边缘会出现固定约 $9\%$ 的**吉布斯现象（Gibbs phenomenon）**。改用两端平滑衰减到零的窗函数，可以大幅压低**旁瓣峰值（peak sidelobe level）**从而提高阻带衰减 $A_s$，但代价是中心**主瓣宽度（mainlobe width）**变宽，过渡带 $\Delta f=\frac{\Delta\omega}{2\pi}$ 随之变宽：

            | 窗函数 | 旁瓣峰值 | 最小阻带衰减 $A_s$ | 过渡带估算 $\Delta f$（归一化 $f_s$） |
            |---|---|---|---|
            | 矩形窗 | $-13\text{ dB}$ | $21\text{ dB}$ | $\approx 0.9 / M$ |
            | Hann 窗（汉宁窗） | $-31\text{ dB}$ | $44\text{ dB}$ | $\approx 3.1 / M$ |
            | Hamming 窗（汉明窗） | $-41\text{ dB}$ | $53\text{ dB}$ | $\approx 3.3 / M$ |
            | Blackman 窗（布莱克曼窗） | $-57\text{ dB}$ | $74\text{ dB}$ | $\approx 5.5 / M$ |
      - item:
          id: q1
          type: number
          prompt: 用汉明窗（Hamming 窗，经验公式 $M\approx 3.3/\Delta f$）设计线性相位 FIR 低通滤波器，要求过渡带宽 $\Delta f = 0.05$（以采样频率归一化），大约需要多少阶 $M$？
          answer: 66
          hint: 直接代入 $M \approx 3.3 / 0.05$ 计算。
          explain: $M \approx 3.3 / 0.05 = 66$ 阶（对应长度 $L=67$ 的 I 型对称 FIR），同时自动获得约 $53\text{ dB}$ 的阻带衰减。
      - card:
          title: Kaiser 窗：用形状因子 $\beta$ 自由调节主瓣与旁瓣
          body: |
            固定窗函数只有几个离散挡位（如 $44\text{ dB}$、$53\text{ dB}$、$74\text{ dB}$），若指标要 $60\text{ dB}$ 阻带衰减，选汉明窗不够、选布莱克曼窗又阶数太浪费。**Kaiser 窗（Kaiser window）**通过零阶修正贝塞尔函数 $I_0$ 引入连续可调的形状因子 $\beta$，把“衰减目标 $A$”与“过渡带宽 $\Delta\omega$”直接写成闭式设计公式：

            $$M \approx \frac{A - 8}{2.285\,\Delta\omega}$$

            $$\beta = \begin{cases} 0.1102(A - 8.7), & A > 50 \\ 0.5842(A - 21)^{0.4} + 0.07886(A - 21), & 21 \le A \le 50 \\ 0, & A < 21 \end{cases}$$

            当 $\beta=0$ 时退化为矩形窗；$\beta$ 越大，窗边缘收得越柔和，旁瓣越低而主瓣越宽。
      - card:
          title: 例题：按 Kaiser 窗公式设计 $50\text{ dB}$ 阻带衰减的低通 FIR
          body: 要求设计低通 FIR，阻带衰减 $A=50\text{ dB}$，通带边缘 $\omega_p=0.4\pi$、阻带边缘 $\omega_s=0.6\pi$（即过渡带宽 $\Delta\omega=0.2\pi$）。按 Kaiser 窗公式求所需阶数 $M$ 与形状因子 $\beta$。
          reveal:
            - title: 第 1 步：代入阶数公式估算最小阶数 $M$
              body: $\Delta\omega = 0.2\pi \approx 0.6283\text{ rad}$，所以 $M \approx \frac{50 - 8}{2.285\times 0.2\pi} = \frac{42}{1.4357} \approx 29.25$。
            - title: 第 2 步：向上取偶数阶得到 I 型滤波器
              body: 向上取整得 $M=30$（偶数阶对应 I 型线性相位，长度 $L=31$，整数群延迟 $15$ 个样本）。
            - title: 第 3 步：代入分段公式计算 $\beta$
              body: $A=50$ 落在 $21\le A\le 50$ 区间：$\beta = 0.5842(50-21)^{0.4} + 0.07886(50-21) \approx 2.2466 + 2.2869 \approx 4.53$。随后用截止频率 $\omega_c=(\omega_p+\omega_s)/2=0.5\pi$ 的理想低通乘以该 Kaiser 窗即可。
      - item:
          id: q2
          type: number
          prompt: 用 Kaiser 窗设计低通滤波器，指标为 $A=50\text{ dB}$、过渡带宽 $\Delta\omega=0.2\pi$，公式给出 $M\approx \frac{50-8}{2.285\times 0.2\pi}\approx 29.25$。为了同时满足指标并构成 I 型对称 FIR，阶数 $M$ 应向上取为多少？
          answer: 30
          hint: 阶数必须不小于 $29.25$，且 I 型滤波器要求偶数阶 $M$。
          explain: 向上取最近的偶数阶得 $M=30$（长度 $L=31$），既满足阻带衰减与过渡带指标，又具有整数群延迟 $15$。
      - item:
          id: q3
          type: number
          prompt: 若设计目标提高到阻带衰减 $A=60\text{ dB}$，按 Kaiser 窗 $A>50$ 分段公式 $\beta=0.1102(A-8.7)$，形状因子 $\beta$ 约等于多少？（保留两位小数）
          answer: 5.65
          tolerance: 0.02
          hint: 先算 $60 - 8.7 = 51.3$，再乘以 $0.1102$。
          explain: $\beta = 0.1102 \times 51.3 = 5.65326 \approx 5.65$。相比 $A=50\text{ dB}$ 的 $\beta\approx 4.53$，更大的 $\beta$ 把窗函数两头压得更平滑以压低旁瓣。
      - item:
          id: q4
          type: choice
          prompt: 同样阶数 $M$ 下，把窗函数从矩形窗换成布莱克曼窗（Blackman 窗），滤波器的幅频响应会出现怎样的权衡变化？
          options:
            - text: 阻带衰减大幅提高，但过渡带也明显变宽
              correct: true
            - text: 阻带衰减和过渡带陡峭度同时大幅改善，没有任何代价
              why: 窗频谱的主瓣宽度与旁瓣高度是一对互相牵制的权衡，压低旁瓣必然展宽主瓣
            - text: 过渡带变窄一半，但阻带衰减下降到 13 dB
              why: 方向正好写反了：矩形窗主瓣最窄但旁瓣最高，布莱克曼窗旁瓣极低但主瓣最宽
            - text: 滤波器失去线性相位，变成 IIR 结构
              why: 对称的布莱克曼窗乘以对称的理想冲激响应依然保持严格线性相位和 FIR 结构
          explain: 平滑窗通过牺牲主瓣宽度（放宽过渡带）来换取更低的旁瓣峰值（更高的阻带衰减）；想要更窄过渡带，就必须同时加大阶数 $M$。

  - id: fir-equiripple-and-comparison
    chapter: FIR滤波器设计
    title: 等波纹最优 FIR、频率采样法与 FIR/IIR 比较
    minutes: 12
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 观察窗函数法设计出来的低通 FIR 误差曲线：误差最大的地方全部挤在通带和阻带的边缘，而在远离边缘的通带内部和阻带深处，误差几乎小到看不见。这说明窗函数法有什么浪费？
          options:
            - text: 没有任何浪费，通带和阻带内部误差越小越好
              why: 在给定阶数下，内部多余的精度其实是被白白闲置的自由度，没有用来压低边缘处超标的误差
            - text: 内部自由度闲置，摊平误差可降阶
              correct: true
            - text: 说明窗函数法只能设计奇数阶滤波器
              why: 窗函数法奇偶阶都可以设计，核心局限在于无法按极小极大准则把误差均匀摊平
          explain: 窗函数法把误差堆在边缘，而等波纹最优逼近把允许的最大误差均匀铺满整个通带和阻带，从而在同样指标下显著降低滤波器阶数。
      - card:
          title: 等波纹最优逼近、交错定理与 Parks-McClellan 算法
          body: |
            按极小极大准则设计线性相位 FIR，目标是最小化通阻带最大加权误差 $\max_{\omega\in F}|W(\omega)[H_d(e^{j\omega})-A(e^{j\omega})]|$，其中权重 $W(\omega)$ 可独立指定 $\delta_1$ 与 $\delta_2$ 的比例（窗函数法强制两者近似相等）。

            **交错定理（alternation theorem）**给出充要条件：含 $L_{\cos}=M/2$ 项余弦的 I 型 FIR 唯一最优，当且仅当加权误差至少有 $L_{\cos}+2$ 个正负交替的等幅极值点（**等波纹逼近，equiripple**）。**Parks-McClellan 算法**借 **Remez** 交换逐步逼近这些极值频点并求出最优系数。
      - item:
          id: q1
          type: number
          prompt: 用 Parks-McClellan 算法设计一个阶数 $M=10$ 的 I 型等波纹最优低通 FIR（余弦项数 $L_{\cos}=M/2=5$）。根据交错定理，其加权误差在通带与阻带内至少会出现多少个正负交替的最大极值点？
          answer: 7
          hint: 代入 I 型交错定理下限 $L_{\cos} + 2 = M/2 + 2$。
          explain: $M/2 + 2 = 5 + 2 = 7$ 个正负交替的等幅极值点。一旦逐步逼近出这样的等波纹曲线，就能证明不存在同阶的更优滤波器。
      - card:
          title: 频率采样法与 FIR / IIR 综合比较
          body: |
            另一种直观的 FIR 设计思路是**频率采样法（frequency sampling method）**：直接把理想频响在 $N$ 个 DFT 频点 $\omega_k=2\pi k/N$ 上抽样，做 $N$ 点 IDFT 就得到长度 $N$ 的 $h[n]$。如果在通阻带之间硬跳变（从 1 直接跌到 0），频点之间仍会出现大波纹；只需在过渡带里人为放 1 到 2 个介于 $0$ 与 $1$ 之间的过渡样值并优化它们，就能把阻带衰减从约 $15\text{ dB}$ 提升到 $40\text{ dB}$ 以上。

            实际选型时需要在 FIR 与 IIR 之间做权衡：

            | 维度 | FIR 滤波器 | IIR 滤波器 |
            |---|---|---|
            | 稳定性 | 无反馈极点，永远 BIBO 稳定 | 有非零极点，设计或量化不当可能不稳定 |
            | 相位特性 | 容易实现严格广义线性相位 | 因果 IIR 无法严格线性相位，边缘群延迟弯曲 |
            | 阶数与计算量 | 陡峭过渡带需要很高阶数与较长群延迟 | 低阶即可实现陡峭截止，乘加量少、延迟短 |
            | 定点量化敏感度 | 系数与舍入误差影响小，无极限环 | 极点靠近单位圆时对量化敏感，可能出现极限环 |
      - card:
          title: 例题：用等波纹经验阶数公式对比汉明窗
          body: 要求设计低通 FIR：通带波纹 $\delta_1=0.01$，阻带波纹 $\delta_2=0.001$（对应 $60\text{ dB}$ 衰减），过渡带宽 $\Delta f=0.05$。用 Herrmann/Kaiser 等波纹阶数估算公式 $M\approx \frac{-10\log_{10}(\delta_1\delta_2)-13}{14.6\Delta f}$ 计算所需阶数，并与汉明窗对比。
          reveal:
            - title: 第 1 步：计算波纹乘积对数项
              body: $\delta_1\delta_2 = 0.01\times 0.001 = 10^{-5}$，因此 $-10\log_{10}(\delta_1\delta_2) = 50$。
            - title: 第 2 步：代入分母计算估算阶数
              body: 分母 $14.6\times 0.05 = 0.73$，于是 $M\approx \frac{50 - 13}{0.73} = \frac{37}{0.73} \approx 50.68$，向上取 $M=51$（或偶数阶 $52$）。
            - title: 第 3 步：与汉明窗结果对比
              body: 前面汉明窗在同样 $\Delta f=0.05$ 下需要 $M=66$ 阶且阻带只有 $53\text{ dB}$；等波纹法把通带放宽到 $0.01$、把自由度集中到阻带 $60\text{ dB}$，只用约 $51$ 阶就达标，节省了超过 $20\%$ 的乘法器。
      - item:
          id: q2
          type: number
          prompt: 按等波纹阶数经验公式 $M\approx \frac{-10\log_{10}(\delta_1\delta_2)-13}{14.6\Delta f}$，当 $\delta_1=0.01$、$\delta_2=0.001$、$\Delta f=0.05$ 时，向上取整的最小阶数 $M$ 是多少？
          answer: 51
          hint: 先算 $-10\log_{10}(10^{-5})=50$，减 13 得 37，再除以 $14.6\times 0.05=0.73$ 后向上取整。
          explain: $37 / 0.73 \approx 50.68$，向上取整为 $51$ 阶。
      - item:
          id: q3
          type: choice
          prompt: 使用频率采样法设计 FIR 低通滤波器时，为什么通常要在通带和阻带之间插入 1 到 2 个过渡带采样点？
          options:
            - text: 否则 IDFT 算出来的脉冲响应会变成复数序列
              why: 只要频域采样满足共轭对称，无论是否加过渡点，IDFT 结果都是实数
            - text: 缓和频域阶跃，大幅压低阻带插值波纹
              correct: true
            - text: 为了把 FIR 滤波器改造成低阶 IIR 滤波器
              why: 频率采样法输出的始终是长度为 $N$ 的有限长 FIR 滤波器
            - text: 如果不加过渡点，滤波器会失去 BIBO 稳定性
              why: 任何有限长 FIR 滤波器都永远是 BIBO 稳定的
          explain: 频域从 1 直接跳到 0 会在采样点之间激起很高的插值旁瓣（约 $-15\text{ dB}$）；在过渡带放入优化的中间值可使阻带衰减显著改善。
      - item:
          id: q4
          type: choice
          prompt: 某实时通信系统要求严格保持脉冲波形对称不畸变（零相位失真），且不介意多花一些乘法器和固定的几毫秒群延迟。应该优先选择哪类滤波器？
          options:
            - text: 因果 IIR 椭圆滤波器，因为它阶数最低且相位最线性
              why: 椭圆滤波器虽然阶数最低，但通带边缘的相位和群延迟非线性畸变最严重
            - text: 线性相位 FIR 滤波器，群延迟恒定且稳定
              correct: true
            - text: 因果 IIR 巴特沃斯滤波器，因为它在全频带具有严格线性相位
              why: 因果有理 IIR 滤波器的冲激响应向右无限拖尾，不可能满足对称条件，无法实现严格线性相位
            - text: 任意一阶全通滤波器，因为它幅频响应最平坦
              why: 全通滤波器不滤除任何频率，无法充当选频滤波器
          explain: 只要把“严格线性相位”放在首位，对称 FIR 滤波器是标准答案，且天然保证 BIBO 稳定、无定点极限环。

  # ==================== 第 7 章：IIR滤波器设计 ====================
  - id: iir-impulse-invariance-bilinear
    chapter: IIR滤波器设计
    title: 冲激响应不变法与双线性映射预畸变
    minutes: 13
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 设计师想把一个模拟低通滤波器 $H_c(s)$ 转换成数字 IIR 滤波器。如果直接把它的模拟冲激响应 $h_c(t)$ 每隔 $T_d$ 秒采样一次做成 $h[n]=T_d h_c(nT_d)$，这种方法能用来设计数字高通滤波器吗？
          options:
            - text: 可以，只要把采样间隔 $T_d$ 选小一点，高通和低通一样好用
              why: 模拟高通滤波器在 $\Omega\to\infty$ 时增益趋近于 1，不是带限的，无论 $T_d$ 多小采样都会发生严重频谱混叠
            - text: 不适合，因为模拟高通频响延伸到无穷高频，时域采样必然产生严重混叠
              correct: true
            - text: 不适合，因为采样模拟冲激响应一定会让系统变成不稳定的
              why: 冲激响应不变法把左半 $s$ 平面极点映射到单位圆内，稳定性是保持的，真正的问题是高频混叠
          explain: 冲激响应不变法本质是对 $h_c(t)$ 做周期采样。模拟低通/带通高频衰减快，混叠可忽略；而模拟高通/带阻高频不衰减，一采样就会发生严重频谱混叠。
      - card:
          title: 冲激响应不变法与双线性映射
          body: |
            设计数字 IIR 滤波器的经典路线是“先设计成熟的模拟低通原型 $H_c(s)$，再把它映射到 $z$ 平面”，主要有两种映射方法：
            - **冲激响应不变法（impulse invariance）**：取 $h[n]=T_d h_c(nT_d)$。极点按 $z_k=e^{s_k T_d}$ 映射（稳定原型保稳定），频率按线性关系 $\omega=\Omega T_d$ 对应，但因周期采样会引入混叠，仅适合带限低通或带通。
            - **双线性映射（bilinear transformation）**：用代数代换把整个 $s$ 平面左半边无重叠地塞进单位圆内：

            $$s = \frac{2}{T_d}\frac{1 - z^{-1}}{1 + z^{-1}} \iff z = \frac{1 + s T_d / 2}{1 - s T_d / 2}$$

            虚轴 $s=j\Omega$ 一一对应到单位圆 $z=e^{j\omega}$ 上，**完全没有混叠**，因此低通、高通、带通、带阻全部适用，且左半平面极点必然落进单位圆内保稳定。
      - item:
          id: q1
          type: number
          prompt: 已知模拟滤波器在左半平面有一个极点 $s_p=-2$，取 $T_d=1\text{ s}$ 做双线性映射 $z=\frac{1+sT_d/2}{1-sT_d/2}$，该极点会映射到 $z$ 平面的哪一点？
          answer: 0
          hint: 把 $s=-2$ 和 $T_d=1$ 直接代入分子 $1 + sT_d/2$。
          explain: 分子 $1 + (-2)(0.5) = 0$，分母 $1 - (-1) = 2$，所以 $z_p = 0$，严格位于单位圆内。
      - card:
          title: 非线性频率压缩与频率预畸变
          body: |
            双线性映射把无限长的模拟频率轴 $\Omega\in(-\infty,+\infty)$ 压入有限区间 $\omega\in(-\pi,\pi)$，必然带来非线性弯曲：

            $$\Omega = \frac{2}{T_d}\tan\!\left(\frac{\omega}{2}\right), \qquad \omega = 2\arctan\!\left(\frac{\Omega T_d}{2}\right)$$

            如果不加校正，直接把想要的模拟频率 $2\pi f_c$ 代给模拟原型，经 $\arctan$ 压缩后得到的数字截止频率会比预期偏低。解决办法是先做**频率预畸变（frequency prewarping）**：在设计模拟原型之前，先把每个数字关键频点 $\omega_i$ 按 $\Omega_i=\frac{2}{T_d}\tan(\omega_i/2)$ 预先放大，之后再做双线性映射时，压缩刚好把它们拉回到精确的 $\omega_i$ 位置。
      - card:
          title: 例题：双线性映射的频率预畸变计算与失真对比
          body: 采样率 $f_s=8\text{ kHz}$（$T_d=1/8000\text{ s}$），用双线性映射设计数字截止频率 $f_c=1\text{ kHz}$ 的 IIR 低通滤波器。求预畸变后的模拟截止角频率 $\Omega_c$，并对比不预畸变的误差。
          reveal:
            - title: 第 1 步：把数字截止频率换算为数字角频率 $\omega_c$
              body: $\omega_c = 2\pi\frac{f_c}{f_s} = 2\pi\frac{1000}{8000} = \frac{\pi}{4}\text{ rad}$。
            - title: 第 2 步：代入预畸变公式求模拟原型截止频率 $\Omega_c$
              body: $\frac{2}{T_d}=2f_s=16000$，因此 $\Omega_c = 16000\tan(\frac{\pi}{8}) = 16000(\sqrt{2}-1) \approx 6627.4\text{ rad/s}$。
            - title: 第 3 步：对比不预畸变会出什么问题
              body: 若偷懒直接用 $\Omega_{\text{直}}=2\pi\times 1000 \approx 6283.2\text{ rad/s}$，经双线性映射压缩后实际数字截止频率跌落到 $\omega_{\text{实}}=2\arctan(6283.2/16000)\approx 0.7484\text{ rad}$，折合模拟频率约 $952.9\text{ Hz}$，比目标 $1000\text{ Hz}$ 偏低了将近 $5\%$。
      - item:
          id: q2
          type: number
          prompt: 用双线性映射设计 IIR 低通：采样率 $f_s=8\text{ kHz}$，目标数字截止频率 $f_c=1\text{ kHz}$。预畸变后的模拟原型截止角频率 $\Omega_c$ 约是多少 rad/s？（取整数，允许 ±5 误差）
          answer: 6627
          tolerance: 5
          hint: 先算 $\omega_c=2\pi(1000)/8000=\pi/4$，再算 $2\times 8000\times \tan(\pi/8)$，其中 $\tan(\pi/8)=\sqrt{2}-1\approx 0.4142$。
          explain: $\Omega_c = 16000\times(\sqrt{2}-1) \approx 6627.4\text{ rad/s}$。
      - item:
          id: q3
          type: choice
          prompt: 在采样率 $f_s=8\text{ kHz}$ 下用双线性映射设计 $f_c=1000\text{ Hz}$ 的数字 IIR 低通时，如果忘了做频率预畸变，直接按 $\Omega_c=2\pi\times 1000\approx 6283\text{ rad/s}$ 设计模拟原型再映射，最终得到的实际截止频率会怎样？
          options:
            - text: 恰好仍在 $1000\text{ Hz}$，因为 $1000\text{ Hz}$ 远低于奈奎斯特频率
              why: 即使在 $f_s/8$ 处，$\tan(\pi/8)$ 与 $\pi/8$ 已有约 $5.5\%$ 的弯曲偏差，实际截止频率已跌至约 $953\text{ Hz}$
            - text: 比 $1000\text{ Hz}$ 偏低（约 $953\text{ Hz}$），因为双线性映射把频率轴非线性压缩了
              correct: true
            - text: 比 $1000\text{ Hz}$ 偏高（约 $1055\text{ Hz}$），因为 $\tan$ 函数把频率拉伸了
              why: 预畸变才用 $\tan$ 放大；从模拟到数字的映射是 $\omega=2\arctan(\Omega T_d/2)$，它会把频率向低处压缩
            - text: 滤波器会直接变得不稳定，极点跑到单位圆外
              why: 忘了预畸变只导致截止频率偏移，不破坏稳定性，极点依然全在单位圆内
          explain: 双线性映射满足 $\omega=2\arctan(\Omega T_d/2) < \Omega T_d$，不预先放大 $\Omega_c$ 会导致数字截止频率系统性偏低。
      - item:
          id: q4
          type: choice
          prompt: 对比冲激响应不变法与双线性映射，下列哪项判断准确？
          options:
            - text: 冲激响应不变法完全无混叠，但会产生非线性频率畸变
              why: 特征正好相反：冲激响应不变法频率是线性的但有混叠，双线性映射无混叠但有频率畸变
            - text: 双线性映射将无穷远频率 $s=j\infty$ 映至 $z=-1$，避免了混叠
              correct: true
            - text: 双线性映射虽然适合高通，但可能把稳定模拟滤波器变成不稳定的数字滤波器
              why: 双线性映射将整个左半 $s$ 平面一对一映射到单位圆内部，始终保持稳定性
            - text: 两种方法都能让模拟滤波器的线性相位原封不动保留到数字域
              why: 双线性映射的非线性频率映射会破坏模拟原型的线性相位，冲激响应不变法也受混叠影响
          explain: 双线性映射把整个虚轴 $j\Omega$ 压缩到单位圆 $(-\pi,\pi)$，完全杜绝混叠并保稳定，只需对关键边界频率做预畸变即可。

  - id: iir-prototypes-and-freq-transforms
    chapter: IIR滤波器设计
    title: 巴特沃斯、切比雪夫、椭圆原型与频率变换
    minutes: 12
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 给定相同的通带波纹上限、阻带衰减下限和过渡带宽度，分别用巴特沃斯、切比雪夫和椭圆三种模拟原型来设计低通滤波器。哪一种需要的阶数最低？
          options:
            - text: 巴特沃斯滤波器，因为它的幅频曲线最平滑，容易逼近
              why: 要求通带和阻带都单调平滑（不允许波纹）束缚了自由度，反而导致巴特沃斯需要最高阶数
            - text: 椭圆滤波器，通带和阻带均等波纹
              correct: true
            - text: 切比雪夫滤波器，因为只在通带放宽波纹时过渡带最陡
              why: 切比雪夫只利用了通带或阻带单侧的等波纹，阶数居中；两侧都等波纹的椭圆滤波器阶数最低
          explain: 在同指标下，所需阶数从高到低依次为：巴特沃斯 > 切比雪夫（I 型或 II 型）> 椭圆滤波器。换取低阶数的代价是幅频波纹和更明显的相位非线性。
      - card:
          title: 四大经典模拟原型滤波器的特性与取舍
          body: |
            经预畸变拿到模拟指标 $(\Omega_p, \Omega_s, \delta_1, \delta_2)$ 后，需要挑选合适的模拟低通原型 $H_c(s)$：

            | 原型类型 | 通带特性 | 阻带特性 | 同指标阶数 | 突出特点 |
            |---|---|---|---|---|
            | **巴特沃斯滤波器（Butterworth）** | 单调最大平坦 | 单调下降 | 最高 | 通带极平滑，相位弯曲最温和 |
            | **切比雪夫滤波器（Chebyshev）I 型** | 等波纹波动 | 单调下降 | 中等 | 全极点结构，比巴特沃斯陡得多 |
            | **切比雪夫滤波器 II 型** | 单调平滑 | 等波纹（含阻带零点） | 中等 | 通带平滑无起伏，阻带有传输零点 |
            | **椭圆滤波器（Elliptic / Cauer）** | 等波纹波动 | 等波纹（含阻带零点） | 最低 | 给定幅度指标下阶数最少，但通带边群延迟最陡 |

            以最基础的 $N$ 阶巴特沃斯低通为例，其幅频平方十分简洁：

            $$|H_c(j\Omega)|^2 = \frac{1}{1 + (\Omega/\Omega_c)^{2N}}$$

            无论阶数 $N$ 取多少，在 $\Omega=\Omega_c$ 处都恰好满足 $|H_c(j\Omega_c)|^2 = 1/2$（即 $-3.01\text{ dB}$ 截止点）。
      - card:
          title: 例题：手算巴特沃斯低通原型所需阶数 $N$
          body: 设计一个巴特沃斯低通原型，要求在 $\Omega_p=1\text{ rad/s}$ 处衰减为 $-3\text{ dB}$（取 $\Omega_c=1$），在阻带 $\Omega_s=2\text{ rad/s}$ 处衰减至少达到 $20\text{ dB}$。求最小整数阶数 $N$。
          reveal:
            - title: 第 1 步：把阻带衰减指标转为不等式
              body: 衰减 $\ge 20\text{ dB}$ 意味着 $10\log_{10}\left(1 + (\Omega_s/\Omega_c)^{2N}\right) \ge 20$，即 $1 + 2^{2N} \ge 10^2 = 100$，得 $2^{2N} \ge 99$。
            - title: 第 2 步：解出 $N$ 的下界
              body: 算 $2$ 的幂次：$2^6 = 64 < 99$，$2^8 = 256 \ge 99$。两边取对数得 $2N \ge \log_2(99)\approx 6.63 \implies N \ge 3.315$。
            - title: 第 3 步：向上取整并代回验证衰减量
              body: 取最小整数 $N=4$。验证：$N=3$ 时阻带衰减为 $10\log_{10}(1+64)\approx 18.13\text{ dB}$（不达标）；$N=4$ 时为 $10\log_{10}(1+256)\approx 24.10\text{ dB}\ge 20\text{ dB}$（达标）。
      - item:
          id: q1
          type: number
          prompt: 巴特沃斯低通原型取 $\Omega_c=1$，要求在 $\Omega_s=2$ 处阻带衰减至少 $20\text{ dB}$（即 $1+2^{2N}\ge 100$），所需的最小整数阶数 $N$ 是多少？
          answer: 4
          hint: 阶数每加 1，$2^{2N}$ 变成原来的几倍？从 $N=3$ 开始试。
          explain: $N=3$ 时仅约 $18.13\text{ dB}$ 不足 $20\text{ dB}$；$N=4$ 时达 $24.10\text{ dB}$，因此最小整数阶数是 $4$。
      - item:
          id: q2
          type: choice
          prompt: 一项音频均衡器任务要求“通带内绝不能出现任何幅度波纹，但希望比巴特沃斯阶数更低、过渡带更陡，且允许阻带里有等波纹起伏”。最匹配哪一种原型？
          options:
            - text: 切比雪夫 I 型滤波器
              why: 切比雪夫 I 型恰恰是通带等波纹、阻带单调，违反了通带无波纹要求
            - text: 切比雪夫 II 型滤波器
              correct: true
            - text: 椭圆滤波器
              why: 椭圆滤波器在通带和阻带都有等波纹，通带并不单调平滑
            - text: 巴特沃斯滤波器
              why: 巴特沃斯虽然通带平滑，但阻带也单调，阶数最高，无法利用阻带波纹换取更低阶数
          explain: 切比雪夫 II 型保持通带单调平坦、把等波纹和传输零点放在阻带，正好满足“通带无波纹且过渡带更陡”的要求。
      - card:
          title: 低通 IIR 滤波器的数字频率变换
          body: |
            不需要为高通、带通、带阻分别重新推导整套设计表。只需先设计好一个归一化数字低通原型 $H_{\text{lp}}(Z)$（截止频率 $\theta_p$），再做**频率变换（frequency transformation）**——把 $Z^{-1}$ 替换成合适的全通有理函数 $g(z^{-1})$：

            $$H(z) = \left.H_{\text{lp}}(Z)\right|_{Z^{-1} = g(z^{-1})}$$

            因为 $g(z^{-1})$ 是全通映射，它把原单位圆映射回新单位圆，同时把单位圆内部映射回内部，因此**自动保持稳定性且完整保留通带与阻带的波纹幅度**。最简单的例子是把 $Z^{-1}$ 换成 $-z^{-1}$：它会把频谱绕 $\pi/2$ 翻转，直接把截止频率为 $\theta_p$ 的低通变为截止频率为 $\pi-\theta_p$ 的高通；若用一阶全通 $-\frac{z^{-1}+\alpha}{1+\alpha z^{-1}}$ 则能把高通截止频率调到任意 $\omega_p$，用二阶全通则可转为带通或带阻。
      - item:
          id: q3
          type: choice
          prompt: 已知一个数字低通 IIR 滤波器 $H_{\text{lp}}(Z)$ 的通带截止频率为 $\theta_p = \pi/3$。如果把其中的每个 $Z^{-1}$ 直接替换为 $-z^{-1}$，得到的新数字滤波器是什么类型，通带截止频率变为多少？
          options:
            - text: 仍是低通滤波器，通带截止频率变为 $2\pi/3$
              why: 替换 $Z^{-1}=-z^{-1}$ 相当于令 $e^{-j\theta}=-e^{-j\omega}=e^{-j(\omega-\pi)}$，把原直流 $\theta=0$ 搬到了高频 $\omega=\pi$，变成了高通
            - text: 高通滤波器，通带截止频率变为 $\pi - \pi/3 = 2\pi/3$
              correct: true
            - text: 带通滤波器，中心频率位于 $\pi/2$
              why: 一阶代换只做低通到低通或低通到高通；变成带通需要二阶全通代换
            - text: 全通滤波器，因为代换函数 $-z^{-1}$ 本身是全通的
              why: 全通代换保持原滤波器的幅值集合不变，只是重新排列它们所在的频率位置
          explain: 令 $e^{-j\theta} = -e^{-j\omega} = e^{-j(\omega-\pi)}$，通带 $|\theta|<\pi/3$ 映射到 $|\omega-\pi|<\pi/3$，即高频段 $\omega\in(2\pi/3,\pi]$，截止频率为 $2\pi/3$ 的高通滤波器。
      - item:
          id: q4
          type: match
          prompt: 将下列 IIR 原型与变换概念和它们的正确描述配对。
          pairs:
            - ['巴特沃斯原型', '通带阻带均单调平滑，同指标下所需阶数最高']
            - ['椭圆原型', '通带阻带均等波纹，给定幅度指标下阶数最低']
            - ['一阶全通频率变换', '将数字低通映射为任意截止频率的低通或高通']
            - ['二阶全通频率变换', '将数字低通映射为带通或带阻，阶数翻倍']
          explain: 二阶代换把每个 $Z^{-1}$ 换成二阶分式，因此把低通映射为双边带通/带阻时滤波器总阶数变为原来的 2 倍。

  # ==================== 第 8 章：多速率信号处理 ====================
  - id: decimation-interpolation-rational
    chapter: 多速率信号处理
    title: 抽取、内插与有理数倍采样率转换
    minutes: 12
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 录音棚录了一段 $48\text{ kHz}$ 的音频（最高含 $20\text{ kHz}$ 声音），现在想把采样率降为 $12\text{ kHz}$（降低 4 倍）。如果直接每 4 个点留 1 个点、把中间 3 个点扔掉，不提前做滤波，会发生什么？
          options:
            - text: 不会有问题，声音只是变清晰度低一点，高于 $6\text{ kHz}$ 的成分自动消失
              why: 直接丢点不会让高于 $6\text{ kHz}$ 的频率消失，而是让它们全部混叠折返进 $0\sim 6\text{ kHz}$ 污染人声
            - text: 高于 $6\text{ kHz}$ 的音频分量会混叠折返进 $0\sim 6\text{ kHz}$ 频段，产生刺耳失真
              correct: true
            - text: 音频播放速度会直接加快 4 倍，像快进一样
              why: 当下游播放器按新采样率 $12\text{ kHz}$ 播放时，时间轴比例保持不变，不会快进，真正的问题是频谱混叠
          explain: $12\text{ kHz}$ 采样率的奈奎斯特频率是 $6\text{ kHz}$（在原 $48\text{ kHz}$ 域里对应数字频率 $\pi/4$）。直接降采样之前必须先过截止在 $\pi/4$ 的抗混叠低通滤波器。
      - card:
          title: 降采样与抽取的频域机理
          body: |
            不经过模拟电路也能在数字域直接降低采样率。**降采样（downsampling，$\downarrow M$）**按 $x_d[n]=x[Mn]$ 每 $M$ 点留 1 点，频域将原频谱展宽 $M$ 倍并叠出 $M-1$ 个移位混叠项：

            $$X_d(e^{j\omega})=\frac{1}{M}\sum_{i=0}^{M-1}X\!\left(e^{j(\omega-2\pi i)/M}\right)$$

            为避免混叠，必须在 $\downarrow M$ 之前串联截止频率 $\pi/M$、通带增益 $1$ 的抗混叠低通滤波器，合称**抽取（decimation）**。
      - item:
          id: q1
          type: number
          prompt: 要把采样率从 $48\text{ kHz}$ 抽取降频到 $12\text{ kHz}$（抽取因子 $M=4$），在降采样器之前放置的抗混叠低通滤波器，其模拟等效截止频率最高不能超过多少 kHz？
          answer: 6
          hint: 截止频率对应新采样率 $12\text{ kHz}$ 的奈奎斯特频率 $f_{s,\text{new}}/2$（即原域数字频率 $\pi/4$）。
          explain: 新采样率为 $12\text{ kHz}$，无混叠带宽上限为 $12/2 = 6\text{ kHz}$（在原 $48\text{ kHz}$ 数字域即 $\omega_c=\pi/4$）。
      - card:
          title: 升采样、频谱镜像与内插
          body: |
            提高数字采样率分两步。**升采样（upsampling，$\uparrow L$）**在相邻样本之间插入 $L-1$ 个零，频域把原频谱压缩为 $1/L$：

            $$X_e(e^{j\omega})=X(e^{j\omega L})$$

            结果在 $[0,\pi]$ 内额外冒出 $L-1$ 个周期复制的**频谱镜像（spectral images）**。随后必须接截止频率 $\pi/L$、通带增益 $L$（补偿插零导致的能量稀释）的抗镜像低通滤波器滤除镜像，合称**内插（interpolation）**。
      - item:
          id: q2
          type: choice
          prompt: 对序列执行 $L=3$ 倍内插（先 $\uparrow 3$ 插零，再接抗镜像低通滤波器），该低通滤波器的理想截止频率与通带增益分别应设为什么？
          options:
            - text: 截止频率 $\pi/3$，通带增益 $1$
              why: 插入两个零后平均信号能量降为原来的 $1/3$，若增益只取 $1$，输出波形振幅会缩水成原来的 $1/3$
            - text: 截止频率 $\pi/3$，通带增益 $3$
              correct: true
            - text: 截止频率 $\pi/2$，通带增益 $3$
              why: 第一个频谱镜像从 $\omega=\pi/3$ 之后就已经开始出现，截止在 $\pi/2$ 会放过镜像失真
            - text: 截止频率 $3\pi$，通带增益 $1/3$
              why: 数字角频率以 $2\pi$ 为周期，低通截止频率必须在 $(0,\pi)$ 内，且增益应放大 $L=3$ 倍而非缩小
          explain: 升采样 $\uparrow L$ 把主频谱压进 $[-\pi/L, \pi/L]$，并在每个点间插入 $L-1$ 个零使均值缩为 $1/L$，因此抗镜像低通需截止于 $\pi/L$ 且通带增益为 $L$。
      - card:
          title: 有理数倍 $L/M$ 速率转换与上采样滤波器指标
          body: |
            若要把 $16\text{ kHz}$ 语音转为 $24\text{ kHz}$，倍率是分数 $L/M = 3/2$。连接顺序至关重要：**必须先升采样 $\uparrow L$、再滤波、最后降采样 $\downarrow M$**（若先 $\downarrow M$ 会把原本能保住的高频提前损失掉）。

            升采样后的抗镜像低通（截止 $\pi/L$、增益 $L$）与降采样前的抗混叠低通（截止 $\pi/M$、增益 $1$）恰好紧挨着串联，可以**合并成单个低通滤波器**：通带增益取 $L$，截止频率取两者更严格的那一个：

            $$\omega_c = \min\!\left(\frac{\pi}{L},\, \frac{\pi}{M}\right)$$

            实际设计上采样 FIR 滤波器时，若原信号本身已带限于 $\omega_0 < \pi$，升采样后主通带只到 $\omega_0/L$，第一个镜像从 $(2\pi-\omega_0)/L$ 才开始，中间留出的“不关心带”允许设计更宽的过渡带，从而大幅降低上采样滤波器的阶数。
      - card:
          title: 例题：设计 $16\text{ kHz} \to 24\text{ kHz}$ 有理数倍采样率转换链路
          body: 将 $16\text{ kHz}$ 信号无混叠、无镜像地转换为 $24\text{ kHz}$，确定 $L$、$M$、链路顺序以及中间合并低通滤波器的截止频率与增益。
          reveal:
            - title: 第 1 步：把采样率之比化成最简分数 $L/M$
              body: $\frac{24}{16} = \frac{3}{2}$，取升采样因子 $L=3$（中间虚拟速率升至 $48\text{ kHz}$），降采样因子 $M=2$。
            - title: 第 2 步：确定链路顺序
              body: 必须先 $\uparrow 3$，再通过单个低通滤波器，最后 $\downarrow 2$，避免先降采样把 $4\sim 8\text{ kHz}$ 的合法频谱直接混叠销毁。
            - title: 第 3 步：确定合并低通的截止频率与增益
              body: 抗镜像需要 $\pi/3$，抗混叠需要 $\pi/2$，取较小值 $\omega_c=\min(\pi/3,\pi/2)=\pi/3$（在 $48\text{ kHz}$ 中间域对应 $8\text{ kHz}$，正好保住原 $16\text{ kHz}$ 全部带宽），通带增益取 $L=3$。
      - item:
          id: q3
          type: order
          prompt: 请按正确先后顺序排列实现 $L/M$ 倍有理采样率转换的三个标准环节。
          steps:
            - 对输入序列执行 $L$ 倍升采样（插入 $L-1$ 个零）
            - 通过截止频率 $\min(\pi/L,\pi/M)$、增益为 $L$ 的单个低通滤波器
            - 对滤波输出执行 $M$ 倍降采样（每 $M$ 点留 1 点）
          explain: 先 $\uparrow L$ 升到公倍速率，用一个更严格截止频率的低通同时完成抗镜像和抗混叠，最后 $\downarrow M$ 降到目标速率。
      - item:
          id: q4
          type: choice
          prompt: 把数字音频从 $16\text{ kHz}$ 转成 $24\text{ kHz}$（$L=3, M=2$），中间合并低通滤波器的数字截止角频率 $\omega_c$ 应该选多少？
          options:
            - text: $\pi/2$，因为降采样因子是 $M=2$
              why: 选 $\pi/2$ 大于 $\pi/3$，会放过升采样 $\uparrow 3$ 在 $[\pi/3, \pi/2]$ 处产生的频谱镜像
            - text: $\pi/3$，取 $\min(\pi/L, \pi/M)$ 同时挡住镜像和混叠
              correct: true
            - text: $\pi/6$，取 $\pi/(LM)$ 以获得双重保险
              why: 截止在 $\pi/6$（对应 $4\text{ kHz}$）过度保守，会白白砍掉原 $16\text{ kHz}$ 音频里 $4\sim 8\text{ kHz}$ 的有效高频
            - text: $2\pi/3$，按 $M/L$ 比例放大通带
              why: 既超过 $\pi/3$ 又超过 $\pi/2$，镜像和混叠会同时漏进来
          explain: 合并低通必须同时满足抗镜像（$\le \pi/3$）与抗混叠（$\le \pi/2$），所以精确取 $\min(\pi/3, \pi/2)=\pi/3$。

  - id: multirate-noble-polyphase
    chapter: 多速率信号处理
    title: 贵族恒等式、多相分解与多级抽取
    minutes: 12
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 做 $M=4$ 倍抽取时，标准流程是“先用 32 阶 FIR 在 $48\text{ kHz}$ 下把每个输出点都算出来，然后每 4 个点扔掉 3 个”，浪费了四分之三的算力。能不能通过拆解结构，只算最终留下来的那 $1/4$ 个输出点，且算出的数值与直接法一模一样？
          options:
            - text: 不能，因为 FIR 滤波器用到中间那些输入点，少算任何一步结果都会变
              why: 确实要用到所有输入样本，但并不需要算出被丢弃的那些时刻的输出，只需把 4 路输入直接送进 4 条低速子滤波器相加即可
            - text: 可以，用多相结构挪到降采样后，算力降为 $1/4$
              correct: true
            - text: 可以，直接把原滤波器和 $\downarrow 4$ 原封不动交换位置即可
              why: 一般滤波器 $H(z)$ 不能直接与 $\downarrow 4$ 交换顺序，只有形如 $H(z^4)$ 的滤波器（经多相拆分后的子支路）才能交换
          explain: 多相分解配合贵族恒等式，把 $H(z)$ 拆成 $M$ 条子滤波器 $E_k(z^M)$ 再把 $\downarrow M$ 挪到滤波器前面，数学上输出逐点完全一致，乘法量却严格降为 $1/M$。
      - card:
          title: 贵族恒等式与多相分解
          body: |
            把滤波搬到低速率一侧运行，靠两条**贵族恒等式（noble identities）**：
            1. 降采样端：先通过 $H(z^M)$ 再 $\downarrow M$，完全等价于先 $\downarrow M$ 再通过 $H(z)$；
            2. 升采样端：先 $\uparrow L$ 再通过 $H(z^L)$，完全等价于先通过 $H(z)$ 再 $\uparrow L$。

            普通的 $H(z)$ 并不是 $z^M$ 的函数，但可以通过**多相分解（polyphase decomposition）**把它按系数序号除以 $M$ 的余数拆成 $M$ 组：

            $$H(z) = \sum_{k=0}^{M-1} z^{-k} E_k(z^M), \qquad e_k[n] = h[nM + k]$$

            把 $\downarrow M$ 顺着贵族恒等式穿进每一条支路 $E_k(z^M)$ 前面后，每条子滤波器 $E_k(z)$ 只在低速率 $f_s/M$ 下运行，长度缩为原来的 $1/M$，**总乘法速率严格降为原来的 $1/M$**。对内插同理，把 $\uparrow L$ 搬到子滤波器后面后，完全避开了对插入零值的无效乘法，算力同样降为 $1/L$。
      - card:
          title: 例题：多相分解手算与 4 倍抽取算力对比
          body: 1）将 $H(z)=1+2z^{-1}+3z^{-2}+4z^{-3}+5z^{-4}+6z^{-5}$ 做 $M=2$ 路多相分解；2）把 $48\text{ kHz}$ 经长度 32 的 FIR 做 $M=4$ 倍抽取到 $12\text{ kHz}$，对比直接法与多相法的每秒乘法次数。
          reveal:
            - title: 第 1 步：按偶数序号与奇数序号拆出 $E_0(z)$ 和 $E_1(z)$
              body: 偶项 $1+3z^{-2}+5z^{-4} = E_0(z^2)$，得 $E_0(z)=1+3z^{-1}+5z^{-2}$；奇项 $z^{-1}(2+4z^{-2}+6z^{-4})=z^{-1}E_1(z^2)$，得 $E_1(z)=2+4z^{-1}+6z^{-2}$。
            - title: 第 2 步：计算直接抽取的每秒乘法率
              body: 在 $48\text{ kHz}$ 下每输出一点需 32 次乘法，每秒 $32\times 48{,}000 = 1{,}536{,}000$ 次，其中 $75\%$ 的输出算完就被扔掉了。
            - title: 第 3 步：计算 4 路多相结构的每秒乘法率
              body: 32 阶 FIR 拆成 4 条各长 $32/4=8$ 的子滤波器，全部工作在降速后的 $12\text{ kHz}$：总速率为 $4\times 8\times 12{,}000 = 384{,}000$ 次/秒，正好缩减为原来的 $1/4$。
      - item:
          id: q1
          type: number
          prompt: 用长度 32 的 FIR 滤波器将 $48\text{ kHz}$ 音频做 $M=4$ 倍抽取至 $12\text{ kHz}$。改用 4 路多相实现后，每秒需要多少次乘法？（填整数，如 384000）
          answer: 384000
          hint: 4 条子滤波器各长 $32/4=8$，每秒只算 $12{,}000$ 次输出，把三者相乘。
          explain: $4 \times 8 \times 12{,}000 = 384{,}000$ 次/秒，相比直接法的 $1{,}536{,}000$ 次/秒节省了 $3/4$ 的运算量，且输出与直接法逐点相同。
      - item:
          id: q2
          type: choice
          prompt: 将 $H(z)=1+2z^{-1}+3z^{-2}+4z^{-3}+5z^{-4}+6z^{-5}$ 写成 $M=2$ 路多相形式 $H(z)=E_0(z^2)+z^{-1}E_1(z^2)$，其中 $E_1(z)$ 等于什么？
          options:
            - text: $E_1(z) = 2 + 4z^{-1} + 6z^{-2}$
              correct: true
            - text: $E_1(z) = 2z^{-1} + 4z^{-3} + 6z^{-5}$
              why: 已经把公因子 $z^{-1}$ 提到了 $E_1(z^2)$ 外面，且把 $z^{-2}$ 记作新变量 $z^{-1}$，所以幂次应是 $0, -1, -2$
            - text: $E_1(z) = 4 + 5z^{-1} + 6z^{-2}$
              why: 多相分解是按序号奇偶（模 $M$）交错抽取，不是从中间切成前后两半
            - text: $E_1(z) = 1 + 3z^{-1} + 5z^{-2}$
              why: 偶数序号 $1, 3, 5$ 组成的是 $E_0(z)$，奇数序号 $2, 4, 6$ 才组成 $E_1(z)$
          explain: 提取 $z^{-1}$ 后奇次项变为 $z^{-1}(2+4z^{-2}+6z^{-4})=z^{-1}E_1(z^2)$，故 $E_1(z)=2+4z^{-1}+6z^{-2}$。
      - card:
          title: 多级抽取与内插：化大倍率为小倍率接力
          body: |
            当抽取倍率很大（例如过采样 ADC 需要 $M=20$ 甚至 $M=100$）时，单级抗混叠低通的过渡带极窄（$\Delta f \propto 1/M$），单级 FIR 阶数会大幅上升到上千阶。

            解决方法是**多级抽取（multistage decimation）**：把 $M$ 拆成因子连乘，例如 $M=20 = 5\times 4$。第一级只需把未来会折返进最终通带的区域挡住，过渡带非常宽，只需很短的几阶滤波器就能先降速 5 倍；第二级虽然过渡带窄，但它已经在降速 5 倍后的低速率上运行。两级合起来的滤波器总阶数和每秒乘加量都比单级设计小一个数量级。多级内插则是它的完全镜像。
      - item:
          id: q3
          type: choice
          prompt: 根据降采样贵族恒等式，要把滤波器从 $\downarrow M$ 的前面等价地搬到 $\downarrow M$ 的后面，该滤波器必须满足什么结构？
          options:
            - text: 必须是偶对称线性相位 FIR 滤波器
              why: 贵族恒等式不要求线性相位，甚至对 IIR 也成立，关键要求是系统函数必须仅含 $z^{-M}$ 的幂次
            - text: 必须是 $H(z^M)$ 形式（仅含 $z^{-M}$ 幂次）
              correct: true
            - text: 必须是增益为 $M$ 的全通滤波器
              why: 贵族恒等式适用于任意形如 $H(z^M)$ 的 LTI 系统，不限于全通或特定增益
            - text: 只要截止频率低于 $\pi/M$，任何 $H(z)$ 都可以直接和 $\downarrow M$ 交换顺序
              why: 即使截止低于 $\pi/M$，一般 $H(z)$ 含 $z^{-1}, z^{-2}$ 项，不能直接和 $\downarrow M$ 交换，必须先做多相分解
          explain: 只有当原系统写成 $H(z^M)$ 形式时，每延迟 $M$ 个高速样本正好等价于降速后延迟 $1$ 个低速样本，才能与 $\downarrow M$ 互换得到 $H(z)$。
      - item:
          id: q4
          type: choice
          prompt: 面对 $M=20$ 倍的大倍率抽取，为什么把单级抽取拆成两级接力（如先 $\downarrow 5$ 再 $\downarrow 4$）能大幅降低总计算量？
          options:
            - text: 因为拆成两级后就不再需要任何抗混叠低通滤波器了
              why: 每一级降采样前依然必须配抗混叠滤波器，只是每级的指标大幅放宽了
            - text: 首级过渡带很宽故阶数极低，窄过渡留到低速次级完成
              correct: true
            - text: 两级合起来的最终截止频率放宽了 5 倍，所以阶数下降
              why: 最终整体截止频率依然是 $\pi/20$，没有放宽，省算力来自合理分配各级的过渡带与工作速率
            - text: 因为多级结构只允许使用 IIR 滤波器，避免了 FIR 的高阶数
              why: 多级结构最常搭配多相 FIR 或无乘法器的级联积分梳状滤波器，仍可保持严格线性相位
          explain: 第一级抗混叠允许极宽的过渡带（阶数很少），迅速把采样率砍掉 5 倍；承担陡峭截止任务的第二级则在低得多的速率下运行，整体乘加率剧减。

  # ==================== 第 9 章：谱分析与窗函数 ====================
  - id: dft-sinusoidal-and-stft
    chapter: 谱分析与窗函数
    title: 正弦信号 DFT 谱分析、泄漏与短时傅里叶变换
    minutes: 13
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 一段信号里同时藏着两个频率很接近的正弦波：一个是强信号（振幅 $1$），旁边不远有一个弱信号（振幅 $0.02$，比强信号低 $34\text{ dB}$）。如果直接用矩形窗截断后做 DFT 频谱分析，最可能出什么问题？
          options:
            - text: 矩形窗高达 $-13\text{ dB}$ 的旁瓣泄漏会把低 $34\text{ dB}$ 的弱信号盖住
              correct: true
            - text: 弱信号会自动消失，因为 DFT 只能保留能量最高的那一个频率
              why: DFT 是线性运算，两个正弦波的频谱线性叠加，弱信号没有消失，只是被强信号的旁瓣掩盖了
            - text: 只要在末尾多补零做更大的 FFT，强信号的旁瓣高度就能降到 $-50\text{ dB}$ 以下
              why: 补零不改变窗函数本身的旁瓣高度，矩形窗的第一旁瓣永远停在 $-13\text{ dB}$ 左右
          explain: 矩形窗截断使单频正弦变成频域上的辛克峰，旁瓣高达 $-13\text{ dB}$，会把附近低于它的弱信号淹没；换用汉明窗或布莱克曼窗可压低旁瓣、让弱信号现身。
      - card:
          title: DFT 频点间隔与频谱泄漏
          body: |
            用 DFT 分析采样率为 $f_s$ 的连续正弦信号，流程为：抗混叠滤波 → 采样 → 乘长 $L$ 的窗截断 → 补零至 $N\ge L$ 点做 DFT。相邻频点间隔为 $\Delta f = \frac{f_s}{N}$。

            有限长截断（尤其非整数周期截断）在频域等价于与窗频谱卷积，能量沿旁瓣漏向其他频点，即**频谱泄漏（spectral leakage）**。改用 Hann、Hamming、Blackman 等平滑窗可压低旁瓣、抑制泄漏，代价是主瓣变宽。
      - item:
          id: q1
          type: number
          prompt: 采样率 $f_s=8000\text{ Hz}$、做 $N=1024$ 点 FFT 时，相邻两个 DFT 频点之间的频率间隔 $\Delta f$ 是多少 Hz？（保留两位小数，或精确小数）
          answer: 7.8125
          tolerance: 0.05
          hint: 用采样率 $f_s$ 除以 FFT 点数 $N$。
          explain: $\Delta f = \frac{f_s}{N} = \frac{8000}{1024} = 7.8125\text{ Hz}$（约 $7.8\text{ Hz}$）。
      - card:
          title: 栅栏效应、补零与真实分辨率
          body: |
            离散 DFT 像隔着栅栏缝隙观察连续频谱，若真实频率落在两频点之间，读出的峰值会偏低，称为**栅栏效应（picket-fence effect）**。

            适度补零增大 $N$ 可以加密频点网格、减轻栅栏效应，但**不能提高真实双音分辨率**——两个等幅邻近正弦能否分开取决于窗主瓣宽度（与 $f_s/L$ 成正比），只有延长真实观测窗长 $L$ 才能提高真实分辨率。
      - item:
          id: q2
          type: choice
          prompt: 采样率 $f_s=8000\text{ Hz}$，实际只采集了 $L=256$ 个样本（观测时长 $32\text{ ms}$），然后补零到 $N=1024$ 做 FFT。关于这次分析，哪项判断准确？
          options:
            - text: 频点间隔缩小到 $7.81\text{ Hz}$，因此相距 $10\text{ Hz}$ 的两个正弦波现在一定能清楚分开
              why: 真实分辨能力由观测长度 $L=256$ 决定（矩形窗约 $f_s/L=31.25\text{ Hz}$），补零只加密插值点，拆不开已经融合的双峰
            - text: 间隔缩至 $7.81\text{ Hz}$ 减轻栅栏效应，但真实分辨率不变
              correct: true
            - text: 补零改变了窗函数旁瓣，使频谱泄漏减少为原来的 $1/4$
              why: 补零不改变窗函数形状，旁瓣相对主瓣的高度保持不变
            - text: 频点间隔依然保持 $8000/256=31.25\text{ Hz}$，补零没有任何作用
              why: 频点间隔确实变成了 $8000/1024=7.8125\text{ Hz}$，能更准确读出单个孤立峰的中心频率与峰值
          explain: 增大真实观测时长 $L$ 才能提高真实双音分辨率；换平滑窗才能压低旁瓣泄漏；补零增大 $N$ 负责加密频点网格、减轻栅栏效应。
      - card:
          title: 短时傅里叶变换（STFT）、语谱图与时频权衡
          body: |
            语音、音乐等非平稳信号的频率随时间演变，对整段做一次 DFT 会丢失时间信息。**短时傅里叶变换（STFT）**用长 $L$ 的滑窗 $w[m]$ 逐帧做变换：

            $$X[n, \lambda] = \sum_{m=-\infty}^{\infty} x[n+m]\,w[m]\,e^{-j\lambda m}$$

            将 $|X[n,\lambda]|^2$ 绘成时频热力图即**语谱图（spectrogram）**。窗长 $L$ 决定时频权衡：**长窗（窄带语谱图）**频率精细但时间模糊；**短窗（宽带语谱图）**时间定位准但频率变粗。
      - card:
          title: 例题：比较 $16\text{ kHz}$ 语音分析的长窗与短窗 STFT 配置
          body: 对 $f_s=16\text{ kHz}$ 的语音信号做 STFT，分别比较长窗 $L_1=512$（窄带）和短窗 $L_2=64$（宽带）的时间帧长和基础频率刻度 $f_s/L$。
          reveal:
            - title: 第 1 步：计算长窗 $L_1=512$ 的时间与频率尺度
              body: 帧时长 $T_1 = 512/16000 = 0.032\text{ s} = 32\text{ ms}$；基础频率刻度 $f_s/L_1 = 16000/512 = 31.25\text{ Hz}$，足以分辨约 $120\text{ Hz}$ 间距的男声基频谐波。
            - title: 第 2 步：计算短窗 $L_2=64$ 的时间与频率尺度
              body: 帧时长 $T_2 = 64/16000 = 4\text{ ms}$；基础频率刻度 $f_s/L_2 = 16000/64 = 250\text{ Hz}$，看不清相邻谐波，却能精准捕捉爆破音和声门脉冲发生瞬间。
            - title: 第 3 步：总结窗长选择的原则
              body: 时间分辨率和频率分辨率的乘积受不确定性原理制约，无法同时无限精细，必须按任务目标（查谐波还是抓瞬态）选窗长。
      - item:
          id: q3
          type: number
          prompt: 对采样率 $f_s=16\text{ kHz}$ 的语音信号做 STFT，若选用长窗 $L=512$ 点，每一帧覆盖的时间长度是多少毫秒（ms）？
          answer: 32
          hint: 用样本数 $L$ 除以采样率 $f_s$（每秒样本数），再乘以 $1000$ 换算成毫秒。
          explain: $512 / 16000 = 0.032\text{ s} = 32\text{ ms}$，对应的基础频率刻度为 $16000/512 = 31.25\text{ Hz}$。
      - item:
          id: q4
          type: choice
          prompt: 用窗函数法对正弦信号做 DFT 谱分析时，从矩形窗换成汉明窗以减少频谱泄漏，必须接受什么代价？
          options:
            - text: 窗主瓣变宽，邻近等幅双音分辨率变差
              correct: true
            - text: 采样率会被迫降低一半，容易引发新的高频混叠
              why: 加窗是在时域乘权重，不改变采样率，也不产生混叠
            - text: 无法再使用基 2 FFT，只能退回 $O(N^2)$ 直接计算
              why: 加窗后的序列长度不变，照常直接送入基 2 FFT
            - text: 真实正弦频率的位置会发生明显偏移
              why: 对称窗的频谱主瓣中心在 $\omega=0$，卷积后单峰中心位置不偏移，只是峰变宽了
          explain: 平滑窗通过展宽主瓣来压低旁瓣：旁瓣低了（泄漏大幅减弱、利于发现强信号旁的弱信号），代价是主瓣宽了（两个靠很近的等幅信号更容易糊在一起）。

  - id: periodogram-welch-random-psd
    chapter: 谱分析与窗函数
    title: 随机信号的功率谱估计：周期图与 Welch 平均
    minutes: 12
    flow:
      - guess:
          id: g1
          type: choice
          prompt: 一段宽平稳白噪声的真实功率谱是一条平坦的水平直线 $\Phi_{ee}(e^{j\omega})=1$。如果我们采集 $L=64$ 个点算一次周期图 $\frac{1}{L}|X(e^{j\omega})|^2$，画出来毛刺非常剧烈。如果把采样长度一口气加长到 $L=1024$ 甚至 $L=65536$，再只算这一次周期图，毛刺的剧烈程度（估计方差）会逐渐平滑归零吗？
          options:
            - text: 会逐渐归零，因为样本越多统计平均越准
              why: 令人意外的是，加长整段单次周期图只会让毛刺变得更密，每个频率点上的起伏幅度（方差）始终保持在 $\Phi^2(\omega)$ 附近，完全不会缩小
            - text: 不会，毛刺变密且单点方差不变
              correct: true
            - text: 会发散到无穷大，因为求和项数变多了
              why: 周期图除以了 $L$，均值会收敛到真实功率谱，既不发散也不归零，而是持续剧烈抖动
          explain: 单次周期图是“渐近无偏、但不一致”的估计量：增大 $L$ 只是把能量分摊到更多更密的频点上，每个频点本身只有 2 个自由度，方差恒定在 $\approx \Phi_{xx}^2(e^{j\omega})$ 不衰减。
      - card:
          title: 周期图的偏差与“非一致方差”困境
          body: |
            面对只能拿到有限长记录（长度 $Q$）的宽平稳随机信号，最直接的功率谱估计是**周期图（periodogram）**：截取长度 $L$ 的一段 $v[n]=x[n]w[n]$，定义

            $$I(\omega) = \frac{1}{L U}\left|\sum_{n=0}^{L-1} v[n]e^{-j\omega n}\right|^2$$

            其中 $U=\frac{1}{L}\sum w^2[n]$ 是窗能量归一化因子（矩形窗时 $U=1$）。评估一个谱估计器好不好看两项指标：
            - **偏差（bias）**：期望值等于真实功率谱与窗功率谱的卷积；当 $L\to\infty$ 时窗主瓣趋近冲激，偏差趋于 $0$（渐近无偏）。
            - **估计方差（variance）**：对单段周期图，无论 $L$ 多大，内部频点的方差都趋近 $\text{Var}\{I(\omega)\}\approx \Phi_{xx}^2(e^{j\omega})$，不随 $L$ 趋于零。也就是说，直接拿一整段长信号算一次 DFT 平方，永远得不到光滑可信的功率谱曲线。
      - item:
          id: q1
          type: choice
          prompt: 为什么说直接对整段随机信号算一次周期图是“非一致（inconsistent）”的功率谱估计量？
          options:
            - text: 因为随着观测长度 $L$ 增大，周期图的均值会越来越偏离真实功率谱
              why: 均值恰好相反：随着 $L\to\infty$，周期图的偏差趋于零（渐近无偏），出问题的是方差
            - text: 即使观测长度 $L\to\infty$，各频点处的估计方差也不趋于零
              correct: true
            - text: 因为周期图在高频段可能算出负值，违反功率非负性
              why: 周期图是模平方除以正数，永远非负
            - text: 因为周期图无法使用 FFT 计算，随 $L$ 增大计算时间爆炸
              why: 周期图就是直接对加窗信号做 FFT 再取模平方，计算极快，缺陷在统计方差上
          explain: 一致估计量要求偏差和方差都随数据量增大趋近于零；周期图虽然渐近无偏，但方差不随 $L$ 减小，因此不一致。
      - card:
          title: Bartlett 方法与 Welch 分段平均谱估计
          body: |
            把总长 $Q$ 的数据切分后对各段周期图求平均，可有效压低方差：
            - **Bartlett 方法**：切成 $K=Q/L$ 段无重叠矩形窗短段求平均，方差降为 **$1/K$**，代价是频率分辨率变粗 $K$ 倍。
            - **Welch 方法**：给每段加平滑窗（如 Hann 窗）压低旁瓣，并允许相邻段 **50% 重叠**（步进 $R=L/2$）。同等段长 $L$ 下段数增至 $K=\lfloor(Q-L)/R\rfloor+1$（近乎翻倍），不损失分辨率就能将方差再压低近一半。
      - card:
          title: 例题：总长 $Q=4096$ 下对比 Bartlett 与 Welch 的分段与方差
          body: 有一段长度 $Q=4096$ 的平稳随机噪声记录，选定每段长度 $L=512$ 以保证相同的频谱分辨率。分别计算 Bartlett 方法和 50% 重叠 Welch 方法能切出多少段，以及方差压低效果。
          reveal:
            - title: 第 1 步：计算 Bartlett 无重叠段数与方差缩减
              body: 无重叠切分：$K_{\text{B}} = Q / L = 4096 / 512 = 8$ 段。各段近似独立，平均后功率谱估计方差降为单段的 $1/8$。
            - title: 第 2 步：计算 50% 重叠 Welch 法的段数
              body: 步进 $R = L/2 = 256$，段数为 $K_{\text{W}} = \frac{Q - L}{R} + 1 = \frac{4096 - 512}{256} + 1 = 14 + 1 = 15$ 段，几乎比 Bartlett 多了一倍。
            - title: 第 3 步：理解 50% 重叠与加窗的综合收益
              body: 虽然相邻段有 50% 重叠，但因为平滑窗在两头衰减得很低，重叠部分权重很小、段间相关性很弱，15 段平均能把方差比 8 段 Bartlett 再压低近一半，同时大幅减少窗旁瓣泄漏，这就是工程软件默认采用 Welch 法估功率谱的原因。
      - item:
          id: q2
          type: number
          prompt: 对总长度 $Q=4096$ 的随机信号采用段长 $L=512$、50% 重叠（步进 $R=256$）的 Welch 方法估计功率谱，一共可以得到多少个分段？
          answer: 15
          hint: 代入分段计数公式 $K = \frac{Q - L}{R} + 1$。
          explain: $K = (4096 - 512)/256 + 1 = 3584/256 + 1 = 14 + 1 = 15$ 段；相比无重叠的 Bartlett（8 段）几乎翻倍。
      - item:
          id: q3
          type: choice
          prompt: 在固定总数据长度 $Q$ 的条件下，使用 Bartlett 方法时如果把分段数 $K$ 从 4 增加到 16（每段长度 $L=Q/K$ 缩为原来的 $1/4$），估计出的功率谱会出现什么权衡？
          options:
            - text: 估计方差降为约 $1/4$，但频率分辨率变粗 4 倍
              correct: true
            - text: 估计方差和频率分辨率同时改善 4 倍
              why: 固定总数据量 $Q$ 时，偏差（分辨率）和方差是此消彼长的权衡，不能同时变好
            - text: 频率分辨率提高 4 倍，但估计方差增大 4 倍
              why: 每段变短 $1/4$ 会让窗主瓣变宽 4 倍（分辨率变差），而更多段平均会让方差下降而不是增大
            - text: 对估计曲线没有任何影响，因为总样本数 $Q$ 没变
              why: 分段数 $K$ 直接决定方差与分辨率的分配比例，曲线形态会发生显著变化
          explain: 经典谱估计的核心权衡是“偏差–方差折中”：段长 $L$ 越短、段数 $K$ 越多，方差越小曲线越平滑，但主瓣越宽、频率分辨率越低。
      - item:
          id: q4
          type: match
          prompt: 将四种随机信号谱分析概念与各自的核心作用配对。
          pairs:
            - ['单段周期图', '渐近无偏，但方差不随长度 $L$ 衰减（非一致）']
            - ['Bartlett 方法', '无重叠分 $K$ 段平均，方差降为 $1/K$，分辨率降 $K$ 倍']
            - ['Welch 方法', '加平滑窗并 50% 重叠分段平均，同分辨率下段数近翻倍']
            - ['窗能量归一化因子 $U$', '修正平滑窗衰减造成的功率缩放，保持谱估计渐近无偏']
          explain: Welch 法结合平滑窗、50% 重叠与归一化因子 $U$，是在有限数据下兼顾低泄漏、低方差与计算效率的标准工具。

boss:
  items:
    - id: b1
      type: choice
      prompt: 因果初始静止系统满足差分方程 $y[n]=x[n]+0.25y[n-1]$。以下哪项关于它的结论全部正确？
      options:
        - text: 线性、时不变、因果且 BIBO 稳定，$h[n]=0.25^n u[n]$ 且 $\sum|h[n]|=4/3$
          correct: true
        - text: 线性、时不变、因果，但因脉冲响应无限长而不满足 BIBO 稳定
          why: IIR 系统只要脉冲响应绝对可和就稳定，$\sum_{n=0}^\infty 0.25^n=4/3<\infty$
        - text: 非线性、时不变、因果、稳定，因为右侧含有过去输出反馈项
          why: 在初始静止条件下，常系数线性差分方程严格满足叠加原理，是线性系统
        - text: 线性、时不变、非因果、稳定，单位脉冲响应为 $h[n]=4\cdot 0.25^n u[n]$
          why: $y[n]$ 只依赖当前输入和过去输出，是因果系统，且 $h[0]=1$ 而不是 $4$
      explain: 初始静止加常系数保证因果 LTI；递推得 $h[n]=0.25^n u[n]$，$\sum_{n=0}^\infty|h[n]|=\frac{1}{1-0.25}=\frac{4}{3}<\infty$，故 BIBO 稳定。
    - id: b2
      type: number
      prompt: 已知双边 z 变换 $X(z)=\frac{1}{(1-0.8z^{-1})(1-0.4z^{-1})}$，收敛域为 $|z|>0.8$。由部分分式展开求得其逆变换序列 $x[n]$，请计算 $x[2]$ 的值。
      answer: 1.12
      hint: 两个一阶分式的系数怎样用遮盖法求？收敛域决定每一项取哪一侧的序列？
      explain: 遮盖法得 $A=\frac{1}{1-0.4/0.8}=2$，$B=\frac{1}{1-0.8/0.4}=-1$；收敛域在两个极点之外，都取右侧序列：$x[n]=(2\cdot 0.8^n - 0.4^n)u[n]$，故 $x[2]=2\times 0.64-0.16=1.12$。
    - id: b3
      type: choice
      prompt: 某因果稳定系统 $H(z)=\frac{1-2z^{-1}}{1-0.4z^{-1}}$，下面哪项关于其相位类型与逆系统的判断正确？
      options:
        - text: 它是最小相位系统，因为极点 $0.4$ 位于单位圆内
          why: 最小相位要求极点和零点都在单位圆内，本系统零点 $z=2$ 落在单位圆外
        - text: 非最小相位，因果逆不稳定，可拆为最小相位与全通级联
          correct: true
        - text: 它是全通系统，在所有频率上幅频响应恒等于 $1$
          why: 全通系统要求零点恰是极点的共轭倒数（$1/0.4=2.5$），这里零点是 $2$ 而不是 $2.5$
        - text: 它是线性相位 FIR 系统，因为分子阶数和分母阶数都是 1
          why: 分母含 $z^{-1}$ 有反馈极点，属于一阶 IIR 系统，不是 FIR
      explain: 极点 $0.4$ 在圆内而零点 $2$ 在圆外，故非最小相位；将零点镜像为 $0.5$ 可拆成 $H_{\min}(z)=\frac{-2(1-0.5z^{-1})}{1-0.4z^{-1}}$ 与全通 $\frac{z^{-1}-0.5}{1-0.5z^{-1}}$。
    - id: b4
      type: choice
      prompt: 对 8 个 1 组成的序列 $x[n]=[1, 1, 1, 1, 1, 1, 1, 1]$ 做 8 点 DFT，得到 $X[0]=8$、其余 7 个点都是 0；若补零到 16 点再做 DFT，多出来的 8 个频点含义是什么？
      options:
        - text: 原序列 DTFT 在中间频率处的插值采样点，不提高真实频率分辨率
          correct: true
        - text: 补零把有效观测时长加倍，从而把真实物理频率分辨率提高了一倍
          why: 末尾补 0 不增加新信息，不改变连续 DTFT 主瓣宽度，只加密观察点
        - text: 反映序列高频截断误差的纯噪声项，应全部置零丢弃
          why: 它们是原序列真实 DTFT 在 $\omega=\pi/8, 3\pi/8, \dots, 15\pi/8$ 处的精确取值，不是噪声
        - text: 必然全部等于 0，因为末尾补入的样本值都是 0
          why: 8 点矩形脉冲的 DTFT 在这些新频点处非零（如 $|X_{16}[1]|\approx 5.126$）
      explain: DFT 是有限长序列 DTFT 在 $\omega=2\pi k/N$ 上的采样；补零只加密采样网格（缓解栅栏效应），不改变 DTFT 本身。
    - id: b5
      type: number
      prompt: 计算一个 $N=512$ 点的基 2 FFT，按公式 $\frac{N}{2}\log_2 N$ 计算大约需要多少次复数乘法？
      answer: 2304
      hint: 512 是 2 的几次方？
      explain: $\frac{512}{2}\times \log_2(512) = 256 \times 9 = 2304$ 次，远少于直接计算的 $512^2=262{,}144$ 次。
    - id: b6
      type: number
      prompt: 一个 $5\text{ kHz}$ 的连续正弦信号被 $f_s=6\text{ kHz}$ 的采样器采集，在 $[0, 3\text{ kHz}]$ 基带内呈现出的视在混叠频率是多少 kHz？
      answer: 1
      hint: $5\text{ kHz}$ 超过了奈奎斯特频率 $3\text{ kHz}$，计算 $|f - f_s|$。
      explain: $|5 - 6| = 1\text{ kHz}$。若未在采样前加截止 $3\text{ kHz}$ 的抗混叠低通，$5\text{ kHz}$ 信号会永久混叠成 $1\text{ kHz}$。
    - id: b7
      type: number
      prompt: 用布莱克曼窗（经验公式 $M\approx 5.5/\Delta f$）设计线性相位 FIR 低通滤波器，若归一化过渡带宽要求 $\Delta f=0.05$，大约需要多少阶 $M$？
      answer: 110
      hint: 过渡带越窄，需要的阶数越多还是越少？
      explain: $M \approx 5.5 / 0.05 = 110$ 阶（对应长度 111 的 I 型对称 FIR），满足 $h[n]=h[M-n]$ 从而实现严格线性相位。同样指标用汉明窗约 66 阶，布莱克曼窗换来更低的旁瓣，代价是阶数更高。
    - id: b8
      type: number
      prompt: 用双线性映射设计数字 IIR 低通：采样率 $f_s=4000\text{ Hz}$，目标数字截止频率 $f_c=1000\text{ Hz}$。预畸变后的模拟原型截止角频率 $\Omega_c=\frac{2}{T}\tan(\omega_c/2)$ 等于多少 rad/s？
      answer: 8000
      hint: 数字截止角频率 $\omega_c$ 怎样由 $f_c$ 和 $f_s$ 算出？
      explain: $\omega_c = \pi/2$，故 $\Omega_c = 2f_s \tan(\pi/4) = 8000 \times 1 = 8000\text{ rad/s}$（若不预畸变用 $2\pi\cdot 1000\approx 6283\text{ rad/s}$ 会严重偏低）。
    - id: b9
      type: choice
      prompt: 相比采用冲激响应不变法，为什么工程中设计数字高通 IIR 滤波器必须采用双线性映射（配合预畸变）？
      options:
        - text: 因为冲激响应不变法只适用于 FIR 滤波器，不能产生反馈极点
          why: 冲激响应不变法产生的就是 IIR 滤波器，极点按 $e^{s_k T_d}$ 映射
        - text: 模拟高通高频不衰减，冲激不变采样会严重混叠，双线性映射无混叠
          correct: true
        - text: 因为双线性映射能把 IIR 滤波器变成严格线性相位
          why: 双线性映射是非线性频率映射，不能让因果 IIR 具备严格线性相位
        - text: 因为冲激响应不变法无法保持模拟原型的稳定性
          why: 冲激响应不变法把左半平面映射到单位圆内，同样保持稳定性
      explain: 模拟高通与带阻不是带限的，对冲激响应采样会导致剧烈混叠；双线性映射将整个虚轴无重叠映射到单位圆，避免混叠。
    - id: b10
      type: number
      prompt: 要把采样率从 $20\text{ kHz}$ 抽取降频到 $5\text{ kHz}$（$M=4$），使用长度为 $20$ 的抗混叠 FIR 滤波器。若改用 4 路多相分解结构（把 $\downarrow 4$ 移到子滤波器前），每秒乘法次数会从直接法的 $400{,}000$ 次降到多少次？
      answer: 100000
      hint: 4 条子滤波器各长 $20/4=5$，均工作在降速后的 $5\text{ kHz}$ 速率下（或直接除以 $M=4$）。
      explain: $4 \times 5 \times 5000 = 100{,}000$ 次/秒，恰好是直接法的 $1/4$。
    - id: b11
      type: choice
      prompt: 在平稳随机信号的功率谱估计中，为什么 Welch 方法比直接对整段数据算一次周期图更受工程青睐？
      options:
        - text: 单段周期图方差不随数据变长而衰减，Welch 加窗重叠平均能同时压低泄漏与方差
          correct: true
        - text: Welch 方法把总观测时间加倍，同时使频率分辨率与方差同步提升 10 倍
          why: 总数据长度固定时，分段变短总会付出频率分辨率变粗的代价，不是免费同时提升
        - text: 单段周期图不能用 FFT 计算，而 Welch 方法是唯一能用 FFT 加速的谱估计算法
          why: 单段周期图本身就是一次 FFT 取模平方，Welch 的优势在于统计一致性与低泄漏
        - text: Welch 方法通过丢弃 50% 的样本来过滤掉随机噪声，从而得到零方差的确定频谱
          why: Welch 是 50% 重叠复用样本而不是丢弃样本，且有限数据下估计方差不可能降为零
      explain: 单段周期图是不一致估计量（方差卡在 $\Phi^2$）；Welch 借分段平均把方差降下来，再用平滑窗压旁瓣、50% 重叠增加段数。
