skill: H.1.1
version: 2
authors: [main-agent]
brief:
  why: |
    在把传感器、电机或麦克风接进微控制器（MCU）与数字芯片之前，必须先听懂物理世界的电压与电流语言：电阻网络如何分压分流、RC 电容为什么按指数充放电、运算放大器怎样靠“虚短虚断”精准放大微弱信号、低通滤波器怎样阻挡高频噪声与采样混叠，以及 ADC 如何把连续模拟电压变成离散数字码。
  outcomes:
    - 掌握集总抽象、欧姆定律、KCL/KVL 节点与回路方程，能计算串并联等效与戴维南/诺顿端口等效并检查加载效应
    - 掌握一阶 RC/RL 暂态响应（时间常数 τ = RC 或 L/R）与阶跃充放电电压计算，并用 SPICE（ngspice）验证瞬态曲线
    - 理解受控源放大器模型、MOS/BJT 差分对小信号跨导线性化与多级级联带宽/增益关系
    - 掌握理想运放“虚短/虚断”、反相与同相放大、积分/微分运算，以及有限带宽、压摆率（SR）与直流失调限制
    - 掌握一阶 RC 截止频率计算、巴特沃斯/切比雪夫滤波器权衡，以及量化 LSB、SNR = 6.02N + 1.76 dB 与抗混叠采样定理
terms:
  - term: 电压
    def: '驱动电荷在两点之间移动的电势差推动力，单位为伏特（V），高电位减去低电位就是两点间的电压差'
  - term: 电流
    def: '单位时间内横穿导线或元件截面的电荷流量，单位为安培（A），约定为正电荷定向流向的方向'
  - term: 欧姆定律
    def: '线性电阻两端电压差 V、流过电流 I 与阻值 R 之间的正比关系：$V = I \cdot R$，常用于由压算流或由流算压'
  - term: 基尔霍夫电流定律
    def: '简称 KCL，指集中电路任意节点在任一时刻流入的总电流必须严格等于流出的总电流（电荷不会在节点里堆积或凭空产生）'
  - term: 基尔霍夫电压定律
    def: '简称 KVL，指沿电路任意一条闭合回路绕一圈，所有元件上的电势升高与电势降低的代数和必定为零'
  - term: 戴维南等效
    def: '把任意只含电源与线性电阻的复杂单端口黑盒网络，等效简化为一个理想电压源与一只串联输出内阻的极简组合'
  - term: 诺顿等效
    def: '戴维南等效的对偶形式，把复杂线性单端口网络等价成一只理想恒流源与一只并联内阻的组合'
  - term: 时间常数
    def: '一阶电容电阻电路中决定充放电快慢的特征时间刻度 $\tau = R C$（或电感电阻电路 $\tau = L / R$），每过 1 个 $\tau$ 变化剩余差距的约 63.2%'
  - term: 电感
    def: '将电流能量暂存在磁场中的无源元件（符号 L，单位亨利 H），核心脾气是反对流过自身的电流发生瞬间突变'
  - term: 增益
    def: '放大器稳定输出信号变化幅度与输入信号变化幅度之比，无量纲倍数或用对数分贝（dB）刻度衡量'
  - term: 小信号模型
    def: '在非线性晶体管选定直流偏置工作点附近做切线线性近似得到的等效线性电路，用于预测微弱交流变化如何被放大'
  - term: 运算放大器
    def: '一种开环电压放大倍数极大（理想视作无限大）、输入几乎不吸取电流的高增益差分放大集成器件，简称运放'
  - term: 低通滤波器
    def: '让低频慢变化信号顺畅通过、对高于截止频率的高频快变化信号大幅削弱衰减的频率选择电路'
  - term: 方均根
    def: '英文 RMS，把随时间正负交变或随机抖动的电压先平方、再求时间平均、最后开平方得到的等效直流热功率电压值'
  - term: 量化
    def: '把连续不断变化的模拟电压按离散最小步长分格四舍五入或向下截断，映射成有限个整数数字编码的过程'
  - term: ADC
    def: '模数转换器（Analog-to-Digital Converter），负责周期性采集真实世界模拟电压并编码输出给处理器读取的接口芯片'
  - term: DAC
    def: '数模转换器（Digital-to-Analog Converter），将处理器算出的数字整数编码按权重基准恢复输出成对应模拟电压'
  - term: 混叠
    def: '当采样速率不足采样定理要求时，高于半数采样率的高频信号或噪声伪装折回低频带内且事后无法剔除的失真现象'
assumes: [积分, 线性, 方程]

lessons:
  # ==== 电路定律 ====
  - id: ohm
    chapter: 电路定律
    title: 集总抽象、电压电流与欧姆分压及 SPICE 仿真初探
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            把一个 `12 V` 直流电源接在一只 `4 kΩ`（4000 欧姆）的电阻两端形成简单回路，电线自己几乎不耗电。如果把电阻换大一倍成 `8 kΩ`，回路里跑过的电流会怎么变？
          options:
            - text: 减半，从 3 mA 降到 1.5 mA
              correct: true
            - text: 翻倍到 6 mA，电阻越大推力越大
              why: 电阻是“阻碍”电流通过的阻力，电压不变时电阻越大电流越小
            - text: 仍然是 3 mA
              why: 电阻翻倍时电流同样减半（$I = V / R$），电流并不只由电源电压决定
          explain: |
            这就是电路世界最朴素的直觉：**电压像水压推力、电流像水流大小、电阻像水管狭窄阻力**——再配上**集总电路抽象**与 **SPICE 仿真**，就能算清整张原理图。
      - card:
          title: 集总抽象、电压、电流与欧姆定律
          body: |
            只要导线尺寸远小于信号波长，电路分析就可以安全做**集总电路抽象（Lumped Abstraction）**：把复杂三维电磁场凝炼进理想连线和分立元件两点间的两个物理量：
            - **电压（$V$，单位伏特 V）**：驱动电荷移动的电势差推动力（两点之间谁高多少伏）；
            - **电流（$I$，单位安培 A）**：每秒穿过元件截面的正电荷流量（约定关联参考方向从高电势“+”流向低电势“−”）；
            - **欧姆定律**：理想线性电阻满足 $V = I \cdot R$（常用换算：`1 V / 1 kΩ = 1 mA`）。
          reveal:
            - title: 为什么两只串联电阻会按阻值比例分走电压？
              body: |
                串联意味着同一股水流不得不先后挤过 $R_1$ 和 $R_2$，因此流过两者的电流 $I$ 完全相等。由 $I = V_{in} / (R_1 + R_2)$ 得 $R_2$ 两端分到的电压：
                $V_2 = I \cdot R_2 = V_{in} \cdot \frac{R_2}{R_1 + R_2}$。阻力大的那只按比例多占电压降，阻力小的少占，两只电阻的电压之和恰好等于总输入电压 $V_{in}$。
      - card:
          title: 并联阻力公式与 SPICE 网表仿真验证
          body: |
            两个电阻 $R_2$、$R_3$ 首尾并排接在同一对节点两端（承受**完全相同的电压**，电流各自按通路分摊），总等效阻力变小：
            $$R_2 \parallel R_3 = \frac{R_2 R_3}{R_2 + R_3}$$
            例如 $3\text{ k}\Omega \parallel 6\text{ k}\Omega = \frac{18}{9} = 2\text{ k}\Omega$（比两个里最小的那只还要小）。真实工程验证复杂电路还会写出文本网表（SPICE，如开源 `ngspice`）交由计算机求解节点电压和瞬态波形。
          reveal:
            - title: 怎样判断两只电阻是“串联”还是“并联”
              body: |
                不要盯着电路图画得横竖像不像，要看节点连接拓扑：**首尾牵手、中间再无第三条岔路的才是真串联**（流过相同电流）；**各自两端同时接在完全相同的一对公共节点上才是真并联**（承受相同电压）。如果既非串联也非并联（如电桥交叉），交给节点电压法通吃。
      - item:
          id: ohm-current-calc
          type: number
          prompt: |
            一个 `12 V` 直流电源串联一只总等效电阻为 `4 kΩ` 的负载回路。按照欧姆定律 $I = V / R$，回路总电流是多少毫安（mA，填整数）？
          answer: 3
          hint: '用串联分压后总阻下的欧姆定律：$I = V / R_{tot}$，注意电压（V）除以千欧（kΩ）单位恰好直接是毫安（mA）。'
          explain: |
            $I = 12\text{ V} / 4\text{ k}\Omega = 3\text{ mA}$（等价于 `0.003 A`）。
      - item:
          id: parallel-3k-6k
          type: number
          prompt: |
            计算两只并联电阻 $R_2 = 3\text{ k}\Omega$ 与 $R_3 = 6\text{ k}\Omega$ 合并后的等效阻值是多少千欧（kΩ）？
          answer: 2
          hint: '套用双阻并联公式：两只阻值相乘的积，除以两者之和。'
          explain: |
            $3 \times 6 / (3 + 6) = 18 / 9 = 2\text{ k}\Omega$，并联结果永远严格小于最小的并联支路阻值。
      - item:
          id: series-total-res-c4
          type: number
          prompt: |
            如果把电阻 $R_1 = 2\text{ k}\Omega$ 串联在并联支路（$R_2 = 3\text{ k}\Omega \parallel R_3 = 6\text{ k}\Omega$）之后，整个电路从电源两端看进去的**总等效电阻**是多少千欧（kΩ）？
          answer: 4
          hint: '先算出并联那部分的等效阻值，再与前面串联进来的电阻直接相加。'
          explain: |
            $R_{total} = R_1 + (R_2 \parallel R_3) = 2 + 2 = 4\text{ k}\Omega$。
      - item:
          id: divider-ratio-calc
          type: number
          prompt: |
            用 `5 V` 稳压源串联两只电阻分压：上拉电阻 $R_1 = 2\text{ k}\Omega$、下拉接地电阻 $R_2 = 3\text{ k}\Omega$。中间连接点对地的输出电压是多少伏？
          answer: 3
          hint: '串联等电流，中间对地分压比例等于下拉电阻占整串总电阻的份额。'
          explain: |
            $V_{out} = 5 \times \frac{3}{2 + 3} = 3\text{ V}$（上方 `R1` 上压降 `2 V`，下方 `R2` 上压降 `3 V`）。
      - item:
          id: circuit-terms-match
          type: match
          prompt: |
            把第一课的四个核心电路概念配对到准确的物理含义。
          pairs:
            - ["**电压**（Volt, V）", "两点之间的电势差推力，决定电荷流向与强弱动力"]
            - ["**电流**（Ampere, A）", "每秒流过导线的正电荷流量，串联回路各处等大"]
            - ["**欧姆定律**（V = I·R）", "刻画电阻两端电压与通过电流成正比的基本线性规律"]
            - ["集总电路抽象", "信号波长远大于器件尺寸时，把电磁效应拆成节点和理想元件"]
          explain: |
            串联等流分压、并联等压分流，记住这两句就能一口气拆解大多数电阻网络。

  - id: nodes
    chapter: 电路定律
    title: 基尔霍夫电流定律（KCL）与节点电压方程分析
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一条总水管正往一个三通接头里每秒灌入 `3 升` 水；三通接出两根支管分别往两块田里浇水，已经测得第一根支管流走了 `2 升/秒`。假如接头不漏水也不膨胀储水，另一根支管每秒一定流出多少水？
          options:
            - text: '`1 升/秒`。进多少就必须出多少，接头里不能攒水'
              correct: true
            - text: '`5 升/秒`，把总流入和测出的一支加起来'
              why: 支管里的水是从总流入里分出去的，不能再加上总流入；另一支只能是 $3 - 2 = 1$ 升/秒。
            - text: '`2 升/秒`，两根支管一样多'
              why: 两根支管不一定一样多：总流入 3 升/秒，已测出的一支流走 2 升/秒，另一支只能是 $3 - 2 = 1$ 升/秒。
          explain: |
            把水流换成电荷流，这就是电工鼻祖**基尔霍夫电流定律（KCL）**以及系统化列线性方程的**节点分析法**。
      - card:
          title: 基尔霍夫电流定律（KCL）与分流检查
          body: |
            - **基尔霍夫电流定律（KCL）**：电路中**任意一个节点**上，所有流入该节点的电流之和，严格等于流出该节点的电流之和（等价写法：$\sum I_{out} - \sum I_{in} = 0$）。
            - **怎么检验复杂题算错没？**：算出一条主干总电流 $I_{total}$ 和各个并联支路电流后，拿它们在分叉节点一加——如果加不回 $I_{total}$，必定哪步算错了。
          reveal:
            - title: 一步一步算出分压，再用 KCL 检验
              body: |
                `12 V` 电源串联 $R_1 = 2\text{ k}\Omega$，再接 $R_2 = 3\text{ k}\Omega \parallel R_3 = 6\text{ k}\Omega$：
                1. 并联等效：$R_{23} = \frac{3\times 6}{3+6} = 2\text{ k}\Omega$；
                2. 总电阻与总电流：$R_{tot} = 2 + 2 = 4\text{ k}\Omega \implies I_{tot} = \frac{12}{4} = 3\text{ mA}$；
                3. 并联两端电压：$V_A = 12 - I_{tot}\cdot R_1 = 12 - 3\times 2 = 6\text{ V}$；
                4. 各支路电流与 KCL：$I_{R2} = 6/3 = 2\text{ mA}$，$I_{R3} = 6/6 = 1\text{ mA}$，且 $2 + 1 = 3\text{ mA} = I_{tot}$，满足 KCL。
      - card:
          title: 节点分析法（Nodal Analysis）：把任何电路变成线性方程组
          body: |
            当电路有好几个源、桥接交叉让人看不出哪两只串联哪两只并联时，用**节点电压法**通吃：
            1. 挑一个共同点当 **0 V 参考地节点（GND）**，其余独立节点标上未知电压 $e_1, e_2, \dots$；
            2. 利用欧姆定律把每条电阻电流写成 `(起点电压 − 终点电压) / 阻值`；
            3. 在每个非参考节点写一条 KCL（流出之和 = 0），直接得到线性代数方程组 $A \mathbf{e} = \mathbf{b}$ 一次解出全部节点电压。
      - item:
          id: kcl-branch-current-c4
          type: number
          prompt: |
            `12 V` 电源串联 $R_1 = 2\text{ k}\Omega$ 后，接 $R_2 = 3\text{ k}\Omega$ 与 $R_3 = 6\text{ k}\Omega$ 的并联支路。算出流过 $R_2$ 的电流是多少毫安（mA）？
          answer: 2
          hint: '先求并联等效阻值与主干总电流，扣掉 $R_1$ 压降得到并联两端电压，再用欧姆定律除以 $R_2$。'
          explain: |
            总电流 $3\text{ mA}$ 在 $R_1$ 上降去 $6\text{ V}$，并联节点剩余 $6\text{ V}$，故 $I_{R2} = 6 / 3 = 2\text{ mA}$（同时 $I_{R3} = 6 / 6 = 1\text{ mA}$，相加恰为 $3\text{ mA}$）。
      - item:
          id: parallel-node-volt-c4
          type: number
          prompt: |
            `12 V` 电源串联 $R_1 = 2\text{ k}\Omega$，再接 $R_2 = 3\text{ k}\Omega$ 与 $R_3 = 6\text{ k}\Omega$ 的并联支路。请问**并联部分两端对地**的电压是多少伏？
          answer: 6
          hint: '可用总电压减去 $R_1$ 上的压降，或用串联分压比 $R_{23}/(R_1 + R_{23})$ 乘以总电源电压。'
          explain: |
            $R_1 = 2\text{ k}\Omega$ 与并联等效 $R_{23} = 2\text{ k}\Omega$ 刚好阻值相等对半分压，各占 `6 V`。
      - item:
          id: kcl-ir3-c4
          type: number
          prompt: |
            完成 KCL 检验：`12 V` 电源串联 $R_1 = 2\text{ k}\Omega$ 后接 $R_2 = 3\text{ k}\Omega \parallel R_3 = 6\text{ k}\Omega$。已知干路总电流 `3 mA`、流经 $R_2$ 电流为 `2 mA`。按节点电流守恒（或由并联节点电压除以 $R_3$），流经 $R_3$ 的电流是多少毫安（mA）？
          answer: 1
          hint: '用干路总电流减去流进另一条支路 $R_2$ 的电流，并用并联两端电压除以 $R_3$ 双重检验。'
          explain: |
            $I_{R3} = 6\text{ V} / 6\text{ k}\Omega = 1\text{ mA}$，恰好满足 KCL：$I_{R2} + I_{R3} = 2 + 1 = 3\text{ mA} = I_{total}$。
      - item:
          id: kcl-conservation-why
          type: choice
          prompt: |
            一个四岔连接点接了 4 根导线：测得其中两条分别往节点里流入 `5 mA` 和 `3 mA`，第三条往节点外流出 `6 mA`。按照**基尔霍夫电流定律（KCL）**，第四条导线上的电流方向和大小一定是？
          options:
            - text: 往节点外流出 `2 mA`，总流入 8 减去已知流出的 6
              correct: true
            - text: 往节点里流入 `2 mA`
              why: 若再流入 2 mA，总流入变成 10 mA 而总流出只有 6 mA，电荷会在节点上不断堆积
            - text: 往节点外流出 `14 mA`，把三根导线的电流都加起来
              why: 流入总和只有 `5 + 3 = 8 mA`，流出不能超过流入之和
          explain: |
            总流入 = $5 + 3 = 8\text{ mA}$，减去第三条流出的 $6\text{ mA}$，第四条必往外流出 $2\text{ mA}$。
      - item:
          id: nodal-method-core
          type: choice
          prompt: |
            当遇到带桥接电阻、难以一眼看出纯串纯并的复杂多回路线性网络时，**节点电压分析法**最核心的一套机械步骤是什么？
          options:
            - text: 选参考地，其余节点电压设为未知数，对每个节点列 KCL 方程联立
              correct: true
            - text: 先用串并联公式把电阻网络化成一只总电阻，再用电源电压除以总电阻求总电流，最后按阻值比例分到各支路
              why: 桥接或交叉的电路化不成纯串纯并，这个办法在这里写不出方程；节点法不需要化简
            - text: 只随便猜一个数字当作节点电压不再验算电流守恒
              why: KCL 与欧姆定律把未知节点电压严格锚定在唯一解的线性方程组中
          explain: |
            这也是几乎所有现代电路仿真器（包括 SPICE）在计算机底层构造矩阵并自动求解电路的方法。

  - id: loops
    chapter: 电路定律
    title: 基尔霍夫电压定律（KVL）、功率能量与回路检查
    minutes: 11
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            假如你从一栋大楼 `1 楼（0 米）` 出发，先乘电梯上升 `12 米`，然后走楼梯向下 `6 米`，接着顺坡道再向下 `6 米` 回到出发那块地板。把三段高度变化相加等于几米？
          options:
            - text: '`0 米`。绕一圈回到同一点，净高度差必为零'
              correct: true
            - text: '`+24 米`，三段高度直接相加'
              why: 向下走要记成负值，直接相加等于把下降当成了上升；闭合回路的代数和为零
            - text: 等于随机高度，每次走法不同答案都变
              why: 电势和海拔一样是仅取决于空间位置的状态函数
          explain: |
            沿任意闭合路径走一圈电势压升与压降的净和为零——这就是**基尔霍夫电压定律（KVL）**。
      - card:
          title: 基尔霍夫电压定律（KVL）与功率检查
          body: |
            - **基尔霍夫电压定律（KVL）**：沿着电路的**任意一条闭合环路**绕行一圈回到起点，顺着方向遇到的电势升高与降低之和必定等于 **`0`**。
            - **怎么防算错正负号？**：把电源负极当 `0 V`，从负向正穿过 `12 V` 电源记作升高 `+12 V`，顺着电流方向穿过电阻 $R$ 产生压降记作 `-I·R`——绕一圈 `+12 - 6 - 6 = 0` 才算守恒。
            - **为什么一定是零？**：电压就是两点之间的电势差。绕一圈回到出发点，电势又回到原来的值，路上升高了多少就必须降低多少，所以总和只能是 `0`。
          reveal:
            - title: 为什么功率 $P = V \cdot I$ 也要全电路总和为零？
              body: |
                物理功率 $P = V \cdot I$ 遵循能量守恒（单位瓦特 W）。对于电阻，电流从高电位端流向低电位端，它一直在消耗发热功率 $P = I^2 R = V^2 / R$；而电源把电流从低电位端推向高电位端是在提供功率——全电路提供功率之和必然恰好等于全部元件消耗功率之和。例如 12 V 电源串联两只电阻、各分 6 V、电流 2 mA：电源提供 $12 \times 2 = 24\text{ mW}$，两只电阻各消耗 $6 \times 2 = 12\text{ mW}$，合计也是 24 mW。
      - item:
          id: kvl-series-drop-c4
          type: number
          prompt: |
            在一个闭合串联环路里，电池提供 `12 V` 电压；已知电路中另一部分两端电压降落为 `4 V`，剩下唯一的电阻 $R_x$ 两端分到的电压降落是多少伏？
          answer: 8
          hint: '沿闭合环路绕一圈，把电源升高的电压减去已知元件降落的电压，总和必等于零。'
          explain: |
            沿闭合回路 `12 - 4 - 8 = 0`，因此 $R_x$ 两端压降为 `8 V`。
      - item:
          id: power-resistor-mw
          type: number
          prompt: |
            若流过一只 $R_1 = 2\text{ k}\Omega$ 电阻的电流是 `3 mA`（即两端压降 `6 V`），这只电阻每秒消耗散发的热功率 $P = V \cdot I$ 是多少毫瓦（mW）？
          answer: 18
          hint: '功率等于两端电压与通过电流之积，电压用伏（V）配电流用毫安（mA）直接出毫瓦（mW）。'
          explain: |
            $P = 6\text{ V} \times 3\text{ mA} = 18\text{ mW}$（也等于 $I^2 R = 0.003^2 \times 2000 = 0.018\text{ W}$）。
      - item:
          id: kvl-vs-kcl-match
          type: match
          prompt: |
            把两条基尔霍夫基础定律配对到各自检查对象与守恒物理本质。
          pairs:
            - ["**基尔霍夫电流定律**（KCL）", "针对每个连接点检查：流入电流之和严格等于流出电流之和（电荷守恒）"]
            - ["**基尔霍夫电压定律**（KVL）", "针对任意闭合环路检查：绕行一圈的压升与压降代数和为零（电势单值性）"]
            - ["电阻发热功率公式（$P = I^2 R$）", "衡量电阻将电能转化为热耗散的速率，与电压电流均呈平方级增长"]
          explain: |
            KCL 管分叉点电流账，KVL 管绕环路电压账，双剑合璧任何线性网皆可破。
      - item:
          id: kvl-bypass-path
          type: choice
          prompt: |
            一块直流回路中，已知 A 点比地高 `6 V`，B 点比地高 `2 V`。如果顺便再在 A 与 B 之间并接一只高阻测量电压表，表头读出的 `V_A - V_B` 应该是多少伏？
          options:
            - text: '`4 V`，两点电位相减'
              correct: true
            - text: '`8 V`，把两点的电位相加'
              why: 电势差是两处电势相减：$6 - 2 = 4\text{ V}$，不是相加
            - text: '`0 V`，必须断开电源以后才能测量两点电压'
              why: 只要电路稳态工作，两点对地电位各自确定，其差值唯一确定为 4 V
          explain: |
            KVL 保证了任意两点间电压差不依赖路径，永远等于终起点对共同参考地的电位差。

  - id: equivalent
    chapter: 电路定律
    title: 叠加原理、戴维南等效与诺顿端口等效
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            手里有一块里面焊了 `50 只` 电阻和 `3 颗` 电池的复杂线性黑盒板子，向外只露出正负两个输出接线柱，待会儿要轮流往上插 `5 种` 不同阻值的外部小灯泡试亮度。每次换个灯泡都要重解一遍那 50 只电阻的巨型方程组吗？
          options:
            - text: 不用。从两个接线柱看进去，线性黑盒只需要开路电压和等效内阻两个数
              correct: true
            - text: 不能简化，每换一个外部负载都要把黑盒里的 50 只电阻重解一遍
              why: 黑盒里全是线性元件时，接线柱上的电压和电流成直线关系，一条直线用两个数就能确定
            - text: 只剩下一个理想电压源，没有内阻
              why: 接上灯泡后端电压会下降，说明黑盒除了开路电压，还有一个不能忽略的等效内阻
          explain: |
            **两种常用手法**：多电源用**叠加原理**分别求解，对外接口用**戴维南等效**或**诺顿等效**缩成两个数。
      - card:
          title: 戴维南等效（Thévenin）与诺顿等效（Norton）
          body: |
            站在任意复杂线性单端口外看进去，只需测算两个端口数值就能替换整箱零件：
            - **戴维南等效**：1 只开路理想电压源 $V_{TH}$（把外部负载全部拔掉悬空时，两柱子间的开路电压）**串联** 1 只等效内阻 $R_{TH}$（把盒子内部所有独立电压源短路成导线、独立电流源断开成开路后，从接口端看进去的总阻）；
            - **诺顿等效**：完全对偶等价——把两柱子直接短路流出的短路电流 $I_N = V_{TH} / R_{TH}$ 当恒流源，**并联**同一只内阻 $R_N = R_{TH}$。
          reveal:
            - title: 举例实操：12 V 分压器戴维南等效与带载输出电压（含加载效应）
              body: |
                假设黑盒由 `12 V` 串联 `3 kΩ` 再接 `6 kΩ` 到地，从两电阻中间引出输出：
                1. **求 $V_{TH}$**：拔掉外部负载算空载分压，$V_{TH} = 12 \times \frac{6}{3 + 6} = 8\text{ V}$；
                2. **求 $R_{TH}$**：把 `12 V` 电源短路接地，两电阻并联得 $R_{TH} = 3\text{ k}\Omega \parallel 6\text{ k}\Omega = 2\text{ k}\Omega$。此时若外接 `2 kΩ` 负载，代入分压得 $V_{load} = 8 \times \frac{2}{2 + 2} = 4\text{ V}$。再看 `6 V` 戴维南源带 `1 kΩ` 内阻：等价诺顿电流源 $I_N = 6 / 1 = 6\text{ mA}$ 并联 `1 kΩ`，接 `2 kΩ` 负载分得电流 $2\text{ mA}$，电压同为 `4 V`。
      - card:
          title: 线性电路叠加原理（Superposition）与最大功率思考
          body: |
            - **叠加原理**：当一个线性电路里同时存在 2 个或更多独立电源时，可以**每次只留 1 颗电源开机工作**（其余独立电压源暂时置零成导线短路、独立电流源置零成断开），分别算出目标支路电流或电压，最后把各电源单独贡献**直接代数相加**（注意功率 $I^2 R$ 非线性，绝不能各自算功率再直接相加）。
            - **接口加载提示**：外接负载电阻远大于源内阻（$R_L \gg R_{TH}$）时电压几乎不掉（如万用表高阻测量）；当 $R_L = R_{TH}$ 时负载获得最大传输功率。
      - item:
          id: thevenin-load-volt
          type: number
          prompt: |
            一个传感器输出端按**戴维南等效**测得开路电压 $V_{TH} = 6\text{ V}$、等效串联内阻 $R_{TH} = 1\text{ k}\Omega$。现在把一只 $R_L = 2\text{ k}\Omega$ 的采集负载电阻接上去，负载两端实际量到的电压是多少伏（填数字）？
          answer: 4
          hint: '在等效回路里，戴维南电压源正经串联内阻向外部负载电阻分压供电，套用分压比例计算。'
          explain: |
            $V_L = 6 \times \frac{2}{1 + 2} = 4\text{ V}$，由于内阻不小，接上 `2 kΩ` 负载后输出端电压从空载 `6 V` 被拉掉 `2 V`——这就是传感器接口里最常踩的“加载效应（Loading Effect）”。
      - item:
          id: norton-current-conv
          type: number
          prompt: |
            一只戴维南开路电压 $V_{TH} = 6\text{ V}$、等效串联内阻 $R_{TH} = 1\text{ k}\Omega$ 的线性信号源端口。如果把它改画成等价的**诺顿等效**形式（理想电流源并联 $1\text{ k}\Omega$ 内阻），其中理想恒流源电流 $I_N$ 是多少毫安（mA）？
          answer: 6
          hint: '把端口输出两脚直接短接，求经等效内阻流出的短路电流。'
          explain: |
            $I_N = 6\text{ V} / 1\text{ k}\Omega = 6\text{ mA}$；诺顿形式与戴维南形式在接口外接任意负载时呈现完全一致的电压电流特性。
      - item:
          id: superposition-power-trap
          type: choice
          prompt: |
            电路里同时有两个独立电源 $V_1$ 和 $V_2$，某电阻在只有 $V_1$ 开启时消耗功率 `4 W`，只有 $V_2$ 开启时消耗 `9 W`。直接把“4 W + 9 W = 13 W”当作两电源同时工作时的总功耗，对吗？
          options:
            - text: 不对。叠加原理只对电流和电压成立，功率要先把电流相加再平方
              correct: true
            - text: 正确，功率也能叠加，4 + 9 = 13 W
              why: '$(I_1 + I_2)^2 R \neq I_1^2 R + I_2^2 R$，交叉项 $2 I_1 I_2 R$ 可正可负'
            - text: 两个电源不能同时接在电路里
              why: 叠加原理正是处理多个独立源同时工作的方法：逐个求分量，再代数相加
          explain: |
            若两源电流在电阻上同向，总电流加倍后功率按平方增长远不止相加；若恰好反向抵消，总电流为 0 功率甚至降成 0 W。
      - item:
          id: equivilent-terms-match
          type: match
          prompt: |
            把黑盒简化与多电源拆分的概念配对到各自适用方法。
          pairs:
            - ["**戴维南等效**（Thévenin）", "理想电压源 $V_{TH}$ 与等效串联内阻 $R_{TH}$ 替换复杂线性端口"]
            - ["**诺顿等效**（Norton）", "短路电流源 $I_N$ 与等效并联内阻 $R_N$ 替换复杂线性端口"]
            - ["叠加原理（Superposition）", "线性电路中一次只留单个独立源求解再将各电流/电压分量代数相加"]
          explain: |
            戴维南和诺顿两兄弟随时按 $V_{TH} = I_N R_{TH}$ 互换，做并联合并用诺顿、做串联分压用戴维南。

  # ==== RC/RL ====
  - id: transient
    chapter: RC/RL
    title: 电容电感暂态、时间常数 τ=RC 充放电与 ngspice 验算
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            把一只本来一点电都没存（`0 V`）的空电容，串联一只大电阻后突然插到 `5 V` 电池上充电。通电刹那电容两端的电压会像开关一样“咔哒”瞬间原地跳变到 `5 V` 吗？
          options:
            - text: 不会。有限电流只能按指数曲线充电，越接近 `5 V` 越慢
              correct: true
            - text: 会，电压瞬间跳到 5 V，串多大的电阻都一样
              why: 电容电流 $i = C \frac{dv}{dt}$，有限电流决定了电容电压在无无限大尖峰冲击下必须连续平滑变化
            - text: 电压会变成负数越降越低
              why: 电流正往电容正极板灌入电荷，电容电压从 0 V 单调平滑爬升逼近电源 5 V
          explain: |
            结合前置里学过的指数微积分（`M.1.3`），这一课算清电路里最重要的**一阶暂态响应**与**时间常数 $\tau$**，并用 `ngspice` 实际跑一遍验证。
      - card:
          title: 电容、电感脾气与一阶 RC 充电公式
          body: |
            - **电容（$C$，法拉 F）**：把能量存在电场里，$i_C = C \frac{dv_C}{dt}$——**电容两端电压不能瞬间突变**（充电像水池慢慢蓄水）；
            - **电感（$L$，亨利 H）**：靠磁场阻碍变化，$v_L = L \frac{di_L}{dt}$——**流过电感的电流不能瞬间突变**；
            - **时间常数（Time Constant）**：对串联 RC 电路 **$\tau = R C$**（对 RL 电路 $\tau = L / R$）。从 `0 V` 经 $R$ 充向电源 $V_s$ 的电容电压：
              $$v_C(t) = V_s \left(1 - e^{-t / \tau}\right)$$
          reveal:
            - title: 必须背熟的三个整数倍 $\tau$ 经验刻度（及 `ngspice` 实测值）
              body: |
                以 RC 电路（$R = 10\text{ k}\Omega, C = 10\ \mu\text{F} \implies \tau = 10^4 \times 10^{-5} = 0.1\text{ s}$）充向 `5 V` 为例（下组数字已经 `ngspice` `.tran` 仿真精确核对）：
                - 刚经过 $1\tau$（$t = 0.1\text{ s}$）：$1 - e^{-1} \approx 63.2\%$ → $v_C = 5 \times 0.6321 \approx \mathbf{3.16\text{ V}}$；
                - 经过 $3\tau$（$t = 0.3\text{ s}$）：$1 - e^{-3} \approx 95.02\%$ → $v_C \approx \mathbf{4.75\text{ V}}$（工程上常把 `3τ` 看作基本冲到 95% 稳态，而 `5τ` 则达 99.3%）。
      - card:
          title: 一阶放电与**电感**电路时间常数对比
          body: |
            - **撤掉电源后的 RC 自由放电**：初值 $V_0$ 经电阻泄放，$v_C(t) = V_0 e^{-t/\tau}$：经过 $1\tau$ 跌到只剩最初的 `36.8%`（$e^{-1}$），`3τ` 时只剩 `5%`；
            - **RL 回路时间常数 $\tau = L / R$**：同样按 $1 - e^{-t/\tau}$ 规律建立稳定电流——串联电阻 **$R$ 越大，电感能量耗散越快、$\tau = L / R$ 反而越短**（注意跟 RC 的 $\tau = RC$ 恰成反比）。
      - item:
          id: rc-tau-ms
          type: number
          prompt: |
            一个单时间常数 RC 电路由电阻 $R = 2\text{ k}\Omega$ 串联电容 $C = 10\ \mu\text{F}$ 组成。它的**时间常数** $\tau = R C$ 是多少毫秒（ms，填整数）？
          answer: 20
          hint: '记住微法拉（$10^{-6}$）配千欧（$10^3$）的量级口诀：两者相乘结果直接对应毫秒（ms）。'
          explain: |
            $2\times 10^3\ \Omega \times 10\times 10^{-6}\text{ F} = 0.02\text{ s} = 20\text{ ms}$。
      - item:
          id: rc-tau-c4-sec
          type: number
          prompt: |
            RC 电路 $R = 10\text{ k}\Omega$、$C = 10\ \mu\text{F}$。它的**时间常数** $\tau = R C$ 是多少秒（s，填小数）？
          answer: 0.1
          hint: '把千欧换成 $10^3\ \Omega$、微法换成 $10^{-6}\text{ F}$，再把两者相乘。'
          explain: |
            $\tau = 10^4\ \Omega \times 10 \times 10^{-6}\text{ F} = 10^4 \times 10^{-5} = 0.1\text{ s}$。
      - item:
          id: rc-charge-1tau-c4
          type: number
          prompt: |
            RC 电路 $R = 10\text{ k}\Omega$、$C = 10\ \mu\text{F}$，初始电容电压 `0 V`，从 $t=0$ 开始接通 `5 V` 直流电源充电（$\tau = RC = 0.1\text{ s}$）。请问在 **$t = 0.1\text{ s}$（恰过 1 个时间常数）**时电容电压大约是多少伏（保留两位小数）？
          answer: 3.16
          tolerance: 0.02
          hint: '回忆每经过整整 1 个时间常数 $1\tau$，电容会从起点冲过距离稳态总差值的约百分之六十三多一点（$1 - e^{-1}$）。'
          explain: |
            `5 × 0.6321 ≈ 3.16 V`（已由 WSL `ngspice` `.tran` 仿真 `.measure at100` 核对无误）。
      - item:
          id: rc-charge-3tau-c4
          type: number
          prompt: |
            同一条 RC 电路（$R = 10\text{ k}\Omega$、$C = 10\ \mu\text{F}$，时间常数 $\tau = 0.1\text{ s}$，接 `5 V` 电源从 `0 V` 充电）：在 **$t = 0.3\text{ s}$（过了 3 个时间常数）**时，电容电压大约升到了多少伏（保留两位小数）？
          answer: 4.75
          tolerance: 0.02
          hint: '工程速记口诀：充放经过整整 3 个时间常数 $3\tau$ 时，大约完成全部爬升落差的 $95\%$（$1 - e^{-3}$）。'
          explain: |
            $5 \times (1 - e^{-3}) \approx 4.75\text{ V}$（`ngspice` `.measure at300` 实测 `4.751 V`）。
      - item:
          id: rl-tau-ms
          type: number
          prompt: |
            一只**电感** $L = 20\text{ mH}$（毫亨）与电阻 $R = 10\ \Omega$ 串联构成一阶 RL 回路。它的时间常数 $\tau = L / R$ 是多少毫秒（ms）？
          answer: 2
          hint: 'RL 一阶时间常数满足 $\tau = L / R$，注意毫亨（$10^{-3}$）直接除以欧姆恰得毫秒。'
          explain: |
            $\tau = 0.02\text{ H} / 10\ \Omega = 0.002\text{ s} = 2\text{ ms}$。

  # ==== 放大器 ====
  - id: gain
    chapter: 放大器
    title: 模拟信号、放大器电压增益与受控源端口模型
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            麦克风拾取人说话声波产生的电压只有微弱的 `10 mV`（0.01 V），直接送给只认伏特级别信号的芯片根本分辨不出。要想把这 `10 mV` 小波浪精准撑大成波动 `500 mV` 却**不把本来说话的嗓音波形捏扁变调**，电子放大器要做的核心算术变换是什么？
          options:
            - text: 输出波形与输入一致，只把幅度按固定倍数乘大（这里 ×50）
              correct: true
            - text: 输出是一条不变的 5 V 直流线，没有波形
              why: 一条平直的电线不再携带声音随时间变化的信息
            - text: 把男声的频率整体提高十倍
              why: 理想线性放大器只放大信号幅度（乘以固定倍数增益），绝不额外制造原信号里没有的频率分量
          explain: |
            把微弱信号按忠实比例放大的积木叫**放大器**，它的核心本事就是**线性增益**和端口**受控源模型**。
      - card:
          title: 放大器电压**增益**与输入/输出端口模型
          body: |
            - **电压增益（Voltage Gain, $A_v$）**：理想线性电压放大器输出 $v_o = A_v \cdot v_i$（例如输入峰峰值 `0.2 V` 放大到 `1 V`，电压增益 $A_v = 1 / 0.2 = 5$）。工程上也常用分贝表示：$A_{dB} = 20\log_{10}|A_v|$（20 dB 即 10 倍电压，40 dB 即 100 倍）；
            - **电压放大器三要素模型**：左侧用一个**输入电阻 $R_{in}$** 迎合前级信号源，右侧用一根**受控电压源 $A_{vo} \cdot v_{in}$** 串联**输出内阻 $R_{out}$** 驱动后级负载。
          reveal:
            - title: 为什么理想电压放大器追求“$R_{in}$ 极大、$R_{out}$ 极小”？
              body: |
                因为前级传感器自己带内阻 $R_s$：放大器输入电阻 $R_{in}$ 越大，分压比 $\frac{R_{in}}{R_s + R_{in}}$ 越接近 `1`（没把前级信号吸塌）；同理右侧输出内阻 $R_{out}$ 越小，带各种负载 $R_L$ 时分压 $\frac{R_L}{R_{out} + R_L}$ 越不跌落。反之电流放大器恰追求低 $R_{in}$、高 $R_{out}$。
      - item:
          id: amp-gain-calc
          type: number
          prompt: |
            某放大电路输入正弦小信号幅度为 `0.2 V` 时，空载输出端稳定量得幅度为 `1.0 V`。该放大器的电压**增益** $A_v = v_o / v_i$ 是多少倍？
          answer: 5
          hint: '电压增益定义为输出幅度比输入幅度（两者单位一致直接相除即可）。'
          explain: |
            $A_v = 1.0 / 0.2 = 5$ 倍（换算成分贝约 $20\log_{10} 5 \approx 14\text{ dB}$）。
      - item:
          id: cascade-gain-calc
          type: number
          prompt: |
            将两级理想无加载失真的电压放大器前后串级联起来：第一级增益 $A_1 = -4$（负号代表波形倒相翻转），第二级增益 $A_2 = -3$。合在一起的总电压增益是多少倍？
          answer: 12
          hint: '理想级联放大倍数是两级各自倍数相乘，留意两次倒相负负得正。'
          explain: |
            负负得正。两级各倒相一次总计倒回同相，总电压增益 $(-4) \times (-3) = +12$ 倍。
      - item:
          id: ideal-vamp-port
          type: choice
          prompt: |
            用电压放大器采集一只自带高内阻（例如 `100 kΩ`）的脆弱压电传感器微弱电压信号，放大器自己的输入电阻 $R_{in}$ 和输出内阻 $R_{out}$ 最理想分别倾向哪一侧？
          options:
            - text: $R_{in}$ 越大越好，$R_{out}$ 越小越好
              correct: true
            - text: 输入电阻 $R_{in}$ 取 `0 Ω`，把传感器两端直接短路
              why: 若 $R_{in} \ll 100\text{ k}\Omega$，传感器发出的电压几乎全部掉在自己的内阻里，传进放大器只剩零头。
            - text: 输出电阻 $R_{out}$ 必须达到几亿欧姆
              why: 极大的输出电阻一旦接上普通负载就会形成严重分压掉落
          explain: |
            高输入阻抗不吃前级电流，低输出阻抗强驱动后级——优秀电压放大器永远遵守这条口诀。
      - item:
          id: gain-db-choice
          type: choice
          prompt: |
            某音频前级放大器手册标称电压增益为 `40 dB`。按照电压分贝公式 $A_{dB} = 20\log_{10}|A_v|$，它对应的线性电压放大倍数是多少倍？
          options:
            - text: '`100` 倍'
              correct: true
            - text: '`40` 倍，分贝数就是放大倍数'
              why: 分贝是对数刻度：`20 dB = 10` 倍，`40 dB = 10² = 100` 倍，`60 dB = 1000` 倍
            - text: '`2` 倍，40 除以 20'
              why: 电压放大 2 倍约等于 `6 dB`（因为 $20\log_{10} 2 \approx 6.02\text{ dB}$）
          explain: |
            每多 `+20 dB` 电压放大倍数恰好再乘以 `10`，这是模拟工程师看曲线心算的看家本领。

  - id: transistor-amp
    chapter: 放大器
    title: 差分对放大器、小信号模型与多级级联结构
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            实际电子元件 MOS 管或三极管，电流和输入电压的关系是一条弯曲的二次方或指数曲线（不是直线）。那工程师怎样用这种非线性元件放大微弱正弦信号，而不把波形扭曲？
          options:
            - text: 先定好直流工作点，输入幅度足够小时，附近曲线近似为直线
              correct: true
            - text: 把芯片温度降下来，弯曲的指数曲线就会自己变成直线
              why: 晶体管物理规律本质非线性，线性放大是“直流静态偏置 + 微小幅度切线线性化”得到的工程近似
            - text: 把输入信号先整形成 100 V 的高压方波，再用这个方波驱动晶体管
              why: 输入幅度过大就会明显撞上曲线弯曲乃至截止饱和削波，必须保证小信号条件。
          explain: |
            用静态直流先撑住架子、再用交流微小偏移做“切线近似”算放大，这就是模拟电路灵魂工具——**微变小信号分析法**。
      - card:
          title: '小信号模型、MOS/BJT 差分对与有源负载'
          body: |
            - **小信号模型**：① 先算直流静态偏置工作点（确定管子处于放大区及跨导 $g_m = \frac{\partial I_D}{\partial V_{GS}}$）；② 再对电路做微小变化线性化（直流电源接地交流视零，用 $g_m v_{gs}$ 受控流源替换晶体管）；③ 算出纯小信号放大倍数 $A_v \approx -g_m R_L$。
            - **MOS 与 BJT 差分对**：把两只完全对称的管子共用同一个底部恒流尾巴接在一起——专放大两路之**差模输入（$v_1 - v_2$）**，强力抑制两侧一起遭遇的电源噪声或工频抖动（**共模抑制**）。配合**有源负载（电流镜替换普通大电阻）**可在极小硅片面积里直接换来极高单级增益。
          reveal:
            - title: BJT 差分对与 MOS 差分对的核心取舍以及多级放大器
              body: |
                - **BJT 管**靠基极电流、指数跨导很高但需吃微小基极偏置电流；**MOS 管**栅极绝缘几乎不取直流电流、更适合芯片高密度集成；
                - **多级放大器**：当单级放大增益或输出驱动力仍不够时，常用“差分输入级（抗干扰） → 高增益放大级 → 低内阻输出跟随级（强驱动负载）”三级接力拼出完整通用运放。
      - item:
          id: small-signal-gm-gain
          type: number
          prompt: |
            某 MOSFET 共源极小信号等效电路中，工作点跨导 $g_m = 2\text{ mA/V}$，漏极接等效有源负载电阻 $R_L = 5\text{ k}\Omega$（忽略沟道长度调制）。它的电压增益 $A_v = -g_m R_L$ 是多少（填整数，含负号）？
          answer: -10
          hint: '将跨导（毫安/伏特）与等效负载电阻（千欧）相乘并注意毫与千抵消、反相带负号。'
          explain: |
            $A_v = -(2\times 10^{-3}) \times (5\times 10^3) = -10$，负号表示输入电压微小抬高时输出电压向下降。
      - item:
          id: diff-pair-common-mode
          type: choice
          prompt: |
            把麦克风两根对称引线接进一块**差分对**放大器两个输入端。附近电机同时在两根引线上感应出了完全一样幅度、同起同落的 `50 Hz` 电源杂波（$v_{noise,1} = v_{noise,2}$），而有用微弱语音恰好一正一负差分进入。理想差分对会怎样对待这股共模杂波？
          options:
            - text: 两者差值为 0，共模干扰被抵消，只剩差分语音
              correct: true
            - text: 把两边一模一样的共模干扰再放大一万倍，把语音盖住
              why: 差分对专为“放大差模 $(v_+ - v_-)$、强烈抑制共模 $(v_+ + v_-)/2$”而生
            - text: 只放大左边那根线上的干扰，同时把声音全部静音
              why: 对称物理结构决定了对共模信号响应极弱
          explain: |
            这就是为什么现代微弱传感器、CAN 总线和所有运放入口第一级清一色使用差分对的原因。
      - item:
          id: active-load-why
          type: choice
          prompt: |
            在集成电路芯片里给差分对加装“**有源负载**（用晶体管电流镜替代几百万欧姆巨大无源物理电阻）”，核心好处是？
          options:
            - text: 小面积、低电压下就能得到很大的等效交流负载电阻和单级增益
              correct: true
            - text: 因为无源大电阻在芯片里完全不占面积，只是为了增加静态功耗才改用有源负载
              why: 恰恰相反，芯片上造几百千欧以上的电阻要占用很大的硅片面积，还会产生很大的直流压降，把晶体管挤出放大区
            - text: 有源负载不需要设置直流工作点
              why: 有源负载本质就是提供偏置电流并呈现高交流输出内阻的晶体管电流镜，依然依赖稳定的直流静态工作点
          explain: |
            片上省面积、等效交流电阻高，是 IC 放大器提高单级增益的常用做法。
      - item:
          id: amp-terms-match
          type: match
          prompt: |
            将晶体管放大器的几个核心工程结构对号入座。
          pairs:
            - ["**小信号模型**", "固定直流 Q 点后做微变切线线性等效，用来计算增益和阻抗"]
            - ["MOS / BJT 差分对", "对称双管共尾电流源，专门放大两端之差并强力抑制共模噪声"]
            - ["有源负载（电流镜）", "用晶体管高交流电阻替代巨大物理电阻以省面积、拉高增益"]
            - ["多级级联放大器", "输入差分抗扰、中间级拉高总倍数、末级缓冲拉低输出内阻"]
          explain: |
            合起来再封装进精密芯片里，正是构建现代信号调理与通用运算放大器的内部核心结构。

  # ==== 运放 ====
  - id: feedback
    chapter: 运放
    title: 理想运放“虚短/虚断”、反相与同相放大及微积分器
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            手里这颗叫“**运算放大器（Op Amp）**”的芯片，本身开环电压增益可达 `100,000 倍` 以上。可我只想精准稳定地做个不多不少正好 `10 倍` 的传感器放大器，而且还要求管子换批次、室温变热时放大倍数依然精准稳死在 10 倍。怎么办？
          options:
            - text: 把输出经电阻接回反相输入端（负反馈），增益只由外接电阻比值决定
              correct: true
            - text: 不接反馈，先把输入衰减一万倍，开环也能稳定在 10 倍
              why: 开环增益随温度和器件批次剧烈漂移，且输入端哪怕有 1 毫伏失调电压乘上十万倍也会立刻撞死在电源上下轨里饱和。
            - text: 把输出直接连回同相输入端（正反馈）来稳定放大倍数
              why: 正反馈会把微弱偏差越推越大直至撞上供电轨饱和或自激振荡，稳定线性放大必须引回反相端构成**负反馈**。
          explain: |
            负反馈把输出接回反相输入端，巨大的开环增益会把两个输入端的电压压到几乎相等，放大倍数就只由两只外接电阻的比值决定，换管子、温度变了也不受影响。这一课用**虚短（$v_+ \approx v_-$）**与**虚断（$i_+ = i_- \approx 0$）**两条规则，算出反相、同相、差分放大器的增益。
      - card:
          title: 理想**运算放大器**与“虚短 / 虚断”两条金科玉律
          body: |
            只要把一颗 **运算放大器** 芯片接成**深度负反馈**（输出端通过网络回连到**反相输入端 `−`**）并在线性区稳态工作，理想模型遵守两条分析法则：
            1. **虚短（Virtual Short）**：因为开环增益 $A \to \infty$，要让有限输出 $v_o = A(v_+ - v_-)$ 不撞墙饱和，两输入端压差必趋近零——**$v_- \approx v_+$**（看似短接在一起电位相等，实则并未用导线焊死）；
            2. **虚断（Virtual Open）**：理想输入阻抗无穷大——**流入两输入引脚的电流几乎为零（$i_+ = i_- \approx 0$）**（看似断路不吃任何电流）。
          reveal:
            - title: 三步手推反相放大 $A = -R_f / R_{in}$ 与同相放大 $A = 1 + R_f / R_{in}$
              body: |
                - **反相组态**：正端 `v_+ = 0 V` 接地 → 虚短得负端 $v_- = 0\text{ V}$（**虚地**）；输入电流 $i = v_{in}/R_{in}$ 由虚断不能钻进运放脚，只好全转弯流过反馈电阻 $R_f$，于是 $v_o = 0 - i\cdot R_f = -\frac{R_f}{R_{in}} v_{in}$。
                - **同相组态**：输入 $v_{in}$ 接正端 → 虚短使负端 $v_- = v_{in}$；$R_f$ 与下拉接地电阻 $R_{in}$ 构成分压 $v_- = v_o \frac{R_{in}}{R_{in} + R_f}$，移项即得 $v_o = \left(1 + \frac{R_f}{R_{in}}\right) v_{in}$。
      - card:
          title: 差分减法器与积分器 / 微分器
          body: |
            - **差分放大器**：把四只电阻对称搭在正负两端，$v_o = \frac{R_f}{R_{in}}(v_2 - v_1)$，专用来测微弱桥式传感器（如电子秤应变片）两端压差；
            - **运放积分器与微分器**：把反相放大电路的反馈电阻 $R_f$ 换成电容 $C$，输入流进电流 $v_{in}/R$ 全部给电容充电，$v_o(t) = -\frac{1}{RC}\int v_{in}(t)\,dt$（做出实时模拟积分器。反过来把电容放到输入端就得到微分器）。
      - item:
          id: opamp-inverting-c4
          type: number
          prompt: |
            使用理想**运算放大器**搭建**反相放大器**，反馈电阻 $R_f = 100\text{ k}\Omega$、输入电阻 $R_{in} = 10\text{ k}\Omega$。它的闭环电压增益 $A_v = v_o / v_{in}$ 是多少（注意正负号）？
          answer: -10
          hint: '反相放大闭环增益公式：$A = -R_f / R_{in}$。'
          explain: |
            $A = -100\text{ k}\Omega / 10\text{ k}\Omega = -10$；输入正电压会放大 10 倍变成反相负输出。
      - item:
          id: opamp-noninv-c4
          type: number
          prompt: |
            使用理想运算放大器与两只外接电阻（反馈电阻 $R_f = 100\text{ k}\Omega$、反相端接地分压电阻 $R_{in} = 10\text{ k}\Omega$）搭成标准**同相放大器**（输入信号接 `+` 同相端）。此时闭环电压增益是多少？
          answer: 11
          hint: '同相放大器分压公式推出闭环增益：$A = 1 + R_f / R_{in}$。'
          explain: |
            $A = 1 + 100 / 10 = 11$，同相放大不会倒相且输入信号直入运放 `+` 脚获得极高输入阻抗。
      - item:
          id: virtual-short-open-choice
          type: choice
          prompt: |
            关于负反馈理想运放分析中的“**虚短**”与“**虚断**”含义，以下哪项解释完全准确？
          options:
            - text: 虚短：两输入端电压近似相等；虚断：输入端不取电流
              correct: true
            - text: 虚短就是在电路板上用一根铜丝把正负两个输入引脚焊死短接
              why: 绝不能物理焊死短路。压差逼近零是负反馈通过输出自动调节出来的平衡状态
            - text: 虚断表示运放输出端没有任何电流流出，所以负载上得不到功率
              why: “虚断”仅指同相与反相两个**输入端**输入阻抗极高、几乎不取电流，而运放**输出端**完全可以正常向负载和反馈网络提供电流。
          explain: |
            记住这两个“看似……实则……”的精妙词：电压看似相等却没物理连线，电流看似为零却靠压差感知全回路。
      - item:
          id: opamp-follower-gain
          type: number
          prompt: |
            利用同相放大器结构，如果把反馈电阻直接短路 ($R_f = 0\ \Omega$)、把对地电阻开路 ($R_{in} = \infty$)，就得到了著名的“单位增益电压跟随器”（$v_o = v_{in}$，极高输入电阻接极低输出内阻的强力缓冲隔离器）。此时同相闭环放大倍数是多少？
          answer: 1
          hint: '输出直接全量拉回负端 `−`，由虚短 $v_- = v_+$ 且 $v_- = v_o$，看 $v_o$ 等于多少倍 $v_{in}$。'
          explain: |
            $A = 1 + 0/\infty = 1$。电压一模一样拷贝过去，却能替脆弱高阻传感器扛住沉重的后级负载。

  - id: real-op-amp
    chapter: 运放
    title: 真实运放非理想性：有限增益带宽积、压摆率与直流失调
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一颗标称“单位增益带宽积 GBW = 10 MHz”的通用运放芯片，当搭成 `1 倍` 电压跟随器时能放大 `10 MHz` 的正弦波；可今天把它接成了 `100 倍` 放大电路后，刚放到 `200 kHz` 信号就已经明显大幅缩水衰减了。这合理吗？
          options:
            - text: 合理，增益乘带宽是常数，100 倍时只剩 1/100
              correct: true
            - text: 芯片坏了。数据手册上的 GBW 就是能处理的最高频率，与增益无关
              why: 内部级间补偿电容与两级运放极点决定开环增益随频率升高按 -20 dB/十倍频往下掉
            - text: 放大倍数越大，带宽会自动按同样倍数一起变大
              why: 增益与带宽在固定 GBW 运放里是一对反比“跷跷板”权衡。
          explain: |
            理想运放很美好，工程踩坑全靠懂这课讲的三大**非理想边界**。
      - card:
          title: 有限开环增益、增益带宽积（GBW）与两级/折叠 CMOS 运放
          body: |
            - **两级 CMOS 运放与折叠共源共栅**：真实集成运放常采用“差分输入级 + 共源极高增益级（配密勒电容补偿防自激振荡）”或“折叠共源共栅（Folded-Cascode）”提高单级增益并拉宽共模工作范围；
            - **增益带宽积（GBW）**：开环增益在低频虽高（如 $10^5$），但随频率升高稳步滚降，遵循核心估算关系：
              $$\text{闭环增益 } |A_{cl}| \times \text{闭环 -3 dB 带宽 } f_{bw} \approx \text{GBW}$$
              （例如 `GBW = 10 MHz` 接 `10 倍` 放大，可用带宽只剩 `1 MHz`。想让高频信号也放大，必须改选更高 GBW 运放或拆成两级低倍串联）。
          reveal:
            - title: 为什么芯片设计师要故意靠内部密勒电容让增益随频率下降？
              body: |
                多级放大器每一级都会拖慢信号相位，高频时负反馈相位滞后若达到 `180°` 就会反转成正反馈，直接让运放自激振荡。加一只微小内部**密勒补偿电容**刻意先造出一个低频主极点压低高频增益，保证在相位反转前放大倍数已稳稳跌破 `1 倍`，才能确保你搭什么倍数的负反馈电路都安安静静。
      - card:
          title: 大信号压摆率（Slew Rate）、供电轨饱和与直流失调
          body: |
            - **压摆率（SR，V/μs）与输出摆幅饱和**：即使频率没超 GBW，只要输出正弦波幅度和频率乘积要求的斜率太陡（$2\pi f V_p > SR$），运放内部充电电流供不上就会把漂亮正弦削成**三角斜坡波**；若需求输出超出正负供电电源轨（如 ±5 V），输出波形同样被硬生生削平（饱和削波）。
            - **直流非理想性**：真实器件对称配对做不到完全一致，导致零输入时也自带微弱**输入失调电压（$V_{OS}$）**和微量**输入偏置电流（$I_B$）**，乘以高闭环增益后在输出端叠出一个讨厌的直流偏置误差。
      - item:
          id: gbw-bw-calc
          type: number
          prompt: |
            查手册一颗运放的增益带宽积 `GBW = 10 MHz`。用它搭一个闭环电压放大倍数为 `20 倍`（同相放大）的采集前端电路，理论上大致还能保持的可用闭环带宽是多少兆赫（MHz，填小数）？
          answer: 0.5
          hint: '利用单极点固定增益带宽积权衡：$f_{bw} \approx \text{GBW} / |A_{cl}|$。'
          explain: |
            $10\text{ MHz} / 20 = 0.5\text{ MHz}$（500 kHz）；再往高频去就会明显出现增益下跌与相移失真。
      - item:
          id: slew-rate-trap
          type: choice
          prompt: |
            一台音频运放接了 `±15 V` 供电、仅搭成 `1 倍` 电压跟随器，在小幅度（`0.1 V`）下能正常输出 `500 kHz` 正弦波；可一旦把输入正弦电压抬高到 `10 V`（频率仍不变 `500 kHz`），示波器上突然看到输出正弦变成了扭曲歪斜的“三角波”。最可能的真凶是？
          options:
            - text: 正弦波所需最大斜率 $2\pi f V_p$ 超过压摆率上限
              correct: true
            - text: 虚短和虚断在大信号下不再成立
              why: 虚短虚断说的是输入端的线性工作条件，与输出斜率上限无关；三角波是斜率不够造成的。
            - text: '`±15 V` 电源供电不够 10 V 的峰值输出，被电源轨削波'
              why: 10 V 峰值尚小于 15 V 供电轨，而且撞电源轨削出的应该是平顶梯形削波，不是三角斜坡。
          explain: |
            GBW 管小信号频率上限，**Slew Rate（压摆率）管大信号电压高速爬升上限**；验算 $2\pi \times 500\text{ kHz} \times 10\text{ V} \approx 31.4\text{ V/}\mu\text{s}$，普通慢运放（如 LM358 才 `0.3 V/μs`）必成三角波。
      - item:
          id: dc-offset-why
          type: choice
          prompt: |
            把一个直流精密运放的两个输入脚同时老老实实短路连到 `0 V` 地线上，可接了 `100 倍` 直流放大后，万用表量输出端居然测到 `+0.2 V` 而非严格 `0.000 V`。造成这一现象最直接的器件缺陷是？
          options:
            - text: 差分对管有几毫伏失配，$V_{OS}$ 被放大 100 倍
              correct: true
            - text: 压摆率太小，直流信号在输出端产生了 0.2 V 的爬升延迟
              why: 压摆率只限制高频大幅度快速变化信号的最大斜率，0 V 恒定直流输入下的 `+0.2 V` 固定偏差来自内部毫伏级 $V_{OS}$（如 `2 mV × 100 = 0.2 V`）
            - text: GBW 不够高，直流增益超过了 100 倍
              why: GBW 限制的是高频带宽上限，零输入下的直流输出偏移是由输入失调电压 $V_{OS}$ 和偏置电流引起的
          explain: |
            精密微伏直流放大（如热电偶、秤重传感器）必须专门挑低 $V_{OS}$ 与低偏置电流 $I_B$ 运放。
      - item:
          id: rail-saturation-num
          type: number
          prompt: |
            一颗运放仅用单电源 `+5 V` 与 `0 V` 供电（理想轨到轨输出范围就是 `0 V ~ +5 V`），接成 `10 倍` 同相直流放大器。若此时往同相输入端喂入 `0.8 V` 直流电压，实际输出端最高会被钳制死在多少伏？
          answer: 5
          hint: '先按理想同相放大倍数算出目标预期电压，再检查该目标有没有越过供电电源轨最高上限。'
          explain: |
            运放输出绝不可能高过自己的供电电源轨——理想想出 `8 V` 会一头撞在 `+5 V` 供电轨上进入饱和削波。

  # ==== 滤波 ====
  - id: lowpass
    chapter: 滤波
    title: 频谱观点、一阶 RC 低通滤波器与 -3 dB 截止频率计算
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            把一只 `10 kΩ` 电阻与 `10 μF` 电容串联组成 RC 回路（时间常数需要好几百毫秒才能慢吞吞充放一次电）。如果往它输入端喂进一根**每秒来回晃动 1000 次（1 kHz）的高频抖动杂波**，跨在电容两端的输出电压来得及跟着每毫秒上蹿下跳吗？
          options:
            - text: 来不及。电容充放电跟不上这么快的变化，高频被滤掉
              correct: true
            - text: 来得及。频率越高容抗越小，高频反而更容易通过
              why: 电容容抗 $X_C = \frac{1}{2\pi f C}$ 随频率 $f$ 升高而急剧变小，就像高频对地开了一道泄放捷径。
            - text: 只把偶数赫兹的信号挡住，放行奇数赫兹
              why: RC 分压频率响应是连续平滑按截止频率向高频滚降衰减的
          explain: |
            时间域里的“充得慢”，换到**频率域（频谱观点）**里就是“挡住高频、放行低频”。这一课把**信号频谱**与一阶**低通滤波器截止频率**联系起来。
      - card:
          title: 信号频谱、容抗分压与 -3 dB 截止频率公式
          body: |
            任何随时间起伏的复杂信号（比如夹杂高频电网嘶嘶声的温度传感器曲线），在**频谱图**上都能拆成“慢变化低频有用信号 + 快抖动高频噪声”的叠加。
            把电容 $C$ 并接输出到地、电阻 $R$ 串在输入通道构成最经典的一阶 RC **低通滤波器**：
            - 电容对正弦波的“等效交流阻碍”是**容抗** $X_C = \frac{1}{2\pi f C}$：低频时容抗极大，电压几乎原封不动留给输出；高频时容抗极小，噪声顺着电容被短路泄放到地。
            - 功率降半（电压幅度跌落至原值约 $1/\sqrt{2} \approx 70.7\%$，即 **-3 dB 带宽门槛**）的**截止频率**：
              $$f_c = \frac{1}{2\pi R C}$$
          reveal:
            - title: 代入一组 RC 数据算截止频率并分类
              body: |
                取 $R = 10\text{ k}\Omega, C = 10\ \mu\text{F} \implies \tau = RC = 0.1\text{ s}$：
                $$f_c = \frac{1}{2\pi \times 0.1} \approx \mathbf{1.59\text{ Hz}}$$
                高于 `1.59 Hz` 后输出电压幅度每升高十倍频按 **`-20 dB/十倍频`** 滚降。另外顺便对比按频响划分的三大家族：① **低通（放低阻高）**、② **高通（把电阻和电容对调：阻低频直流、放高频）**、③ **带通（只放中间一段特定频段）**。
      - item:
          id: rc-cutoff-c4
          type: number
          prompt: |
            将 $R = 10\text{ k}\Omega$、$C = 10\ \mu\text{F}$ 的一阶 RC 电路（已知 $\tau = RC = 0.1\text{ s}$）当作无源**低通滤波器**使用（输入接电阻、从电容两端取输出）。它的 `-3 dB` 截止频率 $f_c = \frac{1}{2\pi R C}$ 是多少赫兹（Hz，保留两位小数）？
          answer: 1.59
          tolerance: 0.02
          hint: '套用一阶 RC 截止频率公式 $f_c = \frac{1}{2\pi \tau}$，留意 $\pi \approx 3.1416$。'
          explain: |
            $f_c = \frac{1}{2\pi \times 0.1} \approx 1.5915\text{ Hz}$（约 `1.59 Hz`）；频率远高于几赫兹的 `50 Hz` 工频市电干扰会被大幅压制。
      - item:
          id: minus-3db-ratio
          type: choice
          prompt: |
            在定义滤波器与放大器**带宽**时，常把输出电压幅值跌落到最大通过值约 `70.7%`（即 $1/\sqrt{2}$）的频率点称为截止频率 $f_c$（也叫 **`-3 dB` 带宽点**）。为什么恰好选 `70.7%` 这个略带零头的比例？
          options:
            - text: 降到 $1/\sqrt{2}$ 时功率正好减半
              correct: true
            - text: 半功率点就是电压减半，取 0.5 倍
              why: 功率与电压是平方关系，电压减半只剩四分之一的功率，即 -6 dB
            - text: 因为超过截止频率以后输出电压必须在 0 赫兹处立刻归零到 0.0000 V
              why: 真实滤波器只能逐渐斜坡衰减（一阶每十倍频掉 20 dB），不会像理想直角砖墙一样一刀切死
          explain: |
            半功率点 = $0.707$ 倍电压幅度 = `-3 dB` 带宽门槛，全工程界通用约定。
      - item:
          id: highpass-swap-rc
          type: choice
          prompt: |
            若把经典一阶无源 RC 低通滤波器里的 **电阻 $R$ 和电容 $C$ 调换位置**（让信号先穿过串联电容 $C$，再从并联到地的电阻 $R$ 两端取输出），这个电路摇身一变成了什么滤波器？
          options:
            - text: '高通滤波器（挡住直流和极低频，让高频通过）'
              correct: true
            - text: 依然是低通滤波器，电阻和电容交换位置不改变频率特性
              why: 直流电根本穿不过串联中间那道电容绝缘隙，$0\text{ Hz}$ 直流在输出端完全被拦死成 `0 V`。
            - text: 变成在所有频率下输出电压都恒定减半、与频率高低无关的纯分压器
              why: 电容容抗 $X_C = \frac{1}{2\pi f C}$ 随频率改变，只在截止频率 $f_c$ 处功率减半（幅度 70.7%），高频段几乎无衰减通过。
          explain: |
            **电容“通高频、隔直流”**：并接在输出旁路接地就把高频泄走（低通）；串在信号路径中间就把直流和低频挡住（高通）。
      - item:
          id: freq-classes-match
          type: match
          prompt: |
            把按频率响应区分的几类信号滤波/放大概念连线配对。
          pairs:
            - ["信号频谱（Spectrum）", "把随时间变化的复杂波形拆解成不同频率正弦成分的分量分布"]
            - ["**低通滤波器**（Low-Pass）", "放行低频至直流信号，按滚降斜率削弱截止频率 $f_c$ 以上的高频"]
            - ["高通滤波器（High-Pass）", "拦住直流偏置与极低频慢漂移，让超过截止频率的高频信号穿过"]
            - ["带宽（-3 dB Bandwidth）", "增益跌落不超过 -3 dB（功率不低于一半）的有效工作频率区间范围"]
          explain: |
            掌握“RC 在低频和高频下谁容抗大”就能一眼看穿任何一阶无源网络的频率选通方向。

  - id: filter-design
    chapter: 滤波
    title: 滤波器指标、巴特沃斯与切比雪夫权衡及二阶主动实现
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            做精密声学采集仪时要求：`20 kHz` 以内的有用声音几乎丝毫不减，`24 kHz` 以上的杂波要衰减 **60 dB（千倍以下）**。只用 1 只电阻 + 1 只电容凑成的一阶低通滚降太慢，怎么把过渡斜坡拧成一堵更陡峭的防线？
          options:
            - text: 提高阶数，把多级滤波电路级联，高频滚降就能变陡
              correct: true
            - text: 换一根更粗的导线降低电阻，过渡带就会自动变成垂直的砖墙
              why: 导线电阻只影响损耗，不改变 RC 电路的滚降斜率；过渡带要变陡只能提高阶数
            - text: 把多只一阶滤波器并联在一起，各自的衰减就会叠加起来
              why: 并联的几只接在同一对节点上，信号并没有先后经过它们，合起来仍是一阶；要级联（前一级的输出接下一级的输入）衰减才会相乘
          explain: |
            从“一阶慢坡”迈向工业界真正的**二阶/高阶滤波器工程选型**。
      - card:
          title: 滤波器规格、巴特沃斯（Butterworth）vs 切比雪夫（Chebyshev）
          body: |
            工业界按四项指标选型：**通带边界 & 允许波动纹波**、**阻带起始频率 & 最小衰减**，再在两大家族间做核心取舍：
            - **巴特沃斯（Butterworth）**：核心特点是**通带平坦、没有波纹（Maximally Flat）**，代价是同等阶数下过渡带滚降斜坡比较平缓；
            - **切比雪夫（Chebyshev）**：允许在**通带（或阻带）里出现等波纹微小起伏**，作为交换，相同阶数下在刚过截止频率后拥有**无比凶猛陡峭的跌落斜率**。
          reveal:
            - title: 二阶有源滤波器为什么常用“运放双积分环”和“开关电容”替代笨重大电感？
              body: |
                经典二阶 LCR 谐振在低频音频下需要像砖头一样巨大沉重的铁芯电感，且电感很难做进微型硅芯片。于是芯片设计大师用以下办法绕开真电感：
                - **电感等效替代与双积分环拓扑（Two-Integrator-Loop）**：仅靠运放、电阻、电容就能搭出完全等价的二阶谐振与带通/低通传递函数（`Q` 值决定谐振峰尖锐度），再查对器件公差引起的**元件灵敏度**；
                - **开关电容滤波器**：用高速周期开关交替搬运微小电容电荷模拟任意巨大精确等效电阻 $R_{eq} = 1/(f_{clk} C)$——只靠精确晶体时钟频率就能可编程地微调芯片截止频率。
      - item:
          id: filter-order-slope
          type: choice
          prompt: |
            一阶单极点 RC 低通滤波器在远超截止频率的高频处，衰减斜率是 `-20 dB/十倍频`。如果用三阶（3 个等效极点）低通滤波器，其在高频阻带的理论滚降斜率大致变为多陡峭？
          options:
            - text: '`-60 dB/十倍频`（每十倍频再降 60 dB）'
              correct: true
            - text: 改成 `+60 dB/十倍频`，频率每升高十倍，输出电压就放大 60 dB
              why: 极点越多，高频电容短路旁路或积分衰减越剧烈，斜率成倍朝负方向变陡（$-20N\text{ dB/dec}$）
            - text: '`-5 dB/十倍频`，阶数再多也不变'
              why: 阶数 $N$ 直接决定高频远端滚降陡峭度 $-20N\text{ dB/十倍频}$
          explain: |
            1 阶 = `-20 dB/dec`，2 阶 = `-40 dB/dec`，3 阶 = `-60 dB/dec`，高阶滤波器就是这样把阻带压得更低。
      - item:
          id: butterworth-vs-chebyshev
          type: choice
          prompt: |
            现在两套相同都是“4 阶”的有源低通滤波器供选择：你的测量需求**绝不允许有用频段内信号幅度有一丝上下波动（极看重通带极平无纹波）**，稍微放宽过渡斜率可以接受。应该挑选哪种经典近似拓扑？
          options:
            - text: 巴特沃斯（Butterworth）——通带最平坦
              correct: true
            - text: 切比雪夫 I 型（Chebyshev I）——通带有等波纹起伏，边缘更陡
              why: 切比雪夫把代价留在通带（等波纹波动）来换取更猛的边缘滚降；极看重通带平稳时优先选巴特沃斯
            - text: 两种都行，同为 4 阶时通带平坦度一样
              why: 阶数相同不代表响应相同：切比雪夫在通带里有等波纹起伏，巴特沃斯的通带最平
          explain: |
            **要平稳选巴特沃斯，要同阶最陡边缘砍一刀选切比雪夫**，工程权衡永远没有免费午餐。
      - item:
          id: why-active-no-inductor
          type: choice
          prompt: |
            音频电路（比如截止频率 1 kHz 的二阶滤波器）为什么很少直接塞进物理电感去做无源 LCR 谐振，而常改用“运放双积分环”有源拓扑或“开关电容”电路实现？
          options:
            - text: 低频大电感体积大又不便集成，有源电路用运放和小电容就够了
              correct: true
            - text: 无源的电感和电容组合不出二阶响应，只有加了运放才行
              why: 无源 LCR 同样能实现二阶谐振滤波，弃用电感是因为低频大电感物理体积笨重、寄生电阻大且难以集成进半导体芯片
            - text: 有源滤波器和开关电容不用供电就能工作
              why: 有源滤波器内部的运算放大器必须依靠外部电源供电才能工作，优势在于省去笨重电感并易于片上集成与时钟调谐
          explain: |
            这也是几乎每颗音频编解码与混合信号微控制器内部滤波都做成**有源 RC / 开关电容滤波**的原因。
      - item:
          id: filter-family-match
          type: match
          prompt: |
            把几类经典滤波器设计概念与它们各自的特长配对清楚。
          pairs:
            - ["巴特沃斯逼近（Butterworth）", "通带增益高度平坦无起伏纹波，过渡斜坡相对温和"]
            - ["切比雪夫逼近（Chebyshev）", "允许通带等波纹微幅起伏，同阶换来显著更陡峭阻带滚降"]
            - ["双积分环二阶有源滤波", "不用笨重真电感，仅凭运放与电阻电容实现精准二阶谐振"]
            - ["开关电容滤波器（SC Filter）", "靠精确开关时钟频率搬运微电容电荷，可数字调校截止频率"]
          explain: |
            从指标定义 → 近似函数选型 → 片上实现与元件灵敏度验证，这就是模拟滤波完整工业路线。

  # ==== 噪声与ADC/DAC接口 ====
  - id: noise
    chapter: 噪声与ADC/DAC接口
    title: 直流偏移 vs 随机电子噪声与方均根（RMS）叠加
    minutes: 11
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            用高速示波器量一条号称“稳稳输出 `3.0 V` 直流”的电源线，把刻度放大到毫伏级看：发现电压像水面微颤一样一直在 `3.0 V` 上下随机抖动。两股互相独立完全没关系的随机噪声同时混到同一条线上，一个有效值（RMS）`3 mV`，另一个有效值 `4 mV`。合起来总噪声有效值是直接加在一起算 `3 + 4 = 7 mV` 吗？
          options:
            - text: 不是，按功率相加：$\sqrt{9+16}=5$ mV
              correct: true
            - text: 直接相加得 7 mV，因为两股噪声的功率各自独立、不会相互抵消
              why: 只有同一根完全同相相关的信号波形才会直接叠加到 7 mV；独立零均值随机噪声按功率（平方）累加
            - text: 会相互抵消成 1 mV，甚至归零
              why: 独立零均值随机信号互相关为 0，总方差严格等于各自方差之和：$3^2 + 4^2 = 5^2$
          explain: |
            搞懂了“固定直流偏移（可以减掉）”和“不可预测热波动（随机噪声只能控功率/看 **方均根** 与信噪比）”的区别，才能安全接好传感器与 ADC。
      - card:
          title: 偏移误差、随机噪声与**方均根**（RMS）合成规律
          body: |
            - **确定性偏移 / 漂移**：像运放 `V_OS` 或零点偏高 `0.05 V`，每次都在同一边，可软件校准减掉；
            - **随机噪声（Noise）**：芯片电阻内部电子热运动永远产出的随机毛刺，**不可逐时刻预测减掉**，只能用统计均方根幅度 **方均根（RMS）** 衡量它携带的扰动功率。
            - **独立噪声按功率叠加**：两个不相关独立噪声源 $v_{n1,rms}$ 与 $v_{n2,rms}$ 混在一起，总方均根值为：
              $$v_{total,rms} = \sqrt{v_{n1,rms}^2 + v_{n2,rms}^2}$$
          reveal:
            - title: 什么决定噪声能量跑进我们耳朵或芯片的多少？（噪声带宽）
              body: |
                常见热噪声几乎均匀铺满所有极高频率（白噪声）。如果你的放大器和 ADC 前端没接低通滤波器限死带宽，宽广的高频段全会一起把噪音倒进来让 RMS 噪声暴涨——这也是为什么接模数转换器前一定要用窄到刚够用的低通滤波器“把带外噪音挡在门外”。
      - item:
          id: rms-3-4-calc
          type: number
          prompt: |
            前端运放输出带有一股 `3 mV`（RMS）的电路固有本底噪声，紧接着传感器线又混进了另一股互不相关的 `4 mV`（RMS）热噪声。两条互不相关随机噪声合在一起的总有效方均根值 $V_{rms}$ 是多少毫伏（mV）？
          answer: 5
          hint: '互不相关随机噪声按总方均根能量合成：先分别求平方，再相加并开平方根。'
          explain: |
            $\sqrt{3^2 + 4^2} = \sqrt{9 + 16} = 5\text{ mV}$。注意总值由最大的主导噪声决定：若一个 `10 mV` 配一个 `1 mV`，合成才 $\sqrt{101} \approx 10.05\text{ mV}$，想压低总噪声必须先揪住最大那颗降噪。
      - item:
          id: offset-vs-noise-choice
          type: choice
          prompt: |
            标定一套数字电子秤时发现，空盘时读数总是多出固定的 `+50 克`（几乎不跳），同时每次读数还会夹带 `±1 克` 无规律上下随机小乱跳。如果想大幅清除那 `+50 克` 固定偏差，应该怎么办？
          options:
            - text: 做一次去皮校准减掉 `50 克`；`±1 克` 才要滤波或平均
              correct: true
            - text: 50 克属于不可消除的热噪声，任何校准都减不掉
              why: 固定直流偏移可以靠软件归零减去，随机噪声只能靠硬件窄带宽滤波或软件多帧平滑降功率
            - text: 只对 100 次采样求平均，`+50 克` 就会被平均掉
              why: 多次求平均只能抵消均值为零的随机正负波动（把 `±1 克` 压小），而每次都固定偏高 `+50 克` 的直流偏移求 100 次平均依然是 `+50 克`，必须靠去皮校准减掉。
          explain: |
            分清**可校准的系统固定偏置（Offset）**与**只能靠限带和多次平均压低的随机噪声（Noise）**，传感器调理才不会走弯路。
      - item:
          id: noise-bw-trap
          type: choice
          prompt: |
            一只体温计温度变化极慢（有用频谱都在 `1 Hz` 以内），可新人却在前端选了一颗带宽到 `10 MHz` 的运放，而且忘了接低通滤波就直连采样。结果测量读数出现明显毛刺，最可能是因为？
          options:
            - text: 通带太宽，把 10 MHz 以内的白噪声全收了进来
              correct: true
            - text: 因为体温的 1 Hz 慢变化会自行加速到 10 MHz
              why: 有用体温永远只在超低频段，是宽广通道“兜了满框高频杂波”进来污染了慢信号
            - text: 这颗运放传不了低于 10 Hz 的信号，1 Hz 的体温被挡掉了
              why: 直流到 10 MHz 直流耦合运放照样传 1 Hz，毛病在“连高频杂波门户大开全盘收进”
          explain: |
            **带宽开得刚刚够用就好**——多放进十倍频带宽，白噪声方均根就会无端再放大约 $\sqrt{10} \approx 3.16$ 倍。
      - item:
          id: snr-meaning-choice
          type: choice
          prompt: |
            如果有用信号的方均根电压是 `1 V`（RMS），总噪声电压是 `0.01 V`（RMS），常听到的“信号功率比噪声功率（信噪比 SNR）”换算成分贝（dB，即 $20\log_{10}(V_s / V_n)$）大约是多少 dB？
          options:
            - text: '`40 dB`，电压比 100'
              correct: true
            - text: '`2 dB`，电压比 100 取对数'
              why: '$20\log_{10}(1 / 0.01) = 20\log_{10}(100) = 20 \times 2 = 40\text{ dB}$'
            - text: '`0 dB`'
              why: '0 dB 代表信号跟噪声一样大（$V_s = V_n$），早就淹没听不见了'
          explain: |
            信噪比（SNR）越高越好，每升高 `+20 dB` 代表有用信号与噪声的电压拉开 10 倍差距。

  - id: quantize
    chapter: 噪声与ADC/DAC接口
    title: ADC 量化步长 LSB、编码计算、DAC 输出与 6.02N+1.76 dB 信噪比
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            用一把只有 `0 ~ 10 厘米`、上面每隔 `1 厘米` 才画一道刻度的粗糙木尺去量一根连续平滑生长的细木棍。不管真实木棍到底长 `3.21 cm` 还是 `3.79 cm`，只要只准记整刻度格子，读出来的数字一定会和真实连续长度差出半格以内的微小舍入误差。把连续电压放进只有 `1024 个整数刻度格子` 的 10 位数字转换器里，会不会产生完全类似的“台阶舍入误差”？
          options:
            - text: 会。有限个编码格必然带台阶舍入误差，一格是 1 LSB
              correct: true
            - text: 不会。计算机里用 10 位数字码就能装下无穷多位无限小数精度
              why: 10 位编码满打满算一共只有 $2^{10} = 1024$ 个离散整数编码格
            - text: 换用 12 位或更高位数的 ADC 芯片后，舍入误差就完全没有了
              why: 只要位数 $N$ 有限，从连续模拟量跨向离散数字码就天生带有最大半格至一格台阶的误差极限。
          explain: |
            把连续电压归到有限个整数格子里，读数和真实值之间必然差出不到一格的舍入误差，一格就是 1 个 **LSB**。这一课学 **ADC 编码、DAC 复原、LSB 分辨率**，以及理想信噪比上限 `6.02N + 1.76 dB`。
      - card:
          title: 'ADC 分辨率 LSB、编码映射与 DAC'
          body: |
            把 `0 ~ V_ref` 的连续模拟电压均匀切成 $2^N$ 个有限离散台阶的 **量化** 过程，每格最小步距叫 **1 LSB（最低有效位步长）**：
            $$\text{LSB} = \frac{V_{ref}}{2^N}$$
            - **ADC 编出整数码**：对于参考电压 `3.3 V` 的 **10 位 ADC**（$2^{10} = 1024$ 级）：
              1. 最小步长 $\text{LSB} = \frac{3.3\text{ V}}{1024} \approx \mathbf{3.22\text{ mV}}$（约 3.22 毫伏变 1 格）；
              2. 若输入模拟电压 $V_{in} = 1.2\text{ V}$，按常见截断编码 $\lfloor \frac{1.2}{3.3} \times 1024 \rfloor = \lfloor 372.36 \rfloor = \mathbf{372}$；
            - **DAC 恢复电压**：反过来把整数码 $D$ 变回电压，$V_{out} = D \cdot \frac{V_{ref}}{2^N}$（如 8 位 `2.56 V` DAC 给码 `64`，输出 $64 \times \frac{2.56}{256} = 0.64\text{ V}$）。
          reveal:
            - title: 怎么看懂理想 $N$ 位 ADC 信噪比公式 $\text{SNR} \approx 6.02N + 1.76\text{ dB}$？
              body: |
                即使前方硬件一点电路噪声也没有，只要用 $N$ 位去量化满量程正弦波，那最多 $\pm 0.5\text{ LSB}$ 的台阶舍入锯齿就已经等效成了底噪——数学积分证明满幅正弦信号均方功率与均匀量化底噪功率之比恰为：
                $$\text{SNR}_{\text{dB}} \approx 6.02N + 1.76\text{ dB}$$
                **推论**：**每多加 1 位 ADC 分辨率（$N$ 加 1），量化信噪比约提高 `+6 dB`。**（例如 10 位 ADC 理想量化 SNR $= 6.02 \times 10 + 1.76 = 61.96 \approx \mathbf{62\text{ dB}}$）。
            - title: 为什么市面常见精密电压基准芯片偏偏卖 `2.56 V` 或 `4.096 V`？
              body: |
                因为 $2^8 = 256$、$2^{12} = 4096$。拿 `4.096 V` 喂给 12 位转换器时，每一格恰恰好等于整整数 `1.000 mV`（不用在微控制器里做任何复杂小数乘除，直接移位或读毫伏数即可），大幅省算力还免掉浮点舍入误差。
      - item:
          id: adc-lsb-mv-c4
          type: number
          prompt: |
            一颗 **10 位 ADC**，满量程参考电压 $V_{ref} = 3.3\text{ V}$。请问 `1 个 LSB`（最小量化步长）大约对应多少毫伏（mV，保留两位小数）？
          answer: 3.22
          tolerance: 0.02
          hint: '先求出 $N$ 位 ADC 能切出的总刻度格数 $2^N$，再用满量程参考电压（先换算成毫伏 mV）除以该总格数。'
          explain: |
            $3.3\text{ V} / 1024 = 3300\text{ mV} / 1024 \approx 3.2227\text{ mV}$（约 `3.22 mV`）。
      - item:
          id: adc-code-372-c4
          type: number
          prompt: |
            还是这颗 **10 位、3.3 V 参考电压的 ADC**，若某时刻输入脚测得模拟电压为 `1.2 V`，按直接截断 $\lfloor \frac{V_{in}}{V_{ref}} \times 2^{10} \rfloor$ 它输出的数字编码整数是多少？
          answer: 372
          hint: '算出输入电压占满量程参考电压的比值，乘以总格数 $2^{10}$ 后向下取整。'
          explain: |
            $1.2 / 3.3 \times 1024 \approx 372.36$，向下取整编码为 `372`。
      - item:
          id: dac-8bit-vout
          type: number
          prompt: |
            一颗 **8 位 DAC**（$2^8 = 256$ 级），基准参考电压 $V_{ref} = 2.56\text{ V}$，按规则 $V_{out} = D \cdot \frac{V_{ref}}{256}$ 输出。当处理器送入数字码 `D = 64` 时，DAC 引脚输出模拟电压是多少伏（填小数）？
          answer: 0.64
          hint: '先用基准电压除以总格数 $2^N$ 算出单个台阶 LSB 电压，再乘以输入数字码 $D$。'
          explain: |
            $64 \times 0.01\text{ V} = 0.64\text{ V}$（这也解释了工程师为什么特别爱挑 `2.56 V` 或 `4.096 V` 当精密基准电压芯片值——正好和 $2^8 = 256$、$2^{12} = 4096$ 凑出整 `10 mV / 1 mV`）。
      - item:
          id: adc-snr-10bit-c4
          type: number
          prompt: |
            理想 $N$ 位 ADC 的理论最高量化信噪比约为 $\text{SNR} = 6.02N + 1.76\text{ dB}$。算出 **10 位** 理想 ADC 的量化信噪比大约是多少 dB（四舍五入取整）？
          answer: 62
          hint: '套用题目给出的理想量化信噪比估算式，将分辨率位数 $N$ 代入后按整数约等即可。'
          explain: |
            $6.02 \times 10 + 1.76 = 61.96 \approx 62\text{ dB}$；如果换成 12 位 ADC 则跃升到约 `74 dB`。

  - id: alias
    chapter: 噪声与ADC/DAC接口
    title: 奈奎斯特采样定理与抗混叠低通滤波器为何必须摆在采样之前
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            电影里经常看见高速转动的汽车轮辐条，在镜头里看起来却像在倒转。如果 ADC 相机每秒只拍照采样 `100 次（f_s = 100 Hz）`，却来了一个每秒闪 `90 次（90 Hz）` 的高速频闪杂波，照片里数字读出来的波浪看着像多少赫兹的慢信号？
          options:
            - text: 折回成 10 Hz 的假信号，采进数字流后二者再也分不开
              correct: true
            - text: 会变成一条纯净的 0 Hz 直线
              why: 采样点正好落在 90 Hz 波形的不同相位上，连起来画出的是一条与 10 Hz 正弦波无法区分的曲线。
            - text: 数字滤波会自动把 90 Hz 复原并剔除
              why: 采样一旦把高频折叠成跟 10 Hz 一模一样的数字样本序列，信息已不可逆混在一起，只能采样前靠模拟硬件提前拦死。
          explain: |
            每秒采 100 次时，90 Hz 的信号和 10 Hz 的信号采出来的数完全一样，采进去之后就再也分不开。这就是**采样定理与高频折叠（混叠）现象**。
      - card:
          title: 奈奎斯特采样定理与抗混叠模拟低通
          body: |
            - **奈奎斯特采样定理**：想无失真地数字化最高频率为 $f_{max}$ 的信号，采样频率 $f_s$ 必须严格满足 **$f_s > 2 f_{max}$**（$f_s / 2$ 称为**奈奎斯特频率**）。
            - **为什么必须采样前加模拟“抗混叠”低通防线？**：
              任何高于奈奎斯特频率 $f_s / 2$ 的带外信号成分与高频噪声，一旦经 ADC 离散拍照采样，都会产生不可逆的频率 **混叠** 折叠，伪装进 $0 \sim f_s/2$ 有用频带内部（与真实低频数字样本长得丝毫不差，事后用再厉害的数字滤波器也无法区分剥离）。所以**必须在 ADC 引脚采样之前**摆上一道模拟低通滤波防线，先把 $f > f_s/2$ 的成分压扁砍掉。
          reveal:
            - title: 为什么实际工程往往选“$5\sim 10$ 倍以上过采样”，而不卡死在刚好 $2.01 f_{max}$？
              body: |
                因为真实模拟低通滤波器做不到直角陡墙。如果采样率只取 $2.01 f_{max}$，要求滤波器在 $f_{max}$ 到 $1.01 f_{max}$ 这条极窄缝隙里衰减 60 dB，需要十几阶的昂贵电路；而把采样频率提高到 `10 倍`，留出宽裕的过渡带，只用二阶有源低通就能把半采样率以外的成分压下去。
      - item:
          id: nyquist-min-fs
          type: number
          prompt: |
            待采集的振动传感器有用信号最高频率达 `5 kHz`。仅按**奈奎斯特采样定理**的理论极限底线，ADC 每秒采样速率 $f_s$ 严格必须**高于**多少 kHz（填整数，例如严格高于 X kHz 则填 X）？
          answer: 10
          hint: '代入奈奎斯特频率底线公式 $f_s > 2 f_{max}$。'
          explain: |
            $2 \times 5\text{ kHz} = 10\text{ kHz}$；真实工程中为减轻抗混叠模拟滤波器设计压力通常会采到 `25 ~ 50 kHz` 以上。
      - item:
          id: alias-fold-freq
          type: number
          prompt: |
            若一只 ADC 采样率定在 $f_s = 1000\text{ Hz}$（半采样率奈奎斯特极限仅 `500 Hz`），但电路前忘加抗混叠滤波，意外溜进来一股 `900 Hz` 的高频马达电噪声。采样变成数字序列后，它会折叠伪装成多少赫兹（Hz）的虚假低频信号混在有用区里？
          answer: 100
          hint: '高于半采样率的混入信号，会以采样率 $f_s$ 为周期对称折回 $[0, f_s/2]$：算它距离最近整数倍 $f_s$ 差了多少赫兹。'
          explain: |
            $|900 - 1000| = 100\text{ Hz}$。在数字计算机眼里，这组采出来的数字点和真来了个 `100 Hz` 正弦毫无二致。
      - item:
          id: anti-aliasing-why-c4
          type: choice
          prompt: |
            为什么在 ADC 采样引脚**之前**通常必须加装一套模拟低通抗混叠滤波器，而不能等到采样进 CPU 后再靠写代码做“数字低通滤波”补救？
          options:
            - text: 高于半采样率的成分一旦采进数字流就折回低频，事后滤不掉
              correct: true
            - text: 软件可以先采样，再用数字低通滤波把混叠进来的高频成分滤掉
              why: 数字滤波器虽然能过滤采样后的数字频带，但混叠发生在离散采样那一刻，高于 $f_s/2$ 的频谱被永久搬到低频，采样后再滤已经来不及。
            - text: 模拟低通滤波器能凭空把 8 位 ADC 的物理精度免费升成 64 位
              why: 它阻止带外能量与杂波混叠进有用通带，并不直接改动芯片本身的量化位数
          explain: |
            “混叠一旦采样就无法还原，只能在采样前用模拟低通拦掉”——采集接口的一条原则。
      - item:
          id: adc-interface-match
          type: match
          prompt: |
            将模数采集系统前端接口的关键要素和各自职责配对起来。
          pairs:
            - ["**混叠**（Aliasing）", "采样速率过低时，超过半采样率的高频能量折叠伪装进低频有用区"]
            - ["抗混叠模拟低通滤波器", "必须放置在 ADC 采样入口之前，把高于 $f_s/2$ 的成分预先压制砍除"]
            - ["**量化**（Quantization）", "将连续模拟电压切成 $2^N$ 个有限离散 LSB 台阶带来的步进编码误差"]
            - ["**DAC**（数模转换器）", "根据数字编码权重在参考基准电压范围内重建输出对应模拟电平"]
          explain: |
            恭喜。你已经串联打通从电压电流定律到运放调理再到抗混叠安全进芯片 ADC 的整条硬件信号链。

boss:
  items:
    - id: boss-resistor-kcl-c4
      type: number
      prompt: |
        直流 `12 V` 电源先串联一只 $R_1 = 2\text{ k}\Omega$ 电阻，后接一只 $R_2 = 3\text{ k}\Omega$ 与 $R_3 = 6\text{ k}\Omega$ 的并联支路。请问主干流经 $R_1$ 的总电流是多少毫安（mA）？
      answer: 3
      explain: |
        $R_2 \parallel R_3 = 2\text{ k}\Omega$，总阻 $2 + 2 = 4\text{ k}\Omega$，总电流 $12 / 4 = 3\text{ mA}$（并联 voltage = `6 V`，分流 `2 mA + 1 mA = 3 mA` 符合 KCL）。
    - id: boss-rc-voltage-c4
      type: number
      prompt: |
        一阶 RC 电路 $R = 10\text{ k}\Omega$、$C = 10\ \mu\text{F}$，初始无电荷（`0 V`），从 $t=0$ 接通 `5 V` 恒压源充电。当时间经过 **$t = 0.3\text{ s}$（3 个时间常数）**时电容电压大约充到多少伏（保留两位小数）？
      answer: 4.75
      tolerance: 0.02
      explain: |
        $\tau = 0.1\text{ s}$，$v(0.3) = 5(1 - e^{-3}) \approx 4.75\text{ V}$（WSL `ngspice` 瞬态实测校验一致）。
    - id: boss-rc-fc-c4
      type: number
      prompt: |
        接同样一组 RC 器件（$R = 10\text{ k}\Omega, C = 10\ \mu\text{F}$）做成一阶无源低通滤波器，它的 `-3 dB` 截止频率 $f_c = \frac{1}{2\pi R C}$ 大约是多少赫兹（Hz，保留两位小数）？
      answer: 1.59
      tolerance: 0.02
      explain: |
        $f_c = 1 / (2\pi \times 0.1) \approx 1.59\text{ Hz}$。
    - id: boss-amp-cascade
      type: number
      prompt: |
        两级理想无失真电压放大器前后串连起来：第一级电压增益 $A_1 = -2$，第二级增益 $A_2 = -5$。合起来的整体闭环电压增益是多少倍？（放大器）
      answer: 10
      explain: |
        两级级联无加载衰减时总倍数为 $(-2) \times (-5) = +10$ 倍。
    - id: boss-opamp-noninv-c4
      type: number
      prompt: |
        负反馈理想运放外接两只电阻 $R_f = 100\text{ k}\Omega$、$R_{in} = 10\text{ k}\Omega$ 构成**同相放大器**（信号进 `+` 同相端）。该电路闭环电压增益是多少？
      answer: 11
      explain: |
        反相接法增益 $-10$，同相接法由虚短/虚断分压算出闭环增益 $1 + R_f / R_{in} = 1 + 100/10 = 11$。
    - id: boss-adc-code-c4
      type: number
      prompt: |
        一颗 **10 位 ADC**，参考电压 `3.3 V`。若外部传感器此时输入模拟电压 `1.2 V`，按直接截断 $\lfloor \frac{1.2}{3.3} \times 1024 \rfloor$ 算出的输出数字整数编码是多少？
      answer: 372
      explain: |
        $\text{LSB} = 3.3 / 1024 \approx 3.22\text{ mV}$，输入 `1.2 V` 对应编码 $\lfloor 372.36 \rfloor = 372$。
    - id: boss-adc-snr-c4
      type: number
      prompt: |
        按理想量化信噪比估算式 $\text{SNR} = 6.02N + 1.76\text{ dB}$，算一颗 **10 位** 理想 ADC 的信噪比大约是多少 dB（四舍五入取整）？
      answer: 62
      explain: |
        $6.02 \times 10 + 1.76 = 61.96 \approx 62\text{ dB}$。
    - id: boss-alias-filter-choice
      type: choice
      prompt: |
        全面整合检验：关于“理想运放虚短虚断”与“为何采样前必加模拟抗混叠低通滤波器”，下面哪一项叙述完全正确？
      options:
        - text: 负反馈时两输入端电位近似相等且不取电流；混叠的成分采样后无法还原，须在采样前滤掉
          correct: true
        - text: 虚短是把两个输入引脚直接短接；抗混叠可以采完数字平均
          why: 采样一旦把高频折进低频就变成一模一样的真假混合样本序列，事后软件无法区分剥离；虚短也不能直接短焊物理连线
        - text: 运放只能放大正弦直流且任何 10 位 ADC 永远具有无穷大分贝信噪比
          why: 10 位 ADC 理想量化底噪上限为约 62 dB；运放负反馈按比例放大任意合法线性范围内的交直流信号
        - text: 抗混叠滤波放在采样之后的数字程序里，用高通滤掉低频
          why: 抗混叠必须在进入 ADC 采样之前的模拟前端用低通滤波器滤除高于半采样率（奈奎斯特频率）的分量，采完后再滤波已经混叠无法还原
      explain: |
        恭喜完成《电路与模拟电子基础》。从欧姆与 KCL/KVL 到 RC 暂态滤波、晶体管小信号、运放负反馈直至高稳健 ADC 采样接口，物理世界到数字芯片的完整桥梁已为你畅通。
