skill: P.4.1
version: 2
authors: [main-agent]
brief:
  why: |
    在 P.1.1 里一个人写几十行小脚本可以想到哪写到哪；一旦真正进入公司写上百人协作、跑十年的大型软件，需求会半路改写、模块会互相耦合打架、新加人手反而拖慢进度、合代码一合就全站崩红。本包从真实软件开发痛点出发，只假设你学过 P.1.1，带你掌握软件过程与生命周期模型选型、过程剪裁、Scrum 迭代敏捷与故事点预测、抽象封装/信息隐蔽工程原则、GQM 评估体系、Brooks 团队沟通平方成本规律，以及评审、持续集成与协同开发防风险实战。
  outcomes:
    - 分辨瀑布、增量与 Scrum 式敏捷等过程模型边界，依据需求稳定性、审查规范与分期目标做过程剪裁
    - 理解 Scrum 三角色、五事件与三工件承诺，精准计算平均故事点速度与发布周期并在固定工期下取舍范围
    - 运用分解抽象、分层、信息隐蔽封装、Boehm 七项原则与 GQM（目标–问题–度量）框架组织可演进代码
    - 计算完全互连团队沟通路径数 n(n-1)/2 解释 Brooks 定律，并将代码评审、持续集成与迭代演示对应到具体项目风险
terms:
  - term: 软件过程
    def: 从需求理解、设计、实现、检验到发布维护的一整套有条理工程活动、角色分工、交付产物与质量把关规则集合。
  - term: 生命周期
    def: 软件系统从初始立项构想、开发交付、运行演化直至最终退役下线的完整阶段历程。
  - term: 迭代
    def: 把庞大功能拆分成短周期（通常一至四周）重复开展“设计–实现–检验–交付试用增量”的循环推进方式。
  - term: 过程剪裁
    def: 根据具体项目风险等级、法规审计要求、团队规模与变更频率，对标准开发流程进行增删裁剪适配的实践。
  - term: 抽象
    def: 抽出核心外部契约与本质概念、刻意省略当下无关的底层繁杂实现细节，以便人脑控制复杂系统。
  - term: 封装
    def: 把模块内部极可能常变的算法与数据结构隐藏在稳定公开边界后面，只通过明确受控接口对外协作。
  - term: 目标–问题–度量
    def: GQM 框架：先立清晰工程目标，再拆成可回答的关键问题，最后才挑选采集真正能回答这些问题的客观指标。
  - term: 持续集成
    def: 团队成员每天高频把小步修改合并回共享主干，每次合并立刻自动运行构建与测试套件，防止集成冲突后期集中引爆。

lessons:
  # ======================================================================== 生命周期
  - id: lifecycle
    chapter: 生命周期
    title: 为什么需要软件过程与完整发展阶段？
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 三个刚学完 Python 的同学决定合作写一个校园二手书交易网站。大家觉得流程规矩全是废话，于是不画界面、不分模块、也不规定怎么交接和测验，每个人各自埋头闷头写两周后直接拼在一块准备上线——结果首页报错、数据库表名各起各的、一改登录全站崩溃。他们最缺哪一层东西？
          options:
            - text: 缺乏清晰的工程协作框架（即把需求理解、分工设计、编码集成、测试检验和演化串成有序活动链），光靠写代码拼凑在多人长周期项目上必然乱套
              correct: true
            - text: 因为 Python 代码超过 100 行就绝对不能由超过两个人合作写
              why: 现代超大型工程动辄几百人同时写几百万行代码，核心秘诀正是依靠有序的开发过程活动、阶段评审与接口契约协调分工
            - text: 因为只有禁止写任何测试和文档才能加快协作速度
              why: 无秩序省掉前期沟通与规范，表面省一天，后期对账返工和排查集成崩溃要多花十倍时间
          explain: 多人、长周期的项目，光靠各写各的再拼起来必然乱套，需要把需求、设计、编码集成、测试和演化串成有序的活动。这一课讲 **软件过程与系统演化的全周期**。
      - card:
          title: 什么是软件过程与生命周期？
          body: |
            只懂语法写孤立脚本还不够——软件工程把构建、协作与交付组织成规范秩序：
            - **软件过程**：把分析、设计、实现、验证与部署组织成可重复协作的活动规范、分工规则与交付产物；
            - **生命周期**：系统从立项立意、开发构建、上线运行、长期改写直至退役下线的全部阶段历程，涵括主要开发过程与支撑过程（配置管理、质量保障、问题追踪）。
      - card:
          title: 为什么要专门管理开发阶段与支撑过程？
          body: |
            清晰划分阶段、配上管理和支撑活动，能直接压低三类失败的概率：
            - **早抓大偏差**：在需求与架构阶段先花小成本搞定分歧，远胜上线返工重写；
            - **可预计可管理**：拆出清楚里程碑与核对节点，让进度可见、风险可控、成员可交接；
            - **全过程支撑**：文档记录、版本控制与质量审查伴随整趟旅程，而不是全项目做完最后一天才补。
      - item:
          id: q-why-slcp-needed
          type: choice
          prompt: 在多人协作开发长期演化的软件项目里，引入明确阶段划分与过程规范最核心的工程目的是什么？
          options:
            - text: 为需求分析、设计、编码、验证与运维提供有序骨架与阶段核验检查点，尽早发现隐患并控制协作、进度与质量风险
              correct: true
            - text: 为了故意多写三百页没人阅读的废话表单把工期拖长三年
              why: 有效过程追求以恰当轻重成本对齐工程共识、尽早暴露缺陷并明确权责接口，而不是无意义官僚文书
            - text: 只要写完流程名字，电脑就会自动帮你写出零缺陷程序
              why: 流程规范提供协同秩序、验证关卡与风险防线，代码和验证本身依然需要严谨设计实现
          explain: 把软件工程过程看成团队的交通规则与安全护栏——它不是束缚手脚的枷锁，而是防止多人同路相撞的必需信号灯。
      - card:
          title: 例题：拆解一次真实校园点餐小项目从第 1 天到上线后的全阶段主要与支撑活动
          body: |
            哪怕只有 4 个人花 8 周做个校园点餐工具，也能排出一份清爽而不繁琐的工程工作流：
          reveal:
            - title: 第 1 步：核心开发主要活动（Primary Processes）
              body: ① 与食堂摊主和学生访谈写清最小需求规格（别闷头空想）；② 划分前后端接口契约与数据表结构设计；③ 分模块编写实现并通过单元测试；④ 合入发布并运行后持续修 Bug 加菜品功能。
            - title: 第 2 步：伴随全程的支持与管理过程（Supporting Processes）
              body: 同步用 Git 分支管理做变更记录（配置管理）、代码合入前相互检查（质量保证）、每周核对还剩多少任务（项目管理）——少了任何一条支撑线，主要开发很快就会落入谁覆盖了谁的代码、哪份数据才是真版本的混乱里。
            - title: 第 3 步：工程化的起点认知
              body: 编程解决“让机器把这段算式算对”，软件工程（Software Engineering）解决“**在有限时间预算里让团队造出能顺畅演进且靠得住的软件**”。
      - item:
          id: q-primary-vs-support-match
          type: match
          prompt: 把软件开发过程里的四项常见工程活动与它们各自核心消除的风险精准配对。
          pairs:
            - ["**阶段需求核对与早期原型沟通**", "防止开发两周才发现做出来的界面和业务方真正想要的完全南辕北辙"]
            - ["**支撑过程：版本与变更配置控制**", "防止多人改同一批文件时互相覆盖、上线跑出事故却无法追踪回退版本"]
            - ["**工程化验证检查点（Quality Assurance）**", "把隐藏在设计接口与边界条件里的缺陷尽早拦截在开发侧而非生产线上"]
            - ["**发布后维护与演化管理**", "系统上线并非终点，保证随后几年新加特性和修复补丁依然安全有序不崩塌"]
          explain: 每项活动都对着一类风险：原型沟通防做偏，配置控制防互相覆盖，验证检查点防缺陷漏到线上，维护管理防上线后越改越乱。
      - item:
          id: q-se-vs-coding
          type: choice
          prompt: 软件工程教材经常强调“会写代码”和“软件工程实践”之间存在一条明显分水岭。下面哪一项最能代表 **软件工程** 关注的核心额外维度？
          options:
            - text: 关注在真实时间与资源约束下如何管理需求变动、多团队长期协同演进、系统质量保障与全过程风险控制
              correct: true
            - text: 只关心单行 `for` 循环怎么少敲两个空格键
              why: 语法微优化只是编程局部技巧，工程关注的是整套系统长久的可维护性、协作效率与质量可靠性
            - text: 规定所有软件写完发布第一天就必须把源码永久销毁不准再修改
              why: 软件工程最核心特征恰恰是交付后还要在漫长运行期里持续修改和演化升级。
          explain: 软件工程比“会写代码”多出的，是在真实的时间和资源约束下管理需求变化、多人长期协作、质量保障和风险。

      - item:
          id: q-lifecycle-retroactive-cost
          type: choice
          prompt: 为什么工程实践都强调在需求与设计早期就及早抓偏差，而不是“先闷头写完所有代码再全部统一大返工”？
          options:
            - text: 缺陷或需求误解停留跨越的阶段越长，衍生出的代码与测试依赖越多，后期修改返工代价呈倍暴涨
              correct: true
            - text: 因为早期阶段电脑不能保存任何文本文件
              why: 早期花小代价对齐需求、设计边界与接口契约，直接避免后续整块架构返工重建
            - text: 因为只要到发布前五分钟再修改需求永远完全零成本
              why: 发布前夕推倒核心需求牵动接口、数据结构和全面验证，修改代价最高。
          explain: 早发现、早对齐、早验证，是整条 **软件生命周期** 控制成本的核心逻辑。

  - id: models
    chapter: 生命周期
    title: 瀑布、增量交付与循环模型选型对比
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 想象你同时接手两份完全极端的软件任务：① 为民航飞机刹车系统写控制软件（适航监管方规定需求早已白纸黑字锁死，且每个阶段文档都必须通过独立第三方严格审查签字才能进下一步）；② 给一家刚拿投资的创业小团队做陌生领域社交 App（连创始人自己都还不确定用户到底喜欢哪种互动玩法）。这两个截然不同的项目能用完全一样的开发节奏吗？
          options:
            - text: "绝不能一刀切。刹车控制固件高度适合严格计划驱动与阶段审查的瀑布/V 模型；而摸索不确定的创业 App 更适合小步快跑、频繁拿真版本试探市场反馈的短周期敏捷模型。"
              correct: true
            - text: 所有软件项目无论规模与需求稳定度如何，都应当严格套用同一种固定流程
              why: 盲目硬套不合时宜的过程模型是软件项目失败主因：强行让未知创业应用写半年瀑布需求，上线那天发现用户根本不买账；让适航刹车系统跳过规范文档验证直接乱改，更是拿生命开玩笑。
            - text: 创业社交 App 应该花五年闷头设计完所有文档，绝对不许提前让用户看哪怕一个界面
              why: 需求极度模糊的创新型产品最怕闭门造车久了与真实需求脱节，越早给出可试用增量拿真实反馈越好
          explain: 需求锁死、每阶段要第三方审查的刹车软件，适合计划驱动的瀑布/V 模型；需求还在摸索的创业 App，适合小步快跑、频繁拿真版本试市场。这一课分清 **瀑布（计划驱动）、小步短循环、增量交付与适应性模型** 各自适合的场景。
      - card:
          title: 过程模型与迭代：瀑布、V 模型、迭代与增量交付
          body: |
            - **瀑布模型（Waterfall，计划驱动）**：需求→设计→实现→验证→发布线性单向推进，步步落盘完整书面文档与严格评审关口；**V 模型**更把左半边每层规格与右半边各级测试一一挂钩，极为契合高安全法规审查项目。
            - **迭代**与**增量交付（Iterative & Incremental）**：不再等全做完一次性掏出全部。把开发拆成短周期循环，每轮不断把已确认部分做出可运行增量先交出去跑、边收集反馈边修正下一轮目标，大幅降返工风险。
      - card:
          title: 如何按“需求确定性 × 合规约束 × 交付节奏”选对模型？
          body: |
            把三个经典场景放进决策框：
            - **需求先锁定 + 法规严格逐关审查**（如飞机刹车控制固件）：选 **瀑布 / V 模型**（阶段交付文档清晰可审查）；
            - **需求未知摸索 + 需要每两周试水调整方向**（如初创社交 App）：选 **Scrum 式敏捷与快速迭代**；
            - **总体边界清楚 + 要求分期逐批上线功能**（如大型政务分三期上线）：选 **增量分期交付（Incremental）**。
      - item:
          id: q-three-projects-model-ex1
          type: match
          prompt: 为以下三类真实项目选出最贴切的开发过程模型并匹配各自核心原因。
          pairs:
            - ["A. 飞机刹车控制固件（适航标准需求固定，每阶段文档需第三方审查）", "**瀑布模型（或严格计划驱动阶段模型）**：需求高度稳定且合规审验硬要求各阶段产出完整可追溯文档"]
            - ["B. 初创社交 App（需求尚在摸索，希望每两周拿到可试用版本验证玩法）", "**Scrum 式敏捷 / 短周期循环模式**：拥抱需求变化，用高频可运行增量收集真实市场反馈动态纠偏"]
            - ["C. 大型政务系统（总体核心范围明确，要求按一期、二期、三期分批上线）", "**增量交付模式**：前期定准总体边界蓝图，每期按优先模块顺序稳步投产交付可用子系统"]
            - ["对“需求每天都还在大改的未知新创产品”盲目锁死重型瀑布", "高返工反模式：还没写完代码市场和需求早已大变，前期海量设计文档彻底作废"]
          explain: 看完这张对照表，就再也不会把“敏捷就是不写文档”或“瀑布永远过时垃圾”这些极端口号挂嘴边了。
      - card:
          title: 例题：为什么把“瀑布、增量与纯螺旋/原型演化”弄混的团队最容易卡在半路？
          body: |
            现实工程里很多团队嘴上喊“我们在跑敏捷”，做法却是既不给明确周期目标也不测验收，或者搞成了“迷你小瀑布”。对比几类经典模型的本意：
          reveal:
            - title: 第 1 步：V 模型（高严谨领域常用计划增强型）并非盲目不验收
              body: 汽车、医疗和航空系统里采用 V 模型时，左翼每写定一份“架构设计”或“单元规格”，同时就已经把对应的“集成验收用例”和“单元验收用例”准备就绪——既保全程严密审计追溯，又让验证不脱节。
            - title: 第 2 步：增量交付（Incremental）与纯粹边做边猜（Iterative）的区别
              body: 增量侧重“先定好大蓝图，分批交付第一块可用功能 → 第二块可用功能 → 第三块”（如大型政务分三期上线）；纯粹螺旋/探索原型侧重“在不明朗之处先造可扔小样试错摸清方向，再一轮轮改进”；现代敏捷则是把**循环演化**（调整方向）和**增量交付**（每次真能用）拧成一股。
            - title: 第 3 步：警惕“伪迭代”——一连三个月都不拿可运行软件给客户验收
              body: 如果每两周虽然开会喊冲刺口号，但整整四个月连一个能在真测试环境点着跑的可用版本都交不出来，只是前面两个月全写界面、后面两个月全憋着做接口——这只是打着迭代名号的隐形大瀑布，最后集成照样大崩溃。
      - item:
          id: q-waterfall-biggest-risk
          type: choice
          prompt: 当一个需求还在剧烈试错变化的探索性产品错误地选用了严格的纯线性 **瀑布模型（Waterfall）** 时，项目通常会在哪一时刻集中遭遇灾难？
          options:
            - text: 一直憋到末期集成和测试交付阶段，才突然发现数月前冻结的纸面假设早已不符合真实市场与用户习惯，修改需要推翻大量已完成设计文档与代码造成巨额返工
              correct: true
            - text: 因为瀑布模型规定不允许写出超过三行代码
              why: 瀑布完全能开发极其庞大的软件（如早期大型系统），它唯一致命弱点在于反馈环拉得太长、对后期需求变更响应代价极高。
            - text: 第一天开完会就立刻能收集到一万名真实用户操作反馈
              why: 线性瀑布在漫长编码收尾之前极少交付真正可交互的完整系统让最终用户试用体验
          explain: 总结成一句话选型金律：**需求越稳越受严审，越偏计划验证；需求越新越多变，越靠短循环真增量反馈。**
      - item:
          id: q-v-model-strength
          type: choice
          prompt: 在汽车刹车、医疗器械等安全关键嵌入式软件领域中，为什么 **V 模型**（瀑布模型的验证强化演变版）至今仍被广泛使用？
          options:
            - text: 因为它把需求规格、系统设计、架构、单元编码左侧各阶段，与右侧的验收测试、系统测试、集成测试、单元测试逐一严格对应绑定，既满足监管可追溯审查又确保验收准则及早制定
              correct: true
            - text: 因为 V 模型允许跳过需求分析与架构设计，直接从编写代码开始再补写验收标准
              why: V 模型恰恰要求在设计左侧每一层级时就同步规划并锁定右侧对应的验证用例与追踪关系
            - text: 因为它完全不用编写任何需求规格说明就能自动运行
              why: 安全关键领域最核心的法规要求正是清晰完整的规格与测试证据双向追溯链
          explain: V 模型把左边的需求、设计、编码各阶段，和右边的验收、系统、集成、单元测试一一对应，每一层都有可追溯的检验，适合要过监管审查的项目。

      - item:
          id: q-incremental-vs-bigbang
          type: choice
          prompt: 某大型政务平台总体需求已清晰明确，但计划按“一、二、三期”分批上线给窗口办公人员用。相比“全套三期一起写完两年半后再一次性上线（大爆炸交付）”，分三期增量交付的最大收益是什么？
          options:
            - text: 第一期核心刚需模块半年内就能真上线产生业务价值并暴露真实环境使用反馈，随后二、三期稳步累加风险小得多
              correct: true
            - text: 因为一次性大爆炸上线根本不用写任何一行代码
              why: 增量交付通过分批次投产把庞大交付风险切碎化解，让用户尽早用上核心功能
            - text: 分期交付意味着完全不写前两期需要的数据库基础设计
              why: 总体骨架规划清楚后分期按模块交付，每期仍保持规范工程结构与验证
          explain: "**分期小步投产 = 早收获真实反馈 + 分散上线风险。**"

  - id: tailoring
    chapter: 生命周期
    title: 过程剪裁与风险驱动配置管理
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 某大型集团新发布了一份厚达 200 页的“公司级标准研发流程手册”，里面规定：每个微小改动都要经五个总监书面会签、写十二份规范书、走两周灰度窗口。结果负责做“活动运营两天倒计时 H5 页面”的 3 人小分队照章执行下来，页面还没发布活动早就结束了。公司流程难道应该把所有团队按同一把铁尺一刀切吗？
          options:
            - text: 绝不该一刀切。按 过程剪裁 的思路，应当结合项目的“业务出错后果风险、规模周期、合规要求与团队经验”，对标准流程做删繁就简或重点加厚。
              correct: true
            - text: 应该连两人写的活动小页面也强制走完五级总监会签与两周发布审批
              why: 过度沉重而不合项目风险特征的流程开销会直接扼杀业务敏捷性与研发生产力，甚至逼团队私下绕开流程形成混乱
            - text: 因为公司规章不适配小活动，所以连核心银行资金系统也应该取消一切代码评审和测试直接随便上线
              why: 两个极端都错了。银行清结算高危核心系统要厚重严审把关，短期营销小活动要轻灵快跑——关键就在精准适配风险梯度。
          explain: 两天的 H5 页面和十年的核心系统，风险完全不同，用同一套 200 页流程必然有一边失衡。这一课学 **SLCP（软件生命周期过程）管理** 和 **过程剪裁（Process Adaptation / Tailoring）**。
      - card:
          title: 过程剪裁（Tailoring）核心维度
          body: |
            标准过程框架就像一件均码成衣，真正下场干活前必须做 **过程剪裁**：
            - **考虑四类核心上下文因素**：① **出错后果与安全关键性**（掉一秒就赔钱 vs 小活动展示错字）；② **项目规模与跨团队依赖数量**；③ **行业监管与第三方合规审验**；④ **需求确定性与工期紧迫度**。
            - **剪裁边界**：哪些是**全公司绝对红线不可删**（例如版本控制、基础权限与回归验证），哪些是**可按需简化或升级**（审批层级、文档厚度）必须有据可查。
      - card:
          title: 同一个系统内部的“混合剪裁”策略
          body: |
            即便在同一个中大型产品里（例如大型政务或现代电商系统），也可以分层做混合剪裁：
            - **底座核心账务 / 隐私数据表层**：偏稳健严谨（详尽接口契约、双人严审、完整回归、规范变更单）；
            - **上层探索 UI / 实验性报表模块**：偏轻量快节奏（两周一轮小增量试用，随时按用户意见微调或删掉）。
            记住：**过程服从风险与价值，绝不反客为主当流程奴隶。**
      - item:
          id: q-tailoring-principle
          type: choice
          prompt: 软件生命周期过程需要 **过程剪裁（Tailoring / Adaptation）**。以下哪种做法精准体现了健康的工程剪裁思路？
          options:
            - text: 对“内部临时统计看板”减免冗余重型评审文档保留基础自动化测试；而对同一平台中的“核心资金清结算模块”强加双人评审、设计核查与严格回归门禁
              correct: true
            - text: 因为不想写文档，借口“过程剪裁”把生产上线前的密码检查与权限校验测试全部一刀砍零
              why: 过程剪裁是为了**使过程严丝合缝匹配项目真实风险**，绝不是借此剥离底线安全与基础质量保卫门禁。
            - text: 只要是同一个公司立的项，哪怕“2 天上线的静态海报页”和“5 年的医院急救系统”必须一模一样走 18 份审批报告
              why: 盲目一刀切不区分风险级别与周期特征，恰恰是拒绝过程剪裁导致的官僚低效反模式
          explain: 一句话记准：**低风险快迭代求敏捷轻省，高风险强合规求严密追溯**——让每条流程规矩都能说清自己守的是哪颗雷。
      - card:
          title: 例题：当一个传统大企业按阶段评审跑大型政务项目，怎么防止“前端改一点都要走三个月审批”？
          body: |
            遇到“大型政务分三期上线”，既要交出满足财政审验的大框架文档，又想每两三个月顺利上线一期可用的高质量系统。看怎么把过程剪裁用活：
          reveal:
            - title: 第 1 步：总体边界定桩 + 三期里程碑契约化（计划稳定部分）
              body: 预先明确三期总体边界、安全合规标准、数据主表结构与各期交付范围清单，让甲方和监理在高层架构与分期契约上定心并过第一关审计；
            - title: 第 2 步：每期内部切出小步循环开发交付节奏（快速避险部分）
              body: 在单期内部不闭门憋四个月。每两周做一次真实模块联调集成与核心干系人内部演示看真东西，小偏差两周内顺手微调好，到了期末正式交付时自然顺顺当当过外部大验。
            - title: 第 3 步：同时确立全团队不可越过的两条最小红线
              body: 不管多小多急的任务，**版本托管提交记录**与**关键逻辑自动化验证不破红**两条底座守则绝不裁掉，保证整体可控。
      - item:
          id: q-tailoring-factors-multi
          type: choice
          multi: true
          prompt: 对一个具体研发团队开展合理的 **过程剪裁** 时，应当依据下面哪些客观工程要素来调重流程颗粒度与审核深度？（多选）
          options:
            - text: 系统失效可能带来的安全、生命、财务或隐私合规后果严重程度
              correct: true
            - text: 需求清晰稳定度以及研发途中预计发生变更的频繁程度
              correct: true
            - text: 团队人员规模、分布时区与对业务领域的熟练程度
              correct: true
            - text: 代码仓库里单个源文件的字符长度是否刚好是 1024 的整数倍
              why: 流程配置必须紧盯客观项目风险、协作规模、变更不确定性与监管合规要求，与文件字符数是否整除无关
          explain: 守好风险、变更率、团队复杂度和合规四把标尺，过程怎么裁都不会走偏。
      - item:
          id: q-slcp-management-goal
          type: choice
          prompt: 谈到 **SLCP 管理（软件生命周期过程管理）** 时，为什么不能由各项目组完全放飞自流、各自随口发明互不兼容的流程术语，而要先有统一组织级参考框架再允许剪裁？
          options:
            - text: 因为统一组织底座能沉淀全公司跨团队可复用的共享语言、工具链与历史估算经验数据（否则每个人词汇与统计口径全对不上），同时再允许各项目组在明确原则下基于风险剪裁落地
              correct: true
            - text: 为了强迫每个团队成员每天背诵一千条无用口号
              why: 建立统一参考基线的目的是方便跨组交流调动、数据复盘比较与质量底线把控，随后再用过程剪裁适配具体项目。
            - text: 因为如果不统一步骤名字电脑硬盘就立刻无法保存文本文件
              why: 工程协作体系标准化服务于“人际协作与持续改进”的组织可复制性
          explain: 统一的组织级框架让各团队有共同的语言、工具和历史估算数据；在这个底座上再按项目剪裁，才不会各说各话。

  # ======================================================================== 迭代/敏捷
      - item:
          id: q-tailoring-redlines
          type: choice
          prompt: 在为一个只有两周工期的轻量校园展示项目执行 **过程剪裁** 时，下面哪一条底层基线仍然**不该被裁掉**？
          options:
            - text: 代码版本控制提交追溯与核心关键功能的基本自动化验证检查
              correct: true
            - text: 必须凑齐五位高管手写纸质审批单并写三百页格式固定无用空文档
              why: 冗余繁琐形式文档正是应当针对小而轻量低风险项目果断裁剪减轻的对象
            - text: 强制要求所有成员先停工学习三年形式化定理证明才能建工程文件夹
              why: 过程方法必须匹配项目规模、工期与安全风险等级
          explain: 剪裁去掉的是与风险不相称的繁文缛节，而不是底线工程保护。

  - id: scrum
    chapter: 迭代/敏捷
    title: 敏捷原则、Scrum 三角色/五事件/三工件承诺（Scrum Guide）
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 某团队宣布从今天起采用 **Scrum 敏捷**。可一打听实际做法却让人啼笑皆非：产品负责人每逢周三突然冲进工位强塞临时新需求插队；每天 15 分钟每日站会被经理改成每人轮流低头背 40 分钟工作汇报批斗会；整个 Sprint 结束时也压根没有任何可跑的集成成品拿出来演示……这样能叫真的敏捷吗？
          options:
            - text: 彻底偏离了 Scrum 本意。敏捷核心是靠短周期固定时盒交付真实可用的产品增量并通过实证检验持续调头：Scrum 有清晰的角色责权边界（比如冲刺途中严禁外人乱插队摧毁聚焦），每天站会面向团队同步计划扫除障碍，冲刺尾声必须产出符合完成定义的可交付增量。
              correct: true
            - text: 是的，敏捷的意思本来就是“彻底消灭一切计划、随时想加需求就随时硬插进来”
              why: 敏捷恰恰讲究有序节律：**需求随时能进整体产品待办列表排序调整，但是一旦锁定进当前短短 1–2 周冲刺（Sprint Backlog），就保护团队专注完成承诺目标。**
            - text: 每日站会本来就必须站着向大老板持续汇报两小时以上
              why: Daily Scrum 严格控制在 15 分钟内，是由开发人员面向自己内部同步进展、调整当天计划解决卡点的短平快自组织碰头会。
          explain: Scrum 靠固定时盒交付真实可用的增量、用实证来调整方向；冲刺途中不许外人插队，站会是团队同步计划、扫除障碍，不是汇报批斗。这一课按 **2020 Scrum Guide** 把常被歪曲的 Scrum **三角色、五事件、三工件与三项承诺** 讲清楚。
      - card:
          title: 敏捷实证理念与 PO / SM 职责边界（2020 Scrum Guide）
          body: |
            敏捷不是没纪律，而是重**实证反馈循环**：早期持续交付有价值软件、拥抱正当需求调整。先把其中两项关键角色分清：
            - **Product Owner（产品负责人 PO）**：最大化产品商业价值，唯一负责维护与排定 **产品待办列表（Product Backlog）** 的优先级；
            - **Scrum Master（敏捷教练 SM）**：守护流程理解与高效协作，帮团队排除外部干扰卡点。
      - item:
          id: q-scrum-po-vs-sm
          type: choice
          prompt: 在 Scrum 团队里，决定“下一轮冲刺产品列表先做支付优惠券还是先做客服工单搜索”排在第一优先级的人是谁、帮团队移除外部阻塞又推动敏捷纪律的人又是谁？
          options:
            - text: 排定商业价值优先级的人是 产品负责人（PO）；排除协作卡点与守护团队过程顺畅的人是 Scrum Master（SM）
              correct: true
            - text: 两者必须全由同一个外部大总监拍脑袋每天早晚随机轮换决定
              why: Scrum 刻意将“价值优先级（PO）”与“协作流程守护（SM）”清晰分权互补，防止价值决策与技术推进打架
            - text: 只有开发人员自己允许删光全部客户需求优先级
              why: 开发团队（Developers）自主决定技术怎么做和接多少量，而业务条目先后顺序唯一由产品负责人统筹。
          explain: "**PO 决定做哪件最有价值，Developers 决定怎么高质量做成增量，SM 确保整台协作引擎不卡壳。**"
      - card:
          title: Developers（开发成员）角色与独立自主承诺（2020 Scrum Guide）
          body: |
            - **Developers（开发成员）**：跨职能平等合作，自主规划怎样在短冲刺内构建并通过质量验收，把产品待办列表转化为可交付增量。没有任何“部门指挥官”每天微观派工。
      - card:
          title: Scrum 五大固定时盒事件与三大工件承诺
          body: |
            - **五大事件**（全设严密时间上限不拖堂）：**Sprint（冲刺，<=1月固定周期容器）** → **冲刺规划会** → **每日站会（15分钟，开发自组织对齐）** → **冲刺评审会（向干系人演示真增量调方向）** → **冲刺回顾会（复盘团队自己怎么改进合作）**；
            - **三大工件及其一一对应的严格承诺**：
              1. **Product Backlog** ↔ 承诺 **产品目标（Product Goal）**；
              2. **Sprint Backlog** ↔ 承诺 **冲刺目标（Sprint Goal）**；
              3. **Increment（增量）** ↔ 承诺 **完成定义（Definition of Done，DoD）**。
      - item:
          id: q-scrum-roles-commitments-match
          type: match
          prompt: 把 2020 版《Scrum 指南》里的角色及三大核心工件（Artifact）与各自直接守卫的目标或承诺匹配。
          pairs:
            - ["**Product Owner（产品负责人）**", "对产品商业价值负责，唯一掌握 Product Backlog 条目排序权，守护 **产品目标（Product Goal）**"]
            - ["**Sprint Backlog（冲刺待办列表）**", "开发团队针对本轮选定事项拆出的落地计划，直接围绕本轮统一的 **冲刺目标（Sprint Goal）**"]
            - ["**Increment（可交付软件增量）**", "每轮必须真正通过测试集成可工作的成品台阶，以公开统一的 **完成定义（DoD）** 为质量门槛"]
            - ["**Scrum Master**", "促成敏捷规则正确落地，协助移除跨团队沟通障碍与外部突发干扰"]
          explain: 记死 2020 Scrum Guide 的“三件宝配三承诺”，别被挂羊头卖狗肉的假敏捷糊弄过去。
      - card:
          title: 例题：为什么必须严格区分 **Sprint Review（冲刺评审会）** 与 **Sprint Retrospective（冲刺回顾会）**？
          body: |
            好多刚学 Scrum 的团队习惯在冲刺最后一天把两个会揉成一个稀里糊涂的“总结批斗会”。对照指南看两者各自看什么、解决什么根本不同的问题：
          reveal:
            - title: 第 1 步：冲刺评审会（Sprint Review）——对着“产品真东西”向外问对不对路
              body: 参与者包括 Scrum 团队**加上外部业务方、客户或领导等干系人**。核心不是念 PPT 总结汇报，而是直接上机演示这轮做出来的**可运行产品增量**，当场听取业务和用户试用反馈，据实修改接下来 Product Backlog 的优先级排序（防做偏方向）。
            - title: 第 2 步：冲刺回顾会（Sprint Retrospective）——关起门来向内问合作顺不顺
              body: 参与者只限 Scrum 团队内部自己成员，**不请外部业务方**——这样大家才敢坦诚复盘：“这轮我们自己哪些协作方式卡壳了、自动化构建老断怎么修、为什么评审排队两天？”，定下一两条下轮**立刻就能改好的工程/协作改进动作**。
            - title: 第 3 步：完成定义（DoD）绝不是“写完代码就算完了”
              body: 真正的 DoD 必须包含代码已审、通过自动化单元和集成测试、合入主干可演示无已知严重回归——只有达标 DoD 的产出才能算真增量、也才能算进有效故事点速度。
      - item:
          id: q-review-vs-retro
          type: choice
          prompt: 在 Scrum 五大事件里，如果团队想邀外部客户一起试用刚做出来的新版购物车、讨论下周先做积分券还是满减活动；而在另一个闭门会议里，开发团队只跟自己成员复盘“为什么这次自动集成总卡住、代码互审总排队”并定下改进方案。这两场会议各自应该叫什么？
          options:
            - text: 邀请干系人看真增量定产品方向的是 冲刺评审会（Sprint Review）；仅内部闭门复盘工作方式与工程效能并制订改进项的是 冲刺回顾会（Sprint Retrospective）
              correct: true
            - text: 两者都是“每日 15 分钟站会”，每次必须开足五小时
              why: Daily Scrum 是每天 15 分钟聚焦当日协调；检视产品看 Review，改进团队协作过程看 Retrospective。
            - text: 前者叫“需求冻结禁止演示会”，后者叫“惩罚加班大会”
              why: Scrum 极其反对只做不演示与高压责备文化，Review 让真实软件尽早见客户纠偏，Retrospective 让团队在安全氛围里自我升级。
          explain: 一句话区分：**Review 审产品（看做对了没、下面做什么）；Retro 检过程（看合作顺不顺、下次怎么做得更稳）。**
      - item:
          id: q-backlog-mid-sprint-change
          type: choice
          prompt: 一个正在进行的 2 周 Sprint 才跑到第 4 天，市场部同事突然想顺便在首页加一个“完全不影响当前冲刺核心目标的小抽奖弹窗”。按敏捷与 Scrum 纪律应当怎么处理比较妥当？
          options:
            - text: 把新需求提交给产品负责人（PO），放进 产品待办列表（Product Backlog） 按全局优先级排序，通常安排进下一个冲刺做（当前冲刺若目标未失效则保持团队专注不被随意打断插队）
              correct: true
            - text: 不经过 PO 讨论排序，直接命令开发人员停下手头全部进行中的核心任务当场硬塞进这一周硬加班做完
              why: 冲刺期间频频随意往里塞无关杂活会摧毁团队的专注承诺、彻底打乱速度估算、并连累既有完成定义质量暴跌
            - text: 把它彻底永久丢进垃圾桶永不记录，哪怕下一轮很有商业价值也不看
              why: 敏捷欢迎收集有价值的新需求，它进产品待办列表按价值评估排队等待下一轮冲刺规划即可。
          explain: 冲刺途中保持目标不被打断：新需求交给 PO 放进产品待办列表排优先级，通常排进下一个冲刺。

  - id: forecast
    chapter: 迭代/敏捷
    title: 团队速度估算、发布周期计算与工期范围权衡
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你们团队走的是 **2 周一个 Sprint（冲刺）**，过去三轮真跑下来，每轮稳定按完成定义（DoD）交付的故事点分别是 `21`、`18`、`24` 点。现在产品待办列表还剩下总共 `130` 点工作量。按照平均速度估算，还要跑完几个冲刺、总共几周？假如产品负责人要求死活必须在 `10` 周内全部上线，团队该怎办？
          options:
            - text: 平均速度是 `(21 + 18 + 24) / 3 = 21` 点/冲刺，`130 / 21 ≈ 6.19` 须向上取整至少 `7` 个冲刺（`14` 周）；若死定 `10` 周（`5` 冲刺最多只做 `105` 点），绝不靠虚假硬逼团队盲目加班翻倍故事点，而要协商砍掉/拆后最低价值的约 `25` 点范围或协商调整时间。
              correct: true
            - text: 先算一个四舍五入约 6 个冲刺直接承诺完事，剩下做不完的 25 点靠开发每天深夜免费加班硬赶出来
              why: ① `6` 个冲刺平均只做 `6 × 21 = 126 < 130`，做不完必须向上取整成 **`7` 个冲刺**；② 把历史实测产能拿去靠强逼“加班拉高速度”只会导致代码质量崩塌、缺陷暴增反拖垮后续速度。
            - text: 每个故事点固定等价于 1 小时标准工时，跨团队可直接按小时折算
              why: 故事点是本团队相对工作量尺度，只用于帮助团队用**自己的历史实际平均速度**预测中长期大致趋势，绝不能拿去跨团队横向攀比考核。
          explain: 平均速度 `(21 + 18 + 24) / 3 = 21` 点，`130 / 21 ≈ 6.19`，要向上取整成 `7` 个冲刺（`14` 周）。时间定死在 `10` 周就只能做 `105` 点，该砍的是范围，不是逼团队虚报。这一课掌握 **敏捷经验预测的算法** 和 **范围、时间、质量三者的取舍**。
      - card:
          title: 故事点与经验平均速度（Velocity Forecasting）
          body: |
            不要迷信水晶球拍脑袋定死期，敏捷靠**自己团队真跑出来的数据说话**：
            - **平均速度**：只把**真正达标完成定义（DoD）**的故事点加进历史统计（半成品算 `0` 点）；取近期几个稳定冲刺的均值作为未来单轮参考产能；
            - **为什么算冲刺数一定要“向上取整 `ceil`”？**：若 `130 ÷ 21 ≈ 6.19` 个冲刺，第 `6` 轮结束时仍差 `4` 点未达标，想要全部交付必须进入并跑第 `7` 个完整冲刺周期。
      - card:
          title: 当预期容量赶不上截止日期：工期铁三角怎么破局？
          body: |
            遇到 `10` 周极紧工期硬约束（`5` 冲刺 × `21` 点 = `105` 点，明显少于 `130` 点需求，**差额 `25` 点**），专业团队立刻拿数据跟产品负责人摆出真实选择：
            1. **削减/切分低价值范围（最健康）**：挑出最核心高价值的 `105` 点按期上线，把那 `25` 点边缘或低优先级特性推迟到发布后下一轮迭代；
            2. **调整截止日期**：若 `130` 点确实一点不能少，把预期排期诚实延到 `7` 个冲刺（`14` 周）——而不是偷偷降低质量测试或靠透支加班弄出遍地漏洞的半成品。
      - item:
          id: q-velocity-ceil-weeks-ex2
          type: number
          prompt: "某 Scrum 团队冲刺固定为 `2` 周一轮，前三个冲刺实测完成的故事点为 `21`、`18`、`24`。目前待办清单还剩 `130` 点工作量。按照平均速度估算，把这 `130` 点全部做完至少需要 **几周**？（填整数）"
          answer: 14
          explain: "平均速度 `(21 + 18 + 24) / 3 = 21` 点/冲刺；`130 / 21 ≈ 6.19`，向上取整为 `7` 个完整冲刺（6 个冲刺仅完成 126 点不够 130 点）；`7 × 2 = 14` 周。"
      - card:
          title: 例题：另外两组必会的预测——“10 周缺口 `25` 点”与 `ceil(81/20) = 5`
          body: |
            再看两道经典计算题，看清为什么工程预估绝不能“四舍五入偷懒少算一轮”：
          reveal:
            - title: 第 1 步：固定 10 周工期下的精准缺口预算（`130 - 5 × 21 = 25`）
              body: "`10` 周 ÷ 每冲刺 `2` 周 = 整 `5` 个冲刺。按稳定均值 `21` 点/轮算，期望能按 DoD 交付 `5 × 21 = 105` 点——比全部想要的 `130` 点正好少 **`25` 点**。这把 `25` 点清清楚楚摊在桌面上，就是团队和 PO 一起协商砍范围最客观的数学依据。"
            - title: 第 2 步：极易算错的边界例 `ceil(81 / 20) = 5`（不是 `4`）
              body: 假如某小组平均速度是 `20` 点/轮，剩下 `81` 点任务：`81 / 20 = 4.05`。哪怕只多出来 `1` 点（`4` 轮只能搞定 `80` 点），按四舍五入看像是 `4` 轮，可实打实还剩 `1` 点没上线，必须安排第 `5` 个冲刺或提前跟业务砍掉这 `1` 点低优先小功能。
            - title: 第 3 步：反模式——拿“故事点速度”当个人绩效考核棒
              body: 一旦老板宣布“下季度速度没涨 20% 扣奖金”，各团队立马在内部把原本 3 点的普通任务全都顺手高估标成 6 点，速度数字一秒翻倍而实际交付半点没多——所以速度永远只作**本队内部估算校准尺**，绝不能当跨队绩效 KPI。
      - item:
          id: q-velocity-scope-gap-ex2
          type: number
          prompt: "接前例（2 周一轮、团队平均速度为 `21` 点/冲刺、总待办需求共 `130` 点）：如果产品负责人明确通知因外部展会死线，系统必须在 `10` 周内上线第一版。按当前实测历史平均速度，10 周内大约会出现多少故事点的 **容量缺口（还做不完需要削减或延后的点数）**？（填整数）"
          answer: 25
          explain: "`10` 周含 `10 // 2 = 5` 个冲刺，预计总产能 `5 × 21 = 105` 点；距离全部 `130` 点正好差 **`130 - 105 = 25` 点**——拿着 `25` 点的清单去排取舍优先级，专业度拉满。"
      - item:
          id: q-story-points-kpi-antipattern
          type: choice
          prompt: 某公司高层为了提升整体效率，规定把两个完全不同产品的开发组的故事点速度拉齐对比，并把“每轮完成故事点总数上升”直接和年终奖挂钩。按经验工程实践，这会引发什么典型失真现象？
          options:
            - text: 故事点立刻发生“人为通胀”（各队默契把原本 2 点的任务全改成 5 点，表面速度数字暴涨但实际交付功能零增加），使团队失去原本用于诚实预测排期的参考尺度
              correct: true
            - text: 两个不相关团队原本随意估出的故事点天然具有全球统一物理单位，可直接等价换算成公斤数
              why: 故事点是相对复杂度度量，每队自己的基线（“什么是 1 点小卡片”）完全不同，跨队直接比数值毫无意义
            - text: 故事点是用来衡量服务器网线有多长的物理指标
              why: 故事点只用于本团队相对工作量预测，且仅该团队内部持续稳定校准时才准确有效
          explain: 速度一旦和奖金挂钩，大家就会把任务点数往上报，数字涨了交付却没变，速度也就失去了预测的作用。

      - item:
          id: q-forecast-ceil-boundary-81
          type: number
          prompt: 假如团队实测平均速度稳定在 `20` 故事点/冲刺，产品待办清单里还剩 `81` 点任务。按经验预测最少还需要 **几个冲刺** 才能把这 `81` 点全部做完？（填整数）
          answer: 5
          explain: "`81 / 20 = 4.05`。哪怕仅仅多出 `1` 点，跑 `4` 个冲刺也只能做 `80` 点做不完 `81` 点——工期估算永远不能四舍五入抹掉零头，必须向上取整成 `5` 个冲刺。"

  - id: methods
    chapter: 迭代/敏捷
    title: 启发式、形式化数学规约、原型法与敏捷方法家族
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 除熟悉的面向对象和敏捷之外，写一套“航天器飞控核心锁死条件”或是帮银行确认“一个复杂表单流程到底该选三步还是两步交互”——难道都靠直接堆几千行代码边写边试吗？软件工程方法里特意把工程方法分成四大派系：**启发式、形式化方法、原型法与敏捷法**。请问其中哪种方法直接用数学逻辑定理严密建模验证系统性质是否绝对无矛盾？
          options:
            - text: "形式化方法（Formal Methods）：采用严格数学逻辑与状态规约（如模型检验或定理证明），在对安全极其苛刻的核心关键部件上排除逻辑漏洞。"
              correct: true
            - text: 靠设计师在黑板上随手画两个表情包（原型法）就可以做数学定理严格证明
              why: 原型法专门用来低成本快速试错探索不确定的界面和性能假说，并不负责严格数学逻辑证明
            - text: 四大方法各自规定只能用完全一样的单一格式写说明书
              why: 启发式经验指导、形式化数学证明、快速可抛原型实验、敏捷渐进迭代各有绝招、适用场景迥异。
          explain: 飞控锁死条件这种对安全极其苛刻的部件，适合用严格的数学逻辑去验证，这就是形式化方法；交互选三步还是两步，则适合先做原型给用户试。这一课分清 **Heuristic（启发式）、Formal（形式化）、Prototyping（原型）与 Agile（敏捷）四大方法家族** 各适合什么。
      - card:
          title: 启发式与形式化方法对比
          body: |
            - **启发式方法（Heuristic Methods）**：总结前人千百次实践凝练出的实用经验指南（例如结构化分解、面向对象分析与设计原则）——好懂灵活，不靠死数学证明，适用于绝大多数日常商业研发。
            - **形式化方法（Formal Methods）**：用精确数学集合、谓词逻辑或时序状态机规约程序行为并机械验证（例如核电站控制器、高安全协议栈校验、芯片底层死逻辑检查）——成本极高但可靠性顶格。
      - card:
          title: 原型法（Prototyping）与敏捷方法定位
          body: |
            - **原型法（Prototyping）**：在投入真正高昂正式开发前，先用低成本粗糙模型试探未知（如“纸上界面原型”测用户点不点得懂，“技术验证小样”测新数据库能不能扛住并发）；注意区分**可抛弃原型**（探清答案就果断扔掉按正则工程架构重做） vs 演化原型。
            - **敏捷方法**：把构建拆成贴近客户的短冲刺周期，最小化前期猜测与文档臃肿，通过真实可运行软件持续纠偏。
      - item:
          id: q-swebok-methods-match
          type: match
          prompt: 把四大软件工程方法与最相称的真实研发问题一一对应。
          pairs:
            - ["**启发式方法**", "依据面向对象类职责、结构化分解等成熟工程经验准则指导大型业务系统的日常清晰设计"]
            - ["**形式化方法**", "对高铁信号互锁协议或密码核心状态机采用严格数学语言建模并做穷尽状态无矛盾验证"]
            - ["**可抛弃式原型（Throwaway Prototyping）**", "为摸清模糊的用户交互流程或未知新技术极紧，花两天赶出一个粗糙实验品测完思路后即扔掉重筑正式底座"]
            - ["**敏捷方法（Agile）**", "面对高频变更商业需求，通过固定 1–4 周短循环连续交付达标 DoD 的可用软件并快速采纳干系人反馈"]
          explain: 没有哪一种方法独霸天下——高端项目甚至能在关键底层状态核验上用一次 **形式化模型**，在交互试水上造一个 **快速原型**，在整体交付上运行 **敏捷冲刺**。
      - card:
          title: 例题：千万别把“两天赶出来试探路子的可抛弃原型”，直接带病上生产当正统产品用
          body: |
            几乎每家公司都发生过同一个惨案：“老板原本说先花两天用最快最脏的写法拼一个展示原型给投资人看看思路，结果演示大受好评，老板拍板明天直接加十个功能拿这个‘原型’上线。”后果往往极其惨烈：
          reveal:
            - title: 第 1 步：为什么“可抛弃探索原型”绝不适合直接升格成生产系统？
              body: 造探索原型追求的是一切让路给“48 小时验证假设”——里面通常跳过了权限隔离校验、零自动化测试、写死了单机全局变量且毫无清晰边界。如果舍不得推倒按照正式设计重构，它会在上线半年内演化成每天修一处崩三处的无底技术泥潭。
            - title: 第 2 步：正确使用原型法两步走——“低成本验真 + 果断按正统工程重构重建”
              body: 拿到原型试验验证的真正宝贝（“原来用户根本点不到右上角按钮，改成居中大卡片转化翻倍。”或“实测异步消息能扛住峰值。”）后，把草稿代码归档留作参考，以干净正规架构和完整测试重新搭正式骨架。
            - title: 第 3 步：什么时候反过来只做局部形式化？
              body: 对普通商城页面画蛇添足做全量数学形式化证明性价比太低；而一旦遇到如支付状态机绝不准出现“既退款又发货”双态冲突等核心一小段逻辑，画一张严密状态表用工具穷尽检查（轻量形式化）往往只需半天却能防住千万级资损。
      - item:
          id: q-throwaway-prototype-trap
          type: choice
          prompt: 产品团队为了检验某个新推荐算法页面是不是真能吸引学生点击，花 1 天半写了一个硬编码配置、没有写测试、也没顾上权限校验的粗糙前端展示页（**可抛弃原型**）。确认想法确实很受欢迎后，团队下一步最健康稳妥的做法是什么？
          options:
            - text: 收下通过原型验证到的核心体验结论，随后按清晰架构边界、自动化测试与规范安全要求正式设计开发产品版，而不应把满是硬编码的临时草稿原型直接拖进多年长期生产维护
              correct: true
            - text: 直接宣布这 1 天半拼出来的硬编码草稿原型已经完工，以后十年就直接在它上面不断糊补丁叠加几百个功能
              why: 临时草稿为了抢 48 小时验证速度牺牲了一切可维护性与安全结构，直接当长寿主库维护代价会指数爆炸
            - text: 因为用过原型法，所以从此禁止再看任何用户数据反馈
              why: 原型法的核心价值正是花最小成本验证未知假设、降低方向风险。
          explain: 原型是用来验证想法的草稿；验证完要按清晰的架构、自动化测试和安全要求重新做正式版，不能把满是硬编码的原型直接上线。

  # ======================================================================== 工程原则
  - id: principles
    chapter: 工程原则
    title: 抽象、封装（信息隐蔽）、层次化与 Boehm 基本原理
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 小王写的选课系统把“课程数据是存在本地字典还是存在 SQLite 文件”的内部细节全部直接暴露在外面：全站 20 个不同页面函数各自直接手伸进它的内部字典结构 `courses_db[id]["seats"] -= 1` 去读写。三个月后为了支持重启不丢数据要换成真正数据库表，小王崩溃地发现必须同时重写 20 个文件里的成百行代码。他违背了哪条最底层的软件工程基本原理？
          options:
            - text: 违背了 信息隐蔽 / 封装（Encapsulation）与抽象（Abstraction）。内部极易变更的存储与实现机制必须严严实实关在清晰模块接口后面，外面只准调用抽象行为（如 `reserve_seat(course_id)`）而严禁偷窥触碰内部数据结构。
              correct: true
            - text: 因为系统代码绝不应该拆分成超过 1 个独立函数，全写进 1 万行的单文件里就不用换了
              why: 全挤进巨型单文件会把复杂度拉满导致完全无人看得懂；正是靠 **分解抽象 + 封装隔离变更点** 才能把上百万行系统拆成一个个可独立演进的好改部件
            - text: 因为 Python 字典绝不能保存任何课程数字
              why: 错不在起初用了字典，而在没有用清晰契约接口把“目前暂时用字典存”这个易变设计决定隐藏封装在模块内部。
          explain: 20 个页面都直接改内部字典，存储方式一换就要改 20 处；把细节关在接口后面，外面只调用 `reserve_seat` 这样的抽象动作，改动就只在一处。这一课讲对抗复杂性的几条核心原则：**分解与抽象、封装、层次结构，以及 Boehm 的基本原理**。
      - card:
          title: 应对复杂性：抽象与层次分解
          body: |
            人的大脑工作记忆极其有限，面对百万行代码先用两把工具降维：
            - **抽象（Abstraction）**：抓住模块“对外承诺做什么”，刻意略去此刻无关底层细节，形成高层调业务、底层做具体动作的清晰层次（Hierarchy）；
            - **层次分解（Hierarchy）**：树状逐层拆开，让每位开发只在自己所在层的少数几个稳定概念里安心干活。
      - item:
          id: q-abstraction-vs-hierarchy
          type: choice
          prompt: 面对一个上百万行的大型软件工程，为什么强调按 **分层抽象（Levels of Abstraction）** 来组织代码结构？
          options:
            - text: 让高层业务逻辑只需调用简洁清晰的抽象动作（无需同时把底层文件读写与格式细节全部塞进人脑），每层人脑认知压力控制在合理范围内
              correct: true
            - text: 因为 Python 运行规则规定一个程序必须强行拖慢运行速度才叫层次
              why: 合理分层抽象旨在降低人类理解与局部改动的复杂度，并不会牺牲正常业务性能
            - text: 为了让上层代码直接把底层内部私有变量全删光重写
              why: 分层与抽象要求上层只面向下层清晰稳定的公开职责边界交互，而不随意穿插耦合底层私有实现
          explain: "**抽象把繁杂细节藏起来，层次把大型问题自顶向下折成小块——合起来就是对抗复杂性的最强底座。**"
      - card:
          title: 封装与信息隐蔽（Encapsulation）
          body: |
            - **封装 / 信息隐蔽**：谁预见到哪部分实现将来最可能改（例如数据库换表、算法提速或外部通道换家），就把这个容易变的设计决策严严实实藏进该模块背后，外部调用方只认固定接口。
      - card:
          title: 逐步求精、推迟实现与质量保证（1.4 工程基本原理）
          body: |
            工程教材里反复强调的三条经典准则：
            - **推迟实现（Defer Implementation）**：先把“逻辑上模块职责与对外契约长什么样”划清定准，先别急着一上来死抠物理细节（先用简单接口把边界定稳，日后物理存储怎么换都无伤外部）；
            - **逐步求精（Stepwise Refinement）**：面对大难题先写出顶层几步骨架，再一层层按模块细化下去；
            - **质量保证贯穿全过程（5、1.4）**：质量靠预防与早检查造出来，绝不是全系统写完最后一天突击加两句测试补得出来的。
      - item:
          id: q-encapsulation-benefit
          type: choice
          prompt: 模块设计里强调的 **信息隐蔽 / 封装**，除了“看起来整洁”之外，在长期多年软件维护里带来的最巨大实际工程收益是什么？
          options:
            - text: 把“最有可能发生变化的实现秘密（例如存数据格式、缓存淘汰策略、外部支付通道）”封锁在清晰稳定接口之内，使将来替换升级内部实现时几乎零波及外部调用方代码（改变代价局部化）
              correct: true
            - text: 把所有变量名字改成随机汉字密码防止自己团队其他成员看懂代码
              why: 封装隐藏的是“易变的内部实现约束细节”，而模块对外的接口契约和文档必须极度清晰透明。
            - text: 只要写了封装这个词，程序就再也不需要任何网络或数据库就能运行
              why: 封装改变的是代码依赖与变更传播半径（耦合度），并不会凭空消除外部功能需求
          explain: Parnas 经典洞见记住一句话：**模块化分解的最好边界，不是按流程前后顺次砍，而是按“把最容易改变的设计决策各自独立关进不同的房间里（信息隐蔽）”。**
      - card:
          title: 例题：给“消息通知功能”设计一套经得起 5 年换接口折腾的封装与抽象层
          body: |
            假设业务系统到处要在下单、退款、重置密码时给用户发提醒。最开始公司只接了邮件 SMTP；第二年新增手机短信；第三年又想接入 App 站内推送。对比“散落硬编码” vs “抽象封装分层”：
          reveal:
            - title: 第 1 步：反模式——业务层各自直接连死特定邮件库发包
              body: 订单、支付、注册等 15 个核心业务模块全都各自复制粘贴引入特定第三方邮件 SDK 和密钥拼接格式。一年后公司换短信供应商或要多通道切换时，你必须把这 15 个核心模块全改一遍、全测一遍，极其容易改挂下单主流程。
            - title: 第 2 步：正确做法——抽出一层清晰小抽象 `Notifier.notify(user_id, event)` + 隐藏实现细节
              body: 业务代码只管向稳定的高层抽象接口喊一句 `notifier.notify(uid, "order_paid")`（完全不关心底层发邮件、短信还是推通知，**推迟与隐藏物理实现。**）；底下具体的 `EmailNotifier`、`SmsNotifier` 全部封装在专门的通知适配器层里。
            - title: 第 3 步：分层收益
              body: 从此以后不管底层换 10 家短信商还是切换异步队列发送，上层业务代码**一行都不必改**；同时我们在做单元测试时也能轻而易举换上轻量假 `FakeNotifier` 验证行为。
      - item:
          id: q-principles-concepts-match
          type: match
          prompt: 把四个关键工程原则术语与最贴合的定义/实战做法精确配对。
          pairs:
            - ["**抽象（Abstraction）**", "对复杂部件提炼出外显本质职责与调用契约，屏蔽当下不必操心的细碎内部机制"]
            - ["**封装 / 信息隐蔽（Encapsulation）**", "将极易变动的数据表示和底层细节锁在稳定对外接口后面，把变更影响严格关在单一模块内"]
            - ["**层次分解（Hierarchy）**", "把复杂系统逐层拆成明确上下协调阶梯（例如高层业务流程 → 中层领域逻辑 → 底层存储驱动）"]
            - ["**质量预防胜于事后补救**", "在设计契约、编码规范与早期评审持续防错，而非全工程写歪后企图仅靠末期测试全修好"]
          explain: 抽象提炼本质职责，封装把易变细节关在接口后面，层次把大问题逐层拆小，预防胜于事后补救：四条原则都是为了控制复杂度。
      - item:
          id: q-complexity-cognitive-limit
          type: choice
          prompt: 为什么所有现代软件工程准则（模块化、层次抽象、封装）归根结底都围绕着 **“人脑认知有限性”** 设计？
          options:
            - text: 因为开发者在同一时刻脑中只能稳稳装下很少几个独立细节；只有把大问题分解成内聚度高、接口干净且隐藏内部变化的小模块，工程师才不需要同时理解全盘一百万行代码也能安全正确地修改其中一块。
              correct: true
            - text: 因为现代 CPU 硬件不允许函数体超过 50 行，否则会直接烧毁主板
              why: 机器根本不在乎代码写得多么面条纠缠（哪怕一万行全塞进一个巨函数里电脑照样按顺序算）；模块化、分层与封装全是为了**解放人脑可读性与控制变更局部性**。
            - text: 只要不加任何注释、把所有函数拆成互相全局穿插跳转就能减少认知负担
              why: 高交叉耦合与隐藏全局变量反而让开发者改一行前必须通读十个不相关文件，极大爆破认知负荷。
          explain: 人脑同一时刻只能装下很少几个细节；把大问题拆成接口干净、隐藏内部变化的小模块，才不用同时想所有事。

  - id: assessment
    chapter: 工程原则
    title: 过程评估改进、GQM（目标–问题–度量）与敏捷实证
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一家公司新请来的指标管理员直接向研发下发命令：“从明天起大家日报表上必须天天填满‘代码总行数’、‘开了几次会’和‘平均每天提交次数’——写越多行数奖金越高。”结果大家立马把本来 10 行精炼的函数拆成 100 行废话，每改一个标点符号立刻提交一次刷次数……软件质量反而暴跌。这正踩中了度量界哪种本末倒置错误，哪套标准能正本清源？
          options:
            - text: 违背了 GQM（目标–问题–度量） 的自顶向下顺序。绝不能拍脑袋先随便选几个容易凑数的数字发KPI；必须先立真实工程 目标（Goal） → 拆出要回答的具体 问题（Question） → 最后才挑选支撑这些问题的 客观度量（Metric）（且配对制衡指标防刷分）。
              correct: true
            - text: 因为每行代码写得多长就 100% 等同软件运行得有多安全
              why: 代码行数多往往意味着冗余重复甚至膨胀坏味，把单纯数量指标当考核激励立刻触发“刷分注水扭曲真实行为”（Goodhart 定律）。
            - text: 解决办法是永远禁止团队收集任何客观测试通过率或故障数据
              why: 工程需要严谨客观的定量观察数据（如发布失败回滚率、缺陷密度趋势）辅助决策，但前提是选对围绕真实目标的 GQM 指标。
          explain: 先随手挑几个好凑的数字当考核，大家就会去刷数字，而不是把工程做好。GQM 要求先定目标，再拆问题，最后才选度量。这一课学 **软件过程评估与改进、GQM 度量方法，以及敏捷团队怎样持续小步改进**。
      - card:
          title: 软件过程评估与 GQM：先立目标，再提问题，最后挑指标
          body: |
            开展过程改进最怕变成折腾文档形式主义。核心测量法是 **目标–问题–度量（GQM）**：
            1. **Goal（目标）**：先明确要改善哪项工程能力与谁的痛点（例：“降低上线后严重回归故障对用户的影响”）；
            2. **Question（问题）**：拆出要核验该目标的具体问题（例：“缺陷都在什么阶段被抓住？修好上线平均多快？”）；
            3. **Metric（度量指标）**：最后才定数据（例：上线后生产故障逃逸比例 + 故障平均恢复时长趋势 + 评审测试拦住占比）。
      - card:
          title: 基于框架的评估与敏捷实证持续改进
          body: |
            - **过程参考框架评估**：大型强合规机构常借成熟度框架（如 CMMI 或 ISO 标准体系）对照清点自己过程哪块漏了基线控制；但切忌变成“只为拿证书造假表格”。
            - **敏捷环境下的评估改进**：把反馈圈从年/季缩到每个冲刺结尾——靠**真实可工作软件增量、冲刺回顾会小行动项、构建通过率与流动周期数据**快速实验微调工作法。
      - item:
          id: q-gqm-order
          type: order
          prompt: 请按照 **GQM（目标–问题–度量）** 框架设计工程测量方案的正确自顶向下步骤顺序排列。
          steps:
            - Goal（明确目标）：确定改善对象、真正意图以及针对哪类人员与业务视角
            - Question（提出问题）：把抽象目标细化成能够衡量成败和排查病根的一组具体工程问题
            - Metric（设计度量指标）：挑选可客观采集且带反刷分制衡的定量与定性数据去回答前述问题
            - 解读与改进闭环：定期审视度量趋势是否真推动了原定目标达成，并调整流程短板
          explain: 每次听到有人张嘴就喊“我们定个考核代码量 KPI”时，拿 **G → Q → M** 三步反问他一句：“你这数打算回答哪个核心工程问题，想达成啥目标？”
      - card:
          title: 例题：给“上线总是返工出故障”设计一组带制衡、不容易被刷分玩坏的 GQM 方案
          body: |
            如果团队总抱怨“最近发版经常半夜救火回滚”，试着用 GQM 三步设计一组真正助推质量而不是让人互害的指标：
          reveal:
            - title: 第 1 步：定下共同 Goal——“提升版本交付稳定性并缩窄缺陷修复闭环”
              body: 明确不是为了抓个人扣钱，而是定位流程卡在哪里导致隐患流进生产环境。
            - title: 第 2 步：拆分 Question——“漏过测试到生产的故障有多少？合并集成前早检拦了多少？”
              body: 如果仅仅看“上线后报出 bug 数量少了”，有人就会故意不登记生产问题甚至拖延不发布新版本。所以必须在第 3 步做组合制衡。
            - title: 第 3 步：选成对制衡的 Metric（Delivery + Stability 平衡指标）
              body: 把**变更失败回滚率**、**发布频率/平均变更前置期** 与 **CI 自动化回归测试覆盖趋势** 成组观察——既不想因为怕出事半年不发一版，也不允许牺牲测试猛抢快发。回顾会上一起对着这几组趋势找出薄弱关卡加厚。
      - item:
          id: q-gqm-metrics-gaming
          type: choice
          prompt: 针对“提高上线质量与研发效率”的目标，下面哪一组 **度量指标组合** 最符合 GQM精神且最不易被单一刷分动作扭曲失真？
          options:
            - text: 成对联合观测“生产变更失败回滚率 + 故障恢复耗时 + 正常业务需求按期交付频率”（速度与稳定性双向制衡，防止拖延不发布刷低错误数或跳过质量抢速度）
              correct: true
            - text: 只把“程序员每天按键盘敲出的总代码行数与新增 Bug 条数”当作全公司唯一排名榜
              why: 纯敲字行数奖励了臃肿复制粘贴，直接把“发现记录 Bug 数”作为扣罚标准则只会诱导大家私下隐瞒不记缺陷。
            - text: 把评估周期拉长成每十年看一次数据，期间完全不看任何测试结果与回顾反馈
              why: 敏捷环境下应缩短反馈与改进周期，每轮通过真实增量与关键过程数据小步微调
          explain: "**没有任何单一数字能完美代表全部工程健康度，必须用 GQM 从目标出发、挑选成组互相牵制的客观指标。**"
      - item:
          id: q-agile-improvement-cycle
          type: choice
          prompt: 对比大型标准参考框架评估（如 CMMI）与敏捷项目中的过程改进，敏捷环境最突出的日常自愈改善节奏特点是什么？
          options:
            - text: 以短冲刺为节拍，每个冲刺末借回顾会与自动化构建、测试反馈直接定位当期过程阻碍，立即选一两个具体小改进措施并在下一轮就检验效果
              correct: true
            - text: 敏捷项目坚决拒绝一切工具数据或过程改进回顾，永远只准按一年前的旧工作习惯一成不变执行
              why: 持续检视与适应（Inspect and Adapt）正是敏捷与经验型过程的灵魂。
            - text: 敏捷团队绝对禁止跟客户看任何产品成果，一切等五年后审计评估会
              why: 正相反，敏捷靠高频向真实干系人演示可运行软件以及高频回顾会议形成双闭环高频调优
          explain: 敏捷的改进以冲刺为节拍：每轮回顾会找出当期的阻碍，选一两个小改进，下一轮就检验效果。

  # ======================================================================== 协作与方法选择
      - item:
          id: q-assessment-framework-vs-cargo
          type: choice
          prompt: 组织引入 CMMI 或内部工程度量评价体系时，最容易落入哪种失败形式主义，正确姿态是什么？
          options:
            - text: 切忌为了拿认证证书或应付审计“突击补填假表格”；改进评估必须围绕真实的业务痛苦目标（GQM），检验流程有没有实质降低故障率并加快安全交付
              correct: true
            - text: 只要在墙上挂好流程图海报，不用管线上每天崩几次就算满分改进了
              why: 过程框架是对照体检清单，绝不是装点门面的墙纸。
            - text: 一旦用过一次度量框架，接下来一百年都不允许再听一线开发人员吐槽流程卡点
              why: 一线工程师每日直面构建、测试与协同痛点，持续倾听并小步改进才是评估生命力所在
          explain: "**框架是指南针不是紧箍咒；度量服务于改进而非形式主义造假。**"

  - id: teams
    chapter: 协作与方法选择
    title: 团队结构、个体认知负荷与 Brooks 沟通平方增长定律
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个本来只由 `4` 位熟练成员维护的工程项目已经有点快赶不上月底交付死线了。焦急的项目经理拍板：“赶紧再从别的组急调 `4` 位新同事进来，人手直接翻倍成 `8` 人，工期一定能对半缩短、两天就赶完。”结果一个月后进度居然**比原来 4 个人自己干还要慢了一截**。如果这 8 个人每两个人之间都需要互相协调对齐，沟通连线从多少条暴涨到多少条？
          options:
            - text: 两两沟通路径 `n(n - 1) / 2` 从 `6` 条猛增到 `28` 条（人数翻 2 倍，协调通路爆涨快 5 倍）；外加老员工得停手培训新人带上手、任务拆分接缝变多，所以“项目后期盲目硬加人往往更慢”（Brooks 定律）。
              correct: true
            - text: 沟通路径只从 `4` 条变成 `8` 条而已，8 个人绝对严格等于 4 个人研发效率的两倍整数
              why: 当大家面对同一个强耦合模块需要相互对接口与设计决策时，点对点沟通成本按 **`n(n - 1) / 2` 近似平方增长**。再加新人上手磨合抽走老人时间，后期加人反而越加越慢。
            - text: 因为只要团队总人数超过 4 人，每个人的平均打字速度就会在物理上下降一半
              why: 大公司有几千名工程师协同工作，秘诀不是无限堆进同一个强耦合小模块里互相开会扯皮，而是先切出边界清晰的**自治小团队（减少跨组协调线）**。
          explain: 两两沟通路径 `n(n - 1) / 2` 从 `6` 条涨到 `28` 条，老成员还要停手带新人，所以项目后期硬加人往往更慢（**Brooks 定律**）。这一课讲 **团队心理、认知负荷、Brooks 定律和康威定律**。
      - card:
          title: 团队沟通上界公式：`n(n - 1) / 2` 与 Brooks 定律
          body: |
            假设团队有 `n` 名成员彼此需要互相协同对齐，两两之间可能的直接沟通路径总条数是组合数 **`C(n, 2) = n(n - 1) / 2`**：
            - **`4` 人团队**：`4 × 3 / 2 = 6` 条路，大家围一张小桌十秒全对齐；
            - **`8` 人团队**：`8 × 7 / 2 = 28` 条路（人数仅 ×2，连线已爆增到近 **4.7 倍**）；
            - **Brooks 定律**：向已经延期的软件项目后期强行塞入大量新人，沟通协调剧增 + 熟练成员抽时间培训新人上手，短期往往**越救火越慢**。
      - card:
          title: 个体认知、团队心理安全与“小自治团队 + 清晰接口”
          body: |
            既然加人容易被平方沟通拖垮，百人公司怎么还能做成大项目？靠两件事：
            - **划清模块边界拆小团队**（如著名的“双披萨团队” 5–8 人，内部分工紧凑；团队之间**只通过严格定好的 API 契约极低频对齐**，大幅剪掉跨群连线）；
            - **建设心理安全与团队分工默契**：新人入职前有清晰文档和可重复测试保护网，组内成员敢于坦诚提出隐患与代码疑问而不怕嘲讽打压。
      - item:
          id: q-comm-channels-4-to-8-ex3
          type: number
          prompt: 当一个必须全员两两彼此沟通对齐的小组人数从 `4` 人扩充到 `8` 人时，直接沟通路径上界 `n(n - 1) / 2` 增长成了 **多少条**？（填整数）
          answer: 28
          explain: "计算：`8 × (8 - 1) / 2 = 8 × 7 / 2 = 28` 条。对比原来 `4 × 3 / 2 = 6` 条，足足翻了四倍多（`28 - 6 = 22` 条新协调链路），这就直观算出为什么人数翻倍绝不代表效率翻倍。"
      - card:
          title: 例题：同样是把公司扩大到 `10` 人或 `40` 人，为什么“拆成高内聚独立小分队”比“40 人全部拉同一个大群乱改同一个库”快几倍？
          body: |
            看一组算术对比（包括 `n=5 → 10` 条与 `n=8 → 28` 条）：
          reveal:
            - title: 第 1 步：混乱耦合大一锅（1 个 12 人的杂乱组共改同一堆耦合代码）
              body: "`12 × 11 / 2 = 66` 条两两拉扯线。每天光是一半人改错接口撞车、开两小时大群会议同步谁动了哪张表、老员工给 6 个新人讲解历史潜规则就吃光一天工作时间。"
            - title: 第 2 步：按清晰接口境界拆成 `3` 个 `4` 人自治小组（只靠明确接口版本契约联调）
              body: 每个 `4` 人小组各自组内仅有 `6` 条高效短路径（加起来才 `3 × 6 = 18` 条小圈协调），组间只需要少量架构对齐（如明确好 REST 接口或消息格式与测试防护网）即可平行各推各的研发。
            - title: 第 3 步：理解康威定律（Conway's Law）
              body: 组织怎么切分沟通结构，造出来的系统架构模块边界往往就长成什么样。想做松耦合的清晰系统架构，往往先要把负责它的团队边界与职责一起理清晰。
      - item:
          id: q-comm-channels-5-members
          type: number
          prompt: 一个 `5` 人敏捷核心小组（所有 5 名成员相互直接协同沟通）：此时小组内部两两沟通链路 `n(n - 1) / 2` 一共有 **多少条**？（填整数）
          answer: 10
          explain: "`5 × 4 / 2 = 10` 条。哪怕只从 `4` 人（`6` 条）多加 `1` 个人到 `5` 人，就要多出来 `4` 条新协调配合路线。"
      - item:
          id: q-brooks-law-reasons-multi
          type: choice
          multi: true
          prompt: 为什么“向已经落后的后期软件项目盲目增派新人救火，往往会令项目完工得更慢（Brooks 定律）”？（多选）
          options:
            - text: 团队两两直接沟通协作路径上界按 `n(n - 1) / 2` 随人数近似平方级别急剧膨胀，对齐决策耗时翻倍上升
              correct: true
            - text: 新成员无法瞬间直接产出有效代码，反而需要抽调最宝贵、原本正在核心产出代码的老员工停下手头开发去带人、讲体系与修踩坑
              correct: true
            - text: 如果任务模块本身之间存在强顺序依赖且难以被切分成干净独立接口，再多人塞进同一块代码只会互相覆盖冲突拖慢合入速度
              correct: true
            - text: 因为新人加入后原有代码行数会自动翻倍，导致构建工具无法通过语法检查
              why: 真实原因全在客观工程协同开销：平方增长的沟通协调、培训分心带宽占用以及不可拆分的先后耦合路径。
          explain: 如果早期确实发现远期工作量太大需要扩编，必须在 **早期提前** 规划清晰模块接口境界与新人自动化护航文档，切忌最后两周临时往里猛塞救火员。

      - item:
          id: q-conways-law-boundary
          type: choice
          prompt: 讲组织协作时经常提到，一个大型项目拆出的多个小组如果界限不清、天天需要跨十个群吵着修改同一堆强耦合全局函数，往往造出极其混乱耦合的大泥球架构。这说明团队组织设计应注意什么？
          options:
            - text: 合理按职责边界划分小规模自治团队，让绝大部分协同留在组内高频解决（少通道数），跨组仅靠清晰稳定的公开接口契约低频对齐
              correct: true
            - text: 应该把公司里全部 100 名开发人员强行绑定必须每 5 分钟两两全体互发一条确认信息
              why: 100 人两两互传要近五千条通道，会立刻瘫痪所有产出。
            - text: 只要完全禁止两组人使用同一种编程语言或接口文档就能防耦合
              why: 健康架构和组织协同依赖的是清晰模块职责与接口边界契约，而非互相屏蔽沟通。
          explain: 理顺了人际与组织边界，技术架构边界往往自然就清楚了一大半。

  - id: feedback
    chapter: 协作与方法选择
    title: 干系人反馈、代码评审、持续集成与迭代演示风险定位
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 在工程实战里，有团队把**三件事**当作日常必须坚持的压舱石：a. 每次代码合并进主干前必须由另一位同事做**代码评审（Code Review）**；b. 成员每天多次提交小步代码到主干并自动触发**持续集成（CI）**构建测试；c. 每次短短几周小轮次结尾一定拿真正在跑的版本给客户开**演示评审会**。这三个动作可不只是走形式——它们分别精准狙击着软件工程哪三颗最大毒雷？
          options:
            - text: 依次精准压制：a. 缺陷潜入与设计盲区/知识孤岛风险；b. 多人分支长期隔离偏离导致的末期集成大冲突爆炸风险；c. 闭门做出来的软件不符合客户真实意图的需求偏差风险。
              correct: true
            - text: 三个动作其实作用一字不差完全重叠，随便保留其中哪一个把另外两个全废掉就行
              why: 代码评审护“微观设计缺陷和共享认知”；持续集成护“多改合一立刻验证不撞车”；客户演示护“方向没做跑偏”——三者各自守住一条不可替代的风险维度。
            - text: 三个动作主要是为了浪费开发人员周末休息时间
              why: 这些恰恰是花小钱防巨雷的高收益工程惯例：半小时同侪评审省下三天线上灾难排查，天天小合并省下两周合代码地狱。
          explain: 代码评审拦缺陷和知识孤岛，持续集成防分支长期隔离、最后集成大冲突，短周期演示防做出来不是客户想要的。这一课讲 **怎样应对干系人的不确定性**，以及这 **三道风险防线**。
      - card:
          title: 应对干系人分歧与需求模糊
          body: |
            软件最头疼的问题之一是客户嘴上说的和心里真想要的常常对不上：
            - **干系人（Stakeholders）利益与诉求冲突**：买单方想要省成本、运营想要花哨统计、普通用户想要一步到底极简——必须尽早识别并用真实模型和画面把冲突摆在桌面权衡；
            - **面对不确定性**：不要在模糊处靠猜写死三个月大工程。用高频演示可交互真成品引导干系人及时说出“不对，我要改这”。
      - card:
          title: 工程实践三剑客各自到底在狙击哪类项目大雷？
          body: |
            把三件事连成一条风险防线链：
            - **代码评审（Code Review）**：在合入前多一双清醒眼睛扫出逻辑缺陷、命名不清与结构隐患，同时**打破知识孤岛（防止“全组只一个人懂某关键模块”）**；
            - **持续集成**：每天多次小步合入主干立刻全自动构建跑测试，尽早暴露合并与回归冲突，彻底告别“各自开发一月最后一天合入全崩”；
            - **每轮真演示（Sprint Demo）**：防“方向做跑偏”的最大利器——早期纠偏成本几乎为零。
      - item:
          id: q-three-practices-risks-ex4-match
          type: match
          prompt: 把下面四种高频工程实践或反模式与它们各自最核心降低（或引爆）的项目风险匹配。
          pairs:
            - ["**合并前要求另位成员做代码评审（a）**", "拦截逻辑缺陷与不良设计进入主干，同时在团队间扩散知识消除“单点懂王”风险"]
            - ["**每天多次合入主干并自动跑构建测试（持续集成 b）**", "消除分支长期隔离引发的合并冲突堆积与集成爆炸，让集成破坏几分钟内暴露"]
            - ["**每个短迭代结尾向客户演示可运行真实软件（c）**", "对抗需求理解偏差与模糊，尽早把客户真实想法拉回正轨避免做错方向"]
            - ["**各自拉长支闷头写两月，最后一天才一口气合代码联调**", "极度危险“集成地狱”反模式：接口早改歪却浑然不知，最终爆发百处相互咬死的冲突与缺陷"]
          explain: 每次别人质疑“天天合主干还互审是不是太麻烦？”时，就把这一张**风险对照表**直接甩给他看。
      - card:
          title: 例题：为什么“只有 1 个人写完就直接上线、从来不做 Code Review”的团队哪怕短期感觉很快，半年后却走不动？
          body: |
            哪怕某名资深程序员号称自己水平极高写代码从不手滑，跳过代码评审（Code Review）照样会让团队早晚踩到两颗硬钉子：
          reveal:
            - title: 第 1 步：“巴士系数 = 1”（Bus Factor = 1）的致命知识孤岛
              body: 整个结算逻辑全由小李一个人闭眼写成并自己合进主干——全组里只有小李知道这里为什么写了一个奇怪常量、哪里埋着坑。一旦某天小李休假生病甚至离职（或者半夜出故障他没带手机），团队里谁都不敢动也修不动这堆黑盒。通过每次强制由同事审一次代码，全队自然而然共享熟悉核心脉络。
            - title: 第 2 步：持续集成（CI）让小碎步变成最安全的节奏
              body: 哪怕改错一小行边界，因为今天才合入了 30 行小改动、十分钟内就收到 CI 红色失败邮件，闭着眼睛在刚才那 30 行里三分钟就找到修好。比起攒一个月积了 8,000 行大修改再查错，效率高出整整一个数量级。
            - title: 第 3 步：注意区分“高价值评审”与“只挑空格分号低效挑刺”
              body: 缩进空格与格式交由自动化格式化工具一键统一；人类同侪评审把宝贵注意力聚焦在：**“边界逻辑稳不稳？接口命名好不好懂？测试有没有测到位？”**
      - item:
          id: q-stakeholder-ambiguity-demo
          type: choice
          prompt: 在客户对最终操作流程自己还说不太清楚（存在高度不确定性）的业务开发里，下面哪种沟通检验方式最有效、最能及早避免造出没人要用的系统？
          options:
            - text: 尽早并在每个短周期末尾用可点击的原型或可实际运行的真实增量页面现场演示给不同干系人看，把分歧和误解在几周内尽早吵清楚修正
              correct: true
            - text: 从第 1 天开始关起门躲在屋里闷头闭关写八个月代码，直到最终验收那天再第一次拿给客户看
              why: 在不确定性与干系人歧义高时拉长不见面的开发期，几乎必然导致最终产品与真实期望大幅脱节返工
            - text: 彻底不理睬任何业务方与最终使用用户的诉求，自己随便猜测他们喜欢啥按钮
              why: 工程需要系统调研、协调不同干系人并用可运行小增量尽早确认真实语义
          explain: 最后一课收尾整门 `P.4.1`：**开源与现代团队真实如何用 Issue → Fork/分支 → PR → 评审流转协作，以及全章方法论汇总决策。**

  - id: collaboration
    chapter: 协作与方法选择
    title: 现代分布式协同工作流与项目过程选型实战总览
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个分散在三个不同城市、互相从没见过面的 15 人开源工具团队，既不想天天聚在一起开两小时语音大会，也不希望谁把主分支搞乱，他们是怎么靠一套标准化协同工作流把大型软件写得有条不紊的？（GitHub 协作流）
          options:
            - text: 靠 异步化可追溯文本协同流（Issue 讨论定界 → Fork/独立分支开发小提交 → 拉起 Pull Request 自动跑 CI 检验 + 异步代码评审 → 达标合并），既留下全过程决策依据又不把人捆死在同一时刻开会。
              correct: true
            - text: 大家每天轮流把整个源码压缩打包用邮箱附件发来发去，谁后收邮件谁覆盖别人全部修改
              why: 原始发 ZIP 包覆盖不仅立刻引发灾难级丢失冲突，也完全丢失改写动机、审查轨迹与自动化校验门禁
            - text: 把 15 个人的密码全写成同一个，共同登录一台远程桌面上改同一个文档
              why: 现代协同通过分支隔离并行作业、Pull Request 讨论审查与自动化集成门禁实现高效可控异步共创
          explain: 用 Issue 讨论、分支开发、Pull Request 跑 CI 和异步评审，每一步都留下文字记录，大家不必同时在线也能协作。这一课讲 **异步的现代团队协作流程**，并把前面学过的内容串起来。
      - card:
          title: 团队群体沟通与现代 Issue–Branch–PR 标准协同环
          body: |
            大协作要兼顾**不频繁开会拖垮专注度**与**不丢上下文**：
            - **结构化异步协同流**：发现/提出需求先开 **`Issue`** 写明背景复现并达成方向一致 → 在自己独立分支/`Fork` 上小步开发附清晰提交说明与验证 → 发起 **`PR（Pull Request）`** → 触发 CI 自动化构建校验 + 同伴异步精确到行的代码评审修订 → 通过合入主干。
            - **同步 vs 异步**：琐碎进展与明确代码修改走异步文字留痕（零打扰且新人随时可查上下文）；真正高歧义重大架构冲突再短开高密同步讨论定板。
      - card:
          title: 整套 `P.4.1` 方法选择决策总图：从过程到团队落地
          body: |
            把整门课四章串成一线：拿到任何陌生软件工程任务时，自问这四条：
            1. **定模型与剪裁**：需求有多稳？是否受合规审查？→ 在瀑布/V模型、增量、敏捷间挑选并按风险剪裁；
            2. **拆节奏与预测**：短循环真交付 + 实测故事点算发布期，容量不够坦诚砍范围；
            3. **守边界与测量**：用封装与抽象隔开易变点，拿 GQM 指标监督不搞形式刷分；
            4. **管团队与避险**：小自治组少拉耦合线，用 PR + 评审 + CI + 演示卡死核心风险。
      - item:
          id: q-pr-workflow-order
          type: order
          prompt: 请将现代远程工程团队与开源协作推荐的一套标准、可审计安全协作闭环从头到尾排好顺序。
          steps:
            - 先创建 Issue / 任务卡写明需求动机或缺陷复现细节并对齐目标，避免埋头白写跑偏
            - 从干净主干拉出独立主题分支（或 Fork），小步完成实现与对应自动化测试验证
            - 提交 Pull Request（PR）并自动触发持续集成门禁跑完构建检查
            - 邀请至少一名成员逐行异步评审逻辑与清晰度并修订意见，全部绿灯通过后合并进主干
          explain: 把 Issue、独立小分支、自动化检查、PR 评审和干净合并养成肌肉记忆，走入任何现代技术团队第一天都能无缝上手。
      - card:
          title: 例题：什么时候“拉 3 个人连麦半小时（同步）”反而比“在 PR 评论区来回文字吵三天（异步）”高效十倍？
          body: |
            不要教条地非黑即白选异步或同步。看两组对比就能一秒拿捏分寸：
          reveal:
            - title: 第 1 步：高度明确清晰的技术调整与常规合入 → 绝对走异步文本留痕
              body: 改一个边界检验、修一个已知表单错误或者按定好接口做功能实现，在 Issue / PR 里清清楚楚放好上下文和校验记录即可——同事按自己空闲窗口审完批过，不打断任何人的深度编程心流，顺便替半年后入职的新人留下一份完整活文档。
            - title: 第 2 步：需求存在根本误解或两位工程师针对核心方案在评论区打字来回辩论 15 轮仍未达成一致 → 果断转短同步对话
              body: 当文字沟通出现语气误解或高维度概念分歧时，继续打长段文字耗时又伤感情；约一次有明确议程的 20 分钟白板对齐，对齐共识后把**最终决定的结论反手写回 Issue/文档留档**——两全其美。
            - title: 第 3 步：记住每增一分沟通成本都是实打实的工期钱
              body: 减少无意义泛泛闲聊会议、把常规协同交由自动化 CI 与清晰 PR 规则驱动，这正是现代小团队能支撑大规模工程交付的关键原因。
      - item:
          id: q-sync-vs-async-comm
          type: choice
          prompt: 关于跨地区分布式研发团队何时选择 **异步文本协同（Issue / PR）**、何时切换到 **短时同步会议**，下列哪项策略最符合高效工程协作原则？
          options:
            - text: 常规代码变更审查、进度对齐与决策记录优先采用可追溯异步协作（保护深度专注工作时间）；仅在遭遇高歧义重大需求分歧或关键线上故障时开精简短同步会破局，并随即把结论回写沉淀进文本档案
              correct: true
            - text: 不管多微小的变量改名都要每天强制把全公司 50 人关进语音会议室坐满六小时逐字汇报
              why: 过度沉重无目标的同步大会会彻底撕碎全部开发人员整块专注编程心流，且无任何可搜索回溯的决策文字沉淀
            - text: 绝不允许任何人用文档或 PR 评论交流，甚至禁止在线上紧急事故处理时打电话对齐
              why: 盲目极端死守纯异步同样会在高紧急故障和复杂多方僵持分歧时让延迟失控，两者按信息清晰度与紧迫度精准切换才是高段位协同。
          explain: 祝贺通关《软件工程基础与开发方法（P.4.1）》四大章全部 11 课。下面用一场综合 Boss 战检验你的过程选型、预测与协同决策力。
      - item:
          id: q-open-collab-traceability
          type: choice
          prompt: 为什么专业工程团队在协同开发时特别坚持“每条代码提交与 PR 都要关联说明**为什么做这次改动（关联 Issue / 需求背景）**”，而不只留下一句孤零零的 `"fix bug"`？
          options:
            - text: 在长期演进项目中，后续维护者半年后查看历史时能立刻读懂当时为什么这么改、有哪些约束条件与取舍权衡，防止不知情时好心重构又把旧隐患改回来
              correct: true
            - text: 因为 Git 规定写英文 `"fix"` 超过三遍会自动删光整个文件夹
              why: 版本历史是最珍贵的长期工程记忆档案，说清“做了什么 + 为什么这样改”直接决定了团队接手传承与安全修改效率。
            - text: 只是为了故意凑字数让代码变慢而已
              why: 高信噪比清晰提交与评审记录并不会拖慢软件运行，反而极大节省未来全体维护成员排错和查清上下文的时间。
          explain: 准备好进入 `P.4.1` 终极 Boss 综合验收了吗？

boss:
  items:
    - id: boss-model-selection-trio
      type: match
      prompt: 把三类迥异特征的软件开发任务与各自最相衬的开发过程模式精准匹配。
      pairs:
        - ["飞机刹车控制固件（适航法规锁死需求，每阶段文档需第三方审查签字）", "**瀑布 / 计划驱动严格阶段模型**：阶段交付明确可追溯，完全适配稳定规范与外部强审计"]
        - ["初创公司新社交 App（需求还在试错摸索，需要每两周出可试用新版本检验）", "**Scrum 式敏捷与短周期循环**：用高频真实可交互增量拥抱变化、低成本试探方向"]
        - ["大型政务平台（总体核心范围已确定，要求分一/二/三期按模块逐步上线）", "**增量分期交付（结合过程剪裁）**：总体骨架先行明确，分期按优先级稳步交付可用模块"]
        - ["两人写两天的内部临时活动看板硬要套 200 页重型政府军工审批流", "拒绝 **过程剪裁** 的官僚反模式：流程开销远远压垮业务周期与项目实际风险等级"]
      explain: 记住过程选择与过程剪裁没有唯一神药——唯独“适配需求确定性、监管审查与真实风险等级”才是王道。
    - id: boss-sprint-weeks-math
      type: number
      prompt: "某团队固定冲刺长度为 `2` 周，前三个冲刺按完成定义交付的故事点分别是 `21`、`18`、`24`。产品待办列表还剩 `130` 点工作量。按团队历史平均速度推算，完成剩余全部工作量预计一共至少需要 **几周**？（填整数）"
      answer: 14
      explain: 平均速度 `(21 + 18 + 24) / 3 = 21` 点/轮；`130 / 21 ≈ 6.19`，至少跑满 `7` 个冲刺，合计 `7 × 2 = 14` 周。
    - id: boss-sprint-10w-shortfall
      type: number
      prompt: "接上题条件（2 周一轮、历史平均速度 `21` 点/冲刺、总待办 `130` 点）：如果客户方因展会 deadline 硬性要求必须在 `10` 周内上线第一版，按历史平均速度届时仍会缺多少故事点无法完工、必须跟 PO 讨论缩减调整范围？（填整数）"
      answer: 25
      explain: "`10` 周仅有 `5` 个冲刺，预计完成 `5 × 21 = 105` 点；距全量 `130` 点正好差 **`25` 点**。专业团队会与产品负责人协商延后/削减最低价值的 `25` 点或调整日期，绝不搞“虚假提速透支质量”。"
    - id: boss-comm-channels-8
      type: number
      prompt: "若一个互相密切两两协同对齐的小组从 `4` 人（`6` 条连线）临时扩编成 `8` 人，所有成员之间两两直接沟通路径上限 `n(n - 1) / 2` 会飙升至 **多少条**？（填整数）"
      answer: 28
      explain: "`8 × 7 / 2 = 28` 条。沟通负担近似平方级爆发加上老员工培训新人磨合占用，正是 **Brooks 定律（后期盲加人反而更慢）** 的定量核心。"
    - id: boss-gqm-and-encapsulation
      type: choice
      prompt: 在设计可长期安全演化的系统结构及评价工程健康度时，下面哪一组对 **信息隐蔽（封装）** 与 **GQM（目标–问题–度量）** 的理解全部正确？
      options:
        - text: "信息隐蔽把易变底层实现细节关在清晰稳定对外接口之内以压低变更波及范围；制定工程度量必须坚持先确立目标（Goal）、再提关键问题（Question）、最后才选配合适且有制衡性的度量指标（Metric）"
          correct: true
        - text: "模块分解应该把所有内部数据库结构变量全面暴露给上层直接改写；度量只需每天只考核‘代码打字总行数越多奖金越高’"
          why: 直接暴露内部易变细节会引爆全站重构雪崩；先拿单一代码量数字硬考核会立刻引爆注水刷分扭曲行为。
        - text: "先盲目在项目后期翻倍强行塞入新人救火，同时为了省事关闭一切代码评审和持续集成测试"
          why: 后期乱塞人叠加取消评审与 CI 只会以几何级数引爆线上缺陷和进度崩溃
        - text: "可抛弃的探索性原型无论写得多粗糙硬编码，一旦老板夸奖好看就应该永远不再重构直接上线连跑十年"
          why: 探索原型用于低成本验真思路，确定可行后应以规范清晰且具测试护栏的工程架构严谨重建。
      explain: 信息隐蔽管好变化边界，GQM 管好改进方向——双剑合璧才能让系统既好改又越做越稳。
    - id: boss-engineering-practices-risk
      type: match
      prompt: 把这四项软件工程常规做法与各自直接拦截或化解的核心风险对应起来。
      pairs:
        - ["**每次合入主干前执行同伴代码评审**", "拦截明显缺陷与不良设计进入主干，同时传播共享代码知识防止出现“全队只一人懂的孤岛模块”"]
        - ["**每天多次小步合入主干并跑自动化测试（持续集成）**", "消除长期分支孤立演进带来的合入大爆炸与集成回归失控，几分钟内及时暴露破坏"]
        - ["**每轮迭代末向真实干系人演示可用真实软件**", "消除理解偏差与不确定性盲点，防止辛辛苦苦多月做出不符合真实需求的产品"]
        - ["**Issue 界定背景 → 分支小步提交 → PR 异步评审合并**", "建立跨地区异步高信噪比且可追责留痕的工程协作流水线，保护专注力与工程记忆"]
      explain: 祝贺彻底通关《软件工程基础与开发方法（P.4.1）》。你已掌握从小代码作坊跨向现代化职业研发团队的核心工程骨架。
