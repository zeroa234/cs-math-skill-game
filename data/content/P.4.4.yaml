skill: P.4.4
version: 2
authors: [main-agent]
brief:
  why: |
    在上一关学会把一个程序拆成清晰的类和模式之后，真正上线的大软件还会遇到更宏观的问题：模块边界是按技术分层切还是按业务领域切？5 人小团队该用模块化单体、微服务还是事件驱动？老板说“下单接口要快、要稳定”怎么写成能验收的质量属性场景？网络断开时购物车选一致性还是可用性？做完重要技术选型怎么用 ADR 留住理由，又怎么零停机上线和拆解遗留系统？这一关带你站在系统整体视角做架构决策。
  outcomes:
    - 从干系人关注点、功能与约束出发，用 C4 四层图与 4+1 视图表达组件与系统边界，分清技术切分与领域切分
    - 比较单体、分层、管道-过滤器、微内核、基于服务、微服务、事件驱动与无服务器风格，能为团队上下文选型
    - 写出完整六要素的质量属性场景（p99、吞吐量），运用扩展、缓存、异步队列与限流降级策略满足目标
    - 权衡分布式网络分区下的 CP 与 AP 选择，用架构评审识别敏感点与权衡点
    - 撰写包含背景、决策与后果的架构决策记录（ADR），并掌握蓝绿、金丝雀、影子发布与遗留系统增量替换
terms:
  - term: 软件架构
    def: '系统的高层结构组成、组件边界与对外接口，以及在技术取舍中作出的关键且难以逆转的决策集合'
  - term: 干系人
    def: '对系统成败有切身诉求并受架构影响的人或角色，如终端用户、开发团队、运维与安全审计'
  - term: C4 模型
    def: '用系统语境、容器、组件、代码四个逐层放大的视角来画软件架构图的分层建模方法'
  - term: 领域切分
    def: '按业务能力（如订单、库存、支付）竖着切分系统模块，让改一个业务尽量只动一个边界内部'
  - term: 模块化单体
    def: '部署在同一个进程和安装包里、但内部按业务边界严格隔离接口与数据的单体架构'
  - term: 内核
    def: '在微内核插件架构中，指只包含基础生命周期与插件接口机制的最小稳定核心模块'
  - term: 微内核风格
    def: '把最小稳定功能放在核心系统里，把可扩展功能做成遵循统一接口的独立插件按需加载的架构'
  - term: 管道-过滤器
    def: '把处理流程拆成一串独立过滤器步骤，前一步的输出流进下一步输入，各步骤可独立组合替换'
  - term: 微服务
    def: '把系统拆成多个围绕业务能力独立开发、独立部署并各自管好自己数据的细粒度网络服务'
  - term: 事件驱动架构
    def: '组件之间不直接同步等待调用，而是通过发布和订阅异步事件经消息中间件解耦协作的架构'
  - term: 最终一致
    def: '允许系统各节点在短暂时间内存在数据差异，但在停止新写入后经过一段同步最终会趋于一致'
  - term: 无服务器架构
    def: '开发者只需编写按事件触发的短时函数或托管服务，由云平台自动完成服务器扩缩容并按实际调用计费'
  - term: 质量属性
    def: '决定系统“好不好用、稳不稳、好不好改”的非功能性特征，如延迟、吞吐量、可用性与可维护性'
  - term: 质量属性场景
    def: '用来源、刺激、环境、制品、响应和可测量度量六要素把模糊质量要求写死成可验收测试的规格'
  - term: CAP 定理
    def: '分布式存储发生网络分区（P）时，只能在强一致性（C，宁可拒写也不返回旧数据）和高可用性（A，两边继续服务）间二选一'
  - term: 架构决策记录
    def: '简称 ADR，用精炼文档记下某项重要架构决定的背景约束、决策方案以及必须承担的后果'
  - term: 金丝雀发布
    def: '先只把 1%–5% 的真实用户流量切到新版本观察指标，确认正常后再逐步扩大比例的发布方式'
  - term: 绞杀者模式
    def: '在老系统外层用路由把新功能逐步切到新模块实现，等旧模块不再被调用后安全下线的增量替换方法'
lessons:
  # ==== 组件与边界 ====
  - id: system-boundaries
    chapter: 组件与边界
    title: 什么是软件架构、干系人与约束
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            如果一家公司请你负责新系统的软件架构，你觉得架构师日常最核心的工作是？
          options:
            - text: 划清大模块边界与交互方式，并在多方约束下做出关键且难逆转的技术取舍
              correct: true
            - text: 把整个系统里每个变量的命名和所有 for 循环写法在第一天全部画出来
              why: 细节变量和循环属于局部编码实现，架构聚焦的是系统级结构、边界与重大决策
            - text: 选市面上最时髦、名气最大的框架全套搬进来，不用问业务人数和预算
              why: 脱离团队规模、预算和上线周期的“时髦技术”往往带来灾难性复杂度
          explain: |
            架构不只是画盒子的结构图，更是围绕“谁关心什么、受什么现实约束”做出一整套难以轻易反悔的核心决策。
      - card:
          title: 软件架构的双重含义与干系人关注点
          body: |
            **软件架构（software architecture）**既指系统的高层静态/运行结构（有哪些大组件、怎么连），也指那些**一旦定下就很难改动的重大决策**（例如单体还是微服务、选哪种数据库与通信协议）。

            每类**干系人（stakeholder）**盯的完全不同：用户关心打开快不快，运维关心出故障好不好查，老板关心两周能不能上线，安全团队关心权限与数据隔离。好架构是在这些互相拉扯的关注点之间找平衡。
      - item:
          id: stakeholder-concern-match
          type: match
          prompt: |
            把四类干系人和他们在架构里最关心的关注点连起来。
          pairs:
            - ["终端消费者", "下单页面响应快、大促不报错"]
            - ["运维工程师", "部署简单、有清晰日志与可回滚机制"]
            - ["安全审计员", "密码与支付数据隔离、权限最小化"]
            - ["业务研发团队", "模块边界清楚、改一个功能不连累别的组"]
          explain: |
            做任何架构选型前先列出关键干系人，才能避免只顾开发爽却让运维半夜救火或上线延期。
      - card:
          title: 需求的三块基石：功能、质量属性与约束
          body: |
            动笔划边界前，先分清输入给架构师的三类条件：
          reveal:
            - title: 第 1 类：功能需求（系统要做什么）
              body: |
                比如“顾客能加购物车、下单、付款、查物流”。注意：功能本身往往不直接决定你用单体还是微服务，但它决定你需要哪些业务模块。
            - title: 第 2 类：质量属性（做得有多好）
              body: |
                比如“峰值每秒 1000 单依然 300 毫秒内返回”“不能超卖库存”。这才是把架构推向缓存、异步队列或特定存储的主要动力。
            - title: 第 3 类：现实约束与原则
              body: |
                例如“团队只有 5 个人且只会 Python”“预算有限不能租 20 台服务器”“必须符合行业合规审计”。约束划定了哪些漂亮方案虽然理论上不错却直接出局。
      - item:
          id: arch-decision-nature
          type: choice
          prompt: |
            下面哪项决定最符合“架构级重要决策”的特征（改动成本高、牵动全局边界）？
          options:
            - text: 把“订单与支付”拆成两个独立部署的服务并改用异步消息通知，还是留在同一进程里用本地库操作
              correct: true
            - text: 把某函数里的局部临时变量 `i` 改名叫 `idx`
              why: 重命名局部临时变量只要 5 秒且不影响任何模块边界
            - text: 把提示语“提交”改成“确认提交”
              why: 界面按钮文字属于局部展示改动，不是系统架构级决策
          explain: |
            越靠近模块边界、进程边界、数据所有权和通信协议的决定，越属于架构层面。
      - item:
          id: constraint-vs-functional
          type: choice
          prompt: |
            在项目立项书里读到“本系统必须在 3 个月内由 4 名只熟悉 Python 的后端工程师交付，且必须运行在现有内网虚拟机上”。这一条属于什么？
          options:
            - text: 架构约束（Constraints）：限制了人员技能、交付时间与运行环境边界
              correct: true
            - text: 功能需求：描述用户能点哪个按钮
              why: 这句话没有描述用户能使用什么业务功能，而是在划定资源与环境限制
            - text: 垃圾代码坏味
              why: 团队人手、工期与物理环境是真实存在的工程上下文，不能当成代码坏味无视
          explain: |
            约束虽然看起来像“限制”，却是帮你迅速淘汰不切实际重型方案的最好滤网。
      - item:
          id: qa-vs-constraint-match
          type: match
          prompt: |
            把项目立项时的需求描述归入正确的架构输入类别。
          pairs:
            - ["顾客可以把商品加入购物车并下单付款", "功能需求（做什么）"]
            - ["99% 下单请求需在 300 ms 内返回", "质量属性（做得多好）"]
            - ["必须由 4 人小团队在 2 个月内上线", "现实约束（资源与工期边界）"]
          explain: |
            功能决定有什么模块，质量属性驱动技术选型和策略，现实约束帮我们砍掉超出承受力的过度方案。

  - id: c4-and-views
    chapter: 组件与边界
    title: C4 模型、4+1 视图与架构文档
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            向产品经理汇报系统“和哪些外部银行/短信网关对接”，以及向后端新人讲解“订单容器内部有哪些业务组件”，能用同一张图把两件事画完吗？
          options:
            - text: 不能，就像地图要分世界地图、城市道路图和小区楼栋图一样，架构图也要分层放大
              correct: true
            - text: 能，把所有外部银行和几百个内部代码类全塞进同一张大图最省事
              why: 把几百个微观类和外部系统画在一起，任何人看两分钟就会迷失在几千条连线里
            - text: 只给别人看代码目录树就够了，不需要画任何宏观图
              why: 目录树看不出运行时的进程边界、网络协议和跨系统通信方向
          explain: |
            **C4 模型**像电子地图的四个缩放挡位，让你对不同听众只展示恰当粒度的边界；**4+1 视图**则从不同侧面检查架构没有遗漏。
      - card:
          title: C4 模型：四层逐级放大
          body: |
            **C4 模型（C4 Model）**像地图缩放一样，把软件画成四个逐层放大的清晰层级（注意第 2 层里的 Container 指“独立运行的部署或存储单元”，不只指 Docker）：
          reveal:
            - title: L1 Context（系统语境图）与 L2 Container（运行单元图）
              body: |
                - **Context**：最高层，只画“我们的系统”这个大黑盒、各类用户，以及对接的外部系统（如支付网关、短信服务）。
                - **Container**：放大系统内部，看它由哪几个独立运行的进程或存储组成（如网页前端、API 服务、数据库、消息队列）。
            - title: L3 Component（组件图）与 L4 Code（代码图）
              body: |
                - **Component**：再放大某个服务内部，看它切分了哪些职责模块（如订单控制器、库存组件、支付适配器）。
                - **Code**：最底层具体类和接口关系（如 UML 类图），日常通常靠代码自身表达，只在关键复杂模块才画。
            - title: 实例串一遍：校园二手书店的四层放大
              body: |
                - **L1 语境**：买家/卖家 ↔ 二手书系统 ↔ 微信支付、快递查询接口。
                - **L2 容器**：手机小程序 + Python API 服务 + PostgreSQL 数据库 + 定时清理任务。
                - **L3 组件**：Python API 内部拆出鉴权组件、上架组件、下单结算组件、通知适配组件。
                - **L4 代码**：下单结算组件里的 `OrderService` 类与 `PaymentGateway` 协议。
      - item:
          id: c4-zoom-match
          type: match
          prompt: |
            把想展示给队友看的内容和对应的 C4 缩放层级配对。
          pairs:
            - ["系统总体定位、用户角色与对接的外部银行/短信平台", "L1 系统语境（Context）"]
            - ["前端单页应用、后端 API 进程、PostgreSQL 库与缓存进程间的通信", "L2 容器（Container）"]
            - ["后端 API 进程内部的下单模块、算价模块与仓库接口模块", "L3 组件（Component）"]
            - ["某复杂策略接口下面的具体实现类与方法签名", "L4 代码（Code）"]
          explain: |
            向老板/产品讲清楚边界看 L1–L2；向开发对齐运行部署和接口协议看 L2–L3；L4 往往直接看代码或核心类图即可。
      - card:
          title: 4+1 视图、视点与轻量文档
          body: |
            除 C4 外，经典的 **4+1 视图**和 IEEE **视点（Viewpoint）**告诉我们不要漏掉运行时与物理部署：
          reveal:
            - title: 第 1 步：4+1 视图的五个观察角
              body: |
                - **逻辑视图**：主要功能模块与类怎么划分（给设计师/开发）；
                - **过程/运行视图**：运行期有哪些并发进程或线程在相互发消息（看并发与性能）；
                - **开发视图**：源码仓库、目录和构建包怎么组织（给新入职程序员）；
                - **物理/部署视图**：程序最终跑在哪些云服务器、容器和网络分区上（给运维）；
                - **+1 场景**：用核心用户故事把上面四个视图串起来验证。
            - title: 第 2 步：文档写给谁看
              body: |
                别写没人翻的 200 页死文档。保留“一页系统语境 + 容器图 + 关键交互说明 + 重要决策记录”，图旁边标清箭头协议（HTTP/SQL/事件），并尽量贴近代码仓库存放以便随改动同步更新。
      - item:
          id: c4-container-trap
          type: choice
          prompt: |
            在 C4 模型的第二层“Container 图”里，“Container”准确指什么？
          options:
            - text: 任何需要单独运行、部署或独立存储数据以支撑整个系统的单元（如 Web 应用、后端服务进程、数据库实例）
              correct: true
            - text: 仅限编程语言里的列表（list）或字典（dict）数据结构
              why: 列表和字典只是代码变量，属于 L4 代码层，不是 C4 第二层的系统级部署/存储单元
            - text: 只能用来画前端按钮的颜色样式
              why: C4 Container 图展示的是系统里主要运行进程、存储和它们之间的通信协议
          explain: |
            在 C4 语境里，一个单机数据库、一个后端进程、一个静态前端站点或消息队列各自算一个“Container（容器/运行单元）”。
      - item:
          id: view-4plus1-check
          type: choice
          prompt: |
            团队已经画好了完美的逻辑组件图和代码类图，但一到双十一大促就频繁死锁超时。当初最可能漏看了 4+1 视图里的哪一类视角？
          options:
            - text: 过程视图（并发进程/线程协作与锁竞争）和物理部署视图（机器资源与网络拓扑）
              correct: true
            - text: 开发目录视图（源码文件夹怎么按字母排序）
              why: 文件夹命名顺序不影响运行时并发锁竞争与网络拓扑瓶颈
            - text: 只把类图框线加粗就能发现运行期并发瓶颈
              why: 静态类图看不到运行期多进程并发争抢和跨机房网络延迟
          explain: |
            不同视图暴露不同风险：静态类图抓职责，运行视图和部署视图抓并发、容错与网络瓶颈。
      - item:
          id: doc-living-rule
          type: choice
          prompt: |
            关于软件架构文档，下面哪种写法最不容易刚写完就过时？
          options:
            - text: 保持轻量（语境图+容器图+关键 ADR），放在代码仓库里随架构改动一起更新
              correct: true
            - text: 写 300 页脱离代码库的 Word 详尽说明书，上线后永不修改
              why: 没人读且很快与真实代码脱节的厚重文档会误导新人
            - text: 彻底不画任何图也不写 ADR，全靠老员工口头记忆
              why: 一旦人员流动，重要边界和选型背景会立刻丢失
          explain: |
            “刚好够用的活文档”贴近代码存放，既省维护时间又能帮新人快速对齐边界。

  - id: partitioning-boundaries
    chapter: 组件与边界
    title: 技术分层 vs 领域切分：怎样划出组件边界
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一个系统里有“订单”“账单”“库存”三块业务。某团队把代码按“所有 Controller 放文件夹 A、所有 Service 放文件夹 B、所有数据库表放文件夹 C”组织（技术分层）。后来每当只改“账单”一个小需求，开发者每次都要横跨 A、B、C 三个目录去改 6 个文件。换成按“订单 / 账单 / 库存”竖着切会好在哪里？
          options:
            - text: 账单相关的接口、逻辑、存储收拢在同一个领域边界里，改账单只需改一个区域，更符合高内聚低耦合
              correct: true
            - text: 竖着切以后，数据库再也不用建任何表了
              why: 依然需要数据表，只是把同一领域的数据访问和业务逻辑收在同一个边界下管理
            - text: 竖着切以后，所有业务代码可以全部合并成一行
              why: 领域切分改变的是模块划分维度，不是把代码压扁成一行
          explain: |
            围绕真实案例（例如 CSSE6400 的媒体服务器），对比**技术切分**和**领域切分**，是学会划出“未来拆得动、改得爽的组件边界”的关键一步。
      - card:
          title: 技术切分 vs 领域切分
          body: |
            把系统切成组件时有两种切法：
            - **按技术角色横着切**：把界面、控制层、服务层、数据库访问层各分一类。改一个业务功能得一路捅穿全部四层。
            - **领域切分（Domain Partitioning）**：按业务领域竖着切（对应**限界上下文**），切出“用户管理”“视频转码”“订阅计费”等业务组件。每块内部高内聚，未来还能整块拎出来独立部署。
      - card:
          title: 例题：以媒体服务器为例划分 C4 组件边界
          body: |
            假设你要做一个在线媒体服务器（上传视频、转码多清晰度、按订阅权限播放）：
          reveal:
            - title: 第 1 步：用容器图看清外部边界
              body: |
                用户浏览器 → API 网关/Web 服务 → 两个关键外部支撑：对象存储（存原始大视频和切片文件）+ 转码任务队列（耗时的视频编码不能卡住网页请求）。
            - title: 第 2 步：用领域切分划出内部组件
              body: |
                与其建 `Controllers / Models / Helpers`，不如竖切成三个**领域组件**：`Catalog`（视频元数据检索）、`Transcode Worker`（上传校验与异步转码）、`Access Control`（鉴权与播放凭证签发）。
            - title: 第 3 步：组件之间靠契约和事件通信
              body: |
                上传入口接收视频后，发出 `VideoUploaded` 事件通知 `Transcode Worker` 转码；转码完更新 `Catalog` 状态为可播放——各组件只碰自己的职责。
      - item:
          id: domain-vs-tech-choice
          type: choice
          prompt: |
            如果一家电商公司希望把“订单组”和“物流组”的日常开发彻底独立开，让订单组改需求时几乎不用碰物流组的模块，应该优先采用哪种划分方式？
          options:
            - text: 领域切分（按“订单”“物流”“商品”等业务领域边界竖着切分组件和模块）
              correct: true
            - text: 纯技术切分（把全公司的所有控制器、服务、数据库表各自混在三大目录里）
              why: 混在同一个技术层目录里会导致所有业务组频繁互相踩踏同一个层和同一套表
            - text: 按文件创建日期切分（一月建的文件放一起，二月建的放一起）
              why: 按时间切分完全违背内聚性，找一个业务要翻遍全年目录
          explain: |
            按业务领域划分边界，让变化频率相同、属于同一团队的代码住在一起（领域高内聚；这与著名的“康威定律——系统模块边界往往会与组织团队的沟通结构长得一样”相呼应）。
      - item:
          id: media-async-reason
          type: choice
          prompt: |
            假设一个媒体网站提供视频上传和转码功能：用户点上传后，为什么不让 API 服务原地同步执行完 5 分钟的视频转码才返回 HTTP 响应？
          options:
            - text: 同步转码会长时间占死连接并触发客户端超时，应由组件边界把“接收保存”和“队列异步转码”拆开
              correct: true
            - text: 因为 Python 和 Java 不能处理视频文件
              why: 瓶颈不在语言能不能处理，而在 HTTP 同步请求不能卡住几分钟等待耗时后台任务
            - text: 因为拆开以后转码耗时会自动变成 0 秒
              why: 转码本身仍要花时间，拆开是让前端立刻收到“上传已受理”且转码任务能独立扩缩容
          explain: |
            划分组件边界时，把“毫秒级交互路径”和“分钟级重计算路径”隔开，是保护系统吞吐量的经典边界切法。
      - item:
          id: boundary-owner-match
          type: match
          prompt: |
            把媒体服务器的三个领域组件和各自的核心职责配对。
          pairs:
            - ["Catalog（目录组件）", "管理视频标题、标签、发布状态与搜索列表"]
            - ["Transcode Worker（转码组件）", "从队列拉取任务，把原片转成多清晰度切片"]
            - ["Access Control（鉴权组件）", "校验会员订阅状态，签发限时播放凭证"]
          explain: |
            每个领域组件对外只暴露清晰接口，内部实现细节隐藏在各自边界之内。
      - item:
          id: tech-partition-symptom
          type: choice
          prompt: |
            下面哪种目录组织或模块现象，最明显反映了**纯技术切分**带来的团队协同痛点？
          options:
            - text: 每次只加一个会员等级小需求，都要横跨 controllers/、services/、models/ 三个大文件夹并撞车修改公共文件
              correct: true
            - text: 订单团队自己的模块里同时放了订单接口、订单业务和订单仓库接口
              why: 这正是高内聚的领域切分做法
            - text: 视频转码任务被放进了异步工作器里运行
              why: 异步剥离耗时任务是合理的边界保护
          explain: |
            如果改一个业务总是要捅穿好几个技术目录，就说明该考虑按业务域重新划边界了。

  - id: decomposing-monoliths
    chapter: 组件与边界
    title: 从单体拆出边界：接缝、共享数据库与拆解代价
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一家公司有一个跑了五年的大单体应用，所有模块都直接通过 SQL `JOIN` 读写同一张 `Orders` 表和 `Users` 表。现在领导下令：“明天就把订单和用户拆成两个独立的微服务。”如果只是把代码拆成两个进程，却还让它们共用同一个数据库并随便跨表 `JOIN`，能获得独立演进的好处吗？
          options:
            - text: 不能，改一张表结构两个服务依然会一起崩，而且数据锁死在一起，本质上变成了“分布式大泥球”
              correct: true
            - text: 完全可以，只要分成两个进程就是真正的独立微服务了
              why: 共享同一套数据库表意味着数据模型依然强耦合，而且数据库成了共同单点故障
            - text: 会比单体更简单、网络延迟更低
              why: 既保留了共用同一套表结构的耦合坏处，又平白多出了跨进程网络调用和失败重试复杂度
          explain: |
            把单体拆开绝不是拿剪刀随便剪两半。想安全地从已有系统里拆出清晰边界，必须先找准内部模块接缝、理清数据所有权，再分步把调用流量切过去。
      - card:
          title: 拆解单体的第一原则：先理清内部接缝与数据归属
          body: |
            如果单体内部早就混乱耦合（大泥球），直接拆成分布式服务只会让排错难度翻十倍。正确的拆解顺序是：
            1. **先在单体内理清模块化边界**：把“结算”直接 `SELECT * FROM inventory` 的跨界读库代码，改成通过内部服务接口调用。
            2. **把数据库访问权收口**：每块数据归唯一的服务所有（Database per Service），别的服务只能通过 API 或事件获取，禁止偷偷跨界改别人的表。
          reveal:
            - title: 为什么不能先拆进程、后拆表？
              body: |
                如果订单进程和账单进程依然连同一张 `orders` 表，账单组改了一个列类型，订单服务当场报错，两边发布仍然必须绑在一起同步上线，完全白拆。
            - title: 先补单体内接缝，再迁往独立进程
              body: |
                先在同一个代码仓里把跨模块 SQL 改成调明确的 Python/Java 接口函数，等接口稳定了，再把接口背后的实现换成网络 HTTP 或消息队列，风险最小。
      - card:
          title: 例题：用绞杀者模式（Strangler Fig）渐进替换旧边界
          body: |
            直接把旧系统关机推倒重写半年风险极高。**绞杀者模式（Strangler Fig）**像藤蔓包绕老树一样，一步步把流量从旧单体摘出来：
          reveal:
            - title: 第 1 步：在老系统前面放一个路由网关 / 接缝
              body: |
                所有请求先经过统一的路由或抽象接口，一开始 `100%` 的请求照旧转给老单体，用户无感知。
            - title: 第 2 步：把“计费模块”搬到新边界并切一小部分流量
              body: |
                新计费服务建好独立数据表，通过双写或同步把历史账单迁过去，网关把 `/billing/*` 流量切给新服务（其余 `/orders/*` 仍走老单体）。
            - title: 第 3 步：逐块迁移，直至安全关闭老系统
              body: |
                每迁走一块并稳定跑过检验，就删掉老单体里对应的旧代码；等最后一块功能也迁移完毕，老单体自然安全下线。
      - item:
          id: shared-db-antipattern
          type: choice
          prompt: |
            某团队把系统拆成了“订单服务”和“财务服务”两个独立进程，但两边代码都在直接用 SQL `UPDATE orders_table` 改同一张订单表。这种做法最大的架构缺陷是？
          options:
            - text: 破坏了数据所有权边界：任何一方改表结构或错改字段都会直接弄坏另一方，无法真正独立部署演化
              correct: true
            - text: 两个进程连接同一个数据库一定会导致语法报错
              why: 数据库允许多个客户端同时连接，但多个服务各自乱改同一张表会彻底摧毁封装与契约边界
            - text: 这样能省掉接口契约，是最好的企业实践
              why: 直接共享表正是服务拆分里最经典的反模式，等于把内部实现暴露成公共耦合面
          explain: |
            独立的组件或服务应该隐藏自己的内部表结构，对外只暴露稳定的 API 或事件契约。
      - item:
          id: strangler-vs-bigbang
          type: choice
          prompt: |
            和“停掉一切新需求，花一年时间从零重写整套新系统，最后一天一次性切换上线（大爆炸重写）”相比，绞杀者模式最关键的优势是什么？
          options:
            - text: 每次只迁出一小块边界并在真实线上逐步验证，风险可控，老系统还能持续交付业务价值
              correct: true
            - text: 绞杀者模式完全不需要写任何新代码，会自动把老代码变新
              why: 依然需要重写或迁移模块，只是把“一次全换的大赌博”拆成了“一节节安全替换”
            - text: 绞杀者模式必须等到最后第 365 天才能让用户看到任何新模块
              why: 恰恰相反，第一块小模块迁出后几天或几周就能在生产环境交付生效
          explain: |
            大爆炸重写常常中途需求又变、新旧两边都要同时赶工最终烂尾；渐进替换让每一步都在生产跑稳再走下一步。
      - item:
          id: decompose-order-steps
          type: order
          prompt: |
            按最稳妥的工程先后顺序，把“从混乱单体里拆出独立支付服务”的四步排好。
          steps:
            - "在单体内梳理调用链，禁止其他模块直接读取支付表，统一改走内部接口"
            - "搭好新支付服务及独立存储，在入口放置路由接缝准备切流"
            - "同步数据后先切少量灰度流量到新支付服务，监控无误后切全量"
            - "确认新服务稳定运行一段时间，删除老单体里的废弃支付代码"
          explain: |
            先解开内部跨界耦合（尤其是跨表直连）→ 搭接缝与数据迁移 → 渐进切流验证 → 清理旧代码。
      - item:
          id: seam-branch-abstraction
          type: choice
          prompt: |
            要替换遗留单体里一个被 30 处代码调用的旧模块，又不希望一改就全站崩溃，“以抽象隔离分支（Branch by Abstraction）”做法的第一步是什么？
          options:
            - text: 先在调用方和旧实现之间抽出一层统一接口，让 30 处调用改走接口，再在接口后面悄悄实现新模块
              correct: true
            - text: 先把 30 处调用全部删掉，等半年后新模块写完再一处一处重新写回来
              why: 删掉调用会让系统直接瘫痪半年，完全无法交付
            - text: 把新模块复制粘贴 30 份塞进每个调用方里
              why: 复制 30 份只会制造巨大重复和散弹式修改灾难
          explain: |
            先插一层“接缝接口”，就能在不打断业务迭代的情况下从容在接口背面完成新老切换。

  # ==== 架构风格 ====
  - id: monolith-layered
    chapter: 架构风格
    title: 单体与分层架构：为什么 5 人团队常从模块化单体起步
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一家 5 人初创公司准备做电商网站，打算三个月上线第一版并快速试错。关于架构选型，“一上来就拆成 10 个微服务”和“写一个内部分层清晰的模块化单体”，你猜老练的架构师会怎么选？
          options:
            - text: 选模块化单体：开发调试、事务一致、部署运维全都很简单，交付快；将来哪块撑不住再沿模块边界拆出服务
              correct: true
            - text: 必须选 10 个微服务，因为大厂都这么用，小团队用单体太丢人
              why: 10 个微服务会立刻带来分布式网络故障、链路追踪、多库一致性和十套部署流水线的运维重担，5 个人根本扛不住
            - text: 选不分层的大泥球单体，把所有 SQL 和 HTML 混在同一个文件里
              why: 同样是单体，模块边界清晰的“模块化单体”能保住可维护性，大泥球则会快速腐烂
          explain: |
            单体不等于大泥球。这一课看清**分层架构**的原理和优缺点，以及为什么**模块化单体**常常是小团队的最优起点。
      - card:
          title: 分层架构与分层设计原则
          body: |
            **分层架构（Layered Architecture）**把软件按技术职责自上而下叠成四层（展示 → 业务 → 持久 → 数据库）。**严格分层**要求每层只调用紧邻的下一层（不许界面越级写 SQL）；若多数查询只是空转透传（水槽反模式），可适度允许有节制的开放层直读优化。
          reveal:
            - title: 第 1 步：典型四层各自的职责边界
              body: |
                展示层接 HTTP、校验格式；业务层算优惠和扣库存；持久层管 SQL 读写；数据库层存表数据。换掉前端框架或改数据库引擎时，其它层尽量不动。
            - title: 第 2 步：何时适度“跳过中间层”？
              body: |
                当一个简单分页列表查询在业务层没有任何规则、只是原样透传给持久层时，可以允许只读查询通道直接跨层，避免写大量毫无意义的中转函数。
      - card:
          title: 模块化单体 vs 大泥球，以及 5 人团队选型
          body: |
            很多团队一听“单体（Monolith）”就觉得落后，其实**大泥球**和**模块化单体（Modular Monolith）**天差地别：
          reveal:
            - title: 第 1 步：对比“大泥球”和“模块化单体”
              body: |
                **大泥球**里各模块随便互相调、直接读彼此的表；**模块化单体**虽然打包成一个进程部署，但内部按领域（订单、商品、用户）划清边界，跨模块必须走明确接口，未来哪块成为瓶颈就能顺着这条边界轻松拆成独立服务。
            - title: 第 2 步：分层架构的优缺点
              body: |
                - **优点**：结构简单直观、本地调试和单元测试一步跑通、单个进程事务原子、部署只需推一个包，非常适合 5 人初创团队快速交付。
                - **缺点**：全系统绑在同一个部署单元里，哪怕只是“图片处理”这一小块流量暴涨，也只能把整个单体一起扩容，规模大了以后编译与发布变慢。
      - item:
          id: layered-sinkhole-trap
          type: choice
          prompt: |
            在严格分层架构里，出现“80% 的请求从 Controller 进来后，只是被原封不动转传给 Service，Service 原封不动转传给 Repository，没有任何业务逻辑”的现象，这叫什么反模式？
          options:
            - text: 架构水槽反模式（Architecture Sinkhole）：一层层空转透传增加样板代码却没带来隔离价值
              correct: true
            - text: 管道-过滤器模式：因为数据像水流一样依次经过各层
              why: 管道-过滤器里每一步都会对数据做实质变换或过滤，而不是白白透传
            - text: 插件扩展模式：每层都是可热插拔的第三方扩展
              why: 固定写死的四层透传没有插件注册与核心扩展机制
          explain: |
            如果绝大多数查询都在白白空转，可以采用“开放层”或简单查询直读，把精力花在真正含复杂规则的层上。
      - item:
          id: startup-5-choice
          type: choice
          prompt: |
            对于一个 5 人组成的初创电商团队（产品需求每周都在变，还没有专职运维团队），最务实的起步架构是？
          options:
            - text: 模块化单体（内部分层且按业务划清模块边界），交付快、运维低，未来有明确独立扩展需求时再拆出服务
              correct: true
            - text: 第一天就拆成 15 个独立部署的微服务外加跨机房事件总线
              why: 分布式运维、跨服务调试和最终一致性复杂度会瞬间压垮 5 人团队
            - text: 不划分任何模块和分层，所有人全往一个 main.py 里写
              why: 毫无模块边界会在两个月内变成谁也不敢改的大泥球
          explain: |
            “先做模块化单体、按需沿边界拆分”是经过大量真实团队验证的演进路线。
      - item:
          id: layered-pros-cons
          type: match
          prompt: |
            把分层单体架构的特点准确归类为优势还是局限。
          pairs:
            - ["单个部署包上线简单，本地一键起跑和断点调试很容易", "分层单体的核心优势"]
            - ["某一个高负载小功能无法单独只扩它自己，必须整体一起扩容", "分层单体的主要局限"]
            - ["内部按业务领域划清接口边界，为日后按需拆分留好接缝", "模块化单体的演进保障"]
          explain: |
            分清什么时候用它的优点（小团队快交付），什么时候该意识到它的天花板（模块扩展率差异极大、多团队发布互相阻塞）。
      - item:
          id: closed-vs-open-layer
          type: choice
          prompt: |
            在分层架构里，“封闭层（Closed Layer）”规定展示层只能调业务层、不能越过业务层直接连数据库。这样规定的主要好处是？
          options:
            - text: 替换底层数据库或修改持久化细节时，只需调整持久层，不会把界面层和业务规则全扯烂
              correct: true
            - text: 让每个简单读取请求必须多花三倍时间才能完成
              why: 封闭层确实有一点调用隔离代价，但真正目的是保护上层不受底层存储变动冲击
            - text: 因为编程语言禁止展示层导入任何其他模块
              why: 语言本身不会阻止跨层引用，是架构规范和代码检查守住了层间边界
          explain: |
            隔离层界就是用微小接口开销换取层与层之间可独立替换的安全感。

  - id: pipeline-microkernel
    chapter: 架构风格
    title: 管道-过滤器与微内核插件架构
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            你在写一款代码编辑器（比如 VS Code），不可能把全世界几百种编程语言的语法高亮、格式化、Git 插件全都写死在编辑器本体里；或者你在写一条日志清洗程序：“读原始行 → 过滤掉调试日志 → 解析 JSON → 统计错误数”。这两种场景分别适合哪种架构风格？
          options:
            - text: 编辑器适合“小巧核心 + 可插拔扩展包”；日志清洗适合“一节接一节流式加工”（管道-过滤器）
              correct: true
            - text: 两个都只能用“展示层 → 业务层 → 数据库层”的三层单体写死
              why: 三层架构不解决第三方无限扩展插件或流式多步数据变换组合的问题
            - text: 把几百种语言插件全部塞进一个 10 万行的 if/elif 函数里
              why: 每次新加一种语言都要重新编译发布整个编辑器，第三方开发者根本没法扩展
          explain: |
            这一课来看两种极有针对性的架构风格：**管道-过滤器**和核心加插件的扩展风格。
      - card:
          title: 管道-过滤器风格 Pipe-and-Filter
          body: |
            **管道-过滤器（Pipeline）**把数据处理拆成一串独立步骤（过滤器），中间用管道把前一步的输出接给下一步的输入：
            `数据源 → [过滤404] → [脱敏手机号] → [按小时聚合] → [写入报表]`

            每个过滤器只认标准输入输出格式、彼此完全不认识，因此可以像搭乐高一样任意调换顺序、增删一步，或各自独立并行跑在不同核上——Unix 命令行 `cat log | grep ERR | sort | uniq` 和多媒体转码流水线正是这种风格。
          reveal:
            - title: 什么时候顺手、什么时候别硬套？
              body: |
                - **极适合**：数据清洗、日志分析、编译器多阶段转换、音视频转码等**单向流式批处理**——每一步只管把流进来的数据加工好吐给下一节，无需回头弹窗询问用户。
                - **不适合**：需要用户点按钮来回交互、跨屏反复查询数据库状态的网页或手机 App（每步都要传完整状态会变得极其笨重）。
      - card:
          title: 微内核（插件）风格 Microkernel
          body: |
            **微内核风格（Microkernel / Plug-in）**把系统劈成“小而稳的**内核**”和“外挂插件”两块：
            - **核心系统（Core / 内核）**：只留最稳定、最小化的公共骨架（窗口管理、插件加载注册表、生命周期管理）。
            - **插件模块（Plug-ins）**：所有易变或各异的功能（Python 高亮、Markdown 预览、税率地区插件）实现核心定义的统一插件接口，独立打包、随时安装或卸载。

            ```python
            # 迷你管道-过滤器示例：每一步只接收并产出标准化行序列
            def filter_errors(lines):
                return [x for x in lines if x.startswith("ERR:")]

            def extract_codes(lines):
                return [int(x.split(":")[1]) for x in lines]

            logs = ["INFO:ok", "ERR:502", "ERR:404", "INFO:done"]
            print(extract_codes(filter_errors(logs)))
            ```
      - item:
          id: pipeline-filter-calc
          type: text
          prompt: 当输入 `logs = ["INFO:ok", "ERR:502", "ERR:404", "INFO:done"]` 时，执行下面两步管道 `extract_codes(filter_errors(logs))` 得到的 Python 列表是什么？
          lang: python
          code: |
            def filter_errors(lines):
                return [x for x in lines if x.startswith("ERR:")]

            def extract_codes(lines):
                return [int(x.split(":")[1]) for x in lines]
          answers: ["[502, 404]"]
          hint: 先留以 `"ERR:"` 开头的行，再取出冒号后面的数字转成整数。
          explain: |
            `filter_errors` 留下 `["ERR:502", "ERR:404"]`，`extract_codes` 把它变成 `[502, 404]`；两步彼此解耦，中间还能再插入去重过滤器。
      - item:
          id: pipe-vs-microkernel-match
          type: match
          prompt: |
            判断下面几种真实软件最典型体现了哪种架构风格。
          pairs:
            - ["编译器前端流水线：词法分析 → 语法分析 → 中间优化 → 目标生成", "管道-过滤器架构"]
            - ["浏览器或 IDE 本体保持精简，靠扩展商店安装广告拦截、主题和语言插件", "微内核（插件）架构"]
            - ["报税软件针对不同国家税制提供可单独更新的地区税率规则包", "微内核架构（核心不变 + 地区插件）"]
            - ["展示层、业务层、持久层自上而下逐层调用隔离", "分层架构"]
          explain: |
            数据逐阶段流式加工且各段可自由重排组合 → 管道-过滤器；稳固小核心 + 大量相互独立的扩展包 → 微内核。
      - item:
          id: pipeline-limit-choice
          type: choice
          prompt: |
            下面哪一种业务**最不适合**用纯粹的单向管道-过滤器架构？
          options:
            - text: 需要用户频繁来回点击、实时互相影响状态的多人在线表格协作界面
              correct: true
            - text: 每日定时清洗百万条日志并导出统计报告的批处理任务
              why: 批处理数据清洗正是管道-过滤器大显身手的理想场景
            - text: 音频降噪 → 增益归一化 → 转码压缩的处理链
              why: 多媒体流式处理天然是管道-过滤器的强项
          explain: |
            管道-过滤器适合单向“输入 → 加工 → 输出”的数据流，不擅长需要复杂双向交互和共享实时状态的界面应用。
      - item:
          id: microkernel-contract-rule
          type: choice
          prompt: |
            在微内核架构里，为什么核心系统必须极其谨慎地保持“插件接口契约”向后兼容？
          options:
            - text: 因为成百上千个第三方插件都依赖这套接口；核心随意改签名会瞬间让大量外部插件崩溃
              correct: true
            - text: 因为微内核绝对不允许核心系统里超过 100 行代码
              why: 没有固定行数限制，关键是核心接口对大量外部扩展的稳定性约束
            - text: 因为插件和核心必须合编进同一个文件，不能分开加载
              why: 微内核的精华恰恰是插件独立打包、动态注册加载
          explain: |
            微内核的稳定核心就像插座标准：只要插座规格不变，各家厂商做的插件都能稳稳插上去跑。

  - id: service-based
    chapter: 架构风格
    title: 基于服务的架构与微服务取舍
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            如果一家公司从单体长大到 40 个开发人员，部署一个大包总互相堵车，但又觉得每个功能拆成 50 个小微服务、建 50 个独立数据库实在太折腾。在“单进程单体”和“几十个细粒度微服务”之间，有没有中间路线？
          options:
            - text: 有。把系统按大业务块拆成 4–8 个粗粒度的独立“基于服务的架构”（Service-Based），先共用少数数据库或逐步拆库
              correct: true
            - text: 没有中间路线，要么全塞进 1 个进程，要么最少必须拆出 50 个微服务
              why: 架构不是非黑即白；Service-Based 就是工程里极常见且性价比极高的折中地带
            - text: 把代码复制 40 份每人各自改一份互不合并
              why: 不合并代码会导致 40 个互相分裂的系统，彻底失去一致性
          explain: |
            **微服务**经常被过度神化，其实在它和单体之间还有很务实的**基于服务的架构（Service-Based）**。这一课把两者的收益和代价摆在桌面上对比。
      - card:
          title: 基于服务的架构vs 微服务
          body: |
            - **基于服务的架构（Service-Based）**：拆成几个（通常 4–8 个）粗粒度领域服务（如用户服务、订单服务、后台管理服务），各自独立进程部署，前期甚至可以共用一个中心数据库以省掉分布式跨库烦恼。
            - **微服务（Microservices）**：拆成大量细粒度、高度自治的小服务，**每个微服务必须独占自己的数据库**，绝不跨库 `JOIN`（数据库连表查询），彼此通过网络 API 或事件通信。
          reveal:
            - title: 共用中心库时的演化纪律
              body: |
                选择基于服务的架构共用数据库时，最好在逻辑上仍用不同的数据库 Schema（命名空间，例如 `user_schema.*` 和 `order_schema.*`）隔开数据表，约定好不跨服务直连别人的表，这样将来流量真涨上去时就能顺滑迁出独立数据库，而不会再绞死在一起。
      - card:
          title: 微服务的真实代价
          body: |
            微服务绝不是免费的升级，拆成几十个小服务会立刻引出四大分布式难题：
          reveal:
            - title: 第 1 步：网络不可靠与部分失败
              body: |
                进程内调用函数微秒级返回、绝不会丢包；跨网络调用服务可能超时、抖动、对端重启——每条链路都必须写超时、重试、**熔断**（连续报错时暂时快速失败、不把上游一起拖死）和幂等防重。
            - title: 第 2 步：失去单机原子事务
              body: |
                **事务**指“多步读写要么全成功、要么全退回原始状态”；下单扣库存和生成账单在不同库里，无法用一个单机数据库事务（`BEGIN ... COMMIT`）搞定，必须靠 **Saga 补偿**（把大操作拆成一串本地小步骤，某步失败就按逆序发反向撤销操作抵消前几步）或事件最终一致。
            - title: 第 3 步：运维与调试门槛剧增
              body: |
                一条报错可能穿过 7 个服务，没有自动化部署流水线、集中日志收集和分布式链路追踪，连问题出在哪都查不到。
      - item:
          id: microservice-pros-cons
          type: match
          prompt: |
            整理微服务架构的优势与它带来的分布式复杂度代价。
          pairs:
            - ["订单服务大促流量翻 10 倍时，只单独给订单服务扩容机器", "微服务的独立扩展优势"]
            - ["各团队按业务域独立测试部署上线，技术栈也能按需选型", "微服务的团队自治优势"]
            - ["本地函数调用变成不可靠网络调用，需应对超时、重试与部分失败", "微服务的分布式复杂度代价"]
            - ["跨库无法用单机事务，需靠补偿或最终一致维护状态", "微服务的数据一致性代价"]
          explain: |
            只有在“团队人数足够多、各模块扩缩容节奏差异极大、已有成熟自动化运维基建”时，微服务的收益才能压过它的高昂代价。
      - item:
          id: service-based-sweet-spot
          type: choice
          prompt: |
            一家 30 人的成长型公司嫌单一巨石应用发布太慢，想把“Web 商城”“商家后台”“结算报表”拆成 4 个独立部署的大服务，但现阶段不想承担为 30 个小服务各自拆库和做跨服务分步补偿事务（Saga）的成本。最契合这种诉求的架构是？
          options:
            - text: 基于服务的架构（Service-Based）：4 个粗粒度领域服务独立进程部署，前期共享一个数据库
              correct: true
            - text: 严格细粒度微服务：强制拆成 35 个服务和 35 个物理隔离的数据库
              why: 30 人团队硬拆 35 个库会深陷无尽的运维和分布式事务泥潭
            - text: 管道-过滤器架构：把商城首页请求做成单向命令行管道
              why: 交互式商城与多后台并不属于单向批处理流式转换
          explain: |
            Service-Based 拿到了“独立部署、故障隔离、团队分块发布”的大部分好处，却把分布式复杂度控制在了极低水平。
      - item:
          id: microservice-db-rule
          type: choice
          prompt: |
            真正的微服务架构为什么强调“每个服务管好自己的私有数据，不让别的服务直接连你的数据库”？
          options:
            - text: 只有隐藏内部数据表并只暴露接口，单个服务才能自由修改内部表结构、独立部署而不撞坏邻居
              correct: true
            - text: 因为现代数据库软件最多只允许 1 个服务同时连接
              why: 数据库支持成百上千并发连接，分开建库是出于边界自治与独立演化考虑
            - text: 因为各自建独立数据库就永远不需要任何网络接口
              why: 服务之间仍然需要通过网络 API 或异步事件交换必要数据
          explain: |
            独立数据存储才是微服务的“真边界”；共用同一张表拆再多进程也只是把耦合藏在数据库里。
      - item:
          id: service-timeout-retry
          type: choice
          prompt: |
            在服务化或微服务架构里，服务 A 通过网络调服务 B，而 B 突然卡死不响应。如果 A 没有设置**超时（Timeout）**会引发什么连锁反应？
          options:
            - text: 服务 A 的所有工作线程都会一直傻等下去直到耗尽，拖垮整个 A 甚至引发级联雪崩
              correct: true
            - text: 操作系统会在 1 微秒内自动替服务 A 猜出 B 本该返回的结果
              why: 不设置合理超时时，网络挂起连接会长时间占死调用方资源，不会自动猜结果
            - text: 服务 A 会自动变得比以前快十倍
              why: 等待卡死连接只会让吞吐量跌到零，不会变快
          explain: |
            跨网络调用一定要配超时上限与降级兜底，防止一个下游卡死把上游所有线程拖垮。

  - id: event-driven
    chapter: 架构风格
    title: 事件驱动架构与消息队列
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            用户下单支付成功后，系统还要干三件事：发短信通知、加会员积分、通知仓库拣货。如果 `OrderService` 同步挨个等这三个服务一一返回才告诉用户“下单成功”，万一发短信的服务器慢了 10 秒甚至临时宕机，用户的下单按钮就会转圈报错。怎么解开这种连环牵连？
          options:
            - text: OrderService 只把订单落库，往消息队列发一条“订单已支付”事件就立刻回复用户成功，另外三个服务各自订阅并异步处理
              correct: true
            - text: 让用户盯着屏幕耐心等 10 秒甚至 1 分钟直到全部完成
              why: 把非关键异步后置任务卡在主同步链路上会严重拖垮用户响应和可用性
            - text: 如果发短信服务器暂时挂了，干脆把用户的已付订单直接删掉
              why: 短信通知不是交易核心，不能因为发短信失败连核心下单一起搞挂
          explain: |
            **事件驱动架构（Event-Driven Architecture）**加上**消息队列**，让生产者只管发出事实、消费者各自按节奏消化，彻底削峰填谷与解耦。
      - card:
          title: 事件驱动架构与消息队列
          body: |
            在**事件驱动架构（event-driven architecture）**里，组件不再直接点名调彼此的同步接口，而是围绕中间件协作：
            - **生产者（Producer）**：状态变化时发布一条不可变事件（如 `OrderPaid(order_id=101)`）放进消息队列/事件总线。
            - **消息队列（Message Queue）**：稳稳暂存消息（哪怕消费者短暂重启也不会丢），帮下游削平大促瞬时流量尖峰。
            - **消费者（Consumer）**：各自独立订阅并消费事件（加积分、发通知、通知仓储）。新加一个“数据分析消费者”时，订单服务一行不用改。
      - card:
          title: 例题：事件驱动的代价——最终一致、难追踪与重复投递幂等
          body: |
            事件驱动解耦很爽，但它也有明显的另一面：
          reveal:
            - title: 第 1 步：只能保证最终一致，难以一步追踪
              body: |
                用户付完款立刻去“我的积分”刷新，可能过 1 秒积分才加上来——这叫**最终一致（eventual consistency）**。而且请求分散在多条消息里，排错时看不到一条从头到尾的调用栈，必须靠全链路追踪编号（trace ID）串日志。
            - title: 第 2 步：网络重试可能送来两条一模一样的事件
              body: |
                消息队列通常保证“至少投递一次（at-least-once）”，万一消费者处理完却忘了及时确认收到，同一条 `OrderPaid(event_id="e1")` 会再来一遍。如果不防重（**幂等**），用户就会被加两次积分。
                ```python
                seen_events = set()
                points = 0

                def handle_order_paid(event_id, amount):
                    global points
                    if event_id in seen_events:
                        return points  # 重复投递，直接跳过不重复加分
                    seen_events.add(event_id)
                    points += amount // 10
                    return points

                print(handle_order_paid("e1", 100), handle_order_paid("e1", 100))
                ```
      - item:
          id: eda-idempotent-points
          type: number
          prompt: |
            在幂等事件消费函数里，`seen_events` 初始为空集合、`points = 0`；函数先检查 `if event_id in seen_events: return points`，否则记录 `event_id` 并执行 `points += amount // 10`。如果网络抖动导致 `handle_order_paid("e1", 100)` 连续投递了两次，之后又新来一条 `handle_order_paid("e2", 50)`，最终 `points` 是多少？
          answer: 15
          hint: '`"e1"` 第二次来会被 `seen_events` 拦掉不重复加分；`"e2"` 再加 `50 // 10 = 5` 分。'
          explain: |
            第一次 `"e1"` 加 `10` 分，第二次 `"e1"` 幂等跳过仍为 `10` 分，新事件 `"e2"` 加 `5` 分，总计 `15` 分。
      - item:
          id: eda-pros-cons-match
          type: match
          prompt: |
            把事件驱动架构的各个特征对应到“优点”或“需要承担的复杂度”。
          pairs:
            - ["生产者和消费者松耦合，新增订阅者无需改订单服务代码", "事件驱动核心优点"]
            - ["消息队列在流量暴增时暂存消息，保护下游不被瞬间打垮", "异步削峰优点"]
            - ["流程分散在多条异步消息里，排错追踪更难且状态只能最终一致", "事件驱动核心代价"]
            - ["同一事件可能被至少投递一次，消费者必须做幂等去重", "可靠消费注意事项"]
          explain: |
            高扩展与削峰的背面，就是异步追踪复杂和必须处理重复投递与短暂延迟一致。
      - item:
          id: queue-spike-benefit
          type: choice
          prompt: |
            秒杀活动开始第 1 秒涌入 5000 个下单请求，但后端仓库打印单据系统每秒最多只处理 500 个请求。在中间放一个消息队列能起什么作用？
          options:
            - text: 队列先把 5000 个请求稳稳接住排队，让仓库系统按自己能承受的 500/秒节奏匀速消化而不崩溃
              correct: true
            - text: 队列会自动把多出来的 4500 个付费订单全部悄悄丢弃
              why: 合理配置的持久化队列是把高峰请求缓冲排队慢慢消化，不是随机丢单
            - text: 队列能让后端打印单据的单个函数执行耗时从 2 毫秒缩短到 0.2 毫秒
              why: 队列不能加快下游单个请求的处理速度，它只是把瞬时尖峰缓冲拉平到后续几秒里处理
          explain: |
            这就是“削峰填谷”：用短暂的异步排队延迟，换取后端系统在尖峰冲击下稳如泰山。
      - item:
          id: eda-when-bad
          type: choice
          prompt: |
            如果一个操作要求“用户在页面上点按钮后，必须当场看到确切的‘成功或余额不足’结果再决定下一步跳转”，适不适合把它做成纯异步发完队列就返回？
          options:
            - text: 不太适合，需要立刻拿到确定结果的强同步交互更适合直接同步调用并等响应
              correct: true
            - text: 非常适合，哪怕余额不足也先骗用户“支付成功”，等 5 分钟后再悄悄改状态
              why: 在实时扣款校验上返回假成功会严重误导用户并引发交易纠纷
            - text: 因为消息队列不能传输数字，所以做不了支付校验
              why: 队列能传任何 JSON/数字，问题在于业务交互本身要求当场同步给出确切结论
          explain: |
            核心实时决策路径（如扣款校验）需要同步确切反馈；后续通知、统计、对账、异步履约才是事件驱动的黄金舞台。

  - id: serverless
    chapter: 架构风格
    title: 无服务器架构（Serverless / FaaS）：缩放到零与冷启动
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            公司需要一个“用户每次上传头像时自动裁剪成 128×128 缩略图”的小功能：平时半夜根本没人上传，白天偶尔有人传几张。如果专门租一台 24 小时开着的云服务器，钱白白烧在空转上。有什么按需运行、没人用时不花钱的架构风格？
          options:
            - text: 无服务器架构（Serverless / FaaS）：只上传一个裁剪函数，有上传事件触发才拉起来跑几百毫秒、用完自动缩到零
              correct: true
            - text: 买十台高配物理机 24 小时开机待命
              why: 闲时利用率接近零，性价比极低，运维成本也白白上升
            - text: 让用户自己在本地用画图软件裁剪完再上传
              why: 不能把本该自动化的系统处理推给终端用户手动做
          explain: |
            **无服务器架构（Serverless）**不是真的“没有服务器”，而是你**不用管服务器在哪台机器、怎么启停和扩缩**，只专注写事件触发的小函数。
      - card:
          title: Serverless / FaaS 的工作方式、优势与边界
          body: |
            **无服务器架构（serverless architecture）**最常见的是函数即服务（FaaS，如 AWS Lambda）：开发者只传上去一个个短小的事件触发函数，彻底摆脱配置服务器和手动扩容。
          reveal:
            - title: 第 1 步：核心优势（省运维、缩到零、自动并行）
              body: |
                完全免去操作系统补丁与扩容运维；没人请求时实例缩到 `0`（不花计算钱）；突然来几百个请求时云平台自动同时拉起几百份并行处理。
            - title: 第 2 步：两项代价（冷启动与无状态短时限制）
              body: |
                1. **冷启动（Cold Start）**：缩到零后第一个请求进来，平台需要几百毫秒到几秒重新拉起运行环境，首包延迟突然变高；
                2. **无状态与短时限制**：函数跑完可能随时销毁，持久状态必须写外部数据库，且单次执行通常有几分钟到 15 分钟上限。
      - item:
          id: serverless-fit-match
          type: match
          prompt: |
            判断下面几种工作负载，哪类适合 Serverless，哪类会撞上 Serverless 的短板。
          pairs:
            - ["文件上传后自动触发图片压缩或 PDF 水印生成（突发偶发）", "非常适合 Serverless（按需缩放到零）"]
            - ["每天凌晨跑 1 次、每次只需 20 秒的账单邮件发送", "非常适合 Serverless（免长期租机）"]
            - ["需要毫秒级低延迟且持续保持百万条长连接的实时竞技游戏后端", "不适合纯 FaaS（冷启动与无状态短时限制）"]
            - ["需要跑 4 小时的超大规模视频模型训练", "不适合纯 FaaS（会撞上单次超时限制）"]
          explain: |
            看准形状：短平快、事件驱动、波峰波谷落差大 → Serverless 最划算；超长任务、超高频常驻稳态长连接、极敏锐首包延迟 → 传统常驻容器/服务更稳更省钱。
      - item:
          id: serverless-stateless-rule
          type: choice
          prompt: |
            在 Serverless 函数里写了 `visits = 0`，每次函数被请求就 `visits += 1`。为什么上线后发现 `visits` 经常莫名其妙突然变回 `1`？
          options:
            - text: 云平台随时会新起平行实例或回收空闲实例，不能把持久状态放在函数进程的局部变量里，必须外存进数据库或缓存
              correct: true
            - text: 因为 Serverless 环境禁止在代码里写加法运算符 +
              why: 加法完全合法，问题在于函数实例是短暂且多份并行随时销毁重建的
            - text: 因为 Python 的全局整数超过 1 就自动清零
              why: 计数清零是因为请求落到了新拉起的冷启动实例，而不是整数自动清零
          explain: |
            Serverless 函数必须设计成**无状态（Stateless）**：任何需要跨请求留存的数据都必须放进外部数据库或对象存储。
      - item:
          id: cold-start-meaning
          type: choice
          prompt: |
            什么是 Serverless 架构常提到的**冷启动（Cold Start）**问题？
          options:
            - text: 一段时间没人调用导致函数实例缩容归零后，下一位用户首次请求需要等待平台重新拉起容器与运行时环境造成的额外延迟
              correct: true
            - text: 机房冬天空调开太低导致服务器冻住开不了机
              why: 这里的“冷”指实例长时间未运行而被回收，需重新冷初始化运行时环境
            - text: 函数代码里有语法错误根本运行不起来
              why: 语法错误属于代码 bug，冷启动是按需缩零架构固有的首次初始化开销
          explain: |
            对允许偶尔慢几百毫秒的后台任务或异步触发，冷启动完全可接受；对极严苛的实时接口则需预留最小常驻实例或用常驻服务。
      - item:
          id: faas-trigger-examples
          type: choice
          prompt: |
            下面哪一项最能体现“事件驱动的无服务器架构（FaaS）”的计费与触发方式？
          options:
            - text: 仅在收到图片上传、定时闹钟或 HTTP 请求事件时拉起函数运行几百毫秒，空闲时段零实例零计算费
              correct: true
            - text: 哪怕深夜完全零请求，也必须全额租用 10 台物理服务器按包月固定付费
              why: 包月空闲机器正是 Serverless 想要帮偶发低频场景省掉的固定成本
            - text: 只在用户电脑离线断网时才能在服务器运行
              why: FaaS 运行在云平台，靠云端事件触发执行
          explain: |
            按事件拉起、按毫秒级运行计费、空闲缩到零，是 Serverless 在突发偶发负载下最省钱省运维的原因。

  - id: style-comparison
    chapter: 架构风格
    title: 架构风格对比与选型演练
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            学完了分层单体、管道-过滤器、微内核、基于服务、微服务、事件驱动和 Serverless，面对真实项目时，架构师选型的第一原则应该是？
          options:
            - text: 没有“绝对最好”的架构，挑刚好能满足当下质量属性与团队运维能力、复杂度最低的那个
              correct: true
            - text: 永远选组件数量最多、连线最复杂的那一个
              why: 架构复杂度本身就是一种持续扣减研发速度的税，能用简单方案达标就不要买多余复杂性
            - text: 只看网上哪篇技术博客最火就用哪个
              why: 别人文章里的千人团队背景和你的上下文可能天差地别
          explain: |
            这一课把几种高频风格的优缺点装进一张对比表，并把一次选型推理完整走一遍。
      - card:
          title: 主流架构风格全景对照
          body: |
            对照核心维度做选型，记住“简单先跑通，瓶颈再演化”：
          reveal:
            - title: 对比 1：分层架构 vs 微服务架构
              body: |
                - **分层架构（模块化单体）**：结构简单、容易理解、事务与部署极轻，适合小团队与早期交付；但整体耦合在一个部署单元里，规模大了难以针对局部独立扩缩容。
                - **微服务架构**：按业务能力拆成独立部署单元、独立扩缩容、技术栈灵活；但引入网络故障、跨库一致性、全链路监控与高昂 DevOps 运维成本。
            - title: 对比 2：事件驱动架构 vs Serverless
              body: |
                - **事件驱动**：生产者与消费者松耦合、擅长异步削峰与扩展；但流程分散、追踪调试困难，状态只能做到最终一致。
                - **Serverless**：按次付费、缩零省钱、自动弹性；但有冷启动、运行时长限制且强迫无状态。
      - item:
          id: style-pick-match
          type: match
          prompt: |
            为下面四个不同上下文的项目挑选**最合适**的架构风格。
          pairs:
            - ["5 人初创电商，要快速上线并经常调整业务规则", "模块化单体（内部分层+划清业务模块边界）"]
            - ["视频上传后依次经历抽帧、识别字幕、压制水印三步离线加工", "管道-过滤器架构"]
            - ["每天偶发几次的文档格式转换任务，不想为闲置机器付费", "Serverless（FaaS）"]
            - ["10 个独立业务团队并行开发大型平台，不同模块峰值流量差 50 倍", "微服务或服务化 + 局部事件驱动"]
          explain: |
            对号入座永远看三件事：团队规模与运维成熟度、各模块的独立扩展需求、以及数据是一致性优先还是异步解耦优先。
      - item:
          id: c4-q1-startup-eval
          type: choice
          prompt: |
            回到为什么给 5 人初创电商推荐“内部分层且按业务划清模块边界的模块化单体”，而不是直接上微服务？
          options:
            - text: 模块化单体交付快、单机事务简单、运维负担极轻，等未来订单或搜索真出现独立扩展瓶颈时再沿模块边界拆出服务
              correct: true
            - text: 因为微服务根本不能用来做电商系统
              why: 大型电商常用微服务，但那是团队和流量膨胀到一定阶段之后的事，5 人起步期成本太高
            - text: 因为分层单体永远不需要任何数据库
              why: 电商照样需要数据库，只是单体内使用一个数据库和原子事务更简单可靠
          explain: |
            把模块化边界画在单体内，既享受今天的快和稳，又保留了明天的可拆性——两全其美的工程智慧。
      - item:
          id: overengineering-spot
          type: choice
          prompt: |
            某内部工具只有 200 个员工使用、每天最多 100 次请求，但团队搭建了 8 个微服务、3 套消息队列、2 个服务发现中心，结果 80% 的时间都花在修服务间配置和重启容器上。这属于什么典型问题？
          options:
            - text: 过度设计（Over-engineering）：为不存在的流量规模背上了全套分布式复杂度税
              correct: true
            - text: 架构不够先进，应该再加第 9 个微服务和 2 个缓存集群
              why: 复杂度已经严重超出业务需求，应该做减法合并而不是继续堆件
            - text: 说明面向对象编程在内部工具里完全失效
              why: 这是宏观部署粒度选型失误，跟面向对象无关
          explain: |
            架构的好坏不是看盒子有多少个，而是看它是不是恰好以最低代价支撑住了真实的业务目标。
      - item:
          id: style-evolution-trigger
          type: choice
          prompt: |
            5 人初创电商用“模块化单体”跑了半年后业务大涨，其中“商品搜索与推荐”平时占用 80% 算力且由一个新来的 4 人搜索组单独迭代。此时比较健康的演进做法是？
          options:
            - text: 顺着单体内划好的模块边界，把“搜索与推荐”单独拆成一个独立部署的服务，其余订单/账单继续留在单体里稳步跑
              correct: true
            - text: 哪怕只有搜索模块缺算力，也必须把全公司所有 20 个模块一夜间全部拆成微服务
              why: 哪里出现独立扩缩容或发布阻塞痛点就拆哪里，不必强行把不痛的模块一起拆碎
            - text: 把搜索组的代码直接合并进财务账单模块里
              why: 混进无关模块只会破坏边界内聚性
          explain: |
            演进式拆分只拆出真正需要独立扩缩容或独立团队节奏的那一块，性价比最高。

  # ==== 质量属性 ====
  - id: quality-scenarios
    chapter: 质量属性
    title: 可测的质量属性场景六要素
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            产品经理在需求文档里写了一句：“我们的下单接口必须又快又高可用。”如果把这句话直接交给工程师验收，会出什么问题？
          options:
            - text: “又快”“高可用”没有可测量的数字和压力条件，每个人理解不同，写完根本没法测试验收
              correct: true
            - text: 这句话已经极其精确，不需要补充任何数字
              why: 没有说清多少并发下、多长时间内返回、允许多少错误率，根本无法写成自动化压测断言
            - text: 只要在代码里把函数名改成 fast_order() 就自动达标了
              why: 改函数名不改变任何实际性能或容错表现
          explain: |
            评估架构好不好，靠的不是空洞形容词，而是可测量、可压测的**质量属性场景（Quality Attribute Scenario）**。
      - card:
          title: 质量属性与六要素场景
          body: |
            **质量属性（quality attribute）**描述系统的性能、可用性、安全性、可修改性等指标。为了让它变得可测试，**质量属性场景（quality attribute scenario）**用六要素把模糊形容词写死成可验收规格：
          reveal:
            - title: 前三要素：刺激源、刺激、环境
              body: |
                1. **刺激源（Source）**：谁发起请求或制造故障（如用户客户端）；
                2. **刺激（Stimulus）**：发生了什么事（如提交下单请求）；
                3. **环境（Environment）**：系统处于什么工况（如促销高峰 1000 次/秒）。
            - title: 后三要素：制品、响应、响应度量
              body: |
                4. **制品（Artifact）**：系统的哪部分承受它（如订单服务及其数据库）；
                5. **响应（Response）**：系统该怎么应对（如处理请求并返回订单号）；
                6. **响应度量（Response Measure）**：用可测数字验收（如 **p99 延迟 ≤ 300 ms**、错误率 < 0.1%）。
      - card:
          title: 例题：读懂 p99 延迟指标与验证
          body: |
            为什么架构师常看 **p99 延迟** 而不是只看“平均延迟”？因为如果 98% 的请求 50 ms 返回、1% 的请求 200 ms、而最慢那 1% 的长尾请求卡到 5 秒，平均延迟看起来只有 ~100 ms，却会让大量用户卡死抱怨。

            ```python
            def p99_ms(latencies):
                s = sorted(latencies)
                # 100 个样本里按升序第 99 个（1-based 第 ceil(0.99 * n) 个）
                idx = (99 * len(s) + 99) // 100 - 1
                return s[idx]

            # [20] * 99 表示把含 1 个 20 的列表重复 99 份，再拼上 1 个 800
            samples = [20] * 99 + [800]
            print("avg:", sum(samples) / len(samples), "p99:", p99_ms(samples))
            ```
      - item:
          id: p99-vs-avg-num
          type: number
          prompt: |
            某接口收到 `100` 个请求：其中 `99` 个耗时都是 `20 ms`，只有 `1` 个特别慢、耗时 `820 ms`。虽然平均耗时仅 `28 ms`，但如果把这 100 个耗时样本从小到大升序排列，代表 `p99`（升序排列后第 99 个位置，即 `ceil(0.99 * 100) = 99`）的延迟是多少毫秒？
          answer: 20
          hint: 前 99 个排序后全都是 `20`，第 100 个才是 `820`。
          explain: |
            这 100 个请求里前 99 个（99%）都在 `20 ms` 内返回（第 99 个值为 `20`），恰好满足“99% 的请求在 300 ms 内返回”；如果慢请求增加到 2 个（第 99 和第 100 个都是 `820 ms`），p99 就会骤升到 `820 ms` 导致不达标。
      - item:
          id: six-parts-match
          type: match
          prompt: |
            把“下单接口在峰值 1000 次/秒时，99% 的请求在 300 ms 内返回”拆进质量属性场景六要素。
          pairs:
            - ["来源（Source）与刺激（Stimulus）", "用户客户端发起下单请求"]
            - ["环境（Environment）", "促销高峰期间，并发每秒 1000 次请求"]
            - ["制品（Artifact）", "订单服务及其后台数据库"]
            - ["响应（Response）与度量（Measure）", "成功生成并返回订单号，p99 延迟 ≤ 300 ms 且错误率 < 0.1%"]
          explain: |
            把模糊的“下单要快”写成六要素规格，测试团队立刻就能照着写出准确的压测脚本来验收集成架构。
      - item:
          id: qa-modifier-spot
          type: choice
          prompt: |
            不只是“性能”才能写质量属性场景。下面哪一句是把**可修改性（Modifiability）**写成合格的质量属性场景度量？
          options:
            - text: 在正常开发期间，研发人员新增一种外部支付通道时，只需新增 1 个适配器模块并在 2 天内通过测试上线，不改动现有下单核心流程
              correct: true
            - text: 代码必须写得极其优雅、让人赏心悦目
              why: “赏心悦目”无法测量或验证，不算可验收度量
            - text: 数据库硬盘容量至少有 2 TB
              why: 硬盘空间是硬件资源容量，不是衡量“改代码有多容易”的可修改性场景
          explain: |
            可用性看平均故障恢复时间（MTTR）和可用百分比，安全性看拦截未授权访问比例，可修改性看改动的模块波及范围和工时。

  - id: tactics-latency
    chapter: 质量属性
    title: 满足性能与可用性场景的架构策略
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            某下单接口定下目标：在每秒 1000 次峰值下，99% 的请求要在 300 毫秒内返回。现在压测发现，每次下单都同步去数据库查商品详情、算复杂优惠、扣库存、生成电子发票并等发邮件，结果 p99 延迟高达 1.8 秒。只把单台机器 CPU 换成贵十倍的能一直顶住吗？
          options:
            - text: 单靠堆一台超级机器很快撞上上限且仍有单点故障；需要用水平扩展、读缓存、异步队列、读写分离和限流降级等架构策略组合解决
              correct: true
            - text: 可以，永远只需要加钱买更贵的单台服务器就够了
              why: 单机垂直扩展总有物理天花板，而且一台机器挂了全站一起挂
            - text: 把数据库和日志全部关掉不保存订单最快
              why: 丢掉订单持久化的“快”违反了核心业务功能与一致性底线
          explain: |
            在架构里，用来达成某项质量属性的具体设计手段叫做**架构策略（Tactic）**。这一课把满足高并发低延迟的几招组合拳摸透。
      - card:
          title: 四大常用性能与高可用架构策略
          body: |
            面对“1000 次/秒、p99 ≤ 300 ms”，用来达成质量属性的具体工程手段叫做**架构策略（Tactic）**。至少可以从四个方向组合出招：
          reveal:
            - title: 策略 1–2：无状态水平扩展 + 热点读缓存
              body: |
                1. **无状态服务 + 负载均衡水平扩展**：把登录会话移出单机进程（如放进集中缓存或签名令牌），让多个订单服务实例并排分流。
                2. **读缓存（Cache-Aside）**：商品名称、单价这类读多写少的热点数据提前放进高速缓存，少压关系数据库。
            - title: 策略 3–4：异步队列削峰 + 数据库优化与限流降级
              body: |
                3. **异步削峰（消息队列）**：电子发票、通知与非阻塞后置流程放进队列异步消化，主请求只落核心订单立刻返回。
                4. **数据库读写分离/连接池 + 限流降级**：并发冲破正常上限时优先保住核心下单链路不被雪崩拖垮。
      - card:
          title: 例题：算一算“异步剥离非核心步骤”省下多少主链路时间
          body: |
            用具体耗时拆账看看为什么异步和缓存效果立竿见影：
          reveal:
            - title: 第 1 步：原同步链路的耗时账本
              body: |
                查商品(80 ms) + 写订单库(40 ms) + 发邮件与短信(450 ms) + 生成 PDF 发票(350 ms) = **920 ms**（超标 3 倍多）。
            - title: 第 2 步：加读缓存 + 把发邮件与生成发票拆进异步队列
              body: |
                缓存查商品(5 ms) + 写订单库(40 ms) + 投递事件到队列(5 ms) = **50 ms**（瞬间达标。还顺便避免了邮件服务器慢导致下单失败）。
            - title: 第 3 步：Python 验算代码
              body: |
                ```python
                sync_ms = 80 + 40 + 450 + 350
                async_ms = 5 + 40 + 5
                print(sync_ms, async_ms, sync_ms - async_ms)
                ```
      - item:
          id: tactic-latency-saved
          type: number
          prompt: |
            某下单请求原同步流程总耗时为 `80 + 40 + 450 + 350 = 920 ms`，通过商品读缓存和队列异步剥离发发票步骤后，主请求耗时降为 `5 + 40 + 5 = 50 ms`。主请求一次省掉了多少毫秒？
          answer: 870
          explain: |
            `920 - 50 = 870 ms`。剥离耗时非阻塞任务并缓存热数据，是降低长尾延迟最立竿见影的策略。
      - item:
          id: stateless-scale-choice
          type: choice
          prompt: |
            想用“负载均衡器 + 5 台订单服务机器”水平扩展来扛住 1000 次/秒流量，最前提的架构改造是什么？
          options:
            - text: 订单服务必须是无状态的（不把用户购物车或会话私有状态只留在某一台服务器的局部字典里）
              correct: true
            - text: 必须把 5 台服务器改写成 5 种不同的编程语言
              why: 水平扩展通常部署完全相同的无状态镜像，不需要换五种语言
            - text: 负载均衡器必须按随机概率丢弃一半请求
              why: 负载均衡是把请求均匀分摊到健康实例上，不是故意丢单
          explain: |
            如果机器 A 私有字典里留着用户登录态，下一个请求被负载均衡转到机器 B 就突然掉线了——“无状态服务”是水平扩展的入场券。
      - item:
          id: tactics-match
          type: match
          prompt: |
            把下面四种架构策略和它们解决的核心瓶颈配对。
          pairs:
            - ["无状态服务 + 负载均衡", "多台实例并行分担并发请求"]
            - ["商品信息放高速读缓存", "大幅减少对底层关系数据库的重复读压力"]
            - ["发票和通知改走消息队列异步处理", "缩短同步等待耗时并隔离下游抖动"]
            - ["限流与非核心推荐降级", "极端超载时保住核心下单链路不雪崩"]
          explain: |
            实际高并发系统往往同时叠加这四层策略：缓存挡读、队列削峰、无状态扩容、限流保底。
      - item:
          id: db-pool-read-replica
          type: choice
          prompt: |
            如果压测显示 90% 的数据库流量都是用户在浏览商品列表，只有 10% 是下订单写入，下面哪两招结合最能直接减轻主库压力？
          options:
            - text: 热商品读缓存 + 数据库读写分离（读流量引向只读副本，主库专注处理核心下单写入）
              correct: true
            - text: 干脆关掉所有商品查询接口不让用户看商品
              why: 用户看不见商品就没法下单
            - text: 每次查询都新建和断开一次数据库连接而不使用连接池
              why: 频繁建连和断连握手会额外浪费大量资源并拖慢延迟，应该使用连接池复用
          explain: |
            读缓存挡住绝大部分热点重复读，读写分离把剩余读流量分流给只读副本，连接池减少建连开销——主库就能轻松扛住核心写入。

  - id: cap-pacelc
    chapter: 质量属性
    title: 分布式权衡：CAP 与购物车 CP vs AP
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            某电商在机房 A（北京）和机房 B（上海）各放了一套购物车服务。突然有一天两地之间的光缆挖断了（发生网络分区，两边连不上，但用户各自还能访问附近的机房）。此时一个用户往北京机房加了一件商品，上海机房却收不到同步。你作为架构师必须在此时二选一，选哪种看起来更好？
          options:
            - text: 购物车继续让两边都能写入（选 AP），等光缆修好后自动合并；哪怕偶尔出现刚删的商品又冒出来，也比让用户没法加购强
              correct: true
            - text: 立刻停掉全部两个机房，谁都不准买东西直到光缆修好
              why: 为保证完全一致而停掉所有用户加购物车，会直接损失大量交易额
            - text: 不做任何选择，光缆断了两个机房照样能瞬间实现零延迟强一致
              why: 光缆断开时数据物理上过不去，不可能既保证两地随时可写又保证读写永远立刻一致
          explain: |
            这就是分布式系统最出名的**CAP 定理**。这一课用“购物车 vs 支付扣款”彻底讲透分区时选 **CP** 还是 **AP**。
      - card:
          title: CAP 定理：网络分区时只能选 C 或 A
          body: |
            **CAP 定理（CAP theorem）**指出分布式存储有三个指标：**C（强一致性 Consistency）**、**A（高可用性 Availability）**、**P（分区容错性 Partition Tolerance）**。因为跨机房光缆早晚会出故障（**P 无法避免**），发生分区时只能在两者间二选一：
          reveal:
            - title: 选 CP（一致性优先）：宁停勿乱
              body: |
                宁可拒绝少数派一侧的写请求（报错“系统维护/暂时不可用”），绝不让两边数据各自写分叉。**适用场景：银行转账、支付扣款、限量库存**。
            - title: 选 AP（可用性优先）：先接单后合并
              body: |
                两边都继续正常响应用户读写，允许短时间各写各的，等网络恢复后再按规则合并。**适用场景：购物车、社交点赞数、商品目录浏览**。
      - card:
          title: 例题：购物车选 AP 合并时的“复活商品”现象
          body: |
            如果购物车选了 AP，分区恢复合并时最简单的“取两地加购商品的并集”会出现一个有名现象——看看下面模拟代码：
          reveal:
            - title: 第 1 步：为什么“删过的商品又回来了”？
              body: |
                分区前购物车有 `{book, pen}`；分区期间，机房 A 删掉了 `pen` 变成 `{book}`，而机房 B 还保留着旧状态 `{book, pen}` 且新增了 `cup` 变成 `{book, pen, cup}`。恢复后若简单取并集 `A ∪ B`，`pen` 会重新复活。
            - title: 第 2 步：Python 演示并集合并与“删除墓碑”改进思路
              body: |
                给删掉的商品记一条带时间戳的“删除墓碑（Tombstone）”而不是直接抹掉记录，合并时谁版本更新听谁的：
                ```python
                # 简单取并集：A 删掉 pen，B 新增 cup，恢复后并集导致 pen 复活
                cart_a = {"book"}
                cart_b = {"book", "pen", "cup"}
                naive_merge = cart_a | cart_b

                # 改进思路：记录最后操作版本（或删除墓碑）再合并
                print(sorted(naive_merge))
                ```
      - item:
          id: cap-cart-vs-pay
          type: match
          prompt: |
            在跨机房网络分区（P 发生）的情况下，把不同业务场景和更合适的 CAP 取舍（CP 或 AP）连起来。
          pairs:
            - ["用户往购物车添加商品（收入优先，允许恢复后偶尔清理合并冲突）", "选 AP（可用性优先）"]
            - ["账户余额扣款与支付（绝不能同一笔钱在两边同时花两次）", "选 CP（强一致性优先）"]
            - ["分区期间在 CP 架构里被隔离的少数派机房收到写请求时", "拒绝写入并提示“暂时无法操作”"]
            - ["分区期间在 AP 架构里两边机房同时收到加购写入并随后恢复", "两地都能正常加购，恢复后合并可能出现刚删的商品复活"]
          explain: |
            没有绝对高贵的选项：赔钱风险远大于停服损失的交易账本选 CP；“用户能接着下单”比“短暂各自状态微差”重要的购物车选 AP。
      - item:
          id: cap-impossible-all-3
          type: choice
          prompt: |
            有人拍胸脯保证：“我的跨机房分布式数据库即使两地光纤彻底断了，也能保证北京和上海两边同时可写入、并且任何一毫秒读到的余额都一模一样。”这句话错在哪里？
          options:
            - text: 光纤断开期间消息物理上送不过去：要么两边各自写导致不一致（放弃 C），要么禁止至少一边写（放弃 A），不可能在 P 发生时同时做到 C 和 A
              correct: true
            - text: 错在没用足够贵的交换机，只要买贵交换机就能把断掉的光纤无中生有连起来
              why: 物理断网时没有任何数据包能穿过断开的光缆，这是物理和逻辑定律，跟交换机价格无关
            - text: 错在数据库没装在同一个机柜里；其实装在同一台机器上就不算分布了
              why: 题目明确说跨机房光纤断开，属于分布式网络分区场景
          explain: |
            网络分区是客观可能发生的事实，CAP 逼着架构师在灾难来临时提前写好取舍规则：到底保一致停服务，还是保服务容忍暂时的不一致。
      - item:
          id: cap-pacelc-note
          type: choice
          prompt: |
            在**没有发生网络分区**的平时（占 99.9% 的正常时间），分布式架构还要面对另一组权衡（PACELC 思想）：每次写入都要同步等跨省备用机房确认收到才算成功，会换来什么代价？
          options:
            - text: 平时写入更安全不丢数据（更高一致性/持久性），但每次请求的响应延迟（Latency）会明显升高
              correct: true
            - text: 跨省同步确认会让请求响应比单机写入快十倍
              why: 等待跨省光速往返必然增加几十毫秒延迟，不可能更快
            - text: 平时完全不需要考虑延迟和一致性的权衡
              why: 平时同样要在“强同步低风险但慢一点”与“异步同步快一点但有微小丢失窗口”之间权衡
          explain: |
            有分区（P）时在 A 和 C 间选；没分区（Else）时在延迟（L）和一致性（C）间选——这正是工程师每天都要做的真实取舍。

  - id: architecture-review
    chapter: 质量属性
    title: 架构评审、权衡点与敏锐点
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            花了两周画好了新架构图，准备明天全组 10 个人开工写代码。花 2 小时找几位资深开发和运维开一次“架构评审会”，按质量属性场景把图从头拷问一遍，值得吗？
          options:
            - text: 非常值得。在还没写几万行代码前花 2 小时揪出“吞吐瓶颈”和“互相冲突的决策”，能省掉后面几个月的返工
              correct: true
            - text: 没必要，开会纯属浪费时间，直接写完上线让用户帮着测最快
              why: 上线后才发现数据库撑不住或接口边界切错，改造成本比评审时高出几十倍
            - text: 评审就是大家一起夸一遍架构图有多好看，不能挑毛病
              why: 架构评审的真正价值是专门挑出脆弱假设、风险点和折中代价
          explain: |
            SWEBOK（《软件工程知识体系指南》）把**架构良好性（Goodness）**和**架构评审（Architecture Reviews）**放到一起：评审不是挑个人毛病，而是拿着质量属性场景找“敏感点”“权衡点”和“未暴露的风险”。
      - card:
          title: 架构评审找什么：敏感点、权衡点与风险
          body: |
            像 ATAM（架构权衡分析方法）这类评审方法，核心是拿着质量属性场景顺着架构追问三样东西，而不是去挑程序员个人编码毛病：
          reveal:
            - title: 敏感点（Sensitivity Point）与权衡点（Trade-off Point）
              body: |
                - **敏感点**：某个关键参数只要微调一点，某项质量属性就剧烈变化（例如：登录令牌或缓存过期时间直接决定安全窗口与数据库压力）。
                - **权衡点**：**一个决定同时往相反方向拉扯两个质量属性**。比如“加上同步强加密校验”提高安全性却拖慢延迟；“拆成微服务”提高团队自治却增加运维复杂度。
            - title: 未验证的风险（Risk）
              body: |
                还没实测或缺少保护的乐观假设（比如“假设下游第三方物流接口永远 50 ms 返回且永不限流”）。
      - item:
          id: tradeoff-vs-sensitivity
          type: match
          prompt: |
            把架构评审会上发现的三条结论，分别归类为**权衡点**、**敏感点**或**隐藏风险**。
          pairs:
            - ["开启跨机房强同步写入：提高了数据安全性，但同时拉高了下单延迟并降低了分区可用性", "权衡点（同时影响多个对立属性）"]
            - ["缓存过期时间（TTL，即缓存数据存活多久）的设定会高度决定数据库瞬时查询压力大小", "敏感点（单个关键参数牵动属性）"]
            - ["方案默认第三方物流接口峰值永不限流不超时，且未设超时降级", "未验证的架构风险"]
          explain: |
            识别出权衡点，就知道不能两头全占；识别出未设保护的外部假设（风险），立刻就能在写代码前补上超时和降级策略。
      - card:
          title: 例题：开一次 45 分钟的轻量架构评审检查表
          body: |
            小团队不需要繁文缛节，每次大改动前跑完四步清单就很有用：
          reveal:
            - title: 第 1 步：对齐场景（10 分钟）
              body: |
                确认 2–3 条最要命的质量属性场景（比如并发量、处理耗时上限、最怕哪种数据出错）。
            - title: 第 2 步：走查图与关键链路（20 分钟）
              body: |
                沿着 C4 容器/组件图把一条正常请求和一条“下游挂了/数据库慢了”的异常请求走一遍。
            - title: 第 3 步：标出权衡点与待验证原型（15 分钟）
              body: |
                记下拍板的权衡决定（写进 ADR），对拿不准的性能点（如某新队列吞吐）安排 1 天小压测验证，别靠猜。
      - item:
          id: review-goodness-choice
          type: choice
          prompt: |
            在架构评审时，“衡量一个架构好不好”最客观的标准是什么？
          options:
            - text: 看它能否在团队与预算等约束下，满足各个关键干系人提出的可测质量属性场景
              correct: true
            - text: 看架构图里用到的热门开源组件是不是最新发布的版本
              why: 新技术堆砌如果不解决真实场景需求反而增加风险，不能作为“好架构”的标准
            - text: 看架构图是不是对称美观、线条刚好凑成五角星
              why: 图只是表达工具，架构好坏取决于结构对业务、质量属性和演化代价的支撑
          explain: |
            好架构是针对特定约束和质量属性场景“刚刚好够用且留有演化余地”的设计，而不是组件越多越高级。
      - item:
          id: prototype-spike-why
          type: choice
          prompt: |
            评审会上，大家争论“新选的消息队列方案到底能不能扛住每秒 2000 条消息”。最好的解决方式是？
          options:
            - text: 花半天写一个最小可运行压测原型（Spike）实测真实延迟和吞吐，拿数据拍板而不是靠嘴争论
              correct: true
            - text: 谁职务高听谁的，绝不做任何实验测试
              why: 性能、兼容性这类客观约束应该靠实测验证，而不是靠职级猜测
            - text: 等半年后整个项目全部写完上线那天再看能不能扛住
              why: 上线当天才爆出队列性能不达标会导致严重事故和推倒返工
          explain: |
            对关键未知假设做极短时间的验证原型（Spike），是消除架构最大风险的最低成本手段。

  # ==== 架构决策和系统演化 ====
  - id: adr-records
    chapter: 架构决策和系统演化
    title: 架构决策记录 ADR 与重要需求 ASR
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            架构师做完决定（比如订单表用 PostgreSQL 不用 MongoDB）后，如果只把结果口头告诉大家，两年后新人入职看到代码，既不理解当时为何不用文档库，也不敢随便动表结构，或者干脆冒失推翻重做又踩进当年的坑。怎么低成本把“为什么这样选”留给未来的团队？
          options:
            - text: 在代码仓库里写一篇一页纸以内的“架构决策记录（ADR）”，记下背景、决策和后果
              correct: true
            - text: 写一份 300 页的 Word 文档存在某个已离职员工的个人电脑桌面
              why: 300 页没人读、放个人电脑会丢；应该简短且和代码一起进版本库
            - text: 在代码里每一行上面写一段两百字的感叹号长注释
              why: 分散的注释拼不出完整的候选方案对比与系统级取舍背景
          explain: |
            把架构看成“一组关键决策”，并用轻量级的 **ADR**把每次重大决策的前因后果存进仓库，是现代工程团队标配的记忆系统。
      - card:
          title: 什么是架构上重要的需求 ASR 与 ADR？
          body: |
            不是所有决定都值得写文档。只有由**架构上重要的需求（ASR）**驱动的重大结构或选型决定（改起来贵、影响多个模块），才写成一份**架构决策记录（ADR）**。

            经典 Nygard 模板只有五小块（一屏读完）：
            1. **标题（Title）**（如 `ADR-007 订单存储`）；
            2. **状态（Status）**（提议 / 已采纳 / 已取代）；
            3. **背景（Context）**：当前面临什么业务约束与技术矛盾；
            4. **决策（Decision）**：最终拍板选什么方案；
            5. **后果（Consequences）**：好后果 + 必须接受的坏后果/运维代价。
      - card:
          title: 例题：订单存储用 PostgreSQL 还是 MongoDB 的 ADR
          body: |
            看看一份标准、不回避缺点的实战 ADR 怎么写：
          reveal:
            - title: 第 1 步：背景与决策
              body: |
                **ADR-007 订单存储**
                - **背景**：订单包含订单头和明细行，需要全成功或全回滚的强事务保障（ACID，如扣库存与创建订单必须绑在一起）、按用户和时间范围查询以及财务对账报表；团队熟悉关系查询语言 SQL。
                - **决策**：使用 **PostgreSQL** 存订单，把变化较多、不用跨表关联的扩展属性放进 PostgreSQL 自带的 `JSONB`（可直接查询、可建索引的紧凑 JSON）列里。
            - title: 第 2 步：坦诚写明正反后果
              body: |
                - **后果**：获得严格的跨行一致性（ACID 事务）与外键约束、成熟的财务报表查询能力；但**代价**是以后表结构字段改动需要写迁移脚本，且单机写入量逼近上限后未来需要按用户分库或建分区表扩展。
      - item:
          id: adr-consequences-truth
          type: choice
          prompt: |
            写一份合格的 ADR 时，在“后果（Consequences）”一栏里最常见的新手毛病是什么？
          options:
            - text: 只写选定方案的优点报喜不报忧，故意不写它带来的局限、迁移成本或运维代价
              correct: true
            - text: 写了这个方案未来可能需要写表迁移脚本和分库扩展
              why: 坦诚记录缺点和未来演化应对路径，正是 ADR 最宝贵的部分
            - text: 控制在半页到一页以内、和代码一起放进 Git 仓库
              why: 短小精悍且随代码库一起版本控制，正是 ADR 的最佳实践
          explain: |
            每个选择都有代价。写清“我们知道这个选择会带来什么麻烦，并愿意接受它”，未来同事就不会以为前人考虑不周。
      - item:
          id: adr-immutable-history
          type: choice
          prompt: |
            两年后业务真涨到单机写不下，团队决定把某条旧 ADR 的方案替换成新方案。旧 ADR 文件应该怎么处理？
          options:
            - text: 保留旧 ADR 并把状态改为“已被 ADR-021 取代（Superseded）”，再新建 ADR-021 写明新决定
              correct: true
            - text: 直接把旧 ADR 文件彻底删掉并假装当初就用了新方案
              why: 删掉旧 ADR 会抹去为什么走了两年旧路、又因为什么阈值改变的历史上下文
            - text: 直接把旧 ADR 原文涂改成新方案并保留两年前的日期
              why: 篡改历史记录会让时间线和当初的代码提交完全对不上号
          explain: |
            ADR 就像系统架构的只追加账本：只改状态标记“已被某号取代”，绝不抹杀历史决策轨迹。
      - item:
          id: asr-vs-trivial
          type: choice
          prompt: |
            下面哪一项**最需要**写成正式 ADR，而哪几项不必？
          options:
            - text: 把全站身份验证从有状态 Session 切换成无状态签名令牌，决定跨服务的授权边界
              correct: true
            - text: 把一个私有辅助函数里的列表推导式改成普通 for 循环
              why: 私有实现细节随时可重构，不会跨团队或长期锁死架构，无需写 ADR
            - text: 调整 README 文档里的错别字
              why: 文档错别字改完提交即可，不属于架构级重要决策
          explain: |
            只为“改动成本高、跨模块边界、反映重要取舍”的 ASR 决策写 ADR，团队才不会厌倦而坚持写下去。
      - item:
          id: adr-order-db-match
          type: match
          prompt: |
            回顾“订单存储选 PostgreSQL 还是 MongoDB”的 ADR，把内容条目放进正确的 ADR 栏目。
          pairs:
            - ["订单含订单头与明细行、需事务与报表关联查询、团队熟 SQL", "背景（Context）"]
            - ["采用 PostgreSQL 存订单，可变扩展属性放可建索引的紧凑 JSON（JSONB）列", "决策（Decision）"]
            - ["获得强事务（ACID）与外键约束，但表变更需迁移脚本且单机写满后需分区/分库", "后果（Consequences）"]
          explain: |
            把背景、决策与正反后果各就各位，几分钟就能写出一份清晰可查的 ADR。

  - id: release-deployments
    chapter: 架构决策和系统演化
    title: 零停机发布：蓝绿、滚动、金丝雀、A/B 与影子流量
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            你的网站每天有几十万用户在用。现在要上线新版后端代码，如果直接把所有老服务器全关掉、更新完再全开机（重建部署），在更新那几分钟里网站就会彻底打不开。如果不希望新版本一出 bug 就全员遭殃，上线时先让 2% 的用户试跑新版本观察报错率，这叫什么发布方式？
          options:
            - text: 金丝雀发布（Canary）：先放极小比例真实流量试毒，指标正常再逐步放量
              correct: true
            - text: 重建部署（Recreate）：全部先停机再一次性全换
              why: 全停全换会造成明显的停机中断，而且出问题影响 100% 用户
            - text: 直接登录生产服务器手工修改线上文件，再通过刷新页面确认是否正常
              why: 无版本控制的线上手改既不可回滚又极易弄挂全部机器
          explain: |
            好的架构不仅要画得好，还要**发得稳、退得回**。这一课理清六种常见部署与发布策略，以及背后的发布分支管理。
      - card:
          title: 从停机重建到蓝绿、滚动部署
          body: |
            先用**发布分支（Release Branching）**锁定待测版本并修 bug，再选上线策略：
            - **重建（Recreate）**：先全停老版，再全起新版——简单但必然停机，只适合内网非全天工具。
            - **滚动（Rolling）**：一台台（或一批批）把老实例换成新实例——零停机且省机器，但新老版本会同时运行一段时间，回滚稍慢。
            - **蓝绿（Blue/Green）**：同时准备“老环境（蓝）”和“整套新环境（绿）”，测稳后负载均衡瞬间把全部流量切到绿；万一出事 1 秒切回蓝。代价是要双倍机器资源。
          reveal:
            - title: 为什么滚动与蓝绿都要求新版向后兼容？
              body: |
                不管是滚动切换途中，还是蓝绿准备瞬切回滚的那几分钟里，**老版本代码和新建数据库字段必须能同时正常工作**；并且用户登录态要放进共享缓存或无状态令牌，切到新版服务器时才不会把在线用户全踢掉线。
      - card:
          title: 精细控制风险与验证：金丝雀、A/B 与影子部署
          body: |
            想要更小爆炸半径或对照实验，用这三种进阶切流：
          reveal:
            - title: 金丝雀（Canary）vs A/B 测试
              body: |
                - **金丝雀发布（Canary）**：先引 `1%–5%` 真实流量进新版，紧盯报错率和延迟，没问题再扩大到 `20% → 100%`（控技术风险）。
                - **A/B 部署**：把用户按规则分成 A/B 两组看不同界面或推荐算法，统计哪组下单转化率更高（做产品效果实验）。
            - title: 影子部署（Shadow）与切流演示
              body: |
                - **影子部署（Shadow）**：把真实线上请求**复制一份**同时暗中发给新版跑一遍对比结果，但只把老版结果返回给用户——新版本哪怕崩了也零用户感知。
                ```python
                # 简单按请求编号做 5% 金丝雀分流
                routed = ["canary" if req_id % 100 < 5 else "stable" for req_id in range(100)]
                print(routed.count("canary"), routed.count("stable"))
                ```
      - item:
          id: canary-count-num
          type: number
          prompt: |
            某网关按 `req_id % 100 < 5` 的规则把请求送入金丝雀新版、其余走稳定老版：当连续来 `200` 个请求（编号 `0` 到 `199`）时，有多少个请求会被送进金丝雀新版本？
          answer: 10
          hint: 每 100 个连续编号里有 `0, 1, 2, 3, 4` 共 5 个落入金丝雀。
          explain: |
            `200 * 5% = 10` 个请求进入金丝雀，95%（190 个）留在稳定版观察安全性。
      - item:
          id: deploy-six-match
          type: match
          prompt: |
            把发布需求和最对症的部署策略连起来。
          pairs:
            - ["维护两套完整环境，瞬间全切且能秒级切回旧环境", "蓝绿部署（Blue/Green）"]
            - ["先放 2% 真实流量进新版盯错误率，稳妥后再逐步扩大比例", "金丝雀发布（Canary）"]
            - ["暗中复制一份线上流量给新版压测对比，完全不返回给真实用户", "影子部署（Shadow）"]
            - ["逐批替换集群里的旧节点，不额外买双倍机器做到零停机", "滚动部署（Rolling）"]
          explain: |
            记住各自取舍：蓝绿快切快退费双倍机器；滚动省钱但新老共存回滚稍慢；金丝雀控爆炸半径；影子零影响真流量试跑；A/B 测业务指标。
      - item:
          id: rolling-compat-trap
          type: choice
          prompt: |
            使用滚动发布或金丝雀发布期间，新旧两个版本会同时连接同一个数据库跑几十分钟。如果新版一上来就把旧版还在读的 `user_name` 列直接改名成 `full_name`，会发生什么？
          options:
            - text: 还没下线的旧版本实例查询 user_name 时立刻大规模报错。应先加新列双写过渡，等旧代码全下线后再删旧列
              correct: true
            - text: 数据库会自动帮旧版本代码翻译旧列名，完全不会报错
              why: 数据库不会替老进程自动改 SQL 列名，必须保证数据库变更前后兼容新旧两版代码
            - text: 金丝雀发布会自动阻止旧版本去连数据库
              why: 95% 的用户仍在旧版本上运行，旧版本必须继续正常读写数据库
          explain: |
            零停机发布的铁律是“先加后删（Expand-Contract）”：先兼容扩出新字段/接口，等所有旧实例全部退场后再清理旧字段。
      - item:
          id: ab-vs-canary-diff
          type: choice
          prompt: |
            金丝雀发布（Canary）和 A/B 部署都是把用户分流到不同版本，它们在目的上最核心的区别是什么？
          options:
            - text: 金丝雀关注技术风险控制（报错率、延迟正常就全量放开）；A/B 关注业务指标对照实验（哪版界面转化率高）
              correct: true
            - text: A/B 部署必须先停机 1 小时，金丝雀不用停机
              why: 两者都是在线分流发布，都不需要停机
            - text: 金丝雀绝对不能观察错误率指标
              why: 紧盯新版报错率和延迟正是金丝雀决定“继续放量还是回滚”的依据
          explain: |
            金丝雀问“新代码稳不稳”，A/B 测问“哪个产品方案更受用户欢迎”。

  - id: evolution-maintenance
    chapter: 架构决策和系统演化
    title: 软件演化规律与四类维护
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一个软件系统顺利上线了，所有需求当时都测通了。有人觉得：“以后不用再改它了，放在服务器上稳稳跑十年就行。”现实中为什么几乎所有仍在使用的系统都会不断越改越复杂？
          options:
            - text: 外部世界在变（新法规、新手机系统、新对手功能），系统不跟着演化就会逐渐失效；而只加补丁不整理结构会越来越乱
              correct: true
            - text: 因为软件运行时间越长，打包好的程序文件自身会随着调用次数增加而不断发生逻辑退化
              why: 代码变复杂是因为外部业务、运行环境和安全威胁不断变化，逼着人不停往里打补丁
            - text: 只要第一次设计得够好，世界和操作系统永远不会升级变化
              why: 真实业务、依赖库和硬件环境总在不断演进
          explain: |
            Lehman 的软件演化规律告诉我们：**只要软件还有人用，就必须持续演化**；而 SWEBOK 把上线后的维护工作清晰分成了四大类。
      - card:
          title: 软件演化规律与四类维护
          body: |
            上线不是终点，而是漫长**演化**的开始。Lehman 指出只要软件还在被真实使用，就必须持续适应变化；不主动整理结构时，每次小补丁都会叠加复杂度。SWEBOK 把维护分成四类：
          reveal:
            - title: 纠错性与适应性维护
              body: |
                - **纠错性维护（Corrective）**：修上线后发现的 bug（如算错优惠金额）。
                - **适应性维护（Adaptive）**：外部环境变了，代码跟着适配（如升级 Python 版本、适应新版操作系统或新税法）。
            - title: 完善性与预防性维护
              body: |
                - **完善性维护（Perfective）**：新增用户想要的功能、或优化性能提升体验。
                - **预防性维护（Preventive）**：在还没出大故障前主动重构坏味代码、清理技术债、升级有安全风险的旧库，让以后更好改。
      - item:
          id: maintenance-four-match
          type: match
          prompt: |
            把下面四项日常开发任务分别归进 SWEBOK 的四类维护里。
          pairs:
            - ["修复退款接口在金额为小数时四舍五入少算 1 分钱的缺陷", "纠错性维护（Corrective）"]
            - ["把支付库升级到适配云厂商最新 TLS 安全协议与新操作系统", "适应性维护（Adaptive）"]
            - ["给商城订单页增加“按商品名称搜索”并把加载速度优化一倍", "完善性维护（Perfective）"]
            - ["在还没爆雷前把臃肿的 800 行计费函数拆清并补全单元测试", "预防性维护（Preventive）"]
          explain: |
            修 bug 是纠错；跟外部环境/法规/平台变是适应；加新需求或提性能是完善；清技术债防未来腐烂是预防。
      - item:
          id: lehman-complexity-rule
          type: choice
          prompt: |
            Lehman 软件演化定律里提到“随着系统持续演化，它的复杂度会不断增加，除非主动做一件事”。必须主动做什么才能对抗复杂度攀升？
          options:
            - text: 持续投入重构与预防性维护，整理模块边界和清理过时代码，而不是只打补丁
              correct: true
            - text: 禁止任何人再给系统修 bug 或加新功能
              why: 停止修改会让软件很快脱离真实需求而被淘汰
            - text: 每次加功能前把原有测试用例全部删掉
              why: 删掉测试只会让团队彻底不敢动结构，加剧腐化
          explain: |
            只往房子里添家具却从不整理收纳，屋子很快就没法下脚；系统演化也一样需要定期做预防性整理。
      - item:
          id: maintenance-cost-fact
          type: choice
          prompt: |
            在实际软件工程生命周期里，下面哪项关于“初次开发”与“后续维护演化”成本对比的判断更符合事实？
          options:
            - text: 大多数长期运行软件的大部分总成本与工作量都花在上线后的持续维护与演化阶段，因此为可维护性投资非常划算
              correct: true
            - text: 99% 的成本都在第一版上线前花完，上线后几乎零维护工作
              why: 真实系统上线后往往还要运行并持续迭代数年甚至十几年
            - text: 维护只包括修拼写错误，从不涉及新增功能或适配环境
              why: 维护涵盖了适应性、完善性、纠错性和预防性全部持续演进工作
          explain: |
            正因为软件绝大多数生命都在“边跑边改”中度过，前期守住高内聚低耦合、清晰边界和 ADR 才如此值钱。

  - id: impact-reengineering
    chapter: 架构决策和系统演化
    title: 影响分析、接缝与软件再工程
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            要把系统里一个核心状态枚举值（或者数据库里的一列类型）改掉，最怕改完上线后才发现“财务对账报表脚本和移动端旧版 App 居然也在读它，全崩了”。动手改之前最该先做哪一步？
          options:
            - text: 做影响分析（Impact Analysis）：顺着依赖、接口、数据库表和事件订阅链，提前摸清这次改动会波及哪些模块和下游团队
              correct: true
            - text: 闭着眼睛先改完自己那个文件，出事了再说
              why: 不做影响分析极易在跨边界接口或异步事件上引爆连锁故障
            - text: 把整个系统里所有名字含这个词的注释全部删掉就行
              why: 真正出问题的是代码引用、持久化数据和跨服务消息契约，不是注释
          explain: |
            系统越大，改一处引起的涟漪越远。这一课学**影响分析**、演进式替换遗留系统的**接缝**，以及**软件再工程**。
      - card:
          title: 影响分析与遗留系统替换模式
          body: |
            **影响分析（Impact Analysis）**在动刀前追查四条涟漪链：
            1. 哪些类/模块直接调用了这个接口；
            2. 哪些数据库表或持久化文件存了这个格式；
            3. 哪些异步事件订阅方解析着这个字段；
            4. 哪些测试和文档需要同步更新。

            改不动老核心模块时，别直接硬砍：用**以抽象隔离分支（Branch by Abstraction）**在调用方和老实现之间插一层“接缝”接口，再在接口后面写好新实现，配合**并行运行（Parallel Run）**把输入同时喂给新老实现比对结果无误后再切换。
          reveal:
            - title: 以抽象隔离分支 + 并行比对的落地节奏
              body: |
                1. **搭接缝**：让所有调用方先改调统一抽象接口（底层仍指向老实现，上线零风险）。
                2. **暗跑新实现**：在接口背后逐步写出新实现，并用并行运行拿生产真实请求同时喂给新老两套算一次、自动记录结果差异。
                3. **切换清理**：确认连续多天零差异后，把接口指向切换到新实现，并删掉老代码分支。
      - card:
          title: 软件再工程（Reengineering）的常见步骤
          body: |
            如果一套核心老系统既没有文档、结构又极其混乱，但还得长期用下去，**软件再工程**按三步把它救活（不是盲目推翻重写）：
          reveal:
            - title: 第 1 步：逆向工程（看懂现状）
              body: |
                分析现有源码、数据库表和运行日志，画出目前真实的依赖关系与边界（往往跟过时文档完全不一样），并先补上保护现状行为的黑盒测试。
            - title: 第 2 步：重构与结构重组
              body: |
                利用提炼模块、消除重复、分离接口和清理坏味，在保持外部业务行为等价的前提下理顺内部架构。
            - title: 第 3 步：正向演化交付
              body: |
                沿着理顺后的接缝和清晰的模块边界，重新恢复安全快速添加新功能的能力。
      - item:
          id: impact-ripple-check
          type: choice
          prompt: |
            准备把“订单状态”里原有的 `"PENDING"` 拆分成 `"AWAITING_PAY"` 和 `"AWAITING_STOCK"` 两个更细状态。在做**影响分析**时，除了后端订单服务源码外，最容易遗漏、最必须排查的边界还有哪些？
          options:
            - text: 数据库存量历史数据的兼容与迁移、前端/移动端展示枚举、异步事件订阅方和财务对账 SQL 脚本
              correct: true
            - text: 只需要检查这一个函数里面有没有拼错单词就行
              why: 状态枚举会流进数据库历史行、前端展示和下游订阅事件，影响范围远超单个函数
            - text: 只需要修改定义枚举的那一行代码，不需要检查历史存量订单数据与下游报表消费方
              why: 影响分析必须同时覆盖代码调用点、存量数据库状态迁移以及外部上下游集成方
          explain: |
            跨边界的数据与事件格式改动影响面极广，做好影响分析后再决定用兼容过渡（先保留旧映射）还是一次迁移。
      - item:
          id: parallel-run-purpose
          type: choice
          prompt: |
            在替换一套高风险的“核心算税引擎”时，团队使用了**并行运行（Parallel Run）**模式：让老引擎继续算真实结果返回用户，同时把相同输入异步送给新引擎算一遍并比对两者差异。这样做的好处是？
          options:
            - text: 在零风险不影响真实用户的同时，用海量真实生产输入全面检验新引擎结果是否和老引擎一致
              correct: true
            - text: 能让两个引擎都不占用任何机器计算资源
              why: 并行运行特意多花了一份计算资源来换取极高的正确性信心
            - text: 并行运行会自动把新引擎变成硬件芯片
              why: 它是上线验证模式，与生成硬件无关
          explain: |
            对计费、算税、权限这类出错后果极严重的模块，并行运行 + 影子比对是替换遗留系统的定心丸。
      - item:
          id: reengineering-order
          type: order
          prompt: |
            按标准工程推进顺序，把**软件再工程**挽救混乱遗留系统的关键步骤排好。
          steps:
            - "逆向梳理真实源码与数据依赖，画出现状并补上行为兜底测试"
            - "设立接口接缝并分步清理耦合与数据边界，保持外部行为不变"
            - "必要时并行比对并渐进切流，安全淘汰老旧混乱路径"
            - "在清晰的新架构边界上恢复常规迭代与质量验证"
          explain: |
            先看懂并锁住现状行为（测试兜底），再借接缝重整结构或并行替换，最后恢复健康演进。

boss:
  items:
    - id: boss-c4-views
      type: match
      prompt: |
        把不同工程问题和最应该画给对应听众看的架构图或视图连起来。
      pairs:
        - ["向合作方说明系统有哪些用户角色、对接哪些外部银行系统", "C4 L1 系统语境图（Context）"]
        - ["向团队说明系统由前端、API 进程、数据库和队列组成及通信协议", "C4 L2 容器图（Container）"]
        - ["向运维展示各服务进程部署在哪些云节点和网络分区上", "物理 / 部署视图"]
        - ["向研发解释 API 进程内部按领域划出的鉴权、目录、转码模块", "C4 L3 组件图（Component）"]
      explain: |
        选对视图层级，产品、开发、运维各自一眼就能看到自己关心的问题边界。
    - id: boss-style-compare
      type: choice
      prompt: |
        对比分层架构、微服务架构和事件驱动架构，一个只有 5 名开发者的初创电商应该如何选择？
      options:
        - text: 选内部按业务领域划清边界的模块化单体（分层清晰、单机事务与运维极轻），待有明确瓶颈再沿边界拆分
          correct: true
        - text: 直接拆成 20 个微服务、20 个独立库加 3 条事件总线，哪怕只有 5 个人也要先做全套分布式
          why: 5 人团队根本承受不起 20 套服务、跨库事务和全套分布式观测运维的代价
        - text: 把页面、业务逻辑、数据库操作全写进一个不划分任何模块的文件里
          why: 不划分模块边界很快就会退化成谁也不敢改的大泥球
        - text: 只用事件驱动，连用户登录校验也改成发一条异步消息让用户等 10 分钟
          why: 登录校验和下单核心反馈需要强同步响应，不能全用异步消息
      explain: |
        5 人初创重在交付速度与结构清晰，“模块化单体”兼顾当下的低成本和未来的可拆性。
    - id: boss-qa-six-parts
      type: choice
      prompt: |
        下面哪一条才算完整的、可验收测试的**质量属性场景**？
      options:
        - text: 用户客户端（来源）在促销 1000 次/秒高峰（环境）提交下单请求（刺激），订单服务及数据库（制品）返回订单号（响应），p99 延迟 ≤ 300 ms 且错误率 < 0.1%（度量）
          correct: true
        - text: 下单系统在任何时候都必须体验丝滑、性能非常优异、绝不卡顿
          why: 缺少具体负载环境、制品目标与可测数字指标，无法编写压测验收脚本
        - text: 下单接口的代码全部采用最新版本框架，且开发团队内部约定模块目录按字母顺序排列
          why: 框架版本和源码目录组织属于开发期视角，无法作为衡量运行期延迟与错误率的可验证质量属性场景
        - text: 订单服务只有 200 行代码，且要求平时日均请求量低的时候响应快即可
          why: 代码行数不衡量运行期性能，且缺少明确的峰值刺激强度（1000 次/秒）和量化响应度量（p99 ≤ 300 ms）
      explain: |
        六要素（来源、刺激、环境、制品、响应、响应度量）缺一不可，把模糊形容词变成工程可测标准。
    - id: boss-p99-calc
      type: number
      prompt: |
        某下单接口压测时记录了 `100` 次请求延迟（`99` 次都是 `45 ms`，只有 `1` 次最慢耗时 `645 ms`），把耗时的非阻塞邮件/发票步骤改成异步队列后，那 `99` 次延迟全降为 `35 ms`，仅剩 `1` 次耗时 `235 ms`。如果仍按 100 个升序样本的 p99（第 99 个位置）衡量，异步改造后的 p99 延迟是多少毫秒？
      answer: 35
      explain: |
        升序前 99 个样本全都是 `35 ms`（第 100 个才是 `235 ms`），因此 p99 为 `35 ms`，远低于 300 ms 门槛。
    - id: boss-tactics-latency
      type: choice
      prompt: |
        为达成“峰值 1000 次/秒、p99 ≤ 300 ms”的目标，下面哪一组架构策略组合**最有效且合理**？
      options:
        - text: 无状态服务水平扩展 + 热点商品读缓存 + 异步队列剥离发票通知 + 限流降级保护核心链路
          correct: true
        - text: 所有商品详情查询一律跳过缓存每次直连主库全表扫描，且所有实例共用单台主库连接不设连接池上限
          why: 高频读不走缓存加上无界连接会迅速打垮主库 CPU 与连接资源，导致 p99 延迟飙升
        - text: 把所有用户的登录状态全死锁存在某一台下单服务器的局部变量里
          why: 有状态单机字典会直接阻断无状态水平扩展
        - text: 让每个下单请求在同步主链路里等待外部慢速邮件服务器生成 PDF 发票并发送成功后再返回订单号
          why: 把非核心耗时外部调用放进同步主链路会直接拉爆延迟和连接池，应当通过消息队列异步解耦
      explain: |
        水平扩展分流、缓存减读压、异步剥离非阻塞、限流保底，是扛住高并发低延迟的经典组合。
    - id: boss-cap-cart
      type: choice
      prompt: |
        购物车服务部署在两个跨地数据中心。突然光缆切断发生网络分区时，关于**购物车**（对比**支付扣款**）在 CAP 中的取舍与现象，哪项正确？
      options:
        - text: 购物车选 AP（两边继续可写，恢复合并时可能出现删过的商品重新出现）；支付扣款选 CP（少数派侧拒写以防双花超扣）
          correct: true
        - text: 购物车选 CP，一旦断开光缆立刻让全网一半用户打不开页面；支付选 AP，允许同一笔钱两边各花一次
          why: 刚好把两边对可用性和强一致性的业务容忍度弄反了
        - text: 只要装了消息队列，网络分区时两边不用互相连线也能瞬间零冲突保持强一致
          why: 光缆断开期间物理上收不到对端数据，队列消息也过不去
        - text: 选 AP 意味着分区期间两边数据库完全不保存任何用户加购操作
          why: AP 正是允许两边各自正常接单写入，只把合并冲突留到网络恢复后处理
      explain: |
        业务后果决定 CAP 立场：交易账本宁停勿乱（CP），购物车宁可多卖再顺手清理（AP）。
    - id: boss-adr-order
      type: choice
      prompt: |
        撰写关于“订单数据用 PostgreSQL 还是 MongoDB”的 **ADR-007** 时，下面哪一份记录体现了完整的 ADR 专业写法？
      options:
        - text: 写清背景（需强事务、关联报表及团队熟 SQL）、决策（用 PostgreSQL + JSONB 扩展属性列）与后果（得 ACID 跨行强事务/关联能力，但结构变更需迁移且单机写满后需分库或分区）
          correct: true
        - text: 只写一行“决定：用 PostgreSQL”，不写背景也不提迁移与扩容缺点
          why: 没背景和缺点的决策记录无法帮后来者判断环境改变后是否该推翻重选
        - text: 当两年后决定换库时，把 ADR-007 直接从历史里彻底删掉
          why: 应保留 ADR-007 并标注“已被新 ADR 取代”，保留演进上下文
        - text: 把订单表和数据库密码明文一起粘贴进公开文档
          why: 绝不能在文档里硬编码任何密码或凭证
      explain: |
        写全“背景、决策、正反后果”并用状态流转保留历史，ADR 才能真正成为团队的长期财富。
    - id: boss-deploy-match
      type: match
      prompt: |
        把零停机上线与遗留替换模式和它们的核心作用配对。
      pairs:
        - ["蓝绿部署（Blue/Green）", "切流和秒级回滚极快，但需要两套完整环境资源"]
        - ["金丝雀发布（Canary）", "只放 1%–5% 真实流量试跑新版，确认无误再扩大"]
        - ["影子部署（Shadow）", "暗中复制线上请求给新版跑但不返回给用户"]
        - ["绞杀者模式（Strangler Fig）", "在前置路由/接缝后逐块把旧单体功能迁进新服务"]
      explain: |
        不同发布与替换手段各自平衡了资源成本、影响半径和回滚速度。
    - id: boss-maintenance-type
      type: choice
      prompt: |
        上线半年的系统收到两项工作：① 因为国家电子发票新规要求新增税号字段，必须改开发票模块适配；② 工程师趁机把原来混乱的 400 行折扣函数拆小并补足测试以防以后难改。这两项分别属于哪种软件维护？
      options:
        - text: ① 适应性维护（Adaptive）；② 预防性维护（Preventive）
          correct: true
        - text: ① 纠错性维护；② 完善性维护
          why: 适应外部法规或环境变化是适应性维护；主动清理代码结构防腐化是预防性维护
        - text: 两个都属于生产环境事故紧急回滚
          why: 两者都是有计划的正常维护活动，不是回滚事故
        - text: 两个都不属于软件维护，软件上线后就没有维护工作
          why: 真实系统绝大多数工程投入都在上线后的四类演化维护中
      explain: |
        分清四类维护，团队才能为“预防性重构”单独留出排期，而不被无穷无尽的补丁压垮。
    - id: boss-monolith-decompose
      type: order
      prompt: |
        要把一个共享数据库的大单体逐步安全拆出独立的“物流服务”，按正确架构演进顺序排列下面四步。
      steps:
        - "先在单体内做影响分析，划清物流模块接口并禁止别的模块直读物流表"
        - "把物流数据迁出到独立存储，在前置网关或接缝处接入新物流服务"
        - "用少量灰度流量与并行比对验证新物流服务，稳定后切全量"
        - "确认不再有旧路径调用后，从老单体清理废弃物流代码"
      explain: |
        先解耦内部直读与表边界，再借接缝渐进切流验证，最后清理旧代码——这样拆出来的才是真正独立演化的健康架构。祝贺通关《软件架构》。
