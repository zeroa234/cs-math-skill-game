skill: H.2.7
version: 2
authors: [main-agent]
brief:
  why: 芯片是在一整片硅晶圆上一层层做出来的：长膜、光刻、刻蚀、掺杂，反复几十次。这一站先把一条 CMOS 工艺流程从头走一遍，再逐项讲后道互连和化学机械抛光、单晶和晶圆、洁净室和良率、光刻、氧化、扩散和离子注入、刻蚀、薄膜沉积，每一项都讲到能算出关键的数。
  outcomes:
    - 按顺序说出一条简化 CMOS 工艺从隔离、阱、栅、源漏到接触孔的主要步骤，说明侧墙、自对准硅化物、后栅工艺和鳍式晶体管的作用
    - 说明铜互连为什么用大马士革工艺加化学机械抛光，用 Black 方程估算电迁移寿命，比较换材料后的 RC
    - 说明直拉法、区熔法、杂质分凝和 SOI 晶圆的做法，估算每片晶圆的芯片数和洁净室的颗粒限值
    - 用泊松和负二项模型算良率，用控制图和过程能力指数判断工序是否受控
    - 用瑞利判据和焦深公式估算光刻的分辨率，说明浸没、光学邻近效应修正、多重图形、EUV 和纳米压印
    - 用 Deal–Grove 模型算氧化时间，算高 k 介质的等效氧化层厚度
    - 用 erfc 和高斯解算扩散的结深和表面浓度，算离子注入的剂量、峰值浓度和掩蔽厚度，说明退火的作用
    - 算刻蚀的选择比和过刻损失，说明各向异性刻蚀的机理；用 Grove 模型判断 CVD 的控制步骤，比较 CVD、ALD、溅射和蒸发的台阶覆盖
terms:
  - term: 晶圆
    def: 做芯片用的一片很薄的圆形单晶硅片，主流直径 300 mm，一片上同时做几百个芯片。
  - term: 半导体
    def: 导电能力介于导体和绝缘体之间、掺进极少量杂质就能大幅改变导电能力的材料，如硅。
  - term: 掺杂
    def: 有意往半导体里掺进少量杂质原子，以改变它的导电类型和导电能力。
  - term: n型半导体
    def: 掺进磷、砷等杂质、多出能自由移动的电子的半导体。
  - term: 空穴
    def: 半导体里缺了一个电子的位置，会像带正电的粒子一样移动、参与导电。
  - term: p型半导体
    def: 掺进硼等杂质、导电主要靠空穴的半导体。
  - term: 载流子
    def: 半导体里能移动、参与导电的电子和空穴的统称。
  - term: PN 结
    def: p型区和 n型区相接的界面，电流容易从 p 流向 n，反过来很难。
  - term: MOSFET
    def: 金属-氧化物-半导体场效应晶体管：栅极隔着薄绝缘层控制源漏之间的沟道是否导通。
  - term: CMOS
    def: 在同一块芯片上同时做 NMOS 和 PMOS、成对使用的电路和工艺。
  - term: 光刻
    def: 用光把掩模上的图形转到晶圆上的光刻胶里的工艺步骤。
  - term: 刻蚀
    def: 把没有光刻胶保护的材料去掉、把图形转移到下面膜层上的工艺步骤。
  - term: 浅槽隔离
    def: 在器件之间刻出浅沟槽、填满二氧化硅再磨平，把相邻器件绝缘隔开的结构。
  - term: 阱
    def: 在晶圆上掺成和衬底不同或更合适类型的区域，n 阱里做 PMOS，p 阱里做 NMOS。
  - term: 阈值电压
    def: MOSFET 开始导通所需的栅源电压，记作 $V_{th}$，由栅下的掺杂和栅氧化层厚度决定。
  - term: 后栅工艺
    def: 先用多晶硅假栅占位完成高温的源漏工序，最后挖掉假栅填入高 k 介质和金属栅的工艺。
  - term: 轻掺杂漏
    def: 漏极靠近沟道处一段掺杂较轻的区域，用来降低漏端的峰值电场。
  - term: 侧墙
    def: 沉积一层介质再向下刻蚀后留在栅极两侧的条带，用来挡住源漏重掺杂注入。
  - term: 耗尽区
    def: PN 结两侧载流子被赶走、几乎不导电的区域。
  - term: 自对准硅化物
    def: 整片沉积金属后加热，只在露出的硅上生成的低电阻金属硅化物，不需要光刻对准。
  - term: 鳍式晶体管
    def: 沟道做成竖立的薄硅片、栅极从顶面和两侧包住它的晶体管，即 FinFET。
  - term: 后道
    def: 晶体管做完以后在上面做多层金属互连的工艺部分。
  - term: 层间介质
    def: 后道里隔开上下两层金属线的绝缘层。
  - term: 通孔
    def: 穿过层间介质、连接上下两层金属线的金属柱。
  - term: 大马士革工艺
    def: 先在介质里刻出沟槽和孔，再填满金属、把表面多余金属磨掉的布线工艺，用于铜互连。
  - term: 电迁移
    def: 大电流密度下电子推动金属原子移动，使导线出现空洞而断开的失效机理。
  - term: 低 k 介质
    def: 相对介电常数比二氧化硅（3.9）低的层间介质，用来减小连线电容。
  - term: 化学机械抛光
    def: 把晶圆压在旋转的抛光垫上、借抛光液的化学作用和磨粒把表面磨平的工艺。
  - term: 晶格
    def: 晶体里原子按固定规律重复排列形成的格子。
  - term: 晶格常数
    def: 晶格里重复单元的边长，硅为 0.5431 nm。
  - term: 密勒指数
    def: 用三个整数表示晶体里的方向和晶面的记号，如 (100)、(111)。
  - term: 直拉法
    def: 把籽晶浸入坩埚里的熔融硅、边旋转边提拉长出单晶棒的方法。
  - term: 区熔法
    def: 用线圈只熔化多晶硅棒的一小段、让熔区移动而长成单晶的方法，不用坩埚，纯度高。
  - term: 分凝系数
    def: 凝固时进入晶体的杂质浓度与熔体中杂质浓度之比。
  - term: 绝缘体上硅
    def: 在薄单晶硅层和硅衬底之间夹一层二氧化硅的晶圆，即 SOI。
  - term: 洁净室
    def: 空气经高效过滤、颗粒极少的生产车间，按单位体积允许的颗粒数分级。
  - term: RCA 清洗
    def: 用 SC-1（氨水和过氧化氢）去颗粒和有机物、SC-2（盐酸和过氧化氢）去金属的经典晶圆清洗方法。
  - term: 吸杂
    def: 用晶圆内部或背面的缺陷抓住金属杂质，使它们离开表面器件区的方法。
  - term: 良率
    def: 一片晶圆上能正常工作的芯片所占的比例。
  - term: 参数
    def: 芯片和工艺里可以测量的数值指标，如线宽、氧化层厚度、阈值电压。
  - term: 正态分布
    def: 围绕平均值左右对称、中间高两边低的钟形分布，很多工艺参数的波动近似服从它。
  - term: 标准差
    def: 衡量数据围绕平均值波动大小的量，记作 σ。
  - term: 控制图
    def: 按时间画出工序参数、并标出平均值和上下控制线的图，用来发现工序异常。
  - term: 光刻胶
    def: 涂在晶圆上的感光高分子材料，曝光后在显影液里的溶解速度改变，从而留下图形。
  - term: 掩模
    def: 画有电路某一层图形的石英板，光刻时决定光刻胶哪里被曝光。
  - term: 投影
    def: 光刻中用透镜把掩模的像缩小后成在晶圆上的曝光方式。
  - term: 衍射
    def: 光通过尺寸接近波长的开口时向四周散开的现象。
  - term: 数值孔径
    def: 透镜能收进光的最大角度的量度，NA = n sin θ，越大能分辨的线越细。
  - term: 瑞利判据
    def: 光刻能分辨的最小线宽 R = k₁λ/NA。
  - term: 焦深
    def: 成像保持清晰的上下范围，DOF = k₂λ/NA²，NA 越大焦深越小。
  - term: 正胶
    def: 曝光部分在显影液里溶掉、留下未曝光部分的光刻胶。
  - term: 负胶
    def: 曝光部分交联变硬留下、未曝光部分溶掉的光刻胶。
  - term: 化学放大胶
    def: 曝光产生少量酸、在曝光后烘烤时由酸催化大量反应的光刻胶，灵敏度高，用于深紫外光刻。
  - term: 对比度
    def: 光刻胶从开始溶解到完全溶解所需剂量变化的陡峭程度，γ = 1/log₁₀(D₁₀₀/D₀)。
  - term: 光学邻近效应修正
    def: 按光学模型预先修改掩模图形，使成像变形后正好得到想要图形的方法。
  - term: 纳米压印
    def: 把刻有图形的模板压进液态胶里、紫外固化后取下模板来复制图形的方法。
  - term: 高 k 介质
    def: 介电常数比二氧化硅大得多的栅介质，如二氧化铪，同样电容下可以做得更厚、漏电更小。
  - term: 等效氧化层厚度
    def: 和某层介质电容相同的二氧化硅的厚度，EOT = 物理厚度 × 3.9/k。
  - term: 扩散
    def: 杂质原子在高温下从浓度高处向浓度低处的净移动。
  - term: 扩散系数
    def: 菲克定律里通量与浓度梯度之比的系数 D，随温度按指数增大。
  - term: 方块电阻
    def: 一块正方形薄层两边之间的电阻，与正方形大小无关，单位 Ω/□。
  - term: 离子注入
    def: 把杂质电离、加速后打进晶圆的掺杂方法，剂量和深度能精确控制。
  - term: 剂量
    def: 离子注入中每平方厘米打进的离子数。
  - term: 投影射程
    def: 注入离子停下的平均深度 R_p。
  - term: 核阻止
    def: 注入离子和靶原子核碰撞而损失能量的过程，会把原子撞离原位，造成损伤。
  - term: 电子阻止
    def: 注入离子在电子云中穿行、把能量交给电子而减速的过程，几乎不造成晶格损伤。
  - term: 沟道效应
    def: 离子沿晶体中原子排成的通道方向进入、碰撞很少而钻得过深的现象。
  - term: 退火
    def: 注入或其他工序之后加热，修复晶格损伤并让杂质进入能导电的位置。
  - term: 各向同性
    def: 在各个方向上刻蚀速度相同，会向掩模下面横向钻蚀。
  - term: 各向异性
    def: 只沿一个方向（通常向下）刻蚀、几乎不横向钻蚀。
  - term: 选择比
    def: 要刻的材料与不该刻的材料（下层或掩模）刻蚀速度之比。
  - term: 等离子体
    def: 部分电离的气体，含有电子、离子和活性很强的中性碎片，整体呈电中性。
  - term: 反应离子刻蚀
    def: 离子垂直轰击加速表面化学反应的干法刻蚀，兼有方向性和选择性。
  - term: 原子层刻蚀
    def: 交替进行表面改性和去除两步、每一步自限制、每轮刻掉固定厚度的刻蚀方法。
  - term: 化学气相沉积
    def: 让气体在加热的晶圆表面发生化学反应、生成固体薄膜的沉积方法。
  - term: 台阶覆盖
    def: 薄膜在台阶侧壁或沟槽底部的厚度与顶面厚度之比。
  - term: 原子层沉积
    def: 交替通入两种反应气体、每一步只长一层就自己停下的沉积方法，台阶覆盖接近 100%。
  - term: 物理气相沉积
    def: 用蒸发或溅射把材料原子从源搬到晶圆上的沉积方法。
  - term: 溅射
    def: 用氩离子撞击靶材、把靶上原子撞出来沉积到晶圆上的物理气相沉积方法。
lessons:
  - id: planar-process
    chapter: CMOS工艺集成
    title: 芯片是怎样一层层做出来的
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一块指甲盖大的芯片上有几十亿个晶体管。它们是怎样做出来的？
          options:
            - text: 在整片硅上同时做出所有晶体管，一层一层地加工
              correct: true
            - text: 先一个个做好晶体管，再用机器把它们焊到硅片上
              why: 几十亿个零件逐个焊接不可能做到，也做不了这么小；所有晶体管是在同一片硅上同时成形的
            - text: 用很细的激光把晶体管一个个刻出来
              why: 逐个刻写太慢；实际是用光把整层图形一次照到硅片上，再一层层加工
          explain: 芯片是在一整片圆形硅片上同时做出来的：每一步都对整片同时加工，同一层的图形一次成形，几十层叠起来就是完整的电路。
      - card:
          title: 晶圆和半导体
          body: |
            芯片做在一片很薄的圆形单晶硅片上，叫**晶圆（wafer）**，现在主流直径 300 mm。一片晶圆上同时做几百个芯片，最后再切开。

            硅是一种**半导体（semiconductor）**：导电能力介于导体和绝缘体之间，而且掺进极少量的别的原子就能大幅改变。
      - card:
          title: n型和 p型
          body: |
            有意往硅里掺进杂质的过程叫**掺杂（doping）**。掺进磷或砷，多出能自由移动的电子，叫 **n型半导体（n-type semiconductor）**；掺进硼，硅里缺了电子的位置会像带正电的粒子一样移动，这个位置叫**空穴（hole）**，这样的硅叫 **p型半导体（p-type semiconductor）**。电子和空穴统称**载流子（carrier）**。p型区和 n型区相接的界面叫 **PN 结（PN junction）**。
      - item:
          id: dopant-type
          type: choice
          prompt: 往硅里掺硼，得到的是哪种半导体？
          options:
            - text: p型，导电主要靠空穴
              correct: true
            - text: n型，导电主要靠电子
              why: 掺磷、砷才多出电子成为 n型；硼比硅少一个外层电子，留下的是空穴
            - text: 掺得这么少，硅还是基本不导电
              why: 极少量的硼就能把硅的导电能力改变好几个数量级，并决定它是 p型
          explain: 硼原子比硅少一个外层电子，接进晶体后留下一个缺电子的位置，也就是空穴，所以掺硼得到 p型硅。
      - card:
          title: MOSFET 和 CMOS
          body: |
            芯片里的晶体管多是 **MOSFET（metal-oxide-semiconductor field-effect transistor）**：硅表面盖一层很薄的绝缘层（栅氧化层），上面是导电的栅极；栅极两边的硅里各掺一块和衬底（晶圆本体）相反类型的区域，叫源极和漏极。栅极加上合适的电压，栅下一薄层硅变成和衬底相反的类型（叫反型），形成导电的沟道，源漏就导通了。

            在 p型硅上做 n型源漏的叫 NMOS，在 n型区上做 p型源漏的叫 PMOS。两种都做、成对使用，叫 **CMOS（complementary MOS）**。
      - item:
          id: nmos-sd
          type: choice
          prompt: 一个 NMOS 做在 p型的硅上。它的源极和漏极应该掺成什么类型？
          options:
            - text: n型
              correct: true
            - text: p型，和衬底一样
              why: 源漏要和衬底相反，栅下才会出现连接两边的 n型沟道；和衬底同型就没有开关作用了
            - text: 不用掺杂，直接接金属
              why: 源漏是掺杂区，金属只是通过接触孔连到它们上面
          explain: NMOS 的名字就说明了源漏和沟道都是 n型。它做在 p型硅上，栅压让表面反型出一层电子，把两块 n型区连起来。
      - card:
          title: 平面工艺：长膜和光刻
          body: |
            所有结构都从晶圆表面往上、往里一层层做出来，叫平面工艺。第一类步骤是长一层膜：热氧化（把硅表面变成二氧化硅）或沉积（把别的材料铺上去）。

            第二类是**光刻（lithography）**：在膜上涂一层感光的**光刻胶（photoresist）**，用光透过**掩模（mask）**照到胶上（掩模是画着这一层图形的石英板，透光处决定胶哪里被照到），再用显影液洗掉该溶掉的胶，叫显影，胶上就留下了图形。
      - item:
          id: what-sets-pattern
          type: choice
          prompt: 一次光刻之后，光刻胶上留下什么图形，主要由什么决定？
          options:
            - text: 掩模上哪里透光、哪里不透光
              correct: true
            - text: 曝光时间的长短
              why: 曝光时间只决定照得够不够，图形的形状来自掩模
            - text: 晶圆本身的晶体取向
              why: 晶体取向和胶上的图形无关；图形是掩模通过光“印”上去的
          explain: 光只从掩模透光的地方照到胶上，被照到和没被照到的胶在显影时一个溶掉、一个留下，图形就是掩模图形的复制。
      - card:
          title: 刻蚀和掺杂
          body: |
            第三类是**刻蚀（etching）**：把没有胶保护的膜去掉，图形就转移到膜上；可以用溶液，也可以用**等离子体（plasma）**，即被电场电离成离子、电子和活性碎片的气体。

            第四类是掺杂：**离子注入（ion implantation）**把杂质离子加速后打进没被挡住的硅里；**扩散（diffusion）**是在高温下让杂质从表面的浓处往里面的淡处移动。注入后要加热修复撞乱的晶体、让杂质能导电，叫**退火（annealing）**。
      - card:
          title: 例题：做一块 n型区
          body: 要在 p型硅片上某个指定的方块里做一块 n型区，其余地方保持 p型。用长膜、光刻、刻蚀、掺杂这四类步骤排出做法。
          reveal:
            - title: 第 1 步：先盖一层能挡住杂质的膜
              body: 热氧化，在整片硅上长一层二氧化硅。
            - title: 第 2 步：把方块的位置开出来
              body: 涂光刻胶，光刻曝光、显影，只有方块那里的胶被去掉；再刻蚀掉方块里露出来的氧化层，然后去掉胶。
            - title: 第 3 步：掺杂
              body: 把磷注入进去，氧化层挡住的地方进不去，只有开口里的硅变成 n型。最后可以去掉这层氧化层。
      - item:
          id: planar-order
          type: order
          prompt: 在一层氧化层上开出一个窗口，下面这些步骤按什么顺序做？
          steps:
            - 涂光刻胶
            - 曝光
            - 显影
            - 刻蚀没有胶保护的氧化层
            - 去掉剩下的胶
          explain: 先有胶才能曝光；显影后胶的图形才出现；刻蚀时胶保护不该去掉的地方；最后胶完成了任务，去掉。
      - item:
          id: mask-count
          type: number
          prompt: 某工艺流程一共有 40 次光刻，每次光刻后平均有 15 道其他工序（刻蚀、注入、清洗、检测等）。只算这两类，大约有多少道工序？
          answer: 640
          hint: 光刻本身算不算一道工序？
          explain: 每次光刻对应 $1 + 15 = 16$ 道，$40\times16 = 640$ 道。这就是一片晶圆要在工厂里流转两三个月的原因。
  - id: isolation-wells
    chapter: CMOS工艺集成
    title: 隔离和阱
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一块硅上紧挨着做了两个晶体管。如果什么都不做，会出什么问题？
          options:
            - text: 两个晶体管之间可能有电流漏过去，互相干扰
              correct: true
            - text: 没有问题，硅本身不导电
              why: 掺过杂的硅是导电的；相邻两个管子的掺杂区之间如果没有绝缘隔开，就可能导通
            - text: 两个晶体管会合并成一个
              why: 它们仍是两个器件，问题是之间会有不想要的漏电通路
          explain: 相邻器件之间要用绝缘的东西隔开，否则电流会从一个管子漏到另一个。
      - card:
          title: 浅槽隔离
          body: |
            现代 CMOS 用**浅槽隔离（STI, shallow trench isolation）**把相邻器件隔开：先在硅上长一层薄氧化层，再沉积一层氮化硅（另一种绝缘材料，比二氧化硅难磨）；光刻后刻出器件之间的沟槽；用沉积的二氧化硅把沟槽填满；最后用**化学机械抛光（CMP, chemical-mechanical polishing）**（压在旋转的抛光垫上，靠抛光液和磨粒磨平）把表面磨平，磨到氮化硅停下，再去掉氮化硅。

            器件做在没有沟槽的“岛”上，岛与岛之间是二氧化硅，互相绝缘。
      - item:
          id: sti-stop
          type: choice
          prompt: 浅槽隔离里，留在沟槽外、器件区上方的那层氮化硅主要起什么作用？
          options:
            - text: 化学机械抛光磨到它就停下，保护下面的硅
              correct: true
            - text: 填满沟槽，起绝缘作用
              why: 填沟槽的是沉积的二氧化硅；氮化硅只在沟槽外的表面上
            - text: 作为晶体管的栅极
              why: 栅极在后面的步骤才做，氮化硅在隔离做完以后就去掉了
          explain: 氮化硅比二氧化硅难磨得多，抛光到它时速度明显变慢，正好停在这里，器件区的硅不会被磨坏。
      - card:
          title: 阱
          body: |
            CMOS 要在同一片硅上做 NMOS 和 PMOS。NMOS 需要 p型的底，PMOS 需要 n型的底，所以在晶圆上划出一些区域，掺成需要的类型，叫**阱（well）**：n 阱里做 PMOS，p 阱里做 NMOS。

            阱用离子注入做成：先用光刻胶挡住不该注入的区域，再注入磷（n 阱）或硼（p 阱）。现在常用较高能量把杂质注得比较深，使阱里深处的浓度比表面高，叫倒掺杂阱，可以减小相邻器件之间不想要的导通。
      - item:
          id: well-type
          type: choice
          prompt: 在 p型晶圆上做 CMOS，至少还需要做哪种阱？
          options:
            - text: n 阱，用来放 PMOS
              correct: true
            - text: p 阱，用来放 NMOS
              why: 晶圆本来就是 p型，NMOS 可以直接做在上面；缺的是 PMOS 需要的 n型底
            - text: 不用做阱，两种管子都能直接做在 p型硅上
              why: PMOS 的源漏是 p型，必须做在 n型区里才能和底隔开、形成 p型沟道
          explain: p型晶圆本身就能放 NMOS，只需再做 n 阱放 PMOS。现在的工艺往往两种阱都做，以便分别调好各自的掺杂。
      - card:
          title: 例题：两次阱注入的掩模
          body: 在 p型晶圆上做 n 阱和 p 阱各一次注入。每次注入前用光刻胶挡住不该注入的区域。一共要几次光刻，每次光刻胶留在哪里？
          reveal:
            - title: 第 1 步：n 阱注入
              body: 一次光刻，胶留在将来做 NMOS 的区域上，开口露出 PMOS 区，注入磷。
            - title: 第 2 步：p 阱注入
              body: 去掉胶，再一次光刻，这次胶留在 PMOS 区上，开口露出 NMOS 区，注入硼。
            - title: 第 3 步：退火
              body: 两次注入后加热，让杂质激活并修复损伤。共 2 次光刻，两次的图形正好互补。
      - item:
          id: well-masks
          type: number
          prompt: 一个工艺做隔离用 1 次光刻，n 阱、p 阱各用 1 次光刻，另外 NMOS 和 PMOS 各有一次调整表面掺杂的浅注入，各用 1 次光刻。到这里一共几次光刻？
          answer: 5
          hint: 把每一步各要的光刻次数加起来是多少？
          explain: 隔离 1 次，两个阱 2 次，两个阈值调整 2 次，共 5 次。每多一种器件或一次单独的注入，就多一次光刻和一张掩模。
      - item:
          id: retrograde
          type: choice
          prompt: 倒掺杂阱为什么把杂质浓度的峰值放在阱的深处？
          options:
            - text: 深处浓度高能压住器件之间深层的漏电，表面浓度又不至于太高
              correct: true
            - text: 为了让阱的表面不导电
              why: 阱的表面要做晶体管，仍要有合适的掺杂；深处更浓是为了压住深层的漏电通路
            - text: 离子注入只能把杂质注到深处
              why: 改变注入能量就能改变深度，浅注入和深注入都可以做
          explain: 晶体管工作在表面附近，表面掺杂决定管子开始导通要多高的栅压；深处加浓可以阻断器件之间、阱和衬底之间的寄生电流，两者可以分别优化。
  - id: vt-gate
    chapter: CMOS工艺集成
    title: 阈值调整和栅极
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 想让一个 NMOS 需要更高的栅压才导通，可以怎样改它的结构？
          options:
            - text: 往栅下的硅表面多掺一些和衬底同型的杂质
              correct: true
            - text: 把栅极做得更宽
              why: 栅宽改变的是导通后的电流大小，不改变开始导通所需的栅压
            - text: 把电源电压调高
              why: 电源电压是使用条件，不是器件结构；开始导通的栅压由掺杂和氧化层决定
          explain: 栅下表面的 p型掺杂越重，要把表面反型成 n型就需要越高的栅压。所以用一次浅注入就能调整开始导通的栅压。
      - card:
          title: 阈值电压和阈值调整注入
          body: |
            MOSFET 开始导通所需的栅极和源极之间的电压（栅源电压）叫**阈值电压（threshold voltage）** $V_{th}$。它取决于栅下硅表面的掺杂和栅氧化层的厚度。为了把它调到设计值，在长栅氧之前往表面浅注入一层杂质，叫阈值调整注入。

            注入的剂量 $Q$（每平方厘米多少个离子）在表面形成一层电荷，相当于给栅压加了一个偏移：

            $$\Delta V_{th} = \frac{qQ}{C_{ox}},\qquad C_{ox} = \frac{\varepsilon_{ox}}{t_{ox}}$$

            $\varepsilon_{ox} = 3.9\varepsilon_0$ 是二氧化硅的介电常数，$t_{ox}$ 是栅氧厚度。NMOS 注硼使 $V_{th}$ 升高。
      - card:
          title: 例题：算阈值的移动
          body: 栅氧厚 5 nm，往 NMOS 沟道区注入剂量 $10^{12}\ \text{cm}^{-2}$ 的硼（全部留在表面附近、全部电离）。$V_{th}$ 移动多少？（$\varepsilon_0 = 8.854\times10^{-14}$ F/cm，$q = 1.602\times10^{-19}$ C）
          reveal:
            - title: 第 1 步：单位面积的栅电容
              body: $C_{ox} = 3.9\times8.854\times10^{-14}/(5\times10^{-7}\ \text{cm}) = 6.91\times10^{-7}\ \text{F/cm}^2$。
            - title: 第 2 步：注入的电荷
              body: $qQ = 1.602\times10^{-19}\times10^{12} = 1.602\times10^{-7}\ \text{C/cm}^2$。
            - title: 第 3 步：相除
              body: $\Delta V_{th} = 1.602\times10^{-7}/(6.91\times10^{-7}) = 0.23$ V，阈值升高 0.23 V。
      - item:
          id: vt-shift
          type: number
          prompt: 栅氧厚 2 nm，往 NMOS 沟道区注入剂量 $5\times10^{12}\ \text{cm}^{-2}$ 的硼（全部留在表面附近、全部电离）。按 $\Delta V_{th} = qQ/C_{ox}$，阈值移动多少伏？（$\varepsilon_{ox} = 3.9\times8.854\times10^{-14}$ F/cm，$q = 1.602\times10^{-19}$ C）
          answer: 0.464
          tolerance: 0.002
          unit: V
          hint: 2 nm 是多少厘米？$C_{ox}$ 是多少？
          explain: $C_{ox} = 3.453\times10^{-13}/(2\times10^{-7}) = 1.73\times10^{-6}\ \text{F/cm}^2$，$\Delta V_{th} = 1.602\times10^{-19}\times5\times10^{12}/(1.73\times10^{-6}) = 0.464$ V。氧化层越薄，同样剂量移动得越少。
      - item:
          id: vt-dose
          type: number
          prompt: 栅氧厚 5 nm（$C_{ox} = 6.91\times10^{-7}\ \text{F/cm}^2$）。要让 NMOS 的阈值升高 0.3 V，阈值调整注入的剂量要多少？用 $10^{12}\ \text{cm}^{-2}$ 作单位填数字。
          answer: 1.29
          tolerance: 0.01
          unit: ×10¹² cm⁻²
          hint: 由 $\Delta V_{th} = qQ/C_{ox}$ 解出 $Q$ 是什么？
          explain: $Q = \Delta V_{th} C_{ox}/q = 0.3\times6.91\times10^{-7}/(1.602\times10^{-19}) = 1.29\times10^{12}\ \text{cm}^{-2}$。
      - card:
          title: 栅氧和假栅
          body: |
            阈值调好后长栅氧化层，在上面沉积多晶硅，光刻、刻蚀出栅极条。传统工艺里这条多晶硅就是栅极，并且它本身挡住了源漏注入，源漏自然对准栅的两边，叫自对准。

            先进工艺里二氧化硅太薄会漏电，改用高 k 介质（介电常数大，同样电容下能做厚）加金属栅。可金属栅经不起源漏退火的高温，于是先用多晶硅做一条“假栅”占位、完成源漏，最后把假栅挖掉，填进高 k 介质和金属，叫**后栅工艺（gate-last / replacement metal gate）**。
      - item:
          id: dummy-gate
          type: choice
          prompt: 后栅工艺里，为什么先做一条多晶硅假栅，最后才换成金属栅？
          options:
            - text: 金属栅经不起源漏激活退火的高温，要等高温步骤做完再放进去
              correct: true
            - text: 多晶硅导电比金属好
              why: 金属的电阻率比多晶硅低得多；用假栅是为了避开高温
            - text: 为了省一次光刻
              why: 后栅工艺反而更复杂；它解决的是金属栅和高 k 介质在高温下性能变坏的问题
          explain: 源漏注入后要上千摄氏度的退火激活杂质。先用多晶硅占位，让它承受高温并作为源漏自对准的边界；最后挖掉换成金属，金属栅就不经历高温。
  - id: sd-contacts
    chapter: CMOS工艺集成
    title: 源漏、侧墙和接触
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 源极和漏极是在栅极做好之后才注入的。注入时离子落在栅极上会怎样？
          options:
            - text: 被栅极挡住，源漏自动对齐栅
              correct: true
            - text: 穿过栅极进入沟道，把沟道也掺成 n型
              why: 选的注入能量让离子停在栅极里，栅下的沟道被挡住
            - text: 把栅极打碎
              why: 注入会在栅极里造成一些损伤，退火可以修复；栅极的主要作用是当注入的挡板
          explain: 栅极本身就是源漏注入的掩模，源漏边缘自动对齐栅极边缘，不需要额外的对准，这叫自对准。
      - card:
          title: 轻掺杂漏和侧墙
          body: |
            沟道很短时，漏端附近电场很强，载流子被加速得很快，会撞坏栅氧化层。办法是在漏极靠近沟道的地方先做一段掺杂较轻的区域，让电场分布得平缓一些，叫**轻掺杂漏（LDD, lightly doped drain）**。

            做法：栅极做好后先做一次浅而轻的注入；然后整片沉积一层氮化硅，再用只往下刻的干法刻蚀把平面上的去掉，栅的两侧会留下一条，叫**侧墙（spacer）**；再做重的源漏注入，侧墙挡住的那一段就保留为轻掺杂区。
      - item:
          id: ldd-why
          type: choice
          prompt: 为什么在漏极靠近沟道处做一段轻掺杂的区域？
          options:
            - text: 让漏端的电场不那么集中，减少高能载流子损伤栅氧
              correct: true
            - text: 让源漏电阻更小
              why: 轻掺杂区的电阻反而更大，这是 LDD 的代价
            - text: 让晶体管的阈值电压更低
              why: 阈值主要由沟道掺杂和栅氧决定；LDD 解决的是漏端强电场
          explain: 掺杂突变的漏结附近电场最强。中间夹一段轻掺杂区，电压降在更长的距离上，峰值电场变小，可靠性提高。
      - card:
          title: 晕环注入和源漏退火
          body: |
            源漏和衬底之间的 PN 结两侧有一层载流子被赶走、不导电的区域，叫**耗尽区（depletion region）**。沟道越短，源漏两边的耗尽区越容易连到一起，栅极就管不住电流了。办法是以一个倾斜的角度注入和衬底同型的杂质，在源漏的边缘下面形成一圈浓一点的区域，叫晕环注入（halo implant）。

            所有注入做完后快速加热，让杂质原子替换硅原子、占到晶体里该在的位置而能导电，并修复注入的损伤，这叫激活退火。温度高、时间短，杂质才不会扩散得太远。
      - card:
          title: 自对准硅化物和接触孔
          body: |
            源漏和栅极表面的硅电阻较大。在整片上沉积一层金属（钛、钴或镍），加热后金属只和露出来的硅反应，生成导电很好的金属硅化物；侧墙和隔离区上是二氧化硅、氮化硅，不反应，未反应的金属再用溶液洗掉。硅化物只长在硅上，自动对准，叫**自对准硅化物（salicide, self-aligned silicide）**。

            然后沉积一层绝缘层，刻出通到源、漏、栅的孔，填进金属钨，就是接触孔，第一层金属从这里连到晶体管上。
      - item:
          id: salicide-why
          type: choice
          prompt: 自对准硅化物为什么不需要光刻就能只长在源、漏、栅上？
          options:
            - text: 金属只和露出的硅反应，在氧化物、氮化物上不反应，之后被洗掉
              correct: true
            - text: 金属只沉积在硅上，不会落到别处
              why: 金属是整片沉积的，到处都有；选择性来自后面的反应，只有接触硅的地方生成硅化物
            - text: 硅化物是离子注入形成的
              why: 硅化物是金属和硅加热反应生成的，不是注入
          explain: 选择性来自化学反应：硅上生成硅化物，绝缘层上的金属不反应、被选择性地腐蚀掉。图形由已有的结构决定，所以叫自对准。
      - item:
          id: cmos-order
          type: order
          prompt: 把一条简化 CMOS 前道流程的主要步骤按先后排好。
          steps:
            - 浅槽隔离
            - 阱注入
            - 阈值调整注入
            - 长栅氧、做栅极
            - 轻掺杂注入和侧墙
            - 源漏注入和退火
            - 自对准硅化物
            - 接触孔
          explain: 先隔离划出器件区；再做阱和阈值调整决定器件的底和阈值；栅极要在源漏之前，作为源漏注入的挡板；轻掺杂在侧墙之前、重掺杂在侧墙之后；退火后做硅化物降低电阻；最后开接触孔连到金属。
      - item:
          id: spacer-width
          type: number
          prompt: 侧墙宽 20 nm，栅长 30 nm。轻掺杂注入以栅为挡板，重的源漏注入以栅加两侧的侧墙为挡板。重掺杂的源和漏之间相距多少纳米？（不计横向扩散）
          answer: 70
          tolerance: 0.01
          unit: nm
          hint: 重掺杂注入时，挡板一共多宽？
          explain: 重掺杂注入的挡板是栅加两边侧墙：$30 + 2\times20 = 70$ nm。栅下的 30 nm 被栅挡住，两边各 20 nm 在侧墙下，是轻掺杂区。
  - id: finfet
    chapter: CMOS工艺集成
    title: 从平面管到鳍式晶体管
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 平面晶体管的栅极只盖在沟道的上面。如果让栅极从三面包住沟道，会怎样？
          options:
            - text: 栅极控制更强，漏电更小
              correct: true
            - text: 没有变化，栅极在哪一面都一样
              why: 栅极离沟道的每一处越近、包得越多，电场越能管住整条沟道，关断得越干净
            - text: 晶体管会一直导通
              why: 包得越多控制越强，关断反而更干净
          explain: 沟道很短时，漏极的电场也能影响沟道，平面管的栅极只从上面管，关不干净。三面包住，栅极的控制占了上风。
      - card:
          title: 鳍式晶体管
          body: |
            把沟道做成一条竖起来的薄硅片，像鱼鳍，栅极从顶面和两个侧面包住它，叫**鳍式晶体管（FinFET）**。2011 年前后它在 22 nm 节点开始量产，此后成为先进逻辑工艺的主流。

            鳍很薄，整个鳍都在栅极的控制之下，沟道很短时栅极也管得住电流，关断漏电低，可以用更低的电源电压工作。
      - card:
          title: 有效宽度
          body: |
            平面管的电流和栅宽成正比。鳍式管的沟道沿鳍的顶面和两个侧面，一条鳍的有效宽度是

            $$W_{eff} = 2H_{fin} + W_{fin}$$

            $H_{fin}$ 是鳍高，$W_{fin}$ 是鳍宽。要更大的电流就并排放几条鳍，所以鳍式管的宽度只能是“一条鳍”的整数倍，不能像平面管那样随意取。
      - item:
          id: fin-weff
          type: number
          prompt: 一条鳍高 42 nm、宽 8 nm，一条鳍的有效宽度 $W_{eff} = 2H_{fin} + W_{fin}$。用 3 条鳍并联的晶体管，有效沟道宽度是多少纳米？
          answer: 276
          tolerance: 0.01
          unit: nm
          hint: 一条鳍的顶面和两个侧面加起来多宽？
          explain: 一条鳍 $2\times42 + 8 = 92$ nm，3 条 $3\times92 = 276$ nm。它占的横向宽度只有三条鳍和它们的间距，比同样电流的平面管窄得多。
      - item:
          id: fin-quantized
          type: choice
          prompt: 设计者想要一个有效宽度 150 nm 的鳍式晶体管，每条鳍有效宽度 92 nm。能做到吗？
          options:
            - text: 不能精确做到，只能选 1 条（92 nm）或 2 条（184 nm）
              correct: true
            - text: 能，把鳍做矮一点就行
              why: 同一工艺里所有鳍的高度相同，设计者只能选鳍的条数
            - text: 能，把栅极做长一点
              why: 栅长影响的是沟道长度，不改变宽度
          explain: 同一工艺里鳍的高度和宽度是统一的，宽度只能按条数取整。电路设计要适应这种“量子化”的宽度。
      - card:
          title: 鳍式管怎样做出来
          body: |
            先在硅上刻出一排排鳍，鳍之间填氧化物再回刻，露出鳍的上半截；接着做假栅横跨在鳍上，后面的侧墙、源漏、后栅替换和平面工艺类似，只是每一步都要照顾到立体的结构。源漏区常用外延（在硅上按原有的原子排列继续长一层晶体）长出掺杂的硅或硅锗，增大接触面积、给沟道加应力。

            鳍间距很小，要靠多重图形（把一层太密的图形拆成几次曝光、刻蚀）等先进光刻才能做出来。
      - item:
          id: fin-why-low-vdd
          type: choice
          prompt: 鳍式晶体管为什么能在更低的电源电压下工作？
          options:
            - text: 栅极控制强，阈值以下的电流降得更陡，可以用更低的阈值而不至于漏电太大
              correct: true
            - text: 鳍里的硅电阻更小
              why: 鳍的掺杂和体积都很小，电阻并不更小；关键是栅极的控制更好
            - text: 鳍式管不需要阈值电压
              why: 鳍式管照样有阈值电压，只是关断特性更好
          explain: 电源电压降不下去，是因为阈值降低后关断漏电会急剧增加。鳍式管的关断特性更好，同样漏电下阈值可以更低，电源电压也就能更低。
      - item:
          id: fin-count
          type: number
          prompt: 一个鳍式工艺每条鳍高 50 nm、宽 7 nm（一条鳍有效宽度 $2H_{fin} + W_{fin}$）。设计要求有效宽度至少 400 nm，至少要几条鳍？
          answer: 4
          hint: 一条鳍有效宽度多少？除完以后怎样取整？
          explain: 一条 $2\times50 + 7 = 107$ nm，$400/107 = 3.74$，取整到 4 条，有效宽度 428 nm。
  - id: beol
    chapter: 金属化与化学机械抛光
    title: 后道互连：从铝到铜
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一块处理器里几十亿个晶体管要用导线连起来。这些导线放在哪里？
          options:
            - text: 晶体管上面叠了十几层金属线，层与层之间用绝缘层隔开
              correct: true
            - text: 和晶体管在同一层，挤在晶体管之间
              why: 一层根本排不下这么多线；晶体管做完以后，在上面一层层往上叠金属
            - text: 芯片外面的电路板上
              why: 电路板只连芯片的引脚；芯片内部的连线全部做在芯片上面
          explain: 晶体管只占硅表面的一薄层。做完晶体管后，在上面交替叠绝缘层和金属层，最多十几层，靠层间的通孔上下连接。
      - card:
          title: 前道和后道
          body: |
            做晶体管的那部分工艺叫前道，在晶体管上面做多层连线的那部分叫**后道（BEOL, back end of line）**。

            后道的结构是：一层**层间介质（ILD, interlayer dielectric）**，里面刻出沟槽和孔，填进金属形成一层导线和连到下层的**通孔（via）**；再盖一层介质、再做一层导线，如此往上。下层的线细而密，负责局部连线；上层的线粗而疏，负责长距离连线和电源。
      - item:
          id: upper-thick
          type: choice
          prompt: 芯片的多层金属连线中，位置最高的几层为什么做得又宽又厚？
          options:
            - text: 走长线和电源，要降低电阻
              correct: true
            - text: 越往上光刻越不精确，只能做粗的
              why: 上层用的光刻同样可以做细线；粗是有意设计的，为了降低长线的电阻
            - text: 上层离晶体管远、电流小，粗细无所谓
              why: 上层走的恰恰是长距离连线和电源，电流大，所以要宽而厚
          explain: 线越长电阻越大，长线和电源线要承载大电流、延迟要小，所以放在上层做得宽而厚；下层的短线要排得密，做得细。
      - card:
          title: 为什么从铝换成铜
          body: |
            早期的连线是铝：整片沉积一层铝，光刻后用等离子体把多余的铝刻掉。铝的电阻率约 2.7 μΩ·cm，铜约 1.7 μΩ·cm，同样尺寸的铜线电阻只有铝的约六成，而且更不容易因电流冲刷而失效。1990 年代末，IBM 等公司开始在量产芯片里用铜。

            可铜很难用等离子体刻蚀：铜和刻蚀气体反应的产物不容易变成气体被抽走。于是改成反过来做：先在介质里刻出沟槽，再把铜填进去，把表面多余的铜磨掉。这叫**大马士革工艺（damascene process）**，名字来自古代大马士革在金属上镶嵌图案的工艺。
      - item:
          id: cu-al-ratio
          type: number
          prompt: 一条线宽 0.1 μm、厚 0.2 μm、长 100 μm 的连线。用电阻率 1.7 μΩ·cm 的铜，电阻是多少欧？
          answer: 85
          tolerance: 0.1
          unit: Ω
          hint: 长度和截面各换成厘米、平方厘米是多少？
          explain: $R = 1.7\times10^{-6}\times10^{-2}/(10^{-5}\times2\times10^{-5}) = 85$ Ω。换成电阻率 2.7 μΩ·cm 的铝是 135 Ω。
      - item:
          id: why-damascene
          type: choice
          prompt: 铝线可以“先沉积、再刻蚀”，铜线为什么要改用大马士革工艺？
          options:
            - text: 等离子体刻不动铜
              correct: true
            - text: 铜太软，刻蚀时会变形
              why: 难点是化学上的：铜和刻蚀气体的生成物难以挥发，等离子体刻不动
            - text: 大马士革工艺更便宜，和铜没有关系
              why: 正是因为铜刻不动才改用大马士革；铝线大多仍用沉积再刻蚀的做法
          explain: 等离子体刻蚀要把材料变成气体抽走，铜的卤化物在常用温度下几乎不挥发。改成刻介质、填铜、磨平，就绕开了刻铜这一步。
      - card:
          title: 双大马士革
          body: |
            一层导线连同它下面的通孔一起做，叫双大马士革：在介质里先后刻出通孔和沟槽，然后一次沉积，填满孔和槽，再磨平。比分两次做省掉一次金属沉积和一次抛光。

            铜会往介质和硅里扩散，伤害晶体管，所以填铜之前先沉积一层很薄的阻挡层（常用钽和氮化钽），再沉积一层铜种子层，然后用电镀（通电让溶液里的铜离子沉积到表面）把铜填满，最后用化学机械抛光去掉表面多余的铜和阻挡层。
      - item:
          id: dd-order
          type: order
          prompt: 把双大马士革做一层铜导线的步骤按先后排好。
          steps:
            - 沉积层间介质
            - 刻出通孔和沟槽
            - 沉积阻挡层和铜种子层
            - 电镀填铜
            - 化学机械抛光去掉多余的铜
          explain: 先有介质才能刻槽；阻挡层要在铜之前，防止铜扩散；电镀要靠种子层导电；最后把表面多余的铜和阻挡层磨掉，只留槽里的铜。
  - id: backend-issues
    chapter: 金属化与化学机械抛光
    title: 后道的可靠性、介质和未来
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 芯片里一条很细的金属线长期流过大电流，几年后可能断开。原因最可能是什么？
          options:
            - text: 电子把原子一点点推走
              correct: true
            - text: 金属被电流熔化了
              why: 正常工作温度远低于金属熔点；失效是在远低于熔点时原子慢慢迁移造成的
            - text: 金属和空气中的氧气反应生锈
              why: 芯片里的金属线被介质包着，接触不到空气；问题出在电流本身
          explain: 电流密度很大时，电子不断把动量传给金属原子，原子沿电子流动的方向慢慢移动，一处堆积、一处出现空洞，最后断线。
      - card:
          title: 电迁移
          body: |
            大电流密度下金属原子被电子流推着移动，叫**电迁移（electromigration）**。常用 Black 方程估算平均失效时间：

            $$\text{MTTF} = A\,J^{-n}\exp\left(\frac{E_a}{kT}\right)$$

            $J$ 是电流密度，$n$ 常取 2，$E_a$ 是激活能，$T$ 是热力学温度，$k$ 是玻尔兹曼常数（$8.617\times10^{-5}$ eV/K）。电流密度越大、温度越高，寿命越短。铜比铝抗电迁移好得多，铜线外面的阻挡层和覆盖层也起作用。
      - item:
          id: em-current
          type: number
          prompt: 按 Black 方程 $\text{MTTF} = AJ^{-2}\exp(E_a/kT)$，一条线的电流密度增加到原来的 1.5 倍，温度不变，平均失效时间变为原来的多少？
          answer: 0.444
          tolerance: 0.002
          hint: $J^{-2}$ 变为多少倍？
          explain: $1.5^{-2} = 0.444$，寿命不到一半。所以电源线要按最大电流密度定宽度。
      - item:
          id: em-temp
          type: number
          prompt: 按 Black 方程 $\text{MTTF} = AJ^{-n}\exp(E_a/kT)$，激活能 $E_a = 0.9$ eV，$k = 8.617\times10^{-5}$ eV/K。一条线从 105 °C 升到 125 °C 工作，电流密度不变，105 °C 时的寿命是 125 °C 时的几倍？
          answer: 4
          tolerance: 0.05
          hint: 两个温度换成开尔文各是多少？寿命之比是哪个指数函数之比？
          explain: $\exp\left[\dfrac{0.9}{8.617\times10^{-5}}\left(\dfrac{1}{378.15} - \dfrac{1}{398.15}\right)\right] = e^{1.39} = 4.0$。只升高 20 °C，寿命就缩短到四分之一。
      - card:
          title: 低 k 介质和 RC 延迟
          body: |
            连线的延迟和 $RC$ 成正比：$R$ 由金属电阻率决定，$C$ 由线之间介质的相对介电常数 $k$ 决定。二氧化硅 $k = 3.9$，换成掺碳的氧化硅等**低 k 介质（low-k dielectric）**可降到 3 以下，多孔材料还能更低。

            低 k 材料往往更松软、机械强度差，化学机械抛光和封装时容易开裂，这是它难用的地方。
      - card:
          title: 例题：换材料能快多少
          body: 一条连线从“铝（2.7 μΩ·cm）+ 二氧化硅（$k = 3.9$）”换成“铜（1.7 μΩ·cm）+ 低 k 介质（$k = 2.7$）”，尺寸不变。$RC$ 变为原来的多少？
          reveal:
            - title: 第 1 步：电阻之比
              body: $R$ 和电阻率成正比：$1.7/2.7 = 0.63$。
            - title: 第 2 步：电容之比
              body: $C$ 和介电常数成正比：$2.7/3.9 = 0.69$。
            - title: 第 3 步：相乘
              body: $0.63\times0.69 \approx 0.43$（不做中间取整是 $1.7/3.9 = 0.44$），$RC$ 不到原来的一半。
      - item:
          id: rc-lowk
          type: number
          prompt: 一层铜连线的介质从二氧化硅（$k = 3.9$）换成 $k = 2.5$ 的多孔低 k 介质，金属和尺寸不变。连线的 $RC$ 变为原来的多少？
          answer: 0.641
          tolerance: 0.002
          hint: 换介质改变的是 $R$ 还是 $C$？
          explain: 只有 $C$ 变，$2.5/3.9 = 0.641$。
      - card:
          title: 未来的结构和化合物半导体的后道
          body: |
            线宽缩到几十纳米以下，铜线表面和晶粒之间的分界（晶界）对电子的散射让电阻率明显上升，阻挡层又占掉一部分截面，于是开始在最细的几层改用钴、钌等不需要厚阻挡层的金属，用空气隙进一步降低电容，并把电源线挪到晶圆背面。

            砷化镓等化合物半导体的芯片规模小、频率高，后道常用金做导线，用金锗镍合金和砷化镓形成欧姆接触，长线和电感常做成悬空的空气桥以减小电容。
      - item:
          id: cu-scaling
          type: choice
          prompt: 线宽缩到几十纳米以下时，为什么铜线的优势变小，开始考虑钴、钌？
          options:
            - text: 细铜线电阻率变高
              correct: true
            - text: 铜在细线里会变成绝缘体
              why: 铜仍是导体，只是细线里电阻率比块状铜高；加上阻挡层占面积，有效电阻上升
            - text: 钴、钌的块状电阻率比铜低
              why: 钴、钌的块状电阻率都比铜高；它们需要的阻挡层薄得多（钌甚至可以不用），细线里的实际电阻反而可能更低
          explain: 尺寸接近电子两次散射之间平均走过的距离时，表面和晶界散射使电阻率上升；铜还要几纳米厚的阻挡层。钴、钌不需要厚阻挡层，在最细的线里反而有优势。
  - id: cmp
    chapter: 金属化与化学机械抛光
    title: 化学机械抛光
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 晶圆表面做了几层图形之后高低不平。为什么要把它磨平？
          options:
            - text: 不平的表面会让下一次光刻对不准焦，也让金属线跨台阶时变薄
              correct: true
            - text: 为了让芯片更好看
              why: 平坦化是工艺必需的，和外观无关
            - text: 为了让晶圆更薄、更轻
              why: 平坦化只磨掉表面薄薄一层凸起，不是减薄晶圆
          explain: 高精度光刻能清楚成像的深度范围很窄，表面起伏超过它，一部分图形就模糊了。磨平后每一层都在平的表面上开始。
      - card:
          title: 化学机械抛光
          body: |
            化学机械抛光把晶圆正面朝下压在旋转的抛光垫上，中间加入抛光液：液里的化学成分让表面材料变软或氧化，细小的磨粒再把它磨掉。凸起的地方受压大，磨得快，表面逐渐变平。

            它用在浅槽隔离（磨掉沟槽外多余的氧化物）、钨塞、铜的大马士革工艺（磨掉多余的铜和阻挡层）和层间介质的平坦化。
      - card:
          title: Preston 方程
          body: |
            抛光的去除速度近似为

            $$RR = K_pPv$$

            $P$ 是压强，$v$ 是晶圆和抛光垫的相对速度，$K_p$ 是由抛光液、垫子和材料决定的系数，叫 Preston 系数。压力越大、转得越快，磨得越快。

            同一块晶圆上，凸起处实际受到的压强更大，所以磨得更快，这正是 CMP 能磨平的原因。
      - item:
          id: cmp-time
          type: number
          prompt: 浅槽隔离沉积的氧化物在沟槽外多出 600 nm，氧化物的去除速度为每分钟 120 nm。磨掉这层要几分钟？
          answer: 5
          tolerance: 0.001
          unit: min
          hint: 厚度除以什么？
          explain: $600/120 = 5$ min。氮化硅的去除速度低得多，磨到它时速度骤降，便于停住。
      - card:
          title: 例题：要磨多久
          body: 一层铜电镀后，沟槽外表面多出 800 nm 的铜。抛光 $K_p = 1\times10^{-13}\ \text{m}^2/\text{N}$，压强 25 kPa，相对速度 1.2 m/s。磨掉这层要多久？
          reveal:
            - title: 第 1 步：去除速度
              body: $RR = 10^{-13}\times2.5\times10^4\times1.2 = 3\times10^{-9}$ m/s，即每分钟 180 nm。
            - title: 第 2 步：时间
              body: $800/180 = 4.44$ min。
            - title: 第 3 步：实际怎么停
              body: 实际不靠算时间，而是监测抛光时的摩擦力或光学信号，磨到阻挡层露出时变化明显，再按比例多磨一点，这叫终点检测。
      - item:
          id: preston-rate
          type: number
          prompt: 某次铜抛光 $K_p = 1\times10^{-13}\ \text{m}^2/\text{N}$，压强 30 kPa，相对速度 0.8 m/s。按 Preston 方程 $RR = K_pPv$，去除速度是每分钟多少纳米？
          answer: 144
          tolerance: 0.1
          unit: nm/min
          hint: $K_pPv$ 算出来的单位是米每秒，怎样换成纳米每分钟？
          explain: $RR = 10^{-13}\times3\times10^4\times0.8 = 2.4\times10^{-9}$ m/s，即 2.4 nm/s，每分钟 144 nm。
      - card:
          title: 碟形凹陷和侵蚀
          body: |
            铜比周围的介质软，宽的铜线中间会被磨得比边缘低，像一只碟子，叫碟形凹陷。密集的细铜线区域里，介质也跟着被磨掉一些，整块区域变薄，叫侵蚀。两者都让线变薄、电阻变大，表面也不再平。

            对策是限制金属线的最大宽度、把很宽的线切成网格，并在空旷的地方加不连接任何电路的金属块（叫填充图形），让各处的金属密度接近。
      - item:
          id: dummy-fill
          type: choice
          prompt: 版图上空旷的区域常要加一些不连接任何电路的金属方块，这是为了什么？
          options:
            - text: 让各处金属密度接近
              correct: true
            - text: 作为备用导线，以后修改设计时用
              why: 这些方块不接任何网络，作用是让抛光均匀
            - text: 增加芯片的散热
              why: 它们太小、太分散，对散热帮助不大；目的是均衡图形密度
          explain: 抛光速度和局部图形密度有关，密度差别大，抛光后高低不平。补上填充图形，各处密度接近，表面就平。
  - id: crystal-growth
    chapter: 晶圆与洁净室
    title: 单晶硅是怎样长出来的
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 做芯片的硅片是一整块“单晶”。这意味着什么？
          options:
            - text: 原子排列处处一致
              correct: true
            - text: 硅片里只有硅，没有任何杂质
              why: “单晶”说的是原子排列，不是纯度；芯片用的硅还要有意掺杂
            - text: 硅片只有一层原子那么厚
              why: 晶圆厚约 0.7 mm，有上百万层原子；单晶指整块的原子排列连续一致
          explain: 单晶里所有原子按同一个规律、同一个取向排列；多晶由许多取向不同的小晶粒组成，晶粒之间有分界。晶体管要做在单晶上，性能才一致。
      - card:
          title: 晶格和晶向
          body: |
            晶体里原子按固定的规律重复排列，这种重复的排列叫**晶格（lattice）**。硅是金刚石结构：一个边长 $a = 0.5431$ nm 的立方体里平均有 8 个原子，这个边长叫**晶格常数（lattice constant）**。

            晶体里的方向和平面用三个整数表示，叫**密勒指数（Miller indices）**：(100) 是垂直于立方体一条边的面，(111) 是切过立方体对角的面。晶圆表面是哪个晶面，就叫哪个晶向的晶圆。
      - item:
          id: si-density
          type: number
          prompt: 硅的晶格常数 $a = 0.5431$ nm，一个边长为 $a$ 的立方体里平均有 8 个原子。每立方厘米有多少个硅原子？用 $10^{22}$ 作单位填数字。
          answer: 4.99
          tolerance: 0.01
          unit: ×10²² cm⁻³
          hint: 0.5431 nm 是多少厘米？一个立方体的体积是多少？
          explain: $8/(5.431\times10^{-8}\ \text{cm})^3 = 4.99\times10^{22}\ \text{cm}^{-3}$。掺杂浓度 $10^{16}$ 相当于几百万个硅原子里才有一个杂质。
      - item:
          id: why-100
          type: choice
          prompt: 做 CMOS 芯片的晶圆大多用 (100) 晶向。主要原因是什么？
          options:
            - text: 它和二氧化硅的界面缺陷少
              correct: true
            - text: (100) 面最容易长成单晶
              why: 各种晶向都能拉成单晶；选 (100) 是看它和氧化层的界面品质
            - text: (100) 面的硅原子最密，导电最好
              why: 原子最密的是 (111) 面；MOS 器件看重的是界面上的缺陷少
          explain: MOS 管的沟道就在硅和栅氧化层的界面上，(100) 面上界面缺陷少，阈值稳定、载流子跑得快。(100) 晶圆还便于沿解理面划片。
      - card:
          title: 直拉法和区熔法
          body: |
            **直拉法（Czochralski method）**：把高纯多晶硅放在石英坩埚里加热到 1414 °C 以上熔化，把一小块单晶籽晶浸进熔体，一边旋转一边慢慢往上提，熔体就沿着籽晶的取向凝固成一根大单晶棒。300 mm 晶圆都用这种方法，坩埚会溶进一些氧，浓度约 $10^{18}\ \text{cm}^{-3}$。

            **区熔法（float zone method）**：用线圈加热一根多晶硅棒，只熔化很窄的一段，让熔区从一头移到另一头，后面凝固成单晶。不用坩埚，纯度更高、含氧极少，适合高阻的功率器件，但做不了太大的直径。
      - card:
          title: 杂质分凝
          body: |
            往熔体里加入硼、磷等掺杂原子拉晶时，凝固进晶体的杂质浓度 $C_s$ 和熔体里的浓度 $C_l$ 之比 $k_0 = C_s/C_l$ 叫**分凝系数（segregation coefficient）**：硼约 0.8，磷约 0.35，砷约 0.3。$k_0 < 1$ 时杂质留在熔体里越来越浓，晶棒越往后掺杂越重：

            $$C_s = k_0C_0(1 - f)^{k_0 - 1}$$

            $C_0$ 是开始时熔体里的浓度，$f$ 是已经凝固的比例。
      - item:
          id: scheil-p
          type: number
          prompt: 用掺磷的熔体拉晶，磷的分凝系数 $k_0 = 0.35$。熔体凝固了一半（$f = 0.5$）时，正在凝固的那一段晶体里磷浓度是开始时熔体浓度 $C_0$ 的几倍？
          answer: 0.549
          tolerance: 0.002
          hint: 代入 $C_s/C_0 = k_0(1 - f)^{k_0 - 1}$，指数是多少？
          explain: $0.35\times0.5^{-0.65} = 0.35\times1.569 = 0.549$。籽晶那头是 $0.35C_0$，到一半时已升到 $0.55C_0$，所以晶棒两头的电阻率不同。
      - item:
          id: fz-use
          type: choice
          prompt: 区熔法的晶棒为什么特别适合做高压功率器件？
          options:
            - text: 含氧和杂质极少
              correct: true
            - text: 区熔法能做最大直径的晶圆
              why: 正相反，区熔法的直径做不大，300 mm 晶圆都用直拉法
            - text: 区熔法拉得最快，最便宜
              why: 区熔法更贵；选它是因为纯度高、电阻率高
          explain: 高压器件需要掺杂很轻、电阻率很高的硅。直拉法的坩埚会带进氧和杂质，区熔法没有坩埚，纯度更高。
  - id: wafer-soi
    chapter: 晶圆与洁净室
    title: 从晶棒到晶圆，SOI
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一根直径 300 mm 的单晶硅棒要变成一片片晶圆。直接切下来就能用吗？
          options:
            - text: 不能，还要研磨、腐蚀、抛光
              correct: true
            - text: 能，切下来的表面已经足够平
              why: 切割会留下锯痕和损伤层，必须磨掉、抛光，光刻才能在上面成像
            - text: 不能，还要把晶圆熔化后重新凝固
              why: 重新熔化会破坏单晶；后续是机械和化学的表面加工
          explain: 切割留下的锯痕和晶格损伤层要研磨、化学腐蚀去掉，再抛光成镜面，最后清洗。
      - card:
          title: 晶圆加工
          body: |
            晶棒先磨成准确的直径，在侧面磨出一个小缺口（大晶圆）或平边（小晶圆）标出晶向；然后用线锯切成薄片，研磨掉锯痕，化学腐蚀去掉损伤层，再用化学机械抛光把正面抛成镜面，最后清洗。300 mm 晶圆厚约 775 μm。

            一片晶圆能放多少个芯片，常用估算式（晶圆直径 $d$，芯片面积 $A$）：

            $$N \approx \frac{\pi(d/2)^2}{A} - \frac{\pi d}{\sqrt{2A}}$$

            第二项扣掉边缘放不下完整芯片的部分。
      - item:
          id: dpw-1cm2
          type: number
          prompt: 直径 300 mm 的晶圆，芯片面积 1 cm²。按估算式 $N \approx \pi(d/2)^2/A - \pi d/\sqrt{2A}$，大约能放多少个芯片？（取整数部分）
          answer: 640
          hint: 300 mm 是多少厘米？两项各是多少？
          explain: $d = 30$ cm：$\pi\times15^2/1 = 706.9$，$\pi\times30/\sqrt2 = 66.6$，$706.9 - 66.6 = 640.2$，约 640 个。
      - item:
          id: dpw-2cm2
          type: number
          prompt: 直径 300 mm 的晶圆，芯片面积 2 cm²。按 $N \approx \pi(d/2)^2/A - \pi d/\sqrt{2A}$，大约能放多少个芯片？（取整数部分）
          answer: 306
          hint: 面积加倍，两项各怎样变？
          explain: $\pi\times225/2 = 353.4$，$\pi\times30/\sqrt4 = 47.1$，$353.4 - 47.1 = 306.3$，约 306 个，不到 1 cm² 时的一半：芯片越大，边缘浪费的比例越大。
      - card:
          title: SOI 晶圆
          body: |
            在一层很薄的单晶硅和下面的硅衬底之间夹一层二氧化硅（埋氧层），叫**绝缘体上硅（SOI, silicon on insulator）**。器件做在顶层薄硅里，下面被绝缘层隔开，源漏和衬底之间不想要的（寄生）电容小，相邻器件之间也不会经衬底漏电。

            早期一种做法是把大剂量的氧离子注入硅里，高温退火形成埋氧层。现在主流是键合：两片晶圆中的一片先长好氧化层，面对面贴合加热，让它们牢牢结合在一起，再把其中一片减薄到需要的厚度。
      - card:
          title: 例题：智能剥离
          body: 怎样把键合后的一片晶圆准确地“减薄”到只剩几十纳米到一微米的硅？智能剥离（Smart Cut）的做法分几步。
          reveal:
            - title: 第 1 步：在要劈开的深度埋一层氢
              body: 给长了氧化层的晶圆 A 注入氢离子，氢停在表面下一定深度（由注入能量决定）。
            - title: 第 2 步：键合
              body: 把晶圆 A 翻过来，和晶圆 B 面对面贴合，加热让两者结合。
            - title: 第 3 步：沿氢层劈开
              body: 再加热，氢在那一深度聚成小气泡，晶圆 A 沿这一层裂开；留在 B 上的是一层薄硅加氧化层，表面再抛光。劈下来的 A 可以重复使用。
      - item:
          id: smartcut-depth
          type: choice
          prompt: 智能剥离得到的顶层硅厚度主要由什么决定？
          options:
            - text: 氢离子注入的能量，它决定氢停在多深
              correct: true
            - text: 键合时加的压力
              why: 键合只让两片贴牢；劈开的位置在氢聚集的那一层，由注入深度决定
            - text: 晶圆 A 原来的厚度
              why: 晶圆 A 大部分都被劈下来带走了，留下的厚度只看氢在哪一层
          explain: 注入能量越大，氢停得越深，劈开后留在 B 上的硅越厚。最后再用抛光微调到目标厚度。
      - item:
          id: soi-benefit
          type: choice
          prompt: 和普通硅晶圆相比，做在 SOI 上的晶体管有什么好处？
          options:
            - text: 寄生电容和寄生导通都小
              correct: true
            - text: SOI 晶圆更便宜
              why: SOI 晶圆比普通晶圆贵；用它是为了性能和功耗
            - text: SOI 上不需要栅氧化层
              why: 晶体管结构照旧，栅氧化层还是要的；变化在源漏下面多了一层埋氧
          explain: 埋氧层把器件和衬底隔开，源漏结电容小、开关更快更省电，相邻器件之间也不会经衬底形成寄生通路。
  - id: contamination
    chapter: 晶圆与洁净室
    title: 洁净室、清洗和吸杂
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 芯片上的线宽只有几十纳米。一粒 0.1 μm 的灰尘落在晶圆上会怎样？
          options:
            - text: 可能造成断线或短路
              correct: true
            - text: 没关系，0.1 μm 比头发细得多
              why: 和头发比没有意义；0.1 μm 是 100 nm，比芯片上的线还宽，足够把一条线截断或把两条线连上
            - text: 清洗一下就行，不影响后面的工序
              why: 如果灰尘在光刻或沉积时落上去，图形已经做坏，清洗也救不回来
          explain: 颗粒尺寸接近或大于线宽时，落在关键位置就会造成断路或短路。所以芯片要在空气很洁净的环境里做。
      - card:
          title: 第一级：洁净室
          body: |
            污染控制分三级。第一级是让工厂本身干净：**洁净室（cleanroom）**的空气经高效过滤器从天花板向下均匀流过，把颗粒带走；人穿全身的洁净服，设备和晶圆盒尽量把晶圆封闭起来。

            洁净程度按 ISO 14644-1 分级：ISO $N$ 级允许每立方米空气里大于等于 $D$ 微米的颗粒数最多为

            $$C = 10^N\left(\frac{0.1}{D}\right)^{2.08}$$

            旧的美国标准“100 级”（每立方英尺不超过 100 个 0.5 μm 以上的颗粒）大致相当于 ISO 5 级。
      - item:
          id: iso5-count
          type: number
          prompt: 按 $C = 10^N(0.1/D)^{2.08}$，ISO 5 级洁净室每立方米空气里，大于等于 0.5 μm 的颗粒最多允许多少个？（取整数部分）
          answer: 3516
          tolerance: 4
          hint: 这里 $D$ 取多少？$0.1/D$ 是多少？
          explain: $10^5\times0.2^{2.08} = 10^5\times0.0352 = 3517$ 个，标准表里取整为 3520。每立方英尺约 0.0283 m³，正好约 100 个，所以和旧标准的 100 级相当。
      - card:
          title: 第二级：晶圆清洗
          body: |
            第二级是把落到晶圆上的东西洗掉。经典的 **RCA 清洗（RCA clean）**分两步：SC-1 是氨水、过氧化氢和水的混合液，约 75 °C，去掉有机物和颗粒；SC-2 是盐酸、过氧化氢和水的混合液，去掉金属离子。两步之间或之后常用稀氢氟酸泡一下，去掉表面薄薄的自然氧化层。

            每次高温工序之前都要清洗，否则表面的金属会在高温下扩散进硅里。
      - item:
          id: rca-metal
          type: choice
          prompt: RCA 清洗里，专门去掉金属离子污染的是哪一步？
          options:
            - text: SC-2（盐酸、过氧化氢和水）
              correct: true
            - text: SC-1（氨水、过氧化氢和水）
              why: SC-1 主要去掉有机物和颗粒；金属离子要靠酸性的 SC-2 溶解
            - text: 稀氢氟酸
              why: 稀氢氟酸去掉的是表面的二氧化硅薄层，不是专门针对金属
          explain: 盐酸能和金属形成可溶的化合物，把它们从表面带走；SC-1 是碱性的，适合去掉颗粒和有机物。
      - card:
          title: 第三级：吸杂
          body: |
            第三级是把已经进入硅里的金属杂质从器件区赶走，叫**吸杂（gettering）**。金属杂质在高温下扩散得很快，遇到缺陷多的地方就被抓住。

            内吸杂：直拉晶圆里溶有氧，经过适当的热处理，晶圆内部析出大量氧沉淀，成为抓住金属的陷阱，而表面一层氧扩散出去，留下没有沉淀的洁净区给器件用。外吸杂：在晶圆背面做损伤层、沉积多晶硅或重掺磷，把金属吸到背面。
      - item:
          id: denuded-zone
          type: choice
          prompt: 内吸杂为什么要在晶圆表面留一层没有氧沉淀的洁净区？
          options:
            - text: 器件区要没有缺陷
              correct: true
            - text: 氧沉淀会让表面不平
              why: 问题不是平整度；氧沉淀本身是缺陷，放在器件区会引起漏电
            - text: 洁净区里的氧能让栅氧长得更快
              why: 洁净区是氧扩散出去、浓度降低的区域，和栅氧生长速度无关
          explain: 氧沉淀既是抓金属的陷阱，本身也是缺陷。让它们只长在晶圆内部，表面几十微米留给晶体管，就两全了。
      - item:
          id: iso6-ratio
          type: number
          prompt: 按 $C = 10^N(0.1/D)^{2.08}$，同样粒径下，ISO 6 级洁净室允许的颗粒数是 ISO 5 级的几倍？
          answer: 10
          tolerance: 0.001
          hint: 两式相除，哪一部分不同？
          explain: 同样的 $D$，$(0.1/D)^{2.08}$ 约掉，只剩 $10^6/10^5 = 10$。等级每差 1，颗粒数差 10 倍。
  - id: yield
    chapter: 良率与工艺监控
    title: 缺陷和良率
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 同一条生产线、同样的缺陷密度，做一款大芯片和一款小芯片。哪个好片的比例高？
          options:
            - text: 小芯片，挨上缺陷的机会小
              correct: true
            - text: 一样，缺陷密度相同
              why: 缺陷是按面积随机落下的，芯片越大，至少挨上一个缺陷的机会越大
            - text: 大芯片，大芯片设计得更仔细
              why: 设计再仔细也挡不住随机落下的缺陷；面积大，挨上缺陷的概率就大
          explain: 缺陷随机分布在晶圆上，一个芯片只要挨上一个致命缺陷就坏了。面积越大，挨上的概率越大，良率越低。
      - card:
          title: 泊松良率模型
          body: |
            一片晶圆上能正常工作的芯片所占的比例叫**良率（yield）**。设致命缺陷平均每平方厘米 $D$ 个、随机独立分布，芯片面积 $A$，一个芯片上的缺陷数服从泊松分布，一个都没有的概率是

            $$Y = e^{-DA}$$

            这叫泊松良率模型。$DA$ 是每个芯片上平均的缺陷数。
      - item:
          id: yield-poisson
          type: number
          prompt: 缺陷密度 $D = 0.1\ \text{cm}^{-2}$，芯片面积 2 cm²。按泊松模型 $Y = e^{-DA}$，良率是百分之几？
          answer: 81.9
          tolerance: 0.05
          unit: '%'
          hint: 每个芯片平均有几个缺陷？
          explain: $DA = 0.2$，$e^{-0.2} = 0.819$，即 81.9%。面积 1 cm² 时是 $e^{-0.1} = 90.5\%$。
      - card:
          title: 缺陷会扎堆
          body: |
            实际的缺陷往往扎堆出现：某几片晶圆、晶圆的某一块区域特别多。扎堆时同样的平均缺陷密度下，很多缺陷挤在少数芯片上，好芯片反而更多。常用负二项模型：

            $$Y = \left(1 + \frac{DA}{\alpha}\right)^{-\alpha}$$

            $\alpha$ 衡量扎堆程度，越小越扎堆；$\alpha$ 很大时它趋近于泊松模型。
      - card:
          title: 例题：两种模型比一比
          body: 缺陷密度 $D = 0.5\ \text{cm}^{-2}$，芯片面积 1.5 cm²。分别用泊松模型和 $\alpha = 2$ 的负二项模型算良率。
          reveal:
            - title: 第 1 步：平均缺陷数
              body: $DA = 0.5\times1.5 = 0.75$。
            - title: 第 2 步：泊松模型
              body: $Y = e^{-0.75} = 0.472$，即 47.2%。
            - title: 第 3 步：负二项模型
              body: $Y = (1 + 0.75/2)^{-2} = 1.375^{-2} = 0.529$，即 52.9%，比泊松模型高：缺陷扎堆，有些芯片挨了好几个，坏片总数反而少了。
      - item:
          id: yield-nb
          type: number
          prompt: 缺陷密度 $D = 0.5\ \text{cm}^{-2}$，芯片面积 1.5 cm²，扎堆程度 $\alpha = 1$。按负二项模型 $Y = (1 + DA/\alpha)^{-\alpha}$，良率是百分之几？
          answer: 57.1
          tolerance: 0.05
          unit: '%'
          hint: $DA/\alpha$ 是多少？
          explain: $(1 + 0.75)^{-1} = 0.571$，即 57.1%。扎堆越厉害（$\alpha$ 越小），同样的平均缺陷密度下良率越高。
      - item:
          id: good-dies
          type: number
          prompt: 一片 300 mm 晶圆能放 640 个面积 1 cm² 的芯片，缺陷密度 $0.1\ \text{cm}^{-2}$。按泊松模型，一片晶圆大约能出多少个好芯片？（取整数部分）
          answer: 579
          hint: 良率是多少？
          explain: $Y = e^{-0.1} = 0.905$，$640\times0.905 = 579$ 个。
      - item:
          id: yield-area
          type: choice
          prompt: 按泊松模型，芯片面积加倍时良率怎样变？
          options:
            - text: 变成原来良率的平方
              correct: true
            - text: 减半
              why: 良率是 $e^{-DA}$，面积加倍是指数加倍，$e^{-2DA} = (e^{-DA})^2$，不是减半
            - text: 不变
              why: 面积越大挨上缺陷的机会越大，良率一定下降
          explain: $e^{-D\cdot2A} = (e^{-DA})^2$。原来 90%，加倍后 81%；原来 50%，加倍后只有 25%。大芯片的良率下降得很快。
  - id: process-control
    chapter: 良率与工艺监控
    title: 参数良率和工艺控制
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一批芯片都没有缺陷，功能也都对，可有一部分速度达不到规格。这算良率问题吗？
          options:
            - text: 算，卖不了或只能降级
              correct: true
            - text: 不算，只有坏了的芯片才影响良率
              why: 没有缺陷的芯片也可能因为阈值、线宽等指标偏离而性能不达标，这部分损失也算良率损失
            - text: 不算，速度慢一点没有关系
              why: 规格写明了速度，达不到就不能按这个规格出货
          explain: 良率损失有两类：缺陷造成的功能失效，和工艺波动造成的性能不达标。后者靠严格控制每道工序来减少。
      - card:
          title: 正态分布和标准差
          body: |
            线宽、氧化层厚度、阈值电压这类可以测量的数值叫**参数（parameter）**，因参数不合格造成的良率损失叫参数良率损失。同一道工序做出来的参数不会完全一样，而是围绕平均值 $\mu$ 波动，大多接近钟形的**正态分布（normal distribution）**。波动的大小用**标准差（standard deviation）** $\sigma$ 衡量：落在 $\mu\pm\sigma$ 内的约占 68.3%，$\mu\pm2\sigma$ 内约 95.4%，$\mu\pm3\sigma$ 内约 99.73%。

            规格给出上限 USL 和下限 LSL，落在两者之外的就是参数不合格。
      - item:
          id: outside-3sigma
          type: number
          prompt: 某参数服从正态分布，规格上下限正好在 $\mu\pm3\sigma$。不合格品大约占百万分之几？（取整数部分）
          answer: 2699
          tolerance: 2
          unit: ppm
          hint: $\mu\pm3\sigma$ 内占 99.73%，外面占多少？
          explain: $1 - 0.99730 = 0.00270$，即约 2700 ppm（精确值 2699.8）。对一条每月出几百万颗芯片的产线，这仍是很大的损失。
      - card:
          title: 控制图
          body: |
            工厂每批晶圆都测关键参数，画在一张以时间为横轴的图上，中线是长期平均值，上下各画一条 $\mu\pm3\sigma$ 的控制线，叫**控制图（control chart）**。正常波动的点几乎都落在两线之间；有点跑出控制线，或者连续好几点朝同一个方向漂，就说明工序出了问题，要停下来找原因。

            这种用统计方法监控工序的做法叫统计过程控制（SPC）。
      - item:
          id: control-chart
          type: choice
          prompt: 控制图上连续 8 个点都在中线上方，但都没有超出控制线。该怎么判断？
          options:
            - text: 均值可能偏了
              correct: true
            - text: 都在控制线内，一切正常
              why: 随机波动时点会在中线两侧交替出现；连续 8 点在同一侧的概率只有约 $1/256$，说明均值可能已经偏了
            - text: 控制线画错了，要放宽
              why: 控制线来自长期统计，不能因为数据偏了就放宽；该做的是找出工序为什么漂移
          explain: 每点落在中线上方的概率约 1/2，连续 8 点都在上方约 $1/256$。这么小概率的事发生了，多半是工序均值变了，比如设备老化或材料批次改变。
      - card:
          title: 过程能力指数
          body: |
            工序能不能稳定做出合格品，用过程能力指数衡量：

            $$C_p = \frac{USL - LSL}{6\sigma},\qquad C_{pk} = \frac{\min(USL - \mu,\ \mu - LSL)}{3\sigma}$$

            $C_p$ 只看规格宽度和波动大小，$C_{pk}$ 还考虑平均值有没有偏离规格中心。$C_{pk} = 1$ 表示最近的规格限正好在 $3\sigma$ 处；半导体工厂常要求 1.33 以上。
      - card:
          title: 例题：阈值电压的过程能力
          body: 阈值电压规格 $0.40\pm0.06$ V（LSL = 0.34 V，USL = 0.46 V）。工序的平均值 0.41 V，标准差 0.015 V。求 $C_p$ 和 $C_{pk}$。
          reveal:
            - title: 第 1 步：Cp
              body: $C_p = (0.46 - 0.34)/(6\times0.015) = 0.12/0.09 = 1.33$。
            - title: 第 2 步：离哪条规格限近
              body: 离上限 $0.46 - 0.41 = 0.05$ V，离下限 $0.41 - 0.34 = 0.07$ V，上限更近。
            - title: 第 3 步：Cpk
              body: $C_{pk} = 0.05/(3\times0.015) = 1.11$。波动本身够小，可平均值偏高，把能力拉低了，把均值调回 0.40 V 就能回到 1.33。
      - item:
          id: cpk-calc
          type: number
          prompt: 某层氧化层厚度规格 $1.00\pm0.06$ nm（LSL = 0.94 nm，USL = 1.06 nm），工序平均值 1.02 nm，标准差 0.01 nm。过程能力指数 $C_{pk} = \min(USL - \mu,\ \mu - LSL)/(3\sigma)$ 是多少？
          answer: 1.333
          tolerance: 0.002
          hint: 平均值离哪条规格限更近？
          explain: 离上限 0.04 nm，离下限 0.08 nm，取 0.04：$C_{pk} = 0.04/(3\times0.01) = 1.333$。如果平均值在中心，$C_{pk} = C_p = 2$。
  - id: litho-concepts
    chapter: 光刻
    title: 光刻的流程和曝光方式
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 光刻要把掩模上的电路图形转到晶圆上。掩模上的图形一般比晶圆上要做的图形大还是小？
          options:
            - text: 大，透镜缩小 4 倍
              correct: true
            - text: 一样大，掩模直接贴在晶圆上
              why: 早期确实是贴着曝光，图形一样大；现在用透镜缩小成像，掩模图形是晶圆上的 4 倍
            - text: 小，曝光时把图形放大
              why: 缩小成像才能在晶圆上得到比掩模更细的线，放大只会更粗
          explain: 现代曝光机用一组透镜把掩模的像缩小 4 倍投到晶圆上。掩模上的图形大，做起来容易，掩模上的小缺陷也跟着缩小。
      - card:
          title: 光刻的基本流程
          body: |
            光刻把图形转到晶圆上的一层光刻胶里：光刻胶是一种感光的高分子材料，被光照过的部分化学性质改变，在显影液里溶解得快（或慢），显影后就留下了图形。

            图形来自掩模：一块石英板，上面用铬画出电路的一层图形，透光的地方和不透光的地方决定光刻胶哪里被曝光。一款先进芯片要几十张掩模，每一张对应一层图形。
      - card:
          title: 三种曝光方式
          body: |
            接触式：掩模直接压在光刻胶上，分辨率好，可掩模和胶互相沾污、磨损，缺陷多。接近式：掩模和胶之间留几十微米的间隙，避免接触，但光经过间隙会扩散开，最小线宽约为 $\sqrt{\lambda g}$（$\lambda$ 是波长，$g$ 是间隙）。

            现在用的是**投影（projection）**曝光：用透镜把掩模的像缩小后成在晶圆上，掩模不碰晶圆。
      - item:
          id: proximity-res
          type: number
          prompt: 接近式曝光用 365 nm 的光，掩模和光刻胶之间留 20 μm 的间隙。按最小线宽约为 $\sqrt{\lambda g}$，能做出多细的线（微米）？
          answer: 2.7
          tolerance: 0.01
          unit: μm
          hint: 两个长度都换成微米，乘起来再开方是多少？
          explain: $\sqrt{0.365\times20} = \sqrt{7.3} = 2.70$ μm。间隙让分辨率停在微米级，所以小线宽只能靠投影曝光。
      - item:
          id: contact-drawback
          type: choice
          prompt: 接触式曝光分辨率不错，为什么后来不用了？
          options:
            - text: 接触造成沾污和磨损
              correct: true
            - text: 接触式曝光太慢
              why: 曝光本身很快；问题是接触带来的掩模损伤和颗粒缺陷
            - text: 接触式曝光只能用可见光
              why: 光源和曝光方式无关；放弃它是因为接触造成缺陷、掩模寿命短
          explain: 每次接触都可能在掩模上留下胶的残渣、划伤或颗粒，缺陷随着使用次数增加，良率上不去。投影曝光掩模不碰晶圆，就没有这个问题。
      - card:
          title: 步进和扫描，光源越来越短
          body: |
            投影曝光一次只照晶圆上的一块区域（叫一个场，最大约 26 mm × 33 mm），照完移到下一块，叫步进式。现在多是步进扫描式：掩模和晶圆同步移动，用一条窄缝把整个场扫过去，透镜只需要在窄缝范围内成像好。

            光源的波长一路变短：汞灯的 g 线 436 nm、i 线 365 nm，准分子激光 KrF 248 nm、ArF 193 nm，再到极紫外（EUV）13.5 nm。波长越短，能分辨的线越细。
      - item:
          id: mask-4x
          type: number
          prompt: 曝光机把掩模缩小 4 倍成像到晶圆上。晶圆上要做 45 nm 宽的线，掩模上这条线画多宽（纳米）？
          answer: 180
          tolerance: 0.01
          unit: nm
          hint: 掩模上的尺寸是晶圆上的几倍？
          explain: $45\times4 = 180$ nm。掩模上的尺寸大 4 倍，做掩模和检查掩模都简单得多。
      - item:
          id: wavelength-order
          type: order
          prompt: 把这些光刻光源按波长从长到短排好。
          steps:
            - g 线（汞灯）
            - i 线（汞灯）
            - KrF 准分子激光
            - ArF 准分子激光
            - 极紫外（EUV）
          explain: 436 nm、365 nm、248 nm、193 nm、13.5 nm。每换一次更短的光源，能做的线宽就向前迈一步。
  - id: litho-optics
    chapter: 光刻
    title: 衍射、分辨率和焦深
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 光穿过掩模上一条很窄的缝。缝越窄，透过来的光会怎样？
          options:
            - text: 向两边散开得越厉害
              correct: true
            - text: 越细越直，像一根针
              why: 缝的宽度接近波长时，光不再沿直线走，缝越窄散得越开
            - text: 完全不能通过
              why: 光能通过窄缝，只是会向两边散开
          explain: 光通过尺寸接近波长的开口时会向四周散开。缝越窄，散开的角度越大，透镜越难把它们全部收回来重新成像。
      - card:
          title: 衍射和数值孔径
          body: |
            光通过很小的开口时向四周散开，叫**衍射（diffraction）**。掩模上的细线把光散成好几个方向，透镜要把其中至少两个方向的光收进来，晶圆上才能成出线条的像。

            透镜能收进来的最大角度用**数值孔径（NA, numerical aperture）**表示：$NA = n\sin\theta$，$\theta$ 是透镜收光的最大半角，$n$ 是透镜和晶圆之间介质的折射率（空气为 1）。NA 越大，收得越多，能成像的线越细。
      - card:
          title: 分辨率和焦深
          body: |
            投影曝光能分辨的最小线宽常写成

            $$R = k_1\frac{\lambda}{NA}$$

            叫**瑞利判据（Rayleigh criterion）**。$k_1$ 是和工艺有关的系数，单次曝光的理论下限约 0.25，实际常在 0.3–0.4。像清楚的上下范围叫**焦深（depth of focus）**：

            $$DOF = k_2\frac{\lambda}{NA^2}$$

            NA 越大分辨率越好，可焦深按 $NA^2$ 缩小，晶圆表面只要有一点起伏就会离焦。
      - item:
          id: krf-res
          type: number
          prompt: KrF 光刻 $\lambda = 248$ nm，$NA = 0.8$，$k_1 = 0.4$。按 $R = k_1\lambda/NA$，最小线宽是多少纳米？
          answer: 124
          tolerance: 0.1
          unit: nm
          hint: 三个数怎样组合？
          explain: $R = 0.4\times248/0.8 = 124$ nm。
      - card:
          title: 例题：ArF 浸没式
          body: ArF 浸没式光刻 $\lambda = 193$ nm，$NA = 1.35$，$k_1 = 0.3$，$k_2 = 0.5$。求分辨率和焦深。
          reveal:
            - title: 第 1 步：分辨率
              body: $R = 0.3\times193/1.35 = 42.9$ nm。
            - title: 第 2 步：焦深
              body: $DOF = 0.5\times193/1.35^2 = 0.5\times193/1.8225 = 52.9$ nm。
            - title: 第 3 步：看代价
              body: 焦深只有约 50 nm，晶圆表面的起伏必须控制在这以内，这也是每层都要化学机械抛光磨平的原因。
      - item:
          id: krf-dof
          type: number
          prompt: KrF 光刻 $\lambda = 248$ nm，$NA = 0.8$，$k_2 = 0.5$。按 $DOF = k_2\lambda/NA^2$，焦深约是多少纳米？
          answer: 194
          tolerance: 0.5
          unit: nm
          hint: $NA^2$ 是多少？
          explain: $0.5\times248/0.64 = 193.75$，约 194 nm，是 ArF 浸没式（52.9 nm）的三倍多。
      - item:
          id: euv-res
          type: number
          prompt: EUV 光刻 $\lambda = 13.5$ nm，$NA = 0.33$，$k_1 = 0.4$。最小线宽约是多少纳米？
          answer: 16.4
          tolerance: 0.05
          unit: nm
          hint: 用哪个公式？
          explain: $0.4\times13.5/0.33 = 16.4$ nm。波长缩短了 14 倍，即使 NA 只有 0.33，分辨率也比 ArF 浸没式好得多。
      - item:
          id: na-tradeoff
          type: choice
          prompt: 为了做更细的线把 NA 从 0.93 提高到 1.35，代价是什么？
          options:
            - text: 焦深按 $NA^2$ 缩小，只剩原来的一半左右，对表面平整度和对焦要求更高
              correct: true
            - text: 分辨率变差
              why: NA 越大分辨率越好；代价出在焦深
            - text: 掩模上的线要跟着画得更细
              why: 掩模尺寸由缩小倍数决定，和 NA 无关；代价出在焦深
          explain: $DOF \propto 1/NA^2$，$(0.93/1.35)^2 = 0.47$，焦深缩到不到一半。所以高 NA 光刻要求晶圆极平、对焦极准。
  - id: photoresist
    chapter: 光刻
    title: 光刻胶和光刻工序
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一种光刻胶被光照过的地方在显影液里溶掉了。掩模上透光的是一个方块，显影后晶圆上留下的是什么？
          options:
            - text: 胶上开出一个方块形的窗口
              correct: true
            - text: 一个方块形的胶，周围的胶都没了
              why: 那是另一种胶（照过的地方不溶）的结果；这种胶照过的方块溶掉，留下的是窗口
            - text: 整片胶都溶掉了
              why: 只有照过光的方块溶掉，其余没照到的胶还在
          explain: 透光的方块让下面的胶曝光，曝光的胶溶进显影液，胶上就出现一个方块形的窗口。
      - card:
          title: 正胶和负胶
          body: |
            曝光的部分溶掉、留下没曝光部分的叫**正胶（positive resist）**；曝光的部分交联变硬、不溶，溶掉的是没曝光部分的叫**负胶（negative resist）**。正胶留下的胶和掩模上不透光的部分一致，分辨率好，是现在的主流。

            g 线、i 线用重氮萘醌加酚醛树脂的正胶。深紫外光源能给的曝光量有限、胶又吸收得强，于是改用**化学放大胶（chemically amplified resist）**：曝光只产生少量酸，曝光后烘烤时一个酸分子能催化成百上千次反应，灵敏度高得多。
      - item:
          id: positive-negative
          type: choice
          prompt: 用负胶时，掩模上透光的是一条线，显影后晶圆上留下的是什么？
          options:
            - text: 一条胶线
              correct: true
            - text: 胶上开出一条槽
              why: 那是正胶的结果；负胶曝光的地方变硬留下，所以留下的是一条胶线
            - text: 什么都没留下
              why: 负胶只溶掉没曝光的部分，曝光的那条线留了下来
          explain: 负胶曝光的地方交联、不溶于显影液，没曝光的地方被溶掉。透光的线留成胶线，图形和正胶正好相反。
      - card:
          title: 对比度
          body: |
            光刻胶对曝光量（每平方厘米接受的光能）的反应用**对比度（contrast）**描述：曝光量低于 $D_0$ 时几乎不溶，达到 $D_{100}$ 时完全溶掉，对比度

            $$\gamma = \frac{1}{\log_{10}(D_{100}/D_0)}$$

            两个曝光量越接近，$\gamma$ 越大：曝光量差一点，溶不溶就分得很干净，衍射造成的模糊光强也能得到陡直的胶边。
      - item:
          id: resist-gamma
          type: number
          prompt: 某正胶曝光量低于 20 mJ/cm² 时几乎不溶，达到 50 mJ/cm² 时完全溶掉。它的对比度 $\gamma$ 是多少？
          answer: 2.51
          tolerance: 0.01
          hint: $D_{100}/D_0$ 是多少？
          explain: $\gamma = 1/\log_{10}(50/20) = 1/0.398 = 2.51$。
      - card:
          title: 从涂胶到坚膜
          body: |
            一次光刻的工序：晶圆清洗烘干，涂一层增粘剂（HMDS）让胶粘牢；旋转涂胶，胶厚约和转速的平方根成反比；前烘赶走溶剂；对准、曝光；化学放大胶要曝光后烘烤；显影；坚膜烘烤让胶更耐刻蚀；最后检查线宽和对准。
      - card:
          title: 例题：调转速改胶厚
          body: 某胶在 3000 转每分钟时厚 1.0 μm。想要更薄的胶，改成 4000 转每分钟，厚度大约变成多少？
          reveal:
            - title: 第 1 步：写出比例
              body: 胶厚 $\propto 1/\sqrt{\omega}$，所以 $t_2/t_1 = \sqrt{\omega_1/\omega_2}$。
            - title: 第 2 步：代入
              body: $\sqrt{3000/4000} = 0.866$。
            - title: 第 3 步：结果
              body: $t_2 = 0.866$ μm。转速提高三分之一，胶只薄了约 13%。
      - item:
          id: spin-thickness
          type: number
          prompt: 某胶在 2500 转每分钟时厚 1.2 μm，胶厚和转速的平方根成反比。改成 4500 转每分钟，胶厚约多少微米？
          answer: 0.894
          tolerance: 0.002
          unit: μm
          hint: 厚度之比等于转速之比的什么？
          explain: $1.2\times\sqrt{2500/4500} = 1.2\times0.745 = 0.894$ μm。
      - item:
          id: litho-steps
          type: order
          prompt: 把一次光刻的工序按先后排好。
          steps:
            - 涂增粘剂
            - 旋转涂胶
            - 前烘
            - 对准和曝光
            - 曝光后烘烤
            - 显影
            - 坚膜
          explain: 增粘剂在胶之前；前烘去溶剂后才能曝光；化学放大胶的反应在曝光后烘烤时发生；显影出图形后再坚膜，让胶经得起后面的刻蚀或注入。
  - id: ret-nil
    chapter: 光刻
    title: 分辨率增强、EUV 和纳米压印
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 193 nm 的光刻机做出了 40 nm 以下的线。这怎么可能？
          options:
            - text: 用了一系列增强办法
              correct: true
            - text: 光刻机把光的波长偷偷换短了
              why: 光源仍是 193 nm 的 ArF 激光；分辨率是靠增大 NA、降低 $k_1$ 和多次图形化做出来的
            - text: 不可能，那些线是刻蚀时刻细的
              why: 刻蚀确实能把线修细一点，但主要的分辨率提升来自光刻本身的各种增强办法
          explain: 按 $R = k_1\lambda/NA$，波长不变时可以增大 NA、降低 $k_1$，还可以把一层图形分几次来做。
      - card:
          title: 浸没式和离轴照明
          body: |
            在透镜和晶圆之间充满水，叫浸没式光刻。193 nm 的光在水里折射率约 1.44，$NA = n\sin\theta$ 可以超过 1，实际做到 1.35，等效于波长在水里缩短为 $193/1.44 = 134$ nm。

            离轴照明：让光斜着照到掩模上，衍射出来的两束光更容易同时进入透镜，细密的线也能成像，$k_1$ 可以降低。
      - item:
          id: water-wavelength
          type: number
          prompt: 193 nm 的光进入折射率 1.44 的水里，波长变成多少纳米？
          answer: 134
          tolerance: 0.1
          unit: nm
          hint: 光在介质里的波长和真空里是什么关系？
          explain: $193/1.44 = 134$ nm。浸没并不改变光源，而是让透镜能收进更大角度的光，相当于用了更短的波长。
      - card:
          title: 光学邻近效应修正和相移掩模
          body: |
            线细到接近能分辨的最小线宽时，像会变形：线端缩短、拐角变圆、孤立线和密集线的宽度不一样。于是在掩模上预先把图形改一改：线端加小方块、拐角加凸角、调整线宽，让成出来的像正好是想要的形状，叫**光学邻近效应修正（OPC, optical proximity correction）**。

            相移掩模让相邻的透光区光的相位差半个波长，衍射光互相抵消，像的边缘更陡。
      - item:
          id: opc-purpose
          type: choice
          prompt: 光学邻近效应修正为什么要把掩模上的图形改得和电路图形不一样？
          options:
            - text: 预先补偿衍射造成的成像变形
              correct: true
            - text: 为了防止别人照着掩模复制芯片
              why: 修正的目的是补偿成像变形，和防复制无关
            - text: 掩模画错了，用修正补救
              why: 修正是有意为之、由软件按光学模型算出来的，不是补救画错的掩模
          explain: 光学系统像一个低通滤波器，丢掉了高频细节，线端缩短、拐角变圆。按模型预先把掩模改成“变形前”的样子，晶圆上就得到想要的图形。
      - card:
          title: 多重图形和 EUV
          body: |
            一层图形太密、一次曝光分不开时，把它拆成两张掩模分两次曝光、刻蚀，或者先做一组线，在线的两侧沉积侧墙，去掉原来的线后留下两倍密的侧墙，这叫自对准双重图形，线间距减半。

            极紫外光刻（EUV）用 13.5 nm 的光，几乎所有材料都强烈吸收它，所以透镜和掩模都换成多层膜反射镜，整个光路放在真空里。它让很多层可以一次曝光完成，省掉多重图形的步骤。
      - card:
          title: 例题：自对准双重图形
          body: 光刻做出间距 80 nm 的一排线（线宽 40 nm，间隔 40 nm）。用自对准双重图形，最后的线间距是多少？
          reveal:
            - title: 第 1 步：沉积侧墙
              body: 在每条线的两侧各留下一条侧墙。
            - title: 第 2 步：去掉原来的线
              body: 原来每 80 nm 有一条线，现在每条线的位置变成两条侧墙。
            - title: 第 3 步：间距
              body: 每 80 nm 里有两条，间距 40 nm，比光刻直接能做的密了一倍。重复一次（自对准四重图形）可以做到 20 nm。
      - item:
          id: euv-highna
          type: number
          prompt: 新一代 EUV 光刻机把 NA 从 0.33 提高到 0.55，$\lambda = 13.5$ nm，取 $k_1 = 0.3$。按 $R = k_1\lambda/NA$，最小线宽约是多少纳米？
          answer: 7.36
          tolerance: 0.02
          unit: nm
          hint: 三个数怎样组合？
          explain: $0.3\times13.5/0.55 = 7.36$ nm；NA 为 0.33 时是 12.3 nm。
      - card:
          title: 纳米压印
          body: |
            **纳米压印（nanoimprint lithography）**不用光学成像：把刻有图形的模板压进晶圆上的液态胶里，用紫外光把胶固化，再把模板拿开，图形就复制到了胶上。分辨率只取决于模板，能做到十纳米以下，设备也比 EUV 便宜。

            它的难点是模板直接接触胶，颗粒和磨损会带来缺陷，层与层之间的对准也比光学光刻难，目前多用在存储器和一些特殊器件上。
      - item:
          id: nil-limit
          type: choice
          prompt: 纳米压印分辨率很高、设备便宜，为什么没有取代光学光刻成为逻辑芯片的主流？
          options:
            - text: 模板要接触胶，缺陷和对准都难控制
              correct: true
            - text: 纳米压印做不出 100 nm 以下的线
              why: 它的分辨率只受模板限制，能做到十纳米以下；问题在缺陷和对准
            - text: 纳米压印要在真空里做，太贵
              why: 要真空的是 EUV；纳米压印本身设备不贵
          explain: 接触式的方法都有同样的问题：颗粒夹在模板和胶之间就形成缺陷，模板也会磨损。逻辑芯片要几十层精确对准、缺陷极少，目前还是光学光刻更可靠。
  - id: deal-grove
    chapter: 氧化
    title: 热氧化和 Deal–Grove 模型
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 把硅片放进高温的氧气里，表面会长出一层二氧化硅。氧化层越来越厚以后，生长速度会怎样？
          options:
            - text: 越来越慢
              correct: true
            - text: 保持不变，温度不变速度就不变
              why: 氧化发生在氧化层和硅的交界处，氧要先扩散穿过已经长好的氧化层，层越厚越难穿过
            - text: 越来越快，已有的氧化层会帮着吸氧
              why: 已有的氧化层是氧的阻碍，不是帮手
          explain: 氧化反应在硅和氧化层的交界面上进行。氧化层越厚，氧扩散过去越慢，生长速度随之下降。
      - card:
          title: 热氧化
          body: |
            把硅在 900–1200 °C 下通入氧气或水汽，表面的硅和氧反应生成二氧化硅，叫热氧化。用干燥氧气叫干氧，用水汽叫湿氧。

            氧化消耗硅：长出厚度 $x$ 的氧化层，要消耗约 $0.44x$ 厚的硅，所以氧化层有一半多长在原来硅表面之上、四成多长在下面。新的界面埋在原来的表面以下，表面的污染不会留在界面上，这是热氧化层界面品质好的原因之一。
      - item:
          id: si-consumed
          type: number
          prompt: 在硅上热氧化长出 500 nm 的二氧化硅，大约消耗了多厚的硅（纳米）？（消耗的硅约为氧化层厚度的 0.44 倍）
          answer: 220
          tolerance: 0.1
          unit: nm
          hint: 乘以多少？
          explain: $0.44\times500 = 220$ nm。氧化层表面比原来的硅表面高 $500 - 220 = 280$ nm。
      - card:
          title: Deal–Grove 模型
          body: |
            Deal 和 Grove 把氧化看成串联的两步：氧化剂扩散穿过已有的氧化层，再在界面上和硅反应。两步速度相等，得到厚度 $x$ 和时间 $t$ 的关系

            $$x^2 + Ax = B(t + \tau)$$

            $A$、$B$ 是和温度、气氛有关的常数，$\tau$ 用来计入开始时已有的氧化层或干氧初期的快速生长。氧化层薄时 $x^2$ 可以忽略，$x \approx (B/A)t$，叫线性区，速度由界面反应决定；氧化层厚时 $x^2 \approx Bt$，叫抛物线区，速度由扩散决定。
      - card:
          title: 例题：湿氧长 0.5 μm
          body: 1000 °C 湿氧，按 Deal 和 Grove 1965 年的数据 $A = 0.226$ μm、$B = 0.287$ μm²/h、$\tau = 0$。长 0.5 μm 氧化层要多久？
          reveal:
            - title: 第 1 步：解出时间
              body: $t = (x^2 + Ax)/B - \tau$。
            - title: 第 2 步：代入
              body: $x^2 = 0.25$，$Ax = 0.226\times0.5 = 0.113$，$t = (0.25 + 0.113)/0.287 = 1.26$ h。
            - title: 第 3 步：看是哪个区
              body: $x^2 = 0.25$ 比 $Ax = 0.113$ 大，已经偏向抛物线区，扩散在拖慢速度。
      - item:
          id: dg-exercise
          type: number
          prompt: 按 Deal–Grove 模型 $x^2 + Ax = B(t + \tau)$，$A = 0.1$ μm，$B = 0.5$ μm²/h，$\tau = 0$。长 0.5 μm 氧化层要多少小时？
          answer: 0.6
          tolerance: 0.001
          unit: h
          hint: 把时间解出来是什么式子？
          explain: $t = (0.25 + 0.1\times0.5)/0.5 = 0.3/0.5 = 0.6$ h。
      - item:
          id: dg-dry
          type: number
          prompt: 1000 °C 干氧，Deal–Grove 常数 $A = 0.165$ μm、$B = 0.0117$ μm²/h、$\tau = 0.37$ h。长 0.1 μm 的氧化层要多少小时？
          answer: 1.89
          tolerance: 0.01
          unit: h
          hint: 这里 $\tau$ 不为零，解出的 $t$ 要减去什么？
          explain: $t = (0.01 + 0.0165)/0.0117 - 0.37 = 2.265 - 0.37 = 1.89$ h。同样温度下湿氧长 0.5 μm 只要 1.26 h，干氧长 0.1 μm 却要近 2 h。
      - item:
          id: dry-wet
          type: choice
          prompt: 栅氧化层用干氧，几百纳米厚的隔离氧化层用湿氧。为什么这样分工？
          options:
            - text: 干氧膜好、湿氧快
              correct: true
            - text: 干氧快，所以用来长栅氧节省时间
              why: 干氧比湿氧慢得多；用它长栅氧是因为膜致密、界面好，栅氧很薄，慢一点也没关系
            - text: 湿氧长出来的不是二氧化硅
              why: 湿氧长出的也是二氧化硅，只是含氢多一些、密度略低
          explain: 水汽在氧化层里溶解度和扩散都比氧气大得多，所以湿氧快；干氧膜更致密、电学性能更好，栅氧又薄，正好用干氧。
  - id: oxide-2d-highk
    chapter: 氧化
    title: 薄氧化层、应力和高 k 介质
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 只在硅片的一块区域上氧化（周围用氮化硅挡住）。氧化层会长成整齐的方块吗？
          options:
            - text: 不会，边缘长成斜坡
              correct: true
            - text: 会，氮化硅把边界挡得整整齐齐
              why: 氧能沿着氮化硅下面的薄氧化层横向扩散，边缘的硅也会被氧化，氮化硅边缘被顶起来
            - text: 不会，被挡住的地方反而长得更厚
              why: 被挡住的地方只有边缘一小段会被横向钻进来的氧氧化，中间几乎不长
          explain: 氧会从掩蔽层边缘下面横向扩散进去，边缘的氧化层逐渐变薄，形状像鸟嘴，叫鸟嘴效应。
      - card:
          title: 薄氧化层的初始快速生长
          body: |
            干氧刚开始的二三十纳米长得比 Deal–Grove 模型预测的快，模型对这一段不准。所以用 Deal–Grove 计算干氧时常加一个 $\tau$：把这段快速生长等效成已经有一层初始氧化层，从那里开始按模型算。

            栅氧化层只有几纳米，正好落在这一段，实际生产里靠经验数据和更细的模型来控制它的厚度。
      - card:
          title: 体积膨胀、应力和二维生长
          body: |
            二氧化硅的体积约是被消耗的硅的 2.27 倍（$1/0.44$）。在平面上，膨胀只能向上；在拐角、沟槽这些二维结构上，膨胀受到限制，氧化层里产生很大的压应力，使拐角处氧化变慢、氧化层变薄。

            早期的局部氧化隔离（LOCOS）用氮化硅挡住器件区，只氧化器件之间的区域。氧从氮化硅边缘下面横向钻进去，长出鸟嘴形的斜坡，占掉器件区的宽度，这是后来改用浅槽隔离的主要原因。
      - item:
          id: volume-ratio
          type: number
          prompt: 长出厚度 $x$ 的二氧化硅要消耗 $0.44x$ 厚的硅。按体积算，氧化层是被消耗的硅的几倍？（平面情形，面积不变）
          answer: 2.27
          tolerance: 0.01
          hint: 面积不变时，体积之比等于什么之比？
          explain: $x/(0.44x) = 2.27$。体积膨胀一倍多，在受约束的拐角处就产生很大的应力。
      - item:
          id: locos-why
          type: choice
          prompt: 先进工艺为什么用浅槽隔离取代了局部氧化（LOCOS）？
          options:
            - text: 鸟嘴伸进器件区，占面积
              correct: true
            - text: LOCOS 长出的氧化层不绝缘
              why: LOCOS 的氧化层绝缘性能很好；问题是它的横向侵占
            - text: 浅槽隔离不需要光刻
              why: 浅槽隔离同样要光刻定义沟槽；它的好处是边缘陡直、不侵占器件区
          explain: 鸟嘴的宽度和氧化层厚度相当，器件宽度缩到零点几微米以后，鸟嘴吃掉的比例太大。浅槽隔离的边缘是刻出来的，陡直不侵占。
      - card:
          title: 高 k 介质
          body: |
            栅氧化层越薄，栅极对沟道的控制越强，可二氧化硅薄到 1–2 nm，电子会直接穿过去，漏电急剧增大。办法是换成介电常数更大的材料，叫**高 k 介质（high-k dielectric）**，如二氧化铪（$k$ 约 25）：同样的栅电容下可以做得厚好几倍，挡住穿透。

            衡量它用**等效氧化层厚度（EOT, equivalent oxide thickness）**：电容相同的二氧化硅该有多厚，$EOT = t_{hk}\times3.9/k$。
      - card:
          title: 例题：二氧化铪的等效厚度
          body: 3 nm 的二氧化铪（$k = 25$）下面还有一层 0.5 nm 的二氧化硅界面层。整个栅介质的 EOT 是多少？
          reveal:
            - title: 第 1 步：高 k 层的等效厚度
              body: $3\times3.9/25 = 0.468$ nm。
            - title: 第 2 步：加上界面层
              body: 两层串联，等效厚度直接相加：$0.468 + 0.5 = 0.968$ nm。
            - title: 第 3 步：看意义
              body: 物理厚度 3.5 nm，电容却相当于不到 1 nm 的二氧化硅，漏电比 1 nm 的二氧化硅小得多。界面层占了 EOT 的一半，所以要尽量把它做薄。
      - item:
          id: eot-calc
          type: number
          prompt: 一层 2 nm 厚、介电常数 $k = 25$ 的二氧化铪，等效氧化层厚度是多少纳米？（不计界面层）
          answer: 0.312
          tolerance: 0.001
          unit: nm
          hint: 等效厚度和物理厚度、介电常数是什么关系？
          explain: $2\times3.9/25 = 0.312$ nm。
      - item:
          id: highk-thick
          type: number
          prompt: 要得到 1 nm 的等效氧化层厚度，用 $k = 25$ 的二氧化铪要做多厚（纳米）？
          answer: 6.41
          tolerance: 0.01
          unit: nm
          hint: 要 EOT 等于 1 nm，物理厚度要比 1 nm 厚几倍？
          explain: $t_{hk} = 1\times25/3.9 = 6.41$ nm，比 1 nm 的二氧化硅厚六倍多，穿透漏电大大减小。
  - id: fick-diffusion
    chapter: 扩散与离子注入
    title: 杂质在硅里怎样扩散
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 在高温下，硅片表面有很浓的磷，里面没有。过了一段时间，磷在硅里的分布会怎样？
          options:
            - text: 表面最浓，往里逐渐变淡，越往里越少
              correct: true
            - text: 整块硅里均匀分布
              why: 时间有限时磷只能走到表面附近，不会一下子均匀；只有时间极长才会趋于均匀
            - text: 全部留在表面，进不去
              why: 高温下杂质原子能在硅里移动，会逐渐往里走
          explain: 杂质从浓的地方向淡的地方净移动。表面一直保持高浓度时，越往里浓度越低，随时间推移这个分布越伸越深。
      - card:
          title: 菲克定律
          body: |
            高温下杂质原子在硅晶体里一步步跳动，宏观上从浓处流向淡处，这就是扩散。通量 $F$（每秒穿过每平方厘米的原子数）和浓度梯度成正比：

            $$F = -D\frac{\partial C}{\partial x}$$

            这是菲克第一定律，$D$ 叫**扩散系数（diffusion coefficient）**，单位 cm²/s，随温度急剧增大。结合原子数守恒，得到菲克第二定律 $\dfrac{\partial C}{\partial t} = D\dfrac{\partial^2C}{\partial x^2}$，浓度分布随时间的变化由它决定。
      - card:
          title: 两种常用的解
          body: |
            恒定表面浓度（表面一直有充足的杂质源，浓度保持 $C_s$）：

            $$C(x, t) = C_s\,\text{erfc}\left(\frac{x}{2\sqrt{Dt}}\right)$$

            erfc 是余误差函数，从 1 单调降到 0。有限源（表面先放好总量 $Q$ 个/cm²，再加热推进，叫再分布）：

            $$C(x, t) = \frac{Q}{\sqrt{\pi Dt}}\exp\left(-\frac{x^2}{4Dt}\right)$$

            是高斯形状，表面浓度随时间下降。两者里 $\sqrt{Dt}$ 都是扩散走过的特征长度。
      - item:
          id: gauss-surface
          type: number
          prompt: 有限源再分布：表面先放好总量 $Q = 10^{14}\ \text{cm}^{-2}$ 的硼，在 $D = 10^{-13}$ cm²/s 下推进 1 小时。表面浓度 $C(0) = Q/\sqrt{\pi Dt}$ 是多少？用 $10^{18}\ \text{cm}^{-3}$ 作单位填数字。
          answer: 2.97
          tolerance: 0.01
          unit: ×10¹⁸ cm⁻³
          hint: $Dt$ 是多少？
          explain: $Dt = 3.6\times10^{-10}$ cm²，$\sqrt{\pi Dt} = 3.36\times10^{-5}$ cm，$C(0) = 10^{14}/(3.36\times10^{-5}) = 2.97\times10^{18}\ \text{cm}^{-3}$。
      - card:
          title: 例题：恒定表面浓度扩散的结深
          body: 在 $10^{15}\ \text{cm}^{-3}$ 的 n 型硅上做硼扩散，表面浓度 $C_s = 10^{20}\ \text{cm}^{-3}$，$D = 2\times10^{-14}$ cm²/s，扩散 30 分钟。硼浓度降到等于衬底浓度的深度就是 PN 结的位置，叫结深。求结深。
          reveal:
            - title: 第 1 步：写出结的条件
              body: $C_s\,\text{erfc}(u) = 10^{15}$，即 $\text{erfc}(u) = 10^{-5}$，$u = x_j/(2\sqrt{Dt})$。
            - title: 第 2 步：查出 u
              body: 查余误差函数表（或用计算器反求），$\text{erfc}(u) = 10^{-5}$ 时 $u = 3.12$。
            - title: 第 3 步：算结深
              body: $\sqrt{Dt} = \sqrt{2\times10^{-14}\times1800} = 6.0\times10^{-6}$ cm，$x_j = 2\times3.12\times6.0\times10^{-6} = 3.75\times10^{-5}$ cm $= 0.375$ μm。
      - item:
          id: erfc-xj
          type: number
          prompt: 恒定表面浓度扩散：$C_s = 10^{20}\ \text{cm}^{-3}$，衬底浓度 $10^{16}\ \text{cm}^{-3}$，$D = 10^{-13}$ cm²/s，扩散 1 小时。$\text{erfc}(u) = 10^{-4}$ 时 $u = 2.75$。结深是多少微米？
          answer: 1.04
          tolerance: 0.01
          unit: μm
          hint: $\sqrt{Dt}$ 是多少？结深和 $u$ 是什么关系？
          explain: $\sqrt{10^{-13}\times3600} = 1.90\times10^{-5}$ cm，$x_j = 2\times2.75\times1.90\times10^{-5} = 1.04\times10^{-4}$ cm $= 1.04$ μm。
      - item:
          id: dt-scaling
          type: choice
          prompt: 其他条件不变，扩散时间变成原来的 4 倍，结深大约怎样变？
          options:
            - text: 变成约 2 倍
              correct: true
            - text: 变成约 4 倍
              why: 结深和 $\sqrt{Dt}$ 成正比，时间 4 倍，结深只增大到 $\sqrt4 = 2$ 倍
            - text: 不变，结深只由表面浓度决定
              why: 表面浓度和衬底浓度决定 $u$，时间决定 $\sqrt{Dt}$，结深是两者的乘积
          explain: $x_j = 2u\sqrt{Dt}$，$u$ 不变时 $x_j \propto \sqrt t$。想把结深加倍，要扩散 4 倍的时间。
  - id: diffused-layers
    chapter: 扩散与离子注入
    title: 扩散系数、方块电阻和掺杂方法
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 硼在硅里的扩散系数，1100 °C 和 1000 °C 相比大约差多少？
          options:
            - text: 大约 10 倍
              correct: true
            - text: 大约 1.1 倍，温度只高了 10%
              why: 扩散系数随温度按指数变化，不和温度成正比；高 100 °C 能差一个数量级
            - text: 几乎一样
              why: 杂质跳动需要克服能垒，温度稍高，能跳过去的比例就大得多
          explain: 扩散系数满足阿伦尼乌斯关系，指数里有温度的倒数。对硼，1000 °C 到 1100 °C 扩散系数增大约 10 倍。
      - card:
          title: 扩散系数的阿伦尼乌斯关系
          body: |
            杂质原子要跳到相邻的位置，得越过一个能垒，所以扩散系数随温度按指数变化：

            $$D = D_0\exp\left(-\frac{E_a}{kT}\right)$$

            $E_a$ 是激活能，$k = 8.617\times10^{-5}$ eV/K，$T$ 是热力学温度。一组常用数据：硼 $D_0 = 0.76$ cm²/s、$E_a = 3.46$ eV。温度控制差几度，扩散深度就明显不同，所以扩散炉的温度要控制得很准。
      - item:
          id: boron-d
          type: number
          prompt: 硼在硅里 $D_0 = 0.76$ cm²/s、$E_a = 3.46$ eV，$k = 8.617\times10^{-5}$ eV/K。1100 °C 时扩散系数是多少？用 $10^{-13}$ cm²/s 作单位填数字。
          answer: 1.52
          tolerance: 0.01
          unit: ×10⁻¹³ cm²/s
          hint: 1100 °C 是多少开尔文？$kT$ 是多少电子伏？
          explain: $T = 1373.15$ K，$kT = 0.1183$ eV，$E_a/kT = 29.24$，$D = 0.76\times e^{-29.24} = 1.52\times10^{-13}$ cm²/s。1000 °C 时是 $1.53\times10^{-14}$，正好差 10 倍。
      - card:
          title: 方块电阻和四探针
          body: |
            扩散层很薄，用它的**方块电阻（sheet resistance）** $R_s$ 描述：一块正方形的薄层，不论边长多大，两边之间的电阻都是 $R_s$，单位写成 Ω/□。一条长 $L$、宽 $W$ 的扩散电阻 $R = R_s\cdot L/W$。$R_s$ 等于平均电阻率除以层的厚度。

            测量用四探针：四根等间距的探针压在表面，外侧两根通电流 $I$，内侧两根测电压 $V$，薄层比探针间距大得多时 $R_s = \dfrac{\pi}{\ln2}\dfrac{V}{I} = 4.532\dfrac{V}{I}$。
      - card:
          title: 例题：从四探针到电阻
          body: 四探针测一层扩散层：电流 1 mA，内侧两针间电压 10 mV。结深 0.5 μm。求方块电阻、平均电阻率，以及一条长 100 μm、宽 10 μm 的电阻的阻值。
          reveal:
            - title: 第 1 步：方块电阻
              body: $R_s = 4.532\times10\ \text{mV}/1\ \text{mA} = 45.3$ Ω/□。
            - title: 第 2 步：平均电阻率
              body: $\rho = R_s\times x_j = 45.3\times0.5\times10^{-4} = 2.27\times10^{-3}$ Ω·cm。
            - title: 第 3 步：电阻的阻值
              body: 长宽比 $100/10 = 10$ 个方块，$R = 45.3\times10 = 453$ Ω。
      - item:
          id: four-point
          type: number
          prompt: 四探针测一层扩散层：外侧两针通 2 mA 电流，内侧两针间电压 15 mV（$R_s = 4.532V/I$）。方块电阻是多少 Ω/□？
          answer: 34
          tolerance: 0.05
          unit: Ω/□
          hint: $V/I$ 是多少欧？
          explain: $V/I = 15/2 = 7.5$ Ω，$R_s = 4.532\times7.5 = 34.0$ Ω/□。
      - item:
          id: sheet-resistor
          type: number
          prompt: 方块电阻 200 Ω/□ 的扩散层上做一条宽 5 μm、长 150 μm 的电阻。阻值是多少千欧？
          answer: 6
          tolerance: 0.001
          unit: kΩ
          hint: 这条电阻有多少个方块？
          explain: $150/5 = 30$ 个方块，$R = 200\times30 = 6000$ Ω $= 6$ kΩ。
      - card:
          title: 掺杂方法
          body: |
            早期用高温扩散：把晶圆放在含杂质的气氛里（如三氯氧磷、硼的化合物），先在表面淀积一层杂质，再加热推进，或者涂上含杂质的液体再加热。

            现在绝大部分掺杂用离子注入，剂量和深度都能精确控制，室温下进行，可以用光刻胶挡住不要的区域。扩散主要用在推进和激活上；外延时也可以边长边掺杂。设计扩散层时常用一组叫 Irvin 曲线的图，把表面浓度、结深和方块电阻联系起来。
      - item:
          id: implant-vs-diff
          type: choice
          prompt: 为什么现在的工艺大多用离子注入而不是高温扩散来掺杂？
          options:
            - text: 剂量和深度控制精确
              correct: true
            - text: 离子注入不需要后续加热
              why: 注入后一定要退火来修复损伤、激活杂质；它的优势在于控制精确
            - text: 扩散做不出 n 型区
              why: 扩散磷、砷就能做 n 型区；被取代是因为剂量和深度不好精确控制
          explain: 离子注入用电流计数离子，剂量精确；能量决定深度；室温下进行，光刻胶就能挡住。扩散的剂量和分布受温度、时间、表面状况影响大。
  - id: implant-basics
    chapter: 扩散与离子注入
    title: 离子注入
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 把硼原子电离后用电场加速到很高的速度，打进硅里。它们会停在哪里？
          options:
            - text: 大多停在表面下某个深度附近，前后有一定的分散
              correct: true
            - text: 全部停在同一个深度
              why: 每个离子一路上碰撞的次数和角度都是随机的，停下的深度有一个分布
            - text: 全部穿过整片硅片
              why: 离子在硅里不断碰撞、损失能量，几十到几百千电子伏的离子只能进去零点几微米
          explain: 离子进入硅后不断和原子、电子碰撞而减速，碰撞是随机的，停下的深度围绕一个平均值分布，近似高斯形状。
      - card:
          title: 剂量
          body: |
            离子注入把杂质电离、选出需要的离子、加速到几千到几百万电子伏，扫描着打满整片晶圆。注入的多少用**剂量（dose）** $Q$ 表示：每平方厘米打进多少个离子。离子带电，到达晶圆的电流可以精确测量：

            $$Q = \frac{It}{qA}$$

            $I$ 是束流，$t$ 是时间，$A$ 是晶圆面积，$q$ 是每个离子的电荷（一价离子为 $1.602\times10^{-19}$ C）。
      - item:
          id: implant-time
          type: number
          prompt: 用 1 mA 的硼离子束（一价）给直径 200 mm 的晶圆注入剂量 $10^{15}\ \text{cm}^{-2}$。要多少秒？
          answer: 50.3
          tolerance: 0.1
          unit: s
          hint: 晶圆面积多少平方厘米？时间和剂量、束流、面积是什么关系？
          explain: $A = \pi\times10^2 = 314.2\ \text{cm}^2$，$t = QqA/I = 10^{15}\times1.602\times10^{-19}\times314.2/10^{-3} = 50.3$ s。
      - card:
          title: 射程和高斯分布
          body: |
            离子停下的平均深度叫**投影射程（projected range）** $R_p$，分散程度用它的标准差 $\Delta R_p$ 表示。注入后的浓度近似为

            $$N(x) = N_p\exp\left[-\frac{(x - R_p)^2}{2\Delta R_p^2}\right],\qquad N_p = \frac{Q}{\sqrt{2\pi}\,\Delta R_p}$$

            能量越高，$R_p$ 越深；离子越重，同样能量下射程越浅。
      - card:
          title: 例题：峰值浓度
          body: 剂量 $5\times10^{14}\ \text{cm}^{-2}$，$\Delta R_p = 0.03$ μm。求峰值浓度。
          reveal:
            - title: 第 1 步：单位统一
              body: $\Delta R_p = 0.03\times10^{-4} = 3\times10^{-6}$ cm。
            - title: 第 2 步：代入
              body: $N_p = 5\times10^{14}/(2.507\times3\times10^{-6}) = 6.65\times10^{19}\ \text{cm}^{-3}$。
            - title: 第 3 步：检查
              body: 对整个高斯分布积分正好得到剂量 $Q$，所以分布越窄峰越高。
      - item:
          id: implant-peak
          type: number
          prompt: 离子注入剂量 $10^{15}\ \text{cm}^{-2}$，投影射程 0.1 μm，标准差 $\Delta R_p = 0.04$ μm。峰值浓度是多少？用 $10^{19}\ \text{cm}^{-3}$ 作单位填数字。
          answer: 9.97
          tolerance: 0.02
          unit: ×10¹⁹ cm⁻³
          hint: 峰值浓度只和剂量、$\Delta R_p$ 有关，0.04 μm 是多少厘米？
          explain: $N_p = 10^{15}/(\sqrt{2\pi}\times4\times10^{-6}) = 9.97\times10^{19}\ \text{cm}^{-3}$，约 $10^{20}$。
      - card:
          title: 多层注入和掩蔽厚度
          body: |
            用不同能量、剂量注入几次，叠加起来可以得到想要的浓度分布，比如阱、阈值调整、源漏各用一次。

            要挡住注入，掩蔽层（光刻胶、氧化层）要足够厚：浓度降到峰值的 $10^{-4}$ 以下时，$\exp(-m^2/2) = 10^{-4}$，$m = 4.29$，所以掩蔽层厚度至少 $R_p + 4.29\Delta R_p$（$R_p$、$\Delta R_p$ 按离子在掩蔽材料里的值取）。
      - item:
          id: mask-thickness
          type: number
          prompt: 某次注入在氧化层里的 $R_p = 0.1$ μm、$\Delta R_p = 0.04$ μm。要让穿过氧化层的浓度降到峰值的 $10^{-4}$ 以下（$m = 4.29$），氧化层至少多厚（微米）？
          answer: 0.272
          tolerance: 0.002
          unit: μm
          hint: 掩蔽层厚度要超过射程多少个标准差？
          explain: $0.1 + 4.29\times0.04 = 0.272$ μm。
  - id: stopping-annealing
    chapter: 扩散与离子注入
    title: 离子怎样停下来，损伤和退火
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 离子注入时晶圆常常故意倾斜 7° 左右。为什么？
          options:
            - text: 避免离子沿原子通道钻深
              correct: true
            - text: 让离子打得更均匀
              why: 均匀靠扫描；倾斜是为了不让离子顺着原子排成的通道一路钻下去
            - text: 让离子打得更浅，减少损伤
              why: 倾斜几度对深度影响很小，目的是防止沟道效应造成的深尾巴
          explain: 单晶里原子排成一列列，沿某些方向看过去有笔直的空隙。离子正对着这些方向进入，碰撞少、钻得很深，分布拖出一条长尾巴。倾斜一点就避开了。
      - card:
          title: 核阻止和电子阻止
          body: |
            离子减速靠两种作用。**核阻止（nuclear stopping）**：和硅原子核碰撞，把能量交给整个原子，可能把它撞离原来的位置。**电子阻止（electronic stopping）**：在电子云里穿行，像在黏稠的液体里受阻力，能量交给电子，不撞歪原子。

            低能量、重离子以核阻止为主，射程浅、损伤大；高能量、轻离子以电子阻止为主，前半段几乎不损伤晶体，快停下时才以核碰撞为主。
      - item:
          id: heavy-light
          type: choice
          prompt: 同样能量下，砷离子和硼离子打进硅里，哪种造成的晶格损伤更集中、更严重？
          options:
            - text: 砷，它重，以核碰撞为主
              correct: true
            - text: 硼，它轻，跑得快
              why: 轻离子以电子阻止为主，前段几乎不撞歪原子；损伤主要来自重离子的核碰撞
            - text: 一样，能量相同损伤就相同
              why: 能量交给原子核还是交给电子，取决于离子质量和速度，重离子交给原子核的多
          explain: 砷的质量和硅接近，碰撞时传递的能量大，以核阻止为主，射程浅、损伤集中；剂量大时能把表面一层打成非晶。
      - card:
          title: 沟道效应
          body: |
            离子沿着晶体里原子排成的通道方向进入时，很少碰到原子核，能钻得比预期深得多，叫**沟道效应（channeling）**。办法是把晶圆倾斜约 7°、转一个角度，或者先用一次注入把表面打成非晶，或者透过一层薄氧化层注入，让离子方向变乱。
      - card:
          title: 损伤和退火
          body: |
            核碰撞把硅原子撞离原来的位置，留下空位和挤在缝隙里的原子；剂量大时表面一层完全失去晶体结构，变成非晶。注入的杂质也大多不在能导电的位置上。所以注入后必须加热，即退火：让晶格恢复，让杂质替换硅原子、能导电（激活）。

            非晶层退火时会以下面的单晶为模板一层层重新长成单晶。现在用快速热退火或毫秒级的尖峰退火，温度高、时间极短，激活充分而杂质扩散很少。
      - item:
          id: anneal-why
          type: choice
          prompt: 离子注入以后为什么一定要退火？
          options:
            - text: 修复损伤并激活杂质
              correct: true
            - text: 让杂质扩散得更深
              why: 现在的退火恰恰要尽量少扩散，只修复损伤、激活杂质
            - text: 让注入的离子降温、中和电荷
              why: 离子停下后很快就和周围一样温度、电荷也被中和；退火要解决的是晶格损伤和杂质位置
          explain: 刚注入时，杂质多半挤在原子之间的缝隙里，不提供载流子，晶格也被撞乱了。退火让晶格恢复、杂质替换硅原子，才能得到设计的电导。
      - card:
          title: 瞬态增强扩散和等离子体浸没注入
          body: |
            注入产生的大量多余硅原子挤在缝隙里，会在退火开始的短时间里大大加速硼等杂质的扩散，叫瞬态增强扩散，让浅结变深。这是先进工艺只用极短时间退火的原因之一。

            等离子体浸没注入：把晶圆放在含杂质的等离子体里，给晶圆加负的脉冲高压，离子从四面八方同时被吸进表面。不用扫描束流，速度快、能量低，适合很浅的结和立体结构，但离子能量和种类不如束流注入纯。
      - item:
          id: piii-use
          type: choice
          prompt: 等离子体浸没注入比普通的束流注入更适合哪种场合？
          options:
            - text: 大剂量浅注入或立体结构侧面
              correct: true
            - text: 要求能量和离子种类很纯的深注入
              why: 浸没注入的离子能量分散、种类不经筛选，这正是束流注入的强项
            - text: 只给晶圆中心一小块区域注入
              why: 浸没注入是整片同时进行的，局部注入要靠光刻胶掩蔽，和方式无关
          explain: 浸没注入不扫描，整片同时注入，低能大剂量时效率高；离子从各个方向来，鳍这类立体结构的侧面也能掺到。
      - item:
          id: tilt-depth
          type: number
          prompt: 离子以倾斜 7° 的方向注入，沿入射方向走了 200 nm。它的垂直深度是多少纳米？
          answer: 198.5
          tolerance: 0.05
          unit: nm
          hint: 垂直深度和沿路径的距离差一个什么三角函数？
          explain: $200\times\cos7° = 198.5$ nm。倾斜 7° 对深度影响不到 1%，却能有效避开沟道效应。
  - id: wet-etch
    chapter: 刻蚀
    title: 湿法刻蚀
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 光刻胶上开了一个 1 μm 宽的窗口，把晶圆泡进能溶解下面氧化层的溶液里。氧化层被刻出的口子会是多宽？
          options:
            - text: 比 1 μm 宽，会横向钻蚀
              correct: true
            - text: 正好 1 μm，胶挡住的地方不会被腐蚀
              why: 溶液向各个方向腐蚀的速度一样，往下刻的同时也往胶下面钻，口子会变宽
            - text: 比 1 μm 窄
              why: 腐蚀只会去掉材料，口子只会比窗口宽
          explain: 溶液在各个方向上腐蚀得一样快，往下刻多深，就往两边钻多深，口子比胶的窗口宽。
      - card:
          title: 各向同性和横向钻蚀
          body: |
            用溶液腐蚀叫湿法刻蚀。大多数湿法刻蚀在各个方向速度相同，叫**各向同性（isotropic）**，刻多深就向两边钻多深，这叫横向钻蚀。只往下刻、不往两边钻的叫**各向异性（anisotropic）**。

            湿法刻蚀的优点是**选择比（selectivity）**高：要刻的材料和不该刻的材料（下层、掩模）刻蚀速度之比可以很大，比如氢氟酸刻二氧化硅几乎不刻硅。它便宜、损伤小，现在多用于去掉整层膜和清洗，细线条的图形转移交给干法刻蚀。
      - item:
          id: iso-undercut
          type: number
          prompt: 光刻胶窗口宽 2 μm，用各向同性的湿法刻蚀刻穿 0.6 μm 厚的氧化层（刚好刻穿）。氧化层顶部的开口宽多少微米？
          answer: 3.2
          tolerance: 0.001
          unit: μm
          hint: 两边各往胶下面钻进去多少？
          explain: 各向同性，两边各横向钻 0.6 μm，开口 $2 + 2\times0.6 = 3.2$ μm。线条间距小于膜厚的两倍时，湿法刻蚀就不能用了。
      - card:
          title: 例题：选择比和过刻
          body: 刻蚀 300 nm 多晶硅，刻蚀速度 200 nm/min，下面氧化层的刻蚀速度 4 nm/min。为了保证各处都刻干净，要过刻 20%（多刻主刻蚀时间的 20%）。求选择比、过刻时间和氧化层的损失。
          reveal:
            - title: 第 1 步：选择比
              body: $200/4 = 50$。
            - title: 第 2 步：过刻时间
              body: 主刻蚀 $300/200 = 1.5$ min，过刻 $0.2\times1.5 = 0.3$ min。
            - title: 第 3 步：下层损失
              body: 过刻时多晶硅已经刻完，露出的氧化层被刻 $4\times0.3 = 1.2$ nm。选择比越高，下层损失越少。
      - item:
          id: selectivity-calc
          type: number
          prompt: 刻蚀 500 nm 氧化层，速度 100 nm/min，下层硅的刻蚀速度 5 nm/min，过刻 10%。过刻期间硅损失多少纳米？
          answer: 2.5
          tolerance: 0.001
          unit: nm
          hint: 主刻蚀要几分钟？过刻多久？
          explain: 主刻蚀 5 min，过刻 0.5 min，硅损失 $5\times0.5 = 2.5$ nm。选择比是 $100/5 = 20$。
      - card:
          title: KOH 的各向异性腐蚀
          body: |
            也有各向异性的湿法刻蚀：氢氧化钾（KOH）溶液腐蚀硅时，(111) 面比 (100) 面慢得多，在 (100) 晶圆上刻出的坑以 (111) 面为侧壁，侧壁和表面成 54.74°。窗口宽 $W$、刻深 $d$ 时，坑底宽 $W - 2d/\tan54.74° \approx W - 1.414d$；刻到坑底收成一条线时就自动停止，形成 V 形槽。

            这种腐蚀常用来做微机械结构，比如压力传感器的薄膜。
      - item:
          id: koh-bottom
          type: number
          prompt: (100) 硅片上用 KOH 腐蚀，窗口宽 100 μm，刻深 30 μm，侧壁和表面成 54.74°。坑底宽多少微米？
          answer: 57.6
          tolerance: 0.05
          unit: μm
          hint: 每一侧的侧壁在水平方向占多宽？
          explain: 每侧 $30/\tan54.74° = 21.2$ μm，坑底 $100 - 2\times21.2 = 57.6$ μm。继续刻到约 70.7 μm 深，两侧壁相交，V 形槽自动停止。
      - item:
          id: wet-vs-dry
          type: choice
          prompt: 刻 30 nm 宽的栅极线条，为什么不用湿法刻蚀？
          options:
            - text: 横向钻蚀，线守不住
              correct: true
            - text: 湿法刻蚀的选择比太低
              why: 湿法的选择比往往很高；它的问题是各向同性
            - text: 湿法刻蚀太慢
              why: 湿法刻蚀并不慢；问题在于它向两边钻，线宽守不住
          explain: 栅极要陡直的侧壁和精确的线宽。湿法向两边钻的量和刻深相当，几十纳米的线经不起，所以要用各向异性的等离子体干法刻蚀。
  - id: plasma-etch
    chapter: 刻蚀
    title: 等离子体刻蚀
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 干法刻蚀能刻出几乎垂直的侧壁。它靠什么做到只往下刻、不往两边刻？
          options:
            - text: 被电场加速的离子垂直轰击底部，帮助那里的化学反应，侧壁受轰击少
              correct: true
            - text: 气体只会往下流
              why: 气体分子向各个方向运动；方向性来自被电场加速、垂直打向晶圆的离子
            - text: 侧壁的材料和底部不一样
              why: 侧壁和底部是同一种材料；差别在于有没有受到离子的垂直轰击
          explain: 等离子体里的离子被晶圆表面的电场加速，几乎垂直地打下来，底部受轰击而侧壁几乎不受，于是底部刻得快、侧壁刻得慢。
      - card:
          title: 等离子体
          body: |
            在低压气体里加射频电场（常用 13.56 MHz），电子被加速、撞击气体分子，把它们电离或打碎，得到电子、离子和化学活性很强的中性碎片（自由基）混在一起、整体呈电中性的气体，就是等离子体。

            电子比离子轻得多、跑得快，晶圆表面会带上负电，形成一层电场，把正离子朝晶圆加速，离子几乎垂直地打到表面。
      - item:
          id: plasma-ions
          type: choice
          prompt: 等离子体刻蚀时，为什么正离子是几乎垂直地打到晶圆上的？
          options:
            - text: 表面附近的电场把它们加速
              correct: true
            - text: 离子本来就是垂直运动的
              why: 等离子体里的离子原本向各个方向乱跑，是表面附近的电场把它们拉直
            - text: 刻蚀机用磁铁把离子排成一列
              why: 有的刻蚀机用磁场提高等离子体密度，但让离子垂直入射的是表面的电场
          explain: 电子跑得快，先到达晶圆，表面带负电，形成一层鞘层电场。正离子穿过鞘层时被加速，方向几乎垂直于表面。
      - card:
          title: 三种刻蚀机理
          body: |
            化学刻蚀：自由基和表面反应生成挥发性产物，比如氟和硅生成四氟化硅气体。选择比高，但各向同性。物理刻蚀：离子像小锤子把原子撞出去，方向性好，但选择比低、速度慢。离子增强刻蚀：离子轰击让底部的化学反应大大加快，兼有方向性和较好的选择比，这就是**反应离子刻蚀（RIE, reactive ion etching）**的主要机理。

            侧壁上常沉积一层聚合物保护膜，离子把底部的膜打掉，侧壁的留着，各向异性更好。
      - item:
          id: anisotropy
          type: number
          prompt: 某干法刻蚀向下的速度 100 nm/min，横向速度 5 nm/min。各向异性度 $A = 1 - r_{横向}/r_{向下}$ 是多少？
          answer: 0.95
          tolerance: 0.001
          hint: 横向速度是向下速度的几分之几？
          explain: $A = 1 - 5/100 = 0.95$。$A = 1$ 是完全各向异性，$A = 0$ 是各向同性（湿法）。
      - card:
          title: 负载效应和深宽比
          body: |
            同一台机器里，要刻的面积越大，消耗的活性粒子越多，刻蚀速度越低，叫负载效应。深而窄的孔里，活性粒子和离子进得去的越来越少，刻得越来越慢，叫深宽比相关刻蚀。工艺开发时要针对实际的图形密度和孔的尺寸调好参数。
      - card:
          title: 原子层刻蚀
          body: |
            线条只有几纳米时，要能一层原子一层原子地刻。**原子层刻蚀（ALE, atomic layer etching）**把刻蚀分成交替的两步：先通入氯气等，让表面一层原子吸附而改性，多余的气体抽走；再用低能离子只把改性的那一层打掉。每一步都会自己停下（自限制），每一轮刻掉的厚度固定，刻多少轮就刻多深，表面也很平整。代价是很慢。
      - item:
          id: ale-cycles
          type: number
          prompt: 某原子层刻蚀每一轮刻掉 0.2 nm。要刻掉 10 nm，需要多少轮？
          answer: 50
          hint: 每轮刻掉多少？刻 10 nm 要几轮？
          explain: $10/0.2 = 50$ 轮。每一轮都是自限制的，刻多深只看轮数，控制得很准。
      - item:
          id: rie-mechanism
          type: choice
          prompt: 反应离子刻蚀为什么能同时做到方向性好和选择比较高？
          options:
            - text: 化学管选择性，离子管方向
              correct: true
            - text: 它完全靠离子把原子撞出去
              why: 纯物理撞击方向性好，但选择比低；反应离子刻蚀的主要机理是离子增强的化学反应
            - text: 它完全靠化学反应
              why: 纯化学刻蚀是各向同性的；方向性来自离子的垂直轰击
          explain: 刻什么不刻什么，主要由化学反应决定；往哪个方向刻，由离子决定。离子打到的底部反应快，侧壁没有离子帮忙，又有保护膜，几乎不刻。
  - id: cvd
    chapter: 薄膜沉积
    title: 化学气相沉积
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 在一个深沟槽上沉积一层膜，希望沟槽的底部、侧壁和顶面一样厚。下面哪种做法最可能做到？
          options:
            - text: 让分子在表面多次反弹再反应
              correct: true
            - text: 让材料原子像喷漆一样直线飞向晶圆
              why: 直线飞行时侧壁和沟槽底部被遮挡，顶面厚、侧壁薄
            - text: 只要沉积得足够快就行
              why: 越快越容易在沟槽口堆积、把口封住；均匀要靠粒子能进到沟槽里各处反应
          explain: 反应慢、粒子能在表面多次反弹时，沟槽里各处都能等到粒子，膜就均匀；直线飞来的粒子会被遮挡。
      - card:
          title: 化学气相沉积和台阶覆盖
          body: |
            把含有所需原子的气体通到加热的晶圆上，在表面发生化学反应，生成固体薄膜，副产物被抽走，叫**化学气相沉积（CVD, chemical vapor deposition）**。比如硅烷分解沉积多晶硅，硅烷和氧气反应沉积二氧化硅。

            薄膜在台阶上的均匀程度叫**台阶覆盖（step coverage）**：侧壁或底部厚度和顶面厚度之比。厚度处处一样叫共形。CVD 的反应粒子能在表面反弹，台阶覆盖通常比直线飞来的沉积方法好。
      - item:
          id: step-coverage
          type: number
          prompt: 一次沉积后，沟槽顶面膜厚 100 nm，侧壁 60 nm。侧壁的台阶覆盖是百分之几？
          answer: 60
          tolerance: 0.001
          unit: '%'
          hint: 台阶覆盖是谁和谁之比？
          explain: $60/100 = 60\%$。共形沉积是 100%。
      - card:
          title: Grove 模型
          body: |
            CVD 的速度由两步串联决定：反应气体从气流扩散到表面（质量输运，系数 $h_G$），在表面反应（反应速度常数 $k_S$）。两步相等时，生长速度

            $$v = \frac{k_Sh_G}{k_S + h_G}\cdot\frac{C_g}{N}$$

            $C_g$ 是气流里反应物的浓度，$N$ 是膜里每立方厘米的原子数。$k_S \ll h_G$ 时速度由表面反应决定，随温度指数变化，要把温度控制得很均匀；$h_G \ll k_S$ 时由质量输运决定，对温度不敏感，但对气流的分布敏感。
      - card:
          title: 例题：哪一步说了算
          body: 某次 CVD $k_S = 1$ cm/s，$h_G = 10$ cm/s，$C_g = 10^{16}\ \text{cm}^{-3}$，$N = 5\times10^{22}\ \text{cm}^{-3}$。求生长速度，并判断由哪一步控制。
          reveal:
            - title: 第 1 步：等效速度常数
              body: $k_Sh_G/(k_S + h_G) = 10/11 = 0.909$ cm/s，接近较小的 $k_S$。
            - title: 第 2 步：生长速度
              body: $v = 0.909\times10^{16}/(5\times10^{22}) = 1.82\times10^{-7}$ cm/s，即 1.82 nm/s，每分钟约 109 nm。
            - title: 第 3 步：判断
              body: $k_S$ 比 $h_G$ 小 10 倍，表面反应控制，温度要控制得均匀，气流分布的影响小。
      - item:
          id: grove-limit
          type: choice
          prompt: 低压 CVD（LPCVD）里晶圆一片片竖着紧挨着排在炉管里，膜厚仍很均匀。这说明它工作在哪种控制下？
          options:
            - text: 表面反应控制，扩散很快
              correct: true
            - text: 质量输运控制
              why: 质量输运控制时，气流到不了的地方就长得慢，晶圆紧挨着排列不可能均匀
            - text: 和控制方式无关，低压本身就让膜均匀
              why: 低压的作用正是让扩散变快、$h_G$ 变大，从而进入表面反应控制
          explain: 压强低，气体扩散系数大，$h_G \gg k_S$，速度只由表面反应和温度决定。炉管里温度均匀，晶圆再挤也能长得均匀。
      - card:
          title: PECVD 和原子层沉积
          body: |
            等离子体增强 CVD（PECVD）用等离子体把气体分解，反应在 300–400 °C 就能进行，适合在已经有铝或铜的晶圆上沉积介质。

            **原子层沉积（ALD, atomic layer deposition）**把两种反应气体交替通入，中间抽干净：第一种只在表面吸附一层就饱和，第二种和这层反应生成一层膜，又自己停下。每一轮长约 0.1 nm，台阶覆盖接近 100%，高 k 栅介质就是用它沉积的。
      - item:
          id: ald-cycles
          type: number
          prompt: 用原子层沉积长 2 nm 的二氧化铪，每一轮长 0.1 nm。要多少轮？
          answer: 20
          hint: 每轮长多厚？长 2 nm 要几轮？
          explain: $2/0.1 = 20$ 轮。厚度只由轮数决定，几纳米的薄膜也能做得很准。
  - id: pvd
    chapter: 薄膜沉积
    title: 溅射、蒸发和沉积模型
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 在真空里加热一块铝，让它蒸发，铝原子飞到上方的晶圆上。在有深沟槽的晶圆上，膜会怎样？
          options:
            - text: 顶面厚，沟槽侧壁和底部很薄，像被遮住了一样
              correct: true
            - text: 到处一样厚
              why: 真空里铝原子直线飞行，沟槽的侧壁和底部被沟槽口挡住，接收到的原子少
            - text: 沟槽里比顶面厚
              why: 沟槽里只能接收从窄口直射进来的原子，只会更薄
          explain: 高真空下原子几乎不碰撞，从源出发直线飞到晶圆，被挡住的地方就长不上，台阶覆盖差。
      - card:
          title: 物理气相沉积和平均自由程
          body: |
            不靠化学反应、而是把材料原子从源上“搬”到晶圆上的方法叫**物理气相沉积（PVD, physical vapor deposition）**，主要有蒸发和溅射。

            原子在气体里飞多远才和气体分子碰一次，由平均自由程决定：$\lambda = \dfrac{kT}{\sqrt2\pi d^2p}$，$d$ 是分子直径，$p$ 是压强。压强越低，原子飞得越直。
      - item:
          id: mfp-calc
          type: number
          prompt: 按 $\lambda = kT/(\sqrt2\pi d^2p)$，取 $k = 1.381\times10^{-23}$ J/K、$T = 300$ K、分子直径 $d = 0.36$ nm。压强 1 Pa 时平均自由程是多少毫米？
          answer: 7.19
          tolerance: 0.02
          unit: mm
          hint: 分子直径换成米是多少？分母里的各项乘起来是多少？
          explain: $\lambda = 4.14\times10^{-21}/(1.414\times3.1416\times1.296\times10^{-19}\times1) = 7.19\times10^{-3}$ m $= 7.19$ mm。压强降到 $10^{-4}$ Pa（蒸发用的高真空）时约 72 m，比腔体大得多，原子一路直飞。
      - card:
          title: 蒸发和溅射
          body: |
            蒸发：在高真空里用电阻或电子束把材料加热到蒸发，原子直线飞向晶圆。设备简单，但台阶覆盖差，合金各成分蒸发速度不同、成分难控制，难熔金属也不易蒸发。它的方向性正好用来做剥离工艺。

            **溅射（sputtering）**：在约 1 Pa 的氩气里产生等离子体，氩离子被加速撞击材料做成的靶，把靶上的原子撞出来，飞到晶圆上。靶后面加磁铁把电子约束在靶附近，叫磁控溅射，速度高得多。溅射能沉积合金和难熔金属，成分和靶一致，铜种子层、阻挡层、铝线都用它。
      - item:
          id: sputter-alloy
          type: choice
          prompt: 要沉积一层铝铜合金，成分要和设计一致。用溅射还是蒸发更合适？
          options:
            - text: 溅射，成分和靶一致
              correct: true
            - text: 蒸发，加热能让两种金属同时变成气体
              why: 两种金属的蒸气压不同，蒸发得快的那种先跑掉，膜的成分会偏
            - text: 两种都一样
              why: 溅射靠撞击，各成分很快达到和靶一致的比例；蒸发靠蒸气压，成分会偏
          explain: 蒸发速度由各成分的蒸气压决定，合金会分馏。溅射是把靶原子一个个撞出来，稳定后膜的成分和靶相同。
      - card:
          title: 沉积的模型和仿真
          body: |
            台阶覆盖可以用一个参数来理解：粒子第一次碰到表面时粘住的概率，叫黏附系数。蒸发和溅射来的原子黏附系数接近 1，碰到哪里就停在哪里，沟槽口先堆积、变成“面包”形，底下的口还没填满就被封住，留下空洞。CVD 里的反应粒子黏附系数小，碰一下多半弹开，在沟槽里反弹很多次，到处都有机会沉积，膜更共形。

            把入射方向分布、黏附系数和表面反弹写进模型，用计算机模拟一个个粒子，就能预测沉积后的形状，指导工艺。
      - card:
          title: 例题：两种方法填沟槽
          body: 要在一个深宽比 2:1 的沟槽里先铺一层很薄的阻挡层，再把沟槽填满介质。比较溅射和 CVD 各适合哪一步。
          reveal:
            - title: 第 1 步：看各自的黏附系数
              body: 溅射在约 1 Pa 下进行，原子到达时方向已经分散，台阶覆盖比蒸发好，但黏附系数接近 1，深而窄的孔仍铺不到底；CVD 粒子黏附系数小，多次反弹。
            - title: 第 2 步：阻挡层
              body: 很薄的金属阻挡层要求成分准、附着好，常用溅射；为了把侧壁和底部也铺到，用让原子方向更垂直的改进型溅射。
            - title: 第 3 步：填满沟槽
              body: 要无空洞地填满，选台阶覆盖好的 CVD；特别窄深的结构用 ALD 或边沉积边刻的方法。
      - item:
          id: sticking
          type: choice
          prompt: 为什么黏附系数小的沉积方法台阶覆盖好？
          options:
            - text: 粒子碰到表面多半弹开，能在沟槽里反弹多次，侧壁和底部都有机会沉积
              correct: true
            - text: 黏附系数小，沉积得快
              why: 黏附系数小反而让每次碰撞沉积的概率低；好处是粒子分布均匀，不是快
            - text: 黏附系数小的粒子跑得慢，落下后有时间铺开
              why: 黏附系数是一碰就粘住的概率，和速度无关；覆盖好是因为粒子会反弹到各处
          explain: 黏附系数接近 1 时，粒子在第一次碰到的地方就停下，被遮挡的区域长不上；黏附系数小，粒子会反弹到各处，沟槽深处也能长。
      - item:
          id: mfp-highvac
          type: number
          prompt: 同样的气体和温度，压强从 1 Pa 降到 0.5 Pa，平均自由程变为原来的几倍？
          answer: 2
          tolerance: 0.001
          hint: $\lambda$ 和压强是什么关系？
          explain: $\lambda \propto 1/p$，压强减半，平均自由程加倍。
boss:
  items:
    - id: b-vt-shift
      type: number
      prompt: 栅氧厚 3 nm，往 NMOS 沟道区注入剂量 $2\times10^{12}\ \text{cm}^{-2}$ 的硼（全部留在表面附近、全部电离）。按 $\Delta V_{th} = qQ/C_{ox}$，阈值移动多少伏？（$\varepsilon_{ox} = 3.9\times8.854\times10^{-14}$ F/cm，$q = 1.602\times10^{-19}$ C）
      answer: 0.278
      tolerance: 0.002
      unit: V
      hint: $C_{ox}$ 是多少？
      explain: $C_{ox} = 3.453\times10^{-13}/(3\times10^{-7}) = 1.151\times10^{-6}\ \text{F/cm}^2$，$\Delta V_{th} = 3.204\times10^{-7}/(1.151\times10^{-6}) = 0.278$ V。
    - id: b-fin
      type: number
      prompt: 一个鳍式工艺每条鳍高 45 nm、宽 6 nm。设计要求有效沟道宽度至少 250 nm，至少要几条鳍？
      answer: 3
      hint: 一条鳍的有效宽度是多少？
      explain: 一条 $2\times45 + 6 = 96$ nm，$250/96 = 2.6$，取整到 3 条，有效宽度 288 nm。
    - id: b-em
      type: number
      prompt: 按 Black 方程 $\text{MTTF} = AJ^{-2}\exp(E_a/kT)$，$E_a = 0.8$ eV，$k = 8.617\times10^{-5}$ eV/K。一条线的电流密度加倍，同时工作温度从 100 °C 升到 120 °C，平均失效时间变为原来的多少？
      answer: 0.0705
      tolerance: 0.0005
      hint: 电流和温度两个因素各让寿命变为多少倍？
      explain: 电流加倍让寿命变为 $2^{-2} = 0.25$；温度那一项 $\exp\left[\dfrac{0.8}{8.617\times10^{-5}}\left(\dfrac{1}{393.15} - \dfrac{1}{373.15}\right)\right] = 0.282$。两者相乘 0.0705，寿命只剩约十四分之一。
    - id: b-cmp
      type: number
      prompt: 铜电镀后沟槽外多出 900 nm 的铜。抛光的 Preston 系数 $K_p = 1\times10^{-13}\ \text{m}^2/\text{N}$，压强 40 kPa，相对速度 0.5 m/s。按 $RR = K_pPv$，磨掉这层要几分钟？
      answer: 7.5
      tolerance: 0.01
      unit: min
      hint: 去除速度是每分钟多少纳米？
      explain: $RR = 10^{-13}\times4\times10^4\times0.5 = 2\times10^{-9}$ m/s，即每分钟 120 nm，$900/120 = 7.5$ min。
    - id: b-dpw
      type: number
      prompt: 直径 300 mm 的晶圆，芯片面积 0.5 cm²。按 $N \approx \pi(d/2)^2/A - \pi d/\sqrt{2A}$，大约能放多少个芯片？（取整数部分）
      answer: 1319
      tolerance: 0.6
      hint: $d$ 用厘米，两项各是多少？
      explain: $\pi\times15^2/0.5 = 1413.7$，$\pi\times30/\sqrt{1} = 94.2$，$1413.7 - 94.2 = 1319.5$，约 1319 个。
    - id: b-scheil
      type: number
      prompt: 用掺硼的熔体拉晶，硼的分凝系数 $k_0 = 0.8$，正在凝固的晶体浓度 $C_s = k_0C_0(1 - f)^{k_0 - 1}$。熔体凝固了 90%（$f = 0.9$）时，正在凝固的那一段晶体里硼浓度是开始时熔体浓度 $C_0$ 的几倍？
      answer: 1.268
      tolerance: 0.002
      hint: $1 - f$ 和指数 $k_0 - 1$ 各是多少？
      explain: $0.8\times0.1^{-0.2} = 0.8\times1.585 = 1.268$。硼的 $k_0$ 接近 1，晶棒从头到尾的浓度变化比磷小得多。
    - id: b-yield
      type: number
      prompt: 缺陷密度 $0.2\ \text{cm}^{-2}$，芯片面积 0.8 cm²。按泊松模型 $Y = e^{-DA}$，良率是百分之几？
      answer: 85.2
      tolerance: 0.05
      unit: '%'
      hint: 每个芯片平均有几个缺陷？
      explain: $DA = 0.16$，$e^{-0.16} = 0.852$，即 85.2%。
    - id: b-cpk
      type: number
      prompt: 某层线宽规格 $10\pm0.3$ nm（LSL = 9.7 nm，USL = 10.3 nm），工序平均值 10.1 nm，标准差 0.04 nm。过程能力指数 $C_{pk}$ 是多少？
      answer: 1.667
      tolerance: 0.002
      hint: 平均值离哪条规格限更近？
      explain: 离上限 0.2 nm，离下限 0.4 nm，取 0.2：$C_{pk} = 0.2/(3\times0.04) = 1.667$。
    - id: b-litho
      type: number
      prompt: ArF 干式光刻 $\lambda = 193$ nm，$NA = 0.93$，$k_1 = 0.35$。按 $R = k_1\lambda/NA$，最小线宽约是多少纳米？
      answer: 72.6
      tolerance: 0.1
      unit: nm
      hint: 三个数怎样组合？
      explain: $0.35\times193/0.93 = 72.6$ nm。换成 $NA = 1.35$ 的浸没式，同样的 $k_1$ 能做到 50 nm。
    - id: b-dg
      type: number
      prompt: 某湿氧条件下 Deal–Grove 常数 $A = 0.11$ μm、$B = 0.51$ μm²/h、$\tau = 0$。长 1 μm 的氧化层要多少小时？
      answer: 2.18
      tolerance: 0.01
      unit: h
      hint: 由 $x^2 + Ax = B(t + \tau)$ 解出 $t$ 是什么？
      explain: $t = (1 + 0.11)/0.51 = 2.18$ h。$x^2$ 远大于 $Ax$，已经处在抛物线区。
    - id: b-implant-peak
      type: number
      prompt: 离子注入剂量 $2\times10^{15}\ \text{cm}^{-2}$，射程标准差 $\Delta R_p = 0.05$ μm。峰值浓度是多少？用 $10^{20}\ \text{cm}^{-3}$ 作单位填数字。
      answer: 1.6
      tolerance: 0.005
      unit: ×10²⁰ cm⁻³
      hint: 峰值浓度由剂量和 $\Delta R_p$ 怎样算出？
      explain: $N_p = 2\times10^{15}/(\sqrt{2\pi}\times5\times10^{-6}) = 1.60\times10^{20}\ \text{cm}^{-3}$。
    - id: b-erfc
      type: number
      prompt: 恒定表面浓度扩散：$C_s = 10^{20}\ \text{cm}^{-3}$，衬底浓度 $10^{15}\ \text{cm}^{-3}$，$D = 4\times10^{-14}$ cm²/s，扩散 2 小时。$\text{erfc}(u) = 10^{-5}$ 时 $u = 3.12$。结深是多少微米？
      answer: 1.06
      tolerance: 0.003
      unit: μm
      hint: 结处的 erfc 值是多少？$\sqrt{Dt}$ 是多少？
      explain: $10^{15}/10^{20} = 10^{-5}$，$u = 3.12$；$\sqrt{4\times10^{-14}\times7200} = 1.70\times10^{-5}$ cm，$x_j = 2\times3.12\times1.70\times10^{-5} = 1.06\times10^{-4}$ cm $= 1.06$ μm。
    - id: b-etch
      type: number
      prompt: 刻蚀 400 nm 氮化硅，刻蚀速度 160 nm/min，下层氧化层的刻蚀速度 8 nm/min，过刻 25%。过刻期间氧化层损失多少纳米？
      answer: 5
      tolerance: 0.001
      unit: nm
      hint: 主刻蚀几分钟？过刻多久？
      explain: 主刻蚀 $400/160 = 2.5$ min，过刻 $0.25\times2.5 = 0.625$ min，氧化层损失 $8\times0.625 = 5$ nm。
    - id: b-grove
      type: number
      prompt: 某次 CVD 的表面反应速度常数 $k_S = 2$ cm/s，质量输运系数 $h_G = 2$ cm/s，气流中反应物浓度 $10^{16}\ \text{cm}^{-3}$，膜中每立方厘米 $2.3\times10^{22}$ 个分子。按 Grove 模型，生长速度是每分钟多少纳米？
      answer: 261
      tolerance: 0.5
      unit: nm/min
      hint: 两个系数串联后的等效值是多少？
      explain: $k_Sh_G/(k_S + h_G) = 1$ cm/s，$v = 10^{16}/(2.3\times10^{22}) = 4.35\times10^{-7}$ cm/s，即 4.35 nm/s，每分钟约 261 nm。两步一样快，温度和气流都会影响速度。
    - id: b-damascene
      type: choice
      prompt: 铝互连是先沉积一整层铝再刻蚀出线条；铜互连却改成先在介质里刻沟槽、再填铜、最后把表面多余的铜磨掉。为什么要这样改？
      options:
        - text: 铜很难用等离子体刻蚀
          correct: true
        - text: 铜的电阻率比铝高，要做成更粗的嵌入式线条
          why: 铜的电阻率比铝低，这正是改用铜的原因；改工艺是因为铜刻不动
        - text: 这样可以省掉光刻
          why: 大马士革工艺同样要用光刻定出沟槽的位置，省掉的是对铜本身的刻蚀
        - text: 铜太软，刻蚀时线条会塌
          why: 问题不在机械强度，而在刻蚀化学：铜和刻蚀气体反应的产物不容易变成气体被抽走
      explain: 铜和常用刻蚀气体反应的产物不挥发，干法刻蚀做不出精细的铜线，所以改成先刻介质、再填铜、用化学机械抛光磨平，这就是大马士革工艺。
    - id: b-gate-last
      type: choice
      prompt: 高 k 介质加金属栅的工艺里，为什么先用多晶硅做一条“假栅”，等源漏做完再把它换成金属栅？
      options:
        - text: 金属栅经不起源漏退火的高温
          correct: true
        - text: 多晶硅比金属导电好，先用它测一下电路
          why: 假栅最后会被挖掉，不用于工作；换掉它是因为金属栅怕源漏退火的高温
        - text: 金属不能做光刻，只能填进挖好的槽里
          why: 金属可以被光刻刻成图形；后栅工艺的原因是怕高温，不是光刻
        - text: 先做假栅可以省一张掩模
          why: 后栅工艺反而多了挖假栅、填介质和金属、抛光几步；这样做是为了避开高温
      explain: 源漏注入后要高温退火激活杂质，金属栅和高 k 介质经不起这一步。先用多晶硅假栅占位、完成源漏，再挖掉换成高 k 介质和金属，叫后栅工艺。
