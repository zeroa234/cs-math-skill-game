skill: P.4.5
version: 2
authors: [main-agent]
brief:
  why: |
    写出“自己点过一遍好像能跑”的 Python 函数只是第一天的工作。一旦代码由多人合写、反复重构改写，或者面对极端输入、网络抖动与并发重试，没有可靠自动化测试网守门就会不断修好一处坏掉两处。本包只假设你学过 Python 基础（P.1.1），带你从零建立现代软件测试与质量工程体系：设计高价值的等价类与边界值用例、写出可维护的 pytest 与 Arrange–Act–Assert 单元测试、慎用测试替身防止脆弱耦合、用 Hypothesis 性质测试抓出反例、用真实短路语义分清覆盖率与 MC/DC，并掌握变异测试、受控混沌故障注入及 MTBF/MTTR 可用性算术。
  outcomes:
    - 区分单元测试、集成测试、系统测试与回归测试的分工，合理配比“测试金字塔”防止慢且脆的大测试泛滥
    - 结合等价类划分与边界值分析设计完整用例（如 `classify_triangle` 退化边界 `(1, 2, 3)`），写出清晰的 `pytest` `@pytest.mark.parametrize` 与 AAA 结构测试
    - 面向公开接口状态测试、区分 Stub / Fake / Mock 测试替身，识别过度 Mock 耦合内部细节的风险
    - 运用性质测试生成随机输入并通过反例缩减（Shrinking）定位问题，理解状态/蜕变属性测试
    - 准确计算语句、分支、实际短路求值下的条件覆盖及最小 MC/DC 用例，结合变异得分（篡改错版本杀死率）、故障注入演练与 MTBF/MTTR 可用性指标评估质量
terms:
  - term: 缺陷
    def: 开发人员写进源码逻辑或配置里的具体错误病根（Bug / Fault），在条件触发时可能导致错误状态甚至外部失败。
  - term: 失效
    def: 程序运行后表现出来的可观测异常结果与预期规范不符（Failure），通常由潜伏缺陷被特定输入或环境条件激活引发。
  - term: 回归测试
    def: 每次修改已有功能、重构实现或合入新特性之后，重新跑一遍旧有测试套件以验证原有正确行为没有被意外改坏。
  - term: 单元测试
    def: 针对单个函数、类或极小独立模块在隔离外部重型依赖后进行的高速自动化检验，是测试金字塔最厚实的底层支柱。
  - term: 集成测试
    def: 把多个模块、服务或与真实数据库、接口连接组合在一起，专门核查各组件之间接口契约与数据传递是否对接准确的测试。
  - term: 系统测试
    def: 把整套完整组装起来的软件端到端跑在贴近上线环境里，从外部使用视角全面验证功能链路、延迟与可靠性的大型检验。
  - term: 验收测试
    def: 在上线交付前按业务真实需求与合规指标核验整个软件是否达到交付标准的最终测试阶段（含 Alpha / Beta 及标准一致性核验）。
  - term: 等价类
    def: 把庞大输入域按程序预期处理逻辑切分成若干互不重合的子类，同一等价类内挑任意代表输入预计会走相似合法或拒绝分支。
  - term: 边界值
    def: 位于等价类与等价类交界边缘处的临界输入点（如刚满足不等式、刚好相等退化或上下限相差 1），最易暴露 `<` 与 `<=` 等差一错。
  - term: 参数化测试
    def: 把同一个测试断言模板与多组输入期望表绑定在一起自动循环验证（如 `pytest` 中的 `@pytest.mark.parametrize`），避免重复抄写多套测试函数。
  - term: 测试替身
    def: 测试中用来替换真实昂贵、缓慢或不确定外部依赖（如真实扣款网关、外部邮件系统或系统时钟）的轻量受控替代实现统称（含 Dummy、Stub、Fake、Mock 等）。
  - term: 性质测试
    def: 不手工写死孤立“输入 → 唯一预期输出”，而是陈述任意合法输入都必须满足的不变性质规律并交由框架海量自动生成输入检验的方法。
  - term: 反例
    def: 在性质测试或形式化检验中使给定断言性质不再成立、直接暴露程序漏洞的那个具体违规输入样本。
  - term: 缩减
    def: 性质测试框架抓到一个复杂庞大的随机反例后，自动逐步删除多余元素或缩小数值直至提炼出最小最易读反例（Shrinking）的过程。
  - term: 语句覆盖率
    def: 测试用例跑完后至少执行到过一次的可执行程序语句数占全文件有效可执行语句总数的百分比。
  - term: 分支覆盖率
    def: 程序里每条判定语句的“真（True）”与“假（False）”两条执行岔路实际各自被走到过的比例（又常称判定覆盖）。
  - term: 条件覆盖
    def: 复合布尔判断内部每一个原子布尔子条件各自实际在运行时取过真与假两种结果的覆盖比例（注意须按语言真实短路求值轨迹检验，并不自动保证分支全覆盖）。
  - term: "MC/DC"
    def: 修改条件/判定覆盖：除各原子条件及总判定取过真假外，须各自存在仅翻转该单一原子条件就能独立改变整句判定结果的用例。
  - term: 插桩
    def: 在装载或准备运行的目标代码路径关键位置自动嵌入统计记录探针，用来统计测试运行期每行语句与分支命中覆盖数据的技术。
  - term: 变异体
    def: 由变异测试工具故意对被测程序做一处微小语法改写（例如把 `<=` 改成 `<`）制造出的带人造小病菌程序副本，用来检验现有测试套件的抓虫敏锐度。
  - term: 故障注入
    def: 在可控测试或受护生产环境中人为刻意制造超时、丢包、返回错码或实例宕机等真实故障变量，实战验证系统能否安稳扛住并自动恢复。
  - term: 可用性
    def: 系统在需要使用的时刻处于正常工作、可正常服务状态的时间比例，经典工程估算公式为 `MTBF / (MTBF + MTTR)`。

lessons:
  # ======================================================================== 单元/集成/系统测试
  - id: evidence
    chapter: 单元/集成/系统测试
    title: 为什么写测试：缺陷 vs 失效、Beyoncé 规则与回归护城河
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 工程师修改了一行定价函数里的折扣逻辑，自己在电脑里手工试了一次 `price = 100` 看着输出正常便直接合并提交。两天后客服报告所有免税特价商品金额全变成了负数。如果有人问“写自动化测试不就是在白白多写一倍额外函数浪费工时吗？”，最核心的工程真相是什么？
          options:
            - text: 自动化测试不是额外的浪费，而是让每一次后续修改与重构都能在几秒内重新检验整片行为没有悄悄被改坏的可执行证据网——修一处错不至于破坏另外三处。
              correct: true
            - text: 只要初版代码通过人工代码走查确认无误，后续修改和重构就不需要自动化回归验证
              why: 软件最大的常态是“不断被别人改写”；没有自动化回归防护网，越老的项目越没人敢动手重构
            - text: 写了测试用例就会自动把用户浏览器里的旧版本全部删光
              why: 测试的作用是建立可重复跑的验证证据防回归退化、记录意图并支撑团队放心持续修改上线
          explain: 自动化测试是一张可以随时重跑的证据网：每次修改后几秒钟就能确认原来好的行为没被改坏。这一课分清 **缺陷（Fault）**、**失效（Failure）**，以及 **回归防护网**。
      - card:
          title: 分清“缺陷”与“失效”，以及为什么要写自动化测试
          body: |
            - **缺陷（Fault / Bug）**：工程师不小心写进源码里的逻辑毛病（例如把 `x + y <= z` 错写成 `x + y < z`）；
            - **失效（Failure）**：当特定输入踩中这个毛病时，系统跑出来的错误表现（例如退化三角形 `(1, 2, 3)` 居然错判成了合法不等边）。
            手动点两下不仅慢、不可重复还容易遗忘边界；**自动化测试** 在几秒内验证所有重要契约，加速定位缺陷、让代码评审更轻松、并成为安全改代码的底气。
      - card:
          title: Beyoncé 规则与回归测试
          body: |
            Google 工程团队流传一条极有名的 **Beyoncé 规则**：**“如果某个行为对你真的重要（If you liked it），你就得给它写进自动化测试里（put a test on it）。”**

            一旦没写进自动化测试，几个月后同事整理架构顺手改掉那段看似无人依靠的逻辑时完全无从察觉——只有跑在主线里的 **回归测试（Regression Testing）** 才能把所有曾经修过或看重的正确契约永久守住。
      - item:
          id: q-fault-vs-failure
          type: choice
          prompt: 某三角形分类函数里面写错了一行条件判断 `if x + y < z`（本来应是 `<=`）。上线跑了一整周全部输入都是普通 `(3,4,5)` 一切太平，直到第 8 天一位用户传进 `(1, 2, 3)` 时系统返回了错误的 `"不等边"` 而非 `"非法"`。哪部分是 **缺陷（Fault）**，哪部分是 **失效（Failure）**？
          options:
            - text: 函数内部写漏等号的那句条件 `x + y < z` 是潜伏的缺陷（Fault）；第 8 天面对 `(1, 2, 3)` 时对外吐出错误结论 `"不等边"` 这一运行报错现象是失效（Failure）
              correct: true
            - text: 第 8 天用户输入的 `(1, 2, 3)` 本身是程序缺陷，写漏等号是正常现象
              why: 合法测试输入或边界数据恰好帮助揭露潜伏在程序里的静态缺陷并表现出可观测失效
            - text: 只要这周恰好没人传 `(1, 2, 3)` 进来，就证明函数里那句写错的条件没有任何缺陷
              why: 没有触发激活并不等于不存在静态逻辑缺陷；这恰恰解释了为什么必须用边界用例主动覆盖，否则隐藏缺陷早晚在生产爆雷
          explain: 静态躺在文本里的写错逻辑叫 **缺陷**，运行时触发后显露出的不对劲对外行为叫 **失效**——好的测试集就是要赶在上线前尽可能先激活并抓出潜伏缺陷。
      - card:
          title: 例题：为什么每次修复一个真实线上 BUG，第一件事不是光改那行代码，还要补一条“回归测试”？
          body: |
            如果团队花了一整天抓出并修好了一个“空列表传进去就会崩溃”的线上 BUG，改完一行 `if not xs:` 就草草上线、没多写一行测试。半年后极易发生什么重演事故？
          reveal:
            - title: 第 1 步：今天看似记住的教训，半年后新接手同事根本无从得知
              body: 半年后另一位新入职同事为了加速或简化函数删掉了那句看起来“多余”的 `if not xs:` 边界检查；如果这套测试里从来没有那条空列表用例，CI 全套测试居然照常 100% 绿灯放行上线，同样的惨痛线上故障原地复发第二次。
            - title: 第 2 步：在修 BUG 前先写一条稳定复现“红灯”的测试，改完变绿灯并永久留队
              body: 专业习惯被称为“红 → 绿闭环”：修错前先在测试集补充一条会当场失败报错的回归用例精准钉住这个缺陷，然后修改实现直到全套绿灯；从此以后只要有人不小心改坏同一条边界，这条回归测试几毫秒内就会报错拦截。
            - title: 第 3 步：同时践行 Beyoncé 规则界定公共接口保证
              body: 反过来从平台维护者视角看：只要外部调用者依赖的功能没有写进公开测试契约，系统维护者重构或改写内部未承诺行为时便无法逐一顾及——重要契约必留自动化回归测试证明。
      - item:
          id: q-beyonce-rule
          type: choice
          prompt: Google *Software Engineering at Google*提出的 **“Beyoncé Rule（碧昂丝法则）”** 对工程团队协作有什么明确含义？
          options:
            - text: 只要某项对外行为是你真的在乎、绝不希望别人日后误改破坏的，就必须亲自为它写好自动化测试放进共享测试网里守门
              correct: true
            - text: 禁止任何团队成员对已有函数做哪怕一个字母的重构优化
              why: 测试存在恰恰是为了让团队可以放心大胆地频繁重构与演进架构，同时自动保证“重要契约一条不坏”
            - text: 每周只需要在代码里放一首流行歌歌词当注释就可以替代单元测试
              why: 法则名字源自经典歌词隐喻“If you liked it then you shoulda put a test on it”
          explain: 没有进自动化回归网的“口头约定重要逻辑”，早晚都会在后续改动里悄悄被改丢。
      - item:
          id: q-regression-meaning
          type: match
          prompt: 把测试基础概览里的四项核心概念与它们在工程中的对应场景配对。
          pairs:
            - ["**缺陷（Fault）**", 静态写错的程序条件逻辑（例如把边界 `x + y <= z` 漏写成了 `<`）]
            - ["**失效（Failure）**", 特定输入踩中缺陷后，运行程序呈现出的与规范相悖的实际输出或崩溃]
            - ["**回归测试（Regression Testing）**", 每次改动实现、修复缺陷或重构之后重跑既有测试集，确认原本好的特性没被意外破坏]
            - ["**Beyoncé 规则**", 凡是团队真正看重需要长期守护不被后续升级改坏的行为，都应当写成自动化测试]
          explain: 缺陷是写错的代码，失效是踩中缺陷后的错误表现；每次改动后重跑旧测试叫回归测试；团队看重的行为都该写成自动化测试（Beyoncé 规则）。
      - item:
          id: q-fault-vs-failure-distinction
          type: choice
          prompt: 当某段排序代码漏掉了“处理空列表 `[]`”分支，而刚好在线上一位新用户提交了空购物车时网页才崩溃报错，按测试术语哪项区分最准确？
          options:
            - text: 源码中遗漏的分支逻辑本身是潜伏的 缺陷（Fault）；线上踩中空购物车后表现出来的崩溃报错则是可观测 失效（Failure）
              correct: true
            - text: 只有用户亲眼看见报错那 1 秒代码才算有缺陷，没触发前源码完美无缺
              why: 缺陷在程序员写错逻辑那一刻就已经静静潜伏在源码里，只是遇到触发输入才演变成外部失效
            - text: 缺陷和失效是两份完全不相关的软件文件
              why: 失效往往正是由潜伏在代码中的某个缺陷被特定触发条件激活引发的外部表现
          explain: 记死这对起点概念：修代码修的是 **缺陷**，用户投诉的是 **失效**，**自动化回归测试**帮你在上线前尽早把两者一锅端。

  - id: levels
    chapter: 单元/集成/系统测试
    title: 测试层次（单测/集成/系统/验收）、测试规模与测试金字塔
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 某团队听人说“既然真实浏览器从头点到尾的端到端测试最贴近真实用户，干脆别写零散的单体小测试了，把全部 `2,000` 个场景全写成启动浏览器加真实数据库跑全流程的巨大端到端测试。”半年后每次提一行修改，CI 跑完整个测试得等 3 小时、而且每隔两次就有网络抖动引起莫名其妙飘红重跑。为什么不能只写大型测试？
          options:
            - text: 大型端到端测试运行慢、搭建环境重、极易因无关定时/网络波动出现偶发“脆弱（Flaky）”误报，且报错时很难一眼定位究竟坏在哪一行。应当构成底大顶尖的测试金字塔。
              correct: true
            - text: 因为大型端到端测试根本测不到网页按钮能不能被点击
              why: 端到端系统测试恰恰最贴近真实用户体验，问题在于“只靠它承接几千条各种细微输入组合校验”会让整个研发效率崩溃
            - text: 因为测试金字塔要求 99% 的测试全部必须是人工拿着秒表手工点鼠标
              why: 测试金字塔描述的是自动化测试里“快而孤立的单元测试占比最大，中等集成测试适中，慢而全的端到端系统测试精简守主链路”的合理分布
          explain: 端到端测试慢、搭环境重、容易偶发误报，出错时也难定位，所以数量要少，底层多放快而稳的小测试。这一课讲 **测试的大小与范围**，以及 **测试金字塔怎么分配**。
      - card:
          title: 划分测试的两个正交维度：范围 Scope vs 规模 Size
          body: |
            Google 把测试按两个实用角度拆开看，SWEBOK 则给出阶段 **层次**：
            - **规模（Size，看耗时与资源隔离度）**：**小型测试**（只在一个运行单元内飞快跑完，禁连真实网络/磁盘，几毫秒过）、**中型测试**（允许连本机单机假服务/真实本地库，几百毫秒）、**大型测试**（跨多机器集群或真浏览器完整跑，耗时数秒到数分）；
            - **层次（Scope，测多宽模块边界）**：**单元测试**（测单一函数/类）→ **集成测试**（多模块/数据库接口联调）→ **系统测试**（端到端全系统）→ **验收测试**（交付业务口径核对）。
      - card:
          title: 测试金字塔（Test Pyramid）：底层与中层分工
          body: |
            把 **测试金字塔** 比例记成一座稳固三角形，先把下面两层夯实：
            - **底层（最多，比如 70%–80%）——单元测试**：速度极快、零外部网络干扰、错一行精准定位函数，用来穷尽等价类、边界值与算法分支；
            - **中层（适量，比如 15%–20%）——集成测试**：用真实 SQLite/数据库或模块对接，专门捉 SQL 拼错、外键配置或接口协议对接错。
      - item:
          id: q-pyramid-anti-ice-cream
          type: choice
          prompt: 如果一个项目把 85% 的测试用例全部写成启动真实浏览器点页面验证全链路的大型测试，单元测试却寥寥无几，这种反模式在工程上通常叫什么、会引发什么后果？
          options:
            - text: 叫 倒金字塔 / 冰淇淋甜筒反模式；测试跑得极慢、网络与渲染闪红频繁且报错难以定位根因
              correct: true
            - text: 叫极速单元测试典范，10,000 条浏览器用例只需 1 毫秒就能跑完
              why: 启动真浏览器和真集群端到端测试最慢最重，数量过多会彻底拖垮 CI 反馈速度
            - text: 会彻底消除所有后端 SQL 拼写错误
              why: 端到端测试不仅慢而且无法像底层单元测试那样高性价比地穷举边界组合与异常分支
          explain: 绝不倒置金字塔——大量逻辑边界沉到底层单测，顶层只保留少数精悍的关键端到端链路。
      - card:
          title: 测试金字塔顶层：精简端到端/系统测试
          body: |
            - **顶层（精简关键链路，比如 5%–10%）——端到端/系统测试**：少而精地验证几条核心用户主旅程（如登录 → 下单 → 支付渲染成功），绝不用它去测几百种边界输入组合。
      - item:
          id: q-test-pyramid-ex4
          type: choice
          prompt: 在一个稳健的现代软件 **测试金字塔（Test Pyramid）** 中，单元测试、集成测试和端到端测试应该怎样合理分配？
          options:
            - text: 大量快速稳定的单元测试做厚底座覆盖细粒度逻辑与边界；适量的集成测试验证真实数据库/服务对接接口；少量精选的端到端（系统）测试验证核心关键业务链路（因为慢、脆弱且维护成本高）
              correct: true
            - text: 倒金字塔分配：90% 全写成启动真浏览器跑全链路的大型端到端测试，只留 1% 单元测试
              why: 倒金字塔（“冰淇淋甜筒反模式”）会导致 CI 动辄卡住几小时、频现无关网络闪烁假红灯，最后开发人员干脆不再跑测试
            - text: 只要写了大量的单元测试，就绝对不需要任何集成测试和端到端测试验证系统配合
              why: 单元隔离测试即便全绿，真到数据库约束没开、网络序列化字段名拼错或者页面脚本连不通时依然会挂，各层必须按比例协同补位。
          explain: 金字塔绝不是说中层顶层不重要，而是把“**海量细微组合验证**”沉到几毫秒搞定的单测，把“**跨边界真实对接与端到端串通**”留给少而精准的集成/系统测试。
      - card:
          title: 例题：给在线电商“下单扣款”拆出金字塔三层各自应该放哪些测试用例？
          body: |
            如果正在测试电商平台核心“优惠券折后下单”，怎么把三组完全不同特征的检验精准放进金字塔不同层级，互不重样又不漏？
          reveal:
            - title: 第 1 步：底层单元测试（毫秒级穷尽算术边界）
              body: 放 `20` 个高速 `pytest` 单元测试验证纯价格折扣函数：满 100 减 20、刚好 99.9 不减、负数报错、多券叠加不准扣成负数、四舍五入精度——每条 0.5 毫秒，绝不连数据库或网络。
            - title: 第 2 步：中层集成测试（验证真实数据库事务、外键约束与序列化协议）
              body: 放 `4` 条中等集成测试：连真实 PostgreSQL/SQLite 检验“下单扣库存遇到余额不足触发 `IntegrityError` 整笔事务安全回滚”“JSON 请求字段传给后端控制器正确存进数据库并回显”——专门捕获单测模拟不出来的 SQL 和结构衔接坑。
            - title: 第 3 步：顶层端到端系统测试（只放少数核心旅程兜底）
              body: 只保留 `1–2` 条在真实打包网页上从登录 → 加购 → 输入优惠券 → 点结算提交 → 确认页面亮出订单号的端到端大测试，验证前端样式脚本、网关与数据库全链真的严丝合缝跑通。
      - item:
          id: q-size-vs-scope-match
          type: match
          prompt: 把测试分层（Scope）与工程权衡中的四种定位对应匹配。
          pairs:
            - [隔离外部依赖、在几毫秒内验证单个纯函数与分支逻辑, "**单元测试 / 小型测试**"]
            - [连入真实本地数据库或组合多个真实模块，验证接口对接契约, "**集成测试 / 中型测试**"]
            - [从真实用户终端或完整部署环境走通核心全流程与性能抗压, "**系统测试 / 大型端到端测试**"]
            - [面向最终交付标准和外部客户期望，核对产品是否达标可验收发布, "**验收测试（含 Alpha / Beta 及合规核验）**"]
          explain: 记清：**规模（Size）决定它能多快有多隔离；范围（Scope）决定它能覆盖多宽协同边界**——大测试慢但真实，小测试快而定位准。
      - item:
          id: q-google-size-constraints
          type: choice
          prompt: 按照 Google 对 **小型测试（Small Tests）** 的严格工程规范，下面哪一项行为**不应该**出现在一个正统小型单元测试里面？
          options:
            - text: 直接去向互联网上的真实第三方支付公司发真实 HTTP 网络请求或阻塞休眠 `time.sleep(5)`
              correct: true
            - text: 在纯本地调用中传入已知边界元组并调用 `assert classify_triangle(1, 2, 3) == "非法"`
              why: 纯输入输出断言毫秒完成且 100% 可重复，正是小型单元测试的标准模范。
            - text: 使用可编程的本地纯本地假对象替代外部慢接口以验证边界异常分支
              why: 用极轻量的纯本地受控替代品切断真实网络与不确定耗时，正是让成千上万条单元测试能在几秒跑完的秘密
          explain: 给小型单元测试定死红线：**不碰公网、不靠真实长睡眠等待、不依赖于机器当前随机时钟**——这样跑十万次照样稳如泰山。

  - id: test-classes
    chapter: 单元/集成/系统测试
    title: 黑盒等价类划分、直觉经验测试与测试用例设计
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 测试 `classify_triangle(a, b, c)`（输入三个数字判断等边、等腰、不等边还是非法）。光是 32 位正整数就有几十亿种组合，一辈子也测不完。如果测试工程师随意抓起键盘瞎凑了 `(3,3,3)`、`(4,4,4)`、`(5,5,5)`、`(6,6,6)` 足足测了一百个全是等边三角形的用例——这样的 `100` 个用例比精心挑出的 `8` 个用例好在哪里还是差在哪里？
          options:
            - text: 瞎测 100 个一模一样都是“等边三角形”的用例几乎没有任何新信息量，因为全落在同一个等价类里。正确做法是先把庞大输入空间拆成互不重叠的几类（等价类划分），每一类各挑 1–2 个代表，少数高效用例远胜百条重复。
              correct: true
            - text: 测一百个 `(3,3,3)..(102,102,102)` 比挑 8 个代表用例更稳，完全不用再去测负边长或不等边
              why: 同一条全等分支执行一百遍都不会主动帮你检查非法输入或 `a == b` 等腰分支，覆盖广度才是测试用例设计的第一命题。
            - text: 因为 Python 代码不允许在一个测试函数里传入超过 2 个数字
              why: 问题不是工具支持与否，而是**怎么用最小的测试用例集撬动最大的输入空间缺陷发现率**
          explain: 100 个等边三角形都落在同一个等价类里，几乎不带新信息。先把输入空间拆成互不重叠的几类，每类挑代表，这就是黑盒用例设计的核心方法 **等价类划分（Equivalence Partitioning）**，下面用 `classify_triangle` 实战。
      - card:
          title: 什么是等价类划分（Equivalence Partitioning）
          body: |
            依据需求规格把无穷无尽的输入分成有限个 **等价类（Equivalence Classes）**——在同一类里挑 `A` 能通过还是崩溃，挑同类的 `B` 大概率行为完全一致：
            - **有效等价类**（按规范合法，必须测全每条结果）：对 `classify_triangle(a, b, c)` 而言，有 **等边**、**等腰（注意 `a=b`、`a=c`、`b=c` 三个对称位置都要顾及）** 与 **不等边**；
            - **无效等价类**（必须安全拒判 `"非法"`）：有边长 `<= 0`（零或负数），以及虽全正却违背三边相加大于第三边规则 `短边 + 次短边 <= 最长边`。
      - card:
          title: 直觉猜测 vs 规范方法结合
          body: |
            经验与直觉测试（Error Guessing / Exploratory）虽擅长联想历史上常见手误（如忘记把三边按小到大重排导致只查 `a + b <= c` 而漏掉 `a + c <= b`），但**不能替代系统的等价类 + 边界分析**。

            以 `classify_triangle` 为例：有效类挑 `(3,3,3)`（等边）、`(3,3,4)` / `(3,4,3)` / `(4,3,3)`（三向等腰）、`(3,4,5)` 或 `(2,3,4)`（不等边）；无效类挑 `(0,4,5)`、`(-1,4,5)`、`(1,2,5)` 或 `(2,3,6)`。
      - item:
          id: q-triangle-equiv-classes
          type: choice
          multi: true
          prompt: 设计 `classify_triangle(a, b, c)` 的**等价类划分**用例时，下面哪些用例精准覆盖了不可互相替代的独立等价类？（多选）
          options:
            - text: "`(3, 3, 3)` → 等边三角形有效等价类"
              correct: true
            - text: "`(3, 3, 4)`、`(3, 4, 3)`、`(4, 3, 3)` → 分别测齐“任意两边相等且满足三边相加大于第三边规则”等腰三个不同参数位"
              correct: true
            - text: "`(2, 3, 4)` → 不等边合法三角形有效等价类"
              correct: true
            - text: "`(0, 4, 5)` 或 `(-1, 4, 5)` 以及 `(2, 3, 6)` → 非正边长与违反三边相加大于第三边规则两大独立无效等价类"
              correct: true
            - text: 多加十个 `(7, 7, 7)`、`(8, 8, 8)`、`(9, 9, 9)` 才算测了新类
              why: 同一条全等分支下的 `(7,7,7)` 到 `(9,9,9)` 全跟 `(3,3,3)` 同属同一个有效等价类，增加重复测不出任何新路径
          explain: 特别注意等腰三角形。初学者自己手写 `if a == b or b == c:` 时极容易漏掉 **`a == c`（第一条与第三条边相等）**，因此用 `(3, 3, 4)`、`(3, 4, 3)`、`(4, 3, 3)` 把三个位置测全无比重要。
      - card:
          title: 例题：为什么把 `classify_triangle` 的无效类只写 `(0, 0, 0)` 远远不够，还要测 `(1, 2, 5)`？
          body: |
            假设某程序员写 `classify_triangle(a, b, c)` 时漏掉了 `x + y <= z` 检查，只写了 `if a <= 0 or b <= 0 or c <= 0: return "非法"`。如何让等价类划分当场抓住它？
          reveal:
            - title: 第 1 步：把“非正边长”与“违反两边之和大于第三边”当成两条完全独立的无效等价类
              body: 千万别把所有“非法”混为一谈只测一个 `(-1, 2, 3)`。输入 `(-1, 2, 3)` 只校验了“正数门卫”分支；而输入全正却凑不成封闭三角形的 `(1, 2, 5)` 或 `(2, 3, 6)`（`2 + 3 = 5 < 6`）才能直接激活三边相加大于第三边规则检验分支，立刻抓出漏检。
            - title: 第 2 步：若只按输入顺序没先排序只查 `if a + b <= c:`，调换 `(6, 2, 3)` 就会放行漏网
              body: 很多代码忘了先 `sorted((a, b, c))`，傻傻只检查 `a + b <= c`。于是测 `(2, 3, 6)` 刚好能判 `"非法"`，可把最大边放到前面传 `(6, 2, 3)` 算 `6 + 2 = 8 > 3` 就彻底被骗过了。所以每条无效类也要靠对称排列或边界多覆盖验证。
            - title: 第 3 步：同时测 `(2, 2, 5)`（有两条正相等边却凑不成三角的假等腰）
              body: "更经典的大坑是“先判 `if a == b: return '等腰'`、后判 `a + b <= c`”——传入 `(2, 2, 5)` 虽然有两个 2 相等，但 `2 + 2 < 5` 根本连不成封闭三角形。独立无效类用例一眼揪出这种条件先后颠倒缺陷。"
      - item:
          id: q-fake-isosceles-trap
          type: choice
          prompt: "一名同学写的 `classify_triangle(a, b, c)` 把 `if a == b or b == c or a == c: return \"等腰\"` 写在了三边相加大于第三边规则校验 `if x + y <= z: return \"非法\"` 的**前面**。以下哪个测试用例能立刻一针见血当场抓出这个 BUG？"
          options:
            - text: "`(2, 2, 5)`（有两条边数值恰好相等，但 `2 + 2 = 4 < 5` 根本构成不了合法三角形，本该返回 `\"非法\"` 却被误判成 `\"等腰\"`）"
              correct: true
            - text: "`(2, 2, 3)`（合法等腰三角形）"
              why: 合法 `(2, 2, 3)` 本来就应该返回 `"等腰"`，完全测不出“非三角形却有等边”的顺序错误。
            - text: "`(3, 3, 3)`（等边三角形）"
              why: "`(3, 3, 3)` 也是合法三角形（不过如果先判 `等腰` 后判 `等边` 同理也会把等边误判为等腰，因此既要先防非法、又要先判三边全等 `等边` 再判两两相等 `等腰`）"
          explain: 等价类不只是平铺枚举——**两个特性交界处的“先非法校验 → 再特例等边 → 再等腰 → 后不等边”先后顺序都要有专门用例戳破。**
      - item:
          id: q-testing-techniques-match
          type: match
          prompt: 把四种测试用例设计思想与各自主要做法配对。
          pairs:
            - ["**等价类划分（Equivalence Partitioning）**", "把庞大输入域拆分成合法/非法若干等价小组，每组精挑少量代表覆盖全貌"]
            - ["**排列对称检查**", "针对等腰或三边相加大于第三边规则检查是否忘了排序，分别测试最大边/不等边居左、居中、居右位置"]
            - ["**经验错误猜测（Error Guessing）**", "依据工程师直觉专门构造历史常见踩坑样本（如 `0`、空、全等但非三角 `(2, 2, 5)`）"]
            - ["盲目在同一有效类堆几十条相似值（如 `(3,3,3)..(99,99,99)`）", "极低信息增益的反模式：跑了一堆相似数字却漏光其他分支与非法边界"]
          explain: 等价类每组挑少量代表；对称排列要把最长边放在不同位置各测一次；错误猜测专挑历史上常见的坑；在同一类里堆一堆相似值只是浪费。
      - item:
          id: q-error-guessing-role
          type: choice
          prompt: 经验错误猜测（Error Guessing）与等价类划分之间应当是什么配合关系？
          options:
            - text: 错误猜测擅长敏锐补漏常见手误（如 `0`、空字符串或未排序入参 `(6, 2, 3)`），但它应当作为等价类划分的补充，绝不能取代系统划分
              correct: true
            - text: 只要靠资深同事凭直觉瞎猜 3 个数，就再也不用分有效和无效等价类了
              why: 仅凭直觉容易顺手测全合法情况而漏掉某些对称位置或冷门无效类分支
            - text: 错误猜测只允许测试数字 `100`
              why: 错误猜测关注的是历史高频缺陷模式（边界空值、错序、假等腰等），没有任何数字限制
          explain: 系统划分打底防遗漏 + 经验直觉补刀专打老坑，两者齐上最稳妥。

  - id: boundaries
    chapter: 单元/集成/系统测试
    title: 边界值分析、状态/模型测试与退化三角形检验
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: "程序员把三边相加大于第三边规则判断错写成了 `if x + y < z: return \"非法\"`（少打了一个等号 `=`，正常应当是 `<=`）。你前面已经测了合法 `(3, 4, 5)` 和明显非法 `(1, 2, 5)` —— 居然**全都通过没报任何错**。哪个刚好卡在刀刃上的输入能一秒毙命抓出这少写半个字符的等号 BUG？"
          options:
            - text: "`(1, 2, 3)` 或 `(2, 3, 5)` —— 两短边之和 恰好严格等于 第三边（退化压扁成一条直线段的边界），`x + y < z` 误放行判成 `\"不等边\"` 而真正规范要求判为 `\"非法\"`。"
              correct: true
            - text: "`(10, 11, 12)` —— 远离边界的普通大钝角三角形"
              why: 在离临界边界很远的等价类内部，`<` 和 `<=` 的表现完完全全一模一样，根本摸不到那相差 1 个等号的 BUG。
            - text: "`(-5, 3, 4)` —— 明显的负边长"
              why: 负数早就先被 `a <= 0` 的入口条件拦住，根本还没走到 `x + y < z` 那行判断。
          explain: "**BUG 最爱藏在角落里——紧贴在等价类边界交界点两侧（刚好退化等于、刚好大于 1）**，这就是 **边界值分析（Boundary Value Analysis）**。"
      - card:
          title: 边界值分析（BVA）三点法：上点、离点与内点
          body: |
            每逢数字范围限制（例如成绩 `0 <= g <= 100`、三边相加大于第三边规则 `x + y > z`），不要只测正中间 `50`——专门盯紧交界处**左右相邻三点**：
            - **刚好压在交界线的临界值**：如 `(1, 2, 3)`（`1 + 2 == 3` 退化边界，应为 `"非法"`）以及 `(2, 3, 5)`；
            - **刚刚跨进有效区 1 单位的紧邻合法点**：如 `(2, 2, 3)`（`2 + 2 = 4 > 3`，刚好能围成合法等腰）与 `(5, 5, 6)`；
            - **以及输入零 `0` 与 `1`**：`credits = 0`（非法）vs `credits = 1`（合法最小正整数）。
      - card:
          title: 基于模型的测试（Model-Based Testing）：从状态机与规则表自动派生用例
          body: |
            当系统存在复杂多步流程和前置状态规则（比如“未支付订单只能取消或付款 → 付款后才允许发货 → 已发货不准再取消”）时，用 **基于模型的测试**：
            1. 先把需求整理成**有限状态机或决策规则表**；
            2. 系统地沿每条状态转移边、每条禁用非法转移（如“已发货硬点取消。”）生成用例。这不仅比拍脑袋查得更全，还能紧盯住关键状态跳转边界。
      - item:
          id: q-bva-triangle-123
          type: choice
          prompt: 按“两边之和必须大于第三边”的规则，输入 `(1, 2, 3)`、`(2, 3, 5)` 与 `(2, 2, 3)` 传入 `classify_triangle(a, b, c)` 时，按照 **边界值分析** 分别应当返回什么分类？
          options:
            - text: "`(1, 2, 3)` 与 `(2, 3, 5)` 两短边之和恰好等于第三边（面积为零的退化边界），均须返回 `\"非法\"`；而 `(2, 2, 3)` 满足 `2 + 2 > 3` 是刚好跨入合法区的等腰边界，返回 `\"等腰\"`"
              correct: true
            - text: "`(1, 2, 3)` 应该算作合法的“等腰”或“不等边”三角形"
              why: 如果三条线段长度分别为 `1`、`2`、`3`，把 `1` 和 `2` 拼在一起才刚刚拉直够到 `3` 的两头，根本撑不起任何三角形面积，必须严格判为 `"非法"`。
            - text: "`(2, 2, 3)` 因为数值太接近边界所以也必须报错判为 `\"非法\"`"
              why: "`2 + 2 = 4 > 3`，三条边完全能真实围成顶角明确的等腰三角形，必须正确判为 `\"等腰\"`"
          explain: 记死 **“退化临界 `(1, 2, 3) → 非法` vs 紧邻跨入合法 `(2, 2, 3) → 等腰`”**：一对相邻 1 步的边界用例能同时检验 `<=` 等号没写漏且没有过严错写成 `< z - 1`。
      - card:
          title: 例题：为 `classify_triangle` 凑齐至少 8 个等价类和边界用例
          body: |
            用**等价类划分 + 边界值分析**设计出**至少 8 个**测试用例，标出每一例代表哪一类，再实际跑一遍核对：
          reveal:
            - title: 第 1 步：有效等价类（等边、三向等腰、不等边共 5 例）
              body: ① `(3, 3, 3) → "等边"`；② `(2, 2, 3) → "等腰"`（也是刚过边界的等腰下界）；③ `(3, 4, 3) → "等腰"`（验证 `a == c`）；④ `(4, 3, 3) → "等腰"`（验证 `b == c`）；⑤ `(2, 3, 4) → "不等边"`（另有验证 `(5, 5, 6) → "等腰"`）。
            - title: 第 2 步：无效等价类 + 退化临界边界（正边零负值、三角破坏与等号临界共 4 例）
              body: ⑥ `(0, 3, 4) → "非法"`（边界刚好等于 `0`）；⑦ `(-1, 3, 4) → "非法"`（负数无效类）；⑧ `(2, 3, 6) → "非法"`（明显违反 `x + y > z`）；⑨ **`(1, 2, 3) → "非法"`** 与 `(2, 3, 5) → "非法"`（刚好 `x + y == z` 临界退化边界）。整整 9 条一网打尽。
            - title: 第 3 步：拿“错误版本 `< z`”测试一遍——正是 `(1, 2, 3)` 当场杀掉篡改错版本
              body: 如果把代码改成漏等号的错版本 `if x + y < z`，前 4 个常见用例 `(2,2,3)`、`(3,3,3)`、`(2,3,4)` 全都能糊弄过去，唯独 **`(1, 2, 3)` 这一条临界边界立刻失败暴露**。
      - item:
          id: q-bva-range-credits
          type: choice
          multi: true
          prompt: 假设某课程表单规定学分 `credits` 必须为 `1` 到 `6` 之间的整数（含 1 和 6）。采用 **边界值分析（BVA）**，哪几个测试值正是最能揪出 `>` / `>=` 或 `<` / `<=` 写错的高价值边界测试输入？（多选）
          options:
            - text: "`0` 与 `1`（下边界的刚好非法与刚好合法紧邻点）"
              correct: true
            - text: "`6` 与 `7`（上边界的刚好合法与刚好超限紧邻点）"
              correct: true
            - text: 连着选 `3`、`3`、`4` 三个都在正中间的值
              why: "`3` 与 `4` 全处于有效区间正腹地，无论程序员错写 `< 6` 还是 `<= 6` 都完全探测不出来。"
            - text: 连测十遍 `100`、`101`、`102`
              why: 这些远离上边界 `6` 的数字全都只落在同一个无效等价类里，无法帮你在 `6` 和 `7` 之间找出差一边界错误
          explain: 对封闭范围 `[min, max]` 的边界点套模板记住四剑客：**`min - 1`（刚踩出界）、`min`（刚入界）、`max`（顶格入界）、`max + 1`（刚踩超界）**。
      - item:
          id: q-model-based-state-test
          type: choice
          prompt: 按 **基于模型的测试（Model-Based Testing）** 对某订单状态流转（`待支付 → 已支付 → 已发货 → 已完成`，且已发货禁止直接点“取消退单”）设计用例时，除走通正常主路径外，还最应该覆盖哪类检验？
          options:
            - text: 在每个状态上专门检查原本不允许触发的非法状态转换（例如对处于 `已发货` 的订单尝试发起取消请求必须明确拒绝并维持状态不被破坏）
              correct: true
            - text: 只跑通唯一 1 遍正常买单流程就假装所有状态回退和重复付款全不会出问题
              why: 状态机缺陷恰恰最常出现在“用户连续连点两次支付”“发货后抢点取消”“过期未付后硬点发货”这些非法状态交叉边上。
            - text: 把订单状态全部删掉只留 1 个状态
              why: 状态模型正是用来清晰刻画和系统穷尽每一对“（当前状态，触发事件）→ 预期下一状态或明确拒收”的规范矩阵
          explain: 用手里的状态图列一张 `(状态 × 操作)` 表逐格打钩，任何奇怪并发乱点操作漏洞都跑不掉。
      - item:
          id: q-degenerate-boundary-5-plus
          type: choice
          prompt: 对于正整数边长 `(2, 3, 5)`，按 `classify_triangle(2, 3, 5)` 的正确规则应当返回什么？与 `(2, 3, 4)` 相比测出了什么不同？
          options:
            - text: 返回 `"非法"`（因 `2 + 3 == 5` 无法围成面积大于零的三角形），专门卡住 `x + y < z` 错漏等号 BUG；而 `(2, 3, 4)` 满足 `2 + 3 > 4` 返回 `"不等边"`
              correct: true
            - text: 两者都合法且全部返回 `"不等边"`
              why: 三条线段 `2`、`3`、`5` 首尾相接只能躺平成一条长度为 `5` 的直线段，面积为零，并非合法三角形
            - text: "`(2, 3, 5)` 应当返回 `\"等腰\"`"
              why: 三条边长各不相等，且 `2 + 3 == 5` 根本凑不成三角形
          explain: 把相邻一对 `(2, 3, 4)` 和 `(2, 3, 5)` 贴着写进参数表，差一符号瞬间原形毕露。

  - id: unit-python
    chapter: 单元/集成/系统测试
    title: 用 pytest 编写单元与表驱动用例写法、Arrange–Act–Assert 结构
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 把上两课设计出来的 `9` 个三角形测试用例用 Python `pytest` 写进测试文件里。如果一位新手硬写 `test_triangle_1()` 到 `test_triangle_9()` 复制粘贴一模一样的调用代码整整九遍，每次改一下函数名就得改九个地方。在 `pytest` 里有什么优雅写法能把一份断言模板复用到全表全部用例、还能把每个失败案例独立报告清楚？
          options:
            - text: 使用 `@pytest.mark.parametrize("a,b,c,expected", [...])` 把测试逻辑与多行输入期望数据表拆开（表驱动用例写法），同时每个测试内部遵循 Arrange–Act–Assert（准备-执行-断言） 清晰三段式。
              correct: true
            - text: 干脆在一个普通函数里写 `for` 循环，第 1 条断言挂了就直接停掉导致后面 8 条结果完全看不见
              why: 用普通 `for` 循环做全量 `assert` 一旦第 2 条失败整个测试函数当场中止，根本不知道后面第 3..9 条到底过没过；而表驱动用例写法会把每组生成独立子测试用例分别报告通过或失败。
            - text: 在一个测试里完全不写任何 `assert` 断言，只在屏幕上 `print` 让人肉眼慢慢瞅
              why: 没有自动 `assert` 断言的脚本根本算不上自动化测试，CI 无法替你裁判成败。
          explain: 参数化把测试逻辑和输入数据表分开，加一组数据只要加一行；每个测试按“准备、执行、断言”三段写，读起来一目了然。这一课学 Python 测试的基本功：**`pytest` + 参数化数据驱动 + AAA 三段结构 + 测试即文档**。
      - card:
          title: 清晰单元测试的骨架：Arrange–Act–Assert（AAA）三段式
          body: |
            看清一条好写又好读的单元测试固定三步节拍：
            1. **Arrange（准备）**：构造这次检验所需的输入参数、初始对象或最小受控替身数据；
            2. **Act（执行）**：精准调用我们要测试的那个函数或公开方法（通常就这 1 步核心调用）；
            3. **Assert（断言）**：用 `assert result == expected`（或检查期望抛出特定异常 `pytest.raises(ValueError)`）给出非此即彼的清晰验收判定。

            好的单元测试**完全而简洁**：不要在测试里再套复杂的 `if/else` 计算预期值——直接把已知显式期望常量摆出来，让人一眼看懂契约（测试本身就是最好最新的活文档）。
      - card:
          title: 表驱动用例写法实战：`@pytest.mark.parametrize`
          body: |
            使用 **参数化测试**把 4 条乃至 9 条用例写成清晰可读的一张表：
            ```python
            import pytest
            @pytest.mark.parametrize("a,b,c,expected", [
                (3, 3, 3, "等边"),
                (3, 4, 3, "等腰"),
                (3, 4, 5, "不等边"),
                (1, 2, 3, "非法"),
            ])
            def test_classify(a, b, c, expected):
                # Arrange: (a, b, c, expected) 由参数化表提供
                result = classify_triangle(a, b, c)  # Act
                assert result == expected            # Assert
            ```
            即使 `(1, 2, 3)` 失败报错，前面 3 个通过状态仍清晰可查、报错行直接精准点明哪一组参数失败。
      - item:
          id: q-aaa-order
          type: order
          prompt: 请把现代单元测试（如 `pytest` 函数）普遍遵循的 **Arrange–Act–Assert (AAA)** 结构三步按标准顺序排列。
          steps:
            - Arrange（准备测试输入数据、构造前置测试对象或受控替身状态）
            - Act（调用待测函数、方法或触发这一个特定动作拿到返回结果）
            - Assert（对实际输出或副作用做出明确布尔断言检验是否严格符合预期）
          explain: 当测试变乱变长时，按 AAA 留出清晰空行划分三块结构（甚至保证每条单测只重点检验一个清晰行为），一眼就能看出“到底测了啥、怎么算过”。
      - card:
          title: 例题：为什么单元测试里绝对不要写复杂的 `if` / 循环去“动态推算期望答案”？
          body: |
            某新手测试自己写的计算折后价格函数 `discount(p)` 时，在测试里也重新复制了一遍一模一样的计算公式 `expected = p * 0.8 if p >= 100 else p` 来对比。为什么这叫“假测试”（经典反例）？
          reveal:
            - title: 第 1 步：把被测实现的逻辑再抄进测试里 = 拿错代码证明错代码自己正确
              body: 假设需求本来写的是“满 100 含等于打八折”，开发者在被测函数和拷贝测试里一不小心都漏写等号写成 `p > 100`，于是 `assert discount(100) == expected` 算出两个都是 `100`，绿灯高高兴兴通过上线——测试自己也藏了完全一样的逻辑错。
            - title: 第 2 步：在参数化测试里直接写死算准的简单字面常量预期值，才能同时充当活文档
              body: 改成在 `@pytest.mark.parametrize` 里直接明明白白写下 `(100, 80.0), (99, 99.0)` 具体数字。不仅零逻辑风险，而且未来接手同事看两行测试表就瞬间看懂“哦，原来 `100` 是包含打折的，到 80 元。”，真正做到 **测试即精确可读的活规格说明书**。
            - title: 第 3 步：验证预期异常也要学会用 `pytest.raises` 精确捕获
              body: "面对非法负价格必须抛 `ValueError` 时，不要傻写 `try: ... except: pass`，因为万一函数根本没报错悄悄跑通也会糊弄过 `pass`。必须写 `with pytest.raises(ValueError): discount(-10)` 确保没有抛出指定错误时测试立刻红灯失败。"
      - item:
          id: q-parametrize-vs-loop
          type: choice
          prompt: 针对如果用 `@pytest.mark.parametrize` 来驱动 `classify_triangle` 的多组输入，相比在一个普通 `def test_all():` 里手写 `for` 循环逐一 `assert`，最关键的工程优点是什么？
          options:
            - text: "`pytest` 会自动将每组参数化为一条独立测试项目分别隔离执行并单独汇报结果；即便中间第 2 组输入失败，其余第 3、第 4 组依然正常执行完毕并各自清楚报告定位，不因循环提前停止遮盖后续失败"
              correct: true
            - text: 参数化测试运行不需要任何被测 Python 函数就能瞎猜出答案
              why: 参数化测试同样真实调用 `classify_triangle` 执行并断言，区别在于框架级隔离拆跑与数据驱动报告呈现
            - text: 在 `for` 循环里面写测试会导致 Python 永远停不下执行变成无限死循环
              why: 有限列表的 `for` 循环能结束，主要痛点是一旦前一条 `AssertionError` 抛异常跳出，后面的全部用例便彻底被跳过不测了
          explain: 若再给参数表加上可读 `ids=[...]` 或清晰元组标签，一条测试报表出错瞬间就知道是“退化边界 `(1, 2, 3)` 挂了”。
      - item:
          id: q-no-logic-in-tests
          type: choice
          prompt: 按照 *Software Engineering at Google*“写出清晰、完整、可作文档的单元测试”建议，以下哪种测试写法最值得推荐？
          options:
            - text: 每个测试名称清晰表达意图、内部严格按 Arrange–Act–Assert 组织，直接把期望输出结果写成具体明确的值而非再在测试里重抄一遍计算公式
              correct: true
            - text: 把 30 个不相干的功能全塞进同一个叫 `test_misc()` 的 400 行函数里并写三层嵌套循环计算预期值
              why: 庞大杂烩测试既难以一眼看清到底测哪条契约，也极易在第一处报错时掩盖后面的 29 个问题，更无法充当可读文档
            - text: 为了“测得快”把 `assert` 断言语句全部删光只保留函数调用不检查返回值
              why: 没有断言检查只能证明“没当场抛未捕获异常崩溃”，完全不能证明算出的输出值对不对。
          explain: 好单测读起来像一段简明清晰的说明文：“给定什么前提（Arrange）→ 触发哪个动作（Act）→ 应当得到什么确切结果（Assert）”。
      - item:
          id: q-aaa-three-stages-order
          type: order
          prompt: 请按照专业单元测试经典的 **AAA 三段式结构**（Arrange–Act–Assert），将一段 `pytest` 测试代码的书写步骤从上到下排好顺序。
          steps:
            - Arrange：准备测试输入参数、孤立前置环境或轻量替代对象
            - Act：实际调用一次被测公开函数或方法，接住返回值或异常
            - Assert：验证返回值、变更后最终状态或抛出精确预期异常类型
          explain: 保持 AAA 清晰三段分离（最好只 Act 一次核心调用），测试出错时任何人 3 秒钟就能看懂意图。

  - id: maintainable
    chapter: 单元/集成/系统测试
    title: 可维护的测试：面向公开 API 测试、测状态不测交互与防脆弱
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一位工程师写了一堆测试，把被测类里面的私有辅助函数名、每一步内部局部列表排序次序甚至“第 1 步先调 A 再调 B 再调 C 的内部细节”全用断言死死钉死在测试里。两个月后另一位同事在不改变任何外部功能的前提下把内部算法优化提速了十倍——结果整整 **200 个单元测试全线红灯崩溃**。为什么测试会变成拖垮重构的“脆弱负担”？
          options:
            - text: 违反了“测公开 API、测结果状态、不紧绑内部私有交互细节”。脆弱测试把内部临时步骤写死成不可更改的铁条，结果重构时哪怕功能 100% 正确也要被迫重写两百个假红灯测试。
              correct: true
            - text: 因为 Python 代码优化了速度就会把 `assert` 的加法算错
              why: 优化只是改换了内部私下计算路径、外部输入输出契约分毫不差；红灯纯属测试偷窥并锁死了不该管的内部私下步骤。
            - text: 这说明只要测试数量超过 10 个就绝对不应该允许再改任何内部算法
              why: 测试存在的使命正是**护航重构**（重构后测试依然全绿证明没改坏）；凡是合理纯重构一动就大面积炸红灯的测试，说明测试自身写得太脆弱。
          explain: 测试绑死了内部的临时步骤，重构时功能完全没错，测试却要大片重写。这一课讲怎样写出“**除非需求本身变了，否则不必修改的测试**”：测公开 API、测结果状态，不绑内部细节。
      - card:
          title: 避免脆弱测试两条铁律：测公开 API + 测状态而非内部交互
          body: |
            真正高价值的单元测试讲究 **Unchanging Tests（好测试不轻易跟着重构改）**：
            - **只通过公开接口（Public APIs）来测**：别去直接调用和断言以单下划线开头的私有内部函数（如 `_helper_calc`），像外部正常调用者一样传给公开入口，内部随意拆合并重构测试依然稳如泰山。
            - **校验“系统最终结果状态”，少断言“中间私下怎么一步步调过去”**：例如买完书应该检查“订单列表多了这本书、余额扣减了”，而不是去死盯内部究竟调用了 2 次还是 1 次私有保存。
      - card:
          title: 共享代码 vs 测试清晰度：别把测试抽象成看不懂的迷宫
          body: |
            生产代码讲究极度 DRY（Don't Repeat Yourself，处处抽共用基类），可测试代码过分玩高深抽象封装反而有害：
            - **测试里讲究 DAMP（Descriptive And Meaningful Phrases）**：允许少量必要重复换取“打开任何 1 个测试文件从头看到尾一眼读懂全部前提与断言，不用来回翻跳转五个共用工具文件找究竟建了啥假数据”。
            - 一条脆弱测试一旦反复乱炸假红灯让团队每次手动重跑忽略，最终整套测试文化就死掉了。
      - item:
          id: q-test-state-not-interactions
          type: choice
          prompt: 正在给一个用户注册服务 `register_user(email, pwd)` 写单元测试。以下哪种断言设计最符合 **“测试公开 API 与结果状态，不死绑内部实现交互”** 原则？
          options:
            - text: 传入合法邮箱密码调用 `register_user`，随后通过公开查询接口检验返回新账号已存在且密码以加盐哈希保存、重复邮箱再调用则会报错拒绝
              correct: true
            - text: 死死断言函数内部第 3 行必须调用私有方法 `self._validate_regex_v1()` 恰好 1 次，且内部列表必须命名为 `tmp_users`
              why: 明天同事想把正则校验换成一个更精准的库或者把内部函数改名时，即使注册业务行为毫无瑕疵，这种死绑内部交互细节的测试也会瞬间报错脆断。
            - text: 在测试函数最后一行直接写 `assert True` 什么状态都不校验
              why: "`assert True` 永远不会失败，完全检不出任何功能漏洞"
          explain: 记死判断标准：**“当你把函数内部实现从头用另一种等价高效算法彻底重写一遍时，好测试应当依然无需更改、稳稳跑绿；脆弱测试则会大面积炸红。”**
      - card:
          title: 例题：对比“脆弱耦合测试”与“稳健状态测试”面对安全重构时的命运
          body: |
            某购物车结算模块原本内部把商品单价先存进私有列表再循环累加，调用了三次内部方法 `_add_fee()`。重构工程师打算改成一次批量集合推导式算总价。两套测试表现怎样对比？
          reveal:
            - title: 第 1 步：死盯内部调用次数的脆弱测试——需求一点没变却大面积崩溃
              body: 脆弱版测试用断言写死 `assert spy._add_fee.call_count == 3`。重构完虽然每笔结算金额、税金、优惠一分钱都不差、性能还快了 5 倍，但 `_add_fee` 根本被优化合并没了——CI 红灯报警被迫让重构者花半天去修根本没坏的假警报测试。
            - title: 第 2 步：聚焦公开入口输入与最终输出状态的稳健测试——纹丝不动一秒绿灯护航
              body: 稳健版测试只传入明确商品明细调用公开接口 `checkout(items, coupon)`，断言返回的订单总价 `total`、税额与拒绝负折扣边界。重构完一行不改直接瞬间全绿通过，真正兑现“放心重构不踩雷”。
            - title: 第 3 步：反观何时才应该真的允许改一个旧测试？
              body: 在理想工程状态下，一个测试写了以后应当**只在真正改变外部需求规格（比如政策从“满 100 减 20”正式改为“满 100 减 30”），或者新增公开功能时**才去改动——纯粹优化内部性能与清理架构时，好测试集应当零改动。
      - item:
          id: q-damp-over-dry-in-tests
          type: choice
          prompt: Google *Software Engineering at Google*常说“生产代码推崇 DRY（别重复自己），而测试代码可以允许适量 DAMP（清晰直白胜过过度封装）”。这想防止什么具体反模式？
          options:
            - text: 防止开发者在测试文件里把几个构造测试数据的语句过度套娃抽象进五层共享父类和神秘夹具里——结果改一条共享构造数据就意外弄坏二十个测试，而且出 Bug 时点开测试根本看不出实际用了什么输入数据。
              correct: true
            - text: 允许工程师在测试里故意写错全部数学公式
              why: DAMP 的目的是让**每一条测试自身独立自洽可读、不隐匿核心参数前提**，与数学准确毫无冲突
            - text: 禁止在测试里使用 `@pytest.mark.parametrize` 参数表
              why: 参数化表格恰好是最清楚直白展示各输入与期望结果的典范（一眼全看见），反面教材是把数据藏进层层晦涩继承和复杂全局配置里
          explain: 打开任何一条失败的测试用例，最好能在 **一屏之内看清它的全部输入条件（Arrange）、操作（Act）和断言（Assert）**。
      - item:
          id: q-public-api-boundary
          type: choice
          prompt: 你写了一个核心类 `OrderPricer`，对外只公开了一个主方法 `calculate_total(items)`，内部拆出了两个只给自己用的私有辅助函数 `_apply_tax` 和 `_round_cents`。后来团队商议可能会合并重改这两个私有方法写法。测试重心应该放在哪？
          options:
            - text: 重点针对公开接口 `calculate_total(items)` 覆盖全部税率与舍入等价类和边界用例，尽量避免在独立测试中直接耦合绑定私有的 `_apply_tax` / `_round_cents` 命名与签名
              correct: true
            - text: 绝不测试 `calculate_total`，只专门给私有的 `_apply_tax` 写测试而让公开主入口无人检验
              why: 即使每个私有函数单独看起来都能跑，它们合在一起在公开入口处串漏参数或漏调用依然会导致线上直接算错钱
            - text: 把全部方法名字全部改成同一个随机字符串
              why: 面向清晰稳定的公开 API 写测试既护住了真实对外行为，又把内部私有重构空间彻底释放出来
          explain: 当内部某逻辑确实极度复杂时，往往意味着它本身已值得独立成一个专职小模块拥有自己的公开接口——否则就坚定地守住外层公开 API 来测。
      - item:
          id: q-flaky-test-cost
          type: choice
          prompt: 某团队的自动化测试集里常有 5 条测试每逢 CI 机器略忙就“时过时挂”，大家只好习惯性点击“再跑一次”碰运气通过。长期纵容这种不稳定波动测试会产生什么最危险的后果？
          options:
            - text: 团队成员对“红灯警报”彻底麻木失信，遇到真正严重的新缺陷报错时也顺手重跑或直接忽略，整套测试网形同虚设
              correct: true
            - text: 时过时挂测试会自动提升系统运行速度十倍
              why: 不稳定闪红测试只会迫使全队浪费大量时间反复重跑并丧失对质量门禁的敬畏心
            - text: 能自动修复数据库表结构错误
              why: 随机失败信号反而把真故障埋在海量“狼来了”噪音底下
          explain: 遇到偶发不稳定测试必须**第一时间排查修复或暂时隔离查因**，绝不能带着假红警报长期麻木运行。

  - id: doubles
    chapter: 单元/集成/系统测试
    title: 测试替身全图鉴（Fake / Stub / Mock）与过度 Mock 风险
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 正在测一个叫 `charge_and_notify(order)` 的结账函数：它需要调用外部银行扣款接口（每次扣真钱还花 1 秒）和发送短信网关。写单元测试时绝不能真去刷公司信用卡扣真钱。于是开发拿“可编程假对象”把扣款网关换掉了——顺便甚至在测试里假造了根本不会发生的行为。用测试替身虽然让单测跑得飞快，**如果过度滥用甚至乱 Mock**，最后往往会出现什么尴尬场景？
          options:
            - text: 单元测试全是 100% 绿灯，可一部署上线立马崩溃。因为过度 Mock 不仅让测试死死绑住“内部第几行必须调哪个方法”一重构就碎，而且假替身跟真实外部系统行为悄悄脱节（真实接口早改参数或返回值了，Mock 还在照你的假剧本傻傻演绿灯）
              correct: true
            - text: 一旦用了测试替身，哪怕真实外部银行接口明天悄悄改了字段名或返回格式，单元测试也一定能当场报错抓出来
              why: 替身只在测试运行期间替换外部连接避免真实扣费副作用；最大陷阱在于“高保真度失真”（真实接口变了而假替身没跟着变）与“把实现细节锁死”
            - text: 测试替身全都能 100% 完美等同真实生产环境，完全不需要任何集成测试了
              why: 哪怕写得最好的纯本地 Fake 也无法完全复现真实数据库的并发锁或第三方 API 真实边界错误，因此仍需集成测试兜底
          explain: 过度 Mock 让测试绑死“内部第几行调了哪个方法”，一重构就碎；假替身和真实系统的行为还会悄悄脱节，测试全绿、上线就崩。这一课分清各种 **测试替身（Test Doubles）**，以及 **什么时候用 Real、Fake、Stub，什么时候慎用 Mock**。
      - card:
          title: 什么是测试替身，以及前两级优先阶梯：Real → Fake
          body: |
            测试中用来隔离外部昂贵或不确定依赖（如真实扣款网关）的受控替代对象统称 **测试替身**。Google推荐先走前两级：
            1. **优先用真实实现（Real Implementation）**：依赖本身快且纯确定时（如轻快本地 SQLite），直接用真的，保真度最高。
            2. **次选轻量高保真假实现（Fake）**：像真实契约那样实际干活但只存轻量字典结构（如 `InMemoryUserRepo`，能存能查能报重名错）。
      - item:
          id: q-doubles-prefer-real-or-fake
          type: choice
          prompt: 按照 *Software Engineering at Google*的替身选用阶梯，若被测函数需要调用一个纯本地无副作用、运行只需 0.2 毫秒的工具库，最优选方案是什么？
          options:
            - text: 直接使用该工具库的 真实实现（Real Implementation），绝不为了“孤立”强行画蛇添足造假 Mock
              correct: true
            - text: 把它也用空壳 Mock 换掉，假定它返回固定常数 `42`
              why: 只要真实依赖本身又快又确定无副作用，直接用真实实现拥有 100% 最高保真度，完全不会与未来真实改动脱节
            - text: 永远把真实库删掉改连公网测试账号
              why: 避免引入不必要的公网不稳定开销，能本地快跑确定的真实现才最理想
          explain: 记住：**不盲目一切依赖皆 Mock**——能安全快用真对象就直接用真的，太重再用高保真 Fake。
      - card:
          title: 后两级替身：打桩返回值（Stub）与交互验证（Mock）
          body: |
            只有当需要强迫模拟极端异常或无法靠状态观测外部发出动作时，才上后两级：
            3. **打桩（Stub）**：针对某条测试刻意喂回写死值或异常（如强制网络超时测试重试逻辑）；
            4. **行为模拟（Mock）**：可编程验证是否带着特定参数调过无状态外部发送动作，切忌滥用锁死内部私有调用。
      - card:
          title: 什么是 Mock，过度使用 Mock 两大核心风险？
          body: |
            **Mock 是用可编程替身代替真实依赖（常用来隔离待测单元、模拟极端错误返回并检查预期交互调用）**。但它有两大致命风险：
            - **脆弱耦合（Brittle Tests）**：死断言“必须以这几个顺序参数调 `repo.save` 一次”，换种等价写法（如改调 `save_batch`）就全场碎裂；
            - **保真度失真（Mock Drift，3.3/3.9）**：你以为真实网关返回 `{"ok": True}` 就拿 Mock 死配回这行；实际上三个月前外部网关早就升级改返回 `{"status": "paid"}` 了——结果单测永远 100% 全绿，一上线全站报错。
      - item:
          id: q-doubles-taxonomy-match
          type: match
          prompt: 把单元测试里替换依赖的四类做法与它们的真实特征及推荐优先级精准配对。
          pairs:
            - ["**真实实现（Real Implementation）**", 保真度 100% 最高。只要本身足够快且无外部副作用（如纯本地版 SQLite 或纯算法库）就首选直接上真货]
            - ["**高保真假实现（Fake）**", 有完整简化工作逻辑（如用 Python `dict` 模拟支持存/查/重复拦截的纯本地仓储），常由依赖拥有者统一定制维护防偏差]
            - ["**测试桩（Stubbing）**", 针对单条测试刻意喂入特定写死结果或抛特定异常（如强行让支付通道抛 `TimeoutError` 测试容错回滚）]
            - ["**行为模拟（Mocking / Interaction）**", 验证“是否精准带着什么参数调用过某个外部副作用方法”（慎用防紧绑内部重构，只宜用来验证确实无状态的外部发出动作如发短信邮件）]
          explain: 记清口诀：**能用真（Real）就用真，太重选高保真 Fake，测异常偶配 Stub，只有无状态外部副作用动作才慎用 Mock 查交互。**
      - card:
          title: 例题：用“依赖注入（DI）”给难以替换的死代码开一扇“接缝（Seam）”
          body: |
            某老函数 `send_birthday_email()` 里面写死了直接 `import time` 读真实系统时间、并且写死了直接创建外部真实发信客户端 `RealMailer().send(...)`。如果不改它，任何测试跑一万年都要真正对外发真邮件还依赖当天日期。怎么用依赖注入救活它？
          reveal:
            - title: 第 1 步：打开“接缝（Seam）”——把固定死依赖改成由函数参数传入（附默认真值）
              body: 改写函数签名为 `def send_birthday_email(user_repo, mailer=None, today=None):`，生产环境不传额外参数时依然自动顺着用真实发送器与当天日期；而在单元测试里，立刻打开了一道可插拔接缝把我们自己的 `InMemoryFakeMailer()` 和固定日期 `date(2026, 11, 17)` 优雅塞进去。
            - title: 第 2 步：给发送器用极轻的 `InMemoryFakeMailer` 测“结果状态”，而不是死查内部调用
              body: 我们的 `InMemoryFakeMailer` 只不过内部有个普通列表 `self.sent = []`，每次 `send(to, subject)` 往列表追加一条记录。测试执行 `send_birthday_email(...)` 后，只需检查最终状态 `assert fake_mailer.sent == [("mei@ex.com", "生日快乐")]`——既零真网发送、又不像繁琐 Mock 框架那样把内部调用细节绑死。
            - title: 第 3 步：反观若非用普通 `Mock` 测“必须调过 `save_v1` 两次”带来的长期惨痛代价
              body: 一旦把重点业务存储换成毫无真实校验的空壳 `Mock` 替身（明明真库会截断 `>40` 字符报错，假 `Mock` 却直接开心 return True），测试全绿而线上天天炸 `IntegrityError`。所以有真实状态契约的仓储，宁可用高保真 `Fake` 或轻量真实纯本地 SQLite（集成层）。
      - item:
          id: q-over-mocking-risk-ex4
          type: choice
          prompt: 开发在单元测试中“**过度使用 Mock**（几乎把每个协作类内部调用全用 Mock 写死，甚至用假返回替代了所有复杂依赖逻辑）”会导致哪两个最核心的工程隐患？
          options:
            - text: ① 测试与内部实现细节强耦合（一旦重构内部调用次序或拆分方法，哪怕功能一点没坏测试也会大片报错）；② 行为漂移失真（Mock 返回的假数据/简化契约悄悄与真实依赖脱节，出现“单测全绿、上线真实联调全崩溃”）
              correct: true
            - text: 会让单元测试运行时间从 5 毫秒被迫拉长到 10 小时，且绝对测试不了异常分支
              why: 恰恰相反，Mock 跑得极快也常被拿来模拟错误返回值，它真正毁掉的是重构自由度与契约真实性（Fidelity）。
            - text: 会自动删除数据库里所有的有效索引
              why: Mock 替身在纯本地沙箱运行不会损坏真实数据库索引结构
          explain: 每次想给某个自己家模块打 `Mock` 前先停一秒问：**“能不能直接传入真对象？能不能写个十行代码的纯本地临时区 `Fake` 查结果状态？只有真发外部邮件/短信这类无从观测状态的动作才验一次发送记录吗？”**
      - item:
          id: q-fake-vs-mock-state
          type: choice
          prompt: 要测试一个“将订单保存到存储后，再查询出该用户所有历史订单总额”的业务流程，下面哪种替身设计方案保真度更高、且最不容易在日后重构内部保存方式时脆弱断裂？
          options:
            - text: 传入一个基于 Python 字典或纯本地 SQLite 实现的高保真 `FakeOrderRepo`（支持真实写入存储与按条件查回，并在最后通过公开查询接口断言存储后的用户账单状态）
              correct: true
            - text: 把整个存储对象全换成一个空壳 `Mock`，既不真的存任何东西、也不测能否查回来，只硬性断言 `assert mock_repo._internal_write.called_once_with(...)`
              why: 这种空壳断言根本没测出“写进去以后再按规则读出来加总是不是真对”，而且一旦内部把 `_internal_write` 改名或拆成批写测试立马脆碎
            - text: 直接连接公司正在收真实用户钱的生产财务主数据库跑这行测试
              why: 单元测试绝对禁止触碰或污染生产数据库，轻量化纯本地 Fake 或隔离临时库才是正解
          explain: 用真实轻量或高保真 Fake 检查**“存进去后再拿出来，结果对不对”**，远强于拿空壳 Mock 自导自演。

  - id: integration
    chapter: 单元/集成/系统测试
    title: 集成测试与大型测试的保真度、SUT 边界
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 订单模块的单元测试全绿（用的全是轻巧字典 `FakeOrderRepo`），折扣函数自己的单元测试也全绿。可是一部署上测试服务器联调真实 SQLite/PostgreSQL 数据库和 REST 接口时，下单居然直接报 500 崩溃——原来 SQL 里把列名 `user_id` 拼成了 `uid`，JSON 字段大小写也对不上。靠单测为什么抓不到这种跨边界错，该靠哪一层测试补齐？
          options:
            - text: 这正是纯隔离单测的盲区：各个单元自己跟自己的假替身玩没问题，一拼上真实模块与真实数据库才暴露契约错配。必须靠中等规模的集成测试（Integration Testing）提升保真度（Fidelity）来捕获。
              correct: true
            - text: 应该立刻删除全部单元测试和 Fake 替身，改靠人工眼睛逐行看 SQL
              why: 单元测试与集成测试不是互相取代，而是分工明确：单测高速穷尽分支算法，集成测试以适量真实依赖核查“接口胶水有没有拼错”
            - text: 只要在测试函数名里加上 `_real` 两个字就会自动连通真实数据库
              why: 集成测试需要实际把真实数据库实例或跨服务接口连起来搭建待测系统（SUT）执行验证
          explain: 每个单元和自己的替身配合都没问题，一接上真实模块和数据库才暴露接口对不上。这一课讲 **集成测试** 怎样在快速隔离的单元测试和高成本的端到端测试之间找到位置。
      - card:
          title: 什么是集成测试，以及为什么高保真度（Fidelity）能补单测盲区？
          body: |
            - **集成测试**把多个协同工作模块或真实数据库/磁盘接口组装成待测系统（**SUT**, System Under Test）共同验证对接契约。
            - **保真度（Fidelity）**：测试替身跑得快却会与真实世界脱节；集成测试哪怕只连本地测试数据库或容器化真服务，也能当场揪出 SQL 语法写歪、数据库唯一约束缺漏、序列化格式错乱与权限校验绕过等纯单测根本摸不到的经典漏洞。
      - card:
          title: 大型测试的组织边界：单服务集成 vs 跨服务功能契约
          body: |
            选择 **SUT 边界** 要清醒控制尺寸：
            - **单服务边界集成**：真路由 + 真业务逻辑 + 真测试数据库（只把极外部发真邮件/真扣款网关保留极简受控本地替身），跑起来不到 1 秒却极其扎实。
            - **多服务协作功能验证**：两三个紧邻微服务联手跑关键契约流；若把几十个外部集群全部同时拉起，一旦其中第 19 号无关团队服务抖动就全场变红（因此不要轻易无节制扩宽 SUT 边界）。
      - item:
          id: q-integration-gaps
          type: choice
          multi: true
          prompt: 在只依靠纯隔离 **单元测试**（配简单纯本地假仓储）做验证的项目里，以下哪几类真实隐患往往会被完全漏掉、只有靠连接真实组件运行的 **集成测试** 才能揪出？（多选）
          options:
            - text: 业务拼接的 SQL 查询列名写错或数据库忘了开 `PRAGMA foreign_keys = ON` 导致约束失效
              correct: true
            - text: 服务 A 发出的 JSON 键名叫 `orderId`，而服务 B 解析端预期收到的却叫 `order_id`
              correct: true
            - text: 前端请求参数经过编码与反序列化后，类型意外由整数变成了字符串引起下游对比失败
              correct: true
            - text: 仅把函数 `add(2, 3)` 错写成 `2 - 3` 算错答案
              why: 纯数学算术错在隔离的毫秒级单元测试里一眼就被抓出来了，根本不用等到重量级集成测试。
          explain: 记清分工：**纯逻辑分支错交给极速单元测试抓；组件拼装、协议编解码、真数据库 SQL 与外键配置错交给集成测试抓。**
      - card:
          title: 例题：测一个 `Flask + SQLite` 选课保存接口，怎么划线才算既有高保真又稳固快速？
          body: |
            假设开发 `POST /api/enroll`（接收学生和课号、检查学分、写入数据库并给外部消息中心发个通知）。画 **SUT** 边界时怎么二选一？
          reveal:
            - title: 第 1 步：把真实的 HTTP 路由框架 + 参数校验 + 真实测试版 SQLite 库划进 SUT 内部
              body: 用框架自带的测试客户端直接模拟发 `POST /api/enroll` 跑过完整路由参数解包、去空白判空，接着直接落进一份隔离的测试数据库里（开启真 `STRICT` 与外键约束）再查出来核对——SQL 写错、外键拦不住假学号、HTTP 400 错误码配反当场 100% 现原形。
            - title: 第 2 步：把无法控的公网第三方邮件/短信平台隔在 SUT 外边，只做轻量本地假替身或录制桩
              body: 千万别在每次 CI 集成测试里去连公网真发真短信。把外部不可控团队服务放在 SUT 边界外边（仅在少数端到端验证环境或沙箱测试），于是整套集成测试可以在 0.5 秒稳稳跑完 20 条接口用例，既高度保真又绝不会因外部网速抽风闪红灯。
            - title: 第 3 步：同时注意每次集成用例跑完务必清理或重建独立新测试库
              body: 上一条集成用例往表里插过 `"S1"` 后如果不清理干净，下一条用例就会意外撞主键报错（测试彼此串味顺序依赖）。给每条用例使用独立全新临时库或开启回滚事务隔离，彻底消除互相干扰。
      - item:
          id: q-sut-fidelity-tradeoff
          type: choice
          prompt: 按照 **测试保真度（Fidelity）** 与待测系统（**SUT**）边界的阐述，下面哪项方案在构建 **集成测试** 时平衡得最好？
          options:
            - text: 在隔离可控环境下让本服务逻辑连上真实数据库与真实序列化路径跑核心对接验证，同时把外部不可控第三方支付/发信等公网依赖替换在 SUT 边界之外
              correct: true
            - text: 强迫每次本地运行集成测试都必须同时拉起全公司两百个真实业务团队的全部线上测试环境
              why: 依赖两百个外部系统会导致启动极慢且其中任何一处发版故障就会连坐把你的测试炸红
            - text: 在集成测试里连 SQLite 也不允许跑，还是全用空字典糊弄过去
              why: 如果连真实数据库引擎和真实序列化协议都不连上去跑，那就根本称不上验证对接保真度的集成测试了
          explain: 控制好 SUT 圈圈大小：圈进最易出对接错的真模块与真数据库，挡住最不可控不稳定的外部互联网服务。
      - item:
          id: q-test-isolation-cleanup
          type: choice
          prompt: 某团队写了一组连真实本地数据库的 **集成测试**：单跑 `test_create_order` 能过，单跑 `test_list_empty` 也能过；但只要合在一起先跑 `create` 再跑 `list_empty`，第二条立刻崩溃报错说“表里居然有 1 条订单不为空”。这暴露了什么常见工程毛病？
          options:
            - text: 共享测试状态没有做到用例间隔离清理——每个集成测试用例启动前应当拥有全新独立环境（如独立临时库或用例后回滚清理），严防上一条用例留下脏数据污染下一条。
              correct: true
            - text: 因为 Python 规定数据库里同时只准保存 1 条测试用例代码
              why: 共享可变状态互相漏风污染是集成与系统测试里制造 **隐蔽先后顺序依赖** 的最大元凶
            - text: 只需要永远手动规定所有人只能挑 `test_list_empty` 先跑、另一个后跑就能永远掩盖真相
              why: 测试框架常常按字母或随机乱序或并行执行用例，任意两条测试无论谁先跑、甚至单跑都不准互相污染影响结果。
          explain: 黄金准则：**每条测试用例自己建自己的环境、自己打扫干净自己的状态，全乱序也能 100% 全绿。**
      - item:
          id: q-sut-boundary-definition
          type: choice
          prompt: 在测试设计术语中，**SUT（System Under Test，被测系统）** 指的是什么、为什么在集成测试前必须先画清它的边界？
          options:
            - text: SUT 指当前这组测试真正要检验行为的圈内真代码与真组件；先划清边界才能决定圈内接真实库、圈外不稳定第三方便捷替换
              correct: true
            - text: SUT 规定只能包括 1 个独立整数变量，绝不允许包含数据库模块
              why: 单元测试的 SUT 很小，而集成测试与系统测试的 SUT 则刻意把多个真实协作模块甚至数据库和前端圈入其中
            - text: SUT 专指公司里全部待删废弃文件清单
              why: SUT 正是我们此刻搭建测试网要真实核验的目标系统/子系统边界
          explain: 清楚“圈内真连谁、圈外替身挡谁”，写集成测试就不会手忙脚乱。

  - id: system-test
    chapter: 单元/集成/系统测试
    title: 系统测试、验收与浏览器/性能/负载压测
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 后端全部接口联调通过、前端组件自己测也都绿了。现在马上要对用户正式开放上线——结果真上线才发现：在真实电脑浏览器里点“提交按钮”因为样式遮挡根本点不到、且同时涌进 500 个人抢购时网页直接卡死超时。这些“只有把前后端、网络和浏览器全装成一个完整成品压一压才看得见的问题”，需要金字塔顶层的什么检验来兜底？
          options:
            - text: "系统测试（System Testing）与端到端浏览器/性能压测，以及上线前的 验收（Acceptance / Alpha / Beta）与规范一致性验证。"
              correct: true
            - text: 再补充五百个测 `1 + 1 == 2` 的纯算法单元测试就肯定能发现网页样式遮挡了按钮
              why: 按钮 CSS 重叠遮挡、真实页面跳转、打包脚本漏文件与并发连接耗尽只能在真实完整系统测试环境里被抓住
            - text: 直接禁止任何用户使用真实浏览器打开网站
              why: 系统与端到端测试正是站在真实终端用户的完整运行视角做最后一道防线
          explain: 本课把测试层次顶层全拼齐：**系统测试、时间与测试数据管理、浏览器与性能/压力测试以及验收/Alpha/Beta/标准一致性测试**。
      - card:
          title: 系统测试、验收测试与 Alpha / Beta / 标准一致性
          body: |
            到达金字塔顶端：
            - **系统测试（System Testing）**：端到端测试已完全集成的系统功能、安全、可用性及真实兼容环境；
            - **验收测试（Acceptance Testing）**：对照客户合同与真实业务场景验收上线通行；
            - **Alpha / Beta 与一致性测试**：Alpha 由内部人员在公司环境试跑捉大虫；Beta 放一小批真实外部受邀用户在真实环境试水收集长尾反馈；一致性（Conformance）核查产品是否严格达标公开协议标准。
      - card:
          title: 写稳大型测试护栏一：条件等待与隔离测试数据
          body: |
            端到端（含真实浏览器 `e2e`）最容易脆弱闪断，先守住前两条铁律：
            1. **控制时间等待**：绝不要硬写 `sleep(5)` 赌网络一定完事。改用“条件等待（Wait until visible/response arrives 配合宽裕超时）”；
            2. **独立测试数据与清晰三步结构**：每条端到端用例自建独立测试账号并只断言最终核心状态，防环境串扰引起报错（**Flaky**）。
      - item:
          id: q-system-test-data-isolation
          type: choice
          prompt: 按照大型系统测试的测试数据规范，如果 10 条并发运行的端到端测试全都共用同一个预置账号 `admin@test` 修改同一条商品库存，最容易引发什么灾难？
          options:
            - text: 测试彼此争抢并发修改同一条共享记录，导致测试随机交替通过/失败（Flaky），谁都不知道是真 Bug 还是测试互相撞车
              correct: true
            - text: 共用账号能让浏览器渲染动画加速一百倍
              why: 共享测试数据既不加快界面渲染，反而会引发不可复现的状态互相覆盖踩撞与假失败
            - text: 会强制数据库自动删除所有单元测试文件
              why: 问题出在并发测试之间相互污染共享状态，使测试失去独立性与确定性
          explain: 每条大型端到端测试应当使用独立隔离的测试数据与唯一标识，互不踩脚。
      - card:
          title: 写稳大型测试护栏二：性能、负载与压力测试区分
          body: |
            3. **性能 / 负载 / 压力测试**：分别在常态基线、预期峰值负载与刻意超上限高压下度量吞吐、耗时延迟及过载时能否平滑降载恢复。
      - item:
          id: q-system-test-types-match
          type: match
          prompt: 把顶端系统测试与验收阶段中的四种常见测试与各自目标精准匹配。
          pairs:
            - ["**端到端浏览器系统测试**", 用真实无头浏览器实际点按页面元素、校验样式交互与前后端全链通畅]
            - ["**负载与压力测试**", 向系统持续注入预期峰值甚至故意超载流量，度量返回耗时、吞吐上限及崩溃恢复曲线]
            - ["**Alpha / Beta 验收测试**", 先内测再交真实外部受邀用户群在各自真实设备上试跑，捕捉实验室想不到的长尾体验与业务偏差]
            - ["**规范一致性测试（Conformance）**", 对照行业标准（如 HTTP 规范或 SQL 标准）逐条核验产品是否严格符合协议规定]
          explain: 这个游戏自己也有用无头浏览器点完课程、检查屏幕布局的 e2e 脚本，这就是 **Browser Testing**。
      - card:
          title: 例题：为什么把 `time.sleep(3)` 换成“条件轮询等待（Explicit Condition Wait）”就能治好一大半浏览器 E2E 飘红？
          body: |
            前端点击“保存”按钮发起 `fetch`，屏幕需要异步耗时等待响应再亮出“已保存”提示框。对比 `time.sleep(2)` 死等与显式条件等待在繁忙 CI 机器上的命运：
          reveal:
            - title: 第 1 步：固定 `sleep(2)` 在慢机偶尔卡顿 2.3 秒时立刻假失败，平日跑得快时又白等
              body: 平时笔记本只要 0.2 秒就收到回包显示出“已保存”，可你硬写了 `sleep(2)`，跑 100 条用例就要活活白白浪费 `180` 秒发呆。更惨的是哪天 CI 构建机刚好同时跑了三个构建任务略卡了一瞬用了 `2.4` 秒，于是 `sleep(2)` 一醒过来还没画完字就当场报错红灯——这种一会过一会挂的测试叫 **脆弱闪断测试（Flaky Test）**，极毁团队信任。
            - title: 第 2 步：改成 `waitForSelector(".toast:has-text('已保存')", timeout=10s)` 事件驱动条件等待
              body: 显式条件等待每几十毫秒（或通过浏览器事件）检测一次目标状态：如果 0.15 秒画好就立刻 0.15 秒放行继续，极快。如果 CI 偶尔忙卡了 3 秒只要在宽裕的 `10` 秒总上限前成功画出来也稳稳通过；只有真的卡超过 10 秒死掉才精准报错。
            - title: 第 3 步：同时警惕假时间与定时任务测试
              body: 对于“订单创建 30 分钟后自动取消”这类长时业务逻辑，绝不能在端到端测试里傻傻真干等 30 分钟——在系统设计上支持**注入可控虚拟时钟 / 偏移时间戳**，几毫秒内把系统时间跳到 `+31` 分钟立刻验证过期动作。
      - item:
          id: q-no-sleep-flaky
          type: choice
          prompt: 团队写的网页端到端自动化测试每跑五次总有一次莫名其妙失败（重跑一次又绿了），排查代码发现脚本里写满了一堆 `sleep(1.5)` 等待网页异步渲染。按最佳实践该怎么治好这种 **脆弱闪断（Flaky）** 问题？
          options:
            - text: 删除所有盲目猜测时间的硬性 `sleep(...)`，全部替换为面向真实可观测完成标志（元素出现、文本就位、网络请求响应完成）的条件等待（配合宽裕超时上限）
              correct: true
            - text: 把 `sleep(1.5)` 一股脑全改成 `sleep(120)` 让整套测试每天跑满十小时
              why: 把死等盲猜拉大到两分钟不仅不能解决真卡顿，还会拖死全队 CI 吞吐使测试完全丧失快速反馈价值
            - text: 直接写一段脚本不管失败多少次强行在屏幕上打印“测试全部通过”
              why: 屏蔽失败信号会让真正严重的前端崩毁 Bug 畅通无阻溜上生产
          explain: 好端到端测试守则：**慢步等条件就绪，不靠死睡赌运气。**
      - item:
          id: q-perf-load-stress-diff
          type: choice
          prompt: 在 **性能、负载与压力测试** 中，如果架构师故意向电商下单系统注入**远超平时日常峰值 3 倍甚至持续不断加压直到观察它什么时候报错降级以及洪峰消退后能否自动恢复健康**，这属于哪种测试？
          options:
            - text: "压力测试（Stress Testing）——专门探测系统物理承受上限、过载拒绝与故障恢复能力，防止真实大促那天全站直接死机且恢复不起来"
              correct: true
            - text: 单元测试中的边界 `credits == 1` 验证
              why: 单个函数边界检查在单机隔离函数级验证；持续推高系统级并发负载直至突破承受能力找拐点和验证降载保护属于系统压力测试
            - text: 只针对静态图标好不好看的视觉设计检查
              why: 负载与压力测试核心衡量高并发和超上限压力下的系统吞吐、尾延迟、错率以及过载保护生效状况
          explain: 一直加压到超过日常峰值、看系统什么时候降级、洪峰过后能不能自己恢复，测的是承受上限和恢复能力，这是压力测试；负载测试只在预期峰值附近量性能。

  # ======================================================================== 性质测试
  - id: properties
    chapter: 性质测试
    title: 什么是性质测试：从“手写孤立例子”升级到“通用不变规律”
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: "手工写示例测试 `assert my_sort([3, 1, 2]) == [1, 2, 3]` 没毛病。可万一有位粗心同事交了个极度偷懒的错误排序函数 `def bad_sort(xs): return sorted(set(xs))`（顺手把重复数字全吃掉了），刚好你手写的三五个示例里恰好碰巧全都只用了不重复数字 `[3, 1, 2]`、`[5, 2, 9]`……全部绿灯放过上线。有没有一种测试方式，不用你一个个绞尽脑汁想所有刁钻例子，只要声明几条“对**任意**合法列表都绝不会错的基本规律”，框架就自动随机炮制几百上千个奇怪输入替你狠抓漏洞？"
          options:
            - text: "性质测试（Property-Based Testing）。只写出“无论输入什么列表 `xs`，结果都必须保持有序、长度与原列表一模一样且元素统计相同”等通用属性，生成器随手造出 `[1, 1]` 当场就把 `bad_sort` 扒光抓获。"
              correct: true
            - text: 因为 Python 禁止随机生成任何数字列表作为测试输入，所以只能靠人手一个个敲完所有例子
              why: 现代 Python 拥有极其成熟的开源性质测试框架（如 `Hypothesis`），能在半秒钟内替你爆破上百种奇怪边缘组合
            - text: 性质测试的意思是只要函数返回值是个数字，不用比对任何条件就永远算对
              why: 性质测试正依赖比具体示例更抽象普适的**不变性质（Invariants / Properties）**来严格裁判成百上千次自动测试。
          explain: 不再一个个手写输入和答案，而是写下“无论输入什么都必须成立”的性质，让工具自动生成大量输入去找反例。这就是 **性质测试（Property-Based Testing）**，它能补上“只想得出几个例子”的盲区。
      - card:
          title: 示例测试 vs 性质测试
          body: |
            - **传统示例测试（Example-Based）**：挑少数特定具体输入配对预期输出（`f([3,1,2]) == [1,2,3]`）。直观好写、也是最好文档，但只能代表开发人员**想得到**的那几个孤立点。
            - **性质测试（Property-Based Testing）**：写通用规约断言：**“对**任意**满足前提的随机生成输入 `x`，执行 `f(x)` 后性质 `P(x, f(x))` 必须恒成立。”** 框架自动发射上百个含空值、负数、重复项、超大值组合来轰炸你的函数。
      - card:
          title: 怎么写出“好而不空洞、不抄原代码”的性质？
          body: |
            新手常犯错误是写一个同样会抄写实现的假性质，下面五招**通用不变性质**可以直接套用：
            1. **往返编解码恒等（Round-Trip）**：`decode(encode(x)) == x`（如 JSON 打包拆包、压缩解压）；
            2. **守恒/不变式（Invariants）**：排序后`长度不变`、`元素计数 multiset 不变`且相邻满足 `out[i] <= out[i+1]`；
            3. **幂等性（Idempotence）**：做两次跟做一次一样（`sort(sort(xs)) == sort(xs)`）；
            4. **换实现对照（Oracle 模型）**：拿极慢极笨但绝对正确的朴素参考实现跟你的极速新优化算法对拍结果。
      - item:
          id: q-bad-sort-property
          type: choice
          prompt: "针对错误实现的排序 `def bad_sort(xs): return sorted(set(xs))`，若我们不用具体期望列表去比对，而是使用 **性质测试**，哪两条组合性质能瞬间在遇到 `[1, 1]` 时把这 BUG 击毙？"
          options:
            - text: ① 输出必须是非降序（`out[i] <= out[i+1]`）；② 输入与输出长度（及每个值出现次数）完全相等：对 `[1, 1]` 而言，`bad_sort([1, 1])` 吐出 `[1]` 长度变成了 `1 != 2`，立即暴露丢重复元素缺陷。
              correct: true
            - text: 只写“输出里最大的元素不能大于 10000”
              why: 如果输入恰好都在 10000 以内，哪怕错删了一半元素也完全漏抓这个缺陷
            - text: 只写“结果必须是个 Python 列表 `isinstance(out, list)`”
              why: 过于宽泛空洞的类型性质就算返回一个空列表 `[]` 也能骗过检查，必须结合顺序 + 元素守恒（排列不变式）才能完整刻画“正确排序”。
          explain: 记死：**排序的充要性质绝不仅仅是“递增/非降”，必须同时守住“输出是原输入元素的一次完全重排（长度与频次完全守恒）”**——少一个就会放走 `return []` 或 `sorted(set(xs))`。
      - card:
          title: 例题：给你的新奇“优化算法”找最稳妥的性质校验——对拍法（Test Oracle）与往返律
          body: |
            假设你新写了一个超级复杂的高性能优化版查找/压缩算法 `fast_compress(text)`，自己都怕边界条件漏错，却又不甘心在测试里重写一遍复杂的压缩算法。靠哪两招性质最省事最犀利？
          reveal:
            - title: 第 1 步：编解码往返对称律（Round-Trip Property）——零逻辑复制验证压缩器
              body: 根本不用人工算出压缩后乱七八糟那串东西长得像啥。直接写性质断言：`assert decompress(fast_compress(text)) == text`。只要在成千上万条随机 Unicode、空字符串、超长连续相同字符上全都严丝合缝无损还原成原字符串，再顺便检查压缩后不超时报错，极其复杂的编码 BUG 一扫而空。
            - title: 第 2 步：双版本对拍（Reference Model / Differential Oracle）验证高效重构
              body: 当你用优化的快速算法（比如 O(n log n) 排序或新缓存结构）替代一段已经在线稳跑多年但较慢的简单参考实现 `naive_ref(x)` 时，性质断言只需一句：`assert fast_impl(x) == naive_ref(x)`。让框架发一万个随机输入同时轰炸老慢版与新快版，有任何丝毫分歧 1 秒定罪。
            - title: 第 3 步：注意警惕单纯只测 `isinstance` 或太弱的性质骗自己（伪安全感）
              body: 写性质一定要检查“是否足够约束正确性”——比如对减法错写成返回 `abs(a - b)`，只查 `结果是整数` 放过，若加上对偶性质 `f(a, b) + b == a` 立刻一剑封喉。
      - item:
          id: q-property-patterns-match
          type: match
          prompt: 把四种高价值 **性质测试** 经典不变式设计模式与最贴合的应用场景对应配对。
          pairs:
            - ["**往返恒等律（Round-Trip）**", "`loads(dumps(obj)) == obj`（用来彻底检验 JSON/紧凑格式协议序列化与压缩解压器互逆无损）"]
            - ["**幂等律（Idempotence）**", "`normalize(normalize(s)) == normalize(s)`（规范化清洗、排序与删除接口做一次与做两次效果全同）"]
            - ["**参照预言机对拍（Oracle / Model）**", 用朴素易懂绝对正确的旧实现与极速新版在海量随机输入上核对输出一字不差]
            - ["**守恒/排列不变式（Conservation）**", 银行转账后全体账户余额总和恒定、列表排序后各元素频次及总长度与原输入完全一致]
          explain: 练熟这四把规律钥匙，哪怕你不懂形式化定理证明，也能写出近乎覆盖整个输入宇宙的自动化校验网。
      - item:
          id: q-property-weak-check-trap
          type: choice
          prompt: 某同学为测自己写的新版绝对正确排序函数 `my_sort(xs)`，只写了唯一一条性质：`assert all(out[i] <= out[i+1] for i in range(len(out)-1))`（仅检查相邻元素非降序）。为什么这**一条单独**性质远远不够用来保证 `my_sort` 写对了？
          options:
            - text: "哪怕一个完全作弊的 `def my_sort(xs): return []`（直接清空并返回空列表）或者丢掉了重复数字的 `sorted(set(xs))` 都能 100% 通过上面那条有序性检查。必须联合检查“元素多重集与原输入完全一致（如 `Counter(out) == Counter(xs)`）”"
              correct: true
            - text: 因为 Python 列表根本不能比较数字大小
              why: 列表比较大小合法且这步检查确实抓得出逆序错，问题只在于它漏检了“输出到底是不是由原来那批数字完整搬过来而没偷加没偷减”。
            - text: 因为任何测试只允许用文字 `print`，不准写 `for` 推导式判断有序
              why: 在 `assert` 里使用简洁明了的 `all(...)` 验证性质正是性质测试的精髓
          explain: "**性质必须既排得掉胡乱输出，又防止“删光返回空值或篡改元素”的投机取巧实现**。"
      - item:
          id: q-roundtrip-vs-idempotent
          type: choice
          prompt: 假设你要用 **性质测试** 检验两类完全不同的函数：① JSON 编解码 `dumps`/`loads`；② 文本标准化清理 `normalize_whitespace(s)`。下列哪两句不变式写法各自放对了位置？
          options:
            - text: 对编解码写往返律 `loads(dumps(obj)) == obj`；对标准化写幂等律 `normalize_whitespace(normalize_whitespace(s)) == normalize_whitespace(s)`
              correct: true
            - text: 对编解码写 `dumps(obj) == obj`，对清理写 `normalize_whitespace(s) != s`
              why: 编码后的文本字符串未必等于原字典，得经过解码回来才应相等；而已经规范干净的字符串再清理一次必须维持原样不变
            - text: 两者都不必写 `assert`，随机生成输入跑一趟不抛错就行
              why: 缺少准确性质不变式断言，即使把 JSON 值全解码成空字符串也捕获不到。
          explain: "**编解码配往返律、标准化/去重配幂等律**——挑对性质模板，十秒写出覆盖成千上万随机样例的强断言。"

  - id: hypothesis
    chapter: 性质测试
    title: 生成器、反例缩减（Shrinking）与 Python Hypothesis 实战
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 用 Python **Hypothesis** 性质测试跑一个函数，框架随机爆破在第 73 次生成了一串长相吓人的反例列表：`[984210, -47291, 0, 8812, 999999999, 13, 0, -47291]` 把你的程序弄崩了。面对这样一串冗长的随机大数字，排查原因非常困难。一个成熟的性质测试框架在向你报告失败之前，会自动先默默干一件极其贴心的什么事？
          options:
            - text: 自动反例缩减（Shrinking）。它会沿着保持“依然能让测试失败”的路径一步步尝试删掉无关元素、把巨大数字往 `0` 或 `1` 压小，直到提炼出最简短清晰、一眼看穿病根的最小反例（比如 `[0, 0]` 或 `[1, 1]`）才拿给你看。
              correct: true
            - text: 直接把失败用例悄悄藏起来假装什么事没发生过、输出绿色 PASS
              why: 发现任意哪怕 1 个反例就必须红灯报错暴露。反例缩减是为了帮你以最快速度看清导致崩掉的最核心最小触发条件
            - text: 把刚才随机生成的大列表再故意拉长到一千万个数字
              why: 与拉长相反，缩减（Shrinking）是做减法——把干扰视线的冗余噪点统统剔掉，还原纯净真凶。
          explain: 这正是让无数工程师爱上 Python **Hypothesis** 等性质测试工具的核心杀手锏：**策略生成器（Generators）+ 智能反例缩减（Shrinking）**。
      - card:
          title: 策略生成器（Generators / Strategies）与边界偏置
          body: |
            以 Python 主流库 **Hypothesis**（`@given(st.lists(st.integers()))`）为例，生成器不是傻傻的均匀真随机：
            - **聪明偏置生成**：它会刻意提高**空列表 `[]`、仅含 `1` 个元素、`0`、负数、极值、大量重复项 `[1, 1]`** 等“历史捉虫高发区”的抽中概率；
            - **定制契约输入**：可以用 `st.integers(min_value=1, max_value=100)` 组合构造任意嵌套字典、合法日期甚至正整数三元组，严丝合缝扣进前置合法前提（`assume()`）。
      - card:
          title: 反例缩减（Shrinking）与可重现历史种子数据库
          body: |
            找到一个失败例子后，两项贴心工程机制让性质测试彻底融入日常 CI：
            - **缩减（Shrinking）**：找到一个长 20 行的乱序失败样本后，Hypothesis 自动尝试二分删除元素与调小数字，只要新样本照样能触发同一处崩溃/断言错就继续往下缩——最后报告给你的往往是干净极简的 **`xs = [1, 1]`** 或 **`x = 0`** 这种完美最小 **反例**。
            - **自动记忆回放（Example Database）**：框架会把每次抓到过的最小失败反例默默记进本地缓存数据库，下次修好再次跑测试时**第一时间优先重跑那些曾经踩死过你的历史反例**，防止随机波动逃过复查。
      - item:
          id: q-shrinking-meaning
          type: choice
          prompt: 当 Python `Hypothesis` 性质测试在随机探索中用输入 `[4123, -891, 992, 4123, 77]` 触发了 `bad_sort`（丢掉重复项的错实现）失败之后，最终打印输出在开发者屏幕上的 `Falsifying example` 往往直接变成了极简的 `xs=[0, 0]` 或 `[1, 1]`。这一过程叫什么，工程意义是什么？
          options:
            - text: 这叫反例缩减（Shrinking）；它通过反复删减无关要素与缩小数值同时检验错误仍旧复现，把冗长带噪的随机输入精炼成人类一秒就看穿病根的最小反例（立刻看出“哦。有两个相同元素就挂了。”）
              correct: true
            - text: 这叫数据压缩失真，因为框架搞丢了原来所有的测试断言
              why: 被保留下来的最小反例 `[0, 0]` 照样实打实触发了同一个失败断言，且剥掉了 90% 无关杂音
            - text: 这是因为框架把失败的列表强行改成了肯定能通过的列表来骗过检查
              why: Shrinking 在每试探一步缩小都会真实重跑一次测试函数——只有新小样本**依然失败**才会被采纳保留，绝不会把失败改绿。
          explain: 如果没用过 Shrinking，面对一个带 80 个字段的冗长随机失败报告会很难定位问题；有了 Shrinking 每次拿到的就像专家亲手挑好的最小教学反例。
      - card:
          title: 例题：用 Hypothesis 风格的生成器与缩减跑通 `bad_sort(xs) = sorted(set(xs))` 捉虫全过程
          body: |
            假设在 Python 中给 `bad_sort` 写下性质测试：`@given(st.lists(st.integers())) def test_sort_keeps_elements(xs): out = bad_sort(xs); assert len(out) == len(xs)`。观察测试运行三幕戏：
          reveal:
            - title: 第 1 步：策略生成——框架先快速试空列表、单元素，接着发出包含重复整数的列表
              body: 对 `[]` 和 `[5]`，`sorted(set(xs))` 蒙混过关。但就在不到第 10 轮生成里，生成器顺手造出一条带重复值的列表例如 `[42, -7, 42, 100]`。`bad_sort` 一运行吐出长度 `3` 的列表，立刻触发 `assert 3 == 4` 抛 `AssertionError`。
            - title: 第 2 步：缩减精炼——从 `[42, -7, 42, 100]` 砍成最小清晰反例 `[0, 0]`（或 `[1, 1]`）
              body: "缩减器开始试错：删掉 `100` 变成 `[42, -7, 42]` → 长度 `2 != 3` 依然挂。删掉 `-7` 变成 `[42, 42]` → 依然挂。把 `42` 往小压成 `0` 得到 `[0, 0]` → 依然挂。再试删掉其中一个 `0` 成 `[0]` → 突然过了。于是确认不能再少，精确报告：**`Falsifying example: test_sort_keeps_elements(xs=[0, 0])`**。"
            - title: 第 3 步：同时固定可复现例子放进单元测试做回归防线
              body: 拿到这么漂亮的最小反例后，不仅 Hypothesis 数据库会自动存着它下次先复检，工程师还顺手把 `@example([1, 1])` 显式加在函数头上永久固定下来，哪怕将来随机策略换参数也不会漏过 `[1, 1]`。
      - item:
          id: q-hypothesis-example-replay
          type: choice
          prompt: 使用随机性质测试时，很多人担心一个现实痛点：“如果今天随机生成的第 842 个奇怪用例把我的代码抓崩溃了，明天同事在我机器或 CI 上重跑时随机没摇中那一粒种子，不就变成‘时好时坏’抓不稳了吗？”现代性质测试框架（如 `Hypothesis`）是怎么解决这个可复现难题的？
          options:
            - text: 一方面自动执行反例缩减并把历次抓获的失败反例持久化写进示例库下次优先必跑；另一方面自动记录这次运行的复现种子（`@seed` / `@example`），随时保证 100% 确定性重现那次失败
              correct: true
            - text: 一遇到随机抓出来的 BUG 就直接无视放弃不再报错
              why: 抓住随机反例是最珍贵的战果，框架会立即锁住精确复现方式并持久化该反例直到修复通过为止
            - text: 从一开始强制关掉所有生成器，一辈子只准固定输入数字 `1`
              why: 兼得“宽广随机探索新盲区”和“一旦抓到反例就精确缩减加固定必跑回放”，才是性质测试既灵活又稳定的正确打开方式
          explain: 随机生成负责“拓荒抓未知 BUG”，缩减 + 示例库/种子负责“抓到以后就牢牢钉死永不再犯”。
      - item:
          id: q-hypothesis-concepts-match
          type: match
          prompt: 把 **Hypothesis** 性质测试流程中的四个关键机制与它们各自负责的环节对应匹配。
          pairs:
            - ["**Strategies（策略生成器）**", 按类型边界与偏置构造大量合法随机输入（高频探空值、`0`、负数与重复元素）]
            - ["**Falsifying Example（反例）**", 成功触发你写下的通用不变式 `assert` 失败的那个具体违约输入组合]
            - ["**Shrinking（反例缩减）**", 把触发失败的庞大随机输入不断删元素并减数值，提炼成依然会失败的极简可读最小样本]
            - ["**`@example(...)` 与重现种子记录**", 把性质测试抓到的珍贵历史反例永久钉死进每次必跑的确定性回归集里]
          explain: 策略生成器造输入，失败时给出反例，再缩减成最小样本，最后用 `@example` 把它钉进回归测试：这就是 Hypothesis 的完整工作流程。

  - id: property-lab
    chapter: 性质测试
    title: 有状态测试、蜕变测试（Metamorphic）与示例+性质结合实战
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 假设我们在测试一个复杂的地图路径搜索引擎或一个包含“存入、取款、转账”的完整状态机对象：根本**没有**现成的极慢老参考版本给你直接对拍答案，也不知道随机几千行图里的精确最短距离到底是多少——只知道“如果我把某条路的长度全乘以 2，算出来的最短路径总长也**必定**精准变为原来的 2 倍。”或者“把一个列表正着传、再打乱次序重传给我的统计汇总，总和和最大值绝不能变。”这种**不用提前知道标准答案，靠改变输入看输出随动规律抓错**的奇思妙想叫什么？
          options:
            - text: "蜕变测试（Metamorphic Testing） 与 有状态性质测试（Stateful Testing）。哪怕面对没有现成正确答案的复杂搜索/科学计算/多步操作状态机，照样能精准揪出隐蔽 BUG。"
              correct: true
            - text: 这纯属无聊废话，测试永远必须先把真实答案手工提前手算出来才准测
              why: 遇到机器学习、图导航搜索、仿真物理或大型数据库等“极难先手算真值（Oracle Problem）”的场景，蜕变关系与状态模型对拍恰恰是目前最强的测试方法。
            - text: 只要不用随机操作序列，所有多步骤状态机器全都永远不会出错
              why: 状态机的崩溃恰恰极少发生于第 1 步正常调用，而发生在随机“打开 → 取消 → 重试 → 撤销 → 再打开”错综复杂的交互序列里。
          explain: 没有现成答案时，可以检查“输入这样变，输出应该那样变”（蜕变测试），或者拿一个简单的模型和真实实现跑同一串操作来对比（有状态测试）。这一课讲 **有状态模型对比** 与 **蜕变关系检验**。
      - card:
          title: 有状态性质测试：随机操作序列对比简单模型（Stateful Testing）
          body: |
            很多 Bug 藏在多步骤前后顺序交织里（比如先 `put(k, 1)` → `delete(k)` → 再 `put(k, 2)` 触发了哈希墓碑满槽死循环）。**有状态性质测试**怎么抓？
            - **随机操作脚本生成器**：让框架随机发一串连续长短不一的调用动作序列（如 `add`、`remove`、`update`）；
            - **与极简权威模型对照（Model-Based Oracle）**：一边往你写的复杂高速缓存/索引结构执行操作，一边同时在旁边一个绝对简单无BUG的普通 Python 内置 `dict` 模型上做同款动作——每一步之后强制断言：**复杂数据结构查出来的状态和简单 `dict` 一模一样。**
      - card:
          title: 蜕变测试（Metamorphic Testing）与例证+性质结合
          body: |
            如果根本连简单 `dict` 模型都没有（例如大搜索引擎、路径规划、图像识别模型），就靠 **蜕变关系（Metamorphic Relations）**：
            - **搜索增删不变/收缩包含关系**：多搜一个 `AND` 限定词，命中结果数绝不会反过来变多（`count(A AND B) <= count(A)`）；把文本整体翻转或重命名变量后，核心行为按预期等变。
            - **例证与性质双剑合璧**：手工例子（如 `@example((1, 2, 3))`）清晰表达文档与特定已知边缘；性质测试随机扫描大空间补全人类想不到的死角。
      - item:
          id: q-stateful-model-match
          type: choice
          prompt: 某工程团队自己用 Cython/Python 从零写了一套带紧凑槽位、动态再散列与墓碑清理的高速哈希映射表 `FastMap`。为了彻查“反复插入、删除、再插入引发墓碑占满漏槽或丢键”的诡异多步时序漏洞，采用 **有状态性质测试（Stateful Property Testing）** 最稳妥的做法是什么？
          options:
            - text: 让框架随机生成几百步穿插进行的 `set / delete / get` 操作序列，同时向待测 `FastMap` 和一个作为基准模型的内置标准 Python `dict` 同步发相同命令，并在每一步后断言两者的查询返回值及所有键值对集合严格相等
              correct: true
            - text: 只手工写 1 行 `m.set('a', 1); assert m.get('a') == 1` 就直接上线
              why: 哈希表最惨重的漏洞（墓碑覆盖错误、扩容半途丢键、删空桶后再查死循环）几乎全部只会在连续几十步插删交替之后才爆发
            - text: 禁止测试框架对同一个表连续做两次以上的修改操作
              why: 有状态测试的核心威力正是把原本要手写上百句排列组合的状态转移 sequence 自动随机枚举并自动缩减成最短失败序列。
          explain: "**“复杂高性能被测实现 vs 朴素内置标准模型 + 随机操作序列 + 自动 Shrinking”**，能抓出连资深专家都看瞎眼的多步骤隐藏状态 BUG。"
      - card:
          title: 例题：没有标准答案时，用“蜕变关系”一秒测出复杂搜索引擎与算账组件故障
          body: |
            假设在测一个没有标准离线参考集的大规模商品全文搜索引擎 `search(query)`，怎么用两招 **蜕变测试** 不算出具体商品清单却立刻抓出检索大 BUG？
          reveal:
            - title: 第 1 步：构造收缩子集包含关系——`len(search("蓝牙 降噪")) <= len(search("蓝牙"))`
              body: 业务规则是空格代表 `AND`（必须同时包含两个词）。于是根本不用自己把百万件商品先人工看一遍：只要随便随机生成两个词 `"蓝牙"` 和 `"降噪"`，如果加严条件搜出来的商品总数居然比只搜 `"蓝牙"` 还要**多**，或者搜两个词的结果居然有一项根本不在单搜 `"蓝牙"` 结果里——100% 证明分词、倒排求交集或过滤条件有致命大 BUG。
            - title: 第 2 步：对“打乱输入列表顺次（乱序无关操作）”或“汇率同比例缩放”测等变性
              body: 同样，如果一个汇总接口接收一批无序订单计算总销售额，先把订单列表用随机顺序打乱成 `shuffled`，断言 `summarize(shuffled) == summarize(orders)`；若是定价函数汇率全部翻倍乘 2，总价精确翻倍——零参考标准表照样抓出偷偷依赖输入排序甚至暗改状态的邪门漏洞。
            - title: 第 3 步：同时给性质测试钉上几个具体的 `@example` 案例
              body: 比如测试三角形或者解析器时，随机生成器很擅长产生奇怪字符，但也记得手动用 `@example((1, 2, 3))` 钉住需求规定的核心边界——既有具体可读示例当活文档，又有性质随机网扫盲区，做到万无一失。
      - item:
          id: q-metamorphic-search-example
          type: choice
          prompt: 使用 **蜕变测试（Metamorphic Testing）** 检验一个电商全文搜索引擎（其中多词查询空格表示 `AND` 同时包含）。我们在根本不知道全库具体该匹配出哪几百件商品的情况下，下面哪一条蜕变属性一旦违反就直接证明引擎代码存在缺陷？
          options:
            - text: 加入更严格的 `AND` 过滤词后返回的结果集合，不仅数量超过了原宽松查询（即出现 `len(search("手机 黑色")) > len(search("手机"))`），甚至包含原本搜索 `"手机"` 时根本没出现的商品。
              correct: true
            - text: 当搜索条件多加了一个限制词之后，搜出来符合条件的结果变少了
              why: 加严 `AND` 筛选门槛后命中结果集只能缩小或至多保持不变，这是完全正常合法的逻辑。
            - text: 不同搜索词 `search("手机")` 与 `search("西瓜")` 返回了完全不同的商品列表
              why: 不同品类查询本来就应该返回各自对应的商品集合
          explain: 在无法提前穷举“绝对答案”的 AI 模型、搜索引擎、推荐系统与复杂物理仿真里，**蜕变关系（加严必缩减、比例同放大、等价乱序不变）** 是极其珍贵的自动化验收手段。
      - item:
          id: q-combine-example-property
          type: choice
          prompt: 既然 **性质测试** 能自动跑上百个随机生成样本，为什么专业测试套件依然**坚持保留少量手工挑选的典型示例测试**（如 `@pytest.mark.parametrize` 示例与 `@example`）？
          options:
            - text: 清晰的手工示例是最好的可读活规格文档、能精确钉死极其狭窄的特定单一边界点（如精确退化 `(1, 2, 3)` 避免纯粹随机极难抽中窄点），两者互补结合威力最大
              correct: true
            - text: 因为随机生成器规定绝对不允许测试超过 2 个字符的输入
              why: 随机生成能跑非常多维复杂样本，问题在于极狭窄特定值（例如恰巧 `a + b == c` 的整数等式点）在广域三维随机整数里极难靠撞大运撞上。
            - text: 因为写了示例测试就会自动取消全部随机测试运行
              why: 像 Hypothesis 中的 `@example(...)` 装饰器会让框架**先必跑完手工指定例，紧接着再展开数百轮随机搜索探索**，完美合一。
          explain: 一句话总结：**手工示例负责“精准定点打击狭窄边界 + 写出人能秒懂的契约文档”；性质测试负责“全自动广域拉网 + 发现你想都没想到的状态/序列反例”。**

  # ======================================================================== 覆盖率
  - id: line-coverage
    chapter: 覆盖率
    title: 语句覆盖率、Code Coverage 真相与误用警示
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一家外包团队骄傲地交差：“老板放心。我们全套系统的 **语句覆盖率** 工具跑出了 **100.0%**，每一行代码都至少执行过一遍啦。”结果上线第一天就在核心计算上崩得稀里哗啦。检查他们的测试源码一看，里面居然只用了一行断言都没认真写或者全是走过场：`test_all()` 只是调用了函数却完全没有用 `assert` 校验返回值正误。为什么光看“100% 语句覆盖率”会带来致命虚假安全感？
          options:
            - text: 覆盖率只告诉你“测试运行期间有哪些代码行根本没跑到过”，它绝不能证明“跑过的代码一定被正确断言检查了、也没漏掉关键分支/条件和边界”。一个连 `assert` 都没写或漏掉关键边界的测试一样能刷出 100% 语句覆盖。
              correct: true
            - text: 因为语句覆盖率达到 100% 时代表电脑会自动把所有潜在缺陷全修掉
              why: 覆盖率度量的是**代码行被踩到过几遍（彻底度检查）**，而不是断言写得对不对或输入边界挑得齐不齐
            - text: 因为法律规定代码覆盖率最高只能达到 50%
              why: 高覆盖率（尤其是识别哪里还一片空白彻底没测到）很有参考价值，关键是不能把覆盖率数字本身当作唯一考核 KPI 去刷假分数
          explain: 覆盖率只说明哪些代码在测试时跑到过，不说明跑过的代码被正确检查了。这一课学 **语句覆盖率（Statement Coverage）** 怎么算，并记住：覆盖率用来找盲区，不是质量证书。
      - card:
          title: 什么是语句覆盖率（Statement Coverage）与计算算术
          body: |
            - **语句覆盖率** = `(测试中至少被运行过 1 次的可执行语句数 ÷ 全文件有效可执行语句总数) × 100%`（注意不含空行、注释）。
            - **例算**：函数共有 `5` 行可执行语句，跑过 `4` 行，语句覆盖率 = `4 / 5 = 80%`；共有 `8` 行跑过 `6` 行得 `6 / 8 = 75%`（同样 `9 / 12 = 75%`、`8 / 10 = 80%`）。
            - 注意观察：单凭一个输入 `(1, 1)` 穿过 `if a > 0 and b > 0: do_work()` 的真分支内部语句，就能拿到这段代码的 **100% 语句覆盖率**——可那个没走进去过的 **假（False）分支** 究竟行为对不对？一句没测。
      - card:
          title: 怎么正确看待“代码覆盖率”
          body: |
            Google 的工程实践总结了覆盖率工具的正确用法与四大盲区：
            - **真正价值是“照出阴暗盲区”**：一眼标红哪些核心错误处理分支、异常恢复线从头到尾一次都没执行过；
            - **四个大盲区**：① **没有写有效 `assert`（空跑刷分）**；② **单靠 `if` 跑通正路线，完全漏掉隐含假 `else` 分支**；③ **复合条件内部短路线组合漏测**；④ **根本没写的防御逻辑（如忘了检查 `credits > 0` 或 `x + y <= z` 少等号）在覆盖图里完全看不见**。
      - item:
          id: q-stmt-coverage-calc
          type: number
          prompt: "某核心计费函数经过统计共有 `12` 条有效可执行程序语句，目前已编写的单元测试全部运行一遍后，代码覆盖率工具检测到共有 `9` 条语句至少被执行过一次。当前该函数的 **语句覆盖率** 是百分之多少？（填入百分号前的整数，如 `75` 代表 75%）"
          answer: 75
          explain: "`9 / 12 = 3 / 4 = 75%`。（同理 `6 / 8 = 75%`、`4 / 5 = 80%`、`8 / 10 = 80%`。）紧接着应该打开覆盖高亮报告看清楚剩下的 3 条究竟是不是重要的异常兜底分支，针对性补上用例。"
      - card:
          title: 例题：为什么把 `classify_triangle` 的覆盖率测到 100% 语句覆盖，却还是放过了 `x + y < z` 缺等号漏洞？
          body: |
            看这组只有 4 个平凡输入的小测试集：`[(3, 3, 3), (2, 2, 3), (2, 3, 4), (1, 2, 5)]` 传入带漏洞函数 `if x + y < z: return "非法"`：
          reveal:
            - title: 第 1 步：这 4 个用例把每一条 `if` 和 `return` 全部踩到了，语句覆盖率高达 100%
              body: "数一遍路径：`(1, 2, 5)` 踩中了 `if x + y < z: return \"非法\"`；`(3, 3, 3)` 踩中 `\"等边\"`；`(2, 2, 3)` 踩中 `\"等腰\"`；`(2, 3, 4)` 踩中 `\"不等边\"`。如果算最前面的负边检查也加一个 `(-1, 2, 3)`，全函数每一行、甚至每一个真/假分支的语句覆盖率都是亮闪闪的 **100%**。"
            - title: 第 2 步：可是遇到真正退化边界 `(1, 2, 3)` 时，带漏洞 `< z` 函数当场报错漏算
              body: 为什么 100% 语句覆盖和 100% 分支覆盖依然放走了那个少写的等号 `=`？因为覆盖率工具只会核对“**现有的这段语句跑过没有**”，它看不见“把 `<=` 错写成了 `<`”这一步临界值偏差。只有配合黑盒**边界值 `(1, 2, 3)`** 与**源码小改动反查检验**，才能把 100% 覆盖也抓不到的等号缺失找出来。
      - item:
          id: q-goodhart-coverage-trap
          type: choice
          prompt: 某团队为了冲刺“全公司单元测试 **语句覆盖率** 不低于 95%”的硬性考核，工程师在最后一天把所有只调用函数、甚至把 `assert` 断言全注释删光的“只执行不校验”空壳测试塞了进去，果真冲到了 96% 绿标。这个现象说明了什么道理？
          options:
            - text: 覆盖率一旦沦为盲目攀比的数字指标就会诱发无意义刷分（没有断言照样高覆盖）；覆盖率只能作为辅助寻找完全未测盲区的诊断探照灯，绝不能单独等同于测试质量高低。
              correct: true
            - text: 只要语句覆盖率到了 96%，就算删掉全部 `assert` 断言系统照样 100% 没有缺陷
              why: 删掉 `assert` 只证明代码跑了一遍没当场抛语法崩溃，哪怕把加法算成减法也根本无人拦阻。
            - text: 应该在公司里彻底封杀所有覆盖率报告工具，永远都不准看哪段代码没测到
              why: 正确用法是合理利用覆盖率工具高亮**未经检查的空白高危区**（尤其是关键分支与错误处理路径），但不能把高数字当免死金牌
          explain: 记住：高覆盖率只是好测试套件的必要参考信号之一，**绝不是充分条件**（要看有效断言 + 边界 + 分支/条件严格程度 + 变异杀死率）。
      - item:
          id: q-if-without-else-trap
          type: choice
          prompt: "看这短短 3 行 Python 代码：`x = val\nif adjust:\n    x = x + 1\nreturn x`（注意这里 `if` 后面没有写 `else:`）。如果你仅写了 **1** 个用例传 `adjust=True` 跑了一遍，请问这句话的 **语句覆盖率** 是多少，还隐含漏掉了哪一条？"
          options:
            - text: 仅靠这 1 个 `adjust=True` 用例就拿到了 100% 语句覆盖率（因为 3 行全走过了），但它彻底漏测了隐含的 `adjust=False` 假跳过分支。
              correct: true
            - text: 语句覆盖率只有 50%，必须再写一个 `else:` 才算全
              why: 因为这 3 条语句都在那 1 次 `adjust=True` 走通顺流下来全部执行过一遍，按**语句数**算就已经是 `3/3 = 100%`——这正是为什么还需要**分支覆盖率**。
            - text: 漏掉了 `adjust=True` 那一行没有执行到
              why: 传 `adjust=True` 时 `x = x + 1` 被执行了，反而是 `adjust=False` 直接跳过那句不加 1 的另一半岔路口一次也没检验过
          explain: 你一眼就发现了单看语句覆盖的最大硬伤：**没有写出来的隐含 `else` 走空分支，语句覆盖率工具彻底瞎眼看不见。** 要用 **分支覆盖** 检查每个判断的真假两边都走过。

  - id: branches
    chapter: 覆盖率
    title: 分支覆盖、真实短路求值下的分叉子条件各自真假与 MC/DC
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 看一句再常见不过的 Python / C++ 条件判断：`if a > 0 and b > 0:`。一位同事挑了两个测试输入 `(1, -1)` 和 `(-1, 1)`，理直气壮地说：“你看，第一个用例让 `a > 0` 为真、让 `b > 0` 为假；第二个用例让 `a > 0` 为假、让 `b > 0` 为真。每个条件我都测过了真和假，所以 `if` 的**分支覆盖**也一定早满了。”他的推理哪里出了两个大漏洞？
          options:
            - text: ① 这两个输入下整个 `and` 表达式结果全都是 `False`，`if` 里头的真分支体一句都没进入过（分支覆盖率才 50%）；② 更要注意在 Python/C 等带短路求值的语言里，传 `(-1, 1)` 时由于 `a > 0` 已经为假，根本压根没运行求值 `b > 0`。
              correct: true
            - text: 两个输入让整个表达式一次返回了真、一次返回了假，没有任何漏洞
              why: 动手算算：`1 > 0 and -1 > 0` → `False`；`-1 > 0 and 1 > 0` → `False`。真分支一次也没进去。
            - text: 因为 Python 规定 `and` 两边永远绝对不允许传入负数 `-1`
              why: 负数完全合法；核心漏洞是**分叉子条件各自真假不一定蕴含分支覆盖**，而且分析分叉子条件各自真假必须考虑语言的**真实短路（Short-Circuit）求值行为**。
          explain: 这一课精准拿下测试工程最核心也最容易考混的四层白盒准则：**语句覆盖 → 分支覆盖 → 分叉子条件各自真假（含真实短路审计注记） → MC/DC**。
      - card:
          title: 四阶白盒准则逐层加码
          body: |
            看着这一行判断：`if a > 0 and b > 0:`，四级门槛一个比一个狠：
            - **语句覆盖（1 个例）**：如 `(1, 1)` 跑进 `if` 主体即可（不测假岔路）；
            - **分支覆盖率**（判定覆盖，2 个例）：整句真假两条岔路全走过，如 `(1, 1) → True` 与 `(-1, 1) → False`（此时 `b > 0` 只取过一次真）；
            - **条件覆盖**：每个子条件都取过真假；**注意 `{(1, -1), (-1, 1)}` 两例全算出 `False`，证明条件覆盖不保分支全过。**（若遇短路求值见下卡）；
            - **MC/DC**：最严谨工业级准则——既 cover 全分支/子条件，又能为每个子条件找到单独翻转它就改变整句结果的“独立影响对”。
      - card:
          title: 极其关键的求值细节：真值表 vs 短路求值执行轨迹（Python 实测）
          body: |
            许多教材直接按逻辑真值表看 `(-1, 1)` 时以为“`b > 0` 也顺便被测了一次真（True）”。在 Python、C、JavaScript 等带 **短路求值（Short-Circuit）** 的语言里，实际情况是什么（看实测的 `log` 记录）？
            - `(1, 1)`：先算 `a > 0` 为 `True`，**接着真正求值 `b > 0` 得 `[True]`**，总结果 `True`；
            - `(1, -1)`：先算 `a > 0` 为 `True`，**接着真正求值 `b > 0` 得 `[False]`**，总结果 `False`；
            - **`(-1, 1)` 和 `(-1, 2)`**：一上来 `a > 0` 为 `False`，`and` **当场短路直接结束。`b > 0` 一次也没有执行（记录为空 `[]`）。** 所以实际上 `(1, 1)` + `(1, -1)` + `(-1, 1)` 才真正执行到了 `a>0` 与 `b>0` 各自的实际真假并同时达成 **MC/DC**。
      - item:
          id: q-mcdc-3-cases-ex3
          type: choice
          prompt: 对条件 `if a > 0 and b > 0:`，按真实 Python 的 **短路求值** 运行记录：以下哪组仅包含 **`3` 个**测试输入却完整达成了最严格的 **MC/DC** 覆盖（也同时全满足语句、分支和真实条件覆盖）？
          options:
            - text: "`{(1, 1), (1, -1), (-1, 1)}` —— `(1,1)` 与 `(-1,1)` 单独翻转 `a>0` 改总结果；`(1,1)` 与 `(1,-1)` 单独翻转 `b>0` 改总结果，且实际都真实求值了各自条件"
              correct: true
            - text: "`{(1, -1), (-1, 1)}` 共 2 个用例就足够达成 MC/DC"
              why: 不仅两个用例全落入假分支（彻底遗漏了 `True` 分支），而且在短路求值下 `(-1, 1)` 压根没真正求值过 `b > 0`。
            - text: "`{(1, 1), (2, 2), (3, 3)}` 共 3 个用例"
              why: 这三个用例一模一样全让 `a>0` 为真、`b>0` 为真、总结果为真，根本没走进假分支也不存在翻转任何子条件的对比对
          explain: 记死公式：对于 `n` 个独立原子条件且无重复变量的基本布尔式，**MC/DC 最小所需用例数通常恰好是 `n + 1` 个**（这里 `n = 2` 个子条件 → `2 + 1 = 3` 个用例。远低于真值全排列指数 `2^n`，却抓力极强，常用于航空与安全关键软件认证）。
      - card:
          title: 例题：用 `check_b()` 记录器拆穿 `{(1, -1), (-1, 1)}` 的假象
          body: |
            写一个会留下求值脚印 `log` 的检查函数：`(a > 0) and check_b()`。把四组数据输进去跑一圈看看实际发生了什么：
          reveal:
            - title: 第 1 步：只跑 `{(1, -1), (-1, 1)}` 时，`True` 分支执行次数 = `0`，`b > 0` 的 `True` 也没测到
              body: 跑 `(1, -1)` 时 `a > 0` 为真，于是进入 `check_b()` 记下 `[False]`；紧接着跑 `(-1, 1)` 时 `a > 0` 一算直接为假，`and` 瞬间短路跳走，`check_b()` 根本没机会执行，返回 `(False, [])`。结果不仅整个 `if` 内部语句一行没进（`cc_outputs == [False, False]`），甚至在运行轨迹里 **`b > 0` 从头到尾连一次实际 `True` 都没有测过**。
            - title: 第 2 步：加上 `(1, 1)` 凑成 3 元组 `[(1, 1), (1, -1), (-1, 1)]` 后全绿贯通
              body: 跑 `(1, 1)` 时进入 `check_b()` 记下 `[True]`，同时第一次跑进 `if` 的 `True` 分支体。接着拿它分别跟 `(-1, 1)` 配对独立验证 `a > 0` 改总判定，跟 `(1, -1)` 配对独立验证 `b > 0` 改总判定——只需区区 `3` 个用例，语句、分支、实际条件求值和 **MC/DC** 四关全过。
      - item:
          id: q-cc-does-not-imply-dc
          type: choice
          prompt: "团队评审测试集时发现，针对 `if a > 0 and b > 0: process()` 只有两个测试用例 `(1, -1)` 和 `(-1, 1)`。按照真值表，有人误以为“两个条件真假都有覆盖”。实际上这组 2 个用例存在什么严重覆盖缺陷？"
          options:
            - text: 两例的表达式总结果全都为 `False`——整块 `process()` 真分支语句 `1` 次也没跑过（分支覆盖仅有 50%），证明只按真值表做条件覆盖并不蕴含分支全覆盖，且短路语言里 `(-1, 1)` 甚至连 `b > 0` 都没有真正执行到
              correct: true
            - text: 这组 2 个用例已经达成了 100% 语句覆盖和 100% 分支覆盖
              why: "`(1>0 and -1>0)` 是 `False`，`(-1>0 and 1>0)` 也是 `False`。`process()` 一句没执行，真分支覆盖为 0%。"
            - text: 问题出在必须把 `and` 改成 `+` 号才能测分支覆盖
              why: 逻辑与 `and` 是正常业务判断，只需把缺少的全真用例 `(1, 1)` 补进测试集即可补齐分支与 MC/DC。
          explain: 记死这张典型对比考题：`{(1,-1), (-1,1)}` 完美说明为什么必须查 **分支（判定）+ 真实短路条件 + MC/DC**。
      - item:
          id: q-mcdc-independent-pair
          type: choice
          prompt: 在 **MC/DC（修改条件/判定覆盖）** 验收标准里，“每一个原子子条件都必须能独立决定整个复合判定的最终结果”这句话具体是指怎样挑选对照测试用例对？
          options:
            - text: 对于每个子条件 $C_i$，测试集中必须存在一对用例，在这两个用例里其余全部子条件取相同结果，唯独 $C_i$ 自己从真翻成假时，导致整个大判定表达式也随之在真和假之间发生翻转（短路下另一无关后续可短略未执行，而核心前置真假对照明确）
              correct: true
            - text: 每次把全部 10 个子条件同时一锅端全部反过来翻一遍
              why: 如果一次同时把 `a>0` 和 `b>0` 全翻转（如对比 `(1, 1)` 和 `(-1, -1)`），最后结果虽然变了，却根本分不清到底是因为 `a` 生效还是 `b` 生效（哪怕程序员写丢了 `&& b > 0` 也查不出来）
            - text: 只用永远返回 `True` 的一个测试用例重复跑 100 次
              why: MC/DC 需要清晰构建出能够隔离验证每个单子条件独立生效的极简 `n + 1` 对比链
          explain: 拿 `(1, 1)` 和 `(-1, -1)` 同时翻转两项就测不出 `if a > 0:` 是否漏掉了 `b > 0`；只有把 `(-1, 1)` 拿来与 `(1, 1)` 单项对照、再拿 `(1, -1)` 与 `(1, 1)` 单项对照，才叫无懈可击的 **MC/DC**。

  - id: paths
    chapter: 覆盖率
    title: 路径覆盖、插桩（Instrumentation）原理与读懂 JaCoCo 报告
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 覆盖率统计软件（比如 Python `coverage.py` 或 Java `JaCoCo`）是如何准确统计出我们跑完测试后，代码里“第 14 行跑了 3 次、第 22 行 1 次也没跑到、第 8 行的 `if` 只有真分支走通假分支没走过”的？难道它拿肉眼盯在旁边看吗？
          options:
            - text: 靠 插桩（Instrumentation）——在装载或加载待测程序运行前，工具在每块语句块与每个分支转折点悄悄安插一个计数记录探针；测试跑完再汇总各个探针被踩中了几次出报告。
              correct: true
            - text: 覆盖率工具靠猜文件名长度直接算个平均随机百分比显示出来
              why: 现代覆盖工具实打实依靠执行期插桩或运行时行/分支追踪回调精确计数每一条基本块命中情况
            - text: 因为 Python 代码规定如果不测到 100% 路径就会原地自己报语法错崩溃
              why: 没装或没启用覆盖率追踪插桩时，测试照样静默跑通不会报错也不会统计哪行没踩到
          explain: 本课看透覆盖率最深层（**路径覆盖组合陷阱**）和工具落地的引擎秘密（**插桩** + 如何理性读覆盖报告）。
      - card:
          title: 路径覆盖（Path Coverage）与“循环带来的组合爆炸”
          body: |
            如果函数里有两段接连串在一起的独立判定：`if c1: ...` 紧跟 `if c2: ...`。分支覆盖只需 `2` 条全走完各自真假即可（如全真 + 全假）；可这两段总共其实能组合出 **`2 × 2 = 4` 条不同完整执行路径**（TT、TF、FT、FF）。

            **路径覆盖**要求走通程序从入口到出口的每条可行路径。**现实天花板**：一旦代码里有一个走 0..20 次的 `for` 循环叠加几个 `if`，可能路径瞬间飙上 **数百万乃至天文数字**——因此现实工程中很少要求“100% 任意全路径”，多采 **MC/DC** + 关键边界组合路径。
      - card:
          title: 插桩（Instrumentation）原理与看懂覆盖率报告
          body: |
            覆盖率工具怎么抓到你的执行足迹？靠 **插桩**：
            - **源码或中间代码插桩（如 JaCoCo / coverage.py 跟踪）**：在程序加载执行前，往每个基本顺序块、函数入口、分支跳转边插入轻巧极快的记录探针（就像给高速公路每个匝道装计步器）；
            - **读懂覆盖率报告（绿/黄/红）**：全行加各分支全跑过标**绿**；这行执行到了但其中一个分支（或条件）从没走过标**黄（部分覆盖）**；整块从来没执行到标**红**——开着覆盖高亮一眼就抓住遗漏的黄红隐患区。
      - item:
          id: q-branch-vs-path-explosion
          type: choice
          prompt: "某函数顺序写了 `3` 个彼此独立的 `if` 块（即 `if c1: ...; if c2: ...; if c3: ...`，均无互锁或早退返回）。若分别要求达成 **100% 分支覆盖** 与 **100% 完整路径覆盖**，最少各自需要几条测试用例？"
          options:
            - text: "分支覆盖只需 `2` 条（一条走通全真 `(T, T, T)`、另一条走通全假 `(F, F, F)` 即可盖满 6 个局部枝）；而 路径覆盖需要跑全 `2^3 = 8` 条 不同真假组合路径（一旦遇到 20 个 `if` 或循环即路径爆炸）"
              correct: true
            - text: 两者永远都需要完全相同的 `1` 条测试用例
              why: 单靠 `1` 条用例根本走不到每个 `if` 另一半分支，而串接多个 `if` 时不同组合构成呈指数上涨的完整执行路径
            - text: 分支覆盖需要 `1000` 条，而路径覆盖只需要 `1` 条
              why: 路径覆盖是最强最严的指列表合（`2^k`），远比只需要并列过真假的线性分支覆盖要求多得多
          explain: 看清了“分支覆盖 `2` 条 vs 路径覆盖 `2^k` 条（再逢循环趋于无穷）”这一数学鸿沟，就秒懂为什么现实工程里拿 **分支 + 关键交互路径 + MC/DC** 作实用妥协。
      - card:
          title: 例题：打开覆盖率高亮报告看到“第 18 行是黄色（部分分支覆盖）”，究竟该补什么测试？
          body: |
            一位同学跑完 `pytest --cov` 或 `JaCoCo` 报告看到一行代码写着 `if user.is_vip or order.total >= 200:` 在报告里赫然标成**黄色**（显示分支覆盖 `1/2` 或 `2/4`）。这是工具在提示你哪一件事漏掉了？
          reveal:
            - title: 第 1 步：黄色“部分覆盖”精准指出这一行虽运行过，却有一半岔路口或短路侧一次都没跑
              body: 比如之前所有用例恰好全都用普通大额订单 `total >= 200` 跑过了 `True` 这一侧（所以这行确实“被执行了”，不是红色），导致 `user.is_vip == False 且 order.total < 200` 走 `False` 那半边，或者 `user.is_vip == True` 让左边直接触发短路的那半边**完全没有出现过**。
            - title: 第 2 步：对照插桩分支计步器补齐漏网条件用例，让黄变绿
              body: 补充 ① VIP 小额订单 `(is_vip=True, total=50)` 与 ② 普通小额订单 `(is_vip=False, total=50)`，两项都写上明确的预期折后价格断言（绝不是不加断言空跑），立刻看到报告该行从警告黄转成踏实绿。
            - title: 第 3 步：同时警惕插桩自身在性能敏感测试上的影响
              body: 因为探针插桩会在每个分支和基本块多做几步计数记录，跑平时功能/单测影响极微（几毫秒），但千万别在开着插桩采集覆盖率的同时去测极致微秒性能压测——性能压测必须在关闭探针插桩的纯净发布形态下跑。
      - item:
          id: q-instrumentation-role
          type: choice
          prompt: 白盒覆盖率工具（如 Java 的 `JaCoCo` 或 Python `coverage.py`）背后的 **插桩（Instrumentation）** 技术具体是如何拿到精确覆盖信息的？
          options:
            - text: 在运行待测代码前自动往各个基本块入口和条件分支跳转路径注入轻量记录探针，在执行测试同时实时记录哪些块与分支真正运行过，结束后汇总输出覆盖比率
              correct: true
            - text: 把开发者所有的 `if` 分支全部自动删光改成直线代码
              why: 插桩绝对不能改写被测程序的原本业务判定语义与输出，仅以只写旁路计数器方式忠实采集走过的分支与语句轨迹
            - text: 只能靠工程师一边单步按键盘调试一边用纸笔手工打勾记录
              why: 自动化插桩探针在 CI 里随测试一起毫秒级默默完成统计，彻底取代手工清点
          explain: 如果你同时还在跑性能微调测试，记得关掉覆盖率插桩开关以免探针计时拖歪耗时数字。
      - item:
          id: q-coverage-hierarchy-order
          type: order
          prompt: 考虑通常情形下各白盒覆盖准则之间的包含严格强度关系（即满足更严格者通常更能揭示多分支/条件组合遗漏），请按覆盖约束从**最基础（最弱）到最严格组合（最强）**的常见顺序排列（假设不考虑无断言刷分且按严谨控制流看）。
          steps:
            - 语句覆盖率（仅保证可执行行至少各跑到 1 次，容易彻底漏过隐含 `else` 假分支）
            - 分支/判定覆盖率（保证每条 `if/else` 的整体真和假两条岔路都至少走过 1 次）
            - 修改条件/判定覆盖 MC/DC（要求每个原子条件能独立翻转并改变整体判定结果，兼顾可控用例数与强检验）
            - 完整路径覆盖（试图走遍全程序所有各段分支互相排列组合出来的全路径，极易随分支和循环数指数爆炸）
          explain: 覆盖率工具靠插桩统计哪些语句和分支跑过；路径的组合数会爆炸，所以覆盖报告要理性地读。


  # ======================================================================== 故障注入与质量评估
  - id: mutation
    chapter: 故障注入与质量评估
    title: 变异体测试与故障植入：反向考验你的测试套件
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 某团队自豪地宣布：“我们 `check_min_age(age)` 的单元测试拿到了 **100% 语句和分支覆盖率**。”结果审视测试源码后大吃一惊：测试只测了 `age=25`（返回 `True`）和 `age=10`（返回 `False`），既没测 `age=18`，甚至连 `assert` 都没写严。如果此时把源码里的 `age >= 18` 偷偷篡改成 `age > 18`，会发生什么尴尬？
          options:
            - text: 整套 100% 覆盖的测试依然全部通过；这说明覆盖率只记录代码被执行过，还需要故意注入小故障副本，检验测试断言能否把错误抓出来
              correct: true
            - text: 只要语句覆盖率到了 100%，无论怎样乱改大于小于号或删光断言，测试也绝不可能放过任何 Bug
              why: 覆盖率只统计“执行流有没有经过这一行”，哪怕测试根本不写 `assert` 或避开了边界等号点 `18`，改写 `>=` 为 `>` 照样全绿过关
            - text: 这说明应该删掉测试里的边界点 `18`，避免篡改代码时报错太麻烦
              why: 好的测试恰恰应该对边界等号点改动极度敏感——代码一改错，测试必须立刻亮红灯“杀死”错版本。
          explain: 这一课学两种“给被测程序打补丁造假虫，反查测试套灵敏度”的技术：**这种改码反查技术** 与 **故障植入（Fault Seeding）**。
      - card:
          title: 变异体与变异得分（Mutation Score）
          body: |
            只盯覆盖率容易出现“跑过却没断言死”的虚高假象。**变异测试（Mutation Testing）** 把枪口反过来瞄准测试本身：
            - **变异体**：工具在源码里只改动一处小语法（如 `>=` 改成 `>`、`+` 改成 `-`、反转布尔条件或删掉关键赋值），每改一处就是一个带人造缺陷的变异体。
            - **杀死 vs 幸存**：拿全套现有测试逐一去跑每个变异体——测试一旦挂掉报错，代表**成功杀死（Killed）**；测试依然全部通过并放过它，则该变异体**幸存（Survived）**。
      - card:
          title: 等价变异体、变异得分公式与故障植入对比
          body: |
            计算抓虫比例时，要先剔除“无论如何改写都与原程序数学行为完全一致”的**等价变异体**（如恒真条件里的冗余写法）。常见两类指标对比如下：
            - **变异得分（Mutation Score）**：`被杀死的非等价变异体数 / 非等价变异体总数`。得分越高，说明你的测试对细节改动越敏锐、断言越紧实。
            - **故障植入（Fault Seeding）**：工程师预先手工埋入一定数量已知人造缺陷来跑测试，根据抓出植入缺陷的比例反推程序里可能还潜伏多少真实未知缺陷。
      - item:
          id: q-mutation-score-math
          type: number
          prompt: 针对一个函数自动生成了 `5` 个变异体。经仔细人工核对后确认其中 `1` 个无论传入什么参数表现都与原程序完全一致，属于无法被任何外部输入区分的等价变异体，故按规则先剔除。剩余 `4` 个有效变异体拿全套测试去跑后，有 `3` 个使测试挂掉（被杀死），`1` 个让测试全绿漏过（幸存）。当前这套测试的 **变异得分** 是百分之多少？（填整数，例如 75% 填 `75`）
          answer: 75
          explain: 先排除 `1` 个等价变异体后，有效分母为 `5 - 1 = 4`；杀死了 `3` 个，故变异得分 = `3 / 4 = 75%`。如果某测试套原本 `4` 个有效变异体只杀死了 `1` 个（`25%`），补强边界断言后就该冲着拉高这个百分比去。
      - card:
          title: 例题：用三角分类边界 `(1, 2, 3)` 一剑杀死 `x + y <= z` 的变异体
          body: |
            假设我们测 `classify_triangle(a, b, c)`（先升序排列成 `x <= y <= z`），原函数用 `x + y <= z` 判定非三角形。如果只有 `(3, 4, 5)` 和 `(1, 2, 10)` 两条用例，面对把 `<=` 改成 `<` 的变异体 `M1` 会怎样？
          reveal:
            - title: 第 1 步：代入已有测试——`(3, 4, 5)` 与 `(1, 2, 10)` 全被变异体 `M1` 骗过
              body: 对 `(3, 4, 5)`：`3 + 4 = 7 > 5`，原函数和变异体都放行判 `"scalene"`；对 `(1, 2, 10)`：`1 + 2 = 3 < 10`，原函数和 `M1` 都判 `"invalid"`。全部通过，`M1` 顺利**幸存**。
            - title: 第 2 步：精准补入退化三边边界点 `(1, 2, 3)`——当场杀死 `M1`
              body: 对 `(1, 2, 3)` 而言，`1 + 2 == 3`：原程序命中 `x + y <= z` 正确返回 `"invalid"`；而变异体 `M1` 错写成 `x + y < z` 时 `3 < 3` 为假，居然把它错放行归类成 `"scalene"`。测试断言立刻报错，瞬间**杀死 `M1`**。
            - title: 第 3 步：同理对比另外常见变异（如删掉等边特判或改 `x == y` 为 `False`）
              body: 如果原本只测了 `(2, 2, 2)` 却漏测 `(2, 2, 3)` 或 `(2, 3, 3)`，改变等腰分支其中一侧条件的变异体也会幸存——因此黑盒边界测试与变异测试正好形成互补。
      - item:
          id: q-triangle-mutant-killer
          type: choice
          prompt: "针对 `classify_triangle(a, b, c)`（先升序排列成 `x <= y <= z` 且全为正整数）：原程序把 `x + y <= z` 判定为 `\"invalid\"`，而变异体 `M1` 被篡改成了 `x + y < z`。下列哪一条测试用例能**一眼杀死 `M1`**（即原程序判 `\"invalid\"` 而 `M1` 竟错误放行判为 `\"scalene\"`）？"
          options:
            - text: "`(1, 2, 3)`：因为 `1 + 2 == 3` 正好卡在 `<=` 与 `<` 分道扬镳的退化等号边界上"
              correct: true
            - text: "`(1, 2, 10)`：两边之和严格小于第三边"
              why: 对 `(1, 2, 10)`，`3 < 10` 同为真，变异体与原程序照样一致返回 `"invalid"`，根本杀不死它
            - text: "`(3, 4, 5)`：标准直角不等边三角形"
              why: 对 `(3, 4, 5)`，`7 > 5`，两个版本都返回 `"scalene"`，同样没杀死变异体
          explain: 等号边界点 `(1, 2, 3)` 不仅防 off-by-one，也是消灭关系运算符变异体最强的一记绝杀。
      - item:
          id: q-mutation-vs-seeding
          type: match
          prompt: 把基于故障的两项质量检校术语与各自核心作用一一匹配。
          pairs:
            - ["**等价变异体（Equivalent Mutant）**", "虽然改了一点代码语法但全部外部输入输出表现与原函数完全一样，统计变异得分前必须从分母剔除"]
            - ["**被杀死的变异体（Killed）**", "至少有一条现有测试面对改坏后的源码副本跑出失败报错，证明该断言确实管用"]
            - ["**幸存的变异体（Survived）**", "源码已经被刻意改出明显故障，现有全部测试跑完依然全部通过，暴露出断言过弱或边界用例缺失"]
            - ["**故障植入（Fault Seeding）**", "人为向程序刻意埋入一批已知特征的待查故障样本，借测试抓出比率评估还可能藏有多少未知真实缺陷"]
          explain: 会读变异报告以后，再也没人能拿“无断言刷出来的 100% 覆盖率”糊弄你。

  - id: fault-injection
    chapter: 故障注入与质量评估
    title: 故障注入与混沌工程受控演练
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个后端支付服务在单元测试、集成测试全绿通过并上线后，却在一次真实机房网络拥塞时雪崩：下游账务接口只变慢了 `3` 秒，结果上游网关默认无限死等重试并把全部连接耗尽，整站彻底瘫痪。平时明明都“测绿了”，为什么依然扛不住？
          options:
            - text: 因为常规功能测试往往只跑在理想顺风环境；面对应用天生的分布式与运行时属性（超时、丢包、5xx、宕机），必须靠故障注入与受控混沌演练提前实战逼出重试风暴与熔断短板
              correct: true
            - text: 因为线上出故障纯属不可抗力，测试绝对没办法人为提前模拟网络超时或节点掉线
              why: 我们完全可以在隔离环境或限流切面主动注入可控延迟、断包与错码，提前验证超时、熔断与降级策略是否真按设计生效
            - text: 只要开发把请求超时时间直接改成 `999999` 秒，系统就永远不会报超时错了
              why: 不设短超时反而会让海量请求长时间挂死占满全部工作连接池，把局部慢故障瞬间拖垮成全局雪崩。
          explain: 这一课从软件自身特性切入 **故障注入（Fault Injection）** 与学习路径里的 **混沌工程 4 步受控演练**。
      - card:
          title: 软件特性驱动故障注入与错误预算门禁
          body: |
            不同应用面临不同天生风险（并发竞态、网络丢包、外部 5xx 错码或磁盘满）。**故障注入**主动在可控路径人为制造这些乱流以检验容错底线：
            - **爆炸半径控制（Blast Radius）**：绝不一开始就盲目炸掉全量生产节点。先从预发环境或仅 `1%` 金丝雀灰度流量起步。
            - **错误预算门禁（Error Budget Gate）**：若线上当月剩余可用性错误预算已经见底告急，严禁继续高风险线上混沌演练，并配置监控自动秒级止损回滚。
      - card:
          title: 受控混沌工程演练 4 步闭环（学习路径模块 4）
          body: |
            真正的混沌工程不是“随便拔网线乱搞一气”，而是严谨的四步受控科学实验：
            - **第 1 步 定义稳态指标**：先量化系统正常长什么样（如 P99 延迟 `< 200ms`、成功率 `>= 99.9%`）。
            - **第 2 步 提出假说**：假定即便发生某项特定故障，系统靠降级/熔断仍能守住上述稳态不崩。
            - **第 3 步 限域注入故障**：在可控爆炸半径与自动止损门禁下真实注入超时、错码或节点重启变量。
            - **第 4 步 观测验证并止损加固**：对比稳态偏差；一旦越限立即秒级中止实验并据此修复重试退避与熔断缺陷。
      - item:
          id: q-chaos-order
          type: order
          prompt: 请按照现代工程推荐的 **受控混沌故障注入演练 4 步闭环** 的正确前后顺序排列。
          steps:
            - 先用可观测指标明确定义系统的正常运行稳态（如 P99 延迟与 5xx 比率基线）
            - 提出可检验的容错假说（预计某故障发生时稳态指标仍可维持或平稳降级）
            - 在限定爆炸半径与错误预算门禁保护下向可控范围注入真实故障变量
            - 对比稳态偏移数据并在异常超限时立即自动中止止损，据此修补熔断、超时与降级薄弱点
          explain: 先定稳态、再做假说、小半径有止损门禁注入、复盘修补——缺了前三步直接乱停服务器那叫制造事故，不叫工程演练。
      - card:
          title: 例题：当上游服务被注入 `50%` 的 `503` 错码与 `1.5s` 延迟后，真正抓出了哪两个隐蔽 Bug？
          body: |
            某电商“商品详情页”依赖一个非核心的“猜你喜欢推荐服务”。平时一切绿灯，团队按四步流程给推荐服务挂上一层 `2%` 灰度流量的故障注入（50% 请求返回 `503`、另 50% 延迟 `1.5s`）：
          reveal:
            - title: 第 1 步：观察稳态被击穿——主详情页成功率跟着跌破 `99.9%`
              body: 按理说就算推荐区空着，“商品标题、价格和加购物车”核心主链路也该稳稳返回 `200 OK`。稳态监控却在 `10` 秒内立刻触发错误预算阈值告警并自动撤掉了故障注入开关。
            - title: 第 2 步：定位真凶——既忘了配置短超时+熔断，又做了无退避无限连环重试
              body: 复盘抓出两处硬伤：详情页调用推荐服务超时设为 `10` 秒而非 `150ms`，而且每次 `503` 后不加指数退避与熔断就当场死等重试 `3` 次——把 `2%` 坏流量放大成阻塞主处理流工作的慢性毒药。
            - title: 第 3 步：修好后再复演一次——成功守住稳态
              body: 加上 `150ms` 超时 + 熔断后自动返回默认静态榜单降级，再次在同一灰度比例重跑故障注入实验：推荐区平稳降级，商品主链路耗时与 `200 OK` 成功率全程纹丝不动。
      - item:
          id: q-blast-radius-error-budget
          type: choice
          multi: true
          prompt: 为了安全地开展线上或准生产环境故障注入演练、避免把实验本身演成真实生产大事故，以下哪些控制手段是**必需且正确的**？
          options:
            - text: 严格限制爆炸半径（先沙盒/预发，上生产也只从极小百分比灰度或单机/单路由开始）
              correct: true
            - text: 检查系统当前剩余错误预算（Error Budget），预算告急时冻结非紧急故障注入实验
              correct: true
            - text: 预先配置自动急停开关（Kill Switch），关键稳态指标一触红线毫秒级撤回故障
              correct: true
            - text: 为了“更刺激逼真”，故意在不知会任何值班人员的情况下一次性切掉全公司全部核心数据库主节点
              why: 无边界、无止损预案地破坏核心有状态主库不是实验，而是直接制造难以挽回的业务灾难
          explain: 爆炸半径、错误预算门禁与毫秒级急停开关，合称安全做故障注入的三道护身符。
      - item:
          id: q-fault-injection-vs-seeding
          type: choice
          prompt: 对比 **故障植入（Fault Seeding）** 与 **故障注入（Fault Injection）**，这两组听起来一字之差的工程实践主要区别在哪？
          options:
            - text: "故障植入通常把已知源码 bug 刻意埋进代码里，借此反查测试套检出率以估算真实遗漏缺陷；故障注入则是在运行期对网络、延迟、错码或节点制造运行时异常，检验系统容错、超时与降级恢复能力"
              correct: true
            - text: 故障植入专门用来炸掉线上服务器网卡，故障注入专门用来数代码有几行注释
              why: 恰好说反了——一个是代码层缺陷校准测试与估算，一个是运行层异常考验系统容错韧性
            - text: 两者都只在项目上线前手动点两下鼠标算完，与自动化或监控毫无关系
              why: 现代工程里两者都高度依赖自动化工具链、严格实验设计以及明确的量化度量结果
          explain: 记清“代码植入测测试灵敏度 vs 运行注入测系统韧性”，碰到再混的术语提问也不会踩坑。

  - id: quality
    chapter: 故障注入与质量评估
    title: 测试基本原则、缺陷密度与被测软件质量评估
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 某团队为了在年度考核里显得“测试极度勤奋”，只考核“本周一共写了多少条用例、抓到了几个 Bug”，甚至把“发现 Bug 数”直接和程序员奖金反扣挂钩。三个月后代码质量反而暴跌。这违反了 SWEBOK 第 5、7、8 节里的哪条常识？
          options:
            - text: 测试与被测软件质量度量是两回事：用单纯数量指标当硬 KPI 会催生注水假测试和私下藏匿 Bug；真正该用运行剖面风险覆盖（7.6/7.9）、缺陷密度等组合客观指标去评估系统质量而非惩罚报 Bug 的人
              correct: true
            - text: 只要把所有人写过的单元测试强行凑满 100 万行，任何软件都会自动零缺陷
              why: 穷举全部输入不可能，低质量凑数的测试再多也抓不住关键逻辑错
            - text: 程序员只要互相口头约定“不准再往缺陷库里登记新问题”，系统缺陷就自动归零了
              why: 掩盖记录不等于修复缺陷，反而会让隐患一直憋到生产大爆发
          explain: 这一课把 SWEBOK 测试基础（5.1/5.3）、组合选型与运行剖面（7.6/7.9）及度量体系彻底串通。
      - card:
          title: 测试基础、不可穷举与运行剖面
          body: |
            哪怕一个只收两个整数的函数，输入组合也有天文数字般多（测试的两大难题：**无法穷举** 与 **预期判定难（Oracle）**）。因此工程上必须：
            - **基于运行剖面测试（Usage-Based）**：优先按用户真实高频使用场景与高商业损失路径分配精力。
            - **组合多种技术**：用黑盒边界抓规格疏漏、性质测试探角落、白盒 MC/DC 保关键判定、故障注入保容错，取长补短。
      - card:
          title: 测试度量、被测程序评估与缺陷密度
          body: |
            SWEBOK 特意把度量分成两条清清楚楚的线：
            - **测试相关度量**：衡量测试套自身表现——如单次执行耗时、假红波动（Flaky）率、覆盖深度与变异得分。
            - **被测软件评估与缺陷密度**：`缺陷密度 = 已发现缺陷数 / 规模（如千行代码 KLOC）`。它用于跨版本对比模块健壮趋势（例如某模块从每千行 5 错降到 2 错），绝不该拿来当“谁写错多罚谁”的惩罚棒。
      - item:
          id: q-fault-density-math
          type: number
          prompt: 一个包含 `3,000` 行有效源码（即 `3` 个 KLOC，千行单位）的支付对账核心模块，在本轮测试与线上运行周期中共记录并确认了 `6` 个真实代码缺陷。按标准工程口径 **缺陷密度（Defects / KLOC）** 计算，该模块每千行代码的缺陷密度是多少？（填整数）
          answer: 2
          explain: 计算直接按千行代码归一化：`6 ÷ (3,000 ÷ 1,000) = 6 ÷ 3 = 2` 个缺陷/KLOC。这样哪怕模块重构成 `5,000` 行或拆成两个模块，也依然有同一把尺子横向对比质量趋势。
      - card:
          title: 例题：同样是“这个季度抓出了 120 个 Bug”，到底该夸还是该慌？
          body: |
            两个背景完全不同的项目都在季度复盘里报出“测试一共发现 `120` 个缺陷”，光看这一个裸数字根本没法下结论，必须拆开三层上下文来看：
          reveal:
            - title: 第 1 步：结合规模看“密度”——`120 / 60 KLOC = 2` vs `120 / 6 KLOC = 20`
              body: 如果 A 系统有 `60 KLOC` 且大部分都是早期联调拦截下来的小错，密度只有 `2`；如果 B 模块才 `6 KLOC` 却爆了 `120` 个 Bug（密度高达 `20`），说明这个模块架构或需求早就烂透了，必须停下来重构加测试。
            - title: 第 2 步：区分缺陷“拦截阶段”——上线前抓 `118` 个 vs 生产事故才抓 `40` 个
              body: 缺陷发现得越早（在单测/集成阶段抓出而不是上线赔钱后才发现），修复代价越小。单看总数而不分严重等级与发现时机（是否漏出生产），极易误判。
            - title: 第 3 步：同时看测试套自身度量——如果假红（Flaky）率达 15%，大家早就屏蔽报警了
              body: 测试自身如果又慢又随机乱红，开发就会习惯性点“重跑/跳过”，哪怕后面堆着 1,000 个用例也没人在乎。
      - item:
          id: q-testing-fundamentals-match
          type: match
          prompt: 把 SWEBOK 第 5、7、8 章里的四个关键概念与工程解释精准配对。
          pairs:
            - ["**测试神谕难题（Oracle Problem）**", "测试跑完算出了一大堆结果，却极难自动又低成本地判定这串输出到底算不算正确"]
            - ["**基于运行剖面测试**", "依据真实线上用户操作分布与故障风险权重分配用例，高频核心链路投入最高保障"]
            - ["**测试自身度量**", "评估测试套件自己的执行耗时、假红（Flaky）不稳定率、覆盖率与变异得分"]
            - ["**被测软件评价**", "通过缺陷密度（Defects/KLOC）、严重级别与生产逃逸率综合评估软件制品质量"]
          explain: 既能看清测试套自己健不健康，又能客观评价软件制品本身质量走势，这才是测试度量的正道。
      - item:
          id: q-why-not-exhaustive
          type: choice
          prompt: 为什么经典软件工程一再强调“任何实际规模的软件都不可能靠穷举测试彻底证明零缺陷”？
          options:
            - text: 仅两个 `64` 位整数参数加上内部状态组合就多到宇宙毁灭都跑不完，何况还有异步时序、并发交织与外部环境状态；测试只能基于风险证明“在检验场景中存在缺陷或达到置信水平”，绝不能用穷举证明绝对零错误
              correct: true
            - text: 因为现代电脑速度太慢，跑完 `10` 次加法循环就要花上三年
              why: 机器每秒能跑上亿次运算，瓶颈不是单个运算慢，而是输入空间与状态路径随维度发生的组合爆炸
            - text: 因为单元测试根本测不了任何数字和逻辑错
              why: 恰恰相反，等价类、边界值、性质测试、MC/DC 和变异测试全都是为了在有限算力里榨出最高检错威力。
          explain: 正因为绝对穷举不可能，我们才要系统学习今天整门 `P.4.5` 的分层、边界、性质、MC/DC 与故障注入。

  - id: availability
    chapter: 故障注入与质量评估
    title: 寿命测试、可用性 MTBF/MTTR 算术与工程止损
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 某网站全年算下来平均每连续正常运行 `500` 小时就大概率坏一次（每次出事从发现报警到彻底修好恢复一共耗时 `MTTR = 2` 小时；按两项周期定义口径计，平均无故障/修复间隔比算作 `500 / (500 + 2)`）。同时老板顺口拍板说：“今年指标改成 **4 个 9（99.99%）可用性**。”你算算看，`99.99%` 全年总共最多只允许停机多久？
          options:
            - text: "`99.99%` 全年允许停机额度仅有 `52.56` 分钟。靠人工花 `2` 小时慢吞吞排查恢复一次就已经爆掉一整年预算的快一半了，必须上自动化回滚、热备与低 MTTR 机制"
              correct: true
            - text: "`99.99%` 全年可以随便宕机整整 `5` 天以上都没关系"
              why: 全年 `365 × 24 × 60 = 525,600` 分钟，哪怕 `1%` 错也才 `5,256` 分钟；`0.01%`（4 个 9）更是严苛到只剩几十来分钟。
            - text: 只要 `MTBF` 写成 `500` 小时，`MTTR` 哪怕拉长到 `500` 小时也照样能有 `99%` 可用性
              why: 按 `MTBF / (MTBF + MTTR)` 一算，`500 / (500 + 500) = 50%`，系统一半时间都在趴窝。
          explain: 这一课收尾 **寿命测试（Life Testing）**、**可用性算术（MTBF / MTTR）** 与如何靠降低 `MTTR` 快速推高几个 9。
      - card:
          title: 寿命测试与可用性公式 `MTBF / (MTBF + MTTR)`
          body: |
            只测单次请求正确还不够——系统连跑一周会不会因为资源缓慢泄漏而崩溃？
            - **寿命/稳定性测试（Life Testing）**：让软件按照预期真实工作负载持续长时间运行，观察故障间隔走势以评估失效率与老化问题（如泄露导致隔几天必挂）。
            - **可用性估算**：若单次故障后平均恢复耗时长为 `MTTR`，平均两次相邻故障间隔对应的无故障服务时长以 `MTBF` 记，则可用性：`A = MTBF / (MTBF + MTTR)`。
      - card:
          title: 为什么工程上拼命压低 `MTTR` 比死磕 `MTBF` 见效快得多？
          body: |
            想把系统可用性从 `99.6%` 推到 `99.99%`（错误预算全看 `1 - A`），看懂数学杠杆你就秒明白发力点在哪：
            - **把 `MTBF` 翻 10 倍**（不出事太难）：往往要改写底层海量架构，耗时一年未必能把事故间隔拉长十倍。
            - **把 `MTTR` 砍 10 倍**（出事秒级恢复）：把原本 `2` 小时（`120` 分钟）人工翻日志排查，通过自动金丝雀拦截 + 一键自动回滚 + 自动重启健康检查压到 `2` 分钟，错误率当场立减百倍级别。
      - item:
          id: q-availability-500-2
          type: choice
          prompt: 一个可修复在线服务在寿命稳定性观测期间，按公式 `可用性 = MTBF / (MTBF + MTTR)` 核算。若已知其 `MTBF = 500` 小时，平均每次故障定位修复恢复耗时 `MTTR = 2` 小时，该服务当前可用性大约是多少（保留两位小数）？
          options:
            - text: "`500 / (500 + 2) ≈ 99.60%`（未达到 `99.9%` 的 3 个 9 标准）"
              correct: true
            - text: "`500 / 2 = 250%`"
              why: 可用性是正常时间占总周期的比例，不可能超过 100%，分母应当是正常加停机时间总和 `500 + 2`
            - text: "`2 / 502 ≈ 0.40%`"
              why: "`2 / 502` 算出来的是**不可用率（停机比例 / 错误预算占用）**，可用性应当以正常运行份额 `MTBF` 作分子"
          explain: "`500 / 502 ≈ 0.9960159...`，即 **99.60%**，距离 3 个 9（`99.9%`）还差不少，这就能定量倒逼团队砍 `MTTR`。"
      - card:
          title: 例题：精算“几个 9”对应的全年停机时间上限（Error Budget）
          body: |
            产品 SLA（服务等级协议）动不动写“三个 9”、“四个 9”，用一年 `365` 天 = `365 × 24 × 60 = 525,600` 分钟作为基准一算就再也不用拍脑袋猜：
          reveal:
            - title: 第 1 步：算 `99.9%`（3 个 9）的全年总错误预算
              body: 不可用份额 = `1 - 0.999 = 0.001`。一年允许停机总额 = `525,600 × 0.001 = 525.6` 分钟（约 `8.76` 小时/年，平均每月约 `43.8` 分钟）。
            - title: 第 2 步：算 `99.99%`（4 个 9）的全年总错误预算——整整再收紧 10 倍
              body: 不可用份额 = `1 - 0.9999 = 0.0001`。一年允许停机总额 = `525,600 × 0.0001 = 52.56` 分钟（平均每月只剩约 **`4.38` 分钟**）。
            - title: 第 3 步：工程落点——“4.38 分钟”连人都还没被报警电话吵醒
              body: 这就是为什么只要目标定到 `99.99%`，**人工登录排查根本来不及**——唯一活路是：先在单测/性质/变异/混沌演练里拦死绝大多数缺陷（抬高 `MTBF`），再靠自动监控+自动秒级回滚切流量（把 `MTTR` 压到 1 分钟以内）。
      - item:
          id: q-nines-downtime-math
          type: number
          prompt: 按平年 `365` 天（一天 `24` 小时、一小时 `60` 分钟，共 `525,600` 分钟）计算，若某关键交易服务对外承诺 **4 个 9（`99.99%`）** 的年度可用性指标，它一整年累计允许不可用（停机/预算）的时间最多是 **多少分钟**？（填写准确两位小数，如 `12.34`）
          answer: 52.56
          explain: "`(1 - 0.9999) × 365 × 24 × 60 = 0.0001 × 525,600 = 52.56` 分钟。记住这个标志数字 `52.56` 分钟，下次听到谁随口许诺“五个 9（5.26 分钟/年）”就能一眼识别工作量有多硬核。"
      - item:
          id: q-reliability-levers-match
          type: match
          prompt: 把可靠性与稳定性工程中的四个典型举措与它主要优化的数学量或目的对应匹配。
          pairs:
            - ["**自动金丝雀发布触发毫秒级秒回滚 + 故障自愈重启**", "大幅压缩每次出事故的平均恢复耗时 **`MTTR`**，把不可用时长砍到分钟级以内"]
            - ["**等价类/边界值 + MC/DC + 变异测试上线前门禁**", "把高危缺陷尽量拦在开发期，从而显著拉长两次生产事故之间的间隔 **`MTBF`**"]
            - ["**长时加压稳定性演练（Life Testing）**", "验证软件在真实运行剖面下连续多天运行是否出现资源缓慢耗尽、老化或周期性失效"]
            - ["**错误预算（`1 - SLA`）消耗速率监控**", "预算充裕时放心快速发布功能或做混沌演练，预算告急时冻结高风险变更全力修稳定性"]
          explain: 至此，《软件测试、质量与可靠性（P.4.5）》4 大章 19 课全部通关。最后来一场终极 Boss 战综合验收。

boss:
  items:
    - id: boss-pyramid-doubles
      type: choice
      prompt: 你正带队为一个新账务系统搭建自动化测试网。面对“测试金字塔配比 + 测试替身选用 + 可重构性”，下列哪一套策略**全部正确**？
      options:
        - text: 底层铺设大量高速 `pytest` 单元测试与性质测试；用可控 `Fake`（如局部简易存写替代真实慢网关）测真实业务状态与公开返回输出，仅在极少真实集成边缘测接口契约，避免用严格验证内部私有方法调用次数的脆弱 `Mock`
          correct: true
        - text: 倒置成“冰激凌甜筒”模型，把 90% 用例全写成慢吞吞启动整个浏览器的 UI 大测试，只留 5 条单元测试
          why: 倒置金字塔反馈极慢、脆弱爱假红且报错极难定位病根，维护成本彻底爆炸
        - text: 给每行代码内部到底调用了几次私有辅助函数都写满 `mock.assert_called_once_with(...)`
          why: 这样一重构内部私有实现（哪怕公开业务输出 100% 正确）测试也会大片碎裂，形成极端脆弱耦合
        - text: 只要写了测试替身 `Dummy` 就再也不用写任何集成测试确认数据库或外部接口真实连得通
          why: 替身只代替外部依赖跑快单测，跨模块边界契约仍需少量精准集成测试实测核验
      explain: 守住“正金字塔配比 + 测行为不测内部交互细节 + 慎用 Mock 优先状态/Fake”，测试网才能跑十年都不腐化。
    - id: boss-triangle-bva-count
      type: number
      prompt: '检验经典整数边长三角形分类函数 `classify_triangle(a, b, c)`（合法需正整数且满足任意两边之和大于第三边；共分 `equilateral`、`isosceles`、`scalene`、`invalid` 四类）。对边界分析而言，哪一类临界三元组能精准验证退化边界 `a + b == c` 必须被判成 `invalid`？例如输入 `(1, 2, 3)` 时，请填写该输入中最大一条边的边长数值。（填整数）'
      answer: 3
      explain: 退化临界输入 `(1, 2, 3)` 中 `1 + 2 = 3`，最大边为 `3`。很多粗心实现错写成 `x + y < z`，只有这条精确落在 `x + y == z` 界限上的用例能当场将其抓出。
    - id: boss-short-circuit-mcdc
      type: number
      prompt: '针对 Python 判定 `if a > 0 and b > 0:`（按真实**从左到右短路求值**，`a > 0` 为假时右边 `b > 0` 根本不执行）：若要求同时满足 **100% 语句、100% 分支、100% 真实短路条件覆盖以及 100% MC/DC 独立影响覆盖**，最少总共需要几条精心挑选的测试用例？（填整数）'
      answer: 3
      explain: 只需要 `3` 条用例——`(1, 1)` 让整体 `True`、`(1, -1)` 反转 `b > 0` 把整体拉成 `False`、`(-1, 1)` 反转 `a > 0` 把整体拉成 `False`。`2` 条绝对不够（无论怎么选都会让至少一个原子条件无法独立反转决定总结果或根本未求值）。
    - id: boss-property-shrinking-match
      type: match
      prompt: 把性质测试（Property-Based Testing）与变异体测试里这四个极容易考混的术语与核心定义精确匹配。
      pairs:
        - ["**反例缩减（Shrinking）**", "随机测出大输入崩溃后自动删要素降数值，浓缩呈报最小依然触发同一失败的极简样例"]
        - ["**蜕变测试（Metamorphic Testing）**", "遇到极难提前算出标准唯一答案（Oracle）的系统时，通过变换输入检验输出间固定关联规律"]
        - ["**有状态模型测试（Stateful Model Checking）**", "生成随机长度的操作调用动作序列，每一步拿复杂被测实现与简单权威 `dict` 模型对照状态"]
        - ["**等价变异体（Equivalent Mutant）**", "微调了程序源码写法但全部输入下外部行为与原代码彻底一致，统计变异得分前须先排除"]
      explain: 这四个概念经常在高级工程面试与科研实验里同时出现，分清以后再也不会混淆。
    - id: boss-coverage-trap
      type: choice
      prompt: 下面哪种关于白盒覆盖率指标的理解是**完全正确且无坑**的？
      options:
        - text: "100% MC/DC 强于单看行覆盖或普通分支覆盖，能用近乎线性数量（通常 `N + 1` 条起）迫使每个原子条件真正独立起作用；但哪怕覆盖率 100%，若缺乏强断言、等价类边界校验或存在遗漏未写的规格分支，Bug 照样能逃脱。"
          correct: true
        - text: 只要某份代码拿 `pytest --cov` 跑到了 100% 行覆盖率，就数学保证了绝对不可能再有任何隐含分支漏洞或漏测边界
          why: 行覆盖最弱——哪怕一条 `if cond:` 没有 `else`，只要走过 `True`，行覆盖就是 100%，`False` 侧彻底隐身；且无断言测试照样刷到 100%
        - text: 应该强迫全部所有业务函数都写出 100% 完整路径组合覆盖，哪怕函数里有 `25` 个顺序 `if` 也要全测满 `2^25` 条组合
          why: "`2^25` 超过三千万条路径会彻底炸穿 CI 预算，工程上应按路径复杂度取分支/MC/DC 与重点路径平衡"
        - text: 只要对 `if a > 0 and b > 0` 跑了 `(1, 1)` 和 `(-1, -1)`，因为真值表里两项全假全真都有，所以短路的第二个条件 `b > 0` 也已经算彻底被真实测试求值过了
          why: 在 Python/C/Java 等短路求值语言里，当 `a = -1` 使左边为假时，右半边 `b > 0` 压根没有被执行。
      explain: 不被“100% 数字”麻痹、看懂短路求值真相并用变异体反向审视断言质量，才是高阶工程师眼里的覆盖率。
    - id: boss-mutation-score-and-seeding
      type: number
      prompt: '某核心校验模块自动生成 `6` 个变异体，经人工审查发现有 `2` 个属于“无论输入什么都和原程序结果完全相同”的等价变异体先予剔除。剩下 `4` 个有效变异体跑完当前测试套后，只抓红了 `3` 个（有 `1` 个 `<=` 变异成了 `<` 却全绿幸存了）。剔除等价变异体后，当前测试套的 **变异得分** 为百分之多少？（填整数）'
      answer: 75
      explain: 有效非等价变异体总数为 `6 - 2 = 4`，杀死了 `3` 个，故变异得分 = `3 / 4 = 75%`。补进那条边界用例就能一举拉满到 `100%`。
    - id: boss-chaos-order
      type: order
      prompt: 对线上核心微服务集群首次开展可观测的“混沌故障注入”演练时，请把以下四个工程动作按**严格正确的先后次序**排好队。
      steps:
        - 用延迟 P99 与成功率量化定义系统稳态基线，并核查当月剩余错误预算未告急
        - 明确提出可检验的容错假说（预期注入某依赖超时后主链路通过熔断降级仍守住稳态）
        - 在最小爆炸半径（预发或极小灰度比例）并配好毫秒级自动急停开关前提下注入真实延迟/错码
        - 实时比对稳态偏差，异常超限立即秒停回滚并针对暴露出的阻塞重试与缺超时缺陷进行修复加固
      explain: 有基线、有假说、小半径、带急停、可复盘——这才是能放心进生产的混沌工程。
    - id: boss-availability-nines
      type: number
      prompt: '某平台核心账务接口按平年 `365` 天（`525,600` 分钟/年）考核 SLA。当前实测 `MTBF = 500` 小时、`MTTR = 2` 小时（可用性仅约 `99.60%`）。若团队通过自动回滚与故障自愈重构把目标一口气抬升到 **4 个 9（`99.99%`）**，全年总计最多只允许停机 **多少分钟**？（填精确到两位小数的数字）'
      answer: 52.56
      explain: "`525,600 × (1 - 0.9999) = 52.56` 分钟/年（平均每月不到 `4.4` 分钟）。用数学算清了这个极窄上限，你就能向任何业务方清晰解释“为什么要先修自动回滚压低 MTTR 再谈 4 个 9”——祝贺通关 `P.4.5`。"
