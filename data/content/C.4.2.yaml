skill: C.4.2
version: 2
authors: [main-agent]
brief:
  why: |
    自己买一台物理服务器放在机房，遇到促销流量翻十倍就扛不住，平时没流量又白交电费。云计算把算力、存储和网络变成按需租用的水电煤：从虚拟机（IaaS）到托管运行平台（PaaS）再到直接可用的软件（SaaS），配合弹性扩缩、多租户隔离、容器编排、无服务器函数和精打细算的成本模型，让几个人也能支撑百万级并发。本包只假设你学过系统编程与并发（C.2.2）及其前置，所有云与分布式概念都从具体场景讲起。
  outcomes:
    - 分清 IaaS、PaaS、SaaS、FaaS 的软件栈控制范围与共享责任边界，判断物联网边缘与可定制平台适用场景
    - 按单实例吞吐与目标利用率估算所需副本数与 HPA 扩缩容结果，解释键值分片重平衡与无状态服务的必要性
    - 说明区域与可用区的故障域隔离、跨地域强一致延迟权衡、流言协议级联故障与常见容错手段
    - 对比共享命名空间、独立命名空间配额与独立集群三种多租户隔离权衡，核查云上加密与数据驻留合规要求
    - 说清 Kubernetes 控制平面、节点、控制器与调度器的协同机制，并按工作负载选对 Deployment、StatefulSet、DaemonSet、Job 或 CronJob
    - 算清 FaaS 冷启动与 GB-秒计费，并完成基线预留与波峰按需混合方案的月度成本对比
terms:
  - term: 虚拟化
    def: 通过虚拟机监控程序把一台物理机器切分成多个彼此隔离的虚拟计算机，各自拥有虚拟 CPU、内存和磁盘。
  - term: IaaS
    def: 基础设施即服务：云厂商提供虚拟机、虚拟网络和块存储等底层资源，用户自行管理操作系统及之上的所有软件。
  - term: 共享责任
    def: 云厂商负责物理机房、硬件和虚拟化层等“云本身的安全”，用户负责账号权限、系统补丁和应用数据等“云中内容的安全”。
  - term: 边缘计算
    def: 把一部分过滤、聚合或实时判断放到靠近传感器和用户的本地设备执行，再把摘要结果送回云端。
  - term: PaaS
    def: 平台即服务：云厂商管好操作系统、运行时和扩缩容平台，开发者只提交代码和配置即可上线。
  - term: SaaS
    def: 软件即服务：云厂商交付完整可直接使用并持续托管的在线应用，用户只需配置账号与业务数据。
  - term: 弹性
    def: 系统按实时负载自动申请新资源应对高峰，并在流量回落后及时释放闲置资源以节省费用。
  - term: 水平扩展
    def: 通过增减相同服务实例的数量（而非给单台机器换更强硬件）来提升或缩减系统总处理能力。
  - term: 分片
    def: 把海量键值数据按某种划分规则拆散存放在多台机器上，使每台机器只承担一部分容量和读写请求。
  - term: 无状态
    def: 服务实例不在本地内存或本地磁盘保存跨请求的会话状态，任意一个实例随时都能处理下一条请求。
  - term: 区域
    def: 云厂商在某个地理区域内划定的独立集群集合，内部包含多个低延迟互联的可用区。
  - term: 可用区
    def: 同一区域内具备独立供电、制冷和网络接入的数据中心，用来隔离单机房级硬件或电力故障。
  - term: 强一致性
    def: 任何节点上的后续读取都保证能看到最近一次已确认写入的新值，代价往往是跨机或跨地域同步等待。
  - term: 熔断器
    def: 当下游依赖持续超时或报错时自动快速拒绝请求一段时间，防止故障拖垮整条调用链的保护机制。
  - term: 多租户
    def: 多个彼此独立的客户或团队共享同一套云基础设施或集群，通过逻辑或物理边界防止越权访问与资源抢占。
  - term: 命名空间
    def: 在同一集群内部把 API 对象、权限边界和配额划分成不同逻辑分组的隔离空间。
  - term: 配额
    def: 给单个租户或命名空间设定的 CPU、内存、存储或对象数量上限，防止单个租户耗尽共享集群资源。
  - term: 吵闹邻居
    def: 多租户共享底层硬件或网络时，某个租户突发大量资源消耗从而拖慢同机其他租户的性能干扰现象。
  - term: 静态加密
    def: 数据写入磁盘或对象存储前先加密保存，确保物理介质失窃或快照泄露时无法直接读出明文。
  - term: 数据驻留
    def: 法规或合同要求特定个人或业务数据必须物理存放在指定国家或地区境内且不得跨境复制。
  - term: 编排
    def: 由集群控制系统自动完成容器或任务的调度、健康检查、自愈重建和滚动升级等全生命周期管理。
  - term: 节点
    def: 集群里实际运行工作负载的物理机或虚拟机，由本地代理向控制平面汇报状态并领受任务。
  - term: 控制平面
    def: 集群的大脑：集中保存期望状态，并通过调度器和各类控制器持续把集群实际状态推向期望状态。
  - term: 容器
    def: 利用操作系统隔离视图与资源限制把应用及其依赖打包在独立用户空间里运行的轻量级执行单元。
  - term: 镜像仓库
    def: 集中存放、按版本标签与内容摘要分发容器镜像的服务，供集群节点拉取后启动容器。
  - term: Pod
    def: Kubernetes 中最小的可调度单位，封装一个或多个紧耦合容器以及共享的网络命名空间和存储卷。
  - term: Deployment
    def: 声明式管理无状态 Pod 副本数量、滚动升级策略与版本回滚的控制器对象。
  - term: StatefulSet
    def: 为有状态应用提供固定序号名称、稳定网络标识以及逐一绑定独立持久卷的控制器。
  - term: DaemonSet
    def: 保证集群中每个符合条件的节点上恰好运行一个指定 Pod 副本（如日志采集或监控代理）的控制器。
  - term: 无服务器
    def: 开发者无需管理虚拟机或常驻进程，由云平台按事件自动拉起运行环境并按实际执行资源精确计费的模式。
  - term: FaaS
    def: 函数即服务：把业务拆成由 HTTP 或队列等事件触发的短时无状态函数，平台自动完成并发扩缩。
  - term: 冷启动
    def: 函数长时间无请求导致实例被回收后，新请求到来时平台重新分配沙箱、加载运行时并初始化代码产生的额外延迟。
  - term: 按量付费
    def: 不提前承诺长期租约，完全按照实例实际运行时长或请求调用次数单价结算的云计费方式。
lessons:
  # ======================================================================== IaaS/PaaS
  - id: iaas-foundation
    chapter: IaaS/PaaS
    title: IaaS、虚拟化与共享责任
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你和同学做了一个图片分享网站，上线第一周只有几十个用户，但下个月可能会被校园公众号推荐，一小时涌入上万人。如果今天花 3 万元买两台物理服务器放进托管机房，最可能遇到哪两个尴尬局面？
          options:
            - text: 平时 95% 的算力闲置白交电费，真爆红时又得等几天采购上架新机器
              correct: true
            - text: 物理服务器不能运行 Linux 进程，必须改成专用云计算芯片
              why: 云计算底层用的也是标准服务器 CPU 与 Linux 进程，差异在资源分配与租用方式
            - text: 自己买的机器只要插上网线就自动具备多机房容灾能力
              why: 单机房托管遇到断电或光纤被挖断仍会整体离线，不会自动多机房容灾
          explain: 自建物理机的问题在于“买定离手”：按平时规模买，高峰直接宕机；按峰值买，平时大部分机器都在空转。云计算正是为了把固定采购变成按需租用。
      - card:
          title: 一台物理机怎么租给不同的人：虚拟化
          body: |
            云机房里放着成千上万台物理服务器，但小团队往往只需要 2 核 4 GB 内存。云厂商用**虚拟化（virtualization）**软件（Hypervisor）在物理硬件之上切出多台彼此隔离的虚拟机（VM）。

            每台虚拟机都看到自己专属的虚拟 CPU、虚拟内存地址空间、虚拟网卡和虚拟磁盘，甚至可以各自运行不同版本的操作系统内核。
      - card:
          title: 基础设施即服务（IaaS）与交互流程
          body: |
            把虚拟机、虚拟块存储和虚拟网络按小时租给你，就是**IaaS（Infrastructure as a Service，基础设施即服务）**，对应 NIST SP 800-146 第 7 章的模型。

            在交互流程上，用户向云控制面 API 发请求，传入系统镜像 ID、CPU/内存规格、网络与密钥配置；控制面挑出一台空余物理机，在上面启动虚拟机并挂上网络磁盘，返回登录地址。
      - item:
          id: q-iaas-api
          type: choice
          prompt: 当开发者在云控制台点下“创建一台 4 核 8 GB 的 Ubuntu 虚拟机”时，谁在负责把虚拟网卡和系统镜像分配到某台物理服务器上？
          options:
            - text: 云厂商的控制面（Cloud Control Plane）调度系统
              correct: true
            - text: 开发者自己写的 C 语言 main 函数
              why: 开发者只在拿到虚拟机后才登录进去跑自己的程序，选物理宿主机由云平台完成
            - text: 浏览器里的 HTML 页面直接通过 USB 连上机房硬盘
              why: 浏览器只是向云平台的管理 API 发送创建请求
          explain: IaaS 把物理机选择、Hypervisor 创建虚拟机和挂接虚拟磁盘封装在云控制面 API 后面，用户看到的是一台随时可用的新主机。
      - card:
          title: 谁管哪一层：IaaS 的软件栈边界
          body: |
            一套联网服务从下到上分成九层：机房与硬件 → 虚拟化层 → 操作系统 → 运行时与中间件 → 你的应用代码与业务数据。

            在 IaaS 下，云厂商只负责最下面两层（硬件与虚拟化）；从操作系统内核补丁、防火墙规则、C/Python 运行时到应用代码，全归用户自己管。好处是自由度极高，代价是运维担子也最重。
      - card:
          title: 共享责任模型：云本身 vs 云中内容
          body: |
            权责边界决定了安全分工，这就是**共享责任（shared responsibility）**模型：

            - **云厂商**：负责“云本身的安全”，包括机房门禁、服务器硬件、物理网络与虚拟化隔离。
            - **用户**：负责“云中内容的安全”，包括操作系统漏洞修复、开放哪些端口、谁有权限登录、业务数据是否加密。
      - item:
          id: q-shared-resp
          type: choice
          prompt: 你在 IaaS 上租了一台虚拟机跑 Web 服务，却忘了给操作系统的 SSH 密码登录打限制，也没及时修补一个公开的内核提权漏洞，结果黑客侵入机器窃取了数据库里的用户密码。按共享责任模型，这主要属于哪一方的责任？
          options:
            - text: 用户方，因为操作系统补丁、登录策略与应用配置在 IaaS 下由客户负责
              correct: true
            - text: 云厂商，因为物理服务器放在云厂商的数据中心里
              why: 云厂商管的是机房与虚拟化层本身不被突破，不会替客户去改虚拟机内部软件配置
            - text: 硬件芯片厂商，因为提权漏洞最终跑在 CPU 上
              why: 已知操作系统软件漏洞的升级打补丁责任归管理该 OS 的用户
          explain: IaaS 的核心交易是“给你完整操作系统控制权”。自由度越大，你在“云中内容”这一侧承担的安全责任就越多。
      - card:
          title: 运营视角与落地的四个实践建议
          body: |
            NIST 7.3 与 7.6 总结了生产使用 IaaS 的运营常识：用自动化脚本而不是手工点界面来装机，把虚拟机镜像做成无状态可重建模板；把密钥放在专门凭证服务里，别硬编码进镜像。

            同时提前确认云厂商提供的最大磁盘 I/O 与带宽上限、镜像导入导出格式是否通用，避免业务做大后才发现搬迁困难或性能见顶。
      - item:
          id: q-iaas-ops
          type: choice
          multi: true
          prompt: 以下哪些做法符合 NIST 对 IaaS 运维与选型的建议？（多选）
          options:
            - text: 把系统安装和配置写成自动化脚本，把虚拟机当成可随时销毁重建的实例
              correct: true
            - text: 评估镜像格式与数据导出成本，防止以后想迁走时被格式锁死
              correct: true
            - text: 直接把数据库管理员密码写死在公共系统镜像里，方便新机器启动就用
              why: 镜像可能被复制或共享，密钥应通过运行期配置或密钥服务注入
            - text: 永远只用一台超大虚拟机，绝对不配合自动脚本或监控告警
              why: 单机无法容忍硬件故障，且缺乏监控和自动化会放大运维风险
          explain: IaaS 下的最佳实践是基础设施自动化、镜像不存秘密、可随时替换实例，并提前评估性能上限与迁移锁死风险。
      - item:
          id: q-iaas-layers-match
          type: match
          prompt: 把下面 IaaS 场景中的各项职责与责任方配对。
          pairs:
            - [给宿主机机房配双路供电与门禁, 云厂商（云本身的安全）]
            - [升级虚拟机内的 Linux 内核安全补丁, 用户（操作系统层）]
            - [修复 Hypervisor 虚拟化层的逃逸漏洞, 云厂商（虚拟化层）]
            - [检查 Web 应用里的密码存储是否加盐哈希, 用户（应用与数据层）]
          explain: 在 IaaS 模式下，分界线画在虚拟化层与客体操作系统之间：虚拟化及以下由云厂商维护，客体 OS 及以上由用户维护。

  - id: paas-saas-edge
    chapter: IaaS/PaaS
    title: PaaS、SaaS、可定制平台服务与物联网边缘
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一家只有 3 名程序员的创业公司想用 Python 写一个在线问卷系统，他们希望只管写业务代码和数据库表结构，不想半夜爬起来给 Linux 打安全补丁、配置 Nginx 反向代理或手动搭进程守护。哪种服务模型最合身？
          options:
            - text: PaaS（平台即服务）：只上传应用代码和配置，操作系统与运行时由平台托管
              correct: true
            - text: 自己买 10 台物理机从插网线和装 BIOS 开始
              why: 3 人团队把大量时间耗在硬件与机房维护上会严重拖慢业务开发
            - text: 只能完全不用云，因为代码必须在自己电脑上才能运行
              why: 托管平台专门提供标准化的远程运行环境
          explain: 当团队不想维护操作系统和运行环境、只专注自己的应用代码时，平台即服务（PaaS）正好把中间这一整段软件栈接管过来。
      - card:
          title: 平台即服务（PaaS）与交互流程
          body: |
            **PaaS（Platform as a Service，平台即服务）**在虚拟机之上再包一层托管的操作系统、语言运行时（Python/Java/Node）、Web 服务器和内置扩缩工具。

            按 NIST 第 6 章的交互流程：开发者通过命令行或 Git 推送代码和依赖清单；平台自动装好依赖、打包启动多个运行实例并把域名流量接进来，开发者不用登录操作系统后台。
      - card:
          title: 软件即服务（SaaS）与四层总对比
          body: |
            如果你连代码都不想写——比如团队要用电子邮箱、在线文档或客服工单系统——直接租用现成软件就是**SaaS（Software as a Service，软件即服务）**。

            | 层级 | 自建机房 | IaaS | PaaS | SaaS |
            |---|---|---|---|---|
            | 业务数据与配置 | 你 | 你 | 你 | 你 |
            | 应用代码 | 你 | 你 | 你 | 云厂商 |
            | 运行时与 OS | 你 | 你 | 云厂商 | 云厂商 |
            | 硬件与虚拟化 | 你 | 云厂商 | 云厂商 | 云厂商 |
      - item:
          id: q-stack-compare
          type: match
          prompt: 把下面的具体需求与最贴合的云服务模型连线。
          pairs:
            - [自己编译定制内核模块并控制整台 Linux 主机, IaaS]
            - [只推送 Python 代码，让平台接管系统补丁与运行时, PaaS]
            - [直接打开网页配置公司成员邮箱账号与权限, SaaS]
          explain: 控制越深、责任越重的是 IaaS；交出 OS 与运行时、只写代码的是 PaaS；连应用软件都现成托管的是 SaaS。
      - card:
          title: PaaS 的收益、风险与适用应用
          body: |
            PaaS 省去了大量运维，但也有两面性（NIST 6.3–6.6）：由于平台高度封装了运行时接口与托管数据库服务，应用一旦深绑某家厂商的专有 SDK 或调度规范，日后迁移出去成本会升高（厂商锁定）。

            因此 PaaS 最适合标准 Web 后端、API 服务、定时批处理和快速试错的产品；不适合需要特殊硬件驱动、自研网络内核或强定制操作系统参数的项目。
      - card:
          title: 可定制平台服务与物联网边缘（IoT Edge）
          body: |
            现代云不止有“一刀切”的固定 PaaS（Cornell CS5412 第 1、4 讲）：大平台往往提供可定制的扩展点（如自定容器镜像、托管网关插件、消息路由钩子），兼顾托管便利与业务定制。

            而面对摄像头、自动驾驶或工厂传感器，每秒产生海量原始视频与高频读数，全传上云既费带宽又延迟太高。于是出现了**边缘计算（edge computing）**：先在设备本地或厂区网关做去噪、识别与过滤，只把异常告警或汇总数据上传云端分析。
      - item:
          id: q-edge-why
          type: choice
          prompt: 一条智能产线有 200 台高清质检相机，每秒共产生 4 GB 原始画面。工程师在车间本地放了一台工业网关先跑缺陷识别，只把检出的次品截图和统计日志发到云端保存。这样做主要利用了云边协同的什么优势？
          options:
            - text: 用边缘计算在本地完成高带宽原始数据的过滤与低延迟判定，节省上云带宽并加快响应
              correct: true
            - text: 车间网关能凭空变出无限硬盘空间，不再需要任何云端存储
              why: 长期归档统计、跨厂区汇总分析与模型再训练依然依赖云端
            - text: 边缘设备不需要供电，所以能无限期独立工作
              why: 工业网关仍需本地供电，边缘计算解决的是延迟、带宽与断网容错问题
          explain: 物联网与云并非二选一：实时过滤和低延迟响应留在边缘，长期保存、全局聚合与重计算放到云上。
      - card:
          title: 例题：给四个业务挑出合适的云服务模型
          body: |
            把下面四个真实业务需求一步步落到服务模型与风险对策上：
            - A：需要加载自写 eBPF 内核探测程序的监控系统
            - B：标准电商订单后端（Python + 关系数据库），团队 5 人希望快上线
            - C：全公司员工日常使用的协同日历和邮箱
            - D：风电场风机上的毫秒级振动异常急停控制
          reveal:
            - title: 第 1 步：看对底层操作系统与内核的掌控需求
              body: 业务 A 要改内核特性，PaaS 不允许操作宿主内核，所以 A 选 **IaaS**（自己管 OS）。业务 D 要求毫秒级现场急停，云端往返太慢且断网危险，应把实时判断放到风机旁的**边缘计算**节点，汇总报告再传云端。
            - title: 第 2 步：看是否需要自研业务代码
              body: 业务 C 是成熟通用办公软件，没必要自研，直接用 **SaaS**。业务 B 需要自己写订单规则和接口，但不想管 OS 补丁和运行时升级，最适合 **PaaS**（并把核心业务与厂商专有服务接口解耦，防锁定）。
      - item:
          id: q-paas-lockin
          type: choice
          prompt: 一支团队用某家云厂商的 PaaS 写后端时，在业务代码各处直接硬编码调用该平台独有的专有消息队列 API 和非标准配置接口。按照 NIST 第 6 章对 PaaS 的建议，这种写法最容易带来什么隐患？
          options:
            - text: 厂商锁定（Vendor Lock-in）：日后想迁往自建集群或其他云平台时重写成本极高
              correct: true
            - text: 代码在当前平台上一定无法通过编译
              why: 在当前云平台上可以正常运行，问题出在可移植性与长期议价能力上
            - text: 会让静态语言自动变成动态语言
              why: 服务绑定与编程语言类型系统无关
          explain: NIST 建议把标准业务逻辑与具体云平台 SDK 隔离开（例如通过适配器接口），既享受 PaaS 的低运维，又保留未来迁移的选择权。
      - item:
          id: q-paas-candidates
          type: choice
          prompt: 按照 NIST 第 6 章对 PaaS 适用应用类别（6.5）的划分，下面哪一类项目**不适合**直接放在标准 PaaS 上运行？
          options:
            - text: 需要修改 Linux 内核网络驱动并与特定硬件加密卡直接通信的系统
              correct: true
            - text: 团队希望快速开发上线的标准 Python Web API 与后台任务
              why: 标准 Web 后端与常规后台任务正是 PaaS 最拿手的适用场景
            - text: 需要借助平台自动扩展处理日常突发访问的在线问卷系统
              why: 常规 Web 应用无需操作底层内核，用 PaaS 省去系统运维最划算
          explain: PaaS 的边界在于“不把操作系统和硬件驱动暴露给用户”。一旦业务必须定制内核模块或直连特殊硬件，就需要退回 IaaS。

  # ======================================================================== 弹性
  - id: elasticity-capacity
    chapter: 弹性
    title: 弹性伸缩、水平扩展与容量估算
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 某网站平时只需要 3 台服务器就能从容应付请求。某天中午流量突然暴涨到平时的 10 倍，持续 2 小时后又掉回平时水平。哪一种扩容方式既能扛住高峰、又不至于平时白花钱？
          options:
            - text: 高峰时自动加出新实例分担请求，高峰过后自动回收多余实例
              correct: true
            - text: 永远开着 30 台服务器不关机，免得临时扩容麻烦
              why: 一天 24 小时里有 22 小时多开着 27 台空转机器，资源和费用浪费巨大
            - text: 给原来的 3 台机器写一段代码，让 CPU 自动变成十倍主频
              why: 软件无法突破单颗物理 CPU 的硬件频率上限
          explain: 这就是云的**弹性**：不仅能按需变大，更重要的是高峰一过能自动缩回去，把费用只花在真正有流量的时段。
      - card:
          title: 垂直扩展 vs 水平扩展与弹性
          body: |
            提升系统吞吐有两条路：给单台机器换更多 CPU 和内存叫垂直扩展（容易碰到硬件天花板，且升配常常要重启）；把工作分给多台相同的实例共同承担叫**水平扩展（horizontal scaling）**。

            结合云控制面的按需申请与释放（NIST 7.4、8.1），在负载升高时自动加实例、负载回落时自动减实例的能力叫**弹性（elasticity）**。
      - card:
          title: 安全裕量：为什么不能把 CPU 跑到 100%
          body: |
            假如一台实例满载最多能处理 200 请求/秒，能按刚好 200 去规划吗？不能。一方面新实例启动需要几十秒到几分钟，另一方面排队论下利用率逼近 100% 时响应延迟会急剧飙升。

            工程上常设定一个**目标利用率**（例如 70%）。单实例有效容量等于 `满载吞吐 × 目标利用率`，留出的 30% 缓冲用来接住突然到来的毛刺请求和扩容启动窗口。
      - item:
          id: q-capacity-basic
          type: number
          prompt: 一个 Web 服务每个实例满载最多处理 120 请求/秒，工程上设定目标利用率为 75%（留 25% 缓冲）。当业务峰值达到 1000 请求/秒时，至少需要多少个实例？（填整数）
          answer: 12
          explain: 每个实例的有效承载量为 120 × 0.75 = 90 请求/秒；峰值需要 1000 / 90 ≈ 11.11 个实例，必须向上取整为 12 个（11 个只能扛 990 请求/秒）。
      - card:
          title: 例题：计算弹性容量与 HPA 自动扩缩副本数
          body: |
            看两道在容量规划与 Kubernetes Pod 水平自动伸缩（HPA）中天天要算的题：
            1. 单实例满载 200 请求/秒、目标利用率 70%，峰值 5000 请求/秒要几台？
            2. HPA 公式：$\text{desiredReplicas} = \lceil \text{currentReplicas} \times \frac{\text{currentMetric}}{\text{desiredMetric}} \rceil$。现有 4 个副本，当前平均 CPU 利用率 90%，目标利用率 60%，HPA 会把副本扩到几个？
          reveal:
            - title: 第 1 步：算单实例有效容量并向上取整
              body: 每实例有效容量 = $200 \times 70\% = 140$ 请求/秒。所需实例数 = $\lceil 5000 / 140 \rceil = \lceil 35.71 \rceil = 36$ 个。不能四舍五入成 35，否则 35 × 140 = 4900 < 5000。
            - title: 第 2 步：套入 HPA 比例公式算出期望副本数
              body: 现有 4 个副本、平均利用率 90%，比目标 60% 高出 1.5 倍：$\lceil 4 \times \frac{90}{60} \rceil = \lceil 6 \rceil = 6$ 个副本。等负载降到 36% 时（若当时有 5 个副本），$\lceil 5 \times \frac{36}{60} \rceil = 3$ 个。
      - item:
          id: q-hpa-up
          type: number
          prompt: 某服务当前正在运行 6 个副本，HPA 设定的目标平均 CPU 利用率为 50%。午间流量上升后测得当前平均 CPU 利用率为 80%，按 HPA 公式计算期望扩展到多少个副本？（填整数）
          answer: 10
          explain: 代入公式：ceil(6 × (80 / 50)) = ceil(9.6) = 10 个副本。
      - item:
          id: q-hpa-scale
          type: number
          prompt: 一个服务当前运行 5 个副本，HPA 配置的目标平均 CPU 利用率为 60%。此时监控测得所有副本的平均 CPU 利用率降到了 36%，按 HPA 期望副本数公式，缩容后的目标副本数是多少？
          answer: 3
          explain: 代入 HPA 公式：ceil(5 × (36 / 60)) = ceil(5 × 0.6) = 3 个副本。
      - card:
          title: 避免“震荡抖动”：容忍度、冷却窗口与预热
          body: |
            实际运行 HPA 时，如果利用率刚从 60% 跳到 61% 就扩容、下一秒掉到 59% 又缩容，集群就会不停地创建和销毁副本，叫做**抖动（flapping）**。

            因此控制器通常会设两道防线：第一是**容忍死区**（如默认 ±10% 偏差内不动，60% 目标在 54%–66% 之间不触发动作）；第二是**缩容稳定窗口**（如观察过去 5 分钟都持续偏低才真正缩容，扩得快而缩得稳）。
      - item:
          id: q-hpa-flapping
          type: choice
          prompt: 生产环境配置自动扩缩容时，为什么通常让“扩容”几乎立即触发，却给“缩容”加上几分钟的稳定观察窗口（stabilization window）？
          options:
            - text: 流量突增需要马上顶住防止雪崩，而过早缩容一旦下一分钟流量回弹会引发反复创建销毁实例的抖动
              correct: true
            - text: 因为云服务器销毁虚拟机比创建虚拟机慢十倍
              why: 销毁往往很快，慢的是新实例拉镜像启动预热；设稳定窗口是为了避免误缩后又急忙重扩
            - text: 因为只有缩容需要按小时计费，扩容不需要花钱
              why: 扩容新实例立刻开始计费，稳定窗口针对的是性能稳定性与抖动问题
          explain: 扩容追求保命（快速响应峰值），缩容追求稳妥（确认波峰真过去了再回收，避免刚回收又遇到第二波请求而产生冷启动抖动）。

  - id: sharding-stateless
    chapter: 弹性
    title: 键值分片与无状态编程
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你把一个购物网站的“购物车数据”直接存放在 Web 服务器进程的 Python 字典里。后来访问量增大，你在前面加了负载均衡器，把请求轮流分给 3 台一样的 Web 服务器。用户最先会遇到什么怪事？
          options:
            - text: 把商品加入购物车（请求落到服务器 1）后刷新页面（请求落到服务器 2），购物车竟然变空了
              correct: true
            - text: 3 台服务器会通过无线电自动合并各自内存里的 Python 字典
              why: 不同机器的进程地址空间完全独立，除非你自己发网络请求同步，否则彼此看不见内存
            - text: 负载均衡器永远只会把请求发给第一台服务器
              why: 负载均衡的职责正是把请求分散到多台后端实例上
          explain: 当用户状态绑在单台应用服务器内存中时，多实例水平扩展和随时替换实例就会立刻出错——这就是为什么云原生讲究无状态计算。
      - card:
          title: 无状态编程：计算与状态分离
          body: |
            Cornell CS5412 第 3 讲把**无状态（stateless）**程序定义为：实例本身不在本地内存或本地盘保留跨请求的长期状态。每次请求带着身份凭证进来，需要读写的数据全部交给后端专门的存储服务，算完直接返回。

            具体分工通常长这样：
            - **登录会话 / 短期状态**：放进集中式内存缓存（如 Redis），或用带签名的令牌让客户端自带
            - **用户上传的图片/视频**：放进对象存储（如 S3 / OSS）
            - **订单与账户等持久记录**：放进托管数据库
      - item:
          id: q-stateless-why
          type: choice
          prompt: 为什么要尽量把云上的应用服务层设计成“无状态”？
          options:
            - text: 任意一台实例随时可以新增、销毁或替换，负载均衡器能把请求发给任何一台健康实例，扩缩与容错都变得简单
              correct: true
            - text: 无状态程序不需要消耗 CPU 和内存就能运行
              why: 无状态服务依然在内存里处理当前请求，只是请求结束后不在本地长期留存状态
            - text: 无状态服务可以彻底省掉数据库和存储费用
              why: 状态不是消失了，而是集中迁移到了外部缓存、对象存储和托管数据库里
          explain: 把状态剥离到专业存储层后，前面几十上百台计算实例就变成了完全等价的“标准积木”，坏了直接丢、忙了直接加。
      - item:
          id: q-state-where
          type: match
          prompt: 把无状态 Web 服务里需要保存的各类状态与最合适的外部托管位置连线。
          pairs:
            - [用户登录会话与购物车临时状态, 集中式外部缓存（如 Redis）或签名令牌]
            - [用户上传的高清图片与视频文件, 外部对象存储（如 S3 / OSS）]
            - [订单流水与账户余额等持久事务记录, 外部托管关系数据库]
          explain: 会话放外部缓存、大文件放对象存储、核心事务数据放托管数据库，应用实例自身就不留任何必须保住的本地状态。
      - card:
          title: 当单个存储装不下：键值分片（Sharding）
          body: |
            计算层可以无状态地加到 100 台，但后端存储的数据最终还要落盘。当数据达到 TB 级或每秒百万次读写时，一台缓存或数据库也装不下、扛不住。

            解法是**分片（sharding）**：把数据按主键划分成多块，分散存到 $N$ 台存储节点上（Cornell CS5412 第 2 讲）。最朴素的规则是按哈希取模：`shard = hash(key) % N`。
      - item:
          id: q-shard-modulo
          type: choice
          prompt: 假设原先用 `hash(key) % 4` 把 1000 个键平均分在 4 台分片服务器上。现在为了扩容加了第 5 台机器，规则改成 `hash(key) % 5`。对于连续整数键 `0..999`（取 `hash(k)=k`），大约有多少比例的键需要从旧机器搬到新机器？
          options:
            - text: 约 80%（800 个键），因为取模底数一变，绝大多数键的余数都跟着变了
              correct: true
            - text: 恰好 20%（200 个键），只搬走新机器该拿的那五分之一
              why: "`k % 4 == k % 5` 只在 20 个周期里的前 4 个成立（即 0, 1, 2, 3, 20, 21…），其余 80% 的余数全都变了"
            - text: 0%，旧机器上的键完全不用动
              why: "扩容后新请求按 `% 5` 查不到原来按 `% 4` 存的旧位置，必须搬迁才能读到"
          explain: 朴素取模扩容引发“雪崩式数据搬迁”：从 4 台扩到 5 台竟然要挪动 80% 的全量数据，这正是需要一致性哈希的原因。
      - card:
          title: 例题：一致性哈希与热点键倾斜
          body: |
            工业界改用**一致性哈希**来降低搬迁比例，同时还得警惕“热点键”把单个分片压垮。一步步算清这两笔账：
            - 场景 1：集群从 4 个节点扩到 5 个节点，把键和节点同时映射到环形哈希空间，理想迁移比例是多少？
            - 场景 2：4 个分片总流量 10,000 请求/秒，其中某位明星发动态的单个热点键就占 40% 流量，其余 60% 均匀落在 4 个分片。最忙那个分片承压多少？
          reveal:
            - title: 第 1 步：算一致性哈希的迁移比例
              body: 环形空间中每个节点只负责逆时针方向上属于自己那一段弧长。当 4 个节点变成 5 个节点时，只需把新节点前面那一段约占全环 $1/5 = 20\%$ 的数据迁给新节点，其余 $80\%$ 的键原地不动！
            - title: 第 2 步：算热点倾斜下的单分片压力
              body: 其余 60%（6000 请求/秒）平均到 4 个分片，每片 1500 请求/秒；而热点键全部集中落在某 1 个分片上（4000 请求/秒），于是该分片总负载高达 $4000 + 1500 = 5500$ 请求/秒（占全集群 55%），哪怕再加分片也帮不了这个单一热点键。
      - item:
          id: q-hotkey-fix
          type: choice
          prompt: 一张百万级用户的键值表用一致性哈希分了 8 个分片，存储容量很均匀，但全站 40% 的读请求都打在同一个大 V 的主键 `user:vip1` 上，导致第 3 号分片 CPU 飙满。下面哪种做法能真正缓解单分片过载？
          options:
            - text: 在应用层或前置本地缓存缓存 `user:vip1` 的只读热点副本，或把热点键拆成带随机后缀的多个子键分散读
              correct: true
            - text: 把分片总数量从 8 个直接翻倍到 16 个
              why: 无论分成多少片，同一个 `user:vip1` 经过哈希后依然只落进某一个分片
            - text: 把分片规则从一致性哈希改回 `hash(key) % 16`
              why: 换取模规则一样把单个键映射到唯一分片，解决不了单键读热点
          explain: 分片能均摊“很多不同键”的流量，但救不了“同一个键被疯狂读取”的热点倾斜——对热点键必须在分片前面加只读缓存或对键加盐拆分。

  - id: availability-geoscale
    chapter: 弹性
    title: 可用区、容错、跨地域一致性与流言故障
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 某团队把网站的主服务器和备用数据库放在同一栋机房大楼的相邻两个机柜里，结果某天市政施工挖断了这栋楼门口的总光缆和主供电线路，主备同时离线 4 小时。问题根源在哪？
          options:
            - text: 主备节点落在了同一个物理故障域里，供电与网络没有真正独立隔离
              correct: true
            - text: 服务器数量太少，同一机柜里应该放 10 台才行
              why: 只要共享同一套楼宇供电和光缆出口，放 100 台也会一起掉线
            - text: 主备之间不应该有网络连接
              why: 主备同步必须通过低延迟网络互联，但机房本身必须属于不同的供电与网络区域
          explain: 高可用的第一条铁律是“别把鸡蛋放进同一个故障域”——云计算用区域和独立物理故障域来把风险隔离开。
      - card:
          title: 区域（Region）与可用区（Availability Zone）
          body: |
            云厂商按地理范围提供**区域（region）**（例如“北京”“东京”“法兰克福”），用来贴近用户降低网络延迟或满足当地法规。

            每个区域内部通常由多个**可用区（availability zone，AZ）**组成：同一个区域里的不同可用区往往分布在相距几十公里的独立机房里，各有独立的电力、制冷与网络接入，同时之间有毫秒级低延迟光纤互联。
      - card:
          title: 可用性与“几个 9”怎么算
          body: |
            云服务常用的 SLA（服务等级协议）用百分比表示可用性。按 1 年 = 365 天 = 525,600 分钟（30 天 = 43,200 分钟）计算：
            - **99.9%（三个 9）**：一年允许停机 $525600 \times 0.1\% = 525.6$ 分钟（约 8.8 小时，每月 43.2 分钟）。
            - **99.99%（四个 9）**：一年仅允许停机 $52.56$ 分钟（每月 4.32 分钟）。

            注意多台独立节点并行时故障率相乘：若单个 AZ 故障概率是 $p = 0.01$（99%），两 AZ 独立同垮概率只有 $p^2 = 0.0001$（99.99%）。
      - item:
          id: q-sla-downtime
          type: number
          prompt: 某托管数据库承诺月度（按 30 天 = 43,200 分钟计）可用性达到 99.99%（四个 9）。它在一个月内最多允许累计不可用多少分钟？（支持小数）
          answer: 4.32
          tolerance: 0.01
          explain: 30 天共有 30 × 24 × 60 = 43,200 分钟；99.99% 意味着最多 0.01%（即 0.0001）的时间不可用，43200 × 0.0001 = 4.32 分钟。
      - card:
          title: 跨地域强一致的物理代价
          body: |
            既然多可用区好，那把两个副本分别放在北京和伦敦，岂不是连地震都不怕？Cornell CS5412 第 5 讲提醒：这里有个物理硬约束——光速。

            如果你想保证**强一致性（strong consistency）**——即任何一次写入返回成功前，远在另一座城市的副本也必须先落盘确认——光在光纤里往返北京与伦敦一趟就要上百毫秒。跨地域部署必须在“全球强一致的慢写入”和“本地先写、异步复制（可能丢最后几秒数据）”之间做权衡。
      - item:
          id: q-geoscale-tradeoff
          type: choice
          prompt: 某全球社交软件把主库放在法兰克福、备库放在新加坡，两者之间网络往返延迟约 160 毫秒。如果强行要求“每条发帖必须等新加坡副本也确认落盘后才返回成功”，最直接的代价是什么？
          options:
            - text: 每次写操作至少额外多出上百毫秒同步等待延迟，一旦跨洲光缆抖动写入还会直接卡顿或失败
              correct: true
            - text: 强一致性会自动把跨洲光纤延迟缩短到 0.1 毫秒
              why: 软件协议无法突破光在光纤中的传播速度上限
            - text: 异步复制会比同步强一致更慢
              why: 异步复制本地落盘就返回，写延迟低，代价是极端灾难下可能丢失最后尚未同步的几秒写入
          explain: 跨地域（Geoscale）部署不存在免费午餐：同城可用区延迟 1–2 毫秒适合同步强一致；跨洲则必须在强一致的高写延迟和异步复制的潜在微丢数之间取舍。
      - card:
          title: 例题：设计一个能抗住单可用区故障的 Web 应用
          body: |
            假设你的 Web 应用服务某个区域的用户，既要抗住整栋可用区机房断电，又要保证已提交订单不丢失。按分层拆出部署方案：
            - 接入层、应用层、数据库层、静态资源层各怎么放？
          reveal:
            - title: 第 1 步：接入与无状态应用层跨多可用区铺开
              body: 在区域边缘放跨多个可用区的负载均衡器；后端无状态 Web 实例的自动伸缩组均匀分布在至少 2 个（更好是 3 个）可用区里。单 AZ 断电时，负载均衡秒级摘除故障区实例，其余区继续服务。
            - title: 第 2 步：有状态数据与静态文件各自容灾
              body: 关系数据库启用“同区域多可用区主备同步复制”——同城可用区间延迟只有 1–2 毫秒，既能同步确认不丢单，又能自动故障转移；用户上传图片存进跨区冗余的对象存储并接 CDN；最后定期做断网故障演练验证切换真有效。
      - item:
          id: q-az-arch
          type: choice
          prompt: 某团队想构建能承受单个可用区整体断电的电商 Web 应用，下面哪项设计存在单点故障隐患？
          options:
            - text: 负载均衡与应用实例跨 2 个可用区部署，但数据库只建了单机实例放在可用区 A
              correct: true
            - text: 数据库启用同区域跨可用区同步主备，坏掉主库所在 AZ 时自动切换到备库
              why: 同区域可用区间延迟极低，同步主备既防丢数又能在单 AZ 故障时自动接管
            - text: 静态图片存进默认多可用区冗余的对象存储，并配 CDN 分发
              why: 云厂商的对象存储通常在区域内跨多个 AZ 自动冗余副本
          explain: 木桶效应决定系统只能扛住最弱一环：只要数据库还单机留在可用区 A，可用区 A 一断电整个站点写操作立刻瘫痪。
      - card:
          title: 灾难案例：流言协议如何把局部抖动放大成雪崩
          body: |
            为什么大型云机房有时明明没有被挖断光缆，却会突然整片雪崩？Cornell CS5412 第 6 讲分析过一个经典灾难：大规模集群靠节点互发心跳（流言协议，gossip）探测谁还活着。

            一旦某段交换机出现短暂抖动，节点 A 收不到 B 的心跳便四处传话“B 挂了”。如果缺乏冷静确认，成百上千个节点忙着转发故障通告和重选主节点，会把控制带宽彻底挤爆，连带真健康的节点也收不到心跳而被集体踢出集群。
      - card:
          title: 实践中的容错三把斧：超时、熔断与带抖动退避
          body: |
            另一类常见放大器是**重试风暴**（第 8 讲）：下游变慢时上游立刻死命重试，请求量瞬间翻好几倍，把濒危服务彻底压垮。

            因此实践中的容错靠三道防线：给每次远程调用设明确**超时**防止线程耗尽；用**熔断器（circuit breaker）**在下游持续报错时快速失败并走降级兜底；用“指数退避 + 随机抖动（jitter）”把重连请求打散在时间轴上。
      - item:
          id: q-circuit-breaker
          type: choice
          prompt: 支付系统依赖的风控微服务因为数据库慢查询突然响应极慢，上游结算服务里的大量线程都在原地阻塞等风控接口 30 秒超时，结果把整个结算网站拖垮。下列哪种容错措施最能阻断这种级联雪崩？
          options:
            - text: 缩短超时并配置熔断器：检测到风控接口连续报错超时后立刻快速失败或走降级规则，同时配合带随机抖动的指数退避重试
              correct: true
            - text: 把上游结算服务的超时时间从 30 秒延长到 300 秒，并让失败请求立刻无限循环重试
              why: 超时拉长会让线程/连接被占满得更久，无退避无限重试则会把慢服务彻底打死
            - text: 关掉所有健康检查和错误日志，假装下游没有慢下来
              why: 掩盖监控只会让雪崩在无人察觉时扩大
          explain: 容错的关键是“把故障关在隔舱里”：超时保护资源不被耗尽，熔断器及时止损并触发降级，退避加抖动防止大家在同一毫秒齐刷刷重试打垮恢复中的下游。

  # ======================================================================== 多租户
  - id: multitenancy-isolation
    chapter: 多租户
    title: 多租户隔离：共享集群还是专用集群
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一家云服务商同时托管了甲公司和乙公司的后台任务。某天甲公司的程序突然启动 500 个死循环线程疯狂读写同一块物理共享磁盘，把硬盘队列塞满。这最可能直接连累到乙公司什么？
          options:
            - text: 乙公司程序即使自己没出错，磁盘读写和响应延迟也会被严重拖慢
              correct: true
            - text: 乙公司的 Python 代码语法会自动变成甲公司的 C++ 语法
              why: 资源抢占影响的是性能、时延或配额，不会改写另一租户的代码语法
            - text: 乙公司一定会因此立刻获得双倍免费 CPU 算力
              why: 共享资源被挤占只会降低可用性能，不会平白增加算力
          explain: 多家客户共用同一套底层硬件和集群，就像合租一栋公寓——隔壁半夜开电钻，你在自己房间里照样睡不好觉，这就是**吵闹邻居**问题。
      - card:
          title: 什么是多租户（Multi-tenancy）与租户
          body: |
            云服务能卖得比自建机房便宜，很大程度上靠规模共享：**多租户（multi-tenancy）**指多个彼此独立的客户、部门或团队（各自称为一个**租户**）共用同一套底层基础设施、集群或应用实例（NIST 8.5.4、K8s 多租户文档）。

            省钱的另一面是两类风险：一类是安全越权（甲租户偷看或删掉乙租户的资源），另一类是**吵闹邻居（noisy neighbor）**——甲租户突发抢光 CPU、内存或磁盘带宽，把同机乙租户拖垮。
      - card:
          title: 隔离的两个维度：控制面 vs 数据面
          body: |
            参照 Kubernetes 多租户官方文档，隔离需要同时管住两条线：
            - **控制面隔离**：谁能查询、创建、修改或删除哪些集群对象与配置，防止甲团队删掉乙团队的服务。常用**命名空间（namespace）**划分边界，再配合基于角色的访问控制（RBAC）限制权限。
            - **数据面隔离**：运行时网络流量互不串通（用网络策略限制跨组通信），以及 CPU、内存与磁盘开销互不挤占。
      - item:
          id: q-control-vs-data
          type: choice
          prompt: 公司把电商团队和财务团队的服务都部署在同一个集群里。运维设置了精细的 RBAC 权限，确保电商开发人员无权查看或操作财务团队的部署配置；但某天电商应用遭入侵，攻击者从电商容器里直接向财务数据库内网端口发起了扫描和连接。这暴露了哪一侧隔离缺失？
          options:
            - text: 数据面网络隔离缺失：虽然控制面 API 权限分开了，但运行时的容器网络流量没有用网络策略隔开
              correct: true
            - text: 控制面完全没有用，说明 RBAC 在所有系统里都不起作用
              why: RBAC 管住了谁能调集群管理 API，但它不负责拦截运行时 Pod 之间直接发出的 IP 数据包
            - text: 因为没有把 Python 版本升级到最新
              why: 容器间横向内网访问是网络策略问题，与 Python 小版本号无关
          explain: 权限管理（控制面）管的是“谁能发管理指令”，网络策略与资源限制（数据面）管的才是“跑起来的程序彼此能连谁、能吃多少资源”。
      - card:
          title: 命名空间与资源配额：治住吵闹邻居
          body: |
            光把对象装进各自命名空间还不够防吵闹邻居——如果甲命名空间一口气申请 1000 GB 内存，照样能把共享集群吃空。

            因此平台会给每个命名空间绑定**配额（quota）**：限制该租户累计最多申请多少 CPU 核数、内存字节数、持久卷容量与实例个数；再配合单实例默认上下限，把资源爆炸关在租户自己的额度里。
      - item:
          id: q-quota-math
          type: number
          prompt: 一套共享集群总计有 64 核可分配 CPU。平台划出 3 个独立命名空间给 A、B、C 三个租户，其中 A 配额 24 核，B 配额 24 核，其余留给 C。请问租户 C 最多能拿到多少核 CPU 配额而不超卖集群总量？
          answer: 16
          explain: 为了不发生总配额超卖，64 − 24 − 24 = 16 核。这样即使 A 和 B 同时打满各自配额，C 的基本额度也有保障。
      - item:
          id: q-isolation-mechanisms
          type: match
          prompt: 把多租户集群中的四项具体隔离机制与它主要管住的对象连线。
          pairs:
            - [命名空间 + RBAC 角色权限, 控制面对象的增删改查权限边界]
            - [网络策略（NetworkPolicy）, 数据面里不同租户 Pod 之间的横向网络互通]
            - [ResourceQuota 与容器上下限, 单个租户能申请的 CPU/内存总量，防吵闹邻居]
            - [独立集群搭配专用物理节点, 宿主机内核与硬件级物理隔离]
          explain: 逻辑分隔靠命名空间与 RBAC，网络互通靠策略，资源抢占靠配额，强内核隔离则必须拆集群或物理节点。
      - card:
          title: 三种隔离方案的成本与强度权衡
          body: |
            根据业务敏感度和预算，K8s 多租户设计把隔离分成三档：

            | 方案 | 隔离做法 | 隔离强度与风险 | 成本与运维开销 |
            |---|---|---|---|
            | 档位 1 | 同命名空间 + RBAC/网络策略 | 弱：易配错越权、控制面易混 | 最低：适合同团队微调 |
            | 档位 2 | 独立命名空间 + 配额 + 策略 | 中：控制面/资源分账清，仍共享宿主机内核 | 适中：公司内部多部门首选 |
            | 档位 3 | 独立集群 / 独立物理机 | 强：硬件与内核彻底隔离，无逃逸串扰 | 最高：适合强监管/外部高敏租户 |
      - card:
          title: 例题：为不同团队选择多租户隔离档位
          body: |
            面对下面两个真实业务，你会把它们放在同一集群还是拆开？按上面三档对照分析：
            - 场景甲：公司内部 4 个互信的后端业务小组共用一套测试开发集群，希望互相别删错服务、别把节点内存打爆，预算有限。
            - 场景乙：某医院核心病历处理系统与外部第三方开放试用沙箱（允许用户上传任意代码运行），都要上云。
          reveal:
            - title: 第 1 步：分析场景甲（内部互信多团队）
              body: 4 个组同属一家公司、风险主要是误操作和吵闹邻居，不需要花钱养 4 套控制平面。选**档位 2（独立命名空间 + RBAC + 网络策略 + 配额）**，成本低且能防误删与资源挤占。
            - title: 第 2 步：分析场景乙（高敏数据 + 不可信外部代码）
              body: 医院病历涉及强监管与患者隐私，而外部沙箱可能含恶意漏洞利用。若放同一共享集群，一旦发生内核或虚拟化逃逸（NIST 7.5、10.4 指出的风险），后果灾难性。必须选**档位 3（独立集群乃至独立物理主机）**，用更高成本换最高隔离强度。
      - item:
          id: q-isolation-tier
          type: choice
          prompt: 某 SaaS 云厂商为一家大型银行和一家普通免费试用平台同时提供服务。银行要求无论成本多少，都不允许自己的工作负载与任何外部不可信租户共享同一个操作系统内核或集群控制平面。应推荐哪种方案？
          options:
            - text: 独立集群搭配专用节点/物理主机（档位 3）
              correct: true
            - text: 所有人放在同一个命名空间里，只靠前端网页隐藏按钮区分
              why: 同命名空间连最基本的逻辑权限都混在一起，更别提共享内核
            - text: 独立命名空间 + 配额（档位 2），继续共享同一套宿主节点与控制平面
              why: 档位 2 仍共用同一个控制平面和宿主机内核，无法满足银行“不共享内核与控制面”的硬要求
          explain: 隔离强度永远是用基础设施和运维成本换来的；强合规与不可信代码混跑场景必须用物理/独立集群隔离，不能只靠逻辑命名空间。

  - id: privacy-compliance
    chapter: 多租户
    title: 云上隐私、合规与数据驻留
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你的公司把所有用户资料都存进了云端对象存储，还仔细设置好了登录密码。但为了便宜和更快访问，你忘了打开磁盘与传输加密，也没配置访问审计日志。下面哪种说法最符合云安全与合规现实？
          options:
            - text: 即使黑客没破解密码，云上明文传输可能被窃听、未加密快照可能外泄，且出事后查不出谁何时动过数据
              correct: true
            - text: 只要放在云厂商机房里，所有数据法律上自动算作“已经加密合规”
              why: 机房物理安全不等于数据内容安全，很多法规明确要求数据本身在存储和传输中加密
            - text: 不写审计日志反而更安全，因为日志里全是秘密
              why: 规范的审计日志只记“谁、何时、访问了什么资源、是否成功”，不记明文密码，是事后追责和发现入侵的依据
          explain: 云上隐私与合规不能指望“别人不知道地址”，必须落实在密码学加密、最小权限、审计留痕和地域边界上。
      - card:
          title: 云上隐私的三道锁：传输、静态与密钥控制
          body: |
            Cornell CS5412 第 17 讲聚焦云端隐私保护的核心防线：
            1. **传输加密**：所有跨网乃至机房内东西向服务调用都用加密信道，防止在途嗅探。
            2. **静态加密（encryption at rest）**：数据库文件、对象存储和备份快照落盘前加密，避免旧硬盘报废或快照误公开时直接暴露明文。
            3. **密钥谁掌管**：普通方案由云平台托管密钥；高敏业务改用客户自管密钥（KMS/BYOK），连云平台运维未经授权也解不开业务数据。
      - item:
          id: q-byok
          type: choice
          prompt: 某金融机构不仅开启了云盘静态加密，还进一步要求使用“客户自管密钥（BYOK / 独立 KMS）”而不是完全交给云厂商默认托管密钥。这样做的核心收益是什么？
          options:
            - text: 客户自己掌握密钥的启用、轮换与吊销权限，即使云平台侧发生运维越权或快照流出，没有客户密钥授权依然解不开明文
              correct: true
            - text: 客户自管密钥可以让磁盘读写速度提高十倍
              why: 加密和密钥管理只负责访问控制与保密性，不会加速硬件 I/O
            - text: 使用自管密钥后，不再需要给数据库设置任何用户访问权限
              why: 静态加密防的是介质与快照泄露；应用层的最小权限和租户隔离仍然必不可少
          explain: 客户自管密钥把“数据控制权的最后一把钥匙”握在自己手里，一旦怀疑风险可以立刻吊销密钥使密文失效。
      - card:
          title: 容易被忽略的泄露口：元数据、日志与备份
          body: |
            隐私泄露往往不出在主数据库，而藏在旁路里：
            - 错误把调试日志里的用户手机号、身份证号、访问令牌直接打进集中日志系统。
            - 给某个只读数据分析员开了过宽的整个存储桶权限，违背最小权限原则。
            - 生产库开启了加密和严格权限，但每天生成的离线备份和快照却未加密，或放在所有人可读的共享位置。
      - item:
          id: q-privacy-leak
          type: choice
          prompt: 一家医疗 App 把病历主数据库做了高强度静态加密并严格限制访问，但工程师排查故障时在日志打印中直接输出了包含患者姓名与诊断结果的完整请求体，并把日志收集进了全员研发可读的调试平台。这违反了哪项隐私原则？
          options:
            - text: 旁路日志脱敏与最小权限原则：敏感个人数据经过明文日志旁路泄露给了不该看的人
              correct: true
            - text: 违反了静态加密一定要由硬件 CPU 自己发明新算法的要求
              why: 加密应当用标准公开算法，这里的问题是日志未脱敏且访问范围失控
            - text: 应该禁止服务器记录任何运行日志，哪怕只记录错误码也不行
              why: 需要记录脱敏后的请求编号、错误码与耗时，禁止的是把原始个人隐私直接落入宽权限日志
          explain: 保护隐私必须盯住数据的全路径（主库、缓存、备份、日志、报错栈），任何一环以明文流向低权限区域都会形成木桶短板。
      - card:
          title: 合规与数据驻留（Data Residency）
          body: |
            NIST 8.4 把**合规（compliance）**列为企业上云的硬约束。不同行业和国家有强制规范（例如医疗 HIPAA、支付卡 PCI-DSS、欧盟 GDPR 或本地等保要求）。

            其中最直接影响云架构的一条是**数据驻留（data residency）**：法规规定某些用户数据必须物理存储在特定国家或区域内部。如果你在法兰克福建库，却图方便把自动异地灾备开启到了海外另一个大洲，技术上看似更安全，法律上却直接违规。
      - item:
          id: q-residency
          type: choice
          prompt: 某跨境电商在欧盟区域（法兰克福）存储欧盟用户的个人订单信息。为了防极端自然灾害，运维工程师随手开启了“跨大洲自动异地备份”，每天把快照复制一份存到美洲某区域。这首先最可能触碰什么风险？
          options:
            - text: 违反数据驻留（Data Residency）与跨境传输合规要求，即使备份已加密也必须先经合规审查
              correct: true
            - text: 只要跨越海洋，TCP 协议就一定传输不了备份文件
              why: 跨洲网络完全可以传输备份，问题在法律与合规边界而不是网络不可达
            - text: 跨洲复制会自动把原来的数据从法兰克福删除
              why: 灾备复制保留多份副本，正因为副本跑出了指定地域才触碰数据驻留红线
          explain: 灾备与容灾不能只看可用性，还要看地域限制：需在合规允许的同司法辖区内挑选第二区域或同区多可用区。
      - card:
          title: 例题：审查一份多租户 SaaS 的隐私与合规清单
          body: |
            假设你接手审计一套共享集群里的多租户 HR SaaS 系统，发现了以下 4 条现状。逐条排查风险并给出整改动作：
            1. 查询语句只写了 `SELECT * FROM salary WHERE emp_id = ?`，靠前端传对员工编号；
            2. 所有租户导出的报表都放在同一个对象存储桶里，应用用同一把超管密钥读写；
            3. 静态存储开了加密，但审计日志关闭；
            4. 欧盟租户的夜间备份被脚本传到了北美节点。
          reveal:
            - title: 第 1 步：堵住逻辑越权与共享存储桶风险（1、2）
              body: 第 1 条缺后端强制的 `tenant_id` 校验，修改 URL 参数就能跨租户偷看工资（越权漏洞），必须在服务端会话验证后强制拼接租户隔离条件；第 2 条不能共用一把万能密钥，应按租户分目录前缀并用细粒度临时凭证限制只能访问本租户路径。
            - title: 第 2 步：补齐可审计性与数据驻留边界（3、4）
              body: 第 3 条关闭审计日志导致出事无法追溯，必须打开不可篡改的访问与管理操作审计日志；第 4 条违反数据驻留，应把欧盟租户备份限制在欧盟境内其他区域（如法兰克福到都柏林）。
      - item:
          id: q-audit-purpose
          type: match
          prompt: 把下面云隐私与合规控制措施与其防范的风险对应起来。
          pairs:
            - [强制开启静态加密与客户自管密钥, 物理介质失窃或快照泄露时仍无法读出明文]
            - [开启不可篡改的操作与数据访问审计日志, 发生越权或泄露后能追踪谁何时访问过何资源]
            - [在合规区内配置区域白名单策略, 防止误操作把备份或实例建到境外触犯数据驻留]
            - [每次查询由服务端从鉴权令牌提取 tenant_id, 防止请求篡改编号后跨租户窃取他人记录]
          explain: 合规与隐私靠“技术控制 + 审计证据”双轨落地：加密护数据、租户校验防串库、地域限制守驻留、审计日志留证据。

  # ======================================================================== 编排
  - id: k8s-architecture
    chapter: 编排
    title: 集群编排：控制平面、节点与调度器
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你手里有 50 台服务器，上面跑着 200 个微服务进程。夜里 3 点其中 1 台服务器突然硬件死机，上面跑着 6 个核心服务进程。如果没有自动化编排系统，会发生什么？
          options:
            - text: 那 6 个服务会一直掉线，直到有人半夜被报警叫醒、手动挑一台还有余量的机器重开它们
              correct: true
            - text: 剩下的 49 台机器会通过心灵感应自己接管那 6 个程序
              why: 没有编排控制循环时，其他机器根本不知道宕机机器上原先跑过什么任务
            - text: 硬件死机后进程依然能继续在空气里算完所有请求
              why: 物理机器掉电后内存里的所有进程瞬间消失
          explain: 手工管几台机器还行，一旦上百个任务分散在几十台机器上，就必须有一个不知疲倦的“集群大脑”盯着健康状态、自动重新安家——这就是**编排**。
      - card:
          title: 什么是容器（Container）、镜像仓库与编排
          body: |
            把服务四处搬家时，如果每台机器装的 Python/系统库版本不一样，程序到了新机器照样跑不起来。

            **容器（container）**利用操作系统内核的命名空间与资源限制，把应用代码连同它需要的依赖库、环境变量打包成一个标准**镜像**，上传到**镜像仓库（image registry）**。任何一台机器只要从仓库拉下这个镜像，就能在隔离环境里跑出完全一致的行为；而管理成百上千个容器放哪台机器、挂了怎么重启，就是**编排（orchestration）**。
      - card:
          title: 集群骨架：控制平面与节点（Nodes）
          body: |
            以最经典的 Kubernetes（K8s）为例（大纲第 13 章）：集群分成**节点（node）**与**控制平面（control plane）**。
            - **节点**：实际干活的物理机或虚拟机。每台节点上跑着本地代理 `kubelet` 和容器运行时，负责领任务、启动或停掉容器、汇报本机剩余 CPU/内存与健康情况。
            - **控制平面**：集群大脑，包括统一入口 **API Server**、存储全集群期望状态的键值数据库 **etcd**、调度器，以及持续纠偏的各类控制器。
      - item:
          id: q-node-kubelet
          type: choice
          prompt: 在 Kubernetes 集群中，工作节点（Node）和中心控制平面是怎样协同把一个新容器拉起来的？
          options:
            - text: 用户把期望状态发给 API Server 存进 etcd；调度器选定目标节点后，该节点上的 kubelet 监听到分派任务并在本机启动容器、回报状态
              correct: true
            - text: etcd 直接通过 SSH 登录每一台工作节点手动敲启动命令
              why: etcd 只是一个存储集群状态的数据库，不会主动连接工作节点发命令
            - text: 每个容器自己决定去哪台服务器运行，不需要控制平面参与
              why: 新容器在启动前还没有运行起来，挑选落脚节点的只能是控制平面里的调度器
          explain: 控制平面的设计核心是“所有组件都围绕 API Server 读写状态”：API Server 记下期望，调度器做绑定，各节点的 kubelet 主动看自己的任务清单并照办。
      - card:
          title: 控制器闭环与云控制器管理器
          body: |
            K8s 几乎所有自动化都靠**控制器（Controller）**的“调谐循环（reconciliation loop）”完成：
            1. 观察**当前状态**（现在活着的实例有几个）；
            2. 对比**期望状态**（你在配置里写了要 3 个）；
            3. 有差就干活（少于 3 个就补建，多于 3 个就删掉），循环往复。

            而当集群跑在某家云平台上时，如何向云厂商申请公网负载均衡器或挂载云盘？**云控制器管理器（Cloud Controller Manager）**把这些云厂商专用 API 独立抽出来，让 K8s 核心代码不用为每家云重写一遍。
      - item:
          id: q-ccm-role
          type: choice
          prompt: Kubernetes 控制平面专门拆分出“云控制器管理器（Cloud Controller Manager）”，主要解决什么问题？
          options:
            - text: 把创建云负载均衡器、查询云节点状态与配置云路由等依赖特定云厂商 API 的逻辑解耦出去，让 K8s 核心调度和控制器保持云中立
              correct: true
            - text: 负责替代每个容器内部的用户态应用程序代码
              why: 业务容器跑的是用户代码，云控制器管理器只管集群与底层云平台资源之间的对接
            - text: 专门用来在没有网络的情况下通过蓝牙同步 etcd 数据
              why: etcd 通过集群内网络同步，云控制器管理器对接的是云厂商控制 API
          explain: 解耦是系统软件的常见手法：核心控制器只管 K8s 标准对象，对接各家云平台专属接口的事全部交给可插拔的 Cloud Controller Manager。
      - item:
          id: q-reconcile
          type: choice
          prompt: 假设你在配置里声明“需要始终运行 3 个订单服务实例”。某天夜里一台工作节点断电，导致其中 1 个实例消失，只剩 2 个。控制器的调谐循环接下来会怎么动作？
          options:
            - text: 对比“当前 2 个 ≠ 期望 3 个”，自动向 API Server 申请新建 1 个实例并由调度器放到另一台健康节点上
              correct: true
            - text: 自动修改你的期望配置，把期望副本数从 3 改成 2 以迎合现状
              why: 控制器的原则是“把现状拉回期望”，绝不会擅自篡改用户的期望目标
            - text: 立刻停掉剩下的 2 个实例，等坏掉那台机器修好再一起启动
              why: 这会把局部故障人为扩大成全局停服
          explain: 声明式编排的威力就在“只写你想要的结果（3 个），不写过程命令”；不管中间出了什么故障，调谐循环都会不厌其烦地把现实修回期望。
      - card:
          title: 调度器（Scheduler）的两步选址：过滤与打分
          body: |
            一个新的工作单元刚创建时还没有确定去哪台节点。Kubernetes **调度器**分两步为它找落脚点（大纲 15.1）：
            1. **过滤（Filtering）**：淘汰不符合硬条件的节点——剩余可用 CPU 或内存不够、节点有污点未容忍、端口冲突或硬盘标签不匹配的全筛掉。若一台不剩，任务就一直处于待调度（Pending）状态。
            2. **打分（Scoring）**：给通过过滤的候选节点按规则打分（例如优先资源余量均衡、或把同服务副本分散到不同可用区防单点），挑分数最高的节点完成绑定。
      - card:
          title: 例题：帮新 Pod 从三台节点里挑出合格宿主
          body: |
            集群有 3 台节点，新任务请求（requests）`1000m` CPU（即 1 核）和 `2048 Mi` 内存。三台节点的当前剩余可分配资源如下：
            - `node-1`：总 4000m / 8192Mi，已占 2500m / 4096Mi
            - `node-2`：总 4000m / 8192Mi，已占 1000m / 2048Mi
            - `node-3`：总 4000m / 8192Mi，已占 3500m / 7168Mi

            调度器如何做过滤与打分？
          reveal:
            - title: 第 1 步：逐台算剩余可分配资源做过滤
              body: "`node-1` 剩 1500m CPU、4096Mi 内存（够）；`node-2` 剩 3000m CPU、6144Mi 内存（够）；`node-3` 仅剩 500m CPU 和 1024Mi 内存，两项都不够，在过滤阶段就被直接淘汰。"
            - title: 第 2 步：在合格节点之间打分并绑定
              body: 候选只剩 `node-1` 和 `node-2`。如果策略偏好“把负载摊匀、留下更多余量（LeastRequested）”，`node-2` 空余比例最高（CPU 余 75%、内存余 75%）就会得高分胜出；如果另有规则要求分散在不同可用区且已有同款副本在 `node-2`，则可能反过来选 `node-1`。
      - item:
          id: q-scheduler-pending
          type: choice
          prompt: 工程师部署了一个新任务，指定需要 `2000m`（2 核）CPU。此时集群里共有 3 台节点，每台节点恰好各自只剩 `1000m` 空闲 CPU，加起来明明有 3000m。调度器会怎么处理这个任务？
          options:
            - text: 过滤阶段没有单台节点能拿出 2000m，任务保持 Pending 等待状态而不会启动
              correct: true
            - text: 把这一个容器切开，1000m 跑在 node-1、另外 1000m 跑在 node-2
              why: 单个容器/Pod 不能跨两台机器拆分内存和地址空间运行
            - text: 强行杀掉别人正在运行的正常关键系统进程来腾空间
              why: 调度器不会随意杀低优先级外的普通健康负载来硬塞；只有满足特定抢占规则才会考虑驱逐低优先级 Pod
          explain: 调度资源看的是“单台节点能不能完整装下这个任务”，而不是全集群零散碎片的算术总和。

  - id: k8s-workloads
    chapter: 编排
    title: Pod 与工作负载控制器：从 Deployment 到 CronJob
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 同样是在集群里跑任务，下面三种东西需求截然不同：① 随时增减的无状态网站后端；② 每晚凌晨 2 点跑一次、算完当天账单就退出的程序；③ 每台机器上必须装一个的监控采集代理。把它们全用完全同一种管理方式会怎样？
          options:
            - text: 用错控制器会出乱子：比如批处理程序退出后被当成“异常崩溃”无限重启，或无法保证每台机器正好一个监控代理
              correct: true
            - text: 不会有任何区别，所有任务在集群里都应该无限重启并且随机分布
              why: 算账批处理任务成功退出（exit 0）就不该再重启，而监控代理漏掉一台机器就会出现监控盲区
            - text: 集群本来就只能跑网站后端，跑不了定时批处理任务
              why: 现代编排系统专门为常驻、有状态、单机守护和定时批处理分别准备了对应控制器
          explain: 理解工作负载控制器，关键就是分清你的程序“要不要保持身份/磁盘、是不是每台机都要有一份、是不是跑完就该退场”。
      - card:
          title: 最小调度单位：Pod
          body: |
            在 Kubernetes 里，调度器调度和启停的基本单位不是单个容器，而是 **Pod**（豆荚）。

            一个 Pod 通常只包 1 个主应用容器；有时也会放进 1 个紧耦合的辅助容器（比如边车日志转发器）。同一个 Pod 里的容器共享同一个本地 IP 地址、端口空间和挂接存储卷，可以像本机一样通过 `localhost` 通信；Pod 本身是短暂易逝的，重建后会换新 IP。
      - card:
          title: 无状态主力：ReplicaSet 与 Deployment
          body: |
            实际开发几乎从不直接手建零散的 Pod，因为节点一挂 Pod 就没了。管数量与版本升级靠两层无状态控制器：
            - **ReplicaSet**：像个忠实门卫，死盯一个数字（比如保持 4 个健康 Pod 活着），少了补、多了砍。
            - **Deployment**：包在 ReplicaSet 外面的升级管家！当你发布 v2 新镜像时，Deployment 自动新建一个 v2 的 ReplicaSet，按节奏逐步扩大 v2、缩小 v1（滚动升级）；发现 v2 报错还能一键回滚回旧 ReplicaSet。
      - item:
          id: q-deploy-surge
          type: choice
          prompt: "一个 Deployment 声明期望副本数 `replicas: 4`，滚动升级策略设 `maxSurge: 1`（允许最多比期望多出 1 个临时 Pod）和 `maxUnavailable: 1`（升级过程中最少保证 `4 - 1 = 3` 个 Pod 可用）。升级期间全集群最多同时存在几个该服务的 Pod、最少必须有几个处于可用状态？"
          options:
            - text: 最多同时存在 5 个 Pod，最少必须保持 3 个 Pod 可用
              correct: true
            - text: 最多同时存在 4 个 Pod，最少 0 个可用
              why: "那相当于先全停再全启（停服重建），违背了 `maxSurge: 1` 与 `maxUnavailable: 1` 的约束"
            - text: 最多同时存在 8 个 Pod，最少 4 个可用
              why: "只有 `maxSurge` 为 4 且 `maxUnavailable` 为 0 时才会翻倍到 8 个"
          explain: "`maxSurge` 决定升级期间能临时多占多少资源上限（4 + 1 = 5），`maxUnavailable` 决定服务能力最多能打多少折扣（4 − 1 = 3）。"
      - card:
          title: 有状态与节点守护：StatefulSet 与 DaemonSet
          body: |
            Deployment 里的 Pod 叫什么名字无所谓、挂了就换新盘。但有些负载不行：
            - **StatefulSet**：专管数据库、分布式队列等有状态应用。它给每个 Pod 固定编号名字（如 `db-0`、`db-1`、`db-2`），按顺序启停，并让每个编号永远挂回自己那块独立持久存储盘，哪怕重建到别的节点也找得回自己的旧数据。
            - **DaemonSet**：确保集群里**每一台节点**上（只要没被排除）自动跑起且只跑 1 个副本，新节点加进集群自动补装，适合日志收集、网络插件和节点监控代理。
      - item:
          id: q-stateful-identity
          type: choice
          prompt: 某团队把一个一主两从的分布式数据库塞进了普通 Deployment 里，结果每当其中一个从库 Pod 被重启调度到新节点后，它不仅换了全新的随机名字和 IP，还连不上原先那块持久磁盘里写好的旧数据文件。应该改用什么控制器？
          options:
            - text: 改用 StatefulSet，让每个副本拥有固定序号名称、稳定网络标识并始终重新挂回自己专属的持久存储卷
              correct: true
            - text: 改用 CronJob，每分钟重启一次数据库
              why: CronJob 用来跑完就退出的定时批处理任务，不适合常驻数据库
            - text: 在 Deployment 里把副本数调成 100 个就能找回旧数据
              why: Deployment 的所有副本共享同一套无状态模板，不会替某个特定编号保留并绑定历史数据卷
          explain: 有状态集群的关键需求是“身份固定 + 各自对号入座回自己的持久磁盘”，这正是 StatefulSet 与无状态 Deployment 的分界线。
      - card:
          title: 跑完就退场：Job 与 CronJob
          body: |
            还有一类程序不是 24 小时死等请求，而是算完数据就正常退出（退出码 0）：
            - **Job**：创建 1 个或多个 Pod 跑一次性批处理任务（如数据迁移、视频转码）。如果进程异常失败就重试；一旦成功退出就标记完成、不再无限拉起（大纲 14.2.5）。
            - **CronJob**：相当于集群版的定时闹钟（如 `0 2 * * *` 每天凌晨两点），到点就按模板自动生成一个 Job 去执行账单汇总或清理任务（14.2.6）。
      - item:
          id: q-workload-match
          type: match
          prompt: 把下面四种典型业务与最恰当的 Kubernetes 工作负载控制器配对。
          pairs:
            - [需要滚动升级和随时回滚的无状态 REST API 后端, Deployment]
            - [需要固定主机名 db-0/db-1 且绑定各自独立数据盘的数据库集群, StatefulSet]
            - [必须在集群每台主机上都部署一份的系统指标采集代理, DaemonSet]
            - [每晚凌晨 3 点定时拉起跑一次、生成完日报即退出的统计任务, CronJob]
          explain: 无状态可互换用 Deployment；要固定编号与专属持久盘用 StatefulSet；每台机器必须一份用 DaemonSet；到点执行算完退出用 CronJob。
      - card:
          title: 例题：排查用错工作负载控制器的两起线上故障
          body: |
            下面两起线上事故都是因为选错了工作负载控制器，一步步定位问题与改法：
            - 事故 A：开发用 Deployment 跑了一个“导出昨日报表并上传对象存储”的脚本，结果脚本每跑完一次（正常退出），集群就立刻把它重启再跑一遍，一晚上传了上百次重复报表！
            - 事故 B：运维用 Deployment `replicas: 3` 去部署节点级磁盘日志采集器，结果集群有 3 台节点，调度器却把其中 2 个采集器放到了同一台空闲节点上，第 3 台节点完全没采集到日志！
          reveal:
            - title: 第 1 步：修复事故 A（一次性任务错用常驻控制器）
              body: Deployment / ReplicaSet 的设计假设是“Pod 应该永远活着”，哪怕进程退出码是 0，控制器也会认为现存副本数从 1 变成 0，立即补建重启。导出报表是一次性或周期性任务，应改用 **Job**（单次）或 **CronJob**（定时）。
            - title: 第 2 步：修复事故 B（节点级守护错用普通副本数）
              body: Deployment 只保证“总数是 3”，并不保证“每台节点恰好 1 个”，节点资源不均时完全可能挤在同一台机。节点日志或硬件监控代理必须改用 **DaemonSet**，集群自动在每台节点保底跑 1 份，加机器时还会自动跟上。
      - item:
          id: q-job-vs-deploy
          type: choice
          prompt: "一个用于把数据库旧表结构迁移到新版本的脚本只需要在发版前执行一次，执行成功返回退出码 `0` 后就应该结束。如果误用了 Deployment（`replicas: 1`）来跑它，会发生什么？"
          options:
            - text: 脚本每次成功退出后，ReplicaSet 都会认为当前存活副本变成 0 而不断重新拉起新 Pod 反复运行脚本
              correct: true
            - text: Deployment 会自动认出这是迁移脚本并只执行一次
              why: 控制器只看 Pod 状态和副本数，不知道你代码里写的是不是一次性迁移
            - text: 退出码 0 会触发集群自动把整个 Deployment 删除
              why: Deployment 不会因为容器退出码 0 而自删，只会不断重建 Pod 维持期望副本数
          explain: 常驻服务用 Deployment（退出必重建），算完即止的一次性任务必须用 Job（退出码 0 才算完成）。

  # ======================================================================== 无服务器与成本模型
  - id: serverless-faas
    chapter: 无服务器与成本模型
    title: 无服务器与函数计算（FaaS）
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你做了一个小程序，用户每上传一张头像图片就需要裁剪成缩略图。半夜没人传图，白天每小时断断续续有几十张。如果租一台 24 小时开机的虚拟机盯着等，绝大多数时间 CPU 都在发呆。有没有办法只在真的有图片传上来那 200 毫秒才花钱、其余时间零费用？
          options:
            - text: 有：把裁剪逻辑写成事件触发的函数（FaaS），有图上传才拉起跑那 200 毫秒，闲时缩容到零实例
              correct: true
            - text: 没办法，任何网络程序都必须有一台始终开机的电脑在原地等
              why: 云平台统一托管了事件网关和监听调度，没请求时你的业务实例可以真正缩到零
            - text: 只要把代码删掉就能省下等待费用，下次用再重新写
              why: 代码镜像存在平台，只是不占用正在运行的内存与 CPU 配额
          explain: 这就是**无服务器**计算的核心吸引力：把“一直开着等事件”的基础设施工作外包给云平台，开发者只为真正干活的那几百毫秒买单。
      - card:
          title: 什么是无服务器（Serverless）与 FaaS
          body: |
            **无服务器（serverless）**并不是真的没有物理服务器，而是你不再配置、不管理、也不为空闲服务器付费（阿里云函数计算文档、CS5412 第 3 讲）。

            它通常由两部分组成：现成托管的后端能力（对象存储、消息队列等 BaaS），加上**FaaS（Function as a Service，函数即服务）**——开发者只上传一个个由事件触发（如 HTTP 请求、文件上传、定时消息）的无状态函数，并发请求来了平台就自动同时拉起几十几百份执行，闲下来自动缩到零。
      - item:
          id: q-faas-fit
          type: choice
          prompt: 按照阿里云函数计算与无服务器架构文档的对比，下面哪种业务场景最能发挥 FaaS（缩容到零 + 事件触发）的优势？
          options:
            - text: 突发波峰明显、闲时几乎零流量的图片转码、Webhook 回调和定时报表处理
              correct: true
            - text: 需要在本地内存里常驻保存 80 GB 实时图索引且每秒稳定几万次微秒级读写的引擎
              why: 内存常驻大状态且毫秒/微秒级稳定超高并发的负载适合常驻专用实例，FaaS 的无状态与冷启动反而划不来
            - text: 一旦启动就要连续运行 36 小时不中断的科学仿真计算
              why: FaaS 通常对单次函数执行设有超时上限（如几分钟到十几分钟），长耗时任务更适合批处理 Job 或虚拟机
          explain: FaaS 擅长“短平快、事件驱动、波峰波谷落差大、无本地状态”的任务；长期高负载或超大内存常驻服务还是常驻服务器划算。
      - card:
          title: 冷启动（Cold Start）与热实例池
          body: |
            缩容到零带来一个代价：当函数闲置十多分钟实例全被回收后，突然来了一个新请求，平台必须临时调集资源：**分配微虚拟机/容器沙箱 → 拉取代码包 → 启动语言运行时 → 执行函数初始化代码**，最后才真正跑你的业务处理。

            这段额外的等待叫**冷启动（cold start）**，耗时几十毫秒到几秒不等。而刚跑完请求的实例平台会暂留一段时间（热实例），紧接着来的请求直接复用热实例就能省去初始化延迟。
      - item:
          id: q-cold-start
          type: order
          prompt: 当 FaaS 函数缩容到零后，突然收到一个新请求触发冷启动，请把平台从头到尾的准备顺序排出来。
          steps:
            - 分配并启动隔离执行沙箱（微虚拟机或容器）
            - 挂载或下载函数代码包并启动语言运行时（如 Python 运行环境）
            - 执行函数模块顶层的初始化代码（如加载配置或建连接）
            - 调用入口函数正式处理本次请求并返回结果
          explain: 冷启动慢主要慢在沙箱调度、运行时拉起与包导入/连接初始化；紧跟其后的热请求直接跳过前三步从第 4 步开跑。
      - card:
          title: 例题：为什么函数里不要依赖本地变量跨请求保存状态
          body: |
            假设你用 FaaS 写了一个在线抽奖函数，顺手在 Python 文件顶部写了个全局计数器 `count = 0`，每次请求加 1。同时有 20 个用户并发抽奖，且 15 分钟后没人用了实例缩容到零。为什么这个计数器一定算不准？
          reveal:
            - title: 第 1 步：并发时会同时存在多个彼此隔离的沙箱实例
              body: 20 个并发请求进来时，平台同时拉起多个函数沙箱，每个沙箱各自维护一份独立的进程内存，各自的 `count` 都只从 0 数起，互相看不见。
            - title: 第 2 步：闲置回收与冷启动会彻底清空内存
              body: 15 分钟无流量后，旧实例被平台销毁回收；下次新请求触发冷启动，新沙箱里 `count` 又变回 0。因此 FaaS 必须做到**无状态**，计数或状态必须写回外部原子存储（如 Redis 或数据库）。
      - item:
          id: q-faas-stateless
          type: choice
          prompt: 某开发者在 FaaS 函数文件全局作用域定义了一个列表 `cache = []` 来记录最近 10 个来访用户 ID。上线后发现有时刚写进去的数据下一秒请求又读不到了，最直接的原因是什么？
          options:
            - text: 高并发时会同时启动多个彼此独立的沙箱，闲置后沙箱还会被销毁重建，本地内存状态无法跨实例或跨冷启动保留
              correct: true
            - text: FaaS 函数运行时禁止在 Python 里使用列表数据类型
              why: 函数单次执行内部可以正常使用列表和字典，只是不能依赖它们跨多次请求持久化
            - text: FaaS 平台会在每次函数返回后自动加密并隐藏列表里的元素
              why: 原因不是被加密，而是请求落到了另一个独立进程沙箱或新冷启动的空白实例上
          explain: FaaS 实例随时可能水平并发出多个、也随时可能闲置销毁，所以函数必须保持无状态，跨请求数据放外部缓存或数据库。
      - card:
          title: 如何缓解冷启动与 FaaS 局限
          body: |
            面对延迟敏感的线上接口（例如登录 API），不能让第一个用户等 2 秒冷启动。工程上有三种办法：
            1. **精简代码体积与依赖**：包越小下载解压越快；把大模型或重型库按需懒加载。
            2. **预留少量常驻热实例**：花一笔固定底薪保底留 1–2 个不回收的实例接平时流量，突发再靠按量弹性顶上（阿里云文档的“常驻资源池 + 按量弹性”）。
            3. **把数据库连接池交给外部代理**：避免每弹出几百个函数实例就把数据库连爆。
      - item:
          id: q-faas-mitigate
          type: choice
          prompt: 某团队把核心支付回调接口部署成 FaaS 函数后，发现早上冷清时段偶发首笔请求延迟突然跳到 1.8 秒（正常热请求只要 25 毫秒）。他们既不想全部改回手工运维的虚拟机，又想压低毛刺延迟，最稳妥的做法是什么？
          options:
            - text: 缩减依赖包体积并在函数上配置少量“预留常驻实例”接住低谷期首波请求，超出部分仍走弹性扩容
              correct: true
            - text: 把代码里的注释全部删光但保留 400 MB 无用第三方库，指望平台自己猜出热点
              why: 影响冷启动加载耗时的是包体积与初始化逻辑，删注释对包体积微乎其微，400 MB 冗余库仍是主要瓶颈
            - text: 在函数里写死 `while True` 死循环永远不返回，免得实例被回收
              why: 函数一直占用不返回既无法服务新请求，还会触发执行超时被强制终止并白扣计算时长费
          explain: “少量预留热实例 + 按量突发弹性”结合了常驻的低延迟与无服务器的免运维及峰值弹性。

  - id: cloud-economics
    chapter: 无服务器与成本模型
    title: 云成本模型：按需、预留、竞价与 FaaS 计费
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 某公司把业务搬上云后，把原本在机房里 7×24 运行的 20 台服务器原封不动换成了云上的“按需实例”，结果月底账单下来比买机器折旧还贵不少。云不是号称省钱吗，最可能踩了哪个坑？
          options:
            - text: 对全年 7×24 恒定运行的基线机器使用了单价最高的“按需计费”，没买长期预留折扣，也没对闲置时段缩容
              correct: true
            - text: 云服务器电费比普通居民用电贵十倍
              why: 云机房规模采购电力和硬件通常比中小公司自建更便宜，贵在没有匹配计费模型
            - text: 云计算只允许用来跑无服务器函数，跑虚拟机一定违法
              why: 虚拟机（IaaS）本来就是云计算最大一块业务，核心是如何搭配计价方式
          explain: 上云不等于自动省钱——**资本支出（买机器）变成运营支出（按月租用）**后，选错计费模式反而会越用越贵（CS5412 第 9 讲、NIST 8.3）。
      - card:
          title: 虚拟机计费基础：按需实例与预留实例
          body: |
            面对不同波动曲线的负载，云厂商给出了差异巨大的虚拟主机计价：
            - **按需实例（On-Demand）**：随开随停、**按量付费（pay-as-you-go）**，无长期承诺，单价最高。适合突发波峰与临时测试。
            - **预留实例 / 节省计划（Reserved）**：提前承诺使用 1 年或 3 年换取大幅折扣（常省 30%–60%）。适合一年到头都要开着的基线机器。
      - card:
          title: 便宜但会收回：竞价实例（Spot）
          body: |
            **竞价实例（Spot）**租用的是机房当下没卖出去的闲置算力，价格最低，往往能比按需便宜 60%–90%。

            但它的代价是稳定性：当云平台资源突然紧张时，会提前几十秒发回收通知并强制收回机器。所以竞价实例只适合可随时重跑的离线批处理，或作为无状态自动伸缩组里的补充算力。
      - item:
          id: q-breakeven
          type: number
          prompt: 某规格按需实例每小时 $0.10，一年期预留实例折合每小时 $0.06（每月按 720 小时计，买预留不管开不开机都要按 720 小时付满）。一个月里至少要实际运行超过多少小时，买预留实例才比用按需实例更省钱？
          answer: 432
          explain: 买 1 台预留实例整月固定费用 = 0.06 × 720 = 43.2 美元。同样花 43.2 美元去买 $0.10/小时的按需实例，可以跑 43.2 / 0.10 = 432 小时（占整月 60%）。运行低于 432 小时用按需更省，高于 432 小时买预留划算。
      - card:
          title: 例题：给基线 + 波峰业务算最省月度账单
          body: |
            某 Web 服务长期基线需要 10 台实例 7×24 小时在线；每天中午和晚间高峰一共 4 小时需要**额外再加** 20 台实例（共 30 台）。已知按需单价 `$0.10/小时`，1 年期预留折合 `$0.06/小时`，一个月按 30 天（`720` 小时）算：
            - 全用按需、全买 30 台预留、混合搭配各多少钱？
          reveal:
            - title: 第 1 步：确定最优组合策略
              body: 10 台基线实例每月跑满 720 小时（利用率 100% > 60% 回本线），必须买**预留实例**；那 20 台高峰实例每天只跑 4 小时（每月仅 120 小时 < 432 小时回本线），应该用**按需实例**随时启停。
            - title: 第 2 步：算出三种方案的月费与节省额
              body: 混合最优方案 = 预留 $10 \times 0.06 \times 720 = 432$ 美元 + 按需 $20 \times 0.10 \times (4 \times 30) = 240$ 美元 = **672 美元**。对比全按需（$10 \times 0.10 \times 720 + 240 = 960$ 美元）省下 **288 美元（省 30%）**；若把 30 台全买成预留则为 $30 \times 0.06 \times 720 = 1296$ 美元，反而贵出一倍！
      - item:
          id: q-hybrid-cost
          type: number
          prompt: 某服务需要 4 台基线实例 7×24 小时（每月 720 小时）运行，另外每天高峰 5 小时需要额外 6 台实例（每月按 30 天计）。按需单价 $0.09/小时，预留单价 $0.05/小时。采用“基线买预留 + 高峰用按需”的最优组合，一个月总费用是多少美元？
          answer: 225
          explain: 基线 4 台预留 = 4 × 0.05 × 720 = 144 美元；高峰 6 台按需 = 6 × 0.09 × 5 × 30 = 81 美元；合计 144 + 81 = 225 美元（若全按需则是 4 × 0.09 × 720 + 81 = 340.2 美元）。
      - card:
          title: FaaS 计费与隐性账单：GB-秒与出网流量费
          body: |
            不像虚拟机按“整小时占几核几 GB”算钱，FaaS（如阿里云函数计算 FC、AWS Lambda）按三个维度合并计费：
            1. **资源使用量（CU / GB-秒）**：内存大小（GB）× 实际执行时长（秒）× 调用次数。比如 512 MB（0.5 GB）运行 0.2 秒就是 `0.1 GB-秒`。
            2. **请求调用次数**：通常按每百万次固定单价算。
            3. **公网出网流量（Egress）与周边存储**：很多团队看硬件单价很低就上云，却忽略跨地域同步与公网下行流量的昂贵单价（CS5412 第 9 讲指出的商业粘性）。
      - card:
          title: 例题：算出 FaaS 月账单并与常驻主机比较
          body: |
            按学习指南给出的一组真实对照参数算一算（暂不计免费额度与流量）：
            - 业务 A（高吞吐接口）：每天 1,000,000 次请求，每次 200 毫秒（0.2 秒），函数配 512 MB（0.5 GB）内存。
            - 业务 B（低频 Webhook）：每天 10,000 次请求，每次 100 毫秒（0.1 秒），配 512 MB 内存。
            假设 FaaS 单价为 `$0.000016 / GB-秒` + `$0.20 / 百万次请求`，对比一台最小常驻虚机（`$0.02/小时 × 720h = $14.40/月`）：
          reveal:
            - title: 第 1 步：算业务 A（高频大流量）的 30 天账单
              body: 每天用量 = $1{,}000{,}000 \times 0.2 \times 0.5 = 100{,}000$ GB-秒；30 天共计 3,000,000 GB-秒和 30 百万次请求。计算费 $3{,}000{,}000 \times 0.000016 = 48$ 美元，请求费 $30 \times 0.20 = 6$ 美元，合计 **54 美元/月**。如果 2 台 $0.02/h 的常驻小机（28.8 美元）就能扛住稳定并发，高吞吐稳定业务跑常驻实例反而更便宜！
            - title: 第 2 步：算业务 B（稀疏低频）的 30 天账单
              body: 30 天共 300,000 次请求，用量 = $300{,}000 \times 0.1 \times 0.5 = 15{,}000$ GB-秒。计算费 $15{,}000 \times 0.000016 = 0.24$ 美元，请求费 $0.3 \times 0.20 = 0.06$ 美元，合计仅 **0.30 美元/月**，远低于常驻虚机的 14.40 美元——低频突发场景 FaaS 省出几十倍成本。
      - item:
          id: q-faas-gbs
          type: number
          prompt: 某无服务器函数分配了 512 MB（即 0.5 GB）内存，平均每次运行耗时 200 毫秒（0.2 秒）。如果每天被事件触发 1,000,000 次，它一天消耗多少 GB-秒的计算资源？
          answer: 100000
          explain: 每次消耗 0.5 GB × 0.2 秒 = 0.1 GB-秒；1,000,000 次共消耗 1,000,000 × 0.1 = 100,000 GB-秒。
      - item:
          id: q-cloud-business
          type: choice
          prompt: Cornell CS5412 收尾课提到云厂商常常“入网传数据免费，但把海量数据从云上往外下载（Egress）或跨区域搬运时收高额流量费”。这种商业定价对架构师有什么提醒？
          options:
            - text: 架构设计要把计算放到数据附近减少跨区/出网拷贝，并在立项时把出网流量费与迁移退出成本算进总拥有成本
              correct: true
            - text: 说明云厂商禁止用户写任何读操作，只许往里写数据
              why: 你可以随时读取，只是跨出云网络边界的流量计费较高，需要优化缓存、CDN 和计算本地性
            - text: 只要把文件压缩成 zip，任何网络传输成本都能降到零
              why: 压缩能减少字节数，但视频/图片压缩余地有限，且跨区流量依然按实际字节计费
          explain: 云经济学不只看 CPU 和内存标价：存储 I/O、跨可用区/跨地域复制、公网出网流量以及迁移重构成都是真实的长期成本。

boss:
  items:
    - id: boss-models-match
      type: match
      prompt: 把四种云服务模型与“用户自己仍需亲自维护的那一层”或典型特征连线。
      pairs:
        - [IaaS（如租用裸虚拟机）, 自行维护操作系统内核补丁、防火墙、运行时与应用代码]
        - [PaaS（如托管应用平台）, 只维护业务代码与配置，OS 和语言运行时由平台打理]
        - [SaaS（如在线协同办公）, 只需管团队账号权限和业务使用，应用代码也由厂商托管]
        - [FaaS（如事件触发函数）, 只写短时无状态函数，闲时可缩到零实例并按执行量计费]
      explain: 从 IaaS → PaaS → SaaS → FaaS，云厂商接管的软件栈层数逐步增多，用户能自主定制的底层控制权相应变小、运维责任也变轻。
    - id: boss-shared-resp
      type: choice
      prompt: 公司在 IaaS 虚拟机上自建数据库，结果因为忘了修改默认弱口令且没关公网访问端口，导致库内数据被删。按共享责任模型，云厂商是否需要赔偿这起“系统配置失误导致的数据失窃”？
      options:
        - text: 不需要，IaaS 下账号口令、端口暴露面和库内备份都属于“云中内容的安全”，由用户负责
          correct: true
        - text: 需要全额赔偿，因为虚拟机最终跑在云厂商的物理机房里
          why: 云厂商只保证物理硬件、机房和虚拟化隔离本身不被外部突破
        - text: 只有使用了预留实例云厂商才赔，按需实例不赔
          why: 计费模式只影响价格折扣，不改变共享责任模型的安全边界
        - text: 只要租用超过 3 台虚拟机，系统安全就自动归云厂商负责
          why: 实例数量再多，IaaS 下的 OS 与网络安全配置依然归用户
      explain: 共享责任分界线很清：云厂商管“云本身的安全”（机房、硬件、虚拟化），客户管“云中内容的安全”（系统补丁、端口安全组、口令权限与数据加密）。
    - id: boss-capacity
      type: number
      prompt: 某在线报名服务单台无状态实例的满载吞吐是 250 请求/秒，团队规定目标利用率不超过 80%。预计报名开启峰值将达到 3,500 请求/秒，至少需要准备多少台实例？（填整数）
      answer: 18
      explain: 单实例有效容量 = 250 × 0.80 = 200 请求/秒；3500 / 200 = 17.5，向上取整必须准备 18 台实例（17 台最多仅稳妥承载 3400 请求/秒）。
    - id: boss-stateless-order
      type: order
      prompt: 要把一个“把用户登录态和上传头像都存在本机内存与本地硬盘”的单体老系统改造成可水平弹性扩缩的云原生架构，下面四步的合理实施顺序是什么？
      steps:
        - 把本地内存里的登录会话迁出到集中式外部缓存（如 Redis）或改用签名令牌
        - 把用户上传的头像文件改存进外部对象存储，不再写本机磁盘
        - 给业务数据配置外部托管数据库并做读写连接池管理
        - 把改造后彻底无状态的应用实例放进负载均衡器后面的自动伸缩组
      explain: 只有先把会话、本地文件和数据库全部剥离到外部共享存储层，应用实例本身变成彻底无状态，放到自动伸缩组里增减才不会丢数据。
    - id: boss-az-fault
      type: choice
      prompt: 以下关于区域（Region）、可用区（AZ）与跨地域强一致的描述，哪一项是正确的？
      options:
        - text: 同区域的不同可用区具备独立供电与网络且相互低延迟互联，适合做同步主备抗单机房故障；跨大洲强一致写则会受到光速往返延迟拖累
          correct: true
        - text: 可用区之间相隔几千公里，必须使用卫星通信才能同步数据
          why: 同一区域内的可用区通常在同一个城市或邻近几十公里内，靠高速光纤做到 1–2 毫秒级低延迟互联
        - text: 只要开启“跨大洲强一致性同步写入”，写入性能就会比单机房更快
          why: 写入必须等远方城市副本往返确认，延迟会从毫秒级暴涨到上百毫秒
        - text: 99.99% 可用性（四个 9）意味着一年允许累计停机超过 8 小时
          why: 99.9%（三个 9）一年允许约 8.76 小时（525.6 分钟），99.99% 一年只允许 52.56 分钟
      explain: 同区域多可用区兼顾独立故障域与极低网络延迟；跨地域则必须在强一致性延迟与异步容灾之间权衡。
    - id: boss-multitenancy
      type: choice
      prompt: 一家公司运行着一套多租户公共集群，最近 A 部门的一个后台计算任务突然并发吃满节点全部内存和磁盘 I/O，把同机跑着的 B 部门线上接口拖慢了十倍（吵闹邻居）。在继续保留共享集群前提下，首先应该补上哪组隔离控制？
      options:
        - text: 为每个部门分配独立命名空间，在命名空间上设置 ResourceQuota 总配额、各容器资源请求/上限以及网络策略
          correct: true
        - text: 把 B 部门的所有账号密码从前端代码里改成大写字母
          why: 密码大小写与底层 CPU/内存/磁盘资源争抢毫无关系
        - text: 关掉整个集群的调度器，以后由人工发邮件通知大家不要同时跑程序
          why: 靠口头通知挡不住 bug 引发的突发抢占，必须靠平台配额和资源限制做硬约束
        - text: 把 A 部门和 B 部门的所有对象合并放进同一个命名空间里，免得名字冲突
          why: 合并进同一个命名空间只会彻底失去逻辑权限边界与独立配额控制
      explain: 独立命名空间 + 资源配额 + 实例上限 + 网络策略（档位 2）是共享集群里既省钱又能治住吵闹邻居和隔离控制/数据面的标准配置。
    - id: boss-privacy-residency
      type: choice
      prompt: 你接手检查一家欧洲医疗云系统，发现主数据库存放在法兰克福区域且开启了静态加密，但存在四项疑似隐患。其中哪一项**直接**同时触及“隐私泄密”或“数据驻留违规”？
      options:
        - text: 调试日志直接打印患者姓名与诊断明文，且自动备份脚本每天把快照同步存到北美某区域
          correct: true
        - text: 法兰克福区域内的三个可用区之间启用了加密同步复制
          why: 三个可用区都在德国法兰克福同一个法定区域内，且传输加密，既不越境也不泄密
        - text: 给欧盟医院员工配置了只允许读取各自所在医院部门数据的最小权限角色
          why: 最小权限和租户/部门隔离正是保护隐私的正确措施
        - text: 使用了客户自管密钥（KMS）定期轮换静态加密密钥
          why: 密钥轮换和客户自管密钥是增强隐私控制的最佳实践
      explain: 隐私不仅看主库加没加密，还要看旁路日志有没有脱敏；数据驻留则严卡每一份副本和备份所在的地理区域边界。
    - id: boss-k8s-arch
      type: choice
      prompt: 当一位工程师提交配置文件说“我要 5 个订单服务副本，每个需要 1 核 CPU、2 GB 内存”后，Kubernetes 控制平面各个组件的分工哪项描述正确？
      options:
        - text: API Server 校验并把期望存进 etcd；控制器发现当前 0 < 5 后创建 5 个 Pod；调度器逐个过滤节点余量并打分选址；选中节点上的 kubelet 拉镜像启容器
          correct: true
        - text: kubelet 先在每台节点盲目启动 5 个容器，再由 etcd 统计多出来的全部杀掉
          why: kubelet 只负责在自己被分配了具体 Pod 后执行启停，不会未卜先知地去猜新配置
        - text: 调度器直接跳过 API Server 把二进制文件通过串口烧录进硬盘
          why: 所有集群状态都通过 API Server 读写 etcd，调度器只负责把未绑定节点的 Pod 分配给合适节点
        - text: Cloud Controller Manager 负责解释 Python 源代码里的每一个 for 循环
          why: Cloud Controller Manager 只负责对接云厂商 LoadBalancer、节点生命周期与路由 API
      explain: API Server + etcd 管“记下期望”，Controller 管“补齐数量”，Scheduler 管“找哪台机器装得下”，Node 上的 kubelet 管“本机真正启动它”。
    - id: boss-workload-pick
      type: match
      prompt: 为下面四类容器化任务选出正确的 Kubernetes 工作负载对象。
      pairs:
        - [可随时增减副本、支持灰度滚动升级与一键回滚的商城网页前端, Deployment]
        - [要求节点名字固定为 kafka-0/kafka-1 且各自保留独立持久盘的消息队列, StatefulSet]
        - [必须在每台工作节点上都恰好跑一个的安全入侵检测采集探针, DaemonSet]
        - [每天凌晨 1 点触发一次、把前一天订单归档后即正常退出的脚本, CronJob]
      explain: 这四个控制器覆盖了编排中最核心的四类运行形态：无状态常驻、有状态固定身份与盘、每节点守护、定时批处理。
    - id: boss-economics
      type: number
      prompt: 某服务基线负载需要 10 台实例 7×24 小时在线，每天业务高峰 4 小时需要额外再加 20 台实例。按需实例 $0.10/小时，一年期预留实例折合 $0.06/小时，一个月按 30 天（720 小时）计。与“全部 30 台高峰需求都按需随开随关”相比，采取“基线买预留 + 高峰用按需”的混合方案每月能省下多少美元？
      answer: 288
      explain: 混合方案 = 10 × 0.06 × 720 + 20 × 0.10 × 4 × 30 = 432 + 240 = 672 美元；全按需方案 = 10 × 0.10 × 720 + 240 = 960 美元；每月省下 960 − 672 = 288 美元（恰好省 30%）。
    - id: boss-faas-cold
      type: choice
      prompt: 某团队把一个每天只有几百次调用的微信推送回调写成 FaaS（512 MB、每次 100 ms），每月账单还不到 $0.10；但后来他们把每天稳定 5000 万次请求、需要保持巨大本地内存缓存且对 P99 延迟极度敏感的核心撮合引擎也全塞进冷启动 1.5 秒的 FaaS，结果又慢又贵。这说明了什么？
      options:
        - text: FaaS 靠事件触发和缩容到零在稀疏/突发场景极省钱，但高稳定吞吐、大内存状态与对冷启动零容忍的核心服务仍更适合常驻实例（或预留常驻池）
          correct: true
        - text: FaaS 函数永远只能运行在 1990 年代的老式 CPU 上
          why: FaaS 底层同样跑在现代机房硬件上，问题在于按次按 GB-秒计费结构与冷启动/无状态约束不适合稳定大状态高频负载
        - text: 只要把函数超时时间调成 1 秒，冷启动延迟就会自动变成负数
          why: 缩短超时只会让冷启动还没结束的请求直接报错失败
        - text: FaaS 和常驻虚拟机在任何流量曲线下费用永远完全一样
          why: 低频场景 FaaS 因缩零能省几十倍，高稳定满载场景常驻预留实例通常单价更低
      explain: 没有银弹的架构：按流量曲线（稀疏 vs 恒定）、状态需求（无状态 vs 内存常驻）与延迟容忍度，组合使用常驻预留、自动伸缩和 FaaS 才最合理。
