skill: C.2.3
version: 2
authors: [main-agent]
brief:
  why: |
    同一台 8 核服务器既要跑线上数据库、又要运行别人提交的实验脚本，怎么保证脚本卡死或抢光内存时不把数据库一起拖死，也不让它越权偷看宿主文件？现代系统给出了两条路：一条用虚拟机虚拟整套硬件再跑独立内核，另一条在同一个 Linux 内核里用命名空间切出隔离视图、用控制组锁死 CPU/内存/IO 配额，打包成容器镜像交给编排调度器安家。本包衔接操作系统（C.2.1），从陷入并模拟、VT-x/EPT 一直讲到 cgroups v2、Dockerfile 与 K8s 资源调度。
  outcomes:
    - 对比 Type 1 / Type 2 虚拟机监控程序与容器的隔离边界、共享内核差异、启动速度与镜像开销
    - 说明 Popek–Goldberg 虚拟化三条件、陷入并模拟缺陷及 VT-x/EPT 硬件辅助虚拟化与二维页表工作原理
    - 区分 PID/NET/MNT/UTS/IPC/USER 六大 Linux 命名空间各自隔离的视图，并用 unshare/setns 说明容器拼装过程
    - 算清 cgroup v2 中 cpu.max 配额、四种资源分配模型（权重/上限/保护/分配）及 CPU 节流与内存 OOM 杀手的不同后果
    - 按层缓存原则写出最小非 root Dockerfile，说明镜像仓库、不可变摘要（@sha256）与权限裁剪基线
    - 区分 Pod 的 requests 与 limits、PodOverhead、QoS 驱逐优先级及 kube-scheduler 过滤、打分、污点容忍与抢占流程
terms:
  - term: 虚拟机监控程序
    def: 在物理硬件之上调度与隔离多个独立虚拟机的控制软件（Hypervisor），负责把硬件资源切分给各个客体系统。
  - term: 宿主机
    def: 实际拥有物理 CPU、内存和磁盘并承载虚拟机或容器运行的那台底层计算机与操作系统（Host）。
  - term: 客体
    def: 运行在虚拟机内部的操作系统与应用程序（Guest），它以为自己独占着一整套物理硬件。
  - term: 虚拟机
    def: 由虚拟机监控程序虚拟出一整套硬件（CPU、内存、磁盘、网卡）并在其上运行完整独立客体操作系统的执行环境。
  - term: 陷入并模拟
    def: 客体操作系统在非特权级执行敏感指令触发硬件陷入后，由虚拟机监控程序截获并替它模拟完成硬件效果的经典机制。
  - term: 硬件辅助虚拟化
    def: CPU 在硬件指令集层面专门增设客户态模式与二维页表支持（如 Intel VT-x/EPT），省去软件二进制翻译并降低陷入开销。
  - term: 二级页表
    def: 硬件辅助虚拟化引入的第二层地址翻译表（如 EPT/NPT），直接把客体物理地址翻成宿主机物理地址。
  - term: 进程间通信
    def: 同一操作系统上不同进程之间交换数据或同步动作的机制（如管道、消息队列、共享内存与本地套接字）。
  - term: 视图
    def: 操作系统内核向进程展示的资源名字与全局表格范围（例如能看到哪些进程号、网卡、挂载目录或主机名）。
  - term: 命名空间
    def: Linux 内核用来隔离进程全局资源视图的机制（如 PID/NET/MNT 等），使容器内的进程以为自己独占一台独立机器。
  - term: 容器
    def: 通过内核命名空间隔离视图、再用控制组限制资源用量，把应用及其依赖打进轻量镜像并直接共享宿主机内核的执行单元。
  - term: 控制组
    def: Linux 内核的 cgroups 机制，把一组进程归入树状节点并按权重或硬上限分配和计量 CPU、内存、I/O 与进程数。
  - term: 节流
    def: 当进程组在当前时间周期内用完分配的 CPU 配额时，调度器暂停其运行直到下个周期开始，而不会直接杀死进程。
  - term: OOM 杀手
    def: 当内存耗尽且回收页缓存仍不够用时，内核按照评分强制终止占用超额进程以保住系统存活的机制。
  - term: 镜像
    def: 由多层只读文件系统快照叠合启动配置组成的静态文件包，记录了运行一个容器所需的完整目录与命令。
  - term: 镜像仓库
    def: 集中存放、按版本标签与内容摘要分发容器镜像的服务，供宿主机或集群节点按需拉取运行。
  - term: 摘要
    def: 对容器镜像清单内容计算出的密码学哈希指纹（如 sha256:...），唯一且不可篡改地指向某一份确切构建产物。
  - term: Pod
    def: 集群编排中最小的可调度单元，由一个或多个紧耦合容器共享同一网络与存储上下文组成。
  - term: 资源请求
    def: 容器向调度器声明的保底所需 CPU 与内存量（requests），调度器据此判断节点是否有足够空余空间安放该 Pod。
  - term: 资源限制
    def: 运行期允许容器消耗的 CPU 与内存硬上限（limits），分别由内核控制组执行节流或超限杀进程。
  - term: 驱逐
    def: 当宿主机磁盘、内存告急或人工维护清空节点时，节点代理或控制面主动终止部分低优先级 Pod 以腾出资源的动作。
lessons:
  # ======================================================================== 虚拟机
  - id: vm-basics
    chapter: 虚拟机
    title: 什么是虚拟机：Type 1 / Type 2 与虚拟化三条件
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你手里只有一台物理服务器，现在既想在上面跑一套需要 Linux 6.x 内核的数据库，又想同时在上面跑一套必须使用旧版 Windows 内核的老旧财务软件。只靠普通多进程能做到吗？为什么需要额外一层软件？
          options:
            - text: 普通多进程全都共享同一个操作系统内核；要同时跑两套完全不同的内核，必须在底层虚拟出两套“假硬件”，让每个系统各自运行在独立硬件幻觉里
              correct: true
            - text: 只要给一个 Linux 进程换个文件夹名字，它就能自己长出 Windows 内核
              why: 进程只能向自己底下的那个单一操作系统发起系统调用，换文件夹名字改变不了内核
            - text: 物理 CPU 天生一次能且只能运行一个单独进程
              why: 多任务操作系统靠时钟中断早已能让上百个进程轮流使用 CPU，瓶颈不在进程数而在“必须共享同一内核”
          explain: 当你需要隔离到**操作系统内核这一层**（或者跑不同的操作系统）时，光靠进程地址空间不够了，必须请出虚拟机。
      - card:
          title: 虚拟机监控程序（Hypervisor）、宿主机与客体
          body: |
            从 C.2.1 我们学过，普通程序觉得自己独占 CPU 和连续虚拟内存，这是操作系统给它的幻觉。**虚拟机（virtual machine，VM）**把这个幻觉再往下一层：用一层叫**虚拟机监控程序（hypervisor，VMM）**的软件，向**客体（guest）**操作系统提供一整套虚拟 CPU、虚拟物理内存和虚拟网卡磁盘（MIT 6.033 LEC 6）。

            承载这一切底层物理硬件的机器称为**宿主机（host）**。客体系统以为自己直接管着真机，实际上它所有的硬件操作都在监控程序的掌控之中。
      - card:
          title: Type 1（裸金属）vs Type 2（寄宿型）监控程序
          body: |
            监控程序有两种安放位置：
            - **Type 1（裸金属型）**：监控程序直接装在物理裸机硬件上（像 KVM/Xen/ESXi），没有笨重的通用桌面系统挡在中间，直接调度各个虚拟机，云机房生产环境几乎全用它。
            - **Type 2（寄宿型）**：监控程序自己是一个跑在 Windows/macOS 等宿主机操作系统里的普通软件（如 VirtualBox），再由它去申请内存运行虚拟机，多了一层转发，适合个人电脑装测试环境。
      - item:
          id: q-type1-vs-type2
          type: choice
          prompt: 某云计算数据中心要把上万台物理服务器切分成几十万台对外出租的云虚拟机，非常在意性能损耗和隔离简洁度。它应该选用哪种监控程序架构？
          options:
            - text: Type 1 裸金属型：直接运行在物理硬件之上，减少中间宿主机操作系统的额外调度与 I/O 转发层级
              correct: true
            - text: Type 2 寄宿型：先在每台服务器装满办公桌面版软件再启动虚拟机软件
              why: 寄宿型多了一整层宿主 OS 调度开销和更大攻击面，不适合高密度云生产机房
            - text: 不用任何监控程序，让两个客户共用同一个单内核进程表
              why: 共用同一内核就不是强隔离虚拟机，且无法让客户自选不同操作系统内核
          explain: Type 1 省掉了“宿主机桌面系统”那一厚层中间转手，既快又少一层需要维护和打补丁的庞大代码。
      - item:
          id: q-host-guest
          type: match
          prompt: 把虚拟化架构里的三个基本身份与它们的实际角色配对。
          pairs:
            - [宿主机（Host）, 真正掌控物理 CPU、内存条与磁盘的底层硬件和宿主机系统]
            - [虚拟机监控程序（Hypervisor）, 在物理硬件之上虚拟出多套假硬件并隔开各台虚拟机的调度控制层]
            - [客体（Guest）, 跑在虚拟机内部、误以为自己独占整台物理机器的操作系统与应用]
          explain: 宿主机在最下面管真硬件，监控程序在中间做切片隔离，客体系统在上面把虚拟设备当真机用。
      - item:
          id: q-vm-startup-overhead
          type: choice
          prompt: 在物理机上同时运行 30 个彼此隔离的小型服务。如果全做成独立虚拟机，相比共用内核的轻量隔离方案，最大的资源开销来自哪里？
          options:
            - text: 每台虚拟机都必须单独引导并长期占用一套完整客体操作系统内核和驱动内存，开机时间与内存基线成倍增加
              correct: true
            - text: 因为虚拟机里的加法指令必须把数字乘 10 再算
              why: 算术计算在物理 CPU 上原生运行几乎零开销，差异在于独立内核的内存与启动成本
            - text: 因为物理硬盘禁止同时存放超过 2 个虚拟机的文件
              why: 硬盘容量允许存放多个虚拟机镜像，问题在于每多跑一套客体系统内核都要额外占用大量内存页框和引导时间
          explain: 虚拟机每多开一份就多跑一整套内核；这也是后来轻量级服务纷纷转向共享内核容器的根本动因。
      - card:
          title: Popek–Goldberg 虚拟化三要求（Harvard CS161 LEC 23）
          body: |
            怎么才算一个合格的虚拟机监控程序？1974 年 Popek 与 Goldberg 定下三条铁律：
            1. **等价性（Equivalence）**：程序在虚拟机里跑出来的计算结果，除了耗时略微不同，必须和跑在真物理硬件上完全一样；
            2. **资源控制（Resource Control）**：物理内存、CPU 时间和磁盘的最终调度分配权死死攥在监控程序手里，客体抢不走；
            3. **高效性（Efficiency）**：绝大多数日常无害指令（如加法、局部跳转）直接原生跑在真 CPU 上，不能每条指令都由软件慢吞吞翻译。
      - item:
          id: q-popek-three
          type: match
          prompt: 把 Popek–Goldberg 经典虚拟化的三条要求与它们各自的含义连线。
          pairs:
            - [等价性（Equivalence）, 程序在虚拟机里算出的逻辑结果必须和在真硬件上一致]
            - [资源控制（Resource Control）, 物理硬件的真实支配权与配额完全由监控程序掌控，客体无法越权抢占]
            - [高效性（Efficiency）, 占绝大多数的普通非敏感指令直接在物理 CPU 上原生运行，无需软件逐条解释]
          explain: 只有同时满足“结果一样、资源可控、跑得够快”，虚拟机才真正实用，而不是慢几百倍的软件模拟器。

  - id: vm-traps-ept
    chapter: 虚拟机
    title: Trap-and-Emulate、敏感指令与硬件辅助虚拟化
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 物理 CPU 原本只有两个模式：内核态（Ring 0，掌管全部硬件）和用户态（Ring 3，不能改页表、不能关中断）。现在监控程序占用了唯一的内核态 Ring 0，把**客体操作系统**降级放进了用户态！可客体内核自己也有一堆“用户程序”啊——如果让客体内核跑在用户态，它想执行一条修改系统控制器的特权指令时会发生什么？
          options:
            - text: 硬件发现当前不是 Ring 0 却企图执行特权指令，立刻自动触发陷入把控制权交给 Ring 0 的监控程序处理
              correct: true
            - text: 客体内核会直接绕过硬件保护把整台物理机断电
              why: CPU 权限检查由硬件电路强制执行，非 Ring 0 无法直接完成特权指令
            - text: 物理 CPU 会自动变出十个新的 Ring 0 各自互不干扰
              why: 传统无虚拟化扩展的 CPU 只有一套特权态，这正是需要引入陷入模拟或 VT-x 硬件扩展的原因
          explain: 把客体内核“降级”到非特权态，让它一碰硬件特权操作就触发异常陷入监控程序——这就是经典的**陷入并模拟**。
      - card:
          title: 陷入并模拟（Trap-and-Emulate）与虚拟化的死穴
          body: |
            Popek–Goldberg 定理说：如果一个 CPU 架构中**所有敏感指令（会读写或改变全局硬件状态的指令）全都是特权指令**，那我们就能用**陷入并模拟（trap-and-emulate）**：把客体操作系统降到用户态，它一执行敏感指令就会触发**陷入**进监控程序，监控程序悄悄改一下自己记的“虚拟状态”后返回。

            可早期 x86 架构偏偏有十多条“**敏感却不特权**”的指令（如读取当前特权级或改标志寄存器）：在用户态执行它们**不会触发陷入**，而是默默失效——客体系统瞬间穿帮甚至崩溃！
      - card:
          title: 例题：当 CPU 缺少“敏感 ⊆ 特权”时，监控程序怎么办
          body: |
            既然早期 x86 硬件碰到这些敏感非特权指令不肯主动触发陷入，1990 年代末 VMware 等软件是用什么聪明办法绕过的，后来硬件芯片又是怎么从根源解决的？
          reveal:
            - title: 第 1 步：早期软件靠动态二进制翻译（Binary Translation）绕路
              body: 在指令真正送去 CPU 前，监控程序先扫描客体内核即将执行的一小块二进制代码，把那几条会静默穿帮的“敏感非特权指令”动态替换成显式跳转到监控程序的模拟函数，其余普通指令照旧原生跑。虽然巧妙，但扫描翻译代码带来了不少额外开销。
            - title: 第 2 步：硬件辅助虚拟化（VT-x / AMD-V）直接新增“根模式/非根模式”
              body: 芯片厂商后来推出了**硬件辅助虚拟化（hardware-assisted virtualization）**（如 Intel VT-x、AMD-V）：CPU 干脆单独加了一组**非根模式（VMX non-root）**给客体，里面自带完整的 Ring 0 到 Ring 3！客体内核终于可以安心待在自己的“客体 Ring 0”跑内核代码，只有碰上真正需要监控程序管的事件（如 I/O 或敏感配置）时，硬件自动执行 **VM-Exit** 切回监控程序所在的根模式。
      - item:
          id: q-trap-emulate-flaw
          type: choice
          prompt: 经典纯软件“陷入并模拟（Trap-and-Emulate）”在早期 x86 架构上无法直接成立的根本技术原因是什么？
          options:
            - text: 存在若干“敏感但非特权”的指令，客体内核在降级用户态执行它们时不会触发硬件陷入，而是静默失败或暴露真实特权态
              correct: true
            - text: 因为早期 x86 CPU 根本不支持任何乘法或除法指令
              why: 算术指令本身既非敏感也非特权，问题专指会暴露或依赖机器特权状态却不触发陷阱的指令
            - text: 因为操作系统在物理机上从来不用页表
              why: 现代操作系统广泛使用页表，硬件限制出在权限环与敏感指令的覆盖关系上
          explain: Popek–Goldberg 定理的成立前提是“敏感指令集合 ⊆ 特权指令集合”；一旦出现既敏感又能在用户态静默跑的指令，Trap-and-Emulate 就漏水了。
      - card:
          title: 内存虚拟化痛点：影子页表 vs 二级页表（EPT / NPT）
          body: |
            CPU 指令搞定了，还有内存地址翻译！正常系统有一级翻译：`虚拟地址 → 物理地址`。在虚拟机里却有两层：`客体虚拟地址（gVA）→ 客体物理地址（gPA）→ 宿主机物理地址（hPA）`。

            过去没有硬件帮忙，监控程序只能靠软件拼出一套**影子页表（Shadow Page Table）**把 `gVA` 直接映到 `hPA`——每次客体修改自己页表都得陷入监控程序同步改影子表，开销极大！

            于是现代 CPU 加上了**二级页表（second-level page table）**硬件（Intel EPT / AMD NPT）：CPU 的内存管理单元（MMU）硬件自己同时查“客体页表”和监控程序配置的“EPT 页表”，再也不用维护影子页表了！
      - item:
          id: q-ept-walk
          type: number
          prompt: 在同时启用 4 级客体页表和 4 级二级页表（EPT）的硬件辅助虚拟机里，如果 TLB 全部未命中，硬件 MMU 要把一个客体虚拟地址 `gVA` 彻底翻译成宿主机物理地址 `hPA`，最坏情况下仅查找页表树本身需要访问多少次物理内存？（提示：每踩一级客体页表都要先走一遍 4 级 EPT，算完最后数据页物理地址还要再走一遍 4 级 EPT）
          answer: 24
          explain: 4 级客体页表中，每读取 1 级客体页表项要先走 4 次 EPT 翻译出该页表的 hPA 再读 1 次该客体页表（共 5 次），4 级就是 4 × 5 = 20 次；拿到最终客体物理页框号 gPA 后还要走最后 4 次 EPT 翻译出数据页的真 hPA，合计 20 + 4 = 24 次页表访存（所以虚拟化里 TLB 命中率极其关键！）。
      - item:
          id: q-vtx-ept-match
          type: match
          prompt: 把硬件辅助虚拟化中的两个关键特性与它们分别消除的软件虚拟化开销对应起来。
          pairs:
            - [Intel VT-x / AMD-V（根/非根模式）, 消除“敏感非特权指令”漏洞，替代复杂慢速的动态二进制翻译]
            - [Intel EPT / AMD NPT（二级页表）, 让硬件 MMU 直接完成 gPA→hPA 二维查表，取消监控程序用软件维护的影子页表]
            - [VM-Exit 陷入切换, 当非根模式里的客体触碰受控 I/O 或配置时硬件自动交回给根模式监控程序]
          explain: VT-x 解决了 CPU 模式与指令虚拟化，EPT 解决了两层内存地址翻译，两者共同把现代云虚拟机性能拉到了接近物理机水平。
      - item:
          id: q-shadow-pt-cost
          type: choice
          prompt: 在没有硬件辅助二级页表（EPT/NPT）的早期纯软件内存虚拟化时代，为什么只要客体操作系统切换进程或者修改自己的页表，虚拟机监控程序就要付出很大开销？
          options:
            - text: 监控程序必须截获客体对页表的修改，在软件里同步维护一套从客体虚拟地址直映宿主机物理地址的“影子页表”
              correct: true
            - text: 因为没有 EPT 时物理内存条每分钟会自动清空一次
              why: 物理内存条不会自动清空，开销来自监控程序用软件同步更新大量影子页表项以及触发大量页表写保护陷入
            - text: 因为影子页表必须人工用纸和笔抄写进 CPU 寄存器
              why: 影子页表由监控程序软件自动维护，代价是频繁陷入和额外的内存占用
          explain: EPT/NPT 把 `gVA → gPA → hPA` 两张表直接交给 CPU 的 MMU 硬件去查，彻底免去了影子页表的软件同步和频繁陷入开销。

  - id: containers-vs-vms
    chapter: 容器隔离
    title: 容器 vs 虚拟机：共享内核与隔离视图
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 同样的 Linux 宿主机上，你想隔开 20 个各自带着不同 Python 依赖库的微服务。如果每个微服务都起一台虚拟机，光 20 份完整操作系统内核就要吃掉好多 GB 内存和几十秒开机时间。如果它们全跑在同一台 Linux 机器上，有没有办法“不另外装 20 个操作系统内核”，却让每个服务以为自己独享一套系统环境？
          options:
            - text: 可以：所有容器共用宿主机同一个 Linux 内核，只用内核自带的隔离机制切出各自独立的文件目录、网卡和进程号视野
              correct: true
            - text: 不可能：只要共用同一个内核，两个进程名字和文件夹就必然完全混在一起无法隔离
              why: Linux 内核专门提供命名空间机制，可以让不同进程看到彼此独立的目录树、网络和进程号表
            - text: 只需要把 20 个程序合并写进同一个 Python 源文件里就行
              why: 合进同一个文件既解决不了依赖版本冲突，也毫无隔离边界
          explain: 这就是**容器**的奥秘——它不是“小一号的虚拟机”，而是**被内核隔离开来的普通进程**！
      - card:
          title: 什么是容器（Container）：共享内核，不虚拟硬件
          body: |
            对照大纲 1.2 与 5.1/8.1，把**容器（container）**与虚拟机放在一起看，差异一清二楚：
            - **虚拟机**：每个 VM 自带一套完整**客体**操作系统内核与虚拟硬件，靠 Hypervisor 隔开，开机需十几秒到几分钟，内存开销数百 MB 起。
            - **容器**：**没有客体操作系统内核**！每个容器本质上就是宿主机上的一个（或一组）普通用户态进程，直接向宿主机同一个内核发起系统调用，毫秒级启动、几乎没有额外内核内存开销。
      - card:
          title: 容器的两个内核底座：视图隔离与资源配额
          body: |
            那容器凭什么不像普通进程那样互相偷看和抢资源？全靠 Linux 内核的两把利器（iximiuz 教程与大纲第 5、8 章）：
            1. **隔离看见什么（视图）**：内核为不同进程组呈现互不干扰的资源**视图（view）**（用**命名空间**实现），让容器内的程序以为自己是 1 号进程、独占一张网卡和一套干净根目录。
            2. **限制能吃多少（配额）**：用内核资源配额把该组进程最多能抢多少 CPU、内存与磁盘写死上限。
      - item:
          id: q-vm-vs-container-table
          type: choice
          multi: true
          prompt: 对比“硬件虚拟机（VM）”和“Linux 容器（Container）”，下列哪些特征属于**容器**？（多选）
          options:
            - text: 所有实例直接向宿主机同一个 Linux 内核发起系统调用，无需再引导独立客体内核
              correct: true
            - text: 毫秒级启动、几乎零额外操作系统内核内存占用
              correct: true
            - text: 如果宿主机单一内核出现本地提权漏洞，隔离防线不如独立内核虚拟机厚实
              correct: true
            - text: 能在 Linux 宿主机上直接原生运行一份完全独立的 Windows 操作系统内核
              why: 容器共用宿主机内核；运行异构操作系统内核只有具备虚拟硬件的虚拟机才能做到
          explain: 虚拟机隔在“硬件与内核之间”，容器隔在“同一个内核之上的进程视图与配额之间”；这也决定了云上运行不信任外部代码时往往用虚拟机多套一层护盾。
      - item:
          id: q-shared-kernel-consequence
          type: choice
          prompt: 既然容器和宿主机共用同一个 Linux 内核，下面哪种情况在标准容器里是**做不到**的？
          options:
            - text: 在一台只跑着 x86 Linux 内核的宿主机上，用普通容器直接原生运行一份独立的 Windows NT 内核驱动程序
              correct: true
            - text: 在同一台 Ubuntu 24.04 宿主机上，同时运行打包了 Debian 用户态库的容器和打包了 Alpine 用户态库的容器
              why: 用户态的 `.so` 共享库和工具文件都在容器自己的镜像文件系统里，只要遵守相同的 Linux 系统调用接口就能正常运行
            - text: 让容器内进程只能看到自己目录里的文件而看不到宿主机 `/etc` 下的密码文件
              why: 挂载命名空间与根文件系统切换正是容器隔离文件视图的常规操作
          explain: 容器能自带自己那套用户态库文件（glibc、Python 包等），但永远受限于底层那唯一一个共享的宿主机操作系统内核。
      - item:
          id: q-container-myth
          type: choice
          prompt: 有初学者以为“每个 Docker 容器里面都跑着一台完整的微型 Linux 内核，所以必须等几秒钟引导启动内核”。这种理解哪里错了？
          options:
            - text: 容器里只有应用进程和用户态文件系统，所有系统调用直接进宿主机内核，并不启动新内核，所以创建启动只需毫秒级
              correct: true
            - text: 因为容器里面跑的是 Java 虚拟机，而不是操作系统
              why: 容器可以运行任意编译型 C 程序、Python 或 Java 进程，关键是它不虚拟底层硬件也不再引导第二套操作系统内核
            - text: 因为容器完全不需要调用操作系统的系统调用
              why: 容器进程读写文件、发网络包全都要通过宿主机内核的系统调用完成
          explain: 用 `ps` 在宿主机上看，容器里的主程序就是一个普通 PID 进程——所谓的“容器”，其实就是戴着命名空间眼镜、套着内核配额笼子的宿主机进程。

  - id: linux-namespaces
    chapter: 容器隔离
    title: 六大命名空间：视图隔离、unshare 与 setns
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你在终端打开一个容器，在里面敲 `ps aux`，发现里面竟然**只显示 1 个进程**，而且它的进程号居然是 `PID 1`！可你明明知道宿主机外面正在跑着上百个系统程序。为什么容器里看不见外面的进程，外面却能看见它？
          options:
            - text: 内核给了这个容器一个独立的进程号命名空间，在它自己的视图里编号重新从 1 开始，而宿主机根命名空间能看见所有下层进程
              correct: true
            - text: 容器启动时把宿主机上其他 99 个进程全都杀死了
              why: 宿主机上的其他程序一切正常，只是容器内部的进程号查询接口被限制在了自己的命名空间子树里
            - text: 容器在内存中自带了一个硬件 CPU 重新给所有电路焊接编号
              why: 这是纯软件层的 Linux 内核进程号映射视图隔离
          explain: 命名空间本质上是内核的“视角滤镜”：同一颗物理树，站在根命名空间能俯瞰全部叶子，走进某个子命名空间就只能看见本枝杈下的对象。
      - card:
          title: 什么是命名空间（Namespace）与树状视图（8.1 节）
          body: |
            Linux 内核通过**命名空间（namespace）**把原本全局唯一的系统资源切分成彼此隔离的多份**视图**（cgroup/namespace 内核文档第 8.1 节）。

            每个命名空间像一张滤镜：处于某命名空间内的进程，查询进程表、网卡、主机名或挂载目录时，内核只返回属于当前命名空间的那一份。特别是 **PID 命名空间**呈父子层级：宿主机根命名空间能看到容器里进程的真实全局 PID，容器里自己只看到从 `1` 起的局部编号。
      - card:
          title: 容器依赖的六大核心命名空间
          body: |
            现代容器运行时默认会替一个新容器同时开启六种命名空间（可记口诀“进网挂名传用”）：
            - **PID**：独立进程编号空间，容器内部主进程成为 `PID 1`
            - **NET**：独立网卡、IP 地址、端口空间与路由表（互不冲突 `80` 端口）
            - **MNT**：独立文件系统挂载点树（切换根目录到容器镜像层）
            - **UTS**：独立主机名（`hostname`）与域名
            - **IPC**：独立共享内存与信号量等**进程间通信（IPC）**通道
            - **USER**：把容器内的 `root (UID 0)` 映射成宿主机上的普通无权用户（如 UID 100000）
      - item:
          id: q-ns-match
          type: match
          prompt: 把下面四种“在宿主机和容器之间隔开互不打架”的需求与对应的 Linux 命名空间连线。
          pairs:
            - [让两个容器内部同时各自绑定监听 80 端口，互不报端口冲突, NET（网络命名空间）]
            - [让容器里运行 `ps` 只能看见自己进程，且入口进程为 PID 1, PID（进程编号命名空间）]
            - [让容器看到的根文件系统 `/` 是镜像目录而不是宿主机的 `/`, MNT（挂载命名空间）]
            - [让容器内部以 UID 0 运行程序，但在宿主机内核眼里只是一个普通非特权用户, USER（用户命名空间）]
          explain: 四者各司其职：NET 隔网卡端口，PID 隔进程树，MNT 隔磁盘目录视图，USER 隔用户身份与权限映射。
      - card:
          title: 例题：用 `unshare` 亲手拼出一间容器，再用 `setns` 钻进去
          body: |
            其实不用装 Docker，用两条 Linux 系统调用/命令行工具（`unshare` 与 `setns(2)`，大纲 8.2 节）就能直接造出并进入一个容器视图：
            - `unshare --user --map-root-user --pid --fork --mount-proc bash` 到底做了什么？
            - 运维跑 `docker exec -it web bash` 想钻进已经跑着的容器排查故障时，底层用的 `setns(2)` 又干了什么？
          reveal:
            - title: 第 1 步：`unshare` 为新进程建起全新隔离视图
              body: "`--user --map-root-user` 开启 USER 命名空间把你映射成容器内伪 root；`--pid --fork` 建起新 PID 命名空间并派新子进程进去当 `PID 1`；`--mount-proc` 在新 MNT 视图里挂出只含本空间进程的新 `/proc`。你在里面敲 `ps`，会发现真的只剩 `PID 1 (bash)` 与 `PID 2 (ps)` 两行！"
            - title: 第 2 步：`setns(2)` 让外部调试进程“加入”已有的命名空间
              body: 宿主机 `/proc/<目标PID>/ns/` 下挂着每个命名空间的文件描述符句柄。`docker exec` 启动新 `bash` 前，先打开正在运行的容器进程的 `pid`、`net`、`mnt` 句柄，依次调用系统调用 `setns(2)` 把自己挪进目标容器的那几套视图里——于是新开出来的 `bash` 就站在了同一间容器房间内！
      - item:
          id: q-unshare-setns
          type: choice
          prompt: 当管理员用 `docker exec` 进入一个正在运行的容器里检查它的 `127.0.0.1` 网络端口和磁盘文件时，底层依赖的核心系统调用机制是什么？
          options:
            - text: 打开运行中容器进程对应的 `/proc/<pid>/ns/*` 句柄，通过 `setns(2)` 系统调用让新启动的 shell 进程加入该容器原有的各命名空间
              correct: true
            - text: 把整个容器先彻底销毁停机，再重新起一台 Type 1 虚拟机
              why: "`exec` 是在运行中的容器内部新起进程排查问题，绝不会销毁重来"
            - text: 靠重启宿主机物理网卡并清空全部内存页表
              why: 只需切换新进程关联的内核命名空间句柄即可共享同一容器视角
          explain: "`unshare` 负责从父进程拆出全新命名空间建容器，`setns(2)` 负责把调试进程插进现有容器的命名空间里。"
      - item:
          id: q-ns-not-limit
          type: choice
          prompt: 一位工程师只用 `unshare` 替互不信任的脚本打开了全部六大命名空间（PID、NET、MNT、UTS、IPC、USER），以为这下就安全了。但脚本一运行就写了一个死循环疯狂 `malloc` 申请 64 GB 内存并 `fork` 几万个子进程，瞬间把宿主机整台机器卡死。他漏了什么？
          options:
            - text: 命名空间只隔离“看见什么（视图）”，不限制“能吃多少物理资源”；必须再配合内核资源限额机制锁死 CPU、内存与 PID 数量上限
              correct: true
            - text: 因为他忘记顺便修改计算机屏幕分辨率了
              why: 屏幕分辨率与内核内存和进程数配额无关
            - text: 因为 `malloc` 在新命名空间里会自动把内存翻倍压缩
              why: 没有资源限制时，容器进程申请的依然是宿主机同一池物理内存
          explain: 牢记黄金分工：**Namespace 管视野隔离，cgroups 管资源额度**——两条腿缺一不可。

  - id: cgroups-hierarchy
    chapter: 资源控制
    title: 控制组（cgroup v2）与四种分配模型
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 宿主机上一共只有 8 GB 物理内存。如果不做任何资源额度约束，把业务 A 和业务 B 放进两个各自独立命名空间的容器里同机混跑。某天业务 B 出了内存泄漏 Bug 拼命申请内存到 7.9 GB，业务 A 会不会受牵连？
          options:
            - text: 会：物理内存只有一套总池子，若不靠内核资源配额分别封顶，业务 B 吃光内存后会连累宿主机触发全局杀进程或导致业务 A 缺页卡顿
              correct: true
            - text: 不会：只要开启了 PID 命名空间，每个容器都会自动凭空多出 8 GB 物理内存
              why: 命名空间只隔视图，变不出物理内存条
            - text: 操作系统内核规定只要叫“容器”就永远不许申请超过 10 MB 内存
              why: 默认不显式配置资源上限时，容器可以使用宿主机的全部可用内存
          explain: 把各组进程放进树状资源笼子并按规则切分算力与内存——这就是接下来要讲的内核分组配额机制。
      - card:
          title: 什么是 cgroup v2 树状层级（大纲 5.1 节）
          body: |
            Linux 内核的**控制组（control group，cgroup v2）**把系统上所有进程组织成一棵以根目录 `/sys/fs/cgroup` 为根的层级树（如每个容器对应树上的一个叶子目录）。

            你可以把 CPU、Memory、IO、PID 等“控制器”挂载到树上：父节点设下的资源上限自动约束下面所有子孙节点，且 cgroup v2 采用**统一层级**（一个进程在同一棵树里同时受多个控制器管理，逻辑比旧版 v1 清晰得多）。
      - card:
          title: cgroup v2 的四种资源分配模型（6.1–6.4 节）
          body: |
            面向不同场景，内核文档把资源分发规矩分成四类：
            1. **权重（Weights，如 `cpu.weight`）**：按比例分空闲蛋糕。节点空闲时不限制谁用，只有大家同时抢 CPU 时，权重 `200` 与 `100` 按 `2:1` 切分。
            2. **硬上限（Limits，如 `cpu.max`、`memory.max`）**：哪怕其他核全闲着，你也不能越过红线半步。
            3. **保护（Protections，如 `memory.min` / `memory.low`）**：系统缺内存要回收时，尽量别动（或绝不回收）受保护组的基本盘。
            4. **分配（Allocations，如 `cpuset.cpus`）**：把具体的几号物理核直接划给特定高敏组专用。
      - item:
          id: q-cgroup-models
          type: match
          prompt: 把下面四种控制组资源诉求与 cgroup v2 对应的分配模型连线。
          pairs:
            - [平时不限制谁多吃，但 CPU 紧张争抢时核心服务按 3 比 1 胜过离线日志任务, 权重（Weights）]
            - [不管机器现在有多空，测试容器绝对不准占用超过 2 核 CPU 或 4 GB 内存, 硬上限（Limits）]
            - [当全机内存吃紧开始回收页面时，保住数据库至少 8 GB 常驻工作集不被换出, 保护（Protections）]
            - [把物理机第 0 号和第 1 号 CPU 核心独占划拨给低延迟交易程序使用, 分配（Allocations）]
          explain: “争抢时按比例（权重）、绝对不可逾越（上限）、缺资源时优先保底（保护）、提前钉死专属硬件块（分配）”四分法囊括了资源调度全部语义。
      - card:
          title: 例题：为什么 `cpu.weight` 比 `cpu.max` 更适合平时弹性借闲算力
          body: |
            一台 8 核机器跑两个容器：线上 Web（平时只用 1 核，偶尔突发需要 6 核）和离线转码任务（随时有活就想吃满全部空余核）。用“权重”和用“硬上限”效果差多远？
          reveal:
            - title: 第 1 步：如果死设硬上限（Limits）会浪费大量空闲算力
              body: 假设给线上 Web 设 `cpu.max` 上限 4 核、离线转码也设 4 核。夜里 Web 几乎零流量空闲 3.9 核，离线转码明明急着干活却被硬上限死死卡在 4 核，白白浪费一半算力；反过来白天 Web 真来 6 核流量也借不到空闲核！
            - title: 第 2 步：改用权重（Weights）实现“闲时全借、忙时保重点”
              body: 给线上 Web 设 `cpu.weight = 800`，离线转码设 `cpu.weight = 100`（8:1）。夜里 Web 睡觉时，离线转码能借走几乎全部 8 核跑完；白天一有突发 Web 请求，调度器立刻按 8:1 把算力抢回来给 Web，整体机器利用率拉满还不误正事！
      - item:
          id: q-weight-vs-limit
          type: choice
          prompt: 某集群同时运行高优先级的“在线支付接口”和低优先级的“夜间日志压缩”。你希望系统很闲时压缩任务能尽快吃满剩余 CPU 跑完，但一旦支付流量涌来，支付必须立即拿回绝大多数算力。哪项控制策略最合适？
          options:
            - text: 用权重模型给支付设高权重（如 900）、日志压缩设低权重（如 100），而不是死卡硬上限
              correct: true
            - text: 给日志压缩设 `cpu.max` 为 0.1 核硬上限，就算夜间整台机器空着也不让多跑一点
              why: 硬上限在系统空闲时也会死死拦住压缩任务，白白浪费空转 CPU
            - text: 把两个任务塞进同一个进程，完全不设任何控制组配置
              why: 没有控制组区分优先级时，并发压缩线程会与在线支付抢占大量时间片拉高支付延迟
          explain: 当需求是“可借闲、争抢时保重点”，用权重（Weights）和保护（Protections）；只有需要严格计费隔离或防失控封顶时，才上硬上限（Limits）。
      - item:
          id: q-cgroup-v2-tree
          type: choice
          prompt: Linux 的 **cgroup v2**（与早期杂乱的 cgroup v1 相比）最核心的组织改进是什么？
          options:
            - text: 采用统一单一层级树管理所有控制器（CPU、内存、I/O、PID），一个进程组在同一位置即可受多项资源联合约束
              correct: true
            - text: 把所有容器的全部内存和 CPU 限制规则直接彻底取消
              why: cgroup v2 增强了资源分配的统一性（例如把内存回收与 I/O 记账统一起来），并不是取消限制
            - text: 只支持限制文件名长度，不再支持限制 CPU 和内存
              why: CPU、内存、IO 与 PID 正是 cgroup v2 的核心控制器
          explain: 统一树结构让内存回收与后台磁盘回写等跨控制器联动记账终于能够准确协作，也简化了容器运行时管理。
      - item:
          id: q-cgroup-mem-protect
          type: choice
          prompt: 一台机器混跑着核心缓存和几个临时批处理任务，当系统总内存紧张需要扫描回收冷页时，管理员希望绝对保住核心缓存至少 `4 GiB` 工作集不被内核随便换出。应使用 cgroup v2 哪种资源分配模型？
          options:
            - text: 保护模型（Protections，如 `memory.min` / `memory.low`），划出受保护的内存底线不被轻易回收
              correct: true
            - text: 只用硬上限（Limits）把核心缓存的 `memory.max` 设成 100 MB
              why: "`memory.max` 只是封顶不准多用，不能保护进程在全机缺内存时不被回收走页框"
            - text: 关掉 MNT 挂载命名空间
              why: MNT 命名空间只管目录挂载视图，不管内存页框回收优先级
          explain: 保护（Protections）负责“缺资源回收时谁的底线不能动”，与负责“最多准用多少”的上限（Limits）恰好互补。

  - id: cpu-memory-io-pid
    chapter: 资源控制
    title: CPU 节流、内存 OOM 与 I/O / PID 控制器
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你给一个容器同时限制了“最多用 2 核 CPU”和“最多用 4 GB 内存”。现在里面的程序出了两种极端突发状况：① 第一个程序开 8 个线程死算圆周率企图吃光 8 核；② 第二个程序在一个循环里不停分配新列表直到要吃第 4.1 GB 内存。这两种超限分别会遭遇到内核什么对待？
          options:
            - text: CPU 超配额只是被暂停（节流）变慢但不会死；内存超硬上限且回收不动后会直接被内核 OOM 杀手强制杀死
              correct: true
            - text: 两者一样，只要 CPU 超了配额进程也会当场被杀掉
              why: CPU 是可再生的时间片资源，用完了等下一个 100ms 周期再给就行；物理内存一旦装满却腾不出空间，不杀进程整个分配就再也进行不下去
            - text: 两者都会无限期暂停等待人类管理员重启电脑
              why: 内核在内存绝对耗尽时必须主动挑进程杀死回收页框才能自救
          explain: “**CPU 是可压缩资源（慢下来就行），内存是不可压缩资源（腾不出就只能杀）**”——这是理解容器资源治理最关键的一句话。
      - card:
          title: CPU 控制器与 `cpu.max` 算式（7.1 节）
          body: |
            cgroup v2 里限制 CPU 硬上限的文件叫 `cpu.max`，里面写两个微秒数：`"<配额> <周期>"`（例如 `"200000 100000"`）。

            注意 `100,000` 微秒正好等于 `100` 毫秒。如果在每 `100` 毫秒的周期里，允许容器累计跑满 `200` 毫秒的 CPU 时间（相当于同时用满 `200,000 / 100,000 = 2.0` 个逻辑核），一旦在这 100 毫秒的前 30 毫秒里 8 个线程一拥而上把 200 毫秒配额全烧光了，接下来 70 毫秒容器就会被**节流（throttling）**冻结，直到下个周期再继续跑！
      - item:
          id: q-cpu-max-calc
          type: number
          prompt: 在一台 8 核 Linux 服务器上，某个容器的 cgroup v2 `cpu.max` 文件内容配置为 `150000 100000`（单位：微秒）。这意味着该容器平均最多允许使用多少个逻辑 CPU 核的算力？（可填小数）
          answer: 1.5
          explain: 每 100,000 微秒（100 毫秒）周期内最多消耗 150,000 微秒（150 毫秒）CPU 时间，等效于 150000 / 100000 = 1.5 个 CPU 核心。
      - card:
          title: 内存控制器、`memory.max` 与 OOM 杀手（7.2 节）
          body: |
            内存上限写在 `memory.max`（如 `4G` 即 $4 \times 1024^3 = 4{,}294{,}967{,}296$ 字节，见综合练习第 4 题）。和 CPU 不同，内存不能只“等 100 毫秒”：

            当容器用量逼近 `memory.max` 时，内核先尝试回收该组自己缓存的干净文件页（Page Cache）以及向允许的交换空间换出；如果匿名堆内存实在收不下来还继续申请，内核就立刻在本组内触发 **OOM 杀手（OOM killer）**，直接发 `SIGKILL` 杀掉占内存最多的进程（容器主进程若被杀，整只容器退出，退出码常见 `137`）。
      - card:
          title: 例题：拆解 8 核 32 GB 机上的双限配置与长尾延迟坑
          body: |
            综合练习第 (4) 题情景：一台 8 核 32 GB 服务器上，给容器配置 `cpu.max = "200000 100000"` 与 `memory.max = 4G`。跑了一周后发现：容器没被杀，但监控里某些请求偶尔平白无故卡顿 70 多毫秒！怎么解释？
          reveal:
            - title: 第 1 步：算清 `cpu.max` 与 `memory.max` 的明确含义
              body: "`200000 100000` 表示每 100 ms 最多消耗 200 ms CPU 时间（即 **2 核**）；`4G` 表示容器进程物理内存加页缓存硬封顶 **4 GiB**（超限先回收页缓存，再超就触发 OOM 杀手终止进程）。"
            - title: 第 2 步：找出那“偶尔卡顿 70 毫秒”的罪魁祸首
              body: 多线程服务如果在某个 100 ms 周期的头 25 ms 里 8 个线程同时冲刺直接烧完 200 ms 配额，剩余的 **75 ms** 内所有线程都被 CPU 节流完全冻结！于是平白多出 75 ms 的长尾毛刺延迟——在生产调优里，很多响应毛刺就出自低估了并发多线程烧干 `cpu.max` 周期配额的速度。
      - item:
          id: q-oom-vs-throttle
          type: choice
          prompt: 在一台 8 核 32 GB 主机上给容器设了 `cpu.max = "200000 100000"` 与 `memory.max = 4G`。下面哪项判断是准确的？
          options:
            - text: 容器最多用满 2 核等效算力（超额只节流不杀进程），内存封顶 4 GiB（回收不动再超则触发 OOM 杀手杀进程）
              correct: true
            - text: 容器只要 CPU 算力用到 2.1 核就会立刻被内核发 SIGKILL 杀掉
              why: CPU 超配额不会触发 OOM 杀手，只会被节流等待下一个 100ms 周期
            - text: "`memory.max = 4G` 意味着超到 4.5 GB 时会自动向 CPU 借 0.5 GB 空间运行"
              why: CPU 与内存属于完全不同的硬件资源，内存超过硬上限无法从 CPU 借用空间
          explain: CPU 超限 = 节流变慢（Throttle）；内存硬上限回收无果 = OOM 杀手直接强杀（OOMKilled）。
      - card:
          title: 另外三个实用控制器：IO、PID 与 Cpuset（7.3–7.5 节）
          body: |
            只限 CPU 和内存还挡不住所有使坏脚本：
            - **PID 控制器（`pids.max`）**：专门挡住恶意或写错的 `fork` 炸弹（如 `while True: fork()`），一旦该组进程数达到上限立刻拒绝创建新进程，保住宿主机自身还能创建 SSH 进程去救火！
            - **IO 控制器（`io.max` / `io.weight`）**：限制单个容器把物理 SSD 磁盘的每秒读写次数（IOPS）和吞吐带宽彻底塞爆。
            - **Cpuset 控制器（`cpuset.cpus`）**：把容器进程钉死在指定的几号物理核和 NUMA 内存节点上，减少跨核缓存失效。
      - item:
          id: q-fork-bomb
          type: choice
          prompt: 某在线代码评测系统（OJ）允许学生在容器里提交任意 C 代码编译运行。有个调皮学生写了一个无限 `fork()` 子进程的死循环，虽然他每个进程只用几 KB 内存、而且有 1 核 CPU 限制，结果还是把整台物理服务器卡到连管理员 SSH 都登不上去。这是忘了配置哪个 cgroup 控制器？
          options:
            - text: 忘了配置 `pids.max`（PID 控制器），导致学生容器把宿主机内核全局进程号和线程槽位耗尽，连管理员登录都分不到新进程
              correct: true
            - text: 忘了配置 UTS 命名空间给学生修改主机名
              why: 主机名和创建多少万个进程没有关系
            - text: 忘了把学生代码放到 Type 2 虚拟机里运行 Windows
              why: 无论容器还是普通进程，只要不限单个组能创建的进程数上限，都能用 fork 炸弹撑爆全局进程槽位
          explain: 在允许运行不可信代码或开启大量线程的场景里，`pids.max` 是保命配置，通常设几十到几百就够用了。

  - id: container-images
    chapter: 调度和镜像运行
    title: 容器镜像分层、Dockerfile 缓存与非 root 安全
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你用容器打包一个 Python Web 应用，依赖包 `requirements.txt`（装好要 3 分钟）一个月才改一次，但你的业务代码 `app.py` 每天改 20 次。假如你把 Dockerfile 写成先 `COPY . .`（把 `app.py` 和全部文件拷进去）再 `RUN pip install -r requirements.txt`，每次改一行 `app.py` 重建镜像会怎样？
          options:
            - text: 每次改 `app.py` 都会让 `COPY . .` 这一层缓存失效，连带后面本来没变的 `pip install` 缓存全部作废，每次都要白等 3 分钟重装依赖
              correct: true
            - text: 无论顺序怎么写，容器工具总会自动跳过所有 `RUN` 命令不再执行
              why: 镜像构建按从上到下的层顺序检查输入哈希，前面任何一层变了，后面的所有层缓存全部失效重跑
            - text: "`pip install` 必须在没有 `requirements.txt` 文件之前先执行才能加速"
              why: 需要先 `COPY requirements.txt .` 把清单放进去才能安装，技巧是把 `COPY . .`（高频变动）挪到安装步骤之后
          explain: 理解**镜像分层**的构建缓存规则，就能把每天 20 次构建从几分钟压成 1 秒钟！
      - card:
          title: 什么是镜像（Image）与分层只读快照（1.1 节）
          body: |
            容器运行所需的完整根目录文件从哪来？来自**镜像（image）**。

            镜像不是一块笨重的整盘文件，而是**一叠只读的文件系统层（layers）**：底层是基础系统（如精简 Linux），往上一层装 Python 运行时，再往上一层装依赖库，最顶一层放你自己的 `app.py`。当多个容器从同一基础镜像启动时，宿主机内存和磁盘上只存一份共享的只读层，每个容器只在最顶端各自叠一层薄薄的“可写层”！
      - card:
          title: 例题：写出缓存高效且满足非 root 安全的最小 Dockerfile
          body: |
            结合原技能树综合练习第 (3) 题和后继安全技能（S.2.4）的基线，一步步搭出打包 Flask 应用的规范 `Dockerfile`：
          reveal:
            - title: 第 1 步：把低频变动的依赖层写在高频变动的代码层之前
              body: |
                ```dockerfile
                FROM python:3.12-slim
                WORKDIR /app
                COPY requirements.txt .
                RUN pip install --no-cache-dir -r requirements.txt
                COPY . .
                ```
                这样只要 `requirements.txt` 没改，就算天天改 `app.py`，前四层全命中缓存，只需一秒增量覆盖最后一层 `COPY . .`！
            - title: 第 2 步：别用 root 跑，指定普通用户身份（安全基线）
              body: |
                ```dockerfile
                USER 1000:1000
                CMD ["python", "app.py"]
                ```
                镜像默认常以 `root (UID 0)` 运行！加上 `USER 1000:1000` 后，即便 Web 应用遭遇代码漏洞被攻破，攻击者在容器内也不是 root，大幅降低提权风险，也不用把明文密钥写进镜像层。
      - item:
          id: q-dockerfile-order
          type: order
          prompt: 请把打包 Python Web 服务时**最能充分利用构建层缓存**、且包含非 root 切换的 `Dockerfile` 指令顺序排出来。
          steps:
            - FROM python:3.12-slim
            - WORKDIR /app
            - COPY requirements.txt .
            - RUN pip install --no-cache-dir -r requirements.txt
            - COPY . .
            - USER 1000:1000
            - 'CMD ["python", "app.py"]'
          explain: 变化频率越低的层越靠前（基础镜像 → 依赖清单 → 安装依赖 → 业务代码），`USER` 切换放在文件拷贝之后、启动命令之前。
      - item:
          id: q-image-layers-share
          type: choice
          prompt: 一台机器同时运行 10 个容器，它们全部基于同一个 180 MB 的 `python:3.12-slim` 基础镜像层构建，各自只有顶上 5 MB 业务代码不同。这 10 个容器在磁盘上占用的总镜像空间大约是多少？
          options:
            - text: 大约 `180 + 10 × 5 = 230 MB`，因为共享的底层只读基础镜像层在磁盘上只存一份
              correct: true
            - text: 必定是 `10 × 185 = 1850 MB`，每个容器都要完整复制 10 份 180 MB 基础系统
              why: 镜像层按内容哈希只读共享，只有各自不同的业务层和运行时可写层占用额外空间
            - text: 恰好 0 MB，容器从不占用任何磁盘空间
              why: 镜像文件和容器写入的临时文件仍需占用物理磁盘空间
          explain: 内容寻址的只读分层不仅加速分发下载（已有基础层免重复拉取），也大幅节省本机磁盘与页缓存内存。
      - item:
          id: q-dockerfile-secrets
          type: choice
          prompt: 某同学在写 Dockerfile 时，为了测试方便写了 `ENV DB_PASSWORD=secret123`，然后到了后面一层又觉得不妥，加了一句 `RUN unset DB_PASSWORD` 想把它删掉。打出来的镜像安全吗？
          options:
            - text: 不安全：镜像每一层都会被永久保存在历史快照中，任何人拉取镜像检查分层历史都能一眼翻出明文密码
              correct: true
            - text: 完全安全：只要在最后一层执行 `unset`，前面镜像层里的历史记录就会自动抹除
              why: 联合文件系统的下层历史记录依然原封不动留在历史镜像层里，后层只是遮盖而非擦除
            - text: 安全，因为 Docker 会在构建时自动把所有变量加密成量子随机串
              why: "`ENV` 指令以纯明文 JSON 元数据形式保存在镜像配置里"
          explain: 构建镜像时千万别把任何密码、私钥或 API Token 放进 `COPY`、`ENV` 或 `RUN` 参数里——密钥只能在容器运行时通过挂载或安全环境变量注入！
      - item:
          id: q-nonroot-why
          type: choice
          prompt: 为什么生产环境编写 `Dockerfile` 时，强烈建议在最后加上一句 `USER 1000:1000` 切换到非 root 用户运行应用？
          options:
            - text: 万一应用程序存在代码漏洞被攻击者拿到执行权，进程在容器内以及共享挂载卷上只拥有普通低权限用户身份，降低提权与破坏面
              correct: true
            - text: 因为 Python 代码只要用 UID 1000 运行，数学计算速度就能提升十倍
              why: 用户 UID 只决定内核权限检查，不改变 CPU 算术指令速度
            - text: 因为不加 `USER` 指令时容器运行时会自动删掉 `CMD`
              why: 缺省会默认以 `root (UID 0)` 执行 `CMD`，虽然能跑起来但违背最小权限原则
          explain: 默认 root 是容器安全的大忌；配合外部宿主机的用户命名空间映射与非 root 用户指令，能把漏洞破坏力压到最小。

  - id: image-registry-digest
    chapter: 调度和镜像运行
    title: 镜像仓库、标签 vs 摘要与运行时权限加固
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 生产集群的发布配置里写着拉取 `nginx:latest`。上周三部署时一切正常，今天集群扩容自动在新节点拉起一台新副本时，同一个 `nginx:latest` 却突然启动报错或者跑起了和上周不一样的代码！问题最可能出在哪？
          options:
            - text: "`latest` 是一个可变标签，上周和今天仓库管理员可能往同一个名字上推送覆盖了不同版本的镜像"
              correct: true
            - text: 因为容器运行时每周四会自动自己随机改写镜像里的 C 代码
              why: 容器运行时只负责解包执行拉下来的层，不会自己改代码，变化来自上游仓库替换了标签指向
            - text: 因为 Linux 内核禁止用 `latest` 作为英文单词
              why: 标签名在语法上合法，只是生产环境不该依赖可随意覆盖的浮动标签
          explain: 想要每次扩展出来的 100 个副本一字不差跑同一个构建，必须理解**标签**和**摘要**的根本区别。
      - card:
          title: 镜像仓库（Registry）、标签与不可变摘要（Digest）
          body: |
            构建好的镜像要推送到**镜像仓库（image registry）**分发给所有集群节点。仓库里定位镜像有两种写法：
            - **标签（Tag）**：如 `python:3.12-slim` 或 `:latest`。标签就像书签贴纸，**可以随时被重新贴到另一份新构建上**。
            - **摘要（Digest）**：如 `python@sha256:4a1c...`。**摘要**是对镜像清单算出的密码学哈希指纹，只要里面哪怕改了一个字节，哈希就会彻底变化——**不可篡改、永远唯一指向同一份制品**！
      - item:
          id: q-tag-vs-digest
          type: choice
          prompt: 为了防止“昨晚测试通过的版本”和“今天自动扩容拉下来的版本”暗中悄悄被替换掉，甚至防范上游镜像仓库账号被盗篡改镜像，生产部署时最可靠的做法是什么？
          options:
            - text: 用固定版本号或直接锁定不可变摘要 `@sha256:...` 拉取镜像，并配合镜像签名校验
              correct: true
            - text: 永远只写 `:latest` 标签并关闭所有校验
              why: "`:latest` 随时可被重推覆盖，且不带摘要校验无法发现同名内容被静默调包"
            - text: 每天用人工邮件把 500 MB 压缩包群发给每台服务器
              why: 镜像仓库结合 `@sha256:` 摘要校验既能高效按层缓存分发，又能保证字节级一致性
          explain: 标签为人读（方便认出 v1.4），摘要为机器验（保证不可变且可验证完整）。
      - card:
          title: 容器运行时安全基线：最小权限运行（衔接云安全）
          body: |
            就算镜像干净，直接用默认宽松配置跑起来仍有隐患（衔接 S.2.4 容器安全实践）：
            1. **拒绝特权与根用户**：不用 `--privileged`，在配置里强制要求非 root 用户启动；
            2. **剥离多余内核能力（Capabilities）**：Linux 把超级权限拆成几十小块（如绑定特权端口、加载内核模块），普通 Web 容器应默认 `drop ALL` 全部拿掉；
            3. **只读根文件系统与禁止提权**：把容器根文件系统设为只读（`--read-only`），只给 `/tmp` 等必要临时目录挂可写卷，并禁止通过 setuid 提权。
      - item:
          id: q-container-hardening
          type: match
          prompt: 把四项生产容器运行时加固配置与它分别挡住的攻击手法连线。
          pairs:
            - [以非 root 用户（如 UID 1000）运行进程, 限制应用被攻破后在容器或挂载文件上的默认超级权限]
            - [剥离多余 Linux Capabilities（cap-drop ALL）, 禁止容器进程调用加载内核模块、嗅探原始包或篡改系统时间等危险特权]
            - [设置只读根文件系统（read-only rootfs）, 防止攻击者得手后直接在容器 `/usr/bin` 写入持久化木马文件]
            - [部署配置锁定镜像 `@sha256:...` 摘要, 防止同名浮动标签在上游被静默替换成带后门的恶意镜像]
          explain: “镜像来源锁摘要 + 运行身份非 root + 剥离 Capabilities + 只读根文件系统”，构成生产容器最扎实的四件套基线。
      - item:
          id: q-registry-cache
          type: choice
          prompt: 当节点第一次从镜像仓库拉取一个 `220 MB`（其中 200 MB 为基础 Linux 与 Python 层，20 MB 为你的业务代码层）的镜像后，第二天你只改了 `app.py` 推了一个新版本 `v2`（业务层变了 20 MB，底层 200 MB 一字未动）。节点更新拉取 `v2` 时，真正需要从网络重新下载多少数据？
          options:
            - text: 只需要重新下载发生变化的顶层 `20 MB` 业务层，底层已缓存的 200 MB 层按摘要直接复用
              correct: true
            - text: 必须把完整 `220 MB` 全部删掉重下一遍
              why: 镜像仓库按每一层的独立内容摘要索引与分发，本机已有的相同只读层无需重复下载
            - text: 只需要下载 `0` 字节，连新改的代码也不用下载
              why: 改过的顶层业务代码层产生了新摘要，必须拉取这 20 MB 新层
          explain: 分层不仅省本地磁盘，也省每次跨网络发布时的传输流量，前提是底层保持不变。

  - id: k8s-requests-limits
    chapter: 调度和镜像运行
    title: Pod 资源请求、限制与 QoS 驱逐
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: "在集群里部署一个应用 Pod，你配置了两组看似重复的数字：`requests（资源请求）: 500m CPU / 256Mi 内存` 和 `limits（资源限制）: 1000m CPU / 512Mi 内存`。为什么要费劲写两组数字，而不是只写一个数？"
          options:
            - text: "`requests` 是给调度器看的“保底占位量”，保证节点真有这么多空闲再放过去；`limits` 是给本机控制组看的“天花板硬封顶”，允许忙时借点空闲但不准无限撑爆节点"
              correct: true
            - text: "`requests` 是给开发看的中文，limits 是给运维看的英文"
              why: 两者都是编排器与内核实际执行的量化数值，分别控制“调度准入预留”与“运行期最高封顶”
            - text: 因为两个数字永远必须一模一样，系统故意让你抄两遍
              why: 很多弹性任务可以把 limits 设得比 requests 大，从而兼顾保底容量与突发借用空闲资源
          explain: 分清 **requests（保底选址）** 与 **limits（封顶上限）**，就抓住了集群资源超卖与 QoS 分级的开关。
      - card:
          title: Pod、资源单位与 Requests vs Limits（大纲 3.1–3.8）
          body: |
            在 Kubernetes 里，最小调度单元是 **Pod**（里面可装 1 个或多个紧耦合容器）。资源常用两个单位（3.6 节）：
            - **CPU 毫核**：`1000m`（1000 millicores）等于 `1` 整颗逻辑核，`500m` 就是半核（对应 `cpu.weight` 与 `cpu.max`）。
            - **内存二进制字节**：`Mi`（MiB = $1024^2$ 字节）、`Gi`（GiB = $1024^3$ 字节）。

            **资源请求（requests）**决定调度器扣除节点多少“已预留额度”（3.7 节）；**资源限制（limits）**决定运行时由 cgroups 强制锁死的硬上限（3.8 节，超 CPU 节流、超内存 OOM）。
      - item:
          id: q-pod-sum-units
          type: number
          prompt: "一个 Pod 里装了两个容器：主业务容器写 `requests.cpu: 500m, limits.memory: 128Mi`，边车日志容器也写 `requests.cpu: 500m, limits.memory: 128Mi`。那么调度器为这整个 Pod 预留多少颗完整逻辑 CPU 核的保底额度？（填整数或小数）"
          answer: 1
          explain: 整个 Pod 的资源请求等于内部各常规容器请求之和：500m + 500m = 1000m = 1.0 颗逻辑 CPU 核（而两个容器若各自都吃满 128Mi 内存上限，Pod 总内存消耗可达 256Mi）。
      - card:
          title: Pod 开销（PodOverhead）、临时存储与扩展资源（3.10–3.11、2.4）
          body: |
            除了容器业务自己吃的内存，每个 Pod 外面套着的隔离沙箱本身（如微虚拟机沙箱或 Pause 容器）也要耗电耗内存，这叫 **PodOverhead**（2.4 节）：调度器判断节点装不装得下时，必须把“容器 requests + PodOverhead”加起来一起算！

            此外还可以声明本地临时存储上限（如 `ephemeral-storage` 防日志文件写满宿主盘）以及 GPU 等扩展资源（3.10–3.11 节）。部分新集群还支持原地调整容器大小（3.9）和 Pod 级别总配额（3.5）。
      - card:
          title: 例题：算清 PodOverhead 总占位与节点压力驱逐顺序
          body: |
            假设一个 Pod 含 2 个容器，容器 A 请求 `500m / 256Mi`，容器 B 请求 `250m / 128Mi`，该运行时的 `PodOverhead` 为 `100m / 64Mi`。
            同时集群节点上运行着三类服务质量和配额配置的 Pod，突然物理节点内存告急触发**节点压力驱逐（2.10 节）**，谁最先被踢？
          reveal:
            - title: 第 1 步：算清调度时真正占用的节点总额度
              body: 节点调度扣除的总请求 = 容器之和 + PodOverhead：CPU = $500 + 250 + 100 = 850\text{m}$；内存 = $256 + 128 + 64 = 448\text{Mi}$。如果节点只剩 800m CPU，就算两个容器加起来才 750m，一样装不下！
            - title: 第 2 步：看三档 QoS 在节点内存吃紧时的驱逐顺序
              body: 当节点内存或磁盘压力超过安全阈值时，kubelet 会触发**驱逐（eviction）**主动停掉部分 Pod 保全宿主，按三档 QoS 依次动手：① **BestEffort**（既没写 requests 也没写 limits）优先级最低，缺内存时**第一个被驱逐**；② **Burstable**（写了 requests 但小于 limits）其次被驱逐（超 requests 越多的越先走）；③ **Guaranteed**（所有容器 CPU 与内存的 requests 严格等于 limits 且非零）最受保护、最后才动。
      - item:
          id: q-qos-eviction
          type: order
          prompt: 当某台工作节点物理内存耗尽触发“节点压力驱逐（Node-pressure Eviction）”时，请按**最先被踢掉驱逐到最后才会被动**的顺序排列三类服务质量（QoS）的 Pod。
          steps:
            - BestEffort（未配置任何 requests 与 limits，最先被牺牲）
            - Burstable（已设 requests 但不等于 limits，其次按超用比例逐个驱逐）
            - Guaranteed（requests 严格等于 limits，核心业务最后保底）
          explain: 这是用资源声明换稳定性的直接体现：核心数据库等关键服务应设 `requests == limits` 拿到 `Guaranteed` 身份，把“随时可重启的尽力而为任务”放进 `BestEffort` 当缓冲垫。
      - item:
          id: q-eviction-types
          type: choice
          prompt: 大纲第 2.10 和 2.11 节区分了“节点压力驱逐（Node-pressure）”与“API 发起驱逐（API-initiated）”。以下哪种场景属于 **API 发起驱逐**？
          options:
            - text: 运维计划给一台节点升级内核，执行节点排空（drain）通过 API 有序把该节点上的 Pod 赶走并满足最小可用预算（PDB）
              correct: true
            - text: 节点硬盘突然被容器写满 98%，kubelet 本地自己挑了个 BestEffort Pod 强行杀掉腾空间
              why: 节点本地监控到内存/磁盘压迫紧急保命自救，属于 kubelet 本地执行的“节点压力驱逐”
            - text: 容器自己代码里写了一个 `sys.exit(0)` 正常退出
              why: 容器进程自行退出不是集群从外部发起的驱逐
          explain: 节点压力驱逐是 `kubelet` 为保宿主不宕机在本地立刻动手；API 发起驱逐则是人或运维控制器按集群可用性规则（PDB）温柔迁移 Pod。
      - item:
          id: q-io-pid-controllers
          type: match
          prompt: 把 cgroup v2 的三项专题控制器与它们各自管住的宿主机瓶颈连线。
          pairs:
            - [PID 控制器（pids.max）, 防止容器内部无限 fork 子进程耗尽宿主机全局进程槽位]
            - [IO 控制器（io.max / io.weight）, 防止单个容器把共享物理磁盘的每秒读写次数与吞吐塞满]
            - [Cpuset 控制器（cpuset.cpus）, 把高敏进程钉在指定物理 CPU 核上减少跨核缓存抖动]
          explain: 除了最常见的 CPU 和内存，PID、IO 与 Cpuset 共同补齐了单机混跑隔离的最后几块拼图。
      - item:
          id: q-requests-vs-limits-oom
          type: choice
          prompt: "一个容器配置了 `requests.memory: 256Mi` 和 `limits.memory: 512Mi`。下面关于它在集群调度和运行时的行为，哪一项是**对**的？"
          options:
            - text: 调度器只需确认节点至少还剩 256Mi 可分配内存即可放入；运行时如果容器内存一路涨破 512Mi 硬上限且回收不动，就会被 cgroups 触发 OOM 杀手终止
              correct: true
            - text: 调度器必须看到节点有 512Mi 空闲才肯调度，但运行时哪怕吃到 2000Mi 也不会被杀
              why: 恰恰相反：调度器只按 `requests`（256Mi）预留额度，而运行期由控制组按 `limits`（512Mi）硬封顶
            - text: 一旦用到 257Mi 内存，kubelet 会立刻把该容器删掉
              why: 超过 requests 但还在 limits（512Mi）内是允许借用的弹性区间，只有节点全局缺内存触发压力驱逐时才优先受影响
          explain: 记住口诀：**requests 管“找房下单占几张床位（调度）”，limits 管“最多能吃多少不能撑破（控制组上限）”**。

  - id: k8s-scheduler-placement
    chapter: 调度和镜像运行
    title: K8s 调度器、污点容忍、拓扑分布与抢占
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个新 Pod 已经创建好了（声明需要 `700m` CPU 和 `256Mi` 内存），正排队等待落户。集群有三台机器：A 剩 `500m / 1024Mi`、B 剩 `1200m / 512Mi`、C 剩 `2000m / 128Mi`。哪台机器能完整装下这个 Pod？
          options:
            - text: 只有节点 B，因为 A 的 CPU 不够 700m，C 的内存不够 256Mi
              correct: true
            - text: 节点 A 和节点 C 都可以，因为 A 内存大、C 核数多，把一个 Pod 拆成两半挂过去就行
              why: 单个 Pod 内部共享同网络命名空间和宿主机内核，必须整体落在一台单独的工作节点上
            - text: 三台都不行，因为 B 剩余内存还没超过 1024Mi
              why: Pod 只要 256Mi 内存，节点 B 剩余 512Mi 完全够用
          explain: 这正是调度器第一关**过滤（Filtering）**干的活——所有硬资源和放置约束必须“同时在一台节点上全部满足”。
      - card:
          title: 调度框架两步走：过滤（Filter）与打分（Score）（2.1、2.7 节）
          body: |
            **kube-scheduler** 通过可扩展的“调度框架”（2.7 节）把新 Pod 绑定到合适节点：
            1. **过滤阶段（Filter）**：逐个检查节点硬门槛——`requests` 余量够不够、节点是否满足亲和性标签、有没有带未容忍的“污点”、拓扑分布是否允许。过不了的直接淘汰。
            2. **打分阶段（Score）**：对所有留下的合格候选节点按偏好打分（如资源均衡分散、镜像本机已缓存优先），选最高分绑定节点。
            （另外还可配置多个自定义调度器共存，以及用 `schedulingGates` 先暂停就绪等待外部条件再参与调度，见 2.2、2.8 节。）
      - card:
          title: 污点与容忍（Taints & Tolerations）与拓扑分布（2.3、2.5–2.6）
          body: |
            有时我们**不希望普通业务乱跑进特殊节点**（比如昂贵的 GPU 节点或控制面主节点）：
            - **污点（Taint）与容忍（Toleration）**：给 GPU 节点贴上“污点” `gpu=true:NoSchedule`，像大门贴了“闲人免进”。普通 Pod 没有对应**容忍**就会在过滤阶段被挡在门外；只有显式写了容忍该污点的 AI 训练 Pod 才能放进来！
            - **节点亲和性与拓扑分布约束（Topology Spread）**：把同款核心服务的 3 个副本尽量均匀打散到不同机架或不同故障域，避免一断电全军覆没。
      - item:
          id: q-scheduler-taint
          type: choice
          prompt: 某集群三台节点余量如下：node-A 剩 `1500m / 1024Mi` 但挂有污点 `gpu=true:NoSchedule`；node-B 剩 `900m / 400Mi` 无污点；node-C 剩 `500m / 2048Mi` 无污点。现在来了一个需要 `600m` CPU 和 `300Mi` 内存、且**没有配置任何容忍**的普通 Web Pod。调度器会把它放到哪？
          options:
            - text: 只能放到 node-B：node-A 因带有未容忍污点被过滤淘汰，node-C 因 CPU 余量不足 600m 被过滤淘汰
              correct: true
            - text: 放到 node-A，因为它的剩余 CPU 和内存最大
              why: "`NoSchedule` 污点属于过滤阶段的硬门槛，没有对应 Toleration 绝对进不去"
            - text: 放到 node-C，因为内存最宽裕，CPU 差的那 100m 可以先欠着
              why: 调度看的是 `requests` 硬余量门槛，CPU 与内存不能互相抵扣
          explain: 只有同时通过“资源够”和“满足污点容忍/亲和规则”所有过滤条件的节点，才能进入打分环节。
      - card:
          title: 例题：当全集群资源真的不够时，优先级与抢占怎么工作（2.9 节）
          body: |
            假设集群节点已经塞满了低优先级的“夜间测试 Pod”（占用着 2 核 CPU），此时紧急弹出一个极高优先级的“线上核心支付 Pod”（需要 1 核），所有节点都过不了过滤阶段！调度器怎么救场？
          reveal:
            - title: 第 1 步：触发抢占（Preemption）评估
              body: 调度器发现高优先级 Pod 卡在 `Pending` 状态，便挨个节点试算：“如果我把这台节点上几个优先级比它低的 Pod 踢掉，释放出来的资源加上本来剩的余量，够不够装下这个核心支付 Pod？”
            - title: 第 2 步：有秩序地腾笼换鸟
              body: 选定代价最小的那台节点后，调度器先提名该节点，并按优雅退出流程通知上面那些低优先级 Pod 被抢占退出（不会一刀切无视优雅宽限期），等它们把资源真正吐出来后，再把核心支付 Pod 稳稳放进去！
      - item:
          id: q-preemption
          type: choice
          prompt: 在 Kubernetes 集群中，如果一个高优先级的线上服务 Pod 因所有节点资源余量都不够而无法直接通过过滤阶段，启用**优先级与抢占（Priority and Preemption）**后调度器会怎么做？
          options:
            - text: 挑选一个踢掉部分低优先级 Pod 后就能腾出足够资源的节点，驱逐那些低优先级 Pod 腾出空间以容纳高优先级 Pod
              correct: true
            - text: 把高优先级 Pod 强行拆碎成 5 个小块，每个节点塞 200m CPU 跑起来
              why: 单个 Pod 不能跨节点物理拆分运行
            - text: 直接把高优先级 Pod 永久删除掉，以免它一直排队
              why: 抢占是为了保住关键高优任务运行而牺牲低优任务，绝不会反过来删掉高优任务
          explain: 资源有限时必须分出轻重缓急：用 `PriorityClass` 标明业务关键级别，关键时刻才能安全“保大舍小”。
      - item:
          id: q-k8s-match
          type: match
          prompt: 把下面四种调度与资源控制需求与对应的 Kubernetes 机制配对。
          pairs:
            - [禁止普通无 GPU 需求的任务误占昂贵的 GPU 专用机器, 污点与容忍（Taints & Tolerations）]
            - [确保同一服务的 3 个副本尽量平均打散放在不同物理机架或区域上, Pod 拓扑分布约束（Topology Spread）]
            - [计算容器资源requests之外，沙箱和运行环境本身额外占用的节点额度, PodOverhead]
            - [外部依赖准备妥当之前先暂停把 Pod 送进调度队列里空转, Pod Scheduling Readiness（schedulingGates）]
          explain: 污点挡无关任务，拓扑分布防单点扎堆，PodOverhead 算清隐性开销，Scheduling Readiness 管好起跑时机。

boss:
  items:
    - id: boss-vm-vs-container
      type: match
      prompt: 把四种虚拟化或隔离概念与它们的本质特征连线。
      pairs:
        - [Type 1 裸金属虚拟机监控程序, 直接跑在物理硬件上管理多个自带独立完整内核的客体虚拟机]
        - [Type 2 寄宿型虚拟机监控程序, 作为普通应用跑在已有桌面宿主机系统上再虚拟出一套客体硬件环境]
        - [Linux 容器, 与宿主机共用同一个内核，靠命名空间隔开视图、靠控制组限制资源]
        - [硬件辅助虚拟化（VT-x / EPT）, 在芯片指令集和二级页表层面支持非根模式与二维地址翻译]
      explain: 虚拟机隔到硬件与独立内核层，容器隔在共享内核上的进程视图与资源配额层。
    - id: boss-popek-vtx
      type: choice
      prompt: 早年纯软件虚拟化在老式 x86 CPU 上如果直接套用“陷入并模拟（Trap-and-Emulate）”会失效，于是软件工程师曾不得不改用“动态二进制翻译”，而后来硬件厂商推出了 Intel VT-x/AMD-V 与 EPT/NPT。下面哪句概括最精准？
      options:
        - text: 老 x86 有敏感但非特权的指令在降级用户态不触发陷入；VT-x 增加了硬件根/非根模式消除该漏洞，EPT 用硬件二级页表取代了昂贵的软件影子页表
          correct: true
        - text: 老 x86 无法做任何整数加法运算，VT-x 只是给 CPU 增加了加法电路
          why: 算术运算一直都有，虚拟化卡在特权级别覆盖和两层地址转换效率上
        - text: EPT 出现后，宿主机和虚拟机从此不再使用任何虚拟内存和页表
          why: 客体操作系统和宿主机依然各自维护页表，只是由 MMU 硬件协同完成两级查表
        - text: VT-x 的作用是把所有 Type 1 虚拟机自动转成共享同一个内核的容器
          why: VT-x 加速的是运行独立客体内核的强隔离硬件虚拟机，而不是把它变成共享内核容器
      explain: 把虚拟化演进脉络记牢：Popek–Goldberg 三原则 → 敏感非特权指令打破 Trap-and-Emulate → 二进制翻译绕行 → VT-x + EPT 硬件彻底接管。
    - id: boss-ns-vs-cgroup
      type: choice
      prompt: 在一台跑着多种业务容器的 Linux 宿主机上，若某个只启用了全部六大命名空间、却忘记配置任何 cgroup 上限的测试容器突然运行了一个恶意程序：一边不断 `malloc` 占满全机内存，一边无限 `fork` 子进程。这会暴露出哪项机制边界？
      options:
        - text: 命名空间只负责隔离进程能“看见”的视图（如 PID 编号、目录和网卡），管不住容器到底能消耗多少真实物理资源；必须靠 cgroups（`memory.max` 与 `pids.max`）限制资源与防 fork 炸弹
          correct: true
        - text: 只要开启了 USER 命名空间，任何容器里的代码就绝对申请不到超过 1 MB 物理内存
          why: USER 命名空间只做 UID/GID 权限映射，不会自动限制物理内存与进程总数
        - text: 只要开启了 PID 命名空间，宿主机全局就看不见容器里 fork 出来的任何线程开销
          why: 容器内看到的只是局部重编号的 PID 视图，宿主机内核里照样实打实为每个线程分配内核结构与内存页框
        - text: 应该立刻改用 `setns(2)` 把所有容器合并到同一个 PID 命名空间来省内存
          why: "`setns(2)` 只是让进程切入已有命名空间共享视图，既不限内存，合并反而直接拆掉了隔离墙"
      explain: 视野隔离（Namespaces）+ 资源封顶（cgroups）才是容器双轮驱动，缺一不可。
    - id: boss-cpu-mem-limit
      type: choice
      prompt: 一台 8 核 32 GB 物理主机上，某个容器配置了 cgroup v2 `cpu.max = "250000 100000"` 和 `memory.max = 4G`。当这个容器内的业务同时开 8 个线程狂算并持续往列表里追加巨量数据时，会发生什么？
      options:
        - text: CPU 算力平均被压在 2.5 核且每个周期耗尽配额后会被节流等待（不杀进程）；内存突破 4 GiB 且页缓存回收无果后会触发 OOM 杀手直接强杀超额进程
          correct: true
        - text: CPU 算力平均最多 25 核，一旦超了就会触发 OOM 杀手直接重启宿主机
          why: 250000 / 100000 = 2.5 核（不是 25 核），且 CPU 超额只会节流，不会触发 OOM 杀手或重启宿主机
        - text: 内存超过 4 GiB 后也会和 CPU 一样只需等 100 毫秒就能自动变回 0 占用继续跑
          why: 内存占用的页框在程序释放前一直被持有，不像 CPU 时间片会随下个周期自动刷新
        - text: 因为服务器共有 32 GB 内存，容器会毫无阻碍一直用到 31 GB 才停
          why: cgroup v2 的 `memory.max = 4G` 是一道硬封顶红线，到达 4 GiB 就拦住并回收或触发 OOM
      explain: 算准 `cpu.max = quota / period`（`250000 / 100000 = 2.5` 核），并记牢“CPU 节流、内存 OOM”。
    - id: boss-cpu-math
      type: number
      prompt: 若将容器的 cgroup v2 `cpu.max` 设置为 `250000 100000`（微秒），等价于最多允许使用多少个逻辑 CPU 核心的算力？（可填小数）
      answer: 2.5
      explain: 250,000 微秒配额 / 100,000 微秒周期 = 2.5 个逻辑 CPU 核心。
    - id: boss-dockerfile
      type: choice
      prompt: 你需要为团队写一个打包 Flask Web 应用（含 `requirements.txt` 依赖清单）的 `Dockerfile`，既要日常改代码重建极快命中层缓存，又要满足安全最小权限原则。哪份写法最合标准？
      options:
        - text: 先 `FROM python:3.12-slim` 与 `WORKDIR /app`，接着 `COPY requirements.txt .` + `RUN pip install --no-cache-dir -r requirements.txt`，之后再 `COPY . .`，最后用 `USER 1000:1000` 切非 root 并启动
          correct: true
        - text: 一上来先 `COPY . .` 把所有代码考进去，再 `pip install -r requirements.txt`，最后在命令里写死 `ENV DB_PASS=123456` 并用 root 启动
          why: 先 `COPY . .` 会让每次改业务代码都使依赖安装缓存失效，把密码写进 `ENV` 会永久留在镜像层历史里，默认 root 运行违背最小权限
        - text: 在最后加一句 `RUN rm -rf /tmp/*` 就能彻底擦除前面镜像层里写过的私钥文件
          why: 只读分层文件系统里，后面的删除只会在顶层打一个“白出遮盖标记”，前面旧层依然完整保存在仓库和镜像文件里
        - text: 去掉 `FROM` 行，直接从空目录靠 `CMD` 启动 Python
          why: 没有基础镜像层提供 Python 运行时和底层系统库，命令根本跑不起来
      explain: 高频变动的源码放最晚层拷入；秘钥不进任何镜像层；切非 root 用户启动，这是一份合格生产 Dockerfile 的基本面。
    - id: boss-registry-security
      type: match
      prompt: 把四项容器镜像与运行时安全实践和它们各自防住的风险配对。
      pairs:
        - [生产配置锁定 `@sha256:...` 不可变摘要, 防止上游仓库 `:latest` 标签被静默覆盖篡改]
        - [配置 `--cap-drop=ALL` 剥离全部内核能力, 防止被攻破的普通容器进程调用加载驱动或抓包等危险内核特权]
        - [配置只读根文件系统 `--read-only`, 防止攻击者在容器系统目录随意落地恶意二进制木马]
        - [给容器设置 `pids.max` 上限, 防止内部异常代码或恶意脚本用 fork 炸弹耗尽宿主机全局进程槽位]
      explain: 从仓库拉取验证（摘要）、文件防改（只读）、权限最小（非 root + 剥离 Capabilities）到防资源炸弹（cgroups + pids.max），环环相扣。
    - id: boss-pod-overhead
      type: number
      prompt: 某安全沙箱运行时每个 Pod 本身需要额外占用 `PodOverhead` = `100m` CPU 和 `64Mi` 内存。现在向它提交一个含两容器的 Pod：容器 A 请求 `500m / 256Mi`，容器 B 请求 `250m / 128Mi`。调度器检查目标节点空余 CPU 时，这个 Pod 至少需要节点剩下多少 `m`（毫核）CPU 才算够？（填整数）
      answer: 850
      explain: 节点调度扣除 = 所有容器请求之和 + PodOverhead = 500m + 250m + 100m = 850m CPU（内存同理需至少 256 + 128 + 64 = 448Mi）。
    - id: boss-qos-evict
      type: choice
      prompt: "一台集群节点同时跑着三个 Pod：① `cache-pod` 没有设置任何 requests 和 limits；② `api-pod` 设置了 `requests: 500m/256Mi`、`limits: 1000m/512Mi`；③ `db-pod` 设置了 `requests: 1000m/1Gi`、`limits: 1000m/1Gi`。突然节点可用内存跌破驱逐阈值，kubelet 依次驱逐的优先级顺序（从最先踢到最后保）是什么？"
      options:
        - text: 最先驱逐 `cache-pod`（BestEffort），其次 `api-pod`（Burstable），最后才可能动 `db-pod`（Guaranteed）
          correct: true
        - text: 最先驱逐 `db-pod`，因为它的 limits 最大最占地方
          why: "`db-pod` 的 requests 严格等于 limits 且非零，属于最高保障档位 Guaranteed，绝不会在 BestEffort 之前被踢"
        - text: 最先驱逐 `api-pod`，最后才驱逐什么都不填的 `cache-pod`
          why: 什么都不写 requests/limits 的 `cache-pod` 属于最低档 BestEffort，节点一缺资源它就是第一批牺牲品
        - text: 三个 Pod 同时随机杀掉一半内存再继续跑
          why: kubelet 按 QoS 优先级与超出 requests 的幅度有序驱逐整只 Pod，绝不会把单个运行中容器的内存随机切半
      explain: BestEffort（无声明）→ Burstable（requests < limits）→ Guaranteed（requests == limits）是节点压力驱逐的核心顺序规则。
    - id: boss-k8s-scheduler
      type: choice
      prompt: 下面关于 `kube-scheduler` 处理一个刚创建的 Pod 流程（包括污点、拓扑分布与抢占）的描述，哪一项是正确的？
      options:
        - text: 调度器先在过滤阶段剔除资源不足、不满足亲和/拓扑要求或带有未容忍污点的节点，再在打分阶段从合格节点选最优者；若全集群均不满足，高优先级 Pod 可触发抢占驱逐部分低优先级 Pod 腾位
          correct: true
        - text: 只要节点有 `NoSchedule` 污点，任何高优先级 Pod 不用写容忍也能无视规则强行放进去
          why: 优先级抢占不能跳过未容忍的 `NoSchedule` 硬污点过滤规则，没有 Toleration 依然过不了过滤阶段
        - text: 打分阶段在过滤阶段之前运行，哪怕节点只剩 10Mi 内存，只要分高就能硬塞进需要 4Gi 的 Pod
          why: 过滤永远在打分之前：过不了硬资源与污点门槛的节点根本没有资格参与打分
        - text: "`Pod Topology Spread` 约束的作用是把同一服务所有 5 个副本强行全部堆进同一台物理机架里"
          why: 拓扑分布约束（Topology Spread Constraints）的目的正好相反：把副本按机架或独立故障域均匀打散，提升高可用
      explain: 调度主线很清晰：过滤筛硬条件（资源、污点容忍、亲和、拓扑）→ 打分挑最佳节点 → 无节点可用时高优先级才评估抢占低优先级。
