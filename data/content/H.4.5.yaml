skill: H.4.5
version: 2
authors: [main-agent]
brief:
  why: 自动化生产线、电梯、水处理厂和楼宇设备，大多由 PLC（可编程控制器）控制：它读入按钮和传感器的信号，按程序算出结果，驱动电机、阀门和指示灯。这一关从 PLC 的硬件和循环扫描讲起，学传感器和执行器怎样接线，用梯形图和 IEC 61131-3 的其他语言写启停、定时、计数和顺序控制，再学现场总线、HMI 和 SCADA，以及为什么急停和联锁不能只靠程序。假设你学过电路基础和数字逻辑（二进制、布尔代数、锁存器、有限状态机）。
  outcomes:
    - 说出 PLC 的组成和一个扫描周期的三个阶段，估算响应时间，判断短脉冲会不会被漏掉
    - 按信号类型给传感器和执行器选输入输出模块，画出 NPN、PNP 传感器的接线，换算 4–20 mA 模拟量
    - 用梯形图写出与、或、非逻辑和启保停电路，说明停止按钮为什么接常闭，用置位复位和内部继电器编程
    - 说出 IEC 61131-3 的五种语言，读懂简单的结构化文本和功能块
    - 用接通延时、断开延时、脉冲和保持型定时器以及计数器实现定时、计数和闪烁
    - 画出顺序功能图（步、转移、选择分支、并行分支），把它写成梯形图
    - 说出 Modbus RTU 帧的组成和常用功能码，比较现场总线和工业以太网，说明 HMI 和 SCADA 的分工
    - 用故障安全原则设计急停和互锁，说出调试和故障查找的步骤
terms:
  - term: PLC
    def: '可编程控制器：专为工业现场设计的计算机，循环读入输入信号、执行用户程序、刷新输出'
  - term: 继电器
    def: '用一个小电流线圈吸合触点、去接通或断开另一个电路的电磁开关'
  - term: 指令
    def: 'PLC（或处理器）能执行的一条基本操作，如读一个输入、与、置位一个输出；程序由一条条指令组成'
  - term: 存储器
    def: 'PLC 里保存程序和数据的部件；程序存在断电不丢失的存储器里，运行时的数据存在读写存储器里'
  - term: 字节
    def: '8 个二进制位组成的一组，是存储和传输数据的基本单位；16 位叫一个字'
  - term: 地址
    def: '标明一个输入、输出或存储单元位置的编号，如西门子的 I0.3（字节 0 的第 3 位）、三菱的 X3'
  - term: 输入映像
    def: 'PLC 每个扫描周期开始时把所有输入的状态一次读进来存放的存储区，程序执行时只读这里'
  - term: 循环扫描
    def: 'PLC 反复执行“读入输入、执行程序、刷新输出”三个阶段的工作方式，执行一遍的时间叫扫描周期'
  - term: 循环
    def: '反复执行同一段过程；PLC 一遍又一遍地执行输入采样、程序执行和输出刷新，叫循环扫描'
  - term: 响应时间
    def: '从输入信号变化到对应输出变化所经过的时间，最长约为输入滤波加两个扫描周期加输出延迟'
  - term: 扫描周期
    def: 'PLC 执行一遍输入采样、程序执行和输出刷新所用的时间，一般几毫秒到几十毫秒'
  - term: 中断
    def: '某个事件（如中断输入的边沿）发生时，PLC 立即暂停正在执行的程序去处理它，处理完再回来接着执行'
  - term: 接近开关
    def: '不接触物体就能检测到它是否靠近的传感器，有电感式（金属）、电容式（多数材料）和光电式'
  - term: 编码器
    def: '随轴转动输出脉冲的传感器，数脉冲就知道转过的角度和速度'
  - term: 变送器
    def: '把温度、压力、液位等物理量转换成标准电信号（如 4–20 mA）的仪表'
  - term: 模块
    def: 'PLC 里可以插拔的功能单元，如电源模块、CPU 模块、输入输出模块、通信模块'
  - term: 晶闸管
    def: '用门极信号触发导通、电流过零时自己关断的半导体开关，晶闸管输出只能接交流负荷'
  - term: 接触器
    def: '用线圈控制、能频繁接通和断开电动机等大电流负荷的电磁开关，带灭弧装置'
  - term: 电磁阀
    def: '线圈通电时打开或关闭气路、液路的阀门'
  - term: 光耦
    def: '光电耦合器：输入侧发光二极管的光让输出侧光敏晶体管导通，两侧之间没有电的连接，用来隔离'
  - term: NPN 型传感器
    def: '输出端是 NPN 晶体管的传感器，检测到物体时把信号线接通到 0 V，电流从信号线流进传感器'
  - term: PNP 型传感器
    def: '输出端是 PNP 晶体管的传感器，检测到物体时把信号线接通到 +24 V，电流从传感器流出到信号线'
  - term: 活零点
    def: '4–20 mA 信号把量程起点定为 4 mA 而不是 0 mA，电流为 0 就能判断线路断了'
  - term: 调试
    def: '把 PLC 连上设备，边运行边检查、修改，直到设备按要求工作的过程'
  - term: 梯形图
    def: '模仿继电器电路图画法的 PLC 编程语言：左右两条母线之间一行行由触点和线圈组成的梯级'
  - term: 常开触点
    def: '梯形图里对应位为 1 时接通的触点，画作 ┤ ├'
  - term: 常闭触点
    def: '梯形图里对应位为 0 时接通的触点，画作 ┤/├'
  - term: 线圈
    def: '梯形图里一行的输出：左边的触点通路接通时，把对应的输出位或内部位写成 1，否则写成 0'
  - term: 自锁
    def: '用输出自己的常开触点和启动触点并联，松开启动按钮后输出仍保持接通的接法'
  - term: 内部继电器
    def: 'PLC 存储器里不接外部端子的位，在程序里当中间变量使用，也叫辅助继电器或标志位'
  - term: 置位
    def: '把一个位写成 1 并保持，直到被复位为止的指令'
  - term: 复位
    def: '把一个位写成 0 并保持的指令；对定时器、计数器则是把当前值清零'
  - term: 赋值
    def: '把右边算出的值存进左边变量的语句，结构化文本里写作 :='
  - term: 变量
    def: '程序里有名字、可以存放和改变数值的存储单元，声明时给出类型和对应的地址，如 Start : BOOL'
  - term: 函数
    def: '没有内部状态的程序单元，同样的输入永远得到同样的输出，如加法、比较'
  - term: 功能块
    def: '带有内部状态的可重复使用的程序单元，如定时器、计数器，有输入、输出和自己的存储'
  - term: 结构化文本
    def: 'IEC 61131-3 里类似高级语言的文本编程语言，用赋值、IF、CASE 等语句写程序'
  - term: 接通延时定时器
    def: 'TON：输入接通满预设时间后输出才接通，输入一断开就清零'
  - term: 断开延时定时器
    def: 'TOF：输入接通时输出立即接通，输入断开后再过预设时间输出才断开'
  - term: 保持型定时器
    def: '输入断开时保留已计时间、再接通时接着累计的定时器，只能用复位指令清零'
  - term: 上升沿
    def: '信号从 0 变为 1 的那一刻；上升沿检测只在这一个扫描周期输出 1'
  - term: 顺序功能图
    def: 'SFC：用步、转移和动作描述工序先后的图形化编程语言，前一步活动且转移条件成立时进入下一步'
  - term: 步
    def: '顺序功能图里表示工序一个阶段的方框，活动时执行它的动作'
  - term: 转移
    def: '顺序功能图里两步之间的条件，前一步活动且条件成立时，前一步结束、后一步开始'
  - term: 分支
    def: '顺序功能图从一步分出几条路：选择分支只走条件成立的一条，并行分支几条同时进行'
  - term: 寄存器
    def: 'Modbus 设备里一个 16 位的数据单元，功能码 03、04 读，06、16 写；和数字电路里由触发器组成的寄存器不是一回事'
  - term: 保持寄存器
    def: 'Modbus 设备里可读可写的 16 位数据单元，用功能码 03 读、06 或 16 写'
  - term: 现场总线
    def: '把现场的传感器、执行器、远程 I/O 和控制器连起来的数字通信网络，如 PROFIBUS、Modbus'
  - term: HMI
    def: '人机界面：设备旁的触摸屏或操作面板，读写 PLC 的变量来显示状态、修改设定值、报警'
  - term: SCADA
    def: '数据采集与监视控制系统：集中监视和控制地域分散的站点，含 RTU、通信网、主站和历史数据库'
  - term: RTU
    def: '远程终端单元：装在远方站点、采集数据并执行本地控制、经通信网和 SCADA 主站交换数据的装置'
  - term: 故障安全
    def: '任何元件损坏或导线断开时，系统都进入安全状态的设计原则，如停止按钮接常闭、断电即制动'
lessons:
  # ==== PLC硬件结构与扫描周期 ====
  - id: what-is-plc
    chapter: PLC硬件结构与扫描周期
    title: 从继电器柜到 PLC
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一条生产线原来用几百个继电器接线实现控制。现在要改一改工作顺序。用继电器柜和用 PLC，各要做什么？
          options:
            - text: 继电器柜要重新接线，PLC 只要改程序
              correct: true
            - text: 两者都只要改程序
              why: 继电器柜的逻辑就是导线的连接方式，没有程序可改
            - text: 两者都要重新接线
              why: PLC 的输入输出接线不变，控制逻辑在程序里
          explain: 继电器控制的逻辑由导线决定，改动就要拆线重接；PLC 的逻辑写在程序里，改顺序只要改程序。这正是 PLC 被发明出来的原因。
      - card:
          title: 继电器控制
          body: |
            **继电器（relay）**是一个电磁开关：线圈通电，吸合触点，接通或断开另一个电路。平时断开、吸合后接通的触点叫常开触点，平时接通、吸合后断开的叫常闭触点。把很多继电器的触点串联、并联起来，就能实现与、或、非逻辑，过去机床和生产线都这样控制。

            继电器控制的缺点：逻辑全在接线里，修改要拆线重接；继电器多了体积大、触点会磨损，故障难查。1968 年美国通用汽车公司提出用一种可以编程的电子装置代替继电器柜，第二年就有了第一批可编程控制器。
      - item:
          id: relay-logic
          type: choice
          prompt: 两个按钮的常开触点串联后接一个继电器线圈，线圈什么时候通电？
          options:
            - text: 两个按钮都按下时
              correct: true
            - text: 任意一个按钮按下时
              why: 那是两个触点并联的情况；串联要两个都闭合电流才能通过
            - text: 两个按钮都松开时
              why: 常开触点松开时是断开的，电流过不去
            - text: 按下任意一个按钮后，线圈就一直保持通电
              why: 串联的常开触点没有保持作用，松开按钮就断电；而且要两个都按下才接通
          explain: 触点串联是“与”，并联是“或”，和数字逻辑里的门电路一样。
      - card:
          title: PLC
          body: |
            **PLC（programmable logic controller，可编程控制器）**是专门为工业现场设计的计算机：能在电磁干扰、振动、宽温度范围下长期可靠工作，输入输出端子可以直接接按钮、传感器、接触器（用小电流线圈控制电动机大电流的开关）和阀门，编程语言沿用电工熟悉的继电器电路图。

            它的工作很简单：反复读入所有输入，按程序算出每个输出该是 0 还是 1，再把结果送到输出端子。改控制逻辑只需改程序，接线不动。
      - item:
          id: plc-advantage
          type: choice
          prompt: 和普通台式电脑相比，PLC 最主要的特点是什么？
          options:
            - text: 抗干扰、耐恶劣环境，能直接接现场设备
              correct: true
            - text: 运算速度比台式电脑快得多，能跑大型软件
              why: PLC 的运算能力一般比台式电脑弱，它的长处是可靠和接口
            - text: 不需要编程，接上线就能用
              why: PLC 正是靠用户编写的程序工作的
            - text: 只能处理模拟信号
              why: PLC 主要处理开关量，加上专门的扩展单元也能处理模拟量
          explain: PLC 为工业现场而设计：电源和输入输出都经过隔离和滤波，能连续运行多年，端子能直接接 24 V 传感器和 220 V 接触器线圈。
      - card:
          title: PLC 的两种结构
          body: |
            小型 PLC 常做成整体式：电源、CPU 和几十个输入输出点装在一个外壳里，价格低，适合单台设备。中大型 PLC 由一个个可以插拔的功能单元拼成，每个单元叫一个**模块（module）**，这种 PLC 叫模块式：在导轨或机架上依次插电源模块、CPU 模块、各种输入输出模块和通信模块，按需要增减，点数可以到几千。

            再大的系统还可以把输入输出模块放到远处的现场机柜里，经网络连回 CPU，叫分布式 I/O；多台 PLC 之间也可以联网，组成整个工厂的控制系统。
      - item:
          id: plc-sizing
          type: number
          prompt: 一台设备有 18 个按钮和传感器信号要读入、9 个接触器和指示灯要驱动。选 PLC 时一般要留约 20% 的余量备用。输入点至少要有多少个？（向上取整）
          answer: 22
          hint: 余量按现有点数的百分之几算？算出来不是整数时怎么办？
          explain: $18 \times 1.2 = 21.6$，向上取整为 22 个输入点；输出 $9 \times 1.2 = 10.8$，取 11 个。实际会选 24 入 16 出这样的标准规格。

  - id: plc-hardware
    chapter: PLC硬件结构与扫描周期
    title: PLC 的硬件和存储区
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: PLC 断电以后再上电，用户写的程序还在吗？
          options:
            - text: 在，程序存在断电不丢失的存储器里
              correct: true
            - text: 不在，每次上电都要重新下载
              why: 那样工厂每次停电后都无法自动恢复；程序存在断电不丢失的存储器里
            - text: 只有装了电池的才在
              why: 现在的 PLC 用闪存保存程序，不靠电池；电池或电容常用来保存一部分运行数据
          explain: 程序保存在断电不丢失的存储器里，上电就能运行。运行中的数据大多在普通的读写存储器里，需要断电保持的那部分另作设置。
      - card:
          title: PLC 的组成
          body: |
            一台 PLC 由五部分组成：

            - 电源：把 220 V 交流变成内部用的直流，常常还给传感器提供 24 V；
            - CPU：执行程序的处理器，一条条执行用户程序里的**指令（instruction）**，如“读输入 I0.0”“与”“写输出 Q0.1”；
            - **存储器（memory）**：程序存在断电不丢失的存储器里，运行时的数据存在读写存储器里；
            - 输入输出模块：把现场的信号变成 CPU 能读的电平，把 CPU 的结果变成能驱动负荷的电压电流；
            - 通信接口：连编程电脑、触摸屏和其他设备。
      - item:
          id: module-role
          type: match
          prompt: 把 PLC 的部件和它的作用配对。
          pairs:
            - [CPU, 一条条执行用户程序]
            - [输入模块, 把按钮和传感器的信号变成内部电平]
            - [输出模块, 驱动接触器线圈和指示灯]
            - [电源模块, 给 CPU 和模块供直流电]
          explain: 信号从输入模块进来，CPU 按程序处理，结果从输出模块出去；电源给它们供电，通信接口负责和外部交换数据。
      - card:
          title: 位、字节和字
          body: |
            PLC 存储器里最小的单位是位（bit），存一个 0 或 1，对应一个开关的状态。8 位组成一个**字节（byte）**，16 位组成一个字（word），32 位叫双字。一个开关量输入占一位，一个模拟量（比如温度）常占一个字，范围是 $0$ 到 $2^{16} - 1$（无符号）或 $-32768$ 到 $32767$（有符号）。
      - item:
          id: bits-in-byte
          type: number
          prompt: 一个字节的 8 位里，第 0、1、3 位为 1，其余为 0。把它当作无符号二进制数，值是多少？
          answer: 11
          hint: 第 $n$ 位为 1 贡献多少？
          explain: $2^0 + 2^1 + 2^3 = 1 + 2 + 8 = 11$。PLC 常把 8 个输入当作一个字节一起读写。
      - card:
          title: 存储区和地址
          body: |
            PLC 的存储器分成几个区：输入区（I）、输出区（Q）、内部位（M）、定时器（T）、计数器（C）和数据区。每个位置用一个**地址（address）**表示。西门子写作“区 + 字节号 . 位号”：I0.3 是输入区字节 0 的第 3 位，Q1.0 是输出区字节 1 的第 0 位，IW64 是从字节 64 开始的一个输入字（模拟量常在这里）。IEC 61131-3 的写法是 %IX0.3、%QX1.0。三菱 FX 系列的输入叫 X、输出叫 Y，按八进制编号：X0–X7 之后是 X10。
      - item:
          id: siemens-address
          type: number
          prompt: 西门子 PLC 的输入地址从 I0.0 开始，每个字节 8 位依次编号。I1.3 是第几个输入？（I0.0 算第 0 个）
          answer: 11
          hint: 字节 1 之前已经有多少位？
          explain: 字节 0 有 8 位（第 0–7 个），I1.0 是第 8 个，I1.3 是第 11 个。
      - item:
          id: fx-address
          type: number
          prompt: 三菱 FX 系列的输入 X 按八进制编号：X0、X1……X7、X10、X11……。X12 是第几个输入？（X0 算第 0 个）
          answer: 10
          hint: X7 的下一个编号是什么？八进制里每一位满几进一？
          explain: 八进制 $12 = 1 \times 8 + 2 = 10$，所以 X12 是第 10 个输入，也就是第 11 个端子。没有 X8、X9。

  - id: scan-cycle
    chapter: PLC硬件结构与扫描周期
    title: 循环扫描
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: PLC 正在执行程序的中间，一个按钮被按下了。程序后半部分读到的是按下以后的状态吗？
          options:
            - text: 不是，这一遍读到的仍是开头采样到的状态
              correct: true
            - text: 是，程序随时读取端子的真实状态
              why: PLC 在每遍开头把所有输入一次读进来，执行程序时只读这份副本
            - text: 程序会立即停下来处理按钮
              why: 只有专门设置的特殊输入才会这样，普通输入要等下一遍扫描
          explain: 普通输入在每个扫描周期开始时统一读入，这一遍里不再变化。下一遍才看到按钮按下。
      - card:
          title: 循环扫描的三个阶段
          body: |
            PLC 上电进入运行后，反复执行三个阶段：

            1. 输入采样：把所有输入端子的状态一次读进**输入映像（input image）**；
            2. 程序执行：从第一条指令执行到最后一条，读写的都是映像区和内部存储区；
            3. 输出刷新：把程序写好的输出结果（输出映像）一次写到输出端子。

            接着处理通信和自诊断，再从第 1 步开始。这种工作方式叫**循环扫描（cyclic scan）**，执行一遍的时间叫**扫描周期（scan time）**，一般几毫秒到几十毫秒，程序越长越慢。
      - item:
          id: scan-order
          type: order
          prompt: 把 PLC 一个扫描周期里的阶段按先后排好（从输入采样开始）。
          steps:
            - 把所有输入状态读进输入映像
            - 从头到尾执行一遍用户程序
            - 把输出映像写到输出端子
            - 处理通信和自诊断
          explain: 先采样、再执行、后刷新，三步之后是通信和自诊断，然后开始下一个周期。统一采样和刷新让一遍程序里的输入不会中途变化。
      - card:
          title: 响应时间
          body: |
            输入变化以后多久输出才变化，叫**响应时间（response time）**。最坏的情况：输入刚好在采样之后变化，要等下一个周期才被读到，再执行完程序、到周期末尾才刷新输出。所以响应时间最长约为

            $$t = t_{滤波} + 2T_{scan} + t_{输出}$$

            $t_{滤波}$ 是输入模块为了滤掉抖动而加的延迟（常为几毫秒），$t_{输出}$ 是输出元件的动作时间（继电器输出约 10 ms，晶体管输出不到 1 ms）。
      - item:
          id: response-time
          type: number
          prompt: 一台 PLC 的扫描周期 10 ms，输入滤波延迟 3 ms，晶体管输出的延迟 1 ms。从输入变化到输出变化，最长约要多少毫秒？
          answer: 24
          unit: ms
          hint: 最坏情况下要经过几个扫描周期？
          explain: $3 + 2 \times 10 + 1 = 24$ ms。最好的情况是输入刚好在采样前变化，约一个周期多一点。
      - card:
          title: 短脉冲会被漏掉
          body: |
            输入只在每个周期开头采样一次。一个比扫描周期还短的脉冲，可能整个落在两次采样之间，程序根本看不到它。比如扫描周期 10 ms，一个只持续 5 ms 的脉冲：两次采样相隔 10 ms，脉冲出现的时刻是随机的，它覆盖到某次采样的机会只有 5/10。

            解决办法：把信号接到**中断（interrupt）**输入，脉冲一来就立即暂停主程序去执行处理它的程序段；或者用高速计数器（由硬件直接数输入脉冲、不受扫描周期限制的专用功能）数脉冲，编码器常这样接；也可以缩短扫描周期。
      - item:
          id: missed-pulse
          type: number
          prompt: 一台 PLC 扫描周期 20 ms，每个周期开头采样一次输入。一个 8 ms 长的脉冲在随机时刻出现，它被采样到的概率约是多少？（填小数）
          answer: 0.4
          hint: 脉冲出现的时刻是随机的。在两次采样之间的一段间隔里，脉冲从什么时候开始才能盖住下一个采样点？
          explain: 采样间隔 20 ms，脉冲 8 ms，只有它在下一个采样点之前 8 ms 以内开始才会盖住采样点，概率 $8/20 = 0.4$。脉冲长于扫描周期时，无论落在哪里都必然包含一个采样点。
      - item:
          id: fast-encoder
          type: choice
          prompt: 一个编码器每秒发出 5000 个脉冲，PLC 扫描周期 10 ms。怎样才能一个不漏地数这些脉冲？
          options:
            - text: 接到 PLC 的高速计数器输入
              correct: true
            - text: 接普通输入，程序每扫描一次检查一下、变化了就加 1
              why: 每个周期最多看到一次变化，而 10 ms 里有 50 个脉冲，绝大多数会被漏掉
            - text: 把程序写得短一些，扫描周期就够快了
              why: 脉冲间隔只有 0.2 ms，再短的扫描周期也很难稳定做到
            - text: 加大输入滤波时间，让脉冲变宽
              why: 滤波会把这么窄的脉冲直接滤掉
          explain: 高速计数器由硬件直接计数，不受扫描周期限制，程序只需定时读它的计数值。

  # ==== 传感器与执行器接线 ====
  - id: input-devices
    chapter: 传感器与执行器接线
    title: 输入设备
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 传送带上要检测经过的塑料瓶，不能碰到瓶子。用哪种传感器合适？
          options:
            - text: 光电开关
              correct: true
            - text: 机械限位开关
              why: 限位开关要被物体压下才动作，会碰到瓶子
            - text: 电感式接近开关
              why: 电感式只对金属敏感，检测不到塑料
          explain: 光电开关靠物体挡住或反射光束来检测，对材料没有要求，距离也可以较远。
      - card:
          title: 开关类输入
          body: |
            开关量输入只有通、断两种状态：

            - 按钮、选择开关：人操作，按钮分常开（按下接通）和常闭（按下断开）；
            - 限位开关：被运动部件压下时动作，用来检测行程的终点；
            - **接近开关（proximity sensor）**：不接触就能检测物体，电感式只对金属、检测距离几毫米，电容式对大多数材料（包括液体、颗粒），光电式靠光束、距离可达几米；
            - 液位开关、压力开关：到达设定值时动作。
      - item:
          id: sensor-match
          type: match
          prompt: 把每个检测任务和最合适的传感器配对。
          pairs:
            - [检测钢制工件是否到位, 电感式接近开关]
            - [检测料仓里的塑料颗粒是否装满, 电容式接近开关]
            - [检测门是否完全关好（允许接触）, 机械限位开关]
            - [检测远处纸箱是否挡住通道, 光电开关]
          explain: 电感式对金属，电容式对多数材料，限位开关靠机械接触，光电开关距离最远。
      - card:
          title: 测量类输入
          body: |
            - **编码器（encoder）**：随轴转动输出脉冲，增量式每转输出固定数目的脉冲（如 1000 个），数脉冲就知道转角和转速；
            - 温度传感器：热电偶（两种金属结点产生毫伏级电压）和热电阻（如 Pt100，0 °C 时 100 Ω，温度升高电阻增大）；
            - **变送器（transmitter）**：把压力、液位、流量、温度等转换成 4–20 mA 或 0–10 V 的标准信号，送到 PLC 的模拟量输入模块。
      - item:
          id: encoder-angle
          type: number
          prompt: 一个增量式编码器每转输出 1000 个脉冲，PLC 的高速计数器数到了 2750 个。轴转过了多少度？
          answer: 990
          unit: °
          hint: 每个脉冲对应多少度？
          explain: 每个脉冲 $360°/1000 = 0.36°$，$2750 \times 0.36° = 990°$，即两圈又 270°。
      - card:
          title: 应用举例
          body: |
            一台自动钻床：工件由光电开关检测是否放好，夹紧气缸的两端各有一个磁性开关检测是否夹到位，钻头的上下限位由限位开关检测，主轴转速由编码器测量，操作台上有启动、停止和急停按钮（急停拍下后自锁，直接切断动力，不经过程序）。PLC 读入这些信号，按顺序驱动夹紧阀、主轴电机和进给电机。

            选择输入设备时先问：检测什么材料、多远、要不要接触、是开关量还是连续量、需要多快。
      - item:
          id: pt100
          type: number
          prompt: Pt100 热电阻 0 °C 时 100 Ω，在 0–100 °C 范围内电阻近似按每摄氏度 0.385 Ω 增大。测得电阻 119.25 Ω，温度约是多少摄氏度？
          answer: 50
          unit: °C
          hint: 比 0 °C 时多了多少欧？
          explain: $(119.25 - 100)/0.385 = 50$ °C。

  - id: output-devices
    chapter: 传感器与执行器接线
    title: 输出设备和输出模块
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: PLC 的输出端子能不能直接接一台 15 kW 三相电动机？
          options:
            - text: 不能，要经接触器控制
              correct: true
            - text: 能，输出端子可以接任何负荷
              why: 输出端子一般只能通过零点几安到两安的电流，电动机的电流大得多
            - text: 能，只要电压对得上
              why: 电压对得上，电流也远超输出端子的能力
          explain: PLC 的输出去驱动接触器的线圈，接触器的主触点再接通电动机的大电流。
      - card:
          title: 执行器
          body: |
            - **接触器（contactor）**：大功率的电磁开关，线圈只需几瓦，主触点能频繁接通断开几十到几百安的电动机电流，带灭弧装置；
            - **电磁阀（solenoid valve）**：线圈通电时开关气路或液路，驱动气缸、液压缸；
            - 指示灯、蜂鸣器；
            - 变频器：接收 PLC 的启停开关信号和速度给定（模拟量或网络），调节电动机的转速；
            - 步进和伺服驱动器：接收脉冲或网络指令，控制位置。
      - item:
          id: actuator-choice
          type: choice
          prompt: 要让 PLC 控制一个气缸伸出和缩回，PLC 的输出应该接什么？
          options:
            - text: 电磁阀的线圈
              correct: true
            - text: 直接接气缸
              why: 气缸靠压缩空气推动，PLC 的电信号要先经电磁阀控制气路
            - text: 接触器的主触点
              why: 主触点接的是负荷的大电流回路，PLC 输出接的是线圈
            - text: 输出模块的公共端
              why: 公共端是输出回路的返回线，执行器要接在输出点和电源之间，PLC 控制的是电磁阀线圈
          explain: 电磁阀线圈通电，阀芯切换气路，压缩空气推动气缸。
      - card:
          title: 三种输出模块
          body: |
            - 继电器输出：内部是小继电器的触点，交流直流都能接，每点约 2 A，但动作慢（约 10 ms）、触点有寿命，不适合频繁开关；
            - 晶体管输出：只能接直流（常为 24 V），每点约 0.5 A，动作快、寿命长，可以输出高频脉冲给步进驱动器；
            - 晶闸管输出：**晶闸管（thyristor）**是门极触发导通、电流过零时自己关断的半导体开关，所以只能接交流，无触点，适合频繁开关的交流负荷。

            输出驱动线圈这类电感负荷时，断开瞬间线圈会产生很高的反向电压，直流负荷要并联续流二极管，交流负荷要并联阻容吸收电路。
      - item:
          id: output-module-choice
          type: match
          prompt: 把每种负荷和最合适的输出模块配对。
          pairs:
            - [给步进驱动器发 20 kHz 脉冲, 晶体管输出]
            - [偶尔动作的 220 V 交流接触器线圈和 24 V 直流指示灯混用, 继电器输出]
            - [每秒开关几次的 220 V 交流电磁阀, 晶闸管输出]
          explain: 高频脉冲只有晶体管输出跟得上；交流直流混用、动作不频繁时继电器输出最灵活；交流负荷频繁开关时晶闸管输出没有触点磨损。
      - item:
          id: relay-life
          type: number
          prompt: 一个继电器输出点的触点寿命按 100 万次计。如果它每 2 秒动作一次、每天连续运行 24 小时，大约多少天就会到寿命？（保留到个位）
          answer: 23
          tolerance: 0.5
          unit: 天
          hint: 每天动作多少次？
          explain: 每天 $86400/2 = 43200$ 次，$10^6/43200 \approx 23$ 天。频繁开关的负荷要用晶体管或晶闸管输出。

  - id: io-wiring
    chapter: 传感器与执行器接线
    title: 直流输入的接线
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个 24 V 直流输入点要“看到”信号，需要什么条件？
          options:
            - text: 有电流流过这个输入点的内部电路
              correct: true
            - text: 只要输入端子上有 24 V 电压
              why: 输入电路里是一个发光二极管，没有电流流过就不会发光，CPU 也就读不到
            - text: 输入端子接地
              why: 接地不一定形成电流回路，要看公共端接在哪里
          explain: 输入点内部是光耦的发光二极管加限流电阻，只有电流流过回路时它才发光，输入才读作 1。所以接线要形成一个完整的电流回路。
      - card:
          title: 输入回路和光耦隔离
          body: |
            直流输入模块里每个输入点是一个电阻和一个**光耦（optocoupler）**的发光二极管串联，所有输入点的另一端接在一起，叫公共端（COM）。开关闭合，电流从 24 V 电源经开关、输入点、公共端回到电源，发光二极管发光，光敏晶体管导通，CPU 读到 1。

            光耦让现场的 24 V 回路和 PLC 内部的电路之间没有导线相连，现场的干扰和高电压进不去。模块里还有几毫秒的滤波，滤掉触点抖动。
      - item:
          id: input-current
          type: number
          prompt: 一个 24 V 直流输入点内部等效为 4.7 kΩ 电阻和一个压降 1.2 V 的发光二极管串联。开关闭合时输入电流约是多少毫安？（保留一位小数）
          answer: 4.9
          tolerance: 0.1
          unit: mA
          hint: 电阻上的电压是多少？
          explain: $(24 - 1.2)/4700 \approx 4.85$ mA，约 4.9 mA。这就是数据手册里常写的“输入电流约 5 mA”。
      - card:
          title: NPN 和 PNP 传感器
          body: |
            三线制的电子传感器（接近开关、光电开关）有棕（+24 V）、蓝（0 V）、黑（信号）三根线，输出端是一个晶体管：

            - **NPN 型传感器（NPN sensor）**：检测到物体时把信号线接通到 0 V，电流从信号线流进传感器；
            - **PNP 型传感器（PNP sensor）**：检测到物体时把信号线接通到 +24 V，电流从传感器流出到信号线。
      - card:
          title: 公共端接哪里
          body: |
            输入回路必须让电流流过输入点。接 NPN 传感器时，电流要从 +24 V 经输入点流进传感器再到 0 V，所以输入模块的公共端接 +24 V；接 PNP 传感器时，电流从传感器流出、经输入点到公共端，公共端接 0 V。

            “漏型”和“源型”这两个叫法，各厂商的定义正好相反：三菱把接 NPN 传感器的叫漏型输入，西门子把接 PNP 传感器的叫漏型输入。接线时以模块的接线图和电流方向为准，不要只看名称。
      - item:
          id: npn-common
          type: choice
          prompt: 一个 NPN 型接近开关接到 PLC 的直流输入上，输入模块的公共端应接电源的哪一端？
          options:
            - text: +24 V
              correct: true
            - text: 0 V
              why: NPN 传感器导通时把信号线拉到 0 V，公共端也接 0 V 的话输入点两端没有电压，没有电流
            - text: 哪一端都可以
              why: 公共端决定电流方向，接错了输入点两端没有电压差，永远读不到信号
            - text: 大地
              why: 大地不是 24 V 电源回路的一部分，接上也形成不了电流回路
          explain: 电流从 +24 V 经公共端、输入点内部的光耦流到信号线，再经传感器内部导通的晶体管到 0 V。
      - item:
          id: pnp-path
          type: order
          prompt: PNP 型传感器检测到物体时，输入电流依次流过哪些地方？（从电源正极开始）
          steps:
            - 24 V 电源的正极
            - 传感器内部导通的 PNP 晶体管
            - 信号线和 PLC 的输入端子
            - 输入点内部的电阻和光耦
            - 接 0 V 的公共端
          explain: PNP 传感器把 +24 V 送到信号线，电流流进输入点，经公共端回到 0 V。所以接 PNP 传感器时公共端接 0 V。

  - id: analog-signals
    chapter: 传感器与执行器接线
    title: 模拟量信号
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 工业上的压力变送器常用 4–20 mA 电流表示 0–100% 量程，而不是 0–20 mA。最主要的好处是什么？
          options:
            - text: 电流为 0 就能判断线断了
              correct: true
            - text: 4 mA 比 0 mA 更省电
              why: 4 mA 反而一直在耗电；起点不为 0 是为了诊断和给变送器供电
            - text: 计算更简单
              why: 有偏置的 4 mA 让换算多了一步
          explain: 正常信号最小也是 4 mA，读到 0 mA 就知道线路断了。4 mA 的电流还能给两线制变送器自己供电。
      - card:
          title: 4–20 mA 电流信号
          body: |
            变送器把压力、液位、温度变成 4–20 mA 的电流：4 mA 对应量程起点，20 mA 对应终点。用电流而不用电压，是因为电流在一个串联回路里处处相等，导线电阻和几百米的距离不影响读数。

            量程起点放在 4 mA 叫**活零点（live zero）**：正常时电流不会低于 4 mA，读到明显低于 4 mA（常以 3.6 mA 为界）就判断是断线或变送器故障。两线制变送器只有两根线，靠回路里这至少 4 mA 的电流给自己供电。
      - item:
          id: ma-to-value
          type: number
          prompt: 一个压力变送器的量程是 0–10 bar，输出 4–20 mA。PLC 读到 15.2 mA，压力是多少 bar？
          answer: 7
          unit: bar
          hint: 15.2 mA 比 4 mA 多了多少？占 16 mA 的几分之几？
          explain: $(15.2 - 4)/16 \times 10 = 7$ bar。
      - card:
          title: 模数转换和量程换算
          body: |
            模拟量输入模块用 ADC 把电流或电压变成一个整数。西门子 S7 系列把 4–20 mA 的标称范围对应到 0–27648：4 mA 读作 0，20 mA 读作 27648，读数为 0 时工程量是量程起点，不是 0；其他厂商常用 0–4000、0–8000 或 0–16000 等。程序要把这个整数换成工程量：

            $$\text{工程量} = \text{下限} + \frac{\text{读数} - \text{读数下限}}{\text{读数上限} - \text{读数下限}} \times (\text{上限} - \text{下限})$$

            分辨率由 ADC 的位数决定，12 位 ADC 把满量程分成 4096 份。
      - card:
          title: 例题：把读数换成液位
          body: 液位变送器量程 0–5 m，输出 4–20 mA，接西门子模拟量输入，读数范围 0–27648。PLC 读到 19354，液位是多少？
          reveal:
            - title: 第 1 步：算读数占满量程的比例
              body: $19354/27648 \approx 0.700$。
            - title: 第 2 步：乘上工程量的量程
              body: $0 + 0.700 \times (5 - 0) \approx 3.50$ m。
            - title: 第 3 步：顺便核对电流
              body: 0.700 对应 $4 + 0.700 \times 16 = 15.2$ mA。读数 0 对应 4 mA，不是 0 mA。
      - item:
          id: raw-to-value
          type: number
          prompt: 一个温度变送器量程 −50 到 150 °C，输出 4–20 mA，接西门子模拟量输入（4–20 mA 对应读数 0–27648）。读数是 20736，温度是多少摄氏度？
          answer: 100
          unit: °C
          hint: 读数占满量程的几分之几？温度的量程有多宽？
          explain: $20736/27648 = 0.75$，$-50 + 0.75 \times 200 = 100$ °C。
      - item:
          id: adc-resolution
          type: number
          prompt: 一个 0–10 V 的模拟量输入模块用 12 位 ADC。它能分辨的最小电压变化约是多少毫伏？（保留两位小数）
          answer: 2.44
          tolerance: 0.005
          unit: mV
          hint: 12 位能分成多少份？
          explain: $10\ \text{V}/4096 \approx 2.44$ mV。

  # ==== 梯形图与IEC 61131-3语言 ====
  - id: ladder-basics
    chapter: 梯形图与IEC 61131-3语言
    title: 梯形图的基本逻辑
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 梯形图模仿的是哪种图？
          options:
            - text: 继电器控制电路图
              correct: true
            - text: 程序流程图
              why: 流程图画的是执行顺序；梯形图画的是触点和线圈怎样连接
            - text: 数字电路的门电路图
              why: 梯形图里没有门符号，用的是触点的串联和并联
          explain: 梯形图让熟悉继电器电路的电工也能编程：串联触点是与，并联是或，最右边是线圈。
      - card:
          title: 梯形图
          body: |
            **梯形图（ladder diagram）**画在左右两条竖线（母线）之间，每一横行叫一个梯级。左边是条件，用触点表示；右边是结果，用线圈表示：

            - **常开触点（normally open contact）**┤ ├：对应的位为 1 时接通；
            - **常闭触点（normally closed contact）**┤/├：对应的位为 0 时接通；
            - **线圈（coil）**（ ）：左边有一条接通的通路时，把对应的位写成 1，否则写成 0。

            PLC 从上到下、从左到右逐个梯级求值，这只是程序的写法，并没有真正的电流在流。
      - card:
          title: 与、或、非
          body: |
            触点串联是与，并联是或，常闭触点是非：

            ```text
            |  I0.0    I0.1             Q0.0  |
            |---| |-----| |-------------( )---|     Q0.0 = I0.0 · I0.1
            |                                 |
            |  I0.2             Q0.1          |
            |---| |----+--------( )-----------|     Q0.1 = I0.2 + I0.3
            |  I0.3    |                      |
            |---| |----+                      |
            |                                 |
            |  I0.4             Q0.2          |
            |---|/|-------------( )-----------|     Q0.2 = I0.4′
            ```

            图里两个 + 之间是一条竖线，表示并联。复杂的逻辑式可以直接画成串并联：$Q = (A + B)\cdot C'$ 就是 A、B 并联后再串一个 C 的常闭触点。
      - item:
          id: rung-eval
          type: choice
          prompt: 一个梯级是“A 的常开触点和 B 的常开触点并联，再串联 C 的常闭触点”，驱动线圈 Q。A = 0、B = 1、C = 0 时，Q 是多少？
          options:
            - text: 1，B 接通了并联支路，C 的常闭触点也接通
              correct: true
            - text: 0，A 为 0，通路断了
              why: A、B 是并联的，B 为 1 就能接通这一段
            - text: 0，C 为 0 时它的触点断开
              why: 常闭触点在位为 0 时接通，为 1 时才断开
          explain: $Q = (A + B)\cdot C' = (0 + 1)\cdot1 = 1$。
      - item:
          id: xor-rung
          type: choice
          prompt: 要用梯形图实现异或 $Q = A \oplus B$（只有一个为 1 时输出 1），下面哪种接法对？
          options:
            - text: A 常开串 B 常闭，与 A 常闭串 B 常开，两路并联
              correct: true
            - text: A 常开和 B 常开并联
              why: 这是或，A、B 都为 1 时也输出 1
            - text: A 常开串 B 常开
              why: 这是与，只有两个都为 1 时才输出 1
            - text: A 常闭和 B 常闭并联
              why: 这是 $A' + B'$（与非），A、B 都为 0 时也输出 1
          explain: $A \oplus B = AB' + A'B$：两条串联支路并联。
      - card:
          title: 编写和下载程序
          body: |
            梯形图在电脑上的编程软件里画（三菱用 GX Works，西门子用 TIA Portal，许多厂商的软件基于 CODESYS），软件把它编成 PLC 能执行的代码，经网线或 USB 下载到 PLC。

            程序可以离线编写，也可以连上 PLC 在线监视：每个触点和线圈的通断用颜色实时显示。连上设备边运行边检查、修改的过程叫**调试（commissioning）**，在线监视让调试非常直观。运行中修改程序要格外小心，因为改动会立刻影响正在运转的设备。
      - item:
          id: rung-truth
          type: number
          prompt: 一个梯级实现 $Q = (A + B)\cdot C'$，A、B、C 各取 0 或 1，一共 8 种组合。其中有几种组合让 Q = 1？
          answer: 3
          hint: 先固定 C 的取值，再列出 A、B 的四种组合。
          explain: C 必须为 0；A、B 的四种组合里有 3 种让 $A + B = 1$（只有 A = B = 0 不行），所以共 3 种。

  - id: latching
    chapter: 梯形图与IEC 61131-3语言
    title: 启保停、内部继电器和置位复位
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 按一下启动按钮（松手后按钮弹回），电动机要一直转，直到按停止按钮。只用一个启动按钮的常开触点驱动输出，能做到吗？
          options:
            - text: 不能，松手后输出就断了，要加自锁
              correct: true
            - text: 能，输出被写成 1 后会一直保持
              why: 线圈每个扫描周期都按当前条件重新写，条件没了就写成 0
            - text: 能，只要把扫描周期调长
              why: 扫描周期再长，松手以后的那一遍也会把输出写成 0
          explain: 普通线圈每个周期都重新计算。要让输出在松开按钮后保持，就要用输出自己的触点把它“锁住”。
      - card:
          title: 启保停电路
          body: |
            启动按钮 START 和输出 MOTOR 自己的常开触点并联，再串联停止按钮 STOP：

            ```text
            |  START     STOP      MOTOR  |
            |---| |---+---| |------( )----|
            |  MOTOR  |                   |
            |---| |---+                   |
            ```

            按下 START，MOTOR 变为 1；下一个周期起，MOTOR 自己的触点代替 START 维持通路，这叫**自锁（seal-in）**。按下 STOP，通路断开，MOTOR 变为 0，自锁也随之解除。逻辑式是 $M = (S + M)\cdot P$，$P$ 是停止输入的状态。
      - card:
          title: 停止按钮为什么接常闭
          body: |
            启保停的梯级里 STOP 只画一个常开触点，因为现场的停止按钮接的是常闭触点：平时按钮闭合，输入为 1，常开触点接通；按下按钮，输入变为 0，通路断开。

            这样接是为了故障安全：如果停止按钮的导线断了，输入也变成 0，电动机会停下，而不是再也停不住。梯形图里的常开、常闭说的是对输入位的判断，和现场按钮的机械结构是两回事。
      - item:
          id: stop-wiring
          type: choice
          prompt: 现场的停止按钮接常闭触点，接到输入 I0.1。在启保停梯形图里，I0.1 应该画成什么触点？
          options:
            - text: 常开触点
              correct: true
            - text: 常闭触点，和现场的按钮一致
              why: 平时 I0.1 为 1，画成常闭触点就一直断开，电动机根本启动不了
            - text: 画成常开触点，同时把现场按钮也改接常开
              why: 现场接常开时，导线一断按停止就没有反应，失去了故障安全
            - text: 常开或常闭都可以
              why: 两种画法的逻辑相反，只有一种能在平时接通、按下时断开
          explain: 平时 I0.1 = 1，常开触点接通；按下按钮 I0.1 = 0，常开触点断开，电动机停。
      - item:
          id: latch-sequence
          type: number
          prompt: 启保停电路 $M = (S + M)\cdot P$（S 是启动输入，P 是停止输入，停止按钮接常闭，平时 P = 1）。开始时 M = 0，依次经过四个扫描周期：(S, P) = (1, 1)、(0, 1)、(0, 0)、(0, 1)。第四个周期结束后 M 是多少？
          answer: 0
          hint: 每个周期用上一周期的 M 和本周期的 S、P 算新的 M。
          explain: 第 1 周期 $M = (1 + 0)\cdot1 = 1$；第 2 周期 $(0 + 1)\cdot1 = 1$；第 3 周期按下停止 $(0 + 1)\cdot0 = 0$；第 4 周期 $(0 + 0)\cdot1 = 0$。松开停止按钮后电动机不会自己重新启动。
      - card:
          title: 内部继电器和多个输出
          body: |
            **内部继电器（internal relay）**是存储器里不接外部端子的位（三菱叫 M，西门子叫 M 位存储器），在程序里存放中间结果：把一个复杂条件的中间结果先存到一个内部继电器里，再在多处使用它的触点。

            一个梯级的右边可以并联几个线圈，同时输出到几处。但同一个输出线圈不要在两个梯级里都写：后面的梯级会覆盖前面的结果，叫双线圈问题。
      - item:
          id: double-coil
          type: choice
          prompt: 一个程序里，第 3 个梯级根据条件 A 写 Q0.0，第 10 个梯级又根据条件 B 写 Q0.0。A = 1、B = 0 时，输出端子 Q0.0 是什么状态？
          options:
            - text: 0，后面的梯级覆盖了前面
              correct: true
            - text: 1，因为 A = 1
              why: 第 3 个梯级写的 1 在第 10 个梯级又被改成 0，输出刷新时送出的是最后的值
            - text: 在 0 和 1 之间快速闪烁
              why: 输出只在扫描周期末尾刷新一次，送出的是映像区最后的值
            - text: 1，因为两个条件是“或”的关系
              why: 两个线圈不会自动合成“或”；要“或”就把 A、B 的触点并联在一个梯级里
          explain: 映像区里 Q0.0 被写了两次，最后一次是 0，输出刷新时端子为 0。正确的写法是把 A、B 并联后驱动一个线圈。
      - card:
          title: 置位和复位
          body: |
            另一种保持的办法是**置位（set）**和**复位（reset）**线圈：条件满足时 S 线圈把位写成 1 并保持，之后条件消失也不变；R 线圈把它写成 0。启停可以写成：START 接通时置位 MOTOR，STOP 断开时复位 MOTOR。

            置位和复位同时满足时，结果由程序里谁写在后面决定；IEC 61131-3 里的 SR 双稳态块规定置位优先，RS 块规定复位优先。安全相关的停止应该用复位优先。
      - item:
          id: set-reset
          type: choice
          prompt: 用置位复位实现电动机启停，启动和停止按钮同时被按住。为了安全，希望电动机停止。应该怎样安排？
          options:
            - text: 让复位优先，复位写在置位之后
              correct: true
            - text: 用置位优先，保证电动机能启动
              why: 两个按钮同时按住时置位优先会让电动机转，这不符合“停止优先”的安全要求
            - text: 置位和复位同时满足时 PLC 会报错停机
              why: PLC 不会报错，结果取决于执行顺序或功能块的类型
            - text: 复位优先会让启动按钮失效，要按两次才能启动
              why: 停止按钮没按下时复位条件不成立，启动按钮照常起作用
          explain: 同一个周期里后执行的指令决定最终结果。停止要优先于启动，所以复位写在后面，或用复位优先的 RS 功能块。

  - id: iec-languages
    chapter: 梯形图与IEC 61131-3语言
    title: IEC 61131-3 的五种语言
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个 PLC 程序要计算 $y = 0.5x + 3$ 并判断它是否大于 10。用梯形图写还是用一种类似高级语言的文本语言写更方便？
          options:
            - text: 文本语言更方便
              correct: true
            - text: 梯形图更方便
              why: 梯形图擅长开关逻辑，算术和比较要用一个个运算方框拼，写起来很繁琐
            - text: 都写不了，PLC 不能算小数
              why: PLC 支持实数运算，只是梯形图写起来不方便
          explain: 开关逻辑用梯形图直观，算术、判断和数据处理用结构化文本简洁。IEC 61131-3 规定了几种语言，同一个项目里可以混用。
      - card:
          title: 五种语言
          body: |
            国际标准 IEC 61131-3（1993 年首次发布）统一了 PLC 编程语言：

            - 梯形图（LD）：触点和线圈，适合开关逻辑；
            - 功能块图（FBD）：用方框和连线表示运算，像画电路的信号流；
            - 指令表（IL）：像一条条机器指令那样一行写一条，2013 年的第 3 版已列为不推荐使用；
            - **结构化文本（structured text，ST）**：类似高级语言，适合计算和复杂判断；
            - 顺序功能图（SFC）：用步和转移描述工序的先后，适合顺序控制。
      - item:
          id: language-match
          type: match
          prompt: 把每个编程任务和最合适的 IEC 61131-3 语言配对。
          pairs:
            - [电动机的启停逻辑, 梯形图（LD）]
            - [按公式计算配料量并做上下限判断, 结构化文本（ST）]
            - [灌装、封口、贴标依次进行的工序, 顺序功能图（SFC）]
          explain: 每种语言有自己擅长的事。实际项目常用 SFC 搭工序框架，每一步里用 LD 或 ST 写具体动作。
      - card:
          title: 变量和数据类型
          body: |
            IEC 61131-3 的程序用有名字的**变量（variable）**，而不是直接写地址。声明就是告诉 PLC 一个名字是什么类型、占哪个地址：声明 `Start : BOOL` 并把它对应到输入 %IX0.0，以后程序里写 Start，用的就是这个输入。常用的数据类型有 BOOL（一位）、INT（16 位有符号整数）、DINT（32 位整数）、REAL（32 位实数）和 TIME（时间，如 `T#5s`）。

            给变量起有意义的名字，程序才好读、好维护。
      - item:
          id: int-range
          type: number
          prompt: IEC 61131-3 的 INT 是 16 位有符号整数。它能表示的最大值是多少？
          answer: 32767
          hint: 16 位里有一位要表示正负，剩下几位表示大小？
          explain: 有符号的 16 位整数用补码表示，范围是 $-2^{15}$ 到 $2^{15} - 1$，即 $-32768$ 到 $32767$。计数可能超过这个值时要用 DINT。
      - card:
          title: 结构化文本和指令表
          body: |
            同一个启保停逻辑，用结构化文本写成一条**赋值（assignment）**语句（把右边算出的值存进左边的变量），用指令表写成四条指令：

            ```text
            (* 结构化文本 *)
            Motor := (Start OR Motor) AND Stop;

            (* 指令表 *)
            LD   Start
            OR   Motor
            AND  Stop
            ST   Motor
            ```

            这里 Stop 是接常闭的停止输入，平时为 1。结构化文本还有 IF … THEN … ELSE、CASE 等语句，写数值计算和判断比梯形图简洁。指令表的 LD 把一个值装进运算结果，OR、AND 和它运算，ST 把结果存进变量。
      - item:
          id: il-result
          type: choice
          prompt: 指令表“LD A；AND B；OR C；ST Q”执行后，Q 等于什么？
          options:
            - text: $Q = A\cdot B + C$
              correct: true
            - text: $Q = A\cdot(B + C)$
              why: 指令按顺序作用在当前结果上：先算 $A\cdot B$，再和 C 或
            - text: $Q = A + B\cdot C$
              why: 第二条是 AND B，先和 A 相与；或 C 在最后
            - text: $Q = (A + B)\cdot C$
              why: 第二条指令是 AND 不是 OR
          explain: LD A 后结果为 A；AND B 得 $A\cdot B$；OR C 得 $A\cdot B + C$；ST 存进 Q。
      - card:
          title: 功能块
          body: |
            **功能块（function block）**是带有内部状态的可重复使用的程序单元：有输入、输出，还有自己的存储，每用一次要建一个实例。定时器、计数器、边沿检测都是标准功能块，用户也可以自己写，比如把一台阀门的开关、反馈检查和报警封装成一个“阀门”功能块，几十台阀门各用一个实例。

            没有内部状态、同样的输入永远得到同样输出的叫**函数（function）**，如加法、比较、取最大值。
      - item:
          id: fb-or-function
          type: choice
          prompt: 下面哪一个必须是功能块，而不能是函数？
          options:
            - text: 计数器：每来一个脉冲当前值加 1
              correct: true
            - text: 求两个数中的较大者
              why: 同样的输入永远得到同样的输出，不需要记住任何东西，是函数
            - text: 把摄氏度换算成华氏度
              why: 换算只依赖当前输入，是函数
            - text: 判断一个数是否大于 10
              why: 比较只依赖当前输入，是函数
          explain: 计数器要记住已经数了多少，同样的输入在不同时刻输出不同，所以必须有内部状态，是功能块。

  # ==== 定时器与计数器 ====
  - id: timers
    chapter: 定时器与计数器
    title: 接通延时和断开延时
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一台电动机停下以后，冷却风扇还要再转 2 分钟才停。用哪种定时器实现最直接？
          options:
            - text: 断开延时定时器：输入断开后输出再保持一段时间
              correct: true
            - text: 接通延时定时器：输入接通一段时间后输出才接通
              why: 接通延时是“晚开”，这里要的是“晚关”
            - text: 不用定时器，让风扇和电动机同时停
              why: 题目要求风扇在电动机停后继续转 2 分钟
          explain: 断开延时定时器的输出随输入立即接通，输入断开后再延时断开，正好是“晚关”。
      - card:
          title: 定时器的种类
          body: |
            IEC 61131-3 规定了三种标准定时器功能块，许多 PLC 还有第四种：

            - 接通延时（TON）：输入接通满预设时间后，输出才接通；
            - 断开延时（TOF）：输入接通时输出立即接通，输入断开后再过预设时间输出才断开；
            - 脉冲（TP）：输入的**上升沿（rising edge）**（从 0 变 1 的那一刻）触发一个固定时长的输出脉冲；
            - 保持型接通延时（如西门子的 TONR）：输入断开时不清零，累计接通的总时间。

            每个定时器有输入 IN、预设时间 PT、输出 Q 和已计时间 ET。
      - card:
          title: 接通延时定时器
          body: |
            **接通延时定时器（on-delay timer，TON）**：IN 从 0 变 1 时开始计时，ET 从 0 增加；ET 达到 PT 时 Q 变为 1，并保持到 IN 变为 0。如果计时还没满 IN 就断开，ET 清零，Q 不会接通，下次接通重新从 0 计时。

            典型用途：传感器信号持续一段时间才确认（防止误动作）、按下按钮 3 秒才生效、延时起动。
      - item:
          id: ton-interrupted
          type: number
          prompt: 一个 TON 的预设时间 5 s。输入在 0 s 接通，在 3 s 断开，在 4 s 再次接通并一直保持。输出在第几秒接通？
          answer: 9
          unit: s
          hint: 输入在 3 s 断开时，已计时间 ET 变成多少？
          explain: 3 s 断开时 ET 清零；4 s 重新接通，再计满 5 s，到 9 s 输出接通。
      - card:
          title: 时基和预设值
          body: |
            许多 PLC 的定时器是数时基脉冲的：时基是 1 ms、10 ms 或 100 ms，定时器每过一个时基当前值加 1，加到预设值时动作。所以预设值 = 要延时的时间 ÷ 时基。比如时基 100 ms 的定时器延时 5 s，预设值写 50。

            IEC 61131-3 的写法直接写时间值，如 `PT := T#5s`，由系统换算。时基越大，能定的时间越长，但精度越粗：100 ms 时基的定时器误差可达一个时基。
      - item:
          id: timer-preset
          type: number
          prompt: 一个时基为 10 ms 的接通延时定时器要延时 2.5 s，预设值应写多少？
          answer: 250
          hint: 2.5 s 里有多少个 10 ms？
          explain: $2.5/0.01 = 250$。
      - card:
          title: 断开延时定时器
          body: |
            **断开延时定时器（off-delay timer，TOF）**：IN 变为 1 时 Q 立即变为 1；IN 变为 0 后开始计时，ET 达到 PT 时 Q 才变为 0。计时中途 IN 又变为 1，计时取消，Q 继续保持 1。

            典型用途：电动机停转后冷却风扇继续运转、楼道灯熄灭前的延时、传送带停止前清空物料。
      - item:
          id: tof-off-time
          type: number
          prompt: 一个 TOF 的预设时间 3 s。输入在 0 s 接通、10 s 断开、11 s 又接通、12 s 再断开，之后一直断开。输出最后在第几秒断开？
          answer: 15
          unit: s
          hint: 11 s 输入又接通时，10 s 开始的计时会怎样？
          explain: 10 s 开始计时，11 s 输入又接通，计时取消，输出保持；12 s 再断开，重新计 3 s，到 15 s 输出断开。
      - item:
          id: timer-choice
          type: match
          prompt: 把每个需求和合适的定时器配对。
          pairs:
            - [按住按钮 3 秒才生效，防止误按, 接通延时（TON）]
            - [电动机停后风扇再转 2 分钟, 断开延时（TOF）]
            - [每按一次按钮，电铃响 2 秒（按多久都一样）, 脉冲（TP）]
          explain: 晚开用 TON，晚关用 TOF，固定时长的脉冲用 TP。

  - id: timers-advanced
    chapter: 定时器与计数器
    title: 脉冲、保持型定时器和定时举例
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一台水泵要累计运行满 500 小时提醒保养，中间会多次停机。用普通的接通延时定时器能记录吗？
          options:
            - text: 不能，停机时它就清零了
              correct: true
            - text: 能，预设时间设成 500 小时就行
              why: 接通延时定时器输入一断开就清零，只能记一次连续运行的时间
            - text: 能，PLC 会自动累计
              why: 普通 TON 不累计，要用保持型定时器
          explain: 这要用保持型定时器：输入断开时保持已计的时间，再接通时接着累计。
      - card:
          title: 脉冲定时器
          body: |
            脉冲定时器（TP）在 IN 的上升沿让 Q 变为 1，保持 PT 这么长再变为 0，不管 IN 是早早断开还是一直接通。脉冲期间 IN 再出现上升沿也不会重新计时。

            用途：按一下按钮让电铃响固定的时间、给电磁阀一个固定宽度的动作脉冲。
      - item:
          id: tp-length
          type: number
          prompt: 一个 TP 的预设时间 2 s。输入在 0 s 接通、0.5 s 断开、1 s 又接通、5 s 断开。输出一共接通了多少秒？
          answer: 2
          unit: s
          hint: 1 s 的上升沿落在第一个脉冲里面，会重新触发吗？5 s 之前还有没有新的上升沿？
          explain: 0 s 的上升沿产生 0–2 s 的脉冲；1 s 的上升沿在脉冲期间，不重新计时；之后输入一直接通到 5 s，没有新的上升沿，所以只有一个 2 s 的脉冲。
      - card:
          title: 保持型定时器
          body: |
            **保持型定时器（retentive timer）**在 IN 断开时不清零，保留已计的时间；IN 再接通时接着累计，累计满 PT 后 Q 接通。它只能用复位指令清零。

            用途：累计设备运行时间提醒保养、累计加热时间、断电后还要接着计时的工艺（配合断电保持的存储区）。
      - item:
          id: retentive-sum
          type: number
          prompt: 一个保持型定时器预设时间 6 s。输入在 0–3 s 接通、3–5 s 断开、5 s 起再接通。输出在第几秒接通？
          answer: 8
          unit: s
          hint: 第一次接通累计了多少？还差多少？
          explain: 0–3 s 累计 3 s，断开期间保持；5 s 起再累计 3 s，到 8 s 满 6 s，输出接通。普通 TON 要到 11 s。
      - card:
          title: 闪烁电路
          body: |
            用两个接通延时定时器可以让指示灯闪烁：T1 在 T2 没动作时开始计 0.5 s，T1 动作后启动 T2 计 0.5 s，T2 动作时让 T1 复位，T1 一复位 T2 也复位，于是重新开始。灯接 T1 的输出，亮 0.5 s、灭 0.5 s，周期 1 s。

            ```text
            |  T2.Q          T1 (TON, PT=0.5s)  |
            |---|/|----------[ IN    Q ]------- |
            |  T1.Q          T2 (TON, PT=0.5s)  |
            |---| |----------[ IN    Q ]------- |
            ```

            灯由 T1.Q 的常开触点驱动。改变两个预设时间，就能分别调节亮和灭的时间。
      - item:
          id: flasher-frequency
          type: number
          prompt: 一个闪烁电路里，灯亮 0.3 s、灭 0.7 s 交替。闪烁的频率是多少赫？
          answer: 1
          unit: Hz
          hint: 一个完整的亮灭周期多长？
          explain: 周期 $0.3 + 0.7 = 1$ s，频率 1 Hz，占空比 30%。
      - card:
          title: 星三角起动的时序
          body: |
            较大的笼型电动机常用星三角起动：先把定子绕组接成星形，每相绕组上的电压只有三角形接法的 $1/\sqrt3$，起动电流降到直接起动的三分之一；转起来以后再换成三角形正常运行。

            PLC 的时序：按下起动，主接触器和星形接触器吸合；TON 计 5 s 后断开星形接触器；再经另一个 TON 延时约 0.1 s（等星形接触器的电弧熄灭），吸合三角形接触器。星形和三角形接触器同时吸合会造成短路，所以要让两者不能同时吸合，叫互锁：程序里互锁，硬件上也用对方的常闭辅助触点互锁。
      - item:
          id: star-delta-current
          type: number
          prompt: 一台电动机直接接三角形起动时，起动线电流是 300 A。改用星三角起动，星形接法时的起动线电流约是多少安？
          answer: 100
          unit: A
          hint: 星形接法时每相绕组的电压是原来的几分之几？绕组电流和线电流又怎样变化？
          explain: 每相电压降为 $1/\sqrt3$，绕组电流也降为 $1/\sqrt3$；三角形时线电流是绕组电流的 $\sqrt3$ 倍，星形时相等，合起来线电流降为 $1/3$，即 100 A。起动转矩也降为三分之一。
      - item:
          id: star-delta-gap
          type: choice
          prompt: 星三角起动从星形切换到三角形时，为什么要在断开星形接触器和吸合三角形接触器之间留约 0.1 s 的间隔？
          options:
            - text: 等星形接触器的触点完全分开、电弧熄灭，防止两个接触器同时导通造成短路
              correct: true
            - text: 让电动机先减速，换接时冲击小
              why: 零点一秒里电动机几乎不减速；间隔主要是为了让星形接触器断开、电弧熄灭，防止两个接触器同时导通
            - text: 让 PLC 有时间完成扫描
              why: 扫描周期只有几毫秒，不需要专门留出这么长的时间
          explain: 接触器断开要一段时间，触点间还可能拉弧。程序里留出间隔，再加硬件互锁，才能可靠防止相间短路。

  - id: counters
    chapter: 定时器与计数器
    title: 计数器和上升沿
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 传送带上每过一个瓶子，光电开关输出一个约 0.3 s 的脉冲。PLC 扫描周期 10 ms。如果程序每个扫描周期只要看到输入为 1 就给计数加 1，过一个瓶子会加多少？
          options:
            - text: 约 30
              correct: true
            - text: '1'
              why: 输入为 1 持续了约 30 个扫描周期，每个周期都加 1
            - text: 不确定，可能是 0
              why: 0.3 s 远长于扫描周期，一定会被采样到，而且采到很多次
          explain: 要数的是“来了几个瓶子”，也就是输入从 0 变 1 的次数，不是输入为 1 的周期数。所以计数要用上升沿。
      - card:
          title: 上升沿和单次脉冲
          body: |
            信号从 0 变 1 的那一刻是上升沿，从 1 变 0 叫下降沿。上升沿检测（IEC 的 R_TRIG 功能块，梯形图里的 ┤P├ 触点）只在出现上升沿的那一个扫描周期输出 1，下一个周期起就恢复 0，不管输入保持多久，这叫单次脉冲（one-shot）。

            它的原理是把这一周期的输入和上一周期记下的值比较：本次为 1、上次为 0 就是上升沿。
      - item:
          id: edge-count
          type: number
          prompt: 一个输入在 10 个扫描周期里的值依次是 0、1、1、0、1、0、0、1、1、1。上升沿检测一共输出几次 1？
          answer: 3
          hint: 把相邻两个周期配成一对，哪几对是 0 后面紧跟着 1？
          explain: 第 2、5、8 个周期各有一次 0 → 1 的变化，共 3 次。
      - card:
          title: 计数器
          body: |
            IEC 61131-3 的加计数器（CTU）在计数输入 CU 的每个上升沿让当前值 CV 加 1，CV ≥ 预设值 PV 时输出 Q 为 1；复位输入 R 让 CV 清零。减计数器（CTD）先由装载输入 LD（load）把 CV 装成 PV，每个上升沿减 1，CV ≤ 0 时 Q 为 1。加减计数器（CTUD）有两个计数输入，一个加、一个减。

            计数器本身就按上升沿计数，所以直接把传感器接到 CU 上就行。
      - item:
          id: bottle-counter
          type: choice
          prompt: 每装满 12 个瓶子推出一箱。用加计数器（PV = 12）实现，计数器应该在什么时候复位？
          options:
            - text: 推箱动作完成以后
              correct: true
            - text: 计到 12 的同一个扫描周期立刻复位
              why: 立刻复位会让 Q 只持续一个扫描周期，推箱气缸可能还没来得及动作
            - text: 每天开机时复位一次
              why: 那样计数会一直累加到 12 以上，只推出第一箱
            - text: 不用复位，计数器会自动从 0 开始
              why: CTU 计到预设值后不会自己清零，要用 R 输入复位
          explain: 计数到 12 驱动推箱，推箱完成（比如气缸缩回的限位开关动作）时复位，开始数下一箱。
      - item:
          id: parking-ctud
          type: number
          prompt: 一个停车场入口和出口各有一个检测器，接到加减计数器的加、减输入，计数器开始时为 0，车位 100 个。一段时间里进来 37 辆、出去 12 辆。还剩多少个空车位？
          answer: 75
          unit: 个
          hint: 计数器现在的当前值是多少？
          explain: 当前值 $37 - 12 = 25$，空车位 $100 - 25 = 75$。当前值到 100 时可以点亮“车位已满”。
      - card:
          title: 定时器和计数器组合
          body: |
            定时器的预设值有上限，要定几个小时，可以让一个定时器每秒产生一个脉冲，再用计数器数这些脉冲：每秒一个脉冲，计数器预设 3600 就是 1 小时。

            反过来，计数器和定时器配合还能测速度：一个 TON 计 1 s，计数器同时数编码器或接近开关的脉冲；TON 到时把计数值读出来、再把计数器和 TON 复位，每秒刷新一次，读出的就是每秒的脉冲数。
      - item:
          id: long-delay
          type: number
          prompt: 用一个每秒输出一个脉冲的定时器加一个计数器实现 2 小时的延时。计数器的预设值应是多少？
          answer: 7200
          hint: 2 小时有多少秒？
          explain: $2 \times 3600 = 7200$。
      - item:
          id: speed-count
          type: number
          prompt: 一根轴上装一个检测齿，每转一圈接近开关输出一个脉冲。在 2 s 的时间窗里数到 50 个脉冲，轴的转速是多少转每分？
          answer: 1500
          unit: r/min
          hint: 每秒转几圈？
          explain: $50/2 = 25$ 转每秒，乘 60 得 1500 r/min。注意 25 Hz 的脉冲只有 40 ms 一个，扫描周期要足够短，或者用高速计数器。

  # ==== 顺序控制 ====
  - id: sfc
    chapter: 顺序控制
    title: 顺序功能图
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个灌装工序：开进水阀、液位到高位后关阀并搅拌 10 秒、然后开出水阀、液位到低位后关阀回到开始。用什么方式描述最清楚？
          options:
            - text: 把工序分成几步，每一步做什么、什么条件下进入下一步
              correct: true
            - text: 写出每个阀门的布尔逻辑式
              why: 阀门该不该开取决于现在处于哪个阶段，单写逻辑式很难表达先后顺序
            - text: 画一个电路图
              why: 电路图表达不了“先做什么、后做什么”
          explain: 顺序控制的关键是“现在在哪一步”和“满足什么条件进入下一步”，顺序功能图就是按这个思路画的。
      - card:
          title: 步、转移和动作
          body: |
            **顺序功能图（sequential function chart，SFC）**把工序画成一串方框和横线：

            - **步（step）**：一个方框，表示工序的一个阶段；双线框是初始步，PLC 启动时它是活动的；
            - **转移（transition）**：两步之间的一条短横线，旁边写转移条件；
            - 动作：写在步右边的方框里，表示这一步活动时要做什么（开哪个阀、启动哪台电机）。

            规则：前一步活动且转移条件成立时，转移发生，前一步变为不活动，后一步变为活动。这和有限状态机是一回事：步是状态，转移条件决定状态怎样切换。
      - item:
          id: sfc-rule
          type: choice
          prompt: SFC 中步 2 不活动，但步 2 和步 3 之间的转移条件已经成立。会发生什么？
          options:
            - text: 什么也不发生，转移只在前一步活动时才可能发生
              correct: true
            - text: 步 3 变为活动
              why: 转移发生要同时满足两条：前一步活动、转移条件成立
            - text: 步 2 和步 3 同时变为活动
              why: 前一步不活动，这个转移根本不会被考虑
            - text: PLC 报错停机
              why: 条件成立而前一步不活动是正常情况，不算错误
          explain: 转移条件只是两个必要条件之一。这保证了工序严格按顺序进行，不会因为某个传感器提前动作而跳步。
      - card:
          title: 例题：水箱灌装
          body: 按启动后开进水阀，液位到高位后关阀并启动搅拌 10 s，然后开出水阀，液位到低位后关阀回到初始状态。画出顺序功能图。
          reveal:
            - title: 第 1 步：列出工序的阶段
              body: 等待（初始步 0）、进水（步 1）、搅拌（步 2）、放水（步 3）。
            - title: 第 2 步：写出每一步的动作
              body: 步 1 开进水阀；步 2 启动搅拌并启动一个 10 s 的定时器；步 3 开出水阀。阀门和搅拌只在各自的步活动时工作，步一结束动作就停：离开步 1 时进水阀自动关闭，离开步 3 时出水阀自动关闭。
            - title: 第 3 步：写出转移条件
              body: |
                0 → 1：启动按钮；1 → 2：高液位；2 → 3：定时器到；3 → 0：低液位。最后一个转移连回初始步，形成闭环：

                ```text
                 ╔═══╗
                 ║ 0 ║ 等待
                 ╚═══╝
                   ┼  启动按钮
                 ┌───┐   ┌────────┐
                 │ 1 ├───┤ 进水阀 │
                 └───┘   └────────┘
                   ┼  高液位
                 ┌───┐   ┌──────────────┐
                 │ 2 ├───┤ 搅拌，定时 10 s │
                 └───┘   └──────────────┘
                   ┼  定时到
                 ┌───┐   ┌────────┐
                 │ 3 ├───┤ 出水阀 │
                 └───┘   └────────┘
                   ┼  低液位 → 回到步 0
                ```
      - item:
          id: tank-order
          type: order
          prompt: 一个水箱灌装工序：按启动后进水，液位到高位后搅拌 10 s，然后放水，液位到低位后回到等待。把它的转移条件按先后排好（从初始步开始）。
          steps:
            - 按下启动按钮
            - 液位到达高位
            - 搅拌定时 10 s 到
            - 液位降到低位
          explain: 启动 → 高液位 → 定时到 → 低液位，然后回到初始步，等待下一次启动。
      - card:
          title: 选择分支和并行分支
          body: |
            工序不一定是一条直线。从一步分出几条路叫**分支（branch）**：

            - 选择分支：画在单横线下，几条路各有自己的转移条件，只走条件先成立的那一条，比如合格品去包装、不合格品去返工；
            - 并行分支：画在双横线下，转移一发生，几条路同时开始，比如钻孔和攻丝两个工位同时工作；汇合处也画双横线，要等所有并行的路都走完，才能一起转到下一步。
      - item:
          id: branch-choice
          type: choice
          prompt: 一个装配工序：工件到位后，左工位拧螺钉、右工位贴标签同时进行，两边都完成后才送出。应该用哪种结构？
          options:
            - text: 并行分支，汇合处等两边都完成
              correct: true
            - text: 选择分支
              why: 选择分支只走一条路，这里两边要同时进行
            - text: 单序列，先拧螺钉再贴标签
              why: 能做但浪费时间；题目要求两边同时进行
            - text: 两个独立的 SFC，互不相关
              why: 送出要等两边都完成，两部分必须在汇合处同步
          explain: 两个工位同时工作用并行分支，汇合时等所有分支都到达最后一步再一起转移。
      - item:
          id: active-steps
          type: number
          prompt: 一个 SFC 在某一步之后有一个三路的并行分支，每路各有两步。转移刚发生、三路刚开始时，整个 SFC 有几个活动步？
          answer: 3
          hint: 三路是同时开始，还是一条接一条开始？
          explain: 并行分支开始时三路的第一步同时活动，共 3 个活动步。单序列或选择分支任何时刻只有 1 个活动步。

  - id: sequence-to-ladder
    chapter: 顺序控制
    title: 把顺序功能图写成梯形图
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 有些小型 PLC 不支持直接用 SFC 编程。顺序功能图里“哪一步是活动的”可以用什么来记？
          options:
            - text: 每一步用一个内部继电器，活动时为 1
              correct: true
            - text: 用输出点直接表示
              why: 输出接的是阀门和电机，一个输出可能在好几步里都要动作，不能拿来代表步
            - text: 记不了，只能换 PLC
              why: 用内部继电器和置位复位就能实现任何 SFC
          explain: 每一步对应一个内部继电器（步位），转移就是“置位下一步、复位这一步”，动作由步位驱动输出。
      - card:
          title: 用置位复位实现转移
          body: |
            每一步用一个内部位 S0、S1、S2……表示是否活动。每个转移写一个梯级：前一步的位接通且转移条件成立时，置位后一步、复位前一步。

            ```text
            |  S1      HighLevel           S2   |
            |---| |------| |----------+---(S)---|
            |                         |   S1    |
            |                         +---(R)---|
            ```

            初始步在 PLC 第一次扫描时置位（用首次扫描标志位）。输出由步位驱动：进水阀 = S1，搅拌 = S2；一个输出要在几步里动作时，把这几步的步位并联起来驱动它。
      - item:
          id: output-from-steps
          type: choice
          prompt: 一个工序里，搅拌电机在步 2 和步 4 都要运行。怎样写它的梯级？
          options:
            - text: S2 和 S4 的常开触点并联，驱动搅拌电机的线圈
              correct: true
            - text: 在步 2 的梯级和步 4 的梯级里各写一个搅拌电机线圈
              why: 同一线圈写两次，后面的会覆盖前面的结果，步 2 时电机不会转
            - text: S2 和 S4 的常开触点串联
              why: 串联要两步同时活动，单序列里不会出现，电机永远不转
            - text: 进入步 2 时置位电机，进入步 5 时复位
              why: 那样步 3 也会一直转；动作应该只在对应的步活动时进行
          explain: 输出线圈只写一次，把所有需要它动作的步位并联起来驱动，这样步一离开动作就自动停止。
      - card:
          title: 步进指令和顺序器
          body: |
            许多 PLC 有现成的顺序控制指令：三菱的步进指令（STL）用状态继电器 S 表示步，进入新的一步时自动复位前一步；还有顺序器指令，把每一步各个输出的通断事先排成一张表，每来一个推进信号就走到表里的下一行，适合信号灯、洗衣机这类按固定节拍循环的工序。

            无论用哪种写法，先画顺序功能图再写程序，比直接写梯形图不容易出错。
      - item:
          id: traffic-cycle
          type: number
          prompt: 一个路口的信号灯用顺序器控制，一个方向的一轮是：绿灯 30 s、黄灯 3 s、红灯 33 s，然后回到绿灯。一轮要多少秒？
          answer: 66
          unit: s
          hint: 一轮里信号灯依次经过哪几种颜色？
          explain: $30 + 3 + 33 = 66$ s。红灯 33 s 正好对应另一个方向的绿灯 30 s 加黄灯 3 s。
      - card:
          title: 程序开发的步骤
          body: |
            一个 PLC 项目一般这样开发：

            1. 弄清控制要求，写成文字说明；
            2. 列出输入输出表：每个按钮、传感器、执行器接哪个地址；
            3. 画出顺序功能图或流程图；
            4. 写程序，给每个变量和梯级加上说明文字；
            5. 用仿真或空载试验测试，再带负荷调试。

            输入输出表要先定下来，硬件接线和程序才能同时进行。
      - item:
          id: development-order
          type: order
          prompt: 把 PLC 程序开发的步骤按先后排好。
          steps:
            - 写出控制要求
            - 列出输入输出地址表
            - 画顺序功能图或流程图
            - 编写带说明文字的程序
            - 仿真和现场调试
          explain: 先弄清要求和接口，再设计顺序，最后写程序和测试。跳过前几步直接写程序，往往要反复返工。

  # ==== 工业现场总线 ====
  - id: fieldbus
    chapter: 工业现场总线
    title: 现场总线和工业以太网
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一条生产线有 300 个传感器和执行器分布在 100 米长的范围里。每个点都单独拉一对线回控制柜，和用一根总线把远处的输入输出模块连起来相比，后者主要省了什么？
          options:
            - text: 大量电缆和接线工作
              correct: true
            - text: PLC 的程序
              why: 程序还是要写的，总线省的是现场布线
            - text: 传感器本身
              why: 传感器一个都不能少，只是不用每个都拉线回控制柜
          explain: 把输入输出模块放到现场，用一根通信电缆连回 CPU，叫远程 I/O，大大减少了电缆。
      - card:
          title: 远程 I/O 和 RS-485
          body: |
            输入输出模块放在设备旁边的现场机柜里，经一根通信电缆连回 CPU，叫远程 I/O 或分布式 I/O。连接这些设备的数字通信网络叫**现场总线（fieldbus）**。

            很多现场总线的物理层是 RS-485：用一对双绞线传差分信号，抗干扰能力强，一条总线可以挂 32 个标准负载，距离可达 1200 m（速率越高距离越短），两端要接终端电阻。总线上同一时刻只能有一个设备发送，一般由主站轮流询问各从站。
      - card:
          title: Modbus RTU
          body: |
            Modbus 是最简单、最常用的工业通信协议之一。RTU 方式跑在 RS-485 上：一个主站，从站地址 1–247。主站发请求，被叫到的从站回应答。一帧由四部分组成：从站地址（1 字节）、功能码（1 字节）、数据、CRC 校验（2 字节，按整帧内容算出的校验码，收方重算一遍，不一致就丢掉这帧）；帧和帧之间至少静默 3.5 个字符的时间。
      - item:
          id: crc-mismatch
          type: choice
          prompt: Modbus RTU 的从站收到一帧，自己按帧内容算出的 CRC 和帧末尾的 CRC 不一致。从站会怎样处理？
          options:
            - text: 丢掉这一帧，不执行也不应答
              correct: true
            - text: 照样执行，只是在应答里报告错误
              why: 数据可能已经被干扰改错了，执行它可能做出错误动作，所以直接丢掉
            - text: 用 CRC 把出错的位纠正过来再执行
              why: CRC 只能发现错误，不能指出哪一位错了，更不能纠正
            - text: 回一帧“收到”请主站核对
              why: 校验不通过时从站不应答，主站等不到应答会超时重发
          explain: CRC 用来发现传输中被干扰改错的帧。校验失败的帧一律丢弃，主站超时后重发。
      - card:
          title: Modbus 的功能码
          body: |
            常用功能码：01 读线圈，02 读离散输入，03 读**保持寄存器（holding register）**，04 读输入寄存器，05 写单个线圈，06 写单个寄存器，16 写多个寄存器。这里的**寄存器（register）**指设备里一个 16 位的数据单元，和数字电路里由触发器组成的寄存器不是一回事。
      - item:
          id: modbus-fc
          type: match
          prompt: 把每个操作和它的 Modbus 功能码配对。
          pairs:
            - [读几个保持寄存器（如变频器的设定值）, '03']
            - [写一个寄存器（如设定频率）, '06']
            - [读几个线圈（开关量输出）的状态, '01']
          explain: 03 读保持寄存器、06 写单个寄存器、01 读线圈，是最常用的三个。
      - card:
          title: 例题：一帧有多长
          body: 主站要从地址 17 的从站读 10 个保持寄存器（从寄存器 0 开始）。请求和应答各多少字节？
          reveal:
            - title: 第 1 步：请求帧
              body: 地址（1）+ 功能码 03（1）+ 起始寄存器地址（2）+ 寄存器个数（2）+ CRC（2）= 8 字节。
            - title: 第 2 步：应答帧
              body: 地址（1）+ 功能码（1）+ 字节数（1）+ 数据（10 个寄存器 × 2 字节 = 20）+ CRC（2）= 25 字节。
            - title: 第 3 步：换算成时间
              body: RTU 每个字符按 11 位传送（起始位、8 个数据位、校验位、停止位）。9600 bit/s 时应答约需 $25 \times 11/9600 \approx 28.6$ ms，加上请求和静默间隔，一次读取约 40 ms。
      - item:
          id: modbus-response
          type: number
          prompt: Modbus RTU 主站用功能码 03 读一个从站的 4 个保持寄存器。从站的应答帧一共多少字节？
          answer: 13
          unit: 字节
          hint: 应答帧里有地址、功能码、字节数、数据和 CRC，数据有多少字节？
          explain: $1 + 1 + 1 + 4 \times 2 + 2 = 13$ 字节。
      - item:
          id: modbus-time
          type: number
          prompt: 一个 25 字节的 Modbus RTU 帧，每个字符 11 位，波特率 19200 bit/s。传完这一帧约要多少毫秒？（保留一位小数）
          answer: 14.3
          tolerance: 0.05
          unit: ms
          hint: 一共要传多少位？
          explain: $25 \times 11 = 275$ 位，$275/19200 \approx 14.3$ ms。
      - card:
          title: PROFIBUS、工业以太网和 HART
          body: |
            - PROFIBUS DP：基于 RS-485，速率最高 12 Mbit/s，用于 PLC 和远程 I/O、驱动器；PROFIBUS PA 用于过程仪表。
            - 工业以太网（PROFINET、EtherCAT、EtherNet/IP）：用以太网的电缆和芯片，但强调确定的通信周期和很小的时间抖动，还能让各站的时钟同步。EtherCAT 的报文依次穿过各个从站，每个从站在报文经过时读出和写入自己的数据，周期可以小于 100 μs，适合多轴运动控制。普通办公以太网是“尽力而为”，不保证多久送到。
      - item:
          id: industrial-ethernet
          type: choice
          prompt: 和办公室里的普通以太网相比，PROFINET、EtherCAT 这类工业以太网最强调什么？
          options:
            - text: 准时：周期确定、抖动小
              correct: true
            - text: 更高的带宽，能同时传高清视频和大文件
              why: 工业以太网多用 100 Mbit/s，带宽并不比办公网高；它在意的是准时
            - text: 能挂的从站数量比普通以太网多得多
              why: 站点数量由网络规划决定；工业以太网要解决的是每个周期准时送到
            - text: 不用交换机，设备之间随便串起来就行
              why: 有的工业以太网支持线形连接，但这不是它和普通以太网的根本区别；关键是确定的周期和小的抖动
          explain: 运动控制要求每隔固定的时间（比如 1 ms）准时交换一次数据，晚到比丢包更糟。工业以太网的协议就是为保证这一点设计的。Modbus TCP 只是把 Modbus 报文装进普通 TCP/IP，不保证准时，也没有时钟同步，不属于这一类。
      - card:
          title: HART
          body: |
            过程工业里有大量已经装好的 4–20 mA 仪表和电缆。HART 协议在 4–20 mA 电流上叠加一个频移键控的数字信号（1200 bit/s，用两个频率表示 0 和 1），平均值为 0，不影响原来的模拟读数。

            这样用原有的两根线，既能照常读模拟量，又能读出仪表的量程、诊断信息和第二个测量值，还能远程修改设置。
      - item:
          id: hart-benefit
          type: choice
          prompt: 一座老化工厂想读出现场几百台 4–20 mA 变送器的诊断信息，又不想重新敷设电缆。用 HART 为什么可行？
          options:
            - text: 数字信号叠加在原回路上，平均值为 0
              correct: true
            - text: 它把 4–20 mA 信号换成了以太网
              why: HART 不改变原有的电流回路，仍用两根线
            - text: 它用无线传输，不需要电缆
              why: 普通 HART 用的就是原来的电缆；无线 HART 是另一种做法
            - text: 它提高了 4–20 mA 信号的精度
              why: HART 的作用是增加数字通信，模拟量的精度不变
          explain: 频移键控的正弦信号在一个周期里的平均值为 0，PLC 的模拟量输入照常读到 4–20 mA，带 HART 的设备另外解出数字信息。

  # ==== HMI与SCADA ====
  - id: hmi-scada
    chapter: HMI与SCADA
    title: HMI 和 SCADA
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一座城市的自来水公司要在控制中心监视几十个水厂和泵站的流量、压力，并能远程启停水泵。用的是什么系统？
          options:
            - text: SCADA
              correct: true
            - text: 每个泵站一块触摸屏就够了
              why: 触摸屏（HMI）只能在现场看本地设备，不能集中监视分散在全城的站点
            - text: 一台 PLC 直接接所有泵站的线
              why: 站点相距几公里到几十公里，不可能直接拉线到一台 PLC
          explain: SCADA（数据采集与监视控制）用于地域分散的系统：各站点的 PLC 或 RTU 采集数据，经通信网送到控制中心集中监视和控制。
      - card:
          title: HMI
          body: |
            **HMI（human-machine interface，人机界面）**是装在设备旁的触摸屏或操作面板：画面上显示设备的状态、数值和趋势曲线，操作员在上面启停设备、修改设定值。画面上的每个按钮、数字都绑定到 PLC 里的一个变量（叫标签或 tag），HMI 经通信不断读写这些变量。

            HMI 还负责报警：某个值越限时弹出报警、记录发生和确认的时间；配方：一组工艺数据一次下载给 PLC；以及按用户级别限制谁能改哪些设定值。
      - item:
          id: hmi-tag
          type: choice
          prompt: 操作员在触摸屏上把灌装量从 500 mL 改成 600 mL，这个新值是怎样起作用的？
          options:
            - text: HMI 经通信把 600 写进 PLC 里对应的变量，PLC 程序按新值控制
              correct: true
            - text: HMI 直接控制灌装阀
              why: HMI 一般不直接接执行器，控制逻辑在 PLC 里，HMI 只读写 PLC 的变量
            - text: 要重新下载 PLC 程序才能生效
              why: 设定值是程序里的变量，运行中写入即可，不需要改程序
            - text: 改的只是屏幕上的显示，PLC 不受影响
              why: 绑定了变量的输入框会把新值写进 PLC
          explain: HMI 是 PLC 的窗口：读变量来显示，写变量来下达命令和设定值。
      - card:
          title: SCADA
          body: |
            **SCADA（supervisory control and data acquisition，数据采集与监视控制）**用于地域分散的系统，如电网、油气管道、供水网：

            - 各站点的 PLC 或 **RTU（remote terminal unit，远程终端单元）**采集本地数据、执行本地控制；
            - 通信网（光纤、无线电台、移动网络）把数据送到中心；
            - 主站服务器轮询各站、处理报警、把数据存进历史数据库；
            - 值班员在 HMI 客户端上监视和下达命令。
      - item:
          id: polling-cycle
          type: number
          prompt: 一个 SCADA 主站依次轮询 50 个 RTU，每次询问加应答平均要 0.2 s。每个 RTU 的数据多少秒刷新一次？
          answer: 10
          unit: s
          hint: 轮完一圈要多久？
          explain: $50 \times 0.2 = 10$ s。要更快，就提高通信速率、分几条通道同时轮询，或让 RTU 在数据变化时主动上报。
      - card:
          title: SCADA 管什么、不管什么
          body: |
            远程通信有延迟，还可能中断，所以 SCADA 主要做监视、报警、记录和下达设定值，快速的闭环控制留在现场的 PLC 里完成；通信断了，现场设备照样按最后的设定值运行。

            工厂内部、各单元联系紧密的过程控制（如炼油、化工装置）多用 DCS（集散控制系统）：控制器、操作站和网络由同一家厂商统一设计，控制回路多、联系紧。
      - card:
          title: 数据采集和历史记录
          body: |
            过程数据按一定的间隔采样，存进历史数据库，用来画趋势、追查事故、做报表和分析。数据量很大：一个变量每秒一个值，一年就是三千多万个值，1000 个变量就是三百多亿个。常用的节省办法是死区记录：只有变化超过设定的死区时才记一个新值，平稳时几乎不占空间。

            采样间隔要和过程的快慢匹配：温度、液位变化慢，几秒一次就够；电流、压力冲击要毫秒级。
      - item:
          id: historian-size
          type: number
          prompt: 一个系统有 1000 个变量，每个变量每秒存一个值，每个值连时间戳占 8 字节，不压缩。一天的数据约多少兆字节（1 MB = 10⁶ 字节）？（保留一位小数）
          answer: 691.2
          tolerance: 0.05
          unit: MB
          hint: 一天有多少秒？
          explain: $1000 \times 86400 \times 8 = 6.912 \times 10^8$ 字节，约 691.2 MB，一年约 252 GB。所以历史数据库都要压缩或用死区记录。
      - item:
          id: hmi-vs-scada
          type: match
          prompt: 把每项工作和最合适的系统配对。
          pairs:
            - [在一台包装机旁修改封口温度, HMI]
            - [在控制中心监视全省几百座变电站, SCADA]
            - [每 10 ms 根据压力调节阀门开度, 现场 PLC]
          explain: HMI 是设备旁的操作窗口；SCADA 监视分散的站点；快速闭环控制交给现场的 PLC，不经过远程通信。

  # ==== 安全联锁 ====
  - id: safety
    chapter: 安全联锁
    title: 故障安全和急停
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一台冲床的急停按钮接到 PLC 的输入上，由程序判断后断开输出。如果 PLC 的程序跑飞或输出晶体管击穿短路，急停还有用吗？
          options:
            - text: 可能没用，急停必须用不依赖 PLC 程序的硬接线回路
              correct: true
            - text: 有用，PLC 很可靠
              why: 再可靠也会出故障；急停正是为最坏的情况准备的
            - text: 有用，只要扫描周期足够短
              why: 程序跑飞或输出击穿时，扫描周期再短也断不开输出
          explain: 急停要在控制系统本身出故障时也能切断危险的能量，所以急停按钮直接串在接触器线圈的电源回路或安全继电器里，PLC 只读取它的状态做显示和联锁。
      - card:
          title: 故障安全原则
          body: |
            设计时要问：任何一个元件坏了、任何一根线断了，设备会停在安全的状态吗？这叫**故障安全（fail-safe）**原则。具体做法：

            - 停止和急停按钮用常闭触点，断线等同于按下；
            - 执行器“断电即安全”：断电时电磁阀回到安全位置、制动器抱闸、接触器释放；
            - 传感器信号用活零点（4–20 mA），断线能被发现。

            反过来，如果用常开的停止按钮，断线以后按下它也没有反应，这就是危险的设计。
      - item:
          id: fail-safe-choice
          type: choice
          prompt: 一台起重机的抱闸由电磁线圈控制。按故障安全原则，抱闸应该怎样设计？
          options:
            - text: 通电松开，断电靠弹簧抱紧
              correct: true
            - text: 线圈通电时抱紧，断电时松开
              why: 那样一停电抱闸就松开，重物会坠落
            - text: 线圈通电时抱紧，断电时保持原来的状态
              why: 断电时要可靠地进入安全状态，不能停在原状态
            - text: 用 PLC 程序控制，和通断电无关
              why: 程序控制不能保证断电或 PLC 故障时的安全
          explain: 断电、断线、控制器故障时，弹簧让抱闸自动抱紧，重物不会坠落。
      - card:
          title: 急停和安全继电器
          body: |
            急停按钮是红色蘑菇头、按下后自锁的常闭按钮。按国际标准 IEC 60204-1，急停应采用 0 类停止（立即切断电源）或 1 类停止（先受控减速、再切断电源）。

            急停回路用硬接线：按钮直接串在接触器线圈或安全继电器的回路里。安全继电器内部有两路互相监视的触点（双通道），能发现一路触点粘死、线路短路等故障，发现后拒绝重新启动。复杂的设备用安全 PLC：它有两套互相比较的处理器和持续的自检。普通 PLC 只读取急停的状态，用来显示和做后续联锁。
      - item:
          id: emergency-stop
          type: choice
          prompt: 为什么急停按钮在现场要接成常闭触点，并直接串在安全回路里？
          options:
            - text: 断线等同按下，不依赖控制器
              correct: true
            - text: 接常开更合理，按下时接通，信号更明确
              why: 接常开时导线一断，按下急停也没有反应；常闭让断线等同于按下
            - text: 接常闭是为了在程序里画常闭触点
              why: 急停的安全作用不靠程序；常闭接法是为了断线也能切断回路
            - text: 方便在程序里统计急停的次数
              why: 统计可以做，但不是这样接线的原因
          explain: 常闭接法让断线等同于按下急停（故障安全）；直接串在安全回路里，PLC 死机或输出故障时也能切断。
      - card:
          title: 互锁
          body: |
            电动机正反转用两个接触器，它们同时吸合会造成相间短路，所以要互锁，而且要多重互锁：

            - 程序互锁：正转线圈的梯级里串反转输出的常闭触点，反之亦然；
            - 电气互锁：正转接触器线圈回路里串反转接触器的常闭辅助触点，反之亦然。接触器主触点粘住时，程序以为它断开了，只有电气互锁能挡住；
            - 机械互锁：两个接触器之间装机械连杆，一个吸合时另一个推不进去。

            星三角起动的星形和三角形接触器也要同样处理。
      - item:
          id: interlock-why
          type: choice
          prompt: 程序里已经有正反转互锁，为什么还要用接触器的辅助触点做电气互锁？
          options:
            - text: 触点粘住或输出故障时程序互锁挡不住
              correct: true
            - text: 程序互锁会让扫描周期变长
              why: 多一个触点几乎不影响扫描周期，这不是原因
            - text: 程序互锁只在调试时有效
              why: 程序互锁一直有效，但它只管 PLC 的输出信号，管不了接触器本身的故障
            - text: 电气互锁可以代替程序互锁，两者选一个就行
              why: 两者都要有：程序互锁防止误输出，电气互锁防止硬件故障
          explain: 程序只知道它发出的命令，不知道接触器实际的状态。辅助触点反映的是接触器的真实位置，串在对方线圈回路里，硬件故障时也能挡住。
      - card:
          title: 主控继电器和功能安全标准
          body: |
            主控继电器指令（MCR）可以一次停用程序里一个区域的所有输出，常用来在急停后让一段程序的输出全部为 0。但它是程序里的指令，不是安全装置；真正切断输出模块电源的是硬接线的主控继电器。

            机械和过程的安全功能按标准设计和验证：IEC 61508 是通用的功能安全标准，把安全完整性分为 SIL 1–4 四级，SIL 4 最高；机械领域用 IEC 62061（最高 SIL 3）或 ISO 13849-1（性能等级 PL a–e）。风险越大，要求的等级越高，相应地要用冗余通道、诊断和定期测试。
      - item:
          id: mcr-not-safety
          type: choice
          prompt: 程序里的主控继电器指令（MCR）能不能代替硬接线的急停回路？
          options:
            - text: 不能，它依赖程序在运行
              correct: true
            - text: 能，它能一次关掉所有输出
              why: CPU 故障或程序跑飞时这条指令可能根本没有执行，输出照样接通
            - text: 能，只要把它写在程序的第一行
              why: 写在哪里都一样依赖程序在执行
            - text: 能，因为它也叫“继电器”
              why: 它只是一条程序指令，名字沿用了继电器电路的叫法
          explain: 急停要独立于控制器；MCR 指令只是让程序里的输出变为 0，适合做正常的区域控制，不能作为安全措施。

  - id: commissioning
    chapter: 安全联锁
    title: 调试、故障查找和文档
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 新装好的设备第一次通电调试，第一步做什么最稳妥？
          options:
            - text: 断电检查接线，再逐个检查输入输出是否对应正确
              correct: true
            - text: 下载程序，直接按启动看设备能不能转
              why: 接线错误可能让设备误动作甚至损坏，要先确认每个输入输出都接对了
            - text: 先带满负荷试一下最大能力
              why: 带负荷试车是最后一步，前面要先空载、分段检查
          explain: 调试要从安全的一步开始：先查接线和电源，再逐点核对输入输出，然后分段试程序、空载试车，最后才带负荷。
      - card:
          title: 调试
          body: |
            调试按由静到动的顺序进行：

            1. 断电检查：对照接线图核对每根线、测绝缘和通断；
            2. 上电检查：电源电压正确，PLC 指示灯正常；
            3. 输入检查：逐个操作按钮、遮挡传感器，看 PLC 的输入指示灯和在线监视；
            4. 输出检查：在确保安全的前提下逐个强制输出，看对应的执行器是否动作；
            5. 程序试运行：先用仿真，再空载按工序一步步试，最后带负荷。
      - item:
          id: commissioning-order
          type: order
          prompt: 把调试的步骤按先后排好。
          steps:
            - 断电对照图纸检查接线
            - 上电检查电源和 PLC 状态
            - 逐个检查输入信号
            - 逐个检查输出动作
            - 空载试运行程序
            - 带负荷试运行
          explain: 由静到动、由局部到整体，每一步都确认无误再进行下一步，出了问题容易定位。
      - card:
          title: 强制要格外小心
          body: |
            强制（force）是在编程软件里把某个输入或输出直接设为 0 或 1，不管实际信号和程序怎么算。它对检查接线、排查故障很有用，但也很危险：强制一个输出会让执行器直接动作，绕过了程序里的所有联锁；忘了取消的强制会一直起作用。

            所以强制前要确认现场没有人、设备处于安全状态，强制完立即取消，并在交接时检查是否还有强制。
      - item:
          id: force-danger
          type: choice
          prompt: 调试时强制一个输出为 1，最大的风险是什么？
          options:
            - text: 执行器绕过联锁直接动作
              correct: true
            - text: 会损坏 PLC 的输出模块
              why: 强制只是改变输出的状态，在额定范围内不会损坏模块
            - text: 会删除 PLC 里的程序
              why: 强制不改变程序本身
            - text: 没有风险，取消强制就恢复了
              why: 强制期间执行器已经在动作，事故可能在取消之前就发生了
          explain: 强制让执行器直接动作，程序里的互锁对它无效，可能伤人或损坏设备。强制前要确认安全，用完立即取消。
      - card:
          title: 故障查找和文档
          body: |
            设备运行中出故障，先看 PLC 和模块的指示灯、读诊断信息，再在线监视程序：输入指示灯不亮，查传感器和接线；输入正常而输出不动作，看程序里哪个条件没满足；输出指示灯亮而执行器不动，查输出接线、熔断器和执行器本身。查接线时可以用对半分的办法：先测中间点，判断故障在前一半还是后一半，每测一次范围减半。

            好的文档让故障查找快得多：输入输出地址表、接线图、带说明文字的程序、每次修改的版本和备份、操作和维护说明。
      - item:
          id: half-split
          type: number
          prompt: 一条信号线路从传感器到 PLC 被端子分成 64 段，其中某一段断开。用对半分的办法，每次在可疑范围的中间测一下判断故障在哪一半，最多要测几次才能确定是哪一段？
          answer: 6
          unit: 次
          hint: 每测一次，可疑的范围变为原来的几分之几？
          explain: 每测一次范围减半，$2^6 = 64$，最多 6 次。逐段测最坏要 63 次（测完 63 段还没找到，就是最后一段）。
      - item:
          id: fault-locate
          type: choice
          prompt: 按下启动按钮，PLC 的输入指示灯亮了，在线监视看到输出位也变成了 1，输出指示灯也亮，但接触器不吸合。最可能的故障在哪里？
          options:
            - text: 输出端子以后的外部电路
              correct: true
            - text: 启动按钮或它的接线
              why: 输入指示灯亮、程序也收到了信号，按钮这一侧是好的
            - text: PLC 程序里漏写了自锁
              why: 输出位已经变成 1，程序按要求给出了输出
            - text: PLC 的 CPU 坏了
              why: CPU 正常执行了程序并刷新了输出
          explain: 沿着信号的路径找：输入正常、程序正常、输出指示正常，问题就在输出端子之后的外部电路：接线、熔断器或接触器线圈本身。
boss:
  items:
    - id: b-response
      type: number
      prompt: 一台 PLC 扫描周期 15 ms，输入滤波 5 ms，继电器输出动作时间 10 ms。从输入变化到输出触点动作，最长约要多少毫秒？
      answer: 45
      unit: ms
      hint: 最坏情况下输入变化要等多少个扫描周期才反映到输出？
      explain: $5 + 2 \times 15 + 10 = 45$ ms。
    - id: b-siemens-address
      type: number
      prompt: 西门子 PLC 的输入地址从 I0.0 开始，每个字节 8 位依次编号。I2.5 是第几个输入？（I0.0 算第 0 个）
      answer: 21
      hint: 字节 2 之前已经有几个字节？
      explain: 字节 0、1 共 16 位（第 0–15 个），I2.0 是第 16 个，I2.5 是第 21 个。
    - id: b-npn
      type: choice
      prompt: 一个 PNP 型光电开关接到 PLC 的直流输入上，输入模块的公共端应接哪里？
      options:
        - text: 0 V
          correct: true
        - text: +24 V
          why: PNP 传感器导通时把信号线接到 +24 V，公共端也接 +24 V 的话输入点两端没有电压差
        - text: 接哪一端都可以
          why: 公共端决定电流方向，接错了永远读不到信号
        - text: 不用接，传感器的蓝线接 0 V 就形成回路了
          why: 输入电流要从输入点经公共端回到电源，公共端不接就没有回路
      explain: 电流从 +24 V 经传感器内部导通的 PNP 晶体管、信号线、输入点流到公共端，所以公共端接 0 V。
    - id: b-analog
      type: number
      prompt: 一个压力变送器量程 0–6 bar，输出 4–20 mA。PLC 读到 9.6 mA，压力是多少 bar？
      answer: 2.1
      unit: bar
      hint: 9.6 mA 比起点多了多少？
      explain: $(9.6 - 4)/16 \times 6 = 2.1$ bar。
    - id: b-logic
      type: number
      prompt: 一个梯级实现 $Q = A\cdot B' + C$，A、B、C 各取 0 或 1，共 8 种组合。其中有几种组合让 Q = 1？
      answer: 5
      hint: C = 1 时 Q 一定是 1 吗？C = 0 时要满足什么？
      explain: C = 1 的 4 种组合都让 Q = 1；C = 0 时只有 A = 1、B = 0 一种，共 5 种。
    - id: b-latch
      type: choice
      prompt: 启保停梯形图里，现场停止按钮接常闭触点。PLC 运行中停止按钮的导线断了，会怎样？
      options:
        - text: 电动机停下，修好导线前启动不了
          correct: true
        - text: 没有影响，电动机照常运行
          why: 断线让停止输入变为 0，和按下停止按钮一样
        - text: 电动机再也停不下来
          why: 这是停止按钮接常开时断线的后果；接常闭正是为了避免它
        - text: PLC 发现断线，报错并停止运行
          why: PLC 不知道是断线还是有人按了停止，只是停止输入变为 0
      explain: 常闭接法让断线等同于按下停止，设备停在安全状态，这就是故障安全。
    - id: b-timer
      type: number
      prompt: 一个时基为 10 ms 的接通延时定时器要延时 3 s，预设值应写多少？
      answer: 300
      hint: 3 s 里有多少个时基？
      explain: $3/0.01 = 300$。
    - id: b-retentive
      type: number
      prompt: 一个保持型定时器预设时间 10 s。输入在 0–4 s、6–9 s、12 s 以后接通，其余时间断开。输出在第几秒接通？
      answer: 15
      unit: s
      hint: 前两段一共累计了多少？
      explain: 0–4 s 累计 4 s，6–9 s 再累计 3 s，共 7 s；12 s 起再累计 3 s，到 15 s 满 10 s。
    - id: b-counter
      type: number
      prompt: 一个加计数器预设值 12，每来一个瓶子加 1，计满后推出一箱并复位。一天共有 1000 个瓶子经过，推出了几箱完整的箱子？
      answer: 83
      unit: 箱
      hint: 最后不满 12 个的那几个瓶子算一箱吗？
      explain: $1000 = 12 \times 83 + 4$，推出 83 箱，最后 4 个瓶子留在计数器里等下一箱。
    - id: b-sfc
      type: choice
      prompt: 一个检测工位之后，合格品去包装、不合格品去返工，每个工件只走其中一条路。顺序功能图里用什么结构？
      options:
        - text: 选择分支
          correct: true
        - text: 并行分支
          why: 并行分支的几条路同时进行，而这里每个工件只走一条
        - text: 两个互不相关的 SFC
          why: 两条路都从检测工位分出，用一个 SFC 的选择分支表达最清楚
        - text: 单序列，先包装再返工
          why: 合格品不需要返工，单序列会让每个工件都走两遍
      explain: 几条路互相排斥、按条件只走一条，用选择分支；几条路同时进行，用并行分支。
    - id: b-modbus
      type: number
      prompt: Modbus RTU 主站用功能码 03 读一个从站的 6 个保持寄存器。从站应答帧一共多少字节？
      answer: 17
      unit: 字节
      hint: 应答帧由哪几部分组成？
      explain: $1 + 1 + 1 + 6 \times 2 + 2 = 17$ 字节。
    - id: b-scada
      type: choice
      prompt: 下面哪一项最适合交给 SCADA 系统完成？
      options:
        - text: 集中监视分散的泵站并远程启停水泵
          correct: true
        - text: 每 5 ms 根据张力传感器调节卷绕电机的转速
          why: 这么快的闭环要在现场 PLC 或驱动器里完成，不能经过远程通信
        - text: 急停时切断冲床的电源
          why: 急停必须用硬接线的安全回路，不能依赖任何通信和软件
        - text: 在一台包装机旁修改封口温度
          why: 这是设备旁 HMI 的工作
      explain: SCADA 负责地域分散系统的监视、报警、记录和下达设定值；快速控制和安全功能都留在现场。
    - id: b-safety
      type: choice
      prompt: 一台设备的安全门打开时必须停止危险运动。下面哪种做法符合要求？
      options:
        - text: 安全门开关经安全继电器直接切断驱动电源
          correct: true
        - text: 安全门开关接 PLC 普通输入，程序判断门开就停机
          why: 程序或 PLC 故障时停不下来；安全功能要有独立于普通控制的通道
        - text: 在门上贴“打开前请停机”的警示牌
          why: 警示牌只是辅助，不能代替联锁装置
        - text: 门开时用 HMI 弹出报警提醒操作员
          why: 报警只是提醒，不能保证危险运动停止
      explain: 安全联锁要靠专门的安全装置直接切断危险的能量，并能发现自身的故障；普通 PLC 只读取状态做监视。
