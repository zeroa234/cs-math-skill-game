skill: S.1.1
version: 2
authors: [gemini]
brief:
  why: |
    程序能运行，并不意味着它在面对恶意输入、窃密或故障时能守住底线。这一关从零讲起，带你建立计算机安全的基础思维：先明确机密性、完整性、可用性三项目标和纵深防御等基本原则，再拆解身份认证、口令保护与访问控制模型，接着掌握最小权限、完全中介、失效安全默认值与检查时和使用时漏洞，最后用威胁建模、攻击面收缩、定量风险计算与监控响应把安全变成可落地的工程决策。
  outcomes:
    - 准确区分机密性、完整性、可用性及真实性、不可抵赖性，并能用纵深防御与香农准则分析系统薄弱点
    - 区分身份认证与授权，计算口令搜索空间与熵，说明加盐与慢哈希保护口令的原理
    - 对比访问控制矩阵、ACL、能力令牌以及 DAC、MAC、RBAC、ABAC 的适用边界，理解粒度、沙箱与硬件隔离的作用
    - 应用最小权限、职责分离、完全中介、失效安全默认值与可信计算基原则，识别并消除 TOCTTOU 漏洞
    - 用 STRIDE 对真实功能做威胁建模，提出收缩攻击面的具体措施，计算 SLE、ALE 与防护净收益并权衡检测误报与漏报
terms:
  - term: 机密性
    def: '确保敏感信息只被经过授权的主体读取，防止未授权方窃取或推断内容的安全属性'
  - term: 完整性
    def: '确保数据、程序或系统状态在存储和传输过程中不被未授权地篡改或悄然破坏的安全属性'
  - term: 分布式拒绝服务
    def: '简称 DDoS，攻击者控制大量机器同时向目标发请求，把服务堵死，让正常用户用不了'
  - term: 可用性
    def: '确保经过授权的用户在需要时能够按预期及时访问系统与服务的安全属性'
  - term: CIA 三要素
    def: '机密性（Confidentiality）、完整性（Integrity）和可用性（Availability）三项核心安全目标的合称'
  - term: 真实性
    def: '确认数据来源或通信对方确为所声称的实体，而不是伪造或冒充的安全属性'
  - term: 不可抵赖性
    def: '使已发生的操作留下可靠证据，事后行为方无法否认自己曾经执行过该操作的安全属性'
  - term: 可控性
    def: '系统所有者对信息的流向、处理方式以及传播范围保持支配与管理能力的安全属性'
  - term: 安全策略
    def: '明确规定系统应当保护哪些目标、允许和禁止哪些行为的高层规则陈述'
  - term: 安全机制
    def: '为落实安全策略而采用的具体技术手段或工程措施，如加密、访问控制与日志审计'
  - term: 香农准则
    def: '假设攻击者完全了解系统的设计和算法，系统安全性只能依赖保密密钥或受控机制本身的原则'
  - term: 隐匿式安全
    def: '仅靠隐藏系统原理、源码或接口地址来寄希望于攻击者猜不到的脆弱防护思路'
  - term: 纵深防御
    def: '在系统中部署多层相互独立的防护措施，使任意单层失效时其余防线仍能阻挡或延缓攻击'
  - term: 认证
    def: '核实访问者究竟是谁、确认其声称身份属实的过程，回答“你是谁”'
  - term: 授权
    def: '在确认身份之后，依据规则判定该主体可以对哪些资源执行哪些操作的过程，回答“你能做什么”'
  - term: 身份凭证
    def: '用户或程序向系统出示的、用来证明自身身份的材料，如口令、令牌、票据或数字证书'
  - term: 多因素认证
    def: '简称 MFA，要求同时提供两类及以上不同类别的身份证据（所知、所有、固有特征）以完成认证'
  - term: 人的因素
    def: '用户在记忆、习惯、认知负担与便利性上的局限对系统安全产生的直接影响'
  - term: 暴力破解
    def: '针对单个目标账号反复尝试大量候选口令，试图穷举猜中正确口令的攻击方式'
  - term: 密码喷洒
    def: '用极少数常见弱口令依次试探大量不同账号，以绕过单账号连续失败锁定阈值的攻击方式'
  - term: 撞库
    def: '利用某网站泄露的账号和口令组合，批量尝试登录其他网站以利用用户跨站复用的攻击方式'
  - term: 社会工程
    def: '绕过技术防线，利用伪装、诱导或恐吓等心理手段欺骗人员主动交出凭证或执行危险操作'
  - term: 口令熵
    def: '以比特为单位衡量口令难以被猜中程度的指标，等于从均匀候选集合中随机选取时候选总数以 2 为底的对数'
  - term: 密码学哈希
    def: '把任意长度输入映射为固定长度摘要的单向运算，已知输出在计算上几乎无法反推原始输入'
  - term: 彩虹表
    def: '预先计算并压缩存储大量常见明文口令与对应哈希值的查询表，用于加速无盐哈希的离线反查'
  - term: 加盐
    def: '为每个账号单独生成一段随机字符串与口令拼接后再计算哈希，使相同口令也产生不同摘要'
  - term: 慢哈希
    def: '又称密钥派生函数（KDF），通过刻意增加计算迭代次数或存储开销来大幅抬高离线猜解口令成本的哈希算法'
  - term: 主体
    def: '访问控制中发起访问请求的活动实体，通常是用户账户或代其运行的程序'
  - term: 客体
    def: '访问控制中被保护的被动资源，如文件、数据库记录、网络接口或硬件设备'
  - term: 访问控制矩阵
    def: '以主体为行、客体为列，单元格记录该主体对对应客体所拥权限的二维概念模型'
  - term: 访问控制列表
    def: '简称 ACL，按客体分别存放的权限清单，记录哪些主体被允许或拒绝访问该客体'
  - term: 能力令牌
    def: '简称能力（capability），由主体持有、不可伪造的权限凭证，凭它即可对指定客体执行对应操作'
  - term: 自主访问控制
    def: '简称 DAC，允许资源所有者自主决定将读写等权限授予或收回给其他用户的访问控制模型'
  - term: 强制访问控制
    def: '简称 MAC，由系统依据全局安全密级标签强制裁决访问，连资源所有者也不能随意放宽权限的模型'
  - term: 基于角色的访问控制
    def: '简称 RBAC，先把权限绑定到岗位角色，再把用户分配到角色，从而简化大规模权限管理的模型'
  - term: 基于属性的访问控制
    def: '简称 ABAC，根据主体、客体、操作与环境时间地点等多维属性动态判定是否放行的模型'
  - term: 糊涂代理人
    def: '拥有较高权限的程序被低权限请求方诱骗，误用自身权限替对方执行了越权操作的安全缺陷'
  - term: 权限粒度
    def: '访问控制规则能够精确区分的最小资源与操作范围，例如按整台机器、单文件或单条记录授权'
  - term: 沙箱
    def: '把不可信代码限制在受控隔离环境中运行、只开放极少数明确允许资源的防护机制'
  - term: 携带证明的代码
    def: '由代码提供方附带可机械核验的安全证明，接收方在运行前自动验证该代码不会越界或违规的机制'
  - term: 内存
    def: '计算机在程序运行期间用来临时存放指令与数据的电子存储区域，断电后内容消失'
  - term: 进程
    def: '操作系统中正在运行的一个程序实例，拥有自己独立的执行进度与受保护的资源视图'
  - term: 内核
    def: '操作系统的核心程序，负责直接管理硬件、分配内存与裁决其他程序的访问请求'
  - term: 硬件保护
    def: '利用处理器特权分级和内存隔离电路在物理硬件层面阻止普通程序越权改写内核或其他进程数据的机制'
  - term: 权限漂移
    def: '用户因调岗、兼任或临时项目不断累积旧权限却从未回收，导致实际权限远超当前职责的现象'
  - term: 最小权限原则
    def: '只授予用户、程序或服务完成当前本职任务所必需的最少权限，并在任务结束后及时收回'
  - term: 横向移动
    def: '攻击者拿下系统内一个低价值入口后，借助过宽权限或复用凭据向其他服务器与核心数据扩散的过程'
  - term: 即时提权
    def: '简称 JIT，平时不保留高权限，仅在经过审批的短时间窗口内临时授予特权并到期自动撤销的机制'
  - term: 零信任
    def: '假设内外部网络均不可默认信任，对每一次访问请求都持续核验身份、权限与上下文的安全架构思想'
  - term: 职责分离
    def: '把一项敏感操作拆成多个环节并交由不同角色分别执行，防止单个账号或人员独自完成舞弊的原则'
  - term: 完全中介
    def: '要求对受保护资源的每一次访问请求都必须经过权限检查，不因历史结果或缓存而跳过核验的原则'
  - term: 失效安全默认值
    def: '系统在缺少明确授权规则、配置缺失或校验出错时默认拒绝访问，仅在显式允许时才放行的设计原则'
  - term: 可信计算基
    def: '简称 TCB，系统中为强制执行安全策略而必须被信任的全部硬件、固件与软件核心集合'
  - term: 并发
    def: '多个任务或请求在重叠的时间段内交替或同时推进，彼此执行顺序可能交错的运行方式'
  - term: 竞态条件
    def: '程序或系统的正确结果依赖于多个并发操作执行的精确先后时机，一旦时序错乱就会出错的缺陷'
  - term: 检查时与使用时漏洞
    def: '简称 TOCTTOU，程序先检查某项条件再据此执行操作，而攻击者在两次动作的时间间隙修改状态导致的漏洞'
  - term: 路径快捷方式
    def: '简称 symlink，一种本身不存内容、只指向另一个真实文件路径的特殊快捷引用'
  - term: 原子操作
    def: '在执行过程中不可被其他并发请求打断或插入中间状态的单一整体操作'
  - term: 威胁模型
    def: '对系统需要保护的资产、潜在攻击者的能力目标以及防御边界所作的结构化书面刻画'
  - term: 信任边界
    def: '系统中不同信任等级区域之间的分界线，凡跨越此界线传入的数据都必须重新验证'
  - term: STRIDE
    def: '将威胁划分为仿冒、篡改、抵赖、信息泄露、拒绝服务和权限提升六大类的系统化威胁建模方法'
  - term: 可执行文件
    def: '包含可直接由计算机或服务端解释器运行之程序指令的文件，上传后若被触发将导致任意代码执行'
  - term: 攻击面
    def: '系统向外部或低信任区域暴露的、可能被攻击者接触并利用的全部入口、接口、服务与代码总和'
  - term: 基于风险的漏洞优先级排序
    def: '不只看漏洞的严重分，而是综合暴露面、现实可利用性和资产价值，排出修复先后的做法'
  - term: 蜜罐
    def: '刻意部署的仿真诱饵系统或虚假接口，用来吸引攻击者探测、延缓真实目标受袭并及早发出告警'
  - term: 风险偏好
    def: '组织为实现业务目标而在总体上愿意承担的风险类型与大致水平'
  - term: 风险承受能力
    def: '组织针对某项具体资产或业务能够容忍的最大单次或年度损失上限'
  - term: 暴露因子
    def: '简称 EF，单次安全事件发生时对某项资产造成的损失占该资产总价值的比例'
  - term: 单次损失期望
    def: '简称 SLE，一次安全事件发生预计带来的财务损失金额，等于资产价值乘以暴露因子'
  - term: 年发生率
    def: '简称 ARO，某类安全事件预计在一年内发生的平均次数'
  - term: 年度损失期望
    def: '简称 ALE，某项威胁在一年内预计带来的平均财务损失，等于单次损失期望乘以年发生率'
  - term: 残余风险
    def: '在实施选定的安全控制措施之后，系统中仍然保留下来未能消除的那部分风险'
  - term: 审计日志
    def: '系统自动生成的不可轻易修改的操作流水记录，通常记载操作者、时间、来源、动作与结果'
  - term: 误报
    def: '检测系统将原本正常、合法的活动错误判定为安全攻击并发出告警的情况'
  - term: 漏报
    def: '检测系统未能识别真实发生的攻击活动而没有触发告警的情况'

lessons:
  # ============================================================ 机密性/完整性/可用性
  - id: cia-triad
    chapter: 机密性/完整性/可用性
    title: 机密性、完整性与可用性：安全的三个支柱
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 学校食堂的刷卡系统遭到攻击，黑客没有偷看任何消费记录，也没有改动卡内余额，只是用海量虚假请求堵死了刷卡服务器，导致全校午饭时间无法刷卡。这算安全事故吗？
          options:
            - text: 不算，因为没有数据泄露，也没有人损失卡内余额
              why: 即使数据完好且未泄露，让合法用户无法使用服务本身也是严重的安全事故
            - text: 算，因为系统无法在正常时间向合法用户提供服务
              correct: true
            - text: 只有当攻击者顺带修改了学生姓名时，才属于安全事故
              why: 瘫痪服务本身就破坏了安全目标，不需要伴随篡改数据才成立
          explain: 信息安全不只是防偷看和防篡改。让合法用户用不了系统，同样破坏了三大核心安全目标之一。这一课先给安全目标建立清晰的词汇表。
      - card:
          title: 安全不是一个模糊的形容词
          body: |
            说“这个系统很安全”之前，必须先回答“要防什么”。在信息安全领域，最基础的三个核心目标合称 **CIA 三要素（CIA triad）**：

            - **机密性（confidentiality）**：不该看的人看不到。
            - **完整性（integrity）**：数据或程序不被未授权地改动。
            - **可用性（availability）**：该用的人在需要时能正常用上。

            英文首字母 C、I、A 拼成 CIA，和情报机构无关，只是三个词的缩写。
      - card:
          title: 用校园一卡通看懂 CIA 三要素
          body: |
            把三要素落到校园一卡通系统，就能一眼分清边界：

            - 有人未授权偷看学生的消费流水，推算出每天出入食堂和宿舍的轨迹，破坏的是**机密性**。
            - 有人把卡内余额从 50 元悄悄改成 5000 元，或者把一笔消费删掉，破坏的是**完整性**。
            - 有人发起**分布式拒绝服务（DDoS）** 攻击堵死刷卡服务器，让中午排队的同学都刷不了卡，破坏的是**可用性**。

            同一次攻击可能只伤到其中一项，也可能同时破坏多项。
      - item:
          id: q1
          type: match
          prompt: 将校园一卡通系统中的四种事件与它直接破坏的核心安全属性配对。
          pairs:
            - [未授权人员导出全体学生的消费记录并倒卖, 机密性]
            - [攻击者悄悄把某张卡的余额从 20 元改为 2000 元, 完整性]
            - [海量垃圾请求占满刷卡机接口导致全天无法结账, 可用性]
            - [系统误把昨天备份的旧余额覆盖了今天的消费记录, 完整性与数据一致性]
          explain: 泄露消费记录破坏机密性；余额被篡改或被错误覆盖破坏完整性；服务停摆破坏可用性。配对时看“受影响最直接的是保密、准确还是能否正常访问”。
      - card:
          title: 超越 CIA：真实性、不可抵赖性与可控性
          body: |
            实际系统还常需要三个补充属性来配合 CIA：

            - **真实性（authenticity）**：确认消息或命令确实来自它声称的发送方，而不是别人冒充的。
            - **不可抵赖性（non-repudiation）**：操作发生后留下可靠证据，例如带时间戳和用户编号的签名记录，事后对方无法矢口否认。
            - **可控性（controllability）**：系统所有者能够决定数据流向哪里、由谁处理，并在需要时阻断扩散。
      - item:
          id: q2
          type: choice
          prompt: 某医院的电子处方系统遭攻击后，医生发现系统里的处方剂量数据完全准确，病患隐私也没有外泄，但一位值班医生事后否认自己曾签发过某张高危药物处方，而系统日志里没有记录操作者身份。这里最主要缺失的是哪项安全属性？
          options:
            - text: 机密性，因为高危药物信息应当对值班医生隐藏
              why: 题干明确说明病患隐私并未外泄，医生本就需要查阅自己开具的处方
            - text: 可用性，因为医院没能在急诊高峰期保持处方系统在线
              why: 题干中系统正常运行，没有出现宕机或无法访问的问题
            - text: 不可抵赖性，因为系统缺少事后核实操作者的证据
              correct: true
            - text: 完整性，因为处方剂量数字在存储过程中被悄悄放大了
              why: 题干指出处方剂量数据完全准确，没有发生未授权篡改
          explain: 数据既未泄露（机密性完好）也未篡改（完整性完好），服务也在线（可用性完好），问题出在事后无法证明操作确实由该医生发起，即缺失不可抵赖性。
      - card:
          title: 策略与机制：要什么 vs 怎么做
          body: |
            安全工程里必须把两个概念分开：

            - **安全策略（security policy）** 规定“应该达成什么规则”，例如“只有本科教务员可以修改成绩，学生只能查看自己的成绩”。
            - **安全机制（security mechanism）** 是落实规则的具体手段，例如登录验证、数据库权限表和加密通道。

            先写清策略再选机制，才能判断一个机制有没有漏网之鱼；如果策略本身含糊不清，再强的技术机制也守不住正确边界。
      - card:
          title: 例题：拆解一份病历系统的安全需求
          body: 医院准备上线门诊病历查询网站。我们按步骤把口头需求转成明确的安全目标、策略与机制。
          reveal:
            - title: 第 1 步：把担忧对应到 CIA 与补充属性
              body: |
                - 病历被外人看到 -> **机密性**。
                - 过敏史被误改或恶意篡改 -> **完整性**（直接关系用药安全）。
                - 急诊时系统打不开 -> **可用性**。
                - 事后扯皮是谁改了医嘱 -> **不可抵赖性**。
            - title: 第 2 步：写出清晰的安全策略
              body: |
                - 策略 1：患者只能读取本人病历，不能修改。
                - 策略 2：主治医生只能读写本诊室当日挂号患者的病历。
                - 策略 3：任何修改病历的动作必须记下医生编号与时间。
            - title: 第 3 步：为每条策略匹配安全机制
              body: |
                - 用身份认证和查询权限校验落实策略 1、2。
                - 用防篡改的记录日志落实策略 3。
                - 用多机冗余与限流保护急诊查询的可用性。
      - item:
          id: q3
          type: choice
          prompt: 下面哪一项属于“安全策略”，而不是“安全机制”？
          options:
            - text: 对数据库中所有用户手机号字段采用高强度加密算法加密存储
              why: 选用哪种加密算法属于实现手段，是安全机制
            - text: 财务审批单金额超过 5 万元时，必须由两名主管分别同意才能付款
              correct: true
            - text: 在服务器前端部署限流网关，限制单个来源每秒最多发起 20 次请求
              why: 部署限流网关并设定具体参数是落实可用性的技术手段，属于安全机制
            - text: 每天凌晨三点自动把业务数据全量备份到异地只读存储介质
              why: 定时异地备份是保障恢复与可用性的具体操作手段，属于安全机制
          explain: 安全策略描述“允许或禁止什么规则”（超 5 万元须双人同意），不绑定具体技术；加密算法、限流网关、定时备份都是用来落实策略的安全机制。
      - item:
          id: q4
          type: choice
          multi: true
          prompt: 某在线考试系统在开考前遭遇勒索软件加密了题库服务器，同时勒索方把试题内容打包发到公开论坛并要求赎金。这次事件同时破坏了哪些核心安全属性？（多选）
          options:
            - text: 机密性
              correct: true
            - text: 可用性
              correct: true
            - text: 完整性
              correct: true
            - text: 不可抵赖性
              why: 不可抵赖性关注事后无法否认自己执行过某操作，此次勒索加密并公开题库直接击穿的是机密性、完整性与可用性
          explain: 试题被发到公开论坛破坏了机密性；原题库文件被未授权加密覆写破坏了完整性；考前无法正常读取试题开考破坏了可用性。一次勒索攻击常常同时击穿 CIA 全部三项。

  - id: security-design-principles
    chapter: 机密性/完整性/可用性
    title: 纵深防御、香农准则与从一开始设计安全
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一位开发者自己发明了一套“把每个字母往后挪 7 位”的加密办法，并且坚持把源码藏在私有仓库里不让外人看。你认为只要没人看到源码，这套办法就足够安全吗？
          options:
            - text: 足够安全，因为攻击者看不到源码就无从猜出移位规则
              why: 只要截获少量密文或通过反复试验，就能很快推导出移位规律，藏源码只是拖延时间
            - text: 不够安全，一旦规则被猜出或泄露，整套保护立刻失效
              correct: true
            - text: 只要把移位数从 7 改成 13，藏好源码就能抵挡专业攻击者
              why: 移位规律本身非常简单，换一个固定常数依然容易被频率统计或穷举破解
          explain: 靠“别人不知道我怎么做的”来维持安全非常脆弱。真正可靠的设计假设对手已经看懂全部图纸，依然攻不破。
      - card:
          title: 香农准则：假设对手知道你的系统
          body: |
            信息论先驱克劳德·香农提出过一条经典原则——**香农准则（Shannon's Maxim）**：敌人了解你的系统。

            也就是说，设计安全系统时，不要假设攻击者不知道你的算法、架构或协议细节。安全性应该只依赖**保密的密钥**或**受控的验证机制**，而不是靠把系统原理藏起来。

            反面做法叫**隐匿式安全（security by obscurity）**，例如把管理员入口藏在一个没人知道的怪名字路径下却不设登录验证。路径一旦在日志或截图里泄露，系统立刻门户大开。
      - card:
          title: 纵深防御：不把全部身家押在一道门上
          body: |
            哪怕设计很严谨，任何单一防线都可能出现漏洞或配置失误。**纵深防御（defense in depth）** 要求布置多层**相互独立**的防护：

            - 外层有网络防火墙过滤非法流量；
            - 中层有应用程序检查用户身份和输入格式；
            - 内层有数据库只开放必需的读写权限并加密敏感列。

            这样即使外层被绕过，攻击者仍要面对下一层完全不同的防线，而不是长驱直入。
      - item:
          id: q1
          type: choice
          prompt: 下面哪种做法违背了香农准则，属于典型的“隐匿式安全”？
          options:
            - text: 采用公开经过同行评审的标准加密算法，并妥善保管随机密钥
              why: 算法公开、仅保密密钥正是香农准则倡导的做法
            - text: 把管理后台藏在生僻网址路径下，并以此替代登录身份认证
              correct: true
            - text: 在已启用强身份认证的基础上，把后台入口限制为仅内网可访问
              why: 这属于在强认证之外叠加网络层隔离，是纵深防御与收缩暴露面，并非用隐藏替代认证
            - text: 将核心库源码公开接受外部安全审计，并及时修复报告的缺陷
              why: 公开源码接受审查并修复缺陷，完全符合香农准则
          explain: 香农准则反对把“对方猜不到路径或算法”当作唯一防线。隐藏管理路径可以减少垃圾扫描噪音，但绝不能替代身份认证。
      - card:
          title: 例题：为什么多层防线必须“相互独立”
          body: 看看两道防线独立工作与共享弱点时，被同时击穿的概率差别有多大。
          reveal:
            - title: 第 1 步：独立两层防线的联合失效率
              body: |
                假设外层防火墙拦下 $90\%$ 的攻击（失效率 $p_1 = 0.10$），内层应用校验独立拦下 $80\%$ 的漏网攻击（失效率 $p_2 = 0.20$）。

                攻击者同时穿过两层的概率是：

                $$p_{\text{joint}} = 0.10 \times 0.20 = 0.02 = 2\%$$

                整体拦截率从 $90\%$ 提升到了 $98\%$。
            - title: 第 2 步：共享同一弱点时会发生什么
              body: |
                如果两层防线都依赖同一个口令验证服务，一旦该服务被攻破（概率 $0.10$），两层会**同时**失效。此时联合失效率退回 $0.10$，纵深防御名存实亡。
      - item:
          id: q2
          type: number
          prompt: 某系统设置了三道相互独立的防线：第 1 层失效率为 0.1，第 2 层失效率为 0.2，第 3 层失效率为 0.5。攻击者连续突破全部三道防线的概率是多少？（填小数，如 0.05）
          answer: 0.01
          tolerance: 0.0001
          hint: 三道防线相互独立，连续突破的概率等于三层失效率相乘。
          explain: 独立事件同时发生的概率相乘：$0.1 \times 0.2 \times 0.5 = 0.01$（即 1%）。前提是三道防线采用不同机制、不共享同一个单点弱点。
      - card:
          title: 从一开始就把安全融进设计
          body: |
            很多团队习惯先把功能写完上线，等出了安全事故再“加一层防护”。这种事后打补丁的做法往往代价高昂且漏洞百出：

            - 旧架构里可能把管理员和普通用户的逻辑搅在一起，事后拆分牵一发动全身；
            - 补丁只能堵住已经暴露的入口，容易漏掉其他绕过路径。

            **从设计之初融入安全（design security in from the start）** 要求在画架构图时就定好安全策略、信任边界与权限隔离，而不是把安全当成上线前的装饰品。
      - item:
          id: q3
          type: choice
          prompt: 为什么工程实践强调“从设计之初融入安全”，而不建议等全部功能开发完再统一加安全补丁？
          options:
            - text: 功能上线后往往难以复现真实攻击流量，无法定位安全需求
              why: 根本困难不是缺少攻击流量，而是架构定型后权限与数据流已经高度耦合
            - text: 架构定型后逻辑高度耦合，事后打补丁既改造成本高又易漏掉绕过入口
              correct: true
            - text: 只要在设计阶段完成了安全架构评审，上线后就不再需要任何安全补丁
              why: 事前设计能消除结构性缺陷，但系统演进中仍需持续检测与漏洞修补
            - text: 事后添加的防护代码只能覆盖前端界面，无法在后端数据库层生效
              why: 后端也能打补丁，问题在于局部修补很难根治早期架构留下的信任边界混乱
          explain: 架构早期决定权限隔离和数据流边界的成本最低；如果等几十个功能都直接拼接数据库语句后再补救，改造成本成倍上升，且极易留下遗漏入口。
      - item:
          id: q4
          type: choice
          prompt: 一家公司为保护核心财务系统，在网页端、手机端和后台网关三处都只检查同一个写死在代码里的固定令牌，并宣称自己做到了“纵深防御”。以下评价最准确的是哪一项？
          options:
            - text: 符合纵深防御，因为系统在三个不同位置重复校验了三次
              why: 重复检查同一个易泄露的固定令牌不构成独立防线，令牌一旦外泄三处同时失守
            - text: 不符合纵深防御，因为三处共享同一弱点，固定令牌泄露后三层会同时失守
              correct: true
            - text: 只要把固定令牌的长度加倍，三处共用同一令牌就能满足纵深防御
              why: 令牌再长，只要硬编码在客户端代码里并被三处共用，逆向查看一次即可全部击穿
            - text: 符合香农准则，因为客户端校验逻辑对所有开发者都是公开透明的
              why: 硬编码在客户端里的固定密钥容易被提取，且完全不依赖独立多层机制
          explain: 纵深防御的关键是各层机制相互独立；三处共用同一个硬编码令牌属于共享单点故障，不是纵深防御。

  # ============================================================ 认证授权
  - id: authn-and-mfa
    chapter: 认证授权
    title: 身份认证与多因素验证
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你走进公司大楼，先在前台刷工牌确认你是员工小张，接着去财务室门口刷卡却被门禁拒绝，因为研发人员不能进财务室。这两次刷卡检查的是同一件事吗？
          options:
            - text: 是同一件事，都是看工牌有没有消磁损坏
              why: 门禁不仅认出你的身份，还要核对你的身份有没有资格进入某个房间
            - text: 不是，第一次确认“你是谁”，第二次确认“你能进哪里”
              correct: true
            - text: 不是，第一次检查卡片余额，第二次检查上下班考勤
              why: 门禁场景不涉及消费余额，核心区别在于身份核实与权限裁决
          explain: 辨认身份和裁决权限是两个紧密衔接但完全不同的步骤。分清它们，后面看懂登录和访问控制才不会混淆。
      - card:
          title: 认证回答“你是谁”，授权回答“你能做什么”
          body: |
            安全系统处理一次访问时，通常会按顺序经过两关：

            1. **认证（authentication）**：核实对方究竟是谁。用户出示口令、手机验证码或指纹等**身份凭证（credential）**，系统确认它确实属于所声称的账号。
            2. **授权（authorization）**：在身份确认之后，查询规则决定这个账号可以读、写或执行哪些资源。

            现实中还需要**双向认证**思维：不仅服务器要认证用户，用户端（例如浏览器通过网站证书）也要认证服务器，防止误把口令交给了假冒网站。
      - card:
          title: 多因素认证的三类证据
          body: |
            只靠口令（一条证据）时，一旦口令泄露，账号立刻失守。**多因素认证（MFA，multi-factor authentication）** 要求同时出示至少两类**不同类别**的证据：

            | 类别 | 英文简称 | 常见例子 |
            |---|---|---|
            | 你知道的 | Something you know | 口令、**个人识别码（PIN）**、密保答案 |
            | 你拥有的 | Something you have | 手机动态口令器、硬件安全密钥、实体门禁卡 |
            | 你本身的特征 | Something you are | 指纹、人脸、虹膜等生物特征 |

            注意：同时输入“登录口令 + 密保问题”都是“你知道的”，只算单因素，不算真正的多因素认证。
      - item:
          id: q1
          type: choice
          prompt: 某网银要求用户在转账时同时输入“登录口令”和“6 位数字支付密码”。从多因素认证的分类来看，这种组合属于什么？
          options:
            - text: 双因素认证，因为用户需要分别记住两个长度不同的密码
              why: 多因素强调的是证据类别不同，而不是同一类证据的个数叠加
            - text: 仍属于单因素认证，因为两项都属于“你知道的”同一类证据
              correct: true
            - text: 三因素认证，因为口令、支付密码加上账号名共有三项信息
              why: 账号名通常是公开标识符而非秘密因素，且两个密码同属“你知道的”类别
            - text: 属于“你拥有的”加“你知道的”组合，因为支付密码绑定了银行卡
              why: 只要用户仅凭记忆输入数字而无需出示实体卡片或动态令牌，就仍属于“你知道的”
          explain: 登录口令和支付密码都属于“你知道的”这一类因素。一旦攻击者通过键盘记录或钓鱼页面同时骗走两者，认证就被绕过了；只有结合手机动态令牌或硬件密钥等不同类别因素，才构成多因素认证。
      - item:
          id: q2
          type: match
          prompt: 把下面的日常操作分别归类为“认证”“授权”或“多因素认证”。
          pairs:
            - [输入账号和正确口令登录校园网, 认证]
            - [登录后系统检查该账号是否为管理员，拒绝其进入删库页面, 授权]
            - [登录时先输口令，再插入实体硬件安全密钥按一下确认, 多因素认证]
            - [浏览器校验网站数字证书确认自己连上的是真银行, 认证对方服务器（确认连上的是真网站）]
          explain: 核实用户或服务器身份都属于认证；核对已认证账号能否执行操作属于授权；把口令（所知）和实体安全密钥（所有）结合属于多因素认证。
      - card:
          title: 企业网络里的两种经典认证思路
          body: |
            当一家公司有几十台内部服务器时，不可能在每台机器上都存一份员工口令。工程上常见两种集中认证思路：

            - **票据式认证（如 Kerberos）**：员工先向统一的认证中心证明身份，换回一张带有效期的加密“门票”（票据），之后凭票据直接访问各台内部服务，不必到处重复发口令。
            - **公钥基础设施（PKI）与数字证书**：由受信任的证书机构给服务器或用户签发电子“身份证”（数字证书）。证书机构用只有自己掌握的私钥签名，任何人用它公开的密钥都能核对签名，验证双方不必事先共享秘密，也不需要集中存放口令的数据库。
      - item:
          id: q3
          type: choice
          prompt: 某软件系统让实习生用自己的账号成功登录了后台，却没有检查该账号的角色，直接允许他导出了全公司薪酬表。这里出问题的是哪个环节？
          options:
            - text: 认证环节失效，因为系统没能准确识别出登录者是实习生本人
              why: 实习生是用自己的合法账号登录的，系统准确识别了他是谁
            - text: 授权环节缺失，因为系统未校验该实习生角色是否有权导出薪酬表
              correct: true
            - text: 多因素认证缺失，只要登录时加上短信验证码就能阻止他导出数据
              why: 即使加上短信验证码，实习生依然能通过认证；不补授权检查他还是能导出薪酬表
            - text: 不可抵赖性不足，只要记录了导出操作的审计日志就能拦住越权导出
              why: 审计日志用于事后追责和检测，不能替代事前的授权拦截
          explain: 认证只确认“你是实习生小李”，并不能自动阻止你做不该做的事。拦截越权操作必须依靠授权检查。
      - item:
          id: q4
          type: choice
          prompt: 为什么在有上百台内部服务器的企业里，采用 Kerberos 这类票据式集中认证比“每台服务器各存一份员工口令”更安全？
          options:
            - text: 票据签发后永久有效，能减少员工登录时的网络通信次数
              why: 票据带有较短的有效期，而且员工离职时只需在中央认证中心停用账号即可阻止续票
            - text: 各业务服务器无需保存员工口令副本，能缩小凭据泄露面并便于集中撤销
              correct: true
            - text: 票据式认证完全离线运行，不需要中央认证服务器参与签发
              why: 获取初始票据和服务票据需要与认证中心通信，并非脱离中央认证服务运行
            - text: 只要持有有效票据，各业务服务器就无需再对员工做单独的授权检查
              why: 认证票据只证明身份，具体能做什么仍由各服务的授权规则单独限制
          explain: 把口令集中保管在专门加固的认证中心，业务服务器只验票据不存口令，既方便统一停用离职账号，也避免了任意一台边缘服务器失陷就泄露全员口令。

  - id: password-psychology-and-systems
    chapter: 认证授权
    title: 口令为什么难管：心理学、暴力破解与系统隐患
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 某公司要求员工每 30 天必须换一次 12 位以上、包含大小写字母和特殊符号的复杂密码，且不能重复最近 10 次。猜猜长期执行后，员工最常做出什么反应？
          options:
            - text: 每月牢记一串完全随机的 12 位密码，从不写下来
              why: 人类工作记忆很难记住大量无意义的随机字符，频繁更换会远超记忆负荷
            - text: 在旧密码末尾按月改数字，或把密码写在便利贴上贴在显示器边
              correct: true
            - text: 主动把密码拉长到 30 位随机字符以进一步提高安全性
              why: 过高的记忆负担反而会迫使人寻找最省力的敷衍方式，而不是主动增加复杂度
          explain: 安全规则如果和人类记忆规律对着干，用户就会想办法绕过规则。设计认证机制时，必须把人的行为纳入考虑。
      - card:
          title: 考虑人的因素：为什么强迫复杂规则常适得其反
          body: |
            安全设计有一条核心准则：必须考虑**人的因素（human factors）**。人类大脑擅长记住有画面感的故事和词语，却极不擅长记忆几十个互不相同的随机字符串。

            当网站提出严苛又反直觉的口令要求（例如每月强行更换）时，会出现三个常见后果：

            - 用户用极有规律的套路应付（如 `Spring2026!` 改成 `Summer2026!`）；
            - 用户把密码抄在纸条或明文记事本里；
            - 用户把同一个好记的密码在几十个网站反复使用，导致一家小网站数据泄露后，攻击者拿这份清单去批量登录银行和邮箱——这就是**撞库（credential stuffing）**。
      - card:
          title: 暴力破解、密码喷洒与社会工程
          body: |
            攻击者拿到账号口令，除了撞库，还常用三种手法：

            - **暴力破解（brute-force attack）**：盯住某一个账号，连续尝试成千上万个候选口令。
            - **密码喷洒（password spraying）**：反过来，只选一两个最常见的弱口令（如 `123456`、`Welcome1`），依次向几千个不同账号各试一次。因为每个账号只失败 1 次，不会触发“连续输错 5 次就锁定”的规则。
            - **社会工程（social engineering）**：不硬猜，而是发一封伪装成 IT 部门的钓鱼邮件，直接骗用户自己输入口令。
      - item:
          id: q1
          type: choice
          prompt: 运维人员查看登录日志，发现同一来源网段在 3 分钟内依次尝试了 200 个不同的员工用户名，每个用户名只失败了 1 次，且全都没有触发单账号的“5 次错误锁定”。这最符合哪种攻击特征？
          options:
            - text: 针对单个高管的暴力破解
              why: 单账号暴力破解会在同一个用户名上产生密集的连续失败记录，很快触发单账号锁定
            - text: 密码喷洒
              correct: true
            - text: 社会工程钓鱼
              why: 社会工程是欺骗受害者主动输入真实口令，通常表现为直接登录成功而非批量试探 200 个账号失败
            - text: 隐匿式安全测试
              why: 隐匿式安全是一种脆弱的防守思路，不是批量试探口令的攻击方式
          explain: 用极少数常见口令横向扫射大量不同账号、借此避开单账号失败锁定阈值，正是密码喷洒的典型日志模式。
      - card:
          title: 用口令熵衡量“有多难猜”
          body: |
            如果攻击者知道口令的生成规则，把所有可能口令排成一张表，表里总共有 $N$ 种可能。**口令熵（password entropy）** 用来衡量这个搜索空间有多大：

            $$H = \log_2(N)\text{ 比特}$$

            每多 1 比特熵，搜索空间就翻一倍。注意：上面的公式只在**等概率随机选取**时成立；如果人偏爱生日和键盘顺序（如 `qwerty`），实际有效熵会远远低于理论上限。
      - card:
          title: 例题：为什么 4 个随机词比 8 位随机小写字母更强更好记
          body: 对比四种随机口令的搜索空间和口令熵，看看“长度”为什么比“怪符号”更有效。
          reveal:
            - title: 第 1 步：4 位与 6 位数字 PIN
              body: |
                每位有 $10$ 种数字：
                - 4 位数字：$N = 10^4 = 10{,}000$，熵 $\log_2(10^4) \approx 13.29$ 比特。
                - 6 位数字：$N = 10^6 = 1{,}000{,}000$，熵 $\log_2(10^6) \approx 19.93$ 比特。
            - title: 第 2 步：8 位随机小写英文字母
              body: |
                每位 $26$ 种字母，共 $N = 26^8 = 208{,}827{,}064{,}576 \approx 2.09 \times 10^{11}$ 种可能。

                $$\log_2(26^8) = 8 \times \log_2(26) \approx 37.60\text{ 比特}$$

                8 位毫无规律的小写字母（如 `xkqmrvtp`）已经很难记了。
            - title: 第 3 步：从 2048 个常用词里独立随机选 4 个词
              body: |
                因为 $2048 = 2^{11}$，4 个随机词的组合总数是：

                $$N = 2048^4 = (2^{11})^4 = 2^{44} = 17{,}592{,}186{,}044{,}416$$

                熵正好是 $44$ 比特，搜索空间是 8 位随机小写字母的 $84$ 倍，而像 `lantern-river-pencil-cloud` 这样的词组比乱码好记得多。
      - item:
          id: q2
          type: number
          prompt: 从包含 1024 个单词的词表中独立随机选取 4 个单词拼成口令（允许重复）。已知 $1024 = 2^{10}$，这个口令的理论口令熵是多少比特？
          answer: 40
          unit: 比特
          hint: 先写出组合总数 $N = (2^{10})^4$，再取 $\log_2(N)$。
          explain: 每个词提供 $\log_2(1024) = 10$ 比特熵，4 个独立随机词一共提供 $4 \times 10 = 40$ 比特熵（共 $2^{40}$ 种组合）。
      - card:
          title: 系统层面的口令隐患
          body: |
            就算用户选出了高熵口令，系统实现不当也会让它很快暴露（这些属于系统层面隐患）：

            - **输入与传输泄露**：公共电脑上的键盘记录程序、背后肩窥、未加密网络传输，或者网页代码失误把口令打进了服务器日志。
            - **默认口令与弱找回流程**：设备出厂带 `admin/admin` 从未修改；或者登录口令很强，但“忘记密码”只靠“你小学叫什么”就能重置，攻击者绕道最薄弱环节即可接管账号。
            - **缺少在线速率限制**：如果登录接口每秒允许提交上万次尝试，4 位数字验证码（$10^4$ 种）约 1 秒就能试完，6 位（$10^6$ 种）最多也只要 100 秒。
      - item:
          id: q3
          type: number
          prompt: 某设备的在线解锁接口限制每分钟最多尝试 5 次。如果设备使用 4 位十进制数字 PIN（共 10000 种可能），攻击者在最坏情况下最多需要多少分钟才能试遍所有可能？
          answer: 2000
          unit: 分钟
          hint: 用全部组合数除以每分钟最多尝试的次数。
          explain: $10{,}000 \div 5 = 2{,}000$ 分钟（平均约一半，即 1000 分钟，约 16.7 小时）。提高在线尝试间隔或引入指数退避能大幅拖慢在线猜解。
      - item:
          id: q4
          type: choice
          prompt: 某网站强制用户设置 16 位高熵随机密码，但在“忘记密码”页面里，只要答对“你的出生城市”和“你的母校名称”就可以直接设置新密码。这个设计最大的问题是什么？
          options:
            - text: 16 位随机密码过长，会大幅增加后台慢哈希校验的服务器开销
              why: 16 位长度对现代服务器存储与单次校验开销微乎其微，不是安全瓶颈
            - text: 找回通道远弱于登录口令，攻击者可直接绕过强密码从密保接管账号
              correct: true
            - text: 两个密保问题属于“你知道的”因素，但缺少与登录口令相同的字数要求
              why: 问题不只在字数，而在于出生城市和母校是公开可查的静态事实，本身熵极低
            - text: 只要在找回页面加上图形验证码，就能把这两个密保问题提升到同等强度
              why: 图形验证码只能防自动化脚本，防不住攻击者从社交主页查出答案后手工填写
          explain: 系统的整体强度取决于最薄弱的入口。社交平台公开信息常能查到出生城市和母校，把重置权交给这类低熵密保问题会让 16 位强密码形同虚设。

  - id: password-protection
    chapter: 认证授权
    title: 怎样安全地存口令：哈希、加盐与慢哈希
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 网站后台需要核对用户登录时输入的口令对不对。你觉得数据库里应该直接把用户的原始口令原封不动存起来吗？
          options:
            - text: 应该直接存原始口令，不然登录时没法比较一不一样
              why: 一旦数据库被拖库或备份泄露，全站用户的真实口令就会一览无余，甚至波及他们在其他网站的账号
            - text: 不应该，可以只存一种无法反推原文的“指纹”，登录时比对指纹
              correct: true
            - text: 只要把数据库表改个生僻的名字，直接存原始口令就没有风险
              why: 改表名属于隐匿式安全，攻击者拿到数据库读取权限后能直接列出所有表名
          explain: 验证口令并不需要系统知道原文是什么，只要能把输入经过单向变换后和存下的摘要比对即可。这正是密码学哈希的用武之地。
      - card:
          title: 密码学哈希：能正向算，几乎不能倒推
          body: |
            **密码学哈希（cryptographic hash）** 是一类特殊的单向运算（常见如 **SHA-256**）：

            - 给它任意一段文字，它总能快速算出一段固定长度的“数字指纹”（摘要）；
            - 原文哪怕只改一个字符，输出指纹也会面目全非；
            - 最关键的是**单向性**：只看指纹，在计算上几乎不可能倒推出原始口令。

            这样数据库只存 `哈希(口令)`。用户登录时，服务器把刚输入的口令再算一次哈希，和库里存的摘要一致就放行。即使数据库被窃取，攻击者看到的也只是一堆摘要。
      - card:
          title: 裸哈希的两个漏洞：同口令碰撞与彩虹表
          body: |
            只存 `SHA-256(口令)` 还远远不够，攻击者偷到哈希库后可以离线慢慢猜，并利用两个弱点：

            1. **相同口令摘要完全一样**：如果小王和小李都用 `"sunset42"`，库里两人的摘要一模一样。攻击者猜出一人，所有同口令用户瞬间全军覆没。
            2. 预计算表与**彩虹表（rainbow table）**：攻击者提前把几亿个常见口令的 SHA-256 算好存成查表结构，拿到哈希库直接查表即可还原弱口令。
      - item:
          id: q1
          type: choice
          prompt: 某系统把所有用户的口令直接用 SHA-256 计算后存入数据库，没有做任何额外处理。数据库泄露后，攻击者立刻发现有 43 名用户的摘要完全相同。这一现象最直接地说明了什么问题？
          options:
            - text: SHA-256 发生了算法崩溃，把 43 个不同口令算成了同一个值
              why: SHA-256 碰撞极难在偶然情况下出现，相同摘要说明原始口令本身相同
            - text: 这 43 名用户使用了相同的弱口令，且未加盐导致一破全破
              correct: true
            - text: 数据库在写入摘要时发生了网络丢包，导致同一行被复制了 43 次
              why: 43 名不同账号出现相同摘要是无盐哈希对相同明文确定性输出的直接结果
            - text: 这说明必须改用双向加密存储口令，才能区分不同用户的口令
              why: 双向加密一旦密钥泄露同样全部暴露，正确解法是在单向哈希前为每人加独立随机盐
          explain: 确定性无盐哈希遇到相同口令必然输出相同摘要，这让攻击者一眼识别出高频弱口令，并用彩虹表一次性批量破解。
      - card:
          title: 加盐与慢哈希：把离线猜解成本抬高十万倍
          body: |
            补上裸哈希的短板，工程上必须同时做两件事：

            - **加盐（salt）**：给每个用户单独生成随机字符串，把 `盐 + 口令` 拼在一起再算哈希，盐明文存在该用户记录旁。即便两人都用 `"sunset42"`，摘要也毫无关联，通用彩虹表失效。
            - **慢哈希（密钥派生函数，KDF）**：SHA-256 算得太快，**显卡（GPU）** 每秒可试几十亿次。存口令须改用 Argon2id、bcrypt 等故意拖慢单次计算到约 0.1 秒的算法，正常登录无感，离线猜解却慢成千上万倍。
      - card:
          title: 例题：快哈希 vs 慢哈希的离线破解耗时
          body: 假设某数据库被窃取，攻击者需要测试 $10^{10}$（100 亿）个候选口令。对比两种存储方案在离线攻击下的耗时差距。
          reveal:
            - title: 第 1 步：用普通快速哈希（如 SHA-256）
              body: |
                攻击者租用显卡阵列，每秒能算 $10^9$ 次哈希。试遍全部 $10^{10}$ 个候选只需：

                $$\frac{10^{10}}{10^9\text{ 次/秒}} = 10\text{ 秒}$$
            - title: 第 2 步：换用带加盐的慢哈希（KDF）
              body: |
                改用故意算得很慢的哈希（如 bcrypt、Argon2id：算一次要花的计算量可以调大，Argon2id 还能要求同时占用大量存储空间）后，同一套攻击硬件每秒只能试 $10^4$ 次。同样试遍 $10^{10}$ 个候选需要：

                $$\frac{10^{10}}{10^4\text{ 次/秒}} = 10^6\text{ 秒} \approx 11.57\text{ 天}$$

                攻击速度下降了 $10^5$ 倍，给防御方和用户赢得了宝贵的响应与改密窗口。
      - item:
          id: q2
          type: number
          prompt: 攻击者窃取了口令哈希库，计划穷举一份包含 6,000,000 个候选口令的词表。若数据库采用慢哈希后，攻击者的离线尝试速度被压低到每秒 500 次，试遍这份词表在最坏情况下需要多少秒？
          answer: 12000
          unit: 秒
          hint: 用候选总数除以每秒尝试次数即可得到最坏情况耗时。
          explain: $6{,}000{,}000 \div 500 = 12{,}000$ 秒（约 3.33 小时）。如果原本用快速哈希每秒能试 1,000,000 次，则仅需 6 秒，慢哈希将成本放大了 2000 倍。
      - item:
          id: q3
          type: choice
          prompt: 关于口令存储中的“盐（salt）”，下面哪一种说法是正确的？
          options:
            - text: 全站共用一段写死在代码里的长随机字符串作盐，便于统一管理
              why: 全站共用同一个盐无法隐藏相同口令的碰撞，攻击者只需针对这一个盐重算一次表即可
            - text: 每个用户的盐必须保密存放，绝不能和哈希摘要存在同一张表里
              why: 盐的作用是确保唯一性而非充当秘密密钥，明文存放在对应用户记录旁完全合法且安全
            - text: 每个用户分配独立随机盐并可明文保存，用来挫败彩虹表与同口令碰撞
              correct: true
            - text: 只要加了足够长的随机盐，继续用普通快速哈希也能挡住离线暴力破解
              why: 加盐能防彩虹表和同口令碰撞，但挡不住攻击者针对单个用户用显卡高速逐一试探，仍需慢哈希
          explain: 盐必须是“每用户独立、随机生成”，明文保存无妨；它解决预计算表和相同口令碰撞，再配合慢哈希（KDF）才能拖慢针对单用户的离线暴力破解。
      - item:
          id: q4
          type: choice
          prompt: 某网站为了防在线暴力破解，规定“只要某账号连续输错 3 次密码，就永久冻结该账号，必须寄纸质身份证复印件才能解冻”。这一策略带来了什么新风险？
          options:
            - text: 会破坏机密性，因为攻击者能从冻结提示里推断出用户的真实口令
              why: 锁定提示不会泄露口令本身，主要伤害落在合法用户的正常使用上
            - text: 会破坏可用性，攻击者可故意替他人输错三次密码来恶意冻结目标账号
              correct: true
            - text: 会削弱完整性，因为频繁冻结操作容易让数据库里的口令哈希被改写
              why: 在线锁定状态标记与离线口令哈希存储相互独立，不会篡改口令摘要
            - text: 会让离线彩虹表重新生效，使原本为每个账号配置的独立随机盐失效
              why: 彩虹表用于离线攻击哈希库，与在线登录失败后的冻结策略无关
          explain: 在线防爆破需要平衡安全与可用性。过于激进的永久锁定会被攻击者反过来当成拒绝服务工具；工程上更常用逐步拉长等待时间（指数退避）、临时短锁、人机校验与多因素认证的组合。

  - id: access-control-models
    chapter: 认证授权
    title: 访问控制模型：矩阵、ACL、能力与角色
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一家公司有 500 名员工和 2000 份文件。如果每次新招一名财务专员，管理员都要手动去翻开 2000 份文件逐一勾上她的名字，你觉得管理起来会怎样？
          options:
            - text: 很清晰，因为每份文件都只记录单个员工姓名，不会出错
              why: 500 人配 2000 份文件就是一百万个格子，手工逐个勾选既低效又极易漏改或错给
            - text: 极易遗漏和出错，最好先定义“财务专员”这类角色统一打包权限
              correct: true
            - text: 让每位员工自己决定把哪些文件分享给新同事，管理员不用再管
              why: 权限分散到 500 个人手里，没人知道一份文件到底谁能看，离职和转岗时也收不回来
          explain: 怎么组织“谁能对哪个资源做什么”的规则，是访问控制的核心设计题。这一课从概念模型一直讲到现实系统常用的实现方式。
      - card:
          title: 主体、客体与访问控制矩阵
          body: |
            访问控制只关心三个要素：发起请求的**主体（subject）**（如用户或代表用户运行的程序）、被保护的**客体（object）**（如文件、数据表或设备），以及允许的操作（读、写、执行等）。

            把所有主体排成行、所有客体排成列，格子里填允许的操作，就得到**访问控制矩阵（access control matrix）**：

            | 主体 \ 客体 | 成绩单.csv | 公告.txt | 备份脚本 |
            |---|---|---|---|
            | 教务员 | 读、写 | 读、写 | 读、执行 |
            | 学生 | 读 | 读 | 无 |
            | 访客 | 无 | 读 | 无 |

            矩阵适合用来思考和审查，但真实系统里有成千上万主体和数百万文件，直接存整张表会稀疏又庞大，因此操作系统往往按列或按行拆分保存。
      - card:
          title: 按列拆是 ACL，按行拆是能力令牌
          body: |
            把访问控制矩阵拆开，有两种经典实现：

            - **访问控制列表（ACL，Access Control List）**（按列存）：每个客体自带门卫名单，记录哪些主体能做什么。优点是容易查清谁能动该资源，也容易一键撤销某人的权限。
            - **能力令牌（capability）**（按行存）：每个主体持有系统签发、不可伪造的“钥匙”。优点是方便把某项细小权限转交给协助程序，缺点是发出去后很难全局清点副本并统一收回。
      - item:
          id: q1
          type: choice
          prompt: 一名员工今天突然离职，安全管理员希望立刻查清“公司核心客户表到底有哪些人能读取”并把该员工一键移除。在 ACL 与能力令牌两种实现中，哪一种天然更擅长完成这项操作？
          options:
            - text: 能力令牌，因为每名员工手里都单独保存着自己的权限钥匙
              why: 钥匙分散在各个主体手中甚至可能被转交，清点“谁能访问某资源”和全局撤销都很困难
            - text: ACL，因为权限名单集中保存在客户表旁，便于盘点访客与一键撤销
              correct: true
            - text: 两者效率相同，都只需修改离职员工自己的账号记录即可完成反向审计
              why: 两种结构在“按资源查主体”与“按主体查资源”的代价上正好相反
            - text: 两者都不支持单独撤销某人权限，只能把客户表迁移到新路径重建
              why: ACL 可以直接从该资源的权限条目中删除离职员工，不必重建资源
          explain: ACL 按客体（列）组织，查“谁能碰这个客体”和撤销某人对它的访问都在一处完成；能力令牌按主体（行）组织，查“这个主体手头有什么钥匙”方便，但反向审计与撤销更麻烦。
      - card:
          title: 能力令牌与糊涂代理人问题
          body: |
            高安全设计常采用能力令牌，因为它能避免**糊涂代理人（confused deputy）** 漏洞。

            假设高权限格式转换服务既能读写用户目录，又能写系统计费日志。低权限用户故意把输出路径填成计费日志，按身份检查的系统看到写入者是高权限服务便错误放行，让它替攻击者毁了日志。

            改用能力令牌时，用户须把“输出文件的写入钥匙”传给服务，服务只凭此钥匙写入，不会误用到自身计费权限。
      - item:
          id: q2
          type: choice
          prompt: 下面哪种情景最准确地体现了“糊涂代理人”问题？
          options:
            - text: 攻击者用弱口令猜中了管理员账号，登录后台后直接删除了计费日志
              why: 这是弱口令导致的账号失陷，不是高权限程序被低权限请求方诱骗滥用自身权限
            - text: 低权限用户诱使高权限报表服务误用自身的写入权限，覆写了系统计费日志
              correct: true
            - text: 运维人员登录管理员账号时输错路径，误删了自己负责维护的日志文件
              why: 这是高权限人员自身操作失误，不存在被低权限请求方跨权诱骗的代理关系
            - text: 计费日志目录被误设为全员可写，普通用户直接打开并清空了其中的记录
              why: 这是权限配置过宽，攻击者直接越权而不需要借高权限程序之手
          explain: 糊涂代理人的核心特征是“高权限程序同时拥有自己和请求方两套权限，并在处理请求方指定的目标时误用了自己的高权限”。
      - card:
          title: DAC 与 MAC：由所有者做主还是由系统强制
          body: |
            现实系统管理大量权限规则，常用四种经典模型。先看“谁说了算”的两种对立思路：

            - **自主访问控制（DAC，Discretionary Access Control）**：资源所有者可自行决定把文件分享给谁（如个人电脑文件权限、网盘分享网址）。灵活，但一旦误点公开或运行恶意程序，数据就会随主人权限外泄。
            - **强制访问控制（MAC，Mandatory Access Control）**：系统按全局密级标签（如机密、绝密）强制裁决，连创建者也不能擅自降级外发，常见于高安全涉密系统。
      - card:
          title: RBAC 与 ABAC：按岗位角色还是按动态属性
          body: |
            在大型组织里，还可以按岗位或动态条件组织授权：

            - **基于角色的访问控制（RBAC，Role-Based Access Control）**：不直接给个人绑权限，而是把权限绑到岗位角色（如“审核员”“出纳”），再把员工加入角色。入职、调岗和离职管理最清晰。
            - **基于属性的访问控制（ABAC，Attribute-Based Access Control）**：依据部门、密级、工作时间与登录网段等多维属性动态判定是否放行，适合精细情境控制。
      - item:
          id: q3
          type: match
          prompt: 将四个访问控制模型与它们最核心的特征配对。
          pairs:
            - [DAC（自主访问控制）, 文件创建者可以自行决定将读或写权限分享给其他用户]
            - [MAC（强制访问控制）, 系统按全局密级标签强制裁决，创建者也无权随意放宽]
            - [RBAC（基于角色的访问控制）, 权限先赋予岗位角色，再将用户分配到对应角色]
            - [ABAC（基于属性的访问控制）, 结合用户部门、时间、地点与资源标签等属性动态判定]
          explain: DAC 看所有者意愿；MAC 看全局强制标签；RBAC 靠岗位角色做中间层；ABAC 用多维属性规则动态裁决。
      - card:
          title: 例题：为不同业务挑选合适的访问控制模型
          body: 看看三个真实需求，一步步判断该用哪一种模型最贴切。
          reveal:
            - title: 场景 1：2000 人的连锁超市管理收银、库管和店长权限
              body: |
                员工流动频繁，但岗位职责固定。选用 **RBAC**：先定义收银员、库管、店长三个角色，新人入职直接绑定角色，调岗只需换角色。
            - title: 场景 2：涉密研究所严禁员工把“机密”图纸拷贝或分享给外部访客
              body: |
                哪怕图纸是某工程师亲手画的，也不允许他自行授权外发。必须用 **MAC**，由系统按密级标签强制拦截。
            - title: 场景 3：医院规定“只有当天接诊该患者的医生，在院内工作站上才可查看病历”
              body: |
                规则涉及“当天接诊关系”“登录地点”“时间”等动态上下文，单靠静态角色不够，适合用 **ABAC** 动态求值。
      - item:
          id: q4
          type: choice
          prompt: 在只使用自主访问控制（DAC）的个人电脑上，用户不小心运行了一个伪装成发票预览工具的恶意程序。这个恶意程序能读取用户文档目录里的所有私有文件吗？为什么？
          options:
            - text: 不能，因为 DAC 会自动识别新下载的程序并禁止它读取任何个人文档
              why: 传统 DAC 按运行者的用户身份授信，并不会自动区分合法软件与用户启动的恶意程序
            - text: 能，因为在 DAC 下该程序继承了启动它的用户身份及其全部文件权限
              correct: true
            - text: 只能读取公开公告文件，无法读取用户自己创建并设为“仅本人可读”的文件
              why: 只要恶意程序以该用户身份运行，在系统眼里它就是“本人”，同样能读“仅本人可读”的文件
            - text: 不能，因为读取私有文件必须先由文件所有者再次输入登录口令
              why: DAC 模式下普通程序读取所属用户的文件无需逐个重复输入口令
          explain: 这正是经典 DAC 的根本局限：程序默认继承启动它的用户的全部权限。要约束不可信程序，就得把它关进受限的运行环境（沙箱），只发给它完成任务必需的权限。

  - id: granularity-sandbox-and-pitfalls
    chapter: 认证授权
    title: 权限粒度、沙箱、硬件保护与访问控制踩坑
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你在浏览器里打开一个陌生的网页小游戏，页面上的脚本代码会在你的电脑上运行。为什么它不能顺手把你桌面上的照片全部删光？
          options:
            - text: 因为网页脚本语言语法上完全不支持读写任何数据
              why: 脚本语言本身具备丰富的运算和接口能力，真正拦住它的是浏览器施加的运行隔离
            - text: 因为浏览器把它关在受限环境里，只开放画布和声音等极少数接口
              correct: true
            - text: 因为每当网页想删文件时，系统都会联系网站作者核实身份
              why: 浏览器是在本地通过隔离机制直接阻断危险能力，而不是事后去问网站作者
          explain: 光靠“相信程序很乖”守不住系统。把不可信代码关进受控笼子，再靠硬件和操作系统兜底，才能把风险锁在边界内。
      - card:
          title: 权限粒度：太粗危险，太细难管
          body: |
            **权限粒度（granularity）** 指访问控制能切分到的精细程度。

            - **粒度太粗**：例如医院系统只分“医生”和“非医生”两档，任何医生都能打开全院几十万人的病历，哪怕对方不是自己的病人。一旦某个账号泄露，整院隐私全部暴露。
            - **粒度太细**：如果要求管理员为每张表的每一行、每一列单独手工配规则，配置量会爆炸，管理员很快看晕，反而因为疏忽留下漏洞。

            好的粒度往往贴合业务边界（例如按“主治科室 + 挂号关系”或“单租户目录”切分），兼顾最小暴露和可维护性。
      - card:
          title: 沙箱与携带证明的代码
          body: |
            面对来源不完全可信的代码（浏览器脚本、手机应用、第三方插件），系统常用两类保护思路：

            - **沙箱（sandbox）**：给程序搭一个受控“游乐场”，只提供白名单里的极少数安全接口，禁止它直接碰宿主文件系统、摄像头或网络底层。即使里面藏着恶意逻辑，也翻不出围墙。
            - **携带证明的代码（proof-carrying code）**：另一种更偏理论与底层验证的思路——由代码发布方随程序附带一份数学化的安全证明，接收方在执行前用小巧的验证器快速检查这份证明是否成立，验证通过才放行运行。
      - item:
          id: q1
          type: choice
          prompt: 一家初创公司图省事，给负责生成每日销售报表的脚本分配了“整个生产数据库管理员”权限，而该脚本实际上只需要读取订单表里的金额和日期两列。这最先暴露出什么问题？
          options:
            - text: 权限粒度过粗，脚本一旦被入侵或写错语句就可能删改整个数据库
              correct: true
            - text: 权限粒度过细，导致脚本因为权限条目太多而运行变慢
              why: 只给了一个笼统的管理员角色属于粒度过粗，而不是过细
            - text: 这是沙箱隔离过严导致的正常现象，无需修改权限
              why: 赋予管理员全库权限恰恰是没有做隔离和收权
            - text: 这符合携带证明的代码原则，因为报表脚本本身经过了运行测试
              why: 常规功能测试不等于形式化安全证明，更不能代替最小范围的数据库授权
          explain: 只需读两列却给了全库管理员，是典型的权限粒度过粗。应把权限精确收紧到订单表的只读指定列上。
      - card:
          title: 为什么离不开硬件保护：内存、进程与内核
          body: |
            程序运行时，它的操作步骤和数据都放在计算机的**内存（memory）** 里。每个运行中的程序实例是一个**进程（process）**，操作系统的核心管理者是**内核（kernel）**。

            如果普通进程能随意读写全部内存，恶意程序就能顺手篡改内核权限表，把软件检查全改成放行。因此处理器提供**硬件保护（hardware protection）**：将运行分为内核专用高特权模式与普通低特权模式，并用硬件隔离各进程内存，普通进程擅自跨区时由电路直接拦截。
      - item:
          id: q2
          type: choice
          prompt: 为什么操作系统不能仅仅靠纯软件逻辑来实施访问控制，而必须依赖处理器的硬件保护？
          options:
            - text: 纯软件校验的性能开销过高，无法支撑每秒数千次文件权限查询
              why: 根本原因不是检查太慢，而是缺少硬件隔离时恶意程序能直接改写软件规则本身
            - text: 缺少硬件特权分级与内存隔离，恶意进程可直接篡改内存里的内核权限表
              correct: true
            - text: 只有处理器内置的硬件保护电路，才能对网络传输的数据包执行加密校验
              why: 硬件保护负责进程内存隔离与特权边界，网络传输加密属于密码学通信机制
            - text: 纯软件访问控制无法表达基于角色的规则，只能借助硬件电路存储角色表
              why: 角色规则本身是数据结构，软件完全能表达；需要硬件是因为必须防止普通进程擅自改写内核内存
          explain: 软件规则本身也住在内存里。只有靠处理器硬件强制区分特权级并隔离各进程内存，内核的访问控制规则才不会被普通恶意程序直接抹掉。
      - card:
          title: 访问控制在现实中常在哪里翻车
          body: |
            工程实践总结了访问控制最常见的现实失败点：

            1. **默认配置过宽**：云存储或测试数据库图方便设为公开可读后忘关。
            2. **权限漂移（privilege creep）**：员工调岗或兼职时只加新权限不删旧权限，日积月累攒出远超职责的特权。
            3. **绕过路径与备份泄露**：主库守得很严，每天导出的明文备份却放在公开目录。
            4. **维护过载**：规则堆到几千条互相冲突，没人敢删旧条目，生怕业务停摆。
      - card:
          title: 例题：排查一份云上系统的访问控制隐患
          body: 某在线教育平台上线一年后做安全自查，发现四条线索。逐条对应它们属于哪类现实踩坑。
          reveal:
            - title: 线索 1：半年前离职的助教依然能登录作业批改后台
              body: |
                缺少及时撤销机制与定期权限审计，账号的开通与注销流程没有和人事变动联动。
            - title: 线索 2：数据库只允许内网访问，但凌晨导出的备份包放在公网可下载目录
              body: |
                **绕过路径 / 备份泄露**：正门守住了，侧门把全部数据端了出去。备份必须与主库采用同等机密性保护。
            - title: 线索 3：运营小陈去年兼职过财务对账，今年调岗回市场部后仍能导出全站收款明细
              body: |
                典型的**权限漂移**：岗位变更只叠加权限、未回收旧权限。
            - title: 线索 4：新开的测试服务器沿用默认配置，未关默认测试账号
              body: |
                **默认配置过宽**：生产与测试环境必须关闭默认账号并默认拒绝外部访问。
      - item:
          id: q3
          type: choice
          prompt: 工程师小周三年前入职做运维，拥有服务器登录权限；一年前转岗做前端页面开发，公司给他加了前端仓库权限，却一直没收回他的生产服务器登录权限。这种现象叫什么？
          options:
            - text: 携带证明的代码失效
              why: 携带证明的代码涉及代码执行前的形式化安全证明，与人员调岗不删权限无关
            - text: 权限漂移
              correct: true
            - text: 硬件保护跨区故障
              why: 这是账号授权管理流程疏漏，不是处理器内存隔离电路故障
            - text: 暴力破解残留
              why: 小周的旧权限是合法授予后未及时回收，不是攻击者暴力猜解得来的
          explain: 员工随岗位变动或临时项目不断积累旧权限却不及时回收，导致实际权限远超当前工作所需，这就是权限漂移。定期权限复审与调岗自动回收是主要治理手段。
      - item:
          id: q4
          type: choice
          multi: true
          prompt: 某团队把核心用户数据库锁在严格的内网中，仅允许业务服务器访问。下面哪些做法仍然可能形成访问控制的“绕过路径”？（多选）
          options:
            - text: 把每日导出的数据库明文备份上传到所有人可匿名读取的共享网盘
              correct: true
            - text: 为了排查问题，把一整套含真实用户数据的副本拷进无认证的测试环境
              correct: true
            - text: 在数据库上只开放报表服务所需的只读字段权限，并启用强身份认证
              why: 按最小需要开放只读字段并启用强认证是在加固防线，不是绕过路径
            - text: 运维把数据库最高管理员的账号口令明文写进了团队公开聊天记录
              correct: true
          explain: 访问控制只在“所有能触及数据的路径都受控”时才有效。公开备份、未加固的测试副本、明文流出的管理员凭据都会绕过主库的严密防护。

  # ============================================================ 最小权限
  - id: least-privilege-and-separation
    chapter: 最小权限
    title: 最小权限与职责分离
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你请了一位水管工来修厨房水龙头。你会把家里保险柜密码、车钥匙和公司门禁卡连同家门钥匙一起交给他，还是只让他进入厨房修完就离开？
          options:
            - text: 只让他进入厨房修完离开，其余无关权限一概不给
              correct: true
            - text: 全部钥匙一起交给他，这样显得互相信任且省得反复开门
              why: 与修水管毫无关系的保险柜和车钥匙一旦交给外人，任何意外或恶意都会让损失无限放大
            - text: 把保险柜密码告诉他，但口头叮嘱他不要打开保险柜
              why: 依靠口头叮嘱代替权限隔离，在真实攻防里挡不住恶意行为或误操作
          explain: 只给完成当前任务所必需的最少权限，听起来像常识，却在软件工程里反复被违背。这一课系统讲清最小权限和职责分离。
      - card:
          title: 最小权限原则：把爆炸半径压到最小
          body: |
            **最小权限原则（principle of least privilege）** 规定：用户、程序或后台服务只能获得完成当前本职任务所必需的最少权限，并在结束后收回。

            例如只统计订单总额的报表服务，其数据库账号只应有订单表只读（`SELECT`）权限，不该有删表或读密码表权限。这能缩小失守后的爆炸半径、阻断攻击者向其他服务器扩散的**横向移动（lateral movement）**，也让事后审计更清晰。
      - card:
          title: 如何把最小权限落到实处
          body: |
            工程上常靠四件工具把最小权限落到实处：

            - **角色授权（RBAC）与特权隔离**：日常操作与管理员账号分开。
            - **即时提权（JIT，Just-In-Time）**：平时仅保留只读权限，抢修时经审批临时授予短时写入权，到期自动回收。
            - **清理冗余与硬编码凭据**：定期审计治理权限漂移，严禁把密钥写死在代码仓库里。
            - **零信任（zero trust）**：不假设进了内网就安全，每次访问均重新核验身份与最小权限。
      - item:
          id: q1
          type: choice
          prompt: 一家公司开发了一个每天自动统计昨日订单总额的报表程序。按照最小权限原则，应该给这个报表程序的数据库账号分配哪一种权限？
          options:
            - text: 授予数据库超级管理员权限，方便后续扩展功能时减少审批
              why: 为了将来可能的需求提前赋予超级管理员权限，会极大扩大该程序被攻破后的损失
            - text: 仅授予订单表的只读（`SELECT`）权限，不赋予写入或访问其他表的权限
              correct: true
            - text: 对全部业务表开放读写权限，仅禁止执行删除整张表的命令
              why: 报表程序不需要改写任何数据，也不需要接触密码或薪资等无关表，读写全表依然权限过宽
            - text: 复用运维工程师个人的管理员账号，省去单独维护专用服务账号的成本
              why: 复用个人管理员账号既违背最小权限，又把凭据耦合进代码，事后还无法区分是人还是脚本操作
          explain: 报表程序的本职工作仅仅是读取订单数据汇总，因此只给订单表的只读查询权限即可；即使报表程序失守，攻击者也改不了余额、删不了表。
      - item:
          id: q2
          type: choice
          prompt: 某团队规定：数据库运维人员平时登录生产控制台只有只读查看权限；遇到线上故障需要修改数据时，须在工单系统提交审批，通过后自动获得 1 小时写入权限，超时自动撤销。这种落地机制叫什么？
          options:
            - text: 强制访问控制（MAC）
              why: MAC 强调按全局固定密级标签强制裁决，而这里是按工单审批限时发放特权并自动回收
            - text: 即时提权（JIT）
              correct: true
            - text: 自主访问控制（DAC）
              why: DAC 强调资源所有者自行分享权限，而这里是按工单审批限时发放特权并自动回收
            - text: 职责分离（SoR）
              why: 虽然工单需要审批，但“平时零常驻特权、按需限时授予并到期自动收回”的核心机制是即时提权（JIT）
          explain: 平时不持有常驻高权限，仅在经过审批的短时间窗口内临时提权并在到期后自动收回，这就是即时提权（JIT），能大幅缩小特权账号被盗或误操作的时间窗口。
      - card:
          title: 职责分离：不让一个人既当运动员又当裁判
          body: |
            最小权限限制单个实体的权限大小，**职责分离（separation of responsibility）** 则把一项高风险操作拆成至少两个环节，交由不同的人或组件分别完成：

            - 银行金库需要两位主管各自保管一半密钥，同时到场才能打开；
            - 财务打款要求“发起申请”“复核审批”“执行付款”分属不同账号；
            - 软件上线要求写代码的开发者不能自己审批并直接把代码推上生产环境，必须由另一位同事审查通过。

            这样即使某个内部账号被盗或单名员工心存恶意，也无法独自完成舞弊。
      - card:
          title: 例题：辨析最小权限与职责分离的配合
          body: 某电商后台要开放“大额退款”功能。看看两条原则如何各自发力、互相补位。
          reveal:
            - title: 第 1 步：先用最小权限收紧单个岗位范围
              body: |
                普通客服账号只能查看自己处理的工单，且只能发起 200 元以内的退款申请，不能直接操作公司银行账户，也不能修改退款记录日志。
            - title: 第 2 步：再用职责分离阻断单人舞弊
              body: |
                超过 200 元的退款必须走两步：客服 A 提交退款单，风控主管 B 审核通过后，再由独立的财务打款服务执行。A 和 B 任何一人单方面失守，都转不走大额资金。
            - title: 第 3 步：正视现实中的成本与局限
              body: |
                最小权限与职责分离会增加审批和运维摩擦。如果流程繁琐到拖慢正常抢修，人员可能会私下共享账号来绕过——因此需要借助 RBAC 模板、JIT 自动审批和自动化权限审计来降低维护负担。
      - item:
          id: q3
          type: choice
          prompt: 下面哪一项做法最直接体现了“职责分离”原则？
          options:
            - text: 把研发与测试团队合并进同一管理员角色组，加快故障排查速度
              why: 合并权限反而扩大了单人权限范围，既违背最小权限也没有拆分审批与执行
            - text: 编写代码的开发者不能自行审批上线，必须由另一位同事复核通过
              correct: true
            - text: 为报表脚本配置只读数据库账号，禁止它执行任何修改与删表语句
              why: 只给单个程序必需的最小操作集合属于最小权限原则，而不是拆分多人互相制衡
            - text: 员工登录生产环境时必须同时输入登录口令和硬件安全密钥验证码
              why: 叠加不同类别的认证凭证属于多因素认证，与拆分高危操作环节无关
          explain: 职责分离的核心是让“干活的人”和“验收放行的人”分开，使任何单一账号被盗或单人作案都无法直接完成高危变更。
      - item:
          id: q4
          type: choice
          prompt: 实行最小权限原则后，系统最常见的长期运维挑战之一是什么？
          options:
            - text: 限制为只读账号后，数据库执行常规查询的速度会下降几个数量级
              why: 限制读写权限本身不会让只读查询变慢几个数量级
            - text: 人员调岗与临时项目容易累积权限漂移，审批过慢还会诱发私下绕过
              correct: true
            - text: 实施最小权限后，系统便无法再结合多因素认证与集中审计日志使用
              why: 最小权限属于授权层，与认证层的多因素认证及检测层的审计日志完全兼容
            - text: 一旦按岗位配好最小权限，系统就能完全抵御内部漏洞而无需再打补丁
              why: 最小权限能缩小失守后的爆炸半径，但不能替代漏洞修补与持续监控
          explain: 最小权限不是一次性配置完就一劳永逸的。业务变化和人员流动会持续制造权限漂移，如果审批过慢还会诱导绕过，因此需要定期权限审计与自动化限时回收工具配合。

  - id: mediation-defaults-and-tcb
    chapter: 最小权限
    title: 完全中介、失效安全默认值与可信计算基
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 某社区论坛的前端网页对普通用户隐藏了“删除任意帖子”的红色按钮，但后端服务器收到删除请求时不再检查发请求的人是不是管理员。攻击者能删掉别人的帖子吗？
          options:
            - text: 不能，因为页面上根本看不到删除按钮，点不到
              why: 浏览器里的界面只是给普通用户看的，攻击者可以直接用脚本向服务器发送删除请求
            - text: 能，攻击者可以直接构造请求发给服务器，绕过前端界面
              correct: true
            - text: 只有当攻击者也安装了相同的浏览器插件时才能删帖
              why: 构造网络请求不需要特定浏览器插件，任何程序语言几行代码就能直接发给后端
          explain: 只在门口看一次、或者只在不受你控制的前端隐藏按钮，都挡不住绕过。权限检查必须守在资源的每一次必经之路上。
      - card:
          title: 完全中介：每一次访问都必须过安检
          body: |
            **完全中介（complete mediation）** 要求：对受保护资源的**每一次**访问请求，都必须在服务端经过完整的权限检查，不能偷懒跳过。

            常见违背完全中介的坑有两类：
            - **只在入口检查，后续全靠信任**：比如只在网页前端藏按钮，或者只在登录时发一张写着 `is_admin=true` 的普通明文标记让客户端自己保管，服务端收到请求照单全收。
            - **过度缓存旧权限**：员工上午已被降级或离职，但系统一直沿用昨天缓存的权限结果，没有在每次关键操作时重新核验或及时使旧会话失效。
      - card:
          title: 失效安全默认值：说不清时，一律先拒绝
          body: |
            **失效安全默认值（fail-safe defaults）** 规定：判断权限时应以**默认拒绝（白名单）** 为基础——只有明确查到“允许”才放行；只要查无此人、配置缺失或者校验过程发生报错，都必须默认**拒绝**。

            看看下面这段 Python 权限检查演示：先把 `allowed` 设为 `False`，只有当角色在规则字典里明确对应 `True` 时才改成 `True`。点一步一步执行，观察陌生角色 `"intern"` 会得到什么结果。
          sim:
            name: trace
            params:
              code: |
                def can_read(role, rules):
                    allowed = False
                    if role in rules:
                        allowed = rules[role]
                    return allowed

                rules = {"admin": True, "auditor": True, "guest": False}
                res1 = can_read("admin", rules)
                res2 = can_read("intern", rules)
                print(res1, res2)
      - item:
          id: q1
          type: sim
          sim: trace
          prompt: 下面这段 Python 函数按失效安全默认值检查账号是否允许编辑文章：必须账号处于启用状态（`active` 为 `True`）且角色在白名单内才放行。单步运行程序，回答在 `check_access` 第 2 次被调用并返回前，第 5 行执行时局部变量 `allowed` 的值是什么。
          params:
            code: |
              def check_access(role, active, allow_roles):
                  allowed = False
                  if active and role in allow_roles:
                      allowed = True
                  return allowed

              allow = ["admin", "editor"]
              r1 = check_access("editor", True, allow)
              r2 = check_access("editor", False, allow)
              print(r1, r2)
          goal:
            ask:
              - { line: 5, var: allowed, hit: 2 }
          explain: 第 2 次调用传入 `active=False`（例如账号已被停用）。虽然 `role` 仍在 `allow_roles` 中，但 `if` 条件不成立，`allowed` 保持初始的 `False` 并返回，体现了默认拒绝与实时核验账号状态。
      - item:
          id: q2
          type: choice
          prompt: 某网站写了一段鉴权代码：当连接权限数据库超时并触发异常时，捕获该错误并输出一条日志，然后让函数返回 `True`（“先放行以免影响用户体验”）。这直接违背了哪条安全原则？
          options:
            - text: 香农准则，因为权限数据库的名字暴露在了代码里
              why: 报错时自动放行与隐匿算法无关，问题出在失败后的默认行为方向相反
            - text: 失效安全默认值，鉴权出错时应默认拒绝而非放行
              correct: true
            - text: 职责分离，因为数据库和网站应当由两家不同公司分别采购
              why: 职责分离强调拆分敏感业务环节给不同角色，而不是决定报错时的默认返回值
            - text: 能力令牌原则，因为系统使用了数据库而不是实体钥匙
              why: 无论用 ACL 还是能力令牌，校验失败时都不应自动放行
          explain: 鉴权出错就自动放行被称为“失效开放（fail-open）”。攻击者只要故意把权限数据库打慢或打垮，就能让所有未授权请求一路绿灯。安全敏感检查必须“失效关闭（fail-closed）”，默认拒绝。
      - card:
          title: 可信计算基（TCB）：越小越容易守住
          body: |
            一个复杂系统里往往有几百万行代码，是不是每一行出错都会导致安全防线崩塌？并非如此。

            **可信计算基（TCB，Trusted Computing Base）** 是指：系统中为了强制执行安全策略而**必须被完全信任**的那一部分硬件、固件与软件总和。

            TCB 的特点非常冷酷：
            - **TCB 之外**的普通应用哪怕出了缺陷，只要 TCB 正常工作，破坏就能被关在隔离边界里；
            - **TCB 之内**只要有一处严重缺陷，攻击者就可能击穿整套安全保障。

            因此安全架构的黄金追求是：**让 TCB 尽可能小、结构尽可能简单**，把审计精力集中在这一小块核心上。
      - item:
          id: q3
          type: choice
          prompt: 某操作系统团队打算把一个长达 80 万行代码、负责解析复杂图片格式的程序塞进内核高特权区域一起运行，以节省一点点画面拷贝时间。从可信计算基（TCB）的角度看，为什么这是非常危险的决定？
          options:
            - text: 放进内核后图片解析无法再读取外部上传的压缩文件
              why: 放进内核不影响解析功能，真正危险的是扩大了必须完全信任的特权代码体积
            - text: 极大膨胀了可信计算基（TCB），解析器中的一处漏洞就可能直接危及整个内核
              correct: true
            - text: 缩小了可信计算基（TCB），导致内核缺少足够代码来执行访问控制
              why: 把 80 万行复杂解析代码塞进高特权内核是在扩大而非缩小 TCB
            - text: 会迫使操作系统的文件访问控制模型从 RBAC 自动退化为 DAC
              why: 访问控制模型的选择与图片解析代码放在内核还是普通运行区域没有直接因果关系
          explain: 图片格式解析逻辑复杂且直接处理不可信的外部输入，极易藏有漏洞。把它放进内核会瞬间把 80 万行高危代码拉进 TCB，违背了“保持 TCB 小而简单”的原则。
      - item:
          id: q4
          type: choice
          prompt: 一家公司开除了员工老赵，并在后台把他的账号改成了“已停用”。但系统为了减轻服务器压力，给登录后的用户发了一张有效期 7 天、服务端完全不再复查数据库状态的通行证。结果老赵离职后第 5 天依然成功下载了内部资料。这里主要违背了哪条原则？
          options:
            - text: 完全中介原则，后续每次下载请求都跳过了实时账号状态核验
              correct: true
            - text: 香农准则，因为系统发放的通行证采用了公开可见的字段格式
              why: 通行证格式公开本身符合香农准则，问题出在服务端 7 天内不复查账号是否已停用
            - text: 失效安全默认值，因为系统没有在老赵输错口令时默认锁定账号
              why: 老赵是用离职前签发的合法旧凭证继续访问，核心问题是缓存凭证跳过每次访问的核验
            - text: 职责分离原则，因为开除员工和下载内部资料使用了同一套后台系统
              why: 离职后还能下载是因为缺少实时权限复查与撤销机制，与拆分业务审批环节无关
          explain: 完全中介要求每次访问都核验当前真实权限。长期有效又不核验撤销清单的凭证会让“停用账号”在有效期内形同虚设。

  - id: tocttou-vulnerabilities
    chapter: 最小权限
    title: 检查时与使用时：TOCTTOU 漏洞
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你的银行卡里只剩 100 元。假设银行系统有缺陷：你在两台手机上同时点下“取款 80 元”，系统先各自检查“余额 100 够不够 80”，两台都通过了，接着再各自发放 80 元。最后你可能拿到多少钱？
          options:
            - text: 最多 80 元，因为卡里本来就只有 100 元
              why: 如果两次检查都在扣款写回之前完成，系统会误以为余额还够，从而两次都放行
            - text: 160 元，因为两次检查之间余额还没来得及扣除
              correct: true
            - text: 20 元，系统会把两次取款合并成一次，扣完 80 元后退回多余部分
              why: 系统没有合并请求的逻辑；两次检查都在扣款之前完成，所以两次都放行
          explain: 检查条件成立，并不代表轮到你动手操作的那一瞬间条件仍然成立。这个微小的时间缝隙，就是一类经典漏洞的温床。
      - card:
          title: 并发、竞态条件与 TOCTTOU
          body: |
            服务器常同时处理大量请求，多个任务在重叠时段内交错推进，这叫**并发（concurrency）**。若程序正确性依赖并发步骤恰好按特定顺序发生，顺序一乱就出错，便存在**竞态条件（race condition）**。

            安全领域最典型的竞态缺陷是**检查时与使用时漏洞（TOCTTOU，Time-of-Check to Time-of-Use）**：程序在 $t_1$ 检查前提，在 $t_2$ 执行操作，攻击者趁两步间隙把状态掉包，让先前的检查失效。
      - card:
          title: 例题：两笔 80 元取款如何绕过 100 元余额检查
          body: 一步步跟踪两笔并发取款请求的交错时间线，看清钱是怎么超额支付出去的。
          reveal:
            - title: 第 1 步：两笔请求几乎同时到达“检查时”
              body: |
                账户初始余额 `balance = 100`。
                - 时刻 $t_1$：请求 A 读取 `balance` 为 `100`，检查 `100 >= 80`，**通过**。
                - 时刻 $t_2$：请求 A 还没来得及扣款，请求 B 也读取 `balance` 为 `100`，检查 `100 >= 80`，**同样通过**。
            - title: 第 2 步：两笔请求分别进入“使用时”
              body: |
                - 时刻 $t_3$：请求 A 发放 `80` 元，把余额改写为 `100 - 80 = 20`。
                - 时刻 $t_4$：请求 B 发放 `80` 元，把余额改写为 `100 - 80 = 20`（或扣成 `-60`）。
            - title: 第 3 步：结算后果
              body: |
                明明卡里只有 `100` 元，攻击者却一共拿走了 `80 + 80 = 160` 元。问题不在判断条件写错，而在“检查”与“扣款”被拆成了两步，中间留出了可插入的缝隙。
      - item:
          id: q1
          type: number
          prompt: 某存在 TOCTTOU 漏洞的提现接口中，用户账户初始余额为 500 元。攻击者同时发起 3 个并发请求，每个请求均申请提现 300 元，且 3 个请求都在任何扣款写入前通过了“余额 >= 300”的检查并成功出款。攻击者最终一共拿走了多少元？
          answer: 900
          unit: 元
          hint: 每个请求出款时，有没有再核对一次余额？
          explain: 3 个请求各自支付 300 元，一共拿走 $3 \times 300 = 900$ 元，超出实际余额 400 元。类似漏洞也常见于“同一张优惠券被并发刷多次”。
      - card:
          title: 文件系统里的经典 TOCTTOU：路径快捷方式掉包
          body: |
            TOCTTOU 不只发生在余额扣款，在文件操作里同样高发。

            操作系统里有一种特殊快捷引用叫**路径快捷方式（symlink）**，它本身不存内容，只指向另一个真实文件路径。假设一个高权限程序要帮普通用户写日志：

            1. 检查时：按路径名检查 `/tmp/note.txt` 是不是普通用户的普通文件（检查通过）；
            2. 攻击者抢在间隙里删掉 `/tmp/note.txt`，并在同名位置建一个指向系统关键配置文件的快捷方式；
            3. 使用时：高权限程序按路径名打开 `/tmp/note.txt` 写入内容，结果顺着快捷方式直接篡改了系统关键文件。
      - card:
          title: 怎么根治 TOCTTOU：用原子操作消灭缝隙
          body: |
            漏洞源于“检查”和“使用”之间的间隙，治本方法是使用**原子操作（atomic operation）** 把两步合二为一：

            - **账户与数据库**：用条件更新语句（如“仅当余额 >= 80 时一次性扣减 80”）将检查与扣款合成不可打断的单一操作。
            - **文件系统**：不要按路径先查再开，而是拒绝跟随路径快捷方式一次性打开文件拿到句柄，再对着该句柄检查和读写，外部替换路径名也不影响已打开实体。
      - item:
          id: q2
          type: order
          prompt: 请按先后顺序排列“路径快捷方式掉包”这一经典文件 TOCTTOU 攻击的完整发生过程。
          steps:
            - 普通用户在共享目录创建一个属于自己的合法普通文件 /tmp/note.txt
            - 高权限程序按路径名检查 /tmp/note.txt 的归属权限并判定通过
            - 攻击者趁间隙删掉该普通文件，并创建同名路径快捷方式指向系统敏感文件
            - 高权限程序随后按路径名打开 /tmp/note.txt 写入，误篡改了系统敏感文件
          explain: 先让高权限程序在“检查时”看到合法文件，趁检查与打开之间的窗口把路径掉包成路径快捷方式，最后高权限程序在“使用时”顺着快捷方式写坏系统文件。
      - item:
          id: q3
          type: choice
          prompt: 下面哪种改法能够真正修复“并发刷同一张满减优惠券”的 TOCTTOU 漏洞？
          options:
            - text: 在执行检查后暂停 0.5 秒，再把余额和优惠券状态重新检查第二遍
              why: 检查两遍只是增加了窗口次数，在第二次检查与真正核销之间依然存在并发缝隙
            - text: 用一条原子条件更新语句把状态检查与核销合并为不可打断的单一操作
              correct: true
            - text: 让网页前端点击“核销”按钮后立即置灰禁用，后端校验逻辑保持不变
              why: 前端变灰只能防普通用户误点两次，攻击者可直接用脚本并发向后端发请求
            - text: 把优惠券编号从 6 位数字改为 32 位随机字符，防止攻击者猜出编号
              why: 编号再随机，只要攻击者已经拿到自己这张合法优惠券，就能并发重复提交同一个编号
          explain: 治本之道是把检查状态与修改状态合成不可分割的原子操作（例如数据库条件更新，保证只有一个并发请求能把状态从“未使用”改成“已使用”）。
      - item:
          id: q4
          type: choice
          prompt: 修复按路径操作文件时的 TOCTTOU 漏洞，为什么推荐“先拒绝跟随路径快捷方式打开文件拿到句柄，再对句柄做检查”，而不是“先按路径检查，再按路径打开”？
          options:
            - text: 句柄绑定已打开的文件实体，外部即便替换路径名也无法把目标掉包
              correct: true
            - text: 按路径名连续调用两次文件接口会触发内核锁死，导致进程永久阻塞
              why: 先查路径再打开并不会锁死进程，正因它平时能正常运行，新手才容易留下隐藏的 TOCTTOU 漏洞
            - text: 拿到文件句柄后系统会自动校验数据完整性，不再需要检查归属权限
              why: 拿到句柄只是锁定了同一实体文件，程序仍需对着该句柄检查归属与权限
            - text: 只要不跟随快捷方式，按路径名先查后开与对句柄检查在并发下完全等价
              why: 即便禁止快捷方式，外部仍可能在检查与打开之间删除原文件并换入另一个同名文件，只有锁定句柄才能消除缝隙
          explain: 路径名只是贴在文件外面的门牌号，随时可能被换掉；一旦以不跟随路径快捷方式的方式打开文件拿到句柄，后续检查与读写都锁定在同一个实体文件上，从而封死了掉包缝隙。

  # ============================================================ 攻击面与风险管理
  - id: threat-modeling-and-stride
    chapter: 攻击面与风险管理
    title: 威胁建模与 STRIDE 分类法
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你写了一个很小的个人博客网站，只用来记录学习笔记，既没有付费功能也没什么名气。你觉得需要假设“可能会有人扫描并攻击这个网站”吗？
          options:
            - text: 不需要，黑客只会盯住大型银行和科技巨头，不会浪费时间看小网站
              why: 互联网上大量自动化扫描脚本会无差别探测每一个公开站点，小网站常被用来当跳板、挖矿或发垃圾邮件
            - text: 需要，自动化攻击工具会无差别扫描所有公开站点，任何系统都可能成为目标
              correct: true
            - text: 只要域名不公开、不放到搜索引擎里，就不会被扫描到
              why: 扫描器会把互联网上的服务器一台台挨个探测，证书透明日志也会公开新申请的域名，不靠搜索引擎也能找到
          explain: 认为“我这么小没人会打我”是初学者最危险的错觉之一。做安全防护的第一步，是清醒地画出你的威胁模型。
      - card:
          title: 了解你的威胁模型与攻击者假设
          body: |
            **威胁模型（threat model）** 清晰回答四个问题：保护什么资产、防谁、对手有什么能力、防御边界在哪。

            务实的攻击者假设包括：对手能静默探测、具备系统常识、有耐心并会组合多个小缺陷，且**任何系统都可能成为目标**。

            建模时须在数据流图上画出**信任边界（trust boundary）**——例如用户浏览器与后端服务器之间，凡跨界进入的数据一律视为不可信并重新验证。
      - card:
          title: STRIDE：把威胁拆成六类，逐项排查不遗漏
          body: |
            为了不靠拍脑袋想漏洞，微软提出了 **STRIDE** 分类法，用 6 个英文首字母逐一检查每个功能与信任边界：

            | 字母 | 威胁类别 | 含义 | 常见破坏的目标 |
            |---|---|---|---|
            | **S** | 仿冒（Spoofing） | 假扮他人身份 | 真实性 / 认证 |
            | **T** | 篡改（Tampering） | 未授权修改数据或代码 | 完整性 |
            | **R** | 抵赖（Repudiation） | 干完坏事矢口否认 | 不可抵赖性 |
            | **I** | **信息泄露（Information Disclosure）** | 暴露不该看的数据 | 机密性 |
            | **D** | 拒绝服务（Denial of Service，DoS） | 耗尽资源使服务瘫痪 | 可用性 |
            | **E** | 权限提升（Elevation of Privilege） | 普通用户获得管理员或代码执行权 | 授权 |
      - item:
          id: q1
          type: match
          prompt: 将 STRIDE 的六类威胁与它们各自最贴合的破坏行为配对。
          pairs:
            - [仿冒（S）, 窃取他人登录会话凭证，冒充对方身份发帖]
            - [篡改（T）, 在传输途中拦截并悄悄改写订单金额]
            - [抵赖（R）, 管理员删除了关键记录后，因缺少审计日志而否认操作过]
            - [信息泄露（I）, 网站报错页面把数据库连接口令直接打印给了访客]
            - [拒绝服务（D）, 发送超大压缩包耗尽服务器磁盘与算力导致正常用户无法访问]
            - [权限提升（E）, 普通用户通过漏洞拿到服务器管理员权限执行任意命令]
          explain: STRIDE 的六个字母正好覆盖了 CIA 三要素以及认证、授权与不可抵赖全部核心目标，方便团队按表逐项排查。
      - card:
          title: 例题：用 STRIDE 给“用户上传头像”做威胁建模
          body: 看似简单的“上传头像”功能，只要跨过信任边界，6 类威胁全会出现。按步骤逐一拆解并给出缓解措施。
          reveal:
            - title: 第 1 步：S（仿冒）与 T（篡改）
              body: |
                - **仿冒**：攻击者盗用他人会话替别人上传不当头像。缓解：强身份认证与会话保护。
                - **篡改**：图片在传输途中被中途替换。缓解：全程使用加密传输通道（**HTTPS**），并在服务端重新校验文件内容。
            - title: 第 2 步：R（抵赖）与 I（信息泄露）
              body: |
                - **抵赖**：用户上传违规图片后否认是自己传的。缓解：记录带时间戳与用户编号的审计日志。
                - **信息泄露**：手机原图自带 **EXIF** 元数据，可能泄露用户拍摄时的精确地理坐标；若头像网址（**URL**）按顺序编号（如 `1001.jpg`、`1002.jpg`），外人可批量枚举。缓解：服务端清除 EXIF 元数据，并改用不可预测的随机文件名。
            - title: 第 3 步：D（拒绝服务）与 E（权限提升）
              body: |
                - **拒绝服务**：攻击者不断上传几百兆超大文件占满硬盘或拖垮图片处理进程。缓解：限制单文件大小与上传频率。
                - **权限提升**：攻击者把恶意脚本伪装成头像（如 `.php` 等**可执行文件**）上传，若服务器把它当代码运行，攻击者就直接拿下了服务器权限。缓解：校验文件真实内容而非只看后缀名、在服务端重新解码并重编码图片、把头像存放在禁止执行的独立目录或静态文件域名下。
      - item:
          id: q2
          type: choice
          prompt: 在“用户上传头像”功能中，用户直接上传手机拍摄的原图，结果其他人下载头像后从文件自带的 EXIF 元数据里读出了该用户的家庭住址坐标。这属于 STRIDE 中的哪一类威胁？
          options:
            - text: 仿冒（Spoofing）
              why: 这里没有人冒充其他用户的身份进行操作
            - text: 信息泄露（Information Disclosure）
              correct: true
            - text: 拒绝服务（Denial of Service）
              why: 网站依然能够正常上传和显示头像，没有资源耗尽瘫痪
            - text: 权限提升（Elevation of Privilege）
              why: 查看图片自带元数据没有让攻击者获得更高的系统执行权限
          explain: 本不该公开的拍摄地理坐标随头像文件一同暴露，属于典型的信息泄露（I）。服务端在保存图片时应主动剥离 EXIF 元数据。
      - item:
          id: q3
          type: choice
          prompt: 为了防范“上传头像”功能中的权限提升（E）威胁——即攻击者上传伪装成图片的恶意可执行文件并诱使服务器执行它，下面哪一组防护措施最有效？
          options:
            - text: 只在网页前端检查文件名是否以 `.jpg` 结尾，服务端直接原样保存
              why: 攻击者可以直接绕过前端校验，或者把恶意代码藏在改名为 `.jpg` 的文件里
            - text: 服务端校验真实格式、重新编码图片，并存放在禁止执行代码的目录中
              correct: true
            - text: 把上传按钮藏在二级菜单里并修改接口路径，避免被陌生访客发现
              why: 隐藏入口属于隐匿式安全，挡不住找到接口的攻击者上传恶意文件
            - text: 严格限制单个上传文件不超过 2 兆，但允许保存任意扩展名的文件
              why: 几百个字符的恶意脚本就足以接管服务器，限制体积防的是拒绝服务，防不住代码执行
          explain: 防范恶意上传导致权限提升需要纵深组合：服务端校验文件真实格式、重新编码剥离隐藏载荷、存放在绝不允许脚本执行的目录或独立静态域名下。
      - item:
          id: q4
          type: choice
          prompt: 在给系统画威胁模型的数据流图时，“信任边界”的作用是什么？
          options:
            - text: 标明系统里哪些数据需要压缩存储，哪些数据可以直接明文缓存
              why: 压缩与缓存属于性能优化，不是划分安全信任等级的工具
            - text: 划出不同信任等级区域的分界，标明跨界传入的数据都必须重新校验
              correct: true
            - text: 圈出无需做任何权限检查的内部区域，证明边界以内代码不存在漏洞
              why: 内部区域仍可能失守，划信任边界是为了明确校验重点，而非保证内部零缺陷
            - text: 按业务模块划分开发团队的维护范围，决定哪个小组负责编写单元测试
              why: 信任边界按系统安全信任等级划分，不按研发组织架构划分
          explain: 任何跨越信任边界的数据（如来自互联网浏览器、第三方回调或低权限客户端的输入）都可能被攻击者操控，因此信任边界正是部署输入校验、认证和授权检查的关键位置。

  - id: attack-surface-reduction
    chapter: 攻击面与风险管理
    title: 攻击面梳理与暴露面收缩
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一台对外提供网页查询的服务器，原本只需要开放网页访问入口，但管理员为了省事，把远程桌面、数据库端口、旧版测试页面和 3 个早就不用的插件全都留着对外开放。你认为这些“平时没人用”的入口会带来安全风险吗？
          options:
            - text: 不会，既然连公司员工都不用它们，攻击者自然也用不上
              why: 只要服务还在运行并对外监听，自动化扫描器就会找到它，旧服务往往还长期没打补丁
            - text: 会，每多开一个无用入口，就多出一扇可能被攻破的后门
              correct: true
            - text: 只要服务器装了杀毒软件，开着的端口就不会有风险
              why: 杀毒软件主要查恶意文件，挡不住攻击者直接利用对外服务的漏洞或弱口令登录
          explain: 攻防之间存在不对称：防守方要守住每一扇门，攻击者只要找到一扇没锁好的窗就能进屋。先把多余的门窗砌死，防守才会更从容。
      - card:
          title: 什么是攻击面：攻击者能摸到的全部入口
          body: |
            **攻击面（attack surface）** 指一个系统暴露给外部或低信任方的全部潜在入口总和，包括：

            - 对外开放的网络端口与服务器服务；
            - 网站页面、应用程序接口（**API**）和所有用户输入点；
            - 默认测试账号、历史遗留功能以及引入的第三方依赖库。

            管理攻击面的第一步是**资产梳理**：把公网可见的门户、API、服务器、终端，以及内网里看不见的“影子资产”（例如某同事私下搭的测试站）全部登记成账。你没法保护自己根本不知道存在的资产。
      - card:
          title: 漏洞排优先级：为什么不能只看理论严重分
          body: |
            资产梳理后再跑扫描，大型组织常一次扫出上千漏洞。**基于风险的漏洞优先级排序（risk-based vulnerability prioritization）** 不只看漏洞本身的严重分，而是综合三个维度排修复顺序：

            - **暴露面**：漏洞是否直接挂在公网上任人连接；
            - **可利用性**：是否已有公开利用脚本或正在野外被利用；
            - **资产价值**：是否涉及核心数据或直连内网关键系统。

            公网暴露且易于利用的“中危”漏洞，往往比完全离线机器上的“高危”漏洞更紧急。
      - item:
          id: q1
          type: choice
          prompt: 安全团队同时发现两个漏洞：漏洞甲位于对外公网 API 上，网上已有现成利用脚本，且该服务器连着客户订单库；漏洞乙理论危害分略高，但位于完全断网隔离的旧演示机上，平时无人使用。按基于风险的优先级排序，应优先修复哪一个？
          options:
            - text: 优先修复漏洞乙，按理论危害分从高到低排序最客观，不应受网络位置干扰
              why: 脱离暴露面和现实可利用性只看静态评分，会把宝贵人力耗在极难被触及的机器上
            - text: 优先修复漏洞甲，因为它直接暴露在公网、已有利用脚本且直连核心订单库
              correct: true
            - text: 两个漏洞都暂缓处理，等监控告警捕捉到真实入侵流量后再启动应急修补
              why: 漏洞甲正面临极高被立即利用的风险，不能等造成实际损失后才补救
            - text: 先把旧演示机临时接入公网复现漏洞乙的利用难度，再决定两者的先后顺序
              why: 把离线设备暴露到公网会人为扩大攻击面，属于危险操作
          explain: 基于风险的优先级排序要结合暴露面、现实可利用性与资产重要度综合判断。公网暴露且有公开利用脚本的漏洞甲风险紧迫度远高于离线演示机上的漏洞乙。
      - card:
          title: 收缩攻击面的四条核心手段
          body: |
            梳理清楚之后，接下来就是实打实地**收缩暴露面**：

            1. **关闭不需要的服务与端口**：网页服务器只开加密网页端口，关掉多余的文件共享、远程调试端口。
            2. **删除不用的功能、旧接口与默认账号**：下线活动结束后及时撤掉旧页面，删掉演示接口和出厂默认账号。
            3. **把内部管理界面收回内网**：后台管理面板绝不裸露在公网，限制为只能通过公司内网或加密虚拟专用网络（**VPN**）访问。
            4. **精简第三方依赖并及时更新**：每多引一个开源库，它的漏洞都会变成你的攻击面；去掉用不到的依赖，并及时升级有已知缺陷的版本。
      - card:
          title: 攻击面混淆与蜜罐：主动增加对手的成本
          body: |
            除了尽量把真实入口藏严、缩紧，防守方有时还会用**攻击面混淆**增加攻击者的侦察难度，其中最常见的工具叫**蜜罐（honeypot）**。

            蜜罐是刻意部署在真实系统旁边的仿真诱饵——例如一个看起来像旧版数据库或管理后台的假入口，里面没有真实业务数据。正常员工和真实业务几乎不会访问它，因此**蜜罐收到连接或登录试探，本身就是很强的恶意侦察信号**（偶尔也会是配置错误的扫描或健康检查，仍要人工确认）。防守方既能尽早拉响误报很少的告警，又能拖住对手的精力。
      - item:
          id: q2
          type: choice
          multi: true
          prompt: 一家公司准备对线上商城系统实施“攻击面收缩”。下面哪些做法能够有效缩小攻击面？（多选）
          options:
            - text: 关闭服务器上业务用不到的网络服务与多余监听端口
              correct: true
            - text: 删除去年双十一活动遗留的废弃接口、测试页面和默认演示账号
              correct: true
            - text: 把商品管理后台从公网撤下，改为仅限通过企业 VPN 与内网访问
              correct: true
            - text: 卸载项目里早已不再调用的第三方依赖库，并升级保留库的已知漏洞版本
              correct: true
            - text: 为了方便排查故障，把测试环境的数据库端口临时映射到公网，用完再关
              why: 这是新开了一个对外入口，攻击面变大了；“临时”的端口常常忘了关，测试库里也常有真实数据
          explain: 关端口服务、删废弃功能与默认账号、把管理后台收回内网/VPN、精简并更新第三方依赖，是缩小攻击面最经典也最立竿见影的四类工程措施。
      - item:
          id: q3
          type: choice
          prompt: 在内部安全评估中，为什么一个“仅能从公司内网访问、没有暴露在公网上”的管理员后台，依然必须纳入资产盘点与防护范围？
          options:
            - text: 管理员后台权限极高，一旦遭遇内网横向移动或配置失误暴露，损失将极其严重
              correct: true
            - text: 只要内网服务器连着局域网交换机，公网上的扫描器就能直接越过防火墙访问它
              why: 正常配置的内网隔离能挡住直接的公网连接，但挡不住已经进入内网的攻击者或内部威胁
            - text: 仅内网访问的服务无法部署多因素认证与集中审计日志，因此风险高于公网系统
              why: 内网后台同样可以部署强认证、授权和审计日志，不能因为它藏在内网就省去防护
            - text: 内网后台本质上属于攻击面混淆用的蜜罐，必须随时监控其诱饵状态
              why: 真实生产管理后台承载高权限业务，与不承载真实业务的仿真蜜罐完全不同
          explain: 暴露面只是风险的一个维度。内网管理后台掌控着极高权限与核心资产，一旦攻击者通过钓鱼邮件或外围漏洞进入内网并横向移动，未加固的内网后台就会成为突破口。
      - item:
          id: q4
          type: choice
          prompt: 为什么在企业内网合理部署“蜜罐”通常能产生误报极低的早期入侵告警？
          options:
            - text: 蜜罐串联在真实业务流量之前，能像防火墙一样过滤全部正常用户的请求
              why: 蜜罐绝不承载或转发真实业务流量，以免影响生产或反而放大风险
            - text: 正常员工与真实业务都不会访问这个假入口，任何连接与探测几乎都指向恶意侦察
              correct: true
            - text: 蜜罐能够自动对公网发起反击溯源，在攻击者接入内网前就阻断其主机
              why: 蜜罐用于诱捕、观测和预警，不具备也不被允许去破坏外部主机
            - text: 只要在内网部署了蜜罐，真实服务器就能省去漏洞修补与最小权限配置
              why: 蜜罐属于检测与延缓手段，不能替代真实资产的漏洞修复与攻击面收缩
          explain: 蜜罐不对外提供任何正常服务，正常用户没有理由去连它；因此只要监控到针对蜜罐的端口扫描或登录尝试，大概率是攻击者正在侦察，能以极低误报提前预警。

  - id: risk-economics-and-quantification
    chapter: 攻击面与风险管理
    title: 安全经济学与风险量化（SLE 与 ALE）
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一家小书店每年因零星失窃损失大约 3000 元。有人向老板推销一套每年运维费 15 万元的银行级金库防盗门系统。如果你是书店老板，你会买吗？
          options:
            - text: 会买，因为安全必须不计任何代价做到百分百完美
              why: 防护成本远超潜在损失本身，这笔投入在事件还没发生前就已经让书店亏得更惨
            - text: 不会，因为每年花 15 万元去防 3000 元的损失得不偿失
              correct: true
            - text: 会买，因为装了它以后失窃损失能降到 0，长远看总能回本
              why: 每年省下最多 3000 元，却每年多花 15 万元，永远回不了本；而且门再好也挡不住店内顺手牵羊
          explain: 安全不是无上限的军备竞赛。投入多少防护预算，要看资产值多少钱、多容易出事、以及防护措施能帮我们省下多少损失。
      - card:
          title: 安全是一门经济学与风险五要素
          body: |
            **安全是一门经济学（security is economics）**：世上没有完全的零风险，防护投入须与期望损失成比例，且攻击者总走最薄弱环节。

            评估风险要拆清五要素：**资产**、**威胁**、**漏洞**、**可能性**与**影响**。算账前组织还需先明确**风险偏好（risk appetite）**（总体愿担多少风险）和**风险承受能力（risk tolerance）**（能扛住的最大损失上限）。
      - item:
          id: q0
          type: choice
          prompt: 某团队做风险评估时，只统计了服务器上的漏洞数量，却既没有盘点服务器上存的数据值多少钱，也没评估这些漏洞被利用的可能性。这说明他们漏掉了风险评估的哪些关键要素？
          options:
            - text: 漏掉了资产价值、发生可能性与影响评估，单靠漏洞数无法权衡防护投入
              correct: true
            - text: 只要漏洞数超过阈值就应优先全额修复，不必再估算潜在财务影响
              why: 漏洞数量不等于财务损失，防护投入必须与资产价值和期望损失相匹配
            - text: 漏掉了为每台服务器购买安全保险，因为风险评估必须先完成风险转移
              why: 保险属于评估之后的可选风险处置策略，而不是风险五要素之一
            - text: 漏掉了将未修补漏洞清单公开在首页，以便通过外部监督满足香农准则
              why: 香农准则针对加密算法设计，不是要求在修补前公开自家未修漏洞清单
          explain: 完整的风险评估需要结合资产、威胁、漏洞、可能性和影响五个要素。脱离资产价值与发生概率，单看漏洞条数无法做出合理的经济决策。
      - card:
          title: 定量风险公式：SLE、ARO 与 ALE
          body: |
            风险管理常用定量公式算账：记资产价值为 **AV**，单次事件损失比例为**暴露因子（EF）**，年均发生次数为**年发生率（ARO）**。

            **单次损失期望（SLE）** 等于资产价值乘以暴露因子：

            $$\text{SLE} = \text{AV} \times \text{EF}$$

            **年度损失期望（ALE）** 等于单次损失期望乘以年发生率：

            $$\text{ALE} = \text{SLE} \times \text{ARO}$$
      - card:
          title: 例题：一项安全控制措施值不值得买？
          body: 一套线上业务服务器资产价值 $AV = 40$ 万元，单次勒索事件暴露因子 $EF = 25\%$，预计年发生率 $ARO = 0.6$ 次/年。现有防护方案年费 $1.5$ 万元，能把 $ARO$ 降到 $0.2$ 次/年。逐步算出它值不值得投入。
          reveal:
            - title: 第 1 步：算单次损失期望 SLE 与控制前 ALE
              body: |
                $$\text{SLE} = 40 \times 25\% = 10\text{ 万元}$$

                $$\text{ALE}_{\text{控制前}} = 10 \times 0.6 = 6\text{ 万元/年}$$
            - title: 第 2 步：算实施控制后的新 ALE 与减少的损失
              body: |
                防护把年发生率降到 $0.2$：

                $$\text{ALE}_{\text{控制后}} = 10 \times 0.2 = 2\text{ 万元/年}$$

                每年减少的期望损失 $= 6 - 2 = 4$ 万元/年。
            - title: 第 3 步：扣除年费算净收益，做出决策
              body: |
                $$\text{年净收益} = (\text{ALE}_{\text{控制前}} - \text{ALE}_{\text{控制后}}) - \text{年控制成本} = 4 - 1.5 = 2.5\text{ 万元/年}$$

                年净收益为正（省下 4 万只花 1.5 万），这项防护**值得做**。注意即使实施后，仍剩下每年 $2$ 万元的期望损失，这就是**残余风险（residual risk）**。
      - item:
          id: q1
          type: number
          prompt: 某数据资产价值为 60 万元，一次数据泄露事件的暴露因子（EF）为 30%，预计年发生率（ARO）为 0.5 次/年。该风险的年度损失期望（ALE）是多少万元/年？
          answer: 9
          unit: 万元/年
          hint: 一次事件损失多少？一年平均发生几次？
          explain: 单次损失期望 $\text{SLE} = 60 \times 0.30 = 18$ 万元；年度损失期望 $\text{ALE} = 18 \times 0.5 = 9$ 万元/年。
      - item:
          id: q2
          type: number
          prompt: 某系统资产价值 80 万元，单次入侵暴露因子为 25%，当前年发生率为 0.4 次/年。一项每年花费 2 万元的防护措施可以把年发生率降到 0.1 次/年。实施该措施后，每年带来的净收益是多少万元/年？
          answer: 4
          unit: 万元/年
          hint: 控制措施每年省下的预期损失，和它每年的成本比，哪个大？
          explain: $\text{SLE} = 80 \times 0.25 = 20$ 万元；控制前 $\text{ALE} = 20 \times 0.4 = 8$ 万元/年；控制后 $\text{ALE} = 20 \times 0.1 = 2$ 万元/年；减少损失 $6$ 万元，扣除成本 $2$ 万元，年净收益为 $4$ 万元/年，值得投入。
      - card:
          title: 风险处置的四种策略与残余风险
          body: |
            算完风险大小后，常用四种策略处置：

            - **降低**：靠补漏洞、加 MFA、做备份降低发生率或影响。
            - **转移**：通过安全保险或合规外包分担财务后果。
            - **回避**：直接砍掉高风险功能或停止收集敏感数据。
            - **接受**：风险低于承受上限且防护贵于损失时，经书面审批自担。

            实施措施后仍剩下的部分即**残余风险**，须确认它不超组织的风险承受能力。
      - item:
          id: q3
          type: match
          prompt: 将下面四个企业的真实决策与对应的风险处置策略配对。
          pairs:
            - [给全部公网系统上线多因素认证并修补高危漏洞, 降低]
            - [购买网络安全责任险，以覆盖重大事故时的部分赔付支出, 转移]
            - [发现某项非核心位置采集功能隐私风险过大，直接下线该功能, 回避]
            - [老旧内网打印机的卡纸停机风险极低且改造太贵，书面记录后暂不处理, 接受]
          explain: 技术加固减少发生率或影响是“降低”；保险与合规外包分担损失是“转移”；砍掉高风险功能是“回避”；成本高于损失且在承受范围内经审批自担是“接受”。
      - item:
          id: q4
          type: choice
          prompt: 关于“残余风险”，下面哪一项理解是准确的？
          options:
            - text: 只要安全团队工作合格，实施防护措施后残余风险就一定会降为精确的 0
              why: 现实系统总存在未知缺陷、人为失误或极端自然灾害，风险通常只能降低到可承受水平而非归零
            - text: 实施控制后仍保留下来的风险，须确认其不超过组织的风险承受能力
              correct: true
            - text: 残余风险指购买网络安全保险之后，完全不需要再做任何监控或复审的部分
              why: 保险只能转移部分财务赔付，不能替代日常防护与持续监察，且业务变化会让残余风险重新升高
            - text: 残余风险就是控制措施每年的软件采购和维护费用
              why: 采购和维护费是控制成本，残余风险是控制之后依然可能发生的预期损失
          explain: 任何控制措施都很少把风险压成零。风险管理的闭环是确认残余风险落入可承受范围，由责任人书面签认，并持续监控它是否随业务变化反弹。

  - id: detect-respond-and-governance
    chapter: 攻击面与风险管理
    title: 无法预防就检测：监控、响应与持续治理
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 家里装了很结实的防盗门和防盗窗，为什么很多银行金库和商店仍然会在室内安装红外报警器和监控摄像头？
          options:
            - text: 因为防盗门和监控不能同时工作，装监控是为了替代锁门
              why: 监控不能替代锁门，它是为了在门锁被突破时第一时间发现并留证
            - text: 没有任何预防防线百分百打不开，须能及时发现并止损
              correct: true
            - text: 因为门窗已经够结实，报警器和摄像头主要是为了让保险费便宜一点
              why: 保费可能因此下降，但它们的安全作用是在门窗被突破后及时发现、留下证据
          explain: 现实里，预防措施总有被绕过的一天。安全工程把这条列为独立原则：无法预防就检测。
      - card:
          title: 预防、检测、响应与恢复闭环
          body: |
            只靠预防的防线就像一座没有哨兵的城墙：攻击者一旦找到缺口钻进来，可以在里面安静潜伏几个月、慢慢把全部数据搬空而不被发现。

            因此，完整防护必须是一条闭环：
            1. **预防**：收紧权限、打补丁、做认证，挡住绝大多数攻击；
            2. **检测**：通过日志和监控尽早发现可疑迹象；
            3. **响应**：确认入侵后立刻隔离受感染机器、吊销泄露凭据、阻断外传；
            4. **恢复与复盘**：从干净备份还原业务，查清根因并补上漏洞。
      - card:
          title: 审计日志：既要记全，更要防篡改
          body: |
            检测和事后取证的核心依据是**审计日志（audit log）**。一条有用的审计日志至少要回答五个问题：**谁**（账号）、**何时**（统一精确时间戳）、**从哪来**（来源网段）、**做了什么**（操作与目标）、**结果如何**（成功或失败）。

            日志最怕两件事：
            - **没记关键信息或记了不该记的**：漏记失败登录就抓不到密码喷洒；把用户明文口令打进日志则会制造二次泄露。
            - **只存在本机硬盘**：攻击者拿下服务器后第一件事往往就是清空本机日志抹掉脚印。因此必须把日志实时同步到独立、只追加写入的集中日志服务器。
      - item:
          id: q1
          type: choice
          prompt: 某台业务服务器疑似被入侵，运维人员登录上去想查清攻击者是什么时候进来的，却发现本机的登录日志文件被清空成了空文件。为了在今后避免这种情况，最关键的改进是什么？
          options:
            - text: 把本机日志文件名改成隐藏文件，避免入侵者顺手发现并清空
              why: 隐藏文件属于隐匿式安全，拿下服务器权限的攻击者一条命令就能列出全部隐藏文件
            - text: 将审计日志实时同步到独立隔离、只追加写入的集中日志服务器
              correct: true
            - text: 减少登录日志记录项，只保留每日汇总条数来降低被清理的价值
              why: 缺少谁、何时、从哪来等明细会让检测与取证失明，且汇总文件同样会被清空
            - text: 把本机日志改存到应用安装目录中，并取消本机磁盘的写入权限缓存
              why: 只要日志仍只存在被攻陷的同一台主机上，拿到高权限的攻击者依然能够篡改或清除
          explain: 攻击者控制目标主机后可以轻易删除或改写本机日志。把审计日志实时外送到独立隔离、只追加的集中存储，才能保住时间线与不可抵赖证据。
      - card:
          title: 误报与漏报的权衡：告警疲劳的陷阱
          body: |
            设计入侵检测规则时，会遇到一对天然矛盾：

            - **误报（false positive）**：把正常用户的合法操作错当成攻击发了告警。误报太多会让安全值班人员产生“告警疲劳”，最后习惯性把告警全部忽略。
            - **漏报（false negative）**：把真正的攻击当成正常行为放过去了，导致入侵悄无声息地蔓延。

            把判定门槛调得太敏感，漏报少了但误报暴涨；把门槛调得太宽松，误报少了却容易漏掉真入侵。而且在安全场景里，正常访问的数量往往远大于真实攻击，哪怕很低的误报率也会堆出成堆假警报。
      - card:
          title: 例题：为什么“1% 误报率”会让 9 成告警全是假的
          body: 看看基率悬殊时，一条听起来很准的检测规则在真实运维值班台上的表现。
          reveal:
            - title: 第 1 步：写出一天里的真实访问构成
              body: |
                假设网站一天收到 $10{,}000$ 次正常登录，同时夹杂了 $10$ 次真实黑客入侵。
            - title: 第 2 步：分别算出真告警与误报数量
              body: |
                假设检测规则能抓出 $100\%$ 的真实入侵（$10$ 条真告警，漏报为 $0$），但对正常登录有 $1\%$ 的误报率：

                $$\text{误报数} = 10{,}000 \times 1\% = 100\text{ 条}$$

                一天总共响起 $10 + 100 = 110$ 条告警。
            - title: 第 3 步：算真实攻击在所有告警中的占比
              body: |
                $$\frac{10}{110} \approx 9.1\%$$

                超过 $90\%$ 的告警都是假警报。因此实战里常通过关联多条信号（例如“同来源短时间失败多次 + 随后成功 + 异地登录”）来同时压低误报而不显著增加漏报。
      - item:
          id: q2
          type: number
          prompt: 某系统一天内有 4,000 次正常登录和 20 次真实攻击。检测规则抓住了全部 20 次真实攻击，但对正常登录产生了 2% 的误报率。在这一天收到的全部告警中，真实攻击所占的百分比是多少？（只填百分号前的数字）
          answer: 20
          unit: '%'
          hint: 一天的告警由哪两部分组成？假告警的条数取决于哪个数？
          explain: 误报数为 $4{,}000 \times 2\% = 80$ 条，真告警为 $20$ 条，总告警数为 $80 + 20 = 100$ 条。真实攻击占比为 $20 \div 100 = 20\%$（其余 80% 都是误报）。
      - card:
          title: 持续监察：用 KRI 与 KPI 盯住风险趋势
          body: |
            风险评估不能一年交完报告就束之高阁，须靠两类指标持续盯盘：

            - **关键风险指标（KRI）**：提前预警风险升高，例如公网超期未修的高危漏洞数、长期未回收特权账号占比。
            - **关键绩效指标（KPI）**：衡量防护与处置效率，例如**平均检测时间（MTTD）** 与**平均处置耗时（MTTR）**。

            定期把 KRI 与 KPI 汇报给责任人，风险管理才真正形成闭环。
      - item:
          id: q3
          type: order
          prompt: 将面对一次真实安全入侵时，标准安全闭环的四个阶段按先后顺序排列。
          steps:
            - 预防：日常通过最小权限、打补丁与多因素认证减少入侵面
            - 检测：通过集中审计日志与多信号告警发现可疑入侵行为
            - 响应：隔离受影响主机、吊销泄露凭证并阻断数据继续外传
            - 恢复与复盘：从干净备份还原服务，查明根因并加固防线
          explain: 事前预防、事中检测与快速响应止损、事后恢复业务并复盘加固，共同构成持续演进的安全闭环。
      - item:
          id: q4
          type: choice
          prompt: 某公司把入侵检测规则的告警门槛调得非常宽泛，导致每天弹出 3000 条真假难辨的告警，值班工程师根本看不过来，结果一条真正的数据库外泄告警埋在里面被错过了。这反映了什么问题？
          options:
            - text: 过高的误报率引发告警疲劳，导致真实入侵在人工值班环节被漏掉
              correct: true
            - text: 日告警总数达到 3000 条，说明系统的平均检测时间（MTTD）已大幅缩短
              why: 告警数量多不代表检测准确，大量无效告警反而会大幅拉长识别真实入侵的时间
            - text: 说明检测规则本身出现了严重漏报，系统根本没有触发数据库外泄告警
              why: 题干明确说明真实告警已经触发，只是被淹没在海量误报里导致值班人员错过
            - text: 说明应当将告警阈值直接收紧到零误报，这样就能同时把漏报也降为零
              why: 单纯大幅收紧阈值虽能减少误报，却会显著推高漏报；正确做法是关联多维信号提高精确率
          explain: 误报和漏报不是孤立的：误报泛滥会把值班人员的注意力耗干，让真实入侵藏在海量噪音里，最终酿成事实上的漏报。

boss:
  items:
    - id: b1
      type: choice
      prompt: 某高校教务系统中，攻击者既没有偷看学生家庭信息，也没有篡改任何课程成绩，而是利用漏洞让选课服务器在开放选课当天持续崩溃无法打开。这次攻击最直接破坏了 CIA 三要素中的哪一项？
      options:
        - text: 机密性，因为学生无法打开网页查看公开课表
          why: 公开课表不属于需要保密的敏感信息，且未发生未授权窃取
        - text: 完整性，因为服务器崩溃重启会清空内存中的缓存
          why: 题干明确说明课程成绩等持久化数据没有被篡改，最直接受损的是服务能否按时使用
        - text: 可用性，因为合法用户在选课期间无法正常访问服务
          correct: true
        - text: 不可抵赖性，因为系统无法记录学生是否提交过选课请求
          why: 不可抵赖性不在 CIA 三要素之内，且此处核心问题是系统瘫痪无法提供服务
      explain: CIA 三要素中，可用性保障合法用户在需要时能及时访问系统与数据；选课期间服务器瘫痪直接破坏了可用性。
    - id: b2
      type: choice
      prompt: 某团队自研了一套把明文字符按固定表格替换的加密办法，并宣称“只要我们的替换代码不开源，黑客就肯定解不开”。按香农准则来评判，这种思路属于什么？
      options:
        - text: 纵深防御，因为团队把算法逻辑和源码同时藏在了双层私有仓库里
          why: 隐藏单一脆弱算法不是多层独立防线，不属于纵深防御
        - text: 隐匿式安全，安全性只依赖对手不知晓算法细节
          correct: true
        - text: 完全中介，因为每次加解密操作都必须重新查询团队内部的替换表格
          why: 完全中介指对资源的每次访问都执行权限核验，与加密算法是否保密无关
        - text: 最小权限原则，因为只有核心开发团队成员能够读取这段加密源码
          why: 限制源码可见范围不能替代经过公开审查的现代加密算法
      explain: 香农准则要求假设对手完全知道系统设计与算法，安全只能建立在强密钥和受控机制上；指望藏起简单替换规则来保密属于脆弱的隐匿式安全。
    - id: b3
      type: choice
      prompt: 下列哪种登录组合构成真正的多因素认证（MFA）？
      options:
        - text: 12 位随机登录密码 + 6 位数字交易密码
          why: 两者都属于“你知道的”同一类因素，仍为单因素认证
        - text: 登录密码 + 回答预设的密保问题答案
          why: 口令和密保答案都属于“你知道的”类别，且密保答案往往容易被猜出
        - text: 登录密码 + 插入实体硬件安全密钥并轻触确认
          correct: true
        - text: 输入注册电子邮箱 + 12 位随机登录密码
          why: 电子邮箱是公开身份标识而非认证因素，整个组合仍只包含“你知道的”单因素
      explain: 登录密码属于“你知道的”，实体硬件安全密钥属于“你拥有的”，两类不同性质的证据结合才构成真正的多因素认证。
    - id: b4
      type: number
      prompt: 从包含 64 个不同字符的字符集中独立随机选取 6 个字符组成口令（允许重复）。已知 $64 = 2^6$，该口令的理论口令熵是多少比特？
      answer: 36
      unit: 比特
      hint: 一个字符贡献多少比特？几个独立字符的熵怎样合起来？
      explain: 组合总数 $N = 64^6 = (2^6)^6 = 2^{36}$，因此口令熵 $\log_2(2^{36}) = 36$ 比特。
    - id: b5
      type: choice
      prompt: 在数据库存储用户口令时，为什么工程标准要求“每用户独立加盐”并且使用“慢哈希（KDF）”，而不是直接存裸 SHA-256？
      options:
        - text: 裸 SHA-256 属于双向加密算法，攻击者拿到摘要后就能直接反向解回明文
          why: SHA-256 本身是单向哈希而非双向加密，它的短板在于对口令场景而言计算太快且无盐
        - text: 独立加盐可防彩虹表与同口令碰撞，慢哈希能大幅抬高离线暴力破解成本
          correct: true
        - text: 独立加盐可降低单次哈希计算耗时，慢哈希则用来校验传输通道是否被篡改
          why: 慢哈希是刻意增加单次计算开销以拖慢离线猜解，与传输通道校验不是一回事
        - text: 只要为全站共用一个固定盐值，裸 SHA-256 就能同时防彩虹表与显卡穷举
          why: 全站共用固定盐防不住同口令碰撞，裸 SHA-256 依然挡不住显卡高速离线穷举
      explain: 独立随机盐让相同口令生成不同摘要并使通用彩虹表失效；慢哈希（KDF）把离线每次尝试的代价放大成千上万倍，两者缺一不可。
    - id: b6
      type: match
      prompt: 将四种访问控制机制或模型与它们对应的工程场景配对。
      pairs:
        - [访问控制列表（ACL）, 每个文件自带权限清单，便于审计谁能访问及一键移除离职员工]
        - [能力令牌（Capability）, 主体持有不可伪造的权限钥匙，传给协助程序可避免糊涂代理人问题]
        - [RBAC（基于角色）, 大型企业按岗位角色统一打包权限，方便人员入职与调岗管理]
        - [MAC（强制访问控制）, 涉密系统按全局密级标签强制裁决，创建者也不得私自降级外发]
      explain: ACL 按资源存名单便于撤销；能力令牌由主体持有便于安全委派并避免糊涂代理人；RBAC 靠岗位角色简化运维；MAC 靠全局密级强制管控。
    - id: b7
      type: choice
      prompt: 某系统把权限检查函数写成：正常查表返回是否允许；如果数据库连接失败报错，为了不阻断业务就返回 `True`。同时，该系统还把 50 万行负责解析第三方视频格式的代码直接塞进了操作系统内核。这两处设计分别违背了哪两条原则？
      options:
        - text: 分别违背了失效安全默认值与保持 TCB 精简
          correct: true
        - text: 分别违背了完全中介原则与职责分离原则
          why: 报错时自动放行违背的是默认拒绝方向，内核塞入庞大解析代码则是膨胀了 TCB，而非缺少多人审批
        - text: 分别违背了香农准则与最小权限原则
          why: 报错自动放行与算法是否公开无关，且把不可信解析器放入内核的核心问题是破坏 TCB 精简
        - text: 分别违背了纵深防御与强制访问控制（MAC）
          why: 这两处缺陷分别指向异常时的默认放行方向和特权内核代码膨胀，与密级标签模型无关
      explain: 鉴权出错时返回 `True` 违背了失效安全默认值（应默认拒绝）；把庞大的不可信视频解析代码塞进高特权内核大幅膨胀了可信计算基（TCB）。
    - id: b8
      type: choice
      prompt: 某高权限程序先按路径名检查 `/tmp/report.txt` 属于普通用户，随后再按该路径名打开文件写入数据。攻击者趁检查和打开之间的间隙把它替换成指向系统敏感文件的路径快捷方式（symlink）。这类漏洞叫什么？最稳妥的根治方式是什么？
      options:
        - text: 糊涂代理人漏洞；应为该程序单独签发一份按路径生效的只读能力令牌
          why: 根因是检查与打开之间存在并发掉包缝隙，而非程序混淆了自身与调用方权限
        - text: 检查时与使用时（TOCTTOU）漏洞；应拒绝跟随快捷方式一次打开后直接查句柄
          correct: true
        - text: 完全中介缺失；应在检查与写入之间等待 1 秒后再次按路径名核对文件归属
          why: 增加延时与二次按路径检查只会拉长或增加可被掉包的时间窗口，无法消除并发缝隙
        - text: 权限粒度过粗；应把共享目录改为基于角色的访问控制以限制普通用户建文件
          why: 即便在允许普通用户写文件的目录内，只要按路径先查后开，依然存在并发掉包风险
      explain: 检查时与使用时之间的间隙被利用掉包属于 TOCTTOU 竞态漏洞。用不跟随路径快捷方式的原子打开获取句柄并直接检查句柄，才能把检查与使用锁死在同一个文件实体上。
    - id: b9
      type: number
      prompt: 某在线系统资产价值 100 万元，单次严重停摆的暴露因子（EF）为 20%，当前年发生率（ARO）为 0.5 次/年。现有一套每年运维成本 3 万元的加固方案，可将年发生率降至 0.1 次/年。实施该方案后的年度净收益是多少万元/年？
      answer: 5
      unit: 万元/年
      hint: 加固每年省下的预期损失是多少？再扣掉什么？
      explain: $\text{SLE} = 100 \times 20\% = 20$ 万元；加固前 $\text{ALE} = 20 \times 0.5 = 10$ 万元/年；加固后 $\text{ALE} = 20 \times 0.1 = 2$ 万元/年；年减少损失 $8$ 万元，扣除成本 $3$ 万元，净收益为 $5$ 万元/年。
    - id: b10
      type: choice
      multi: true
      prompt: 团队正在评审一个新上线的“用户上传附件”功能，并希望同步收缩攻击面与完善检测能力。下面哪些措施直接有效？（多选）
      options:
        - text: 在服务端校验文件真实内容、剥离元数据并存放在禁止执行代码的独立目录
          correct: true
        - text: 限制单文件体积与上传频率，同时把管理后台收回内网或 VPN 之后
          correct: true
        - text: 将上传操作与失败告警实时同步到独立只追加的集中审计日志服务器
          correct: true
        - text: 在前端隐藏高危上传接口入口并仅校验 `.jpg` 后缀名，借隐蔽性替代服务端内容检查
          why: 隐藏入口和仅在前端校验后缀名违背了香农准则与完全中介，攻击者可直接向服务端发送恶意文件
      explain: 服务端验内容/去元数据/禁执行对应 STRIDE 中的权限提升与信息泄露；限大小限频与后台收回内网防范拒绝服务并缩小攻击面；集中只追加日志保障检测与不可抵赖性。
