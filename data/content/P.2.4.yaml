skill: P.2.4
version: 2
authors: [main-agent]
brief:
  why: |
    代码写得越长，光靠“手动复制文件夹备个份、到处插 print 找错、每次全删重编、在自己电脑能跑却在队友机上报错”很快就会失控。现代软件工程靠五套随身工具把混乱变成秩序：Git 用有向无环快照树管住每次改动与多人合并；调试器和内存检查器让你在程序停住的瞬间看清变量与越界；Make 用依赖图只重编改动文件；虚拟环境与锁文件锁死一字不差的第三方库版本；Shell 管道、预提交检查与自动流水线把重复验证交给机器。本包从零讲透日常开发工具链，打通多条职业远征的公共地基。
  outcomes:
    - 说清 Git 工作区、暂存区与内容寻址仓库的关系，完成创建分支、三方合并、解冲突、变基以及本地撤销与远程回滚
    - 使用条件断点定位循环里的差一错误，区分系统调用追踪、内存检查器与 CPU/内存性能剖析的适用场景
    - 区分 C 源代码预处理、编译成目标文件与链接成可执行文件的过程，写出根据修改时间戳增量重建的 Makefile 规则
    - 用虚拟环境、语义化版本范围（如 ^1.2.3）与锁文件（npm ci / 哈希校验）保证多机复现安装与不可变交付
    - 熟练组合 Shell 命令行参数、标准输入输出流与管道、环境变量、退出状态与信号，串联格式化、Lint、测试覆盖率与持续集成
terms:
  - term: 暂存区
    def: Git 里介于工作目录与仓库历史之间的待提交草稿箱（Index），决定下一次提交精确打包哪些修改快照。
  - term: 提交
    def: Git 仓库里记录某时刻完整目录树快照、作者说明以及父节点指针的不可变历史节点（Commit）。
  - term: 分支
    def: 指向某一条历史提交节点的可移动标签指针，随新提交自动向前走，让人可以独立平行开发新功能。
  - term: 合并冲突
    def: 两条历史分支同时改了同一文件相邻或相同行时，Git 无法自动决定保留哪边而交由开发者手工裁决的状态。
  - term: 变基
    def: 把当前分支上新写的提交依次摘下来，按新基点提交的末端重新逐个重放一遍以保持线性历史的 Git 操作（Rebase）。
  - term: 进程
    def: 正在运行中的独立程序实例，拥有自己专属的运行空间与打开文件句柄。
  - term: 内核
    def: 操作系统的核心常驻程序，直接掌管硬件资源、文件读写与进程隔离调度。
  - term: 数组
    def: 在内存中紧挨着连续排成一排、按从零开始的下标直接定位的定长元素集合。
  - term: 预处理
    def: 编译器真正翻译 C 代码前先执行文本展开的步骤（例如把 `#include` 引入的头文件内容拼接进来）。
  - term: 地址
    def: 用来唯一标识某块数据或函数在计算机内存中所处位置的数字编号。
  - term: 断点
    def: 在调试器中预先挂在源代码某一行上的暂停标记，程序执行到该行前立刻冻结以便检查现场。
  - term: 栈帧
    def: 每次函数调用在调用栈上分配的一块独立内存区，存放该次调用的局部变量、参数与返回地址。
  - term: 内存
    def: 计算机运行程序时用来存放正在处理的数据、变量、栈帧与程序指令的主存工作空间。
  - term: 系统调用
    def: 用户程序向操作系统内核请求读写文件、分配空间或创建网络连接等受控特权服务的标准接口。
  - term: 越界
    def: 程序读写数组或缓冲区时使用了超出合法分配长度之外的下标位置，容易破坏相邻数据或崩溃。
  - term: 内存泄漏
    def: 程序动态申请了一块长期内存，用完却忘记归还释放，导致可用空间越跑越少。
  - term: 性能剖析
    def: 通过采样或计数统计程序运行期间各函数耗时与内存分配热点的测量过程（Profiling），用来找真正瓶颈。
  - term: 基准测试
    def: 在受控环境下反复运行目标函数或系统路径并统计耗时/吞吐分布的量化性能对比测试（Benchmarking）。
  - term: 编译
    def: 编译器把人类可读的源代码翻译成机器或目标指令文件的过程。
  - term: 编译器
    def: 负责检查语法类型并把高级语言源代码翻译成目标文件或可执行机器码的工具程序（如 gcc）。
  - term: 目标文件
    def: 单个源代码文件经编译器翻译后产出的未完全串联机器码片段（如 `.o` 文件），里面还留有待补全的跨文件函数引用。
  - term: 链接
    def: 链接器把多个目标文件与所需库文件拼合在一起、填补相互调用的缺口并产出最终可执行程序的过程。
  - term: 可执行文件
    def: 已经完成编译与链接、包含完整启动入口并能由操作系统直接加载运行的成品程序文件。
  - term: 头文件
    def: C/C++ 中以 `.h` 结尾的声明文件，向多个源文件提前告知函数的参数格式与数据外形而不放具体实现。
  - term: 构建规则
    def: "构建脚本里“目标文件 : 依赖文件 + 缩进重建命令”的声明条目，用来指导构建器何时需要重新编译或链接。"
  - term: 虚拟环境
    def: 为单个项目单独划出的隔离依赖目录，使不同项目可以各自安装互不冲突的第三方库版本。
  - term: 锁文件
    def: 精确记录整棵依赖树每个包具体版本号、下载来源与校验哈希的清单文件，保证人人装出完全一致的依赖环境。
  - term: 命令行参数
    def: 在终端输入命令名后紧跟的选项标记与输入路径列表，用来控制程序这次运行的行为与对象。
  - term: 环境变量
    def: 操作系统传递给新启动程序的键值对配置（如 `PATH` 或 `MODE=test`），用来在代码外注入路径和运行模式。
  - term: 退出状态
    def: 程序运行结束时返回给父终端的一个整数信号码（约定 `0` 代表成功，非零代表出错失败）。
