lessons:
  # ======================================================================== Git
  - id: git-snapshots
    chapter: Git
    title: Git 数据模型、暂存区与提交快照
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 小明改好了 `app.py` 并运行了一次 `git add app.py`。紧接着他又在编辑器里改动了 `app.py` 的第 10 行（改完保存了文件，但**没有**再次运行 `git add`），然后直接执行 `git commit -m "save"`。最后写进 Git 仓库历史记录里的 `app.py` 是哪一个版本？
          options:
            - text: 刚才运行 `git add` 那一瞬间拍下的旧版，不包含后面新改的第 10 行
              correct: true
            - text: 磁盘上最新的包含第 10 行改动的版本
              why: "`git commit` 只打包“暂存区”里的内容，不会自动把工作目录里尚未重新 `git add` 的后续修改带进去"
            - text: 两份自动混在一起变成乱码报错
              why: 工作目录与暂存区彼此独立存放不同内容快照，不会混成乱码
          explain: Git 把改代码到留历史拆成“工作区 → 暂存区 → 仓库”三段式，这恰恰能让你把十个零散修改拆分进几个干净的小提交里。
      - card:
          title: Git 存的是完整快照，而不是“改了哪两行”（5.1–5.4）
          body: |
            很多初学者以为 Git 每个版本只记“比上次多加了两行”。其实 Git 的数据模型把仓库看作一棵内容寻址的快照树：
            - **Blob**：存单个文件某一版内容（内容一变，SHA-1/SHA-256 哈希立刻变）；
            - **Tree**：记录目录结构，把文件名指向对应的 Blob 或子目录 Tree；
            - **Commit（提交）**：一个**提交**打包一棵顶层 Tree 快照、作者说明以及指向**父提交**的引用标记（没改过的文件直接复用旧 Blob，省空间又极快！）。
      - card:
          title: 三个区域：工作区、暂存区与仓库（5.6–5.9）
          body: |
            日常敲 `git status` / `git add` / `git commit` 时，其实在和三个格子打交道：
            1. **工作区（Working Tree）**：你电脑文件夹里正在用编辑器打开改动的真实文件。
            2. **暂存区（Staging Area）**：一个**暂存区**草稿箱！运行 `git add file` 把当前工作区内容拷进草稿箱准备待命。
            3. **仓库（Repository，`.git` 目录）**：运行 `git commit` 正式把暂存区当前内容永久存成一个新提交节点，挂到历史链条上。
      - item:
          id: q-git-three-areas
          type: match
          prompt: 把下面四个日常 Git 操作或名词与它们对应的机制连线。
          pairs:
            - [在编辑器修改 `main.py` 后保存但尚未执行任何 git 命令, 只改动了工作区，暂存区与历史仓库尚未感知]
            - [执行 `git add main.py`, 把工作区此刻的快照放进暂存区准备提交]
            - [执行 `git commit -m "fix"`, 把暂存区里的快照生成不可变提交节点并连向上一个父提交]
            - [同一份未改动的大文件连续出现在 50 个提交里, 内容寻址机制直接让 50 个 Tree 复用同一个 Blob 哈希编号]
          explain: 记牢三步流水线：编辑改工作区 → `git add` 进暂存区 → `git commit` 写进仓库；未改的文件内容哈希相同，自动复用省空间。
      - card:
          title: 例题：用三区模型排查“明明提交了，测试还跑出旧 Bug”
          body: |
            新手常遇到：在本地修了 Bug、测试通过了、高兴地 `git commit`，推给队友却被骂“你代码根本没修好”！按三区模型一步步排错：
          reveal:
            - title: 第 1 步：对比“工作区 vs 暂存区”
              body: 用 `git add a.py` 之后你又改了一行 `a.py` 修复边界，忘了再 `git add`！此时运行 `git status`，你会看到 `a.py` **同时**出现在“待提交的绿色修改”和“未暂存的红色修改”两栏里！
            - title: 第 2 步：养成提交前 `git diff` + `git status` 的习惯
              body: "`git diff` 看的是工作区比暂存区多改了什么；`git diff --staged` 看的是暂存区比最新提交多改了什么。提交前看一眼 `git status`，确保没有漏在红色“未暂存”列表里的关键修复！"
      - item:
          id: q-git-diff-staged
          type: choice
          prompt: 你已经运行过 `git add utils.py` 把代码放进暂存区，但工作区现在干干净净没有其它改动。在执行 `git commit` 之前，想看清楚“这一笔马上要提交的内容到底改了哪些行”，应该运行哪条命令？
          options:
            - text: "`git diff --staged`（查看暂存区与当前最新提交之间的差异）"
              correct: true
            - text: "`git diff`（默认只比较工作区与暂存区）"
              why: 既然改动都已进入暂存区、工作区和暂存区目前一模一样，不带参数跑 `git diff` 输出会是空的
            - text: "`git init`（初始化空仓库）"
              why: "`git init` 用来新建空 `.git` 仓库目录，不是查看待提交差异"
          explain: "`git diff` 默认对比工作区 vs 暂存区；加上 `--staged`（或 `--cached`）才是对比暂存区 vs 上一次提交 HEAD。"
      - item:
          id: q-git-object-hash
          type: choice
          prompt: Git 为什么宣称“只要一个提交的哈希值（如 `cc09f5c`）没变，历史上哪怕一个标点符号也绝不可能被暗中偷改”？
          options:
            - text: 提交对象的哈希值是对它指向的目录树快照哈希、所有父提交哈希、作者和提交信息整体计算出的密码学哈希，改一个字符就会让哈希链雪崩变化
              correct: true
            - text: 因为 Git 会把电脑硬盘变成只读物理光盘
              why: 磁盘文件本身可读写，防篡改靠的是从文件内容到目录树再到提交节点的层层加密哈希校验
            - text: 因为 Git 禁止在一个项目里写超过 10 个文件
              why: 无论项目有几个还是几万个文件，顶层 Tree 哈希总能唯一概括整棵文件树状态
          explain: 这正是内容寻址有向无环图（DAG）的威力：父提交哈希嵌套在子提交计算里，构成一条密码学防篡改历史链。
      - item:
          id: q-git-snapshot-vs-diff
          type: choice
          prompt: 当仓库共有 500 个文件，而你这次提交只改动了其中 1 个 2 KB 的小文件时，Git 底层仓库里如何存储这次提交才能既表示完整快照又不占 500 倍硬盘？
          options:
            - text: 仅对改动的 1 个文件生成新 Blob 哈希和新的目录 Tree 对象，其余 499 个未改动文件在 Tree 里直接引用原来的旧 Blob 哈希
              correct: true
            - text: 把 500 个文件从硬盘上全部复制一份再删掉 499 个
              why: 内容寻址对象库天生去重，相同文件内容哈希相同，Tree 直接指回老对象即可
            - text: 只把这 1 个文件修改的行号写进数据库，完全不记录其它 499 个文件存不存在
              why: 每次提交对应的 Tree 依然表达完整目录树快照，只是未改动的子节点全部指向已有对象
          explain: 内容寻址快照树同时兼具“随时秒级检出任意完整历史版本”与“未改动文件零额外存储”两大优点。

  - id: git-branches
    chapter: Git
    title: 分支指针、HEAD 与快进/三方合并
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你的仓库里有几千个源码文件、几百 MB 历史，现在你想开一个新分支 `feature` 试写一个新功能。当你在终端敲下 `git switch -c feature`（只需 5 毫秒就完成了）时，Git 在 `.git` 目录里到底干了什么？
          options:
            - text: 仅仅新建了一个 41 字符的小标记文件写入当前提交哈希，并把 `HEAD` 指向这个新名字，根本没有整目录拷贝源码
              correct: true
            - text: 把几百 MB 的全部历史文件在硬盘上再完整复制一份放到 `feature/` 文件夹
              why: 如果建分支都要完整拷几百 MB 文件，就不可能 5 毫秒切换完成
            - text: 自动删掉原来 `main` 分支上的所有历史提交
              why: "`main` 分支标记原地不动，两个分支共享从起点到分叉前的全部历史提交"
          explain: Git 的**分支**轻量到极致——它只是贴在某个提交节点上的一张可移动便利贴！
      - card:
          title: 引用（Branch、Tag 与 HEAD）（5.5、5.10）
          body: |
            如果每次找版本都要背 40 位哈希编号太痛苦了。Git 用**引用（Reference）**给提交起可读别名：
            - **分支（Branch）**：如 `main`、`feature`，本质就是存了一个提交哈希的小文件；每当你在此分支做一次新提交，当前分支标记就会自动向前跳到新提交上。
            - **HEAD**：一个特殊标记，“指向你此刻正站在哪条分支（或哪个提交）上”。`git switch -c feature` 新建分支标记并把 `HEAD` 挂过去。
      - card:
          title: 合并的两种情况：快进合并 vs 三方合并
          body: |
            当你在 `feature` 分支写完两个新提交准备并回 `main` 时，分两种情况（大纲 5.10）：
            1. **快进合并（Fast-forward）**：如果这期间 `main` 原地没动过，`main` 本来就是 `feature` 的直接祖先！Git 根本不用制造新合并节点，只需把 `main` 标记直接往前挪到 `feature` 头上！
            2. **三方合并（3-way Merge）**：如果 `main` 期间也提交了新修改，两条分支分叉了。Git 找到它们最近的**共同祖先（Base）**、对比 `main` 末梢与 `feature` 末梢三方内容，自动拼成一个**拥有两个父节点的合并提交**！
      - item:
          id: q-branch-fastforward
          type: choice
          prompt: 小红从 `main`（提交 C1）切出 `feature` 分支并提交了 C2 和 C3。这期间没有任何人动过 `main`（`main` 依然停在 C1）。她切回 `main` 运行 `git merge feature`，默认会发生什么？
          options:
            - text: 快进合并（Fast-forward）：`main` 标记直接顺路往前移到 C3，不产生额外的合并提交节点
              correct: true
            - text: 必定立刻报合并冲突并停下来让小红手工删文件
              why: "`main` 自从分叉后没有任何新改动，两边根本没有分叉修改同一行，不存在冲突"
            - text: Git 会把 C2 和 C3 全部丢弃，强迫小红重新再写一遍
              why: 合并的目的正是把 `feature` 上的成果 C2、C3 纳入 `main`
          explain: 只要目标分支是当前合并源的直接祖先，历史并没有分岔，标记直接“快进”一跳就完成了。
      - card:
          title: 例题：用拓扑步数走一遍建分支、提交与分叉合并
          body: |
            结合原技能树综合练习第 (1) 题操作一遍真实协作流：
            ```bash
            git switch -c feature
            # 改 fileA，提交 F1；再改 fileB，提交 F2
            git switch main
            # 另一位队友也在 main 上改了 fileC 并提交 M1
            git merge feature
            ```
            这时提交图会长什么样？
          reveal:
            - title: 第 1 步：两条分支从共同祖先分叉
              body: "`feature` 指向 F2（父节点 F1 → C0），`main` 指向 M1（父节点 C0）。两条历史现在形成了真正的“Y”字形分叉，共同祖先是 C0。"
            - title: 第 2 步：三方合并生成双亲节点
              body: 因为修改的是互不冲突的 `fileA/B` 与 `fileC`，`git merge feature` 自动把两边改动合在一起，产生一个同时把 M1 和 F2 当成两个父节点的新合并提交 M2，`main` 向前指到 M2！
      - item:
          id: q-head-meaning
          type: choice
          prompt: 在 Git 术语中，特殊的 `HEAD` 标记通常代表什么？
          options:
            - text: 当前正在工作所处的分支引用（或游离态下的具体提交），下一次 `git commit` 就会长在它所指的位置之后
              correct: true
            - text: 永远死死指着仓库里第一个初始化提交且永不移动
              why: 那个初始提交叫根提交（Root Commit），而 `HEAD` 会随 `git switch` 和每次新 `commit` 跟着移动
            - text: 专门用来存放电脑 CPU 型号说明的日志文本
              why: "`HEAD` 是 Git 内部文件 `.git/HEAD`，与硬件 CPU 型号无关"
          explain: 看懂 `HEAD -> main` 就看懂了当前所在位置：`HEAD` 指着哪，你新建提交时当前那条分支就往前推进哪。
      - item:
          id: q-threeway-merge
          type: choice
          prompt: 为什么两条分叉分支执行三方合并时，Git **必须**找到它们分叉前的“最近共同祖先（Base）”，而不能只比较两个分支最新末端的文件差异？
          options:
            - text: 只看两个最新文件无法判断某一行差异究竟是“甲分支删掉了旧代码”还是“乙分支新添了这行代码”；必须对照共同祖先才能分辨哪边动了手脚
              correct: true
            - text: 因为只对比两个文件时计算机无法读取换行符
              why: 换行符在两个文件里都能正常读取，缺乏共同祖先丢失的是“谁相对原本状态做了改变”的方向信息
            - text: 因为 Git 规定每个仓库同时只能看 3 个文件名
              why: “三方”指的是同一个文件的三个历史版本（共同祖先 Base、当前分支 Ours、待合并分支 Theirs），不是限制文件个数
          explain: 举个例子：祖先是 `X`，甲分支没动还是 `X`，乙分支改成 `Y`。只看甲=`X`、乙=`Y` 会傻眼不知道听谁的；对照祖先 `X` 就秒懂“甲没改、乙改成了 `Y`，所以应该采用 `Y`”！
      - item:
          id: q-git-branch-delete
          type: choice
          prompt: 某团队成员把 `feature` 分支的改动用 `git merge feature` 成功合并进 `main` 分支后，想执行 `git branch -d feature` 删掉这个不再需要的旧分支名。执行之后，已经合进 `main` 的历史提交记录会一起丢失吗？
          options:
            - text: 不会丢失：`feature` 只是一个可移动引用标记，删掉它不会删除任何已经连通在 `main` 历史树里的提交对象
              correct: true
            - text: 会立刻把 `main` 里刚合进去的所有文件代码全部删除
              why: 提交快照一旦并入 `main` 历史链条就成了 `main` 的祖先节点，删掉旁边不再需要的旧便利贴毫无影响
            - text: Git 会把电脑里所有的分支全部删光
              why: "`git branch -d feature` 只删除指定的 `feature` 引用标记，且只有在该分支已经安全并入时才允许用小写 `-d` 删除"
          explain: 分支只是便利贴；功能并入主干后随手清理旧分支标签是良好的仓库卫生习惯。

  - id: git-conflicts-rebase
    chapter: Git
    title: 解决合并冲突、Merge vs Rebase 与历史管理
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 刚才 `main` 和 `feature` 分叉后，小王在 `main` 上把 `config.py` 第 5 行的超时改成了 `timeout = 30`，你同时在 `feature` 上把同一文件同一行改成了 `timeout = 60`。执行 `git merge feature` 时 Git 会怎样？
          options:
            - text: 停下来报告合并冲突，在文件里用 `<<<<<<<`、`=======`、`>>>>>>>` 标出两边版本，等你手工编辑决定后再 `git add` 和 `git commit` 完成合并
              correct: true
            - text: 自动把 30 和 60 取平均值写成 `timeout = 45`
              why: Git 不会自作主张对业务配置取平均值或丢掉一方修改，同一位置双方都改就必须由人裁决
            - text: 自动把整个项目的历史记录全部清空
              why: 遇到冲突只是暂停本次合并过程，敲 `git merge --abort` 随时可以恢复合并前原状
          explain: 冲突不是灾难，只是 Git 老实告诉你：“同一行两边都改了，请程序员拍板留哪版（或怎么融合）”。
      - card:
          title: 合并冲突标记与四步排雷流程（5.10）
          body: |
            发生**合并冲突（merge conflict）**时，打开冲突文件会看到三段清晰标记：
            ```text
            <<<<<<< HEAD (当前所在分支)
            timeout = 30
            =======
            timeout = 60
            >>>>>>> feature
            ```
            四步解决：① 删掉那三行标记符，只留下最终正确的业务代码；② 运行测试确认改完没错；③ `git add <文件>` 标记冲突已解；④ `git commit` 完成这次合并提交！
      - card:
          title: Merge vs 变基（Rebase）（5.10、5.13）
          body: |
            把 `feature` 的改动合进团队主干时，除了直接 `git merge` 生成分叉节点外，还可以用**变基（rebase）**：

            `git switch feature` 然后 `git rebase main`，Git 会把你在 `feature` 上写的 F1、F2 暂时摘下，先把起点挪到 `main` 最新末端 M1 上，再按顺序把 F1、F2 重新应用一遍（生成全新哈希的新提交 F1'、F2'），最后 `main` 就能一条直线快进合并！

            **黄金禁忌**：千万别对**已经推送到公共共享分支**且队友已经基于它继续开发的历史做 `rebase`！因为变基改写了历史提交的父节点连接和哈希，会让公共历史分叉打架。
      - item:
          id: q-conflict-steps
          type: order
          prompt: 当运行 `git merge feature` 遇到某文件产生合并冲突时，请把手工解决冲突并完成合并的正确操作顺序排出来。
          steps:
            - 打开冲突文件，定位 `<<<<<<<`、`=======`、`>>>>>>>` 标记区域
            - 手工编辑保留或整合最终正确的代码，并彻底删掉冲突标记行
            - 运行测试验证合并后的代码逻辑正常，执行 `git add` 标记冲突已解决
            - 执行 `git commit` 生成合并提交（或若想放弃则运行 `git merge --abort`）
          explain: 最常见低级失误是忘记删除 `<<<<<<<` 等文本标记直接保存运行，导致语法报错；务必删净标记、测试、`add`、`commit`。
      - card:
          title: 例题：动手把一份冲突的 `config.py` 修成能跑通的新版本
          body: |
            运行 `git merge feature` 后，`config.py` 停在了冲突状态，打开看见 `<<<<<<< HEAD`、`timeout = 30`、`=======`、`timeout = 60`、`>>>>>>> feature`。假设评审决定新接口必须用 `60` 秒超时，应该怎么做才算彻底解决？
          reveal:
            - title: 第 1 步：删净冲突标记并只保留正确配置行
              body: 绝对不能只删两行文字却留着 `<<<<<<< HEAD` 等标记行（那会让 Python 语法直接报错）！把五整行彻底替换成干干净净的 `timeout = 60` 并保存文件。
            - title: 第 2 步：跑通测试、加入暂存区再生成合并提交
              body: 运行一遍测试套件确认超时逻辑工作正常；敲 `git add config.py` 通知 Git 冲突已解，再执行 `git commit`（Git 会自动带好 `Merge branch 'feature'` 默认说明），此时就顺滑生成了包含两边心血的合并提交！
      - item:
          id: q-rebase-golden-rule
          type: choice
          prompt: 下面哪种场景最适合用 `git rebase`，哪种场景**绝对不能**用 `git rebase`？
          options:
            - text: 个人尚未推送（或仅个人独占）的本地开发分支适合 `rebase main` 整理成线性提交；已经推送到团队公共共享分支（如 `main`）的历史禁止 `rebase`
              correct: true
            - text: 团队所有人每天共享的 `main` 分支最适合天天做 `rebase` 改写历史哈希
              why: 改写公共分支历史哈希会导致团队成员本地分支与远程历史分裂，每次拉取都落入痛苦的大冲突
            - text: "`rebase` 不会生成任何新提交哈希，所以随便对谁用都毫无副作用"
              why: 每次 `rebase` 改变了提交的父提交串联关系，提交哈希必然全部改变成全新节点
          explain: “本地整容用变基（线性清爽），公共分支只追加不重写（留真实分支汇合历史）”。
      - card:
          title: 例题：用图示对比 `merge` 与 `rebase` 后的提交树形状
          body: |
            假设 `main` 上有 `C0 → M1`，你从 `C0` 切出的未推送本地分支 `feature` 上有 `F1 → F2`。执行 `merge` 与 `rebase` 后的结果有何不同？
          reveal:
            - title: 第 1 步：若在 `main` 上直接 `git merge feature`
              body: 保留真实并行分支结构，在 `M1` 和 `F2` 之后生成一个拥有两个父节点的新合并提交 `M2`，历史呈现“先分叉后汇合”的菱形，适合保留完整协作记录。
            - title: 第 2 步：若在本地 `feature` 上先 `git rebase main` 再快进合入
              body: "`feature` 上的 `F1`、`F2` 被摘下并基于 `M1` 依次重放为新提交 `F1'`、`F2'`（拥有新哈希），随后 `main` 直接快进到 `F2'`。最终提交历史变成一条干净直线 `C0 → M1 → F1' → F2'`，阅读日志时省去大量琐碎合流节点。"
      - item:
          id: q-advanced-git
          type: match
          prompt: 把下面三种进阶 Git 工具（大纲 5.13）与它们最擅长救火的场景配对。
          pairs:
            - [交互式变基（`git rebase -i`）, 推送代码评审前，把本地零碎的“修拼写”“临时调试”等小提交合并整理成清晰一笔]
            - [折半查找（`git bisect`）, 仓库有上千个历史提交不知哪个引入了 Bug，用折半法自动跳几十步精准揪出首恶提交]
            - [樱桃摘取（`git cherry-pick`）, 只需把另一条分支上修某个紧急 Bug 的那单独 1 个提交复制应用到当前分支]
          explain: 交互变基理顺局部草稿，`bisect` 用 $O(\log N)$ 定位回归 Bug，`cherry-pick` 精准复用单笔修复。

  - id: git-remotes-undo
    chapter: Git
    title: 远程仓库协作与撤销后悔药（Amend / Reset / Revert）
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你早上把一个写错逻辑的提交 `C9` 推上了团队共享远程 `main` 分支，已经有 3 位同事拉走了 `C9` 并在上面接着干活。现在你想撤回 `C9` 的改动，下面哪种做法不会把同事们的仓库搞炸？
          options:
            - text: 运行 `git revert C9` 生成一笔“做相反改动的新提交 C10”并正常推送到远程
              correct: true
            - text: 在本地用 `git reset --hard HEAD~1` 删掉 `C9`，再 `git push --force` 强行覆盖远程历史
              why: 强推重写共享远程历史会让已经拉走 `C9` 的同事出现历史分叉，下次推送或拉取直接冲突崩溃
            - text: 直接去远程服务器上把 `.git` 文件夹删掉重来
              why: 删掉仓库会毁掉整个项目全部提交历史
          explain: 撤销历史分清“**还没推给别人（本地改写）**”和“**已经推到共享分支（新增反向提交）**”，这是团队协作的底线！
      - card:
          title: 远程仓库协作：Fetch、Pull 与 Push（5.11）
          body: |
            你的本地仓库和云端托管仓库（如 GitHub）之间用三个命令同步：
            - `git fetch`：只把远程最新的提交下载到本地跟踪标记（如 `origin/main`），**不改动**你当前正在干活的本地分支和工作区。
            - `git pull`：相当于 `git fetch` 后紧接着把远程新提交合并（或变基）到当前本地分支。
            - `git push`：只有当远程分支没有领先于你的新提交（可快进）时才放行上传；如果同事抢先推了新提交，必须先拉取整合才能再推。
      - card:
          title: 例题：三粒不同的后悔药（`--amend`、`reset` 与 `revert`）
          body: |
            对照原技能树综合练习第 (2) 题：同样是“刚才提交错了”，针对三种场景挑对药方：
          reveal:
            - title: 第 1 步：刚提交到本地且**还没推送**——小修用 `--amend`，退步重改用 `reset`
              body: 仅漏加了一个文件或写错提交说明？补 `git add` 后运行 `git commit --amend` 替换掉刚才最后一笔本地提交（会生成新哈希）。想把最后一次提交整笔撤回重来、但保留改动继续编辑？运行 `git reset --soft HEAD~1`（回退分支标记一步，改动稳稳留在暂存区！若加 `--hard` 则连工作区改动一并丢弃，慎用）。
            - title: 第 2 步：**已经推送**到团队共享远程分支——只能用 `git revert`
              body: 一旦推上公共分支，历史已经属于全团队！运行 `git revert <坏提交哈希>`，Git 会算出“把坏提交改反过来”的新补丁，往前追加一笔全新提交。既完美撤销了 Bug，又绝不改写过去的历史哈希，所有同事顺滑 `git pull` 即可同步。
      - item:
          id: q-undo-match
          type: match
          prompt: 把四种“代码写错想后悔”的具体局面与最安全对路的 Git 命令配对。
          pairs:
            - [修改了工作区文件还没 `git add`，想放弃改动退回上次提交原样, "`git restore <文件>`（仅恢复工作区文件）"]
            - [刚做完一笔还没推送的本地提交，发现漏了一个文件想并进这笔提交里, "`git add` 后执行 `git commit --amend`"]
            - [想撤销刚才尚未推送的本地提交，但把修改内容保留在暂存区重新分批提交, "`git reset --soft HEAD~1`"]
            - [错把带 Bug 的提交推上了团队共享远程 `main` 分支，安全撤回改动, "`git revert <提交哈希>` 新增反向提交并推送"]
          explain: 没进暂存用 `restore`，没推送本地可用 `--amend` / `reset`，已推送共享分支只能向前 `revert`。
      - item:
          id: q-fetch-vs-pull
          type: choice
          prompt: 当你怀疑远程 `origin/main` 上队友推送了新改动，你想先把远程历史下载下来看清楚差异，但先不要自动往你正在改的本地代码上做合并。应该执行哪条命令？
          options:
            - text: "`git fetch`（只拉取远程最新对象与跟踪标记，不触动当前工作分支）"
              correct: true
            - text: "`git pull`（下载后立刻自动触发合并或变基到当前分支）"
              why: "`git pull` 会直接把远程改动合进你当前分支，如果刚好撞上你未理顺的改动可能立刻触发合并"
            - text: "`git push --force`"
              why: 强推会把本地状态强行覆盖掉远程队友已经推送的工作成果，极其危险
          explain: "`git fetch` 是最安全的侦察兵：下到本地 `origin/main` 后随时可以用 `git log main..origin/main` 先看差异再决定何时合并。"
      - item:
          id: q-reset-soft-vs-hard
          type: choice
          prompt: 本地刚提交了一笔还没推送的 `C2`，如果运行 `git reset --soft HEAD~1` 而不是 `git reset --hard HEAD~1`，最大的区别在哪里？
          options:
            - text: "`--soft` 只把分支标记退回 `C1`，`C2` 里写好的代码改动原封不动留在暂存区；`--hard` 会连同暂存区和工作区里 `C2` 的改动全部抹光"
              correct: true
            - text: "`--soft` 会删除本地 `.git` 文件夹，`--hard` 不会"
              why: 两者都只调整分支标记及三区状态，不会删除 `.git` 仓库
            - text: 两者效果一模一样，只是拼写不同
              why: "`--hard` 会丢弃未提交工作成果而极难找回，`--soft` 则是安全退回重新整理提交的利器"
          explain: 除非百分百确定要彻底扔掉代码，否则优先使用 `--soft`（保留暂存）或默认 `--mixed`（退回工作区），少用难以挽回的 `--hard`。

  # ======================================================================== 调试器
  - id: debug-mindset-print
    chapter: 调试器
    title: 调试方法论、日志局限与条件断点
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一段处理 10 万条订单循环的 Python 代码，跑到第 98,421 条数据时突然算出错误结果。如果全靠在源码里加 `print(...)`，既要等屏幕狂刷出 98,420 行废话，想临时看另一个变量又得停下来改源码重跑一遍。用**调试器**怎么一秒精准停在出事现场？
          options:
            - text: 在循环体里设一个带条件的**断点**（例如 `i == 98420`），全速运行到那一次命中才冻结，原地查看全部变量与调用栈
              correct: true
            - text: 把循环删掉改成只算第 1 条数据，假装后面 9 万多条都不存在
              why: 这样绕过了触发缺陷的输入规模，找不到真正潜伏在末尾边界的数据 Bug
            - text: 只能买一块主频慢一万倍的老式 CPU，用肉眼盯着控制台滚屏
              why: 调试器的条件断点让程序按全速跑到关注条件成立那一刻才暂停
          explain: 调试不是靠“多写十遍 print 瞎撞”，而是用科学假设收缩范围，再靠调试器在精准时机冻结现场看真相。
      - card:
          title: 调试思路与 Printf 日志调试的边界（4.1–4.2）
          body: |
            排查 Bug 最稳的步骤是科学实验：稳定复现 → 对半缩小范围 → 提出“哪一步状态坏了”的假设 → 验证修正。

            在代码里插 `print` 或日志（Printf debugging）简单直接，适合多任务并发或线上持久化记录；但面对大循环、复杂数据或者每次改动重启很慢的程序，插 `print` 不仅要反复改代码重跑，还常因为加了打印本身改变了时间顺序（导致竞态 Bug 暂时躲起来）。
      - card:
          title: 调试器（Debugger）、断点与单步（3.8、4.3）
          body: |
            IDE 或终端里的调试器（Python 的 `pdb`、C/C++ 的 `gdb` / `lldb`）让你直接附着到正在运行的**进程（process）**内部：
            - **断点（breakpoint）**：在指定行前把程序彻底冻住；**条件断点**则加上布尔表达式（如 `i == len(xs) - 1`），只有表达式为真才停下来！
            - 停住后可以做四件事：① 打印任意表达式和变量值；② 查看当前完整调用栈和各层**栈帧（stack frame）**；③ 单步跨过（next）或步入函数内部（step）；④ 设置观察点监控某个变量何处被意外改写。
      - item:
          id: q-debug-print-limit
          type: choice
          prompt: 当排查一个运行几十万轮的大循环缺陷或偶发时序问题时，为什么在代码里到处插 `print` 往往不如使用交互式调试器？
          options:
            - text: 插 `print` 每次想看新变量都得改源码重跑，刷屏信息淹没关键轮次且打印 I/O 可能改变并发时序；调试器可在条件满足瞬间冻结并现场查看任意变量
              correct: true
            - text: 因为 Python 语法禁止在 `for` 循环体内写 `print`
              why: 语法上允许在循环体内任意调用 `print`，问题在于输出噪声太大和改动重启成本高
            - text: 因为 `print` 打印出的整数会自动加 1
              why: "`print` 会如实打印当前值，但打印本身往往是慢速 I/O 操作"
          explain: 日志打印适合长期留痕与线上记录，调试器条件断点与现场检查才是交互找 Bug 的利器。
      - card:
          title: 例题：用 `pdb` 条件断点 30 秒揪出“差一错误”
          body: |
            看一段求列表之和却少加最后一个元素的 Python 函数（综合练习第 3 题情景）：
            ```python
            def sum_list(xs):
                total = 0
                for i in range(len(xs) - 1):  # 第 3 行
                    total += xs[i]            # 第 4 行
                return total
            ```
            传入 `[2, 5, 7]` 期望 `14`，结果却返回了 `7`！怎么用 `pdb` 快速确认原因？
          reveal:
            - title: 第 1 步：在循环内加条件断点，直奔最后一轮循环检查
              body: 启动 `python -m pdb app.py`，下条件断点 `b 4, i == len(xs) - 1` 或干脆在末尾第 5 行（`return total`）下断点 `b 5`，敲 `c`（continue）一口气跑到循环结束。
            - title: 第 2 步：在暂停现场印证边界值并修复验证
              body: 停在第 5 行时用 `p i`、`p total`、`p len(xs)` 一看，`len(xs)` 是 `3`，`total` 却停在 `7`（`2 + 5`），而最后那个下标 `2`（元素 `7`）根本没加上去！立刻看破第 3 行多减了 `1`：把 `range(len(xs) - 1)` 改成 `range(len(xs))`，拿 `[2, 5, 7]` 跑出 `14`，再拿新测试 `[4, 6, 8]` 跑出 `18` 验证通过！
      - item:
          id: q-pdb-offbyone
          type: number
          prompt: "一个求和函数本来要累加列表 `xs` 里的全部元素，却错写成 `total = 0; for i in range(len(xs) - 1): total += xs[i]`。如果传入列表 `[4, 6, 8]`，它会错误地返回什么整数？"
          answer: 10
          explain: "`len([4, 6, 8]) - 1` 等于 2，所以 `i` 只取 0 和 1，算得 `4 + 6 = 10`（漏掉了末尾下标 2 的元素 8；修好后应返回 18）。"
      - item:
          id: q-cond-breakpoint
          type: choice
          prompt: 如果一个 `for` 循环要处理 50,000 条记录，你怀疑只有当 `user_id == "u_9941"` 时某函数才会把金额算成负数。在调试器里最快锁定这一轮现场的做法是什么？
          options:
            - text: 在循环体关键行设置条件断点 `user_id == "u_9941"`，让调试器全速跑完前几万条并在条件命中那一刻自动停下
              correct: true
            - text: 打一个普通无条件断点，然后手工按“单步下一步”按键按五万次
              why: 手动按几万次单步既耗时又极易按过头错失现场
            - text: 把循环删除改成只赋值 `user_id = 0`
              why: 篡改输入条件无法在真实出事路径上检查现场变量状态
          explain: 条件断点是调试循环与高频调用的神器——它替你过滤掉 99.99% 的正常循环，只在异常现场冻住程序。
      - item:
          id: q-print-vs-debugger
          type: choice
          prompt: 与仅仅在源码里插入大量 `print` 语句相比，现代集成开发环境（IDE）和命令行调试器（如 `gdb`、`pdb`）的不可替代优势主要在哪里？
          options:
            - text: 无需反复改动并重启源码，能在任意断点瞬间冻结调用栈、交互式检查与修改各层栈帧变量，并可对特定条件或变量值修改精确暂停
              correct: true
            - text: 因为调试器能够自己替你发明出全套新业务需求
              why: 调试器只负责暴露真实执行状态，业务规则仍靠开发者分析判断
            - text: 因为使用了调试器后，程序就不再需要编写任何单元测试了
              why: 调试器用于定位已知失败现场，单元测试与回归测试用于长期自动守住不再犯同样错误
          explain: "`print` 像给跑车拍几张提前约定好机位的路边照片；调试器则是随时喊停把引擎盖掀开逐个零件拿表测量。"

  - id: debug-trace-mem
    chapter: 调试器
    title: 系统调用追踪与内存调试（越界 / 泄漏排查）
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你花钱买了一个闭源商用工具软件（没有源代码！），一启动就闪退并只吐出一句模棱两可的英文提示 `Configuration missing`。你怎么才能不看源代码，直接看清这个黑盒程序在闪退前究竟去哪个路径找过哪个配置文件？
          options:
            - text: 用底层接口追踪工具（如 Linux 下的 `strace`）拦截并打印它向操作系统发出的每次打开文件请求
              correct: true
            - text: 给硬盘上所有几百万个文件夹挨个肉眼改名猜猜看
              why: 盲猜路径大海捞针，而打开任何文件都必须经过操作系统提供的统一文件打开接口
            - text: 对着显示器用放大镜看图标像素
              why: 图标不包含程序运行期试图读取的配置文件路径
          explain: 哪怕没有一行源代码，只要程序要读文件、连网络或启动子程序，就一定躲不过向操作系统发起**请求接口**——追踪这一层边界能瞬间看穿黑盒。
      - card:
          title: 内核与系统调用追踪（4.4 节）
          body: |
            普通应用跑在受限制的用户空间里，自己没有权力直接读磁盘或连网卡——想打开文件、读写网络或申请大块**内存（memory）**，必须通过**系统调用（system call）**向操作系统的**内核（kernel）**求助（如 `openat`、`read`、`connect`）。

            因此像 Linux `strace` 这样的工具只需挂在程序与内核的交界处，就能把程序发出过的每一次文件打开路径和错误返回码（如 `ENOENT` 文件不存在、`EACCES` 权限不足）全部实况直播出来——**哪怕完全没有源代码**，照样秒级定位“它到底卡在找哪个文件”！
      - item:
          id: q-strace-use
          type: choice
          prompt: 某第三方交付的成品程序在服务器上运行报错退出，手头没有源代码。管理员用 `strace ./vendor-tool` 运行它，在输出最后两行看到 `openat(AT_FDCWD, "/etc/vendor/license.key", O_RDONLY) = -1 EACCES (Permission denied)`。这条系统调用追踪直接告诉我们什么？
          options:
            - text: 程序试图读取 `/etc/vendor/license.key`，文件其实存在但当前运行账号对它没有读取权限（EACCES）
              correct: true
            - text: 这个程序存在 Python 书写语法错误
              why: 成品程序已经过内核执行层解析加载，而且内核明确返回了权限被拒错误码
            - text: 说明服务器 CPU 已经物理烧毁
              why: "`EACCES` 是标准的操作系统文件权限拒绝返回码，改对文件权限即可解决"
          explain: 看懂系统调用返回码（`ENOENT` 找不到文件 vs `EACCES` 没权限）往往能 10 秒解决过去排查一小时的配置悬案。
      - card:
          title: 内存调试（一）：数组越界与隐性破坏（4.5 节）
          body: |
            用 C/C++ 等手动管理内存的语言时，有两类最隐蔽的缺陷：

            第一类是**越界（out-of-bounds）**：比如**数组（array）**只有 5 个格子（合法下标 `0..4`），程序却读写了 `a[5]`。可怕的是，普通运行下越界写 1 个格子常常**不会当场崩溃**，而是悄悄踩坏了紧挨着的另一个变量，等十分钟后算错结果才莫名其妙崩掉！
      - card:
          title: 内存调试（二）：内存泄漏与 ASan / Valgrind 利器
          body: |
            第二类是**内存泄漏（memory leak）**：程序动态向堆区借了一块内存（如 `malloc`），用完却忘了归还释放，导致长期运行的服务内存占用一路狂涨直到耗尽。

            开启 **AddressSanitizer（ASan）**或运行在 **Valgrind** 下时，工具会在每个对象四周摆一圈“警戒红区”并记下每块借还账本：只要越界读写哪怕 1 个元素位置或借了没还，立刻报警并指出精确源码行号与调用栈！
      - item:
          id: q-asan-vs-print
          type: choice
          prompt: 为什么在 C 语言测试阶段开启 **AddressSanitizer（ASan）** 远比“等程序自己崩溃再说”靠谱？
          options:
            - text: 小幅度的越界读写在普通运行下常常不会立刻触发崩溃，而是悄悄污染邻近数据变成隐患；ASan 在每个对象旁放置警戒红区，越界读写第 1 个越界位置就立刻中止并指出精确行号
              correct: true
            - text: 因为 ASan 会自动帮你把所有越界下标改成 `0` 号元素继续默默运行
              why: 掩盖越界只会制造更隐蔽的业务错乱；ASan 的职责是立刻报错让你修复源头缺陷
            - text: 因为加了 ASan 后电脑就不需要物理内存条了
              why: ASan 反而会额外占用一些内存来存检测账本与红区校验表，用来换取测试期极高的缺陷检出率
          explain: 越界最可怕之处正是“不马上崩，悄悄把算出来的钱改错了”——用内存检查器把潜伏期压缩到零！
      - card:
          title: 例题：用 `strace` 和 ASan 分头排查黑盒故障与越界隐患
          body: |
            面对下面两个在大型项目里让人头疼一整天的怪现象，如何一步定位？
            - 现象 A：部署好的后台服务运行命令 `./srv` 立刻退出，只留下一行 `init failed`，日志里什么都没写。
            - 现象 B：C 程序在处理 10 个元素时不崩，处理 11 个元素时偶尔算错总金额。
          reveal:
            - title: 第 1 步：用 `strace -e trace=file ./srv` 秒抓现象 A
              body: 追踪文件相关系统调用，一行就能看见 `openat(..., "/var/lib/srv/data.db", ...) = -1 ENOENT`——原来是打包脚本漏建了 `/var/lib/srv` 目录！不用猜，十秒解决。
            - title: 第 2 步：给现象 B 加上 `-fsanitize=address -g` 重跑测试用例
              body: 平时越界那 1 步正好落在空闲填充区没崩溃；加上 ASan 的警戒红区后，一跑 11 个元素的用例立刻报错 `heap-buffer-overflow WRITE of size 4 at main.c:18`，直接把你指到循环多写一格的那一行！
      - item:
          id: q-mem-tools
          type: match
          prompt: 把下面三种棘手缺陷与最能直接揪出它的调试手段连线。
          pairs:
            - [闭源程序一启动就报错但没源码，想看清它到底试图读取哪个路径的文件, 系统调用追踪（如 `strace`）]
            - ["C 语言程序在 `buf[10]` 里偷偷写到了 `buf[10]` 越界却暂时没崩，想当场抓现行", "开启 AddressSanitizer（ASan）检测并运行测试"]
            - [长期运行的后台服务内存占用每小时上涨 50 MB 且永远不降, 内存泄漏检测器（如 Valgrind / LeakSanitizer）]
          explain: 黑盒看边界找 `strace`，非法读写越界找 ASan，只借不还找泄漏检测器。

  - id: profile-benchmark
    chapter: 调试器
    title: 性能剖析、计时监控与基准测试
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你的数据脚本处理一份文件一共要花 100 毫秒。凭直觉你猜“肯定是连接数据库查询那一段最慢”，于是花了一整天把数据库查询从 20 毫秒优化到了 10 毫秒（整整快了一倍！），而另一段解析 JSON 字符串占了 80 毫秒没动。优化完后总耗时只从 100 毫秒降到了 90 毫秒。这次优化为什么事倍功半？
          options:
            - text: 因为没有先做**性能剖析**测量各阶段实际耗时比例，把精力花在了只占总时间 20% 的非瓶颈上
              correct: true
            - text: 因为数据库查询快一倍在数学上必然让总耗时变成 200 毫秒
              why: 总耗时确实降了一点（降了 10 毫秒），问题出在投入产出比太低——如果先优化占 80 毫秒的那一段，快一倍就能省下 40 毫秒！
            - text: 因为 100 毫秒在所有计算机里已经是最小物理时间单位
              why: CPU 处理单步操作只需要纳秒级，100 毫秒里能执行上亿条操作步骤
          explain: 优化第一铁律：**先测量，再动手**——人脑猜“哪里慢”十次有八次猜错。
      - card:
          title: 计时、资源监控与性能剖析（4.6–4.10）
          body: |
            看懂程序慢在哪，有三个逐级深入的工具层次：
            1. **计时（Timing）**：区分挂钟时间（Wall-clock，真实等了多久，含网络与磁盘等待）和 CPU 时间（CPU 真正干活花了多久）。
            2. **资源监控（Monitoring）**：用 `top` / `htop` / `vmstat` 看是 CPU 吃满、内存爆了、还是磁盘 I/O 在等。
            3. **性能剖析（Profiling）**：挂上 **CPU Profiler**（按周期采样调用栈画出火焰图）找出耗时大头函数，或用 **Memory Profiler** 找出谁分配了最多临时对象。
      - card:
          title: 例题：用火焰图/采样比例指导性能优化方向
          body: |
            假设某接口每次请求耗时 100 ms，CPU 采样剖析发现：JSON 解析占 `80 ms`（80%），数据库查询占 `20 ms`（20%）。比较把两块分别提速 2 倍的收益：
          reveal:
            - title: 第 1 步：只把非热点（20 ms 的查询）提速 2 倍
              body: 耗时变成 `80 + 20 / 2 = 90 ms`，总耗时仅缩减 `10%`！哪怕把数据库查询优化到神奇的 `0 ms`，全接口也最多只能快 `20%`（Amdahl 定律的直觉）。
            - title: 第 2 步：集中火力把真正热点（80 ms 的解析）提速 2 倍
              body: 耗时立刻降到 `80 / 2 + 20 = 60 ms`，直接干掉 `40%` 总延迟！所以**性能剖析**找准最大占比柱子再出手，永远比瞎猜划算。
      - item:
          id: q-wall-vs-cpu
          type: choice
          prompt: 一个 Python 脚本用 `time` 命令测得：总挂钟时间（`real`）是 `10.2 秒`，而进程实际占用 CPU 时间（`user + sys`）总共只有 `0.2 秒`。这段代码最可能把 10 秒花在干什么了？
          options:
            - text: 绝大多数时间在等待网络请求回包、睡眠 `time.sleep` 或缓慢磁盘 I/O（程序是 I/O 密集型而非 CPU 算力瓶颈）
              correct: true
            - text: 正在用满全部 CPU 核心进行超高强度矩阵乘法
              why: 如果是纯 CPU 算满 10 秒，`user` CPU 时间会接近或超过 10 秒（多核时甚至几十秒）
            - text: 因为时钟芯片坏了把 0.2 秒看成了 10.2 秒
              why: "`real` 是从启动到退出的真实流逝时间，进程阻塞等待外部 I/O 时 CPU 处于空闲或切换去跑别的任务，所以不算入该进程的 CPU 时间"
          explain: 看清 `real` 远大于 `user+sys` 是判断“I/O 等待阻塞 vs CPU 计算忙”的最快试金石。
      - card:
          title: 科学对比快慢：基准测试（Benchmarking，4.11 节）
          body: |
            优化完代码后，想证明新版确实比旧版快，千万别只跑一次随便掐表！那叫拍脑袋，不叫**基准测试（benchmarking）**。

            靠谱的基准测试要注意四件事：① 充分**预热**（避开冷加载或运行时刚起步）；② 重复跑足够多次（取中位数、均值与离散波动而不是单次最好成绩）；③ 固定隔离测试环境与真实规模数据（关掉后台大更新）；④ 确保优化器没有把毫无副作用的假计算直接“优化删空”。
      - item:
          id: q-bench-pitfall
          type: choice
          multi: true
          prompt: 以下哪些做法会让一份**基准测试**结果严重失真、失去参考价值？（多选）
          options:
            - text: 只把函数跑了 1 次就拿那一次的耗时下结论，忽略了首次导入模块冷启动与后台程序干扰
              correct: true
            - text: 写的测试函数算出结果却既不返回也不用，结果被聪明优化器整段优化成空函数“耗时 0 纳秒”
              correct: true
            - text: 明明真实生产输入有 10 万条数据，却只拿 5 个元素的小列表测完就宣布新算法碾压旧算法
              correct: true
            - text: 每次测量前先预热几轮，重复测多次并同时报告中位数与波动范围
              why: 先预热、多轮统计中位数与波动范围正是科学基准测试的规范做法
          explain: 糟糕的基准测试会骗人甚至把你引向负优化；规范基准测试是后续一切性能调优（如 `timeit` 对比列表与集合）的可靠标尺。
      - item:
          id: q-hotspot-choice
          type: choice
          prompt: "对某数据处理程序运行 CPU 性能剖析后，火焰图显示三个阶段耗时占比分别是：`A. 读取文件 5%`、`B. 正则解析 75%`、`C. 写结果 20%`。假如你只能先重构优化其中一块，哪一块能带来最大的整体提速上限？"
          options:
            - text: "`B. 正则解析`（占 75%）：把它提速一倍就能把总时间砍掉 37.5%"
              correct: true
            - text: "`A. 读取文件`（占 5%）：哪怕优化成 0 秒也只省 5% 总时间"
              why: 占比较小的步骤哪怕提速一万倍，总耗时最多也只能省 5%
            - text: "`C. 写结果`（占 20%）：它排在最后所以一定最决定总时间"
              why: 总耗时等于各步串行耗时相加，决定整体缩减幅度的是占用绝对时长比例，不是排在第几个
          explain: 永远先砍火焰图里最宽的那一根柱子——这是把剖析数据直接转化成工程产出的最快方法。

  # ======================================================================== 构建
  - id: make-compile-link
    chapter: 构建
    title: 从源代码到可执行文件：编译、目标文件与链接
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你把一个 C 程序拆成两个文件：`main.c`（主程序调用 `add(1, 2)`）和 `util.c`（实现 `add` 函数）。如果忘了告诉构建脚本把 `util.c` 也一起算上，只单独翻译 `main.c` 想变成最终能运行的成品程序，最后会在哪一步报错？
          options:
            - text: 单文件检查翻译阶段可以通过（只要有接口声明），但在把所有片段拼合成最终成品的阶段会报找不到 `add` 的未定义符号错误
              correct: true
            - text: Python 解释器会自动替你凭空写好一个 `add` 函数
              why: C 是静态类型语言，构建时必须由你自己提供所有被调用函数的实现代码
            - text: 因为一个 C 程序绝对不允许拆成两个文件来写
              why: 大型 C/C++ 项目动辄拆成几千个 `.c` 文件分别翻译后再统一拼装
          explain: 大程序为什么要分“先各自翻译成中间片段，再统一拼装”两步？这正是构建系统能做到“改一个文件只重做那一个文件”的物理基础！
      - card:
          title: 多文件构建四步走：头文件、预处理与编译（8.1–8.2）
          body: |
            把一个 C 项目变成能在操作系统上直接启动的**可执行文件（executable）**，**编译器（compiler）**加后台工具依次干这几步：
            1. **头文件（header file，`.h`）**：只写函数签名声明（如 `int add(int a, int b);`），让 `main.c` 在不知道具体实现时也能先核对参数类型。
            2. **预处理（preprocessing）**：正式翻译前先展开 `#include`，把头文件里的声明文本原样拼到 `.c` 里。
            3. **编译（compile）**：把展开后的 `.c` 各自翻译成独立的机器码半成品——**目标文件（object file，`.o`）**（例如 `gcc -c main.c` 只产出 `main.o`）。
      - card:
          title: 链接（Linking）与地址缺口填补
          body: |
            拿到 `main.o` 和 `util.o` 后，最后一步是**链接（link）**：由链接器把多个目标文件与系统标准库拼合起来，查清每个函数在内存中的确切**地址（address）**，填上 `main.o` 里留下的 `add` 调用缺口，最终打包产出**可执行文件** `app`！

            拆分出 `.o` 中间站后，改了 `util.c` 就只需要重编 `util.o` 再快速链接，完全不用重编项目里其它几百个 `.c` 文件。
      - item:
          id: q-compile-vs-link
          type: match
          prompt: 把多文件构建过程中的四个核心概念与它们在磁盘上的角色对应起来。
          pairs:
            - [头文件（`.h`）, 只提供函数签名与类型声明，供多个 `.c` 文件通过 `#include` 共享接口约定]
            - [目标文件（`.o`）, 单个 `.c` 源文件独立编译产出的半成品机器码，尚未填全外部函数地址]
            - [链接（Linking）, 把多个 `.o` 文件与所需库拼接并解决跨文件函数引用地址缺口]
            - [可执行文件（Executable）, 完成编译与链接、带启动入口且可直接运行的成品程序]
          explain: 拆分出 `.o` 目标文件中间站后，每次只改 `util.c` 就只需重新编译 `util.o` 再快速链接，不用重编另外几百个 `.c` 文件！
      - card:
          title: 为什么手敲 `gcc` 命令早晚受不了，需要构建规则
          body: |
            文件少时还能手工敲 `gcc -c main.c && gcc -c util.c && gcc main.o util.o -o app`。但工程一旦有 50 个 `.c` 文件和 20 个 `.h` 头文件：
            - 每次全量敲 `gcc *.c -o app` 全重编一遍要等十几分钟；
            - 自己记“今天只改了 `util.h`，那到底哪些 `.c` 文件引入了它需要重编？”极易漏编导致旧代码和新数据布局错位崩溃！

            把依赖关系写成一条条**构建规则（build rules）**交给构建工具（如 `make`）去自动追踪，就是下一课要学的依赖图。
      - card:
          title: 例题：追踪 `main.c + util.c` 经过四步变成 `app`
          body: |
            假设 `util.h` 声明了 `int add(int a, int b);`，`util.c` 实现了它，`main.c` 包含 `util.h` 并调用 `add(1, 2)`。每步在磁盘上产出什么？
          reveal:
            - title: 第 1 步：独立预处理与编译成 `.o` 目标文件
              body: "`gcc -c main.c` 预处理展开 `util.h` 后检查 `add(1, 2)` 参数类型完全合法，产出 `main.o`（此时里面只记着“这里要调用一个叫 `add` 的外部符号”）；`gcc -c util.c` 同理产出含 `add` 真实机器码的 `util.o`。"
            - title: 第 2 步：链接器拼合目标文件生成可执行文件
              body: "`gcc main.o util.o -o app` 把 `main.o` 与 `util.o`（加上标准启动代码）合在一起，把 `util.o` 里的 `add` 地址填进 `main.o` 的缺口，产出成品 `app`；如果你在链接命令里漏传了 `util.o`，就会在这一步报 `undefined reference to 'add'`！"
      - item:
          id: q-header-why
          type: choice
          prompt: 在拆成 `main.c` 和 `util.c` 的项目里，为什么往往会建一个 `util.h` **头文件**让两个 `.c` 文件都 `#include "util.h"`，而不是直接把 `add` 函数的完整实现代码写进 `util.h` 里？
          options:
            - text: 头文件只放函数声明供多个文件核对参数与返回值类型；若把函数实现直接放进 `.h` 被两个 `.c` 包含，链接时两个 `.o` 都有一份同名实现就会报“重复定义”错误
              correct: true
            - text: 因为 `.h` 文件里语法上禁止出现任何字母 `a` 到 `z`
              why: "`.h` 和 `.c` 一样是纯文本 C 代码文件，区别在于工程约定 `.h` 放声明、`.c` 放唯一一份实现"
            - text: 因为写了头文件以后就再也不需要运行链接器了
              why: 头文件只帮编译阶段过语法与类型检查，最终仍必须由链接器把各 `.o` 里的实现拼到一起
          explain: 黄金法则：**声明放 `.h`（可被包含无数次），实现放 `.c`（全项目只编进一个 `.o` 里一次）**。
      - item:
          id: q-missing-obj-error
          type: choice
          prompt: 工程师修改了项目里 `main.c` 调用了 `util.c` 里的 `helper()` 函数，并在 `main.c` 正确包含了 `util.h`。但他最后执行链接命令时漏掉了 `util.o`，只敲了 `gcc main.o -o app`。结果会在哪一步出现什么报错？
          options:
            - text: 编译 `main.o` 正常通过，但最后链接一步会报 `undefined reference to 'helper'`（未找到符号定义）
              correct: true
            - text: 根本连 `main.o` 都编不出来，报错缺头文件
              why: 既然已经包含了 `util.h` 里的函数声明，编译器单编 `main.c` 时知道 `helper` 的参数签名，只是留一个待填符号坑等链接器来填
            - text: 程序能正常生成并自动联网去 GitHub 下载 `helper`
              why: 链接器只从你明确交给它的 `.o` 和库文件里找符号定义，不会自己联网找源码
          explain: 看懂 `undefined reference`（链接错） vs 语法/类型报错（编译错），是排查 C/C++ 构建错误的第一课。

  - id: make-build-graph
    chapter: 构建
    title: 构建规则、依赖图（DAG）与 Makefile 增量重建
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个 C 项目有 `main.c`、`util.c` 和共同包含的 `util.h`，用 Makefile 正确声明了依赖关系并已经完整编出过一次 `app`。现在你只改了 `util.c` 一行代码并重新敲 `make`。下面哪些文件会被 `make` 重新生成？
          options:
            - text: 只重新编译 `util.o`，再把 `main.o` 和新的 `util.o` 重新链接成 `app`；没有改动的 `main.o` 原封不动复用
              correct: true
            - text: 全部从头把 `main.c` 和 `util.c` 通通重新编译一遍
              why: "`main.o` 的依赖 `main.c` 与 `util.h` 时间戳都没比 `main.o` 新，所以 `make` 会跳过重编 `main.o`"
            - text: 连 `app` 也不会重新链接，直接沿用旧的 `app`
              why: "`app` 依赖 `util.o`，一旦 `util.o` 更新变得比 `app` 新，`make` 就一定会重跑链接生成新 `app`"
          explain: "**构建系统**的本质就是根据“文件修改时间戳 + 有向无环依赖图”做最小必要重建（SE at Google 第 18 章）。"
      - card:
          title: 构建规则长什么样：目标、依赖与 Tab 命令（8.1–8.2）
          body: |
            Makefile 的核心是一条条构建规则，语法极其严格（注意命令行前面**必须是真正的 Tab 制表符**，不能用空格）：
            ```makefile
            目标 : 依赖1 依赖2
            	构建命令
            ```
            含义是：**如果“目标”还不存在，或者“任何一个依赖”的修改时间（mtime）比“目标”更新，就执行下面的命令重建“目标”**——而且这是一层层从顶到底逐级追查依赖树的！
      - card:
          title: 例题：写出 `main.c + util.c` 的最小 Makefile 并追踪增量重建
          body: |
            对照原技能树综合练习第 (4) 题，手写并追踪这份最小 Makefile（假设 `main.c` 与 `util.c` 都 `#include "util.h"`）：
            ```makefile
            CC = gcc
            CFLAGS = -Wall -O2

            app: main.o util.o
            	$(CC) main.o util.o -o app

            main.o: main.c util.h
            	$(CC) $(CFLAGS) -c main.c -o main.o

            util.o: util.c util.h
            	$(CC) $(CFLAGS) -c util.c -o util.o
            ```
          reveal:
            - title: 第 1 步：只修改 `util.c` 后敲 `make`
              body: "`make` 从默认第一个目标 `app` 出发查依赖树：`main.o` 依赖的 `main.c` 和 `util.h` 都比 `main.o` 旧，直接跳过！`util.o` 发现 `util.c` 比自己新，于是重编 `util.o`；接着回到顶层发现 `util.o` 比 `app` 新，重新链接出 `app`。"
            - title: 第 2 步：修改了公共头文件 `util.h` 后敲 `make`
              body: 改动 `util.h` 后，因为 `main.o` 和 `util.o` 都把 `util.h` 写进了依赖列表，`make` 会自动识别出这两个 `.o` 全都过时，分别重编两个 `.o` 并重新链接 `app`！如果漏写了 `util.h` 依赖，就会留下致命的“半新半旧”坏产物。
      - item:
          id: q-make-header-dep
          type: choice
          prompt: 沿用上面 `app`、`main.o`、`util.o` 的依赖关系：如果只修改了被两个 `.c` 文件同时包含的公共头文件 `util.h` 后运行 `make`，哪些目标会被重建？
          options:
            - text: "`main.o`、`util.o` 都会重新编译，最后重新链接生成 `app`"
              correct: true
            - text: 只有 `util.o` 会重建，`main.o` 绝对不会动
              why: 既然 `main.c` 也 `#include "util.h"`，`main.o` 的构建规则就同时依赖 `main.c` 和 `util.h`，改了 `util.h` 两边都必须重编
            - text: 什么也不会发生，因为 `util.h` 不是 `.c` 文件
              why: 只要头文件被正确列在规则冒号右侧的依赖列表里，`make` 照样比对它的时间戳触发重编
          explain: 依赖声明必须完整诚实：源文件里 `#include` 了哪个自己改动的头文件，构建规则里就得列出它，否则修改数据格式后没重编调用方会在运行时内存错位。
      - item:
          id: q-make-tab-pitfall
          type: choice
          prompt: "初学者自己照着写好了一个 `Makefile` 后兴冲冲运行 `make`，终端却立刻报错退出：`Makefile:5: *** missing separator. Stop.`。最常见的原因是什么？"
          options:
            - text: 规则下方第 5 行执行命令前用了 4 个空格缩进，而不是 Makefile 语法严格要求的 Tab 制表符
              correct: true
            - text: 因为当前文件夹里的文件名不是全大写字母
              why: 文件名大小写和 `missing separator` 无关
            - text: 因为 Makefile 里面只能写 Python 代码不能写 gcc 命令
              why: Makefile 命令行正是用来执行 `gcc`、`python` 等任意 Shell 构建命令的
          explain: "`missing separator` 是 Makefile 历史上最著名的报错，99% 是编辑器把命令行前的 Tab 制表符自动换成了空格。"
      - item:
          id: q-make-clean
          type: choice
          prompt: "很多 Makefile 末尾还会写一个 `clean:` 规则（用来 `rm -f *.o app` 清理产物），而且经常在上面加一句 `.PHONY: clean`。为什么要加 `.PHONY`（伪目标）声明？"
          options:
            - text: 防止目录里万一刚好出现一个叫 `clean` 的同名普通文件时，`make` 误以为“目标已存在且没有依赖”而直接拒绝执行清理命令
              correct: true
            - text: 加了 `.PHONY` 后清理命令会变成把文件永久恢复回来
              why: "`clean` 依然执行删除命令，`.PHONY` 只是告诉 `make`“别把这个名字当磁盘文件看”"
            - text: 不加 `.PHONY` 的话 gcc 就不能编译 `.c` 文件
              why: 普通 `.o` 和可执行目标不需要 `.PHONY`，只针对不产出同名文件的纯动作目标（如 `clean`、`test`）
          explain: "`make` 默认把冒号左边的名字都当真实文件名比对时间戳；动作型命令加 `.PHONY` 声明，永远保证命令按要求执行。"
      - card:
          title: "省事的自动变量与通配模式规则（`%.o: %.c`）"
          body: |
            真实项目有几十个 `.c` 文件时，不用手抄五十遍几乎一模一样的规则！Makefile 提供模式通配 `%.o: %.c` 和三个常用自动变量：
            - `$@` 代表当前规则冒号左边的**目标**名；
            - `$<` 代表冒号右边的**第一个依赖**；
            - `$^` 代表冒号右边的**全部依赖**列表。
            于是十个源文件只需写成一条 `%.o: %.c` 搭配 `$(CC) $(CFLAGS) -c $< -o $@` 就能全部覆盖！
      - item:
          id: q-make-parallel
          type: choice
          prompt: "当 Makefile 准确写出了 `app: a.o b.o c.o` 以及各自对独立 `.c` 源文件的依赖图（有向无环图 DAG）后，运行 `make -j4` 时构建器能干什么来提速？"
          options:
            - text: 发现 `a.o`、`b.o`、`c.o` 彼此没有相互依赖，同时调起多个 CPU 核并行编译它们，全部就绪后再汇总链接 `app`
              correct: true
            - text: 先把 `app` 链接出来再去编译三个 `.c` 文件
              why: "`app` 在依赖图上位于 `a.o`、`b.o`、`c.o` 之后，必须等所有上游依赖完成后才能执行链接"
            - text: 自动删掉其中两个 `.c` 文件只编译一个
              why: 并行构建只是并发执行彼此独立的构建任务，一个文件都不会少
          explain: 依赖图（DAG）不仅决定“只重编谁”，还能让构建器安全地“并行重编互不依赖的所有分支”。

  - id: artifacts-repro
    chapter: 构建
    title: 构建产物、发布版本与可复现构建
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 两位同学拿着**一字不差**的同一份 Git 提交源代码，在各自电脑上先后运行打包脚本生成发布压缩包 `release.zip`。照理说源码完全一样，他俩打出来的两个 `release.zip` 的 SHA-256 哈希指纹一定一模一样吗？
          options:
            - text: 不一定：压缩包里的文件修改时间戳、文件遍历排序顺序、甚至编译器写进去的本机路径不同，都会让两个压缩包哈希完全不同
              correct: true
            - text: 一定完全相同，只要源码文本相同，所有打包程序产出的压缩包内容永远一模一样
              why: 普通打包工具默认会把当前的系统时间、文件顺序或构建目录写进产物元数据，导致文件内容不同
            - text: 每次打包哈希都会随机全变成全零
              why: 哈希不会全零，只是哪怕差 1 毫秒时间戳都会算出截然不同的哈希值
          explain: 怎么让“同一份源码任何人、在任何时间、任何干净环境里构建，都能算出比特级一模一样的哈希”？这叫**可复现构建**（6.2–6.4 节）。
      - card:
          title: 构建产物（Artifact）、发布与不可变版本（6.2–6.3）
          body: |
            写代码跑构建后交付给线上服务器的东西不是原始 `.c`/`.py` 杂文件，而是**构建产物（artifact）**：编译链接好的可执行文件、打包好的压缩包或容器镜像。

            好的发布流程把不可变版本对应到具体 Git 提交哈希：一旦打出 `v1.4.2` 发布产物，就绝不覆盖修改同一个版本号；发现缺陷只修代码再升成 `v1.4.3`，配合发布说明（Changelog）清晰追溯每次变更。
      - card:
          title: 可复现构建（Reproducible Builds，6.4 节）
          body: |
            如果线上跑的成品包和源码对应不上（或者被黑客在打包机器偷偷插了后门），怎么查出来？如果整个构建做到**可复现**：独立验证者拿同一份公开源码重新构建，算出的产物 SHA-256 必须一模一样！

            破坏可复现的常见罪魁祸首有四项：
            1. 把当前系统时钟写进打包时间（改用固定环境变量 `SOURCE_DATE_EPOCH`）；
            2. 目录遍历顺序受文件系统影响（打包前先按文件名稳定排序）；
            3. 产物里嵌入了本机绝对构建路径或当前用户名/时区；
            4. 没锁定依赖版本和工具链版本。
      - item:
          id: q-repro-hash-why
          type: choice
          prompt: 两位同学用完全相同的源码在各自电脑上分别打包，为什么不特意固定归档配置时，产出的两个 `release.zip` 往往拥有完全不同的 SHA-256 哈希？
          options:
            - text: 归档文件头里默认写入了各自打包时刻的系统时间戳，且遍历文件系统读取各文件的顺序或路径可能不同
              correct: true
            - text: 因为不同品牌电脑算 SHA-256 的数学公式完全不同
              why: SHA-256 对全世界任何机器来说都是严格确定性的相同算法，哈希不同一定是因为输入的压缩包里面有数据不同
            - text: 因为压缩算法每次都会随机删掉一半源代码
              why: 无损压缩解压后源码一字不差，差异出在容器文件头的时间、排序和路径等元数据上
          explain: 哈希校验极其敏感——压缩包头文件里哪怕时间戳差 1 秒钟，整个包的 SHA-256 也会面目全非。
      - card:
          title: 例题：为什么把同一批文件换顺序或换时间打包，SHA-256 就变了
          body: |
            用 Python `zipfile` 实测同一份代码 `a.py` 与 `b.py`：为什么哪怕源码一字不差，不同机器或不同时间打出的 `release.zip` 校验和却对不上？
          reveal:
            - title: 第 1 步：文件放进归档的顺序与时间戳各占一笔差异
              body: 如果目录列出顺序一个是 `[a.py, b.py]`、另一个是 `[b.py, a.py]`，压缩包头部排列立刻不同；哪怕顺序一样，今天 10:00 打包与明天 11:00 打包写进 Zip 头部的时间戳字段也不同，SHA-256 哈希必然面目全非。
            - title: 第 2 步：固定有序列表 + `SOURCE_DATE_EPOCH` 让两份产物比特级相同
              body: 打包脚本先对文件列表做排序（`sorted(files)`），并把所有文件条目时间戳统一写成环境变量 `SOURCE_DATE_EPOCH`（比如该次 Git 提交的时间戳），不同机器产出的压缩包 SHA-256 就能 100% 严丝合缝匹配！
      - item:
          id: q-repro-factors
          type: choice
          multi: true
          prompt: 要让两位工程师在不同电脑上用同一份源码打包出的发布压缩包拥有完全一致的 SHA-256 哈希，必须消除哪些随机/环境差异因素？（多选）
          options:
            - text: 固定压缩包内的文件归档时间戳（如统一设为 `SOURCE_DATE_EPOCH`）
              correct: true
            - text: 在打进归档前先对文件列表按固定顺序排序，避免依赖磁盘目录遍历顺序
              correct: true
            - text: 剥离或映射掉构建产物内嵌的本机绝对目录路径与时区设置
              correct: true
            - text: 要求两台电脑必须使用同一款品牌和颜色的机械键盘
              why: 外部硬件键盘对构建产物毫无影响
          explain: 只要把时间、文件顺序、构建路径、时区与精确依赖工具链全部固定下来，独立构建才能比对出完全一致的哈希值。
      - item:
          id: q-artifact-immutable
          type: choice
          prompt: 某团队发布组件库 `v1.2.0` 后发现漏了一行小修复，于是有成员提议：“反正是小修改，我们别改版本号了，重新打包直接把远程仓库里的 `v1.2.0` 覆盖掉吧！”。为什么正规工程团队严禁覆写已发布版本号？
          options:
            - text: 已经下载过旧版 `v1.2.0` 的队友和客户本地缓存或版本锁定清单哈希会和服务器新包对不上，导致线上线下行为分裂与溯源混乱；正确做法是发布 `v1.2.1`
              correct: true
            - text: 因为 Git 和包仓库物理上只能存储三个版本号
              why: 版本号可以无限递增到 `v1.2.1`、`v1.2.2`，问题出在“同一版本号指向两份不同产物”会破坏信任和校验
            - text: 因为版本号里的最后一个数字必须永远是偶数
              why: 语义化版本号没有奇偶限制，核心原则是**已发布版本不可变**
          explain: 发布物一旦公开即成为历史事实——有错往前加补丁号（`1.2.0 → 1.2.1`），绝不偷偷改写旧版本。
      - item:
          id: q-repro-verify
          type: choice
          prompt: 在“可复现构建”的验证场景下，假如你用同一份公开源码自己重新构建了一遍程序，发现算出的 SHA-256 哈希值和官方下载站提供的安装包不一致。这个现象直接说明了什么？
          options:
            - text: 至少说明构建过程受了未控制环境因素（或不同源码/工具链）影响，需排查环境变量与构建日志——注意“哈希不一致”本身还不足以单独证明官方一定遭到恶意投毒，但已足以发出可疑警报要求核查
              correct: true
            - text: 百分百证明电脑硬盘坏了需要立刻砸掉
              why: 最常见原因往往是忘了固定时间、`locale` 或构建路径差异，因此规范流程要先逐项比对差异内容
            - text: 说明官方安装包里肯定比你多写了 100 万行注释
              why: 哪怕多出 1 毫秒的构建时间戳差异，SHA-256 哈希也会彻底不同
          explain: 可复现构建是强验证手段：一致时提供强信心，不一致时定位差异来源（是环境未固定还是构建链真的被悄悄动过手脚）。

  # ======================================================================== 包管理
  - id: envs-packages
    chapter: 包管理
    title: 依赖隔离、虚拟环境与环境交付
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你电脑上同时接了两个 Python 项目：老项目 A 必须依赖 `requests 2.25`，新项目 B 必须使用 `requests 2.32` 才有的新接口。如果你直接把包全装进系统全局 Python 目录里，会发生什么？
          options:
            - text: 装了 2.32 就会顶掉 2.25，导致两个项目无法在同一套全局目录里同时正常跑起来
              correct: true
            - text: 系统会自动分裂出两台独立的物理笔记本电脑
              why: 同一全局 `site-packages` 目录同名库只能留一个版本，必须自己建项目级隔离目录
            - text: Python 会把 2.25 和 2.32 平均成 2.285 版本给两个项目共用
              why: 包管理器在同一环境中只能保留一个确切版本，不会取平均数
          explain: 解决“我的电脑能跑，一换项目就打架”的第一步，就是给每个项目搭一间独立的**隔离依赖环境**。
      - card:
          title: 虚拟环境（Virtual Environment）（6.1 节）
          body: |
            为了不让项目 A 和项目 B 的第三方库在全局目录里打架，Python 用 `python -m venv .venv`（Node.js 则用项目本地 `node_modules/`）为每个项目单独建一个**虚拟环境（virtual environment）**文件夹。

            在这个隔离目录里放着该项目专属的依赖副本与可执行链接。激活之后装任何包只装进 `.venv`，**完全不污染系统全局环境**，也绝不会把别的项目搞崩！
      - card:
          title: 外部配置、容器与托管服务交付语境（6.5–6.8）
          body: |
            把程序交付到团队服务器甚至给用户安装时，除了隔离依赖库，工程实践还注意三点：
            - **配置分离（6.6）**：数据库密码、端口、开关不要硬编码进源码或打包进镜像，而是靠外部配置文件或环境变量注入（开发、测试、生产各填各的）。
            - **跨平台打包（6.5、6.7）**：若应用不仅依赖 Python 包，还依赖特定系统库或数据库，可用虚拟机或轻量容器把整个软件运行环境一起封包交付，并配置成后台守护服务随系统启动。
            - **公开发布（6.8）**：通过包索引（PyPI / npm）或版本发布页附带校验和发布给下游。
      - item:
          id: q-venv-purpose
          type: choice
          prompt: 刚入职的新人问：“我电脑上就写一个 Python 项目，直接敲 `pip install` 装到系统全局不好吗，为什么团队规范非要大家在项目目录下先建 `.venv` 虚拟环境？”最关键的原因是什么？
          options:
            - text: 避免不同项目之间的依赖包版本互相覆盖冲突，不污染操作系统自身工具依赖的全局 Python，也方便导出该项目精确的依赖清单
              correct: true
            - text: 因为不建 `.venv` 的话，Python 语法里连 `if` 和 `for` 都不能写
              why: 语言语法本身不依赖虚拟环境，虚拟环境解决的是第三方库版本隔离与依赖可复现
            - text: 因为 `.venv` 会自动替你把所有算法时间复杂度降成 O(1)
              why: 虚拟环境只是隔离依赖包存放路径，不改变代码算法复杂度
          explain: 系统工具自己也依赖系统 Python 的库！把项目依赖关进各自的 `.venv` 里，哪怕整个删掉 `.venv` 重建也不伤筋动骨。
      - item:
          id: q-config-separate
          type: choice
          prompt: 在软件交付规范（大纲 6.6 节）中，为什么提倡把数据库地址和接口密钥从源代码里抽离出来，放到运行环境的配置文件或环境变量里？
          options:
            - text: 同一份构建好的代码产物可以原封不动分别跑在开发、测试和生产环境，且避免把生产机密密码提交进公开的 Git 历史
              correct: true
            - text: 因为在源码字符串里无法写进数字和冒号
              why: 源码里语法上完全能写字符串，抽离是为了环境可移植性与机密安全
            - text: 因为放在环境变量里就可以完全不连接任何数据库运行
              why: 程序依然连接数据库，只是连接参数随部署环境动态注入
          explain: “一份不可变代码产物 + 不同环境注入不同配置”，是从开发顺利走到生产发布的基本原则。
      - item:
          id: q-pkg-env-match
          type: match
          prompt: 把下面三项“软件打包与环境交付”机制与它们解决的核心问题连线。
          pairs:
            - [项目独立虚拟环境（`.venv` / `node_modules`）, 隔离不同项目各自需要的第三方库版本，互不覆盖打架]
            - [外部配置与环境变量注入, 同一份代码/构建产物无需改源码即可在开发、测试和生产环境切换参数且不泄露密钥]
            - [系统级运行环境打包（容器/虚拟机）, 连同 Python 之外的底层系统库一起封装，消除“在我电脑明明能跑”的环境差异]
          explain: 从语言级虚拟环境 → 配置外置 → 系统级环境封包，层层解决“换台机器就报错”的难题。
      - card:
          title: 例题：用三步搭起互不打架的 Python 独立项目环境
          body: |
            假设你同时维护依赖 `requests==2.25` 的旧脚本 A 和依赖 `requests==2.32` 的新网站 B，怎么在自己电脑上安全安装而不互踩？
          reveal:
            - title: 第 1 步：分别为两个项目目录各自创建专属虚拟环境
              body: 在项目 A 目录运行 `python -m venv .venv` 激活后 `pip install requests==2.25`；切到项目 B 目录再建它自己的 `.venv` 激活后装 `requests==2.32`。两个目录各自存着独立的依赖库副本，谁也不会覆盖谁，更不碰系统全局 Python！
            - title: 第 2 步：用 `.gitignore` 忽略 `.venv` 目录，用配置文件注入密钥
              body: 上万个库文件不要提交进 Git，只需把 `.venv/` 写进 `.gitignore` 并导出精确依赖列表；数据库密码等环境敏感参数通过环境变量在启动时注入。

  - id: semver-lockfiles
    chapter: 包管理
    title: 语义化版本、版本范围与锁文件复现安装
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: '项目的配置清单里只写了宽松的 `"some-lib": "^1.2.3"`。半年前团队部署时一切正常，今天突然有一个新成员克隆仓库直接装包，结果程序当场崩溃。在团队自己代码一字未改的情况下，最可能发生了什么？'
          options:
            - text: 上游 `some-lib` 昨晚发布了 `1.8.0`（仍在 `^1.2.3` 范围内），但带了一个意外的回归 Bug，没锁死确切版本的新人自动装了 `1.8.0`
              correct: true
            - text: Git 在半年后自动把所有人的源代码删了一半
              why: Git 仓库历史完全不可变，变化来自包管理器重新按宽松范围解析到了更新的小版本
            - text: 计算机硬件芯片半年后会退化成 8 位机
              why: 硬件不会退化，罪魁祸首是没有在仓库里锁定全部依赖树的精确版本
          explain: 声明范围让你方便拿到安全小补丁，但要想“六个月前和今天装出一模一样的整棵依赖树”，必须靠精确版本锁定！
      - card:
          title: 语义化版本（SemVer）与范围符号 `^`（6.3 节）
          body: |
            开源包常用三位数字 **主版本.次版本.修订号（MAJOR.MINOR.PATCH）**，例如 `1.2.3`：
            - **PATCH（修订号 `3`）**：向后兼容的 Bug 修复；
            - **MINOR（次版本 `2`）**：向后兼容的新功能；
            - **MAJOR（主版本 `1`）**：包含破坏性不兼容改动！

            因此在依赖清单里写 `^1.2.3`（插入符号），代表允许升级兼容版本：**`>= 1.2.3` 且 `< 2.0.0`**（只许升次版本和修订号，不准跨越主版本 `2.0.0`；注：主版本为 `0` 时如 `^0.2.3` 则收紧为 `< 0.3.0`）。
      - item:
          id: q-semver-caret
          type: choice
          multi: true
          prompt: '如果项目依赖清单写着 `"demo-pkg": "^1.2.3"`，按照语义化版本 `^` 规则，下面哪些版本号落在**允许**安装的范围内？（多选）'
          options:
            - text: "`1.2.3`（刚好等于下限）"
              correct: true
            - text: "`1.2.5`（修订号升级）"
              correct: true
            - text: "`1.7.0`（次版本升级，仍小于 2.0.0）"
              correct: true
            - text: "`1.2.2`（低于下限 1.2.3）"
              why: "`^1.2.3` 要求版本至少达到 1.2.3，1.2.2 过低不满足"
            - text: "`2.0.0`（跨进了下一个主版本）"
              why: 主版本跳到 2 意味着可能有破坏性不兼容更改，`^1.2.3` 严格禁止跨进 `>= 2.0.0`
          explain: 记牢 `^1.2.3` 的精确区间：`[1.2.3, 2.0.0)`（包含左端 `1.2.3`，不包含右端 `2.0.0`）。
      - card:
          title: 锁文件（Lockfile）与 `npm ci` / `--require-hashes`（6.1、6.4）
          body: |
            就算你自己直接依赖写死了 `1.2.3`，它内部依赖的几十个间接包往往写着 `^`。于是需要**锁文件（lockfile）**（如 `package-lock.json`、`poetry.lock`、`uv.lock`）：

            锁文件把整棵**直接 + 间接依赖树**的每个包名、确切版本（如 `1.2.5`）及压缩包哈希指纹全部记死并提交进 Git！在自动化构建或上线部署时：
            - 用 `npm ci`（而不是随手 `npm install`）：**严格按锁文件安装且绝对不改写锁文件**，一旦清单与锁文件不匹配直接报错停机；
            - Python 则可用带校验哈希的锁定清单配合 `pip install --require-hashes -r requirements.lock`，防依赖版本飘移与中间篡改！
      - item:
          id: q-lockfile-npmci
          type: choice
          prompt: 对比团队成员本地和持续集成机器上的两条命令：`npm install` vs `npm ci`，为什么自动化构建流水线里一致要求跑 **`npm ci`**？
          options:
            - text: "`npm ci` 会清理旧 `node_modules` 并严格一字不差按 `package-lock.json` 装出精确版本树；若 `package.json` 与锁文件不同步会立刻报错而不会偷偷改写锁文件"
              correct: true
            - text: "`npm ci` 可以完全不看网络也不用锁文件，直接凭空写出所有第三方代码"
              why: "`npm ci` 恰恰高度依赖仓库里提交的 `package-lock.json` 锁文件来还原精确包版本与完整性哈希"
            - text: "`npm ci` 会自动把所有依赖升级到最新主版本 `99.0.0`"
              why: 偷偷往高版本升级恰恰是我们要在流水线里极力避免的飘移，升级应当在开发机人工可控更新锁文件后再提交评审
          explain: "`package.json` 写允许范围，锁文件定死今天这棵树，流水线跑 `npm ci` 确保从开发机到上线服务器装出来的每个文件全一致。"
      - item:
          id: q-zero-major-caret
          type: choice
          prompt: 在语义化版本规则里，对还在 `0.x` 早期不稳定阶段的包写下 `^0.2.3`，按照约定允许升级到的上限约束是什么？
          options:
            - text: "`>= 0.2.3` 且 `< 0.3.0`（因为在 `0.x` 阶段，次版本变动也可能带有不兼容改动）"
              correct: true
            - text: "`>= 0.2.3` 且 `< 1.0.0`"
              why: "从 `0.2.x` 跳到 `0.3.0` 常会有破坏性更改，所以 `^0.2.3` 只放行补丁修订号 `0.2.*`"
            - text: 允许直接升到 `2.0.0`
              why: 更不可能跨过主版本 1.0 和 2.0
          explain: "`^` 的原则是“只放行不改变最左边第一个非零数字”的升级：`^1.2.3` 锁住 `1`，`^0.2.3` 锁住 `0.2`。"
      - card:
          title: 例题：用 `npm ci` 与哈希清单挡住“偷偷漂移或被调包的依赖”
          body: |
            假设某次你为了修个小需求手动往 `package.json` 加了一行 `"chalk": "^5.0.0"`，但忘记更新 `package-lock.json` 就直接推到了 CI 上。看看流水线运行 `npm ci` 会发生什么，以及为什么这救了你一命：
          reveal:
            - title: 第 1 步：`npm ci` 发现清单与锁文件不同步立刻停机报错
              body: 如果流水线傻傻跑 `npm install`，它会顺手在服务器上现算出一版新锁文件，装上去跑完又扔掉，根本没人知道这版到底装了哪个小版本！而 `npm ci` 直接对比两份文件发现不一致，当场退出报错，逼着开发者在本地跑完生成精确的 `package-lock.json` 再一起评审提交。
            - title: 第 2 步：哈希校验连带防住“同名版本被仓库篡改”
              body: 锁文件里不仅记着 `5.3.0` 版本号，还记录了当时打包压缩包的完整性哈希；Python 的 `pip install --require-hashes -r requirements.lock` 同理——只要下载来的文件被中间人换过 1 个字符，哈希比对不通过立即中止安装！
      - item:
          id: q-pip-require-hashes
          type: choice
          prompt: 在 Python 生产构建流水线里运行 `pip install --require-hashes -r requirements.lock`，除了固定精确版本号之外还多加了什么硬保障？
          options:
            - text: 强制要求清单里每一个包及其全部间接依赖都带有精确的 SHA-256 校验和，下载结果哈希不符就立即失败拒绝安装
              correct: true
            - text: 自动忽略所有报错哪怕没装上也强行返回退出码 `0`
              why: "`--require-hashes` 属于严格安全校验模式，缺少哈希或哈希不符都会立即以非零错误码中止安装"
            - text: 把所有 Python 代码自动翻译成 C 语言目标文件
              why: "`pip install` 只负责安装并校验第三方库包，不改变语言运行方式"
          explain: 锁定精确版本防“上游升级引入不兼容”，加上哈希校验防“软件供应链中途被替换或镜像源损坏”。

  - id: shell-cli-pipes
    chapter: 依赖与自动化工作流
    title: Shell 命令行、标准流管道、环境变量与信号
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你手里有一个几万行的日志文本 `tasks.txt`，你想快速查出里面**包含 `ready` 的一共有多少行**，并把结果数字存进 `count.txt`。用 Shell 一行流 `grep ready tasks.txt | wc -l > count.txt` 时，中间那个竖线 `|` 到底干了什么？
          options:
            - text: 管道把左边 `grep` 的标准输出流直接喂给右边 `wc -l` 的标准输入，无需自己写中间临时文件，最后 `>` 把计数写入 `count.txt`
              correct: true
            - text: 竖线表示“或者”，两个命令随机挑一个运行
              why: 在代码逻辑表达式里双竖线 `||` 常表示“或”，但在 Shell 命令之间单竖线 `|` 是把前者的输出流接进后者输入的管道符
            - text: 把 `tasks.txt` 文件彻底从硬盘删除
              why: "`grep` 和 `wc` 只读取文件，末尾的 `>` 重定向会把标准输出写进 `count.txt`"
          explain: “每个小程序做好一件事，靠标准流与**管道**自由拼装”——这是命令行自动化工作流的灵魂（1.1–2.3 节）。
      - card:
          title: Shell、命令行参数与三个标准流（1.1–2.3）
          body: |
            打开终端敲命令时，**Shell（如 bash/zsh）**替你解析路径并启动对应程序：
            - **命令行参数（command-line arguments）**：命令名后面用空格拆开的一串参数（含 `-l`、`--quiet` 等开关和目标路径，含空格路径记得加引号）。
            - **三个标准流**：每个启动的程序天然自带 0 号**标准输入（stdin）**、1 号**标准输出（stdout）**和 2 号**标准错误（stderr）**。用 `|`（管道）把上一个的 stdout 接进下一个的 stdin，用 `>` 改写输出到文件，且不会把报错混进正常输出流里。
      - card:
          title: 环境变量、退出状态、信号与远程终端（2.4–2.11）
          body: |
            把多条命令串成可靠脚本，靠四个核心机制：
            - **环境变量（environment variables）**：如 `PATH`（去哪找命令）或临时 `MODE=test ./app`（只影响这一条命令本身，跑完即消失！）。
            - **退出状态（exit status / return code）**：程序结束返回一个数字，`0` 为成功，非 `0` 为失败。`cmd1 && cmd2` 只有前一个返回 `0` 才跑下一个！
            - **信号（Signals）**：按 `Ctrl+C` 给前台发 `SIGINT` 请求温和暂停退出；远程登录（`ssh`）配终端复用器（`tmux`）能保证哪怕网络断线，服务器里的长任务照跑不误。
      - item:
          id: q-shell-exit-and
          type: choice
          prompt: "在 bash 终端里执行一条串联命令：`false && echo ok`，之后立刻查看上一条命令的退出状态 `echo $?`（已知 `false` 命令固定返回失败状态码 `1`）。屏幕会打印 `ok` 吗，`$?` 是多少？"
          options:
            - text: 不会打印 `ok`，且 `$?` 为 `1`（前一条失败后，`&&` 短路跳过后面的 `echo ok`）
              correct: true
            - text: 会打印 `ok`，且 `$?` 为 `0`
              why: "`&&` 是逻辑与短路连接，前面返回非零失败状态时绝不会继续执行后面的成功分支"
            - text: 电脑会因为 `false` 立刻黑屏关机
              why: "`false` 只是 Shell 内建的一个极简测试命令，唯一功能就是以退出码 `1` 结束"
          explain: 几乎所有 CI/CD 流水线脚本的背后原理，就是一行步步检查**退出状态**是否为 `0` 的命令串——测试失败返回非零，整条发布链立刻刹停！
      - item:
          id: q-env-scope
          type: choice
          prompt: 你在终端先后敲了这两行命令：① `MODE=test python app.py`；② `python app.py`。请问第 ② 次运行 `app.py` 时，它读到的环境变量 `MODE` 还是 `test` 吗？
          options:
            - text: 不是：`MODE=test` 写在单条命令最前面时，只临时注入给第 ① 条启动的那一次子进程，不会留存在当前 Shell 里污染第 ② 次
              correct: true
            - text: 是：只要写过一次 `MODE=test`，就会永久写入当前计算机 BIOS 主板直到重装系统
              why: 只有 `export MODE=test` 才会留存在当前 Shell 会话给后续命令继承，单行前缀只生效于当次进程
            - text: 会导致 `app.py` 连 Python 语法都无法解析
              why: 注入环境变量不修改源码文本，程序正常读 `os.environ.get("MODE")` 即可
          explain: 分清 `MODE=test cmd`（仅本次生效，极安全）与 `export MODE=test`（整段 Shell 会话持久生效），就不会在排查环境问题时踩坑。
      - card:
          title: 例题：拆解一条带管道、重定向和退出码检查的排查命令
          body: |
            假设你排查日志时敲了 `grep ERROR app.log | sort | uniq -c > summary.txt && echo saved`。各个符号分别在管哪一件事？
          reveal:
            - title: 第 1 步：数据流在 `|` 管道里从左往右接力
              body: "`grep` 把筛出的错误行吐到 1 号 stdout；管道 `|` 把它接进 `sort` 的 0 号 stdin 排序，再经第二道 `|` 接进 `uniq -c` 统计次数；最后 `>` 把正常结果流写入 `summary.txt`（如果 `grep` 遇到报错信息则走 2 号 stderr 直接打到屏幕，不会混进 `summary.txt` 污染统计）。"
            - title: 第 2 步：`&&` 检查退出状态决定要不要继续
              body: 只有前面整条管道最终返回 `0`（成功），`&&` 后面的 `echo saved` 才会执行；否则立即停住保留非零失败码，通知外部自动化脚本本次任务出错。
      - item:
          id: q-shell-match
          type: match
          prompt: 把下面四种命令行日常控制与它们的精准作用连线。
          pairs:
            - ["`grep err app.log | wc -l`", 用管道把过滤出的错误行流直接送给行数统计命令]
            - ["`python test.py 2> err.log`", 只把标准错误流（2 号流）重定向保存进 `err.log`，不影响正常标准输出]
            - ["`ssh` 远程机里先开 `tmux` 再跑长训练", 即使本地笔记本突然断网合盖，远端会话与程序依然继续跑不断线]
            - ["`Ctrl+C` 发送 `SIGINT` 信号", 通知前台运行的程序优雅暂停或退出，而不是等待它跑完死循环]
          explain: 命令行把“标准流拼接 + 退出状态串联 + 远程断线保护”变成自动化工作流的乐高积木。

  - id: quality-ci-cd
    chapter: 依赖与自动化工作流
    title: 代码规范、自动化测试、Pre-commit 与 CI/CD 衔接
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个 10 人团队约定了“代码缩进要整齐、提交前要自己跑完所有测试”。但赶工期时总有人忘记跑测试就推代码，结果把别人拉下来的主分支直接弄挂。靠口头群里互相提醒能根治吗，工程上怎么让“忘了跑检查的代码根本进不了主分支”？
          options:
            - text: 本地用 Git pre-commit 钩子顺手拦截格式低级错，同时在代码托管平台配置持续集成（CI）服务器，每次推送自动在干净环境跑测试，不通过就不准合并
              correct: true
            - text: 禁止团队任何人每天写超过 5 行代码
              why: 限制代码行数既不现实也挡不住哪怕改 1 行就破坏测试的失误
            - text: 把所有测试文件从仓库里删光，只要不测就不会报错
              why: 删掉测试只是掩耳盗铃，Bug 会直接在线上用户面前爆炸
          explain: “人一定会忘，机器不会忘”——把代码检查与自动测试搬进**自动工作流**，才能守住多人协作底线（7.1–7.8 节）。
      - card:
          title: 代码质量第一关：格式化与静态检查（7.1–7.2）
          body: |
            从“写完能跑”到“放心交付”，先看两道不用跑完整个业务就能秒查的静态关卡：
            1. **格式化（Formatting，如 Black / Prettier）**：自动统一空格、引号和换行，彻底终结团队代码评审里无聊的风格口水战。
            2. **静态检查（Linting，如 Ruff / ESLint）**：不运行代码就能提前抓出“写了未使用的变量”“变量为空未检查”或“忘了关闭文件”等常见坑。
      - card:
          title: 代码质量第二关：自动化测试与覆盖率（7.3–7.4）
          body: |
            静态检查过了关，还要跑通实际行为：
            3. **自动化测试（Testing）**：自动跑单元测试与集成测试，任何断言失败立刻返回非零退出状态刹停流程。
            4. **代码覆盖率（Coverage）**：统计测试执行到了源码中多少比例的行与分支（如 24 行跑了 18 行 = 75%），帮团队快速找到没测到的盲区角落。
      - item:
          id: q-quality-match
          type: match
          prompt: 把自动化质量工作流中的四个环节与它们各自的看门职责对应起来。
          pairs:
            - [格式化工具（Formatter）, 自动排版对齐缩进空格和换行，消除无意义的风格差异]
            - [静态检查器（Linter）, 不实际运行程序即可提前扫出未使用变量、可疑逻辑与潜在缺陷]
            - [测试覆盖率统计, 测量自动化测试究竟执行到了多少比例的源码语句或分支，寻找未测盲区]
            - [Pre-commit Git 钩子, 在本地敲下 `git commit` 时自动先跑轻量检查，拦截低级格式与语法错]
          explain: 格式统一外表、Lint 静态扫雷、测试验证行为、覆盖率照出死角，由命令入口和钩子自动驱动。
      - card:
          title: 命令入口与 Pre-commit 钩子（7.5、7.8）
          body: |
            光有检查命令不够，必须放到**自动触发器**上才不会被人忘掉：
            - **Command runner（如 Makefile / npm scripts）**：把复杂的测试与检查参数封成一个简短口令（如 `npm test`）。
            - **Pre-commit 钩子**：在你敲 `git commit` 的瞬间自动在本机跑一遍格式化和 Lint，几秒内快速挡住低级错误。
      - card:
          title: 持续集成（CI）与持续部署（CD）（7.6–7.7）
          body: |
            本地机器总可能偷懒跳过或留着脏缓存干扰。因此每次推送或发起合并请求（PR），远程**持续集成（CI）**服务器都会从零拉起干净虚拟环境，用锁文件装好依赖并跑完端到端全套测试——全绿（退出码 0）才亮起合并绿灯！

            通过之后，全自动把新构建物安全灰度推到线上服务器（或先自动准备随时一键发布），则叫**持续部署 / 持续交付（CD）**。
      - item:
          id: q-coverage-math
          type: number
          prompt: 某关键核心模块一共包含 24 行可执行代码语句，自动化测试运行完毕后统计报告显示共覆盖执行了其中 18 行。该模块的语句覆盖率是百分之多少？（填百分号前的整数，如 75）
          answer: 75
          explain: 18 / 24 = 0.75 = 75%。注意高覆盖率是防漏测的下限参考，但光执行过这行不代表所有边界断言都写对。
      - item:
          id: q-ci-why-needed
          type: choice
          prompt: 既然本地电脑上已经装了 Pre-commit 钩子（在每次 `git commit` 前自动检查格式），为什么专业团队依然必须在远程服务器上搭建**持续集成（CI）**？
          options:
            - text: 本地钩子可以用 `--no-verify` 绕过，而且本地往往留着脏缓存或未提交依赖；CI 在每次推送后在全新干净的隔离环境用锁文件重装并跑完整测试，结果不可绕过且真实可信
              correct: true
            - text: 因为 Git 规定本地电脑绝对无法运行任何单元测试
              why: 开发者本地当然也能跑单元测试，区别在于本地环境容易“在我机上刚好有某个没写进清单的包”且可人为跳过
            - text: 因为 CI 服务器能自动把没写测试的函数变成无 Bug 代码
              why: CI 只负责严格运行测试把缺陷尽早暴露出来，修复仍需开发完成
          explain: 本地 Pre-commit 追求秒级快反馈（挡粗心），远程 CI 追求绝对干净、严格且无人能绕过的合并守门（保质量）。
      - item:
          id: q-precommit-vs-ci
          type: choice
          prompt: 某开发在本地敲 `git commit` 时触发了 Pre-commit 钩子，因为格式化工具提示有一处空行不对而阻止了提交。这体现了自动化质量工作流什么设计原则？
          options:
            - text: 在提交进入远程协作之前就用秒级反馈把低级缺陷拦在开发机本地，省去等远程 CI 排队和人工评审返工的时间
              correct: true
            - text: 说明开发者的键盘以后永远打不出空格了
              why: 格式化工具只需一键自动整理好格式后重新 `git add` 即可顺利提交
            - text: 说明 Pre-commit 可以替代所有远程测试和生产监控
              why: 本地钩子只做快速轻量把关，完整多环境测试仍离不开远程 CI
          explain: 越早发现问题修改成本越低——“本地秒查格式与 Lint → 远程 CI 严守全量测试”是最顺滑的节奏。
      - card:
          title: 例题：拆解一条从开发者修改到 CI 亮绿灯的完整流水线
          body: |
            把 Git、Shell 退出状态、虚拟环境、锁文件与自动化质量检查全部串在一起：假设一位新人提交了一个合并请求（PR），自动化检查如何从头走到尾？
          reveal:
            - title: 第 1 步：本地编辑与 Pre-commit 快速拦截低级错
              body: 开发者在 `feature` 分支写好代码与单元测试后 `git add` 进暂存区；敲下 `git commit` 时 Pre-commit 钩子立刻触发格式化与 Lint 静态检查。若有未用变量或格式不合规范，钩子返回非零退出状态，提交当场叫停让你一秒修净再重交。
            - title: 第 2 步：远程 CI 隔离构建与全量验证亮绿灯
              body: 推送分支后，CI 机器从零拉取干净虚拟环境，用 `npm ci` 或 `--require-hashes` 还原出一字不差的依赖树，紧接着执行构建规则（`make`）与完整自动化测试和覆盖率统计。所有步骤退出码全为 `0` 才亮出合并绿灯，确认本次构建物与当前 Git 提交哈希一一对应可复现。

boss:
  items:
    - id: boss-git-areas
      type: choice
      prompt: 你先运行 `git add report.py` 把版本 V1 放进了暂存区；紧接着又在编辑器把 `report.py` 改成了版本 V2 并保存（但这次没再跑 `git add`）；最后敲 `git commit -m "done"`。随后你推上远程分支，队友拉下来看到的 `report.py` 是什么？
      options:
        - text: 版本 V1，因为 `git commit` 只提交暂存区里的快照，V2 的修改仍然只留在你本地工作区里
          correct: true
        - text: 版本 V2，因为 `git commit` 总是无视暂存区直接打包硬盘最新文件
          why: 不带 `-a` 参数的 `git commit` 严格只打包暂存区的内容
        - text: 一份 V1 和 V2 混杂在一起包含 `<<<<<<<` 冲突标记的文件
          why: 只有双分支合并遇到冲突时才会产生 `<<<<<<<` 标记，本地工作区与暂存区差异不会生成冲突标记
        - text: 空文件，因为两次修改互相抵消了
          why: 暂存区保存着完整的 V1 快照内容，提交后会原原本本记录 V1
      explain: 这是 Git 新手最常踩的坑——养成提交前运行 `git status` 检查有没有红色“已修改但未暂存”文件的习惯就能彻底避开。
    - id: boss-git-undo
      type: match
      prompt: 为团队协作中的四类 Git 撤销或整理场景选出正确操作。
      pairs:
        - [尚未推送的最后一笔本地提交漏了个文件, 补 `git add` 后运行 `git commit --amend`]
        - [想撤销尚未推送的本地提交并保留改动在暂存区重新拆分, "`git reset --soft HEAD~1`"]
        - [已经推送到团队共享 `main` 分支的错误提交需要安全撤回, "`git revert <哈希>` 追加一笔相反改动的新提交"]
        - [个人尚未推送给队友的本地功能分支想整理成跟在 `main` 后的直线历史, "`git rebase main`"]
      explain: 本地私有历史可以整容（`--amend`、`reset`、`rebase`），推到共享公共分支后只许向前追加（`revert`）。
    - id: boss-debug-tools
      type: match
      prompt: 把四类棘手的程序排错与优化场景和最对症的工具配对。
      pairs:
        - [几十万次循环里只有特定条件才会算错，想精准在出错那一轮停下看现场, 调试器条件断点（如 `pdb` / `gdb`）]
        - [没有源码的第三方闭源程序一跑就闪退，想看清它在找哪个路径的配置文件, 系统调用追踪（`strace`）]
        - [C 语言程序悄悄数组越界 1 格却没当场崩，想第一时间抓出精确行号, 内存检查器 AddressSanitizer（ASan）]
        - [脚本太慢但不知道 80% 时间花在解析还是数据库查询，先测准热点再动手, CPU 性能剖析器（Profiler）]
      explain: 条件断点看状态、strace 看系统交互边界、ASan 抓内存越界、Profiler 找真正耗时大头。
    - id: boss-profiling-math
      type: number
      prompt: 一次接口请求总耗时 100 毫秒，性能剖析显示其中解析数据占 80 毫秒、查缓存占 20 毫秒。如果你专注把占比最大的“解析数据”成功提速一倍（耗时减半，查缓存时间不变），优化后整次请求的总耗时降到多少毫秒？（填整数）
      answer: 60
      explain: 80 / 2 + 20 = 60 毫秒（总耗时直接降了 40%，相比之下把 20 毫秒提速一倍只能降到 90 毫秒）。
    - id: boss-makefile-rebuild
      type: choice
      prompt: "一个 C 项目包含 `main.c`、`util.c` 以及被两者同时 `#include` 的 `util.h`，且 Makefile 正确写好了 `app: main.o util.o`、`main.o: main.c util.h`、`util.o: util.c util.h`。全量构建一次后，如果今天你**只修改了 `util.c`**（没有动 `util.h` 和 `main.c`）然后运行 `make`，会发生什么？"
      options:
        - text: 跳过已经是最新的 `main.o`，只重新编译 `util.o` 并重新链接出新 `app`
          correct: true
        - text: 必须把 `main.c` 和 `util.c` 全部删掉重编译才行
          why: "`main.o` 比它的两个依赖 `main.c`、`util.h` 都新，`make` 会复用已有 `main.o`"
        - text: 什么都不会执行，继续留着没包含新代码的旧 `app`
          why: "`util.c` 新于 `util.o`，先重建 `util.o`；接着 `util.o` 新于 `app`，会重新触发链接步骤生成新 `app`"
        - text: 只会更新 `util.h` 的文件修改时间而不会链接 `app`
          why: "`make` 绝不会擅自修改你的源码头文件时间，而是按依赖链自底向上重建受影响的产物"
      explain: 这就是构建依赖图（DAG）与时间戳比对实现“最小增量重建”的标准行为（如果改的则是被共用的 `util.h`，才会同时重编 `main.o` 与 `util.o`）。
    - id: boss-semver
      type: choice
      prompt: '项目依赖配置里写着 `"http-kit": "^1.2.3"`。如果锁文件还没固定前此时仓库里有下列几个版本，包管理器**绝不允许**自动升级安装哪一个？'
      options:
        - text: "`2.0.0`（主版本升级，超出 `< 2.0.0` 的兼容性承诺上限）"
          correct: true
        - text: "`1.2.3`（下限版本本身）"
          why: "`^1.2.3` 允许从 `1.2.3` 起兼容升级"
        - text: "`1.2.9`（补丁修订号升级）"
          why: 修订号升级属于向后兼容的缺陷修复，在 `^1.2.3` 允许范围内
        - text: "`1.8.0`（次版本新增功能升级）"
          why: 次版本升级同样满足 `>= 1.2.3 && < 2.0.0`
      explain: "`^1.2.3` 匹配 `[1.2.3, 2.0.0)`；如果包版本号还在 `0.x` 阶段（如 `^0.2.3`），则会进一步收紧到 `[0.2.3, 0.3.0)`。"
    - id: boss-lockfile-ci
      type: choice
      prompt: 关于**虚拟环境**、**锁文件**与 **`npm ci` / `--require-hashes`** 的协同作用，下面哪句话完全准确？
      options:
        - text: 虚拟环境隔离不同项目的本地库目录；锁文件把整棵直接与间接依赖树的确切版本和校验哈希写死进 Git；CI 跑 `npm ci` 时严格按锁文件原样安装而不改写锁文件
          correct: true
        - text: 锁文件只需要记下直接依赖的范围表达式（如 `^1.2.3`），不需要记间接子依赖的版本和哈希
          why: 绝大多数意外故障恰恰来自间接子依赖偷偷升了小版本，锁文件必须锁定整棵依赖树与校验和
        - text: 只要在本地建了 `.venv` 虚拟环境，就算不提交锁文件也能保证半年后在新机器装出完全一致的包版本
          why: "`.venv` 本身一般不提交进 Git，没有锁文件的话半年后在新机器安装依然会拉取后来新发布的兼容版本"
        - text: "`npm ci` 的作用是在没有 `package-lock.json` 时强行删除电脑里所有源代码"
          why: 恰恰相反，缺少锁文件或清单与锁文件不匹配时，`npm ci` 会安全拒绝执行并报错提醒修复
      explain: 虚拟环境管“项目间不串库”，锁文件管“跨越时间与机器装出完全一样的依赖树”。
    - id: boss-shell-order
      type: choice
      prompt: 你需要用 Shell 把 `server.log` 里所有包含 `ERROR` 的行筛出来，只取前 20 条，统计一共有多少个字符，同时要求前面的命令只有都返回成功状态码 `0` 时最后才打印 `done`。下面哪组组合用法符合标准流与退出状态规则？
      options:
        - text: "`grep ERROR server.log | head -n 20 | wc -c && echo done`"
          correct: true
        - text: "`grep ERROR server.log && head -n 20 && wc -c | echo done`"
          why: 把管道 `|` 换成 `&&` 会导致 `head` 和 `wc` 收不到上一个命令的标准输出流
        - text: "`grep ERROR server.log > head -n 20 > wc -c`"
          why: "`>` 会把输出直接写成磁盘上名叫 `head` 的普通文件，而不是传给下一个程序作为标准输入"
        - text: "`MODE=test grep ERROR server.log` 会把 `MODE` 永久保留成全局设置影响之后所有命令"
          why: 写在单条命令前面的环境变量赋值只对那一个子进程有效，命令一结束就消失
      explain: 记清两个符号分工：`|` 接标准输出到下一个的标准输入（数据流）；`&&` 看前一个退出状态是不是 `0`（控制流）。
    - id: boss-repro-builds
      type: choice
      prompt: 一家公司想确保其发布的 CLI 工具做到**可复现构建**（任何外部审计者拿同一份公开源代码重编，算出的 SHA-256 哈希都与官方发布包完全一致）。除了固定依赖与编译器版本外，工程上还必须注意处理哪两类问题？
      options:
        - text: 用 `SOURCE_DATE_EPOCH` 固定归档与内嵌时间戳，并对文件输入顺序排序以及剥离本机构建路径与时区差异
          correct: true
        - text: 让每次打包都在产物里随机嵌入一个 `uuid4()` 编号以显个性
          why: 随机 UUID 会导致每次重新构建产物哈希都不同，直接破坏可复现性
        - text: 只准在每年 1 月 1 日零点零分零秒才允许执行构建命令
          why: 正是靠环境变量 `SOURCE_DATE_EPOCH` 传入固定时间戳来模拟恒定构建时间，不必真的等新年钟声
        - text: 关掉所有编译器优化并禁止写任何自动化测试
          why: 与是否关闭测试无关，可复现取决于消除时间、顺序、路径和随机性等非确定输入
      explain: 消除时间、目录排序、构建路径、时区与随机性，就能让不同机器对同一源码得出完全一致的产物校验和。
    - id: boss-ci-pipeline
      type: order
      prompt: 请把一条标准自动化质量防线从开发者本地写完代码到合入团队主干的顺序排出来。
      steps:
        - 本地编辑器触发格式化与 Lint 静态检查，统一缩进并提前抓出低级语法隐患
        - 运行 `git commit` 时触发 Pre-commit 钩子复核轻量规则，确认提交范围干净（用 `git status` 检查暂存区）
        - 推送到远程分支触发持续集成（CI），在干净环境通过 `npm ci` / 锁文件安装精确依赖并运行全部自动化测试与覆盖率检查
        - CI 全部通过（退出状态为 `0`）后亮起绿灯，才允许合并进入受保护的团队主干分支
      explain: 从本机即时反馈（格式/Lint/Pre-commit）到远程隔离不可绕过把关（CI + 锁文件 + 全量测试），层层把缺陷拦在合入主干之前。
