skill: E.1.3
version: 2
authors: [main-agent]
brief:
  why: 收音机、手机、对讲机都要把信息装到高频载波上发出去，再从天线上千百个信号里挑出要的那一个取回来。这一站讲完成这些事的高频电路：谐振回路和匹配网络怎样选频和变换阻抗，调谐放大器、低噪声放大器和功率放大器怎样放大，振荡器、混频器怎样产生和搬移频率，调幅、调频怎样调制和解调，锁相环怎样把频率稳住，最后把它们拼成完整的接收机和发射机。每个电路都要算出谐振频率、带宽、噪声系数、效率这些数，并说明设计时的折中。
  outcomes:
    - 算串联和并联谐振回路的谐振频率、品质因数和带宽，用部分接入减小负载影响，用 L 型网络做阻抗匹配，算反射系数
    - 算调谐放大器的增益带宽积和多级同步调谐的带宽，用 Friis 公式算级联噪声系数和接收机灵敏度，由双音测试求 IIP3
    - 说明低噪声放大器的输入匹配方法，算源极电感产生的输入电阻
    - 说明功放按导通角的分类，算最大输出功率、丙类的效率，说明欠压、临界、过压状态和开关类功放、线性化的思路
    - 用三点式法则判断振荡器能否起振，算考毕兹、哈特莱、克拉泼振荡器的频率，说明压控振荡器和相位噪声
    - 算混频后的中频和镜像频率，说明无源和有源混频器、组合频率和副波道干扰
    - 算调幅波的频谱和边带功率、包络检波器的 RC 条件，算调频的调制指数和卡森带宽，说明鉴频和限幅
    - 算锁相环的静态相位差、固有频率和阻尼，算整数分频、小数分频和直接数字频率合成的输出频率
    - 比较超外差、零中频、低中频接收机和直接变频、两步变频发射机，算镜像抑制比、邻道泄漏比
terms:
  - term: 载波
    def: 用来运送信息的高频正弦波；把信息加到它的幅度、频率或相位上再发射出去。
  - term: 调制
    def: 把要传送的信息加到载波上的过程，比如让载波的幅度或频率随声音变化。
  - term: 解调
    def: 接收端从已调制的载波里把原来的信息取回来的过程。
  - term: 功率放大器
    def: 发射机最后一级的放大器，把信号放大到足够的功率送给天线，关心的是输出功率和效率。
  - term: 低噪声放大器
    def: 接收机天线后面的第一级放大器，要求自身加进的噪声尽量小、增益足够，简称 LNA。
  - term: 混频器
    def: 把输入信号和本地振荡器的正弦波相乘，把信号搬到另一个频率（常为中频）上的电路。
  - term: 中频
    def: 接收机里信号经混频后被搬到的固定频率，在它上面放大和滤波比在高频上容易。
  - term: 阻抗
    def: 正弦信号下元件两端电压和电流之比，是一个复数：电阻 $R$、电感 $j\omega L$、电容 $1/(j\omega C)$。
  - term: 电抗
    def: 阻抗的虚部；电感的电抗 $\omega L$ 随频率升高而变大，电容的 $1/(\omega C)$ 随频率升高而变小。
  - term: 谐振
    def: 回路里电感和电容的电抗正好抵消的状态，发生在 $f_0 = 1/(2\pi\sqrt{LC})$。
  - term: 品质因数
    def: 描述谐振回路损耗大小和选频尖锐程度的量 $Q$；串联回路 $Q = \omega_0L/R$，并联回路 $Q = R/(\omega_0L)$，带宽是 $f_0/Q$。
  - term: 有载品质因数
    def: 把信号源内阻和负载都算进去以后回路的品质因数，总比回路自身的 $Q$ 小。
  - term: 接入系数
    def: 部分接入时负载两端电压和回路两端电压之比 $p$；负载折算到回路两端相当于 $R_L/p^2$。
  - term: 共轭匹配
    def: 负载阻抗等于信号源内阻抗的共轭，电抗抵消、电阻相等，负载得到最大功率。
  - term: 匹配网络
    def: 接在信号源和负载之间、由电感和电容组成的网络，把负载阻抗变成信号源需要的阻抗。
  - term: 反射系数
    def: 负载处反射电压和入射电压之比 $\Gamma = (Z_L - Z_0)/(Z_L + Z_0)$；反射功率占入射功率的 $|\Gamma|^2$。
  - term: 史密斯圆图
    def: 把反射系数画在单位圆里、并标出等电阻圆和等电抗线的图，圆心是匹配点，用来设计匹配网络。
  - term: 调谐放大器
    def: 负载是谐振回路的放大器，只放大谐振频率附近的信号，同时完成放大和选频。
  - term: 矩形系数
    def: 增益降到 0.1 倍处的带宽和 3 dB 带宽之比，越接近 1 越接近理想的矩形选频特性。
  - term: 并联
    def: 两个元件的两端分别接在同一对节点上的连接方式，两者电压相同；并联时阻抗的倒数相加。
  - term: 中和
    def: 用一个电容送回大小相等、相位相反的信号，抵消晶体管内部电容的反馈，防止调谐放大器自激。
  - term: 并联峰化
    def: 在宽带放大器的负载电阻上串一个小电感，补偿节点电容造成的高频下降，把带宽拉宽。
  - term: 热噪声
    def: 电阻里电子热运动产生的随机噪声；能送给匹配负载的功率是 $kTB$，290 K 时约 −174 dBm/Hz。
  - term: 噪声系数
    def: 输入信噪比和输出信噪比之比 $F$，表示电路加进了多少噪声；用分贝表示是 $\text{NF} = 10\lg F$。
  - term: 灵敏度
    def: 接收机能正确解调的最弱输入功率，等于 −174 dBm/Hz 加噪声系数、$10\lg B$ 和所需信噪比。
  - term: 1 dB 压缩点
    def: 因为非线性，放大器增益比小信号时下降 1 dB 时的输入（或输出）功率。
  - term: 三阶互调
    def: 两个频率 $f_1$、$f_2$ 经过三次方非线性产生的 $2f_1 - f_2$ 和 $2f_2 - f_1$ 成分，紧挨着原信号，难以滤掉。
  - term: 三阶输入截点
    def: 基波和三阶互调的输出功率随输入延长成直线后的交点对应的输入功率，简称 IIP3，越高越线性。
  - term: 无杂散动态范围
    def: 从信号刚高出噪声，到三阶互调刚冒出噪声底之间的输入功率范围，简称 SFDR。
  - term: 导通角
    def: 输入一个正弦时，晶体管在一个周期里导通的那段相位，写作 $2\theta$：甲类 360°、乙类 180°、丙类不到 180°。
  - term: 丙类
    def: 导通角小于 180° 的功率放大器，只在集电极电压最低时导通，效率高，要靠谐振回路取出基波。
  - term: 开关类功率放大器
    def: 让晶体管工作在开关状态的功率放大器（D、E、F 类），电压和电流不同时出现，理论效率可达 100%。
  - term: 峰均比
    def: 信号包络的峰值功率和平均功率之比，峰均比大的信号要求功率放大器回退更多。
  - term: 回退
    def: 让功率放大器的平均输出低于 1 dB 压缩点一段距离，好让信号峰值也不被压缩。
  - term: 预失真
    def: 在功率放大器之前按它失真的反方向先把信号变形，使两者合起来近似线性。
  - term: 包络消除与恢复
    def: 把信号拆成恒包络的相位信号和包络信号，相位信号由开关类功放放大，包络去调功放的电源，简称 EER。
  - term: 三点式振荡器
    def: 晶体管的三个电极接到 LC 回路三个点上的振荡器；和发射极相连的两个电抗同性质，集电极和基极之间的相反。
  - term: 考毕兹振荡器
    def: 电容三点式振荡器，两个串联电容分压反馈、对面接一个电感，频率约为 $1/(2\pi\sqrt{LC_1C_2/(C_1 + C_2)})$。
  - term: 交叉耦合振荡器
    def: 两个管子的漏极和栅极交叉相连、各接 LC 回路的差分振荡器，交叉对提供 $-2/g_m$ 的负阻。
  - term: 变容管
    def: 电容随所加反偏电压变化的 PN 结或 MOS 电容，用来调谐振荡频率或实现调频。
  - term: 压控振荡器
    def: 振荡频率随控制电压变化的振荡器，简称 VCO；频率随电压变化的斜率叫压控增益 $K_\text{VCO}$。
  - term: 正交
    def: 两路频率相同、相位相差 90° 的信号互为正交信号，如余弦和正弦；接收机里常叫 I 路和 Q 路。
  - term: 相位噪声
    def: 离载波一定频偏处 1 Hz 带宽里的噪声功率和载波功率之比，单位 dBc/Hz，描述振荡器频谱的纯度。
  - term: 倒易混频
    def: 强干扰和本振相位噪声的裙边相混，结果落进中频通带、像噪声一样盖住信号的现象。
  - term: 本振
    def: 接收机或发射机自己产生、送进混频器的正弦波，全称本地振荡器，简称 LO。
  - term: 镜像频率
    def: 在本振另一侧、和要收的信号离本振一样远的频率，$2f_\text{LO} - f_\text{RF}$；它混频后同样落在中频上。
  - term: 无源混频器
    def: 用本振驱动的开关（多为 MOS 管）完成混频、开关里不流直流电流的混频器，线性好、有约 4 dB 损耗。
  - term: 有源混频器
    def: 先用跨导管把射频电压变成电流、再由本振驱动的开关管换向的混频器，本身有转换增益。
  - term: 干扰哨声
    def: 要收的信号自己和本振的谐波组合后落在中频附近，检波后出现一个音调的干扰。
  - term: 中频干扰
    def: 频率正好等于中频的外来信号不经变频、直接漏进中频造成的干扰。
  - term: 镜像干扰
    def: 镜像频率上的外来信号经混频后同样落在中频，和要收的信号叠在一起造成的干扰。
  - term: 交叉调制
    def: 强干扰经非线性把自己的调制转移到要收的信号上，要收的电台停播时干扰也随之消失。
  - term: 互调
    def: 两个干扰经非线性组合出 $2f_1 - f_2$ 等成分、正好落在要收频率上的干扰。
  - term: 调幅
    def: 让载波幅度随调制信号变化的调制方式，简称 AM。
  - term: 调幅度
    def: 调幅波包络起伏的相对大小 $m = (U_\max - U_\min)/(U_\max + U_\min)$，大于 1 时过调制。
  - term: 包络
    def: 高频振荡波形的上下轮廓线；调幅波的包络就是调制信号的形状。
  - term: 边带
    def: 调制后在载波两侧出现的频率成分，调制信号的信息全在边带里。
  - term: 双边带调制
    def: 去掉载波、只发上下两个边带的调幅，简称 DSB，要用同步检波解调。
  - term: 单边带调制
    def: 只发一个边带的调幅，简称 SSB，带宽只有调制信号的最高频率，功率全部用在信息上。
  - term: 包络检波器
    def: 用二极管和 RC 负载取出调幅波包络的检波电路，$RC$ 要远大于载波周期、又能跟上包络。
  - term: 惰性失真
    def: 包络检波器的 $RC$ 太大、电容放电跟不上包络下降而产生的失真。
  - term: 同步检波
    def: 把已调信号和本地产生的同频同相载波相乘再低通滤波的解调方法，能解调双边带和单边带。
  - term: 调频
    def: 让载波的瞬时频率随调制信号变化的调制方式，简称 FM。
  - term: 调相
    def: 让载波的瞬时相位随调制信号变化的调制方式，简称 PM。
  - term: 最大频偏
    def: 调频信号瞬时频率偏离载波频率的最大值 $\Delta f$。
  - term: 卡森带宽
    def: 估算调角信号带宽的公式 $B \approx 2(\Delta f + F)$，包含 98% 以上的功率。
  - term: 鉴频器
    def: 输出电压和输入信号频偏成正比的电路，用来解调调频信号。
  - term: 限幅器
    def: 把信号放大后削成幅度恒定的电路，放在鉴频器前面去掉幅度上的噪声和干扰。
  - term: 自动增益控制
    def: 检测输出幅度、自动调节放大器增益，让输出在输入强弱变化很大时大致稳定的电路，简称 AGC。
  - term: 自动频率控制
    def: 用鉴频器检测频率误差、去调整本振的反馈电路，总留下一点剩余频率误差，简称 AFC。
  - term: 锁相环
    def: 用鉴相器比较两路信号的相位、通过环路滤波器去控制压控振荡器的反馈系统，锁定后频率误差为零，简称 PLL。
  - term: 鉴相器
    def: 输出电压和两路信号相位差成正比的电路，比例系数是 $K_\text{PD}$。
  - term: 鉴频鉴相器
    def: 比较两路信号边沿先后、输出升或降脉冲的检测器，能同时判断相位和频率的快慢，简称 PFD。
  - term: 电荷泵
    def: 按鉴频鉴相器的脉冲向环路滤波器电容送入或抽出电流的电路，和电容一起构成积分器。
  - term: 整数分频频率合成器
    def: 在锁相环反馈路径上插入分频比为整数 N 的分频器，输出 $f_\text{out} = Nf_\text{REF}$，步进等于参考频率。
  - term: 双模预分频器
    def: 能在 P 和 P + 1 两种分频比之间切换的高速分频器，配合吞脉冲计数器得到 $N = PB + A$。
  - term: 小数分频合成器
    def: 分频比在 N 和 N + 1 之间切换、平均为小数的频率合成器，参考频率高而步进可以很细。
  - term: 直接数字频率合成
    def: 用相位累加器、正弦表和数模转换器直接算出正弦波的频率合成方法，简称 DDS。
  - term: 超外差接收机
    def: 先用混频器把信号搬到固定的中频、在中频上选信道和放大的接收机。
  - term: 零中频接收机
    def: 本振等于信号频率、把信号直接搬到零频附近的接收机，用 I、Q 两路，没有镜像，易于集成。
  - term: 邻道泄漏比
    def: 发射信号在本信道的功率和漏到相邻信道里的功率之比，用 dB 表示，简称 ACPR。
  - term: 误差矢量幅度
    def: 实际发出的调制点和理想位置之差的有效值除以理想信号的幅度，简称 EVM。
  - term: 镜像抑制接收机
    def: 用正交本振和 90° 移相，使信号同相相加、镜像反相抵消的接收机结构。
lessons:
  - id: rf-intro
    chapter: 谐振回路与阻抗变换
    title: 射频电路做什么
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 收音机的天线同时收到几百个电台的信号，混在一起。收音机怎样只让你听到其中一个？
          options:
            - text: 按频率把要的那个电台挑出来
              correct: true
            - text: 把所有信号一起放大，再从声音里分辨
              why: 所有电台一起放大后叠在一起，变成声音就是一片嘈杂；必须先按频率把要的那一个挑出来
            - text: 天线本来就只收一个电台
              why: 天线对附近很宽一段频率都有响应，所有电台的信号都会在天线上感应出电压
          explain: 每个电台占用不同的频率。接收机先用一个对某个频率特别敏感的电路选出要的那一个，这种电路就是谐振回路，也是这一站的第一个话题。
      - card:
          title: 把信息装到高频上
          body: |
            声音的频率只有几十赫到几千赫，直接发射需要几百公里长的天线，各电台也会挤在同一段频率上。无线通信的做法是：用一个高频正弦波运送信息，这个正弦波叫**载波（carrier）**；把声音、数据加到载波上的过程叫**调制（modulation）**，接收端把信息取回来叫**解调（demodulation）**。

            不同电台用不同的载波频率，就能同时发射而互不干扰。天线的尺寸要和波长 $\lambda = c/f$ 相当，频率越高，天线越小。
      - item:
          id: wavelength
          type: number
          prompt: 光速取 $3\times10^8$ m/s。频率 100 MHz 的电磁波，波长是多少米？
          answer: 3
          tolerance: 0.001
          unit: m
          hint: 波长、频率和光速是什么关系？
          explain: $\lambda = c/f = 3\times10^8/10^8 = 3$ m。常用的四分之一波长天线只要约 0.75 m；手机用的 2.4 GHz 波长只有 12.5 cm。
      - card:
          title: 收发机由哪些部分组成
          body: |
            发射机：要发送的信号先调制到载波上，再经**功率放大器（power amplifier）**放大到足够的功率送给天线。接收机：天线收到的信号先经选频网络和**低噪声放大器（low-noise amplifier）**放大，再由**混频器（mixer）**把它搬到一个固定的较低频率（**中频（intermediate frequency）**）上，放大、滤波后解调。

            产生载波和混频用的正弦波靠振荡器，频率要准，就用一个比较相位、自动修正频率的反馈电路来稳住。这些方框里的每一块，都是一类射频电路。
      - item:
          id: rx-order
          type: order
          prompt: 一台接收机先把信号搬到一个固定的中频，再放大、解调。把信号经过的方框按先后排好。
          steps:
            - 天线
            - 低噪声放大器
            - 混频器
            - 中频放大器
            - 解调器
          explain: 信号最弱的时候先由低噪声放大器放大，混频器把它搬到中频，在中频上放大和滤波最方便，最后解调取出信息。
      - card:
          title: 用 dBm 表示功率
          body: |
            射频里的功率从几瓦一直小到 $10^{-15}$ W，用对数表示更方便。以 1 mW 为参考，
            $$P_{\text{dBm}} = 10\lg\frac{P}{1\ \text{mW}}$$
            0 dBm 就是 1 mW，每加 10 dB 功率乘 10，每减 3 dB 约减半。放大器增益用 dB 表示时，输出的 dBm 等于输入的 dBm 加增益的 dB。

            射频系统的电缆、测试仪器、天线接口大多按 50 Ω 设计。50 Ω 上 0 dBm 的正弦波，有效值 $\sqrt{PR} = 0.224$ V，峰值 0.316 V。
      - item:
          id: dbm-to-watt
          type: number
          prompt: 手机接收到的信号是 −60 dBm。它是多少纳瓦？
          answer: 1
          tolerance: 0.001
          unit: nW
          hint: −60 dBm 比 1 mW 小多少倍？
          explain: $10^{-60/10}\times1\ \text{mW} = 10^{-6}$ mW $= 10^{-9}$ W，即 1 nW。很多接收机要能处理比它还弱一百万倍的信号。
      - item:
          id: gain-dbm
          type: number
          prompt: 一个放大器的增益是 20 dB，输入信号 −30 dBm。输出是多少 dBm？
          answer: -10
          tolerance: 0.001
          unit: dBm
          hint: 用 dB 表示时，乘法变成了什么运算？
          explain: $-30 + 20 = -10$ dBm。功率放大了 100 倍：输入 1 μW，输出 0.1 mW。
      - card:
          title: 射频电路为什么要谈非线性
          body: |
            线性时不变系统只会改变每个频率成分的大小和相位，不会产生输入里没有的频率。可射频电路里，混频器、调制器正是要产生新频率；而放大器在大信号下也会因为非线性冒出新的频率，干扰别的信道。所以射频电路一面要利用非线性和时变（开关），一面又要防着它们。
      - item:
          id: lti-new-freq
          type: choice
          prompt: 一个线性时不变的放大器，输入是 1 MHz 的正弦波。输出里可能有哪些频率？
          options:
            - text: 只有 1 MHz
              correct: true
            - text: 1 MHz、2 MHz、3 MHz 等各次谐波
              why: 谐波是非线性产生的；线性时不变系统只改变 1 MHz 成分的大小和相位
            - text: 0 到 1 MHz 之间的所有频率
              why: 线性时不变系统对正弦输入的响应是同频正弦，不会把一个频率展宽成一段频谱
          explain: 正弦波是线性时不变系统的特征函数，输出只是乘了一个复数。要得到新频率，电路必须是非线性的或时变的。
  - id: resonance
    chapter: 谐振回路与阻抗变换
    title: 串联谐振和并联谐振
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个电感和一个电容串联，接在频率可调的正弦电压源上。把频率从很低慢慢调到很高，电路里的电流会怎样变？
          options:
            - text: 先变大，在某个频率最大，然后又变小
              correct: true
            - text: 一直变大，因为频率越高电流变化越快
              why: 频率越高，电感越“挡”电流；频率很低时电容又“挡”电流。两头电流都小，中间某个频率最大
            - text: 一直变小，因为电感越来越挡电流
              why: 低频时电容几乎断开，电流也很小；电流是先增大、过了某个频率才减小
          explain: 低频时电容挡电流，高频时电感挡电流，两者的作用在某个频率正好抵消，电流在那里最大。这个频率就是谐振频率。
      - card:
          title: 阻抗和电抗
          body: |
            正弦信号下，元件两端电压和电流之比可以写成一个复数，叫**阻抗（impedance）**：电阻是 $R$，电感是 $j\omega L$，电容是 $1/(j\omega C) = -j/(\omega C)$，$\omega = 2\pi f$ 是角频率，$j$ 是虚数单位。阻抗的虚部叫**电抗（reactance）**：电感的 $\omega L$ 随频率升高而变大，电容的 $1/(\omega C)$ 随频率升高而变小。

            串联的阻抗直接相加；两个元件的两端分别接在同一对节点上，叫**并联（parallel connection）**，并联时阻抗的倒数相加，和电阻的规则一样。
      - item:
          id: inductive-reactance
          type: number
          prompt: 一个 1 μH 的电感，在 10 MHz 时的电抗是多少欧？保留一位小数。
          answer: 62.8
          tolerance: 0.05
          unit: Ω
          hint: 电感的电抗和角频率是什么关系？角频率是频率的几倍？
          explain: $\omega L = 2\pi\times10^7\times10^{-6} = 62.8\ \Omega$。频率升到 100 MHz，电抗变成 628 Ω。
      - card:
          title: 串联谐振
          body: |
            电阻、电感、电容串联，总阻抗 $Z = R + j\left(\omega L - \dfrac{1}{\omega C}\right)$。两个电抗相等时虚部为零，阻抗最小、等于 $R$，电流最大，这叫**谐振（resonance）**：
            $$f_0 = \frac{1}{2\pi\sqrt{LC}}$$
            谐振时电感上的电压是 $j\omega_0LI$，电容上的电压和它大小相等、方向相反。两者都是电源电压的 $Q$ 倍，$Q = \omega_0L/R$ 叫**品质因数（quality factor）**。
      - item:
          id: series-f0
          type: number
          prompt: 一个 25 μH 的电感和一个 100 pF 的电容组成串联谐振回路。谐振频率是多少兆赫？保留两位小数。
          answer: 3.18
          tolerance: 0.005
          unit: MHz
          hint: $LC$ 是多少？开方后再怎么算？
          explain: $\sqrt{LC} = \sqrt{25\times10^{-6}\times10^{-10}} = 5\times10^{-8}$ s，$f_0 = 1/(2\pi\times5\times10^{-8}) = 3.18$ MHz。
      - card:
          title: 例题：串联回路的 Q 和带宽
          body: 串联回路 $L = 10\ \mu$H，$C = 1$ nF，$R = 5\ \Omega$。求谐振频率、品质因数和 3 dB 带宽。
          reveal:
            - title: 第 1 步：求谐振频率
              body: $f_0 = 1/(2\pi\sqrt{10^{-5}\times10^{-9}}) = 1.59$ MHz。
            - title: 第 2 步：求谐振时的电抗和 Q
              body: $\omega_0L = 1/\sqrt{LC}\times L = \sqrt{L/C} = 100\ \Omega$，$Q = 100/5 = 20$。
            - title: 第 3 步：由 Q 求带宽
              body: 电流降到最大值 $1/\sqrt2$ 的两个频率之差是 $f_0/Q = 1.59\ \text{MHz}/20 = 79.6$ kHz。Q 越大，带宽越窄，选频越尖锐。
      - card:
          title: 并联谐振
          body: |
            电感、电容并联，再并一个电阻 $R$（代表回路的损耗和负载），用电流源驱动。谐振时电感和电容的电流大小相等、方向相反，互相抵消，回路两端的阻抗最大、等于 $R$，叫谐振电阻。这时
            $$Q = \frac{R}{\omega_0L} = \omega_0CR,\qquad \text{3 dB 带宽} = \frac{f_0}{Q}$$
            注意并联回路的 Q 是电阻除以电抗，和串联的正好相反：并联电阻越大，Q 越高。
      - item:
          id: parallel-q
          type: number
          prompt: 并联谐振回路 $L = 4\ \mu$H，$C = 100$ pF，谐振电阻 25 kΩ。品质因数是多少？
          answer: 125
          tolerance: 0.001
          hint: 先求谐振时电感的电抗，它等于 $\sqrt{L/C}$ 吗？
          explain: $\omega_0L = \sqrt{L/C} = \sqrt{4\times10^{-6}/10^{-10}} = 200\ \Omega$，$Q = 25\ \text{k}\Omega/200\ \Omega = 125$。
      - item:
          id: parallel-bw
          type: number
          prompt: 并联谐振回路的谐振频率 7.96 MHz，品质因数 125。3 dB 带宽是多少千赫？保留一位小数。
          answer: 63.7
          tolerance: 0.05
          unit: kHz
          hint: 带宽和谐振频率、品质因数是什么关系？
          explain: $7.96\ \text{MHz}/125 = 63.7$ kHz。中波电台之间的频率间隔是 9 kHz（国内）或 10 kHz（美洲），这个回路的带宽太宽，选不开相邻电台，实际中波收音机靠中频滤波器来选台。
      - card:
          title: 串联和并联可以互换
          body: |
            实际的电感有一点串联电阻 $r$。它在谐振频率附近可以换成一个并联电阻：
            $$R_p = r(1 + Q^2) \approx Q^2r\quad(Q \gg 1),\qquad Q = \frac{\omega L}{r}$$
            这样整个回路就变成理想 $L$、$C$ 和一个并联电阻，前面的并联公式都能用。Q 越高，换算后的并联电阻越大。
      - item:
          id: series-to-parallel
          type: number
          prompt: 一个 2 μH 的电感在 10 MHz 时串联电阻 2 Ω。换算成并联电阻约是多少千欧？保留一位小数。
          answer: 7.9
          tolerance: 0.05
          unit: kΩ
          hint: 这个电感在 10 MHz 的 Q 是多少？
          explain: $Q = \omega L/r = 125.7/2 = 62.8$，$R_p = r(1 + Q^2) = 2\times(1 + 3948) \approx 7.9$ kΩ。2 Ω 的串联损耗相当于 7.9 kΩ 并在回路两端。
      - item:
          id: q-meaning
          type: choice
          prompt: 两个并联谐振回路谐振频率相同，A 的 Q 是 20，B 的 Q 是 100。哪个说法对？
          options:
            - text: B 的带宽更窄
              correct: true
            - text: B 的谐振频率更高
              why: 谐振频率只由 $L$、$C$ 决定；Q 决定的是谐振峰有多尖、带宽多窄
            - text: A 的谐振电阻更大
              why: 并联回路 $Q = R/(\omega_0L)$，电抗相同时 Q 越大谐振电阻越大，B 更大
          explain: 带宽是 $f_0/Q$，Q 大五倍，带宽小五倍。并联回路的 Q 高，说明损耗小、谐振电阻大。
  - id: loaded-q-tapping
    chapter: 谐振回路与阻抗变换
    title: 负载对回路的影响和部分接入
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个并联谐振回路自身的 Q 是 125，谐振电阻 25 kΩ。在它两端直接并上一个 1 kΩ 的负载电阻，回路的选频能力会怎样？
          options:
            - text: 大大变差
              correct: true
            - text: 不变，Q 只由电感和电容决定
              why: 并联回路的 Q 是“两端总电阻除以电抗”，负载电阻并上去，总电阻变小，Q 跟着变小
            - text: 变好，负载帮回路吸收了噪声
              why: 负载电阻消耗能量，相当于回路损耗变大，谐振峰变平，选频变差
          explain: 1 kΩ 并上 25 kΩ 后总电阻约 0.96 kΩ，这个回路 $\omega_0L = 200\ \Omega$，Q 从 125 掉到不到 5。负载、信号源内阻都会这样拖累回路，这一课讲怎样减轻它。
      - card:
          title: 有载品质因数
          body: |
            回路两端实际并联着三个电阻：回路自身的谐振电阻 $R_p$、信号源（或前级晶体管）的输出电阻 $R_s$、负载 $R_L$。决定选频的是它们的并联值 $R_\Sigma$：
            $$Q_L = \frac{R_\Sigma}{\omega_0L},\qquad R_\Sigma = R_p\parallel R_s\parallel R_L$$
            $Q_L$ 叫**有载品质因数（loaded Q）**，它总比回路自身的 Q 小，带宽 $f_0/Q_L$ 也就更宽。
      - item:
          id: loaded-q
          type: number
          prompt: 并联回路的 $\omega_0L = 200\ \Omega$，谐振电阻 25 kΩ，两端直接并上一个 5 kΩ 的负载（信号源用理想电流源）。有载品质因数是多少？保留一位小数。
          answer: 20.8
          tolerance: 0.05
          hint: 两端的总电阻是多少？
          explain: $R_\Sigma = 25\parallel5 = 4.17$ kΩ，$Q_L = 4167/200 = 20.8$。回路自身 Q 是 125，负载让它降到约六分之一，带宽宽了六倍。
      - card:
          title: 部分接入
          body: |
            不把负载接在回路两端，而只接在其中一部分上：接在电感的抽头上，或接在两个串联电容中的一个上。设负载两端的电压是回路两端电压的 $p$ 倍，$p$ 叫**接入系数（tapping factor）**。负载消耗的功率不变，从回路两端看，它相当于一个
            $$R_L' = \frac{R_L}{p^2}$$
            的电阻。$p = 0.2$ 时，负载被放大 25 倍再并到回路上，对 Q 的影响小得多。
      - card:
          title: 例题：用抽头接负载
          body: 并联回路 $\omega_0L = 200\ \Omega$，谐振电阻 25 kΩ。1 kΩ 的负载接在电感的抽头上，抽头以下的匝数是总匝数的 0.2（紧耦合时 $p$ 就是匝数比）。求有载 Q。
          reveal:
            - title: 第 1 步：把负载折算到回路两端
              body: $R_L' = 1\ \text{k}\Omega/0.2^2 = 25$ kΩ。
            - title: 第 2 步：求两端的总电阻
              body: $25\parallel25 = 12.5$ kΩ。
            - title: 第 3 步：求有载 Q
              body: $Q_L = 12500/200 = 62.5$。直接接在两端时 Q 只有 4.8，抽头接入让它回到 60 多。
      - item:
          id: cap-divider
          type: number
          prompt: 回路电容由 $C_1 = 100$ pF 和 $C_2 = 400$ pF 串联组成，2 kΩ 的负载并在 $C_2$ 两端，接入系数 $p = C_1/(C_1 + C_2)$。负载折算到回路两端相当于多少千欧？
          answer: 50
          tolerance: 0.001
          unit: kΩ
          hint: 接入系数是多少？折算时要除以它的几次方？
          explain: $p = 100/500 = 0.2$，$R_L' = 2/0.2^2 = 50$ kΩ。$C_2$ 大，上面分到的电压小，负载就接得“轻”。
      - item:
          id: max-tap
          type: number
          prompt: 并联回路 $\omega_0L = 200\ \Omega$，谐振电阻 25 kΩ，要求有载 Q 不低于 50。一个 1 kΩ 的负载通过抽头接入，接入系数最大是多少？保留两位小数。
          answer: 0.24
          tolerance: 0.005
          hint: 有载 Q 不低于 50，两端总电阻至少要多大？负载折算后至少要多大？
          explain: 总电阻至少 $50\times200 = 10$ kΩ，所以 $R_L'$ 至少满足 $1/R_L' \le 1/10 - 1/25$，$R_L' \ge 16.7$ kΩ；$p \le \sqrt{1/16.7} = 0.245$，取 0.24。
      - card:
          title: 部分接入的代价
          body: |
            负载上分到的电压是回路电压的 $p$ 倍。$p$ 取得太小，负载拿到的功率也跟着变小：用电流源驱动时，折算后的负载 $R_L/p^2$ 等于回路谐振电阻时负载功率最大，可这时有载 Q 只有回路自身的一半。所以 $p$ 要在负载功率和选择性之间折中。部分接入既用在负载一侧，也用在信号源一侧，比如晶体管的输出电阻不大，就让它接在电感的抽头上，免得把回路的 Q 拉低。
      - item:
          id: why-tap
          type: choice
          prompt: 调谐放大器的负载只有 1 kΩ，设计者把它接在回路电感的抽头上，而不是回路两端。主要目的是什么？
          options:
            - text: 减小负载对回路 Q 的拖累
              correct: true
            - text: 让负载上的电压比回路两端更高
              why: 抽头以下只是回路的一部分，负载上的电压是回路电压的 $p$ 倍，$p < 1$，电压反而更低
            - text: 改变回路的谐振频率
              why: 谐振频率由总电感和总电容决定；接入方式主要改变的是负载等效到回路上的电阻
          explain: 负载接在抽头上，折算到回路两端是 $R_L/p^2$，比直接并上去大得多，回路的有载 Q 就能保持在需要的水平，选择性不至于变差。
      - item:
          id: source-loading
          type: choice
          prompt: 同一个并联谐振回路，用一个输出电阻 10 kΩ 的晶体管驱动，和用理想电流源驱动相比，带宽会怎样？
          options:
            - text: 带宽变宽
              correct: true
            - text: 不变，驱动的一侧不影响回路
              why: 信号源的输出电阻和负载一样并在回路上，总电阻变小，有载 Q 下降
            - text: 变窄，因为晶体管放大了信号
              why: 放大倍数不改变回路的总电阻；输出电阻是有限的，它让总电阻变小、Q 下降、带宽变宽
          explain: 理想电流源的内阻无穷大，不拖累回路；实际晶体管的输出电阻有限，和谐振电阻、负载一起并联，有载 Q 下降，带宽变宽。
  - id: impedance-matching
    chapter: 谐振回路与阻抗变换
    title: 阻抗匹配
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个内阻 50 Ω 的信号源接负载电阻。负载电阻取多大时，负载上得到的功率最大？
          options:
            - text: 等于 50 Ω
              correct: true
            - text: 越大越好，电压越高功率越大
              why: 负载很大时电压接近源电压，可电流趋近于零，功率 $V^2/R$ 也趋近于零
            - text: 越小越好，电流越大功率越大
              why: 负载很小时电流大，可负载上的电压趋近于零，功率同样趋近于零
          explain: 负载太大电流小，太小电压低，两者之间有一个最好的值：负载电阻等于信号源内阻。这叫最大功率传输。
      - card:
          title: 最大功率传输和共轭匹配
          body: |
            有效值 $V_s$、内阻 $R_s$ 的信号源接负载 $R_L$，负载功率 $P = V_s^2R_L/(R_s + R_L)^2$，在 $R_L = R_s$ 时最大，为 $V_s^2/(4R_s)$。信号源内阻抗和负载都含电抗时，条件变成负载阻抗等于源阻抗的共轭：$Z_L = Z_s^*$，电抗互相抵消、电阻相等，叫**共轭匹配（conjugate matching）**。

            天线、电缆、放大器的输入输出往往不是 50 Ω，就要在中间加一个由电感、电容组成的**匹配网络（matching network）**，把阻抗变过去。
      - item:
          id: mismatch-power
          type: number
          prompt: 有效值 1 V、内阻 50 Ω 的信号源直接接一个 200 Ω 的负载。负载上的功率是多少毫瓦？保留一位小数。
          answer: 3.2
          tolerance: 0.05
          unit: mW
          hint: 电流是多少？
          explain: $I = 1/(50 + 200) = 4$ mA，$P = I^2R_L = 3.2$ mW。匹配时（负载 50 Ω）是 $1/(4\times50) = 5$ mW，失配损失了 36%。
      - card:
          title: L 型匹配网络
          body: |
            把大电阻 $R_L$ 变成小电阻 $R_s$，最简单的是 L 型网络：一个电抗元件并在 $R_L$ 两端，一个串在前面。先定
            $$Q = \sqrt{\frac{R_L}{R_s} - 1}$$
            并联元件的电抗取 $X_p = R_L/Q$，串联元件的电抗取 $X_s = QR_s$，两者一个用电感、一个用电容。并联那一支把 $R_L$ 变成“小电阻串一个电抗”，串联元件再把多出来的电抗抵消。阻抗比越大，$Q$ 越大，匹配的带宽越窄。
      - card:
          title: 例题：100 MHz 把 200 Ω 变成 50 Ω
          body: 信号源 50 Ω，负载 200 Ω，频率 100 MHz。用“串联电感、并联电容”的 L 型网络匹配，求元件值。
          reveal:
            - title: 第 1 步：求网络的 Q
              body: $Q = \sqrt{200/50 - 1} = \sqrt3 = 1.73$。
            - title: 第 2 步：求两个电抗
              body: 并联电容 $X_p = 200/1.73 = 115.5\ \Omega$，串联电感 $X_s = 1.73\times50 = 86.6\ \Omega$。
            - title: 第 3 步：换成元件值
              body: $C = 1/(2\pi fX_p) = 13.8$ pF，$L = X_s/(2\pi f) = 138$ nH。代回去算，从信号源看进去正好是 50 Ω。
      - item:
          id: l-match-q
          type: number
          prompt: 用 L 型网络把 450 Ω 的负载匹配到 50 Ω 的信号源。网络的 $Q = \sqrt{R_L/R_s - 1}$ 是多少？保留两位小数。
          answer: 2.83
          tolerance: 0.005
          hint: $R_L/R_s$ 是多少？
          explain: $Q = \sqrt{9 - 1} = 2.83$。串联电抗 $2.83\times50 = 141\ \Omega$，并联电抗 $450/2.83 = 159\ \Omega$。比例更大时 $Q$ 更高，带宽更窄，可以分成两节 L 型逐级变换。
      - card:
          title: 反射系数
          body: |
            信号沿电缆传播时，电缆上电压和电流之比是一个固定值，叫特性阻抗 $Z_0$（常为 50 Ω）。信号传到负载，负载不等于 $Z_0$ 时会有一部分被反射回来。反射电压和入射电压之比叫**反射系数（reflection coefficient）**：
            $$\Gamma = \frac{Z_L - Z_0}{Z_L + Z_0}$$
            反射回去的功率占入射功率的 $|\Gamma|^2$。匹配时 $\Gamma = 0$；开路时 $\Gamma = 1$，短路时 $\Gamma = -1$，全部反射。
      - item:
          id: reflected-power
          type: number
          prompt: 50 Ω 的电缆接一个 100 Ω 的电阻负载。反射回去的功率占入射功率的百分之几？保留一位小数。
          answer: 11.1
          tolerance: 0.05
          unit: '%'
          hint: 反射系数是多少？反射功率和它是什么关系？
          explain: $\Gamma = (100 - 50)/(100 + 50) = 1/3$，$|\Gamma|^2 = 1/9 = 11.1\%$。负载 25 Ω 时 $\Gamma = -1/3$，反射功率也是 11.1%。
      - card:
          title: 史密斯圆图
          body: |
            把每个负载阻抗对应的 $\Gamma$ 画在复平面上，所有无源负载都落在半径为 1 的圆里。再把“电阻相同”“电抗相同”的点连成曲线，就得到**史密斯圆图（Smith chart）**：圆心是匹配点（$Z = Z_0$），最右端是开路，最左端是短路；上半圆是感性，下半圆是容性。串一个电抗，点沿等电阻圆走；并一个电抗，点沿等电导圆（电导是电阻的倒数）走。设计匹配网络就是在图上把负载点一步步走到圆心。
      - item:
          id: smith-center
          type: choice
          prompt: 在以 50 Ω 为参考的史密斯圆图上，一个负载正好落在圆心。它是什么负载？
          options:
            - text: 50 Ω 的纯电阻
              correct: true
            - text: 短路，因为圆心是零点
              why: 圆心对应 $\Gamma = 0$，不是 $Z = 0$；短路的 $\Gamma = -1$，在圆的最左端
            - text: 开路，阻抗无穷大
              why: 开路的 $\Gamma = 1$，在圆的最右端；圆心是阻抗等于参考阻抗的点
          explain: 史密斯圆图画的是反射系数，圆心 $\Gamma = 0$ 就是 $Z_L = Z_0$，没有反射。匹配网络的目标就是把负载点移到这里。
      - item:
          id: match-loss
          type: choice
          prompt: L 型匹配网络里的电感 Q 只有 20（有串联电阻）。和理想电感相比，会发生什么？
          options:
            - text: 负载拿到的功率变少
              correct: true
            - text: 匹配更好，因为电阻帮助吸收了反射
              why: 电感的电阻在网络内部消耗功率，这部分功率到不了负载；它也会让变换后的阻抗偏离设计值
            - text: 没有区别，匹配只看电抗
              why: 实际元件的损耗是匹配网络的主要缺点之一，在芯片上电感 Q 低时损耗尤其明显
          explain: 匹配网络本应只“转换”阻抗，不消耗功率；元件有电阻时会吃掉一部分功率。网络的 $Q$ 越高（阻抗比越大），流过元件的电流越大，损耗越明显。
  - id: tuned-amplifier
    chapter: 小信号调谐放大器
    title: 单回路调谐放大器和多级调谐
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 接收机天线后面的放大器，负载不用普通电阻，而用一个并联谐振回路。这样做最主要的好处是什么？
          options:
            - text: 放大和选频一起完成
              correct: true
            - text: 谐振回路不耗电，放大器就不需要电源了
              why: 放大器的能量来自直流电源；谐振回路只是一个随频率变化的负载，决定在哪些频率上增益大
            - text: 所有频率都能放大得更多
              why: 只有谐振频率附近回路的阻抗大、增益大；离谐振越远，回路阻抗越小，增益越小
          explain: 并联回路在谐振频率上阻抗最大，放大器在那里增益最高；偏离谐振，阻抗迅速变小，增益也跟着下降。放大和选频一次完成。
      - card:
          title: 单回路调谐放大器
          body: |
            晶体管的集电极（或漏极）接一个并联谐振回路，回路两端的总电阻是 $R_\Sigma$（谐振电阻、晶体管输出电阻、折算过来的负载并联），这叫单回路调谐放大器，简称**调谐放大器（tuned amplifier）**。谐振时增益 $A_0 = g_mR_\Sigma$（不计符号），偏离谐振 $\Delta f$ 时
            $$A = \frac{A_0}{1 + j\,2Q_L\dfrac{\Delta f}{f_0}}$$
            $Q_L$ 是有载品质因数，3 dB 带宽是 $f_0/Q_L$。
      - item:
          id: tuned-gain
          type: number
          prompt: 调谐放大器的晶体管跨导 20 mS，回路两端总电阻 4 kΩ。谐振时的电压增益是多少（取绝对值）？
          answer: 80
          tolerance: 0.001
          hint: 谐振时回路是什么样的负载？
          explain: 谐振时电感、电容的电流互相抵消，回路只剩电阻 $R_\Sigma$，$A_0 = g_mR_\Sigma = 0.02\times4000 = 80$。
      - card:
          title: 增益和带宽的矛盾
          body: |
            回路电容 $C_\Sigma$ 一定时，$R_\Sigma = Q_L/(\omega_0C_\Sigma)$。增益 $A_0 = g_mR_\Sigma$ 和 $Q_L$ 成正比，带宽 $f_0/Q_L$ 和 $Q_L$ 成反比，两者相乘：
            $$A_0\cdot\text{BW} = \frac{g_m}{2\pi C_\Sigma}$$
            和 $Q_L$ 无关。想要更大的增益，带宽就得更窄；想要更宽的带宽，增益就得降下来。这个乘积叫增益带宽积，只能靠更大的跨导或更小的电容提高。
      - item:
          id: tuned-gbw
          type: number
          prompt: 调谐放大器跨导 20 mS，回路总电容 200 pF。把有载 Q 调到使谐振增益为 40，3 dB 带宽是多少千赫？保留到个位。
          answer: 398
          tolerance: 0.5
          unit: kHz
          hint: 增益乘带宽等于什么？
          explain: $A_0\cdot\text{BW} = 0.02/(2\pi\times200\times10^{-12}) = 15.9$ MHz，增益 40 时带宽 $15.9\ \text{MHz}/40 = 398$ kHz。增益要 80，带宽就只剩 199 kHz。
      - card:
          title: 矩形系数
          body: |
            理想的选频特性是矩形：通带内增益一样，通带外立刻为零。衡量离矩形有多远，用**矩形系数（rectangle coefficient）**：增益降到 0.1 倍处的带宽除以 3 dB 带宽，$K_{0.1} = \text{BW}_{0.1}/\text{BW}_{0.7}$，越接近 1 越好。单个谐振回路的 $K_{0.1} = \sqrt{99} \approx 9.95$，离矩形很远，挡相邻信道的能力有限。
      - item:
          id: single-k01
          type: choice
          prompt: 单回路调谐放大器的 3 dB 带宽是 200 kHz。增益降到谐振值十分之一的两个频率相距多远？
          options:
            - text: 约 2 MHz
              correct: true
            - text: 约 400 kHz
              why: 单个谐振回路的增益随频偏下降得很慢，要偏到约 10 倍 3 dB 带宽处才降到 0.1；400 kHz 处增益还有约 0.45
            - text: 正好 200 kHz
              why: 200 kHz 是降到 0.707 倍的宽度；降到 0.1 倍要宽得多
          explain: $K_{0.1} = \sqrt{99} \approx 9.95$，$\text{BW}_{0.1} \approx 9.95\times200\ \text{kHz} \approx 2$ MHz。相邻信道离得近时，单个谐振回路挡不住。
      - card:
          title: 多级同步调谐
          body: |
            把 $n$ 级相同的单回路调谐放大器串起来，都调在同一频率（同步调谐），总增益是 $A_0^n$，总的 3 dB 带宽却变窄：
            $$\text{BW}_n = \text{BW}_1\sqrt{2^{1/n} - 1}$$
            因为每级在单级 3 dB 频率处都降到 0.707，$n$ 级乘起来降得更多。好处是曲线变陡，两级时矩形系数从 9.95 降到约 4.7。
      - card:
          title: 例题：三级同步调谐的带宽
          body: 三级相同的单回路调谐放大器，每级 3 dB 带宽 200 kHz。求总带宽。
          reveal:
            - title: 第 1 步：写出缩小的倍数
              body: $\sqrt{2^{1/3} - 1} = \sqrt{1.26 - 1} = 0.51$。
            - title: 第 2 步：求总带宽
              body: $200\times0.51 = 102$ kHz。
            - title: 第 3 步：反过来设计
              body: 要总带宽 200 kHz，每级就得做到 $200/0.51 \approx 392$ kHz，单级的 Q 要相应降低。
      - item:
          id: two-stage-bw
          type: number
          prompt: 两级相同的单回路调谐放大器同步调谐，每级 3 dB 带宽 300 kHz。总的 3 dB 带宽是多少千赫？保留到个位。
          answer: 193
          tolerance: 0.5
          unit: kHz
          hint: 两级时缩小的倍数是 $\sqrt{2^{1/2} - 1}$，它约等于多少？
          explain: $\sqrt{1.414 - 1} = 0.644$，$300\times0.644 = 193$ kHz。
      - card:
          title: 稳定性和中和
          body: |
            晶体管集电极和基极之间有一个小电容 $C_{\mu}$（MOS 管是 $C_{GD}$），把输出的一部分送回输入。调谐放大器的输入、输出两边都接谐振回路，在某些频率上这条反馈可能变成正反馈，增益曲线畸变，甚至自激振荡。办法有两种：加一个**中和（neutralization）**电容，送回一个大小相等、相位相反的信号抵消它；或者用共射共基（共源共栅）结构，让输出端的电压变化到不了输入管。
      - item:
          id: cascode-stability
          type: choice
          prompt: 高频调谐放大器常用共射共基（共源共栅）结构。它让放大器更稳定的原因是什么？
          options:
            - text: 经 $C_\mu$ 送回输入的信号很小
              correct: true
            - text: 共射共基的增益比单管小得多，所以不会振荡
              why: 共射共基的增益通常更高；稳定是因为它隔开了输出和输入之间经 $C_\mu$ 的反馈通路
            - text: 共基管把 $C_\mu$ 短路掉了
              why: $C_\mu$ 还在，只是它两端的电压变化变小了；输入管集电极的电压几乎不随输出变
          explain: 输出端的电压摆动被挡在上面的共基管，输入管集电极只有很小的变化，经 $C_\mu$ 的反馈大大减小，这叫单向化。
      - card:
          title: 宽带放大器的并联峰化
          body: |
            不需要选频、要的是带宽的放大器（比如光纤接收机），负载是电阻 $R$ 并着节点电容 $C$，带宽 $1/(2\pi RC)$。在 $R$ 上串一个小电感 $L$：高频时电感阻抗变大，补偿了电容让增益下降的那一部分，带宽被拉宽，这叫**并联峰化（shunt peaking）**。取 $L = R^2C/2.41$ 时响应最平坦，带宽扩大约 1.72 倍；电感再大，带宽还能更宽，但通带里会冒出一个峰。
      - item:
          id: shunt-peaking
          type: number
          prompt: 宽带放大器负载 1 kΩ，节点电容 0.5 pF。加上响应最平坦的并联峰化电感（带宽扩大约 1.72 倍）后，3 dB 带宽约是多少兆赫？保留到个位。
          answer: 548
          tolerance: 3
          unit: MHz
          hint: 不加电感时带宽是多少？
          explain: 不加电感时 $1/(2\pi\times10^3\times0.5\times10^{-12}) = 318$ MHz，乘 1.72 约 548 MHz。所需电感 $L = R^2C/2.41 = 207$ nH。
  - id: rf-noise
    chapter: 小信号调谐放大器
    title: 噪声系数和灵敏度
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 接收机里串着三级放大，每级都会加进一点噪声。哪一级的噪声对整台接收机能收多弱的信号影响最大？
          options:
            - text: 第一级
              correct: true
            - text: 最后一级，因为它离输出最近
              why: 后级的噪声只经过后面很少的放大；折算回输入端时要除以前面各级的增益，前级增益大时它的影响很小
            - text: 三级一样重要
              why: 前级把信号和自己的噪声一起放大，后级加进的噪声相对已被放大的信号就小了
          explain: 信号最弱的地方是第一级的输入。第一级加进的噪声和信号一样大小地被后面放大，后面各级加进的噪声相对已经放大过的信号就不那么要紧了。
      - card:
          title: 热噪声的功率
          body: |
            电阻里电子的热运动产生随机电压，叫**热噪声（thermal noise）**。一个电阻能送给匹配负载的噪声功率是 $kTB$：$k$ 是玻尔兹曼常数，$T$ 是绝对温度，$B$ 是带宽，和电阻的大小无关。射频里取标准温度 290 K，$kT$ 对应 −174 dBm/Hz：带宽每扩大 10 倍，噪声功率加 10 dB。
      - item:
          id: noise-floor
          type: number
          prompt: 在 290 K 下，热噪声的功率谱密度是 −174 dBm/Hz。1 MHz 带宽里的噪声功率是多少 dBm？
          answer: -114
          tolerance: 0.001
          unit: dBm
          hint: 1 MHz 比 1 Hz 大多少分贝？
          explain: $10\lg10^6 = 60$ dB，$-174 + 60 = -114$ dBm。要接收的信号必须比这个噪声大出一截，才能被正确解调。
      - card:
          title: 噪声系数
          body: |
            一级电路的输入端接一个 290 K 的信号源。这级电路自己会加进噪声，所以输出的信噪比比输入差。两者之比叫**噪声系数（noise factor）**：
            $$F = \frac{\text{SNR}_\text{in}}{\text{SNR}_\text{out}},\qquad \text{NF} = 10\lg F\ \text{dB}$$
            理想的无噪声电路 $F = 1$（0 dB）。也常用等效噪声温度 $T_e = (F - 1)\times290$ K 表示，$F = 2$（约 3 dB）相当于 290 K。一个损耗 $L$ 倍的无源器件（电缆、滤波器）在室温下噪声系数就是 $L$。
      - item:
          id: snr-out
          type: number
          prompt: 一个放大器的噪声系数 4 dB，输入信噪比 30 dB。输出信噪比是多少分贝？
          answer: 26
          tolerance: 0.001
          unit: dB
          hint: 用分贝表示时，噪声系数是两个信噪比的什么？
          explain: $\text{NF} = \text{SNR}_\text{in} - \text{SNR}_\text{out}$（都用 dB），所以输出信噪比 $30 - 4 = 26$ dB。
      - card:
          title: 级联的噪声系数
          body: |
            几级串联时，总噪声系数由 Friis 公式给出：
            $$F = F_1 + \frac{F_2 - 1}{G_1} + \frac{F_3 - 1}{G_1G_2} + \cdots$$
            $G$ 是各级的功率增益（倍数，不是 dB），$F$ 也用倍数。后级的贡献要除以前面各级的增益：第一级增益够大，后级的噪声几乎不影响总噪声系数。所以接收机第一级要用噪声系数小、增益足够的低噪声放大器（LNA）。
      - card:
          title: 例题：低噪声放大器加混频器
          body: 低噪声放大器噪声系数 2 dB、增益 15 dB，后面的混频器噪声系数 10 dB。求总噪声系数。
          reveal:
            - title: 第 1 步：把 dB 换成倍数
              body: $F_1 = 10^{0.2} = 1.585$，$G_1 = 10^{1.5} = 31.6$，$F_2 = 10$。
            - title: 第 2 步：代入 Friis 公式
              body: $F = 1.585 + (10 - 1)/31.6 = 1.585 + 0.285 = 1.870$。
            - title: 第 3 步：换回 dB
              body: $\text{NF} = 10\lg1.870 = 2.72$ dB。混频器的 10 dB 只让总噪声系数多了 0.7 dB。
      - item:
          id: friis
          type: number
          prompt: 低噪声放大器噪声系数 $F_1 = 2$、功率增益 100 倍，后面的混频器噪声系数 $F_2 = 11$。总噪声系数是多少分贝？保留两位小数。
          answer: 3.22
          tolerance: 0.005
          unit: dB
          hint: 混频器的贡献要除以什么？
          explain: $F = 2 + (11 - 1)/100 = 2.1$，$10\lg2.1 = 3.22$ dB。如果低噪声放大器增益只有 10 倍，总噪声系数就变成 $2 + 1 = 3$（4.8 dB）。
      - item:
          id: cable-first
          type: choice
          prompt: 天线到接收机之间有一段损耗 2 dB 的电缆，后面接噪声系数 2 dB 的低噪声放大器。和把低噪声放大器直接装在天线上相比，总噪声系数会怎样？
          options:
            - text: 变差约 2 dB
              correct: true
            - text: 不变，电缆是无源的，不产生噪声
              why: 室温下有损耗的无源器件噪声系数等于它的损耗；放在第一级时，它的 2 dB 全部算进总噪声系数
            - text: 只差零点几分贝，因为后面有低噪声放大器的增益
              why: 后级增益只能压低更后面的噪声；电缆在低噪声放大器前面，它的损耗没有被任何增益“除掉”
          explain: 电缆 $F_1 = 1.585$、$G_1 = 1/1.585$，总 $F = 1.585 + (1.585 - 1)\times1.585 = 2.51$，即 4 dB，比 2 dB 差了 2 dB。所以低噪声放大器常装在天线旁边。
      - card:
          title: 灵敏度
          body: |
            接收机能正确解调的最弱输入功率叫**灵敏度（sensitivity）**。输入端的噪声是 $kTB$，再加上接收机的噪声系数，信号还要比它高出解调所需的最小信噪比：
            $$P_\text{min} = -174\ \text{dBm/Hz} + \text{NF} + 10\lg B + \text{SNR}_\text{min}$$
            所以想收得更远，可以降低噪声系数、减小带宽，或者用要求信噪比更低的调制方式。
      - item:
          id: sensitivity
          type: number
          prompt: 一台接收机噪声系数 6 dB，信道带宽 200 kHz，解调需要的最小信噪比 10 dB。灵敏度是多少 dBm？保留一位小数。
          answer: -105.0
          tolerance: 0.05
          unit: dBm
          hint: $10\lg B$ 里的 $B$ 用赫兹代入，算出来是多少？
          explain: $10\lg(2\times10^5) = 53.0$，$P_\text{min} = -174 + 6 + 53.0 + 10 = -105.0$ dBm。噪声系数每降 1 dB，灵敏度就好 1 dB。
  - id: nonlinearity
    chapter: 小信号调谐放大器
    title: 非线性：压缩和互调
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个放大器同时输入 100.0 MHz 和 100.2 MHz 两个很强的信号。放大器略有非线性，输出里会多出哪种最难对付的成分？
          options:
            - text: 紧挨着原信号的新频率，滤不掉
              correct: true
            - text: 200 MHz、300 MHz 这样的谐波，它们最强、最难滤
              why: 谐波离原信号很远，用一个滤波器就能挡掉；麻烦的是离原信号很近、落在同一频段里的新频率
            - text: 不会多出任何频率，只是增益变小一点
              why: 非线性一定会产生新的频率；增益变小（压缩）也是非线性的后果之一，但同时会冒出新频率
          explain: 两个频率经过三次方的非线性会产生 $2f_1 - f_2$ 和 $2f_2 - f_1$，正好落在原信号旁边，可能盖住要接收的弱信号，这叫三阶互调。
      - card:
          title: 用多项式描述非线性
          body: |
            在工作点附近把放大器的输出写成输入的多项式：$y = a_1x + a_2x^2 + a_3x^3$。输入一个正弦 $A\cos\omega t$，$x^2$ 项产生直流和 $2\omega$，$x^3$ 项产生 $3\omega$，还给基波加上一项 $\tfrac34a_3A^3$。所以基波的增益变成
            $$a_1 + \tfrac34a_3A^2$$
            多数放大器 $a_3$ 和 $a_1$ 反号，信号越大增益越小，这叫增益压缩。增益比小信号时低 1 dB 的输入幅度叫 **1 dB 压缩点（1-dB compression point）**，只保留 $a_1$、$a_3$ 两项时 $A_\text{1dB} \approx \sqrt{0.145\,|a_1/a_3|}$。
      - item:
          id: p1db
          type: number
          prompt: 一个放大器 $y = 10x - x^3$（$x$、$y$ 的单位是伏）。按 $A_\text{1dB} \approx \sqrt{0.145\,|a_1/a_3|}$，1 dB 压缩点的输入幅度约是多少伏？保留两位小数。
          answer: 1.2
          tolerance: 0.005
          unit: V
          hint: $a_1$ 和 $a_3$ 各是多少？
          explain: $\sqrt{0.145\times10/1} = 1.20$ V。代回去：$10 - 0.75\times1.2^2 = 8.92$，比 10 小约 1 dB。
      - card:
          title: 三阶互调和截点
          body: |
            输入两个等幅正弦（频率 $\omega_1$、$\omega_2$，幅度 $A$），$x^3$ 项会产生 $2\omega_1 - \omega_2$ 和 $2\omega_2 - \omega_1$，幅度 $\tfrac34|a_3|A^3$，叫**三阶互调（third-order intermodulation）**。基波随 $A$ 一次方增长，互调随三次方增长：输入每加 1 dB，互调加 3 dB。把两条直线延长，交点处的输入功率叫**三阶输入截点（IIP3）**。它比 1 dB 压缩点高约 9.6 dB，越高说明越线性。
      - item:
          id: im3-freq
          type: number
          prompt: 两个干扰信号在 100.0 MHz 和 100.2 MHz。三阶互调 $2f_1 - f_2$（$f_1 = 100.0$ MHz）落在多少兆赫？保留一位小数。
          answer: 99.8
          tolerance: 0.05
          unit: MHz
          hint: $2f_1$ 是多少？
          explain: $2\times100.0 - 100.2 = 99.8$ MHz，另一个是 $2\times100.2 - 100.0 = 100.4$ MHz。如果要接收的信号正好在 99.8 MHz，两个干扰就能把它淹没。
      - card:
          title: 例题：由双音测试求 IIP3
          body: 两个干扰各 −30 dBm 输入，输出端基波 −10 dBm，三阶互调 −70 dBm。求 IIP3。
          reveal:
            - title: 第 1 步：求基波和互调差多少
              body: $-10 - (-70) = 60$ dB。
            - title: 第 2 步：用斜率关系往上推
              body: 输入每加 1 dB，差距缩小 2 dB（基波加 1、互调加 3）。差距缩到零要再加 $60/2 = 30$ dB。
            - title: 第 3 步：得出截点
              body: $\text{IIP3} = -30 + 30 = 0$ dBm。一般式：$\text{IIP3} = P_\text{in} + \Delta P/2$。
      - item:
          id: iip3-measure
          type: number
          prompt: 双音测试，每个输入音 −35 dBm，输出端基波 −20 dBm，三阶互调 −70 dBm。IIP3 是多少 dBm？
          answer: -10
          tolerance: 0.001
          unit: dBm
          hint: 基波和互调差多少分贝？差距每次缩小多少？
          explain: $\Delta P = -20 - (-70) = 50$ dB，$\text{IIP3} = -35 + 50/2 = -10$ dBm。
      - card:
          title: 级联的 IIP3
          body: |
            几级串联时（功率都用毫瓦）：
            $$\frac{1}{\text{IIP3}} \approx \frac{1}{\text{IIP3}_1} + \frac{G_1}{\text{IIP3}_2} + \frac{G_1G_2}{\text{IIP3}_3} + \cdots$$
            和噪声正好相反：后级的非线性要乘上前面各级的增益，前级增益越大，后级越容易被大信号压垮。所以接收机前端的增益不能一味加大，要在噪声和线性度之间折中。
      - item:
          id: cascade-iip3
          type: number
          prompt: 低噪声放大器 IIP3 = 0 dBm（1 mW）、功率增益 15 dB（约 31.6 倍），后面混频器的 IIP3 = +5 dBm（约 3.16 mW）。总的 IIP3 是多少 dBm？保留一位小数。
          answer: -10.4
          tolerance: 0.05
          unit: dBm
          hint: 混频器那一项要乘什么？
          explain: $1/\text{IIP3} = 1/1 + 31.6/3.16 = 11$，$\text{IIP3} = 0.091$ mW $= -10.4$ dBm。混频器本身比低噪声放大器线性，可乘上前级增益后它反而成了瓶颈。
      - card:
          title: 动态范围
          body: |
            接收机能处理的信号有下限（被噪声淹没）也有上限（被非线性压垮）。常用的**无杂散动态范围（SFDR）**：输入从刚好看得见、到三阶互调刚好冒出噪声底，
            $$\text{SFDR} = \tfrac23(\text{IIP3} - P_\text{n}) - \text{SNR}_\text{min}$$
            $P_\text{n} = -174 + \text{NF} + 10\lg B$ 是输入端的噪声功率（dBm）。噪声系数小、IIP3 高，动态范围才大。
      - item:
          id: sfdr
          type: number
          prompt: 一台接收机 IIP3 = −10 dBm，噪声系数 6 dB，带宽 200 kHz，最小信噪比 10 dB。按 $\text{SFDR} = \tfrac23(\text{IIP3} - P_\text{n}) - \text{SNR}_\text{min}$，无杂散动态范围约是多少分贝？保留到个位。
          answer: 60
          tolerance: 0.5
          unit: dB
          hint: 输入端的噪声功率 $P_\text{n}$ 是多少 dBm？
          explain: $P_\text{n} = -174 + 6 + 53.0 = -115.0$ dBm，$\tfrac23\times(-10 + 115) = 70$，减去 10 得 60 dB。
  - id: lna
    chapter: 小信号调谐放大器
    title: 低噪声放大器
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 低噪声放大器前面接着天线和一个按 50 Ω 设计的滤波器。为什么不把它的输入阻抗做得越大越好，而要做成 50 Ω？
          options:
            - text: 让前级按设计工作、不反射
              correct: true
            - text: 输入阻抗越大，噪声一定越大
              why: 噪声和输入阻抗没有这种简单关系；要求 50 Ω 是因为前级（天线、滤波器）按 50 Ω 设计
            - text: 50 Ω 的输入阻抗能让增益最大
              why: 输入匹配是为了不反射、让前级滤波器的特性不变；增益由后面的跨导和负载决定
          explain: 天线和射频滤波器都按 50 Ω 负载设计，接错了，滤波器的通带会变形，还有一部分信号被反射回去。所以低噪声放大器要同时做到噪声小、增益够、输入是 50 Ω。
      - card:
          title: 输入匹配为什么难
          body: |
            MOS 管的栅极看进去几乎是一个电容 $C_{GS}$，实部接近零，不是 50 Ω。最省事的办法是在输入端并一个 50 Ω 电阻，可这个电阻自己有热噪声，而且把信号功率分走一半：仅它一个就让噪声系数至少是 2（3 dB），对低噪声放大器来说太大了。所以要找一种不用真实电阻、却能“看上去”是 50 Ω 的办法。
      - item:
          id: resistor-match-nf
          type: number
          prompt: 低噪声放大器的输入端直接并一个 50 Ω 电阻做匹配，信号源内阻也是 50 Ω。只算这个电阻，噪声系数 $F = 2$，换成分贝是多少？保留一位小数。
          answer: 3.0
          tolerance: 0.05
          unit: dB
          hint: $10\lg2$ 约是多少？
          explain: $10\lg2 = 3.0$ dB。整台接收机的噪声系数常常只允许几分贝，第一级就花掉 3 dB 是不能接受的。
      - card:
          title: 共源级加源极电感
          body: |
            在 MOS 管的源极串一个电感 $L_s$、栅极串一个电感 $L_g$。算输入阻抗：
            $$Z_\text{in} = j\omega(L_g + L_s) + \frac{1}{j\omega C_{GS}} + \frac{g_mL_s}{C_{GS}}$$
            第三项是实数，等于 $\omega_TL_s$，$\omega_T = g_m/C_{GS}$ 是管子的特征角频率。它不是真实电阻，不产生热噪声。选 $L_s$ 让 $\omega_TL_s = 50\ \Omega$，再选 $L_g$ 让前两项在工作频率上谐振抵消，输入就是 50 Ω。
      - card:
          title: 例题：2.4 GHz 的输入匹配
          body: 管子 $f_T = 20$ GHz，$C_{GS} = 200$ fF，工作频率 2.4 GHz。求 $L_s$ 和 $L_g$。
          reveal:
            - title: 第 1 步：用实部定源极电感
              body: $L_s = 50/(2\pi\times20\times10^9) = 0.40$ nH。
            - title: 第 2 步：用谐振定总电感
              body: $L_g + L_s = 1/(\omega_0^2C_{GS}) = 1/[(2\pi\times2.4\times10^9)^2\times200\times10^{-15}] = 22.0$ nH。
            - title: 第 3 步：得出栅极电感
              body: $L_g = 22.0 - 0.4 = 21.6$ nH。电感这么大，常用片外电感或键合线的一部分来做。
      - item:
          id: degeneration-real
          type: number
          prompt: 共源低噪声放大器的管子 $f_T = 30$ GHz，源极电感 0.5 nH。输入阻抗的实部 $\omega_TL_s$ 是多少欧？保留一位小数。
          answer: 94.2
          tolerance: 0.05
          unit: Ω
          hint: $\omega_T$ 是 $f_T$ 的几倍？
          explain: $\omega_TL_s = 2\pi\times30\times10^9\times0.5\times10^{-9} = 94.2\ \Omega$。要 50 Ω，源极电感应减到约 0.27 nH。
      - item:
          id: degeneration-res
          type: number
          prompt: 共源低噪声放大器 $C_{GS} = 150$ fF，工作频率 5 GHz。为了让输入阻抗的虚部为零，$L_g + L_s$ 应是多少纳亨？保留两位小数。
          answer: 6.75
          tolerance: 0.005
          unit: nH
          hint: 虚部为零时，总电感和 $C_{GS}$ 在哪个频率谐振？
          explain: $L_g + L_s = 1/[(2\pi\times5\times10^9)^2\times150\times10^{-15}] = 6.75$ nH。
      - card:
          title: 共栅和电阻反馈结构
          body: |
            共栅低噪声放大器从源极输入，输入电阻约 $1/g_m$，取 $g_m = 20$ mS 就是 50 Ω，而且在很宽的频带内都匹配。代价是噪声：匹配时噪声系数约为 $1 + \gamma$，$\gamma$ 是 MOS 管沟道热噪声的系数（长沟道约 2/3），约 2.2 dB 以上。

            电阻反馈结构在共源管的漏极和栅极之间接一个电阻，靠负反馈把输入电阻降到 50 Ω，也是宽带的，噪声比加真实的 50 Ω 电阻小。窄带、要最低噪声时，多用源极电感的共源结构。
      - item:
          id: cg-match
          type: number
          prompt: 共栅低噪声放大器要和 50 Ω 的信号源匹配（不计体效应和 $r_o$）。输入管的跨导应是多少毫西？
          answer: 20
          tolerance: 0.001
          unit: mS
          hint: 共栅级的输入电阻约是多少？
          explain: 输入电阻 $1/g_m = 50\ \Omega$，$g_m = 20$ mS。对 MOS 管来说这要相当大的电流，是共栅结构的另一个代价。
      - item:
          id: lna-choose
          type: choice
          prompt: 一台 2.4 GHz 的窄带接收机，要求低噪声放大器的噪声系数尽量低。最常用哪种结构？
          options:
            - text: 共源管加源极电感和栅极电感
              correct: true
            - text: 共源管输入端并一个 50 Ω 电阻
              why: 匹配电阻自己就让噪声系数至少 3 dB，低噪声放大器很少这样做
            - text: 共栅管，因为它最宽带
              why: 共栅结构宽带好，但匹配时噪声系数约 $1 + \gamma$，比源极电感结构高；窄带应用不需要它的宽带
          explain: 源极电感产生的输入电阻实部不来自真实电阻，没有热噪声，再用栅极电感谐振掉 $C_{GS}$，就能在一个窄频带里同时做到 50 Ω 匹配和低噪声。
  - id: pa-classes
    chapter: 高频功率放大器
    title: 功率放大器的指标和分类
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 手机发射时要送给天线约 1 W 的功率。功率放大器 A 的效率是 25%，B 是 60%。从电池看，两者差在哪？
          options:
            - text: A 从电池取 4 W，B 只取约 1.7 W
              correct: true
            - text: 两者从电池取的功率一样，只是 A 发射得少
              why: 两者都输出 1 W；效率低的那个要从电源多取功率，多出来的全变成了管子上的热
            - text: 效率只影响管子发热，不影响电池用多久
              why: 发热的那部分功率也来自电池；效率低，同样的输出要消耗更多电池电量
          explain: 效率是输出功率除以电源供给的直流功率。A 需要 $1/0.25 = 4$ W，B 需要 $1/0.6 = 1.67$ W。功率放大器常是整台发射机最耗电的部分，所以效率是它最重要的指标之一。
      - card:
          title: 功率放大器的指标
          body: |
            功率放大器关心三件事：输出功率、效率和线性度。效率有两种算法：集电极（漏极）效率 $\eta = P_\text{out}/P_\text{DC}$；功率附加效率 $\text{PAE} = (P_\text{out} - P_\text{in})/P_\text{DC}$，扣掉了输入功率，增益不高时更能反映真实情况。线性度决定信号经过它以后失真多少、会不会把能量漏到相邻信道。
      - item:
          id: pae
          type: number
          prompt: 一个功率放大器输入 0.1 W，输出 1 W，从电源取 2.5 W。功率附加效率是百分之几？
          answer: 36
          tolerance: 0.001
          unit: '%'
          hint: 功率附加效率的分子要先扣掉什么？
          explain: $\text{PAE} = (1 - 0.1)/2.5 = 36\%$，而集电极效率是 $1/2.5 = 40\%$。增益只有 10 倍，两者差了 4 个百分点。
      - card:
          title: 按导通角分类
          body: |
            输入一个正弦，晶体管在一个周期里导通的那段相位叫**导通角（conduction angle）**，常用一半的 $\theta$ 表示（导通角是 $2\theta$）。甲类全周期导通（$2\theta = 360°$），乙类导通半个周期（$2\theta = 180°$），甲乙类介于两者之间，**丙类（class C）**导通不到半个周期。导通角越小，管子在一个周期里通电流的时间越短，效率越高：理想的甲类最高 50%，乙类 78.5%，丙类可以接近 100%。
      - item:
          id: why-class-c
          type: choice
          prompt: 丙类功率放大器的效率比甲类高得多。根本原因是什么？
          options:
            - text: 电流和电压同时很大的时候很少
              correct: true
            - text: 丙类放大器的增益更高，同样输入得到更大输出
              why: 丙类的增益反而较低（要较大的输入才能导通）；效率高是因为管子耗散的功率小
            - text: 丙类放大器不需要直流电源
              why: 输出功率仍来自直流电源；丙类只是让管子少消耗一些，更多的直流功率变成输出
          explain: 管子耗散的功率是集电极电流和集电极电压乘积的平均。丙类只在电压最低时导通一小段，乘积小，损耗就小，效率就高。代价是集电极电流是一串脉冲，要靠谐振回路取出基波。
      - card:
          title: 谐振回路取出基波
          body: |
            丙类放大器的集电极电流是一串窄脉冲，含有直流、基波和各次谐波。集电极接一个调谐在基波上的并联谐振回路：对基波，回路是谐振电阻 $R_p$，产生大的基波电压；对谐波，回路的阻抗很小，几乎不产生电压。所以输出仍然是干净的正弦波，回路的 Q 越高，谐波滤得越干净。
      - card:
          title: 最大输出功率
          body: |
            理想情况下，集电极电压的正弦摆幅最大能到电源电压 $V_{CC}$（在 $0$ 到 $2V_{CC}$ 之间摆动），负载电阻 $R_L$ 上的最大输出功率
            $$P_\text{out,max} = \frac{V_{CC}^2}{2R_L}$$
            电源电压低时，要输出大功率就得让管子看到的负载电阻很小：需要的电阻 $R = V_{CC}^2/(2P)$，再用匹配网络把天线的 50 Ω 变成这个值。
      - item:
          id: pmax
          type: number
          prompt: 功率放大器的电源 5 V，负载 50 Ω，集电极电压理想地摆到电源电压。最大输出功率是多少毫瓦？
          answer: 250
          tolerance: 0.001
          unit: mW
          hint: 正弦电压的峰值是 $V_{CC}$，功率是多少？
          explain: $P = V_{CC}^2/(2R_L) = 25/100 = 0.25$ W。要从 5 V 电源得到 1 W，管子看到的负载得降到 12.5 Ω。
      - item:
          id: ropt
          type: number
          prompt: 手机功率放大器的电源 3.6 V，要输出 2 W（集电极电压理想地摆到电源电压）。管子应看到多大的负载电阻？保留两位小数。
          answer: 3.24
          tolerance: 0.005
          unit: Ω
          hint: 输出功率、电源电压和负载电阻是什么关系？反过来求电阻呢？
          explain: $R = 3.6^2/(2\times2) = 3.24\ \Omega$。天线是 50 Ω，匹配网络要把它变成约 3 Ω，阻抗比约 15，损耗和带宽都是设计难点。
  - id: class-c
    chapter: 高频功率放大器
    title: 丙类功放的功率、效率和工作状态
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 丙类功率放大器集电极电流脉冲的峰值不变，把导通角调小。效率和输出功率会怎样变？
          options:
            - text: 效率升高，输出功率下降
              correct: true
            - text: 效率和输出功率都升高
              why: 导通角小，每个周期送出的电流也少了，基波电流随之变小，输出功率下降
            - text: 效率下降，输出功率升高
              why: 导通角越小，管子只在电压最低时导通，损耗越小，效率是升高的
          explain: 导通角越小越省电，可每个周期的电流脉冲也越窄，基波分量越小，输出功率越低。实际设计在效率和功率之间取一个折中。
      - card:
          title: 余弦电流脉冲的分解
          body: |
            半导通角为 $\theta$、峰值为 $i_{C\max}$ 的余弦电流脉冲，按傅里叶级数分解，直流分量和基波幅度都和峰值成正比：
            $$I_{C0} = \alpha_0(\theta)\,i_{C\max},\qquad I_{c1m} = \alpha_1(\theta)\,i_{C\max}$$
            $$\alpha_0 = \frac{\sin\theta - \theta\cos\theta}{\pi(1 - \cos\theta)},\qquad \alpha_1 = \frac{\theta - \sin\theta\cos\theta}{\pi(1 - \cos\theta)}$$
            这两个叫分解系数，教材常列成表。$\theta = 90°$（乙类）时 $\alpha_0 = 1/\pi = 0.318$，$\alpha_1 = 0.5$。
      - item:
          id: alpha1-ratio
          type: number
          prompt: 丙类功放的电流脉冲峰值不变，半导通角从 90° 减到 60°。已知 $\alpha_1(90°) = 0.5$、$\alpha_1(60°) = 0.391$，基波电流变成原来的多少倍？保留两位小数。
          answer: 0.78
          tolerance: 0.005
          hint: 峰值不变时，基波电流和哪个系数成正比？
          explain: $0.391/0.5 = 0.78$。负载不变时输出功率和基波电流的平方成正比，降到约 0.61 倍。
      - card:
          title: 功率和效率
          body: |
            直流功率 $P_\text{DC} = V_{CC}I_{C0}$，输出功率 $P_\text{out} = \tfrac12U_{cm}I_{c1m}$（$U_{cm}$ 是回路上基波电压的幅度）。相除得
            $$\eta = \frac12\,\xi\,g_1(\theta),\qquad \xi = \frac{U_{cm}}{V_{CC}},\quad g_1 = \frac{\alpha_1}{\alpha_0}$$
            $\xi$ 叫电压利用系数，$g_1$ 叫波形系数。$\theta = 90°$ 时 $g_1 = \pi/2$，$\xi = 1$ 就是乙类的 78.5%；$\theta$ 越小，$g_1$ 越大，效率越高。
      - card:
          title: 例题：半导通角 70° 的效率
          body: 丙类功放半导通角 70°，查表 $\alpha_0 = 0.252$、$\alpha_1 = 0.436$，电压利用系数 0.9。求集电极效率。
          reveal:
            - title: 第 1 步：求波形系数
              body: $g_1 = 0.436/0.252 = 1.73$。
            - title: 第 2 步：代入效率公式
              body: $\eta = \tfrac12\times0.9\times1.73 = 0.779$，约 78%。
            - title: 第 3 步：和乙类比较
              body: 同样 $\xi = 0.9$ 的乙类是 $\tfrac12\times0.9\times1.571 = 70.7\%$。导通角减小换来了约 7 个百分点的效率。
      - item:
          id: class-c-eta
          type: number
          prompt: 丙类功放半导通角 60°，$\alpha_0 = 0.218$、$\alpha_1 = 0.391$，电压利用系数取理想的 1。集电极效率是百分之几？保留一位小数。
          answer: 89.7
          tolerance: 0.15
          unit: '%'
          hint: 先求波形系数 $g_1$。
          explain: $g_1 = 0.391/0.218 = 1.79$，$\eta = \tfrac12\times1\times1.79 = 89.7\%$。
      - card:
          title: 欠压、临界、过压
          body: |
            回路的谐振电阻 $R_p$ 从小往大调，基波电压 $U_{cm} = I_{c1m}R_p$ 跟着变大。$U_{cm}$ 还小于 $V_{CC}$ 减去管子的饱和压降时，管子像电流源，叫欠压状态，输出功率和效率都不高；$U_{cm}$ 正好让管子在电流峰值时碰到饱和，叫临界状态，输出功率最大、效率也高；再加大 $R_p$，管子在峰值附近进入饱和，电流脉冲顶部凹下去，叫过压状态，输出功率下降。输出功率、效率随 $R_p$ 的变化叫负载特性。
      - item:
          id: critical-state
          type: choice
          prompt: 设计一个丙类功放，一般让它工作在哪种状态？
          options:
            - text: 临界状态
              correct: true
            - text: 欠压状态，因为管子像理想电流源
              why: 欠压时回路电压没摆起来，输出功率小、效率低，管子耗散的功率反而大
            - text: 深度过压状态，因为效率最高
              why: 弱过压时效率还略有升高，可深度过压时电流脉冲严重凹陷，输出功率明显下降，谐波也多
          explain: 临界状态在输出功率和效率之间最好，所以常作设计点；需要更稳定的输出电压时，也会让它工作在弱过压状态。
      - card:
          title: 大信号下的负载不是共轭匹配
          body: |
            小信号放大器为了最大增益做共轭匹配；功率放大器却受电源电压和管子最大电流的限制，要的是在这两个限制下输出最大功率的负载，大约是 $R_\text{opt} = (V_{CC} - V_\text{sat})^2/(2P_\text{out})$，比共轭匹配的值小得多。实际设计常用负载牵引（load-pull）：在仪器上改变负载阻抗，测出功率和效率的等高线，找到最好的那一点。
      - item:
          id: load-pull-why
          type: choice
          prompt: 为什么功率放大器的负载不按“和管子输出阻抗共轭匹配”来设计？
          options:
            - text: 受电压摆幅和电流上限限制，最佳负载另有其值
              correct: true
            - text: 共轭匹配会让效率变成 100%，管子承受不了
              why: 共轭匹配时，最多一半的功率耗在信号源内阻上，效率不超过 50%；问题在于它不是功放受限条件下的最佳负载
            - text: 功率放大器没有输出阻抗
              why: 管子有输出阻抗；但功放的输出功率主要受电压摆幅和电流上限限制，最佳负载由这两个限制决定
          explain: 共轭匹配求的是小信号下的最大功率传输；大信号下电压摆幅最多到电源电压附近，最佳负载由 $R_\text{opt} \approx V^2/(2P)$ 决定，通常比管子输出电阻小得多。
  - id: pa-efficiency-linearization
    chapter: 高频功率放大器
    title: 开关类功放、回退和线性化
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个开关在“完全导通”和“完全断开”两种状态之间切换。理想情况下，开关自己消耗多少功率？
          options:
            - text: 零
              correct: true
            - text: 一半的输入功率
              why: 开关消耗的功率是它两端电压乘电流；理想开关在任何时刻两者总有一个为零，所以乘积为零
            - text: 和放大器一样，取决于导通角
              why: 导通角影响的是晶体管当放大器用时的损耗；当理想开关用时，电压和电流不同时出现，损耗为零
          explain: 让晶体管当开关用，电压和电流不同时出现，理论上效率可以到 100%。这就是开关类功率放大器的出发点。
      - card:
          title: D、E、F 类
          body: |
            **开关类功率放大器（switching power amplifier）**让管子工作在开关状态，再用谐振网络从方波里取出正弦。D 类用两个管子轮流导通，输出方波电压。E 类只用一个管子，在它两端并一个电容，选好负载网络，让管子在电压降到零的那一刻才导通，避免开关瞬间的损耗。F 类在负载网络里对谐波专门调谐，让集电极电压接近方波、电流接近半个正弦，两者重叠很少。这几类的效率都很高，但输出幅度基本由电源电压决定，放大不了幅度变化的信号。
      - item:
          id: switching-limit
          type: choice
          prompt: 开关类功率放大器效率很高，为什么不能直接用来放大幅度随时间变化的信号？
          options:
            - text: 输出幅度由电源电压决定，跟不上输入幅度
              correct: true
            - text: 开关类放大器的输出频率不对，偏离了输入频率
              why: 输出频率由开关频率和谐振网络决定，可以和输入一样；问题出在幅度信息丢失
            - text: 开关类功放增益太低，放大幅度变化的信号时输出功率不够
              why: 开关类功放的增益和输出功率都可以很大；问题在于输出幅度由电源电压决定，不随输入幅度变
          explain: 开关只传递“什么时候切换”（相位和频率），不传递幅度。恒包络的信号（如调频）可以直接用它放大，幅度变化的信号要配合别的技术，比如包络消除与恢复。
      - card:
          title: 峰均比和功率回退
          body: |
            高频振荡波形的上下轮廓叫**包络（envelope）**。很多数字调制方式（比如手机和无线局域网用的）的包络起伏很大。包络峰值功率和平均功率之比叫**峰均比（peak-to-average power ratio）**。为了让峰值也不被压缩，功率放大器的平均输出要比 1 dB 压缩点低出约一个峰均比，这叫**回退（back-off）**。线性功放回退后效率明显下降：乙类的效率和输出电压幅度成正比，幅度减半（回退 6 dB）效率也减半。
      - item:
          id: backoff-eta
          type: number
          prompt: 理想乙类功放在最大输出时效率 78.5%。输出电压幅度降到最大值的一半（回退 6 dB），效率是百分之几？保留一位小数。
          answer: 39.3
          tolerance: 0.05
          unit: '%'
          hint: 乙类的效率和输出幅度是什么关系？
          explain: 乙类 $\eta = \tfrac{\pi}{4}\xi$，$\xi$ 从 1 降到 0.5，效率从 78.5% 降到 39.3%。峰均比 10 dB 的信号回退更多，平均效率更低。
      - item:
          id: two-tone-papr
          type: number
          prompt: 两个幅度相同、频率相近的正弦叠加，包络在零和两倍单个幅度之间起伏。包络峰值功率和平均功率之比是多少分贝？保留一位小数。
          answer: 3.0
          tolerance: 0.05
          unit: dB
          hint: 每个正弦的平均功率是多少？两个加起来呢？两个正弦同相叠加时幅度是多少？
          explain: 每个正弦幅度 $A$，平均功率 $2\times A^2/2 = A^2$；包络峰值 $2A$ 时功率 $(2A)^2/2 = 2A^2$，比值 2，即 3.0 dB。
      - card:
          title: 线性化
          body: |
            想要效率高又要线性，常用这几种办法。**预失真（predistortion）**：在功放前面先把信号按功放失真的反方向“扭”一下，两次失真抵消，现在多在数字域完成。前馈：取出功放的失真部分，另用一个放大器反相后加回输出抵消。负反馈：把输出的包络或相位和输入比较、修正。**包络消除与恢复（EER）**：把信号拆成恒包络的相位信号和包络信号，相位信号交给高效率的开关类功放，包络信号去调它的电源电压，在输出端重新合成幅度。
      - item:
          id: predistortion
          type: choice
          prompt: 功率放大器在大信号时增益下降（压缩）。数字预失真是怎么补偿的？
          options:
            - text: 按压缩特性预先把大信号多放大一点
              correct: true
            - text: 在功放后面再加一个放大器把输出放大
              why: 后面再放大，失真的形状也一起被放大，压缩依然存在；预失真是在前面先做反向的变形
            - text: 降低输入信号，让功放永远工作在小信号区
              why: 这是回退，能减小失真但效率低；预失真是让功放在更大的输出下仍然线性
          explain: 功放把大信号压小了，预失真就在前面把大信号多放大一点，两者合起来近似线性，功放可以少回退、效率更高。
      - item:
          id: eer-idea
          type: choice
          prompt: 包络消除与恢复（EER）结构里，开关类功放负责放大哪一部分？
          options:
            - text: 恒包络的相位信号
              correct: true
            - text: 包络信号；相位信号直接送到天线
              why: 包络信号是低频的，用来控制电源电压；射频的相位信号才交给开关类功放
            - text: 两部分都交给同一个线性功放
              why: 那样就失去了 EER 的意义；它正是把幅度和相位分开，让射频通路可以用高效率的开关类功放
          explain: 开关类功放的输出幅度由电源电压决定。EER 让电源电压跟着包络变，输出幅度就恢复了，同时射频部分保持高效率。
  - id: oscillator-principles
    chapter: 正弦波振荡器
    title: 振荡的条件和负阻
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个放大器加上正反馈，环路增益在某个频率上正好是 1、相移是 360°。刚通电时电路里只有微弱的噪声，它能自己振荡起来吗？
          options:
            - text: 很难，起振时环路增益要大于 1
              correct: true
            - text: 一定能，环路增益等于 1 就够了
              why: 等于 1 只能维持已有的振荡；开始时信号极小，要环路增益大于 1 才能一圈圈放大起来
            - text: 不能，正反馈电路都不能振荡
              why: 正反馈正是振荡器的原理；问题在于起振时环路增益要大于 1
          explain: 起振要求环路增益大于 1，让噪声里那个频率的成分越绕越大；幅度变大以后放大器开始压缩，环路增益自动降到 1，振荡稳定下来。
      - card:
          title: 起振、平衡和稳幅
          body: |
            反馈型振荡器由放大器、反馈网络和选频网络组成。巴克豪森判据说的是平衡条件：环路增益 $|AF| = 1$，环路相移是 $360°$ 的整数倍。起振条件更强：$|AF| > 1$。幅度长大后，晶体管进入非线性，平均增益下降，直到 $|AF| = 1$，这叫稳幅。LC 振荡器里，谐振回路决定在哪个频率上相移正好满足条件，所以振荡频率接近回路的谐振频率。
      - item:
          id: min-feedback
          type: number
          prompt: 振荡器里放大器的电压增益是 5（同相），反馈网络在振荡频率上没有附加相移。反馈系数至少要多大才能起振？保留一位小数。
          answer: 0.2
          tolerance: 0.001
          hint: 起振要求 $AF$ 和 1 是什么关系？
          explain: 起振要 $AF > 1$，$F > 1/5 = 0.2$。实际取得大一些（比如 0.3），保证温度、器件偏差变化时仍能可靠起振。
      - card:
          title: 负阻的观点
          body: |
            一个并联 LC 回路被激励一下，会以谐振频率振荡，但并联电阻 $R_p$ 不断消耗能量，振幅越来越小。如果在回路两端再并一个“负电阻” $-R$，它向回路送能量，只要 $R \le R_p$，两者合起来的电导（$1/R_p - 1/R$）不大于零，损耗就被抵消，振荡就能维持。放大器加正反馈，从某两端看进去正好可以等效成负阻，这是分析射频振荡器常用的另一种角度。
      - item:
          id: negative-r
          type: number
          prompt: 一个并联 LC 回路的等效并联损耗电阻是 2 kΩ。并在两端的负阻 $-R$，它的大小 $R$ 最大能取多少千欧还能维持振荡？
          answer: 2
          tolerance: 0.001
          unit: kΩ
          hint: 两个并联电导之和要满足什么条件？
          explain: 总电导 $1/R_p - 1/R \le 0$，即 $R \le R_p = 2$ kΩ。负阻越小（负电导越大），起振越有余量。
      - card:
          title: 振荡器的指标
          body: |
            评价一个射频振荡器，主要看：振荡频率和调谐范围，输出幅度或功率，频谱纯度（相位噪声和谐波），频率稳定度，功耗。频率稳定度常写成相对变化 $\Delta f/f_0$，比如“$\pm2\times10^{-6}$”，表示温度、电源、时间变化时频率最多偏离这么多比例；输出端负载变化引起的频率变化叫频率牵引。
      - item:
          id: stability-drift
          type: number
          prompt: 一个 10 MHz 的振荡器，频率稳定度 $\pm2\times10^{-6}$。频率最多偏离多少赫？
          answer: 20
          tolerance: 0.001
          unit: Hz
          hint: 相对变化乘什么得到绝对变化？
          explain: $10^7\times2\times10^{-6} = 20$ Hz。普通 LC 振荡器只能做到 $10^{-3}$ 到 $10^{-4}$，这么高的稳定度要靠石英晶体。
      - card:
          title: 互感耦合振荡器
          body: |
            最早的 LC 振荡器用变压器反馈：集电极接 LC 回路，回路电感旁绕一个反馈线圈接到基极。共射放大器本身反相 180°，变压器的两个线圈按同名端（两个线圈上感应电压同时为正的那两端）的接法再反相 180°，合起来 360°，满足相位条件。线圈接反了，就成了负反馈，电路不会振荡。
      - item:
          id: transformer-polarity
          type: choice
          prompt: 一个互感耦合振荡器装好后不起振，检查发现放大器增益足够。最可能的原因和改法是什么？
          options:
            - text: 反馈线圈的两端接反了，成了负反馈；把它的两根引线对调
              correct: true
            - text: 回路的品质因数太高；在回路两端并一个小电阻
              why: Q 高损耗小，更容易起振；并电阻会加大损耗，让起振更难
            - text: 电源电压太高；降低电源电压
              why: 增益足够时，最常见的问题是相位条件不满足；降电源只会让增益变小
          explain: 共射放大器反相 180°，变压器必须再反相 180° 才是正反馈。对调反馈线圈的两端，就把相位翻了过来。
  - id: three-point
    chapter: 正弦波振荡器
    title: 三点式振荡器
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 晶体管的发射极、基极、集电极分别接到一个由三个电抗元件组成的回路的三个节点上，构成振荡器。下面哪种接法能振荡？
          options:
            - text: 集电极–发射极之间和基极–发射极之间都是电容，集电极–基极之间是电感
              correct: true
            - text: 三个位置都接电容
              why: 三个电容组成的回路没有谐振点，电抗不会在某个频率上抵消，满足不了相位条件
            - text: 集电极–发射极之间是电容，基极–发射极之间是电感，集电极–基极之间是电容
              why: 和发射极相连的两个电抗性质不同，从集电极送回基极的电压相位不对，构成负反馈
          explain: 规律是“射同基反”：和发射极相连的两个电抗同性质，集电极和基极之间的那个电抗性质相反。两个电容加一个电感就是电容三点式。
      - card:
          title: 三点式的组成法则
          body: |
            **三点式振荡器（three-point oscillator）**把晶体管的三个电极接到 LC 回路的三个点上。设集电极–发射极之间的电抗是 $X_{ce}$，基极–发射极之间是 $X_{be}$，集电极–基极之间是 $X_{cb}$，能振荡的条件是：$X_{ce}$ 和 $X_{be}$ 性质相同，$X_{cb}$ 和它们相反，并且三者之和在振荡频率上为零。前者保证反馈电压和输出反相、正好补上共射放大器的反相；后者就是谐振。
      - item:
          id: rule-check
          type: choice
          prompt: 一个三点式振荡器的 $X_{ce}$、$X_{be}$ 都是电感（中间有抽头的线圈），$X_{cb}$ 是电容。它能振荡吗？
          options:
            - text: 能，和发射极相连的两个电抗都是电感，对面是电容
              correct: true
            - text: 不能，三点式必须用两个电容
              why: 法则只要求和发射极相连的两个电抗同性质；都是电感、对面是电容同样满足，就是电感三点式
            - text: 不能，集电极和基极之间也必须是电感
              why: 三个电抗都是电感时加起来不会为零，没有谐振点，满足不了相位条件
          explain: 射同基反：$X_{ce}$、$X_{be}$ 同为电感，$X_{cb}$ 为电容，满足法则，这是电感三点式，也叫哈特莱振荡器。
      - card:
          title: 电容三点式和电感三点式
          body: |
            电容三点式（**考毕兹振荡器（Colpitts oscillator）**）：$C_1$ 接在集电极–发射极之间，$C_2$ 接在基极–发射极之间，电感 $L$ 跨在集电极和基极之间。振荡频率约为
            $$f_0 \approx \frac{1}{2\pi\sqrt{L\,\dfrac{C_1C_2}{C_1 + C_2}}}$$
            反馈系数约为 $C_1/C_2$。它的反馈经电容，对谐波阻抗小，输出波形好。电感三点式（哈特莱）$f_0 \approx 1/(2\pi\sqrt{(L_1 + L_2 + 2M)C})$，$M$ 是两段线圈的互感；调频率方便，但反馈经电感，谐波较多。
      - card:
          title: 例题：考毕兹振荡器的频率
          body: 考毕兹振荡器 $L = 2\ \mu$H，$C_1 = 300$ pF，$C_2 = 600$ pF，不计晶体管的电容。求振荡频率。
          reveal:
            - title: 第 1 步：求两个电容的串联值
              body: $C = 300\times600/(300 + 600) = 200$ pF。
            - title: 第 2 步：代入谐振公式
              body: $f_0 = 1/(2\pi\sqrt{2\times10^{-6}\times200\times10^{-12}}) = 7.96$ MHz。
            - title: 第 3 步：看反馈系数
              body: $F \approx C_1/C_2 = 0.5$，放大器的增益要大于 2 才能起振。
      - item:
          id: colpitts-f
          type: number
          prompt: 考毕兹振荡器 $L = 3\ \mu$H，$C_1 = 470$ pF，$C_2 = 1000$ pF，不计晶体管的电容。振荡频率约是多少兆赫？保留两位小数。
          answer: 5.14
          tolerance: 0.005
          unit: MHz
          hint: 两个电容是串联还是并联地参加谐振？
          explain: $C = 470\times1000/1470 = 320$ pF，$f_0 = 1/(2\pi\sqrt{3\times10^{-6}\times320\times10^{-12}}) = 5.14$ MHz。
      - item:
          id: hartley-f
          type: number
          prompt: 哈特莱振荡器两段线圈 $L_1 = 4\ \mu$H、$L_2 = 1\ \mu$H，互感可以忽略，回路电容 100 pF。振荡频率约是多少兆赫？保留两位小数。
          answer: 7.12
          tolerance: 0.005
          unit: MHz
          hint: 两段线圈串起来的总电感是多少？
          explain: $L = 4 + 1 = 5\ \mu$H，$f_0 = 1/(2\pi\sqrt{5\times10^{-6}\times10^{-10}}) = 7.12$ MHz。
      - card:
          title: 克拉泼、西勒和晶体振荡器
          body: |
            晶体管的结电容并在 $C_1$、$C_2$ 上，随温度、电压变，频率就不稳。克拉泼振荡器在电感支路里再串一个小电容 $C_3$（远小于 $C_1$、$C_2$），回路总电容主要由 $C_3$ 决定，晶体管电容的影响大大减小；西勒振荡器再在电感两端并一个可调电容，调频率时幅度更平稳。

            石英晶体等效为 Q 高达 $10^4$ 到 $10^6$ 的串联谐振电路，它的电感、电容几乎不随温度变，用它代替电感做成晶体振荡器，频率稳定度可以到 $10^{-6}$ 甚至更好。
      - item:
          id: clapp-f
          type: number
          prompt: 克拉泼振荡器 $L = 10\ \mu$H，$C_1 = C_2 = 1000$ pF，串联小电容 $C_3 = 50$ pF，不计晶体管的电容。振荡频率是多少兆赫？保留两位小数。
          answer: 7.47
          tolerance: 0.005
          unit: MHz
          hint: 三个电容串联的总电容是多少？
          explain: $1/C = 1/1000 + 1/1000 + 1/50$，$C = 45.5$ pF，$f_0 = 7.47$ MHz。只用 $C_3$ 估算是 7.12 MHz，$C_1$、$C_2$ 越大，频率越接近只由 $L$、$C_3$ 决定。
      - item:
          id: why-clapp
          type: choice
          prompt: 克拉泼振荡器比普通考毕兹振荡器频率更稳定，主要原因是什么？
          options:
            - text: 晶体管电容的影响被大大削弱
              correct: true
            - text: 多了一个电容，回路的 Q 就自动提高了
              why: Q 主要由电感和损耗决定；克拉泼的好处是让不稳定的晶体管电容在总电容里占的比例变小
            - text: $C_3$ 让晶体管不再需要偏置
              why: 偏置和 $C_3$ 无关；它只改变回路电容的组成
          explain: 晶体管电容并在 $C_1$、$C_2$ 上，而 $C_1$、$C_2$ 和小电容 $C_3$ 串联，串联电容由最小的那个决定，晶体管电容的变化就几乎影响不到频率。
  - id: cross-coupled-vco
    chapter: 正弦波振荡器
    title: 交叉耦合振荡器和压控振荡器
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 两个 MOS 管，每个管子的漏极接到另一个管子的栅极上（交叉相连），漏极各接一个 LC 回路。这样接的作用是什么？
          options:
            - text: 形成正反馈，等效成一个负电阻
              correct: true
            - text: 形成负反馈，让电路更稳定
              why: 每个管子反相一次，绕一圈反相两次，是正反馈；正是正反馈产生了负阻
            - text: 让两个管子互相抵消，电路不工作
              why: 两管交叉相连互相推动，一个电流增大会让另一个减小，再反过来推动第一个，信号被放大而不是抵消
          explain: 一个管子漏极电压上升，推动另一个管子电流增大、漏极下降，又让第一个管子电流减小、漏极继续上升：这是正反馈，等效成负阻，补上 LC 回路的损耗。
      - card:
          title: 交叉耦合振荡器
          body: |
            **交叉耦合振荡器（cross-coupled oscillator）**是射频芯片里最常用的 LC 振荡器。交叉相连的一对管子，从两个漏极之间看进去的电阻是 $-2/g_m$。每边回路的并联损耗电阻是 $R_p$，两边合起来 $2R_p$，起振条件是负阻的大小不超过它：$2/g_m \le 2R_p$，即
            $$g_mR_p \ge 1$$
            实际取 $g_mR_p$ 为 2 到 3，保证工艺、温度变化时仍能起振。输出是两个反相的正弦，正好是差分信号。
      - item:
          id: cc-gm
          type: number
          prompt: 交叉耦合振荡器每边回路的并联损耗电阻 500 Ω。每个管子的跨导至少要多少毫西才能起振？
          answer: 2
          tolerance: 0.001
          unit: mS
          hint: 起振条件 $g_mR_p$ 和 1 是什么关系？
          explain: $g_m \ge 1/R_p = 1/500 = 2$ mS。芯片上的电感 Q 低，$R_p$ 小，需要的跨导和电流就大。
      - card:
          title: 变容管和压控振荡器
          body: |
            反偏的 PN 结（或 MOS 电容）的电容随所加电压变化，叫**变容管（varactor）**。把它放进 LC 回路，改变控制电压就能改变振荡频率，这就是**压控振荡器（voltage-controlled oscillator, VCO）**。频率随控制电压变化的斜率叫压控增益：
            $$f_\text{out} = f_0 + K_\text{VCO}V_\text{ctrl}$$
            $K_\text{VCO}$ 的单位是 Hz/V。回路电容从 $C_\min$ 变到 $C_\max$ 时，频率之比是 $\sqrt{C_\max/C_\min}$。
      - item:
          id: kvco
          type: number
          prompt: 一个压控振荡器的 $K_\text{VCO} = 100$ MHz/V，控制电压升高 0.3 V。输出频率变化多少兆赫？
          answer: 30
          tolerance: 0.001
          unit: MHz
          hint: 频率变化等于什么乘以电压变化？
          explain: $100\times0.3 = 30$ MHz。$K_\text{VCO}$ 太大，控制电压上的一点噪声就会变成明显的频率抖动，所以宽调谐范围和低噪声之间要折中。
      - item:
          id: tuning-range
          type: number
          prompt: 压控振荡器的回路电感固定，回路总电容在 1.00 pF 到 1.44 pF 之间可调，最高振荡频率是 6 GHz。最低振荡频率是多少吉赫？
          answer: 5
          tolerance: 0.001
          unit: GHz
          hint: 频率和电容的平方根是什么关系？
          explain: 频率和 $1/\sqrt C$ 成正比，$f_\min = 6/\sqrt{1.44} = 6/1.2 = 5$ GHz。调谐范围 1 GHz，相对中心频率约 18%。
      - card:
          title: 正交振荡器
          body: |
            很多接收机和发射机需要两路频率相同、相位差 90° 的**本振（local oscillator）**信号（本振是收发机自己产生、送去和信号相乘的正弦），这样的两路信号互为**正交（quadrature）**信号（I 路和 Q 路）。常用两种做法：让压控振荡器工作在两倍频率上，再用触发器二分频，两个输出自然相差 90°；或者把两个相同的 LC 振荡器互相耦合，让它们锁定在相差 90° 的状态。相位差偏离 90°，后面靠两路信号相加相减来消除干扰的电路就会做不干净。
      - item:
          id: quadrature
          type: choice
          prompt: 一台接收机需要 2.4 GHz 的正交本振。一种常用的做法是什么？
          options:
            - text: 4.8 GHz 振荡器经二分频得到两路正交信号
              correct: true
            - text: 一个 2.4 GHz 振荡器的输出直接接到两个混频器，就自然相差 90°
              why: 同一个信号送到两处，相位是相同的；需要专门的电路产生 90° 的相位差
            - text: 用两个独立的 2.4 GHz 振荡器，各自调到差不多的频率
              why: 两个独立振荡器的频率不会完全相同，相位差会不停漂移，得不到稳定的 90°
          explain: 二分频电路在输入的上升沿和下降沿分别翻转，两个输出相隔输入的半个周期，正好是输出的四分之一周期，即 90°。代价是振荡器要工作在两倍频率。
  - id: phase-noise
    chapter: 正弦波振荡器
    title: 相位噪声
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 把一个 1 GHz 振荡器输出的频谱画出来（横轴频率，纵轴功率）。理想的正弦波在频谱上只有 1 GHz 一根线。实际的振荡器会是什么样？
          options:
            - text: 一个尖峰，两边拖着裙边
              correct: true
            - text: 和理想的一样，只有一根线
              why: 振荡器里的噪声让相位随机地抖动，能量散到载波两侧，频谱展宽成带裙边的形状
            - text: 1 GHz 附近均匀的一大片，没有尖峰
              why: 大部分能量仍集中在 1 GHz；只是两侧有一部分随频偏下降的噪声
          explain: 器件噪声让振荡的相位随机抖动，相当于频率在中心附近轻微摆动，频谱两侧出现裙边。裙边有多高，用相位噪声描述。
      - card:
          title: 相位噪声的定义
          body: |
            在离载波 $\Delta f$ 处取 1 Hz 带宽里的噪声功率，和载波功率相比，取对数，叫**相位噪声（phase noise）**：
            $$\mathcal L(\Delta f) = 10\lg\frac{P_\text{n}(\Delta f)}{P_\text{c}}\ \text{dBc/Hz}$$
            $P_\text{n}$ 是 1 Hz 带宽里的噪声功率，$P_\text{c}$ 是载波功率。dBc 表示“比载波低多少分贝”。手机里的本振在 1 MHz 频偏处常要做到 −120 dBc/Hz 以下。
      - item:
          id: pn-dbc
          type: number
          prompt: 一个振荡器输出 0 dBm，在离载波 1 MHz 处测得 1 Hz 带宽内的噪声功率是 −112 dBm。相位噪声是多少 dBc/Hz？
          answer: -112
          tolerance: 0.001
          unit: dBc/Hz
          hint: 载波是 0 dBm 时，比载波低多少分贝？
          explain: $-112 - 0 = -112$ dBc/Hz。载波若是 +5 dBm，同样的噪声就是 −117 dBc/Hz。
      - card:
          title: 倒易混频
          body: |
            接收机里，要收的信号很弱，旁边信道有一个很强的干扰。本振的裙边伸到了干扰的频率上，混频时干扰和这段裙边相乘，结果正好落进中频通带，像噪声一样盖在信号上，这叫**倒易混频（reciprocal mixing）**。落进来的噪声功率约为：干扰功率 + 本振在那个频偏的相位噪声 + $10\lg B$（$B$ 是信道带宽）。
      - card:
          title: 例题：本振要多干净
          body: 要收的信号 −90 dBm，离它 1 MHz 处有一个 −40 dBm 的干扰，信道带宽 200 kHz，解调需要信噪比 10 dB。只考虑倒易混频，本振在 1 MHz 频偏处的相位噪声至多是多少？
          reveal:
            - title: 第 1 步：求允许落进来的噪声
              body: 信号 −90 dBm，要高出 10 dB，噪声至多 −100 dBm。
            - title: 第 2 步：写出倒易混频的噪声
              body: $-40 + \mathcal L + 10\lg(2\times10^5) = -40 + \mathcal L + 53 \le -100$。
            - title: 第 3 步：解出相位噪声
              body: $\mathcal L \le -113$ dBc/Hz。干扰越强、离得越近，对本振的要求越严。
      - item:
          id: reciprocal
          type: number
          prompt: 要收的信号 −80 dBm，相邻信道有 −30 dBm 的干扰，信道带宽 1 MHz，需要信噪比 15 dB。只考虑倒易混频，本振在干扰频偏处的相位噪声至多是多少 dBc/Hz？
          answer: -125
          tolerance: 0.001
          unit: dBc/Hz
          hint: 允许落进来的噪声至多是多少 dBm？1 MHz 带宽对应多少分贝？
          explain: 噪声至多 $-80 - 15 = -95$ dBm；$-30 + \mathcal L + 60 \le -95$，$\mathcal L \le -125$ dBc/Hz。
      - card:
          title: 相位噪声和什么有关
          body: |
            Leeson 模型给出几条直观结论：在一定频偏范围内，相位噪声随频偏每增大 10 倍下降 20 dB；回路的 Q 越高、振荡幅度（信号功率）越大，相位噪声越低；振荡频率越高，同样频偏处的相位噪声越大，和 $f_0^2$ 成正比，所以把频率分频一半，相位噪声降低 $20\lg2 \approx 6$ dB，倍频一倍则升高 6 dB。离载波很近时，器件的闪烁噪声还会让它下降得更陡。
      - item:
          id: pn-offset
          type: number
          prompt: 一个振荡器在 100 kHz 频偏处的相位噪声是 −100 dBc/Hz，在这一段每增大 10 倍频偏下降 20 dB。1 MHz 频偏处是多少 dBc/Hz？
          answer: -120
          tolerance: 0.001
          unit: dBc/Hz
          hint: 1 MHz 是 100 kHz 的几倍？
          explain: 频偏增大 10 倍，下降 20 dB：$-100 - 20 = -120$ dBc/Hz。
      - item:
          id: pn-divide
          type: number
          prompt: 一个 5 GHz 振荡器经理想的二分频得到 2.5 GHz。在同样的频偏处，相位噪声改善多少分贝？保留一位小数。
          answer: 6.0
          tolerance: 0.05
          unit: dB
          hint: 相位噪声和振荡频率的几次方成正比？
          explain: 分频把相位抖动的幅度也减半，噪声功率降到四分之一：$20\lg2 = 6.0$ dB。这也是正交本振常用“两倍频振荡器 + 二分频”的一个附带好处。
  - id: mixer-basics
    chapter: 混频器
    title: 混频和镜像频率
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 把 900 MHz 的正弦和 855 MHz 的正弦相乘，乘积里有哪些频率？
          options:
            - text: 45 MHz 和 1755 MHz（两者之差与之和）
              correct: true
            - text: 只有 900 MHz 和 855 MHz，相乘不会产生新频率
              why: 相乘是非线性运算；按积化和差，$\cos a\cos b$ 变成差频和和频两项，原来的频率反而没有了
            - text: 只有 1755 MHz
              why: 积化和差同时给出和频与差频；接收机通常用滤波器留下差频 45 MHz
          explain: $\cos a\cos b = \tfrac12[\cos(a - b) + \cos(a + b)]$。乘法把信号搬到差频和和频上，留下哪一个由后面的滤波器决定。这就是混频。
      - card:
          title: 混频就是乘法
          body: |
            混频器有三个端口：射频输入（RF）、本振（LO）输入、中频输出（IF）。本振是接收机自己产生的正弦。两者相乘后，用滤波器留下差频 $f_\text{IF} = |f_\text{RF} - f_\text{LO}|$，叫下变频；发射机里留下和频，叫上变频。加在载波上的信息原样跟着搬过去，只是载波频率变了。本振比射频高叫高本振，比射频低叫低本振。
      - item:
          id: if-freq
          type: number
          prompt: 接收机收 2140 MHz 的信号，本振 2440 MHz。下变频后的中频是多少兆赫？
          answer: 300
          tolerance: 0.001
          unit: MHz
          hint: 中频是两个频率的和还是差？
          explain: $|2140 - 2440| = 300$ MHz。和频 4580 MHz 被中频滤波器滤掉。
      - card:
          title: 镜像频率
          body: |
            差频只看两者相差多少，不管谁大谁小。本振 $f_\text{LO}$ 两边各有一个频率和它相差 $f_\text{IF}$：一个是要收的信号，另一个叫**镜像频率（image frequency）**，两者离本振一样远，像照镜子一样对称：
            $$f_\text{image} = 2f_\text{LO} - f_\text{RF}$$
            即和信号相差 $2f_\text{IF}$。镜像上的信号混频后同样落在中频，和要收的信号叠在一起，混频之后再也分不开。
      - card:
          title: 例题：低本振的镜像
          body: 收 900 MHz 的信号，本振 855 MHz（低本振）。求中频和镜像频率。
          reveal:
            - title: 第 1 步：求中频
              body: $f_\text{IF} = 900 - 855 = 45$ MHz。
            - title: 第 2 步：在本振另一侧找对称点
              body: $f_\text{image} = 855 - 45 = 810$ MHz，也就是 $2\times855 - 900$。
            - title: 第 3 步：验证
              body: $|810 - 855| = 45$ MHz，810 MHz 的信号也会被搬到中频。
      - item:
          id: image-high
          type: number
          prompt: 接收机收 2140 MHz 的信号，本振 2440 MHz（高本振）。镜像频率是多少兆赫？
          answer: 2740
          tolerance: 0.001
          unit: MHz
          hint: 镜像和信号分在本振的两侧，各离本振多远？
          explain: 中频 300 MHz，镜像在本振另一侧 300 MHz 处：$2440 + 300 = 2740$ MHz。
      - item:
          id: image-low-if
          type: number
          prompt: 一台卫星导航接收机收 1575 MHz 的信号，本振 1571 MHz，中频只有 4 MHz。镜像频率是多少兆赫？
          answer: 1567
          tolerance: 0.001
          unit: MHz
          hint: 本振在信号的哪一侧？镜像在本振的另一侧多远？
          explain: $2\times1571 - 1575 = 1567$ MHz，离信号只有 8 MHz。射频滤波器不可能在 8 MHz 外就把它挡掉，中频很低的接收机要用镜像抑制的结构。
      - card:
          title: 镜像抑制和中频的选择
          body: |
            镜像必须在混频之前挡掉：在混频器前面放一个只让信号频段通过的滤波器，叫镜像抑制滤波器。中频取得高，镜像离信号远（$2f_\text{IF}$），容易挡；可中频高了，后面要在中频上选出一个很窄的信道就更难（同样的绝对带宽，相对中频的比例更小，需要的 Q 更高）。中频取低则正好相反。这是超外差接收机选中频时的基本折中。
      - item:
          id: why-image-first
          type: choice
          prompt: 为什么镜像干扰必须在混频之前滤掉，而不能在中频上滤掉？
          options:
            - text: 混频后镜像和信号落在同一个中频上，频率完全相同，任何滤波器都分不开
              correct: true
            - text: 中频滤波器太贵
              why: 不是成本问题；混频后两者频率相同，原理上就分不开
            - text: 镜像在混频后会消失
              why: 镜像经过混频同样被搬到中频，不会消失，正因为如此才要提前挡掉
          explain: 混频器只认“和本振相差多少”，信号和镜像都相差 $f_\text{IF}$。一旦进了混频器，它们在中频上重合，只能靠混频前的滤波（或镜像抑制结构）把镜像去掉。
      - item:
          id: if-tradeoff
          type: choice
          prompt: 把超外差接收机的中频从 10.7 MHz 提高到 70 MHz，最直接的好处和代价是什么？
          options:
            - text: 镜像离信号更远、更容易滤掉；但在中频上选出窄信道更难
              correct: true
            - text: 镜像离信号更近，更难滤掉；中频选信道更容易
              why: 镜像和信号相距 $2f_\text{IF}$，中频提高，镜像离得更远
            - text: 镜像和信道选择都变容易
              why: 中频越高，同样窄的信道带宽占中频的比例越小，需要的滤波器 Q 越高，信道选择更难
          explain: 镜像距离 $2f_\text{IF}$ 从 21.4 MHz 增到 140 MHz，前端滤波器容易挡掉；可 200 kHz 的信道在 70 MHz 上只占 0.3%，中频滤波器更难做。很多接收机因此用两次变频。
  - id: mixer-circuits
    chapter: 混频器
    title: 无源混频器和有源混频器
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 用本振控制一个开关，让射频信号一会儿直通、一会儿反相（相当于乘以 +1 和 −1 交替的方波）。这能当混频器用吗？
          options:
            - text: 能，靠方波里的基波
              correct: true
            - text: 不能，乘法器必须乘正弦波
              why: 方波可以分解成基波和奇次谐波的和；乘以方波就等于同时乘以这些正弦，其中基波那一项完成混频
            - text: 能，而且没有任何别的频率产生
              why: 方波的谐波也会和信号相乘，产生 $3f_\text{LO}$ 等附近的成分，要靠滤波器挡掉
          explain: 幅度为 1 的方波，基波幅度是 $4/\pi$。开关混频器就是乘以方波，靠其中的基波完成频率搬移。开关比真正的模拟乘法器容易做，也更线性。
      - card:
          title: 无源开关混频器
          body: |
            用 MOS 管当开关，由本振驱动，信号经过开关时被乘以一个方波。双平衡的结构（四个开关）相当于乘以 $\pm1$ 的方波，其中基波幅度 $4/\pi$，积化和差后差频的电压转换增益是
            $$\frac12\times\frac4\pi = \frac2\pi \approx -3.9\ \text{dB}$$
            开关里没有直流电流，**无源混频器（passive mixer）**线性度好、闪烁噪声（频率越低越大的一种器件噪声）小，代价是有损耗，后面要接放大器。
      - item:
          id: passive-gain-db
          type: number
          prompt: 理想的双平衡无源开关混频器，电压转换增益是 $2/\pi$。换成分贝是多少？保留一位小数。
          answer: -3.9
          tolerance: 0.05
          unit: dB
          hint: 电压比换成分贝要乘 20 还是 10？
          explain: $20\lg(2/\pi) = -3.9$ dB。只用一个开关（乘以 0、1 交替的方波）时基波幅度减半，增益 $1/\pi$，约 −9.9 dB。
      - card:
          title: 有源单平衡混频器
          body: |
            **有源混频器（active mixer）**先用一个跨导管把射频电压变成电流 $g_mv_\text{RF}$，上面接一对由本振驱动的开关管，轮流把这个电流送到左右两个负载电阻 $R_L$ 上，相当于乘以 $\pm1$ 的方波。差分输出的电压转换增益是
            $$A_c = \frac2\pi g_mR_L$$
            它本身有增益，能压低后级的噪声，但跨导管的直流电流也流过开关和负载，闪烁噪声和线性度比无源的差一些。
      - item:
          id: active-gain
          type: number
          prompt: 单平衡有源混频器的跨导 10 mS，每边负载 500 Ω。电压转换增益是多少倍？保留两位小数。
          answer: 3.18
          tolerance: 0.005
          hint: 跨导乘负载之后还要乘一个什么系数？它来自方波的哪个分量？
          explain: $A_c = (2/\pi)\times0.01\times500 = 3.18$，约 10.1 dB。
      - card:
          title: 双平衡和改进的结构
          body: |
            单平衡混频器的输出里，本振本身也会漏过来（开关电流的直流部分被方波调制）。把两个单平衡单元的输出交叉相连，射频用差分驱动，就是双平衡混频器（吉尔伯特单元）：本振和射频直接漏到中频的成分互相抵消，端口隔离好得多。

            改进的做法还有：从跨导管里分走一部分直流电流、不经过开关（电流注入），开关管电流小了，开关更快、噪声更小；无源混频器后面接跨阻放大器（把电流变成电压的放大器），同时得到好的线性度和增益。
      - item:
          id: why-double-balanced
          type: choice
          prompt: 和单平衡混频器相比，双平衡（吉尔伯特单元）混频器最主要的好处是什么？
          options:
            - text: 本振和射频直接漏到中频的成分互相抵消，端口隔离好
              correct: true
            - text: 转换增益是单平衡的两倍
              why: 两者的转换增益同在 $(2/\pi)g_mR_L$ 量级；双平衡的主要好处是对称结构让泄漏互相抵消
            - text: 不需要本振
              why: 双平衡同样要本振驱动开关；它的改进在于抵消泄漏
          explain: 两个单元交叉相连后，本振单独造成的输出在两个单元里大小相等、方向相反，合起来抵消；射频单独漏过来的部分也一样抵消，只剩两者相乘的那一项。
      - item:
          id: passive-vs-active
          type: choice
          prompt: 一台接收机把信号直接变到直流附近，设计者选了无源混频器而不是有源混频器。主要考虑是什么？
          options:
            - text: 开关里没有直流电流，闪烁噪声小
              correct: true
            - text: 无源混频器有更大的转换增益，能压低后级噪声
              why: 无源混频器有约 4 dB 的损耗；它的优点是线性度好、闪烁噪声小
            - text: 无源混频器不需要本振驱动
              why: 无源混频器的开关同样由本振驱动；“无源”指开关里不流直流电流
          explain: 闪烁噪声集中在低频，中频接近直流时它直接落在信号上。无源混频器的开关不流直流电流，闪烁噪声小，所以零中频接收机常用它，再在后面放大。
  - id: mixer-spurs
    chapter: 混频器
    title: 变频的失真与干扰
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一台中频 465 kHz 的中波收音机，收 931 kHz 的电台时，喇叭里除了节目还有一个 1 kHz 的尖叫。附近并没有别的电台。最可能的原因是什么？
          options:
            - text: 电台谐波和本振相混，落在中频旁边
              correct: true
            - text: 电台自己发出了 1 kHz 的尖叫
              why: 换一台收音机或换个中频就听不到了；这是接收机内部的组合频率造成的
            - text: 镜像频率上有干扰
              why: 题里附近没有别的电台，镜像上也没有信号；这里的干扰来自要收的信号自己
          explain: 本振 $931 + 465 = 1396$ kHz。电台的二次谐波和本振相差 $2\times931 - 1396 = 466$ kHz，落进中频通带，和 465 kHz 的中频差 1 kHz，检波后就是 1 kHz 的哨声。
      - card:
          title: 组合频率
          body: |
            实际的混频器不是理想乘法器，输入信号和本振的各次谐波都会互相组合，产生 $|pf_\text{LO} \pm qf_s|$（$p$、$q$ 是正整数）的成分。只要某个组合落进中频通带，就成了干扰。要收的信号自己和本振谐波的组合落在中频附近，检波后出现一个音调，叫**干扰哨声（whistle interference）**，接收某些固定频率时才出现，换个中频就能避开。
      - item:
          id: whistle-check
          type: number
          prompt: 中频 465 kHz 的收音机用高本振收 931 kHz 的电台。电台二次谐波和本振的差频 $2f_s - f_\text{LO}$ 是多少千赫？
          answer: 466
          tolerance: 0.001
          unit: kHz
          hint: 本振是多少？
          explain: $f_\text{LO} = 931 + 465 = 1396$ kHz，$2\times931 - 1396 = 466$ kHz，和 465 kHz 差 1 kHz，检波后是 1 kHz 的哨声。
      - card:
          title: 副波道干扰
          body: |
            外来的干扰信号 $f_n$ 只要满足 $|pf_\text{LO} \pm qf_n| = f_\text{IF}$，就会被当成要收的信号送进中频，这些频率叫副波道。最主要的两个：**中频干扰（IF interference）**，干扰正好在中频上，不经变频直接穿过混频器漏进中频；**镜像干扰（image interference）**，$p = q = 1$ 的另一个解。还有本振谐波造成的，比如 $2f_\text{LO} - f_n = f_\text{IF}$。办法都是在混频前用滤波器挡住这些频率。
      - item:
          id: if-interference
          type: number
          prompt: 一台中频 465 kHz 的中波收音机，哪个频率（千赫）的外来强信号能不经过变频、直接漏进中频？
          answer: 465
          tolerance: 0.001
          unit: kHz
          hint: 中频放大器本来就在放大哪个频率？
          explain: 中频放大器对 465 kHz 的信号增益最大。外来的 465 kHz 信号从混频器漏过去，就直接被当成中频放大。所以混频器前面要有挡住中频的滤波（常叫中频陷波）。
      - item:
          id: lo-harmonic-spur
          type: number
          prompt: 中频 465 kHz 的收音机用高本振收 600 kHz 的电台。外来干扰 $f_n$ 和本振的二次谐波满足 $2f_\text{LO} - f_n = f_\text{IF}$ 时也会进入中频。这个干扰频率是多少千赫？
          answer: 1665
          tolerance: 0.001
          unit: kHz
          hint: 本振是多少？把等式反过来解 $f_n$。
          explain: $f_\text{LO} = 600 + 465 = 1065$ kHz，$f_n = 2\times1065 - 465 = 1665$ kHz。
      - card:
          title: 交调和互调
          body: |
            **交叉调制（cross modulation）**：一个很强的干扰经过放大器或混频器的三次方非线性，把自己的调制“印”到要收的信号上。特点是只有收到要收的电台时才听得到干扰的节目，电台停播时干扰也跟着消失。**互调（intermodulation）**：两个干扰 $f_1$、$f_2$ 产生 $2f_1 - f_2$ 等成分，正好落在要收的频率上，即使要收的电台不在也能听到。两者都来自非线性，靠提高前端的线性度和前端选择性来减轻。
      - item:
          id: intermod-hit
          type: number
          prompt: 附近有两个很强的电台，分别在 1000 kHz 和 1010 kHz。它们的三阶互调 $2f_1 - f_2$（$f_1 = 1000$ kHz）会干扰收哪个频率的电台？单位千赫。
          answer: 990
          tolerance: 0.001
          unit: kHz
          hint: $2f_1$ 是多少？
          explain: $2\times1000 - 1010 = 990$ kHz，另一个是 $2\times1010 - 1000 = 1020$ kHz。收这两个频率的电台时，会听到两个强电台混在一起的声音。
      - item:
          id: cross-vs-inter
          type: choice
          prompt: 收某个电台时听到了另一个强电台的节目，可把要收的电台关掉后，那个节目也消失了。这是哪种干扰？
          options:
            - text: 交叉调制
              correct: true
            - text: 互调
              why: 互调是两个干扰自己组合出落在要收频率上的成分，要收的电台不在时也听得到
            - text: 镜像干扰
              why: 镜像干扰来自镜像频率上的电台，要收的电台关掉后它照样被搬到中频，照样听得到
          explain: 交叉调制是强干扰把调制转移到要收的信号上，没有要收的载波，就没有东西可“印”，干扰也就听不到了。
  - id: am-theory
    chapter: 调幅与检波
    title: 调幅波的频谱和功率
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个 1 MHz 的载波，幅度随一段 1 kHz 的音频起伏。用示波器看这个波形，会看到什么？
          options:
            - text: 1 MHz 振荡，轮廓随音频起伏
              correct: true
            - text: 一会儿是 1 MHz、一会儿是 1 kHz，两种波形交替出现
              why: 载波一直在振荡，变化的只是它的幅度；音频体现在振荡幅度的轮廓上
            - text: 一个 1 kHz 的正弦，看不到 1 MHz
              why: 波形本身是 1 MHz 的振荡，1 kHz 只表现为它的幅度变化；没有经过检波，示波器上看到的是高频振荡
          explain: 调幅让载波的幅度跟着音频变，波形的上下轮廓（包络）就是音频的形状。
      - card:
          title: 调幅波
          body: |
            让载波幅度随调制信号变化，叫**调幅（amplitude modulation, AM）**。单音调制时
            $$u(t) = U_c\left[1 + m\cos\Omega t\right]\cos\omega_ct$$
            $U_c$ 是载波幅度，$\Omega$ 是调制信号的角频率，$m$ 叫**调幅度（modulation depth）**。波形的包络在 $U_c(1 - m)$ 和 $U_c(1 + m)$ 之间起伏，所以 $m = (U_\max - U_\min)/(U_\max + U_\min)$。$m > 1$ 时包络的谷底会降到零以下再翻上来，叫过调制，包络不再是原来的形状。
      - item:
          id: mod-index
          type: number
          prompt: 一个调幅波的包络最大 1.6 V、最小 0.4 V。调幅度是多少？保留一位小数。
          answer: 0.6
          tolerance: 0.001
          hint: 包络的最大值和最小值分别等于 $U_c$ 乘什么？
          explain: $m = (1.6 - 0.4)/(1.6 + 0.4) = 0.6$，载波幅度 $U_c = (1.6 + 0.4)/2 = 1$ V。
      - card:
          title: 频谱：载波加两个边带
          body: |
            用积化和差展开：
            $$u = U_c\cos\omega_ct + \frac{mU_c}2\cos(\omega_c + \Omega)t + \frac{mU_c}2\cos(\omega_c - \Omega)t$$
            频谱里有载波和两个**边带（sideband）**：上边带在 $f_c + F$，下边带在 $f_c - F$，各自幅度 $mU_c/2$。调制信号的最高频率是 $F_\max$ 时，调幅波占的带宽是 $2F_\max$。
      - item:
          id: am-bandwidth
          type: number
          prompt: 一个中波电台用调幅发送最高 4.5 kHz 的音频。它的信号要占多宽的频带？单位千赫。
          answer: 9
          tolerance: 0.001
          unit: kHz
          hint: 上下边带各延伸多远？
          explain: 带宽 $2F_\max = 2\times4.5 = 9$ kHz，这正是国内中波电台之间的频率间隔。
      - card:
          title: 功率怎样分配
          body: |
            载波功率 $P_c = U_c^2/(2R)$，每个边带的幅度是载波的 $m/2$，功率是 $\tfrac{m^2}{4}P_c$，两个边带合起来 $\tfrac{m^2}{2}P_c$，总功率 $P_c(1 + m^2/2)$。边带功率只占总功率的
            $$\frac{m^2}{2 + m^2}$$
            信息全在边带里，载波不带信息却占了大部分功率：$m = 1$ 时边带也只占三分之一。
      - card:
          title: 例题：100 W 载波的调幅发射机
          body: 载波功率 100 W，调幅度 1。求总功率和边带功率占的比例。
          reveal:
            - title: 第 1 步：求两个边带的功率
              body: $\tfrac{m^2}{2}P_c = 0.5\times100 = 50$ W，每个边带 25 W。
            - title: 第 2 步：求总功率
              body: $100 + 50 = 150$ W。
            - title: 第 3 步：求边带的比例
              body: $50/150 = 1/3$。实际电台节目的平均调幅度只有 0.3 左右，边带功率占得更少。
      - item:
          id: sideband-power
          type: number
          prompt: 调幅发射机的载波功率 10 W，调幅度 0.6。两个边带的功率合起来是多少瓦？保留一位小数。
          answer: 1.8
          tolerance: 0.001
          unit: W
          hint: 两个边带的功率是载波功率的几倍？
          explain: $\tfrac{m^2}{2}P_c = \tfrac{0.36}{2}\times10 = 1.8$ W，每个边带 0.9 W，总功率 11.8 W。
      - item:
          id: sideband-fraction
          type: number
          prompt: 调幅度为 0.3 时，边带功率占调幅波总功率的百分之几？保留一位小数。
          answer: 4.3
          tolerance: 0.05
          unit: '%'
          hint: 两个边带的功率加起来是载波功率的几倍？总功率呢？
          explain: $0.09/2.09 = 4.3\%$。九成多的功率花在不带信息的载波上，这是普通调幅效率低的原因。
      - card:
          title: 双边带和单边带
          body: |
            既然载波不带信息，可以把它去掉，只发两个边带，叫**双边带调制（DSB）**；两个边带内容一样，再去掉一个，叫**单边带调制（SSB）**，带宽只有 $F_\max$，功率全部用在信息上。代价是接收端不能再用简单的包络检波，要在本地恢复出和发射端同频同相的载波。
      - item:
          id: ssb-benefit
          type: choice
          prompt: 和普通调幅相比，单边带调制的主要好处是什么？
          options:
            - text: 带宽减半，发射功率全部用在带信息的边带上
              correct: true
            - text: 接收机可以更简单，用包络检波就行
              why: 恰好相反，单边带没有载波，包络不是原信号的形状，要用同步检波，接收机更复杂
            - text: 单边带的带宽是普通调幅的两倍，所以音质更好
              why: 单边带只发一个边带，带宽是普通调幅的一半；它省的是带宽和功率
          explain: 只发一个边带，频带只要 $F_\max$；不发载波，功率都给了信息。短波通信、业余无线电大量使用单边带。
  - id: am-circuits
    chapter: 调幅与检波
    title: 调幅电路和单边带的产生
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 要得到 $U_c[1 + m\cos\Omega t]\cos\omega_ct$，最直接需要一个什么运算的电路？
          options:
            - text: 乘法：把“直流加音频”和载波相乘
              correct: true
            - text: 加法：把音频和载波加在一起
              why: 相加后频谱里只有音频和载波两个频率，没有边带；载波幅度也不会随音频变
            - text: 微分：对载波求导
              why: 求导只改变载波的幅度和相位，和音频无关；调幅需要让幅度随音频变，要用乘法
          explain: 调幅的本质是载波乘以 $(1 + m\cos\Omega t)$。凡是能做乘法的电路，或者能利用非线性产生乘积项的电路，都能用来调幅。
      - card:
          title: 低电平调幅
          body: |
            在小信号下用模拟乘法器（如吉尔伯特单元）把载波和“直流加音频”相乘，得到调幅波，再经线性功率放大器放大到需要的功率，叫低电平调幅。去掉直流、只把音频和载波相乘，得到的是没有载波的双边带信号，这种电路叫平衡调制器。低电平调幅的后级必须是线性放大器（甲类或甲乙类），否则包络会失真，所以效率不高。
      - item:
          id: balanced-mod
          type: choice
          prompt: 平衡调制器把音频 $\cos\Omega t$ 直接和载波 $\cos\omega_ct$ 相乘（不加直流）。输出频谱里有什么？
          options:
            - text: 只剩两个边带
              correct: true
            - text: 载波和两个边带都有
              why: 载波项来自直流乘载波；不加直流就没有这一项，这正是双边带的产生方法
            - text: 只有载波，边带被抵消了
              why: 乘积按积化和差变成和频与差频两项，载波频率本身不出现
          explain: $\cos\Omega t\cos\omega_ct = \tfrac12[\cos(\omega_c - \Omega)t + \cos(\omega_c + \Omega)t]$，只剩两个边带。
      - card:
          title: 高电平调幅
          body: |
            直接在丙类功放里调幅，叫高电平调幅。集电极调幅：让丙类功放工作在过压状态，这时输出电压幅度近似和集电极电源电压成正比；把音频叠加到集电极电源上，$V_{CC}(t) = V_{CC0}(1 + m\cos\Omega t)$，输出幅度就跟着音频变。功放始终工作在高效率状态，适合大功率发射机；边带的功率来自音频那一路，所以调制用的音频放大器也要有相当的功率。
      - item:
          id: collector-power
          type: number
          prompt: 集电极调幅的发射机，调幅度为 1 时，平均输出功率是未调制时载波功率的多少倍？保留一位小数。
          answer: 1.5
          tolerance: 0.001
          hint: 调幅度为 1 时，两个边带的功率合起来是载波功率的几倍？
          explain: $1 + 1^2/2 = 1.5$。多出来的 0.5 倍是边带功率，由叠加在电源上的音频提供。
      - card:
          title: 单边带的产生
          body: |
            滤波法：先用平衡调制器得到双边带，再用滤波器滤掉一个边带。难处在于两个边带之间只隔 $2F_\min$（话音最低约 300 Hz，只隔 600 Hz），载波频率高时滤波器要极陡，所以常在较低的频率上先做单边带，再变到发射频率。相移法：用两个平衡调制器，一路用原来的音频和载波，另一路把音频和载波都移相 90°，两路相加（或相减）时一个边带抵消、另一个加倍。它不需要陡峭的滤波器，但要求对整个音频范围都准确移相 90°。
      - item:
          id: ssb-gap
          type: number
          prompt: 话音信号的频率范围是 300 Hz 到 3400 Hz。用滤波法做单边带时，上下两个边带之间的间隙是多少赫？
          answer: 600
          tolerance: 0.001
          unit: Hz
          hint: 两个边带最靠近载波的分量各离载波多远？
          explain: 上边带最低在 $f_c + 300$，下边带最高在 $f_c - 300$，间隙 600 Hz。载波 10 MHz 时这只占 0.006%，滤波器很难做，所以先在几百千赫上做单边带。
      - item:
          id: phasing-method
          type: choice
          prompt: 相移法产生单边带时，为什么两路相加后只剩一个边带？
          options:
            - text: 两路的一个边带同相相加，另一个边带反相抵消
              correct: true
            - text: 移相 90° 把一个边带的频率移走了
              why: 移相不改变频率；它改变的是两路信号中各边带的相位关系，使一个边带抵消
            - text: 第二路调制器只产生一个边带
              why: 每一路都是平衡调制器，都产生两个边带；是相加时两路的相位关系让一个边带抵消
          explain: $\cos\Omega t\cos\omega_ct$ 和 $\sin\Omega t\sin\omega_ct$ 相减等于 $\cos(\omega_c + \Omega)t$，相加等于 $\cos(\omega_c - \Omega)t$。两路里的同一个边带一路为正、一路为负，就抵消了。
  - id: am-detection
    chapter: 调幅与检波
    title: 包络检波和同步检波
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 早期的矿石收音机没有电源，只靠一个二极管和一个电容就能从调幅波里取出声音。它是怎么做到的？
          options:
            - text: 电容把峰值存住，电压跟着包络走
              correct: true
            - text: 二极管把高频信号直接放大成了声音
              why: 二极管不能放大；它和电容一起把高频振荡的峰值连成一条线，这条线就是包络
            - text: 电容把高频和音频都滤掉了
              why: 电容只滤掉高频的起伏，包络的低频变化被保留下来，这就是声音
          explain: 二极管导通时电容充到峰值，截止时经电阻慢慢放电，下一个峰值又补上。电容电压就沿着各个峰值走，也就是包络。
      - card:
          title: 包络检波器
          body: |
            二极管串一个由 $R$、$C$ 并联组成的负载，就是**包络检波器（envelope detector）**。$RC$ 要满足两个条件：一是比载波周期大得多，$RC \gg 1/f_c$，两个峰值之间电容放电很少，输出才平滑；二是不能太大，否则包络下降时电容放电跟不上，输出拖着一条斜线，叫**惰性失真（diagonal clipping）**。单音调制时不产生惰性失真的条件是
            $$RC \le \frac{\sqrt{1 - m^2}}{m\,\Omega_\max}$$
      - item:
          id: rc-max
          type: number
          prompt: 包络检波器的输入是 465 kHz 的中频调幅波，调制信号最高 5 kHz，调幅度最大 0.8。为避免惰性失真，$RC$ 最大是多少微秒？保留一位小数。
          answer: 23.9
          tolerance: 0.05
          unit: μs
          hint: $\Omega_\max$ 是 5 kHz 的几倍？
          explain: $RC \le \sqrt{1 - 0.64}/(0.8\times2\pi\times5000) = 0.6/25133 = 23.9\ \mu$s。另一头 $RC$ 还要远大于载波周期 2.15 μs，取 10 到 20 μs 比较合适。
      - card:
          title: 负峰切割失真
          body: |
            检波器的输出要经隔直电容接到下一级，下一级的输入电阻 $R_L'$ 对交流来说并在 $R$ 上，交流负载 $R_\sim = R\parallel R_L'$ 比直流负载 $R$ 小。调幅度大时，包络的低谷处二极管会截止，输出波形的底部被削平，叫负峰切割失真。不失真的条件是
            $$m \le \frac{R_\sim}{R}$$
      - item:
          id: negative-peak
          type: number
          prompt: 包络检波器的负载电阻 5.1 kΩ，下一级的输入电阻 10 kΩ（经隔直电容接入）。为避免负峰切割失真，允许的最大调幅度是多少？保留两位小数。
          answer: 0.66
          tolerance: 0.005
          hint: 交流负载是哪两个电阻并联？
          explain: $R_\sim = 5.1\parallel10 = 3.38$ kΩ，$m \le 3.38/5.1 = 0.66$。把检波负载分成两段、下一级接在中间，可以放宽这个限制。
      - card:
          title: 同步检波
          body: |
            双边带、单边带信号的包络不是原来的调制信号，包络检波会失真。**同步检波（synchronous detection）**把收到的信号和本地产生的载波相乘，再用低通滤波器取出低频：本地载波和发射端同频同相时，输出正比于调制信号。本地载波有相位误差 $\varphi$ 时，双边带的输出乘上 $\cos\varphi$，相位差 90° 时输出为零。本地载波常用锁相环（让振荡器的相位跟踪输入信号的电路）从收到的信号里恢复。
      - item:
          id: sync-phase
          type: number
          prompt: 双边带信号同步检波，本地载波和发射载波频率相同，但相位差 60°。输出幅度是相位对准时的多少倍？保留一位小数。
          answer: 0.5
          tolerance: 0.001
          hint: 输出要乘上相位误差的什么函数？
          explain: $\cos60° = 0.5$。相位误差还随时间变化时，输出幅度会时大时小，所以同步检波要锁住相位。
      - item:
          id: dsb-envelope
          type: choice
          prompt: 为什么双边带信号不能用包络检波器解调？
          options:
            - text: 包络是调制信号的绝对值，形状不对
              correct: true
            - text: 双边带信号的频率太高，二极管来不及导通
              why: 频率和普通调幅一样；问题在于没有载波，包络 $|\cos\Omega t|$ 和原信号 $\cos\Omega t$ 不同
            - text: 双边带信号没有能量，检不出东西
              why: 双边带的能量全在边带里，信号是有的；只是它的包络不是原来的波形
          explain: $\cos\Omega t\cos\omega_ct$ 的包络是 $|\cos\Omega t|$，频率变成了两倍，形状也不对。只有加上足够大的载波（普通调幅，$m \le 1$）时，包络才是 $1 + m\cos\Omega t$。
  - id: angle-modulation
    chapter: 调频与鉴频
    title: 调频和调相
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 调频（FM）电台发送音乐时，载波的什么在随音乐变化？
          options:
            - text: 频率随音乐摆动，幅度不变
              correct: true
            - text: 载波的幅度随音乐变化，和调幅一样
              why: 调频时幅度保持不变，变的是频率；幅度不变正是它抗干扰的原因之一
            - text: 载波的中心频率随音乐整体搬到别处
              why: 中心频率是固定的电台频率，变的是瞬时频率在中心附近的摆动
          explain: 调频让瞬时频率在载波频率附近随调制信号摆动，声音越响摆得越远，声音的频率决定摆动的快慢。幅度始终不变。
      - card:
          title: 调频和调相
          body: |
            **调频（frequency modulation, FM）**：瞬时频率 $f(t) = f_c + k_fu_\Omega(t)$，偏离中心的最大值叫**最大频偏（peak frequency deviation）** $\Delta f$。**调相（phase modulation, PM）**：瞬时相位随调制信号变化。两者都改变载波的相位角，合称调角。单音调制时都可以写成
            $$u(t) = U_c\cos(\omega_ct + \beta\sin\Omega t)$$
            $\beta$ 叫调制指数，等于最大相位偏移（弧度）。调频时 $\beta = \Delta f/F$，$F$ 是调制信号的频率。
      - item:
          id: fm-beta
          type: number
          prompt: 一个调频信号的最大频偏 45 kHz，调制信号是 15 kHz 的单音。调制指数是多少？
          answer: 3
          tolerance: 0.001
          hint: 调频的调制指数等于哪两个频率之比？
          explain: $\beta = \Delta f/F = 45/15 = 3$。同样的频偏，调制信号频率越低，调制指数越大。
      - card:
          title: 调角波的频谱
          body: |
            $\cos(\omega_ct + \beta\sin\Omega t)$ 可以展开成载波和无穷多对边带：
            $$\sum_{n = -\infty}^{\infty}J_n(\beta)\cos(\omega_c + n\Omega)t$$
            $J_n$ 是第一类贝塞尔函数，第 $n$ 对边带的幅度是 $J_n(\beta)$。各分量的功率之和始终等于未调制时的载波功率，调制只是把功率从载波分给了边带；$\beta = 2.405$ 时 $J_0 = 0$，载波分量完全消失。
      - item:
          id: fm-carrier-power
          type: number
          prompt: 调制指数 $\beta = 1$ 的调频信号，$J_0(1) = 0.765$。载波分量的功率占总功率的百分之几？保留一位小数。
          answer: 58.5
          tolerance: 0.15
          unit: '%'
          hint: 载波分量的幅度是未调制时的 $J_0$ 倍，功率呢？
          explain: $J_0^2 = 0.765^2 = 0.585$，载波分量占 58.5%，其余 41.5% 分给了各对边带。
      - card:
          title: 卡森带宽
          body: |
            调角波的边带理论上无穷多，但 $n$ 大于约 $\beta + 1$ 的边带已经很小。常用**卡森带宽（Carson bandwidth）**估算它占的频带：
            $$B \approx 2(\Delta f + F) = 2(\beta + 1)F$$
            它包含了约 98% 以上的功率。$\beta$ 远小于 1 时（窄带调频）$B \approx 2F$，和调幅一样；$\beta$ 大时（宽带调频）$B \approx 2\Delta f$。
      - card:
          title: 例题：调制指数 3 的带宽
          body: 调频信号最大频偏 45 kHz，调制信号 15 kHz。求卡森带宽，并看边带延伸到哪里。
          reveal:
            - title: 第 1 步：代入卡森公式
              body: $B = 2\times(45 + 15) = 120$ kHz。
            - title: 第 2 步：换成边带的对数
              body: $\beta + 1 = 4$，载波两侧各约 4 对边带，每对相隔 15 kHz，正好延伸到 $\pm60$ kHz。
            - title: 第 3 步：看功率
              body: 用贝塞尔函数算，$|n| \le 4$ 的分量占了约 99.6% 的功率。
      - item:
          id: carson-narrow
          type: number
          prompt: 一部对讲机用调频，最大频偏 5 kHz，话音最高 3 kHz。按卡森公式，信号占多少千赫的带宽？
          answer: 16
          tolerance: 0.001
          unit: kHz
          hint: 卡森带宽是哪两个频率之和的两倍？
          explain: $2\times(5 + 3) = 16$ kHz。对讲机的信道间隔常是 25 kHz 或 12.5 kHz（后者把频偏降到约 2.5 kHz）。
      - card:
          title: 调频和调相的关系
          body: |
            频率是相位对时间的变化率。先把调制信号积分再去调相，得到的就是调频；先求导再调频，得到的是调相。频偏固定时，调频的调制指数随调制频率升高而变小；调相的调制指数由相位偏移决定，不随调制频率变。调角信号的幅度恒定，接收端可以先把幅度削平，去掉幅度上的噪声，并且用更宽的带宽换取更高的输出信噪比，这是调频音质比调幅好的原因。
      - item:
          id: fm-vs-am
          type: choice
          prompt: 调频电台的音质比调幅电台好，抗干扰能力更强。主要原因是什么？
          options:
            - text: 信息在频率上，幅度恒定，接收端能削掉幅度噪声；还用更宽的带宽换来了信噪比
              correct: true
            - text: 调频电台的发射功率比调幅电台大得多
              why: 两者功率没有必然的大小关系；调频的优势来自调制方式本身
            - text: 调频信号不受任何噪声影响
              why: 噪声同样会扰动相位和频率；只是调频能削掉幅度噪声，并靠宽带换得更高的输出信噪比
          explain: 噪声和干扰主要表现为幅度的起伏，调频接收机的限幅器把它们削掉；宽带调频还能把输出信噪比提高到比调幅高得多，代价是占用更宽的频带。
  - id: fm-circuits
    chapter: 调频与鉴频
    title: 调频电路和调相电路
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 要让一个 LC 振荡器的频率跟着音频摆动，最直接的办法是什么？
          options:
            - text: 让音频改变回路电容
              correct: true
            - text: 让音频去改变振荡器的电源电压
              why: 电源电压主要影响振荡幅度，对频率影响很小且不线性；频率由回路的 L 和 C 决定，应该去改变它们
            - text: 在振荡器输出端加一个音频放大器
              why: 输出端加放大器不会改变振荡频率；要改频率必须改变回路本身
          explain: 振荡频率由回路的 $L$、$C$ 决定。把变容管接进回路，音频改变它的偏压和电容，频率就跟着音频变，这就是直接调频。
      - card:
          title: 直接调频
          body: |
            变容管的结电容随反偏电压变化：$C_j = C_{j0}/(1 + v/V_D)^\gamma$，$\gamma$ 由掺杂分布决定（突变结约 1/2，超突变结可到 2 左右）。把它接进振荡回路，音频叠加在直流偏压上，振荡频率就随音频变。电容变化很小时，频率的相对变化是电容相对变化的一半、方向相反：
            $$\frac{\Delta f}{f_0} \approx -\frac12\frac{\Delta C}{C}$$
            直接调频的频偏大，但振荡器不能用晶体稳频，中心频率不够稳定，常要再加一个稳频的反馈电路。
      - item:
          id: varactor-df
          type: number
          prompt: 一个 100 MHz 的 LC 振荡器，回路电容全部由变容管提供。音频让电容减小 2%，振荡频率约升高多少兆赫？
          answer: 1
          tolerance: 0.02
          unit: MHz
          hint: 频率的相对变化和电容的相对变化是什么关系？
          explain: $\Delta f/f_0 \approx -\tfrac12\times(-2\%) = 1\%$，$\Delta f \approx 1$ MHz。精确算是 $100/\sqrt{0.98} - 100 = 1.015$ MHz。
      - card:
          title: 间接调频和倍频
          body: |
            先把音频积分，再对一个晶体振荡器产生的稳定载波调相，输出就是调频，叫间接调频。载波来自晶体，中心频率很稳；可调相器的相移只能做到很小，频偏也很小。办法是倍频：频率乘 $N$ 时，载波频率和频偏都乘 $N$；再用混频把载波搬到需要的频率，混频只搬中心频率、不改变频偏。这是 Armstrong 当年调频发射机的做法。
      - card:
          title: 例题：把 25 Hz 的频偏变成 75 kHz
          body: 调相器在 100 kHz 的载波上产生 25 Hz 的频偏，发射机要在 100 MHz 上得到 75 kHz 的频偏。怎样安排倍频和混频？
          reveal:
            - title: 第 1 步：求需要的倍频次数
              body: $N = 75000/25 = 3000$。
            - title: 第 2 步：看倍频后的载波
              body: 载波变成 $100\ \text{kHz}\times3000 = 300$ MHz，频偏 75 kHz。
            - title: 第 3 步：用混频搬到发射频率
              body: 和 200 MHz 的本振混频取差频，载波到 100 MHz，频偏仍是 75 kHz。实际常把倍频分两段，中间插入混频，免得载波频率过高。
      - item:
          id: multiply-n
          type: number
          prompt: 间接调频发射机的调相器产生 50 Hz 的频偏，要得到 75 kHz 的频偏，总共需要倍频多少倍？
          answer: 1500
          tolerance: 0.001
          hint: 倍频时频偏怎样变化？
          explain: 频偏随倍频次数成正比：$N = 75000/50 = 1500$，常拆成几级二倍频、三倍频串起来。
      - card:
          title: 调相电路
          body: |
            调相要让载波的相位随调制电压变。常用变容管调谐的回路：载波通过一个调谐在载波频率附近的回路，回路的相移随失谐量变化；用调制电压改变变容管电容，回路的谐振频率移动，载波经过它的相移就跟着变。相移不大（约 ±30° 以内）时，相移和调制电压近似成正比，所以单级调相的调制指数有限。
      - item:
          id: indirect-stable
          type: choice
          prompt: 间接调频的中心频率比直接调频稳定得多。原因是什么？
          options:
            - text: 载波来自不受调制的晶体振荡器
              correct: true
            - text: 间接调频的频偏更大，频率自然更稳
              why: 恰好相反，间接调频的原始频偏很小，要靠倍频放大；稳定性来自晶体振荡器
            - text: 倍频能让频率自动稳定
              why: 倍频会把载波的漂移也一起放大 $N$ 倍；稳定是因为源头是不受调制的晶体振荡器
          explain: 直接调频要改变振荡回路本身，就不能用 Q 极高、不能随意调的晶体；间接调频把调制放在振荡器后面，振荡器可以是晶体振荡器，中心频率稳定度很高。
  - id: fm-demod
    chapter: 调频与鉴频
    title: 限幅和鉴频
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 调频信号的幅度不变，信息在频率上。要把它变回声音，需要一个怎样的电路？
          options:
            - text: 输出电压随输入频率变化的电路，频率高电压就高
              correct: true
            - text: 包络检波器，和调幅一样
              why: 调频信号的包络是恒定的，包络检波只能得到一个直流，取不出声音
            - text: 一个很窄的带通滤波器，只让中心频率通过
              why: 只让中心频率通过会把带着信息的频偏都滤掉；需要的是把频率的变化变成电压的变化
          explain: 把瞬时频率的变化转换成电压的变化，就恢复了调制信号。完成这件事的电路叫鉴频器。
      - card:
          title: 鉴频器
          body: |
            输出电压和输入信号的频偏成正比的电路叫**鉴频器（frequency discriminator）**，比例系数叫鉴频灵敏度 $S_D$（单位 mV/kHz）。输出和频偏之间保持线性的那段频率范围叫鉴频的线性范围，它要比信号的最大频偏的两倍（$2\Delta f$）还宽，否则频偏大时输出失真。
      - item:
          id: disc-out
          type: number
          prompt: 鉴频器的灵敏度 5 mV/kHz，输入调频信号的最大频偏 40 kHz。输出音频电压的峰值是多少毫伏？
          answer: 200
          tolerance: 0.001
          unit: mV
          hint: 输出电压等于灵敏度乘什么？
          explain: $5\times40 = 200$ mV。频偏随声音大小变化，输出电压也跟着变，就恢复了声音。
      - item:
          id: disc-range
          type: number
          prompt: 一个调频信号的最大频偏是 50 kHz。鉴频器的线性范围至少要多宽（千赫）？
          answer: 100
          tolerance: 0.001
          unit: kHz
          hint: 频率要在中心两侧各摆多远？
          explain: 频率在中心两侧各摆 50 kHz，线性范围至少 $2\times50 = 100$ kHz，实际要留出余量。
      - card:
          title: 斜率鉴频
          body: |
            把调频信号送进一个失谐的谐振回路，让信号落在回路幅频曲线的斜坡上，频率变化就变成了幅度变化，再用包络检波器取出，这叫斜率鉴频。用两个回路一高一低对称失谐、两路检波输出相减，叫平衡斜率鉴频，线性范围更宽，中心频率处输出为零。
      - item:
          id: slope-principle
          type: choice
          prompt: 斜率鉴频器为什么要让谐振回路失谐，而不是调在信号的中心频率上？
          options:
            - text: 工作在斜坡上，频率一变幅度就变
              correct: true
            - text: 调在中心频率上信号会被回路完全挡住
              why: 谐振时回路对中心频率的响应最大，不会挡住；问题是谐振峰顶附近曲线是平的，频率变化几乎不改变幅度
            - text: 失谐能提高回路的品质因数
              why: 失谐不改变回路的 Q；它只是让信号落在曲线的斜坡上
          explain: 谐振峰顶附近幅度对频率几乎不敏感；在斜坡上，频率偏一点幅度就变一截，调频就变成了幅度也在变的信号，再用包络检波取出。
      - card:
          title: 相位鉴频和正交鉴频
          body: |
            相位鉴频先用一个耦合回路把频率的变化变成两路信号之间相位差的变化，再把相位差变成电压，例如福斯特–西利鉴频器；比例鉴频器是它的改进，输出取两路检波电压之比，自身就能抑制幅度变化。集成电路里常用正交鉴频：把信号和它经过移相网络的那一路相乘，移相网络的相移随频率变，乘积的直流成分就随频率变。
      - item:
          id: ratio-detector
          type: choice
          prompt: 和福斯特–西利相位鉴频器相比，比例鉴频器的主要优点是什么？
          options:
            - text: 自身对输入幅度的变化不敏感，有限幅作用
              correct: true
            - text: 不需要谐振回路
              why: 比例鉴频器同样用耦合的谐振回路把频率变成相位差；它的改进在于输出取两路之比，幅度变化相互抵消
            - text: 可以直接解调调幅信号
              why: 它是为调频设计的，正是因为能抑制幅度变化，对调幅信号几乎没有输出
          explain: 比例鉴频器的输出取决于两路检波电压之比，输入幅度一起变大变小时比值不变，而且它用一个大电容稳住两路之和，所以自带限幅作用。
      - card:
          title: 限幅
          body: |
            信号在传输中会叠上噪声和干扰，幅度忽大忽小。斜率鉴频和相位鉴频的输出也和输入幅度有关，幅度起伏会变成输出里的噪声。所以鉴频器前面先接一个**限幅器（limiter）**：把信号放大后削成幅度恒定的方波，再经滤波恢复成正弦，幅度的变化全部被去掉，频率信息保留下来。比例鉴频器自带限幅作用，可以省掉一部分限幅放大。
      - item:
          id: why-limiter
          type: choice
          prompt: 调频接收机里，限幅器为什么放在鉴频器前面？
          options:
            - text: 先削掉幅度噪声，鉴频输出才只反映频率
              correct: true
            - text: 限幅器能把频偏变大，提高灵敏度
              why: 限幅只削掉幅度，不改变瞬时频率，频偏不变
            - text: 限幅器把调频信号变成调幅信号，便于检波
              why: 限幅器去掉幅度变化，输出是幅度恒定的信号；把频率变成幅度是斜率鉴频那一步做的事
          explain: 噪声主要表现为幅度起伏。限幅后幅度恒定，鉴频器的输出就只随频率变，这也是调频抗噪声的关键一环。
  - id: pll-basics
    chapter: 锁相环与频率合成
    title: 反馈控制和锁相环
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 想让一个压控振荡器的频率和一个很准的参考信号完全一样，而且长期不漂。下面哪种思路最好？
          options:
            - text: 持续比较相位，用相位差去调振荡器
              correct: true
            - text: 一次把振荡器调准，之后不再管它
              why: 振荡器会随温度、电源、老化漂移，一次调准管不了多久，必须持续比较和修正
            - text: 比较两者的幅度，幅度相同就说明频率相同
              why: 幅度和频率无关；幅度相同的两个正弦频率可以差很多
          explain: 只要相位差保持不变，两者的频率就严格相等。用相位差去控制振荡器，就是锁相环的思路。
      - card:
          title: 自动增益控制和自动频率控制
          body: |
            接收机输入的信号强弱可以相差几十分贝。**自动增益控制（AGC）**检测输出幅度，自动调低或调高放大器的增益，让输出大致稳定。**自动频率控制（AFC）**用鉴频器检测频率误差，去调整本振，让中频保持在标称值。AFC 是频率反馈，环路增益有限，总会留下一点剩余频率误差：开环误差为 $\Delta f_0$、环路增益为 $K$ 时，剩余误差约 $\Delta f_0/(1 + K)$（鉴频器工作在线性范围内时）。
      - item:
          id: agc-range
          type: number
          prompt: 一台接收机的输入信号强弱变化 60 dB，要求输出变化不超过 6 dB。自动增益控制至少要能调节多少分贝的增益？
          answer: 54
          tolerance: 0.001
          unit: dB
          hint: 输入的变化里，有多少要靠增益调节吃掉？
          explain: $60 - 6 = 54$ dB。增益要能从最大调到比最大低 54 dB，常分配到几级放大器上。
      - item:
          id: afc-residual
          type: number
          prompt: 没有自动频率控制时本振偏了 100 kHz。加上自动频率控制，环路增益 50。剩余频率误差约是多少千赫？保留两位小数。
          answer: 1.96
          tolerance: 0.005
          unit: kHz
          hint: 剩余误差是开环误差除以什么？
          explain: $100/(1 + 50) = 1.96$ kHz。环路增益越大误差越小，但永远不为零；锁相环能把频率误差做到零。
      - card:
          title: 锁相环的组成
          body: |
            **锁相环（phase-locked loop, PLL）**由三部分组成：**鉴相器（phase detector）**输出和两路信号相位差成正比的电压，$v = K_\text{PD}\Delta\varphi$；环路滤波器滤掉鉴相器输出里的高频成分；压控振荡器按控制电压改变频率。环路锁定时，压控振荡器的频率和参考频率严格相等，两者之间只剩一个恒定的相位差。它比自动频率控制好的地方，正是没有剩余频率误差。
      - card:
          title: 例题：I 型锁相环的静态相位差
          body: 鉴相器 $K_\text{PD} = 0.5$ V/rad，压控振荡器 $K_\text{VCO} = 10$ MHz/V。参考频率比压控振荡器的自由振荡频率高 1 MHz。锁定后的相位差是多少？
          reveal:
            - title: 第 1 步：求需要的控制电压
              body: 要把频率拉高 1 MHz，控制电压 $V = 1/10 = 0.1$ V。
            - title: 第 2 步：由控制电压求相位差
              body: 这个电压来自鉴相器（环路滤波器对直流不衰减），$\Delta\varphi = 0.1/0.5 = 0.2$ rad。
            - title: 第 3 步：看结论
              body: 频率完全相等，代价是留下 0.2 rad 的相位差。频率差越大，相位差越大；超过鉴相器的线性范围就锁不住。
      - item:
          id: static-phase
          type: number
          prompt: I 型锁相环的鉴相器 $K_\text{PD} = 1$ V/rad，压控振荡器 $K_\text{VCO} = 20$ MHz/V，参考频率比自由振荡频率高 3 MHz。锁定后的相位差是多少弧度？保留两位小数。
          answer: 0.15
          tolerance: 0.001
          unit: rad
          hint: 先求需要的控制电压，它来自哪里？
          explain: 控制电压 $3/20 = 0.15$ V，相位差 $0.15/1 = 0.15$ rad。
      - item:
          id: afc-vs-pll
          type: choice
          prompt: 锁相环和自动频率控制都能让振荡器跟住参考频率。锁定以后两者有什么根本区别？
          options:
            - text: 锁相环没有频率误差
              correct: true
            - text: 自动频率控制的频率误差为零，锁相环总有频率误差
              why: 恰好相反；锁相环比较的是相位，相位差恒定就意味着频率严格相等
            - text: 两者完全一样
              why: 自动频率控制比较频率，有限的环路增益留下剩余误差；锁相环比较相位，频率误差为零
          explain: 频率是相位的变化率。锁相环锁定时相位差不变，频率就严格相等；自动频率控制只能把频率误差压小，不能消除。
  - id: pll-dynamics
    chapter: 锁相环与频率合成
    title: 电荷泵锁相环和环路带宽
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: I 型锁相环锁定后总留下一个相位差，频率差越大相位差越大。有没有办法让相位差也变成零？
          options:
            - text: 加一个积分器
              correct: true
            - text: 没有办法，锁相环总有相位差
              why: 用积分器存住控制电压后，鉴相器不必再输出直流，相位差可以为零，这就是 II 型锁相环
            - text: 把鉴相器的增益调到无穷大
              why: 增益不可能无穷大；用一个积分器（电容）存住控制电压，效果相当于直流增益无穷大
          explain: 积分器把控制电压“记住”，相位差为零时控制电压也保持不变。只要还有一点相位差，电压就继续变，直到相位差消失。
      - card:
          title: 鉴频鉴相器和电荷泵
          body: |
            **鉴频鉴相器（phase-frequency detector, PFD）**比较参考信号和反馈回来的信号的边沿：参考先到就输出“升”脉冲，反馈先到就输出“降”脉冲，脉冲宽度等于两边沿的时间差。频率不同时它也能判断谁快，所以总能把环路拉进锁定。**电荷泵（charge pump）**按“升”“降”脉冲向环路滤波器的电容送入或抽出电流 $I_P$，电容就是积分器。这样的环路有两个积分（电容和压控振荡器），叫 II 型锁相环，锁定后相位差为零。环路滤波器要在电容上串一个电阻，否则环路不稳定。
      - card:
          title: 环路的固有频率和阻尼
          body: |
            电荷泵锁相环（滤波器是电阻 $R$ 串电容 $C$）可以近似成二阶系统：
            $$\omega_n = \sqrt{\frac{I_PK_\text{VCO}}{2\pi C}},\qquad \zeta = \frac R2\sqrt{\frac{I_PCK_\text{VCO}}{2\pi}}$$
            这里 $K_\text{VCO}$ 用 rad/s/V。$\omega_n$ 决定环路带宽和建立时间，$\zeta$ 决定阶跃响应是否过冲，常取 0.7 到 1。连续时间的近似要求环路带宽比参考频率低得多，常用的经验是不超过参考频率的十分之一。
      - item:
          id: pll-fn
          type: number
          prompt: 电荷泵锁相环的 $I_P = 100\ \mu$A，$K_\text{VCO} = 2\pi\times100$ MHz/V，环路电容 100 pF。固有频率 $f_n = \omega_n/(2\pi)$ 是多少兆赫？保留两位小数。
          answer: 1.59
          tolerance: 0.005
          unit: MHz
          hint: 先求 $\omega_n$，根号里约掉 $2\pi$ 以后是多少？
          explain: $\omega_n = \sqrt{10^{-4}\times10^8/10^{-10}} = 10^7$ rad/s，$f_n = 1.59$ MHz。按经验，参考频率要在 16 MHz 以上。
      - item:
          id: pll-zeta
          type: number
          prompt: 电荷泵锁相环的 $I_P = 100\ \mu$A，$K_\text{VCO} = 2\pi\times100$ MHz/V，环路电容 100 pF，串联电阻 1.4 kΩ。阻尼系数是多少？保留一位小数。
          answer: 0.7
          tolerance: 0.001
          hint: 根号里约掉 $2\pi$ 以后是多少？再乘 $R/2$。
          explain: $\sqrt{10^{-4}\times10^{-10}\times10^8} = 10^{-3}$，$\zeta = 700\times10^{-3} = 0.7$。电阻加大到 2 kΩ 时 $\zeta = 1$。
      - card:
          title: 锁相环里的相位噪声
          body: |
            锁相环对两路噪声的作用相反：参考信号（和鉴相器、分频器）的相位噪声在环路带宽以内被传到输出，并且因为输出频率是参考的 $N$ 倍，要乘 $N^2$，即加 $20\lg N$ dB；压控振荡器自己的相位噪声在环路带宽以内被环路纠正掉，在带宽以外原样出现在输出。所以环路带宽要折中：宽一些，压控振荡器的噪声压得多、建立更快；窄一些，参考噪声和参考杂散滤得干净。
      - item:
          id: in-band-noise
          type: number
          prompt: 锁相环的参考信号在 10 kHz 频偏处的相位噪声是 −150 dBc/Hz，输出频率是参考的 1000 倍，10 kHz 在环路带宽以内。输出在 10 kHz 频偏处的相位噪声约是多少 dBc/Hz？
          answer: -90
          tolerance: 0.001
          unit: dBc/Hz
          hint: 频率乘 $N$，相位噪声加多少分贝？
          explain: $-150 + 20\lg1000 = -150 + 60 = -90$ dBc/Hz。分频比越大，带内噪声越高，这是整数分频合成器的一个限制。
      - item:
          id: bandwidth-tradeoff
          type: choice
          prompt: 一个锁相环的压控振荡器噪声很大，参考信号很干净。环路带宽应该往哪边调？
          options:
            - text: 调宽一些，让环路在更宽的频偏范围内纠正压控振荡器的噪声
              correct: true
            - text: 调窄一些，滤掉更多噪声
              why: 环路带宽以外压控振荡器的噪声不受纠正；带宽调窄，它原样出现在输出的范围反而变大
            - text: 环路带宽对噪声没有影响
              why: 带宽决定了哪些频偏上的噪声由参考决定、哪些由压控振荡器决定，影响很大
          explain: 带宽以内输出跟着参考走，带宽以外跟着压控振荡器走。参考干净、压控振荡器噪声大，就把带宽加宽，但不能超过参考频率的约十分之一。
  - id: integer-n
    chapter: 锁相环与频率合成
    title: 整数分频频率合成器
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 手机要在几百个信道之间切换本振频率，每个频率都要和晶体一样准。只有一个晶体，怎样得到这么多准确的频率？
          options:
            - text: 用锁相环和能改的分频比
              correct: true
            - text: 每个信道配一个晶体
              why: 几百个晶体既占地方又贵；用一个晶体加锁相环和可编程分频器就能得到全部频率
            - text: 让晶体振荡器直接在各个频率上振荡
              why: 晶体只在自己的谐振频率附近振荡，调不了这么宽
          explain: 锁相环锁定时，分频后的频率等于参考频率，所以输出 $f_\text{out} = Nf_\text{REF}$。N 是整数、可以编程，一个晶体就能给出一整套频率。
      - card:
          title: 整数分频合成器
          body: |
            在锁相环的反馈路径上插一个分频比为 $N$ 的分频器，锁定时 $f_\text{out}/N = f_\text{REF}$，即
            $$f_\text{out} = Nf_\text{REF}$$
            这叫**整数分频频率合成器（integer-N synthesizer）**。$N$ 每加 1，输出频率增加 $f_\text{REF}$，所以频率步进（信道间隔）就等于参考频率。输出的频率准确度和晶体一样。
      - item:
          id: synth-n
          type: number
          prompt: 一个整数分频合成器的参考频率 200 kHz。要输出 902.4 MHz，分频比 $N$ 应设为多少？
          answer: 4512
          tolerance: 0.001
          hint: 输出频率是参考频率的几倍？
          explain: $N = 902.4\ \text{MHz}/200\ \text{kHz} = 4512$。下一个信道 902.6 MHz 对应 $N = 4513$。
      - card:
          title: 步进小的代价
          body: |
            信道间隔小，参考频率就得低，环路带宽（不超过参考频率的约十分之一）也只能很窄，于是建立时间长、对压控振荡器噪声的纠正范围窄；同时 $N$ 很大，带内参考噪声要加 $20\lg N$。另外电荷泵的失配和漏电流让控制电压每个参考周期抖一下，在输出频率两侧 $\pm f_\text{REF}$ 处产生杂散，叫参考杂散，环路滤波器要把它压下去。这些都是整数分频结构的局限。
      - item:
          id: integer-n-limit
          type: choice
          prompt: 一个整数分频合成器要做 25 kHz 的信道间隔。它的环路带宽最多大约是多少？带来什么后果？
          options:
            - text: 约 2.5 kHz；建立时间长，压控振荡器的噪声大部分得不到纠正
              correct: true
            - text: 约 250 kHz；建立很快
              why: 环路带宽要比参考频率低得多（约十分之一以下），不能比 25 kHz 的参考频率还高
            - text: 带宽和信道间隔无关，可以随意取
              why: 环路每个参考周期才比较一次，带宽必须远低于参考频率，信道间隔就是参考频率
          explain: 参考频率等于信道间隔 25 kHz，带宽约 2.5 kHz 以下。带宽窄，切换频率要等很久，带宽外的压控振荡器噪声也直接出现在输出。让平均分频比可以是小数，就能解开这个矛盾。
      - card:
          title: 分频器和双模预分频
          body: |
            压控振荡器工作在吉赫，普通的可编程计数器跑不了那么快。办法是先用一个只能做固定分频、但速度很快的**双模预分频器（dual-modulus prescaler）**，它能在 $P$ 和 $P + 1$ 两种分频比之间切换，后面接两个低速计数器（吞脉冲计数器）。一个周期里先按 $P + 1$ 分频 $A$ 次，再按 $P$ 分频 $B - A$ 次，总分频比
            $$N = (P + 1)A + P(B - A) = PB + A$$
            要求 $A \le B$。
      - card:
          title: 例题：用 8/9 预分频得到 N = 100
          body: 预分频器可选 8 或 9 分频（$P = 8$），要得到总分频比 100。$B$、$A$ 各取多少？
          reveal:
            - title: 第 1 步：用除法拆开
              body: $100 = 8\times12 + 4$，所以 $B = 12$，$A = 4$。
            - title: 第 2 步：检查条件
              body: $A = 4 \le B = 12$，满足。
            - title: 第 3 步：验证
              body: 先 9 分频 4 次（36 个周期），再 8 分频 8 次（64 个周期），共 100 个输入周期输出一个脉冲。
      - item:
          id: pulse-swallow
          type: number
          prompt: 双模预分频器 $P = 16$（16/17 分频），吞脉冲计数器设 $B = 60$、$A = 7$。总分频比是多少？
          answer: 967
          tolerance: 0.001
          hint: 一个周期里先按 $P + 1$ 分频几次、再按 $P$ 分频几次？一共数了多少个输入周期？
          explain: $16\times60 + 7 = 967$。$A$ 每加 1，分频比加 1，所以能得到连续的整数分频比。
      - item:
          id: why-prescaler
          type: choice
          prompt: 为什么合成器的分频器前面要加一个双模预分频器，而不直接用可编程计数器？
          options:
            - text: 可编程计数器跑不到吉赫；预分频器结构简单、速度快，先把频率降下来
              correct: true
            - text: 预分频器能提高输出频率
              why: 预分频器只做分频，输出频率由 $Nf_\text{REF}$ 决定；它的作用是让后面的计数器能跟上速度
            - text: 预分频器能减小参考杂散
              why: 参考杂散来自电荷泵的失配和漏电；预分频器解决的是分频器的速度问题
          explain: 只有预分频器工作在压控振荡器的全速上，它只需在两个固定的分频比之间切换，容易做快；后面的计数器只要跑在 $1/P$ 的频率上。
  - id: fractional-n-dds
    chapter: 锁相环与频率合成
    title: 小数分频和直接数字频率合成
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 参考频率 26 MHz，分频器只能整数分频。如果一部分时间除以 92、一部分时间除以 93，输出频率会怎样？
          options:
            - text: 相当于除以一个小数，输出在两者之间
              correct: true
            - text: 输出在 92 × 26 MHz 和 93 × 26 MHz 之间来回跳
              why: 环路滤波器是低通的，跟不上每个周期的切换，它响应的是平均分频比，输出稳定在两者之间
            - text: 环路锁不住
              why: 分频比在两个相邻整数之间切换时，环路看到的是平均值，可以正常锁定
          explain: 环路只对平均的相位误差有反应，平均分频比是个小数，输出频率就等于这个小数乘参考频率。这样参考频率可以很高，步进却可以很细。
      - card:
          title: 小数分频
          body: |
            让分频比在 $N$ 和 $N + 1$ 之间按比例切换，平均分频比 $N + \alpha$（$0 \le \alpha < 1$），输出
            $$f_\text{out} = (N + \alpha)f_\text{REF}$$
            这叫**小数分频合成器（fractional-N synthesizer）**。参考频率可以取得很高（如 26 MHz），环路带宽也能宽，步进由 $\alpha$ 的精度决定，可以细到赫兹以下。代价是分频比的切换本身会在控制电压上留下周期性的误差。
      - item:
          id: frac-out
          type: number
          prompt: 小数分频合成器的参考频率 26 MHz，60% 的时间除以 92、40% 的时间除以 93。输出频率是多少兆赫？保留一位小数。
          answer: 2402.4
          tolerance: 0.05
          unit: MHz
          hint: 平均分频比是多少？
          explain: 平均分频比 $0.6\times92 + 0.4\times93 = 92.4$，$f_\text{out} = 92.4\times26 = 2402.4$ MHz。
      - card:
          title: 随机化和噪声整形
          body: |
            如果按固定的规律切换（比如每 5 个周期里 2 次除以 93），控制电压上的误差是周期性的，输出两侧会出现杂散，叫小数杂散。办法是用 Σ-Δ 调制器决定每个周期除以几：它产生的分频比序列平均值仍是 $N + \alpha$，但误差被打散成噪声，而且被推到离载波较远的频偏上（噪声整形），那里的噪声再由锁相环的低通滤波器滤掉。Σ-Δ 调制器的阶数越高，近处的噪声越低，环路滤波器也要更陡。
      - item:
          id: why-sigma-delta
          type: choice
          prompt: 小数分频合成器为什么常用 Σ-Δ 调制器来决定每个周期的分频比，而不是按固定规律切换？
          options:
            - text: 固定规律的切换会产生周期性误差和杂散；Σ-Δ 把误差打散，并推到环路能滤掉的远处频偏
              correct: true
            - text: Σ-Δ 调制器能让平均分频比变成整数
              why: 平均分频比仍是需要的 $N + \alpha$；Σ-Δ 改变的是误差的频谱分布
            - text: Σ-Δ 调制器让环路不需要滤波器
              why: 恰好相反，被推到远处的噪声要靠环路滤波器滤掉，滤波器的阶数还要和 Σ-Δ 的阶数相配
          explain: 周期性的误差在频谱上集中成一根根杂散线；随机化后变成平滑的噪声，再经整形挪到高频偏，锁相环的低通特性把它压下去。
      - card:
          title: 直接数字频率合成
          body: |
            **直接数字频率合成（DDS）**不用振荡器跟踪，而是直接“算”出波形：一个 $N$ 位的相位累加器每个时钟加上一个频率控制字 $M$，溢出就回绕；用累加器的高位去查正弦表，再经数模转换器和低通滤波器输出。输出频率和分辨率是
            $$f_\text{out} = \frac{M}{2^N}f_\text{clk},\qquad \Delta f = \frac{f_\text{clk}}{2^N}$$
            它切换频率几乎是瞬间的、分辨率极细；输出频率受奈奎斯特采样定理限制，最高不到时钟的一半，实际常用到约 40%。
      - item:
          id: dds-out
          type: number
          prompt: 一个直接数字频率合成器的时钟 100 MHz，相位累加器 32 位，频率控制字 $M = 2^{28}$。输出频率是多少兆赫？保留两位小数。
          answer: 6.25
          tolerance: 0.001
          unit: MHz
          hint: $M/2^{32}$ 是多少？
          explain: $2^{28}/2^{32} = 1/16$，$f_\text{out} = 100/16 = 6.25$ MHz。分辨率 $100\ \text{MHz}/2^{32} = 0.023$ Hz。
      - item:
          id: dds-limit
          type: choice
          prompt: 时钟 100 MHz 的直接数字频率合成器，为什么不能输出 80 MHz 的正弦？
          options:
            - text: 每个周期至少要两个以上的采样点，输出频率最高不到时钟频率的一半
              correct: true
            - text: 相位累加器的位数不够
              why: 位数决定的是频率分辨率；最高频率受采样定理限制，和位数无关
            - text: 正弦表里没有 80 MHz 这一项
              why: 正弦表存的是一个周期的波形，任何频率都是用不同的步长去查它；限制来自采样
          explain: 直接数字频率合成本质上是对正弦采样再重建。按奈奎斯特采样定理，输出频率必须低于时钟的一半，80 MHz 会混叠到 20 MHz。
  - id: receivers
    chapter: 射频收发机结构
    title: 接收机结构
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 早期收音机直接在电台频率上放大和选台，换台时几级调谐回路要一起调，很难同步。超外差接收机先把所有电台都变到同一个固定的中频上。最大的好处是什么？
          options:
            - text: 选台的滤波和主要的放大都在固定的中频上做，回路不必跟着调，选择性和增益都容易做好
              correct: true
            - text: 中频比电台频率高，信号更强
              why: 中频通常比电台频率低（如 465 kHz、10.7 MHz）；好处是频率固定，不是更高
            - text: 不再需要本振
              why: 超外差恰恰要靠本振把信号搬到中频；换台时只调本振
          explain: 换台只调本振，让要收的电台总落在同一个中频上。中频固定，就能用高 Q 的固定滤波器选台、用多级放大器稳定地放大。
      - card:
          title: 超外差接收机
          body: |
            **超外差接收机（superheterodyne receiver）**的信号路径：天线 → 射频滤波器（挡住镜像和带外干扰）→ 低噪声放大器 → 混频器（本振可调）→ 中频滤波器（选出一个信道）→ 中频放大器 → 解调器。它的两个基本问题都来自混频：镜像要靠混频前的滤波器挡，中频的高低决定了镜像抑制和信道选择之间的折中。要求高时用两次变频：第一中频取高，便于挡镜像；第二中频取低，便于选信道。
      - item:
          id: fm-image
          type: number
          prompt: 一台调频收音机的中频 10.7 MHz，用高本振，正在收 95.0 MHz 的电台。镜像频率是多少兆赫？保留一位小数。
          answer: 116.4
          tolerance: 0.05
          unit: MHz
          hint: 本振是多少？镜像在本振另一侧多远？
          explain: 本振 $95.0 + 10.7 = 105.7$ MHz，镜像 $105.7 + 10.7 = 116.4$ MHz，比信号高 $2\times10.7 = 21.4$ MHz。它落在调频频段（88–108 MHz）之外，射频滤波器容易挡掉。
      - card:
          title: 零中频接收机
          body: |
            让本振频率等于信号频率，信号直接被搬到零频附近，叫**零中频接收机（zero-IF receiver）**，也叫直接变频。要用两个混频器，本振一路是余弦、一路是正弦（正交本振），得到 I、Q 两路基带信号，才能分清原来在载波上方和下方的成分。它没有镜像问题，也不需要片外的中频滤波器，最适合集成。问题有：本振漏到射频口、又和自己混频，产生直流失调；信号落在零频附近，闪烁噪声大；I、Q 两路的增益和相位失配；偶次非线性也会把强干扰变成低频干扰。
      - item:
          id: zero-if-dc
          type: choice
          prompt: 零中频接收机输出端出现了一个不随信号变的直流电压，可能淹没信号。最常见的原因是什么？
          options:
            - text: 本振泄漏到混频器的射频口，和本振自己相乘，混出了直流
              correct: true
            - text: 镜像频率上有干扰
              why: 零中频的镜像就是信号自己的另一半频谱，靠 I、Q 两路分开；直流失调来自本振的自混频
            - text: 低噪声放大器的增益太高
              why: 增益高会放大一切，但直流本身是本振和自己的泄漏相乘产生的
          explain: 两个同频正弦相乘，差频是零，就是一个直流。本振从混频器的本振口漏到射频口（或被反射回来），就会和自己混出直流，直接落在信号上。
      - card:
          title: 低中频和镜像抑制接收机
          body: |
            为了避开零频附近的直流失调和闪烁噪声，可以把中频取得很低（几百千赫到几兆赫），叫低中频。可这样镜像离信号太近，滤波器挡不住，要靠电路把它抵消：**镜像抑制接收机（image-reject receiver）**用正交本振得到 I、Q 两路，其中一路再移相 90°，两路相加时信号同相相加、镜像反相抵消（Hartley 结构）。两路的增益失配 $\varepsilon$ 和相位误差 $\theta$（弧度）都很小时，镜像抑制比约为
            $$\text{IRR} \approx \frac{4}{\varepsilon^2 + \theta^2}$$
      - item:
          id: irr
          type: number
          prompt: 镜像抑制接收机两路的增益失配 1%（$\varepsilon = 0.01$），相位误差 1°。按 $\text{IRR} \approx 4/(\varepsilon^2 + \theta^2)$，镜像抑制比约是多少分贝？保留到个位。
          answer: 40
          tolerance: 0.5
          unit: dB
          hint: 1° 是多少弧度？
          explain: $\theta = 0.0175$ rad，$\theta^2 = 3.05\times10^{-4}$，$\varepsilon^2 = 10^{-4}$，$\text{IRR} = 4/(4.05\times10^{-4}) \approx 9900$，即约 40 dB。实际电路一般只能做到 30 到 40 dB，要求更高时还得配合滤波。
      - item:
          id: architecture-choice
          type: choice
          prompt: 手机芯片希望尽量少用片外元件。三种结构里，哪一种最适合全部做在一块芯片上？
          options:
            - text: 零中频接收机，因为不需要片外的中频滤波器和镜像抑制滤波器
              correct: true
            - text: 超外差接收机，因为它的选择性最好
              why: 超外差选择性好，但要高 Q 的中频滤波器和镜像抑制滤波器，通常只能做在片外
            - text: 低中频接收机，因为中频最低、最容易集成
              why: 低中频的镜像离信号很近，要靠镜像抑制结构，I、Q 失配限制了抑制比；零中频没有镜像问题，信道选择只用片上低通滤波器
          explain: 零中频的信道选择在基带上用低通滤波器完成，容易集成，也没有镜像问题；代价是直流失调、闪烁噪声和 I、Q 失配，要靠电路和数字校准解决。
  - id: transmitters
    chapter: 射频收发机结构
    title: 发射机结构和指标
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 零中频接收机把射频直接搬到基带。发射机能不能反过来，把基带的 I、Q 信号直接搬到射频再放大？
          options:
            - text: 能，这就是直接变频发射机，但要防着功放的大信号反过来干扰同频的振荡器
              correct: true
            - text: 不能，发射机必须先变到中频
              why: 直接变频发射机在手机里很常用；它的问题是功放输出和振荡器同频，容易互相牵引，不是做不到
            - text: 能，而且没有任何问题
              why: 功放输出的大功率信号和压控振荡器频率相同，会经衬底、电源耦合回去把振荡器拉偏，这是直接变频发射机的主要问题
          explain: 直接变频发射机结构最简单。可功放输出的强信号和本振同频，漏回压控振荡器后会把它的频率拉偏，叫注入牵引。
      - card:
          title: 直接变频发射机
          body: |
            基带的 I、Q 两路分别乘上余弦和正弦本振，相加后得到射频信号，这叫正交调制器；后面接功率放大器。为了避免注入牵引，常让压控振荡器工作在两倍（或别的倍数）频率上，再分频得到本振，这样功放输出和振荡器不在同一个频率。I、Q 两路失配和本振泄漏会在输出里留下镜像和载波泄漏。
      - card:
          title: 两步变频和极坐标发射机
          body: |
            两步变频：先把基带搬到一个中频，再搬到射频。在较低的中频上 I、Q 匹配更容易做好，本振和功放频率也不同，没有注入牵引；代价是多一个本振和一些滤波器，用来去掉第二次混频产生的另一个边带。极坐标发射机：把信号拆成包络和相位，相位部分驱动压控振荡器（或调相），再交给高效率的开关类功放，包络去调功放的电源电压，和包络消除与恢复的思路相同。
      - item:
          id: two-step-lo
          type: number
          prompt: 两步变频发射机先把基带搬到 400 MHz 的中频，再用低于射频的第二本振把它搬到 2400 MHz。第二本振是多少兆赫？
          answer: 2000
          tolerance: 0.001
          unit: MHz
          hint: 上变频取和频，中频加本振等于什么？
          explain: $400 + f_\text{LO2} = 2400$，$f_\text{LO2} = 2000$ MHz。混频同时产生的 1600 MHz 差频要用滤波器滤掉。
      - item:
          id: pulling
          type: choice
          prompt: 直接变频发射机里，为什么常让压控振荡器工作在两倍载波频率上再二分频，而不是直接工作在载波频率上？
          options:
            - text: 功放输出的强信号在载波频率上，振荡器不在这个频率，就不容易被它牵引
              correct: true
            - text: 两倍频率的振荡器相位噪声更低
              why: 同样设计下频率越高相位噪声越大；二分频虽能降低 6 dB，但主要目的是避开注入牵引
            - text: 二分频能把输出功率加倍
              why: 分频器只改变频率，不提供功率；输出功率由功放决定
          explain: 功放输出几百毫瓦到瓦级，经衬底、电源、键合线耦合回压控振荡器。频率不同时耦合进来的信号对振荡器影响小得多，二分频还顺带给出了正交本振。
      - card:
          title: 发射机的指标
          body: |
            发射机除了输出功率和效率，还要看信号质量和对别人的干扰。**邻道泄漏比（ACPR）**：发射信号的功率和漏到相邻信道里的功率之比，用 dB 表示，主要由功放的非线性决定。**误差矢量幅度（EVM）**：实际发出的调制点和理想位置之差的有效值，除以理想信号的幅度，反映失真、噪声、I/Q 失配加在一起的影响。此外还要满足频谱模板（各频偏处的发射功率上限）和谐波、杂散的限值。
      - item:
          id: acpr
          type: number
          prompt: 一台发射机在本信道输出 20 dBm，在相同的测量带宽内测得漏到相邻信道的功率是 −25 dBm。邻道泄漏比是多少分贝？
          answer: 45
          tolerance: 0.001
          unit: dB
          hint: 用 dBm 表示时，功率之比变成了什么运算？
          explain: $20 - (-25) = 45$ dB，常写成 −45 dBc。功放回退得越多，非线性越小，邻道泄漏比越好，但效率越低。
      - item:
          id: evm
          type: number
          prompt: 一台发射机的误差矢量幅度是 5%。换成分贝是多少？保留一位小数。
          answer: -26.0
          tolerance: 0.05
          unit: dB
          hint: EVM 是幅度之比，换成分贝乘 20 还是 10？
          explain: $20\lg0.05 = -26.0$ dB。调制越复杂（星座点越密），要求的误差矢量幅度越小。
boss:
  items:
    - id: b-q
      type: number
      prompt: 并联谐振回路 $L = 1\ \mu$H，$C = 100$ pF，并联等效电阻 10 kΩ。品质因数是多少？
      answer: 100
      tolerance: 0.001
      hint: 谐振时电感的电抗 $\omega_0L$ 是多少？并联回路的 Q 是谁除以谁？
      explain: $\omega_0L = \sqrt{L/C} = \sqrt{10^{-6}/10^{-10}} = 100\ \Omega$，$Q = R/(\omega_0L) = 10^4/100 = 100$。谐振频率 $1/(2\pi\sqrt{LC}) = 15.9$ MHz。
    - id: b-bw
      type: number
      prompt: 并联谐振回路 $L = 1\ \mu$H，$C = 100$ pF，并联等效电阻 10 kΩ。3 dB 带宽是多少千赫？保留到个位。
      answer: 159
      tolerance: 0.5
      unit: kHz
      hint: 先求谐振频率和品质因数。
      explain: $f_0 = 15.9$ MHz，$Q = 100$，带宽 $f_0/Q = 159$ kHz。
    - id: b-loaded-q
      type: number
      prompt: 并联谐振回路 $L = 1\ \mu$H，$C = 100$ pF，并联等效电阻 10 kΩ。在回路两端直接并上一个 1 kΩ 的负载，有载品质因数约是多少？保留一位小数。
      answer: 9.1
      tolerance: 0.05
      hint: 两端的总电阻变成多少？谐振时电感的电抗是多少？
      explain: 总电阻 $10\parallel1 = 0.909$ kΩ，$Q_L = 909/100 = 9.1$，带宽宽到约 1.75 MHz，选择性大大变差。改用部分接入，负载折算到回路两端是 $R_L/p^2$，影响就小得多。
    - id: b-stages
      type: number
      prompt: 三级相同的单回路调谐放大器同步调谐，每级的 3 dB 带宽 250 kHz。总的 3 dB 带宽约是多少千赫？保留到个位。
      answer: 127
      tolerance: 0.5
      unit: kHz
      hint: 三级都在单级的 3 dB 频率上降到 0.707，总的降到多少？要让总的只降到 0.707，频偏得往回收到多少？
      explain: 缩小倍数 $\sqrt{2^{1/3} - 1} = 0.510$，$250\times0.510 = 127$ kHz。级数越多，总增益越大、总带宽越窄。
    - id: b-gain-bw
      type: choice
      prompt: 一个单回路调谐放大器，回路电容和晶体管跨导不变，把有载品质因数调成原来的两倍。谐振增益和 3 dB 带宽怎样变？
      options:
        - text: 增益和带宽都变成两倍
          why: 带宽是 $f_0/Q_L$，Q 加倍带宽减半；增益和带宽的乘积保持 $g_m/(2\pi C_\Sigma)$ 不变
        - text: 增益不变，带宽减半
          why: 增益 $g_mR_\Sigma$ 里的 $R_\Sigma = Q_L/(\omega_0C_\Sigma)$ 随 Q 加倍，增益也加倍
        - text: 增益加倍，带宽减半
          correct: true
        - text: 增益减半，带宽加倍
          why: 这是把 Q 减半的结果；Q 加倍时回路电阻变大，增益变大、带宽变窄
      explain: $R_\Sigma = Q_L/(\omega_0C_\Sigma)$，增益 $g_mR_\Sigma$ 和 $Q_L$ 成正比，带宽 $f_0/Q_L$ 和它成反比，两者之积不变。
    - id: b-pmax
      type: number
      prompt: 高频功率放大器的电源 12 V，负载 50 Ω，集电极电压理想地摆到电源电压。最大输出功率约是多少瓦？保留两位小数。
      answer: 1.44
      tolerance: 0.005
      unit: W
      hint: 正弦电压的峰值是多少？功率怎么算？
      explain: $P = V_{CC}^2/(2R_L) = 144/100 = 1.44$ W。
    - id: b-class-c
      type: choice
      prompt: 丙类功率放大器的集电极为什么一定要接谐振回路？
      options:
        - text: 谐振回路能把效率提高到 100%
          why: 效率由导通角和电压利用系数决定；回路的作用是从脉冲电流里取出基波
        - text: 电流是脉冲，回路取出基波
          correct: true
        - text: 谐振回路给晶体管提供偏置电压
          why: 偏置由直流电路提供；回路是交流负载，用来选出基波
        - text: 谐振回路让晶体管的导通角变成 360°
          why: 导通角由偏置和激励决定，丙类本来就不到 180°；回路不改变导通角
      explain: 丙类只导通不到半个周期，电流含有直流和大量谐波。回路调谐在基波上，基波电压大、谐波电压很小，输出就是干净的正弦。
    - id: b-colpitts
      type: number
      prompt: 电容三点式（考毕兹）振荡器 $C_1 = C_2 = 400$ pF，$L = 1\ \mu$H，不计晶体管的电容。振荡频率约是多少兆赫？保留一位小数。
      answer: 11.3
      tolerance: 0.05
      unit: MHz
      hint: 两个电容是怎样参加谐振的？
      explain: $C = 400\times400/800 = 200$ pF，$f_0 = 1/(2\pi\sqrt{10^{-6}\times2\times10^{-10}}) = 11.3$ MHz。
    - id: b-start
      type: choice
      prompt: 反馈型 LC 振荡器的起振条件，下面哪种说法对？
      options:
        - text: 环路增益大于 1，相移为 360° 的整数倍
          correct: true
        - text: 环路增益等于 1 就能起振，大于 1 反而会让波形失真
          why: 环路增益等于 1 只能维持已有的振荡；起振时信号极小，必须大于 1 才能长大
        - text: 起振要环路相移为 180°，相当于负反馈
          why: 环路相移 180° 是负反馈，振荡会被抑制；要求的是 360° 的整数倍
        - text: 只要放大器自身的增益大于 1 就能起振，与反馈无关
          why: 要看的是环路增益 $AF$；反馈系数小时，放大器增益大于 1 也不一定够
      explain: 巴克豪森判据是平衡条件 $|AF| = 1$、相移 $2n\pi$；起振要 $|AF| > 1$。幅度长大后放大器进入非线性，平均增益下降，环路增益自动回到 1。
    - id: b-image
      type: number
      prompt: 超外差接收机接收 100 MHz 的信号，本振 110.7 MHz。镜像频率是多少兆赫？保留一位小数。
      answer: 121.4
      tolerance: 0.05
      unit: MHz
      hint: 中频是多少？镜像在本振的哪一侧？
      explain: 中频 $110.7 - 100 = 10.7$ MHz，镜像在本振另一侧 10.7 MHz 处：121.4 MHz。镜像和本振混频后同样落在 10.7 MHz，混频后无法区分，只能在射频前端用滤波器挡住。
    - id: b-mixer-gain
      type: number
      prompt: 单平衡有源混频器的跨导 20 mS，每边负载 400 Ω，开关管理想地换向。电压转换增益是多少倍？保留两位小数。
      answer: 5.09
      tolerance: 0.005
      hint: 开关换向相当于乘以什么波形？它的基波幅度是多少？
      explain: 换向相当于乘以 $\pm1$ 的方波，基波幅度 $4/\pi$，取差频再乘 $\tfrac12$，转换增益 $(2/\pi)g_mR_L = (2/\pi)\times0.02\times400 = 5.09$，约 14.1 dB。
    - id: b-sb-frac
      type: number
      prompt: 1 MHz 载波振幅 1 V，被 5 kHz 单音调幅，调幅度 0.5。两个边带的功率合起来占总功率的百分之几？保留一位小数。
      answer: 11.1
      tolerance: 0.05
      unit: '%'
      hint: 每个边带的振幅是多少？边带功率占总功率的比例怎么算？
      explain: 边带在 0.995 MHz 和 1.005 MHz，振幅各 $m/2 = 0.25$ V。边带功率占 $m^2/(2 + m^2) = 0.25/2.25 = 11.1\%$。
    - id: b-rc
      type: choice
      prompt: 包络检波器输入载波 $f_c$、调制信号最高 $F$ 的调幅波。负载的时间常数 $RC$ 应怎样选？
      options:
        - text: 远大于载波周期，又小于调制信号周期
          correct: true
        - text: 远小于载波周期，电容才能跟上每个高频周期
          why: $RC$ 太小时电容在每个载波周期里都放电到底，输出带着大量载波纹波，平滑不了
        - text: 越大越好，输出越平滑
          why: $RC$ 太大时包络下降时电容放电跟不上，出现惰性失真
        - text: 正好等于载波周期
          why: 和载波周期相当时输出纹波仍然很大；要远大于载波周期，同时又能跟上包络
      explain: 要平滑掉载波，$RC$ 必须远大于 $1/f_c$；要跟上包络的变化，$RC$ 又要比 $1/F$ 小（不产生惰性失真）。
    - id: b-beta
      type: number
      prompt: 调频信号的最大频偏 75 kHz，最高调制频率 15 kHz。调制指数是多少？
      answer: 5
      tolerance: 0.001
      hint: 调频的调制指数等于哪两个频率之比？
      explain: $\beta = \Delta f/F = 75/15 = 5$。
    - id: b-carson
      type: number
      prompt: 调频信号的最大频偏 75 kHz，最高调制频率 15 kHz。按卡森公式，带宽是多少千赫？
      answer: 180
      tolerance: 0.001
      unit: kHz
      hint: 卡森带宽是哪两个频率之和的两倍？
      explain: $2\times(75 + 15) = 180$ kHz。接收端用鉴频器把瞬时频率的变化变成电压，恢复调制信号。
    - id: b-synth
      type: number
      prompt: 锁相环整数分频频率合成器的参考频率 100 kHz，分频比 $N$ 可以从 1000 调到 1100。输出频率的上限是多少兆赫？
      answer: 110
      tolerance: 0.001
      unit: MHz
      hint: 锁定时输出频率是参考频率的几倍？
      explain: $f_\text{out} = Nf_\text{REF}$，$N = 1100$ 时是 110 MHz；下限 100 MHz，步进等于参考频率 100 kHz。
    - id: b-prescaler
      type: number
      prompt: 频率合成器用 32/33 双模预分频器（$P = 32$），吞脉冲计数器设 $B = 100$、$A = 5$。总分频比是多少？
      answer: 3205
      tolerance: 0.001
      hint: 一个周期里按 33 分频几次、按 32 分频几次？
      explain: 先按 33 分频 5 次、再按 32 分频 95 次：$33\times5 + 32\times95 = 3205$，也就是 $PB + A$。
    - id: b-dds
      type: number
      prompt: 直接数字频率合成器的时钟 80 MHz，相位累加器 32 位，频率控制字 $M = 2^{29}$。输出频率是多少兆赫？
      answer: 10
      tolerance: 0.001
      unit: MHz
      hint: 累加器每个时钟走了一整圈的几分之几？
      explain: 每个时钟走 $2^{29}/2^{32} = 1/8$ 圈，8 个时钟一圈，$f_\text{out} = 80/8 = 10$ MHz，低于时钟的一半，满足采样定理。
    - id: b-zero-if
      type: choice
      prompt: 零中频接收机为什么不需要镜像抑制滤波器？
      options:
        - text: 零中频的中频很高，镜像离信号很远，滤波器容易挡
          why: 零中频的中频是零，不是很高；它的“镜像”就是信号本身在载波另一侧的那一半
        - text: 零中频接收机不用本振
          why: 零中频同样要本振，而且本振频率等于信号频率
        - text: I、Q 两路就能分开信号的两半频谱
          correct: true
        - text: 零中频只是把镜像搬到零频，仍然需要镜像抑制滤波器
          why: 零中频的“镜像”就是信号自己在载波另一侧的那一半，不是别的电台；用 I、Q 两路区分，不需要滤波器
      explain: 本振和信号同频时，载波上下两侧的成分都被搬到零频附近，靠正交本振得到的 I、Q 两路就能区分，所以不存在别的频率上的镜像干扰。
