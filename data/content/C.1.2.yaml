skill: C.1.2
version: 2
authors: [main-agent]
brief:
  why: |
    同一块硅片上的硬件怎么做到每秒吞下几十亿条指令还不算乱结果？从程序员能看见的汇编指令出发，穿过单周期数据通路、五级流水线冒险旁路、乱序精确异常、多级缓存与虚拟内存翻译、多核 MSI 一致性与写缓冲内存序，最后用分支预测器、性能方程与 Amdahl 定律算出到底改哪里才真能提速。
  outcomes:
    - 理解指令集抽象与单周期处理器数据通路，读懂常用 MIPS 运算、访存与条件分支汇编并用 SPIM 实测运行
    - 掌握五级流水线重叠收益，准确识别 load-use 数据冒险（转发后仍需停顿 1 拍）与控制冒险，理解精确异常与乱序执行重排序缓冲
    - 掌握高速缓存（Cache）组相联映射、3C 缺失分类、多级 AMAT 计算，以及虚拟内存多级页表、页命中/缺页与 TLB 快表加速
    - 区分多核私有缓存下的 MSI 写失效一致性（含伪共享成因与行填充对策）与跨地址访存顺序（内存一致性模型）
    - 掌握 2 位饱和分支预测器状态演化、CPU 时间方程比较降频与降 CPI 的实际加速比，以及 Amdahl 串行瓶颈极限
terms:
  - term: 汇编
    def: '与处理器机器指令一对一对应、用英文助记符（如 add、lw、beq）替代 0/1 二进制码的可读低级语言'
  - term: 指令集
    def: '英文简称 ISA，规定软件程序员能看到的寄存器集合、指令格式、寻址方式与异常行为的软硬件契约边界'
  - term: 微体系结构
    def: '在确定指令集契约之下，硬件工程师用触发器、数据通路、流水级与缓存把指令真正跑快跑稳的内部组织方案'
  - term: 数据冒险
    def: '流水线中后面指令迫切要用某寄存器的值，但前面指令还没算完写回寄存器堆而引发的读写先后冲突'
  - term: 控制冒险
    def: '条件跳转指令还没在流水线里算清往哪条路拐弯时，下一拍取指单元就已经提前盲取后续顺序指令导致的走岔冲突'
  - term: 乱序执行
    def: '处理器不死等被卡住的慢指令，优先挑后面操作数已经就绪的独立指令抢跑计算，并在提交端按原程序顺序写回'
  - term: 缓存
    def: '摆在高速 CPU 核心与慢速主存之间、容量较小却极高速的小型硬件记忆体，专门兜住近期最常重用的热数据块'
  - term: 平均访存时间
    def: '简称 AMAT，按“命中用时 + 缺失率 × 缺失额外代价”逐级折算的每次内存读写平均耗时指标'
  - term: 虚拟地址
    def: '操作系统给每个独立运行程序画出来的私有连续内存编号视角，需要经过硬件与页表翻译才能触达物理条'
  - term: 物理地址
    def: '主板真实内存条上实际电路线所指向的唯一硬件存储单元真实编号'
  - term: 页表
    def: '由操作系统维护在内存中、记录每个虚拟页号映射到哪块物理页框及读写执行权限的翻译对照表'
  - term: 多级页表
    def: '把庞大平面页表拆成树形目录按需分配层级表项，只为程序真正在用的内存区域开辟索引从而大幅省下页表内存'
  - term: 缺页
    def: '程序访问某合法虚拟页时发现它暂时不在物理内存条里（被换出或尚未分配），触发系统暂停加载后再无缝恢复的事件'
  - term: TLB
    def: '页表项专用的微型高速硬件快表（Translation Lookaside Buffer），避免每次读写数据都要额外先慢吞吞去主存查页表'
  - term: 缓存一致性
    def: '多核各自带私有缓存时，保证所有核心只要盯住同一个物理内存地址，最终绝不会读出互相打架的陈旧过期副本的硬件协议'
  - term: 内存一致性模型
    def: '规定多核并发执行各自读写不同内存位置时，一个核心做的修改以什么合法可见顺序被别的核观察到的全局架构规则'
  - term: 分支预测
    def: '在跳转指令还没算出到底跳不跳之前，硬件靠历史规律提前押注一条方向喂进流水线不停顿取指的猜测技术'
  - term: CPI
    def: 'Cycles Per Instruction，平均每执行一条指令消耗掉的处理器时钟周期数'
  - term: 阿姆达尔定律
    def: '定量揭示系统局部优化后整体加速比极限的公式：无论把可加速部分提多快，总提速永远被没被加速的串行瓶颈封死上限'
assumes: [二进制, 地址, 内存, 字节]

lessons:
  # ==== 指令集 ====
  - id: isa
    chapter: 指令集
    title: ISA 软硬件契约、MIPS 指令格式与 SPIM 汇编实操
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            同一款 `MIPS`（或 RISC-V）处理器规范，厂商今年用便宜低功耗的 1 核慢方案造芯片，明年又用多级超快新结构造出十倍速新品，但手机里造好封装的老机器码程序居然**一行不改就能在新芯片上直接跑出完全相同的结果**！这靠的是哪一层抽象契约？
          options:
            - text: '**指令集（ISA）**把软件能见的寄存器与每条指令语义稳稳固定下来，内部硬件实现（微体系结构）怎么改朝换代都对软件透明！'
              correct: true
            - text: 新芯片在运行前必须先拿到原程序的高级语言代码重新翻译生成一遍
              why: 只要两代芯片遵守同一套公开指令集约定，已有的二进制机器码无需重新生成就能直接运行
            - text: 新旧芯片内部的晶体管数量、电路连线和时钟频率必须完全一模一样
              why: 固定不变的是对软件公开的指令集契约，底下的硬件电路结构可以自由重造来提速或省电
          explain: |
            这正是计算机体系结构第一块基石：**指令集（ISA）与微体系结构的彻底分离**！
      - card:
          title: '**指令集（ISA）**、**汇编**与数据存放在哪'
          body: |
            - **指令集（Instruction Set Architecture, ISA）**：软硬件之间的接口契约，规定程序员能操作的寄存器个数位宽、指令怎么编码以及每条指令改写哪块状态；
            - **汇编（Assembly）**：给机器码贴上易懂的英文助记符，例如 `add $t0, $t1, $t2` 表示把 `$t1` 与 `$t2` 相加放进 `$t0`；
            - **Load / Store 架构的数据放哪？**：算术全在 CPU 内部极少极快的 **32 个通用寄存器** 间完成（MIPS 常见 `$t0~$t9` 暂存、`$s0~$s7` 持久变量）；庞大数据放在主内存里，只能靠专门的 `lw`（载入）与 `sw`（存回）搬运！
          reveal:
            - title: MIPS 三类指令、字节寻址偏移与一段能在 `spim` 真跑起来的完整程序
              body: |
                MIPS 把常用操作分成 **R 型**（寄存器运算如 `add`）、**I 型**（带立即数/偏移如 `addi`、`lw`、`sw`、`beq`）与 **J 型**（大跨度跳转 `j`）。记住主内存按**字节**编号，1 个字（Word）占 `4` 字节，所以读取第 `k` 个整数偏移要写 `4*k`！（测试脚本给下段程序附加 `syscall` 输出指令后，已在 `spim` 实测打印 `13` 与 `17`）：
                ```asm
                .data
                values: .word 100, 17, 29
                .text
                .globl main
                main:
                  li $t1, 8
                  li $t2, 5
                  add $t0, $t1, $t2
                  la $s0, values
                  lw $t3, 4($s0)
                ```
            - title: 为什么现代 ISA 偏爱 Load/Store（仅 `lw/sw` 碰内存）而不允许 `add` 直接去主存相加？
              body: |
                因为读主存比读 CPU 内部寄存器慢上百倍！把算术指令统一规定死成“只准操作紧挨 ALU 的 32 个高速寄存器”，既能把指令长度整齐固定为 `32` 比特、译码电路无比简单高速，又能迫使程序尽可能把热数据留在寄存器里飞快连算几十步再存回主存；这也正是 MIPS/RISC-V 保持 `add rd, rs, rt` 规整写法的精髓。
      - item:
          id: mips-add-run
          type: number
          prompt: |
            已知寄存器 `$t1 = 8`、`$t2 = 5`，执行 MIPS 汇编算术指令 `add $t0, $t1, $t2` 后，目标寄存器 `$t0` 里面存放的整数结果是多少？
          answer: 13
          hint: '`add` 指令按第一个参数为目标、后两个相加来执行算术求和。'
          explain: |
            `add` 把 `$t1 + $t2 = 8 + 5 = 13` 写入最左侧目标寄存器 `$t0`（用 `spim` 实际运行，打印出 `13`）。
      - item:
          id: lw-byte-offset
          type: number
          prompt: |
            一段 MIPS 内存中从基地址 `$s0 = 100` 开始连续存放三个 32 位整数 `.word 100, 17, 29`（每个字占 4 字节：第 0 个在 `100..103`，第 1 个在 `104..107`，第 2 个在 `108..111`）。执行 `lw $t0, 8($s0)` 时，指令实际去读取哪一个字节起始地址？
          answer: 108
          hint: '用基址寄存器里的数值直接加上指令左边的字节偏移量立即数。'
          explain: |
            有效访存地址 = `$s0 + 偏移 = 100 + 8 = 108`（读出第 2 个元素 `29`；若是 `4($s0)` 则读取 `104` 即元素 `17`！）。
      - item:
          id: mips-types-match
          type: match
          prompt: |
            把四条代表性 MIPS 汇编指令跟它们各自在处理器上的行为配对起来。
          pairs:
            - ["`add $t0, $t1, $t2`", "R 型算术：把两个寄存器相加后写回目标寄存器 `$t0`"]
            - ["`lw $t0, 4($s0)`", "I 型载入：把基址 `$s0` 加字节偏移 4 处的主存字取回 `$t0`"]
            - ["`sw $t0, 4($s0)`", "I 型存储：把寄存器 `$t0` 里的值写回主存指定偏移地址"]
            - ["`beq $t0, $t1, Loop`", "I 型条件跳：比较两寄存器相等就跳转往目标标签继续取指"]
          explain: |
            所有规整 RISC/MIPS/RISC-V 核心都遵从“只有 `lw/sw` 碰内存，其余计算全在寄存器间飞奔”的 Load/Store 简洁纪律！
      - item:
          id: isa-vs-uarch
          type: choice
          prompt: |
            同一条指令集规范下，低端节能芯按“一次一拍慢吞吞串着干”，高端服务器芯按“多级流水 + 乱序并行”飞快干。这两者的区别在体系结构行话里怎么称呼？
          options:
            - text: '对程序员公开不变的规范叫**指令集（ISA）**；底下可自由升级改造性能的具体硬件组织叫**微体系结构**'
              correct: true
            - text: 两者必须彻底焊死成完全不可区分的同一样东西
              why: 微体系结构决定能跑多快、耗多少电，只要严格保证外部等价效果符合 ISA，芯片微结构随时可以推倒重来
            - text: 只要改了微结构，所有用 C 语言编好的旧程序都必然报错跑不动
              why: 恰恰相反，ISA 抽象层保护了软件兼容生态不受底层硬件升级破坏
          explain: |
            这就是为什么你能把十年前编写的程序直接装进全新一代处理器运行而且立刻跑得更飞快！

  - id: datapath
    chapter: 指令集
    title: 微体系结构 RTL 设计、单周期数据通路与关键路径计算
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一台号称“每条指令都在**整整 1 个超大时钟周期**里全部干完”的单周期 CPU 里：算一条简单寄存器 `add` 指令只需要 `2 ns`，但读内存指令 `lw` 必须一路走完取指、算地址、找主存再写回一共花整整 `18 ns`。所有指令共用同一个固定不变的系统时钟周期时，每拍长度不得不少于几纳秒？
          options:
            - text: 至少 `18 ns`！因为固定时钟必须迁就全芯片**耗时最长的那一条指令**（即读内存指令 `lw`）
              correct: true
            - text: 只按最快那条算 `2 ns`，`lw` 走不完就让它半路自生自灭算错
              why: 时钟必须等最慢指令彻底稳妥走完全部电路并在沿到来前站稳，否则一旦采到半途错误值程序立刻崩溃
            - text: 按 `2 + 18 = 20 ns` 算所有指令平均值减一半 = 10 ns
              why: 最慢通路如果 10 ns 还没到达写回建立窗，遇到那条指令必出致命时序错误
          explain: |
            理解单周期处理器内部怎么靠 **RTL（寄存器传输级）** 连线走完一条指令，以及为什么“迁就最慢指令”逼出了后来的流水线革命！
      - card:
          title: '微体系结构 RTL 数据通路：一条指令走完哪五段路？'
          body: |
            芯片内部的硬件具体实现组织叫 **微体系结构**。单周期把每条指令拆成五个接力站，靠控制线与多路器拨通：
            1. **取指（IF）**：用 `PC` 取指令，并顺手算好 `PC + 4`；
            2. **译码（ID）**：从寄存器堆读出两个源操作数；
            3. **执行（EX）**：ALU 算加减、`lw/sw` 有效地址或比较；
            4. **访存（MEM）**：仅 `lw`/`sw` 读写数据存储器；
            5. **写回（WB）**：写入目标寄存器。
          reveal:
            - title: 为什么 `lw` 总是决定单周期芯片的最高频率天花板？
              body: |
                做 RTL 级关键路径核算：假设指令存储 4 ns + 译码读寄存器 2 ns + ALU 算地址 3 ns + 数据内存读取 6 ns + 写回路径 3 ns，**`lw` 必须完整穿完所有 5 段总计 `4+2+3+6+3 = 18 ns`**！而 `add` 不经过耗时的内存读只需要 `12 ns`，却也傻等着 `18 ns` 凑满一拍才敢发下一条——极度浪费！
            - title: 控制单元在单周期里怎么“一键切换”整张电路的信号流向？
              body: |
                所有指令共用一块 ALU 和一套寄存器堆，靠控制译码输出的几根 `0/1` 控制线在路口拨转多路选择器（MUX）：读 `add` 时让 ALU 第二个入口选“寄存器 `rt`”、写回口选“ALU 结果”；读 `lw` 时立刻把 ALU 第二个入口拨成“指令里符号扩展后的偏移立即数”、把写回口拨向“数据内存输出端”！把这整套接力按阶段切成等拍同步流水级，才能摆脱被最慢 `lw` 拖死时钟周期的困境。
      - item:
          id: single-cycle-lw-ns
          type: number
          prompt: |
            一块单周期处理器的各站延迟如下：取指令 `4 ns`、译码读寄存器 `2 ns`、ALU 运算 `3 ns`、数据访存 `6 ns`、写回建立 `3 ns`。算一下必须串联穿遍这全部五步的最慢指令 `lw` 总延迟是多少纳秒（决定了最短时钟周期）？
          answer: 18
          hint: '将五步必需环节耗时顺次直接加起来即可（`lw` 一步都不能跳过）。'
          explain: |
            $4 + 2 + 3 + 6 + 3 = 18\text{ ns}$！这意味着无论其它简单指令多快，单周期芯片的最高主频被死死按在 $1000 / 18 \approx 55.6\text{ MHz}$ 上。
      - item:
          id: rtl-stages-order
          type: order
          prompt: |
            把一条 `lw` 载入指令在硬件数据通路内按时间先后依次流经的核心阶段正确排序：
          steps:
            - 按 `PC` 从指令存储器取出二进制指令（IF）
            - 从寄存器堆读出基址并算出有效访存地址（ID + EX）
            - 带着有效地址访问数据存储器取出数据并写回目标寄存器（MEM + WB）
          explain: |
            取指 → 译码算地址 → 访存写回，所有指令都在这套数据通路里按控制线选通前进。
      - item:
          id: single-cycle-why-slow
          type: choice
          prompt: |
            单周期处理器明明平均每条指令恰好 `CPI = 1.0` 看似漂亮，实际高性能处理器为什么却几乎彻底抛弃了纯粹的单周期设计？
          options:
            - text: 时钟周期不得不拉长到迁就全芯片最慢指令（`lw`），大量快速简单指令在每拍后半段全部闲着干等、频段上不去
              correct: true
            - text: 因为单周期处理器运行同一个程序需要执行的指令条数比流水线处理器多五倍
              why: 只要遵循同一指令集，单周期和流水线处理器执行的是完全相同的机器指令序列，指令条数并未增加
            - text: 因为 `CPI = 1.0` 代表每条指令都要比 `CPI = 1.2` 的处理器花更多个时钟周期
              why: 单周期每条指令确实只花 1 个周期，但它把“每个周期的物理时长”拉得太长，拖垮了总运行时间
          explain: |
            不要被单一“CPI=1”唬住！**总性能 = 指令数 × CPI × 时钟周期**，单周期靠极长时钟周期吃尽了大亏！
      - item:
          id: datapath-control-role
          type: choice
          prompt: |
            在单周期数据通路里，为什么同一台 ALU 既能帮 `add` 做寄存器相加，又能帮 `lw` 算基址加偏移，甚至还能帮 `beq` 做两数相减比较是否相等？
          options:
            - text: 译码阶段的控制单元根据操作码拨动 ALU 入口多路选择器和运算功能码，按不同指令复用同一套算术与路径硬件
              correct: true
            - text: 因为里面雇了三个外星人手动把三块主板每纳秒拔插重焊一次
              why: 硬件复用是靠控制译码逻辑线拉高拉低 MUX 选择信号来切换接通方向
            - text: 因为 `lw` 根本不需要计算有效地址
              why: '`lw` 靠 ALU 计算基址寄存器与指令里立即数偏移量之和来定位内存地址'
          explain: |
            把固定结构的数据线与“控制单元发出多路拨片指令”分开看待，RTL 设计立马透彻！

  # ==== 流水线 ====
  - id: overlap
    chapter: 流水线
    title: 五级流水线重叠执行、总时钟数与单周期 vs 流水线对比
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一家洗车店洗 1 辆车要拆成五道独立工序（冲水→打泡→擦洗→烘干→打蜡），每道刚好花 `1 分钟`。如果守旧一次只让 1 辆车独占整条车间从头洗到尾再放下一辆（单周期），洗完 `4 辆车` 要 `20 分钟`；要是流水线作业、第 1 辆挪进第 2 站时第 2 辆立刻跟进第 1 站，依次连续不停喂入 `4 辆车`，一共只需要几分钟（几个整拍）全部洗完？
          options:
            - text: 只用 `5 + 4 - 1 = 8` 分钟（第 5 分钟第 1 辆出厂，随后每分钟再连续吐出其余 3 辆）！
              correct: true
            - text: 切成 5 道工序后，第 1 辆车自己在第 1 分钟末尾就能洗完出厂，4 辆车共花 `4` 分钟
              why: 第一辆车自身依然要实打实穿过整整 5 道工序（花 5 分钟）才能出库，缩短的是相邻车辆离开的“发车间距”
            - text: 依然得整整 `20` 分钟，一分钟都不省
              why: 流水线级间寄存器让五道工序同时服务不同先后指令，大幅拔高稳态产出速度
          explain: |
            这就是现代 CPU 心跳核心——**五级流水线（IF / ID / EX / MEM / WB）**！
      - card:
          title: 五级流水线（Pipelining）排程公式与单周期对比
          body: |
            把单周期最长的五步中间切出四个**流水线寄存器**（IF/ID、ID/EX、EX/MEM、MEM/WB），变成每段各自均衡的 `5` 个小节拍（时钟缩短约 4~5 倍！）：
            - **排程总周期公式**：让连续 `N` 条互不冲突指令穿过一条 `K` 级标准流水线，无停顿全部完成共需：
              $$\text{总周期数} = K + N - 1$$
              （如 5 级流水线跑 4 条指令需 $5 + 4 - 1 = 8$ 拍；跑 6 条指令需 $5 + 6 - 1 = 10$ 拍！）。
          reveal:
            - title: 假设每段均衡为 `3 ns`（单周期需 `5 × 3 = 15 ns`），切分成 5 级流水线跑 6 条指令差了多少倍？
              body: |
                - 若沿用**不切分单周期**：每条要跑满 `5 × 3 = 15 ns`，串着跑 6 条要 $6 \times 15 = 90\text{ ns}$；
                - 切分成 **每级 `3 ns` 的 5 级流水线**（暂忽略微弱级间寄存器开销）：共需 $5 + 6 - 1 = 10$ 拍 $\times 3\text{ ns} = \mathbf{30\text{ ns}}$（足足提速整整 **3 倍**！而且指令流越长，比如 100 万条指令，稳态吞吐几乎逼近理想每 `3 ns` 出一条的 **5 倍**上限！）。
            - title: 为什么流水线划分必须追求“每一级延迟尽可能等长均衡”？
              body: |
                因为全局同步时钟周期永远被切出来五段里**最慢那一拍**卡死！假如有四段只要 `1 ns` 而某段独占 `10 ns`，时钟一拍依然只能跑到 `10 ns`（加上寄存器建立开销更长）。把大块逻辑切匀成多份等长小段，提速红利才会贴近理论倍数。
      - item:
          id: pipe-4-instr-cycles
          type: number
          prompt: |
            一条无冒险停顿的标准 **5 级**（IF、ID、EX、MEM、WB）流水线，初始管道全空，从第 1 拍起每拍顺次喂入 1 条新指令，一共喂入 `4` 条彼此独立的指令。全部 `4` 条指令都完成 WB 阶段共花多少个时钟周期？
          answer: 8
          hint: '先算第 1 条指令走完 5 级何时离开，再算此后满载流水线每拍再送出剩下 3 条共多几拍（套公式 $K + N - 1$）。'
          explain: |
            第 5 拍结尾第 1 条离开 WB；第 6、7、8 拍结尾陆续完成第 2、3、4 条，合计 $5 + 4 - 1 = 8$ 拍。
      - item:
          id: pipe-6-instr-ns
          type: number
          prompt: |
            紧接实际耗时：如果把每级流水段最慢时钟周期压短成 `3 ns`，让连续 `6` 条无冲突指令全部走完这条 **5 级** 流水线一共只要多少纳秒（ns）？
          answer: 30
          hint: '先用总周期公式算出跑完 `6` 条指令一共占用多少个时钟周期，再乘以每拍的纳秒数。'
          explain: |
            总周期数 $(5 + 6 - 1) = 10$ 拍，总时间 $10 \times 3\text{ ns} = 30\text{ ns}$！
      - item:
          id: pipe-reg-why
          type: choice
          prompt: |
            五级流水线里，夹在每两级之间的 `IF/ID`、`ID/EX`、`EX/MEM`、`MEM/WB` 这四组流水线寄存器究竟存什么东西？
          options:
            - text: 暂存并携带当前那条指令算到本级为止的中间数据、操作数以及后面几级还要用到的控制与目标寄存器编号
              correct: true
            - text: 只暂存算术运算的数据结果，至于写回哪个寄存器的控制信号不需要经过流水线寄存器，直接从译码级连到写回级
              why: 如果目标寄存器号和控制位不随指令一起逐级向后传递，到写回 WB 级时那里正站着更老的指令，直接连线会写错目标寄存器！
            - text: 它们就是汇编程序员在指令里直接读写的 `$t0~$t9` 通用寄存器堆
              why: 流水线寄存器是硬件内部隔开各流水段的隐藏级间锁存器，汇编指令并不能按名字直接读写它们
          explain: |
            切记：**控制信号也是随指令一起流经流水线寄存器的！**第 5 级 WB 要写哪个寄存器，必须一路扛着目的寄存器号直到第 5 拍才回写！
      - item:
          id: single-vs-pipe-choice
          type: choice
          prompt: |
            关于单周期处理器改造成理想 5 级同步流水线后的表现对比，哪一项完全准确？
          options:
            - text: 单条指令单独从进入走到出来的“执行总时间延迟”不仅没变短反而微增（多了寄存器开销），真正大幅跃升的是稳态“指令吞吐率（每秒完成条数）”
              correct: true
            - text: 切成 5 级后，单条指令自己跑完全程时间瞬间缩成原来的 1/5
              why: 单条指令仍然得依次踏过全部 5 级共 5 拍，不可能跳过任何步骤
            - text: 稳态时最多每 50 拍才准许启动一条新指令
              why: 稳态理想状态下每个新时钟周期都能送入 1 条新指令并完成 1 条旧指令（理想 CPI ≈ 1 且时钟频率快约 5 倍）
          explain: |
            **单指令延迟微增、整体吞吐猛涨**——这是流水线设计最核心直觉！

  - id: data-hazard
    chapter: 流水线
    title: 数据冒险、旁路转发（Forwarding）与 Load-Use 停顿 1 拍
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            在五级流水线里紧挨着写了两句指令：`add x3, x1, x4` 算出结果写入 `x3`，下一行立刻写 `sub x5, x3, x6` 马上要用新的 `x3`！如果不做任何特殊挽救措施，`sub` 在第 3 拍读寄存器堆时 `add` 还在第 4 拍访存路途中、根本还没走到第 5 拍写回寄存器堆！`sub` 岂不是读到陈旧过期的假 `x3` 了？
          options:
            - text: 是！这就是**数据冒险（RAW 先写后读冲突）**；好在 `add` 在第 3 拍 EX 算完就已经有了新结果，可以直接架一根飞线旁路**转发**给 `sub` 当拍用，连 1 拍都不用停顿！
              correct: true
            - text: 哪怕加了旁路转发，`sub` 也必须死等 2 拍直到 `add` 在第 5 拍写回寄存器堆之后才能继续
              why: '`add` 的算术结果在第 3 拍 EX 结束时已经出现在 `EX/MEM` 级间寄存器里，旁路可以直接送给下一拍的 `sub`，不必等第 5 拍 WB'
            - text: 不会读错，因为 `add` 在第 2 拍译码阶段就已经把相加结果写进寄存器堆了
              why: 第 2 拍 ID 只负责读取源操作数，真正算出加法结果要到第 3 拍 EX，写回寄存器堆更要到第 5 拍 WB！
          explain: |
            `add` 在第 3 拍 EX 结束时结果已经算出，只是还没写回寄存器堆；旁路把它直接送进下一条指令的 EX，所以不用停。这一课弄清什么时候转发能“**0 停顿**”接住，什么时候有了转发也必须“**停顿 1 拍**”。
      - card:
          title: '数据冒险与旁路转发（Forwarding / Bypass）'
          body: |
            后条指令急用前条指令尚未写回的新寄存器值时就会触发 **数据冒险**。在带完全旁路的经典五级流水线（IF→ID→EX→MEM→WB）里：
            - **情况 A（ALU 算完紧接着用：`add → sub`）**：前一条 `add` 在 **EX 结束时**（`EX/MEM` 口）就已产出新值，赶在下条 `sub` 刚进 EX 前通过旁路飞线送到 ALU 入口——**停顿 `0` 个周期**！
      - item:
          id: alu-to-alu-stalls
          type: number
          prompt: |
            如果一条带完整旁路转发网络的五级流水线连续执行两句纯寄存器运算指令：`add $t0, $t1, $t2` 紧跟 `sub $t3, $t0, $t4`。启用旁路转发后需要停顿几个周期？
          answer: 0
          hint: '前一条 `add` 在哪一拍末就已算出了结果，后一条 `sub` 在哪一拍初才急需用到？'
          explain: |
            `add` 在第 3 拍 EX 结束时已产生新 `$t0`（存于 `EX/MEM` 寄存器），正好在 `sub` 进入第 4 拍 EX 算减法前由旁路送到 ALU 入口，**停顿 `0` 拍**！
      - card:
          title: 'Load-Use 数据冒险为什么必停 `1` 拍？'
          body: |
            - **情况 B（内存刚读出立刻用 `lw → add`，称 load-use 冒险）**：`lw` 必须走完 **MEM 结束** 才终于从内存把 `x1` 拿回来，可紧挨着的 `add` 提前 1 拍就已经跨进 **EX** 要拿 `x1` 做加法了（时间倒流救不了！）。
            - 硬件识别后插入 `1` 拍空泡停顿把 `add` 按停，再顺势从 `MEM/WB` 转发接住——**即使有旁路也必停 `1` 个周期**！
          reveal:
            - title: 用时间坐标对齐，演一遍 `lw`、`add`、`sub` 三条指令
              body: |
                指令：`lw x1, 0(x2)`；`add x3, x1, x4`；`sub x5, x3, x6`（每列 1 拍）：
                - 拍 1：`lw` 在 `IF`
                - 拍 2：`lw` 在 `ID` ｜ `add` 在 `IF`
                - 拍 3：`lw` 在 `EX` ｜ `add` 在 `ID`（侦测到 `add` 源 `x1` 撞上前方 `lw` 目的，**冻结停顿 1 拍！**）
                - 拍 4：`lw` 在 **`MEM`（结束时拿到真 `x1`）** ｜ `EX` 插入气泡 `NOP` ｜ `add` 原地停在 `ID` 等
                - 拍 5：`lw` 在 `WB` ｜ `add` 进 **`EX`（恰好旁路抢接 `lw` 刚出炉的 `x1`！）** ｜ `sub` 在 `ID`
                - 拍 6：`add` 进 `MEM`（结果 `x3` 已就绪可转发） ｜ `sub` 进 **`EX`（直接靠旁路接住 `x3`，无需额外停顿！）** → **总共仅停顿 `1` 拍！**
            - title: 如果中间相隔两条无关指令、`add` 到 `WB` 才和下条指令 `ID` 碰面怎么办？
              body: |
                真实 5 级硬件连这也能化解！只需约定物理寄存器堆在同一个时钟周期里“**前半拍优先写入（WB）、后半拍才对外读出（ID）**”（即寄存器堆内部直通旁路），间隔 2 条或以上无关指令就完全零冲突直接读到刚写回的新数值！
      - item:
          id: riscv-hazard-stall-c4
          type: number
          prompt: |
            在带旁路（转发）功能的标准五级流水线（IF、ID、EX、MEM、WB）上顺序执行以下三条 RISC-V 指令：
            `lw x1, 0(x2)`；
            `add x3, x1, x4`；
            `sub x5, x3, x6`。
            整个序列一共需要额外插入停顿（stall）多少个时钟周期？
          answer: 1
          hint: '分别看相邻两处依赖：第一处是 `lw` 产出的结果立刻被下条算术用（何时拿到内存数？）；第二处是算术结果给下条算术用（EX 后就能转出去吗？）。'
          explain: |
            `lw → add` 构成 `load-use` 数据冒险，`lw` 到 MEM 末尾才拿到 `x1`，即便有旁路转发也必停顿 `1` 个周期；而随后的 `add → sub` 可直接从 `EX/MEM` 流水线寄存器零停顿转发 `x3`！总计仅停顿 `1` 拍。
      - item:
          id: load-use-why-choice
          type: choice
          prompt: |
            为什么在经典五级流水线上，“已经接满了旁路飞线”依然绝对免不掉 `lw` 后紧跟 `add` 时要被迫停顿 `1` 个周期？
          options:
            - text: 因为 `lw` 要一直走到第 4 级（MEM）末尾才真把数据从内存摸到手，而紧跟其后的 `add` 在同一拍早已进到第 3 级（EX）要用了，总不能让信号时间倒流！
              correct: true
            - text: 因为 `lw` 在第 3 级（EX）算完地址的那一刻就已经拿到了内存里的数据，只是旁路飞线忘了连这一级
              why: EX 级只算出了有效访存地址，真正去数据存储器把值读出来必须走完第 4 级（MEM）
            - text: 因为 `lw` 指令完全不支持旁路转发，后面紧跟的 `add` 必须等它走完第 5 级（WB）停顿 2 拍
              why: 停顿 1 拍后，`lw` 在 MEM 末尾拿到的值仍然可以通过 `MEM/WB` 旁路直接转发给下一拍进入 EX 的 `add`，所以只停 1 拍而非 2 拍！
          explain: |
            把无关的独立指令顺手挪进 `lw` 与 `add` 之间垫一拍，就能白白吃掉那 1 拍停顿等待！
      - item:
          id: hazard-fix-match
          type: match
          prompt: |
            把三类处理**数据冒险**的常见工程手段配对到各自效果。
          pairs:
            - ["旁路转发（Forwarding / Bypass）", "不死等 WB 写回寄存器，直接从 EX/MEM 或 MEM/WB 口把算好的新值喂回 EX"]
            - ["硬件联锁停顿（Pipeline Stall）", "侦测到 load-use 无法靠时间倒流接住时，冻结前端 1 拍并向 EX 插入气泡"]
            - ["指令顺序重排填充", "趁 load 读取那 1 拍空窗把后面毫不相干的独立指令挪进来垫在中间干活"]
          explain: |
            能转发就不停顿，能软件重排填满气泡就更省硬件停顿浪费！

  - id: control
    chapter: 流水线
    title: 控制冒险（Control Hazard）、延迟分支与流水线气泡代价
    minutes: 11
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            流水线第 1 站 `IF` 每拍都要立刻去取下一条新指令。此刻前面一条条件跳转 `beq $t0, $t1, Target` 刚刚送进译码台，还要再算 1~2 拍才能算清楚 `$t0` 和 `$t1` 到底相不相等、接下来到底该继续走 `PC+4` 还是跳去 `Target`！取指端 `IF` 应该干等吗？
          options:
            - text: 干等太慢！实际常先大胆按 `PC+4`（或不跳转）接着往后取，万一过两拍真算出应该跳转，再把前面盲取进来那几条误入指令统统作废冲刷清零！
              correct: true
            - text: 不需要等，因为 `beq` 在第 1 拍刚取指（IF）时就已经知道两个寄存器相不相等了
              why: 第 1 拍 IF 才刚把指令二进制码从指令存储器取出来，还没译码读寄存器，不可能当拍就知道比较结果
            - text: 把跳转和不跳转两条路上的后续指令同时写进寄存器堆，谁后算完算谁的
              why: 绝不能让走岔路径上的误取指令真正改写寄存器或内存，必须在它们写回之前冲刷作废！
          explain: |
            跳转打断顺次取指引发的冲突就是**控制冒险（Control Hazard）**！
      - card:
          title: '控制冒险与误取冲刷（Flush）惩罚'
          body: |
            条件跳转指令在刚取指时还不知道往哪拐弯，从而引发 **控制冒险**：若等到后面才算出要跳而前面已经误取进 `1~3` 条顺次指令，就必须拉响 **Flush（流水线冲刷）** 把这些误入指令清成空操作（`NOP`），白白亏掉几个时钟周期！
      - item:
          id: control-flush-what
          type: choice
          prompt: |
            条件分支指令走到 EX 级终于判定“需要跳转至新目标 `Target`”，但此时前面早有一条紧随分支之后的错误顺次指令已进入 ID 级、另一条刚进入 IF 级。硬件怎么保证程序逻辑不出错？
          options:
            - text: 发出冲刷信号（Flush），立刻把已误入流水线前段的这两条错路指令清除成无副作用空操作，同时将 `PC` 扭转到 `Target` 重新取指
              correct: true
            - text: 放任那两条错路指令继续写完寄存器，反正后面 `Target` 处的指令迟早会把寄存器覆盖回来
              why: 错路指令可能改写后续还要读取的寄存器或内存，必须在到达 MEM/WB 写状态之前彻底清零控制信号
            - text: 因为这两条指令已经进入 IF 和 ID 级，说明它们已经改写了主存，必须去内存里回滚旧值
              why: IF 和 ID 阶段只取指和读寄存器，还没有走到第 4 级 MEM 写内存或第 5 级 WB 写寄存器，直接冲刷清零即可，无需回滚主存
          explain: |
            “取了错路不要紧，赶在写回建筑状态之前 Flush 清零就行！”
      - card:
          title: '减缓控制冒险的三类工程对策'
          body: |
            1. **尽早判决（Early Branch Resolution）**：把相等比较提前到 `ID` 译码级算清，把误猜冲刷压缩到 `1` 拍；
            2. **分支延迟槽（早期 MIPS）**：规定跳转后紧跟着的 1 条指令不管跳不跳都照常执行；
            3. **动态硬件分支预测**（更强力且不污染指令集语义！）。
          reveal:
            - title: 算一笔控制冒险造成的 CPI 拖累账
              body: |
                假设理想流水线基础每指令 `1.0` 拍。如果程序每 `100` 条指令里混了 `20` 条分支（20%），其中猜错率占 25%（每 100 条误猜 `5` 次），每次冲刷清空都要白亏 `2` 拍气泡：
                平均每条指令额外被拖累 $\Delta = 0.20 \times 0.25 \times 2 = +0.10$ 拍；现代超深流水线若不靠高命中率预测，误猜一次直接损失十几拍！
            - title: 为什么现代 RISC-V 抛弃了早期 MIPS 常用的“分支延迟槽”？
              body: |
                分支延迟槽硬性规定“跳转后面的那 1 条指令必然先执行”，这把早期 5 级浅流水线的硬件实现细节直接漏进了永久 ISA 契约里！后来超标量双发甚至十几级深流水线兴起后，区区 1 个延迟槽根本填不满，硬件反而要被迫特判延迟槽异常，成了一大历史包袱——这再次印证不要把短暂微结构权宜写死进 ISA！
      - item:
          id: control-penalty-calc
          type: number
          prompt: |
            某 100 条指令的测试片段中共有 `10` 次分支发生实际误预测，每次误预测被冲刷作废并白亏 `2` 个时钟周期惩罚（其余指令各花 1 拍、无停顿）。这 100 条指令含惩罚后总计跑了多少拍？
          answer: 120
          hint: '把无冒险理想基线拍数，加上每次分支误判惩罚乘以出错次数。'
          explain: |
            `100 + 10 × 2 = 120` 拍（有效平均每条指令周期 `CPI` 从 `1.0` 被拖慢到 `1.2`）。
      - item:
          id: control-mitigation-match
          type: match
          prompt: |
            将减缓**控制冒险**的三类经典架构方案对号入座。
          pairs:
            - ["尽早判定分支方向", "把相等比较器和跳转地址计算尽量往前面译码级提前，缩短冲刷作废深度"]
            - ["分支延迟槽（早期 MIPS）", "约定跳转后面紧跟着那 1 拍不论跳不跳都照常执行，塞有用指令避免空转"]
            - ["动态分支预测", "硬件记住每条分支最近历史规律，取指阶段当场押宝走向减少误冲刷"]
          explain: |
            现代高性能微结构靠高准确率动态预测器，硬生生在 15+ 级超长管道里把大部分控制停顿压到最小！

  - id: out-of-order
    chapter: 流水线
    title: 控制/数据相关性、精确异常恢复与乱序执行
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            指令 1 是一条超慢的“未命中主存读数 `lw`”，需要整整 `100` 拍才能取回数据；排在它正后面的指令 2 和指令 3 只在算完全无关的另一组寄存器加法！严格按死板顺序等指令 1 走完再让 2、3 进执行单元，岂不是让几组算术部件干晾一百拍？可如果真让指令 3 抢先一步算完写进最终寄存器堆，万一到第 99 拍指令 1 突然触发了“内存地址非法异常崩溃”，怎么跟软件交代？
          options:
            - text: 执行时谁就绪谁先抢跑算（体内打乱次序提前计算），但结果先暂存在重排序缓冲里排队，**严格按原程序顺序**依次核准写入最终可见寄存器（确保**精确异常**）！
              correct: true
            - text: 让指令 2、3 抢先算完并直接覆盖最终寄存器堆；即使后面指令 1 报错崩溃，也不用撤销指令 2、3 的修改
              why: 任何现代商业处理器必须保证精确异常，外部观察效果必须像严格逐条顺序执行完一样，绝不留下一半乱算现场！
            - text: 禁止任何后面无关指令先行，哪怕干等一百拍也必须等指令 1 彻底写回后才能启动指令 2
              why: 通过硬件**重排序缓冲（ROB）**把“乱序执行”和“顺序提交”拆开，既能抢尽并行性能又能守住精确异常底线！
          explain: |
            既要速度（抢跑并行挖掘指令级并发）、又要体面（精确异常绝不留烂摊子），就是现代超标量核心的看家本领！
      - card:
          title: '乱序执行（OoO）与寄存器重命名'
          body: |
            为了让后续独立指令绕过慢指令抢跑，处理器采用 **乱序执行** 机制：
            1. **相关性与寄存器重命名**：把有限的逻辑寄存器号偷偷映射到海量底层隐藏物理寄存器上，消灭纯因重名引起的写后写假冲突；
            2. **乱序执行站**：操作数就绪的后续指令先抢跑进空闲算术单元计算，不等前方卡在慢访存上的老指令。
            - 并且注意访存单元：即使寄存器不重名，内存位置编号是否重叠也得等访存地址算出才能确认。
      - item:
          id: ooo-commit-order
          type: order
          prompt: |
            把一条指令穿越现代超标量乱序执行核一生所经历的三个关键秩序阶段按正确次序排好：
          steps:
            - 顺序取指译码与寄存器重命名后进入 ROB 登记号牌（In-Order Dispatch）
            - 等待各自操作数齐备后抢先跳进算术单元完成运算（Out-of-Order Execute）
            - 确认前面所有老指令无异常无误猜后，按原始程序编号轮流正式写回提交（In-Order Commit）
          explain: |
            体内尽情抢跑挖潜，大门进出守秩序排队，这就是微架构工程师平衡性能与正确性的巅峰艺术。
      - card:
          title: '重排序缓冲（ROB）与精确异常'
          body: |
            抢先算完的结果不能直接改写体系状态，必须先暂存进 **重排序缓冲（ROB）按原始序号排队**：老指令顺利无异常后才顺序提交；若老指令触发除零等异常，ROB 后端晚来的算完半成品统统作废抹净，保证精确恢复现场！
          reveal:
            - title: 乱序执行最棘手的暗礁——内存读写（Load/Store）依赖怎么防乱？
              body: |
                寄存器名字在译码那刻就一清二楚，但 `sw x1, 0(x2)` 和 `lw x3, 0(x4)` 到底写没写到同一块内存单元，必须等各自加法器把有效地址 `$x2`、`x4` 算出来才知道！于是 CPU 专门配一个**访存加载存储队列（LSQ / Store Buffer）**：严格核对前面还有没有同地址未落地写入，支持把前面没写进缓存的旧写数直接转发给后面的读（Store-to-Load Forwarding），既不敢盲撞也不死等！
            - title: 为什么光靠硬件多开执行单元，有时仍提不动真实程序？
              body: |
                现代乱序核心甚至一拍同时发射 4~6 条指令，但如果程序满篇都是前后锁死的数据依赖（比如一步步追踪跳转的下一跳地址 `p = next`），或者前端分支猜错一把冲刷作废几十条已做完半截的指令，再宽广的执行引擎也只得空转等瓶颈松开——这正是 `OoO 性能工程` 紧盯真瓶颈的出发点！
      - item:
          id: ooo-rob-purpose
          type: choice
          prompt: |
            在高性能**乱序执行**处理器内部，**重排序缓冲（Reorder Buffer, ROB）**最核心存在的两大使命是？
          options:
            - text: ① 让各自早算完的乱序结果临时排队，确保严格按原程序顺序提交修改永久寄存器与内存；② 遇到老指令触发异常或误分支预测时整齐丢弃后续未提交成果，维持精确异常！
              correct: true
            - text: 一旦某条后续指令在执行单元里抢先算完，ROB 就立刻按“谁先算完谁先写回”的顺序改写可见寄存器堆
              why: 乱序只发生在内部执行站，最终从 ROB 提交写回必须 100% 恢复原本逻辑先后顺序，否则会破坏精确异常
            - text: ROB 的作用是在取指阶段把还没有操作数的指令直接跳过不执行
              why: 指令仍然必须全部执行，ROB 负责在后端把乱序算完的结果按原程序顺序排队提交
          explain: |
            “**按序发射/译码 → 乱序执行（谁好谁先算） → 按序提交（ROB 把关精确异常）**”！
      - item:
          id: precise-exception-why
          type: choice
          prompt: |
            什么是处理器的**精确异常（Precise Exception）**保障？如果指令 1 触发了非法访存或除零崩溃，但早先被乱序放跑算完的指令 3 还没来得及拦住，算符合精确异常吗？
          options:
            - text: 精确异常要求在故障指令 1 之前的指令全已算完生效、而 1 及它后面的全部指令（包括 3）痕迹彻底抹除清零；如果指令 3 已经偷偷改写了可见寄存器就不算精确！
              correct: true
            - text: 只要系统报错就行，指令 3 改掉几个无关寄存器没关系算精确异常
              why: 精确异常保证操作系统修复中断并重新从指令 1 继续跑时，不会因指令 3 已半途多做了一遍而算出翻倍错数！
            - text: 精确异常要求处理器在指令 1 提交之前绝对不能把指令 3 送进运算单元计算
              why: 精确异常只要求按序提交（Commit）到架构可见状态，指令 3 完全可以在内部提前乱序执行并把结果暂存在 ROB 里！
          explain: |
            没有精确异常，操作系统连多任务分时切换与按需重跑都做不到！
      - item:
          id: store-buffer-role
          type: choice
          prompt: |
            为什么乱序处理器在执行到一条 `lw` 读内存指令时，不能不看前面还没写完的 `sw` 存内存队列就径直去读高速缓存？
          options:
            - text: 前面某条还没写进缓存的旧 `sw` 恰好可能正在写同一个内存地址，直接绕过它去读缓存就会漏拿到最新写入数据，必须用 LSQ 检查同地址转发或等待！
              correct: true
            - text: 只要在译码阶段比对 `sw` 和 `lw` 的基址寄存器名字不同，就 100% 确定它们不可能访问同一个内存地址
              why: 不同寄存器加上不同偏移量（如 `0($t1)` 与 `4($t2)`）完全可能算出同一个有效内存地址，必须等地址算出后在 LSQ 里比对！
            - text: 因为 `sw` 在译码（ID）那一拍就已经把新数据写进高速缓存了，根本不需要存储队列
              why: '`sw` 只有在确认前面的指令全部无异常、按序提交时才敢真正改写缓存，此前新值暂存在存储队列（Store Buffer）里'
          explain: |
            算术靠寄存器号识别依赖，访存靠运行期算出的有效地址识别依赖——这是乱序访存处理的核心难点。

  # ==== 缓存 ====
  - id: cache
    chapter: 缓存
    title: 存储层次、直接映射与组相联 Cache 地址拆解
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            现代 CPU 核心每 `0.3 纳秒` 就想要一条数据，可主板上的大容量主内存条每次读写动辄要苦等将近 `100 纳秒`（慢了两三百倍！）。假如让你造一座图书馆，手头有 1 亿本藏书，读者 90% 的时间都只反复翻桌边最近借的那几千页参考书——怎么设计书桌与大书库配合最省钱又最快？
          options:
            - text: 在 CPU 身旁紧挨着造几层小而极快的**高速缓存（Cache）**专门兜住近期常翻数据块，把既近又常重复用的那批热块留在桌边 1 拍就拿到！
              correct: true
            - text: 直接用造寄存器的超高速电路造出整条 128 GB 主内存，既能装下全部数据又能 1 拍读出
              why: 极高造价、庞大面积和过长布线信号传播延迟使超大高速存储器既造不起，物理电信号走线距离变长后也根本跑不进 1 拍
            - text: 把 CPU 主频降低两百倍，迁就主内存的 100 纳秒读写速度
              why: 靠程序**时间局部性**和**空间局部性**，分层存储体系让常见 95%+ 访问在全速主频下看起来像只有 1 拍一样飞快！
          explain: |
            利用程序**时间与空间局部性**，用小快多层结构伪装出“又大又快还便宜”的假象——欢迎进入**缓存与存储层次**！
      - card:
          title: 存储层次与**缓存**三大地址字段拆解
          body: |
            CPU 送来的物理存储编号从右到左被硬件干脆切开成三段拼图（记住数据按字节编址）：
            1. **块内偏移（Offset）**：找数据落在缓存行（Block）里第几个字节。若行宽 $B = 16$ 字节（即 $2^4$），低 **`4` 位**（即地址 $\bmod 16$）就是块内偏移！
            2. **组索引（Index）**：决定去缓存里哪一组查找。若有 $S = 4$ 组，再往左数 **`2` 位**（即 `(地址 // 16) % 4`）就是组号！
            3. **标记（Tag）**：剩下最左边最高位存作标签，比对到底是不是我们要找的那块地址（还要配合 `Valid = 1` 才算真命中！）。
          reveal:
            - title: 一眼算透实战题：地址 `52` 和 `84` 落进 `4 组 × 2 路 × 16 字节` 缓存
              body: |
                这套硬件配置：每行 $B = 16$ 字节、共有 $S = 4$ 组、每组 $W = 2$ 路（2 个槽位）：
                - **总有效数据容量**：$S \times W \times B = 4 \times 2 \times 16 = \mathbf{128\text{ 字节}}$（别把 Tag/Valid 控制位误算进数据容量！）；
                - **追踪十进制地址 `52`**：`52 ÷ 16 = 3 余 4` → 块号 `3`，**组索引 = 3**，**块内偏移 = 4**；
                - **追踪十进制地址 `84`**：`84 ÷ 16 = 5 余 4` → 块号 `5`，`5 % 4 = 1` → **组索引 = 1**（标签记作上层商位 `5 // 4 = 1`），**偏移 = 4**！
            - title: 如果给你的是 `32 位` 十六进制地址，硬件怎样用二进制位数直接切？
              body: |
                连除法都不用做，纯接电线硬切！比如 `4 组 × 2 路 × 16 字节`：因为 $16 = 2^4$，直接截最右边 **`4` 根比特线当 Offset**；因为 $4 = 2^2$，往左紧邻 **`2` 根比特线当 Index**；剩下的最左边 $32 - 4 - 2 = 26$ 根线全部当作 **Tag** 存进表里比对！没有任何算术消耗！
      - item:
          id: cache-offset-52
          type: number
          prompt: |
            一台处理器的高速缓存每行块大小固定为 `16 字节`。现在 CPU 发来十进制访存地址 `52`。请问它在这块缓存行里的**块内字节偏移量（Offset）**是多少？
          answer: 4
          hint: '拿十进制地址对每块字节数取余数即可。'
          explain: |
            `52 = 3 × 16 + 4`，商为块号 `3`，余数 **块内偏移为 `4`**！
      - item:
          id: cache-index-84
          type: number
          prompt: |
            某缓存共有 `4 组`（编号 `0..3`），每组 `2 路` 组相联，每行块大小 `16 字节`。CPU 访问十进制字节地址 `84` 时，应该映射到第几组（填 `0..3` 组号）？
          answer: 1
          hint: '先用地址整除每块字节数算出全局“块号”，再拿块号对总组数求模取余！'
          explain: |
            `84 // 16 = 5`（第 5 号块），再对 `4` 组取模：`5 % 4 = 1`，故查找第 `1` 组里两条路上的标签比对！
      - item:
          id: cache-capacity-128
          type: number
          prompt: |
            计算一块高速缓存的有效数据总容量：共 `4 组`，采用 `2 路组相联`（即每组有 2 个行槽位），每行能存 `16 字节` 数据。它一共能装下多少字节（Bytes）的数据？
          answer: 128
          hint: '总有效数据字节数 = 组数 × 每组路数（相联度） × 每行块字节数。'
          explain: |
            `4 × 2 × 16 = 128` 字节（存储数据区一共可装入 8 个互不重叠的 16 B 块）。
      - item:
          id: locality-types-choice
          type: choice
          prompt: |
            缓存之所以能把“每行整块搬进 `16~64 字节` 而不只搬单字节”设计得如此高效，主要看重程序访问的什么规律？
          options:
            - text: '**空间局部性**（刚读完 `arr[0]` 极可能马上去读紧挨着的 `arr[1]、arr[2]`，整块一次性捎带全命中！）与**时间局部性**（刚用过的循环变量马上又要重复读）'
              correct: true
            - text: 因为每次只搬 1 个字节和一次搬 64 个字节的命中率在顺序扫描连续线性表时完全一样
              why: 若每次只搬 1 个字节，顺序扫连续表时每个新元素都会触发缺失；整块搬 64 字节能让后面紧邻的 15 个 4 字节整数直接命中！
            - text: 缓存行一次搬回一整片连续字节只会浪费空间，永远不可能命中后面的顺序访问
              why: 整条连续线性表顺序扫描时，64 字节一行的头一次缺失之后紧跟着的 15 个整数访问正因空间局部性一次命中！
          explain: |
            所以写高性能循环时按顺序逐个扫连续内存（步长=1），缓存命中率极高！

  - id: miss
    chapter: 缓存
    title: 缓存 3C 缺失分类（强制/容量/冲突）与缓存参数优化权衡
    minutes: 11
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            手里有一台总容量 `128 KB` 却做成“**1 路直接映射**”的 Cache：两个极热点数据块 `A` 和 `B` 总加起来才区区 `8 KB`（明明小得塞不满缓存），可偏偏两片首地址恰好每次都撞到**完全同一号缓存槽位**上，于是循环跑起来竟疯狂地把对方刚放热的数据互相踢飞重读、命中率暴跌！这是缓存总容量不够吗？
          options:
            - text: 不是总容量不够，而是槽位映射死板引起的**冲突缺失（Conflict Miss）**！改成 2 路或 4 路组相联就能在同一组放进两块，瞬间不打架了！
              correct: true
            - text: 这是容量不够引起的容量缺失，唯一办法是保持 1 路直接映射不变、把总容量从 128 KB 翻倍到 256 KB
              why: 总工作集才 8 KB，远小于 128 KB；如果 A 和 B 的首地址恰好相差 256 KB 的整数倍，保持 1 路直接映射照样撞进同一个槽位！
            - text: 这是第一次访问不可避免的强制缺失，只要跑过第一轮循环后面就自动 100% 命中了
              why: 每轮循环里 A 和 B 都会把对方刚装进该槽位的缓存行踢走，导致后续每一轮循环都在反复缺失！
          explain: |
            学会把每一次 Cache Miss 精准归进 **3C 缺失（强制 / 容量 / 冲突）**，才知道性能到底该加容量、放大行宽还是涨相联度！
      - card:
          title: 缓存缺失 3C 分类法与优化双刃剑
          body: |
            - **强制/冷启动缺失（Compulsory Miss）**：一块内存出生头一次被访问，以前从没来过缓存里，哪怕缓存无限大也避不开这第一次！**办法**：加大块大小或谨慎硬件预取；
            - **容量缺失（Capacity Miss）**：程序干活必需的热数据集大小本身就已经撑爆了整块 Cache 容量，连全相联照样挤不下了不断换入换出！**办法**：增大总缓存容量；
            - **冲突缺失（Conflict Miss）**：总容量绰绰有余，却因为多块抢同一个组槽位被迫互相驱逐踢走！**办法**：提高相联度（比如 1 路→4 路组相联）。
          reveal:
            - title: 别盲目把块宽越做越大、相联度越高！为什么都会带来负面代价？
              body: |
                1. **块大小做太大**：能降强制缺失，但组数相对变少反而加剧冲突，且每次未命中要从慢主存拖回一大坨极耗带宽（污染缓存且拉长缺失传输时间）；
                2. **相联度做成全相联**：每次找数要把组里全部几十上百个 Tag 同时比较，既贵又烫还直接拖慢命中查找时间！实际 L1 Cache 常落在 `32~64 B 块长`、`4~8 路组相联`。
            - title: 为什么加高相联度到 2 路就能瞬间治好热点 A 与 B 的冲突？
              body: |
                因为原来 1 路直接映射时，组里只有 1 张椅子，A 刚坐下 B 一来就得把 A 踢走，下拍 A 再来又得踢 B；扩成 2 路组相联后同组并排摆了 **2 张椅子**，A 和 B 各坐一张互不干扰，原本 `100%` 的乒乓缺失率一秒降回几乎 `0%`（只剩初次冷启动缺失）！
      - item:
          id: miss-conflict-ident
          type: choice
          prompt: |
            一个程序循环里来回只摸两块各占 `4 KB` 的连续表格（总热点数据仅 `8 KB`），跑在一颗总容量高达 `32 KB` 的 **直接映射（1 路）** Cache 上。因为恰好首地址步长对齐到同一组号，循环每一步都相互顶掉对方造成疯狂缺失。这属于哪一类缺失？
          options:
            - text: 冲突缺失（Conflict Miss）
              correct: true
            - text: 容量缺失（Capacity Miss）
              why: 热点工作集才 `8 KB` 远小于总容量 `32 KB`，根本不是总量装不下，而是同一组唯一槽位引发乒乓撞车
            - text: 强制冷启动缺失（Compulsory Miss）
              why: 每轮循环重复摸同一批旧数据已不再是“历史上第一次访问”，而是被对手刚踢走造成的反复冲突缺失
          explain: |
            判别小招：跟“同等总容量的全相联理想缓存”比——连全相联都装不下叫**容量缺失**；全相联装得下偏偏你的有限相联掉链子，全算**冲突缺失**！
      - item:
          id: miss-3c-match
          type: match
          prompt: |
            把经典 3C 缓存缺失名字跟它的最对症破解措施连线配对。
          pairs:
            - ["强制缺失（Compulsory）", "冷数据第一次被碰到；可借适度放大块宽或硬件提前预取缓解"]
            - ["容量缺失（Capacity）", "活跃热点集合已经大于整片 Cache 总容量；根本上需要更大缓存容量"]
            - ["冲突缺失（Conflict）", "容量还充裕却在同一组索引互相挤踢；提升组相联度立竿见影"]
          explain: |
            分不清 3C 病因就乱调参——比如碰到容量缺失只调高相联度几乎毫无用处，必须对应下药！
      - item:
          id: big-block-downside
          type: choice
          prompt: |
            既然加大缓存块宽能一次预带更多相邻字节从而减少强制缺失，为什么不把 L1 缓存每行直接做成 `4096 字节（4 KB）` 超大行宽？
          options:
            - text: 行太大导致总行数骤减极易碰撞冲突，且每次缺失都要花很久把大量不一定会用到的无用邻近数据搬穿慢总线
              correct: true
            - text: 因为块大小越往大调，程序第一次访问连续线性表时的强制缺失率反而会越来越高
              why: 放大块大小会顺手预带更多相邻元素，强制缺失率原本是下降的；真正变差的是块数变少引发的冲突缺失与单次缺失搬运延迟
            - text: 因为 4096 无法写成 2 的整数次幂，硬件切不出块内偏移位数
              why: $4096 = 2^{12}$ 完全是 2 的整次幂（低 12 位作偏移），不选它的原因是缺失传输代价和行间冲突严重恶化
          explain: |
            L1 常见行宽 `64 字节`，正是空间局部性与缺失带宽/污染惩罚反复权衡的甜点。
      - item:
          id: prefetch-risk-choice
          type: choice
          prompt: |
            硬件自动预取（Prefetch）趁总线闲着提前猜后面块搬进缓存。如果程序在疯狂随机跳跃访问离散节点（根本猜不准下个地址），盲目狂开激进预取会怎样？
          options:
            - text: 预取进大量根本不用的废块，不仅白白挤爆珍贵的主存带宽，还会顺手把缓存里本来有用热块顶踢出去造成**缓存污染**！
              correct: true
            - text: 就算完全猜错 100%，预取也绝对零代价永远只赚不亏
              why: 猜错的预取消耗真实访存带宽并且占掉宝贵缓存槽位
            - text: 硬件预取器会自动识别跳转规律并把主存里零散分布的节点搬移重排成连续存储块
              why: 硬件预取只负责按猜测的地址提前读入缓存行，无法改动程序在主存里原有的离散节点存储布局
          explain: |
            顺序表流式扫描开预取快如闪电；散乱间接跳转访问开激进预取反而拖慢系统。

  - id: amat
    chapter: 缓存
    title: 多级缓存私有 vs 共享资源划分与 AMAT 平均访存时间计算
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一颗处理器的 L1 缓存命中只需 `1` 拍，可惜有 `5%` 的时候找不到（缺失），一旦找不到就要去主内存苦等整整 `100` 拍！那平均每访存一次大概要消耗几个时钟周期？会比 1 拍多出多少？
          options:
            - text: 整整 `1 + 0.05 × 100 = 6` 拍！看似高达 95% 命中率，那区区 5% 的百倍重罚就把平均速度直接拖慢了 6 倍！
              correct: true
            - text: 大约 `1.05` 拍，几乎完全察觉不到 100 拍惩罚
              why: 每次缺失代价高达 `100` 拍，必须拿缺失率 `0.05` 乘以完整惩罚 `100` 再叠加到 1 拍基线上
            - text: 一律固定等于 `101` 拍
              why: 95% 命中的那部分只花了 1 拍，是按概率加权摊算期望耗时
          explain: |
            平均访存时间 = 命中时间 + 缺失率 × 缺失惩罚 = `1 + 0.05 × 100 = 6` 拍。命中率 95% 看着很高，可每次缺失要多等 100 拍，平均下来是全命中时的 6 倍。这一课再加上 L2，逐层算平均访存时间。
      - card:
          title: '**平均访存时间（AMAT）**逐层拆解法'
          body: |
            衡量整套存储子系统快慢的核心指标是 **平均访存时间**（AMAT）：
            $$\text{AMAT} = \text{命中时间} + \text{局部缺失率} \times \text{缺失代价}$$
            - **单级 L1 直接接主存**：$\text{AMAT} = 1 + 0.05 \times 100 = \mathbf{6}$ 周期！
            - **加上 L2 当中间缓冲（逐层嵌套代换！）**：
              1. 此时 L1 缺失之后不再傻傻直接去 100 拍的主存，而是先花 `10` 拍去查 **L2**（若 L2 局部缺失率 `20%`，才去主存再花 `100` 拍）；
              2. 先算 **L1 的新缺失代价（即 L2 的 AMAT）**：$10 + 0.20 \times 100 = \mathbf{30}$ 周期；
              3. 再代回顶层：$\text{AMAT} = 1 + 0.05 \times 30 = \mathbf{2.5}$ 周期！（直接快出一大截！）。
          reveal:
            - title: 算错重灾区：“局部缺失率（Local Miss Rate）” vs “全局缺失率（Global）” + 多核私有/共享
              body: |
                注意审题：**局部缺失率**是以“真正送到 L2 门口查的那批请求里失败多少比例”为分母（直接代进上面逐层公式！）；而全局缺失率是以 CPU 发出的总访存数为分母（全局 L2 缺失率 = `5% × 20% = 1%`）。另外在多核里：**L1 各自私有**追求极低 1 拍延迟，而大容量 **L3 共享给全体核用**提高总量利用率，却也会带来一个胖应用抢光别人缓存空间的干扰，需要靠路划分等 QoS 隔离！
            - title: L1 和 L2 各自看中什么设计权衡？
              body: |
                L1 紧挨执行引擎，必须在 `1` 拍左右极快命出，哪怕缺失率 `5%` 也只能做小容量（比如 `32 KB`）；而中间的 L2/L3 容忍花 `10~40` 拍，换来大几百倍容量把原本 `100` 拍慢得像蜗牛的主存访问挡下八九成，完美实现“又快（L1 延迟）又兜底（L2/L3 大容量）”的分层协同效应！
      - item:
          id: amat-l1-only-c4
          type: number
          prompt: |
            只有单级 L1 缓存直连主存时，L1 命中时间为 `1` 周期，缺失率为 `5%`（即 `0.05`），一旦缺失访问主存的额外缺失代价是 `100` 周期。此时系统的**平均访存时间（AMAT）**是多少个周期？
          answer: 6
          hint: '套用平均访存时间公式：命中时间加上“缺失率乘以缺失额外代价”。'
          explain: |
            $\text{AMAT} = 1 + 0.05 \times 100 = 6$ 周期（其中整整 5 周期全耗在了等待 5% 主存缺失惩罚上）。
      - item:
          id: amat-with-l2-c4
          type: number
          prompt: |
            在一套 L1 命中时间 `1` 周期、L1 缺失率 `5%`（`0.05`）的系统里，加装一级 L2 缓存作为缓冲。已知 L2 命中时间 `10` 周期、L2 **局部缺失率** `20%`（`0.20`），若 L2 也缺失再访问主存代价为 `100` 周期。加了 L2 之后整套系统的**平均访存时间（AMAT）**是多少个周期（填小数）？
          answer: 2.5
          hint: '由下往上逐层分两步：先算清 L1 缺失后落到 L2 这一层的平均耗时，再把它当作 L1 的缺失代价代入顶层公式。'
          explain: |
            L1 缺失后去查 L2 平均花 $10 + 0.20 \times 100 = 30$ 周期；代回 L1 得 $\text{AMAT} = 1 + 0.05 \times 30 = 2.5$ 周期！
      - item:
          id: amat-extra-practice
          type: number
          prompt: |
            独立换组参数练手感：L1 命中 `1` 拍、缺失率 `10%`；L2 命中 `8` 拍、局部缺失率 `25%`；主存缺失代价 `80` 拍。计算这两级存储系统的平均访存时间 **AMAT** 是多少个周期（填小数）？
          answer: 3.8
          hint: '同样先求 L2 层的平均耗时（命中 + L2 局部缺失率 × 主存代价），再代入 L1 层的平均耗时公式。'
          explain: |
            L2 平均耗时 $= 8 + 0.25 \times 80 = 28$ 拍；整体 $\text{AMAT} = 1 + 0.10 \times 28 = 3.8$ 拍。
      - item:
          id: private-vs-shared-cache
          type: choice
          prompt: |
            在多核 CPU 芯片上，为什么 L1 通常是每个核心**私有（Private）**，而最外层大 L3 往往由全部核心**共享（Shared）**？
          options:
            - text: 私有 L1 紧贴单个执行核减少连线延迟且互不争抢；共享 L3 能让少核干重活时独享全部巨额容量、避免同样一份共享只读库在各核重复存 N 份
              correct: true
            - text: 如果把 L1 也做成全芯片所有核共享的大缓存，依然能保持 1 拍极低命中延迟且不会产生任何多核争抢
              why: 跨全芯片连线与多核同时访问的仲裁会使 L1 延迟暴涨到十几拍，彻底失去贴身高速缓存的意义
            - text: 把 L3 做成每核完全独立的私有大缓存，比共享 L3 更省总面积且单核可用最大容量更大
              why: 私有 L3 会让每个核都只能用自己的那一小份，其它空闲核的缓存空间无法借给繁忙核，且共享数据会被重复存放多份
          explain: |
            如果共享 L3 被某个后台大吞吐任务把全部热块洗光（缓存干扰），硬件就提供缓存路划分（Cache Partitioning）帮关键任务留出专属领地！

  - id: virtual-memory
    chapter: 缓存
    title: 虚拟内存地址翻译、多级页表、TLB 快表与缺页保护
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            电脑上同时打开浏览器、音乐播放器和文本编辑器三个程序。每个程序写好生成时都大摇大摆以为自己独占从 `0x00400000` 开始的大块连续编号区间！要是它们俩真直接把各自以为的地址通给物理内存条，岂不是立刻撞车把别人的密码覆盖捣毁了？
          options:
            - text: 靠地址映射机制把程序使用的逻辑编号通过各自独立的对照表翻译到互不相撞的硬件存储位置上，既隔离安全又能按需把冷数据先挪去磁盘！
              correct: true
            - text: 全世界的软件开发者在写代码前必须事先商量好，保证没有任何两个程序使用相同的起始内存地址
              why: 成千上万个独立开发的程序根本不可能事先协商瓜分硬件存储位置，必须由操作系统和硬件为每个程序提供独立的逻辑编号映射
            - text: 两个程序谁后启动，就直接把先启动那个程序在 `0x00400000` 处的代码和数据覆盖掉
              why: 映射控制条目里的独立对照表和权限位确保不同程序映射到不同的硬件位置，程序 A 根本无法覆盖程序 B 的内存！
          explain: |
            缓存加速了访问速度，而接下来的地址映射层一次解决了隔离保护、逻辑连续化与超大空间错觉！
      - card:
          title: '虚拟地址、物理地址与页表翻译'
          body: |
            每个程序看到的编号叫 **虚拟地址**，真正主板内存条上的硬件位置叫 **物理地址**。两者按整块（如 `4 KB` 一页）对应：
            - **页内偏移直通**：每页内部字节完全对齐，低位偏移一丝不动；
            - **页号查 **页表** 翻译**：高位虚拟页号经由 **页表** 查出对应真实物理页号后再与页内偏移拼回最终地址！
      - item:
          id: vm-translate-1036
          type: number
          prompt: |
            假设某微型架构规定页面大小固定为 **`1024 字节`（`1 KB`）**，一个虚拟地址拆开后查**页表**得知它映射到了**物理页号 `PFN = 1`**（即该物理页起始字节基址为 $1 \times 1024 = 1024$），且原虚拟地址的页内偏移是 `12`。最终翻译出的真实物理字节地址是多少？
          answer: 1036
          hint: '牢记翻译铁律：物理地址 = 查表得到的物理页号乘以每页字节大小，再加上保持不变的页内偏移。'
          explain: |
            $1 \times 1024 + 12 = 1036$！不管物理页在内存条被挪到多远，**页内偏移在翻译前后永远一模一样不变**。
      - card:
          title: '多级页表、TLB 快表、缺页与保护权限'
          body: |
            光有单层大表格既占海量的空间又慢得要命，真实系统必须再配三把保护伞：
            1. **多级页表**：把平面巨大表拆成多级目录树，只给真用到的活跃区域开辟分支条目；
            2. **TLB**：在芯片内部专门缓存近期最热门的映射条目，省得次次先逛主存慢查表；
            3. **缺页**：访问尚未进驻硬件内存条的合法冷页时触发 **缺页** 事件交由系统调入后无痛重跑；另有权限位拦杀越权读写！
          reveal:
            - title: 为什么现代 64 位架构不用平铺大表、且极依赖 TLB？
              body: |
                算笔账：4 KB 一页，哪怕 32 位仅 `4 GB` 空间也高达 $2^{20} \approx 100\text{ 万}$ 项（每项 4 B 就要整整 4 MB 连续空间），到了 64 位更是天文数字！拆成多级目录只为真用到的一点小内存页建叶子表，极大省空间；而为了不让一次访存额外多逛四次主存查 4 级表，就靠 TLB 把常见 99%+ 翻译控制在 `1` 拍内完成！
            - title: 为什么“页内偏移”在翻译成物理位置时一位都不必动？
              body: |
                因为硬件强制规定逻辑页大小与物理框大小严格一致（比如都是 $1024 = 2^{10}$ 或 $4096 = 2^{12}$ 字节）且页边界对齐！因此“本页里面从开头算起第几个字节”这低 10 位或低 12 位彻底相同，查表只需替换左半边高位页号！
      - item:
          id: tlb-purpose-choice
          type: choice
          prompt: |
            当硬件配备 **多级页表**（例如 4 级）后，如果每次 `lw` 取数前硬件都必须老老实实先去主存逛整整 4 趟才能拿到物理地址，速度会慢成灾难！**TLB** 怎么化解这个性能灾难？
          options:
            - text: TLB 在核心旁边自带一小片极快硬件缓存专门记住近期最常用虚拟页到物理框的直接映射（跳过漫长多级查表 1 拍出结果）
              correct: true
            - text: TLB 直接把整张 4 KB 数据页里的全部字节内容装进自己肚子里，完全取代 L1 数据缓存
              why: TLB 只缓存“虚拟页号 → 物理框号”的地址翻译映射项，并不存放 4 KB 页面里的具体业务数据（那是数据 Cache 的活）
            - text: 有了 TLB 之后，操作系统就再也不用在主存里维护多级页表了
              why: TLB 只是页表热点项的小型缓存（通常几十到几百项）；一旦遇到 TLB 未命中，仍然必须去主存遍历多级页表并把结果填入 TLB
          explain: |
            TLB 就是专为“地址翻译映射”服务的高速小缓存！
      - item:
          id: vm-protection-pagefault
          type: choice
          prompt: |
            关于虚拟内存的**缺页（Page Fault）**机制和**内存保护（Memory Protection）**权限位，下列判断哪项完全正确？
          options:
            - text: 缺页未必代表程序写出了 bug（常常是合法冷页面还在磁盘，系统调入内存更新条目后可从原指令无缝继续执行）；而越权写只读代码页则会触发硬保护异常被当场拦杀！
              correct: true
            - text: 只要触发一次缺页，就说明程序发生了不可恢复的非法访问错误，操作系统必须立刻杀死该程序
              why: 按需调页（Demand Paging）正常运行时极常见合法缺页，操作系统把页从磁盘读进空闲物理框后即可恢复原指令继续执行
            - text: 页表里只记录物理页号，根本存不了“只读”或“不可执行”的权限标记位
              why: 每个表项都附带 Valid、Read/Write、User/Kernel、Execute-Disable 等关键安全保护位！
          explain: |
            既省内存按需加载、又卡死读写/执行安全红线，多级页表把软件隔离与硬件安全紧紧锁在一起。
      - item:
          id: vm-terms-match
          type: match
          prompt: |
            把虚拟内存子系统的四个关键构件跟各自职责精准配对。
          pairs:
            - ["**页表**（Page Table）", "按页记录虚拟页号到物理页号翻译对照及访问权限位"]
            - ["**多级页表**", "把平面巨大表拆树形按需开辟目录，避免空洞虚拟空间白占海量内存"]
            - ["**TLB**（快表）", "紧贴 MMU 缓存近期最热门的虚拟→物理页翻译项，避免次次逛主存"]
            - ["**缺页**（Page Fault）", "访问尚未入驻物理内存的有效页面时唤醒操作系统加载并无缝重跑"]
          explain: |
            `TLB` + `Cache` 常有巧妙协同：现代 L1 常做“虚拟索引、物理标签（VIPT）”，一边用低位免等偏移并行进组、一边等 TLB 吐出 PFN 比对标签，兼顾极速与无歧义！

  # ==== 多核一致性 ====
  - id: coherence
    chapter: 多核一致性
    title: 多核私有缓存 MSI 写失效一致性与伪共享（False Sharing）
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            核 0 和核 1 两个 CPU 核心各自都有独立的私有 L1 缓存。开头两个核心都读了一次主存地址 `X`（里面放着数字 `10`），所以核 0 的缓存里存了 `X = 10`、核 1 缓存里也有 `X = 10`。突然核 0 把自己这边的 `X` 改写成了 `99` 却没声张通知核 1！过一秒核 1 再去读自己的 `X`，读出多少？
          options:
            - text: 读出了死去多年的过时假数据 `10`！必须靠硬件一致性协议在写入时把其他核里旧副本强制**失效（Invalidate）**或更新！
              correct: true
            - text: 核 1 会自动绕过自己的私有 L1 缓存，每次读取都直接去主存拿最新值，所以私有缓存根本存不住共享变量
              why: 只要核 1 的私有 L1 缓存里那一行还标着有效（Valid），它就会直接命中返回本地旧值 `10`，不会无故去慢速主存重读！
            - text: 两个核永远绝对不允许读取同一块共享内存
              why: 共享数据正是多核并发协作的基础，硬件**缓存一致性**默默帮软件护航
          explain: |
            核 0 只改了自己缓存里的副本，核 1 缓存里的 `X = 10` 没人去动，读到的就是过时数据。所以硬件要有一致性协议：一个核写入时，让其他核里的旧副本失效。这一课看 **MSI 三态写失效协议** 怎么做到这一点，再看它带来的一个隐蔽性能问题：**伪共享（False Sharing）**。
      - card:
          title: '缓存一致性与 MSI 三态写失效协议'
          body: |
            多核各自带私有缓存时，**缓存一致性** 协议给每个缓存行贴上三种标签防止副本冲突：
            - **M（已修改独享脏态）**：仅本核有唯一最新改写版本，淘汰前要写回；
            - **S（共享只读清洁态）**：多核均可持有相同干净副本并放心读取；
            - **I（已失效态）**：数据早已作废，用前必发总线请求！
      - item:
          id: msi-write-c4
          type: choice
          prompt: |
            在 **MSI 写失效协议** 下，两个核心（核 1 与核 2）各自的私有缓存里起初都持有同一内存块的 **`S`（共享）态**副本。现在 **核 1** 向这块发出一次写入操作后，核 1 与核 2 各自这块的最终状态分别变成什么？
          options:
            - text: 核 1 发出总线写失效请求后转为 **`M`（Modified）态**；核 2 侦听到失效请求后自己的旧副本从 `S` 强制转为 **`I`（Invalid）态**
              correct: true
            - text: 核 1 和核 2 都同时继续各自保持 `S`（Shared）态互不管
              why: 若允许两边同时带着不同修改各自保持 `S`，下次核 2 去读就会读出跟核 1 完全矛盾的假值！
            - text: 核 1 变成 `I`（失效），核 2 自动原地升为 `M`
              why: 谁发起写操作谁就要获取独占写入权（变为 `M`），其余持相同副本的核心必须统一被迫废成 `I`
          explain: |
            “一写全废、独掌写权（M）”——记住这个核心规则就能追踪所有 MSI/MESI 状态转移！
      - card:
          title: '监听 vs 目录实现，与伪共享（False Sharing）'
          body: |
            - **两种硬件实现**：核少共用一条共享总线时靠 **总线嗅探（Snooping）**；扩展到几十上百核改用 **目录（Directory）** 登记谁持有副本并点对点发失效（比写更新全网通报省海量带宽！）；
            - **实战写法注意**：核 1 与核 2 若原本均为 `S`，核 1 写前先发写失效使自身 `S→M`、核 2 废为 `I`！
          reveal:
            - title: 什么是最隐蔽的多核性能暴跌元凶——**伪共享（False Sharing）**？
              body: |
                因为一致性协议是以整条**缓存行（比如连续 `64 字节`）**为最小加锁失效颗粒，而不是按 4 字节单独算的！
                如果核 1 只疯狂写连续区块内字段 `.a`（第 `0..3` 字节），核 2 只疯狂写紧挨着的另一个毫不相干字段 `.b`（第 `4..7` 字节）——偏偏两者凑巧住在了**同一条 64 B 缓存行里**！结果核 1 一写就把整行夺成 `M` 让核 2 的整行变成 `I`，核 2 刚写又把整行抢成 `M` 把核 1 变 `I`——毫无共享关系的两个字段竟引发全行不停歇“乒乓失效搬运”，多核越加越慢！**标准解法**：把不同核高频写的独立字段按缓存行大小做**填充（Padding）或对齐（Align）**，让它们彻底落进不同的缓存行！
            - title: 为什么真实商用芯片在 MSI 上再多加一个 `E（独享清洁）` 变成 MESI 协议？
              body: |
                单核独自干活时经常自己读入一块私用局部块并马上准备修改它！如果是纯 MSI，首次读入先标为 `S`（假装可能别人也有），紧接着下一句写它时又不得不上总线额外再发一次空跑“写失效通告”来升成 `M`；加上 **`E（Exclusive 独享未改）`** 后，首读如果总线发现没人持有直接给 `E`，下一句自己写它时悄悄原地静默翻成 `M`，省下一整次总线通信！
      - item:
          id: false-sharing-c4
          type: choice
          prompt: |
            什么是多核编程里的**“伪共享（False Sharing）”**，又该如何根本消除它？
          options:
            - text: 两个核心各自写入逻辑上互不相干的不同变量，但这两个变量恰好落进了同一条缓存行里，导致一致协议使该整行在两核间反复失效搬运、性能暴跌；做法是填充字节或按缓存行宽度对齐把它们分拆开落到不同行！
              correct: true
            - text: 因为多个核心在逻辑上真的要共同写同一个变量，无法避免
              why: 共同写同一个变量叫“真共享”；**伪**共享的“伪”字恰恰指逻辑上本毫无共享交集，却被物理 64 B 粗颗粒行绑死打架
            - text: 伪共享会导致两个核把对方的变量值覆盖算错，必须让两个核排队轮流单核执行才能算对
              why: 硬件缓存一致性已经保证了伪共享时计算结果 100% 正确（不会算错数），它带来的是缓存行反复失效的性能暴跌，应靠填充/对齐拆行解决而非串行排队！
          explain: |
            在性能调优中遇到“2 核跑得还不如 1 核快，且 CPU 没算满却大量卡在写缓存未命中”，十有八九就是撞上了伪共享！
      - item:
          id: coherence-impl-match
          type: match
          prompt: |
            把多核**缓存一致性**里的四种机制与特征配对清楚。
          pairs:
            - ["总线嗅探（Snooping）", "全部核心挂在共享总线上各自偷听别核发出的读写请求维护一致"]
            - ["基于目录（Directory-Based）", "当核数膨胀到几十上百核群发通告塞爆总线时，靠目录账本点对点只通知真持有者"]
            - ["写失效（Write-Invalidate）", "一核写前先把别人副本通通标记作废，随后自己连改一百次也不用惊动别人"]
            - ["写更新（Write-Update）", "每次写都把最新写入数据全网推送过去顺便替别人原地改新，高频写入极费总线带宽"]
          explain: |
            主流现代芯片压倒性采用“**写失效协议**（如 MESI/MOESI）”，小核集群用嗅探、众核片上网常用分布式目录！
      - item:
          id: msi-states-match
          type: match
          prompt: |
            区分 MSI 缓存一致性协议里三种行状态标签的准确含义。
          pairs:
            - ["`M`（Modified 已修改）", "仅本核独有且已被自己改脏（比主存新），淘汰或被他核读时须负责送出新值"]
            - ["`S`（Shared 共享清洁）", "与主存数值一致，可能多核同时在读，任何核想写之前必先通知他核失效"]
            - ["`I`（Invalid 已失效）", "该槽数据早已过期作废不可再直接读取，必须重新发起读缺失获取最新版本"]
          explain: |
            有写先夺权废他（S→M，他核 S→I），多读安心共持（S），脏行别忘记替换写回主存！

  - id: ordering
    chapter: 多核一致性
    title: 缓存一致性 vs 内存一致性模型（Memory Consistency）区别与重排
    minutes: 11
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            假设你的多核处理器已经造得完美符合了“单地址一致（对同一个共享地址，两核绝不会同时看见冲突旧值）”。现在核 0 先写数据 `data = 42` 再立旗 `flag = 1`；核 1 死等看到 `flag == 1` 后去读 `data`。因为核心自带先偷藏着写的写缓冲队列等优化，有没有可能明明单地址一致性完全没坏，核 1 却偏偏在看见 `flag == 1` 之后去读 `data` 仍读出旧值 `0`？！
          options:
            - text: 完全可能！因为这牵涉到**两个不同地址（`flag` 与 `data`）**谁的修改先被外界看见的全局先后顺序——需要由跨地址可见顺序规则来约定！
              correct: true
            - text: 绝不可能！只要一个地址保证一致，全宇宙所有不同地址之间的顺序自动按人类愿望 100% 锁死永不乱序
              why: Store Buffer、乱序执行及非阻塞缓存会导致核心对两个**不同地址**写操作以反直觉顺序对外显现！
            - text: 这说明单地址的 MSI 缓存一致性协议出故障坏掉了，没有把 `data = 42` 发上总线
              why: 即使每个单地址各自完全符合 MSI 缓存一致性，对 `data` 的写入也可能还在核 0 的写缓冲（Store Buffer）里排队，导致不同地址间观察顺序反转！
          explain: |
            高手体系结构分水岭：彻底厘清 **Cache Coherence（单位置写可见一致性）** vs **跨多地址全局可见顺序**！
      - card:
          title: '缓存一致性 vs 内存一致性模型（Memory Consistency）'
          body: |
            不要被两个长得极像的中文词绕晕：
            - **缓存一致性**（Coherence）管的是“**单一地址 X**”：全系统对同一块内存 `X` 的修改历史有一致认知，绝不允许同时看岔；
            - **内存一致性模型**（Consistency）管的是“**不同地址 X 和 Y 之间跨核可见顺序**”：核 0 依次写了 `data` 和 `flag`，核 1 能不能先看到新 `flag` 却看不到新 `data`？
      - item:
          id: coherence-vs-consistency
          type: choice
          prompt: |
            面试高发难题：一句话精准说出**缓存一致性（Coherence）**与**内存一致性模型（Memory Consistency）**关注对象的本质区别是？
          options:
            - text: 缓存一致性约束**同一个共享内存地址**上的多核副本别打架过时；内存一致性模型规定**不同内存地址**之间的读写操作何时、以什么全局先后顺序对各核可见！
              correct: true
            - text: 缓存一致性只对单核处理器有意义，内存一致性模型只对没有缓存的处理器有意义
              why: 两者都在管多核存储视界：前者定单地址多副本写传播归属，后者定跨多个不同地址的全局可见排程秩序
            - text: 这两个词指的物理硬件和规定完全是百分百同一个东西没有丝毫区别
              why: 一颗 x86 芯片和一颗 ARM 芯片都满足完美缓存一致性，但 x86 采用较强的 TSO 内存序而 ARM 采用更宽松弱序！
          explain: |
            下次再在并发代码里遇到“为何必须加 `memory_fence` 或原子 acquire/release 语义”，瞬间就能联想到处理器底下这套写缓冲与内存序规则！
      - card:
          title: '顺序一致性（SC）vs 宽松写缓冲序与内存屏障'
          body: |
            - **顺序一致性（SC）**：最严苛直观，所有核心看似按单一全局交错步调运行，但极大压抑了核心写缓冲并发性能；
            - **宽松内存序（TSO / 弱序）**：允许核把写暂存在自己私家写缓冲里继续往下猛跑，真需要在多核之间严格交付数据前再显式插一道 **内存屏障（Fence）** 刷清队列！
          reveal:
            - title: 最经典反直觉乱序试验：为什么两核各自读都能看见 `0, 0`？
              body: |
                初始 `X=0, Y=0`。核 0 跑：`X=1; r1=Y;`；核 1 跑：`Y=1; r2=X;`。只要核 0 的 `X=1` 先偷停在自己私家写缓冲还没冲向一致性缓存之前，核 0 早就急着先读到 `Y=0`；同拍核 1 也把 `Y=1` 捂在自己写缓冲先去读到 `X=0`！最终竟然合法得出 `r1=0, r2=0` ——单看 `X` 和单看 `Y` 缓存一致性全都 100% 守规矩，只是跨地址顺序松动了！
            - title: 连写缓冲都放行的“弱序模型”，为什么还值得 ARM / RISC-V 坚持使用？
              body: |
                因为在绝大部分程序执行时间里，一个核心连续访问的不同变量根本不需要实时盯着别核！允许核心趁等待远端缓存响应时把本地无关读写先跑起来、把写先排进缓冲队列批量合写，能大幅压榨指令级并发和内存带宽——仅在锁释放/获取或原子标记交接那一小撮关键时刻，才显式插入屏障保序！
      - item:
          id: fence-needed-when
          type: choice
          prompt: |
            在一个采用宽松内存序的弱序多核系统里，核心 A 连续执行：`data = 99; flag = 1;`，紧接着需要依赖核心 B 见到 `flag == 1` 后保证一定能读到 `99` 而不是旧值 `0`。核心 A 在两条写指令之间应当采取什么架构动作？
          options:
            - text: 插入一条**内存屏障 / 栅栏指令（Memory Fence）**，要求先把 `data = 99` 对系统其余核心彻底可见落定之后，才许对外发布 `flag = 1`！
              correct: true
            - text: 把 `flag` 改成写两遍 `flag = 1; flag = 1;`
              why: 不插屏障的话连续两句写出依然可能双双受写缓冲合并重排在 `data = 99` 之前曝光
            - text: 什么都不用做，因为 MSI 缓存一致性协议本身就已经禁止写缓冲打乱不同地址的写入顺序
              why: 缓存一致性只管单一地址，不管 `data` 与 `flag` 两个不同地址离开写缓冲的先后顺序，必须靠内存屏障指令显式保序
          explain: |
            平日绝大多数正常计算让硬件尽情乱序写缓冲提速，只在同步发布交接旗帜的路口放一把栅栏！
      - item:
          id: ordering-steps-order
          type: order
          prompt: |
            把严格实现核间安全消息传递（核 0 发布数据给核 1 消费）在弱序核上必守的正确硬件时序排起来：
          steps:
            - 核 0 先把有效载荷写入 `data` 并执行写入内存屏障保证 `data` 全局可见落地
            - 核 0 接着写入发布标记 `flag = 1` 通知下游已就绪
            - 核 1 确认观察到 `flag == 1` 并带获取屏障后再读取 `data` 确保拿到最新 `99`
          explain: |
            生产端 Release Barrier + 消费端 Acquire Barrier，正是现代多核无锁队列的硬件原理！

  # ==== 分支预测和性能模型 ====
  - id: predict
    chapter: 分支预测和性能模型
    title: 静态 vs 动态 2 位饱和分支预测器与循环准确率演算
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一个 `for` 循环每次跑 `100` 圈：前 99 圈走到末尾都要“跳转回开头（Taken, T）”，唯独最后第 100 圈退出循环才走“不跳转（Not-Taken, N）”。如果拿一个傻瓜记性极差的**1 位预测器**（上一回怎么走这次就全盘跟着赌怎么走）：它在第 100 圈退出必猜错 1 次并立刻翻脸记住“以后都要赌不跳”；可下回重进同一段循环第 1 圈时它居然又顺手接着赌不跳再连续错第 2 回！怎么只加多 1 比特记忆就干掉这第二次冤枉错？
          options:
            - text: 升级成**2 位饱和计数器**（00 强不跳 / 01 弱不跳 / 10 弱跳 / 11 强跳）：必须**连续错两次**才推翻长期主方向，偶尔循环退出错一次只降回“弱跳”，下回进循环照样稳稳预测跳！
              correct: true
            - text: 改用永远预测“不跳转（Not-Taken）”的静态策略，在这段 100 圈循环里就能达到 99% 准确率
              why: 循环前 99 圈全要跳转回开头，永远猜“不跳转”反而会猜错 99 次、只猜对最后退出那 1 次（准确率仅 1%）！
            - text: 保持 1 位预测器不变，因为它只在第 100 圈退出时猜错 1 次，下次重新进入循环第 1 圈时会自动猜对
              why: 1 位预测器在第 100 圈遇到不跳转后已经把记录改成了“不跳转”，导致下次重进循环第 1 圈真实发生跳转时必然再错第 2 次！
          explain: |
            1 位预测器只记上一次的结果，每次退出循环猜错一次，下次进循环又猜错一次。2 位饱和计数器要连续错两次才改变方向，退出循环那一次只把它从“强跳”降到“弱跳”，下次进循环仍然猜跳。这一课一步步演推它的状态机，算出准确率。
      - card:
          title: '分支预测：1 位易摇摆 vs 2 位饱和计数器 4 状态图'
          body: |
            把历史表格（BHT）每项做成 `0..3` 共 4 档状态的**2 位饱和计数器**来做动态 **分支预测**：
            - **预测规则**：高位为 `1`（状态 `10 弱跳转` 或 `11 强跳转`）时一律预测 **跳转（T）**；高位为 `0`（`00 强不跳` 或 `01 弱不跳`）时一律预测 **不跳转（N）**。
            - **更新规则**：真实发生 **T（跳）** 就往大加 `1`（封顶卡死在 `11` 不溢出！）；真实发生 **N（不跳）** 就往小减 `1`（保底卡死在 `00` 不借位！）。
          reveal:
            - title: 一拍一拍演推`T T T N` 循环序列上的预测与命中率
              body: |
                分支真实序列反复出现 `T, T, T, N`（每 4 次循环退出 1 次），初始为 **`11`（强跳转）**：
                1. 第 1 次（在 `11`）：预测 **T**，实际 **T** → **对**！留 `11`；
                2. 第 2 次（在 `11`）：预测 **T**，实际 **T** → **对**！留 `11`；
                3. 第 3 次（在 `11`）：预测 **T**，实际 **T** → **对**！留 `11`；
                4. 第 4 次（在 `11`）：预测 **T**，实际 **N** → **错**！减 1 降回 **`10`（弱跳转）**；
                5. 新一轮第 1 次（在 `10`）：仍旧预测 **T**，实际 **T** → **对**！加 1 涨回 `11`！
                稳定循环中每 4 次严格 **对 3 次、错 1 次**，准确率 $= 3/4 = \mathbf{75\%}$！
            - title: 为什么猜出“要跳转（Taken）”还不够，取指单元还迫切需要 BTB？
              body: |
                因为条件分支指令 `beq` 在 `IF` 取指那一拍刚从缓存摸出来，译码器还没解出那条跳转偏移立即数、加法器也还没把目标新地址 `PC + 4 + offset*4` 算出来！**分支目标缓冲（BTB）**就像一本小记事本，提前记着“如果这条 PC 地址预测要跳，请立刻从这个目标地址接着取指”，才真正在 0 停顿下直接转弯！
      - item:
          id: two-bit-tttn-hits
          type: number
          prompt: |
            拿上述初始处在 **`11`（强跳转）** 状态的 2 位饱和分支预测器（`10/11` 预测跳，`00/01` 预测不跳；实际跳就加 1 封顶 `11`，不跳减 1 封底 `00`），连续送入两轮模式 `T, T, T, N, T, T, T, N`（共 `8` 次分支）。一共预测对了多少次？
          answer: 6
          hint: '逐拍盯紧计数器状态（每次遇到 N 会扣减到哪一档？随后下拍遇到 T 时高位还是 1 吗？）。'
          explain: |
            两轮 `T T T N` 分别在每次最后的 `N` 处各误判 1 次（降成 `10` 弱跳转并在下一拍 `T` 预测正确涨回 `11`），总计 `8` 次里面对 `6` 次！
      - item:
          id: two-bit-tttn-pct-c4
          type: number
          prompt: |
            某循环分支每轮结果稳态重复 `T, T, T, N`。采用初始为“强跳转（`11`）”的 **2 位饱和计数器** 预测时，长远稳定后的预测准确率是多少（填整数百分比，例如 `80%` 则填 `80`）？
          answer: 75
          hint: '看看每一整组重复周期（4 次分支里）稳定只失手错了几次、对了多少次？'
          explain: |
            `3 / 4 = 75%`（每 `12` 次稳对 `9` 次、`8` 次稳对 `6` 次，长远稳定比率严格等于 `75%`；而 1 位预测器面对 `T T T N` 会在每次 `N` 后面的第一个 `T` 也多错 1 次，掉成仅 `50%`！）。
      - item:
          id: one-vs-two-bit-why
          type: choice
          prompt: |
            面对 `T, T, T, N` 这种反复末尾跳出 1 次的主导跳转循环模式，为什么 **1 位预测器** 的长期稳态准确率只有可怜的 `50%`，而 **2 位饱和预测器** 却能一跃达到 `75%`？
          options:
            - text: 1 位预测器在 `N` 处猜错后会瞬间彻底翻盘改押不跳，连累紧接着新循环第 1 次真实 `T` 再连错一拍；2 位预测器有中间“弱”状态缓冲，错 1 次仍记得主旋律继续猜 `T`！
              correct: true
            - text: 因为 2 位预测器会在执行分支前提前去读源程序里的循环上限常数，直接算出这是第 4 圈并猜对末尾的 `N`
              why: 2 位饱和预测器在末尾 `N` 处同样会猜错 1 次！它赢在“错 1 次只降为弱跳（`10`）而不翻盘”，省掉了下一轮开头第 1 个 `T` 的二次误判
            - text: 1 位预测器实际上在这组序列也能拿到 75% 准确率，两者没有区别
              why: 1 位预测器在 `T, T, T, N` 循环中既猜错末尾的 `N`，又猜错下一轮开头的第 1 个 `T`，每 4 次错 2 次，准确率只有 `50%`！
          explain: |
            现代化核心还会结合**全局分支历史（两级自适应 / TAGE）**把嵌套与关联条件预测准确率推上 `95%~99%`！
      - item:
          id: predictor-parts-match
          type: match
          prompt: |
            把分支预测架构里的关键硬件表与概念配对起来。
          pairs:
            - ["分支历史表（BHT / 2-bit）", "按指令地址索引记录 2 位饱和计数器，在译码前押注跳还是不跳"]
            - ["分支目标缓冲（BTB）", "提前把跳转去往的目标 PC 新地址记下来，甚至还没译码就能直接跳取下一拍"]
            - ["全局历史相关性（Two-level）", "参考最近连续好几条邻近分支的走法来区分不同上下文（如相邻两个 if）"]
          explain: |
            BHT 负责猜“**去不去**（方向）”，BTB 负责记“**去哪里**（目标地址）”，缺一不可才能 0 气泡顺畅拐弯！

  - id: cpu-time
    chapter: 分支预测和性能模型
    title: CPU 铁三角性能方程：比较 CPI、主频与总执行时间加速比
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            新架构师给你拿来一颗新版芯片设计图：跑完全相同的 `10^9` 条指令程序，把原本的 **`CPI = 1.5` 狠降到了 `1.2`**，代价值得注意——为了塞进更多并行逻辑，最高时钟主频从原本的 **`2.0 GHz` 略微降到 `1.8 GHz`**！老板急问：主频居然降了 10%，这颗“低主频新芯片”到底跑得更快还是更慢？
          options:
            - text: 别被主频下降吓跑！算一算总耗时：从 `0.75 秒` 缩成了约 `0.667 秒`，新设计实打实提速了 **`1.125 倍`**（快了 12.5%！）
              correct: true
            - text: 主频降了芯片必慢，永远只准看 GHz 数字比快慢（“主频迷信”）
              why: 真实总时间看的是 `指令数 × CPI / 频率`；CPI 跌掉 20% 远大于频率降掉 10% 的损失！
            - text: '`CPI` 降低了 `0.3`、主频降低了 `0.2`，只要把两个差值相减就知道新芯片快了 `0.1` 秒'
              why: 性能方程是乘除关系（`指令数 × CPI / 主频`）而非加减关系，必须分别算出 `0.75 秒` 与 `0.667 秒` 再求比值！
          explain: |
            CPU 时间 = 指令数 × CPI ÷ 主频。CPI 降了 20%，主频只降了 10%，算下来总时间从 `0.75` 秒缩到约 `0.667` 秒，新设计反而更快。这一课讲这条“**性能铁三角方程**”，它说明为什么不能只盯着 MHz/GHz 看性能。
      - card:
          title: CPU 时间性能铁三角与加速比核算
          body: |
            衡量一段固定程序在一颗芯片上真正花掉的物理秒数，永远只认这三条因子的乘积（其中 **CPI** 表示平均每条指令消耗的时钟周期数）：
            $$\text{CPU 执行时间} = \text{指令条数（IC）} \times \text{CPI} \times \text{时钟周期} = \frac{\text{IC} \times \text{CPI}}{\text{时钟频率 } f}$$
            - **核心洞察**：缩减程序指令条数 `IC`、加转发与好预测压低 `CPI`、缩流水级数拔高 `f`，三管齐下都能变快！但也常互相牵制，比如**加长流水级常升频却也加重分支惩罚抬高 CPI**！
            - **加速比定义**：$$\text{Speedup} = \frac{\text{优化前耗时 } T_{old}}{\text{优化后耗时 } T_{new}}$$（大于 1 表示确实更快！）。
          reveal:
            - title: 用代数完整校验加速比的精确值（1.125 倍）
              body: |
                程序指令数 $\text{IC} = 10^9$：
                1. **旧版耗时**：$T_{old} = \frac{10^9 \times 1.5}{2.0 \times 10^9\text{ Hz}} = \frac{1.5}{2.0} = \mathbf{0.75\text{ 秒}}$；
                2. **新版耗时**：$T_{new} = \frac{10^9 \times 1.2}{1.8 \times 10^9\text{ Hz}} = \frac{1.2}{1.8} = \frac{2}{3} \approx \mathbf{0.667\text{ 秒}}$；
                3. **加速比**：$\frac{T_{old}}{T_{new}} = \frac{3/4}{2/3} = \frac{9}{8} = \mathbf{1.125}$（注意比值甚至不依赖 `0.667` 的小数四舍五入误差！）。
            - title: 用性能铁三角秒懂历史上 RISC 与 CISC 的核心博弈
              body: |
                早年 CISC 追求单条复杂指令做完十件事从而把程序 **指令条数 IC** 压少；可代价是复杂指令让流水线难拆细、硬件控制笨重，导致 **CPI** 暴涨且时钟频率被拖垮！而 RISC（MIPS/RISC-V）宁愿稍微多写几条简短规整指令，换来 **CPI 贴近 1** 且主频飞涨数倍——总乘积秒数反而大获全胜！
      - item:
          id: cpu-time-old-c4
          type: number
          prompt: |
            一个程序共有 $10^9$ 条指令，原处理器执行它的平均每指令周期数 `CPI = 1.5`，工作主频 `2 GHz`（即 $2 \times 10^9\text{ Hz}$）。原处理器运行完这段程序需要多少秒（填小数）？
          answer: 0.75
          hint: '将公式 $\frac{\text{指令数} \times \text{CPI}}{\text{频率}}$ 中前后的 $10^9$ 直接约掉计算。'
          explain: |
            $T_{old} = (10^9 \times 1.5) / (2 \times 10^9) = 1.5 / 2 = 0.75\text{ s}$。
      - item:
          id: cpu-speedup-c4
          type: number
          prompt: |
            还是 $10^9$ 条指令，原本 `CPI = 1.5 @ 2 GHz`（耗时 `0.75 s`）。微架构改进后降为 `CPI = 1.2` 且主频略降至 `1.8 GHz`。改版后的精确整体**加速比**（$T_{old} / T_{new}$）是多少（保留三位小数）？
          answer: 1.125
          tolerance: 0.005
          hint: '先分别用分数写出改前和改后的运行秒数（保留分数 $\frac{3}{4}$ 和 $\frac{2}{3}$ 最精确！），再用旧耗时除以新耗时。'
          explain: |
            $T_{new} = 1.2 / 1.8 = 2/3\text{ s}$，精确加速比 $\frac{3/4}{2/3} = \frac{9}{8} = 1.125$（哪怕降频 10%，总体依然提速 12.5%！）。
      - item:
          id: cpu-subrun-calc
          type: number
          prompt: |
            一段共有 $2 \times 10^8$ 条指令的程序，运行在一颗平均 `CPI = 1.5`、主频 `2 GHz`（即 $2 \times 10^9\text{ Hz}$）的处理器上，跑完它一共需要多少秒（填小数）？
          answer: 0.15
          hint: '把指令数换算成以十亿（$10^9$）为单位乘以 CPI 再除以 GHz，注意 $2\times 10^8 = 0.2\times 10^9$。'
          explain: |
            $0.2 \times 1.5 / 2 = 0.3 / 2 = 0.15\text{ s}$。
      - item:
          id: perf-equation-trap
          type: choice
          prompt: |
            某芯片厂商广告宣称把最新代处理器的指令数靠复杂指令压缩了一半，结果发现新处理器为了译码变笨重反而把 CPI 暴涨成了原来的 3 倍、时钟频降到原来一半。用铁三角检验它跑这批代码到底怎么变了？
          options:
            - text: 新时间是原来的 $0.5 \times 3 / 0.5 = 3$ 倍，反倒惨败变慢了 3 倍！绝不能只看“指令数变少”或“主频升高”单项指标做宣传结论
              correct: true
            - text: 只要指令条数少了一半，电脑就必定保证快两倍以上
              why: 铁三角三个因子会彼此挤压反噬，必须整体相乘结算总秒数
            - text: CPI 翻了三倍会自动把运行秒数再除以 3
              why: 总执行时间与 CPI 成正比，CPI 越低越快、越高越慢
          explain: |
            这正是“精简指令集 RISC vs 复杂指令集 CISC”当年历史大争论的核心定量裁决武器：一切用 `IC × CPI / f` 实际跑分时间说话！

  - id: amdahl
    chapter: 分支预测和性能模型
    title: 阿姆达尔定律（Amdahl's Law）、多核瓶颈极限与性能建模
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一段跑得慢的科学计算任务里，有 `80%` 的工作极其适合拆给多核同时并行干，但剩下 **`20%` 死活只能在一个主核心上串行单线一步步算**（像初始化配置与合并总账）。哪怕今天不惜血本直接买来一台塞了 **一亿颗核心** 的超级神机，能把总时间缩成单核时的千万分之一吗？
          options:
            - text: 绝不可能！哪怕把那 80% 瞬间压到 0 秒，那死活拆不开的 **20% 串行部分** 依然一毫秒都不肯让步——总提速最高死卡在 **`1 / 0.2 = 5 倍`** 天花板上！
              correct: true
            - text: 只要核心数增加到 $N$ 倍，总运行时间就会按 `80% × N` 线性提速，不存在任何上限天花板
              why: 串行部分如同瓶颈铁门，无法被多核分摊，随着核数增多会占满剩余总耗时并锁死加速比上限
            - text: 因为只有 80% 可并行，所以哪怕用无穷多核，最高加速比也只有 `1 / 0.8 = 1.25 倍`
              why: 封死上限的是“不可加速的串行占比 `1 - 0.8 = 0.2`”，而不是可并行占比 `0.8`，因此最大加速比天花板是 `1 / 0.2 = 5 倍`！
          explain: |
            那 20% 串行部分不能加速，核再多也只能把 80% 的并行部分压到接近 0，总时间至少还剩原来的 0.2，所以加速比最多 `1 / 0.2 = 5` 倍。这一课用阿姆达尔定律把这个上限算出来。
      - card:
          title: '阿姆达尔定律公式与串行瓶颈上限'
          body: |
            把原程序耗时归一化当作 `1`，其中比例 $p$ 可以被加速 $N$ 倍（其余 $1 - p$ 原封不动），由 **阿姆达尔定律** 给出：
            $$S_{overall} = \frac{1}{(1 - p) + \frac{p}{N}}$$
            - **16 核提速计算（$p = 0.8, N = 16$）**：$S = \frac{1}{0.2 + 0.8/16} = \frac{1}{0.2 + 0.05} = \frac{1}{0.25} = \mathbf{4}$ 倍！
            - **核数不断无限增多的天花板**：$\frac{p}{N} \to 0$，上限 $S_{\max} = \frac{1}{1 - p} = \mathbf{5}$ 倍！**串行部分 $(1 - p)$ 决定提速上限！**
          reveal:
            - title: 给工程优化的反直觉启示：到底该优化“跑得快的常见路径”还是去拼死抠那“1% 生僻路径”？
              body: |
                正反两面看阿姆达尔定律：**第一步做架构提速时先猛抓占时 `80%~90%` 的大头**（比如加快常见指令与缓存命中率），因为加速仅占 `5%` 的冷门部分哪怕提速万倍，整体收益也至多约 `5.26%`（$1/0.95 - 1$）！可等你多核已经扩到 64 核以后，原先区区 `10%` 不起眼的锁竞争串行段已吞掉了总耗时绝大多数——此时唯一救命出路反过来变成了缩减那串行瓶颈！
            - title: 什么时候多核扩展能躲开阿姆达尔的“强扩展天花板”（弱扩展 / Gustafson 视角）？
              body: |
                当总计算任务固定死不变时（强扩展），增加核心早晚撞死在串行比例墙上；但在科学计算、高清渲染或大型模型训练里，人们买更多芯片核心往往不是为了把旧小问题缩成零点几秒，而是为了**在相同时间预算里塞进大 $N$ 倍的新网格或海量数据（弱扩展）**，从而使可并行工作规模随核心数水涨船高！
      - item:
          id: amdahl-16core-c4
          type: number
          prompt: |
            一个程序总运行时间中恰好 **`80%`（即 `0.8`）** 可以理想完美并行加速，剩下 **`20%`（即 `0.2`）** 必须绝对串行不能并行。放到 **`16` 核** 机器上运行时（忽略通信开销），按照阿姆达尔定律它的整体理论**加速比**是多少？
          answer: 4
          hint: '原时间视作 1：算出未优化的串行时间，加上“可并行部分分摊给 16 个核心的新耗时”，最后拿 1 除以这个新总耗时。'
          explain: |
            $S = \frac{1}{(1 - 0.8) + 0.8 / 16} = \frac{1}{0.2 + 0.05} = \frac{1}{0.25} = 4$ 倍！
      - item:
          id: amdahl-inf-limit-c4
          type: number
          prompt: |
            还是那道 **`80%` 可并行、`20%` 严格串行** 的程序。假设把核心数一直砸钱扩到趋于**无限多（$N \to \infty$）**，其整体加速比的理论不可逾越上限天花板是多少倍？
          answer: 5
          hint: '当核心数多到无限多时，那 80% 并行部分时间趋近 0 秒，只剩下死活加速不了的串行底线比例。'
          explain: |
            $S_{\max} = \frac{1}{1 - 0.8} = \frac{1}{0.2} = 5$ 倍——如果不从算法重构入手降掉那 `20%` 串行瓶颈，堆再多核心也突破不了 5 倍墙！
      - item:
          id: amdahl-75pct-limit
          type: number
          prompt: |
            快速对比：另一份程序只有 `75%` 可以并行（剩下 `25%` 严格串行）。就算给到无限多核数，它的加速比天花板最高是多少倍？
          answer: 4
          hint: '只保留不可加速的 `25%` 串行部分，算 `1` 除以这四分之一的串行份额。'
          explain: |
            $S_{\max} = 1 / (1 - 0.75) = 1 / 0.25 = 4$ 倍；想进一步加速到 10 倍，必须先把串行比例削减到 `10%` 以下！
      - item:
          id: amdahl-lesson-match
          type: match
          prompt: |
            把性能分析建模中的关键工程规律配对到对应数学含义。
          pairs:
            - ["加速大头（Make Common Case Fast）", "优先优化占总耗时 80%+ 的主路径才拿得出可观整体收益"]
            - ["**阿姆达尔定律**天花板 $1 / (1 - p)$", "不管局部并行算多快，没被加速的串行残余永远死死卡住上限"]
            - ["强扩展（Strong Scaling）痛点", "问题规模固定不变时拼命扩核心，通信与剩余串行很快撞上上限墙"]
          explain: |
            记牢：抓大放小、看清串行上限、用 CPU 铁三角统一度量，你就具备了真正系统架构师的量化视野！

boss:
  items:
    - id: boss-isa-lw-addr
      type: number
      prompt: |
        指令与寻址检验：某 MIPS 处理器寄存器 `$s0` 内保存基地址 `100`。当执行数据载入指令 `lw $t0, 12($s0)` 时，指令向数据缓存发出的实际读取内存字节地址是多少？（指令集）
      answer: 112
      explain: |
        有效字节地址 = `$s0 + 立即数偏移 = 100 + 12 = 112`（即向后跳过 3 个 4 字节字读取第 3 号元素）。
    - id: boss-hazard-stall-c4
      type: number
      prompt: |
        在带全旁路转发（Forwarding）功能的标准五级流水线（IF、ID、EX、MEM、WB）执行序列：`lw x1, 0(x2)`；`add x3, x1, x4`；`sub x5, x3, x6`。总共最少需要插入停顿多少个时钟周期？
      answer: 1
      explain: |
        `lw → add` 是经典的 `load-use` 冒险（MEM 末尾才能拿到 `x1`，来不及喂给本拍进 EX 的 `add`），虽有旁路仍停顿 `1` 拍；随后的 `add → sub` 直接经由 EX/MEM 旁路零停顿接住。
    - id: boss-cpu-speedup-c4
      type: number
      prompt: |
        某段共 $10^9$ 条指令的程序，在原处理器（`CPI = 1.5`、时钟 `2 GHz`）耗时 `0.75 s`。改版后 `CPI` 降到 `1.2`、时钟频率略降至 `1.8 GHz`。改进后相比改进前的整体精确加速比是多少（保留三位小数）？（性能模型）
      answer: 1.125
      tolerance: 0.005
      explain: |
        新时间 $T_{new} = (10^9 \times 1.2)/(1.8\times 10^9) = 2/3\text{ s}$，加速比 $= (3/4)/(2/3) = 9/8 = 1.125$。
    - id: boss-amdahl-c4
      type: number
      prompt: |
        某计算任务恰好 `80%` 可并行加速，剩下 `20%` 只能严格串行。用 **16 核** 处理器理想加速这 80% 部分时，整体加速比是多少倍？
      answer: 4
      explain: |
        $S = 1 / (0.2 + 0.8/16) = 1 / 0.25 = 4$ 倍；当核数趋于无穷时受制于 `20%` 串行部分上限为 `5` 倍。
    - id: boss-amat-l2-c4
      type: number
      prompt: |
        处理器 L1 缓存命中耗时 `1` 周期、缺失率 `5%`；加入 L2 缓存后其命中耗时 `10` 周期、局部缺失率 `20%`，L2 缺失再去主存需额外 `100` 周期。求整套带 L1+L2 存储系统的平均访存时间 **AMAT** 是多少周期（填小数）？
      answer: 2.5
      explain: |
        L2 平均耗时 $= 10 + 0.2 \times 100 = 30$ 周期；代回 L1 得 $\text{AMAT} = 1 + 0.05 \times 30 = 2.5$ 周期（无 L2 时为 `6` 周期）。
    - id: boss-msi-false-sharing-c4
      type: choice
      prompt: |
        多核 **MSI 写失效一致性**下，核 1 与核 2 都持有某块处于 `S`（共享）态的缓存副本，现在核 1 发起一次写请求后各自状态变成什么？以及怎样根除互不相关变量凑进同一行导致的“伪共享”？
      options:
        - text: 核 1 变 `M`（独享脏修改态）、核 2 变 `I`（失效态）；将两核各自高频写的不相干变量按缓存行大小做填充/对齐隔离到不同缓存行里！
          correct: true
        - text: 核 1 与核 2 永远齐齐保持 `S` 不变；解决伪共享应该把缓存行从 64 字节扩大到 4096 字节，让更多变量装进同一行
          why: 写入时必须发出总线失效令其他副本废为 `I`；加宽缓存行反而会把更多无关变量捆在同一行里，进一步恶化伪共享！
        - text: 两核同时全部变为 `I` 把数据扔掉；解决伪共享必须让两个核心轮流排队串行访问这两个变量
          why: 写发起者升格为 `M` 保持最新值；伪共享原本就没有逻辑写冲突，让两核排队串行只会更慢，正确做法是缓存行填充对齐（padding/align）
        - text: 核 1 变 `S`、核 2 变 `M`；伪共享指多个核心在共同读写同一个锁变量
          why: 发起写入的是核 1，应由核 1 晋升为 `M`、核 2 废成 `I`；伪共享特指毫无共享的各自独立变量共占一行打架
      explain: |
        核 1 升 `M`、核 2 降 `I`，再靠字节填充/对齐把多核高频写入变量拆分到各自独立的 64 B 缓存行！
    - id: boss-branch-predict-c4
      type: number
      prompt: |
        循环分支结果持续重复出现 `T, T, T, N`。采用初始设为“强跳转（`11`）”的 **2 位饱和分支预测器** 追踪预测，长远稳定后的预测准确率是多少（填整数百分比，例如 `80%` 填 `80`）？
      answer: 75
      explain: |
        每 4 次循环仅在末尾 `N` 处猜错 1 次（计数器从 `11` 降到 `10` 弱跳），下一拍开头 `T` 仍猜对回满 `11`，稳态命中率严格 `3 / 4 = 75%`！
