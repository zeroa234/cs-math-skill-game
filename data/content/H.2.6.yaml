skill: H.2.6
version: 2
authors: [main-agent]
brief:
  why: 芯片和外部世界打交道的那一段靠模拟电路：把天线、传感器送来的微弱信号放大，给全芯片提供准确的偏置电流和基准电压，再把模拟信号变成数字。这一站从模拟电子技术的平方律和小信号模型接着往深处讲：单级和差分放大器、电流镜、频率响应和稳定性、噪声、两级运放和密勒补偿、带隙基准，最后是开关电容和数据转换器。每个电路都要算出增益、带宽、噪声这些数，并说清设计时在哪些指标之间折中。
  outcomes:
    - 用平方律和小信号模型算漏极电流、跨导、输出电阻和本征增益，说明速度饱和、亚阈值导通和 gm/ID 设计法
    - 算共源级、源极跟随器、共栅级、共源共栅级和五管差分对的增益与输出电阻
    - 算电流镜的复制比例和沟道长度调制带来的误差，说明共源共栅电流镜和启动电路的作用
    - 用密勒定理、节点时间常数和开路时间常数法估算极点、增益带宽积和带宽，按两极点近似算相位裕度
    - 算电阻和 MOS 管的热噪声、等效输入噪声和 kT/C 噪声
    - 算两级运放的增益、密勒补偿后的增益带宽积、右半平面零点和压摆率，按相位裕度的要求定第二级跨导
    - 算带隙基准里 ΔV_BE 的温度系数和需要的放大倍数，说明输出为什么在 1.2 V 左右
    - 算开关电容的等效电阻和增益，比较几种数模转换器和 Flash、SAR、流水线模数转换器
terms:
  - term: 跨导效率
    def: 跨导和漏极电流之比 $g_m/I_D$，表示每单位电流换来多少跨导；平方律下等于 $2/V_{ov}$。
  - term: 沟道长度
    def: MOS 管源区和漏区之间沟道的长度，记作 $L$；沟道越长，沟道长度调制系数 $\lambda$ 越小。
  - term: 饱和余量
    def: 一个管子为了留在饱和区，至少要占掉的漏源电压，约等于它的过驱动电压。
  - term: 体效应系数
    def: 体效应公式里的系数 $\gamma$，单位是 $\sqrt{\text{V}}$，描述源衬电压让阈值电压升高的程度。
  - term: 体效应跨导
    def: 源极和衬底之间的小信号电压产生漏极电流的本领 $g_{mb}$，通常是 $g_m$ 的 0.1 到 0.3 倍。
  - term: 饱和速度
    def: 强电场下电子在硅里的速度上限，约 10 的 5 次方 m/s；达到它以后电流不再按平方律增长。
  - term: 速度饱和
    def: 电场很强时电子速度停在饱和速度附近、不再随电场增大的现象，会让短沟道管子的电流比平方律小。
  - term: 迁移率退化
    def: 栅压越高，垂直电场把电子压向表面，散射变多，迁移率随之下降的现象。
  - term: 亚阈值导通
    def: 栅压略低于阈值时管子仍有按指数随栅压变化的漏极电流，也叫弱反型。
  - term: 亚阈值摆幅
    def: 栅压低于阈值时，漏极电流每变化 10 倍所需的栅压变化，等于 $nV_T\ln10$，室温下不小于约 60 mV。
  - term: 共源级
    def: 输入接栅极、输出取自漏极、源极接交流地的单管放大器，也就是共源放大器。
  - term: 二极管接法
    def: 把 MOS 管的栅极和漏极连在一起的接法，小信号电阻约为 $1/g_m$。
  - term: 源极负反馈
    def: 在共源级的源极串一个电阻，用增益换线性度，等效跨导变成 $g_m/(1 + g_mR_S)$。
  - term: 共栅级
    def: 栅极接固定电压、信号从源极输入、从漏极输出的单管放大器，输入电阻约 $1/(g_m + g_{mb})$。
  - term: 套筒式共源共栅
    def: 差分对、共源共栅管和负载竖着叠在同一条电流路上的结构，功耗低、噪声小，但电压摆幅窄。
  - term: 折叠共源共栅
    def: 让输入管的信号电流折进另一种极性的共栅管的共源共栅结构，电压范围更宽，但多一路偏置电流。
  - term: 尾电流源
    def: 接在差分对两管公共源极下面的电流源，决定两管电流之和。
  - term: 差分对
    def: 两个相同的管子源极相连、下面接尾电流源的电路，主要对两个栅压之差有响应。
  - term: 五管运算跨导放大器
    def: 差分对加电流镜负载、共五个管子的放大器，差分输入、单端输出，常作两级运放的第一级，简称五管 OTA。
  - term: 吉尔伯特单元
    def: 由三个差分对组成的模拟乘法器，输出正比于两个输入电压之积，常用作混频器。
  - term: 共源共栅电流镜
    def: 在简单电流镜的两管上各串一个共栅管的电流镜，复制更准，输出电阻约 $g_mr_o^2$。
  - term: 低压共源共栅电流镜
    def: 用单独的偏置电压给共栅管供栅压，把输出端最低电压降到约 $2V_{ov}$ 的共源共栅电流镜。
  - term: 启动电路
    def: 上电时向自偏置电路注入电流、把它推出零电流工作点的辅助电路。
  - term: 密勒定理
    def: 跨在增益为 $A_v$ 的两节点之间的阻抗 $Z$，可以换成输入端 $Z/(1 - A_v)$ 和输出端 $Z/(1 - 1/A_v)$ 两个接地阻抗。
  - term: 增益带宽积
    def: 低频增益乘 −3 dB 带宽，记作 GBW；单极点放大器在主极点以上的任何频率，增益乘频率都等于它。
  - term: 跨阻放大器
    def: 把输入电流变成输出电压的放大器，常用输入端并联、输出端取电压的负反馈。
  - term: 单位增益频率
    def: 环路增益（或放大器增益）的幅度降到 1 时的频率。
  - term: 非主极点
    def: 主极点之外、频率较高的极点，它离单位增益频率多远决定了相位裕度。
  - term: 功率谱密度
    def: 每赫兹带宽里的噪声功率，单位 V²/Hz，开方后写成 V/√Hz。
  - term: 热噪声
    def: 导体里载流子热运动产生的随机噪声；电阻的电压谱密度是 $4kTR$，在很宽的频率范围内是平的。
  - term: 闪烁噪声
    def: 谱密度和频率成反比的低频噪声，也叫 1/f 噪声，MOS 管面积越大越小。
  - term: 等效输入噪声
    def: 把电路里所有噪声折算到输入端得到的一个噪声源，等于输出噪声除以增益。
  - term: kT/C 噪声
    def: 开关给电容采样后留在电容上的热噪声，方均值是 $kT/C$，和开关的电阻无关。
  - term: 压摆率
    def: 输出电压最快能变化的速度，两级运放里约等于输入级尾电流除以补偿电容。
  - term: 增益提升
    def: 给共栅管加一个辅助放大器把它的源极电压钉得更死，使输出电阻再乘上辅助放大器的增益。
  - term: 密勒补偿
    def: 在两级运放第二级的输入和输出之间跨接补偿电容，利用密勒效应让反馈环路稳定。
  - term: 极点分裂
    def: 密勒补偿让第一级输出的极点降到很低、第二级输出的极点升高，两个极点被拉开的现象，也叫极点分离。
  - term: 右半平面零点
    def: 补偿电容提供的前馈通路产生的零点，像极点一样让相位落后，却不让幅度下降。
  - term: 调零电阻
    def: 和补偿电容串联的电阻，取 $1/g_{m2}$ 时把右半平面零点移到无穷远。
  - term: CTAT
    def: 与绝对温度互补，指随温度升高而下降的电压或电流，如双极晶体管的 $V_{BE}$。
  - term: PTAT
    def: 与绝对温度成正比，指随绝对温度线性上升的电压或电流，如两只晶体管 $V_{BE}$ 之差。
  - term: 带隙
    def: 半导体价带顶和导带底之间没有电子状态的能量范围，也叫禁带宽度，室温下硅约 1.12 eV。
  - term: 带隙基准
    def: 把 CTAT 的 $V_{BE}$ 和放大后的 PTAT 电压相加，得到约 1.2 V、基本不随温度和电源变化的基准电路。
  - term: 采样保持
    def: 开关导通时电容跟着输入、断开时把那一刻的电压保持住的电路。
  - term: 电荷注入
    def: 采样开关断开时，沟道里的电荷有一部分流进采样电容、造成电压跳变的现象。
  - term: 时钟馈通
    def: 时钟边沿经开关管的栅漏交叠电容耦合到采样电容上造成的误差。
  - term: 开关电容
    def: 用时钟控制的开关搬运电容上的电荷来代替电阻的电路，特性由电容比和时钟频率决定。
  - term: LSB
    def: 最低有效位，也指转换器满量程除以 $2^N$ 得到的一份电压。
  - term: 量化噪声
    def: 把连续电压变成有限个数字级时产生的误差，均匀分布时有效值是 LSB 除以 $\sqrt{12}$。
  - term: Flash 型
    def: 用 $2^N - 1$ 个比较器同时比较、一个时钟出结果的模数转换器，最快但比较器多。
  - term: SAR 型
    def: 逐次逼近的模数转换器，用一个比较器和一个数模转换器逐位确定，N 位要比较 N 次。
  - term: 流水线型
    def: 把转换分成几级、每级粗量化几位并把余差放大后交给下一级的模数转换器。
lessons:
  - id: analog-intro
    chapter: MOS器件模型与小信号分析
    title: 为什么还要模拟电路
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 手机里绝大部分晶体管都在数字电路里。可天线收到的无线信号、麦克风送来的声音，进芯片的第一站却都是模拟电路。为什么？
          options:
            - text: 外面的信号是连续变化的，而且很弱，要先放大、滤波，才能变成数字
              correct: true
            - text: 模拟电路比数字电路省电，所以能用模拟的地方都用模拟
              why: 处理同样的运算，数字电路通常更省电、也更不怕噪声；前端用模拟电路是因为信号本身是连续的，不是为了省电
            - text: 只是习惯，换成数字电路效果一样
              why: 天线上的信号只有微伏级，直接交给数字电路处理会被噪声淹没，必须先由模拟电路放大
          explain: 自然界的信号是连续的电压或电流，常常只有微伏到毫伏。要先用模拟电路放大、滤掉不要的频率，再变成数字信号。
      - card:
          title: 模拟电路在哪里
          body: |
            模拟电路负责芯片和外部世界打交道的那一段：无线接收机里天线后面的放大器和混频器（把高频信号变到低频），传感器后面的放大和滤波，模数、数模转换器，光纤接收机里把微弱光电流变成电压的放大器。数字芯片内部也离不开它：存储器读数据用的灵敏放大器、产生时钟的锁相环、给全芯片供电和提供基准电压的电路。

            数字电路越来越多，模拟电路的难度反而上升：电源电压越来越低，留给信号的电压空间越来越小。
      - item:
          id: where-analog
          type: choice
          prompt: 一块智能手表芯片里，下面哪一块必须用模拟电路做？
          options:
            - text: 心率传感器后面把毫伏级信号放大、滤波的那一级
              correct: true
            - text: 把已经变成数字的心率数据求平均的那一块
              why: 信号变成数字以后，求平均、滤波都可以用数字运算完成
            - text: 显示时间的那块屏幕的控制逻辑
              why: 显示控制是数字逻辑；必须用模拟电路的是直接接触连续信号的那一段
          explain: 传感器送来的信号又弱又是连续的，只能先由模拟电路放大、滤掉不要的频率。变成数字以后的处理交给数字电路更方便。
      - card:
          title: 模拟设计的八边形
          body: |
            设计一个模拟电路，要同时照顾八个指标：增益、速度、功耗、噪声、线性度、电源电压、输入输出的电压摆幅、输入输出阻抗。它们互相牵制，常画成一个八边形：把一个角往外拉，别的角就往里缩。比如加大电流能让放大器更快、噪声更小，但功耗变大；降低电源电压省电，可信号能摆动的范围变小。

            模拟设计的大部分功夫，就是在这些折中里找到满足指标的那一点。
      - item:
          id: octagon-tradeoff
          type: choice
          prompt: 为了让一个放大器跑得更快，设计者把它的偏置电流加大一倍。最直接的代价是什么？
          options:
            - text: 功耗变大
              correct: true
            - text: 增益也一定跟着加倍
              why: 电流加大后跨导变大，可输出电阻 $r_o = 1/(\lambda I_D)$ 变小，增益不一定上升；一定发生的代价是电源要多供一倍电流
            - text: 电源电压必须跟着加倍
              why: 电流和电源电压是两个独立的选择；电流加倍、电压不变时，功耗 $V_{DD}I$ 也加倍
          explain: 功耗等于电源电压乘电流。加大电流换来速度和更低的噪声，代价首先是功耗，这正是八边形里“速度—功耗”这一对折中。
      - card:
          title: 从平方律接着讲
          body: |
            这一站的器件模型从平方律出发：饱和区的 NMOS 有 $I_D = \tfrac12 k_n'\frac WL V_{ov}^2$，其中 $k_n' = \mu_n C_{ox}$ 是电子迁移率乘单位面积栅氧电容，$V_{ov} = V_{GS} - V_t$ 是过驱动电压。跨导 $g_m = 2I_D/V_{ov}$，输出电阻 $r_o = 1/(\lambda I_D)$，$\lambda$ 是描述沟道长度调制的系数（单位 V⁻¹）。

            $g_m/I_D = 2/V_{ov}$ 叫**跨导效率（transconductance efficiency）**：同样的电流，$V_{ov}$ 越小，换来的跨导越多。
      - item:
          id: square-law-id
          type: number
          prompt: NMOS 的 $k_n' = 300\ \mu\text{A/V}^2$，$W/L = 8$，工作在饱和区，过驱动电压 0.25 V。漏极电流是多少微安？
          answer: 75
          tolerance: 0.001
          unit: μA
          hint: 平方律里 $V_{ov}$ 是几次方？
          explain: $I_D = \tfrac12\times300\times8\times0.25^2 = 75\ \mu$A。
      - item:
          id: gm-from-id
          type: number
          prompt: 一个饱和区的 NMOS 漏极电流 75 μA、过驱动电压 0.25 V。它的跨导是多少毫西？
          answer: 0.6
          tolerance: 0.001
          unit: mS
          hint: 跨导和电流、过驱动电压是什么关系？
          explain: $g_m = 2I_D/V_{ov} = 2\times75\ \mu\text{A}/0.25\ \text{V} = 600\ \mu$S，即 0.6 mS。
      - item:
          id: gm-efficiency
          type: number
          prompt: 一个饱和区 NMOS 的过驱动电压是 0.2 V。按平方律，它的跨导效率 $g_m/I_D$ 是多少（单位 V⁻¹）？
          answer: 10
          tolerance: 0.001
          hint: $g_m/I_D$ 只和哪个量有关？
          explain: $g_m/I_D = 2/V_{ov} = 2/0.2 = 10\ \text{V}^{-1}$。过驱动电压降到 0.1 V，效率翻倍成 20 V⁻¹，但管子要做得更宽才能流过同样的电流，电容也跟着变大、变慢。
  - id: mos-large-signal
    chapter: MOS器件模型与小信号分析
    title: 大信号特性：饱和余量、沟道长度和体效应
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个 NMOS 的栅源电压固定，把漏源电压从 0 慢慢升高，漏极电流先随着升高，后来几乎不变了。放大信号时希望它停在哪一段？
          options:
            - text: 电流几乎不变的那一段
              correct: true
            - text: 电流随电压升高的那一段，因为那里电流对电压更敏感
              why: 那一段管子像一个受栅压控制的电阻，漏极电流同时受漏极电压影响，做不成好的电流源；放大要的是电流只听栅压的话
            - text: 两段都一样
              why: 两段的特性完全不同：前一段电流随漏极电压变，后一段几乎只由栅压决定
          explain: 电流几乎不变的那一段是饱和区，漏极电流主要由栅源电压决定，管子像一个受栅压控制的电流源，小信号增益才大。
      - card:
          title: 饱和余量
          body: |
            饱和区要求 $V_{DS} \ge V_{ov}$。所以一个放大管至少要占掉 $V_{ov}$ 那么多的漏源电压，这叫它的**饱和余量（headroom）**。电源电压只有 1 V 左右时，几个管子串起来，每个都要留出 $V_{ov}$，信号能摆动的范围就所剩无几，这是低电压模拟设计的主要难处之一。
      - item:
          id: min-vds
          type: number
          prompt: 一个 NMOS 的阈值电压 0.45 V，栅源电压 0.9 V。要让它工作在饱和区，漏源电压至少要多少伏？
          answer: 0.45
          tolerance: 0.001
          unit: V
          hint: 饱和区的边界由哪个电压决定？
          explain: $V_{ov} = 0.9 - 0.45 = 0.45$ V，$V_{DS}$ 至少 0.45 V。低于它管子进入三极管区，电流开始随 $V_{DS}$ 明显变化。
      - card:
          title: 沟道长度调制
          body: |
            饱和区的电流其实还会随 $V_{DS}$ 略微增大：漏端的夹断点往源端移，有效沟道变短。写成 $I_D = \tfrac12 k_n'\frac WL V_{ov}^2(1 + \lambda V_{DS})$。$\lambda$ 大约和**沟道长度（channel length）** $L$ 成反比，沟道加长一倍，$\lambda$ 约减半。它对应的输出电阻 $r_o = 1/(\lambda I_D)$，也可以写成 $V_A/I_D$，$V_A = 1/\lambda$。

            想要大的输出电阻，就用长沟道的管子，代价是同样的 $W/L$ 下面积和电容更大。
      - item:
          id: ro-long-l
          type: number
          prompt: 某工艺沟道长 0.5 μm 时 $\lambda = 0.1\ \text{V}^{-1}$。改用 1 μm 的沟道（$\lambda$ 和 $L$ 成反比），漏极电流 50 μA。输出电阻是多少千欧？
          answer: 400
          tolerance: 0.001
          unit: kΩ
          hint: 沟道加长一倍，$\lambda$ 变成多少？
          explain: $\lambda = 0.1\times0.5/1 = 0.05\ \text{V}^{-1}$，$r_o = 1/(0.05\times50\ \mu\text{A}) = 400$ kΩ。同样电流下，0.5 μm 的管子只有 200 kΩ。
      - card:
          title: 体效应
          body: |
            源极和衬底之间有电压 $V_{SB} > 0$ 时，栅下要先耗尽更多的衬底电荷才能形成沟道，阈值电压升高：

            $$V_t = V_{t0} + \gamma\left(\sqrt{2\phi_f + V_{SB}} - \sqrt{2\phi_f}\right)$$

            $\gamma$ 叫**体效应系数（body-effect coefficient）**，$2\phi_f$ 是一个和掺杂有关、约零点几伏的电压。源极不接地的管子（比如串在别的管子上面的）都会受它影响。
      - item:
          id: body-shift
          type: number
          prompt: NMOS 的 $\gamma = 0.4\ \sqrt{\text{V}}$，$2\phi_f = 0.7$ V，源极比衬底高 0.5 V。按 $V_t = V_{t0} + \gamma(\sqrt{2\phi_f + V_{SB}} - \sqrt{2\phi_f})$，阈值电压升高多少伏？保留三位小数。
          answer: 0.104
          tolerance: 0.001
          unit: V
          hint: 两个平方根各是多少？
          explain: $\sqrt{1.2} = 1.095$，$\sqrt{0.7} = 0.837$，差 0.259，乘 0.4 得 0.104 V。阈值升高，同样的栅压下电流变小。
      - card:
          title: 器件电容
          body: |
            MOS 管的几个电容决定了电路能跑多快。饱和区时，栅和沟道之间的电容主要算在栅源之间，$C_{GS} \approx \tfrac23 WLC_{ox}$，再加上栅极和源区的交叠电容；栅漏之间只剩交叠电容 $C_{GD}$；漏区、源区和衬底之间是 PN 结的电容 $C_{DB}$、$C_{SB}$。管子越宽，这些电容越大。

            $C_{GD}$ 虽小，却跨在放大器的输入和输出之间，从输入端看，它的作用会被放大几十倍。
      - item:
          id: cgs-value
          type: number
          prompt: 一个饱和区 NMOS，$W = 10\ \mu$m，$L = 0.18\ \mu$m，$C_{ox} = 8.5\ \text{fF}/\mu\text{m}^2$。按 $C_{GS} \approx \tfrac23 WLC_{ox}$（不计交叠），栅源电容是多少飞法？
          answer: 10.2
          tolerance: 0.001
          unit: fF
          hint: 栅的面积是多少平方微米？
          explain: $WL = 1.8\ \mu\text{m}^2$，$\tfrac23\times1.8\times8.5 = 10.2$ fF。
      - item:
          id: cgd-why
          type: choice
          prompt: 饱和区的 MOS 管，栅漏之间为什么只剩很小的交叠电容？
          options:
            - text: 漏端沟道被夹断，沟道电荷几乎都归源端
              correct: true
            - text: 漏极电压高，栅漏之间的距离被拉大，电容自然变小
              why: 电容大小取决于两个导体之间有没有直接相对的电荷层；夹断以后栅下的沟道不再连到漏极，所以只剩交叠部分
            - text: 制造时故意不让栅极盖住漏区
              why: 栅极和漏区总有一点交叠，这部分电容一直存在；变小的是经过沟道的那一部分
          explain: 三极管区时沟道从源连到漏，栅沟电容大约平分给源和漏；进入饱和区后漏端夹断，沟道电荷归源极一侧，$C_{GS}$ 变成约 $\tfrac23WLC_{ox}$，$C_{GD}$ 只剩交叠电容。
  - id: mos-small-signal
    chapter: MOS器件模型与小信号分析
    title: 小信号模型和本征增益
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 放大器的输入信号只有几毫伏，叠在一个固定的直流偏置上。分析它怎样被放大，最省事的办法是什么？
          options:
            - text: 只看偏置点附近的小变化，把管子当成线性元件
              correct: true
            - text: 每次都用平方律把总电压代进去算
              why: 可以算，但每个信号值都要重解非线性方程；信号很小时，在偏置点附近把曲线当直线，就能用线性电路的方法一次分析清楚
            - text: 小信号太小，可以忽略不算
              why: 要放大的正是这个小信号；忽略它就没有东西可分析了
          explain: 信号小到曲线在偏置点附近可以看成直线时，管子就可以用一组线性元件代替，这就是小信号模型。
      - card:
          title: 小信号模型
          body: |
            饱和区 MOS 管的小信号模型是：一个受栅源电压控制的电流源 $g_m v_{gs}$，并联输出电阻 $r_o$；源极和衬底电压不同时，再并联一个由源衬电压控制的电流源 $g_{mb}v_{bs}$。跨导有三种等价写法：

            $$g_m = k_n'\frac WL V_{ov} = \sqrt{2k_n'\frac WL I_D} = \frac{2I_D}{V_{ov}}$$

            选哪一种，看题里给了哪些量。$r_o = 1/(\lambda I_D)$。
      - card:
          title: 例题：一个管子的跨导和输出电阻
          body: $k_n' = 400\ \mu\text{A/V}^2$，$W/L = 5$，$V_{ov} = 0.3$ V，$\lambda = 0.08\ \text{V}^{-1}$，饱和区。求 $I_D$、$g_m$、$r_o$ 和 $g_mr_o$。
          reveal:
            - title: 第 1 步：求漏极电流
              body: $I_D = \tfrac12\times400\times5\times0.3^2 = 90\ \mu$A。
            - title: 第 2 步：由电流求跨导
              body: $g_m = 2I_D/V_{ov} = 180/0.3 = 600\ \mu$S。
            - title: 第 3 步：求输出电阻，乘出本征增益
              body: $r_o = 1/(0.08\times90\ \mu\text{A}) = 139$ kΩ，$g_mr_o = 600\ \mu\text{S}\times139\ \text{k}\Omega \approx 83$。
      - item:
          id: gm-sqrt
          type: number
          prompt: NMOS 的 $k_n' = 200\ \mu\text{A/V}^2$，$W/L = 20$，饱和区漏极电流 100 μA。跨导是多少毫西？保留三位小数。
          answer: 0.894
          tolerance: 0.001
          unit: mS
          hint: 只给了电流和尺寸，用跨导的哪一种写法？
          explain: $g_m = \sqrt{2\times200\ \mu\text{A/V}^2\times20\times100\ \mu\text{A}} = \sqrt{8\times10^{-7}} = 0.894$ mS。
      - card:
          title: 本征增益
          body: |
            一个管子用理想电流源作负载时，增益就是 $g_mr_o$，叫本征增益。代入 $g_m = 2I_D/V_{ov}$ 和 $r_o = 1/(\lambda I_D)$，电流消掉了：

            $$g_mr_o = \frac{2}{\lambda V_{ov}}$$

            它只取决于 $\lambda$（也就是沟道长度）和过驱动电压。先进工艺沟道短、$\lambda$ 大，单管本征增益常常只有十几到几十，所以要靠共源共栅、多级放大把增益做上去。
      - item:
          id: intrinsic-gain
          type: number
          prompt: 一个饱和区 NMOS 的 $\lambda = 0.05\ \text{V}^{-1}$，过驱动电压 0.25 V。按平方律，它的本征增益 $g_mr_o$ 是多少？
          answer: 160
          tolerance: 0.001
          hint: 本征增益里电流会消掉吗？
          explain: $g_mr_o = 2/(\lambda V_{ov}) = 2/(0.05\times0.25) = 160$。
      - item:
          id: raise-gain
          type: choice
          prompt: 想提高一个管子的本征增益，下面哪种做法有效？
          options:
            - text: 加长沟道，让 $\lambda$ 变小
              correct: true
            - text: 加大偏置电流
              why: $g_mr_o = 2/(\lambda V_{ov})$ 里没有电流；保持 $W/L$ 不变时加大电流还会让 $V_{ov}$ 变大，增益反而下降
            - text: 提高过驱动电压
              why: $V_{ov}$ 在分母上，提高它本征增益变小
          explain: 本征增益只和 $\lambda$、$V_{ov}$ 有关。加长沟道减小 $\lambda$，或者降低 $V_{ov}$（用更宽的管子流同样的电流），都能提高它，代价是面积和电容变大。
      - card:
          title: 体效应跨导
          body: |
            源极电压随信号变化、衬底固定时，衬底像第二个栅极，贡献电流 $g_{mb}v_{bs}$，$g_{mb}$ 叫**体效应跨导（body transconductance）**。$g_{mb} = \eta g_m$，$\eta = \dfrac{\gamma}{2\sqrt{2\phi_f + V_{SB}}}$，通常是 0.1 到 0.3。源极跟随器、共源共栅管的增益都会因为它打一点折扣。
      - item:
          id: gmb-ratio
          type: number
          prompt: NMOS 的 $\gamma = 0.4\ \sqrt{\text{V}}$，$2\phi_f + V_{SB} = 1.2$ V。按 $\eta = \gamma/(2\sqrt{2\phi_f + V_{SB}})$，$g_{mb}/g_m$ 是多少？保留两位小数。
          answer: 0.18
          tolerance: 0.005
          hint: 分母里的平方根是多少？
          explain: $\eta = 0.4/(2\times1.095) = 0.18$，体效应跨导约是 $g_m$ 的 18%。
  - id: short-channel-gmid
    chapter: MOS器件模型与小信号分析
    title: 短沟道效应、亚阈值导通和 gm/ID 设计
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 按平方律，过驱动电压加倍，饱和电流变成 4 倍。可在沟道很短的管子上实测，电流只变成 2 倍多一点。最可能的原因是什么？
          options:
            - text: 沟道里的电场太强，电子的速度跑不上去了
              correct: true
            - text: 测量仪器不准，大电流时读数偏小
              why: 这是短沟道管子普遍的现象，不同的仪器测出来都一样；原因在器件物理
            - text: 阈值电压随过驱动电压一起升高了，抵消了一部分
              why: 阈值电压由掺杂、栅氧和源衬电压决定，不会因为加大栅压而跟着升高
          explain: 平方律假设电子的速度和电场成正比。沟道很短时电场很强，电子速度接近一个上限，电流随过驱动电压的增长从平方变成接近线性。
      - card:
          title: 速度饱和和迁移率退化
          body: |
            电场很强时，电子在硅里的速度不再随电场增大，停在**饱和速度（saturation velocity）** $v_{sat}$ 附近（约 $10^5$ m/s），这叫**速度饱和（velocity saturation）**。完全速度饱和时，$I_D \approx WC_{ox}v_{sat}(V_{GS} - V_t)$，电流和过驱动电压成正比，跨导 $g_m \approx WC_{ox}v_{sat}$ 不再随电流增大。

            另外，栅压越高，垂直方向的电场把电子压向表面，散射变多，迁移率下降，叫**迁移率退化（mobility degradation）**。两者都让短沟道管子的电流比平方律小。
      - item:
          id: vsat-gm
          type: number
          prompt: 一个完全速度饱和的 NMOS，$W = 10\ \mu$m，$C_{ox} = 8.5\ \text{fF}/\mu\text{m}^2$，$v_{sat} = 10^5$ m/s。按 $g_m \approx WC_{ox}v_{sat}$，跨导是多少毫西？
          answer: 8.5
          tolerance: 0.001
          unit: mS
          hint: $C_{ox}$ 换成 F/m² 是多少？
          explain: $C_{ox} = 8.5\times10^{-15}/10^{-12} = 8.5\times10^{-3}\ \text{F/m}^2$，$g_m = 10^{-5}\times8.5\times10^{-3}\times10^5 = 8.5\times10^{-3}$ S，即 8.5 mS。再加大电流，跨导也不会再涨。
      - card:
          title: 亚阈值导通
          body: |
            栅压略低于阈值时，沟道只是微弱地形成，管子并没有完全关断，还有按指数变化的电流，叫**亚阈值导通（subthreshold conduction）**，也叫弱反型：$I_D \propto e^{V_{GS}/(nV_T)}$，$V_T = kT/q$ 是热电压（室温约 25 mV），$n$ 约 1.2 到 1.5。电流每变 10 倍，栅压要变 $nV_T\ln10$，叫**亚阈值摆幅（subthreshold swing）**，室温（300 K）下不会小于约 60 mV。

            这时 $g_m = I_D/(nV_T)$，同样的电流换来的跨导最多，适合低功耗、低速的电路。栅压明显高于阈值、沟道充分形成时，叫强反型。
      - item:
          id: sub-swing
          type: number
          prompt: 一个管子的亚阈值系数 $n = 1.5$，热电压取 25 mV。亚阈值摆幅 $nV_T\ln10$ 是多少毫伏每十倍？保留一位小数。
          answer: 86.3
          tolerance: 0.05
          unit: mV/十倍
          hint: $\ln10$ 约是多少？
          explain: $1.5\times25\times2.303 = 86.3$ mV。栅压少 0.17 V，漏电流约降到原来的 1%。
      - card:
          title: 用 gm/ID 设计
          body: |
            短沟道管子不再严格服从平方律，手算的公式误差大。实际设计常换一种思路：把 $g_m/I_D$ 当作首先选定的设计指标。它从强反型的 $2/V_{ov}$（几 V⁻¹）一直变到弱反型的 $1/(nV_T)$（二三十 V⁻¹），对同一个工艺可以先仿真出一张“$g_m/I_D$ 对电流密度 $I_D/W$”的表。设计时先按速度、噪声、功耗选定 $g_m/I_D$，再由要的 $g_m$ 求电流，最后查表定宽度。
      - card:
          title: 例题：用 gm/ID 定电流
          body: 一个放大管需要 $g_m = 1.2$ mS。选 $g_m/I_D = 12\ \text{V}^{-1}$。查工艺表，这个 $g_m/I_D$ 下电流密度是 $5\ \mu\text{A}/\mu\text{m}$。求电流和宽度。
          reveal:
            - title: 第 1 步：求漏极电流
              body: $I_D = g_m/(g_m/I_D) = 1.2\ \text{mS}/12\ \text{V}^{-1} = 100\ \mu$A。
            - title: 第 2 步：查表定宽度
              body: $W = I_D/(I_D/W) = 100/5 = 20\ \mu$m。
            - title: 第 3 步：比较不同选择的代价
              body: 选更大的 $g_m/I_D$（更接近弱反型）电流更省，但电流密度小、管子更宽，电容大、速度慢。
      - item:
          id: gmid-current
          type: number
          prompt: 一个放大管需要跨导 1 mS，设计者选 $g_m/I_D = 15\ \text{V}^{-1}$。需要多少微安的偏置电流？保留一位小数。
          answer: 66.7
          tolerance: 0.05
          unit: μA
          hint: $g_m$ 和 $g_m/I_D$ 都知道了，电流怎么求？
          explain: $I_D = 1\ \text{mS}/15\ \text{V}^{-1} = 66.7\ \mu$A。改选 $g_m/I_D = 10$，就要 100 μA。
      - item:
          id: weak-inversion-max
          type: choice
          prompt: 为什么一个 MOS 管的 $g_m/I_D$ 不能无限提高？
          options:
            - text: 弱反型时最多只有 $1/(nV_T)$
              correct: true
            - text: 电流越小 $g_m/I_D$ 越大，没有上限
              why: 强反型时按 $2/V_{ov}$ 增大，进入弱反型后停在 $1/(nV_T)$，再减小电流也不再增大
            - text: 速度饱和让 $g_m/I_D$ 一直下降到零
              why: 速度饱和发生在大电流、强反型一端，让 $g_m/I_D$ 变小；上限出现在另一端的弱反型
          explain: 弱反型的电流按指数变化，$g_m/I_D = 1/(nV_T)$，是一个和温度有关的常数，这就是跨导效率的上限。
  - id: cs-stage
    chapter: 单级与差分放大器
    title: 共源级和它的几种负载
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 共源放大器的增益大约是“跨导乘漏极节点看到的总电阻”。想要增益大，漏极上该接什么负载？
          options:
            - text: 一个电流源，它的小信号电阻很大
              correct: true
            - text: 一根导线直接接电源，让输出端电压最高
              why: 漏极直接接电源，小信号电阻是零，输出电压不会变，增益为零
            - text: 一个很小的电阻，让更多的电流流过管子
              why: 负载电阻越小，同样的电流变化产生的电压变化越小，增益越小
          explain: 电流源的直流电流固定，小信号电阻（它的输出电阻）却很大，所以能在不占太多直流电压的情况下得到大增益。
      - card:
          title: 电阻负载
          body: |
            输入接栅极、输出取自漏极、源极接地的放大器叫**共源级（common-source stage）**，也就是共源放大器。漏极经电阻 $R_D$ 接电源时，小信号电流 $g_mv_{in}$ 流过 $R_D$ 和管子自己的 $r_o$ 并联，输出端不接负载时增益

            $$A_v = -g_m(R_D \parallel r_o)$$

            负号表示输出和输入反相。要加大增益就得加大 $R_D$，可 $R_D$ 上的直流压降 $I_DR_D$ 也跟着变大，挤占输出摆幅，这是电阻负载的局限。
      - item:
          id: cs-resistive
          type: number
          prompt: 共源级，$g_m = 1$ mS，$r_o = 100$ kΩ，漏极经 10 kΩ 电阻接电源。小信号电压增益是多少？保留两位小数。
          answer: -9.09
          tolerance: 0.005
          hint: 漏极节点看到的总电阻是哪两个电阻并联？
          explain: $R_D \parallel r_o = 10\times100/110 = 9.09$ kΩ，$A_v = -1\ \text{mS}\times9.09\ \text{k}\Omega = -9.09$。
      - card:
          title: 二极管接法负载
          body: |
            把一个管子的栅极和漏极连在一起，它的小信号电阻约为 $1/g_m$，这种接法叫**二极管接法（diode connection）**。用它作负载，增益是两个跨导之比：$A_v \approx -g_{m1}/g_{m2}$。两管电流相同时，$g_m \propto \sqrt{W/L}$，所以 $A_v \approx -\sqrt{(W/L)_1/(W/L)_2}$（不计体效应）。增益不高，但由尺寸比决定，对工艺偏差不敏感。
      - item:
          id: cs-diode
          type: number
          prompt: 共源级的放大管和二极管接法的负载管都是 NMOS，电流相同，放大管 $W/L = 36$，负载管 $W/L = 4$，不计体效应和 $r_o$。增益是多少？
          answer: -3
          tolerance: 0.001
          hint: 两个跨导之比等于什么之比的平方根？
          explain: $A_v = -\sqrt{36/4} = -3$。想要增益 10 就得让尺寸比到 100，所以二极管负载只用在要小而准的增益处。
      - card:
          title: 电流源负载
          body: |
            用工作在饱和区的 PMOS 作电流源负载，漏极节点看到放大管的 $r_{o1}$ 和负载管的 $r_{o2}$ 并联：

            $$A_v = -g_{m1}(r_{o1} \parallel r_{o2})$$

            两管的 $r_o$ 相近时，增益约是本征增益的一半。负载管只占一个饱和余量的电压，输出能摆得比电阻负载大。
      - card:
          title: 例题：电流源负载共源级
          body: 放大管 NMOS 偏置在 100 μA，$V_{ov} = 0.2$ V，$\lambda_n = 0.1\ \text{V}^{-1}$；负载 PMOS 的 $\lambda_p = 0.15\ \text{V}^{-1}$。求增益。
          reveal:
            - title: 第 1 步：求放大管的跨导
              body: $g_{m1} = 2\times100\ \mu\text{A}/0.2\ \text{V} = 1$ mS。
            - title: 第 2 步：求两个输出电阻并联
              body: $r_{o1} = 1/(0.1\times100\ \mu\text{A}) = 100$ kΩ，$r_{o2} = 1/(0.15\times100\ \mu\text{A}) = 66.7$ kΩ，并联 40 kΩ。
            - title: 第 3 步：乘出增益
              body: $A_v = -1\ \text{mS}\times40\ \text{k}\Omega = -40$。
      - item:
          id: cs-current-load
          type: number
          prompt: 电流源负载共源级，放大管 $g_m = 0.5$ mS、$r_{o1} = 200$ kΩ，负载管 $r_{o2} = 300$ kΩ。增益是多少？
          answer: -60
          tolerance: 0.001
          hint: 输出节点上有哪两个电阻并联？
          explain: $r_{o1} \parallel r_{o2} = 200\times300/500 = 120$ kΩ，$A_v = -0.5\ \text{mS}\times120\ \text{k}\Omega = -60$。
      - card:
          title: 源极负反馈
          body: |
            在源极和地之间串一个电阻 $R_S$，叫**源极负反馈（source degeneration）**：输入电压的一部分降在 $R_S$ 上，等效跨导变成 $G_m = \dfrac{g_m}{1 + g_mR_S}$（不计 $r_o$ 和体效应）。增益变小了，换来的是更好的线性度：$g_mR_S \gg 1$ 时 $G_m \approx 1/R_S$，增益约等于 $-R_D/R_S$，几乎和管子无关。
      - item:
          id: cs-degen
          type: number
          prompt: 共源级带源极电阻，$g_m = 2$ mS，$R_S = 1$ kΩ，$R_D = 6$ kΩ，不计 $r_o$ 和体效应。增益是多少？
          answer: -4
          tolerance: 0.001
          hint: 等效跨导 $G_m$ 是多少？
          explain: $G_m = 2/(1 + 2\times1) = 0.667$ mS，$A_v = -G_mR_D = -4$。不带 $R_S$ 时是 $-12$，但输入稍大一点就会失真。
  - id: sf-cg
    chapter: 单级与差分放大器
    title: 源极跟随器和共栅级
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个增益很高的共源级输出电阻有几百千欧，要驱动一个只有 1 kΩ 的负载。直接接上去会怎样？
          options:
            - text: 增益大幅下降
              correct: true
            - text: 没影响，增益只看放大管
              why: 增益是跨导乘输出节点的总电阻；并上 1 kΩ 后总电阻约等于 1 kΩ，增益掉到原来的百分之一左右
            - text: 负载电阻小，增益反而变大
              why: 输出节点电阻越小，同样的电流变化产生的电压越小，增益变小
          explain: 高增益级的输出电阻大，接重负载会把增益拉垮。中间插一级输出电阻小、增益约为 1 的电路，就能隔开它们，这就是源极跟随器的用处。
      - card:
          title: 源极跟随器
          body: |
            输入接栅极、输出取自源极、漏极接电源的放大器叫源极跟随器（也叫共漏级）。源极电压跟着栅极走，差一个 $V_{GS}$。源极接电阻 $R_S$ 时，不计 $r_o$，增益

            $$A_v = \frac{g_mR_S}{1 + (g_m + g_{mb})R_S}$$

            $R_S$ 换成理想电流源时，增益是 $g_m/(g_m + g_{mb})$，因为有体效应，总是略小于 1。从源极往里看的输出电阻约为 $1/(g_m + g_{mb})$，很小。
      - item:
          id: sf-gain-ideal
          type: number
          prompt: 源极跟随器用理想电流源偏置，$g_{mb} = 0.2g_m$，不计 $r_o$。增益是多少？保留三位小数。
          answer: 0.833
          tolerance: 0.0005
          hint: 负载是理想电流源时，增益只剩哪两个跨导之比？
          explain: $A_v = g_m/(g_m + 0.2g_m) = 1/1.2 = 0.833$。没有体效应时才是 1。
      - item:
          id: sf-rout
          type: number
          prompt: 源极跟随器的 $g_m = 1$ mS、$g_{mb} = 0.2$ mS，不计 $r_o$。从源极看进去的输出电阻是多少欧？保留到个位。
          answer: 833
          tolerance: 0.5
          unit: Ω
          hint: 输出电阻约等于哪个跨导和的倒数？
          explain: $1/(1.2\ \text{mS}) = 833\ \Omega$。比共源级的几百千欧小得多，所以能驱动重负载。
      - card:
          title: 源极跟随器的代价
          body: |
            源极跟随器增益小于 1，不放大电压；输出比输入低一个 $V_{GS}$（零点几伏），在低电源电压下很浪费摆幅；还有体效应让增益进一步下降。所以它只在确实要驱动小电阻或大电容时才用，比如运放的输出级或片外接口。
      - card:
          title: 共栅级
          body: |
            栅极接固定电压、信号从源极进、从漏极出的放大器叫**共栅级（common-gate stage）**。从源极看进去的输入电阻约为 $1/(g_m + g_{mb})$，很小（源极电压一变，栅源电压和源衬电压同时变，$g_m$、$g_{mb}$ 两路电流一起响应）；漏极接 $R_D$、不计 $r_o$ 时增益 $A_v = (g_m + g_{mb})R_D$，是正的（同相）。

            输入电阻小，适合接收电流信号，比如光电二极管（受光照就产生电流的二极管）的电流，或者要求放大器输入电阻等于 50 Ω 的电缆接口。
      - item:
          id: cg-gain
          type: number
          prompt: 共栅级 $g_m = 2$ mS、$g_{mb} = 0.3$ mS，漏极电阻 5 kΩ，不计 $r_o$。电压增益是多少？
          answer: 11.5
          tolerance: 0.001
          hint: 共栅级里体效应是帮增益还是减增益？
          explain: $A_v = (2 + 0.3)\ \text{mS}\times5\ \text{k}\Omega = 11.5$。共栅级里源极就是输入，衬底固定，源极电压变化通过 $g_m$ 和 $g_{mb}$ 两条路都产生电流，体效应反而让增益略大。
      - item:
          id: cg-rin
          type: number
          prompt: 一个共栅级（$g_m = 2$ mS、$g_{mb} = 0.3$ mS，不计 $r_o$），从源极看进去的输入电阻是多少欧？保留到个位。
          answer: 435
          tolerance: 0.5
          unit: Ω
          hint: 输入电阻约等于哪个跨导和的倒数？
          explain: $1/(2.3\ \text{mS}) = 435\ \Omega$。要让输入电阻等于 50 Ω，就得把 $g_m + g_{mb}$ 做到 20 mS 左右。
      - item:
          id: which-stage
          type: choice
          prompt: 一个光电二极管输出微弱的电流，要先变成电压再放大。三种单管放大器里，最适合直接接收这个电流的是哪种？
          options:
            - text: 共栅级
              correct: true
            - text: 源极跟随器
              why: 源极跟随器从栅极输入，栅极几乎不吸收电流，适合接收电压而不是电流；它的长处是输出电阻小
            - text: 共源级，因为它增益最大
              why: 共源级的输入也是栅极，输入电阻极大，电流信号送进去无处可流；增益大指的是电压增益
          explain: 接收电流信号要输入电阻小，电流才能流进来；共栅级从源极输入，输入电阻约 $1/g_m$，正合适，再在漏极把电流变成电压。
  - id: cascode
    chapter: 单级与差分放大器
    title: 共源共栅和折叠共源共栅
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个共源管的输出电阻是 $r_o$。在它上面再串一个栅极接固定电压的管子（共栅管），从最上面往下看的输出电阻会怎样？
          options:
            - text: 大很多倍，约乘上上面那个管子的本征增益
              correct: true
            - text: 变成两个 $r_o$ 相加
              why: 只把两个电阻串起来才是相加；上面的管子会“抵抗”电流变化，把下面的电阻放大约 $g_mr_o$ 倍
            - text: 变小，因为多了一个管子分压
              why: 串联只会让从上往下看的电阻变大；共栅管还会把它进一步放大
          explain: 输出端电压变化时，上面的管子源极电压几乎不动（下面的 $r_o$ 只让它变一点点），它的电流也就几乎不变，等效电阻大约是 $g_{m2}r_{o2}r_{o1}$。
      - card:
          title: 共源共栅级
          body: |
            共源管 M1 上面串一个共栅管 M2（栅极接固定偏置），输出取自 M2 的漏极，叫共源共栅（cascode）级。从输出往下看的电阻

            $$R_{out} = r_{o1} + r_{o2} + (g_{m2} + g_{mb2})r_{o2}r_{o1} \approx g_{m2}r_{o2}r_{o1}$$

            比单个管子大了约 $g_mr_o$ 倍。M1 的漏极电压被 M2 钉住，几乎不随输出变，所以 M1 的输出电阻对增益的影响被屏蔽了。
      - item:
          id: cascode-rout
          type: number
          prompt: 共源共栅的两个管子 $r_{o1} = r_{o2} = 100$ kΩ，上面管子 $g_{m2} = 1$ mS，不计体效应。按 $R_{out} = r_{o1} + r_{o2} + g_{m2}r_{o2}r_{o1}$，输出电阻是多少兆欧？
          answer: 10.2
          tolerance: 0.001
          unit: MΩ
          hint: 三项各是多少？哪一项占大头？
          explain: $g_{m2}r_{o2}r_{o1} = 10^{-3}\times10^5\times10^5 = 10$ MΩ，再加 0.2 MΩ，共 10.2 MΩ，是单管 100 kΩ 的一百多倍。
      - card:
          title: 增益和负载
          body: |
            共源共栅级的增益是 $-g_{m1}$ 乘输出节点的总电阻。用理想电流源作负载，增益约 $-(g_mr_o)^2$，是单管本征增益的平方。可实际的负载电流源只有一个管子时，它的 $r_o$ 和上百倍大的 $R_{out}$ 并联，总电阻还是约 $r_o$，增益退回单管的水平。所以负载也要做成共源共栅的电流源，两边输出电阻相当，增益约 $\tfrac12(g_mr_o)^2$。
      - card:
          title: 例题：共源共栅放大器的增益
          body: 共源共栅放大器每个管子 $g_m = 1$ mS、$r_o = 100$ kΩ，负载是输出电阻和放大支路一样大的共源共栅电流源。按 $R_{out} \approx g_mr_o^2$ 估算增益。
          reveal:
            - title: 第 1 步：求放大支路的输出电阻
              body: $R_{out} \approx g_mr_o^2 = 10^{-3}\times(10^5)^2\ \Omega = 10$ MΩ。
            - title: 第 2 步：和负载并联
              body: 负载也是 10 MΩ，两个相等的电阻并联得 5 MΩ。
            - title: 第 3 步：乘跨导得到增益
              body: $|A_v| = 1\ \text{mS}\times5\ \text{M}\Omega = 5000$，正好是 $\tfrac12(g_mr_o)^2 = \tfrac12\times100^2$。
      - item:
          id: cascode-gain
          type: number
          prompt: 共源共栅放大器的每个管子本征增益 $g_mr_o = 50$，负载是输出电阻和放大支路一样大的共源共栅电流源。按 $R_{out} \approx g_mr_o^2$ 估算，增益大约是多少（取绝对值）？
          answer: 1250
          tolerance: 0.001
          hint: 放大支路和负载的输出电阻各约多大？并联以后呢？
          explain: 放大支路的输出电阻约 $g_mr_o\cdot r_o$，和同样大的负载并联减半，增益 $\approx g_m\cdot\tfrac12 g_mr_o^2 = \tfrac12(g_mr_o)^2 = 1250$。
      - item:
          id: cascode-headroom
          type: number
          prompt: 共源共栅的两个 NMOS 过驱动电压都是 0.2 V。为了让两个管子都在饱和区，输出端对地至少要多少伏？
          answer: 0.4
          tolerance: 0.001
          unit: V
          hint: 每个管子至少要留出多少漏源电压？
          explain: 每个管子要留 $V_{ov}$，叠起来至少 0.4 V。增益上去了，摆幅却少了一个 $V_{ov}$，这是共源共栅的代价。
      - card:
          title: 折叠共源共栅
          body: |
            电源电压低时，把好几个管子竖着叠在同一条电流路上（这种叫**套筒式共源共栅（telescopic cascode）**）很难放下。**折叠共源共栅（folded cascode）**把共栅管换成另一种极性：NMOS 输入管的漏极电流不往上送进 NMOS 共栅管，而是“折”进一个 PMOS 共栅管，由另一个电流源提供偏置。输出电阻和增益和普通共源共栅差不多，但输入和输出的电压范围更宽，代价是多一路偏置电流，功耗更大，噪声也略多。
      - item:
          id: folded-why
          type: choice
          prompt: 和普通（套筒式）共源共栅相比，折叠共源共栅最主要的好处是什么？
          options:
            - text: 低电源电压下输入、输出的电压范围更宽
              correct: true
            - text: 增益是普通共源共栅的两倍，因为多了一个共栅管
              why: 两者的输出电阻在同一个量级，增益差不多；折叠结构换来的是电压范围
            - text: 少用一路偏置电流，更省电
              why: 恰好相反：折叠后共栅那一支要单独的偏置电流，总电流更大
          explain: 折叠以后输入管和共栅管不再竖着叠在同一条电流路上，电压余量的约束松了，输入共模范围和输出摆幅都更宽。
  - id: diff-pair
    chapter: 单级与差分放大器
    title: 差分对的大信号和小信号
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 两根信号线紧挨着走，旁边的电源噪声在两根线上感应出几乎一样的干扰。如果放大器只放大两根线的差，干扰会怎样？
          options:
            - text: 两根线上一样的干扰相减后大部分抵消了
              correct: true
            - text: 干扰被放大两次，更严重
              why: 放大的是差值；两根线上相同的干扰在相减时抵消，不会叠加
            - text: 没有区别，干扰照样被放大
              why: 只放大差值的电路对两根线上相同的部分（共模）几乎不响应，这正是差分电路抗干扰的原因
          explain: 有用的信号放在两线之差里，干扰常常是两线一起变（共模），差分放大器只放大差，所以抗干扰能力强。
      - card:
          title: 差分对的大信号特性
          body: |
            两个相同的 NMOS 源极接在一起，下面接一个**尾电流源（tail current source）** $I_{SS}$，这就是**差分对（differential pair）**。两个栅压相等时，两管各分一半电流 $I_{SS}/2$。栅压差 $\Delta V_{in}$ 加大，电流向栅压高的一边倾斜；平方律下，当 $|\Delta V_{in}|$ 达到 $\sqrt2V_{ov}$（$V_{ov}$ 是平衡时的过驱动电压），全部电流流向一边，另一管截止。

            所以差分对只在 $|\Delta V_{in}|$ 小于这个值时线性，$V_{ov}$ 越大，线性范围越宽。
      - item:
          id: dp-steer
          type: number
          prompt: 差分对平衡时每管过驱动电压 0.2 V。按平方律，输入差压至少多大时尾电流会全部流进一边？保留三位小数。
          answer: 0.283
          tolerance: 0.0005
          unit: V
          hint: 这个电压和平衡时的 $V_{ov}$ 差几倍？
          explain: $\sqrt2\times0.2 = 0.283$ V。超过它另一个管子截止，输出不再随输入变。
      - card:
          title: 小信号差模增益
          body: |
            输入差压很小时，一管电流增加 $g_m\Delta V_{in}/2$，另一管减少同样多；尾电流源的节点电压不动，像交流接地。两管漏极各接 $R_D$ 时，差分输出（两个漏极之差）的增益

            $$A_d = g_m(R_D \parallel r_o)$$

            $g_m$ 是一个管子在 $I_{SS}/2$ 下的跨导。它和单个共源级的增益相同，但用了两倍的电流，换来的是对共模干扰的抑制。
      - item:
          id: dp-ad
          type: number
          prompt: 差分对每管 $g_m = 1$ mS，漏极电阻 8 kΩ，不计 $r_o$。差分输出的差模增益是多少？
          answer: 8
          tolerance: 0.001
          hint: 差分输出的增益和一个共源级有什么关系？
          explain: $A_d = g_mR_D = 1\ \text{mS}\times8\ \text{k}\Omega = 8$。
      - card:
          title: 共模响应
          body: |
            两个栅极一起上升时，尾电流源的电压跟着升，真正的电流源能挡住电流变化；可实际的尾电流源有有限的输出电阻 $R_{SS}$，电流会变一点。单端输出的共模增益是 $-R_D/(1/g_m + 2R_{SS})$，$R_{SS}$ 远大于 $1/g_m$ 时约为 $-R_D/(2R_{SS})$。两边完全对称时，两个漏极的共模变化一样，差分输出里抵消；两边电阻或管子有失配时，一部分共模变化就混进差分输出，所以要让 $R_{SS}$ 尽量大（比如用共源共栅电流源作尾电流源）。
      - item:
          id: dp-acm
          type: number
          prompt: 差分对的尾电流源输出电阻 200 kΩ，每边漏极电阻 8 kΩ。单端输出的共模增益约是多少？保留两位小数。
          answer: -0.02
          tolerance: 0.0005
          hint: 共模增益约等于哪两个电阻之比？
          explain: $A_{cm} \approx -8/(2\times200) = -0.02$。若每管 $g_m = 1$ mS，差分输出的差模增益是 8，单端输出是 4，比共模增益大 200 倍，共模抑制比约 46 dB。
      - item:
          id: dp-tail-why
          type: choice
          prompt: 为什么差分对的尾电流源希望输出电阻越大越好？
          options:
            - text: 共模增益更小
              correct: true
            - text: 输出电阻大能让差模增益变大
              why: 差模信号下尾节点几乎不动，尾电流源的电阻不影响差模增益；它影响的是共模增益
            - text: 输出电阻大，尾电流本身就变大
              why: 尾电流的直流值由偏置决定；输出电阻描述的是电流随电压变化的程度
          explain: 共模输入抬高尾节点电压时，尾电流源越接近理想，电流越不变，两个漏极的电压也就越不变，共模抑制越好。
  - id: five-transistor-ota
    chapter: 单级与差分放大器
    title: 电流镜负载的差分对
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 差分对两边各接一个电阻、只从一边取输出时，另一边那一半信号电流就白白流进电源了。能不能把两边的信号电流都送到同一个输出端？
          options:
            - text: 能，用电流镜把一边的电流复制到另一边去
              correct: true
            - text: 不能，两边的电流方向相反，加起来是零
              why: 两边的小信号电流确实一增一减；用电流镜把其中一边“翻转”过来，正好和另一边同向相加
            - text: 能，把两个漏极直接连在一起
              why: 两个漏极直接相连，一增一减的电流在同一点上抵消，输出不随差模输入变化
          explain: 电流镜把左边管子的电流变化复制到右边，方向和右边管子的变化相同，两份电流在输出端相加，单端输出也拿到了全部的信号电流。
      - card:
          title: 五管单元
          body: |
            差分对 M1、M2 下面接尾电流源 M5，上面接一对 PMOS 电流镜 M3、M4：M3 接成二极管，M4 复制 M3 的电流。输出取自 M2 和 M4 的漏极。这个电路一共五个管子，常叫**五管运算跨导放大器（five-transistor OTA）**，OTA 是 operational transconductance amplifier 的缩写。

            小信号下，M1 的电流变化经镜像送到输出端，和 M2 的电流变化同向相加，输出电流是 $g_{m1}\Delta V_{in}$，增益

            $$A_v = g_{m1}(r_{o2} \parallel r_{o4})$$
      - item:
          id: ota-gain
          type: number
          prompt: 五管 OTA 的输入管 $g_{m1} = 0.6$ mS，输出端 $r_{o2} = 150$ kΩ、$r_{o4} = 100$ kΩ。差分输入、单端输出的增益是多少？
          answer: 36
          tolerance: 0.001
          hint: 输出节点看到哪两个电阻并联？
          explain: $r_{o2} \parallel r_{o4} = 60$ kΩ，$A_v = 0.6\ \text{mS}\times60\ \text{k}\Omega = 36$。
      - card:
          title: 单端输出也不吃亏
          body: |
            电阻负载的差分对只从一边取输出，增益只有差分输出的一半。五管单元用电流镜把两边的信号电流加在一起，单端输出的增益就等于 $g_m$ 乘输出节点的电阻，和差分输出的完整增益相同。

            它还能把差分信号变成单端信号，后面可以直接接一个单端的放大级，所以是两级运放最常用的第一级。
      - item:
          id: ota-mirror-role
          type: choice
          prompt: 五管 OTA 里，电流镜 M3、M4 的作用是什么？
          options:
            - text: 把 M1 的信号电流搬到输出端相加
              correct: true
            - text: 给差分对提供尾电流，决定两个输入管的偏置
              why: 尾电流由下面的 M5 提供；上面的电流镜作负载，并把一边的电流搬到另一边
            - text: 让输出电压能摆动的范围变大
              why: 电流镜作负载让输出节点电阻大、增益高；摆幅并不因此变大，负载管本身还要占一份饱和余量
          explain: 没有电流镜时，M1 那一半信号电流浪费在负载上；有了电流镜，单端输出也拿到了全部 $g_m\Delta V_{in}$。
      - card:
          title: 例题：设计一个五管 OTA 的偏置
          body: 尾电流 40 μA，输入管 $k_n'W/L = 4\ \text{mA/V}^2$，$\lambda_n = 0.1\ \text{V}^{-1}$，PMOS 负载 $\lambda_p = 0.1\ \text{V}^{-1}$。求增益。
          reveal:
            - title: 第 1 步：求每管电流和过驱动电压
              body: 每管 20 μA，$V_{ov} = \sqrt{2\times20\ \mu\text{A}/4\ \text{mA/V}^2} = 0.1$ V。
            - title: 第 2 步：求跨导和输出端的电阻
              body: $g_{m1} = 2\times20\ \mu\text{A}/0.1\ \text{V} = 0.4$ mS；$r_{o2} = r_{o4} = 1/(0.1\times20\ \mu\text{A}) = 500$ kΩ，并联 250 kΩ。
            - title: 第 3 步：乘出增益
              body: $A_v = 0.4\ \text{mS}\times250\ \text{k}\Omega = 100$。
      - item:
          id: ota-half-current
          type: number
          prompt: 五管 OTA 的尾电流 80 μA，输入管 $V_{ov} = 0.25$ V，输出端 NMOS 的 $\lambda_n = 0.1\ \text{V}^{-1}$、PMOS 的 $\lambda_p = 0.2\ \text{V}^{-1}$。增益是多少？保留一位小数。
          answer: 26.7
          tolerance: 0.05
          hint: 每个输入管流多少电流？$g_m$ 和两个 $r_o$ 各是多少？
          explain: 每管 40 μA，$g_{m1} = 2\times40/0.25 = 320\ \mu$S；$r_{o2} = 1/(0.1\times40\ \mu\text{A}) = 250$ kΩ，$r_{o4} = 1/(0.2\times40\ \mu\text{A}) = 125$ kΩ，并联 83.3 kΩ；$A_v = 0.32\ \text{mS}\times83.3\ \text{k}\Omega = 26.7$。电流消掉了：增益等于 $2/[V_{ov}(\lambda_n + \lambda_p)]$，只和过驱动电压、沟道长度有关。
      - card:
          title: 吉尔伯特单元
          body: |
            把两个差分对的输出交叉连起来，再用第三个差分对给它们分配尾电流，就得到**吉尔伯特单元（Gilbert cell）**：输出正比于两个输入电压的乘积。它是模拟乘法器，用在无线接收机的混频器里，把高频信号“搬”到低频。
      - item:
          id: gilbert-use
          type: choice
          prompt: 吉尔伯特单元的输出正比于两个输入电压的乘积。它在无线接收机里最常见的用途是什么？
          options:
            - text: 做混频器，变换信号的频率
              correct: true
            - text: 做功率放大器，驱动天线发射
              why: 功率放大器要输出大功率；吉尔伯特单元是处理小信号的乘法器，用来改变信号的频率
            - text: 存储数据，像存储器单元那样保持电压
              why: 它没有存储功能；乘法可以把两个频率相减，用来变频
          explain: 两个正弦信号相乘会出现两个频率之和与之差。混频器正是用这一点把天线上的高频信号变到便于处理的较低频率。
  - id: current-mirrors
    chapter: 电流镜与偏置
    title: 基本电流镜
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 芯片上有几十个放大器，每个都要一个准确的偏置电流。各自用电阻和电源电压去“算”出电流，可电源、温度和工艺一变就不准。有什么更好的办法？
          options:
            - text: 先做好一个准确的参考电流，再用管子把它按比例复制给各处
              correct: true
            - text: 每个放大器都用更精密的电阻
              why: 芯片上的电阻本身有 10% 到 20% 的偏差，还随温度变；靠电阻算电流很难准
            - text: 让每个管子的栅极直接接电源
              why: 那样电流完全由电源电压和阈值电压决定，电源一变电流就大变，正是要避免的
          explain: 一个参考电流配上电流镜，就能把它准确地复制到很多地方；复制的比例只取决于管子的尺寸比，对电源、温度、工艺都不敏感。
      - card:
          title: 电流镜的原理
          body: |
            参考电流 $I_{REF}$ 流进一个二极管接法的 NMOS M1，M1 自动调出能流过这个电流的 $V_{GS}$。另一个管子 M2 的栅源接在同一个电压上，两管 $V_{GS}$ 相同；都在饱和区、不计沟道长度调制时，电流之比就是尺寸比：

            $$I_{OUT} = I_{REF}\frac{(W/L)_2}{(W/L)_1}$$

            阈值电压、迁移率的偏差对两个管子一样，在比值里消掉了。
      - item:
          id: mirror-ratio
          type: number
          prompt: 电流镜的参考管 $W/L = 5$，输出管 $W/L = 15$，参考电流 50 μA，不计沟道长度调制。输出电流是多少微安？
          answer: 150
          tolerance: 0.001
          unit: μA
          hint: 两管 $V_{GS}$ 相同时，电流之比等于什么之比？
          explain: $I_{OUT} = 50\times15/5 = 150\ \mu$A。实际设计常把输出管做成几个和参考管一样的单元并联（这里是 3 个），比例更准。
      - card:
          title: 沟道长度调制带来的误差
          body: |
            考虑沟道长度调制，电流还和各自的 $V_{DS}$ 有关：

            $$\frac{I_{OUT}}{I_{REF}} = \frac{(W/L)_2}{(W/L)_1}\cdot\frac{1 + \lambda V_{DS2}}{1 + \lambda V_{DS1}}$$

            参考管是二极管接法，$V_{DS1} = V_{GS}$；输出管的 $V_{DS2}$ 由它接的电路决定，常常和 $V_{GS}$ 不同，比例就偏了。电流镜的输出电阻就是输出管的 $r_o$，它越大，$V_{DS2}$ 变化时电流变得越少。
      - card:
          title: 例题：算出电流镜的误差
          body: 1:1 电流镜，参考电流 10 μA，$\lambda = 0.1\ \text{V}^{-1}$，参考管 $V_{GS} = 0.6$ V，输出管 $V_{DS} = 1.2$ V。输出电流是多少？
          reveal:
            - title: 第 1 步：算两管的沟道长度调制因子
              body: 参考管 $1 + 0.1\times0.6 = 1.06$，输出管 $1 + 0.1\times1.2 = 1.12$。
            - title: 第 2 步：求输出和参考电流之比
              body: $1.12/1.06 = 1.057$，输出电流约 10.57 μA，偏大 5.7%。
            - title: 第 3 步：找减小误差的办法
              body: 让 $V_{DS2}$ 接近 $V_{GS}$，或者提高输出电阻（加长沟道、用共源共栅），误差就小。
      - item:
          id: mirror-error
          type: number
          prompt: 1:1 电流镜，$\lambda = 0.1\ \text{V}^{-1}$，参考管 $V_{GS} = 0.7$ V，输出管 $V_{DS} = 1.5$ V。输出电流比参考电流大百分之几？保留一位小数。
          answer: 7.5
          tolerance: 0.05
          unit: '%'
          hint: 两个 $(1 + \lambda V_{DS})$ 各是多少？
          explain: $(1 + 0.15)/(1 + 0.07) = 1.075$，大 7.5%。对一个要求 1% 匹配的电路来说太大了。
      - item:
          id: mirror-rout
          type: choice
          prompt: 一个简单的 NMOS 电流镜，从输出端看进去的小信号电阻是多少？
          options:
            - text: 输出管的 $r_o$
              correct: true
            - text: $1/g_m$，因为管子接成了二极管
              why: 接成二极管的是参考管；输出管的栅极接在固定电压上，从它的漏极看进去是 $r_o$
            - text: 无穷大，因为它是理想电流源
              why: 理想电流源的电阻才是无穷大；实际的管子有沟道长度调制，输出电阻是有限的 $r_o$
          explain: 输出管的栅源电压由参考支路固定，漏极电压变化只通过沟道长度调制改变电流，所以输出电阻是 $r_o = 1/(\lambda I_{OUT})$。
      - item:
          id: mirror-why-ratio
          type: choice
          prompt: 电流镜的复制比例为什么对工艺偏差不敏感？
          options:
            - text: 两个管子做在一起，阈值电压和迁移率的偏差相同，在比值里消掉
              correct: true
            - text: 因为参考电流本身没有偏差
              why: 参考电流的偏差会照样复制过去；对工艺不敏感的是“比例”，靠的是两管偏差相同
            - text: 因为管子工作在三极管区
              why: 电流镜的管子工作在饱和区；比例准是因为两管条件相同，偏差互相抵消
          explain: 比例只取决于两管的尺寸比。靠得近、画法相同的两个管子，工艺偏差几乎一样，比值就很准，所以模拟电路里大量用比值而不是绝对值。
  - id: cascode-mirrors
    chapter: 电流镜与偏置
    title: 共源共栅电流镜和偏置
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 简单电流镜的误差来自输出管的 $V_{DS}$ 和参考管不同。如果在输出管上面加一个管子，把输出管的漏极电压“钉”在一个固定值上，会怎样？
          options:
            - text: 电流更准，输出电阻也更大
              correct: true
            - text: 没用，误差来自栅压，和漏极电压无关
              why: 两管栅压本来就相同；误差正是来自漏极电压不同带来的沟道长度调制
            - text: 电流会变成两倍
              why: 加的管子只是串在电流路上，不改变电流大小；它的作用是稳住下面管子的漏极电压
          explain: 加一个共栅管把输出管的漏极钉住，就是共源共栅电流镜：漏极电压变化被挡在上面的管子，下面管子的电流几乎不变。
      - card:
          title: 共源共栅电流镜
          body: |
            在简单电流镜的两个管子上各串一个共栅管，参考支路的共栅管也接成二极管，给输出支路的共栅管提供栅压，这就是**共源共栅电流镜（cascode current mirror）**。这样输出管的 $V_{DS}$ 被钉在和参考管相同的值上，比例误差大大减小；从输出端看进去的电阻也像共源共栅级一样，约为 $g_mr_o^2$，比简单电流镜大 $g_mr_o$ 倍。
      - item:
          id: cmirror-rout
          type: number
          prompt: 共源共栅电流镜里，输出支路的共栅管 $g_m = 0.5$ mS，两个管子 $r_o$ 都是 200 kΩ。按 $R_{out} \approx g_mr_o^2$，输出电阻约是多少兆欧？
          answer: 20
          tolerance: 0.001
          unit: MΩ
          hint: $r_o^2$ 是多少？
          explain: $0.5\times10^{-3}\times(2\times10^5)^2 = 2\times10^7\ \Omega = 20$ MΩ，是简单电流镜 200 kΩ 的 100 倍。
      - card:
          title: 代价：输出端的最低电压
          body: |
            简单的共源共栅电流镜里，共栅管的栅压是两个 $V_{GS}$ 叠起来的，输出端至少要 $V_{GS} + V_{ov} = V_t + 2V_{ov}$ 才能让两个管子都在饱和区，比两个管子各自所需的 $2V_{ov}$ 多出一个 $V_t$。

            **低压共源共栅电流镜（low-voltage cascode mirror）**用一个单独的偏置电压，把共栅管的栅压降到 $V_t + 2V_{ov}$ 附近，输出端最低只要 $2V_{ov}$。
      - item:
          id: cmirror-vmin
          type: number
          prompt: 简单共源共栅电流镜的管子 $V_t = 0.5$ V、$V_{ov} = 0.2$ V。输出端最低要多少伏，所有管子才都在饱和区？
          answer: 0.9
          tolerance: 0.001
          unit: V
          hint: 共栅管的源极电压是多少？它自己又要留多少？
          explain: 下面的管子漏极被钉在 $V_{GS} = 0.7$ V，共栅管再留 $V_{ov} = 0.2$ V，共 0.9 V。低压共源共栅只要 $2V_{ov} = 0.4$ V，省下 0.5 V。
      - item:
          id: low-voltage-why
          type: choice
          prompt: 电源只有 1.2 V 的芯片，为什么常用低压共源共栅电流镜，而不是简单的共源共栅电流镜？
          options:
            - text: 简单的那种要多占一个阈值电压的输出余量
              correct: true
            - text: 低压的那种输出电阻更大
              why: 两种的输出电阻都约为 $g_mr_o^2$；区别在于输出端的最低电压
            - text: 低压的那种不需要任何偏置电压
              why: 恰好相反，低压共源共栅要额外产生一个偏置电压给共栅管
          explain: 1.2 V 里多占 0.5 V 的阈值电压，留给信号的空间就很少了。低压共源共栅把余量压到 $2V_{ov}$，代价是要多一路偏置。
      - card:
          title: 偏置电路
          body: |
            参考电流本身从哪来？最简单的是一个电阻接到二极管接法的管子上，电流随电源变。好一点的是与电源无关的偏置：让电路自己决定电流，比如两个尺寸不同的管子加一个电阻组成自偏置环路，电流不随电源电压变，只取决于电阻、尺寸比和 $k_n'$（它随工艺和温度变）。这类电路有两个工作点（其中一个电流为零），必须加**启动电路（start-up circuit）**把它推出零电流状态。同样的思路再加上温度补偿，就能做出不随电源、也不随温度变的基准电压。
      - item:
          id: startup-why
          type: choice
          prompt: 与电源无关的自偏置电路为什么要加启动电路？
          options:
            - text: 它还有一个电流为零的工作点，上电后可能停在那里不动
              correct: true
            - text: 为了让电流随电源电压增大
              why: 自偏置的目的正是让电流不随电源变；启动电路只在上电时把它推出零电流状态
            - text: 为了节省功耗
              why: 启动电路本身不省电；它保证电路离开“全部关断”的那个工作点
          explain: 环路里的管子都关断时，电流为零也能自洽，这是第二个工作点。启动电路在上电时注入一点电流，把环路推到正常的工作点，之后自己关掉。
  - id: freq-miller
    chapter: 频率响应与稳定性
    title: 密勒效应和共源级的极点
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 共源级的栅漏之间只有 5 fF 的小电容，增益是 −40。从输入端看，这个电容的作用相当于多大的接地电容？
          options:
            - text: 约 205 fF，被放大了 41 倍
              correct: true
            - text: 还是 5 fF
              why: 电容两端的电压不同步：输入端变 1 mV，输出端反向变 40 mV，电容上的电压变了 41 mV，流过的电流也是 41 倍
            - text: 约 200 fF 的负电容
              why: 反相放大时电容两端的电压差变大，等效电容是正的、变大；只有同相增益大于 1 时才可能出现负电容
          explain: 跨在反相放大器输入和输出之间的电容，从输入看等效成 $C(1 - A_v)$ 的接地电容，$A_v = -40$ 时是 41 倍。
      - card:
          title: 密勒定理
          body: |
            **密勒定理（Miller's theorem）**：一个阻抗 $Z$ 跨在电压增益为 $A_v$ 的两个节点之间，可以拆成两个接地的阻抗：输入端 $Z/(1 - A_v)$，输出端 $Z/(1 - 1/A_v)$。对电容来说，输入端等效电容是 $C(1 - A_v)$。反相放大器的 $C_{GD}$ 因此在输入端被放大 $1 + |A_v|$ 倍，这叫密勒效应，它常常决定了放大器的带宽。
      - item:
          id: miller-cap
          type: number
          prompt: 共源级的 $C_{GD} = 4$ fF，低频增益 $-50$。按密勒定理，从输入端看等效的接地电容（只算 $C_{GD}$ 这一部分）是多少飞法？
          answer: 204
          tolerance: 0.001
          unit: fF
          hint: 输入端变 1 mV 时，电容两端的电压变多少？
          explain: $4\times(1 + 50) = 204$ fF。管子自己的 $C_{GS}$ 也许才几十飞法，密勒电容反而占了大头。
      - card:
          title: 每个节点一个极点
          body: |
            粗略估算频率响应时，把电路里每个节点看成一个 RC：节点对地的总电阻乘总电容，得到一个时间常数，对应一个极点 $f_p = 1/(2\pi RC)$。共源级有两个主要节点：输入节点（信号源内阻 $R_S$ 和 $C_{GS} + (1 + |A_v|)C_{GD}$），输出节点（输出电阻 $R_{out}$ 和负载电容 $C_L$）。哪个时间常数大，哪个极点就先起作用。
      - card:
          title: 例题：输入极点
          body: 信号源内阻 20 kΩ 驱动一个共源级，$C_{GS} = 40$ fF，$C_{GD} = 4$ fF，低频增益 $-25$。估算输入节点的极点。
          reveal:
            - title: 第 1 步：把栅漏电容折算到输入端
              body: $C_{GD}(1 + 25) = 104$ fF。
            - title: 第 2 步：加出输入节点的总电容
              body: $40 + 104 = 144$ fF。
            - title: 第 3 步：由 RC 求极点频率
              body: $f_{in} = 1/(2\pi\times20\ \text{k}\Omega\times144\ \text{fF}) = 55.3$ MHz。
      - item:
          id: input-pole
          type: number
          prompt: 信号源内阻 10 kΩ 驱动一个共源级，输入节点的总电容（$C_{GS}$ 加密勒电容）是 255 fF。输入极点是多少兆赫？保留一位小数。
          answer: 62.4
          tolerance: 0.05
          unit: MHz
          hint: 输入节点的时间常数是多少？极点频率和时间常数是什么关系？
          explain: $1/(2\pi\times10^4\times255\times10^{-15}) = 62.4$ MHz。
      - card:
          title: 主极点和增益带宽积
          body: |
            输出节点电阻大、又接着负载电容时，输出极点往往最低，叫主极点：$f_p = 1/(2\pi R_{out}C_L)$。在主极点以上，增益按频率反比下降，增益乘带宽保持不变，这个乘积叫**增益带宽积（gain-bandwidth product）**，记作 GBW：

            $$\text{GBW} = A_0f_p = \frac{g_mR_{out}}{2\pi R_{out}C_L} = \frac{g_m}{2\pi C_L}$$

            输出电阻消掉了：想要更大的增益带宽积，只能加大 $g_m$ 或减小负载电容。
      - item:
          id: dominant-pole
          type: number
          prompt: 共源级输出电阻 100 kΩ，输出端负载电容 0.5 pF，输出节点是主极点。主极点频率是多少兆赫？保留两位小数。
          answer: 3.18
          tolerance: 0.005
          unit: MHz
          hint: 主极点由输出节点的哪两个量决定？
          explain: $1/(2\pi\times10^5\times0.5\times10^{-12}) = 3.18$ MHz。
      - item:
          id: gbw-value
          type: number
          prompt: 一个以输出节点为主极点的共源级，$g_m = 0.4$ mS，负载电容 0.5 pF。增益带宽积是多少兆赫？保留一位小数。
          answer: 127.3
          tolerance: 0.05
          unit: MHz
          hint: 增益带宽积和输出电阻有关吗？
          explain: $\text{GBW} = g_m/(2\pi C_L) = 0.4\times10^{-3}/(2\pi\times0.5\times10^{-12}) = 127.3$ MHz。若输出电阻是 100 kΩ，低频增益 40、主极点 3.18 MHz，乘起来也是 127 MHz。
  - id: freq-stages
    chapter: 频率响应与稳定性
    title: 各种单级放大器的频率响应
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 共源级的带宽常常被密勒效应拖累。共源共栅级里，下面那个共源管的漏极接的是上面共栅管的源极，那里的电阻只有约 $1/g_m$。它的 $C_{GD}$ 还会被放大四十倍吗？
          options:
            - text: 不会，只放大约 2 倍
              correct: true
            - text: 会，共源共栅的总增益更大，密勒效应更严重
              why: 密勒效应看的是 $C_{GD}$ 两端之间的增益，即栅极到 M1 漏极的增益约 $-g_{m1}/g_{m2}$，而不是整个放大器的增益
            - text: 完全没有密勒效应
              why: M1 的漏极仍然随输入反向变化，只是幅度和输入差不多，$C_{GD}$ 约放大 2 倍，不是零
          explain: 从 M1 的栅极到漏极，增益约 $-g_{m1}/g_{m2} \approx -1$，$C_{GD1}$ 只被放大约 2 倍。共源共栅级因此带宽更宽，这是它的另一个好处。
      - card:
          title: 源极跟随器和共栅级
          body: |
            源极跟随器驱动负载电容时，输出电阻约 $1/(g_m + g_{mb})$，输出极点 $(g_m + g_{mb})/(2\pi C_L)$ 很高；它的输入端还有一个有趣的性质：$C_{GS}$ 两端的电压几乎同步变化，从输入看只剩很小的一部分。

            共栅级没有从输出跨到输入的电容（栅极接地），没有密勒效应；输入极点由 $1/(g_m + g_{mb})$ 和源极电容决定，通常也很高，适合宽带电路。
      - item:
          id: sf-pole
          type: number
          prompt: 源极跟随器的 $g_m + g_{mb} = 1.2$ mS，驱动 1 pF 的负载电容。输出极点约是多少兆赫？保留到个位。
          answer: 191
          tolerance: 0.5
          unit: MHz
          hint: 输出电阻约是多少？
          explain: 输出电阻 $1/(1.2\ \text{mS}) = 833\ \Omega$，$f = 1.2\times10^{-3}/(2\pi\times10^{-12}) = 191$ MHz。
      - item:
          id: cg-pole
          type: number
          prompt: 共栅级的 $g_m + g_{mb} = 2$ mS，源极节点对地总电容 100 fF，信号源是理想电流源。输入极点是多少吉赫？保留两位小数。
          answer: 3.18
          tolerance: 0.005
          unit: GHz
          hint: 源极节点看到的电阻约是多少？
          explain: 源极节点电阻约 $1/(2\ \text{mS}) = 500\ \Omega$，$f = 2\times10^{-3}/(2\pi\times10^{-13}) = 3.18$ GHz。
      - card:
          title: 共源共栅级和差分对
          body: |
            共源共栅级里 M1 的 $C_{GD}$ 只放大约 2 倍，输入极点比共源级高得多；输出节点电阻极大，主极点在输出端，增益带宽积仍是 $g_{m1}/(2\pi C_L)$。

            差分对的差模响应可以拆成两个“半电路”分析：每个半电路就是一个共源级，频率响应和共源级一样。电流镜负载的五管单元多了镜像节点（二极管接法的那个管子），它带来一个约在 $g_{m3}/(2\pi C_{mirror})$ 的极点和一个两倍频率处的零点。
      - item:
          id: cascode-miller
          type: number
          prompt: 共源共栅级里，下面那个管子的 $C_{GD} = 5$ fF，从它的栅极到漏极的增益约 $-1$。按密勒定理，从输入端看这部分等效电容是多少飞法？
          answer: 10
          tolerance: 0.001
          unit: fF
          hint: 输入端变 1 mV 时，电容两端的电压变多少？
          explain: $5\times(1 + 1) = 10$ fF。同样的管子作共源级、增益 $-40$ 时是 205 fF。
      - card:
          title: 开路时间常数法
          body: |
            电容很多时，逐个求极点很麻烦。开路时间常数法把每个电容单独拿出来：其他电容全部断开（开路），求这个电容两端看进去的电阻 $R_i$，得到时间常数 $R_iC_i$。把所有时间常数加起来，在一个极点起主要作用、没有明显零点的电路里，带宽约为

            $$f_{-3\text{dB}} \approx \frac{1}{2\pi\sum R_iC_i}$$

            它还告诉你哪个电容拖后腿：时间常数最大的那一项最值得优化。
      - item:
          id: octc-bw
          type: number
          prompt: 一个放大器有三个电容，按开路时间常数法求出的时间常数分别是 100 ps、300 ps、50 ps。估算的 −3 dB 带宽是多少兆赫？保留到个位。
          answer: 354
          tolerance: 0.5
          unit: MHz
          hint: 时间常数怎样合在一起？
          explain: 总和 450 ps，$f \approx 1/(2\pi\times450\ \text{ps}) = 354$ MHz。300 ps 那一项占了三分之二，先想办法减小它。
  - id: feedback
    chapter: 频率响应与稳定性
    title: 反馈：用增益换准确度
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个放大器的开环增益在 800 到 1200 之间（随工艺和温度变）。加上负反馈，让闭环增益约为 10。闭环增益的变化会是多少？
          options:
            - text: 只有零点几个百分点
              correct: true
            - text: 和开环一样，在 ±20% 之间变
              why: 负反馈让闭环增益主要由反馈网络决定；开环增益很大时，它的变化被除以 $1 + A\beta$，影响缩小了一百多倍
            - text: 变化反而更大
              why: 负反馈的作用正是让增益对放大器本身的变化不敏感
          explain: 闭环增益 $A/(1 + A\beta)$，开环增益很大时约等于 $1/\beta$，只由反馈网络（通常是电阻或电容的比值）决定，开环增益的变化被大大压缩。
      - card:
          title: 增益降敏
          body: |
            放大器开环增益 $A$，反馈网络把输出的 $\beta$ 倍送回输入相减，闭环增益

            $$A_{CL} = \frac{A}{1 + A\beta}$$

            $A\beta$ 叫环路增益。$A\beta \gg 1$ 时 $A_{CL} \approx 1/\beta$。开环增益变化的比例，到闭环只剩原来的 $1/(1 + A\beta)$。代价是增益从 $A$ 降到约 $1/\beta$：用多余的增益换准确度。
      - item:
          id: fb-closed
          type: number
          prompt: 开环增益 1000，反馈系数 $\beta = 0.1$。闭环增益是多少？保留三位小数。
          answer: 9.901
          tolerance: 0.0005
          hint: 环路增益 $A\beta$ 是多少？
          explain: $A\beta = 100$，$A_{CL} = 1000/101 = 9.901$，和理想的 $1/\beta = 10$ 只差 1%。
      - item:
          id: fb-desens
          type: number
          prompt: 反馈系数 $\beta = 0.1$ 的放大器，开环增益从 1000 掉到 800（降了 20%）。闭环增益降了百分之几？保留两位小数。
          answer: 0.25
          tolerance: 0.005
          unit: '%'
          hint: 分别算出两个闭环增益再比。
          explain: $1000/101 = 9.901$，$800/81 = 9.877$，降了 0.25%。它正好等于 $20\%/(1 + 800\times0.1) = 20\%/81$：闭环的相对变化是开环的相对变化除以 $1 + A\beta$（$A$ 取变化后的值）。
      - card:
          title: 反馈扩展带宽
          body: |
            开环增益只有一个极点 $f_p$ 时，加上反馈后闭环的极点移到 $f_p(1 + A_0\beta)$，带宽扩大 $1 + A_0\beta$ 倍，增益缩小同样的倍数，增益带宽积不变。所以运放的开环带宽往往只有几赫兹到几千赫兹，接成闭环后却能用到兆赫级。
      - item:
          id: fb-bandwidth
          type: number
          prompt: 开环增益 1000、开环极点 10 kHz 的放大器，接成 $\beta = 0.1$ 的负反馈。闭环带宽约是多少兆赫？
          answer: 1.01
          tolerance: 0.001
          unit: MHz
          hint: 闭环极点移到原来的几倍？
          explain: $10\ \text{kHz}\times(1 + 100) = 1.01$ MHz。闭环增益 9.9，乘带宽约 10 MHz，等于开环的 $1000\times10\ \text{kHz}$。
      - card:
          title: 四种反馈拓扑
          body: |
            按“在输出端取电压还是电流”“在输入端和电压串联还是和电流并联”，反馈分四种。输出端取电压（并联取样）让输出电阻减小 $1 + A\beta$ 倍，取电流（串联取样）让输出电阻增大；输入端串联让输入电阻增大 $1 + A\beta$ 倍，并联让输入电阻减小。

            比如电压放大器要输入电阻大、输出电阻小，就用“输入串联、输出取电压”的反馈；把电流变成电压的**跨阻放大器（transimpedance amplifier）**用“输入并联、输出取电压”。
      - item:
          id: fb-rin
          type: number
          prompt: 一个放大器自身输入电阻 10 kΩ，接成输入端串联的负反馈，环路增益 $A\beta = 100$。闭环输入电阻约是多少兆欧？
          answer: 1.01
          tolerance: 0.001
          unit: MΩ
          hint: 输入端串联的反馈让输入电阻变大还是变小、变几倍？
          explain: $10\ \text{k}\Omega\times(1 + 100) = 1.01$ MΩ。
      - item:
          id: fb-topology
          type: choice
          prompt: 要把光电二极管的电流变成电压，并且输出能驱动后面的电路（输出电阻小），应该用哪种反馈？
          options:
            - text: 输入端并联（接收电流）、输出端取电压
              correct: true
            - text: 输入端串联、输出端取电流
              why: 输入串联让输入电阻变大，不利于接收电流；输出取电流让输出电阻变大，不利于驱动负载
            - text: 不需要反馈，直接接一个电阻就行
              why: 电阻也能把电流变成电压，但带宽和增益受电阻和电容牵制；加反馈的跨阻放大器能同时得到大增益和宽带宽
          explain: 并联输入让输入电阻小，电流容易流进来；取输出电压让输出电阻小，能驱动负载。这就是跨阻放大器的结构。
  - id: stability
    chapter: 频率响应与稳定性
    title: 稳定性和相位裕度
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个负反馈放大器的环路，在某个频率上信号绕一圈正好被延迟了半个周期（相移 180°），而且环路增益还大于 1。会怎样？
          options:
            - text: 负反馈变成了正反馈，电路可能自己振荡
              correct: true
            - text: 没关系，负反馈总是稳定的
              why: 再加 180° 相移，送回去的信号和原信号同相，相减变成相加；环路增益大于 1 时会越加越大
            - text: 只会让增益变小一点
              why: 这时反馈信号和输入同相、幅度还更大，结果是自激振荡，而不只是增益变化
          explain: 负反馈本身带一个 180° 的反相，再加上频率带来的 180°，一圈下来是 360°，等于正反馈。环路增益大于 1 时，噪声就能被不断放大成振荡。
      - card:
          title: 稳定的条件
          body: |
            画出环路增益 $A\beta$ 随频率的幅度和相位（波特图）。幅度降到 1（0 dB）的那个频率叫**单位增益频率（unity-gain frequency）**。要稳定，那时的相移必须还没到 −180°。相位离 −180° 还差多少度，叫相位裕度：

            $$\text{PM} = 180° + \angle A\beta\,(f_u)$$

            相位裕度越大越稳。45° 时闭环响应有明显的过冲，60° 左右过冲很小，是常用的设计目标。
      - item:
          id: pm-meaning
          type: choice
          prompt: 一个反馈放大器在单位增益频率处的环路相移是 −150°。相位裕度是多少，它稳定吗？
          options:
            - text: 30°，稳定，但过冲明显
              correct: true
            - text: 150°，非常稳定，远离振荡
              why: 相位裕度是离 −180° 还差多少：180° − 150° = 30°，不是 150°
            - text: −30°，会振荡
              why: 相移还没到 −180°，裕度是正的 30°；只有超过 −180° 才是负裕度
          explain: $\text{PM} = 180° - 150° = 30°$。正裕度说明不会振荡，但 30° 偏小，阶跃响应会反复冲过头再回来，通常要求 45° 以上。
      - card:
          title: 两个极点的环路
          body: |
            多数放大器可以近似成两个极点：低频的主极点 $p_1$ 和高频的**非主极点（non-dominant pole）** $p_2$。单位增益频率 $f_u$ 远高于 $p_1$ 时，$p_1$ 已经贡献了 −90°，$p_2$ 再贡献 $-\arctan(f_u/p_2)$，所以

            $$\text{PM} \approx 90° - \arctan\frac{f_u}{p_2}$$

            $p_2$ 放在 $f_u$ 处时裕度 45°，放在 2 倍处约 63°，3 倍处约 72°。
      - item:
          id: pm-two-pole
          type: number
          prompt: 一个两极点的反馈环路，主极点远低于单位增益频率，非主极点在单位增益频率的 3 倍处。相位裕度约是多少度？保留一位小数。
          answer: 71.6
          tolerance: 0.05
          unit: °
          hint: $\arctan(1/3)$ 约是多少度？
          explain: $90° - \arctan(1/3) = 90° - 18.4° = 71.6°$。
      - card:
          title: 主极点补偿
          body: |
            如果一个放大器的极点靠得太近，接成反馈后相位裕度不够，最简单的办法是把主极点再往低频推（比如在高阻节点上加大电容），让增益早一点降下来：单位增益频率移到非主极点之下，相位裕度就够了。代价是带宽变窄。两级运放常用的密勒补偿也把主极点推向低频，同时还把非主极点推高。
      - card:
          title: 例题：主极点该放在哪里
          body: 一个放大器低频增益 1000，非主极点在 10 MHz，接成单位增益缓冲器（$\beta = 1$）。要相位裕度 45°，主极点应放在多少？
          reveal:
            - title: 第 1 步：定出单位增益频率的位置
              body: 45° 要求 $f_u = p_2 = 10$ MHz。
            - title: 第 2 步：由单位增益频率反推主极点
              body: 按单极点下降估算 $f_u = A_0p_1$，所以 $p_1 = 10\ \text{MHz}/1000 = 10$ kHz。$p_2$ 会让 $f_u$ 附近的幅度再低一点，实际的单位增益频率略低，裕度比 45° 略大。
            - title: 第 3 步：换成 60° 的要求再算一次
              body: $f_u$ 要降到 $p_2/\sqrt3 \approx 5.8$ MHz 附近，$p_1$ 也跟着降到约 5.8 kHz。
      - item:
          id: dominant-place
          type: number
          prompt: 放大器低频增益 2000，非主极点在 20 MHz，接成 $\beta = 1$ 的缓冲器。要让单位增益频率正好落在非主极点上（相位裕度 45°），主极点应放在多少千赫？
          answer: 10
          tolerance: 0.001
          unit: kHz
          hint: 单极点下降时单位增益频率等于什么？
          explain: $f_u = A_0p_1 = 20$ MHz，$p_1 = 20\ \text{MHz}/2000 = 10$ kHz。
  - id: noise-basics
    chapter: 噪声分析
    title: 噪声从哪里来
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个电阻放在桌上，两端什么也不接。用极灵敏的仪器测它两端的电压，会是多少？
          options:
            - text: 平均是零，但一直在随机地微小抖动
              correct: true
            - text: 严格等于零，没有电流就没有电压
              why: 电阻里的电子在做热运动，随机地一会儿多一会儿少地挤到一端，两端就有起伏的电压，平均值为零
            - text: 一个固定的小电压
              why: 热运动是随机的，没有固定的方向，所以电压的平均值是零，只是不停起伏
          explain: 只要温度高于绝对零度，电阻里的电子就在随机运动，两端出现平均为零、随机起伏的电压，这就是热噪声。它给能放大的最小信号定了下限。
      - card:
          title: 怎样描述噪声
          body: |
            噪声是随机的，没法预测某一时刻的值，只能用统计量描述：它的平均功率（电压的方均值 $\overline{v_n^2}$）。不同频率上的噪声功率可以不同，每赫兹带宽里的噪声功率叫**功率谱密度（power spectral density）**，单位 V²/Hz，常开方写成 nV/√Hz。

            两个互不相关的噪声源叠加时，功率相加，所以有效值按平方和开方合成：3 和 4 合成 5，不是 7。
      - item:
          id: noise-sum
          type: number
          prompt: 两个互不相关的噪声源，在输出端的电压噪声谱密度分别是 3 nV/√Hz 和 4 nV/√Hz。总的噪声谱密度是多少 nV/√Hz？
          answer: 5
          tolerance: 0.001
          unit: nV/√Hz
          hint: 不相关的噪声相加的是功率还是电压？
          explain: 功率相加：$3^2 + 4^2 = 25$，开方得 5 nV/√Hz。直接相加得 7 是把它们当成同相的确定信号了。
      - card:
          title: 热噪声
          body: |
            电阻的**热噪声（thermal noise）**可以看成和它串联的一个电压源，谱密度在很宽的频率范围内是平的（白噪声）：

            $$\overline{v_n^2} = 4kTR\ \text{（每赫兹）}$$

            $k$ 是玻尔兹曼常数，室温时 $kT \approx 4.14\times10^{-21}$ J。1 kΩ 电阻约 4 nV/√Hz。带宽 $B$ 里的总噪声电压有效值是 $\sqrt{4kTRB}$。
      - item:
          id: thermal-1k
          type: number
          prompt: 室温（$kT = 4.14\times10^{-21}$ J）下一个 1 kΩ 电阻，热噪声电压谱密度是多少 nV/√Hz？保留两位小数。
          answer: 4.07
          tolerance: 0.005
          unit: nV/√Hz
          hint: 电阻热噪声的谱密度（V²/Hz）是多少？要变成 nV/√Hz 还要做什么？
          explain: $4\times4.14\times10^{-21}\times10^3 = 1.656\times10^{-17}\ \text{V}^2/\text{Hz}$，开方 $4.07\times10^{-9}$ V/√Hz。
      - item:
          id: thermal-band
          type: number
          prompt: 一个热噪声谱密度 4.07 nV/√Hz 的电阻，在 1 MHz 带宽内的总噪声电压有效值是多少微伏？保留两位小数。
          answer: 4.07
          tolerance: 0.005
          unit: μV
          hint: 带宽内的噪声功率是谱密度的平方乘什么？
          explain: $4.07\ \text{nV}/\sqrt{\text{Hz}}\times\sqrt{10^6\ \text{Hz}} = 4.07\ \mu$V。带宽扩大 100 倍，噪声只增大 10 倍。
      - card:
          title: MOS 管的噪声
          body: |
            饱和区 MOS 管的沟道也有热噪声，可以看成漏源之间的一个电流源：$\overline{i_n^2} = 4kT\gamma g_m$（每赫兹），长沟道管 $\gamma \approx 2/3$，短沟道管更大。除以 $g_m^2$ 折算到栅极，等效电压噪声 $4kT\gamma/g_m$：跨导越大，噪声越小。

            低频还有**闪烁噪声（flicker noise）**，谱密度和频率成反比（也叫 1/f 噪声），来自栅氧界面随机捕获和释放载流子；管子面积越大越小。它和热噪声相等的频率叫转角频率。
      - item:
          id: mos-noise
          type: number
          prompt: 一个 MOS 管 $g_m = 1$ mS，$\gamma = 2/3$，室温 $kT = 4.14\times10^{-21}$ J。按 $4kT\gamma/g_m$，折算到栅极的热噪声电压谱密度是多少 nV/√Hz？保留两位小数。
          answer: 3.32
          tolerance: 0.005
          unit: nV/√Hz
          hint: 题里的式子算出的单位是 V²/Hz，要得到 nV/√Hz 还要做什么？
          explain: $4\times4.14\times10^{-21}\times(2/3)/10^{-3} = 1.104\times10^{-17}\ \text{V}^2/\text{Hz}$，开方 3.32 nV/√Hz，和一个约 670 Ω 电阻的热噪声相当。
      - item:
          id: flicker-reduce
          type: choice
          prompt: 一个音频放大器在几十赫兹处噪声很大，主要是输入管的闪烁噪声。下面哪种做法最有效？
          options:
            - text: 把输入管的面积（W 和 L）做大
              correct: true
            - text: 加大输入管的偏置电流
              why: 加大电流主要提高 $g_m$、降低热噪声；闪烁噪声折算到栅极后主要和面积成反比
            - text: 降低电路的温度到 0 °C
              why: 降温对热噪声有一点帮助，闪烁噪声来自界面上的陷阱，降温几十度效果很小
          explain: 折算到栅极的闪烁噪声约和 $1/(C_{ox}WL f)$ 成正比，做大面积最直接，代价是电容大。PMOS 的闪烁噪声通常比 NMOS 小，所以低噪声输入级常用 PMOS。
  - id: noise-circuits
    chapter: 噪声分析
    title: 等效输入噪声和 kT/C 噪声
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个放大器增益 100，输出端测到的噪声是 100 μV。要和输入信号比较、判断信号能不能被看清，应该拿哪个数去比？
          options:
            - text: 输出噪声除以增益，得 1 μV
              correct: true
            - text: 直接拿 100 μV 和输入信号比
              why: 输入信号还没被放大，输出噪声已经放大了 100 倍；两者不在同一个位置，比较没有意义
            - text: 把输出噪声乘以增益
              why: 乘增益会把噪声算得更大；要折算回输入端，应该除以增益
          explain: 把所有噪声折算到输入端（除以增益），得到等效输入噪声，就能直接和输入信号比较，也方便比较不同放大器的好坏。
      - card:
          title: 等效输入噪声
          body: |
            把电路里所有噪声源对输出的贡献加起来（功率相加），再除以增益的平方，就得到一个放在输入端的等效噪声电压源，叫**等效输入噪声（input-referred noise）**。共源级（电阻负载 $R_D$）的等效输入噪声是

            $$\overline{v_{n,in}^2} = 4kT\left(\frac{\gamma}{g_m} + \frac{1}{g_m^2R_D}\right)$$

            第一项是管子，第二项是负载电阻折算过来的。加大 $g_m$ 两项都变小，所以低噪声放大器的输入管常用大电流。
      - item:
          id: cs-input-noise
          type: number
          prompt: 共源级 $g_m = 2$ mS，$\gamma = 2/3$，负载电阻 5 kΩ，室温 $kT = 4.14\times10^{-21}$ J。按 $4kT(\gamma/g_m + 1/(g_m^2R_D))$，等效输入噪声谱密度是多少 nV/√Hz？保留两位小数。
          answer: 2.52
          tolerance: 0.005
          unit: nV/√Hz
          hint: 括号里两项各是多少欧？
          explain: $\gamma/g_m = 333\ \Omega$，$1/(g_m^2R_D) = 50\ \Omega$，和 383 Ω；$4kT\times383 = 6.35\times10^{-18}$，开方 2.52 nV/√Hz。管子的贡献占大头。
      - card:
          title: 差分对的噪声
          body: |
            差分对有两个输入管，它们的噪声互不相关，折算到差分输入端功率相加：等效输入噪声是一个管子的 2 倍（功率），即 $\sqrt2$ 倍（电压）。差分电路抗共模干扰的好处，是用这多出来的噪声换来的。负载电流镜的噪声也会折算过来，要让负载管的 $g_m$ 比输入管小。
      - item:
          id: dp-noise
          type: number
          prompt: 差分对每个输入管 $g_m = 1$ mS，$\gamma = 2/3$，只算输入管的热噪声，$kT = 4.14\times10^{-21}$ J。折算到差分输入端的噪声谱密度是多少 nV/√Hz？保留两位小数。
          answer: 4.70
          tolerance: 0.005
          unit: nV/√Hz
          hint: 一个管子的等效输入噪声是多少？两个管子怎样合成？
          explain: 一个管子 $4kT\gamma/g_m = 1.104\times10^{-17}\ \text{V}^2/\text{Hz}$，两个相加 $2.208\times10^{-17}$，开方 4.70 nV/√Hz，是单管 3.32 的 $\sqrt2$ 倍。
      - card:
          title: kT/C 噪声
          body: |
            用一个 MOS 开关给电容充电再断开，电容上会留下随机的电压误差。开关的导通电阻有热噪声，电阻越大噪声谱密度越大，可带宽越窄，两者正好抵消：电容上的总噪声功率只和电容有关，叫 **kT/C 噪声（kT/C noise）**：

            $$\overline{v_n^2} = \frac{kT}{C}$$

            电容越大越安静。这给采样电路、开关电容电路定了下限：要更低的噪声，就得用更大的电容，代价是速度和面积。
      - card:
          title: 例题：采样电容要多大
          body: 一个采样电路的采样电容 0.5 pF，室温 $kT = 4.14\times10^{-21}$ J。kT/C 噪声多大？想把它减半，电容要多大？
          reveal:
            - title: 第 1 步：求电容上的噪声功率
              body: $kT/C = 4.14\times10^{-21}/(0.5\times10^{-12}) = 8.28\times10^{-9}\ \text{V}^2$。
            - title: 第 2 步：开方得到有效值
              body: 开方得 91 μV。
            - title: 第 3 步：求噪声减半需要的电容
              body: 噪声电压和 $1/\sqrt C$ 成正比，减半要把电容加大 4 倍，到 2 pF。
      - item:
          id: ktc-4p
          type: number
          prompt: 室温 $kT = 4.14\times10^{-21}$ J，一个 4 pF 的采样电容，kT/C 噪声电压有效值是多少微伏？保留一位小数。
          answer: 32.2
          tolerance: 0.05
          unit: μV
          hint: $kT/C$ 给的是电压的方均值还是有效值？
          explain: $4.14\times10^{-21}/(4\times10^{-12}) = 1.035\times10^{-9}\ \text{V}^2$，开方 32.2 μV。
      - item:
          id: ktc-resistor
          type: choice
          prompt: 采样开关的导通电阻换成大一倍的，电容不变。电容上的 kT/C 噪声会怎样？
          options:
            - text: 不变
              correct: true
            - text: 变大，因为电阻的热噪声变大了
              why: 电阻大一倍，噪声谱密度大一倍，但 RC 带宽小一倍，总噪声功率不变
            - text: 变小，因为电阻大了电流就小
              why: 噪声和直流电流无关；电阻对谱密度和带宽的影响正好抵消
          explain: 总噪声功率 $= 4kTR\times\frac{1}{4RC} = kT/C$，电阻约掉了。只有加大电容才能降低它。
  - id: opamp-specs
    chapter: 运算放大器设计与补偿
    title: 运放的指标和结构
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个运放要同时做到增益很高、输出电压能摆得很宽。只用一级共源共栅放大，常常两者顾不上。为什么？
          options:
            - text: 叠管子挤占了输出摆幅
              correct: true
            - text: 共源共栅的增益太低
              why: 共源共栅的增益是本征增益的平方量级，很高；它的问题是摆幅
            - text: 共源共栅太慢，增益一高带宽就没了
              why: 增益和带宽确实要折中，但这里顾不上的是摆幅：每叠一个管子就多占一份饱和余量
          explain: 增益靠叠管子（提高输出电阻）得来，摆幅却要求少叠管子。把这两件事分给两级：第一级要增益，第二级要摆幅，就是两级运放的思路。
      - card:
          title: 运放的主要指标
          body: |
            设计运放先看指标：开环增益（决定闭环精度）、小信号带宽和增益带宽积、大信号的**压摆率（slew rate）**（输出电压最快能变多快）、输出摆幅、输入共模范围、线性度、噪声和失调、电源抑制（电源上的波动有多少传到输出）、功耗。闭环增益误差约为 $1/(A\beta)$：要 0.1% 的精度、$\beta = 1$ 时，开环增益至少 1000（60 dB）。
      - item:
          id: opamp-gain-need
          type: choice
          prompt: 一个接成单位增益缓冲器（$\beta = 1$）的运放，要求输出和输入的相对误差不超过 0.1%。开环增益至少要多少？
          options:
            - text: 约 1000（60 dB）
              correct: true
            - text: 约 10（20 dB）
              why: 误差约 $1/(A\beta) = 1/10 = 10\%$，远超 0.1%
            - text: 约 100 万（120 dB）
              why: 100 万能做到 0.0001%，比要求严格一千倍；满足 0.1% 只需要 1000
          explain: 闭环增益 $A/(1 + A)$，相对误差约 $1/A$。0.1% 要 $A \ge 1000$。
      - card:
          title: 单级运放：套筒式和折叠式
          body: |
            一级运放靠共源共栅拿到高增益。套筒式共源共栅把差分对、共源共栅管、负载电流镜竖着叠在一条电流路上，功耗最低、噪声最小，但输出摆幅窄，输入共模范围也窄。折叠式共源共栅把共栅管换成另一种极性，摆幅和输入范围宽一些，代价是多一路电流、功耗和噪声都大一些。

            要更高的增益，还可以用**增益提升（gain boosting）**：给共栅管加一个辅助放大器把它的源极电压钉得更死，输出电阻再乘上辅助放大器的增益。
      - item:
          id: telescopic-swing
          type: number
          prompt: 一个套筒式运放的电源 1.8 V，从电源到地一条电流路上叠了 5 个管子（尾电流管、输入管、两个共源共栅管、负载管），每个都要留 0.2 V 的过驱动电压。每个输出端还能摆动的范围约是多少伏？
          answer: 0.8
          tolerance: 0.001
          unit: V
          hint: 5 个管子一共占掉多少饱和余量？
          explain: $1.8 - 5\times0.2 = 0.8$ V。电源降到 1.2 V 时只剩 0.2 V，套筒式就很难用了。
      - card:
          title: 两级运放
          body: |
            第一级用五管差分对（或折叠共源共栅）提供增益，第二级用一个共源级（PMOS 或 NMOS 加电流源负载）提供大摆幅：第二级输出端只叠两个管子，能摆到离两条电源轨各一个 $V_{ov}$。总增益是两级相乘：

            $$A_v = g_{m1}(r_{o2}\parallel r_{o4})\cdot g_{m6}(r_{o6}\parallel r_{o7})$$

            两级就有两个高阻节点、两个低频极点，接成反馈时稳定性成了问题，要靠补偿解决。
      - item:
          id: two-stage-gain
          type: number
          prompt: 两级运放的第一级增益 40、第二级增益 50。总开环增益是多少分贝？保留一位小数。
          answer: 66.0
          tolerance: 0.05
          unit: dB
          hint: 两级的增益怎样合成？分贝怎么算？
          explain: 总增益 $40\times50 = 2000$，$20\lg2000 = 66.0$ dB。分贝相加也一样：32.0 + 34.0 = 66.0。
      - item:
          id: two-stage-swing
          type: number
          prompt: 两级运放的第二级是 PMOS 放大管加 NMOS 电流源负载，电源 1.8 V，两个管子的过驱动电压都是 0.2 V。输出端能摆动的范围约是多少伏？
          answer: 1.4
          tolerance: 0.001
          unit: V
          hint: 输出端离电源和离地各要留多少？
          explain: 上下各留一个 $V_{ov}$，$1.8 - 2\times0.2 = 1.4$ V，比套筒式的 0.8 V 宽得多。
  - id: miller-compensation
    chapter: 运算放大器设计与补偿
    title: 两级运放的密勒补偿
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 两级运放有两个高阻节点，两个低频极点靠得很近，接成反馈会振荡。在第二级的输入和输出之间跨接一个小电容，会怎样？
          options:
            - text: 两个极点一低一高地分开了
              correct: true
            - text: 两个极点都往低频移，带宽更窄但更不稳定
              why: 跨接电容利用第二级的增益：输入端看到放大后的大电容，极点下移；输出端在高频被电容“短路”成低阻，极点上移
            - text: 只是加了一个负载电容，什么都没改善
              why: 跨在放大级两端的电容和接地电容作用不同，它通过密勒效应同时改变两个节点
          explain: 这叫极点分裂：第一级输出节点看到被第二级增益放大的电容，极点降到很低（成为主极点）；第二级输出节点的极点被推高。两个极点拉开，相位裕度就够了。
      - card:
          title: 极点分裂
          body: |
            在第二级（增益 $A_2 = g_{m2}R_2$）的输入和输出之间接补偿电容 $C_c$，叫**密勒补偿（Miller compensation）**。第一级输出节点看到约 $A_2C_c$ 的电容，主极点 $p_1 \approx 1/(2\pi R_1A_2C_c)$；第二级输出节点的极点被推到约 $p_2 \approx g_{m2}/(2\pi C_L)$（$C_L$ 是负载电容；要求第一级输出节点的寄生电容远小于 $C_c$ 和 $C_L$）。两个极点就这样被拉开，叫**极点分裂（pole splitting）**。

            增益带宽积等于低频增益 $g_{m1}R_1A_2$ 乘 $p_1$，$R_1$ 和 $A_2$ 都消掉了：

            $$\text{GBW} \approx \frac{g_{m1}}{2\pi C_c}$$
      - item:
          id: miller-gbw
          type: number
          prompt: 两级运放用密勒补偿，第一级跨导 0.5 mS，补偿电容 1 pF。增益带宽积约是多少兆赫？保留一位小数。
          answer: 79.6
          tolerance: 0.05
          unit: MHz
          hint: 增益带宽积由哪两个量决定？
          explain: $\text{GBW} = 0.5\times10^{-3}/(2\pi\times10^{-12}) = 79.6$ MHz。和第二级、和负载电容都无关。
      - card:
          title: 右半平面零点和调零电阻
          body: |
            补偿电容还给信号开了一条从第二级输入直接“前馈”到输出的路，产生一个**右半平面零点（right-half-plane zero）**，约在 $g_{m2}/(2\pi C_c)$。它像极点一样让相位落后，却不让幅度下降，会吃掉相位裕度。常用的办法是和 $C_c$ 串一个**调零电阻（nulling resistor）** $R_z$：$R_z = 1/g_{m2}$ 时零点移到无穷远，再大一点还能把它挪到左半平面去抵消 $p_2$。
      - item:
          id: rhp-zero
          type: number
          prompt: 两级运放第二级跨导 4 mS，补偿电容 1 pF。右半平面零点约在多少兆赫？保留到个位。
          answer: 637
          tolerance: 0.5
          unit: MHz
          hint: 零点由第二级的哪个量和补偿电容决定？
          explain: $f_z = 4\times10^{-3}/(2\pi\times10^{-12}) = 637$ MHz。要消掉它，串一个 $R_z = 1/g_{m2} = 250\ \Omega$ 的电阻。
      - card:
          title: 例题：第二级跨导要多大
          body: $g_{m1} = 0.5$ mS，$C_c = 2$ pF，负载电容 3 pF，右半平面零点已经用调零电阻消掉。按常用的经验取法，把非主极点放在增益带宽积的 2.2 倍处：只算这两个极点时相位裕度约 66°；零点若没消掉、落在 10 倍增益带宽积处，再减约 6°，也还有约 60°。第二级跨导至少多大？
          reveal:
            - title: 第 1 步：求增益带宽积
              body: $\text{GBW} = 0.5\times10^{-3}/(2\pi\times2\times10^{-12}) = 39.8$ MHz。
            - title: 第 2 步：把相位裕度的要求写成不等式
              body: $g_{m2}/(2\pi C_L) \ge 2.2\times g_{m1}/(2\pi C_c)$，即 $g_{m2} \ge 2.2\,g_{m1}C_L/C_c$。
            - title: 第 3 步：代入求第二级跨导
              body: $g_{m2} \ge 2.2\times0.5\times3/2 = 1.65$ mS。第二级的电流要比第一级大好几倍，这是两级运放功耗的主要去处。
      - item:
          id: miller-pm
          type: number
          prompt: 密勒补偿的两级运放，增益带宽积 79.6 MHz，非主极点 318 MHz，右半平面零点已经抵消。按 $\text{PM} \approx 90° - \arctan(\text{GBW}/p_2)$，相位裕度约是多少度？保留到个位。
          answer: 76
          tolerance: 0.5
          unit: °
          hint: $\text{GBW}/p_2$ 约是多少？
          explain: $79.6/318 = 0.25$，$\arctan0.25 = 14.0°$，$\text{PM} \approx 76°$。
      - item:
          id: miller-gm2
          type: number
          prompt: 两级运放用密勒补偿：第一级跨导 0.3 mS，补偿电容 1.5 pF，负载电容 4 pF，右半平面零点已经消掉。按经验把非主极点 $g_{m2}/(2\pi C_L)$ 放在增益带宽积的 2.2 倍处，第二级跨导至少多少毫西？保留两位小数。
          answer: 1.76
          tolerance: 0.005
          unit: mS
          hint: 增益带宽积由哪两个量决定？把“非主极点不低于 2.2 倍增益带宽积”写成不等式后，哪些因子能约掉？
          explain: $g_{m2}/(2\pi C_L) \ge 2.2\,g_{m1}/(2\pi C_c)$，所以 $g_{m2} \ge 2.2\times0.3\times4/1.5 = 1.76$ mS。负载电容越大、补偿电容越小，第二级要的跨导越大。
      - card:
          title: 压摆率
          body: |
            输入阶跃很大时，第一级的差分对完全偏向一边，尾电流 $I_{SS}$ 全部用来给补偿电容充放电，输出电压最快只能以

            $$\text{SR} = \frac{I_{SS}}{C_c}$$

            的速度变化，这叫压摆率。它是大信号的限制，和小信号带宽无关；要更快，就加大尾电流或减小 $C_c$（后者又牵动稳定性）。
      - item:
          id: slew-rate
          type: number
          prompt: 两级运放的输入级尾电流 30 μA，补偿电容 1.5 pF。压摆率是多少伏每微秒？
          answer: 20
          tolerance: 0.001
          unit: V/μs
          hint: 压摆率等于什么除以什么？
          explain: $30\ \mu\text{A}/1.5\ \text{pF} = 2\times10^7$ V/s，即 20 V/μs。输出要在 0.1 μs 内摆 1 V 就需要 10 V/μs，够用。
  - id: bandgap
    chapter: 带隙基准
    title: 带隙基准
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 模数转换器需要一个准确的参考电压，从 −40 °C 到 125 °C 都不能变。晶体管的 $V_{BE}$ 随温度升高而下降，有没有办法用它做出一个不随温度变的电压？
          options:
            - text: 加上一个随温度上升的电压抵消
              correct: true
            - text: 不可能，晶体管的电压总会随温度变
              why: 单个电压会变，但两个变化方向相反的电压按合适的比例相加，变化可以在某个温度附近抵消到零
            - text: 把芯片的温度控制住
              why: 给芯片恒温太费电、也不现实；更好的办法是让电路自身的两种温度特性互相抵消
          explain: $V_{BE}$ 随温度下降（负温度系数），两个晶体管 $V_{BE}$ 之差随温度上升（正温度系数）。按比例相加，温度系数在某一点为零。
      - card:
          title: 两种温度系数
          body: |
            双极晶体管的 $V_{BE}$ 约 0.6–0.7 V，每升高 1 K 下降约 1.5–2 mV，这种随温度下降的量叫与绝对温度互补，简称 **CTAT（complementary to absolute temperature）**。两个电流相同、发射极面积比 $n:1$ 的晶体管，$V_{BE}$ 之差

            $$\Delta V_{BE} = V_T\ln n = \frac{kT}{q}\ln n$$

            和绝对温度成正比，简称 **PTAT（proportional to absolute temperature）**，温度系数 $(k/q)\ln n$，其中 $k/q = 0.0862$ mV/K。CMOS 工艺里用寄生的双极晶体管（阱和衬底形成的 PNP）来做。
      - item:
          id: delta-vbe
          type: number
          prompt: 两个双极晶体管电流相同，发射极面积比 4:1，热电压取 25 mV。它们的 $V_{BE}$ 之差是多少毫伏？保留一位小数。
          answer: 34.7
          tolerance: 0.05
          unit: mV
          hint: 两管电流相同、面积差 4 倍，电流密度差几倍？$V_{BE}$ 和电流密度是什么关系？
          explain: $25\times\ln4 = 25\times1.386 = 34.7$ mV。电流密度大的那个 $V_{BE}$ 大。
      - item:
          id: ptat-tc
          type: number
          prompt: 两个电流相同的双极晶体管，发射极面积比 24:1，$k/q = 0.0862$ mV/K。$\Delta V_{BE}$ 的温度系数是多少 mV/K？保留三位小数。
          answer: 0.274
          tolerance: 0.0005
          unit: mV/K
          hint: $\Delta V_{BE}$ 和温度成正比，比例系数是什么？
          explain: $0.0862\times\ln24 = 0.0862\times3.178 = 0.274$ mV/K，比 $V_{BE}$ 的约 −1.9 mV/K 小得多，所以要放大后再相加。
      - card:
          title: 加起来
          body: |
            输出 $V_{REF} = V_{BE} + K\,\Delta V_{BE}$。选 $K$ 让两者的温度系数抵消：$K = |\text{TC}_{V_{BE}}|/\big((k/q)\ln n\big)$。抵消后的输出约 1.2 V。硅的**带隙（band gap）**也叫禁带宽度，室温下约 1.12 eV，从室温附近按直线外推到绝对零度约 1.2 eV；$V_{BE}$ 随温度变化的直线延长到绝对零度，也正好交在约 1.2 V。零温漂时的输出接近这个值，所以这种电路叫**带隙基准（bandgap reference）**。电路上常用一个运放让两个晶体管支路的电压相等，$\Delta V_{BE}$ 落在一个电阻上，再由电阻比完成乘 $K$。
      - card:
          title: 例题：放大倍数和输出
          body: $V_{BE} = 0.65$ V、温度系数 −1.9 mV/K，面积比 24:1，$k/q = 0.0862$ mV/K，300 K。求 $K$ 和 $V_{REF}$。
          reveal:
            - title: 第 1 步：求 PTAT 电压的温度系数
              body: $0.0862\times\ln24 = 0.274$ mV/K。
            - title: 第 2 步：让两个温度系数抵消
              body: $K = 1.9/0.274 \approx 6.93$。
            - title: 第 3 步：算出 300 K 时的输出
              body: 300 K 时 $\Delta V_{BE} = 0.0862\ \text{mV/K}\times300\ \text{K}\times\ln24 = 82.2$ mV，$V_{REF} = 0.65 + 6.93\times0.0822 = 1.22$ V。
      - item:
          id: bandgap-k
          type: number
          prompt: $V_{BE}$ 的温度系数 −1.5 mV/K，两个晶体管面积比 24:1 产生的 $\Delta V_{BE}$ 温度系数 0.274 mV/K。要零温漂，$\Delta V_{BE}$ 要放大多少倍？保留两位小数。
          answer: 5.47
          tolerance: 0.01
          hint: 两个温度系数怎样抵消？
          explain: $K = 1.5/0.274 = 5.47$。放大后正温度系数 $5.47\times0.274 = 1.5$ mV/K，正好抵消。
      - item:
          id: bandgap-why-12
          type: choice
          prompt: 带隙基准的输出为什么都在 1.2 V 左右，而不是随便哪个值？
          options:
            - text: 两种温度系数抵消时，输出自然落在硅禁带宽度对应的电压附近
              correct: true
            - text: 设计者习惯用 1.2 V
              why: 输出值不是随意选的：要零温漂，$K$ 就被定死了，输出也就跟着定了
            - text: 因为电源电压是 1.2 V
              why: 带隙基准的输出和电源电压无关，正是它的用处；电源是 1.8 V、3.3 V 时输出照样约 1.2 V
          explain: 把 $V_{BE}$ 随温度的变化按直线外推到绝对零度，交在约 1.2 V，这个值由硅的禁带宽度决定；零温漂时 $V_{BE} + K\Delta V_{BE}$ 正好接近这个外推值，和电源电压无关。电源只有 1 V 左右、放不下 1.2 V 时，要用把电流相加的变形电路。
  - id: switched-cap
    chapter: 开关电容与数据转换器概述
    title: 采样和开关电容电路
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 芯片上的电阻误差有 10% 到 20%，可两个电容的比值能做到 0.1% 以内。如果滤波器的特性能只由电容的比值决定，会有什么好处？
          options:
            - text: 特性准得多，而且不随工艺和温度明显变化
              correct: true
            - text: 没有区别，电阻电容都一样
              why: 绝对值和比值的精度差得很远：同一芯片上靠在一起画的两个电容，偏差几乎一样，比值很准
            - text: 电容更省电，所以更好
              why: 好处主要在精度：比值准，由比值决定的增益和频率就准
          explain: 用开关和电容模拟电阻，电路的增益、截止频率就变成电容之比和时钟频率决定，两者都能做得很准，这就是开关电容电路的出发点。
      - card:
          title: MOS 开关和采样保持
          body: |
            一个 MOS 管加一个电容就是最简单的**采样保持（sample-and-hold）**电路：时钟为高时开关导通，电容跟着输入；时钟变低时开关断开，电容把那一刻的电压保持住。开关的导通电阻和电容组成 RC，跟踪要足够快；断开的瞬间，沟道里的电荷有一部分注入电容，叫**电荷注入（charge injection）**；时钟边沿也经栅漏电容耦合过来，叫**时钟馈通（clock feedthrough）**。两者都会造成误差，另外还有 kT/C 噪声。
      - item:
          id: sample-error
          type: choice
          prompt: MOS 采样开关断开的瞬间，电容上的电压会出现一个小跳变。主要原因是什么？
          options:
            - text: 沟道里原来的电荷有一部分跑到了电容上
              correct: true
            - text: 电容在开关断开后马上放电
              why: 断开后电容没有放电通路，电压能保持；跳变发生在断开那一瞬间，来自沟道电荷和时钟耦合
            - text: 输入信号在那一刻突然变大
              why: 即使输入不变也会出现这个跳变；它来自开关自身的电荷注入和时钟馈通
          explain: 导通时沟道里存着电荷，关断时它们要离开，一部分流进采样电容，造成误差。差分结构等技巧可以大大减小它。
      - card:
          title: 开关电容等效电阻
          body: |
            用时钟控制的开关搬运电容电荷的电路叫**开关电容（switched-capacitor）**电路。一个电容 $C$ 被两个不重叠时钟（轮流为高，中间留一小段都为低，两个开关不会同时导通）控制的开关轮流接到两个节点，每个时钟周期搬过去的电荷是 $C\Delta V$，平均电流 $I = Cf\Delta V$。这和一个电阻

            $$R_{eq} = \frac{1}{Cf}$$

            的效果一样（在远低于时钟频率的频段）。时钟频率越高、电容越大，等效电阻越小。
      - card:
          title: 例题：开关电容等效电阻
          body: 0.5 pF 的电容以 10 MHz 的时钟切换。等效电阻是多少？如果换成 2 pF，时钟不变呢？
          reveal:
            - title: 第 1 步：代入等效电阻公式
              body: $R_{eq} = 1/(0.5\times10^{-12}\times10^7) = 200$ kΩ。
            - title: 第 2 步：看电容变大以后的电阻
              body: $1/(2\times10^{-12}\times10^7) = 50$ kΩ，电容大 4 倍，电阻小 4 倍。
            - title: 第 3 步：比较芯片面积
              body: 在芯片上做一个 200 kΩ 的电阻要很大的面积，开关电容只用一个 0.5 pF 的电容。
      - item:
          id: sc-req
          type: number
          prompt: 一个 2 pF 的电容以 1 MHz 的时钟切换，等效成多少千欧的电阻？
          answer: 500
          tolerance: 0.001
          unit: kΩ
          hint: 每个时钟周期搬过去多少电荷？一秒钟呢？
          explain: $1/(2\times10^{-12}\times10^6) = 5\times10^5\ \Omega = 500$ kΩ。
      - card:
          title: 开关电容放大器和积分器
          body: |
            开关电容放大器在运放周围放两个电容：采样阶段输入电容 $C_1$ 充到输入电压，放大阶段把电荷倒给反馈电容 $C_2$，增益是 $C_1/C_2$。开关电容积分器把电阻换成开关电容，单位增益频率由 $(C_1/C_2)\cdot f_{clk}/(2\pi)$ 决定，只取决于电容比和时钟，做成的滤波器特性很准。
      - item:
          id: sc-gain
          type: number
          prompt: 开关电容放大器的采样电容 4 pF、反馈电容 1 pF。增益是多少？
          answer: 4
          tolerance: 0.001
          hint: 电荷从哪个电容倒到哪个电容？
          explain: 采样电容上的电荷 $4\ \text{pF}\times V_{in}$ 全部倒给 1 pF 的反馈电容，输出 $4V_{in}$。增益只由电容比决定。
  - id: dac-adc
    chapter: 开关电容与数据转换器概述
    title: 数模和模数转换器
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 要把一个 0 到 1 V 的电压变成 8 位数字。一种办法是一次性拿它和 255 个不同的参考电压同时比较；另一种是像猜数游戏那样，每次比一下、把范围砍一半。后一种要比几次？
          options:
            - text: 8 次
              correct: true
            - text: 255 次
              why: 255 是一次性比较需要的比较器个数；每次砍一半，8 次就能把 256 个区间缩到一个
            - text: 128 次
              why: 128 是砍一次之后剩下的区间数；每比一次区间减半，$2^8 = 256$，所以只要 8 次
          explain: 每比较一次确定一位，从最高位到最低位，8 位就是 8 次。逐位比较的做法很省电，一次性比较的做法最快但比较器多，各有用处。
      - card:
          title: 量化和最小分辨单位
          body: |
            $N$ 位转换器把满量程分成 $2^N$ 份，一份叫 **LSB（least significant bit）**，即最低有效位对应的电压。量化误差在 $\pm\tfrac12$ LSB 之间均匀分布时，它的有效值是 $\text{LSB}/\sqrt{12}$，叫**量化噪声（quantization noise）**。理想 $N$ 位转换器对满量程正弦波的信噪比是 $6.02N + 1.76$ dB：每多一位，多约 6 dB。
      - item:
          id: adc-lsb
          type: number
          prompt: 一个 10 位模数转换器的满量程是 1 V。1 LSB 是多少毫伏？保留三位小数。
          answer: 0.977
          tolerance: 0.0005
          unit: mV
          hint: 满量程分成多少份？
          explain: $1\ \text{V}/2^{10} = 1/1024$ V $= 0.977$ mV。量化噪声有效值是它除以 $\sqrt{12}$，约 282 μV。
      - item:
          id: adc-snr
          type: number
          prompt: 一个理想的 12 位模数转换器，输入满量程正弦波。按 $6.02N + 1.76$，信噪比是多少分贝？保留一位小数。
          answer: 74.0
          tolerance: 0.05
          unit: dB
          hint: $N$ 是多少？
          explain: $6.02\times12 + 1.76 = 74.0$ dB。实际转换器因为噪声和非线性，有效位数常比标称位数少一两位。
      - card:
          title: 数模转换器
          body: |
            电阻串式：$2^N$ 个相同的电阻串在参考电压和地之间，用开关选出对应的抽头，单调性好，但位数多时电阻太多。电流舵式：一组按 1、2、4、8……加权（或全部相同）的电流源，按数字码开关后在输出相加，速度快。电容阵列式：一组按 1、2、4、8……加权的电容，切换底板电压改变输出，常用在 SAR 模数转换器里。这样加权的结构最高位和最低位相差 $2^{N-1}$ 倍，匹配要求高。
      - item:
          id: dac-string
          type: number
          prompt: 一个 6 位电阻串式数模转换器，需要多少个相同的电阻？
          answer: 64
          tolerance: 0.001
          hint: 输出有多少种不同的电压？
          explain: $2^6 = 64$ 个电阻，产生 64 个抽头电压。10 位要 1024 个，所以高位数时改用别的结构或分段。
      - card:
          title: 模数转换器的几种结构
          body: |
            **Flash 型（flash ADC）**：$2^N - 1$ 个比较器同时比较，一个时钟出结果，最快，但比较器个数随位数按指数增长，一般只做到 6–8 位。**SAR 型（successive approximation）**：逐次逼近，一个比较器加一个数模转换器，$N$ 个时钟逐位确定，省电、面积小，速度中等。**流水线型（pipeline）**：把转换分成几级，每级粗量化几位，把余差放大后交给下一级，兼顾速度和精度。另外还有过采样（采样率远高于信号带宽）的 Σ-Δ 型，用高速的低位数转换和数字滤波换取高精度。
      - item:
          id: flash-comps
          type: number
          prompt: 一个 7 位 Flash 模数转换器需要多少个比较器？
          answer: 127
          tolerance: 0.001
          hint: 7 位把满量程分成多少个区间？区间之间有几条分界？
          explain: $2^7 - 1 = 127$ 个比较器，每个负责一个分界电压。同样 7 位的 SAR 只要一个比较器、7 个时钟。
      - item:
          id: adc-choice
          type: choice
          prompt: 一个靠电池工作的传感器节点，每秒只要采样几千次，精度要 12 位。哪种模数转换器最合适？
          options:
            - text: SAR
              correct: true
            - text: Flash，因为它最快
              why: 12 位 Flash 要 4095 个比较器，功耗和面积都很大；每秒几千次用不着那么快
            - text: 流水线型，因为它兼顾速度和精度
              why: 流水线型要好几级放大器，功耗比 SAR 大；每秒几千次用不着它的速度
          explain: SAR 只用一个比较器，功耗低、面积小，12 位、每秒几千到几百万次正是它擅长的范围。
boss:
  items:
    - id: b-ro
      type: number
      prompt: NMOS 用平方律模型：$k_n' = \mu_nC_{ox} = 200\ \mu\text{A/V}^2$，$\lambda = 0.1\ \text{V}^{-1}$，$W/L = 10$，工作在饱和区，过驱动电压 0.2 V。它的输出电阻 $r_o$ 是多少千欧？
      answer: 250
      tolerance: 0.001
      unit: kΩ
      hint: $r_o$ 要用到漏极电流，漏极电流先怎么求？
      explain: $I_D = \tfrac12\times200\times10\times0.2^2 = 40\ \mu$A，$r_o = 1/(\lambda I_D) = 1/(0.1\times40\ \mu\text{A}) = 250$ kΩ。它的跨导 $g_m = 2I_D/V_{ov} = 0.4$ mS，本征增益 $g_mr_o = 100$。
    - id: b-intrinsic-shrink
      type: choice
      prompt: 先进工艺里，单个管子的本征增益 $g_mr_o$ 常常只有十几到几十，比老工艺小得多。按平方律，主要原因是什么？
      options:
        - text: 电源电压降低了，留给每个管子的电压变小
          why: $g_mr_o = 2/(\lambda V_{ov})$ 里没有电源电压；电源低带来的是摆幅问题
        - text: 沟道变短，$\lambda$ 变大
          correct: true
        - text: 偏置电流变小了，跨导跟着变小
          why: 代入 $g_m = 2I_D/V_{ov}$ 和 $r_o = 1/(\lambda I_D)$ 后电流消掉了，本征增益和电流无关
      explain: 本征增益 $g_mr_o = 2/(\lambda V_{ov})$。$\lambda$ 大约和沟道长度成反比，沟道越短 $\lambda$ 越大，增益越小，所以要靠共源共栅和多级放大把增益做上去。
    - id: b-cs-gain
      type: number
      prompt: 共源级的放大管是 NMOS：$k_n' = \mu_nC_{ox} = 200\ \mu\text{A/V}^2$，$\lambda = 0.1\ \text{V}^{-1}$，$W/L = 10$，过驱动电压 0.2 V，饱和区。负载是一个输出电阻和放大管相同的 PMOS 电流源。小信号电压增益是多少（带符号）？
      answer: -50
      tolerance: 0.001
      hint: 放大管的 $g_m$ 和 $r_o$ 各是多少？输出节点看到哪两个电阻并联？
      explain: $I_D = 40\ \mu$A，$g_m = 0.4$ mS，$r_o = 250$ kΩ；两个 250 kΩ 并联是 125 kΩ，$A_v = -0.4\ \text{mS}\times125\ \text{k}\Omega = -50$，正好是本征增益的一半。
    - id: b-ota-gain
      type: number
      prompt: 五管 OTA（电流镜负载的差分对，差分输入、单端输出）。每个输入 NMOS：$k_n' = \mu_nC_{ox} = 200\ \mu\text{A/V}^2$，$W/L = 10$，过驱动电压 0.2 V，$\lambda = 0.1\ \text{V}^{-1}$；PMOS 负载管的输出电阻和输入管相同。增益是多少（取绝对值）？
      answer: 50
      tolerance: 0.001
      hint: 每个输入管流多少电流？输出节点看到哪两个输出电阻并联？
      explain: 每个输入管 $I_D = 40\ \mu$A，$g_{m1} = 0.4$ mS；输出端 $r_{o2} = r_{o4} = 250$ kΩ，并联 125 kΩ；$A_v = g_{m1}(r_{o2}\parallel r_{o4}) = 50$。电流镜把两边的信号电流加在输出端，单端输出也拿到了全部 $g_m\Delta V_{in}$。
    - id: b-mirror
      type: number
      prompt: NMOS 电流镜的参考管 $W/L = 10$，输出管 $W/L = 40$，参考电流 20 μA，两管都在饱和区、$V_{DS}$ 相同。输出电流是多少微安？
      answer: 80
      tolerance: 0.001
      unit: μA
      hint: 两管 $V_{GS}$ 相同、$V_{DS}$ 也相同时，电流之比等于什么之比？
      explain: $I_{OUT} = 20\times40/10 = 80\ \mu$A。$V_{DS}$ 相同时沟道长度调制的因子也相同，比例只由尺寸决定。
    - id: b-mirror-error
      type: choice
      prompt: 一个 NMOS 电流镜的参考管接成二极管，输出管的 $V_{DS}$ 比参考管高 0.8 V，两管都在饱和区。输出电流为什么和按尺寸比算出的值有偏差？共源共栅电流镜怎样改善？
      options:
        - text: 两管阈值电压的随机偏差不同；共源共栅镜多串一个管子，把阈值偏差平均掉
          why: 阈值偏差是另一种失配，和两管 $V_{DS}$ 差多少无关，串共栅管也不会平均掉它；题里的偏差来自 $V_{DS}$ 不同
        - text: 输出管 $V_{DS}$ 高，进入了三极管区；共源共栅镜把它推回饱和区
          why: 题里两管都在饱和区；共源共栅镜反而要多占一些输出电压，它改善的是饱和区里由 $V_{DS}$ 带来的差别
        - text: 沟道长度调制；共源共栅镜钉住输出管的 $V_{DS}$
          correct: true
        - text: 参考电流随电源波动；共源共栅镜把参考电流稳住
          why: 参考电流的波动会按比例复制过去，但那和两管 $V_{DS}$ 不同无关；共源共栅镜管的是输出管的漏极电压
      explain: 饱和区电流里有 $(1 + \lambda V_{DS})$ 这一项，两管 $V_{DS}$ 不同，比例就偏了。共源共栅镜让输出管的漏极电压被上面的共栅管钉住，和参考管一样，输出电阻也从 $r_o$ 提高到约 $g_mr_o^2$。
    - id: b-dominant-pole
      type: number
      prompt: 电流源负载共源级的跨导 0.4 mS，输出节点电阻 125 kΩ，输出端接 1 pF 负载电容，主极点在输出节点。主极点频率是多少兆赫？保留两位小数。
      answer: 1.27
      tolerance: 0.005
      unit: MHz
      hint: 主极点由输出节点的哪两个量决定？
      explain: $f_p = 1/(2\pi\times125\ \text{k}\Omega\times1\ \text{pF}) = 1.27$ MHz。
    - id: b-gbw
      type: number
      prompt: 电流源负载共源级的跨导 0.4 mS，输出电阻 125 kΩ，输出端接 1 pF 负载电容，主极点在输出节点。增益带宽积是多少兆赫？保留一位小数。
      answer: 63.7
      tolerance: 0.05
      unit: MHz
      hint: 增益带宽积和输出电阻有关吗？
      explain: $\text{GBW} = g_m/(2\pi C_L) = 0.4\times10^{-3}/(2\pi\times10^{-12}) = 63.7$ MHz。也可以用低频增益 50 乘主极点 1.27 MHz，得到同样的值。
    - id: b-pm
      type: number
      prompt: 一个两极点的负反馈环路，主极点远低于单位增益频率，非主极点在单位增益频率的 2.5 倍处。相位裕度约是多少度？保留到个位。
      answer: 68
      tolerance: 0.5
      unit: °
      hint: 在单位增益频率处，主极点贡献多少相移？非主极点呢？
      explain: 主极点在远高于它的频率上贡献约 −90°，非主极点贡献 $-\arctan(1/2.5) = -21.8°$，相位裕度约 $180° - 90° - 21.8° \approx 68°$，满足常用的 60° 目标。
    - id: b-fb-desens
      type: number
      prompt: 反馈系数 $\beta = 0.02$ 的放大器，开环增益从 2000 降到 1600（降了 20%）。闭环增益降了百分之几？保留两位小数。
      answer: 0.61
      tolerance: 0.005
      unit: '%'
      hint: 变化前后的闭环增益各是多少？
      explain: $2000/(1 + 40) = 48.78$，$1600/(1 + 32) = 48.48$，降了 0.61%，也就是 $20\%/(1 + 1600\times0.02) = 20\%/33$。环路增益越大，闭环增益越不受开环增益变化的影响。
    - id: b-thermal
      type: number
      prompt: 室温 $kT = 4.14\times10^{-21}$ J，一个 10 kΩ 电阻的热噪声电压谱密度是多少 nV/√Hz？保留一位小数。
      answer: 12.9
      tolerance: 0.05
      unit: nV/√Hz
      hint: 电阻热噪声的谱密度（V²/Hz）是多少？要变成 nV/√Hz 还要做什么？
      explain: $4\times4.14\times10^{-21}\times10^4 = 1.656\times10^{-16}\ \text{V}^2/\text{Hz}$，开方 $12.9$ nV/√Hz。1 kΩ 是 4.07 nV/√Hz，电阻大 10 倍，噪声电压大 $\sqrt{10}$ 倍。
    - id: b-mos-noise
      type: number
      prompt: 一个 MOS 管 $g_m = 0.4$ mS，$\gamma = 2/3$，室温 $kT = 4.14\times10^{-21}$ J。折算到栅极的热噪声电压谱密度是多少 nV/√Hz？保留一位小数。
      answer: 5.3
      tolerance: 0.05
      unit: nV/√Hz
      hint: 漏极的噪声电流 $4kT\gamma g_m$ 折算到栅极要除以什么？
      explain: $4kT\gamma/g_m = 4\times4.14\times10^{-21}\times(2/3)/(0.4\times10^{-3}) = 2.76\times10^{-17}\ \text{V}^2/\text{Hz}$，开方约 5.3 nV/√Hz。跨导越大，等效输入噪声越小。
    - id: b-ktc
      type: number
      prompt: 室温 $kT = 4.14\times10^{-21}$ J，1 pF 的采样电容上，kT/C 噪声电压的有效值是多少微伏？保留到个位。
      answer: 64
      tolerance: 0.5
      unit: μV
      hint: $kT/C$ 给的是电压的方均值还是有效值？
      explain: $4.14\times10^{-21}/10^{-12} = 4.14\times10^{-9}\ \text{V}^2$，开方 64 μV。和开关的导通电阻无关。
    - id: b-miller-gbw
      type: number
      prompt: 两级运放用密勒补偿，第一级跨导 0.4 mS，补偿电容 2 pF。增益带宽积约是多少兆赫？保留一位小数。
      answer: 31.8
      tolerance: 0.05
      unit: MHz
      hint: 密勒补偿后，增益带宽积由哪两个量决定？
      explain: $\text{GBW} \approx g_{m1}/(2\pi C_c) = 0.4\times10^{-3}/(2\pi\times2\times10^{-12}) = 31.8$ MHz，和第二级、负载电容都无关。
    - id: b-gm2
      type: number
      prompt: 两级运放用密勒补偿：第一级跨导 0.4 mS，补偿电容 2 pF，负载电容 5 pF，右半平面零点已用调零电阻消掉。按经验把非主极点 $g_{m2}/(2\pi C_L)$ 放在增益带宽积的 2.2 倍处，第二级跨导至少多少毫西？
      answer: 2.2
      tolerance: 0.001
      unit: mS
      hint: 非主极点和增益带宽积分别由哪几个量决定？写成不等式后哪些因子能约掉？
      explain: $g_{m2} \ge 2.2\,g_{m1}C_L/C_c = 2.2\times0.4\times5/2 = 2.2$ mS。这时只算两个极点，相位裕度约 $90° - \arctan(1/2.2) \approx 66°$；零点没消掉时还要再减几度，所以经验上说“约 60°”。
    - id: b-bandgap-k
      type: number
      prompt: 带隙基准里 $V_{BE}$ 的温度系数约 −2 mV/K。两只电流相同、发射极面积比 8:1 的晶体管产生 $\Delta V_{BE}$，它的温度系数是 $(k/q)\ln8$，$k/q = 0.0862$ mV/K。要零温漂，$\Delta V_{BE}$ 要放大多少倍？保留一位小数。
      answer: 11.2
      tolerance: 0.05
      hint: 先算 $\Delta V_{BE}$ 的温度系数，再看要放大几倍才能抵消 2 mV/K。
      explain: $(k/q)\ln8 = 0.0862\times2.079 = 0.179$ mV/K，$K = 2/0.179 = 11.2$。
    - id: b-bandgap-out
      type: choice
      prompt: 一个零温漂的带隙基准，电源是 3.3 V。它的输出电压大约是多少？
      options:
        - text: 约 0.65 V，就是一只晶体管的 $V_{BE}$
          why: 那只是随温度下降的 CTAT 部分；还要加上放大后的 PTAT 电压，室温下约 0.6 V
        - text: 约 1.2 V
          correct: true
        - text: 约 3.3 V，和电源一样
          why: 带隙基准的用处正是输出不随电源变；电源是 1.8 V、3.3 V 时输出都约 1.2 V
        - text: 约 0.6 V，就是放大后的 $\Delta V_{BE}$
          why: 那只是随温度上升的 PTAT 部分；输出是它和 $V_{BE}$ 之和
      explain: $V_{REF} = V_{BE} + K\Delta V_{BE}$，两项的温度系数抵消时，输出接近 $V_{BE}$ 随温度的直线延长到绝对零度的交点，约 1.2 V；这个值由硅的禁带宽度决定，和电源电压无关。
    - id: b-sc-req
      type: number
      prompt: 一个 1 pF 的电容以 1 MHz 的时钟在两个节点之间来回切换。它等效成多少兆欧的电阻？
      answer: 1
      tolerance: 0.001
      unit: MΩ
      hint: 每个周期搬多少电荷？平均电流和电压差是什么关系？
      explain: $R_{eq} = 1/(Cf) = 1/(10^{-12}\times10^6) = 10^6\ \Omega = 1$ MΩ。芯片上做一个 1 MΩ 的电阻要很大的面积，开关电容只要 1 pF。
    - id: b-adc-compare
      type: choice
      prompt: 10 位 SAR 模数转换器和 10 位 Flash 模数转换器，各需要怎样的比较？
      options:
        - text: SAR 用 1023 个比较器一次比完；Flash 用一个比较器比 10 次
          why: 两者说反了：一次比完、要 $2^{10} - 1$ 个比较器的是 Flash；逐位比较的是 SAR
        - text: 两者都要 1024 个比较器
          why: 1024 是区间数，区间之间的分界只有 1023 条；SAR 也不需要那么多比较器，它逐位确定
        - text: SAR 用一个比较器比 10 次；Flash 每多一位只多一个比较器，共 10 个
          why: Flash 的比较器个数随位数按 2 的幂增长：每多一位，分界电压的条数翻一倍，10 位要 1023 个
        - text: SAR 用一个比较器比 10 次；Flash 用 1023 个比较器一次比完
          correct: true
      explain: SAR 每比一次确定一位，10 位要 10 次；Flash 有 $2^{10} - 1 = 1023$ 条分界电压，每条一个比较器，一个时钟出结果。
