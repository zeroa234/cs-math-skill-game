skill: E.1.5
version: 2
authors: [gemini]
brief:
  why: 手机、Wi-Fi 路由器和卫星终端把微弱的电磁波变成清晰的比特流，背后全靠几平方毫米的射频集成电路芯片。这一站从射频收发机架构、噪声系数和灵敏度讲起，逐一拆解低噪声放大器、混频器、LC 压控振荡器与相位噪声、锁相环频率综合器、射频功率放大器、阻抗匹配与片上无源器件，最后把线性度与噪声统一到整机动态范围预算里。
  outcomes:
    - 比较超外差、零中频与低中频收发机架构的取舍，并计算镜像频率、级联噪声系数与接收机灵敏度
    - 设计电感源极退化共源共栅 LNA 的匹配电感，理解增益切换与高 IIP2 差分拓扑
    - 区分无源开关混频器与单/双平衡有源吉尔伯特混频器的增益、噪声、端口隔离与电压裕度权衡
    - 算出 LC 振荡器谐振频率、起振负阻与调谐范围，用利森公式分析相位噪声与倒易混频
    - 分析 II 型电荷泵锁相环阻尼比、噪声传递与环路带宽，解释整数 N 与小数 N 频率综合器的权衡
    - 计算低压射频功放最大输出功率、最佳负载电阻与各工作类效率，理解数字预失真与 Doherty 架构
    - 设计 L 形无源匹配网络、解读二端口散射矩阵（S 矩阵），说明片上螺旋电感 Q 值受限的损耗机理
    - 通过双音测试计算 OIP3、IIP3、1 dB 压缩点、级联 IIP3 与无杂散动态范围（SFDR）
terms:
  - term: dBm
    def: 以 1 mW 为基准的对数功率单位，定义为 $10\lg(P / 1\text{ mW})$，每增加 10 dB 功率放大 10 倍。
  - term: 噪声系数
    def: 衡量电路恶化信噪比程度的指标：噪声因子 $F = \text{SNR}_{\text{in}}/\text{SNR}_{\text{out}}$，取 $10\lg F$ 即得。
  - term: 弗里斯公式
    def: 计算多级级联系统总噪声因子的公式：$F_{\text{tot}} = F_1 + (F_2 - 1)/G_1 + (F_3 - 1)/(G_1 G_2) + \cdots$。
  - term: 接收机灵敏度
    def: 接收机输出端达到规定信噪比或误码率所需的最小输入信号功率，通常用 dBm 表示。
  - term: 动态范围
    def: 接收机能够正常解调的最强信号与最弱可用信号之间的功率跨度，受上限非线性与下限噪声共同制约。
  - term: 载波
    def: 用于承载低频信息的射频高频正弦波，通过调制其幅度、频率或相位把信息经天线辐射出去。
  - term: 本振
    def: 收发机内部产生的可调高频纯正弦参考信号，用于在混频器中把信号搬移到目标频率。
  - term: 混频器
    def: 利用本振与输入信号相乘或周期开关，将信号频谱搬移到和频或差频的射频变频电路。
  - term: 中频
    def: 超外差或低中频接收机中，射频信号与本振混频后落入的中间频率，便于集中滤波与放大。
  - term: 镜像频率
    def: 与有用射频信号关于本振频率对称的干扰频点，下变频后会落入同一中频而无法再用中频滤波器分离。
  - term: 超外差接收机
    def: 先通过混频把射频搬移到固定中频进行高选择性滤波与放大、再解调到基带的经典接收架构。
  - term: 零中频接收机
    def: 本振频率等于射频载波频率、一次直接将射频信号下变频到零频基带的收发架构，又称直接变频接收机。
  - term: 直流失调
    def: 零中频接收机基带中叠加在有用信号上的直流电压偏差，主要源于本振泄漏自混频与器件失配。
  - term: 低中频接收机
    def: 将射频信号搬移到几百千赫至几兆赫较低中频的架构，既避开直流失调与闪烁噪声，又便于片上集成。
  - term: 本振牵引
    def: 发射机强功率放大器输出耦合回同频压控振荡器，拉偏本振频率并污染发射频谱的现象。
  - term: 低噪声放大器
    def: 位于接收链路最前端的高增益、低噪声放大电路，用于抑制后级噪声并完成天线端口阻抗匹配。
  - term: 电感源极退化
    def: 在共源管源极串联电感，借助栅源电容与晶体管特征频率在输入端产生无热噪声实部电阻 $\omega_T L_s$ 的匹配技术。
  - term: 二阶交调
    def: 两个强干扰信号经电路偶次非线性项产生差频分量 $f_2 - f_1$ 的现象，在零中频接收机中会直接落入基带。
  - term: 变频增益
    def: 混频器输出端目标中频（或基带）信号幅值或功率与输入端射频信号之比，无源混频器中常表现为变频损耗。
  - term: 无源混频器
    def: 利用工作在三极管区的 MOS 管作为受本振控制的周期开关实现变频的电路，无直流偏置电流、线性度高且闪烁噪声极低。
  - term: 双平衡混频器
    def: 射频输入与本振输入均采用差分对称结构的混频电路（如射频吉尔伯特单元），可同时抑制射频与本振向中频的直通馈通。
  - term: 负阻
    def: 端口电压增大时流入电流反而减小的等效阻抗特性，用于向 LC 谐振腔持续注入能量以抵消并联损耗维持振荡。
  - term: 压控振荡器
    def: 输出振荡频率随直流控制电压连续可调的高频振荡电路，是收发机本振与锁相环的核心单元。
  - term: 变容管
    def: 电容值随反向偏置或栅极控制电压连续变化的半导体器件，用于电调谐 LC 压控振荡器的振荡频率。
  - term: 相位噪声
    def: 振荡器输出载波相位随机抖动在频域形成的边带裙边，以偏离载波一定频偏处 1 Hz 带宽内噪声与载波功率比（dBc/Hz）度量。
  - term: 倒易混频
    def: 接收机本振的相位噪声裙边与强邻道干扰信号混频，把邻道能量搬移进有用信道并抬高噪声底的现象。
  - term: 利森公式
    def: 描述 LC 振荡器相位噪声随谐振腔品质因数 $Q$、载波功率、器件噪声因子及频偏 $\Delta\omega$ 变化的经验模型。
  - term: 锁相环
    def: 通过鉴相、滤波与压控振荡器构成的负反馈闭环，使输出信号与参考时钟保持恒定相位关系与精确频率倍比。
  - term: 电荷泵
    def: 受鉴频鉴相器上下脉冲控制、向环路滤波器注入或抽取恒定电流脉冲以调节控制电压的电路。
  - term: 频率综合器
    def: 在锁相环反馈支路接入可编程分频器，从单个高稳定参考晶振合成出一系列精确离散射频信道的系统。
  - term: 功率附加效率
    def: 射频功放净增加的输出射频功率与直流供电功率之比，即 $(P_{\text{out}} - P_{\text{in}})/P_{\text{DC}}$。
  - term: 导通角
    def: 在一个射频信号周期（$360^\circ$）内，功率放大器晶体管处于导通状态所占的相位角度。
  - term: 品质因数
    def: 储能元件或谐振网络单周期储存能量与耗散能量之比的 $2\pi$ 倍，串联电感满足 $Q = \omega L / R_s$。
  - term: 反射系数
    def: 传输线终端反射波电压与入射波电压之比 $\Gamma = (Z_L - Z_0)/(Z_L + Z_0)$，反映阻抗失配程度。
  - term: 散射矩阵
    def: 在高频端口端接特征阻抗时，以归一化入射波与反射波之比定义的二端口 S 矩阵（$S_{11}, S_{21}, S_{12}, S_{22}$）。
  - term: 趋肤效应
    def: 高频交流电流集中分布在导体表面薄层内流动、导致有效截面积缩小和交流串联电阻随频率升高的现象。
  - term: 1 dB 压缩点
    def: 非线性放大器的实际增益比小信号线性增益下降 1 dB 时对应的输入或输出信号功率，衡量线性放大上限。
  - term: 三阶交调
    def: 双音信号经过三次非线性项产生的 $2f_1 - f_2$ 与 $2f_2 - f_1$ 干扰分量，紧贴有用信号两侧难以滤除。
  - term: 三阶截点
    def: 双音测试中基波输出线与三阶交调输出线按斜率 1 和 3 外推相交时的理论虚拟点，对应输入功率称 IIP3、输出功率称 OIP3。
  - term: 无杂散动态范围
    def: 从输入端噪声基底到三阶交调分量刚好抬头等于噪声底时的可用信号动态跨度，等于 $\frac{2}{3}(\text{IIP3} - P_{\text{noise,in}})$。

lessons:
  - id: rf-foundations
    chapter: 射频收发机架构
    title: 射频设计权衡、噪声系数与灵敏度
    minutes: 13
    flow:
      - guess:
          id: g-rf-first-stage
          type: choice
          prompt: 无线接收机要从天线收到的微弱电磁波里恢复数据，信号往往要依次经过三四级放大和变频电路。你猜哪一级的自身噪声对整机接收能力影响最大？
          options:
            - text: 最后一级，因为最后一级离数字解调电路最近
              why: 信号到达最后一级时已经被前面放大了很多倍，后级自身噪声相对微弱得多。
            - text: 最前面第一级，因为它的噪声会被后面每一级一起放大
              correct: true
            - text: 各级地位相同，总噪声只取决于所有级噪声的简单算术平均
              why: 前级增益会把后级噪声折算到输入端时大幅压缩，所以第一级起决定性作用。
          explain: 第一级位于信号最微弱的位置，它的自身噪声会和信号一起被后续各级放大；只要第一级噪声低且增益足够，后级噪声折算到输入端就被大幅压低。
      - card:
          title: 射频电路权衡与 dBm 功率尺度
          body: |
            射频（RF）集成电路通常工作在几百 MHz 到几十 GHz，设计始终在噪声、线性度、增益、功耗、工作频率和阻抗匹配之间做折中，业内常把这种多目标牵制称为射频设计六边形。无线信号功率从发射端几瓦跨到接收端皮瓦级，相差十几个数量级，因此普遍用对数单位 **dBm**：
            $$P_{\text{dBm}} = 10\lg\left(\frac{P}{1\text{ mW}}\right)$$
            例如 $1\text{ mW} = 0\text{ dBm}$，$100\text{ mW} = +20\text{ dBm}$，$1\text{ pW} = -90\text{ dBm}$。射频端口按惯例统一采用 $50\ \Omega$ 基准阻抗，使级间功率传递与仪器测试标准一致。
      - card:
          title: 噪声系数、弗里斯公式与灵敏度
          body: |
            室温 $T_0 = 290\text{ K}$ 下，匹配源电阻送入负载的可用热噪声功率谱密度为 $kT_0 \approx -174\text{ dBm/Hz}$。电路内部噪声会进一步恶化信噪比，用**噪声系数（noise figure, NF）**刻画：$F = \text{SNR}_{\text{in}}/\text{SNR}_{\text{out}} \ge 1$，$\text{NF} = 10\lg F$。多级级联遵循**弗里斯公式（Friis formula）**：
            $$F_{\text{tot}} = F_1 + \frac{F_2 - 1}{G_1} + \frac{F_3 - 1}{G_1 G_2} + \cdots$$
            其中 $F_i$ 与可用功率增益 $G_i$ 均须代入线性倍数而非分贝。带宽 $B$ 内达到最小解调信噪比 $\text{SNR}_{\min}$ 所需的最小输入功率即**接收机灵敏度（sensitivity）**：
            $$P_{\text{sens}}(\text{dBm}) = -174 + 10\lg B + \text{NF} + \text{SNR}_{\min}$$
            接收机下限由灵敏度定，上限受强干扰引起失真制约，两者跨度即**动态范围（dynamic range）**。
      - item:
          id: q-friis-why
          type: choice
          prompt: 根据弗里斯公式，为什么接收机第一级放大器既要求低噪声系数，又要求足够高的功率增益？
          options:
            - text: 第一级噪声直接计入总噪声，其高增益把后级噪声除小
              correct: true
            - text: 第一级增益越高，就能把源电阻自带的 -174 dBm/Hz 热噪声消除
              why: 源电阻热噪声和有用信号处于同一输入端，会被放大器按相同倍数放大，无法消除。
            - text: 第一级增益越高，后级电路自身的功耗就会成反比自动降为零
              why: 前级增益影响的是后级噪声折算到输入端的权重，并不自动削减后级直流功耗。
            - text: 弗里斯公式只包含第一级的噪声系数，后面各级不会对总噪声产生任何贡献
              why: 后面各级的噪声项 $(F_i - 1)/(G_1\cdots G_{i-1})$ 依然存在，只是被前级总增益压低。
          hint: 观察公式中第二级项 $(F_2 - 1)/G_1$，哪两个指标直接决定了它对总噪声的贡献？
          explain: $F_1$ 不受任何衰减直接进入 $F_{\text{tot}}$，而第二级及之后各级的过剩噪声都要除以 $G_1$，因此第一级必须同时做到低噪声和高增益。
      - card:
          title: 例题：级联噪声系数与接收机灵敏度
          body: 某接收链路：第一级 NF = 2.0 dB、增益 16 dB；第二级 NF = 11 dB、增益 6 dB；第三级 NF = 14 dB。求总噪声系数；另设信号带宽 $B = 10\text{ MHz}$、整机 $\text{NF} = 5\text{ dB}$、解调要求 $\text{SNR}_{\min} = 12\text{ dB}$，求灵敏度。
          reveal:
            - title: 第 1 步：把分贝全部换算为线性倍数
              body: |
                $F_1 = 10^{0.2} \approx 1.585$，$G_1 = 10^{1.6} \approx 39.81$；$F_2 = 10^{1.1} \approx 12.59$，$G_2 = 10^{0.6} \approx 3.98$；$F_3 = 10^{1.4} \approx 25.12$。
            - title: 第 2 步：代入弗里斯公式再换回 dB
              body: |
                $$F_{\text{tot}} = 1.585 + \frac{12.59 - 1}{39.81} + \frac{25.12 - 1}{39.81 \times 3.98} \approx 1.585 + 0.291 + 0.152 = 2.028$$
                $\text{NF}_{\text{tot}} = 10\lg(2.028) \approx 3.07\text{ dB}$。
            - title: 第 3 步：代入灵敏度公式
              body: |
                $10\lg(10^7) = 70\text{ dB}\cdot\text{Hz}$，故 $P_{\text{sens}} = -174 + 70 + 5 + 12 = -87\text{ dBm}$。
      - item:
          id: q-friis-2stage
          type: number
          prompt: 某两级接收前端中，第一级噪声系数 2.0 dB、功率增益 13 dB，第二级噪声系数 12.0 dB。用弗里斯公式求两级总噪声系数（单位 dB，保留两位小数）。
          answer: 3.67
          tolerance: 0.05
          unit: dB
          hint: 先把 2 dB、13 dB、12 dB 各自转成线性倍数 $10^{x/10}$，代入 $F_1 + (F_2 - 1)/G_1$ 后再取 $10\lg$。
          explain: $F_1 = 10^{0.2} \approx 1.585$，$G_1 = 10^{1.3} \approx 19.95$，$F_2 = 10^{1.2} \approx 15.85$；$F_{\text{tot}} = 1.585 + 14.85 / 19.95 \approx 2.329$，$\text{NF}_{\text{tot}} = 10\lg(2.329) \approx 3.67\text{ dB}$。
      - item:
          id: q-sens-calc
          type: number
          prompt: 某接收机信道带宽 $B = 1\text{ MHz}$，整机噪声系数 $\text{NF} = 6\text{ dB}$，解调所需最小信噪比 $\text{SNR}_{\min} = 10\text{ dB}$。取室温热噪声基底 $-174\text{ dBm/Hz}$，求接收机灵敏度（单位 dBm）。
          answer: -98
          tolerance: 0.5
          unit: dBm
          hint: 1 MHz 换算成 $10\lg B$ 是多少 dBHz？把四项直接相加即可。
          explain: $10\lg(10^6) = 60\text{ dB}\cdot\text{Hz}$，因此 $P_{\text{sens}} = -174 + 60 + 6 + 10 = -98\text{ dBm}$。
      - item:
          id: q-dbm-mw
          type: match
          prompt: 将以下 dBm 数值与对应的线性功率配对。
          pairs:
            - ["0 dBm", "1 mW"]
            - ["+20 dBm", "100 mW"]
            - ["-10 dBm", "0.1 mW"]
            - ["+3 dBm", "约 2 mW"]
          hint: 记住 0 dBm = 1 mW，每差 10 dB 功率差 10 倍，每差 3 dB 功率约差 2 倍。
          explain: $10^{0/10}=1\text{ mW}$，$10^{20/10}=100\text{ mW}$，$10^{-10/10}=0.1\text{ mW}$，$10^{3/10}\approx 2\text{ mW}$。

  - id: rx-architectures
    chapter: 射频收发机架构
    title: 接收机架构：超外差、零中频与低中频
    minutes: 13
    flow:
      - guess:
          id: g-rx-direct
          type: choice
          prompt: 要在手机里从 2.4 GHz 拥挤的无线频谱中挑出一条宽仅 1 MHz 的信道并放大一百万倍，为什么不能直接在 2.4 GHz 处做极窄带滤波后再放大？
          options:
            - text: 2.4 GHz 窄带滤波需极高 Q，难调谐集成
              correct: true
            - text: 2.4 GHz 信号本身无法通过任何金属导线或晶体管放大
              why: 现代 CMOS 放大器在 2.4 GHz 甚至毫米波都能放大，难题在于高选择性选频与可调谐滤波。
            - text: 天线收到的 2.4 GHz 信号已经是直流信号，不需要高频电路
              why: 天线接收的是高频载波调制波，必须下变频后才变回低频基带。
          explain: 在 2.4 GHz 处挑出 1 MHz 信道要求滤波器的品质因数高达数千且须随信道调谐，片上根本做不到；把信号先搬到较低频率再滤波才是出路。
      - card:
          title: 本振、混频、镜像频率与超外差接收机
          body: |
            发射端把基带信息加载到高频**载波（carrier）**，接收端用**混频器（mixer）**将射频与可调**本振（LO）**相乘，把信道搬移至固定**中频（IF）** $f_{\text{IF}} = |f_{\text{RF}} - f_{\text{LO}}|$，即**超外差接收机**。但本振另一侧的**镜像频率** $f_{\text{IM}} = 2f_{\text{LO}} - f_{\text{RF}}$ 也会混入同一中频造成混叠。超外差选择性优异，但须配片外镜像与中频滤波器，分立元件多、集成度低。
      - card:
          title: 零中频与低中频接收机
          body: |
            令 $f_{\text{LO}} = f_{\text{RF}}$，经正交混频一次搬到零频基带即**零中频接收机**。它省掉片外镜像与中频滤波器、最易集成，但有三大痛点：本振泄漏经衬底或天线反射自混频，生出落入基带的**直流失调**；MOS 管 $1/f$ 闪烁噪声紧贴直流；I/Q 失配引起自镜像。**低中频接收机**则搬到几百 kHz–几 MHz 中频，躲开直流失调与闪烁噪声，再靠片上正交混频与多相滤波抑制邻道镜像。
      - item:
          id: q-zeroif-dc
          type: choice
          prompt: 零中频接收机中，造成严重时变直流失调的最主要物理原因是什么？
          options:
            - text: 天线在室外晒热后直接产生毫伏级热电偶直流电压
              why: 射频前端通常通过交流耦合电容隔离直流，真正麻烦的是混频器内部在基带新生成的直流。
            - text: 同频本振泄漏并自混频产生直流
              correct: true
            - text: 片外镜像抑制滤波器把直流供电电压串联进了信号通道
              why: 零中频接收机没有片外镜像滤波器，且直流失调主要来自同频本振自混频。
            - text: 基带模数转换器把高频载波直接采样成了恒定零电平
              why: ADC 位于混频器和基带放大之后，直流失调是在下变频混频阶段产生的。
          hint: 当一个频率等于 $f_{\text{LO}}$ 的泄漏波回到射频输入口，它再和频率为 $f_{\text{LO}}$ 的本振相乘会得到什么频率？
          explain: 零中频中 $f_{\text{LO}} = f_{\text{RF}}$，本振泄漏到射频端（甚至辐射出天线被移动物体反射回来）后再与本振相乘，$\cos^2(\omega_{\text{LO}}t)$ 含直流项，直接落在有用基带正中央。
      - card:
          title: 例题：超外差接收机的镜像频率计算
          body: 某超外差接收机接收射频信道 $f_{\text{RF}} = 900\text{ MHz}$，采用固定中频 $f_{\text{IF}} = 45\text{ MHz}$，且本振工作在高边注入（$f_{\text{LO}} > f_{\text{RF}}$）。求本振频率与镜像频率。
          reveal:
            - title: 第 1 步：求高边注入的本振频率
              body: |
                高边注入满足 $f_{\text{LO}} = f_{\text{RF}} + f_{\text{IF}} = 900 + 45 = 945\text{ MHz}$。
            - title: 第 2 步：求关于本振对称的镜像频率
              body: |
                镜像位于本振另一侧相距 $f_{\text{IF}}$ 处：
                $$f_{\text{IM}} = f_{\text{LO}} + f_{\text{IF}} = 945 + 45 = 990\text{ MHz}$$
                可见 $|990 - 945| = 45\text{ MHz} = f_{\text{IF}}$，必须由前端镜像滤波器提前衰减。
      - item:
          id: q-image-lowside
          type: number
          prompt: 某超外差接收机接收 $f_{\text{RF}} = 2400\text{ MHz}$ 信号，中频 $f_{\text{IF}} = 100\text{ MHz}$，本振采用低边注入（$f_{\text{LO}} < f_{\text{RF}}$）。求此时对应的镜像干扰频率是多少 MHz？
          answer: 2200
          tolerance: 1
          unit: MHz
          hint: 先算出低边注入的本振频率 $f_{\text{LO}} = f_{\text{RF}} - f_{\text{IF}}$，再往同方向减去一个 $f_{\text{IF}}$ 是多少？
          explain: 低边注入时 $f_{\text{LO}} = 2400 - 100 = 2300\text{ MHz}$，镜像在 $f_{\text{LO}}$ 另一侧相距 $100\text{ MHz}$ 处，即 $f_{\text{IM}} = 2300 - 100 = 2200\text{ MHz}$。
      - item:
          id: q-lowif-adv
          type: choice
          prompt: 相比零中频架构，低中频（Low-IF）接收机的主要优势是什么，又需要付出什么代价？
          options:
            - text: 避开直流与 1/f 噪声，需正交抑镜像
              correct: true
            - text: 全部消除了一切镜像频率问题，但必须使用体积庞大的片外中频滤波晶体
              why: 低中频把镜像移到了相邻信道，恰恰需要严格的片上正交镜像抑制而非片外大滤波器。
            - text: 不需要任何本地振荡器就能直接把射频变成数字比特，但功耗增加十倍
              why: 低中频依然需要本振和正交混频器下变频到低中频。
            - text: 能同时接收所有频率而不必选台，但只能用于有线电缆传输
              why: 低中频同样通过调谐本振选台，广泛用于蓝牙等无线短距接收机。
          hint: 信号中心频率从 0 Hz 挪到几百 kHz 后，直流附近的两大噪声问题怎么变？镜像又跑到哪里去了？
          explain: 低中频把有用信号挪离直流，躲开了直流失调和 MOS 管的低频闪烁噪声，但镜像落到邻近信道，因此对 I/Q 正交混频的幅相匹配精度要求更高。
      - item:
          id: q-rx-arch-match
          type: match
          prompt: 将三种接收机架构与它们最突出的工程特征配对。
          pairs:
            - [超外差接收机, 选择性优异但需片外镜像与中频滤波器，分立元件多]
            - [零中频接收机, 一次搬移至基带最易单片集成，但受直流失调与闪烁噪声困扰]
            - [低中频接收机, 搬移至较低中频避开直流问题，依赖正交混频抑制邻道镜像]
          hint: 区分哪一种靠片外高 Q 滤波器、哪一种直接落到 0 Hz、哪一种落在低中频避开直流？
          explain: 三种架构在集成度、镜像抑制和直流/闪烁噪声之间各有侧重，现代无线芯片常按信道带宽和成本在零中频与低中频之间选择。

  - id: tx-architectures
    chapter: 射频收发机架构
    title: 发射机架构：直接上变频与两步上变频
    minutes: 12
    flow:
      - guess:
          id: g-tx-pulling
          type: choice
          prompt: 直接上变频发射机里，末级功率放大器输出高达几百毫瓦的 2.4 GHz 强信号，而同一块硅片上不远处的本振也在 2.4 GHz 振荡。你猜这两个同频电路放在一起会发生什么麻烦？
          options:
            - text: 两者完全互不干扰，因为硅衬底是完美绝缘体
              why: 硅衬底具有有限电导率，加上封装键合线互感与电源耦合，强信号极易串扰到敏感本振。
            - text: 功放强信号串回本振，拉偏频率并展谱
              correct: true
            - text: 本振会把功放的输出功率成倍放大，白赚额外发射距离
              why: 同频注入耦合破坏的是本振相位和频率稳定度，导致频谱再生和调制失真。
          explain: 当功率放大器的强输出频率与片上 VCO 振荡频率重合时，经衬底、电源或封装寄生耦合回去的能量会拉偏 VCO 频率，即本振牵引。
      - card:
          title: 直接上变频发射机与本振牵引
          body: |
            发射机的任务是把基带数字信号经 DAC 和低通重建滤波变成模拟 I/Q 信号，再上变频到射频载波并由功率放大器推向天线。最简方案是直接上变频发射机：单级正交混频器直接用 $f_{\text{LO}} = f_{\text{RF}}$ 把基带搬到射频。它器件少、无中频镜像，但有两大隐患：一是基带直流失调经混频在载波正中心形成**载波馈通（carrier feedthrough）**，恶化调制精度；二是末级强输出回耦到同频本振引发**本振牵引（LO pulling）**，使本振相位受发射包络调制而展宽频谱，违反发射频谱掩模要求。
      - card:
          title: 两步上变频与偏置本振频率规划
          body: |
            消除本振牵引的核心思路是让片上振荡器工作在远离射频载波 $f_{\text{RF}}$ 的频率上，工程上有两条主路线。第一是两步上变频（外差发射机）：基带先与固定中频本振 $f_{\text{LO1}}$ 正交混频到中频，再与第二个本振 $f_{\text{LO2}}$ 混频到 $f_{\text{RF}} = f_{\text{LO1}} + f_{\text{LO2}}$，两路本振频率均远离功放输出，但需滤除混频产生的另一边带。第二是现代片上更常用的偏置本振方案：例如让单个 VCO 运行在 $2f_{\text{RF}}$ 再二分频得到正交本振，或由 $f_{\text{VCO}} = \frac{2}{3}f_{\text{RF}}$ 经二分频得 $\frac{1}{3}f_{\text{RF}}$ 再单边带混频合成 $f_{\text{RF}}$，既保集成度又避开同频牵引。
      - item:
          id: q-tx-pulling-fix
          type: choice
          prompt: 下面哪种措施最能从频率规划上直接避免发射机功率放大器对片上 VCO 产生同频本振牵引？
          options:
            - text: 让 VCO 运行于 2 倍频再二分频
              correct: true
            - text: 把发射机的基带低通滤波器截止频率提高十倍
              why: 提高基带滤波器带宽无法改变功放与 VCO 频率重合的事实，反而放进更多量化噪声。
            - text: 取消发射机的末级功率放大器，只靠混频器直接驱动天线
              why: 混频器无法提供无线通信所需的几十至几百毫瓦发射功率。
            - text: 刻意增大基带 I/Q 通路的直流失调电压来锁定 VCO
              why: 直流失调只会加剧载波馈通并恶化发射信号误差矢量幅度（EVM），不能抑制牵引。
          hint: 功放回耦能量主要集中在 $f_{\text{RF}}$ 附近，只要 VCO 的谐振腔工作在什么频率，就很难被它拉动？
          explain: 让 VCO 运行在 $2f_{\text{RF}}$（或 $\frac{2}{3}f_{\text{RF}}$ 配合分频混频）时，功放输出基频远离 VCO 谐振频率，耦合能量被 LC 谐振腔自然抑制；而且二分频还能顺便产生精准的 $0^\circ/90^\circ$ 正交本振。
      - card:
          title: 例题：用单 VCO 分频混频合成发射本振
          body: 某 5.4 GHz 无线发射机为避免本振牵引，设计片上 VCO 工作在 $f_{\text{VCO}} = 3.6\text{ GHz}$，将它送入二分频器得到 $f_{\text{VCO}}/2$，再把两路信号送入单边带混频器取和频作为发射本振。验证输出本振频率及与 VCO 频率的距离。
          reveal:
            - title: 第 1 步：算二分频后的频率
              body: |
                $f_{\text{div}} = 3.6\text{ GHz} / 2 = 1.8\text{ GHz}$。
            - title: 第 2 步：取和频并检查频率隔离
              body: |
                $f_{\text{LO}} = 3.6 + 1.8 = 5.4\text{ GHz}$，恰好等于发射频点，而片上 VCO 运行在 3.6 GHz（距 5.4 GHz 达 1.8 GHz，且既不是 $f_{\text{RF}}$ 也不是 $f_{\text{RF}}/2$ 的二次谐波重合点），大幅降低牵引风险。
      - item:
          id: q-tx-freq-plan
          type: number
          prompt: 某发射机采用偏置本振方案：片上 VCO 输出频率 $f_{\text{VCO}}$ 与其二分频输出 $f_{\text{VCO}}/2$ 做和频混频，合成出 $f_{\text{RF}} = 2.4\text{ GHz}$ 的发射本振。求片上 VCO 应工作在多少 GHz（保留一位小数）？
          answer: 1.6
          tolerance: 0.05
          unit: GHz
          hint: 满足 $f_{\text{VCO}} + f_{\text{VCO}}/2 = 2.4\text{ GHz}$ 的 $f_{\text{VCO}}$ 是多少？
          explain: 由 $\frac{3}{2}f_{\text{VCO}} = 2.4\text{ GHz}$，解得 $f_{\text{VCO}} = 1.6\text{ GHz}$（其二分频为 $0.8\text{ GHz}$，和频恰好为 $2.4\text{ GHz}$）。
      - item:
          id: q-carrier-feedthrough
          type: choice
          prompt: 直接上变频发射机输出频谱中，如果在载波中心频率处出现一根多余的尖锐连续波谱线（载波馈通），最常见的原因是什么？
          options:
            - text: 天线尺寸比半波长短了百分之五
              why: 天线微失配改变的是驻波和辐射效率，不会在发射频谱中心凭空造出额外载波分量。
            - text: 基带直流失调或本振直通至输出
              correct: true
            - text: 功放输出级采用了共源共栅耐压结构
              why: 共源共栅结构用于分担漏极高压摆幅，不是载波馈通的根源。
            - text: 接收机前端的低噪声放大器增益设置过高
              why: 发射通道的载波馈通源于发射端自身混频器和基带偏置，与接收 LNA 无关。
          hint: 什么信号乘以 $\cos(\omega_{\text{LO}}t)$ 后会正好落在 $\omega_{\text{LO}}$ 这一根单频谱线上？
          explain: 基带直流失调 $V_{\text{OS}}$ 乘以 $\cos(\omega_{\text{LO}}t)$ 会在载波中心直接生成 $V_{\text{OS}}\cos(\omega_{\text{LO}}t)$ 谱线，加上电路不对称引起的本振直通，共同造成载波馈通。
      - item:
          id: q-tx-order
          type: order
          prompt: 按信号从数字比特流到无线电磁波辐射的顺序，排列直接上变频发射机的核心电路环节。
          steps:
            - 数字基带调制器生成 I/Q 数字样点
            - 数模转换器（DAC）与基带低通滤波器重建模拟信号
            - 正交上变频混频器将模拟基带搬移到射频载波
            - 射频功率放大器将信号放大至目标发射功率
            - 射频滤波器与天线将能量辐射至自由空间
          hint: 从数字基带出发，先转模拟、再搬频率、再放大功率、最后送上天线。
          explain: 发射链路按数字基带→DAC 与重建滤波→正交上变频混频→功率放大→天线辐射的顺序将信息送上空中。

  - id: lna-matching
    chapter: 低噪声放大器
    title: LNA 的任务与输入阻抗匹配难题
    minutes: 12
    flow:
      - guess:
          id: g-lna-shunt-r
          type: choice
          prompt: 为了让天线和前端带通滤波器看到标准的 50 Ω 负载，如果在放大器栅极直接并联一颗 50 Ω 物理电阻到地，输入端口阻抗立刻就是完美的 50 Ω。你猜射频工程师为什么几乎不用这种省事办法做低噪声放大器？
          options:
            - text: 匹配电阻热噪声把噪声系数锁在 3 dB 上
              correct: true
            - text: 50 Ω 电阻会在射频频率下自动变成断路，无法实现匹配
              why: 片上多晶硅电阻在几 GHz 下依然呈阻性，真正致命的是它的热噪声与信号分压损耗。
            - text: 并联电阻后放大器的直流供电电压会直接短路烧毁芯片
              why: 交流匹配电阻可通过隔直电容隔离直流偏置，不会短路电源。
          explain: 端接一颗 50 Ω 物理电阻，不仅把天线送来的信号分走一半功率，还在输入端白白多引入一份与源电阻等大的热噪声，哪怕后面晶体管完全无噪，噪声系数也已被锁死在 3 dB 以上。
      - card:
          title: 低噪声放大器的四大任务
          body: |
            紧接天线开关和射频预选滤波器之后的第一级有源电路是**低噪声放大器（low-noise amplifier, LNA）**。由弗里斯公式可知，整机灵敏度成败首先系于 LNA。它要同时兼顾四项苛刻指标：第一，极低的噪声系数（通常 1–3 dB）；第二，足够高的功率增益（通常 12–20 dB），以压制后级混频器和中频级的噪声；第三，在目标频段提供良好的 $50\ \Omega$ 输入阻抗匹配，因为前端声表面波滤波器对终端阻抗敏感，失配会扭曲带内平坦度并反射信号；第四，足够的线性度与低功耗，防止强邻道阻塞信号把放大器压饱和。
      - card:
          title: 为什么电阻匹配不可行与无损实部思路
          body: |
            假设天线等效为电动势 $v_s$ 串联源电阻 $R_s = 50\ \Omega$，其可向匹配负载提供的最大可用功率为 $P_{\text{av}} = v_{s,\text{rms}}^2 / (4R_s)$。若在 MOSFET 栅极直接并联电阻 $R_p = R_s = 50\ \Omega$ 匹配，$R_s$ 与 $R_p$ 在输入端产生相等的热噪声电流 $4kT/R_s$，叠加后输入总噪声功率翻倍，因此单靠电阻本身就使噪声因子 $F \ge 2$（$\text{NF} \ge 3.01\text{ dB}$），加上晶体管沟道噪声后往往超过 4–6 dB。理想 LNA 需要一种“看起来像 $50\ \Omega$ 电阻、却不产生对应物理电阻热噪声”的输入端口——这正是后续电感源极退化与有源匹配的核心出发点。
      - item:
          id: q-shunt-r-nf
          type: choice
          prompt: 在无噪理想放大器的高阻输入端直接并联一颗与源电阻相等的 50 Ω 电阻来实现输入匹配，该电路的最小理论噪声系数是多少？
          options:
            - text: 0 dB，因为理想放大器本身没有任何噪声
              why: 放大器本身虽无噪声，但外加的 50 Ω 匹配电阻会产生与源电阻同等大小的热噪声。
            - text: 3.01 dB，因为匹配电阻贡献了与源电阻等大的热噪声功率
              correct: true
            - text: 6.02 dB，因为电压分压减半使信噪比直接掉了 6 dB
              why: 信号电压与源噪声电压按同一比例分压，额外恶化来自匹配电阻新增的等额噪声，功率翻倍对应 3.01 dB。
            - text: 10 dB，因为并联电阻把输入信号功率衰减了十分之九
              why: 匹配电阻消耗的是一半信号功率，并非十分之九。
          hint: 源电阻和并联的 50 Ω 匹配电阻处于同一温度且阻值相等，输入端总噪声功率变成了源电阻单独贡献的几倍？
          explain: $R_p = R_s$ 在输入端引入与 $R_s$ 相等的热噪声功率，总输入噪声功率变为源噪声的 2 倍，故 $F = 2$，$\text{NF} = 10\lg 2 \approx 3.01\text{ dB}$。
      - card:
          title: 例题：验证 50 Ω 匹配时的可用功率与电阻匹配恶化
          body: 某天线在 50 Ω 源电阻下的开路有效值电动势为 $v_{s,\text{rms}} = 2.0\text{ mV}$。求它送给共轭匹配 50 Ω 负载的最大可用功率（以 nW 和 dBm 表示），并说明为什么前端滤波器要求 LNA 端口匹配良好。
          reveal:
            - title: 第 1 步：代入最大可用功率公式
              body: |
                匹配时负载电压为 $v_s / 2 = 1.0\text{ mV}$，流过负载的功率为：
                $$P_{\text{av}} = \frac{(v_{s,\text{rms}}/2)^2}{R_s} = \frac{v_{s,\text{rms}}^2}{4R_s} = \frac{(2.0\times 10^{-3})^2}{4 \times 50} = 2.0\times 10^{-8}\text{ W} = 20\text{ nW}$$
            - title: 第 2 步：换算成 dBm 并解释滤波器依赖
              body: |
                $P_{\text{av}} = 20\times 10^{-6}\text{ mW}$，故 $10\lg(2\times 10^{-5}) \approx -47.0\text{ dBm}$。若 LNA 输入严重偏离 $50\ \Omega$，不仅反射损失能量，更会破坏前端预选滤波器的设计端接条件，引起通带波纹与阻带抑制退化。
      - item:
          id: q-lna-pav
          type: number
          prompt: 某射频信号源内阻 $R_s = 50\ \Omega$，开路有效值电压 $v_{s,\text{rms}} = 4.0\text{ mV}$。当接上匹配的 $50\ \Omega$ 负载时，负载获得的最大可用功率是多少 nW？
          answer: 80
          tolerance: 1
          unit: nW
          hint: 匹配时一半电压落在负载上，代入 $P_{\text{av}} = v_{s,\text{rms}}^2 / (4R_s)$ 算出的结果是多少纳瓦？
          explain: $P_{\text{av}} = (4.0\times 10^{-3})^2 / (4 \times 50) = 1.6\times 10^{-5} / 200 = 8.0\times 10^{-8}\text{ W} = 80\text{ nW}$。
      - item:
          id: q-lna-why-match
          type: choice
          prompt: 接收机前端的 LNA 为什么要把输入阻抗精确匹配到 50 Ω，而不是直接呈现高输入阻抗以获取最大电压？
          options:
            - text: 前端滤波器按 50 Ω 标定，失配会反射并畸变
              correct: true
            - text: MOSFET 栅极在射频频率下直流电阻只有 1 Ω，无法形成高阻输入
              why: MOSFET 栅极直流近乎开路，高频呈容性而非 1 Ω 电阻。
            - text: 只有输入阻抗等于 50 Ω 时，晶体管才会有跨导 $g_m$
              why: 跨导由直流偏置电流与器件尺寸决定，与端口是否 50 Ω 匹配无关。
            - text: 50 Ω 是半导体硅材料的固有电阻率，任何其他阻抗都会击穿栅氧
              why: 50 Ω 是同轴传输线在损耗与耐压间折中的行业系统标准，并非硅材料击穿约束。
          hint: 想想 LNA 前面通常连着什么无源器件和走线，它们在什么端接条件下才能按标称频率响应工作？
          explain: 天线馈线和前端片外带通滤波器均按 50 Ω 终端标定，LNA 输入失配不仅反射宝贵的微弱信号功率，还会引起驻波与滤波器通带畸变。
      - item:
          id: q-lna-specs-match
          type: match
          prompt: 将 LNA 的四项关键设计指标与它们对接收机系统的直接意义配对。
          pairs:
            - [低噪声系数, 决定整机灵敏度下限，因第一级噪声无法被后级增益压低]
            - [高功率增益, 通过弗里斯公式大幅压缩混频器及中频级对总噪声的贡献]
            - [50 Ω 输入匹配, 保证前端预选滤波器响应平坦并实现最大可用功率传输]
            - [足够线性度, 防止带外强阻塞信号使放大器增益压缩并淹没有用弱信号]
          hint: 分别从灵敏度、后级噪声权重、前端端接和强干扰耐受四个维度对应。
          explain: LNA 的设计本质是在低噪声、高增益、端口匹配、线性度与有限直流功耗之间寻找最佳平衡点。

  - id: lna-topologies
    chapter: 低噪声放大器
    title: 经典 LNA 拓扑：共栅与电感源极退化
    minutes: 14
    flow:
      - guess:
          id: g-ind-degen
          type: choice
          prompt: 在共源 MOSFET 的源极和地之间串一颗无损理想电感 $L_s$，再从栅极往里看输入阻抗。既然电感和栅源电容 $C_{gs}$ 都是纯无损储能元件，输入阻抗会不会仍然只有纯虚部、没有实部？
          options:
            - text: 会，纯电感和纯电容无论怎么连接都不可能出现电阻实部
              why: 仅对无源网络如此；这里还有受控电流源 $g_m v_{gs}$，它改变了流过电感的电流相位，从而造出实部。
            - text: 不会，受控电流经电感合成 $\omega_T L_s$ 实部
              correct: true
            - text: 会变成负电阻，导致放大器一通电立刻自激振荡
              why: 源极串联电感反馈产生的是正实部 $\omega_T L_s > 0$，恰好可用于稳定的 50 Ω 匹配。
          explain: 输入电压经 $C_{gs}$ 产生超前电流，晶体管跨导将其放大后送进源极电感 $L_s$ 产生 $j\omega L_s$ 压降，两次 $90^\circ$ 相移叠加使反馈电压与输入电流同相，等效出无热噪声的正电阻 $\omega_T L_s$。
      - card:
          title: 共栅 LNA 与并联反馈 LNA
          body: |
            摆脱 50 Ω 物理匹配电阻的第一类拓扑是共栅（CG）LNA：信号从源极输入，输入阻抗约为 $1/g_m$，只要把跨导偏置到 $g_m \approx 20\text{ mS}$ 即可在很宽频段内自然匹配 $50\ \Omega$，且无密勒效应、稳定性好。但共栅级的沟道热噪声直接折算到输入端，最小噪声因子受限于 $F_{\text{CG}} \ge 1 + \gamma$（短沟道 $\gamma \approx 1\text{–}1.5$，对应 NF 约 3–4 dB），而且匹配把 $g_m$ 锁死，无法单独增大跨导降噪。另一类宽带方案是在共源级漏–栅间加并联反馈电阻 $R_F$，把输入阻抗拉低到约 $R_F/(1 + A_v)$，宽带平坦但反馈电阻同样贡献噪声。
      - card:
          title: 电感源极退化共源共栅 LNA
          body: |
            窄带高灵敏度接收机最经典的方案是**电感源极退化（inductive source degeneration）**共源共栅 LNA：在共源管源极串电感 $L_s$，栅极串电感 $L_g$，漏极叠一颗共源共栅管隔离输出向输入的反向耦合、削弱密勒效应。忽略体效应与 $C_{gd}$ 时，输入阻抗为：
            $$Z_{\text{in}}(s) = s(L_g + L_s) + \frac{1}{s C_{gs}} + \frac{g_m}{C_{gs}}L_s = s(L_g + L_s) + \frac{1}{s C_{gs}} + \omega_T L_s$$
            令 $\omega_T L_s = R_s = 50\ \Omega$ 即可实现无物理电阻热噪声的实部匹配；再令 $(L_g + L_s)$ 与 $C_{gs}$ 在工作频点谐振：
            $$\omega_0 = \frac{1}{\sqrt{(L_g + L_s)C_{gs}}}$$
            虚部抵消后 $Z_{\text{in}}(\omega_0) = 50\ \Omega$，噪声系数可压低到 1–2 dB，同时漏极 LC 谐振负载提供选频增益。
      - item:
          id: q-lna-degen-adv
          type: choice
          prompt: 电感源极退化共源 LNA 相比简单在栅极并联 50 Ω 电阻，为什么能把噪声系数做到远低于 3 dB？
          options:
            - text: 无噪电感反馈合成实部，无物理电阻热噪声
              correct: true
            - text: 源极电感吸收并抵消了天线源电阻自带的热噪声
              why: 天线源电阻热噪声与有用信号混在一起，任何网络都不可能在不衰减信号的前提下消除源噪声。
            - text: 栅极串联电感 $L_g$ 会把晶体管的工作频率降到直流，从而消除高频噪声
              why: $L_g$ 用于在射频中心频点抵消 $C_{gs}$ 的容抗，电路依然工作在射频频段。
            - text: 电感退化使晶体管进入截止区，关断了所有沟道电流和热噪声
              why: 晶体管必须保持在饱和区提供跨导 $g_m$ 与特征频率 $\omega_T$ 才能产生 $\omega_T L_s$ 并放大信号。
          hint: 理想电感本身有热噪声吗？它生成的实部 $\omega_T L_s$ 靠什么机制实现？
          explain: 理想电感无热噪声，它借由受控电流 $g_m v_{gs}$ 在输入端合成出等效正电阻 $\omega_T L_s$，避开了物理 50 Ω 电阻带来的 3 dB 噪声下限。
      - card:
          title: 例题：设计 5.0 GHz 电感源极退化 LNA 的 $L_s$ 与 $L_g$
          body: 某 5.0 GHz 电感源极退化 LNA 中，MOSFET 特征频率 $f_T = 80\text{ GHz}$（$\omega_T = 2\pi f_T$），栅源电容 $C_{gs} = 120\text{ fF}$。为匹配 $50\ \Omega$ 源阻抗，求 $L_s$ 与 $L_g$。
          reveal:
            - title: 第 1 步：由实部匹配 $\omega_T L_s = 50\ \Omega$ 求 $L_s$
              body: |
                $$L_s = \frac{50}{2\pi \times 80\times 10^9} \approx 0.0995\text{ nH} \approx 0.10\text{ nH}$$
                （如此小的电感常靠芯片封装键合线或极短微带实现。）
            - title: 第 2 步：由谐振条件求总电感 $L_g + L_s$ 与 $L_g$
              body: |
                $$L_g + L_s = \frac{1}{(2\pi \times 5.0\times 10^9)^2 \times 120\times 10^{-15}} \approx 8.44\text{ nH}$$
                故 $L_g = 8.44 - 0.10 = 8.34\text{ nH}$。
      - item:
          id: q-lna-ls
          type: number
          prompt: 某电感源极退化共源 LNA 所用晶体管的特征角频率 $\omega_T = 2\pi \times 40\text{ GHz}$。要使输入阻抗实部 $\omega_T L_s$ 匹配 $50\ \Omega$，源极电感 $L_s$ 应取多少 nH（保留两位小数）？
          answer: 0.20
          tolerance: 0.01
          unit: nH
          hint: 从 $\omega_T L_s = 50\ \Omega$ 反解 $L_s$，注意换算成纳亨（$10^{-9}\text{ H}$）。
          explain: $L_s = 50 / (2\pi \times 40\times 10^9) \approx 0.1989\text{ nH} \approx 0.20\text{ nH}$。
      - item:
          id: q-lna-lg
          type: number
          prompt: 某电感源极退化 LNA 工作在 $f_0 = 5.0\text{ GHz}$，晶体管 $C_{gs} = 100\text{ fF}$，已选定源极电感 $L_s = 0.20\text{ nH}$。求使输入端谐振所需的栅极电感 $L_g$ 是多少 nH（保留两位小数）？
          answer: 9.93
          tolerance: 0.1
          unit: nH
          hint: 先用 $1/(\omega_0^2 C_{gs})$ 算出总电感 $L_g + L_s$，再减去 $L_s$ 是多少？
          explain: $L_g + L_s = 1 / [(2\pi\times 5.0\times 10^9)^2 \times 100\times 10^{-15}] \approx 10.13\text{ nH}$，故 $L_g \approx 10.13 - 0.20 = 9.93\text{ nH}$。
      - item:
          id: q-cg-gm
          type: number
          prompt: 若采用理想共栅 LNA 直接实现 $50\ \Omega$ 输入匹配（忽略沟道长度调制与体效应，输入电阻 $R_{\text{in}} \approx 1/g_m$），主放大管的跨导 $g_m$ 需要偏置为多少 mS？
          answer: 20
          tolerance: 0.5
          unit: mS
          hint: 由 $1/g_m = 50\ \Omega$ 求出的 $g_m$ 换算成毫西门子（mS）是多少？
          explain: $g_m = 1 / 50\ \Omega = 0.02\text{ S} = 20\text{ mS}$。

  - id: lna-switching-ip2
    chapter: 低噪声放大器
    title: LNA 的增益切换、多频段与高 IIP2
    minutes: 12
    flow:
      - guess:
          id: g-lna-gain-step
          type: choice
          prompt: 当手机走近基站时，天线收到的信号比远距离弱信号强出上百万倍。此时接收机不仅不缺增益，反而把 LNA 切换到低增益甚至旁路模式。你猜这么做的目的是什么？
          options:
            - text: 防止过强信号把后级混频器和基带放大器压饱和失真
              correct: true
            - text: 信号太强时会把硅芯片里的电感磁化失效
              why: 片上空心螺旋电感没有磁芯，不会磁饱和，真正会被压垮的是有源级电压摆幅与线性度。
            - text: 强信号不需要 50 Ω 输入匹配，降增益可以全部断开天线
              why: 切换增益时仍需维持良好输入匹配，避免前端滤波器特性恶化。
          explain: 强信号下接收机信噪比绰绰有余，首要威胁变成大摆幅把混频器和基带级顶到非线性区导致失真，因此需通过自动增益控制分档降低 LNA 增益。
      - card:
          title: 增益切换与多频段 LNA
          body: |
            强信号下直接调小主放大管偏置电流会破坏 $\omega_T L_s$ 输入匹配，因此 LNA 常在共源共栅管上方加一路并联**电流导引管**，把一部分射频信号电流直接泄放到电源，既降低电压增益又几乎不改变输入级工作点与 $50\ \Omega$ 匹配；极强信号下还可切换至无源旁路通道。现代手机需支持十几个通信频段，为节省昂贵的片上电感面积，多频段 LNA 采用在负载谐振腔并联**数字可切换电容**切换谐振频点，或用多个独立输入管共享同一个输出谐振电感，按当前工作频段仅开启对应输入支路。
      - card:
          title: 偶次非线性、二阶交调与高 IIP2 差分 LNA
          body: |
            在零中频接收机里，除了奇次失真，偶次非线性（$y = \alpha_1 x + \alpha_2 x^2$）格外危险：若带外存在两个频率相近的强干扰 $f_1, f_2$，平方项 $x^2$ 会生出它们的差频 $f_2 - f_1$，这叫**二阶交调（second-order intermodulation, IM2）**。哪怕 $f_1, f_2$ 远在几百兆赫之外，只要差频 $f_2 - f_1$ 落在基带带宽内，它就会像“幽灵”一样直接落进零中频有用信道，衡量抗这种失真能力的指标是二阶输入截点（IIP2）。抑制偶次失真最有效的电路手段是采用**差分 LNA**：完全对称的差分信号相减时，偶次项 $(\alpha_2 v^2 - \alpha_2 (-v)^2) = 0$ 互相抵消；实际受器件随机失配限制，仍需大尺寸对称版图与二阶失真校准。
      - item:
          id: q-im2-zeroif
          type: choice
          prompt: 为什么零中频接收机对前端 LNA 和混频器的偶次非线性（IIP2）要求远比传统超外差接收机苛刻？
          options:
            - text: 强干扰二阶差频 $f_2 - f_1$ 直落基带难以滤除
              correct: true
            - text: 零中频接收机里只有偶次非线性，不会产生任何三阶交调失真
              why: 零中频同样受三阶交调困扰，只是额外对直落基带的二阶交调高度敏感。
            - text: 超外差接收机的晶体管本身呈理想线性，不存在平方项 $\alpha_2 x^2$
              why: 任何有源晶体管都有非线性，只是超外差的有用信号位于几十 MHz 中频，避开了低频差频项。
            - text: 零中频接收机必须使用单端天线，因此不能使用任何滤波电容
              why: 隔直或射频滤波器都在高频工作，挡不住混频器或非线性级内部新生成的低频 $f_2 - f_1$。
          hint: 两个频率相差 2 MHz 的高频干扰经过 $x^2$ 项后，会产生一个频率等于多少的低频分量？它正好落在哪里？
          explain: 平方项把两个高频干扰变成低频差拍 $f_2 - f_1$（以及调幅干扰的包络检波信号），在零中频接收机里该频带正好就是有用基带信号所在之处。
      - card:
          title: 例题：强干扰下的增益切换与 IM2 落点判断
          body: 某零中频接收机基带信道带宽为 5 MHz，LNA 高增益档为 18 dB、低增益档为 6 dB，后级混频器能承受的最大输入干扰功率为 $-8\text{ dBm}$。(1) 当带外强阻塞信号达到 $-20\text{ dBm}$ 时，应切到哪一档？(2) 若带外同时存在 2410 MHz 和 2412 MHz 两个强干扰，它们的 IM2 差频落在哪里？
          reveal:
            - title: 第 1 步：算高低两档送给混频器的干扰功率
              body: |
                高增益档输出 $-20 + 18 = -2\text{ dBm}$，比混频器上限 $-8\text{ dBm}$ 高出 6 dB，会严重饱和；切到 6 dB 低增益档后输出为 $-20 + 6 = -14\text{ dBm} < -8\text{ dBm}$，留有 6 dB 余量。
            - title: 第 2 步：算二阶交调差频落点
              body: |
                $f_2 - f_1 = 2412 - 2410 = 2\text{ MHz}$，直接落入 5 MHz 基带信道内部，必须靠高 IIP2 差分结构压制。
      - item:
          id: q-im2-freq
          type: number
          prompt: 若天线端同时进入 $f_1 = 1815\text{ MHz}$ 和 $f_2 = 1819\text{ MHz}$ 两个强带外干扰信号，经电路偶次非线性产生的低频二阶交调差频分量位于多少 MHz？
          answer: 4
          tolerance: 0.1
          unit: MHz
          hint: 二阶交调的低频差频分量等于两干扰频率之差 $|f_2 - f_1|$。
          explain: $f_2 - f_1 = 1819 - 1815 = 4\text{ MHz}$，若基带带宽大于 4 MHz，该干扰将直接落入通带内。
      - item:
          id: q-gain-steer
          type: choice
          prompt: 共源共栅 LNA 采用在共栅管旁增加电流导引支路来降低增益时，相比直接削减输入管偏置电流的最大好处是什么？
          options:
            - text: 保持输入管偏置与 50 Ω 匹配稳定
              correct: true
            - text: 能大幅削减整个芯片的静态直流功耗
              why: 电流导引只是把部分射频信号电流分流到电源，总直流尾电流基本不变。
            - text: 能把高增益与低增益档的噪声系数同步拉低
              why: 降增益本身会略微抬高噪声系数，但强信号下信噪比已经非常充足。
            - text: 可以把单端电路自动改造成完全对称的差分放大器
              why: 电流导引改变的是流向负载的射频电流比例，不改变电路单端或差分拓扑。
          hint: 回想电感源极退化 LNA 的输入阻抗实部 $\omega_T L_s$ 取决于哪颗晶体管的偏置状态？
          explain: 保持输入共源管直流电流不变就能维持 $\omega_T$ 与 $C_{gs}$ 稳定，输入 50 Ω 匹配不会随增益切换而漂移。
      - item:
          id: q-diff-ip2
          type: choice
          prompt: 差分 LNA 拓扑能够显著提高二阶输入截点（IIP2）的根本数学原因是什么？
          options:
            - text: 两臂相减使同号的偶次幂项互相抵消
              correct: true
            - text: 差分放大器的每个 MOSFET 都没有平方项特性
              why: 单管平方律依然存在，抵消发生在差分两臂输出相减的瞬间。
            - text: 差分信号频率比单端信号高一倍，把差频推到了高频区
              why: 差分仅表示两路反相（相位差 $180^\circ$），并不改变信号频率。
            - text: 差分结构把全部输入功率都反射回了天线
              why: 差分 LNA 同样需要良好的差分阻抗匹配以接收全部可用信号功率。
          hint: 比较 $(+v)^2$ 与 $(-v)^2$ 的符号，两路输出相减后剩下什么？
          explain: 正臂产生 $\alpha_1 v + \alpha_2 v^2 + \alpha_3 v^3$，负臂产生 $-\alpha_1 v + \alpha_2 v^2 - \alpha_3 v^3$；两臂相减得 $2\alpha_1 v + 2\alpha_3 v^3$，理想对称下偶次项 $\alpha_2 v^2$ 全部消去。

  - id: mixer-basics-passive
    chapter: 混频器
    title: 混频原理与无源开关混频器
    minutes: 13
    flow:
      - guess:
          id: g-mixer-linear
          type: choice
          prompt: 任何线性时不变（LTI）电路（比如理想放大器或无源滤波器）能不能把一个 2.4 GHz 的正弦波搬移成 100 MHz 的中频正弦波？
          options:
            - text: 能，只要串联足够多级低通滤波器就能把频率降下来
              why: 线性时不变滤波器只能改变原有频率分量的幅度和相位，绝不会生出输入端不存在的新频率。
            - text: 不能，产生新频率须靠非线性或时变开关
              correct: true
            - text: 能，只要把放大器的电源电压调低，输出频率就会成比例变慢
              why: 调低电源只限制幅度和改变工作点，线性放大器依然保持输出频率等于输入频率。
          explain: 线性时不变系统满足频率保持性；混频器本质上是受大信号本振驱动的线性时变（LTV）乘法或开关电路，利用三角积化和差生出和频与差频。
      - card:
          title: 变频增益、端口隔离与 SSB/DSB 噪声系数
          body: |
            理想混频器把射频输入 $A\cos\omega_{\text{RF}}t$ 乘以本振信号（如方波或正弦波），输出和频与差频，经滤波取目标中频。输出中频与输入射频之比称**变频增益（conversion gain）**。混频器还考核三端口隔离度（尤其 LO 到 RF 隔离，防止本振泄漏自混频）。噪声系数分两种：超外差中信号只占本振一侧，但镜像频带的噪声也会被混进中频，定义**单边带噪声系数（SSB NF）**；零中频中上下边带都载有有用信号，定义**双边带噪声系数（DSB NF）**。当镜像端带噪且无预滤波时，理想 SSB 噪声系数比 DSB 高 3 dB。
      - card:
          title: 无源下变频混频器与 2/π 变频损耗
          body: |
            **无源混频器（passive mixer）**用工作在三极管区的 MOS 管当受本振方波控制的双向开关。以差分四管无源电压混频器为例，本振每隔半周期把输出极性翻转一次，等效乘以幅值 $\pm 1$、基波系数为 $4/\pi$ 的方波。射频信号 $\cos\omega_{\text{RF}}t$ 乘以该基波再取差频，理想电压变频增益为：
            $$G_v = \frac{2}{\pi} \approx 0.637 \quad (-3.92\text{ dB})$$
            无源混频器表现为约 3.92 dB 损耗而非增益，因此需要前级 LNA 增益足够大；但它的开关管不流静态直流电流，几乎没有 $1/f$ 闪烁噪声，且线性度高、不吃电源裕度。现代零中频常用电流模无源混频器，输出直连低输入阻抗的跨阻放大器以保持极高线性度。
      - item:
          id: q-ssb-dsb
          type: choice
          prompt: 同一台理想无滤波宽带混频器，为什么测得的单边带（SSB）噪声系数通常比双边带（DSB）噪声系数高出约 3 dB？
          options:
            - text: 信号仅占单侧边带，镜像边带噪声仍混入中频
              correct: true
            - text: 单边带模式下混频器消耗的直流供电电流恰好是双边带模式的两倍
              why: 两种指标是针对同一混频器在两种信号频谱分布下的不同定义，电路偏置电流相同。
            - text: 双边带测试把混频器里的 MOS 管全部换成了无噪理想开关
              why: 器件物理噪声相同，差别在于有用信号是分布在一侧边带还是对称分布在两侧边带。
            - text: 单边带混频时本振幅度会自动减半，导致变频增益额外损失 3 dB
              why: 本振驱动幅度完全不变，3 dB 差距源于镜像频段噪声折入同一中频。
          hint: 比较超外差（信号只在单侧）与零中频（信号占本振两侧）里，镜像频带送进中频的究竟是纯噪声还是有用信号？
          explain: 双边带中本振上下两旁都包含信号与噪声，单边带中信号仅在一旁而两旁的噪声都落入中频，信噪比多恶化 2 倍，即 3 dB。
      - card:
          title: 例题：验证无源混频器理想电压损耗与 SSB/DSB 换算
          body: 某理想差分无源电压混频器受理想 50% 占空比方波本振驱动，输入正弦射频幅值 $V_{\text{RF}} = 10\text{ mV}$。(1) 求差频中频输出幅值及分贝表示的电压变频增益；(2) 若该混频器双边带噪声系数为 7.5 dB，估算其单边带噪声系数。
          reveal:
            - title: 第 1 步：展开方波基波求中频输出幅值
              body: |
                幅值 $\pm 1$ 的对称方波傅里叶级数基波为 $\frac{4}{\pi}\cos\omega_{\text{LO}}t$。与 $V_{\text{RF}}\cos\omega_{\text{RF}}t$ 相乘后，由积化和差 $\cos A\cos B = \frac{1}{2}[\cos(A-B)+\cos(A+B)]$，差频项幅值为：
                $$V_{\text{IF}} = \frac{1}{2}\cdot\frac{4}{\pi} V_{\text{RF}} = \frac{2}{\pi}\times 10\text{ mV} \approx 6.37\text{ mV}$$
            - title: 第 2 步：算分贝电压增益与 SSB NF
              body: |
                $G_{v,\text{dB}} = 20\lg(2/\pi) \approx -3.92\text{ dB}$。无预选镜像抑制时，$\text{NF}_{\text{SSB}} \approx \text{NF}_{\text{DSB}} + 3 = 10.5\text{ dB}$。
      - item:
          id: q-passive-gain-db
          type: number
          prompt: 理想差分无源电压开关混频器在 50% 占空比方波本振驱动下，理论电压变频增益为 $2/\pi$。换算成分贝（$20\lg(2/\pi)$）约是多少 dB（带符号，保留两位小数）？
          answer: -3.92
          tolerance: 0.05
          unit: dB
          hint: 先算 $2/\pi \approx 0.6366$，再算 $20\lg(0.6366)$ 得到的负分贝数是多少？
          explain: $2/\pi \approx 0.6366$，$20\lg(0.6366) \approx -3.92\text{ dB}$，即理想无源混频器存在约 3.92 dB 的固有电压变频损耗。
      - item:
          id: q-passive-adv
          type: choice
          prompt: 现代深亚微米 CMOS 零中频接收机普遍青睐无源开关混频器，最核心的优势组合是哪一项？
          options:
            - text: 电压变频增益高达 20 dB 以上，可以完全省去前端 LNA
              why: 无源混频器只有变频损耗而没有增益，反而更依赖前级 LNA 的低噪声放大。
            - text: 无静态直流电流，几乎无 1/f 闪烁噪声且线性度高
              correct: true
            - text: 不需要任何本振驱动信号就能自行完成下变频
              why: 无源混频器必须由足够大幅度的本振方波驱动 MOS 开关通断。
            - text: 能够直接把交流射频功率放大到瓦级去驱动发射天线
              why: 无源混频器无法提供功率放大，瓦级发射靠功率放大器完成。
          hint: 闪烁噪声需要器件里流过什么才会产生？低压工艺下无直流堆叠又有什么好处？
          explain: 无源混频器 MOS 开关无直流偏置电流，从根源上消除了混频开关管的 $1/f$ 闪烁噪声，且无需堆叠电源电压裕度，线性度优异。
      - item:
          id: q-mixer-ports
          type: match
          prompt: 将混频器的常见指标或结构与对应的含义配对。
          pairs:
            - [LO-RF 隔离度, 衡量本振信号反向泄漏回射频输入端口的抑制能力]
            - [电压变频增益, 中频输出信号电压幅值与射频输入电压幅值之比]
            - [无源电压混频器, 零直流偏置开关结构，存在约 3.92 dB 理论变频损耗]
            - [电流模无源混频器, 将射频电流经开关直接送入低阻跨阻放大器以保高线性度]
          hint: 分别从端口泄漏、幅值比、无源开关损耗和电流域接口四个角度配对。
          explain: 良好的 LO-RF 隔离可抑制本振自混频；电流模无源混频器配合低输入阻抗跨阻放大器（TIA）让开关端电压摆幅极小，大幅改善线性度。

  - id: active-mixers
    chapter: 混频器
    title: 有源混频器：单平衡与双平衡吉尔伯特单元
    minutes: 13
    flow:
      - guess:
          id: g-active-mixer-gain
          type: choice
          prompt: 无源混频器不但不能放大信号，还会衰减近 4 dB，导致后级基带放大器的噪声折算回来很显眼。如果在开关对下方先加一级跨导放大管把射频电压转成射频电流，再经本振开关交替送给负载电阻 $R_D$，你猜会带来什么改变？
          options:
            - text: 依然只能衰减信号，因为任何开关都会把全部增益抵消
              why: 跨导管先将电压放大为 $g_m v_{\text{RF}}$ 电流，再乘负载电阻 $R_D$，只要 $\frac{2}{\pi}g_m R_D > 1$ 就能提供正增益。
            - text: 提供正向变频增益，但增功耗并挤占裕度
              correct: true
            - text: 能同时把功耗降为零并把线性度提高到无穷大
              why: 引入有源偏置电流必然带来直流功耗、$1/f$ 噪声以及三级管堆叠的电源电压裕度压力。
          explain: 这就是有源混频器的基本结构：下层跨导管提供增益以压缩后级噪声，上层差分开关对实现频谱搬移，代价是功耗、噪声和电压裕度受限。
      - card:
          title: 单平衡有源混频器及其馈通缺陷
          body: |
            最简单的有源混频器是单平衡结构：底部一颗共源跨导管把单端射频电压 $v_{\text{RF}}$ 转成电流 $g_m v_{\text{RF}}$，上方一对差分 MOS 管受差分本振驱动交替导通，周期性翻转电流流向两个对称负载电阻 $R_D$。理想方波开关下，其电压变频增益为：
            $$G_v = \frac{2}{\pi} g_m R_D$$
            但单平衡结构有一个明显缺点：跨导管的静态直流偏置电流 $I_{SS}$ 也会随本振交替切向左右两个负载电阻，于是在中频输出端直接出现大幅度的本振方波分量（**LO-IF 馈通**），很容易把后级中频放大器压饱和。
      - card:
          title: 双平衡吉尔伯特混频器与噪声–裕度权衡
          body: |
            将两套单平衡混频器反相并联——底部用差分跨导对，上方用两对交叉开关管，即射频**双平衡混频器**（吉尔伯特单元）。两套支路直流电流在每半周期对称注入左右负载，差分输出中本振与射频直通分量均相消，理想增益仍为 $G_v = \frac{2}{\pi}g_m R_D$。缺点是尾电流源、跨导对、开关对与 $R_D$ 四层堆叠，低压下电压裕度紧张，且开关过零切换仍会向输出注入 $1/f$ 噪声。
      - item:
          id: q-double-bal-adv
          type: choice
          prompt: 相比单平衡有源混频器，双平衡吉尔伯特混频器最突出的端口抑制优势是什么？
          options:
            - text: 同时消除了本振（LO）和射频（RF）向中频输出端的直接馈通
              correct: true
            - text: 不需要任何电源电压裕度，可在 0.1 V 下满幅工作
              why: 双平衡吉尔伯特单元仍有多层晶体管与负载堆叠，电源裕度同样紧张。
            - text: 电压变频增益比同等 $g_m$ 和 $R_D$ 的单平衡混频器凭空高出 20 dB
              why: 同等单管跨导 $g_m$ 与负载 $R_D$ 下，双平衡混频器的差分电压变频增益公式同为 $\frac{2}{\pi}g_m R_D$。
            - text: 全部消除了开关对管子的所有热噪声与闪烁噪声
              why: 开关对在切换过渡区依然会向中频输出注入热噪声与 $1/f$ 闪烁噪声。
          hint: 单平衡结构里，底部直流尾电流被本振开关切换到了输出电阻上；双平衡加了反相的第二路后，这股本振分量会怎样？
          explain: 双平衡结构中两对交叉开关把等量静态电流同时送到左右负载，理想对称时本振基波在差分输出端严格相消，射频直通同样被抵消。
      - card:
          title: 例题：计算双平衡吉尔伯特混频器的变频增益
          body: 某双平衡吉尔伯特混频器中，差分跨导对单管跨导 $g_m = 20\text{ mS}$，负载电阻 $R_D = 250\ \Omega$，由理想陡峭方波本振驱动。求它的电压变频增益（倍数与 dB）。
          reveal:
            - title: 第 1 步：代入有源开关混频器增益公式
              body: |
                $$G_v = \frac{2}{\pi} g_m R_D = \frac{2}{\pi} \times 0.020 \times 250 \approx 3.183$$
            - title: 第 2 步：换算成电压增益分贝值
              body: |
                $$G_{v,\text{dB}} = 20\lg(3.183) \approx 10.1\text{ dB}$$
                可见有源混频器可方便提供约 10 dB 正向变频增益，显著压低后级基带噪声贡献。
      - item:
          id: q-gilbert-gv-lin
          type: number
          prompt: 某理想双平衡吉尔伯特混频器的跨导对单管跨导 $g_m = 15\text{ mS}$，负载电阻 $R_D = 400\ \Omega$，由理想方波本振驱动。求其线性电压变频增益倍数（保留两位小数）。
          answer: 3.82
          tolerance: 0.05
          hint: 代入 $G_v = \frac{2}{\pi} g_m R_D$，注意 $15\text{ mS} = 0.015\text{ S}$。
          explain: $G_v = (2/\pi) \times 0.015 \times 400 = 12/\pi \approx 3.82$（约 $11.6\text{ dB}$）。
      - item:
          id: q-gilbert-switch-speed
          type: choice
          prompt: 在有源吉尔伯特混频器中，为什么工程师总是希望本振驱动波形的过零边沿越陡峭（切换越快）越好？
          options:
            - text: 缩短两管同导通窗口以压低开关噪声
              correct: true
            - text: 边沿越陡峭，混频器的电源供电电压就会自动翻倍
              why: 驱动边沿陡度只影响开关状态切换速度，不会改变芯片的直流电源电压。
            - text: 缓慢正弦本振会让混频器变成纯电阻，完全无法产生差频
              why: 正弦本振仍可混频，只是两只开关管长时间同时处于放大区，使噪声大幅升高、增益下降。
            - text: 陡峭边沿可以让双平衡混频器不再需要负载电阻 $R_D$
              why: 电流信号依然需要经由负载电阻或跨阻级转换成输出电压。
          hint: 当差分开关对里两只管子都处于导通放大状态而不是一开一关时，它们的沟道噪声会去哪里？
          explain: 只有一只管子导通时开关对相当于共栅级，自身噪声几乎被阻断；而在本振过零两管同时导通的窗口内，开关对变成差分放大器把自身热噪声与 $1/f$ 噪声大量放大到输出端，因此应尽量缩短切换时间。
      - item:
          id: q-gilbert-stack
          type: choice
          prompt: 为什么经典吉尔伯特双平衡混频器在 1.0 V 以下先进深亚微米 CMOS 工艺中设计越来越困难？
          options:
            - text: 四层竖直堆叠导致低压下电压裕度不足
              correct: true
            - text: 先进 CMOS 工艺里无法制造出多晶硅负载电阻
              why: 先进工艺依然提供多晶硅电阻和金属电容，真正卡住的是低电源电压下的直流堆叠空间。
            - text: 短沟道 MOSFET 的特征频率太低，跟不上 2.4 GHz 射频信号
              why: 沟道越短特征频率反而越高（可达数百 GHz），不是速度限制而是电源电压过低。
            - text: 先进工艺不再支持差分电路布局
              why: 差分拓扑在任何 CMOS 工艺中都是标准做法。
          hint: 从电源 $V_{DD}$ 到地数一数吉尔伯特单元串联了几层器件，每层都需要至少多少过驱动电压或压降？
          explain: 尾电流源、跨导对、开关对和负载电阻串联在 $V_{DD}$ 与地之间，低压下各管难以全部维持在饱和区并留出足够线性摆幅，推动了折迭混频器与电流泄放等改进拓扑的诞生。

  - id: mixer-improved-upconv
    chapter: 混频器
    title: 改进混频器拓扑与正交上变频
    minutes: 12
    flow:
      - guess:
          id: g-bleeding-idea
          type: choice
          prompt: 在吉尔伯特混频器里，想把跨导管偏置电流加大以提高跨导 $g_m$ 和变频增益，但电流一大，流过顶部负载电阻 $R_D$ 的直流压降 $I R_D$ 立刻把晶体管挤出饱和区，逼得 $R_D$ 只能变小，增益反而涨不上去。你猜怎样打破这个死结？
          options:
            - text: 在跨导管漏极旁路多余直流，减顶层压降
              correct: true
            - text: 把顶部负载电阻换成零欧姆导线，全部消除直流压降
              why: 负载电阻为零欧姆时输出电压增益也随之归零。
            - text: 断开跨导管的栅极输入，只靠本振自己产生射频增益
              why: 断开射频输入就没有任何有用信号进入混频器。
          explain: 这就是电流泄放（电流注入）技巧：让大直流电流流过下层跨导管以获取高 $g_m$，同时把多余直流电流旁路掉，使上层开关对和 $R_D$ 仅承受小直流电流，于是 $R_D$ 可选大阻值，增益与线性度双双提升。
      - card:
          title: 电流泄放与折迭式改进混频器
          body: |
            破解有源混频器裕度与增益矛盾的两大改进是**电流泄放**与**折迭式混频器**。电流泄放用并联电流源分流跨导管的大部分直流电流：跨导管维持高 $g_m$，开关对与 $R_D$ 只过小直流，既压低开关管 $1/f$ 噪声又允许加大 $R_D$ 提增益。折迭式混频器将跨导级与开关级拆到两条并联直流支路（如 NMOS 跨导配 PMOS 开关），减少竖直堆叠以适配低压；源极退化还可提升线性度。
      - card:
          title: 上变频混频器与正交单边带抑制
          body: |
            发射机中的**上变频混频器（upconversion mixer）**把基带信号 $\cos\omega_{\text{BB}}t$ 搬移到射频载波 $\omega_{\text{LO}}$。若只用单路实混频，$\cos\omega_{\text{BB}}t \cdot \cos\omega_{\text{LO}}t$ 同时生出 $\omega_{\text{LO}} + \omega_{\text{BB}}$（上边带）与 $\omega_{\text{LO}} - \omega_{\text{BB}}$（下边带），其中一个往往是无用镜像边带。为此发射端普遍采用**正交上变频器**：将同相（I）和正交（Q）两路基带分别与相差 $90^\circ$ 的本振 $\cos\omega_{\text{LO}}t$、$\sin\omega_{\text{LO}}t$ 在两个双平衡混频器里相乘再电流相加：
            $$\cos\omega_{\text{BB}}t\cos\omega_{\text{LO}}t - \sin\omega_{\text{BB}}t\sin\omega_{\text{LO}}t = \cos(\omega_{\text{LO}} + \omega_{\text{BB}})t$$
            不需要任何片外滤波器，镜像边带 $\omega_{\text{LO}} - \omega_{\text{BB}}$ 在加法节点就自动抵消。实际抑制深度取决于 I/Q 两路的幅度与相位匹配精度。
      - item:
          id: q-bleeding-benefit
          type: choice
          prompt: 在吉尔伯特混频器的跨导管漏极加入电流泄放支路后，下面哪项效果不会出现？
          options:
            - text: 流过开关对和负载电阻的直流电流减小，允许使用更大的 $R_D$
              why: 这是电流泄放最直接的好处，能在相同压降预算下换取更高增益。
            - text: 开关对直流偏置电流变小，有助于降低开关管的 1/f 闪烁噪声注入
              why: 开关对的 $1/f$ 噪声电流随流过开关管的直流电流减小而降低，是电流泄放的重要优势。
            - text: 下层跨导管的直流电流与跨导 $g_m$ 得以保持在较高水平
              why: 泄放电流经跨导管流向地，因此跨导管维持高电流和高 $g_m$。
            - text: 芯片的总直流供电电流显著下降到原来的十分之一
              correct: true
          hint: 泄放支路的直流电流从电源流出、经跨导管流回地，芯片总供电电流减少了吗？
          explain: 电流泄放改变了直流电流在上层开关对与旁路支路之间的分配，跨导管总电流并未减少，因此总直流功耗没有骤降，换取的是更高增益和更低闪烁噪声。
      - card:
          title: 例题：估算电流泄放允许增大的负载电阻
          body: 某吉尔伯特混频器负载电阻 $R_D$ 上允许的最大直流压降为 $0.60\text{ V}$。跨导对每侧支路总直流电流为 $2.0\text{ mA}$。若无泄放与每侧泄放 $1.2\text{ mA}$ 两种情况相比，最大可用 $R_D$ 分别是多少？
          reveal:
            - title: 第 1 步：算无泄放时的最大负载电阻
              body: |
                $2.0\text{ mA}$ 全部流过 $R_D$，最大电阻 $R_{D,\text{no}} = 0.60 / (2.0\times 10^{-3}) = 300\ \Omega$。
            - title: 第 2 步：算泄放 1.2 mA 后的最大负载电阻
              body: |
                流过 $R_D$ 的电流降为 $2.0 - 1.2 = 0.8\text{ mA}$，于是 $R_{D,\text{bleed}} = 0.60 / (0.8\times 10^{-3}) = 750\ \Omega$，在保持 $g_m$ 不变的前提下使可用 $R_D$ 和变频增益放大了 2.5 倍。
      - item:
          id: q-bleeding-rd
          type: number
          prompt: 某混频器每侧负载电阻允许的最大直流压降为 $0.50\text{ V}$，下层跨导管每侧偏置电流为 $2.5\text{ mA}$。加入电流泄放支路每侧分流走 $1.5\text{ mA}$ 后，负载电阻 $R_D$ 最大可选多少 Ω？
          answer: 500
          tolerance: 5
          unit: Ω
          hint: 算一下还剩多少毫安直流电流真正流过负载电阻 $R_D$，再用 $0.50\text{ V}$ 除以它。
          explain: 流过 $R_D$ 的电流为 $2.5 - 1.5 = 1.0\text{ mA}$，因此 $R_D = 0.50\text{ V} / 1.0\text{ mA} = 500\ \Omega$。
      - item:
          id: q-folded-why
          type: choice
          prompt: 折迭式有源混频器相比传统吉尔伯特堆叠结构，最主要解决的是什么工程瓶颈？
          options:
            - text: 低电源电压下多管竖直堆叠导致电压裕度不足
              correct: true
            - text: 传统吉尔伯特结构无法使用差分射频输入
              why: 传统吉尔伯特单元本身就是标准差分射频输入。
            - text: 折迭式混频器完全不需要本振开关信号
              why: 折迭式结构依然用本振驱动开关对完成混频。
            - text: 折迭式结构把所有射频损耗变成了零分贝
              why: 折迭式结构只是重排直流支路以释放电压裕度，并不能消除热噪声与寄生效损耗。
          hint: 把跨导管和开关对从“上下串联共享一股电流”改成“并联折迭各自走支路”，电源到地之间少了什么？
          explain: 折迭式混频器把跨导级与开关级拆到两条并联直流支路中，大幅减少竖直堆叠的管子层数，从而在低压 CMOS 工艺下恢复充裕的信号摆幅。
      - item:
          id: q-iq-upconv
          type: choice
          prompt: 发射机采用正交（I/Q）上变频混频器而非单路实混频器的核心原因是？
          options:
            - text: 两路正交相加可抵消镜像边带并承载 I/Q 调制
              correct: true
            - text: 正交上变频器可以把发射机输出功率提高十倍而不用功放
              why: 混频器只负责频率搬移与边带选择，大功率输出依然由功率放大器提供。
            - text: 单路实混频器无法把基带信号搬移到 GHz 频段
              why: 单路实混频器也能搬移到 GHz，只是会同时产生对称的上下两个边带，浪费频谱或难以滤除。
            - text: 正交上变频器只需要一个直流恒压源，不再需要高频本振
              why: 正交上变频需要相差 $90^\circ$ 的两路高频正交本振信号。
          hint: 回想 $\cos A\cos B - \sin A\sin B = \cos(A+B)$，两路混频输出相加时哪一个边带被消掉了？
          explain: 正交混频利用三角恒等式使镜像边带反相相消、目标边带同相叠加，同时还能独立承载 I 路与 Q 路两维调制信息（如 QAM/OFDM）。

  - id: oscillator-lc-topologies
    chapter: 压控振荡器与相位噪声
    title: LC 谐振腔、交叉耦合负阻与三点式振荡器
    minutes: 13
    flow:
      - guess:
          id: g-lc-decay
          type: choice
          prompt: 给片上一个真实的电感 $L$ 和电容 $C$ 充上电并组成闭合回路，如果旁边不接任何有源晶体管，里面的高频振荡电压能永远持续下去吗？
          options:
            - text: 能，因为电感和电容只是把磁场能与电场能来回倒手，不会消耗能量
              why: 理想无损元件如此，但真实片上电感金属电阻和衬底损耗每周期都在把能量变成热量。
            - text: 不能，谐振腔自身损耗电阻会让振荡幅度按指数迅速衰减归零
              correct: true
            - text: 会越振越大，直到把电容击穿
              why: 没有外部能源补充能量，无源 RLC 回路振幅只会单调衰减。
          explain: 真实 LC 谐振腔总存在并联等效损耗电阻 $R_p$；要维持稳定等幅振荡，必须接上由电源供电的有源电路，产生等效负阻持续补回每个周期耗掉的能量。
      - card:
          title: 射频振荡器指标与 LC 谐振腔损耗
          body: |
            射频收发机的本振由高频振荡器产生，核心考核指标包括中心频率、频率调谐范围、输出摆幅、直流功耗、相位噪声以及电源/负载变动引起的频推与频拉。电感 $L$ 与电容 $C$ 构成的并联谐振腔在频率：
            $$f_0 = \frac{1}{2\pi\sqrt{LC}}$$
            处阻抗最大且呈纯阻性。储能元件单周期储存能量与耗散能量之比的 $2\pi$ 倍称为**品质因数（quality factor, $Q$）**。若电感串联损耗电阻为 $R_s$，则电感 $Q = \omega_0 L / R_s$，谐振时可等效为并联损耗电阻 $R_p \approx Q\omega_0 L$。$Q$ 越高，$R_p$ 越大，维持振荡所需的功耗越低。
      - card:
          title: 交叉耦合负阻振荡器与三点式拓扑
          body: |
            补偿谐振腔损耗最常用**交叉耦合振荡器**：一对差分管漏栅交叉正反馈，产生等效**负阻** $R_{\text{neg}} = -2/g_m$（单边为 $-1/g_m$）。按巴克豪森判据，起振条件为：
            $$g_m R_p > 1$$
            工程上常留 2–3 倍裕量抗温漂，起振后靠大信号限幅稳幅；叠加互补 PMOS 对可在同电流下倍增跨导。另一类是三点式振荡器，用电容分压（科尔皮兹 Colpitts）或电感分压（哈特莱 Hartley）向单管同相反馈。
      - item:
          id: q-neg-r-startup
          type: choice
          prompt: 在交叉耦合 LC 振荡器中，如果单边谐振腔并联等效损耗电阻为 $R_p$，为什么设计起振条件要求 $g_m R_p$ 明显大于 1（例如取 2 到 3）？
          options:
            - text: 负阻提供的能量注入须压过损耗电阻的耗散，并留出余量应对工艺与温度波动
              correct: true
            - text: 只要 $g_m R_p > 1$，振荡频率就会与电感 $L$ 和电容 $C$ 全部无关
              why: 振荡频率主要由 $1/(2\pi\sqrt{LC})$ 决定，$g_m R_p > 1$ 决定的是环路增益能否起振。
            - text: $g_m R_p$ 越大，谐振腔里的电感串联电阻就会自动变成零
              why: 电感的物理损耗电阻由金属工艺决定，负阻是用直流电源补能抵消它而非消除物理电阻。
            - text: 交叉耦合结构属于负反馈，必须大于 1 才能把所有噪声都抵消掉
              why: 交叉耦合构成的是正反馈环路，正是靠环路增益大于 1 从噪声里建立自持振荡。
          hint: 谐振腔损耗消耗能量，交叉耦合对向腔内注入能量，两者刚好打平还是必须略微盈余才能在温漂下可靠起振？
          explain: $g_m R_p = 1$ 仅对应能量收支刚好平衡的起振门槛；考虑到工艺偏差、升温跨导下降与电感 $Q$ 值退化，工程上通常设小信号环路增益为 2–3，待起振后靠晶体管大信号非线性自动稳幅。
      - card:
          title: 例题：算 LC 振荡器的谐振频率、$R_p$ 与最小起振跨导
          body: 某片上交叉耦合 LC 振荡器单边电感 $L = 1.6\text{ nH}$（品质因数 $Q = 10$），总谐振电容 $C = 1.0\text{ pF}$。求振荡频率 $f_0$、单边等效并联损耗电阻 $R_p$，以及刚好起振所需的最小跨导 $g_{m,\min}$。
          reveal:
            - title: 第 1 步：代入 LC 谐振频率公式
              body: |
                $$f_0 = \frac{1}{2\pi\sqrt{1.6\times 10^{-9}\times 1.0\times 10^{-12}}} \approx 3.98\text{ GHz}$$
            - title: 第 2 步：求感抗与等效并联电阻 $R_p$
              body: |
                $\omega_0 L = 2\pi\times 3.98\times 10^9 \times 1.6\times 10^{-9} \approx 40.0\ \Omega$，故 $R_p = Q\omega_0 L = 10 \times 40.0 = 400\ \Omega$。
            - title: 第 3 步：由起振条件 $g_m R_p = 1$ 求最小跨导
              body: |
                $$g_{m,\min} = \frac{1}{R_p} = \frac{1}{400} = 2.5\text{ mS}$$
                若取 2 倍起振裕量，则需 $g_m = 5.0\text{ mS}$。
      - item:
          id: q-lc-freq
          type: number
          prompt: 某片上 LC 振荡器的等效电感 $L = 1.0\text{ nH}$，等效总电容 $C = 1.0\text{ pF}$。求它的振荡频率 $f_0$ 是多少 GHz（保留两位小数）？
          answer: 5.03
          tolerance: 0.05
          unit: GHz
          hint: 把 $L = 10^{-9}\text{ H}$、$C = 10^{-12}\text{ F}$ 代入 $f_0 = 1/(2\pi\sqrt{LC})$ 算出的是多少吉赫？
          explain: $\sqrt{LC} = \sqrt{10^{-21}} \approx 3.162\times 10^{-11}\text{ s}$，故 $f_0 = 1 / (2\pi \times 3.162\times 10^{-11}) \approx 5.033\text{ GHz} \approx 5.03\text{ GHz}$。
      - item:
          id: q-lc-gm-min
          type: number
          prompt: 某交叉耦合 LC 振荡器单边谐振腔的等效并联损耗电阻 $R_p = 250\ \Omega$。为了获得 2 倍起振裕量（即 $g_m R_p = 2$），单只交叉耦合管的跨导 $g_m$ 应设计为多少 mS？
          answer: 8
          tolerance: 0.2
          unit: mS
          hint: 由 $g_m \times 250\ \Omega = 2$ 反解出的跨导是多少毫西门子？
          explain: $g_m = 2 / 250\ \Omega = 0.008\text{ S} = 8.0\text{ mS}$。
      - item:
          id: q-osc-topo-match
          type: match
          prompt: 将射频振荡器拓扑或元件特性与对应的工作原理配对。
          pairs:
            - [交叉耦合振荡器, 差分正反馈产生等效负阻，对称性好、最适合片上 CMOS 集成]
            - [科尔皮兹（Colpitts）振荡器, 通过串联电容分压网络把谐振腔电压同相反馈至单管输入]
            - [哈特莱（Hartley）振荡器, 通过抽头电感分压网络提供同相反馈，属电感三点式]
            - [互补交叉耦合结构, 同时使用 NMOS 与 PMOS 负阻对，同电流下跨导与摆幅更高]
          hint: 区分哪一种靠差分交叉正反馈、哪一种靠电容分压、哪一种靠电感分压、哪一种叠加 PMOS？
          explain: 交叉耦合适合全集成差分本振，互补结构进一步提高电流利用效率；科尔皮兹与哈特莱则分别是经典的电容与电感三点式反馈拓扑。

  - id: vco-tuning-quadrature
    chapter: 压控振荡器与相位噪声
    title: 压控振荡器、宽调谐与正交本振
    minutes: 12
    flow:
      - guess:
          id: g-vco-wide-kvco
          type: choice
          prompt: 为了让芯片覆盖很宽的无线频段（同时抵消工艺偏差），如果只靠一颗大变容管让电压从 0 V 变到 1 V 就把频率拉宽 1000 MHz（极高灵敏度 $K_{\text{VCO}}$），你猜会带来什么严重副作用？
          options:
            - text: 控制电压线上哪怕 1 mV 的微弱噪声也会变成 1 MHz 频率抖动，严重恶化相位噪声
              correct: true
            - text: 频率灵敏度太高会让电感在电路里失去储能能力
              why: 变容管只改变总电容，不破坏电感储能，真正恶化的是控制线噪声到频率抖动的放大倍数。
            - text: 变容管会把输出频率固定死，完全不能随电压变化
              why: 高 $K_{\text{VCO}}$ 意味着频率对控制电压过于敏感而非固定死。
          explain: 压控增益 $K_{\text{VCO}}$ 就像控制线噪声的放大器：把宽调谐全压在一颗连续变容管上会让 $K_{\text{VCO}}$ 过大，使控制电压和电源的微小纹波直接转成剧烈相位抖动。
      - card:
          title: 压控振荡器、变容管与宽调谐电容阵
          body: |
            把 LC 谐振腔里的部分电容换成随直流控制电压 $V_{\text{ctrl}}$ 连续变化的**变容管（varactor）**，就得到**压控振荡器（voltage-controlled oscillator, VCO）**。在小范围内，输出频率近似线性跟随控制电压：
            $$f_{\text{out}} = f_0 + K_{\text{VCO}} V_{\text{ctrl}}$$
            其中 $K_{\text{VCO}} = \Delta f / \Delta V_{\text{ctrl}}$（单位 MHz/V）称压控增益。最大与最小频率之比满足 $f_{\max}/f_{\min} = \sqrt{C_{\max}/C_{\min}}$（注意寄生固定电容会压缩实际调谐比）。为兼顾宽覆盖范围与低 $K_{\text{VCO}}$（防噪声敏感），现代片上 LC VCO 几乎都采用**分段调谐**：先由一组数字**可切换电容阵列**切出多条重叠子频带做粗调，再由小尺寸变容管在选定子带内做精细连续锁定。
      - card:
          title: 本振缓冲接口与正交（I/Q）本振产生
          body: |
            VCO 谐振腔对负载电容高度敏感，须在 VCO 与混频器间插入**本振缓冲器**，隔离混频开关非线性电容（防负载频拉）并将正弦整成陡峭方波。正交收发机所需的 $0^\circ/90^\circ$ I/Q 本振有三种主流方案：单台 VCO 运行在 $2f_{\text{LO}}$ 经主从二分频器输出精准四相时钟（最常用，兼避本振牵引）；两台相同 VCO 互相弱耦合构成**正交振荡器（QVCO）**；或采用无源多相 RC 网络分相。
      - item:
          id: q-cap-bank-why
          type: choice
          prompt: 现代 CMOS LC 压控振荡器为什么普遍用“数字可切换电容阵列粗调 + 小变容管细调”，而不是单靠一颗超大变容管覆盖整个频段？
          options:
            - text: 兼顾宽频段覆盖与每条子带的低 $K_{\text{VCO}}$
              correct: true
            - text: 可切换电容阵列不需要任何数字控制位就能自动扫描频率
              why: 可切换电容阵列由数字校准状态机输出控制字（如 4–6 bit）切换。
            - text: 变容管只能把频率调高，必须靠可切换电容才能把频率调低
              why: 变容管本身可在最小与最大电容之间双向连续调谐，分段是为了降低连续调谐斜率 $K_{\text{VCO}}$。
            - text: 可切换电容阵列没有串联导通电阻，能把谐振腔 $Q$ 值提升到无穷大
              why: 开关管本身存在导通电阻 $R_{\text{on}}$，同样需要在尺寸与寄生电容间折中以维持高 $Q$。
          hint: 把一条很陡的单一调谐曲线拆成 16 条平缓的重叠短曲线后，总频率范围和单条曲线斜率 $K_{\text{VCO}}$ 各自怎么变？
          explain: 分段调谐把总覆盖宽度分配给多条斜率平缓的子带，使实际锁定时的连续压控增益 $K_{\text{VCO}}$ 缩小几倍甚至十几倍，显著降低控制电压噪声引起的相位抖动。
      - card:
          title: 例题：计算 VCO 调谐范围与压控增益
          body: 某 LC VCO 的谐振电感固定，等效总电容在控制电压从 $0.2\text{ V}$ 升到 $1.2\text{ V}$ 时由 $1.44\text{ pF}$ 降到 $1.00\text{ pF}$，已知最低振荡频率为 $2.00\text{ GHz}$。求最高频率与平均压控增益 $K_{\text{VCO}}$。
          reveal:
            - title: 第 1 步：由电容比开平方求最高频率
              body: |
                $$\frac{f_{\max}}{f_{\min}} = \sqrt{\frac{C_{\max}}{C_{\min}}} = \sqrt{\frac{1.44}{1.00}} = 1.20$$
                因此 $f_{\max} = 2.00 \times 1.20 = 2.40\text{ GHz}$。
            - title: 第 2 步：求平均压控增益 $K_{\text{VCO}}$
              body: |
                $$K_{\text{VCO}} = \frac{2400 - 2000\text{ MHz}}{1.2 - 0.2\text{ V}} = 400\text{ MHz/V}$$
      - item:
          id: q-vco-fmax
          type: number
          prompt: 某 LC VCO 的最低振荡频率为 $f_{\min} = 2.00\text{ GHz}$，当总调谐电容比值 $C_{\max}/C_{\min} = 1.69$ 时，它的最高振荡频率 $f_{\max}$ 是多少 GHz（保留两位小数）？
          answer: 2.60
          tolerance: 0.02
          unit: GHz
          hint: 振荡频率与总电容的平方根成反比，$\sqrt{1.69}$ 等于多少？
          explain: $f_{\max} = f_{\min}\sqrt{C_{\max}/C_{\min}} = 2.00 \times \sqrt{1.69} = 2.00 \times 1.30 = 2.60\text{ GHz}$。
      - item:
          id: q-vco-kvco
          type: number
          prompt: 某 VCO 的控制电压 $V_{\text{ctrl}}$ 从 $0.4\text{ V}$ 升高到 $1.0\text{ V}$ 时，输出频率从 $2.40\text{ GHz}$ 线性升高到 $2.52\text{ GHz}$。求它的压控增益 $K_{\text{VCO}}$ 是多少 MHz/V？
          answer: 200
          tolerance: 2
          unit: MHz/V
          hint: 先把频率变化量换算成 MHz，再除以控制电压变化量是多少？
          explain: $\Delta f = 2520 - 2400 = 120\text{ MHz}$，$\Delta V = 1.0 - 0.4 = 0.6\text{ V}$，故 $K_{\text{VCO}} = 120 / 0.6 = 200\text{ MHz/V}$。
      - item:
          id: q-iq-lo-div2
          type: choice
          prompt: 相比直接用两台互相耦合的正交 VCO（QVCO），让单台 VCO 工作在 $2f_{\text{LO}}$ 再经二分频器产生 I/Q 正交本振的突出优点是什么？
          options:
            - text: 省电感、避牵引且二分频输出精准正交
              correct: true
            - text: 工作在 2 倍频率的 VCO 完全不需要电感和电容
              why: $2f_{\text{LO}}$ VCO 依然是 LC 振荡器，反而因为频率翻倍，所需电感更小更省面积。
            - text: 二分频器能把 VCO 的直流功耗降低到零毫瓦
              why: 高速二分频器本身会额外消耗一部分高频动态功耗，这是换取高精度正交与防牵引的代价。
            - text: 这种方式可以把输出信号频率翻倍到 $4f_{\text{LO}}$
              why: 二分频把 $2f_{\text{LO}}$ 降为 $f_{\text{LO}}$，同时利用主从触发器的正反时钟沿天然得到 $0^\circ/90^\circ/180^\circ/270^\circ$ 四相时钟。
          hint: 从片上电感数量、发射功放牵引和主从触发器输出相位精度三个角度对比。
          explain: $2f_{\text{LO}}$ 加二分频省掉第二套大面积电感，让 VCO 远离功放发射频率防牵引，并且主从触发器在 50% 占空比时钟下直接输出精准 $90^\circ$ 正交本振。

  - id: vco-phase-noise
    chapter: 压控振荡器与相位噪声
    title: 相位噪声、倒易混频与利森公式
    minutes: 13
    flow:
      - guess:
          id: g-pn-recip
          type: choice
          prompt: 如果接收机本振不是一根笔直细锐的单频谱线，而在两侧拖着微微翘起的噪声“裙边”（相位噪声）。当有用信道旁边紧挨着一个比有用信号强 60 dB 的邻道干扰台时，你猜这个本振裙边会捅出什么娄子？
          options:
            - text: 强邻道干扰与本振裙边混频，把大量噪声搬进有用信道，把弱信号淹没
              correct: true
            - text: 强邻道干扰只会把本振频率吹得更干净，提高信噪比
              why: 混频是卷积运算，强干扰卷积上本振相位噪声裙边，会在有用中频处叠加出一片宽带噪声。
            - text: 本振裙边只影响发射机，对接收机没有任何影响
              why: 接收机同样受本振裙边影响，这种邻道下变频抬高底噪的现象正是倒易混频。
          explain: 频域里混频相当于两者的频谱卷积：即使有用信号本身很弱，强邻道信号与本振偏离 $\Delta f$ 处的相位噪声裙边混频，照样会精准落进有用中频并淹没有用信号。
      - card:
          title: 相位噪声定义（dBc/Hz）与倒易混频
          body: |
            真实器件噪声会随机扰动振荡相位，使单频谱线向两侧展宽成裙边，称为**相位噪声（phase noise）**。偏离载波 $\Delta f$ 处、1 Hz 带宽内单边带噪声与载波功率之比记作 $\mathcal{L}(\Delta f)$，单位 **dBc/Hz**（如 $-120\text{ dBc/Hz @ 1 MHz}$ 表示该处 1 Hz 噪声比载波低 120 dB）。若 $\Delta f$ 处存在强邻道阻塞 $P_{\text{blk}}$，它与本振裙边混频落入带宽 $B$ 内的噪声为：
            $$P_{n,\text{rec}} = P_{\text{blk}} + \mathcal{L}(\Delta f) + 10\lg B$$
            这一机制叫**倒易混频（reciprocal mixing）**。
      - card:
          title: 利森公式与降低相位噪声的方向
          body: |
            LC 振荡器的单边带相位噪声可用经典的**利森公式（Leeson's formula）**刻画：
            $$\mathcal{L}(\Delta\omega) = 10\lg\left[\frac{2FkT}{P_{\text{sig}}}\left(1 + \left(\frac{\omega_0}{2Q\Delta\omega}\right)^2\right)\left(1 + \frac{\omega_{1/f^3}}{|\Delta\omega|}\right)\right]$$
            其中 $P_{\text{sig}}$ 为载波信号功率，$Q$ 为谐振腔有载品质因数，$F$ 为有源器件有效噪声因子。在双对数坐标下，曲线从近载波到远载波依次呈现三个区域：极近载波的 $1/f^3$ 区（斜率 $-30\text{ dB/dec}$，由器件 $1/f$ 闪烁噪声上变频产生）、中频偏的 $1/f^2$ 热噪声区（斜率 $-20\text{ dB/dec}$，频偏翻倍相噪降 6 dB），以及远频偏的平坦白噪声基底。公式清晰指明三大降噪抓手：提高谐振腔 $Q$（$Q$ 翻倍，$1/f^2$ 区相噪降 6 dB）、增大载波功率/摆幅 $P_{\text{sig}}$、降低有源器件噪声因子 $F$。
      - item:
          id: q-leeson-slope
          type: choice
          prompt: 在 LC 振荡器利森相位噪声曲线的 $1/f^2$（热噪声主导）频偏区域内，若把谐振腔品质因数 $Q$ 提高为原来的 2 倍（其他条件不变），相位噪声会如何变化？
          options:
            - text: 改善（降低）约 6 dB
              correct: true
            - text: 改善（降低）约 3 dB
              why: 利森公式中 $Q$ 以 $1/Q^2$ 的平方反比出现，$Q$ 翻倍使噪声功率降为 $1/4$，即 $-6\text{ dB}$ 而非 $-3\text{ dB}$。
            - text: 恶化（升高）约 6 dB
              why: 更高 $Q$ 值意味着谐振腔选频越尖锐、对噪声滤波越强，相位噪声会显著降低。
            - text: 基本保持不变，因为 $Q$ 值只影响远端白噪声基底
              why: $Q$ 值恰恰主要作用于 $1/f^2$ 与 $1/f^3$ 滚降区，远端白噪声基底才与 $Q$ 无关。
          hint: 看利森公式里 $(\omega_0 / 2Q\Delta\omega)^2$ 这一项，$Q$ 变成 $2Q$ 后括号平方项变成原来的几分之一？
          explain: 在 $1/f^2$ 区 $\mathcal{L}(\Delta\omega) \propto 1/Q^2$，$Q$ 提高 2 倍使噪声功率变为原来的 $1/4$，$10\lg(1/4) \approx -6.02\text{ dB}$。
      - card:
          title: 例题：相位噪声频偏换算与倒易混频计算
          body: 某本振在 $1/f^2$ 区满足 $\mathcal{L}(1\text{ MHz}) = -112\text{ dBc/Hz}$。(1) 求偏离载波 $10\text{ MHz}$ 处的相位噪声；(2) 若偏离 1 MHz 处存在 $-35\text{ dBm}$ 强阻塞信号，本振在该频偏处的相噪为 $-125\text{ dBc/Hz}$，信道带宽 $B = 1\text{ MHz}$，求倒易混频落入信道内的噪声功率。
          reveal:
            - title: 第 1 步：按 -20 dB/十倍频推算 10 MHz 处相噪
              body: |
                $1/f^2$ 区频偏增大 10 倍，噪声功率降为 $1/100$（$-20\text{ dB}$），因此：
                $$\mathcal{L}(10\text{ MHz}) = -112 - 20 = -132\text{ dBc/Hz}$$
            - title: 第 2 步：算倒易混频落入 1 MHz 信道的总噪声功率
              body: |
                $10\lg(10^6) = 60\text{ dB}\cdot\text{Hz}$，故落入有用信道的噪声功率为：
                $$P_{n,\text{rec}} = -35 + (-125) + 60 = -100\text{ dBm}$$
                如果有用信号只有 $-95\text{ dBm}$，信噪比就被压到仅剩 5 dB。
      - item:
          id: q-pn-10x
          type: number
          prompt: 某 LC VCO 在热噪声主导的 $1/f^2$ 区内，测得偏离载波 1 MHz 处的相位噪声为 $-118\text{ dBc/Hz}$。估算偏离载波 10 MHz 处（仍在 $1/f^2$ 区内）的相位噪声是多少 dBc/Hz？
          answer: -138
          tolerance: 0.5
          unit: dBc/Hz
          hint: 在 $1/f^2$ 区域内，频偏每扩大 10 倍，相位噪声会下降多少 dB？
          explain: $1/f^2$ 区域斜率为 $-20\text{ dB/dec}$，频偏由 1 MHz 增至 10 MHz 下降 20 dB，得 $-118 - 20 = -138\text{ dBc/Hz}$。
      - item:
          id: q-recip-noise
          type: number
          prompt: 某接收机信道带宽 $B = 1\text{ MHz}$（$10\lg B = 60\text{ dB}\cdot\text{Hz}$）。在偏离载波 2 MHz 处存在功率为 $-30\text{ dBm}$ 的强邻道干扰，本振在 2 MHz 频偏处的相位噪声为 $-122\text{ dBc/Hz}$。求倒易混频落入有用信道内的总噪声功率是多少 dBm？
          answer: -92
          tolerance: 0.5
          unit: dBm
          hint: 把邻道干扰功率、本振在该频偏的 dBc/Hz 相噪值，以及信道带宽的 $10\lg B$ 直接相加是多少？
          explain: $P_{n,\text{rec}} = -30 + (-122) + 60 = -92\text{ dBm}$。
      - item:
          id: q-pn-regions
          type: match
          prompt: 将利森相位噪声曲线的三个频偏区域与对应的物理来源或斜率配对。
          pairs:
            - ["近载波 1/f³ 区", "斜率 -30 dB/dec，由有源器件 1/f 闪烁噪声上变频导致"]
            - ["中频偏 1/f² 区", "斜率 -20 dB/dec，由谐振腔与晶体管热噪声经积分塑造而成"]
            - ["远频偏平坦区", "白噪声基底，取决于输出缓冲与器件热噪声，与 Q 值无关"]
          hint: 按频偏从近到远，斜率依次为 -30 dB/dec、-20 dB/dec、0 dB/dec，分别对应哪种物理噪声？
          explain: 利森公式把闪烁噪声上变频（$1/f^3$）、热噪声经谐振腔整形（$1/f^2$）和远端白噪声底统一在同一条谱线中。

  - id: pll-type1-type2
    chapter: 锁相环频率综合器
    title: 锁相环原理、I 型与 II 型电荷泵环路
    minutes: 13
    flow:
      - guess:
          id: g-pll-lock
          type: choice
          prompt: 自由运行的片上 LC 压控振荡器只要温度升高几度，频率就会飘走好几兆赫，根本对不准无线信道。工程师把 VCO 放进负反馈环路里，拿它跟一颗极稳的外部石英晶体时钟做相位比较，持续调节 VCO 控制电压。锁定后两者的频率关系是怎样的？
          options:
            - text: 两者频率严格相等（或成精确整数倍），且相位差保持恒定
              correct: true
            - text: VCO 频率会比参考晶振随机快慢波动 5%
              why: 一旦频率有哪怕极小偏差，相位差就会随时间不断累积，反馈会立刻拉回控制电压直到频率严格锁定。
            - text: VCO 停止振荡，直接把参考晶振当作射频输出
              why: 参考晶振通常只有几十 MHz，锁相环靠 VCO 产生 GHz 高频载波并把其稳定度锚定在晶振上。
          explain: 相位是频率对时间的积分：只要两信号相位差保持恒定不变，它们的瞬时频率就必然严格相等，这就是锁相环把 VCO 锚定到晶振稳定度的奥秘。
      - card:
          title: 锁相环基本原理与 I 型锁相环局限
          body: |
            **锁相环（phase-locked loop, PLL）**由鉴相器（PD）、低通环路滤波器（LPF）和压控振荡器构成负反馈闭环。因为相位 $\phi_{\text{out}}(t) = \int 2\pi K_{\text{VCO}} V_{\text{ctrl}}(t)\,dt$，VCO 天然在拉普拉斯域引入一个积分极点 $2\pi K_{\text{VCO}}/s$。最简单的 I 型锁相环用异或门或乘法器作鉴相器配一阶 RC 低通滤波器，环路原点只有一个极点，存在三大局限：第一，VCO 控制电压须由非零静态相位差驱动，无法做到零静态相偏；第二，滤波电容 $C$ 兼顾纹波抑制与环路带宽，彼此掣肘；第三，鉴相器只认相位不认频率，初始频差过大时难以捕捉锁定。
      - card:
          title: II 型电荷泵锁相环与阻尼比稳定
          body: |
            现代芯片多用 **II 型电荷泵锁相环**。数字**鉴频鉴相器（PFD）**同时比对频差与相差，输出 UP/DN 脉冲驱动**电荷泵（CP）**向滤波器充放恒流 $\pm I_{\text{CP}}$。电容 $C_1$ 引入第二个原点极点，消除静态相偏并拓宽捕捉范围；但双原点极点会失稳，须串联电阻 $R_1$ 加稳定零点（并小电容 $C_2 \ll C_1$ 滤纹波）。忽略 $C_2$ 时（$K_{\text{VCO}}$ 单位 Hz/V）：
            $$\omega_n = \sqrt{\frac{I_{\text{CP}} K_{\text{VCO}}}{C_1}}, \qquad \zeta = \frac{1}{2}\omega_n R_1 C_1$$
            常取 $\zeta \approx 0.7\text{–}1.0$ 兼顾速度与稳定。
      - item:
          id: q-type2-r1
          type: choice
          prompt: 在 II 型电荷泵锁相环的环路滤波器中，为什么必须在主积分电容 $C_1$ 上串联一颗电阻 $R_1$？
          options:
            - text: 引入稳定零点，补足双原点极点的相位裕度
              correct: true
            - text: 把直流控制电压衰减掉一半，降低 VCO 的工作频率
              why: 稳态时流入电容 $C_1$ 的平均直流电流为零，$R_1$ 上无直流压降，不衰减控制电压。
            - text: 让电荷泵输出电流变成纯正弦波
              why: 电荷泵依然输出电流脉冲，$R_1$ 的核心作用是在频域提供相移超前的零点以稳定环路。
            - text: 把 II 型锁相环降级回 I 型锁相环，以便产生静态相位误差
              why: 串联 $R_1$ 保留了电容在原点的积分极点，依然是零静态相偏的 II 型环路。
          hint: 电荷泵积分电容与 VCO 频率积分一共在原点贡献了两个极点，相移已达 $180^\circ$，串联 $R_1$ 在传递函数里多出了什么？
          explain: $R_1$ 与 $C_1$ 串联产生零点 $\omega_z = 1/(R_1 C_1)$，在单位增益交越频率前提供正相位提升，使环路获得充足的相位裕度（阻尼比 $\zeta$ 正比于 $R_1$）。
      - card:
          title: 例题：计算 II 型电荷泵锁相环的自然频率与阻尼比
          body: 某无分频（$N = 1$）II 型电荷泵锁相环设计值为：$I_{\text{CP}} = 200\ \mu\text{A}$，$K_{\text{VCO}} = 80\text{ MHz/V}$，$C_1 = 160\text{ pF}$，$R_1 = 1.0\text{ k}\Omega$。求自然角频率 $\omega_n$ 与阻尼比 $\zeta$。
          reveal:
            - title: 第 1 步：代入公式求自然角频率 $\omega_n$
              body: |
                $$\omega_n = \sqrt{\frac{200\times 10^{-6} \times 80\times 10^6}{160\times 10^{-12}}} = \sqrt{10^{14}} = 10\text{ Mrad/s}$$
            - title: 第 2 步：代入公式求阻尼比 $\zeta$
              body: |
                $$\zeta = \frac{1}{2}\omega_n R_1 C_1 = 0.5 \times 10^7 \times 10^3 \times 160\times 10^{-12} = 0.80$$
                阻尼比 0.80 落在理想稳定区间，阶跃建立平滑且过冲很小。
      - item:
          id: q-pll-wn
          type: number
          prompt: 某无分频（$N = 1$）II 型电荷泵锁相环，$I_{\text{CP}} = 100\ \mu\text{A}$，$K_{\text{VCO}} = 90\text{ MHz/V}$，$C_1 = 250\text{ pF}$。求闭环自然角频率 $\omega_n$ 是多少 Mrad/s（保留一位小数）？
          answer: 6.0
          tolerance: 0.1
          unit: Mrad/s
          hint: 代入 $\omega_n = \sqrt{I_{\text{CP}} K_{\text{VCO}} / C_1}$（$K_{\text{VCO}}$ 用 Hz/V），开根号后换算成 Mrad/s。
          explain: $I_{\text{CP}} K_{\text{VCO}} / C_1 = (10^{-4} \times 9\times 10^7) / (2.5\times 10^{-10}) = 3.6\times 10^{13}$，开平方得 $\omega_n = 6.0\times 10^6\text{ rad/s} = 6.0\text{ Mrad/s}$。
      - item:
          id: q-pll-zeta
          type: number
          prompt: 某 II 型电荷泵锁相环自然角频率 $\omega_n = 6.0\text{ Mrad/s}$，主积分电容 $C_1 = 250\text{ pF}$，串联稳定电阻 $R_1 = 1.0\text{ k}\Omega$。求该环路的阻尼比 $\zeta$（保留两位小数）。
          answer: 0.75
          tolerance: 0.02
          hint: 把 $\omega_n$、$R_1$、$C_1$ 代入 $\zeta = \frac{1}{2}\omega_n R_1 C_1$ 算出的无量纲数是多少？
          explain: $\zeta = 0.5 \times 6.0\times 10^6 \times 1000 \times 250\times 10^{-12} = 0.75$，刚好接近经典最佳阻尼 $0.707$。
      - item:
          id: q-type1-vs-type2
          type: choice
          prompt: 相比 I 型锁相环，采用 PFD 与电荷泵的 II 型锁相环在静态误差和捕捉范围上有什么本质优势？
          options:
            - text: 静态相位误差归零，且具备频率鉴相能力从而大幅拓宽捕捉范围
              correct: true
            - text: 不再需要压控振荡器，只靠电荷泵就能直接输出 GHz 载波
              why: II 型锁相环仍然以 VCO 作为核心射频信号源。
            - text: 环路滤波器不再需要任何电容元件
              why: 电荷泵必须配合主积分电容 $C_1$ 与电阻 $R_1$ 才能将电流脉冲积分成控制电压。
            - text: 闭环只需要单个原点极点，因此永远不需要稳定电阻 $R_1$
              why: II 型环路恰恰有两个原点极点，反而必须加 $R_1$ 提供稳定零点。
          hint: 回想 PFD 为什么叫“鉴频鉴相器”，以及电容在直流下的无穷大阻抗让稳态平均电流等于多少？
          explain: 电容积分在直流处提供无穷大增益使稳态相位差为零，而 PFD 在大频差时连续输出单边拉升/拉降脉冲，能快速把 VCO 拉进锁定区。

  - id: pll-noise-bandwidth
    chapter: 锁相环频率综合器
    title: 锁相环杂散、相位噪声传递与环路带宽
    minutes: 12
    flow:
      - guess:
          id: g-pll-bw-tradeoff
          type: choice
          prompt: 把 VCO 锁进锁相环后，参考晶振通常在近载波处极安静，而片上 VCO 在近载波处噪声很大、远频偏处才慢慢干净。你猜锁相环的环路带宽是设得越宽越好、越窄越好，还是存在一个最佳折中点？
          options:
            - text: 越宽越好，因为环路带宽越宽，任何来源的噪声都会一起归零
              why: 环路带宽太宽会把参考时钟、PFD 与电荷泵的带内噪声放大后全部放进输出端。
            - text: 越窄越好，因为窄到 1 Hz 就能把 VCO 的所有近载波噪声压光
              why: 环路带宽太窄，反馈根本追不上 VCO 的近载波噪声，VCO 自身噪声会原封不动漏出来。
            - text: 存在最佳折中点，刚好设在参考/电荷泵噪声与 VCO 自身噪声的交点附近
              correct: true
          explain: 锁相环对参考/电荷泵噪声呈低通响应，对 VCO 噪声呈高通响应；把环路带宽选在两者交叉频偏处，才能让总积分相位噪声最低。
      - card:
          title: PFD/电荷泵非理想性与参考杂散
          body: |
            理想锁定状态下，电荷泵在每个参考周期都不输出电流，控制电压 $V_{\text{ctrl}}$ 纹丝不动。但实际 PFD 在微小相偏处若出现**死区**（短脉冲来不及开启电荷泵），环路会在零相偏附近失控抖动；工程上通过延长复位路径，让 UP/DN 在锁定瞬间同时发出极短共模脉冲来消除死区。然而只要电荷泵上拉与下拉电流存在失配、开关定时偏差或电容漏电流，每个参考周期 $T_{\text{ref}}$ 都会在 $V_{\text{ctrl}}$ 上激起周期性小纹波。该纹波调制 VCO 频率，在载波两侧 $f_{\text{out}} \pm f_{\text{ref}}$ 处形成离散干扰谱线，称为**参考杂散（reference spur）**，需靠二阶滤波电容 $C_2$ 与精密电荷泵匹配压制。
      - card:
          title: 锁相环相位噪声传递与最优环路带宽
          body: |
            带 $\div N$ 分频器的锁相环闭环后，对不同位置的噪声呈现截然相反的滤波特性：
            - **参考时钟与 PFD/CP 噪声**经历**低通传递**，且在环路带宽 $f_{\text{BW}}$ 内部会被分频比按 $N$ 倍电压（即功率 $N^2$，增加 $20\lg N\text{ dB}$）放大；
            - **VCO 自身相位噪声**经历**高通传递**：低于环路带宽的近载波慢抖动被反馈环路紧紧压平，高于环路带宽的快抖动环路来不及纠正，保持自由运行 VCO 特性。
            因此最优**环路带宽**应选在“放大后的参考/CP 噪声底”与“自由运行 VCO 噪声曲线”的交点附近；同时为保证离散采样环路稳定，带宽通常不超过参考频率的十分之一（$f_{\text{BW}} \le f_{\text{ref}}/10$）。
      - item:
          id: q-pll-noise-tf
          type: choice
          prompt: 锁定后的锁相环对“参考输入噪声”与“VCO 自身相位噪声”的闭环传递特性分别是怎样的？
          options:
            - text: 对参考噪声呈低通特性（带内放大 $20\lg N$），对 VCO 噪声呈高通特性（压低带内）
              correct: true
            - text: 对参考噪声与 VCO 噪声都呈低通特性，把远端高频噪声全部切除
              why: 环路带宽之外反馈失效，VCO 自身远端相位噪声原样透出，呈高通而非低通。
            - text: 对参考噪声呈高通特性，对 VCO 噪声呈低通特性
              why: 恰好反了：慢速参考变化被环路跟踪（低通），慢速 VCO 漂移被环路纠正抑制（高通）。
            - text: 环路把两种噪声都按 $N^2$ 在全频段无差别放大
              why: 环路只在带宽内跟踪并放大参考噪声，同时在带宽内反而大幅压低 VCO 自身噪声。
          hint: 面对缓慢变化（低频偏）的扰动，闭环反馈是忠实跟随参考时钟，还是奋力压制 VCO 自己的漂移？
          explain: 在环路带宽内，输出紧紧跟随参考时钟，因此参考与电荷泵噪声被低通放大 $20\lg N$，而 VCO 自身低频抖动被负反馈高通抑制。
      - card:
          title: 例题：算带内参考相噪抬升与环路带宽约束
          body: 某锁相环参考晶振 $f_{\text{ref}} = 20\text{ MHz}$，输出 $f_{\text{out}} = 2.0\text{ GHz}$，参考源带内相位噪声为 $-145\text{ dBc/Hz}$。忽略电荷泵噪声，求带内折算到输出端的相位噪声底，以及由稳定性约束决定的最大推荐环路带宽。
          reveal:
            - title: 第 1 步：算分频比 $N$ 与 $20\lg N$ 噪声抬升
              body: |
                $N = 2000 / 20 = 100$，因此带内参考噪声被放大 $20\lg(100) = 40\text{ dB}$。
                输出带内相噪底为 $-145 + 40 = -105\text{ dBc/Hz}$。
            - title: 第 2 步：由 $f_{\text{ref}}/10$ 规则估算最大环路带宽
              body: |
                为确保离散采样环路稳定并抑制参考杂散，环路带宽通常取 $f_{\text{BW}} \le f_{\text{ref}}/10 = 2.0\text{ MHz}$。
      - item:
          id: q-pll-20logn
          type: number
          prompt: 某锁相环参考时钟频率 $f_{\text{ref}} = 50\text{ MHz}$，输出频率 $f_{\text{out}} = 2.5\text{ GHz}$。带内参考时钟的相位噪声经锁相环倍频到输出端时，会被抬高多少 dB（保留一位小数）？
          answer: 34.0
          tolerance: 0.2
          unit: dB
          hint: 先算分频比 $N = f_{\text{out}} / f_{\text{ref}}$，再算 $20\lg N$ 是多少分贝？
          explain: $N = 2500 / 50 = 50$，相位噪声放大倍数按 $N^2$ 计算，即 $20\lg(50) \approx 33.98 \approx 34.0\text{ dB}$。
      - item:
          id: q-ref-spur-cause
          type: choice
          prompt: 锁定后的电荷泵锁相环输出频谱中，在距离载波 $\pm f_{\text{ref}}$ 处出现一对尖锐的参考杂散，最直接的电路根源是？
          options:
            - text: 电荷泵失配或漏电在控制线形成周期纹波调制 VCO
              correct: true
            - text: 射频前端的 50 Ω 匹配电感发生了铁芯磁饱和
              why: 片上空心电感无磁芯，参考杂散严格出现在 $\pm f_{\text{ref}}$ 处，直接来自参考周期纹波调制。
            - text: VCO 的谐振电容值超过了 1 pF
              why: 谐振电容大小决定中心频率，不会凭空制造与 $f_{\text{ref}}$ 严格等距的杂散。
            - text: 接收机天线收到了来自相邻基站的强信号
              why: 杂散出现在本振自身输出谱上，源于锁相环内部电荷泵非理想性而非外部天线干扰。
          hint: 什么周期性扰动每经过一个参考周期就给 $V_{\text{ctrl}}$ 轻推一下，从而对载波做了窄带调频？
          explain: 电荷泵上下电流失配、开关时钟馈通和电容漏电在每个参考周期在 $V_{\text{ctrl}}$ 上留下毛刺纹波，经 VCO 压控特性调制成 $\pm f_{\text{ref}}$ 处的参考杂散。
      - item:
          id: q-pfd-deadzone
          type: choice
          prompt: 为了消除鉴频鉴相器（PFD）在接近零相位误差时的“死区”现象，最常用的电路设计技巧是什么？
          options:
            - text: 复位加微小延时，使锁定瞬间输出共模窄脉冲
              correct: true
            - text: 全部去掉电荷泵，把 PFD 输出直接短接到电源
              why: 去掉电荷泵无法向环路滤波器积分充放电，环路无法锁定。
            - text: 把环路滤波器的主电容 $C_1$ 减小到零法拉
              why: 去掉积分电容会破坏 II 型环路结构并放大杂散。
            - text: 强行把参考晶振频率降低 100 倍
              why: 降低参考频率无助于消除 PFD 窄脉冲响应迟缓引起的死区，反而恶化带宽和锁定时间。
          hint: 死区是因为极窄脉冲来不及打开电荷泵开关；怎样让两路脉冲永远不窄于开关开启时间，同时净注入电荷仍为零？
          explain: 在复位与门后加微小延时，使零相偏时 UP 和 DN 同时导通极短时间（等宽抵消），电荷泵始终处于响应区，微弱相位偏差立刻产生净电荷修正。

  - id: integer-n-synthesizer
    chapter: 锁相环频率综合器
    title: 整数 N 与小数 N 频率综合器
    minutes: 13
    flow:
      - guess:
          id: g-intn-step
          type: choice
          prompt: 某无线标准要求本振在 900 MHz 附近每隔 200 kHz 精细切换一个信道。如果用最基本的整数 N 锁相环（$f_{\text{out}} = N f_{\text{ref}}$，$N$ 只能取整数），参考频率 $f_{\text{ref}}$ 最高只能选多少？
          options:
            - text: 最高只能选 200 kHz，这样 $N$ 每加 1 频率才正好步进 200 kHz
              correct: true
            - text: 可以随便选 50 MHz，靠软件把 $N$ 设成 18.004 即可
              why: 普通整数分频器每个周期只能按整数计数，不能直接实现 18.004 这样的固定小数倍分频。
            - text: 必须选 900 MHz，否则分频器无法工作
              why: 参考频率是用来分频比对的低频基准，如果参考本身就是 900 MHz 就不必再合成了。
          explain: 整数 N 综合器的频率分辨率严格等于参考频率 $f_{\text{ref}}$；200 kHz 步进强迫 $f_{\text{ref}} = 200\text{ kHz}$，进而引发窄带宽、慢锁定和高带内噪声等一连串连锁难题。
      - card:
          title: 整数 N 频率综合器、建立时间与分频器
          body: |
            在锁相环反馈路径插入可编程分频器 $\div N$，锁定后输出 $f_{\text{out}} = N f_{\text{ref}}$，这就是**频率综合器（frequency synthesizer）**。若 $N$ 为整数，即**整数 N 综合器**：输出步进（频率分辨率）直接等于 $f_{\text{ref}}$。由于 GHz 频段速度极高，可编程分频器通常用高速电流模逻辑（CML）做前端固定预分频，或采用**双模吞脉冲分频器**（$P/(P+1)$ 预分频器配主计数器与吞脉冲计数器）实现连续整数分频比 $N = NP + S$。当切换信道使 $N$ 跳变时，环路需经历指数包络的**建立时间**（反比于环路带宽 $f_{\text{BW}}$）才能重新锁稳到目标频率精度内。
      - card:
          title: 整数 N 的三大死结与小数 N 综合器思想
          body: |
            窄信道步进（如 200 kHz）使整数 N 综合器面临三重瓶颈：步进压低 $f_{\text{ref}}$；稳定约束 $f_{\text{BW}} \le f_{\text{ref}}/10$ 使带宽过窄、锁定慢且压不住 VCO 噪声；大 $N$ 将带内参考与电荷泵噪声按 $20\lg N$ 剧烈放大。**小数 N 综合器**让分频比在相邻整数间高速切换，时间平均得小数 $N + \alpha$，既可用几十 MHz 高参考频率与宽环路带宽，又保持细步进；切换量化噪声由数字 $\Sigma\Delta$ 调制器推至高频带外再被环路滤除。
      - item:
          id: q-intn-bottle
          type: choice
          prompt: 整数 N 频率综合器在需要极细频率步进（例如 100 kHz）时，为什么往往被迫改用小数 N 分频架构？
          options:
            - text: 细步进迫使参考频率低、带宽窄且大 $N$ 抬噪
              correct: true
            - text: 整数分频器在分频比超过 100 后就会失去数字逻辑功能
              why: 数字计数器可以方便分频几千上万倍，真正的问题是低 $f_{\text{ref}}$ 和高 $N$ 带来的模拟环路与噪声恶化。
            - text: 小数 N 综合器不需要压控振荡器和石英晶振就能产生射频信号
              why: 小数 N 依然以晶振和 VCO 为核心，只是通过动态切换整数分频比实现平均小数分频。
            - text: 整数 N 综合器无法覆盖 1 GHz 以上的频段
              why: 整数 N 完全可以工作在几十 GHz，只是在细步进需求下性能权衡严重恶化。
          hint: 步进等于 $f_{\text{ref}}$，若 $f_{\text{ref}}$ 缩小 100 倍，环路带宽 $f_{\text{ref}}/10$ 和带内噪声放大倍数 $20\lg N$ 分别会怎样变？
          explain: 小数 N 把“信道步进”与“参考频率”全部解耦，使参考频率高出步进几十上百倍，同时改善环路带宽、锁定时间与带内相位噪声。
      - card:
          title: 例题：比较 2.4 GHz 信道网格下的整数 N 与小数 N 指标
          body: 某 2.400–2.480 GHz 无线频段信道步进为 2 MHz。若分别用整数 N 综合器（$f_{\text{ref}} = 2\text{ MHz}$）和小数 N 综合器（$f_{\text{ref}} = 40\text{ MHz}$）覆盖该频段，比较两者的分频比 $N$、最大允许环路带宽（按 $f_{\text{ref}}/10$ 估算）以及带内相噪放大差值。
          reveal:
            - title: 第 1 步：算整数 N 方案的指标
              body: |
                在 2.4 GHz 处 $N_{\text{int}} = 2400 / 2 = 1200$，最大环路带宽 $f_{\text{BW}} \le 200\text{ kHz}$。
            - title: 第 2 步：算小数 N 方案的指标并对比
              body: |
                小数 N 的平均分频比仅 $N_{\text{frac}} = 2400 / 40 = 60$（减小 20 倍），最大环路带宽可放宽到 $4\text{ MHz}$（锁定速度快得多），且带内参考/CP 相位噪声放大倍数直降 $20\lg(20) \approx 26\text{ dB}$。
      - item:
          id: q-intn-nval
          type: number
          prompt: 某 900 MHz 无线通信系统的信道间隔为 200 kHz。若采用整数 N 频率综合器，输出恰好 900 MHz 时所需的分频比 $N$ 是多少？
          answer: 4500
          tolerance: 1
          hint: 整数 N 综合器的参考频率等于信道间隔 200 kHz，900 MHz 是 200 kHz 的多少倍？
          explain: $f_{\text{ref}} = 200\text{ kHz} = 0.2\text{ MHz}$，因此 $N = 900 / 0.2 = 4500$（$20\lg 4500 \approx 73\text{ dB}$ 的带内噪声放大）。
      - item:
          id: q-intn-bw
          type: number
          prompt: 某整数 N 频率综合器的参考频率为 $f_{\text{ref}} = 200\text{ kHz}$。按 $f_{\text{BW}} \le f_{\text{ref}}/10$ 的经验稳定约束，环路带宽最高大约只能取多少 kHz？
          answer: 20
          tolerance: 0.5
          unit: kHz
          hint: 参考频率 200 kHz 除以 10 是多少千赫？
          explain: $f_{\text{BW,max}} \approx 200\text{ kHz} / 10 = 20\text{ kHz}$，如此窄的带宽不仅让切频建立变慢，还很难压制片上 VCO 的近载波噪声。
      - item:
          id: q-fracn-sd
          type: choice
          prompt: 小数 N 频率综合器中引入数字 $\Sigma\Delta$（Sigma-Delta）调制器控制分频比序列的核心作用是什么？
          options:
            - text: 打乱周期切换并把量化噪声推向高频带外，交给环路低通滤波器滤除
              correct: true
            - text: 直接把 VCO 的直流电源电压提高两倍
              why: $\Sigma\Delta$ 调制器是纯数字控制单元，输出整数分频控制字，不改变模拟供电电压。
            - text: 把输出信号从射频载波降频回直流基带
              why: 频率综合器产生的是高频本振，下变频由混频器完成。
            - text: 替代环路滤波器里的所有物理电阻和电容
              why: $\Sigma\Delta$ 恰恰需要配合模拟环路低通滤波器滤除被推到带外的高频量化噪声。
          hint: 如果只按固定周期在 $N$ 和 $N+1$ 之间切换，会产生尖锐的小数杂散；随机化并做高通整形后，噪声能量被挪到哪里去了？
          explain: 周期切换分频比会产生极难滤除的近载波小数杂散；$\Sigma\Delta$ 调制器把切换序列伪随机化并做高通噪声整形，把绝大部分量化噪声推到环路带宽之外被方便滤掉。

  - id: pa-loadline-classes
    chapter: 射频功率放大器
    title: 功率放大器负载线与甲/乙/甲乙/丙类效率
    minutes: 13
    flow:
      - guess:
          id: g-pa-voltage
          type: choice
          prompt: 手机电池和低压 CMOS 射频芯片的电源电压只有 1.8 V，却要往 50 Ω 天线里送出 23 dBm（约 200 mW）的强射频功率。哪怕用上最理想的无损晶体管直接驱动 50 Ω 天线，1.8 V 电源办得到吗？
          options:
            - text: 办得到，只要把晶体管尺寸做大十倍，就能往 50 Ω 负载送出任意大功率
              why: 最大输出电压摆幅被电源电压卡死，再大的晶体管也无法在 50 Ω 上产生超过电源允许的基波电压。
            - text: 办不到，1.8 V 电源直驱 50 Ω 最大仅约 32 mW（15.1 dBm），必须先用匹配网络把 50 Ω 降阻变换成约 8 Ω
              correct: true
            - text: 办得到，因为 23 dBm 换算成线性功率只有 2.3 mW
              why: 23 dBm 等于 $10^{2.3}\text{ mW} \approx 200\text{ mW}$，远超 32 mW。
          explain: 漏极经射频扼流圈供电时，最大不削波正弦峰值摆幅约等于 $V_{DD}$，送入 $R_L$ 的最大平均功率 $P_{\max} = V_{DD}^2/(2R_L)$；低压输出高功率必须借助输出匹配网络把 50 Ω 向下变换到几欧姆最佳负载电阻。
      - card:
          title: 漏极效率、PAE 与低压最佳负载电阻
          body: |
            发射机末级**射频功率放大器（PA）**往往消耗整机一半以上电量，核心效率指标有两个：漏极效率 $\eta = P_{\text{out}}/P_{\text{DC}}$，以及计入驱动输入功率的**功率附加效率（power-added efficiency, PAE）**：
            $$\text{PAE} = \frac{P_{\text{out}} - P_{\text{in}}}{P_{\text{DC}}} = \eta\left(1 - \frac{1}{G}\right)$$
            单端功放漏极通过射频扼流圈（直流短路、射频开路）接电源 $V_{DD}$，最大理想正弦峰值摆幅为 $V_{DD}$（峰峰值 $2V_{DD}$），送入电阻 $R_L$ 的最大输出功率为：
            $$P_{\max} = \frac{V_{DD}^2}{2R_L}$$
            可见在低 $V_{DD}$ 下要输出高功率 $P_{\text{out}}$，必须用阻抗变换网络把 $50\ \Omega$ 天线向下变换成更小的最佳负载电阻 $R_{\text{opt}} = V_{DD}^2/(2P_{\text{out}})$。
      - card:
          title: 导通角与甲、乙、甲乙、丙类射频功放
          body: |
            射频功放负载常接高 $Q$ 谐振网络滤除谐波，管子只需在部分周期导通即可输出正弦波。单周期内导通所占相位角称**导通角**：
            - **甲类（Class A）**：导通角 $360^\circ$，线性最高，理论最高效率 **50%**；
            - **乙类（Class B）**：导通角 $180^\circ$，半周导通，理论最高效率 $\pi/4 \approx \mathbf{78.5\%}$；
            - **甲乙类（Class AB）**：导通角 $180^\circ\text{–}360^\circ$，折中效率与线性度，是主力线性功放；
            - **丙类（Class C）**：导通角 $<180^\circ$，效率趋近 **100%** 但强非线性，适合恒包络。
      - item:
          id: q-pa-ropt-why
          type: choice
          prompt: 低压 CMOS 射频功率放大器（如 $V_{DD} = 1.8\text{ V}$）输出端为什么几乎总要把 50 Ω 天线阻抗向下变换成几欧姆到十几欧姆？
          options:
            - text: 摆幅受 $V_{DD}$ 封顶，降阻 $R_{\text{opt}}$ 才能送高功率
              correct: true
            - text: 50 Ω 电阻在射频下无法承受超过 10 mW 的功率
              why: 50 Ω 天线完全能辐射几十瓦甚至千瓦功率，受限的是低压芯片能提供的最大电压摆幅。
            - text: 负载电阻越小，输出匹配网络本身的金属损耗就会完全消失
              why: 恰好相反，阻抗变换比越大、电阻越小，电流越大且匹配网络损耗反而更难控制。
            - text: 把 50 Ω 降阻成 8 Ω 可以让甲类功放的最大理论效率突破 90%
              why: 负载阻值改变的是输出功率尺度，甲类功放的 50% 理论效率上限由 $360^\circ$ 导通角决定。
          hint: 观察 $P_{\max} = V_{DD}^2/(2R_L)$，当 $V_{DD}$ 被工艺电压锁死，想把 $P_{\max}$ 提高数倍，分母上的 $R_L$ 必须怎么变？
          explain: $P_{\max} = V_{DD}^2/(2R_L)$ 表明，在电源电压固定的前提下，唯有把负载向下变换成更小的 $R_{\text{opt}}$ 并增大电流摆幅，才能送出几百毫瓦以上射频功率。
      - card:
          title: 例题：算 3.3 V 功放直驱最大功率与 27 dBm 最佳负载电阻
          body: 某功放电源电压 $V_{DD} = 3.3\text{ V}$，通过理想射频扼流圈供电（峰值电压摆幅 $V_{DD}$）。(1) 直接驱动 $50\ \Omega$ 负载的最大输出功率是多少 mW 与 dBm？(2) 要输出 $27\text{ dBm}$（约 $501\text{ mW}$），需把负载变换为多大电阻？
          reveal:
            - title: 第 1 步：算直驱 50 Ω 的最大输出功率
              body: |
                $$P_{\max} = \frac{3.3^2}{2 \times 50} = \frac{10.89}{100} = 0.1089\text{ W} = 108.9\text{ mW}$$
                换算成 dBm：$10\lg(108.9) \approx 20.4\text{ dBm}$。
            - title: 第 2 步：反求 27 dBm 所需的最佳负载电阻
              body: |
                $27\text{ dBm} = 10^{2.7}\text{ mW} \approx 501.2\text{ mW} = 0.5012\text{ W}$，故：
                $$R_{\text{opt}} = \frac{3.3^2}{2 \times 0.5012} \approx 10.9\ \Omega$$
      - item:
          id: q-pa-pmax-2v
          type: number
          prompt: 某理想单端射频功放采用 $V_{DD} = 2.0\text{ V}$ 经扼流圈供电（峰值摆幅 $2.0\text{ V}$），直接驱动 $50\ \Omega$ 负载。求其最大输出功率是多少 dBm（保留一位小数）？
          answer: 16.0
          tolerance: 0.2
          unit: dBm
          hint: 先用 $P_{\max} = V_{DD}^2/(2R_L)$ 算出毫瓦数，再取 $10\lg(P/\text{mW})$ 是多少 dBm？
          explain: $P_{\max} = 2.0^2 / (2 \times 50) = 0.040\text{ W} = 40\text{ mW}$，故 $10\lg(40) \approx 16.02 \approx 16.0\text{ dBm}$。
      - item:
          id: q-pa-ropt-2v
          type: number
          prompt: 某单端射频功放采用 $V_{DD} = 2.0\text{ V}$ 经理想扼流圈供电（峰值摆幅 $2.0\text{ V}$），目标输出功率为 $20\text{ dBm}$（$100\text{ mW}$）。匹配网络应将 $50\ \Omega$ 天线变换成多大的最佳负载电阻 $R_{\text{opt}}$（单位 Ω）？
          answer: 20
          tolerance: 0.5
          unit: Ω
          hint: 代入 $R_{\text{opt}} = V_{DD}^2/(2P_{\text{out}})$，注意 $100\text{ mW} = 0.1\text{ W}$。
          explain: $R_{\text{opt}} = 2.0^2 / (2 \times 0.1) = 4.0 / 0.2 = 20\ \Omega$。
      - item:
          id: q-pa-class-match
          type: match
          prompt: 将四类经典线性/导通角功放与它们的导通角及最大理论效率配对。
          pairs:
            - ["甲类（Class A）", "导通角 360°，线性度最高，理论最大效率 50%"]
            - ["乙类（Class B）", "导通角 180°，半周期导通，理论最大效率 π/4 ≈ 78.5%"]
            - ["甲乙类（Class AB）", "导通角 180°–360°，兼顾较高效率与良好线性度"]
            - ["丙类（Class C）", "导通角小于 180°，效率可逼近 100% 但非线性强、输出功率降"]
          hint: 随着导通角从 360° 逐步缩小到小于 180°，效率与线性度如何变化？
          explain: 导通角越窄，晶体管同时承受高电压和大电流的重叠时间越短，效率越高，但波形失真也越剧烈。

  - id: pa-high-efficiency
    chapter: 射频功率放大器
    title: 开关型高效率功放、共源共栅与大信号匹配
    minutes: 12
    flow:
      - guess:
          id: g-switch-pa
          type: choice
          prompt: 甲类和乙类功放之所以永远达不到 100% 效率，根本原因是晶体管工作在受控电流源模式时，管子两端电压 $v_{DS}(t)$ 和流过电流 $i_D(t)$ 在同一时刻都不为零，乘积 $v_{DS}i_D$ 全部变成芯片热量。如果把晶体管改成高速“理想开关”，你猜为什么能逼近 100% 效率？
          options:
            - text: 开关导通时电压近零、关断时电流为零，电压与电流波形不交叠，理论功耗归零
              correct: true
            - text: 开关模式不需要直流供电电源，直接从空气吸收射频能量
              why: 开关功放依然把直流电源能量转换成射频能量，只是消除了晶体管自身热耗散。
            - text: 开关模式下晶体管的寄生电容全部自动消失
              why: 高频下寄生输出电容 $C_{\text{out}}$ 依然存在，正因如此才需要戊类软开关技术来吸收寄生电容能量。
          explain: 晶体管瞬时耗散功率等于 $v_{DS}(t)\cdot i_D(t)$；开关型功放通过波形整形让电压和电流错开出现，在理想开关下理论漏极效率可达 100%。
      - card:
          title: 丁类、戊类与己类开关型高效率功放
          body: |
            开关型功放以牺牲幅度线性换取逼近 100% 的理论效率：
            - **丁类（Class D）**：双管交替输出方波，经串联 LC 滤出基波，高频下受寄生电容 $\frac{1}{2}CV^2 f$ 开关损耗制约；
            - **戊类（Class E）**：将输出电容纳入网络，使开通瞬间 $v_D = 0$ 且 $dv_D/dt = 0$（软开关），消除容性放电损耗，代价是漏极峰值电压达 $3.56\,V_{DD}$；
            - **己类（Class F）**：奇次谐波开路、偶次谐波短路，将漏极电压整成方波、电流整成半正弦波。
      - card:
          title: 共源共栅耐压输出级与大信号阻抗匹配
          body: |
            薄栅氧 CMOS 耐压仅 1–2 V，而功放漏极峰值电压可达 $2V_{DD}$ 甚至 $3.5V_{DD}$。为此常用**共源共栅输出级**：薄氧下管提供高跨导驱动，厚氧共栅上管分担高压摆幅防击穿。另一核心区别是**大信号阻抗匹配**：小信号电路追求端口共轭匹配取最大增益，而功放受电压和电流上限约束，须匹配到**最佳负载线电阻 $R_{\text{opt}}$**（工程上由负载牵引实测等功率与等效率圆图确定），两者并不一致。
      - item:
          id: q-class-e-f
          type: choice
          prompt: 戊类（Class E）与己类（Class F）高效率射频功率放大器分别靠什么核心物理机制压低晶体管自身功耗？
          options:
            - text: 戊类靠软开关让开通瞬间电压及斜率为零，己类靠谐波网络把电压整成方波、电流整成半正弦波
              correct: true
            - text: 戊类工作在 360° 导通角，己类靠并联 50 Ω 电阻吸收热量
              why: 360° 是效率仅 50% 的甲类；开关功放绝不靠电阻吸收有用功率。
            - text: 两者都依靠大幅降低电源电压到 0.1 V 来消除所有开关损耗
              why: 两者靠的是波形时域错峰（软开关或谐波整形），戊类反而承受高达约 $3.56\,V_{DD}$ 的高电压应力。
            - text: 戊类只用于直流稳压，己类只能放大音频信号
              why: 戊类和己类都是经典高频射频开关功率放大器拓扑。
          hint: 想想戊类怎样对付寄生电容放电，己类怎样利用奇偶次谐波的不同端接阻抗来“捏波形”？
          explain: 戊类把输出电容吸收进网络实现零电压/零斜率软开关；己类则令奇次谐波呈高阻、偶次谐波呈短路，把漏极电压塑造成平顶方波以错开电流峰值。
      - card:
          title: 例题：计算功放的漏极效率与功率附加效率（PAE）
          body: 某射频功放输出功率 $P_{\text{out}} = 200\text{ mW}$，功率增益 $G = 10\text{ dB}$（10 倍），直流供电消耗 $P_{\text{DC}} = 400\text{ mW}$。求漏极效率 $\eta$ 与功率附加效率 PAE。
          reveal:
            - title: 第 1 步：算漏极效率 $\eta$ 与输入驱动功率 $P_{\text{in}}$
              body: |
                $$\eta = \frac{P_{\text{out}}}{P_{\text{DC}}} = \frac{200}{400} = 50.0\%$$
                因增益为 10 倍，所需输入射频驱动功率 $P_{\text{in}} = 200 / 10 = 20\text{ mW}$。
            - title: 第 2 步：代入 PAE 公式
              body: |
                $$\text{PAE} = \frac{P_{\text{out}} - P_{\text{in}}}{P_{\text{DC}}} = \frac{200 - 20}{400} = 45.0\%$$
                可见当功放增益偏低时，前级驱动消耗不可忽略，PAE 会明显低于漏极效率。
      - item:
          id: q-pae-calc
          type: number
          prompt: 某射频功率放大器输出功率 $P_{\text{out}} = 500\text{ mW}$，输入驱动功率 $P_{\text{in}} = 50\text{ mW}$，直流供电总功耗 $P_{\text{DC}} = 750\text{ mW}$。求它的功率附加效率（PAE）是多少 %？
          answer: 60
          tolerance: 0.5
          unit: "%"
          hint: 用净增加的射频功率 $P_{\text{out}} - P_{\text{in}}$ 除以直流总功耗 $P_{\text{DC}}$，再乘 100% 是多少？
          explain: $\text{PAE} = (500 - 50) / 750 = 450 / 750 = 60.0\%$。
      - item:
          id: q-cascode-pa
          type: choice
          prompt: 在深亚微米 CMOS 射频功放中普遍采用“薄栅氧共源下管 + 厚栅氧共栅上管”的共源共栅输出级，主要目的是？
          options:
            - text: 厚氧上管分担漏极高压摆幅防击穿
              correct: true
            - text: 让功放完全无需输出阻抗匹配网络
              why: 共源共栅仍需输出匹配网络把 50 Ω 变换到最佳负载电阻 $R_{\text{opt}}$。
            - text: 把乙类功放直接改造成线性度完美的甲类功放
              why: 功放类别由偏置与导通角决定，共源共栅主要解决的是耐压与输入输出隔离。
            - text: 将晶体管沟道热噪声降低到零，使功放变成超低噪声放大器
              why: 功放关注的是大功率输出、效率与可靠性，而非接收前端的微伏级热噪声底。
          hint: 单只薄栅氧短沟道管子速度快却经不住 3–4 V 漏极摆幅，头上叠一颗厚栅氧共栅管帮它扛住了什么？
          explain: 射频扼流圈供电使漏极峰值电压可达 $2V_{DD}$ 以上；共栅厚氧上管把漏极高压分担在两管之间，避免薄氧下管击穿并减少漏–栅密勒反馈。
      - item:
          id: q-loadline-vs-conj
          type: choice
          prompt: 射频功率放大器输出端通常按“最佳负载线电阻 $R_{\text{opt}}$”而非“小信号输出共轭匹配”来设计匹配网络，根本原因是什么？
          options:
            - text: 大信号输出受最大电压与电流摆幅物理封顶，共轭匹配会过早削波，无法送出最大可用功率
              correct: true
            - text: 晶体管在大信号下没有输出电容，因此无法做共轭匹配
              why: 大信号下依然存在非线性输出电容，匹配网络照样需要谐振抵消电抗，只是实部选 $R_{\text{opt}}$ 而非管子小信号输出电阻 $r_o$。
            - text: 小信号共轭匹配会令输出功率大到烧毁 50 Ω 发射天线
              why: 恰恰相反，把功放端接到高达几百欧姆的小信号 $r_o$ 会让电压刚摆到 $V_{DD}$ 就削波，输出功率反而远小于负载线匹配。
            - text: 最佳负载线匹配只能在 50 Hz 工频下工作
              why: 最佳负载线与负载牵引正是 GHz 射频功放设计的核心准则。
          hint: 晶体管小信号输出电阻 $r_o$ 常达数百欧姆，如果负载也取数百欧姆，在 $V_{DD}$ 封顶下 $V_{DD}^2/(2R_L)$ 会大还是小？
          explain: 若负载等于很大的 $r_o$，很小的电流就能把电压顶到电源轨而削波，最大输出功率很小；按负载线 $R_{\text{opt}} \approx V_{\max}/I_{\max}$ 匹配才能让电压和电流同时达到满摆幅，榨出最大输出功率。

  - id: pa-linearization-doherty
    chapter: 射频功率放大器
    title: 功率回退、线性化技术与 Doherty 功放
    minutes: 12
    flow:
      - guess:
          id: g-papr-backoff
          type: choice
          prompt: 现代 Wi-Fi 和 5G 通信采用多载波高阶调制（OFDM/QAM），信号瞬时峰值功率经常比平均功率高出 6–10 dB。为了让波形尖峰不撞到电源轨被削平，工程师不得不把功放平均输出功率往下退 6 dB 工作。你猜传统乙类功放退 6 dB 后，效率会怎么变？
          options:
            - text: 依然稳稳保持在 78.5% 的最高效率
              why: 只有满电压摆幅输出时乙类效率才达 78.5%；输出电压减半时，直流电流减半但输出功率变成四分之一，效率直接腰斩。
            - text: 效率直接腰斩到原来的一半（约 39.3%），大部分电量全变成发热
              correct: true
            - text: 效率会反向升到 95% 以上，因为输出功率变小了
              why: 功率回退时输出电压远低于 $V_{DD}$，晶体管两端剩余压降变大，耗散占比反而升高。
          explain: 乙类功放效率与输出电压幅值成正比：6 dB 功率回退意味着电压幅值降为一半，效率从 78.5% 跌到 39.3%，这正是现代通信功放最头疼的回退效率难题。
      - card:
          title: 高峰均比、功率回退与基本线性化技术
          body: |
            OFDM 与高阶 QAM 信号的峰值功率与平均功率之比称**峰均功率比（PAPR）**，常达 6–12 dB。若功放把信号尖峰削平，会在邻近信道产生严重频谱再生（恶化邻道功率比 ACPR）。直接做法是**功率回退**——让平均功率远离饱和区，但乙类功放回退后效率按 $\eta = \frac{\pi}{4}(V_{\text{out}}/V_{\max})$ 线性滑坡（回退 6 dB 仅剩 39.3%）。为让功放既逼近高效率区又保线性度，工程上引入线性化技术：最流行的是**数字预失真（DPD）**，在基带预先给信号施加与功放恰好相反的非线性弯折，级联后互相抵消变直；此外还有包络跟踪（动态调低 $V_{DD}$）与负反馈/前馈法。
      - card:
          title: Doherty 功率放大器：6 dB 回退依然高效
          body: |
            要在 6 dB 功率回退处保持高效率，常用 **Doherty 功率放大器**：甲乙类**主功放**经 $\lambda/4$ 传输线接负载，丙类**辅助功放**直并负载。
            - **低功率区（回退 $\ge 6\text{ dB}$）**：辅助功放关断，$\lambda/4$ 线将主功放负载抬高为 $2R_{\text{opt}}$，使其在 6 dB 回退处即达满电压摆幅，提前收获约 **78.5%** 效率峰；
            - **高功率区**：辅助功放导通注入电流，借**有源负载调制**将主功放等效负载平滑拉回 $R_{\text{opt}}$，共同交付峰值功率。
      - item:
          id: q-dpd-how
          type: choice
          prompt: 射频发射机中的数字预失真（DPD）技术是如何改善功率放大器线性度的？
          options:
            - text: 在数字基带对信号预先施加与功放特性相反的非线性变形，经功放后两者抵消趋于线性
              correct: true
            - text: 把功放的物理供电电源电压永久调高到 20 V
              why: 盲目抬高供电电压会严重降低效率并击穿器件，DPD 是在数字域补偿非线性。
            - text: 把所有高阶 QAM 信号强行降级成恒包络调频信号
              why: DPD 保持原有的高阶频谱效率调制不变，而是补偿功放的幅相失真。
            - text: 用机械继电器把受损的邻道频谱全部反射回天线
              why: 邻道频谱再生紧挨主信道，无法靠反射滤除，必须从源头抵消功放非线性。
          hint: 如果功放高功率段像一把向右弯的尺子，提前在数字端把输入朝反方向预弯同样幅度，合起来会变成什么？
          explain: 通过反馈支路采集功放输出建模其非线性曲线，再在基带乘以逆非线性函数，即可在不牺牲过多回退效率的前提下大幅压低邻道频谱再生。
      - card:
          title: 例题：计算乙类功放在 6 dB 功率回退处的效率
          body: 理想乙类功放在满摆幅（0 dB 回退）时漏极效率为 $\pi/4 \approx 78.5\%$。当输出功率比峰值回退 6 dB 时，电压摆幅与效率各变为多少？
          reveal:
            - title: 第 1 步：把 6 dB 功率回退换算成电压幅值比
              body: |
                功率缩小 6 dB 即降为原来的 $10^{-6/10} \approx 1/4$；因 $P \propto V_{\text{out}}^2$，输出电压幅值降为满摆幅的 $\sqrt{1/4} = 1/2$。
            - title: 第 2 步：代入乙类回退效率公式
              body: |
                $$\eta_{6\text{ dB BO}} = \frac{\pi}{4}\cdot\frac{V_{\text{out}}}{V_{\max}} = \frac{\pi}{4}\times \frac{1}{2} = \frac{\pi}{8} \approx 39.3\%$$
                而采用 Doherty 架构后，6 dB 回退处依然可以出现第二个接近 78.5% 的效率高峰。
      - item:
          id: q-classb-12db
          type: number
          prompt: 理想乙类功放效率满足 $\eta = \frac{\pi}{4}(V_{\text{out}}/V_{\max})$。当输出功率比峰值功率回退 12 dB（输出功率降至峰值的 $1/16$）时，其漏极效率约剩多少 %（保留一位小数）？
          answer: 19.6
          tolerance: 0.3
          unit: "%"
          hint: 功率降至峰值的 $1/16$，对应输出电压幅值降至满摆幅的几分之一？再乘以 $\pi/4 \approx 78.5\%$ 是多少？
          explain: $P_{\text{out}}/P_{\max} = 1/16$ 对应 $V_{\text{out}}/V_{\max} = \sqrt{1/16} = 1/4$，故 $\eta = (\pi/4) \times (1/4) = \pi/16 \approx 19.6\%$。
      - item:
          id: q-doherty-mech
          type: choice
          prompt: Doherty 功率放大器能在 6 dB 功率回退处依然保持接近峰值的高效率，最核心的物理机制是什么？
          options:
            - text: 借 $\lambda/4$ 线与辅助功放有源负载调制使回退提前满摆幅
              correct: true
            - text: 主功放和辅助功放永远完全同步同相输出相同功率，简单把芯片面积翻倍
              why: 同步并联只是功率合成，6 dB 回退时效率照样腰斩；Doherty 的精髓在于主辅分工和 $\lambda/4$ 线有源负载调制。
            - text: 用可切换电容阵列在每个比特周期里机械切换十组负载电阻
              why: Doherty 利用的是辅助功放导通注入电流自动改变公共节点等效阻抗的连续有源负载调制，而非机械切电阻。
            - text: 把乙类主功放替换成 360° 导通的甲类功放以提高回退效率
              why: 甲类功放在 6 dB 回退时效率更惨（仅 12.5%），Doherty 主路通常偏置在甲乙类、辅路偏置在丙类。
          hint: 为什么回退 6 dB（功率仅剩四分之一）时，如果主功放负载电阻加倍成 $2R_{\text{opt}}$，它的电压就能提前摆满电源轨？
          explain: 低功率时辅助路关断，主功放看进 $2R_{\text{opt}}$，仅需一半峰值电流就能把漏极电压摆满至 $V_{DD}$ 达到高效顶点；功率继续上升时辅助路开启，拉低主路等效负载到 $R_{\text{opt}}$，保持电压满幅同时交付峰值功率。
      - item:
          id: q-pa-lin-match
          type: match
          prompt: 将功放效率与线性化相关的概念与它们的核心作用配对。
          pairs:
            - ["峰均功率比（PAPR）", "衡量多载波调制信号峰值功率超出平均功率的幅度，决定所需回退量"]
            - ["功率回退（Back-off）", "降低平均输出功率避开削波保线性，但会显著拉低传统功放效率"]
            - ["数字预失真（DPD）", "基带施加逆非线性特性抵消功放失真，减少邻道频谱再生"]
            - ["Doherty 功放", "借主辅功放与四分之一波长线实现有源负载调制，大幅抬升回退效率"]
          hint: 区分哪一项描述信号波形特征、哪一项是简单保线性代价、哪一项靠基带逆模型、哪一项靠射频架构提回退效率？
          explain: 现代无线发射机常把 Doherty 功放与数字预失真联手使用：前者保住高回退效率，后者拉直线性度，满足苛刻的频谱掩模与能耗指标。

  - id: impedance-matching
    chapter: 阻抗匹配与片上无源器件
    title: 串并联等效与 L 形、π/T 阻抗匹配网络
    minutes: 13
    flow:
      - guess:
          id: g-lmatch-lossless
          type: choice
          prompt: 前面功放课里，我们需要把 50 Ω 天线变成 10 Ω 最佳负载电阻。如果只用理想的无损电感 $L$ 和电容 $C$ 搭成无源网络，能不能把一个纯电阻 50 Ω 在目标频率处精准变换成纯电阻 10 Ω，同时几乎不损耗功率？
          options:
            - text: 能，串并联电感电容互相抵消虚部并按 $(1 + Q^2)$ 缩放实部，几乎无功率损耗
              correct: true
            - text: 不能，电感和电容只能改变虚部电抗，实部电阻永远死守 50 Ω
              why: 串联电阻配电抗换成并联等效电路时，等效并联电阻会放大 $(1 + Q^2)$ 倍，反之缩小 $(1 + Q^2)$ 倍。
            - text: 只能靠并联一颗 12.5 Ω 物理电阻分流实现，电感电容帮不上忙
              why: 并联物理电阻会把 80% 的宝贵射频发射功率白白烧成热量，工程上只用无损电抗网络变换阻抗。
          explain: 利用串联–并联阻抗等效变换，两颗无损电抗元件（一颗串联、一颗并联）就能在工作频率处把任意实电阻向上或向下无损变换到目标阻值。
      - card:
          title: 串并联等效变换与品质因数 Q
          body: |
            考虑电阻 $R_s$ 与电抗 $X_s$ 串联，其品质因数 $Q = |X_s| / R_s$。在窄带工作频率 $\omega_0$ 附近，它可精确等效为并联电阻 $R_p$ 与并联电抗 $X_p$：
            $$R_p = R_s(1 + Q^2), \qquad X_p = X_s\left(1 + \frac{1}{Q^2}\right)$$
            且并联电路同样满足 $Q = R_p / |X_p|$。可见只要给小电阻 $R_s$ 串一颗电抗构成品质因数 $Q$，从并联端口看进去电阻就放大 $(1 + Q^2)$ 倍；反过来给大电阻 $R_p$ 并一颗电抗，串联等效电阻就缩小 $(1 + Q^2)$ 倍。这正是无源电抗实现阻抗变换的数学核心。
      - card:
          title: L 形匹配网络与 π/T 网络带宽调控
          body: |
            用一颗串联电抗和一颗并联电抗构成的二元件网络叫 **L 形匹配网络**。要将大电阻 $R_p$ 与小电阻 $R_s$（$R_p > R_s$）共轭匹配，**并联元件必须接在大电阻侧，串联元件接在小电阻侧**，其网络品质因数由阻值比唯一决定：
            $$Q = \sqrt{\frac{R_p}{R_s} - 1}, \qquad |X_s| = Q R_s, \qquad |X_p| = \frac{R_p}{Q}$$
            两元件须一感一容（高通或低通两种方案），使剩余虚部在 $\omega_0$ 处正好抵消。由于 L 形网络的 $Q$ 被阻值比锁死，相对带宽约 $1/Q$ 无法自由调节；若需更窄带滤波或更宽带匹配，可将两级 L 形网络背靠背拼成三元件 **$\pi$ 形或 T 形匹配网络**，引入虚构中间电阻独立设定 $Q$ 值与带宽。
      - item:
          id: q-lmatch-topology
          type: choice
          prompt: 用两元件 L 形无源网络把 50 Ω 天线匹配到 8 Ω 功放最佳负载电阻时，两颗电抗元件应该如何连接？
          options:
            - text: 并联元件接 50 Ω 侧，串联元件接 8 Ω 侧
              correct: true
            - text: 串联元件接 50 Ω 侧，并联元件接 8 Ω 侧
              why: 串联转并联总是把电阻放大 $(1 + Q^2)$ 倍，因此小电阻侧必须接串联元件、大电阻侧接并联元件。
            - text: 两颗电感都串联在 50 Ω 与 8 Ω 之间，无需接地元件
              why: 两颗纯串联元件无法改变实部电阻，也不能抵消彼此同号感抗。
            - text: 两颗电容都并联到地，不加任何串联支路
              why: 纯并联元件只能把大电阻往下压虚部，无法在两实阻之间实现虚部抵消与实部变换。
          hint: 记住 $R_p = R_s(1 + Q^2)$ 永远大于 $R_s$，那么大电阻和小电阻分别对应并联侧还是串联侧？
          explain: $R_p > R_s$ 决定并联电抗放在大电阻（50 Ω）一侧，串联电抗放在小电阻（8 Ω）一侧，且一感一容互相抵消虚部。
      - card:
          title: 例题：设计 2.0 GHz 下 50 Ω 到 10 Ω 的 L 形匹配网络
          body: 在 $f_0 = 2.0\text{ GHz}$ 处，用低通 L 形网络（串联电感 $L$ 接 $10\ \Omega$ 侧、并联电容 $C$ 接 $50\ \Omega$ 侧）将 $50\ \Omega$ 变换为 $10\ \Omega$。求网络 $Q$、电感 $L$ 与电容 $C$。
          reveal:
            - title: 第 1 步：由阻抗比求网络品质因数 Q
              body: |
                $$Q = \sqrt{\frac{R_p}{R_s} - 1} = \sqrt{\frac{50}{10} - 1} = \sqrt{4} = 2.0$$
            - title: 第 2 步：算串联感抗与并联容抗
              body: |
                $X_s = Q R_s = 2.0 \times 10 = 20\ \Omega$，$X_p = R_p / Q = 50 / 2.0 = 25\ \Omega$。
            - title: 第 3 步：换算 2.0 GHz 下的 L 和 C
              body: |
                $\omega_0 = 2\pi\times 2.0\times 10^9 \approx 1.257\times 10^{10}\text{ rad/s}$，得：
                $$L = \frac{20}{\omega_0} \approx 1.59\text{ nH}, \qquad C = \frac{1}{\omega_0 \times 25} \approx 3.18\text{ pF}$$
      - item:
          id: q-lmatch-q
          type: number
          prompt: 用二元件 L 形匹配网络将 $50\ \Omega$ 负载无损变换到 $5\ \Omega$，该网络所需的品质因数 $Q$ 是多少（保留一位小数）？
          answer: 3.0
          tolerance: 0.1
          hint: 代入 $Q = \sqrt{R_p/R_s - 1}$，算出根号里面的整数再开平方。
          explain: $Q = \sqrt{50 / 5 - 1} = \sqrt{9} = 3.0$。
      - item:
          id: q-lmatch-rp
          type: number
          prompt: 一个串联支路由电阻 $R_s = 4\ \Omega$ 与感抗 $X_s = 12\ \Omega$ 组成（$Q = 3$）。在工作频率处将它转换为并联等效电路，等效并联电阻 $R_p$ 是多少 Ω？
          answer: 40
          tolerance: 0.5
          unit: Ω
          hint: 代入串并联等效公式 $R_p = R_s(1 + Q^2)$ 算出的阻值是多少？
          explain: $Q = 12 / 4 = 3$，故 $R_p = 4 \times (1 + 3^2) = 4 \times 10 = 40\ \Omega$。
      - item:
          id: q-pi-t-why
          type: choice
          prompt: 相比两元件 L 形匹配网络，三元件 $\pi$ 形或 T 形匹配网络增加一个自由度的核心工程价值是？
          options:
            - text: 可独立调节网络 $Q$ 值与匹配带宽
              correct: true
            - text: 能把无源匹配网络变成有 20 dB 功率增益的放大器
              why: 任何无源电感电容网络都不能提供功率增益，反而存在有限 $Q$ 带来的插入损耗。
            - text: 可以省掉电路里的所有接地端
              why: $\pi$ 形与 T 形网络同样包含并联到地的接地支路。
            - text: 无论工作频率变化多少倍都能保持零反射
              why: 集总电抗匹配本质上是有限带宽谐振网络，只是 $\pi$/T 网络允许工程师自主设定带宽与 $Q$ 值。
          hint: L 形网络中，一旦给定 $R_p$ 和 $R_s$，网络品质因数 $Q$ 还能自由挑选吗？加第三颗元件后呢？
          explain: L 形网络的 $Q$ 被 $\sqrt{R_p/R_s - 1}$ 唯一锁死；$\pi$/T 网络通过引入虚构中间电阻拆成两级 L 形网络，使工程师能自主选定较高 $Q$（强谐波滤波）或较低 $Q$（宽带匹配）。

  - id: s-parameters-tlines
    chapter: 阻抗匹配与片上无源器件
    title: 传输线、反射系数与散射矩阵
    minutes: 13
    flow:
      - guess:
          id: g-s-param-why
          type: choice
          prompt: 在低频模拟电路里，我们常用开路测阻抗矩阵、短路测导纳矩阵来刻画二端口网络。到了几 GHz 射频频段，工程师为什么放弃开短路实测，改用端口端接 50 Ω 的散射矩阵（S 矩阵）？
          options:
            - text: 高频下难以做出理想宽带开路/短路，且开路或短路极易让高频晶体管自激振荡
              correct: true
            - text: 欧姆定律和基尔霍夫定律在 1 GHz 以上就不再成立了
              why: 麦克斯韦方程与波动模型依然成立，只是集总端接开短路寄生太大且容易引起有源器件失稳。
            - text: 散射矩阵不需要任何测试仪器，靠肉眼观察芯片尺寸就能读出来
              why: 散射矩阵需用矢量网络分析仪（VNA）在 50 Ω 端接下精确测量入射波与反射波。
          explain: 高频下几毫米引线就带来显著寄生电感和电容，很难实现宽带理想开路/短路，而且射频放大器在开短路端接下极易振荡，改用 50 Ω 端接入射/反射波比值的散射矩阵才稳定可靠。
      - card:
          title: 传输线、特征阻抗与反射系数
          body: |
            当互连线的物理尺寸超过信号波长的约 $1/10$ 时（例如硅片氧化层中 30 GHz 波长仅约 5 mm），线上的电压电流不再处处同时变化，须视为分布电路模型的**传输线**。无损传输线具有特征阻抗 $Z_0 = \sqrt{L'/C'}$。当它终端接负载 $Z_L$ 时，入射波与反射波电压之比定义为**反射系数（reflection coefficient）**：
            $$\Gamma = \frac{Z_L - Z_0}{Z_L + Z_0}$$
            完全匹配（$Z_L = Z_0$）时 $\Gamma = 0$；全反射时 $|\Gamma| = 1$。工程上常用回波损耗 $\text{RL} = -20\lg|\Gamma|$（dB）衡量匹配优劣（如 $|\Gamma| \le 0.316$ 对应回波损耗 $\ge 10\text{ dB}$，反射功率不足 10%）。物理尺寸为四分之一波长的传输线可做阻抗变换器，满足 $Z_{\text{in}} = Z_0^2 / Z_L$（即 $Z_0 = \sqrt{Z_{\text{in}} Z_L}$）。
      - card:
          title: 二端口散射矩阵（S 矩阵）与史密斯圆图直觉
          body: |
            在各端口均端接特征阻抗 $Z_0$（通常 $50\ \Omega$）的条件下，用归一化入射波 $a_1, a_2$ 与反射/出射波 $b_1, b_2$ 定义二端口**散射矩阵（S-parameters）**：
            $$b_1 = S_{11} a_1 + S_{12} a_2, \qquad b_2 = S_{21} a_1 + S_{22} a_2$$
            四项含义一目了然：$S_{11}$ 是输出匹配时的输入反射系数（要求 $|S_{11}| < -10\text{ dB}$）；$S_{21}$ 是正向电压/功率传输增益（$|S_{21}|^2$ 为功率增益）；$S_{12}$ 是输出到输入的反向隔离度（越负越好，抑制振荡与本振反向泄漏）；$S_{22}$ 是输出反射系数。把复平面上的归一化阻抗 $z = Z/Z_0$ 通过 $\Gamma = (z-1)/(z+1)$ 映射到单位圆内，就得到**史密斯圆图**：圆心即完美匹配点 $50\ \Omega$，串联电抗沿等电阻圆走、并联电纳沿等电导圆走，可直观图解 L/$\pi$/T 匹配路径。
      - item:
          id: q-sparam-meaning
          type: match
          prompt: 将二端口射频放大器散射矩阵（S 矩阵）的四个分量与它们的工程指标含义配对。
          pairs:
            - ["S11", "输出端接 50 Ω 时的输入端反射系数，衡量输入匹配好坏"]
            - ["S21", "正向传输系数，其幅值平方表征端口 1 到端口 2 的正向功率增益"]
            - ["S12", "反向传输系数，反映输出向输入的反向隔离度与稳定性"]
            - ["S22", "输入端接 50 Ω 时的输出端反射系数，衡量输出匹配好坏"]
          hint: 记住角标规则 $S_{ij}$ 表示“信号从端口 $j$ 入射，在端口 $i$ 测得的出射波之比”。
          explain: $S_{ij} = b_i / a_j|_{a_k=0}$：对角项 $S_{11}, S_{22}$ 看两端反射匹配，非对角项 $S_{21}$ 看正向增益、$S_{12}$ 看反向隔离。
      - card:
          title: 例题：算反射系数、回波损耗与四分之一波长变换器
          body: (1) 特征阻抗 $Z_0 = 50\ \Omega$ 的传输线端接 $Z_L = 100\ \Omega$ 负载，求反射系数 $\Gamma$ 和回波损耗 RL（dB）。(2) 要用四分之一波长传输线把 $200\ \Omega$ 负载匹配到 $50\ \Omega$，该段线的特征阻抗应选多少？
          reveal:
            - title: 第 1 步：算反射系数与回波损耗
              body: |
                $$\Gamma = \frac{100 - 50}{100 + 50} = \frac{1}{3} \approx 0.333$$
                回波损耗 $\text{RL} = -20\lg(1/3) \approx 9.54\text{ dB}$（反射功率占 $|\Gamma|^2 = 1/9 \approx 11.1\%$）。
            - title: 第 2 步：求四分之一波长变换线特征阻抗
              body: |
                由 $Z_{\text{in}} = Z_q^2 / Z_L$，取几何平均：
                $$Z_q = \sqrt{50 \times 200} = 100\ \Omega$$
      - item:
          id: q-gamma-rl
          type: number
          prompt: 特征阻抗 $Z_0 = 50\ \Omega$ 的微带线端接 $Z_L = 75\ \Omega$ 负载。求端口回波损耗 $\text{RL} = -20\lg|\Gamma|$ 是多少 dB（保留一位小数）？
          answer: 14.0
          tolerance: 0.2
          unit: dB
          hint: 先算 $\Gamma = (75 - 50)/(75 + 50)$ 是多少，再取 $-20\lg|\Gamma|$。
          explain: $\Gamma = 25 / 125 = 0.20$，回波损耗 $\text{RL} = -20\lg(0.20) \approx 13.98 \approx 14.0\text{ dB}$（仅 4% 功率反射）。
      - item:
          id: q-qwave-z0
          type: number
          prompt: 要用一段四分之一波长无损传输线将 $12.5\ \Omega$ 的纯阻性负载匹配到 $50\ \Omega$ 主干线，这段四分之一波长变换线的特征阻抗 $Z_q$ 应取多少 Ω？
          answer: 25
          tolerance: 0.5
          unit: Ω
          hint: 四分之一波长变换线的特征阻抗等于两端电阻的几何平均 $\sqrt{Z_{\text{in}} Z_L}$。
          explain: $Z_q = \sqrt{50 \times 12.5} = \sqrt{625} = 25\ \Omega$。
      - item:
          id: q-s11-db
          type: choice
          prompt: 一款 LNA 在 2.4 GHz 测得 $|S_{11}| = -10\text{ dB}$，这表示端口输入功率大约有多少比例被反射回信号源？
          options:
            - text: 10%
              correct: true
            - text: 50%
              why: 反射 50% 功率对应 $-3\text{ dB}$，远差于 $-10\text{ dB}$。
            - text: 1%
              why: 反射 1% 功率对应 $-20\text{ dB}$（$|\Gamma| = 0.1$）。
            - text: 90%
              why: 90% 是传入 LNA 内部被吸收的功率比例，反射回去的是剩下的 10%。
          hint: $-10\text{ dB}$ 的功率比 $10^{-10/10}$ 等于多少？反射功率比例正好等于 $|S_{11}|^2$。
          explain: $|S_{11}| = -10\text{ dB}$ 意味着功率反射比 $|S_{11}|^2 = 10^{-10/10} = 0.10$（10% 反射，90% 送入放大器），这常作为工程上端口匹配的最低门槛。

  - id: onchip-passives
    chapter: 阻抗匹配与片上无源器件
    title: 片上螺旋电感、变压器、变容管与电容
    minutes: 13
    flow:
      - guess:
          id: g-ind-q-low
          type: choice
          prompt: 实验室里绕在陶瓷骨架上的分立空心电感，品质因数 $Q$ 方便做到 100 以上；可一旦把螺旋电感做进标准 CMOS 硅芯片上，$Q$ 值往往骤降到只有 10 左右。你猜拖垮片上电感 $Q$ 值的主要主要原因是什么？
          options:
            - text: 薄金属走线的趋肤/邻近串联电阻，加上导电硅衬底里的涡流与寄生电容耦合损耗
              correct: true
            - text: 硅芯片内部磁场传播速度比空气慢了一百倍
              why: 硅的相对磁导率几乎等于 1，问题不在磁导率，而在金属电阻损耗和有损半导体硅衬底。
            - text: 片上电感只能绕 1 圈，无法产生任何电感量
              why: 片上螺旋电感常绕 2–6 圈产生 0.5–10 nH 电感，真正致命的是金属与衬底损耗。
          explain: 片上金属厚度只有几微米，高频趋肤效应进一步压缩导电截面；同时磁场穿透下方具有有限电导率的硅衬底，在衬底内感生涡流发热，加上氧化层电容把高频电流耦合进有损衬底，共同把片上 $Q$ 卡在 10 左右。
      - card:
          title: 片上螺旋电感的损耗机理与自谐振频率
          body: |
            片上螺旋电感用顶层厚金属绕制，品质因数常仅 10 左右，受两大损耗制约：一是金属有限电导率与高频电流趋向表面的**趋肤效应**、邻近效应引起串联电阻 $R_s$；二是低阻硅衬底内感生**涡流**，且寄生电容 $C_p$ 将电流导入有损衬底。此外，电感与 $C_p$ 形成**自谐振频率** $f_{\text{SRF}} = 1/(2\pi\sqrt{LC_p})$，高于此频器件呈容性。改进措施包括厚顶层金属、差分电感及开槽接地屏蔽（PGS）。
      - card:
          title: 片上变压器、电容与变容管
          body: |
            两只螺旋电感交错或叠层绕制即**片上变压器**（耦合系数 $k \approx 0.7\text{–}0.85$），常作**巴伦（balun）**完成单端–差分转换及级间阻抗变换。片上固定电容分专用介质层的 **MIM 电容**与利用多层细金属侧壁的 **MOM 电容**（免额外掩膜、成本低）。片上电调电容多用**积累型 MOS 变容管**（N 阱内源漏短接），借栅–体电压连续切换表面电荷状态，兼顾调谐比与高 $Q$。
      - item:
          id: q-pgs-slotted
          type: choice
          prompt: 在片上螺旋电感下方的底层金属铺设接地屏蔽层（PGS）阻挡电场进入有损硅衬底时，为什么必须把它切成放射状“开槽”而不是一整块实心金属板？
          options:
            - text: 切断闭合涡流环路以保电感量与 Q 值
              correct: true
            - text: 实心金属板无法通过工艺光刻制造出来
              why: 实心金属板很容易制造，但它的低电阻反而会形成超强涡流把电感磁场抵消掉。
            - text: 开槽是为了把螺旋电感改造成固定电容
              why: 屏蔽层目标恰恰是阻隔衬底阻性损耗、尽量保住高电感量与高 $Q$。
            - text: 实心金属板会阻挡直流电源流进芯片
              why: 屏蔽层与主供电网络分离，关键在于切断与电感线圈平行的闭合涡流环路。
          hint: 法拉第电磁感应告诉我们，垂直穿过整块良导体金属板的交变磁场会激发出什么电流？把环路垂直切开又会怎样？
          explain: 放射状开槽切碎了平行于螺旋绕线的闭合电流环，有效阻止感应涡流形成，同时依然为电感下方的垂直电场提供低阻接地屏蔽，避免衬底阻性耗散。
      - card:
          title: 例题：估算片上电感的 Q 值、等效并联电阻与自谐振频率
          body: 某片上螺旋电感 $L = 2.0\text{ nH}$，在 $f = 5.0\text{ GHz}$ 处测得等效串联损耗电阻 $R_s = 6.28\ \Omega$，总等效寄生并联电容 $C_p = 50\text{ fF}$。求它的品质因数 $Q$、等效并联损耗电阻 $R_p$ 与自谐振频率 $f_{\text{SRF}}$。
          reveal:
            - title: 第 1 步：算感抗与品质因数 Q
              body: |
                $\omega L = 2\pi \times 5.0\times 10^9 \times 2.0\times 10^{-9} \approx 62.83\ \Omega$，故：
                $$Q = \frac{\omega L}{R_s} = \frac{62.83}{6.28} \approx 10.0$$
                并联等效损耗电阻 $R_p \approx Q^2 R_s \approx 100 \times 6.28 = 628\ \Omega$。
            - title: 第 2 步：算自谐振频率 SRF
              body: |
                $$f_{\text{SRF}} = \frac{1}{2\pi\sqrt{2.0\times 10^{-9}\times 50\times 10^{-15}}} \approx 15.9\text{ GHz}$$
                工作频率 5 GHz 远低于 SRF（通常要求 $f_0 < f_{\text{SRF}}/2$），电感特性健康。
      - item:
          id: q-ind-q-calc
          type: number
          prompt: 某片上螺旋电感 $L = 5.0\text{ nH}$，工作在 $f = 1.0\text{ GHz}$ 处等效串联损耗电阻 $R_s = 2.5\ \Omega$。求该频点处电感的品质因数 $Q$（保留一位小数）。
          answer: 12.6
          tolerance: 0.2
          hint: 先算感抗 $\omega L = 2\pi f L$ 是多少欧姆，再除以 $R_s$。
          explain: $\omega L = 2\pi \times 10^9 \times 5.0\times 10^{-9} = 10\pi \approx 31.42\ \Omega$，因此 $Q = 31.42 / 2.5 \approx 12.57 \approx 12.6$。
      - item:
          id: q-ind-srf
          type: number
          prompt: 某片上电感 $L = 2.5\text{ nH}$，其对衬底及匝间的总寄生并联电容 $C_p = 100\text{ fF}$。求该电感的自谐振频率 $f_{\text{SRF}}$ 是多少 GHz（保留一位小数）？
          answer: 10.1
          tolerance: 0.2
          unit: GHz
          hint: 代入 $f_{\text{SRF}} = 1/(2\pi\sqrt{L C_p})$，注意 $100\text{ fF} = 10^{-13}\text{ F}$。
          explain: $\sqrt{L C_p} = \sqrt{2.5\times 10^{-9}\times 10^{-13}} = \sqrt{2.5\times 10^{-22}} \approx 1.581\times 10^{-11}\text{ s}$，故 $f_{\text{SRF}} = 1 / (2\pi \times 1.581\times 10^{-11}) \approx 10.07 \approx 10.1\text{ GHz}$。
      - item:
          id: q-passive-match
          type: match
          prompt: 将四种片上无源器件与它们的典型结构特征或用途配对。
          pairs:
            - ["螺旋电感", "顶层厚金属绕制，Q 值受金属趋肤损耗与衬底涡流限制常仅 10 左右"]
            - ["片上变压器（巴伦）", "双线圈磁耦合，常用于单端–差分转换与阻抗变换"]
            - ["MOM 叉指电容", "利用多层标准细金属侧壁电容形成，无需额外掩膜、成本低"]
            - ["积累型 MOS 变容管", "靠栅–体偏压连续改变表面载流子状态，用于 VCO 频率电调谐"]
          hint: 按磁储能、磁耦合单转差、侧壁定容和电压调容四个特征区分。
          explain: 熟悉片上电感、变压器、MIM/MOM 电容与变容管的寄生损耗和面积代价，是做好射频 IC 版图与电路协同设计的前提。

  - id: nonlinearity-p1db-ip3
    chapter: 非线性与线性度指标
    title: 增益压缩、1 dB 压缩点与三阶截点
    minutes: 14
    flow:
      - guess:
          id: g-im3-close
          type: choice
          prompt: 接收机天线附近有两个相邻电台信号（比如 $f_1 = 2402\text{ MHz}$ 和 $f_2 = 2404\text{ MHz}$），都被带外滤波器放进了 LNA。经过有源放大器的非线性项后，谐波 $2f_1, 3f_1$ 离得很远容易滤掉；你猜哪种新产生的频率分量最致命、连滤波器都拿它没办法？
          options:
            - text: 三阶交调分量 $2f_1 - f_2 = 2400\text{ MHz}$ 和 $2f_2 - f_1 = 2406\text{ MHz}$，紧贴原信号两侧直落有用信道
              correct: true
            - text: 三次谐波 $3f_1 = 7206\text{ MHz}$，因为频率最高能量最大
              why: 7206 MHz 远离 2.4 GHz 通带，极易被谐振负载或低通滤波器全部衰减掉。
            - text: 直流分量 0 Hz，因为任何交流耦合电容都拦不住直流
              why: 交流耦合电容恰好能方便阻断直流，真正逃过滤波器的是紧贴原频段的 $2f_1 - f_2$ 与 $2f_2 - f_1$。
          explain: 当两个邻道干扰相距 $\Delta f$ 时，三次项 $x^3$ 生成的三阶交调产物 $2f_1 - f_2$ 与 $2f_2 - f_1$ 恰好落在它们外侧仅隔 $\Delta f$ 的位置，正好砸进目标接收信道内。
      - card:
          title: 弱非线性展开、增益压缩与 1 dB 压缩点
          body: |
            弱非线性无记忆射频电路的输入输出特性可按泰勒级数展开：
            $$y(t) = \alpha_1 x(t) + \alpha_2 x^2(t) + \alpha_3 x^3(t)$$
            输入单音 $A\cos\omega t$ 时，三次项 $\alpha_3 A^3 \cos^3\omega t$ 展开含 $\frac{3}{4}\alpha_3 A^3\cos\omega t$，使基波等效增益变为 $\alpha_1 + \frac{3}{4}\alpha_3 A^2$。实际电路受电源与器件饱和限制，$\alpha_3$ 与 $\alpha_1$ 异号，输入幅度越大增益越低，称为**增益压缩**（强干扰还会压低同通道弱信号的增益，称阻塞脱敏；调幅干扰的包络甚至会转移到有用载波上，称**交叉调制**）。实际增益比小信号线性增益下降 1 dB 时的功率点定义为 **1 dB 压缩点（$P_{1\text{dB}}$）**，按参考端口分为输入 $\text{IIP}_{1\text{dB}}$（常简写 $P_{1\text{dB}}$）与输出 $\text{OP}_{1\text{dB}}$。
      - card:
          title: 双音测试、三阶交调与 IIP3/OIP3
          body: |
            向电路送入两个等幅邻频信号 $A(\cos\omega_1 t + \cos\omega_2 t)$，三次项 $\alpha_3 x^3$ 在 $2\omega_1 - \omega_2$ 与 $2\omega_2 - \omega_1$ 处生出幅度为 $\frac{3}{4}|\alpha_3|A^3$ 的**三阶交调（IM3）**产物。画在对数坐标（dBm）上，每音输入增加 1 dB 时，基波输出斜率增加 **1 dB/dB**，而 IM3 输出斜率增加 **3 dB/dB**。把两条直线向高功率外推的交点定义为**三阶截点（IP3）**：交点横坐标是输入三阶截点 **IIP3**，纵坐标是输出三阶截点 **OIP3**（$\text{OIP3} = \text{IIP3} + G$）。由斜率差 2 立刻得出极实用的双音换算公式（$\Delta P = P_{\text{out}} - P_{\text{IM3}}$）：
            $$\text{OIP3} = P_{\text{out}} + \frac{\Delta P}{2}, \qquad \text{IIP3} = \text{OIP3} - G = P_{\text{in}} + \frac{\Delta P}{2}$$
            当非线性由三次项主导时，数学上可推得 $A_{\text{IIP3}} = \sqrt{\frac{4}{3}|\alpha_1/\alpha_3|}$，而 $A_{1\text{dB}} \approx \sqrt{0.145|\alpha_1/\alpha_3|}$，两者功率恒差约 **9.6 dB**：$\text{IIP3} - P_{1\text{dB}} \approx 9.6\text{ dB}$。
      - item:
          id: q-im3-slope
          type: choice
          prompt: 双音线性度测试中，当两个等幅输入音的功率同时提高 3 dB（仍处于弱非线性区），基波输出功率和三阶交调（IM3）输出功率分别增加多少？
          options:
            - text: 基波增加 3 dB，IM3 增加 9 dB
              correct: true
            - text: 基波增加 3 dB，IM3 也同步增加 3 dB
              why: IM3 幅度正比于输入幅度的三次方，功率正比于输入功率的三次方，因此斜率是基波的三倍。
            - text: 基波增加 9 dB，IM3 增加 3 dB
              why: 恰好把基波（1 dB/dB）和三阶交调（3 dB/dB）的增长斜率说反了。
            - text: 基波增加 6 dB，IM3 增加 18 dB
              why: 线性放大器功率增益固定，输入涨 3 dB，基波输出只涨 3 dB 而非 6 dB。
          hint: 基波按 1 dB/dB 增长，三阶交调按几 dB/dB 增长？把增长斜率分别乘以 3 dB 是多少？
          explain: 基波斜率为 1 dB/dB（$+3\text{ dB}$），IM3 斜率为 3 dB/dB（$+9\text{ dB}$），两者间距 $\Delta P$ 会同步缩小 $6\text{ dB}$。
      - card:
          title: 例题：双音测试求增益、OIP3、IIP3 与 $P_{1\text{dB}}$ 估算
          body: 某射频放大器双音测试结果：每音输入 $P_{\text{in}} = -25\text{ dBm}$，每音基波输出 $P_{\text{out}} = -10\text{ dBm}$，三阶交调输出 $P_{\text{IM3}} = -64\text{ dBm}$。求功率增益 $G$、OIP3、IIP3，并估算输入 1 dB 压缩点。
          reveal:
            - title: 第 1 步：算功率增益 G 与基波–交调差值 ΔP
              body: |
                $G = P_{\text{out}} - P_{\text{in}} = -10 - (-25) = 15\text{ dB}$；
                $\Delta P = P_{\text{out}} - P_{\text{IM3}} = -10 - (-64) = 54\text{ dB}$。
            - title: 第 2 步：代入公式求 OIP3、IIP3 与 $P_{1\text{dB}}$
              body: |
                $$\text{OIP3} = -10 + \frac{54}{2} = +17\text{ dBm}, \qquad \text{IIP3} = 17 - 15 = +2\text{ dBm}$$
                估算输入 1 dB 压缩点：$P_{1\text{dB}} \approx \text{IIP3} - 9.6 = -7.6\text{ dBm}$。
      - item:
          id: q-ip3-oip3
          type: number
          prompt: 某放大器双音测试中，每音输入 $-20\text{ dBm}$，测得基波输出 $-8\text{ dBm}$，三阶交调输出 $-56\text{ dBm}$。求它的输出三阶截点 OIP3 是多少 dBm？
          answer: 16
          tolerance: 0.2
          unit: dBm
          hint: 先算基波输出与 IM3 输出之差 $\Delta P$，再代入 $\text{OIP3} = P_{\text{out}} + \Delta P/2$。
          explain: $\Delta P = -8 - (-56) = 48\text{ dB}$，因此 $\text{OIP3} = -8 + 48/2 = +16\text{ dBm}$。
      - item:
          id: q-ip3-iip3
          type: number
          prompt: 某放大器双音测试中每音输入 $-20\text{ dBm}$，基波输出 $-8\text{ dBm}$，已求得输出三阶截点 $\text{OIP3} = +16\text{ dBm}$。求该放大器的输入三阶截点 IIP3 是多少 dBm？
          answer: 4
          tolerance: 0.2
          unit: dBm
          hint: 先由输出减输入算出增益 $G$，再用 OIP3 减去增益 $G$ 是多少？
          explain: 增益 $G = -8 - (-20) = 12\text{ dB}$，故 $\text{IIP3} = 16 - 12 = +4\text{ dBm}$（也可直接用 $-20 + 48/2 = +4\text{ dBm}$ 验算）。
      - item:
          id: q-ip3-virtual
          type: choice
          prompt: 关于三阶截点（IIP3/OIP3），下面哪一项物理理解是准确的？
          options:
            - text: 小信号直线外推交点，实测前早已压缩
              correct: true
            - text: 实际测试时必须把输入功率一直加大到等于 IIP3 才能测出结果
              why: 远在达到 IIP3 之前（约低 10 dB 处）器件就已进入 1 dB 压缩甚至烧毁，测试只需在小信号区测一点再用斜率公式外推。
            - text: IIP3 数值越低，说明放大器的线性度越好
              why: IIP3 越高意味着交调分量抬头越晚、线性度越好。
            - text: OIP3 永远比 IIP3 低 9.6 dB
              why: $\text{OIP3} = \text{IIP3} + G$，比 IIP3 低约 9.6 dB 的是输入 1 dB 压缩点 $P_{1\text{dB}}$。
          hint: 比较 $P_{1\text{dB}}$ 与 IIP3 的高低，如果真把功率加到 IIP3，放大器早就处于什么工作状态了？
          explain: IIP3 是用小信号区斜率 1 和斜率 3 两条直线外推得到的虚拟交点指标；实测时输入功率远低于 $P_{1\text{dB}}$，只需读出 $\Delta P$ 即可精准换算。

  - id: cascaded-linearity-sfdr
    chapter: 非线性与线性度指标
    title: 级联线性度、LNA 非线性与无杂散动态范围
    minutes: 13
    flow:
      - guess:
          id: g-casc-ip3-who
          type: choice
          prompt: 前面知道弗里斯噪声公式里“第一级（LNA）最关键、后级噪声被前级增益除小”。现在反过来考虑级联接收链路的线性度（IIP3）：第一级 LNA 增益越高，后级混频器和中频放大器的非线性对整机 IIP3 的影响会怎样？
          options:
            - text: 会被前级增益剧烈放大，后级反而常常成为整机线性度的主要瓶颈
              correct: true
            - text: 同样会被前级增益除小，所以后级混频器线性度好不好无所谓
              why: 前级增益越高，送到后级入口的干扰信号就越大，后级更容易先被压饱和和产生三阶交调。
            - text: 整机 IIP3 等于各级 IIP3（dBm）直接相加
              why: 级联只会让系统线性度比最弱一环更差（倒数叠加），绝不会越串越高。
          explain: 噪声看最前面，线性度看最后面：前级增益越大，进入后级的大干扰幅度越大，把后级三阶失真折算回天线入口时反被乘上 $G_1$，形成噪声与线性度的根本系统矛盾。
      - card:
          title: 级联 IIP3 公式与 LNA 非线性计算
          body: |
            假设两级级联系统的线性功率增益分别为 $G_1, G_2$，各自输入三阶截点（转为线性功率 mW）为 $\text{IIP3}_1, \text{IIP3}_2$。在最坏同相叠加近似下，折算到系统输入端的总三阶截点满足：
            $$\frac{1}{\text{IIP3}_{\text{tot}}} \approx \frac{1}{\text{IIP3}_1} + \frac{G_1}{\text{IIP3}_2} + \frac{G_1 G_2}{\text{IIP3}_3} + \cdots$$
            对比弗里斯公式一目了然：高增益 $G_1$ 帮我们压低了后级噪声 $(F_2 - 1)/G_1$，却把后级非线性项放大成 $G_1/\text{IIP3}_2$。在晶体管电路层面（如 LNA 非线性计算），长沟道 MOSFET 原本遵循纯平方律（$\alpha_3 = 0$），但深亚微米短沟道的速度饱和与迁移率退化引入显著三次项 $\alpha_3$；通过加大过驱动电压 $V_{OV}$ 或利用源极退化负反馈可改善单管 IIP3，但需权衡功耗与噪声。
      - card:
          title: 无杂散动态范围（SFDR）：把噪声与线性度统一起来
          body: |
            一条射频接收链路同时被两端夹击：下限是输入等效总噪声功率 $P_{\text{noise,in}} = -174 + 10\lg B + \text{NF}$（dBm），上限是允许三阶交调分量刚好抬头等于噪声底时的输入信号功率 $P_{\text{in,max}}$。由 IM3 满足 $P_{\text{IM3,in}} = 3 P_{\text{in}} - 2\,\text{IIP3} = P_{\text{noise,in}}$，解出最大无杂散输入功率 $P_{\text{in,max}} = \frac{1}{3}(2\,\text{IIP3} + P_{\text{noise,in}})$，减去噪声底即得**无杂散动态范围（spurious-free dynamic range, SFDR）**：
            $$\text{SFDR} = \frac{2}{3}\left(\text{IIP3} - P_{\text{noise,in}}\right)$$
            （式中各项均用 dBm/dB；若下限改按接收机灵敏度 $P_{\text{noise,in}} + \text{SNR}_{\min}$ 计，则再减去 $\text{SNR}_{\min}$）。要拓宽 SFDR，要么压低整机噪声系数，要么抬高整机 IIP3——两手抓正是射频系统级预算的核心艺术。
      - item:
          id: q-noise-lin-tradeoff
          type: choice
          prompt: 接收前端把 LNA 的功率增益从 15 dB 提高到 21 dB（LNA 自身 NF 和 IIP3 不变，后级混频器指标不变），对整机噪声系数和整机 IIP3 的综合影响是？
          options:
            - text: 整机噪声系数改善，但整机 IIP3 明显下降
              correct: true
            - text: 整机噪声系数与整机 IIP3 同时大幅改善
              why: 提高 $G_1$ 虽压低了后级噪声贡献，却使后级非线性项 $G_1/\text{IIP3}_2$ 扩大 4 倍，拉低整机 IIP3。
            - text: 整机噪声系数恶化，但整机 IIP3 大幅提高
              why: 增大第一级增益会压缩 $(F_2 - 1)/G_1$ 使噪声变好，但加重后级过载使 IIP3 变差。
            - text: 两者都不受第一级增益变化的影响
              why: 弗里斯公式与级联 IIP3 公式中，$G_1$ 分别出现在分母和分子，直接主宰两项整机指标。
          hint: 分别看 $G_1$ 在弗里斯公式 $(F_2 - 1)/G_1$ 和级联 IIP3 公式 $G_1/\text{IIP3}_2$ 中处于分子还是分母？
          explain: $G_1$ 处在噪声级联公式的分母和线性度级联公式的分子；增益提 6 dB 虽减轻混频器噪声影响，却让混频器折算输入线性度恶化近 6 dB。
      - card:
          title: 例题：计算两级级联 IIP3 与无杂散动态范围（SFDR）
          body: 某接收链路：LNA 增益 $G_1 = 10\text{ dB}$（10 倍）、$\text{IIP3}_1 = +10\text{ dBm}$（10 mW）；混频器 $\text{IIP3}_2 = +10\text{ dBm}$（10 mW）。(1) 求两级总 IIP3（dBm）；(2) 若接收机输入噪声底为 $-105.4\text{ dBm}$，求 SFDR。
          reveal:
            - title: 第 1 步：代入线性功率级联 IIP3 公式
              body: |
                $$\frac{1}{\text{IIP3}_{\text{tot}}} = \frac{1}{10\text{ mW}} + \frac{10}{10\text{ mW}} = 0.1 + 1.0 = 1.1\text{ mW}^{-1}$$
                $\text{IIP3}_{\text{tot}} = 1/1.1 \approx 0.909\text{ mW} \approx -0.41\text{ dBm}$（几乎完全被后级混频器折算项 $10/10 = 1.0$ 主导）。
            - title: 第 2 步：代入 SFDR 公式
              body: |
                $$\text{SFDR} = \frac{2}{3}\left(-0.41 - (-105.4)\right) = \frac{2}{3} \times 105 \approx 70.0\text{ dB}$$
      - item:
          id: q-casc-iip3-calc
          type: number
          prompt: 某两级接收前端中，LNA 增益 $G_1 = 15\text{ dB}$、$\text{IIP3}_1 = +10\text{ dBm}$，后级混频器 $\text{IIP3}_2 = +5\text{ dBm}$。用功率级联公式 $1/\text{IIP3}_{\text{tot}} = 1/\text{IIP3}_1 + G_1/\text{IIP3}_2$ 求整机总 IIP3 是多少 dBm（保留一位小数）？
          answer: -10.0
          tolerance: 0.2
          unit: dBm
          hint: 先把 15 dB、+10 dBm、+5 dBm 各自转成线性倍数或毫瓦数，算出倒数之和再取倒数换回 dBm。
          explain: $G_1 = 10^{1.5} \approx 31.62$，$\text{IIP3}_1 = 10\text{ mW}$，$\text{IIP3}_2 = 10^{0.5} \approx 3.162\text{ mW}$；$1/\text{IIP3}_{\text{tot}} = 0.1 + 31.62/3.162 = 10.1\text{ mW}^{-1}$，故 $\text{IIP3}_{\text{tot}} \approx 0.0990\text{ mW} \approx -10.0\text{ dBm}$。
      - item:
          id: q-sfdr-calc
          type: number
          prompt: 某射频接收机的整机输入三阶截点 $\text{IIP3} = -5\text{ dBm}$，输入等效总噪声底 $P_{\text{noise,in}} = -110\text{ dBm}$。求它的无杂散动态范围（SFDR）是多少 dB？
          answer: 70
          tolerance: 0.5
          unit: dB
          hint: 代入 $\text{SFDR} = \frac{2}{3}(\text{IIP3} - P_{\text{noise,in}})$ 算出的分贝值是多少？
          explain: $\text{SFDR} = \frac{2}{3}(-5 - (-110)) = \frac{2}{3} \times 105 = 70\text{ dB}$。
      - item:
          id: q-sfdr-improv
          type: choice
          prompt: 如果某接收机的整机噪声系数降低了 3 dB，同时整机 IIP3 保持不变，它的无杂散动态范围（SFDR）会增加多少 dB？
          options:
            - text: 增加 2 dB
              correct: true
            - text: 增加 3 dB
              why: SFDR 公式前面有系数 $2/3$，噪声底降 3 dB 时 SFDR 增加 $(2/3)\times 3 = 2\text{ dB}$。
            - text: 增加 4.5 dB
              why: 系数是 $2/3$ 而不是 $3/2$，不会比噪声底改善幅度更大。
            - text: 减少 2 dB
              why: 降低噪声系数会把噪声底往下压低，动态范围应扩大而非缩小。
          hint: 看公式 $\text{SFDR} = \frac{2}{3}(\text{IIP3} - P_{\text{noise,in}})$，当 $P_{\text{noise,in}}$ 降低 3 dB，整体差值扩大 3 dB 后乘以 $2/3$ 是多少？
          explain: 噪声底下降 3 dB 使 $\text{IIP3} - P_{\text{noise,in}}$ 增大 3 dB，乘以 $2/3$ 对应 SFDR 提升 2 dB。

boss:
  items:
    - id: b-rx-arch
      type: choice
      prompt: 比较超外差、零中频和低中频三种接收机架构，下面哪项概括是准确的？
      options:
        - text: 超外差选择性高但需片外滤波器；零中频易集成但受直流失调与 1/f 噪声困扰；低中频避开直流但需正交镜像抑制
          correct: true
        - text: 超外差无需任何滤波器最易单芯片集成；零中频必须用昂贵片外声表面波中频滤波器
          why: 恰好说反：需要片外镜像与中频滤波器的是超外差，省掉它们的是零中频。
        - text: 低中频把信号搬到零频直流，因此直流失调比零中频更严重
          why: 低中频把信号搬到几百 kHz–几 MHz，正是为了躲开零频处的直流失调与闪烁噪声。
        - text: 三种架构都不需要混频器和本振，仅靠 LNA 就能直接输出基带数据
          why: 三种经典射频接收架构都依赖本振与混频器完成频率搬移。
      hint: 从片外滤波器需求、直流失调/闪烁噪声和镜像抑制方式三个维度逐一核对。
      explain: 超外差性能成熟但分立元件多；零中频省滤波器易集成但面临直流失调与闪烁噪声；低中频折中两者，靠正交混频抑制邻道镜像。
    - id: b-zeroif-dc
      type: choice
      prompt: 零中频接收机为什么特别容易出现直流失调和 1/f 闪烁噪声问题？
      options:
        - text: 本振同频自混频生直流，基带正处 1/f 区
          correct: true
        - text: 零中频接收机的电源电压必须是负电压，引起所有晶体管反向导通
          why: 零中频采用正常正电源供电，问题源于 $f_{\text{LO}} = f_{\text{RF}}$ 的同频频谱结构。
        - text: 零中频不能使用硅 CMOS 工艺，只能用噪声极高的真空管制造
          why: 零中频恰恰是硅 CMOS 单片无线芯片最主流的架构。
        - text: 天线收到的电磁波在空气中传播时会自行变成直流电压
          why: 直流失调是在本振泄漏到射频端后再与本振相乘自混频时于芯片内部产生的。
      hint: 当 $f_{\text{LO}} = f_{\text{RF}}$ 时，泄漏的本振自己跟自己混频落在什么频率？有用基带又在哪里？
      explain: 本振泄漏到天线或 LNA 输入端再与本振自混频，产生与有用基带重叠的直流失调；同时零频附近正好是 MOSFET 闪烁噪声最强的频段。
    - id: b-friis-nf
      type: number
      prompt: 某接收链路：LNA 噪声系数 1.5 dB、增益 15 dB；混频器噪声系数 10 dB、增益 5 dB；中频放大器噪声系数 12 dB。用弗里斯公式求整机总噪声系数是多少 dB（保留一位小数）？
      answer: 2.7
      tolerance: 0.1
      unit: dB
      hint: 先把各级的 dB 值全部转成线性倍数 $10^{x/10}$，代入 $F_1 + (F_2 - 1)/G_1 + (F_3 - 1)/(G_1 G_2)$ 后再取 $10\lg$。
      explain: $F_1 \approx 1.413$，$G_1 \approx 31.62$，$F_2 = 10$，$G_2 \approx 3.162$，$F_3 \approx 15.85$；$F_{\text{tot}} \approx 1.413 + 9/31.62 + 14.85/100 \approx 1.846$，$\text{NF} = 10\lg(1.846) \approx 2.66 \approx 2.7\text{ dB}$。
    - id: b-lna-first
      type: choice
      prompt: 从弗里斯噪声级联公式出发，为什么接收机一定要把低噪声放大器（LNA）放在链路最前面？
      options:
        - text: 第一级噪声直接计入总噪声且其增益除小后级噪声
          correct: true
        - text: LNA 放在最后面时会把天线辐射的电磁波全部挡在芯片外面
          why: 天线后面的摆放顺序遵循级联噪声权重规律，并非物理遮挡电磁波。
        - text: 只要把 LNA 放最前面，整机的 IIP3 线性度就会无条件翻十倍
          why: 高增益 LNA 放最前面反而会增大后级混频器的线性度压力，前置 LNA 是为了噪声灵敏度而非自动抬高 IIP3。
        - text: 混频器必须接在天线之后才能正常与本振相乘
          why: 混频器放在 LNA 之后照样与本振混频，且噪声贡献被 LNA 增益大幅压低。
      hint: 在 $F_{\text{tot}} = F_1 + (F_2 - 1)/G_1 + \cdots$ 中，把低噪高增益级放在第一级还是第二级总噪声更小？
      explain: 第一级的噪声因子无衰减地直接进入总和，而后续所有级的过剩噪声都被第一级功率增益 $G_1$ 除小，因此 LNA 必须居于最前端。
    - id: b-lna-ls
      type: number
      prompt: 电感源极退化共源 LNA 的输入阻抗实部近似等于 $\omega_T L_s$。若晶体管 $\omega_T = 2\pi \times 50\text{ GHz}$，要匹配 $50\ \Omega$ 源阻抗，源极电感 $L_s$ 应取多少 nH（保留两位小数）？
      answer: 0.16
      tolerance: 0.01
      unit: nH
      hint: 由 $L_s = 50 / \omega_T$ 算出的电感换算成纳亨（$10^{-9}\text{ H}$）是多少？
      explain: $L_s = 50 / (2\pi \times 50\times 10^9) = 1 / (2\pi\times 10^9) \approx 0.159\text{ nH} \approx 0.16\text{ nH}$。
    - id: b-lna-lg
      type: number
      prompt: 某电感源极退化 LNA 的源极电感 $L_s = 0.16\text{ nH}$，工作频率 $f_0 = 2.4\text{ GHz}$、栅源电容 $C_{gs} = 100\text{ fF}$。栅极串联电感 $L_g$ 大约应取多少 nH 使输入端谐振（保留一位小数）？
      answer: 43.8
      tolerance: 0.5
      unit: nH
      hint: 由谐振条件 $L_g + L_s = 1/(\omega_0^2 C_{gs})$ 先算出总电感，再减去 $L_s$ 是多少纳亨？
      explain: $L_g + L_s = 1 / [(2\pi\times 2.4\times 10^9)^2 \times 100\times 10^{-15}] \approx 43.98\text{ nH}$，减去 $0.16\text{ nH}$ 得 $L_g \approx 43.8\text{ nH}$（工程上因 44 nH 片上电感难实现，常并联外加电容或改用片外匹配）。
    - id: b-mixer-compare
      type: choice
      prompt: 关于无源 MOS 开关混频器与双平衡有源吉尔伯特混频器的比较，哪项准确？
      options:
        - text: 无源低闪烁有损耗；吉尔伯特有增益抑馈通但吃裕度
          correct: true
        - text: 无源混频器提供超过 20 dB 的电压增益，而吉尔伯特混频器只有 -3.92 dB 损耗
          why: 恰好反了：无源开关混频器有约 3.92 dB 电压损耗，有源吉尔伯特混频器才提供正向变频增益 $\frac{2}{\pi}g_m R_D$。
        - text: 两者都不需要本振信号，只靠直流偏置即可自动搬移频谱
          why: 任何混频器都必须靠本振信号驱动才能实现频谱搬移。
        - text: 吉尔伯特混频器因为没有开关对，所以本振会全额泄漏进中频输出端
          why: 双平衡吉尔伯特单元恰恰靠两对对称交叉开关在差分输出端抵消 LO 和 RF 的直接馈通。
      hint: 从直流功耗/闪烁噪声、变频增益正负、端口馈通和电压裕度四个方面核对。
      explain: 无源开关混频器牺牲增益换取极低闪烁噪声和高线性度；双平衡吉尔伯特混频器提供正向增益并抵消端口馈通，但多层堆叠对低压电源裕度挑战较大。
    - id: b-vco-freq
      type: number
      prompt: 某 LC 压控振荡器的电感 $L = 2.0\text{ nH}$、总电容 $C = 2.2\text{ pF}$。求它的振荡频率约是多少 GHz（保留两位小数）？
      answer: 2.40
      tolerance: 0.03
      unit: GHz
      hint: 把 $L = 2.0\times 10^{-9}\text{ H}$ 与 $C = 2.2\times 10^{-12}\text{ F}$ 代入 $f = 1/(2\pi\sqrt{LC})$。
      explain: $\sqrt{LC} = \sqrt{4.4\times 10^{-21}} \approx 6.633\times 10^{-11}\text{ s}$，故 $f = 1 / (2\pi \times 6.633\times 10^{-11}) \approx 2.399 \approx 2.40\text{ GHz}$。
    - id: b-leeson-pn
      type: choice
      prompt: 相位噪声指标“$-120\text{ dBc/Hz @ 1 MHz}$”的含义以及利森公式指出的降噪方向，哪项表述正确？
      options:
        - text: 1 MHz 处 1 Hz 噪声低载波 120 dB；提 Q、增功率、降 F
          correct: true
        - text: 载波总功率固定为 -120 dBm；把谐振腔 Q 值降得越低，相位噪声就越安静
          why: dBc/Hz 是相对载波的 1 Hz 密度比值而非功率本身，且 Q 值越高相噪越低（$Q$ 翻倍降 6 dB）。
        - text: 偏离载波 1 MHz 处噪声比载波高出 120 dB；减小信号摆幅能把相位噪声降为零
          why: 负号表示噪声远低于载波，减小载波摆幅/功率 $P_{\text{sig}}$ 反而会让相位噪声恶化。
        - text: 振荡器每秒钟跳过 120 个周期；只有在 1 MHz 以上频偏才存在闪烁噪声
          why: 闪烁噪声（$1/f^3$）恰恰集中在极靠近载波的低频偏区域。
      hint: 拆开 dBc/Hz 的字面意义（relative to carrier per Hz），再回想利森公式里的 $Q$、$P_{\text{sig}}$ 与 $F$ 处于分子还是分母。
      explain: $-120\text{ dBc/Hz @ 1 MHz}$ 表示偏离载波 1 MHz、1 Hz 带宽内的噪声功率比载波低 120 dB；利森公式表明提高 $Q$、提高载波功率 $P_{\text{sig}}$、降低器件噪声因子 $F$ 是三大降噪主线。
    - id: b-intn-fracn
      type: choice
      prompt: 整数 N 锁相环频率综合器的频率分辨率由什么决定？为什么窄信道步进系统常改用小数 N 分频？
      options:
        - text: 分辨率等于参考频率；细步进迫使参考频率过低、环路过窄且大 N 放大带内相噪，小数 N 借动态切换解耦两者
          correct: true
        - text: 分辨率由 VCO 电感尺寸决定；小数 N 分频不需要任何参考晶振和环路滤波器
          why: 整数 N 分辨率严格等于参考频率 $f_{\text{ref}}$；小数 N 依然需要晶振和环路滤波器（用于滤除 $\Sigma\Delta$ 量化噪声）。
        - text: 分辨率等于输出频率的两倍；小数 N 只是为了把参考频率降到 1 Hz 以下
          why: 小数 N 的目的恰恰是允许使用几十 MHz 的高参考频率，同时保持几十 kHz 甚至 Hz 级细步进。
        - text: 分辨率由功放电源电压决定；整数 N 综合器无法产生超过 100 MHz 的频率
          why: 频率步进与功放供电无关，整数 N 可到几十 GHz，只是在细步进下受制于低 $f_{\text{ref}}$ 与高 $N$。
      hint: 从 $f_{\text{out}} = N f_{\text{ref}}$ 看 $N$ 加 1 时频率跳多少，以及 $f_{\text{ref}}$ 变小对 $f_{\text{BW}} \le f_{\text{ref}}/10$ 和 $20\lg N$ 的双重打击。
      explain: 整数 N 步进等于 $f_{\text{ref}}$，细步进会同时拖慢锁定并按 $20\lg N$ 抬高带内相噪；小数 N 通过动态在相邻整数间切换平均出小数分频比，兼顾高参考频率与精细分辨率。
    - id: b-pa-pmax
      type: number
      prompt: 某射频功放电源电压 $V_{DD} = 1.8\text{ V}$（经理想射频扼流圈供电，最大正弦峰值摆幅 $V_{DD}$），直接驱动 $50\ \Omega$ 负载。理想情况下最大输出功率约是多少 dBm（保留一位小数）？
      answer: 15.1
      tolerance: 0.2
      unit: dBm
      hint: 先用 $P_{\max} = V_{DD}^2 / (2R_L)$ 算出毫瓦数，再换算成 dBm 是多少？
      explain: $P_{\max} = 1.8^2 / (2 \times 50) = 0.0324\text{ W} = 32.4\text{ mW}$，故 $10\lg(32.4) \approx 15.1\text{ dBm}$。
    - id: b-pa-ropt
      type: number
      prompt: 某单端射频功放采用 $V_{DD} = 1.8\text{ V}$ 经理想扼流圈供电（峰值摆幅 $1.8\text{ V}$），要输出约 $23\text{ dBm}$（约 $200\text{ mW}$）射频功率。输出匹配网络需把 $50\ \Omega$ 负载变换成多大的最佳负载电阻（单位 Ω，保留一位小数）？
      answer: 8.1
      tolerance: 0.3
      unit: Ω
      hint: 代入 $R_{\text{opt}} = V_{DD}^2 / (2P_{\text{out}})$，注意 $23\text{ dBm} \approx 200\text{ mW} = 0.20\text{ W}$。
      explain: $R_{\text{opt}} = 1.8^2 / (2 \times 0.1995) \approx 8.12\ \Omega$（按 $200\text{ mW}$ 估算为 $8.1\ \Omega$，工程约 $8\ \Omega$）。
    - id: b-pa-eff
      type: choice
      prompt: 理想甲类（Class A）和乙类（Class B）射频功率放大器的最大理论漏极效率分别是多少？
      options:
        - text: 甲类 50%，乙类 78.5%（π/4）
          correct: true
        - text: 甲类 78.5%，乙类 50%
          why: 乙类导通角缩减到 $180^\circ$，效率高于 $360^\circ$ 全周期导通的甲类，数值不要记反。
        - text: 甲类 25%，乙类 100%
          why: 甲类经理想电感扼流圈供电（峰峰值 $2V_{DD}$）最高效率为 50%，乙类最高为 $\pi/4 \approx 78.5\%$。
        - text: 甲类 90%，乙类 99%
          why: 逼近 100% 理论效率的是丙类窄脉冲或丁/戊/己类开关功放，而非甲类或乙类。
      hint: 回想导通角 $360^\circ$ 与 $180^\circ$ 对应的经典效率上限。
      explain: 射频扼流圈供电下，甲类理论最大漏极效率为 $50\%$，乙类为 $\pi/4 \approx 78.5\%$。
    - id: b-inductor-q
      type: choice
      prompt: 标准硅 CMOS 芯片上的螺旋电感品质因数 $Q$ 通常只有 10 左右，限制它的最主要两类损耗机理是？
      options:
        - text: 金属趋肤串联电阻与硅衬底涡流电容损耗
          correct: true
        - text: 电感内部空气被击穿的电晕放电损耗，以及万有引力造成的导线形变
          why: 片上电感在芯片封装氧化层内工作电压仅伏级，不存在高压电晕击穿。
        - text: 硅材料本身是强铁磁体，产生严重磁滞损耗
          why: 硅是非磁性半导体，不存在铁磁磁滞损耗；衬底损耗源于半导体导电引起的涡流与阻性位移电流。
        - text: 金属导线在射频下变成了超导体，使感抗消失
          why: 室温铝/铜金属不仅不是超导体，还在趋肤效应下表现出比直流高得多的交流串联电阻。
      hint: 分别想想螺旋金属线本身的高频电阻，以及它下面紧贴着的低阻半导体硅衬底里会发生什么。
      explain: 金属层有限厚度叠加趋肤与邻近效应产生串联电阻 $R_s$，加上有损硅衬底的感应涡流和寄生电容耦合耗散，共同把片上螺旋电感 $Q$ 限制在 10 左右。
    - id: b-iip3-calc
      type: number
      prompt: 双音线性度测试：每音输入 $-30\text{ dBm}$，基波输出 $-10\text{ dBm}$，三阶交调输出 $-70\text{ dBm}$。求该电路的输入三阶截点 IIP3 是多少 dBm？
      answer: 0
      tolerance: 0.2
      unit: dBm
      hint: 先求基波与 IM3 输出之差 $\Delta P$，再代入 $\text{IIP3} = P_{\text{in}} + \Delta P/2$（或先求 OIP3 再减增益 $G$）。
      explain: 增益 $G = -10 - (-30) = 20\text{ dB}$，$\Delta P = -10 - (-70) = 60\text{ dB}$；$\text{OIP3} = -10 + 60/2 = +20\text{ dBm}$，$\text{IIP3} = 20 - 20 = 0\text{ dBm}$。
    - id: b-p1db-gap
      type: number
      prompt: 在三次非线性项主导的弱非线性射频电路中，输入 1 dB 压缩点 $P_{1\text{dB}}$ 大约比输入三阶截点 IIP3 低多少 dB（保留一位小数，填正数）？
      answer: 9.6
      tolerance: 0.2
      unit: dB
      hint: 回想 $A_{1\text{dB}} / A_{\text{IIP3}} \approx \sqrt{0.145 / (4/3)}$ 换算成分贝差是多少？
      explain: 由 $20\lg\sqrt{0.145 \times 3 / 4} \approx -9.63\text{ dB}$，因此 $P_{1\text{dB}}$ 通常比 IIP3 低约 $9.6\text{ dB}$。
    - id: b-rf-sparam
      type: choice
      prompt: 测量一款射频低噪声放大器二端口散射矩阵（S 矩阵）时，若看到 $|S_{11}| = -15\text{ dB}$、$|S_{21}| = +16\text{ dB}$、$|S_{12}| = -35\text{ dB}$，这组数据说明该放大器处于什么状态？
      options:
        - text: 输入匹配好、正向增益 16 dB、反向隔离强
          correct: true
        - text: 输入端反射了 95% 功率，且完全没有正向放大能力
          why: $|S_{11}| = -15\text{ dB}$ 表示反射功率仅约 3%，$|S_{21}| = +16\text{ dB}$ 说明有 16 dB 正向功率增益。
        - text: 放大器反向增益高达 35 dB，正在把输出信号猛烈灌回天线
          why: $|S_{12}| = -35\text{ dB}$ 是负分贝，表示反向泄漏被衰减了 35 dB（隔离极好）。
        - text: 该器件是无源衰减器，没有接通直流供电电源
          why: 正向传输系数 $+16\text{ dB} > 0\text{ dB}$ 明确表明这是一个正常工作的有源放大器。
      hint: 逐个读出 $S_{11}$（输入反射）、$S_{21}$（正向增益）和 $S_{12}$（反向隔离）的符号和幅值含义。
      explain: $|S_{11}| = -15\text{ dB}$ 对应良好输入匹配，$|S_{21}| = +16\text{ dB}$ 为正向功率增益，$|S_{12}| = -35\text{ dB}$ 代表优良的反向隔离度。
    - id: b-rx-chain-order
      type: order
      prompt: 按微弱射频信号从空中进入超外差接收机直至恢复数字比特的物理顺序，排列核心电路单元。
      steps:
        - 天线与射频预选/镜像抑制滤波器
        - 低噪声放大器（LNA）提供低噪高增益放大
        - 下变频混频器配合本振将射频搬移至中频
        - 中频带通滤波器与中频放大器完成信道选择
        - 基带解调器与模数转换器恢复数字信息
      hint: 从天线接收、前端低噪放大、变频、中频选频到基带解调排成一条完整接收链路。
      explain: 超外差接收链路遵循天线与预选滤波→LNA→混频器（配本振）→中频滤波与放大→解调与 ADC 的经典顺序。
