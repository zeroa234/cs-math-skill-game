skill: D.1.2
version: 2
authors: [main-agent]
brief:
  why: |
    在 D.1.1 里你已经能用 SQLite 写出规范的关系表、外键约束和多表查询，可一旦几百名用户同时抢最后一张车票、突然拔掉服务器电源，或者数据涨到千万行时一句 `WHERE` 慢成十秒，单靠把 SQL 语法背熟就束手无策了。本包建立在 D.1.1、数据结构（F.1.1）与计组存储基础（C.1.1）之上，带你钻进现代数据库引擎内部五大核心部件：并发控制（冲突可串行化、2PL、时间戳与 MVCC）、WAL 日志与 ARIES 崩溃恢复、哈希/B+ 树索引与并发闩锁、物理算子与连接 I/O 算法，以及基于选择率与直方图的查询代价优化器。
  outcomes:
    - 构造优先图判断事务交错顺序是否冲突可串行化，并用严格两阶段锁、时间戳、隔离级别与 MVCC 防住脏读/不可重复读/幻读
    - 算清缓冲池 STEAL / NO-FORCE 策略、预写日志（WAL）及 ARIES 三遍恢复（分析/Redo/Undo）如何兼顾高吞吐与崩溃不丢数
    - 计算千万行 B+ 树的精确层数与点查页 I/O 次数，理解可扩展哈希、布隆过滤器与 B+ 树螃蟹加锁协议（Latch Crabbing）
    - 计算并对比块嵌套循环连接、排序归并连接与 Grace 哈希连接的磁盘页 I/O 开销，理解火山流式/向量化与并行查询执行
    - 按关系代数等价规律改写下推选择/投影，并结合选择率直方图与聚簇/非聚簇代价估算在“索引扫描 vs 全表顺序扫描”间科学决策
terms:
  - term: 事务
    def: 作为单一逻辑工作单元执行的读写操作序列，要么全部成功提交生效，要么全部回滚撤销，绝不留下改一半的破碎状态。
  - term: 调度
    def: 多个并发事务的具体读写步骤在时间轴上的交错排定次序；串行顺序逐个执行事务必正确，交错顺序须保证与之等价。
  - term: 冲突可串行化
    def: 一个交错事务执行顺序在不改变任何“同对象含至少一次写”的冲突操作相对次序下，等价于某条无交错的串行事务排列。
  - term: 两阶段锁
    def: 并发控制协议（2PL）：每个事务严格分为只增不放的“加锁成长阶段”与只放不再加的“放锁收缩阶段”，保证结果冲突可串行化。
  - term: 死锁
    def: 两个或多个事务互相等候对方手里已经占住的锁而永久僵持无法推进的状态，须依靠检测环打破或按年龄预防避免。
  - term: 幻读
    def: 同一事务内先后两次按相同范围条件查询时，因另一事务途中新插入并提交了符合该条件的新行，导致第二次多出“幽灵新行”。
  - term: MVCC
    def: 多版本并发控制：系统为同一行逻辑数据保留多个带时间区间的历史物理版本，让只读查询读取一致旧快照而不阻塞写入。
  - term: 缓冲池
    def: 数据库引擎自己在内存里划出的一块高速缓冲帧缓存区，负责把磁盘上的数据页搬入内存并决定何时写回或淘汰换出。
  - term: 脏页
    def: 已经被内存中的事务修改、但最新改动尚未写回持久化磁盘数据页上的缓冲池内存页。
  - term: WAL
    def: 预写式日志（Write-Ahead Logging）：任何被改动的脏页写入磁盘数据库文件之前，记录这次变更的日志必须先持久化刷入稳固日志文件。
  - term: 检查点
    def: 定期把缓冲池运行信息与脏页状态记进持久化快照节点的操作，用来在系统崩溃恢复时大幅截断需要往前翻看的日志历史。
  - term: B+ 树
    def: 数据库最核心的高扇出平衡多叉索引树：所有真实记录引用（或数据行）只存在有序相连的最底层叶节点页里，上层仅作高效路标。
  - term: 扇出
    def: B+ 树内部节点每一页最多能容纳的分支子引用数量；扇出越高（例如 200），千万行数据也只需 3 到 4 层即刻触底。
  - term: 向量
    def: 在机器学习与向量搜索中由一组固定长度浮点数构成的高维特征表示，用来度量文本、图像或音频之间的语义距离。
  - term: 布隆过滤器
    def: 极其紧凑的位图概率型过滤结构，能用极小内存开销 100% 确定“某个键绝对不在集合里”（有极低可控误报率，绝无漏报）。
  - term: 闩锁
    def: 保护数据库引擎内部共享内存数据结构（如 B+ 树缓冲帧或哈希表桶数组）在微秒级并发修改期间不破坏引用完整性的轻量底层同步锁。
  - term: 执行计划
    def: 优化器选定并交给执行引擎跑的一棵物理算子树，标明了每一步用全表扫还是索引扫、采用哪种连接算法以及流转次序。
  - term: 算子
    def: 查询执行树里的基本计算积木步骤（如顺序扫描、B+ 树扫描、外部排序、哈希连接、分组聚合），靠统一接口拉推元组页。
  - term: 选择率
    def: 表中满足某个查询谓词条件的行数占整张表总行数的比例，决定过滤后大致剩多少数据以及走索引是否比全表顺序扫描更划算。

lessons:
  # ======================================================================== 并发控制
  - id: acid
    chapter: 并发控制
    title: 并发动机、事务模型与 ACID 四大支柱
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 银行系统处理一笔“A 账户扣 100 元、B 账户加 100 元”的转账。如果 A 刚扣完 100 元还没来得及给 B 加上，机房突然断电重启；或者两笔取款恰好在同一毫秒先分别读取到旧余额 `100` 元然后同时各扣一次！如果没有整体保护包裹，会发生什么？
          options:
            - text: 钱要么莫名其妙半路蒸发丢失，要么同一份余额被两笔并发请求重复花掉两次！必须把这组步骤包成一个“要么全做完、要么全作废且互不干扰”的逻辑单元
              correct: true
            - text: 断电后硬盘自己会把扣掉的 100 元自动塞回 A 账户里
              why: 磁盘本身只认识孤立的一块块物理页写，若没有日志和统一提交/回滚管理，半途断电必然留下“扣了没加”的破碎烂账
            - text: 只要不用 `SELECT` 就能保证永远不出现并发覆盖错
              why: 多客户端同时做“读后改写（Read-Modify-Write）”即使只写更新一样会相互覆盖彼此结果
          explain: 要守住多用户并发修改和随时可能断电机器上的数据真理性，数据库抽象出了核心执行单位——**事务**与 **ACID 四特性**（11.1–11.7 节）。
      - card:
          title: 事务边界与 ACID 的前两条：原子性（A）与一致性（C）（11.1–11.5）
          body: |
            数据库把一组必须同生共死的读写操作放进 `BEGIN ... COMMIT`（或失败 `ROLLBACK`）之间，称作一个 **事务（Transaction）**：
            - **原子性（Atomicity）**：事务内的全部动作要么一起成功提交生效，只要中途出错或未提交断电，系统就借助日志回退撤销得干干净净，绝不留“扣一半没加”的半吊子；
            - **一致性（Consistency）**：事务开始前数据库遵守全部 `PRIMARY KEY / FK / CHECK` 与业务守恒规则（总金额不变），事务顺利提交后依然完整遵守。
      - card:
          title: ACID 的后两条：隔离性（I）与持久性（D）（11.6–11.7）
          body: |
            并发与断电全靠另外两条顶住：
            - **隔离性（Isolation）**：多个并发事务交错跑的时候，各自感知效果就像系统里只有自己一个人串行跑完，互相看不到半途未稳的中间脏修改（并发控制章节核心！）；
            - **持久性（Durability）**：一旦事务收到 `COMMIT` 成功确认，哪怕下一毫秒拔掉服务器电源重启，那份结果也已写入非易失持久化记录，绝不丢失（日志与恢复章节核心！）。
      - item:
          id: q-acid-match
          type: match
          prompt: 把 **ACID** 四项核心属性与它们各自守护的数据安全红线配对。
          pairs:
            - ["**原子性（Atomicity）**", 转账扣款后还没入账时系统报错回滚，已扣金额自动复原“全做或全不做”]
            - ["**一致性（Consistency）**", 转账前后库内所有主键、外键、CHECK 与账户总余额守恒规则始终成立]
            - ["**隔离性（Isolation）**", 两个同时修改同一账户的并发请求互不覆盖污染彼此读取和中间状态]
            - ["**持久性（Durability）**", 返回 COMMIT 提交成功后即使立刻断电崩溃，重启后新余额依然稳稳存在]
          explain: 记死：**原子性/持久性**靠“日志写磁盘与崩溃恢复”实现（第 2 章），**隔离性**靠“锁/时间戳/多版本并发控制”实现（第 1 章），合起来才护航业务**一致性**！
      - card:
          title: 例题：为什么把两条 `UPDATE` 写成各自自动提交（Auto-Commit），就丢了原子性？
          body: |
            默认模式下许多客户端每敲一条 SQL 就自动提交一次。如果程序员没写 `BEGIN ... COMMIT` 直接发两句：第 1 句 `UPDATE acct SET bal = bal - 100 WHERE id = 'A'`；第 2 句 `UPDATE acct SET bal = bal + 100 WHERE id = 'B'`。会发生哪两种故障？
          reveal:
            - title: 第 1 步：两句之间被别的事务偷窥到“钱暂时少了 100 元”的中间缺口
              body: 第 1 句刚单独自动提交完，正好有对账报表扫描全行求和——此时 A 少了 100 而 B 还没加，全行总账平白无故丢了 100 元（既破隔离又破瞬时一致）。
            - title: 第 2 步：若第 2 句撞上数据库违反 `CHECK` 失败或断电，第 1 句再也撤不回！
              body: 因为第 1 句已经脱离了单一**事务**自顾自先提交落地，第 2 句报错时数据库根本不知道它俩本来是一对！唯有放进同一组 `BEGIN ... COMMIT` 边界里，失败一个才会自动把整个组全部回滚撤销。
            - title: 第 3 步：同时还要明白“一致性”由数据库约束与正确应用事务逻辑共同守卫
              body: 数据库引擎靠原子性、隔离性与持久性加上表内主键外键和 `CHECK` 约束守住物理及结构合法性；同时业务程序员也要把转账一减一加放进同一个事务边界里，引擎和业务代码双向配合才护住最终账目恒等。
      - item:
          id: q-atomicity-vs-durability
          type: choice
          prompt: 在服务器突然遭遇停电后重启数据库，“把还没来得及 `COMMIT` 就写进半途的修改全部撤销抹平”和“把已经收到 `COMMIT` 的结果即使还没落入主数据页也坚决补写找回”，分别保证的是 ACID 里的哪两条？
          options:
            - text: 撤销未提交半途修改保住**原子性（Atomicity）**；补回已提交结果保住**持久性（Durability）**
              correct: true
            - text: 两者全都属于隔离性（Isolation），与磁盘是否掉电无关
              why: 隔离性处理多个并发事务运行时的相互干扰；断电重启后决定“未提交回滚（Undo）”和“已提交重做（Redo）”分别对应原子性与持久性
            - text: 已提交事务断电后直接丢弃掉，只保未提交事务
              why: 这与事务合同彻底相反！用户已经看到“支付成功”的已提交事务必须 100% 持久留存，没提交完成的才全部回滚作废
          explain: 后面第 2 章（WAL 与 ARIES）你就会亲手写出 Undo 保原子、Redo 保持久的完整步骤！
      - item:
          id: q-isolation-read-modify-write
          type: choice
          prompt: 抢票系统同时有两位用户下单抢最后 `1` 张票。事务 T1 和 T2 几乎同时先各自执行 `SELECT left FROM tickets` 都读到 `1`，随后各自算出 `1 - 1 = 0` 并各执行 `UPDATE tickets SET left = 0`，双方各自都告诉用户抢票成功！这里主要缺失了 ACID 的哪一条？
          options:
            - text: '**隔离性（Isolation）**：两个并发事务互相看见并交错覆盖了彼此的中间计算，实际把仅剩 1 张票卖出了 2 份'
              correct: true
            - text: 持久性（Durability），因为服务器没有在那一秒断电
              why: 机器压根没断电，两条更新都持久化写了进去，错在并发交错执行破坏了串行等效隔离！
            - text: 与并发无关，纯粹是因为 SQL 不允许把 `1` 减掉 `1`
              why: 如果两条请求串行排队先让 T1 买完改为 0，T2 再开始读到 0 并合理报错“已售罄”就不会超卖——核心正是缺乏有效并发隔离控制
          explain: 搞懂这四项保证之后，下一课立刻进核心算术：到底什么样的时间交错次序才算绝对安全？

  - id: conflicts
    chapter: 并发控制
    title: 并发调度、冲突操作与优先图环检测（综合练习 4）
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 如果数据库为了绝对不出错，干脆强制全校几千人排成一队“同一秒只准 1 个事务跑，跑完才放第 2 个”，那多核服务器吞吐会跌成乌龟！于是数据库允许不同事务的读写交叉混跑。请问哪两步凑在一起交错颠倒时，**真的**会改坏最终结果（构成“冲突”），哪两步随便互相交换次序都毫发无损？
          options:
            - text: 两个“不同事务”针对“同一个对象”且其中**至少有一个是写（Write）**的操作才构成冲突不能随便对调；两个全是读（Read-Read）或操作不同对象（A 与 B）怎么对调顺序都完全等价！
              correct: true
            - text: 只要两个事务都在读同一个值 `R1(A)` 和 `R2(A)` 就必坏无疑
              why: 两位学生同时看同一页静态课表既不改内容也没副作用，先读还是后读 100% 等价，毫无冲突
            - text: 任何两个事务无论看什么对象只要一混着跑结果一定全是错的
              why: 当 `T1` 只管学生 `A`、`T2` 只管课程 `B` 时，交错跑的结果与先 T1 后 T2 完全一模一样，毫无必要排队干等
          explain: 区分真假冲突并用“优先图找环”形式化裁判某个交错运行次序安不安全，是并发控制理论的核心（11.3、11.6 节 & 综合练习 4）。
      - card:
          title: 并发调度与三类异常（11.3、11.6）
          body: |
            多个事务读写操作在时间轴上交错排放出的次序叫一个 **调度**（Schedule）。若并发运行没控制好冲突，会爆出三类读写异常：
            - **写-读冲突（脏读 WR）**：T2 读到了 T1 还没提交（随后又回滚撤销掉！）的虚假中间值；
            - **读-写冲突（不可重复读 RW）**：T1 前后两次读同一行 A，中间却被已提交的 T2 改掉了，同一事务里前后答案不一；
            - **写-写冲突（丢失更新 WW）**：T2 后手直接把 T1 刚写的更新覆盖抹平。
      - card:
          title: 冲突可串行化与优先图（Precedence Graph）算法（综合练习 4）
          body: |
            如果一个交错调度仅靠不断交换**互不冲突的相邻操作**就能排成彻底先跑完一个再跑下一个的串行次序，就称它满足 **冲突可串行化**（绝对等价串行执行，安全！）。怎么一秒机械判别？画**优先图**（以每个事务作图节点）：
            - 遍历调度里每一对不同事务 `(i < j)` 且作用于**同一对象**、至少一个是写操作 `(W)` 的配对，从前一手 `T_u` 往后一手 `T_v` 画一条有向边 `T_u → T_v`；
            - **结论：优先图无环（DAG） ⇔ 该调度冲突可串行化（拓扑排序序即等价串行序）；优先图一旦成环 ⇔ 绝非冲突可串行化（危险！）**。
      - item:
          id: q-conflict-pairs
          type: choice
          multi: true
          prompt: 下面哪几对相邻操作发生在**不同事务** `T1` 与 `T2` 之间时，属于**不能直接对调先后顺序的冲突操作对**？（多选）
          options:
            - text: "`W1(A)` 与 `R2(A)`（写-读冲突：交换顺序会直接改变 `T2` 读到的值是不是 `T1` 新写的）"
              correct: true
            - text: "`R1(A)` 与 `W2(A)`（读-写冲突：交换顺序会改变 `T1` 究竟读出旧值还是新值）"
              correct: true
            - text: "`W1(A)` 与 `W2(A)`（写-写冲突：交换顺序会改变最终 `A` 在数据库里留下来是谁的值）"
              correct: true
            - text: "`R1(A)` 与 `R2(A)`（两个事务纯粹都在读取同一个对象 `A`）"
              why: 只读不改不会改变 `A` 的内容也不改变彼此返回值，读-读操作永远可任意交换
            - text: "`W1(A)` 与 `W2(B)`（写入的是互不相关的两个不同数据对象 `A` 与 `B`）"
              why: 写 `A` 绝不影响 `B`，不同对象之间互不冲突可自由交换次序
          explain: 记死冲突三要素：**不同事务 + 同一对象 + 至少一方为写（WR / RW / WW）**，缺一条件即不冲突！
      - card:
          title: 例题：用 Python 拓扑检测实测综合练习第 (4) 题调度 `R1(A) W1(A) R2(A) W2(A) R2(B) W2(B) R1(B) W1(B)`！
          body: |
            综合练习第 (4) 题给出调度：`R1(A) W1(A) R2(A) W2(A) R2(B) W2(B) R1(B) W1(B)`。按照优先图建边规则走两步看它是不是冲突可串行化：
          reveal:
            - title: 第 1 步：逐个对象扫冲突配对——A 生成 `T1 → T2`，B 生成 `T2 → T1`！
              body: 在对象 `A` 上，`T1` 的 `R1(A)/W1(A)` 全跑在 `T2` 的 `R2(A)/W2(A)` 前面，且含写操作（`W1(A)→R2(A)`、`W1(A)→W2(A)` 等），全部指向 **`T1 → T2`**；接着看对象 `B`：`T2` 的 `R2(B)/W2(B)` 跑在 `T1` 的 `R1(B)/W1(B)` 前面，冲突边指向 **`T2 → T1`**！
            - title: 第 2 步：图里形成环 `T1 ↔ T2`，拓扑排序直接抛 `CycleError` 拒判！
              body: 优先图里要求“T1 必须排在 T2 前（为了 A 对齐）”同时又要“T2 必须排在 T1 前（为了 B 对齐）”，形成双向死环！验证脚本跑 Python `TopologicalSorter` 直接抛出 `CycleError`——证实该调度**不是**冲突可串行化！这等价于现实里 T1 刚拿完旧 A 算账而 B 却先被 T2 改跑了，全局账面严重不一致！
            - title: 第 3 步：同时区分“视角可串行化（View Serializability）”与实操优先选择
              body: 极少数存在“先不读直接盲写（Blind Write）”的奇特调度虽按值视角仍等效某个串行序，却无法靠优先图简单判出（属于 NP 完全难题）。因此实用数据库系统几乎全以**冲突可串行化**作为清晰高效的工程安全黄金标准。
      - item:
          id: q-precedence-graph-ex4
          type: choice
          prompt: 对照综合练习第 (4) 题的交错调度 `R1(A) W1(A) R2(A) W2(A) R2(B) W2(B) R1(B) W1(B)`：画出它的优先图后包含哪些有向边，该调度满足 **冲突可串行化** 吗？
          options:
            - text: 优先图同时存在有向边 `T1 → T2`（因对象 `A` 冲突）和 `T2 → T1`（因对象 `B` 冲突），有环，因此**不是冲突可串行化调度**
              correct: true
            - text: 优先图没有任何边，完全无环，等价于先跑 T1 再跑 T2
              why: 只要按顺序检查 `A` 和 `B` 上的写前/写后跨事务配对，`T1→T2` 和 `T2→T1` 这两条反向依赖边清清楚楚立刻显现
            - text: 图里只有单向边 `T1 → T2`，所以先 T1 后 T2 是可串行化的
              why: 看后半截对象 `B`：`R2(B) W2(B)` 在 `R1(B) W1(B)` 之前，必有一条 `T2 → T1` 反向边锁成双环
          explain: 只要把每条跨事务同对象至少一写的有序对全转换成箭头画上去，有没有环一眼定生死！
      - item:
          id: q-conflict-blind-write
          type: choice
          prompt: 判断调度安全性时，如果仅看“两个事务先后都在**只读**同一个学生成绩 `R1(A)`、`R2(A)`”，这算不算需要画进优先图里的冲突？
          options:
            - text: 不算！纯粹只读不会改写任何值，交换先后顺序对双方返回结果和最终库状态毫无影响，优先图不画边
              correct: true
            - text: 算冲突，只要不同事务碰同一个对象即使全读也要互相挡死
              why: 冲突必须满足三条件：**不同事务 + 同对象 + 至少一方包含写（W）**，纯并发读取天然相容
            - text: 读-读操作会让其中一个事务强制读出相反数字
              why: 只读操作不修改数据内容，互不影响结果
          explain: 也正是因为 Read-Read 绝不冲突，共享读锁才能同时并发发给上百位查询用户！
      - item:
          id: q-acyclic-schedule-test
          type: choice
          prompt: 再练一条新调度：`R1(A) W1(A) R2(B) W2(B) R2(A) W2(A)`（注意这里 `T1` 只碰 `A`，而 `T2` 先碰了 `B` 再碰 `A`）。请问这条调度冲突可串行化吗？
          options:
            - text: '**是的！**因为对象 `B` 只有 `T2` 独占无跨事务冲突，唯一冲突集中在对象 `A` 且全是 `T1 → T2`，优先图无环，等价于串行 `T1 → T2`'
              correct: true
            - text: 不行，只要调度里出现了两个字母 `A` 和 `B` 就必然成环
              why: 成环必须同时出现“因为某对象需要 `T1 → T2`”且“因为另一对象需要 `T2 → T1`”；这里 `T1` 从未碰 `B`，故不可能出现 `T2 → T1`
            - text: 优先图无环，且等价于先执行 `T2` 再执行 `T1`
              why: 对象 `A` 上是 `W1(A)` 写在 `R2(A)` 前面，方向是 `T1 → T2`，绝不是 `T2 → T1`！
          explain: 会动手画优先图，就拿到了一切并发锁协议和时间戳协议是否正确（是否只放出可串行化调度）的最高数学裁判尺！

  - id: two-phase
    chapter: 并发控制
    title: 两阶段锁（Strict 2PL）、死锁处理与锁粒度（综合练习 4）
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 既然我们已经知道上一课那个成环调度 `T1 ↔ T2` 不能放行，真正在工程引擎里靠“给数据对象加读锁（共享锁 S）和写锁（排他锁 X）”怎么挡住它？假如允许 `T1` 一读完写完 `A` 就立刻急着把 `A` 的锁放掉再接着去读 `B`，能防住刚才那个双环灾难吗？
          options:
            - text: 防不住！一旦中途提前放了锁 `A` 又继续申请锁 `B`，正是刚才 `T1 ↔ T2` 成环的原因；必须规定先只加锁不准放、并且**所有排他写锁一直死死攥到 `COMMIT/ABORT` 结束才统一全释放（Strict 2PL）**！
              correct: true
            - text: 只要每行写完一句立即松手释放锁，就一定既快又绝对可串行化
              why: “用完单行就立刻放锁”虽然没有锁竞争，但另一事务 `T2` 马上趁虚读走没提交的半成品并改走另一张表（如 `B`），立刻引发不可串行化与级联回滚！
            - text: 加锁只能加写锁，永远不需要区分共享读锁 `S`
              why: 共享读锁（S）允许十几个只读事务安心同时并发读同张热点商品，大幅提高并发度，只有真有写锁（X）需求时才互斥挡路
          explain: 这就是数据库最经典可靠的悲观锁基石：**加锁/放锁分两阶段控制协议**（12.1–12.5 节）。
      - card:
          title: 共享/排他锁与两阶段锁协议（12.1–12.2、综合练习 4）
          body: |
            事务锁（Transaction Lock，注意区别后文保护内部物理内存的短期同步锁）分共享读锁 `S`（读-读相容）和排他写锁 `X`（与任何锁全互斥）。

            **两阶段锁**（2PL）要求每个事务守死两条规矩：**成长阶段只能不断拿新锁；一旦释放过哪怕第 1 把锁进入收缩阶段，此后就永远不准再申请任何新锁！**
            **严格两阶段锁（Strict 2PL）**更彻底：**一直把持全部排他写锁死抱到事务彻底 `COMMIT/ABORT` 才一次放光**——既保冲突可串行化，又防级联回滚！
      - card:
          title: 死锁处理与多粒度锁（12.3–12.4）
          body: |
            严格攥着锁不放会引出 **死锁**（`T1` 拿 A 等 B，同时 `T2` 拿 B 等 A，12.3 节）：
            - **死锁检测打破**：画等待图找环并回滚代价最小的一方；
            - **死锁预防**：按事务起始年龄时间戳排尊卑（Wait-Die / Wound-Wait）彻底防成环；
            - **多粒度意向锁（12.4）**：先在库/表挂意向锁（IS/IX），不用扫百万行就一秒知晓内部有没有冲突行锁。
      - item:
          id: q-2pl-phases-match
          type: match
          prompt: 把 **两阶段锁（2PL）** 及其演化机制与各自解决的问题对应起来。
          pairs:
            - ["**普通 2PL（Growing + Shrinking）**", 通过严格切分先申请后释放两段，数学上保证产出全部调度必无优先环（冲突可串行化）]
            - ["**严格两阶段锁（Strict 2PL）**", 把全部排他锁扣留直到 `COMMIT/ABORT` 才释放，彻底防止另一事务读到中途修改导致级联回滚]
            - [Wait-Die / Wound-Wait（按年龄定优先级）, 在等锁那一刻按事务年龄单向约束防成环，无需事后跑死锁环检测]
            - [表级意向锁（IS / IX）, 让想给整张表加锁的操作无需逐一扫百万行即可瞬间核对内部存不存在冲突行锁]
          explain: Strict 2PL 是极多经典商业单机事务引擎默认采用的扎实底座！
      - card:
          title: 例题：跑一遍 Strict 2PL 如何挡住综合练习第 (4) 题的非法交错！
          body: |
            把刚才那条坏调度 `R1(A) W1(A) R2(A) W2(A) R2(B) W2(B) R1(B) W1(B)` 放进遵守 Strict 2PL 的数据库引擎里跑一遍，引擎究竟在哪里踩下刹车？
          reveal:
            - title: 第 1 步：`T1` 改完 `A` 却还不准放锁，直接把 `T2` 挡在 `A` 门外等待
              body: 在真实 Strict 2PL 下，当 `T1` 读改 `A`（拿到 `X(A)`）后直到自己跑完 `B` 并最终 `COMMIT` 之前，**绝不会松开 `X(A)`**！于是下一拍 `T2` 想请求读 `A`（需要 `S(A)`）时被当场阻塞挂起等 `T1` 彻底结束——坏交错的开头第一步就被严严实实拦在门外，`T1` 从容跑完 `B` 并提交释放锁后，`T2` 再顺畅接着执行，完美实现先 `T1` 后 `T2` 串行效果！
            - title: 第 2 步：哪怕 `T1` 先抓 A、`T2` 先抓 B，Strict 2PL 也绝不会放出错调度——而是引发死锁回滚一方
              body: 设想换个次序：`T1` 先拿 `X(A)`、`T2` 同时先拿 `X(B)`，随后 `T1` 伸手要 `B`、`T2` 伸手要 `A`——两个事务互相抱住对方要的锁僵持等待成死锁！此时死锁检测器发现环并挑一个回滚（比如回滚 `T2` 释放 `B`），让 `T1` 安稳跑完提交，随后重启 `T2`！**宁可重试，也绝不允许任何非法乱序写入成功提交！**
            - title: 第 3 步：与“只要求普通 2PL”相比，Strict 2PL 多顺手消灭了级联回滚隐患
              body: 普通 2PL 虽然也能防成环，但如果 `T1` 刚写完 `A` 就提前松开 `X(A)`、紧接着被 `T2` 读走那还没提交的 `A`，万一随后 `T1` 在算 `B` 时出错主动回滚，连带着早已用假 `A` 算过账甚至快提交的 `T2` 也必须一起推翻重来（级联回滚 Cascade Abort）。Strict 2PL 死握写锁直至提交结束才放手，从根上杜绝了这个连环雷！
      - item:
          id: q-strict-2pl-ex4
          type: choice
          prompt: 按综合练习第 (4) 题第二问：用 **Strict 2PL** 如何防住 `R1(A) W1(A) R2(A) W2(A) R2(B) W2(B) R1(B) W1(B)` 这种非冲突可串行化调度？
          options:
            - text: 在 Strict 2PL 下，`T1` 持有 `A` 上的排他写锁直到自己彻底提交之前都不释放，直接阻塞随后试图访问 `A` 的 `T2`（若双方交叉持有 A/B 互等则会触发死锁并由系统回滚其中一方重跑）
              correct: true
            - text: Strict 2PL 允许 `T1` 一写完 `A` 就立刻解锁让 `T2` 插进来改写 `A`
              why: 一写完每步就立刻解锁会彻底毁掉 2PL 的“收缩阶段之后不准再拿锁”规则并立刻放出刚才的双环错误调度！
            - text: Strict 2PL 会把 `A` 和 `B` 两个数据对象永远删掉
              why: 严格两阶段锁只是按规矩锁住并发访问先后顺序并延迟释放至提交，绝不删数据
          explain: 悲观锁的哲学就一句话：**“先打听拿锁再动数据，拿不到就原地等或回滚，坚决把坏调度扼杀在摇篮里。”**
      - item:
          id: q-lock-compatibility
          type: choice
          prompt: 已有事务 `T1` 正稳稳拿着某行记录 `R` 的共享读锁（S 锁）在核对数据。此时紧接着到达的两个不同请求：`T2` 想读 `R`（申请 S 锁）以及 `T3` 想修改 `R`（申请排他 X 锁），谁能立刻拿到锁，谁必须等待？
          options:
            - text: "`T2` 立刻顺利拿到 S 锁（共享读锁彼此相容可多人并发读）；`T3` 必须阻塞等待，因为 X 锁与任何已有锁均不兼容互斥"
              correct: true
            - text: "`T2` 必须等待，只有 `T3` 能直接抢先拿到 X 锁修改"
              why: 这彻底反了！共享读与共享读完全不冲突，而排他写锁在还有其他事务正读着同一行时绝不能贸然改写否则直接造成不可重复读
            - text: "`T2` 和 `T3` 都可以不用等直接同时改写 `R`"
              why: 若允许 X 锁与 S 锁并存，读取方会看到未完修改或读完立即遭改写，失去锁隔离保护意义
          explain: 记清锁矩阵：**`S` 和 `S` 相容（随便一起读），凡带 `X`（无论是 `S-X`、`X-S` 还是 `X-X`）统统互斥等待**！

  - id: timestamps
    chapter: 并发控制
    title: 乐观派时间戳排序（T/O）与乐观并发控制（OCC）
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 锁表管理每次读写都得查全局锁记录、挂等待队列还闹死锁。如果我们干脆压根不维护任何阻塞等待队列：每个事务一开局就领一个唯一严格递增的出生钟点号（时间戳 `TS`），假设冲突其实很稀罕——干脆先放手全速跑，到关键读写或最后提交瞬间再核查“有没有撞车、撞了直接回滚重试”！这套路线适合什么场景？
          options:
            - text: 当并发冲突很少发生时（比如大部分操作都在读或互不相交的行上），无阻塞乐观跑完全不用花开销抢锁等待，吞吐飞快；只有高冲突抢同一行热点时频繁回滚才会变慢！
              correct: true
            - text: 因为不建等待队列，所以哪怕发现有人写乱了也强行当作没看见直接放行破坏数据
              why: 无锁控制绝对不能牺牲正确性——它靠“时间戳序核验或提交期读写集冲突校验”坚决拒绝违规调度并让后发/出错者回滚重跑！
            - text: 时间戳排序在任何情况下都可以不保存任何最近读过或写过的时间记录
              why: 引擎必须在数据行元数据上记下最近读过的 `R-TS` 和最近写过的 `W-TS`（或在 OCC 里记住私有读写集），才能判断时序冲突
          explain: 这就是并发控制的两大非阻塞/无锁代表：**时间戳排序（Timestamp Ordering, 13.1）** 与 **乐观并发控制（OCC, 13.2）**！
      - card:
          title: 时间戳排序协议（T/O）：谁出生早就得像跑在前面（13.1）
          body: |
            每个事务启动领一个全局递增时间戳 `TS(Ti)`，引擎为数据 `X` 记录最后读时间戳 `R-TS(X)` 和最后写时间戳 `W-TS(X)`：
            - **读 `X` 规则**：若 `TS(Ti) < W-TS(X)`（你个老古董想读一个“未来小辈已经改写过”的 X，时光倒流啦！），**直接回滚重启**并领新大号！否则允许读并刷新 `max(R-TS(X), TS(Ti))`；
            - **写 `X` 规则**：若 `TS(Ti) < R-TS(X)` 或 `TS(Ti) < W-TS(X)`（你想穿越回去改写未来事务早已经读走/写过的值！），**立即回滚重启**！否则允许写并更新 `W-TS(X)`（“托马斯写规则”下遇到旧写撞新写有时可直接安全略过）。
      - card:
          title: 乐观并发控制（OCC）：读阶段 → 验证阶段 → 写阶段（13.2）
          body: |
            **OCC（Optimistic Concurrency Control）** 假设大家很少撞在同一行上：
            1. **读阶段（Read）**：事务把需要读取的数据读进来，所有修改全只在自己的私有工作区缓存，不改公共正表也不加悲观事务锁；
            2. **验证阶段（Validation）**：准备提交那一刻领个号，只瞬间检查“我读过的老集合，有没有刚巧被我期间已经提交的并发兄弟修改过？”；
            3. **写阶段（Write）**：校验零冲突就一口气把私有修改刷进公共区提交生效，有冲突就悄悄丢掉私有草稿立刻重跑！
      - item:
          id: q-to-vs-occ-match
          type: match
          prompt: 把时间戳排序与乐观并发控制中的核心概念和它们对应的运行判断连线。
          pairs:
            - ["`TS(Ti) < W-TS(X)` 时老事务试图读取未来事务刚写过的数据", 违背因果时序，老事务立即被中止回滚重启并领新时间戳]
            - ["OCC 读阶段（Read Phase）", 所有修改全部暂存在事务各自私有工作区，不锁公共正表]
            - ["OCC 验证阶段（Validation Phase）", 提交前瞬间比对本事务读集与已提交并发事务写集是否相交撞车]
            - [死锁免疫特性, 不使用互锁阻塞等待队列（冲突直接当场中止重跑而非干等），因此根本不会发生等待成环死锁]
          explain: 悲观派（2PL）“先买锁排队，真碰不上再去等”；乐观派（T/O 与 OCC）“先放手干完活，发现撞了再重来”！
      - card:
          title: 例题：为什么大家都在“双十一抢最后 1 件特价商品”时，OCC 反而比 2PL 更慢？
          body: |
            如果一千名顾客同时每秒点同一件热门商品 `item_id=1` 扣库存，对比 Strict 2PL 与乐观 OCC 两种策略实际跑出来的吞吐差异：
          reveal:
            - title: 第 1 步：高度争用热点下，OCC 大量劳动全部白做一遍又一遍回滚
              body: 1000 个 OCC 事务在同一毫秒都欢天喜地从正表读进旧库存 `left=10`，各自花算力算了一通验证提交——结果只有第 1 个赢了写阶段刷成 `left=9`，其余 **999 个全在最后验证阶段撞车全部作废重写**，白白浪费 99.9% 的计算算力还反复重跑形成剧烈退化！
            - title: 第 2 步：极低冲突下 OCC 完胜；热点扣减下悲观锁排队（或原子减）更稳
              body: 当一万名用户各自查看、编辑互不相交的个人订单时（极少撞行），OCC 毫无查锁表等锁队列损耗速度如飞；一旦大家都死磕在同一张热点行上，让先拿到悲观 X 锁的逐一有序完成反倒减少无效空转白费力。
            - title: 第 3 步：针对极短纯单步扣库存，还可以结合数据库单句条件更新避开多轮往返
              body: 把先 `SELECT` 再回应用端计算再 `UPDATE` 的长链路合并成一句 `UPDATE items SET left = left - 1 WHERE id = 1 AND left > 0`，缩短事务持锁窗口或冲突窗口至短短几微秒，高并发抢购同样稳健如山。
      - item:
          id: q-occ-three-phases
          type: order
          prompt: 请把一个事务在 **乐观并发控制（OCC）** 引擎中从开始到安全落地的标准三阶段按先后次序排列。
          steps:
            - 读阶段（读取所需数据进入各自私有空间并把写入全部暂存私有草稿，不直接改动公共库）
            - 验证阶段（在提交门口校验自己的读取与写入集合有没有和期间已经并发提交的其他事务发生冲突交集）
            - 写阶段（仅当验证无冲突后才把私有修改统一应用到公开库持久化生效，否则直接作废私稿重试）
          explain: “私底下算完 → 临提交前速验 → 无撞车立即公开落笔”，这就是 OCC 的核心节拍！
      - item:
          id: q-why-no-deadlock-in-to
          type: choice
          prompt: 为什么纯 **时间戳排序（T/O）** 与 **乐观并发控制（OCC）** 从根本机理上不会出现像 2PL 那样的“两个事务互等死锁卡死”？
          options:
            - text: 两者遇到冲突从不让事务停下抱着老资源去干等另一个事务放行，而是当场直接中止冲突方并释放重新来过（但极端热点下仍需注意防个别倒霉事务反复回滚“饥饿”）
              correct: true
            - text: 因为它们内部偷偷禁止任何人运行任何 `UPDATE` 语句
              why: 两种协议都全面支持正常写入更新，只是面对时序/集合碰撞的处理选择是“回滚重试（Abort-and-Retry）”而非“持锁阻塞等待（Block-and-Wait）”
            - text: 因为它们的时钟每隔一秒会自动倒转回去年
              why: 时间戳严格逐个往后递增分配；防止“老撞上大爷被一遍遍重启饿死”的做法往往是每次重试时保留较大新号或退避限频
          explain: 悲观等锁怕死锁（要等待图检测/预防）；乐观无等待怕高冲突下活锁“反复白干重试”（饥饿）——世界没有免费午餐！
      - item:
          id: q-to-write-rule-check
          type: choice
          prompt: 在基本 **时间戳排序（T/O）** 协议里，每个事务开始时按严格递增顺序领取唯一时间戳 `TS`。假设老事务 `T1 (TS=10)` 跑得比较慢，中途想读取数据项 `X`，却发现 `X` 上印着 `W-TS(X) = 25`（说明一个更晚出生的小辈已经改写并提交过 `X`）。此时 `T1` 该怎么办？
          options:
            - text: 立刻回滚中止 `T1`，释放后以一个全新更大的时间戳重新启动执行
              correct: true
            - text: 强行篡改数据库把小辈写入的新 `X` 直接毁掉
              why: 越过时序读取未来写入破坏因果串行序（相当于该排在 `TS=10` 后的却跑到前面去了），只能按时间戳规则中止老事务并以新大号重跑
            - text: 把 `TS=10` 手改回 `0` 继续硬读
              why: 改小时间戳更无法合法读取已经发生在 `TS=25` 的写入
          explain: 口诀记清：**时间戳排序里，“老事务碰到了未来新小辈刚写过或读走的对象”，老事务直接自裁领新号重来！**

  - id: isolation
    chapter: 并发控制
    title: 幻读难题与 SQL 标准隔离级别取舍
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 财务在事务 T1 里用行锁牢牢锁住了当前满足 `major = 'CS'` 的全部 `2` 行学生档案并核对了一遍总人数为 `2`。但在 T1 还没提交期间，另一个事务 T2 往 `Student` 表里**新插**进了一名 `'CS'` 新生 `S5` 并直接提交了！哪怕 T1 把原来的两行死死锁着，T1 接着再查一次 `WHERE major = 'CS'` 时突然冒出 `3` 个人！这是什么诡异现象，为什么普通单行锁防不住？
          options:
            - text: 这就是 **幻读（Phantom）**！行锁只锁得住“刚才表里**已经存在**的那几行”，锁不住“当时还根本不存在、半路刚新冒出来的空气新行”！
              correct: true
            - text: 这是因为那两名老学生自己自动分裂成了三个人
              why: 原先锁住的 2 行确实纹丝未动，多出来的第 3 行是 T2 新近执行 `INSERT` 刚冒出来的合法新记录
            - text: 只要给每行加上普通行级共享锁就 100% 自动拦住任何别人新 `INSERT` 的记录
              why: 还没出生插入的行在 T1 加行锁那一刻根本还不存在于物理行里，单靠行锁没处可锁！
          explain: 搞定行内改动（脏读、不可重复读）还差最后半步：**防住凭空多出新行的幻读**，并分清 SQL 四大 **隔离级别**（12.5、13.3–13.4 节）。
      - card:
          title: 怎么治好幻读：索引间隙锁与谓词锁（13.3）
          body: |
            既然普通行锁锁不住还没出生的空气新行，数据库靠两招堵死 **幻读**：
            - **索引范围/间隙锁（Index-Range / Gap Locks）**：不止锁住 B+ 树叶节点里现有的 `CS` 键那几行，干脆把 `CS` 键所在叶页和前后区间空隙一把锁住，谁想往 `CS` 范围内新插 `INSERT` 就得先等锁！
            - **可串行化（Serializable）下的快照或冲突追踪（SSI）**：后文结合多版本再精调。
      - card:
          title: SQL 四档标准隔离级别从低到高对比（13.4）
          body: |
            为了性能不必全员永远上最重的锁，SQL 标准允许开发按业务需要选四档隔离强度（并发度依次降、保护依次强）：
            1. **`READ UNCOMMITTED`**（最低）：连脏读都可能发生（极少用）；
            2. **`READ COMMITTED`**：不准读未提交数据（防脏读），但每次语句重读可能读出别人刚提交的新值（允许不可重复读和幻读，很多系统默认起始档）；
            3. **`REPEATABLE READ`**：同一事务内多次读同一行永远结果一致（可防不可重复读，甚至多数多版本实现下范围读也一起防住或部分留间隙锁防幻读）；
            4. **`SERIALIZABLE`**（最高）：彻底等价无任何交错地一个接一个跑，同时防尽脏读、不可重复读与幻读！
      - item:
          id: q-isolation-anomalies-match
          type: match
          prompt: 把四档 SQL 隔离级别（从宽松到严谨）与它们各自重点允许或严格阻断的现象精确配对。
          pairs:
            - ["`READ UNCOMMITTED`", 允许读取别的事务甚至还没 `COMMIT`（随时可能回滚撤销）的脏数据（脏读）]
            - ["`READ COMMITTED`", 彻底挡住未提交脏读，但事务前后两次同一查询可能看见期间另一已提交事务改过的新值]
            - ["`REPEATABLE READ`", 保证本事务内多次读同一已存在记录得到相同值，防止已存行被中途修改的不可重复读]
            - ["`SERIALIZABLE`", 最高最强防线：严防包括新 `INSERT` 冒出 **幻读** 在内的一切交错读写异常]
          explain: 大多数人误以为默认 `READ COMMITTED` 就能安心当银行账务防线——记住如果业务先 `SELECT` 再依赖读到的数去 `UPDATE`，`READ COMMITTED` 照样会有竞态，要么上高隔离级别、要么用 `SELECT ... FOR UPDATE` 显式加排他锁或条件原子更新！
      - card:
          title: 例题：同样在事务里执行 `SELECT count(*) FROM orders WHERE status='paid'` 两次，对比三个场景
          body: |
            假设 T1 开始后，并发来了 T2 想往 `orders` 插入一条新的 `'paid'` 订单。分别看看三种处理下的结果差距：
          reveal:
            - title: 第 1 步：只有单行 `2PL` 锁但没有间隙/范围锁
              body: T1 虽然给现存 10 条 `'paid'` 行都上了读锁，T2 改不动这 10 条老订单；但 T2 往页末尾新插第 11 条全新的 `'paid'` 订单时根本没碰那 10 行的行锁，轻松 `INSERT` 成功提交！T1 再数一次总数突然变成 `11`——这就是经典**幻读**！
            - title: 第 2 步：在 B+ 树索引 `orders(status)` 的 `'paid'` 区间挂上间隙/Next-Key 锁（12.5、13.3 节）
              body: 引擎定位到 `status = 'paid'` 的索引叶区间并顺手把那个值范围和前后间隙一并锁住，T2 试图插新 `'paid'` 行必须经过同一个索引区间的锁检查，立刻被整齐排队拦到 T1 提交之后，T1 两次计数稳稳永远等于 `10`！
            - title: 第 3 步：如果查询条件根本没有索引可用，就只能退化锁整张表保证不错
              body: 当 `status` 列上没有任何索引可供划出精准键值间隙区间时，为了绝对防住任何地方新插出 `'paid'` 幻影行，加锁式引擎被迫直接升级锁住整张 `orders` 表，直到 `T1` 提交——这也直观解释了为什么高隔离级别一定要配好恰当索引才跑得快。
      - item:
          id: q-phantom-vs-nonrepeatable
          type: choice
          prompt: 精准区分 **不可重复读（Non-Repeatable Read）** 和 **幻读（Phantom Read）**，两者的核心差异点在哪？
          options:
            - text: 不可重复读针对的是“同一条**本来就存在的老记录**，前后两次读到的内容被并发 `UPDATE/DELETE` 改了”；幻读针对的是“按某个范围条件两次重查时，因并发 **`INSERT` 冒出了新行**（或范围集合内行集增多减少）”
              correct: true
            - text: 不可重复读指数据库文件被神秘删除了，幻读指显示器闪了一下
              why: 两者都是并发事务交错读写引起的经典一致性异常，区别在“既有特定行字段值变了” vs “符合范围查询条件的整个行集合多出新生行”
            - text: 只要不用 `ORDER BY` 就永远不会出现幻读
              why: 无论写没写排序，新插入一行满足 `WHERE` 条件的记录就会改变结果行数和汇总结果
          explain: 行锁管得住既有行不被 `UPDATE` 改成不可重复读，但必须靠**索引范围锁（Gap/Next-Key）或可串行化多版本**才能真正锁住范围防幻读！
      - item:
          id: q-select-for-update
          type: choice
          prompt: 在实际开发（比如 `READ COMMITTED` 默认隔离级别的 PostgreSQL/MySQL 应用）里，某事务要先查出库存 `SELECT left FROM stock WHERE id = 1` 并紧跟着减 1 更新，怎样用显式语法防止两个请求同时读到 `1` 造成超卖（12.5 节实务加锁）？
          options:
            - text: 查询时显式写成 `SELECT left FROM stock WHERE id = 1 FOR UPDATE;` 申请行级排他意图锁（或改用单条原子更新 `UPDATE stock SET left = left - 1 WHERE id = 1 AND left > 0`），阻止并发事务同时读取并改写同一余量
              correct: true
            - text: 把隔离级别降成更低的 `READ UNCOMMITTED`
              why: 降级成 `READ UNCOMMITTED` 连未提交脏数据都会一起读出来，只会比原来乱十倍
            - text: 连续执行两遍 `SELECT left` 就能自己锁住库表
              why: 在 `READ COMMITTED` 下普通纯 `SELECT` 从不加长排他写锁，必须靠 `FOR UPDATE` 显式拿写锁、上更高隔离或单句原子条件更新
          explain: 理论（四档隔离级别）配合工程手顺（`FOR UPDATE` / 原子 `UPDATE ... WHERE left > 0`），直接把并发超卖 BUG 消灭得一干二净！

  - id: mvcc
    chapter: 并发控制
    title: 多版本并发控制（MVCC）：快照、版本链、GC 与索引管理
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 上一课用锁能保护数据，可一遇到分析师发了一条需要跑 3 秒钟的大只读汇总报表（`SELECT AVG(...)`），在普通 2PL 下这 3 秒内谁也拿不到写锁更新行、而分析师自己也得等前面所有写事务全部提交完，**读阻塞写、写又阻塞读**！有没有办法让写的人照样畅通写入新版、读的人却同时安安静静读着那一瞬间的干净旧快照，谁也不挡谁？
          options:
            - text: 不要原地覆盖抹掉旧行！保留同一条逻辑行的多个带时间戳/事务编号**历史版本（MVCC）**——读事务只看符合自己起点版本的那一版快照，读写完全互不阻塞！
              correct: true
            - text: 把数据库复制出一百万份独立文件分别给每个用户单独跑
              why: 整库全盘拷贝太荒谬，只针对真正在发生改写的少数行用位置链串起多个版本（行级多版本）既轻巧又高效
            - text: 强迫规定白天 12 小时完全不准任何人写入，半夜 12 小时才准查询
              why: 现代 PostgreSQL、MySQL InnoDB、Oracle 与 SQLite WAL 模式几乎清一色采用 **MVCC** 实现高并发“读不阻塞写、写不阻塞读”！
          explain: 第 14 章 **MVCC（Multi-Version Concurrency Control）** 是当今绝大多数主流在线数据库得以兼顾高并发与事务快照一致性的核心引擎设计！
      - card:
          title: MVCC 原理与三种版本存储方式（14.1–14.2）
          body: |
            在 **MVCC**（14.1）里，每条物理记录带有效区间 `[begin-ts, end-ts]`。事务开始时拿定自己的快照基准点，查询顺着版本链表挑出**在自己起点瞬间刚好生效且已提交**的那唯一物理版：
            - **版本链放哪（Version Storage，14.2）**：① **Append-Only**（直接在主表追加全新行版，PostgreSQL 风格）；② **Time-Travel 表**（主表留最新，老版挪历史表）；③ **Delta 存储**（主表留最新，往回只链式记改了哪几个字节的撤销补丁，MySQL/Oracle 风格）。
      - card:
          title: MVCC 必需的三项配套工程：垃圾回收、索引指向与逻辑删除（14.3–14.5）
          body: |
            只留旧版必撑爆磁盘！MVCC 靠三大管家：
            1. **垃圾回收（GC/Vacuum）**：盯住最老活跃事务号，清走彻底不可见的旧版（衔接 `D.1.4` `VACUUM`）；
            2. **索引指向**：二级索引可指逻辑间接层防写放大；
            3. **逻辑删除**：先打墓碑标死亡版本号，待旧快照全结束再拔除。
      - item:
          id: q-mvcc-core-benefit
          type: choice
          prompt: 在支持 **MVCC（多版本并发控制）** 与快照隔离（Snapshot Isolation）的数据库（包括 SQLite WAL 模式和 PostgreSQL）中，为什么“正在运行一个长时只读查询”和“同时更新该行写入新版”可以做到互不阻塞？（参照 `D.1.1`/`D.1.2` 实验观察）
          options:
            - text: 写入时不去原地毁掉老数据，而是新建一个更高事务版本号的新物理版本；早先开启的只读事务照旧读取自己快照起点的老物理版本，因此读不拦写、写不拦读
              correct: true
            - text: 因为 MVCC 让写事务悄悄放过只读事务直接看到还没写完提交的半成品脏值
              why: 恰恰相反！MVCC 严格只让读事务看到“在它快照时间点之前**已提交**”的历史定稿版本，既防脏读又免互相阻塞
            - text: 因为只读查询在 MVCC 下每次执行都会把整张表拷贝进另一个机房
              why: MVCC 靠行级多版本链与事务号可见性规则原地实现快照，零全表拷贝！
          explain: 哪怕是单机 Python 里的 SQLite 开启 `PRAGMA journal_mode=WAL` 后，也能立即验证“reader `BEGIN` 读到 `10` → writer 改写为 `12` 并 `COMMIT` → 同一个 reader 重读居然还是稳稳的 `10` → reader 自己结束后新事务才看到 `12`”这一经典 MVCC 快照现象！
      - card:
          title: 例题：比较 Append-Only（PostgreSQL）与 Delta Undo（MySQL）在更新大表行时的利弊
          body: |
            假设某订单表一行有 `20` 个列（占 500 字节），平时业务高频操作只把 `status` 一小列从 `'paid'` 改成 `'shipped'`（只改 8 字节），同时表上还建了 `5` 个二级索引。两种版本存储表现差在哪（14.2、14.4 节）？
          reveal:
            - title: 第 1 步：Append-Only（整行新插主表）+ 直接指向物理行位置
              body: 优点是读取最新热数据时完全不用在外面拼补丁、回滚也基本无原地恢复开销；缺点是哪怕只改 1 个小字段，整行 `500` 字节都得复制一份新版本放进主表，而且如果不经过“逻辑间接引用层”，5 个二级索引全部都得跟着往新物理位置插一条槽位引用（所谓“写放大”），必须及时靠后台 **GC / VACUUM** 回收旧堆元组死空间！
            - title: 第 2 步：Delta 版本（主表永远原地保持最新 + 回滚段记旧差值）
              body: 优点是绝大多数想读最新数据的热请求一步到位且二级索引位置几乎不动（只要索引列本身没变，无需顺手重插二级索引）；缺点是万一碰上跑了半小时的旧只读事务，每次翻到被改过几百次的记录就得沿着 Delta 撤销链一步步往回重放几十次补丁才能拼出那瞬间旧貌！
            - title: 第 3 步：同时看索引到底指“逻辑行号”还是指“物理页槽位置”
              body: 如果所有二级索引直接存放物理页和槽号（Append-Only 常见做法），每更新一条哪怕无关列也要联动重写全表多棵二级索引带来明显写放大；而经过轻量间接逻辑号中转一跳时更新成本骤降，代价是每次二级索引点查多出 1 次内存查表开销——工程设计正是在读快还是写轻之间做清醒权衡。
      - item:
          id: q-mvcc-gc-why
          type: choice
          prompt: 为什么在采用了 **MVCC** 架构的生产数据库（如 PostgreSQL）里，定期运行并健康调度后台 **垃圾回收（GC / `VACUUM`）** 至关重要（14.3 节 & 后继 `D.1.4` 关联）？
          options:
            - text: 因为每次 `UPDATE/DELETE` 留下的旧历史版本和死亡墓碑会持续霸占磁盘与内存缓存空间（表膨胀），必须确认全库最老活跃事务不再需要它们后尽快安全清理复用空间
              correct: true
            - text: 因为 `VACUUM` 会把所有用户密码自动打印出来发邮件
              why: 垃圾回收只负责识别并收回已对所有活跃事务不可见的过期物理行版本与死亡索引项空间
            - text: 只跑 `DELETE` 语句其实会立刻缩小文件 50%，所以根本不需要任何垃圾回收
              why: 删完之后为了兼顾同时还在运行的旧快照读事务，不能当场物理腾空删死，必须标墓碑等旧快照全都结束后才能由 GC 彻底回收空间！
          explain: 这也顺便解答了一个常见生产事故：**为什么有一个忘了关的空闲长只读事务整整挂了一夜不 `COMMIT`，整台 MVCC 主库的磁盘占用就会飙升几十 GB？** 因为最老活跃事务不走，GC 就一步也不敢清理那一整夜积累的几千万个废弃历史版本！
      - item:
          id: q-mvcc-parts-match
          type: match
          prompt: 把 MVCC 设计中的四个核心机制（14.1–14.5 节）与它们各自的职责精确配对。
          pairs:
            - [事务可见性基准点（`begin-ts` / `end-ts`）, 判断某物理行版本在当前读事务开始的那一瞬间究竟“该不该被看见”]
            - ["逻辑间接引用层（Indirection）", 让全部二级索引先指到一个稳定逻辑地址，减少更新非索引列时顺带翻修全部索引的写放大]
            - ["墓碑标记（Delete Tombstone）", 执行 `DELETE` 时暂不立即彻底物理摧毁旧行，留给尚在运行的旧快照继续正常读完]
            - ["垃圾回收器（GC / Vacuum）", 盯着全系统最老活跃事务水位，把彻底没人能再看见的废弃历史版本空间清出复用]
          explain: MVCC 虽好，但它也会在极端写入下遇上“写偏斜（Write Skew）”等快照隔离特例——想上最高无漏洞防御，仍需可串行化快照隔离（SSI）检测读写环！
      - item:
          id: q-mvcc-write-skew
          type: choice
          prompt: 在**多版本并发控制（MVCC）快照隔离**下，即使各自只读取同一张值班表再更新不同行（两位医生都在查到当前至少 2 人值班后，分别把自己这行改成休假提交），居然最终变成 0 人值班！为什么标准快照隔离会漏过这个异常？
          options:
            - text: 这叫**写偏斜（Write Skew）**：两个并发写事务分别改了互不相交的两行没有触发“写-写冲突”，但各自读了对方随后改掉的那一部分（依赖交叉环），必须靠 **可串行化快照隔离（SSI）** 侦测读写反依赖环才能防住
              correct: true
            - text: 因为 MVCC 下绝对不准任何人执行 `UPDATE` 语句
              why: 写偏斜恰好是两路合法更新分别改到不同主键行导致没有直接覆盖撞车，却打破了整体业务不变式
            - text: 只要删掉所有历史旧版本立刻就能消灭写偏斜
              why: 删掉旧版本反而毁掉 MVCC 非阻塞快照读优势，正确解法是在 SSI 中跟踪读写反依赖边缘并在出现危险读写环结构时中止其中一方
          explain: 记清：**普通快照隔离（SI）天然免疫脏读/不可重复读，但防不住互不撞写行的写偏斜，想达最高可串行化需配 SSI**！

  # ======================================================================== 日志与恢复
  - id: buffers
    chapter: 日志与恢复
    title: 缓冲池换页策略（STEAL / NO-FORCE）、影子分页与早期日志
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 每次事务要改 1 行 50 字节的数据，为了防断电难道不能每 `COMMIT` 一次就立刻把修改分散涉及到的七八个随机磁盘数据页统统现场同步刷回磁盘（`FORCE`）；或者硬规定只要事务没最终提交、哪怕内存里的物理高速页缓存区都快撑爆了也死活不准把那个没提交脏页先暂时换出到磁盘上（`NO-STEAL`）？这两项“看起来很保险”的规矩为什么会把高并发数据库性能拖垮？
          options:
            - text: 强制立即乱序刷多页随机磁盘页（`FORCE`）会导致随机 I/O 慢上百倍；而严禁踢出未提交脏页（`NO-STEAL`）会让内存极易被一个修改海量行的大事务直接卡爆！高性能引擎选择相反的 **`STEAL + NO-FORCE`**，把安全擦屁股交由顺序预写日志补救！
              correct: true
            - text: 因为磁盘硬件只允许每天写入 10 次数据页
              why: 磁盘随机位置跳着频繁写几十页比连续顺着末尾追加一条小日志慢几十上百倍，而且内存容量极其有限不可能无限死扛未提交大事务
            - text: 因为只要内存断电了以后，硬盘里原本的数据页也会自动跟着全部消失
              why: 持久化磁盘页在断电后依然保存——问题恰恰出在“把未提交脏页先踢回主磁盘页（STEAL）怕回不去、或者把已提交修改留在内存不急刷盘（NO-FORCE）怕断电丢数”该怎么解决！
          explain: 读懂内存页缓存管理的四大象限策略（STEAL vs NO-STEAL，FORCE vs NO-FORCE），你才真正明白为什么世界需要 WAL（15.1–15.5 节）！
      - card:
          title: 什么是缓冲池、脏页以及 STEAL / FORCE 四象限（15.1–15.3）
          body: |
            磁盘页平时读入受引擎统一管理的高速内存区——**缓冲池**，改完变成尚未写盘的 **脏页**：
            - **STEAL vs NO-STEAL**：`STEAL` 许在内存紧张时把未提交脏页先挤出写盘腾空（省内存，但需 **Undo**）；
            - **FORCE vs NO-FORCE**：`NO-FORCE` 许 `COMMIT` 只刷轻量日志即返回，后台缓刷脏页（快，但需 **Redo**）。
      - card:
          title: 早期替代思路：影子分页（15.4）与回滚日志（15.5）
          body: |
            在现代预写日志统治江湖前，业界走过两种 `NO-STEAL + FORCE` 或单边折中路线：
            - **影子分页（Shadow Paging，15.4）**：改页时绝对不原地覆盖主数据页，而是在旁边空闲处写新副本页，最后提交瞬间原子挪一下目录总引用（恢复零难度！但每次只改几行就得连同父目录页一并拷贝拆碎物理连续性，只适合只读或小单机快照）；
            - **SQLite 早期回滚日志（Journal File，15.5）**：先把原页旧模样拷一份留进回滚文件再改主文件；多读多写并发差，后来主流全转奔 WAL。
      - item:
          id: q-steal-force-match
          type: match
          prompt: 把 **缓冲池** 四大管理选择与它们各自对性能、内存需求以及崩溃恢复算法（Undo/Redo）的影响配对。
          pairs:
            - ["**NO-STEAL + FORCE**（朴素稳妥但慢）", 运行最慢随机写入极重且大事务撑爆内存，但几乎无需复杂的崩溃重做与撤销恢复]
            - ["**STEAL**（允许尚未提交的脏页先挤出到主磁盘）", 释放了内存容量不被超大未提交事务卡死，但崩溃恢复时必须具备 **Undo 撤销** 能力抹掉半途修改]
            - ["**NO-FORCE**（提交时不必立刻随机刷回所有主数据页）", 提交路径免去分散随机写极速飞起，但崩溃恢复时必须具备 **Redo 重做** 能力补回已提交尚未落盘的改写]
            - ["**STEAL + NO-FORCE**（现代高并发主力引擎标配）", 吞吐性能最高且最省内存，代价是崩溃恢复必须同时支持 Undo 与 Redo（即下一课的 WAL/ARIES！）]
          explain: 记清口诀：**STEAL 带来了 Undo 的刚需，NO-FORCE 带来了 Redo 的刚需**！现代主流（PostgreSQL/MySQL/ARIES）全走 **STEAL + NO-FORCE** 换取极致性能，再靠顺序日志完美兜底！
      - card:
          title: 例题：为什么把 `NO-FORCE` 和“只顺手往日志末尾追加 80 字节”组合能把随机写变成顺序写？
          body: |
            假设一笔转账事务分别改了分散在不同柱面上的 5 张巨型表格和索引的 5 个 8KB 数据页，总计改动 `5 × 8KB = 40KB`。对比 `FORCE` 强刷数据页与 `NO-FORCE + 日志` 落地提交的差距：
          reveal:
            - title: 第 1 步：`FORCE` 提交需要跨文件跳来跳去随机写入 5 个 8KB 大页
              body: 每次事务提交都要逼磁盘磁头（或 SSD 随机页重擦写放大）分别寻址 5 个遥远位置一共落完 `40KB` 才敢告诉用户“成功”，不仅速度奇慢，万一写入第 3 页时停电还会留下半吊子文件撕裂！
            - title: 第 2 步：`NO-FORCE` 只在日志末尾顺着写一笔极小变更记录，立刻交差返回
              body: 提交瞬间只需要把“某事务把某行旧值改为新值”短短百余字节顺序追加（Sequential Append）进单一日志流末尾落盘即可立刻回包提交成功；至于缓冲池里那 5 个变脏的大页，后台空闲时慢慢顺便批量刷回或者同一页后续再改十次才统一写一次盘（极大合并写），性能直接狂飙！
            - title: 第 3 步：缓冲池替换策略也要避开刚要扫全表时的“缓存污染”
              body: 如果缓冲池傻傻只用普通最近最少使用（LRU）置换，一次几百 MB 的大报表顺序全扫就会把热点几页全挤出内存，改用 `LRU-K`（看最近第 K 次访问距离）或把顺序大扫放进独立小环形区，才能稳稳护住经常被查的 B+ 树顶层热页和热点账户页。
      - item:
          id: q-shadow-paging-limit
          type: choice
          prompt: 既然 **影子分页（Shadow Paging，15.4 节）** 在提交时只需切换一次主根引用就原子生效、崩了也根本不需要复杂重做，为什么现代高并发大型在线事务型数据库几乎不选用它作为主力存储引擎？
          options:
            - text: 因为每次只改一条记录都得一路复制新页和整条路径页级映射表（无法原地更新），极易把原先物理连续存放的相邻数据打成海量随机碎片、难以高并发多事务同时修改同页
              correct: true
            - text: 因为影子分页根本不能保存在任何真实硬盘上
              why: 影子分页把新页真真实实写进硬盘空闲页里并做主引用切换，问题在于高并发写入下的严重“写拷贝放大”与物理页碎片化
            - text: 因为影子分页每次提交时都需要把全库所有老表全部删光
              why: 正相反，影子分页靠保留“老根引用不变、全在新空闲页写新版再一次翻牌引用”来保证原子性
          explain: 看清引擎设计取舍：**影子分页/CoW** 极简优美常用于某些只读快照或嵌入式文件场景；高频随机写在线事务引擎几乎一面倒拥抱 **原地更新 + 预写日志 WAL（STEAL + NO-FORCE）**。
      - item:
          id: q-steal-undo-needed
          type: choice
          prompt: 某数据库缓冲池为了腾出空间给其他紧急查询，在事务 `T2` **尚未决定 `COMMIT`** 之前，悄悄把 `T2` 改脏过的内存页提前写回了磁盘主数据文件里。下一秒系统突然崩溃重启，如果引擎重启后不借助记录旧值的日志做逆向清理，会违背 ACID 的哪一条属性？
          options:
            - text: 违背 **原子性（Atomicity）**：没提交本该作废的 `T2` 半途改动竟然已经留在磁盘上了，重启后必须靠记录着旧值的撤销日志（Undo）把它改回原本模样
              correct: true
            - text: 违背选择率估计，导致 B+ 树层数自动变成负数
              why: 脏页提前写出属底层缓冲池与恢复管理范畴，直接关乎“未提交修改不得污染持久化账本（原子性）”
            - text: 完全不会违背任何 ACID 原则，可以放心留着未提交结果假装提交了
              why: 绝不能让未点击提交甚至中途本应回滚的半途数据永久残留，这正说明 **允许 STEAL 就必须实现 Undo**！
          explain: 只要把 **STEAL ↔ Undo** 和 **NO-FORCE ↔ Redo** 这两对因果死锁记牢，下一课学起 WAL 日志内容来就水到渠成！
      - item:
          id: q-no-force-crash
          type: choice
          prompt: 采用 **NO-FORCE** 缓冲池策略的数据库在事务 `T1` 提交瞬间，只把极短的提交日志刷盘便向应用返回成功，而 `T1` 改脏过的 `5` 个主数据页还留在缓冲池内存里没来得及回写磁盘。假设下一秒机房断电，恢复必须依靠什么把这 `5` 页找回来？
          options:
            - text: 在崩溃重启恢复阶段重放预写日志中的 **Redo（重做）** 记录，把这 5 个已提交却未及刷回主磁盘的页改写动作重新补画进主数据页里
              correct: true
            - text: 直接宣布 `T1` 刚才算没有提交，把钱丢掉算用户倒霉
              why: 既然已经向调用方确认过 `COMMIT` 成功，就必须百分百兑现 ACID 里的持久性（Durability）！
            - text: 把缓冲池改成每改一个字节就把全盘整份拷贝出去
              why: 正是靠日志 Redo 保证持久，才使运行期可以安心享受轻快流畅的 `NO-FORCE` 延迟刷脏
          explain: 对应记住：**`NO-FORCE` 提交最快但怕主盘没落稳 → 必须靠日志 `Redo` 兜底持久性！**

  - id: wal
    chapter: 日志与恢复
    title: 预写日志（WAL）、日志方案与检查点（综合练习 5）
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 既想享受上节说的 **缓冲池** `STEAL + NO-FORCE` 飞一般的吞吐速度，又要同时保证**断电绝不丢已提交、绝不留未提交**。一条最硬核的先决先后纪律卡在了“内存脏页刷进主数据文件”和“对应日志刷进日志磁盘”之间——到底谁**必须绝对先落盘**？
          options:
            - text: 无论什么时候，记下这次改动新旧状态的**日志记录必须绝对先于它改脏的主数据页持久化落盘**（先记账再搬砖，即预写式日志 WAL）！
              correct: true
            - text: 先悄悄改主数据页落盘，下个月再抽空想起来补写一份日记日志
              why: 如果刚覆盖了主数据页还没来得及记下原本旧值（Before-Image）就断电，引擎重启后全宇宙都没人知道原本这里写着什么、再也撤销不回去！
            - text: 把日志永远只存在断电即失的内存变量里，绝对不写入磁盘
              why: 日志之所以能作崩溃恢复基石，前提正是它比主数据页更早安全持久化在非易失磁盘文件上
          explain: 这条铁律就是数据库引擎历史上最伟大的设计之一——**预写日志（Write-Ahead Logging, WAL）**（11.7、15.6–15.8、16.2–16.4 节 & 综合练习第 5 题）。
      - card:
          title: WAL 两大黄金法则与日志内容方案（15.6–15.7）
          body: |
            **WAL**（预写日志，每条带递增号 `LSN`）守死两条规则：
            1. **保原子（配 STEAL）**：未提交脏页写主盘前，记着**旧值（Undo）**的日志必先落盘；
            2. **保持久（配 NO-FORCE）**：`COMMIT` 返回前，全部 **Redo 与 COMMIT 日志**必先落盘。
            日志常用**物理-逻辑混合（Physiological）**：按页 ID 定位，页内写逻辑槽操作，省空间且页内恢复幂等。
      - card:
          title: 检查点（Checkpoints）：防止恢复要重放十年老日志（15.8、16.4）
          body: |
            如果系统连续跑了一整年从没停过，日志已经攒下几 TB！突然断电难道要从去年第一天开始重放？靠定期打 **检查点（Checkpoint）**：
            - **阻塞式钝检查点**：停下一切新请求，一口气把缓冲池全部脏页刷盘、写条标记就完事（停顿太长卡死业务）；
            - **模糊检查点（Fuzzy Checkpoint，ARIES 做法）**：几乎不卡住在线业务——只需把那一刻正活着还没提交的活跃事务表（ATT）和脏页状态表（DPT）记进一条检查点日志即可，明确划出“更早之前的老数据早安全了，崩溃只需从这附近起步扫起”！
      - item:
          id: q-wal-two-rules
          type: choice
          multi: true
          prompt: 根据 **WAL（预写日志）** 的核心协议规则，以下哪些磁盘刷盘先后顺序是**必须强制遵守**的，否则一遇到断电就会丢数或撤销失败？（多选）
          options:
            - text: 允许在事务提交前把未提交脏页写入主数据页（STEAL），但对应记录了修正前旧值（Before-Image）的日志必须**先**持久化落盘
              correct: true
            - text: 事务向上游调用方返回 `COMMIT` 提交成功之前，本事务所有修改的重做日志与 `COMMIT` 记录必须**全部**强制刷盘
              correct: true
            - text: 为了偷懒提高吞吐，先直接把事务提交结果返回给用户说“扣款成功”，等 5 分钟后再慢慢把 `COMMIT` 日志写入磁盘
              why: 一旦那 5 分钟内断电，内存里的提交瞬间蒸发，用户明明看见系统显示“成功”钱却没到账，彻底打破持久性承诺！
            - text: 在日志还留在内存里没写盘的时候，先把旧数据页直接盖写成无提交标记的新值落盘
              why: 旧值既已在主文件被盖死，日志又随断电灰飞烟灭，系统重启后绝对无从 Undo 回原先正确状态
          explain: 把两句话刻进脑海：**“未提交脏页落主盘前，旧值日志须先落盘（防 Undo 无依）；返回已提交前，全套日志须先落盘（防 Redo 无凭）！”**
      - card:
          title: 例题：为什么工业界主流选用“物理-逻辑混合日志（Physiological）”而不是纯物理或纯逻辑日志？
          body: |
            同样把一条长度变短的索引项从某 8KB 物理页里改掉（内部挪了后面几十个槽位的偏移）。对比三种 **WAL** 日志记录格式（15.7 节）：
          reveal:
            - title: 第 1 步：纯物理日志太臃肿，纯逻辑日志在跨页拆裂崩溃时很致命
              body: 纯物理日志哪怕只插一条 20 字节新索引引发页内 4000 字节向后挪移，就得把整整 4KB 改完模样全记进日志，日志膨胀炸裂！反过来纯逻辑日志只记一句“往表里插一条 SQL 行”，看似最省空间；但如果插入需要顺道分裂两页 B+ 树，刚好写了一半页崩溃重启，高层次逻辑 SQL 根本没法判断树结构停在半裂还是全裂状态！
            - title: 第 2 步：物理-逻辑混合日志兼得紧凑与页级崩溃确定性
              body: 混合方案精准定位到具体 `(Page_ID = 42)` 这一页，然后在页内写清晰逻辑动作（例如 `在 Page 42 插入 (key, slot)`）——既体积小巧不到百字节、支持 B+ 树单页独立重演幂等安全，又不把所有挪移的无关字节抄一遍，成为 ARIES 等工业级引擎标配。
            - title: 第 3 步：另外别忘“部分页写裂（Torn Page）”也要防！
              body: 操作系统刷一个 8KB 或 16KB 数据库页往往底层分多次 4KB 写进盘，写到一半断电就会出现“上半页新、下半页旧”的页裂！如果用逻辑微操直接覆盖裂页必崩，现代库会开启全页首次落盘保护（Full Page Writes：检查点后第一次改某页时先把整页原文记进 WAL）彻底消弭写裂风险。
      - item:
          id: q-checkpoint-why
          type: choice
          prompt: 在数据库长期运行期间定期执行 **检查点（Checkpoint）**（特别是 ARIES 风格的模糊检查点）的主要工程价值是什么？
          options:
            - text: 划出一条安全的恢复起始边界并推进脏页稳步落盘，从而大幅缩短崩溃重启时必须往前翻读重放的 WAL 日志长度（压缩平均恢复时间 MTTR），同时几乎不阻塞在线正常事务
              correct: true
            - text: 检查点用来把数据库里所有已经提交过的数据全部永久清空删除
              why: 检查点绝不删除业务数据；相反，它是把内存态的脏页与活跃状态安全汇总锚定在持久化流里，方便安全裁剪陈年过期日志片段
            - text: 只要打了一次检查点，以后整个数据库就永远不需要再写 WAL 日志了
              why: 检查点之后的每笔新事务改动依然必须照常写 WAL，检查点只是定期立起新的恢复加速路标
          explain: 没有检查点，哪怕跑了十年的数据库断电一次就得重放十年积木日志；有了稳健检查点与合理刷脏节奏，百 GB 级库重启照样几秒起死回生！
      - item:
          id: q-wal-lsn-order
          type: choice
          prompt: 每个 WAL 日志页与主数据页的头部通常都印着一个严格递增编号 **`pageLSN`**（记录最后一次修改这个主数据页的日志号）和 **`flushedLSN`**（当前已安全刷上磁盘的最高日志号）。当后台准备把编号为 `pageLSN = 508` 的缓冲池脏页写入主数据文件时，如果发现当前 `flushedLSN = 490`（`508 > 490`），缓冲池管理器必须怎么处理？
          options:
            - text: '**先拦下不准写该数据页！**先强制把日志至少刷到 `LSN >= 508`（使 `flushedLSN >= pageLSN`），然后才放行把这页脏数据刷进主数据文件'
              correct: true
            - text: 直接无视这两个编号先把数据页刷出去，有空再说
              why: 一旦 `LSN 508` 的日志还没落盘而数据页先落盘，就公然违背了 WAL 最核心的“日志绝对先写”规则，崩溃必丢历史旧值！
            - text: 把 `pageLSN` 强行手改回 `1` 骗过检查逻辑
              why: '`pageLSN` 是恢复算法判断哪一页已经不需要重做的救命标尺，绝不能造假修改'
          explain: 就是这么优雅的一条比较不等式——**“写数据页前必守 `flushedLSN >= pageLSN`”**，用一行整数比较把 WAL 协议锁得铁板一块！
      - item:
          id: q-commit-flushed-lsn
          type: choice
          prompt: 按照 **WAL（预写日志）** 持久化协议，当一个事务执行 `COMMIT` 准备给客户端返回成功回执之前，日志刷新边界 **`flushedLSN`** 必须满足什么条件才能确保断电不丢已提交成果？
          options:
            - text: 必须把包含本事务全部更新和本条 `COMMIT` 标记在内的日志全部强刷入持久化日志文件（即 `flushedLSN >= 本事务 COMMIT 记录的 LSN`），之后才许返回成功
              correct: true
            - text: 只需等几分钟后后台空闲刷盘单元有心情时慢慢刷新即可
              why: 在日志落盘前就提前骗客户端说提交成功，断电会立刻违背持久性承诺！
            - text: 只需把主数据页刷盘一半就能放行返回
              why: '`NO-FORCE` 允许主数据页稍后慢慢刷，但前提是全套对应 WAL 与 `COMMIT` 日志已经实打实稳落磁盘！'
          explain: 两条边界合起来构成整座 WAL 城堡的底座：刷脏页前看 `pageLSN`，交回执前盯 `COMMIT LSN`！

  - id: aries
    chapter: 日志与恢复
    title: ARIES 崩溃恢复三部曲：Analysis → Redo → Undo（综合练习 5）
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 机器突然崩溃断电重启了！此时硬盘主数据文件是一团“可能早就被 STEAL 写进了某些未提交脏修改、又可能因为 NO-FORCE 根本还没来得及刷回另一些已提交修改”的混乱状态！**ARIES** 恢复引擎刚一睁眼开始翻看 WAL 日志时，为什么要分 **先往前全量重演把现场还原到崩溃前一毫秒（Redo），再把没提交的倒退撤销（Undo）**——不能一上来只挑已提交的做吗？
          options:
            - text: 因为“重演一切历史（Repeating History）”把磁盘状态原原本本恢复到崩溃前那一瞬，哪怕待会儿还要撤销的脏页也必须按相同页 LSN 轨迹走过一遍，才能避免早先微操序号对不上号或 Undo 写偏，最后再用逆向 Undo 干净抹平未提交并记下补偿日志！
              correct: true
            - text: 因为电脑只会往前念日志，倒着读磁盘会让硬盘当场转坏
              why: 倒着顺 `prevLSN` 引用链做 Undo 恰好正是第三阶段的核心动作；先 Analysis、再 Redo、后 Undo 是为了保证每次崩溃甚至“在恢复到一半时又再次停电”都能 100% 稳妥幂等重跑！
            - text: 因为未提交的事务在崩溃重启后一律自动升级成已提交永久保留
              why: 未在崩溃前写下 `COMMIT` 落盘的事务在第三阶段都会被 Undo 彻彻底底回滚取消，绝不留在库里
          explain: 搞懂这组三步接力——**分析（Analysis）→ 重做（Redo）→ 撤销（Undo）**，你就看透了工业级数据库最著名的恢复引擎 **ARIES**（16.1–16.5 节 & 综合练习 5）。
      - card:
          title: ARIES 三阶段恢复算法逐一拆解（16.1–16.5）
          body: |
            崩溃重启后 **ARIES** 从最近检查点出发三遍过账：
            1. **Analysis（正向扫）**：扫至日志尾，重建崩前**未提交输家清单（ATT）**和**未刷脏页清单（DPT）**；
            2. **Redo（正向重演全历史）**：从最早起止点一路重演（页 `pageLSN >= LSN` 则幂等跳过）；
            3. **Undo（逆向回溯）**：顺 `prevLSN` 倒序撤销未提交输家改动！
      - card:
          title: CLR（补偿日志记录）：如果在恢复 Undo 到一半时又停电怎么办？（16.5）
          body: |
            哪怕最绝望的连环意外——“机器刚在执行 Undo 撤回到一半的时候，又遭二次停电”——ARIES 照样不丢不错！秘密在于 **CLR（Compensation Log Record）**：
            - Undo 每把一个未提交修改改回旧值前，都会先往 WAL 里额外追加一条 **CLR 日志**（记下这次恢复动作并把 `UndoNextLSN` 直接指向上一步还没撤的地点）；
            - 就算紧接着再次停电重启，新一次 Redo 会忠实重做刚才的 CLR 成果，而随后再走 Undo 时看见 CLR 的跳转引用，**绝不会对同一件事傻傻撤销两遍**，直接接着往更早处稳稳扫尾！
      - item:
          id: q-aries-order
          type: order
          prompt: 请把 **ARIES** 崩溃恢复算法在数据库冷启动时的三个核心执行阶段按严格先后次序排列好。
          steps:
            - "Analysis 阶段（从最近检查点正向扫描到日志结尾，还原崩溃那一瞬的未提交活跃事务清单 ATT 与待恢复脏页清单 DPT）"
            - "Redo 阶段（从脏页最早起点正向重演全量历史操作，跳过 `pageLSN` 已经足够新的页，将全库状态拉齐到崩溃最后一刻）"
            - "Undo 阶段（沿着未提交失败者事务各自的 `prevLSN` 逆向倒序撤销未完成写入，并同步追加 CLR 补偿记录保障二次崩溃可重续）"
          explain: '**“分析找起点和黑名单 → 重演历史拉齐现场 → 倒着消除黑名单并留 CLR 路标”**，三阶段环环相扣！'
      - card:
          title: 例题：用 Python 字典演练 `D.1.2.verify` 里的真实 Redo/Undo 状态轨迹！
          body: |
            设初始已落盘状态 `disk = {'A': 10, 'B': 20}`。紧接着运行产生三条 WAL 日志：`('T1', 'W', 'A', old=10, new=12)`、`('T1', 'COMMIT')`、`('T2', 'W', 'B', old=20, new=25)`，还没等 `T2` 提交系统突发断电重启。观察恢复三阶段后 `disk` 的演变：
          reveal:
            - title: 第 1 步：Analysis 判定提交与未提交名单 + Redo 重演全部 WAL 写操作
              body: '扫描日志发现 `T1` 已有 `''COMMIT''`（赢家！），`T2` 没有 `''COMMIT''`（未完成输家！列入回滚名单 `uncommitted = {''T2''}`）。接着 **Redo** 阶段按正向顺次重演日志中的两条写记录：`disk[''A''] = 12` 且 `disk[''B''] = 25`，于是 Redo 结束那一刻内存/盘状态恰好精确停在 **`{''A'': 12, ''B'': 25}`**！'
            - title: 第 2 步：Undo 阶段逆向扫描，还原 `T2` 未提交改动并保留 `T1` 成果
              body: '进入 **Undo** 阶段后从日志尾巴倒着往回读：碰到 `T2` 的写记录 `(''T2'', ''W'', ''B'', 20, 25)`，查出 `T2 ∈ uncommitted`，于是把旧值 `old=20` 填回给 `B`（同时写入一条 CLR 记录）。对已提交赢家 `T1` 则完全跳过不动！最终恢复完成状态定格在 **`{''A'': 12, ''B'': 20}`**——既稳稳留住 `T1` 持久提交，又干干净净抹去 `T2` 半途未提交！'
            - title: 第 3 步：哪怕刚撤完这条就二次断电，CLR + `UndoNextLSN` 也确保恢复只进不退
              body: 正是因为上面每次改回 `B = 20` 前先写下了 CLR 并指向 `T2` 更早的前驱位置，就算下一秒机房再度黑屏停电，新一轮重启先通过 Redo 重做所有普通日志和 CLR，随即在 Undo 阶段一眼识别已补偿过的位置直接跳转继续往前清算，恢复进度绝对单向推进不会卡在原地重来。
      - item:
          id: q-aries-trace-state
          type: choice
          prompt: '验证上述崩溃恢复轨迹：初始盘状态为 `{A: 10, B: 20}`，WAL 顺序记录了 `T1` 将 `A` 由 10 改为 12、`T1 COMMIT`、`T2` 将 `B` 由 20 改为 25 后瞬间崩溃断电（`T2` 未提交）。在 **Redo** 结束瞬间与最终 **Undo** 结束瞬间，状态各是什么？'
          options:
            - text: 'Redo 结束瞬间为 `{A: 12, B: 25}`（重演全量历史）；Undo 结束瞬间最终定格为 `{A: 12, B: 20}`（只抹掉未提交的 `T2`）'
              correct: true
            - text: 'Redo 结束后就直接是 `{A: 10, B: 20}`，Undo 之后变成 `{A: 12, B: 25}`'
              why: Redo 负责“正向重演全部写历史”，所以先变成 `{12, 25}`；随后的 Undo 才专门“按旧值倒退撤销未提交输家 `T2`”，最终归位 `{12, 20}`
            - text: 断电重启会把已经提交的 `T1` 也直接回滚回 `10`
              why: '`T1` 的 `COMMIT` 记录已经在断电前稳稳写入 WAL，属于必须 100% 保住持久性的已提交赢家'
          explain: 只要亲手推一遍 `{10, 20} → Redo {12, 25} → Undo {12, 20}`，你就永远不会再弄反 Redo 和 Undo 各自的精确职责！
      - item:
          id: q-clr-idempotent-crash
          type: choice
          prompt: 当 ARIES 正在第三阶段（Undo）执行回滚恢复的半途中，机房不幸**又一次停电崩溃**了。重启后新的 ARIES 怎么防止此前已经回滚过了一半的操作被错误重复再回滚一次甚至落入死循环？
          options:
            - text: Undo 阶段每次回改前先追加一条 **CLR（补偿日志记录）** 并记录 `UndoNextLSN` 引用；再次恢复先用 Redo 恢复刚才做完的一半回滚，然后Undo 顺着 `UndoNextLSN` 直接跳过已处理段继续往更早扫尾
              correct: true
            - text: 第二次重启时直接禁止再打开数据库文件，永久报废
              why: 恢复过程本身必须做到“崩溃幂等安全（Crash-Safe / Repeatable Recovery）”——就算连续停电十次照样能安稳恢复完好
            - text: 每次崩溃时只允许删掉所有日志文件从空白起步
              why: 删掉日志会让所有已提交还没刷回主文件的记录和未完成半成品全部毁坏丢失
          explain: '**CLR + `pageLSN` 判断 + `UndoNextLSN`** 是 ARIES 经受住数十年极端宕机考验依然屹立不倒的三大精妙设计。'
      - item:
          id: q-aries-idempotent-redo
          type: choice
          prompt: 在 **ARIES** 的 Redo 阶段执行历史重演时，引擎拿一条日志记录去对照目标磁盘页头部的 `pageLSN` 编号：发现磁盘页上居然已经写着 `pageLSN >= 该日志 LSN`。为什么引擎应当直接跳过这条不再重复写？
          options:
            - text: 因为这页在崩溃前早已把这一步（甚至更晚的操作）安全刷入磁盘，再重演旧动作反而可能用老修改盖毁更新的物理页内容——跳过才能保障 Redo 绝对幂等准确
              correct: true
            - text: 因为电脑不会写比 `pageLSN` 更大的数字
              why: 比较 `pageLSN` 精确区分出“页上到底缺不缺这条记录的结果”，避免把早先已完成落盘并继续向前演化过的页往回倒改错乱
            - text: 因为 Redo 阶段本来就规定随机扔掉一半日志不管
              why: 只要页的 `pageLSN < 日志 LSN`（说明这一页断电前没来得及把这步刷盘），ARIES 就会严格重演补回！
          explain: '一行 `if page.pageLSN >= record.LSN: skip` 让 ARIES 的 Redo 既极速跳过大量已落盘老日志、又保证绝对准确！'

  # ======================================================================== 索引
  - id: hash-index
    chapter: 索引
    title: 散列数据结构、静态哈希与动态可扩展哈希（1.1–1.5）
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: F.1.1 里你已经用过 Python `dict` 和线性探测哈希表：当内存里的数组满了直接整个扩容翻倍、所有元素重新散列搬家就完事。可如果把这张哈希表存进磁盘数据库索引里，几百万页全在硬盘上：突然发现某个桶装满插不下时，难道要把全盘几百 GB 的磁盘页全读出来重算挪一遍吗？
          options:
            - text: 绝不能整表搬家！磁盘动态哈希（如可扩展哈希 Extendible Hashing / 线性哈希）靠“只针对装满的那 1 桶分裂成两半并按需要倍增轻巧目录槽位映射表”，每次扩容只需搬动区区 1–2 个磁盘页！
              correct: true
            - text: 磁盘上每次冲突必须重新格式化整块硬盘重头插入
              why: 整库全量重哈希（Rehashing）耗时高达几小时且直接停服卡死，动态哈希专门用局部桶分裂化解磁盘全局扩容灾难
            - text: 数据库硬盘里禁止使用任何哈希函数算槽位
              why: 磁盘哈希索引（Hash Index）极其擅长做高速 `=` 等值点查（往往只需 1–2 次页读），只是做不了 `< / > / BETWEEN` 范围扫描
          explain: 从静态线性探测/布谷鸟哈希走到适配持久化磁盘页的动态可扩展哈希（1.1–1.5 节），核心就是“把大数组搬家代价压进目录位图与局部页分裂”。
      - card:
          title: 内存静态哈希 vs 磁盘面向页的静态散列（1.1–1.4）
          body: |
            数据库里哈希索引用来实现极速 `key = value` 等值定位（对比 B+ 树做范围查询）：
            - **静态散列方案（1.4）**：固定分配好 `N` 个磁盘页桶（Bucket）。线性探测（Linear Probing）就近找空槽，需要“墓碑”防删后断链；罗宾汉散列（Robin Hood）劫富济贫让各键偏移长度波动更小；布谷鸟散列（Cuckoo）用双表双函数做到确定 $O(1)$ 最坏查！但桶总数固定死，数据翻十倍后溢出链越拖越长。
      - card:
          title: 动态哈希：可扩展哈希与线性哈希（1.5）
          body: |
            想按数据量平稳长大又不一次全盘大搬家：
            - **可扩展哈希（Extendible Hashing）**：在磁盘数据页前面加一层轻巧的**桶引用目录（Directory）**，按哈希前缀前 `global_depth` 位索引目录；某页桶满（达到 `local_depth`）时，仅当 `local == global` 才翻倍轻巧的引用目录数组，只把满的那 **1** 个数据页按下一位比特拆分成两个新页！
            - **线性哈希（Linear Hashing）**：干脆连目录倍增都免了，设一个慢步前进的分裂游标逐个轮流扩桶，平稳分摊扩容开销。
      - item:
          id: q-static-vs-dynamic-hash
          type: match
          prompt: 把数据库索引里的四种散列机制与各自最精准的设计特点配对（1.4–1.5 节）。
          pairs:
            - [线性探测（Linear Probing）与罗宾汉散列, 顺着槽位向后或按距离置换找空位，但一旦定死总桶数数据暴涨后容易拥堵甚至不得不重搬]
            - [布谷鸟散列（Cuckoo Hashing）, 双哈希函数与互相踢让换位，使点查至多只查 2 个位置即可必定命中或判定不存在]
            - [可扩展哈希（Extendible Hashing）, 加一层按二进制前缀索引的轻目录数组；桶满时多数只需分裂那 1 个页、必要时倍增极小的引用目录]
            - [哈希索引天然局限, 极速处理 `=` 等值点查，但不保留大小顺序，无法高效支撑 `WHERE id > 100` 或 `ORDER BY`]
          explain: 记清哈希索引的“快（点查几乎常数 I/O）”和“短板（不能范围扫描与前缀排序）”，就知道为什么系统默认主键索引大多选 B+ 树！
      - card:
          title: 例题：拆解一次可扩展哈希页满分裂：何时目录翻倍、哪些老数据页居然纹丝不动？
          body: |
            假设某可扩展哈希目录当前全局深度 `global_depth = 2`（共 `4` 个引用项：`00, 01, 10, 11`），各自指向 `local_depth` 不同的三个磁盘页（其中 `10` 和 `11` 共用同一个只看首位 `1`、`local_depth = 1` 的桶页 C）。看看两次插入发生了什么：
          reveal:
            - title: 第 1 步：只管共享桶页 `10/11`（`local = 1 < global = 2`）满时——目录完全不用翻倍！
              body: 往 `10` 插入时桶页 C 满了。检查发现 C 的 `local_depth = 1` 小于全局深度 `2`，说明原本 `10` 和 `11` 在目录里本来就分开占着两个引用槽！因此**只需把桶页 C 这 1 页里的数据按第 2 位比特重新拆回新页 C0（收 `10*`）和 C1（收 `11*`）**，`10` 指向 C0、`11` 指向 C1，目录长度保持 4 不动，其他页 `00`、`01` 一根毫毛也没碰！
            - title: 第 2 步：若装满的是 `local = 2 == global = 2` 的桶页 A——目录数组翻倍成 8 项，但仍只分裂页 A！
              body: 桶页 A（`00*`）也满时，`local == global == 2`，引擎把轻巧的内存目录数组引用从 4 项倍增到 8 项（`000..111`），然后照样只按第 3 位比特把 **页 A 这唯一一页** 拆成两个新数据页；原本页 `01`、`10`、`11` 在目录里只是多出成对的新引用指回原磁盘页，全盘里高达 75% 的老数据页纹丝不动！
            - title: 第 3 步：反观顺序扫描全量散列函数选型（1.3 节）
              body: 为了让哈希值各比特分布均匀无倾斜碰撞、防刻意输入撞桶（Hash Flooding）又足够快，现代数据库多选用 `xxHash` 或 `MurmurHash` 这类高性能非加密全混洗哈希（1.3 节），避免用过慢的加密摘要或脆弱的简单取模。
      - item:
          id: q-ext-hash-double
          type: choice
          prompt: 在可扩展哈希（Extendible Hashing）里，某个磁盘桶页已经塞满触发分裂。什么时候引用目录（Directory）根本**不需要**翻倍长度，只需要单独分裂那 1 个装满的数据页就行？
          options:
            - text: 当这个满桶页自身的局部深度 `local_depth` 严格小于当前目录全局深度 `global_depth` 时（说明目录里原本已经有多个引用共享指着这页，分完刚好各指各的）
              correct: true
            - text: 永远每次插满一页就必须把全硬盘全部上亿行记录全部重新搬家一边
              why: 就算 `local_depth == global_depth` 需要把轻巧的引用目录倍增，真正磁盘数据页里也永远只拆分搬动刚才装满的那 **1** 页！
            - text: 只有在所有磁盘页全都同时塞满 100% 时才允许拆分其中任意一页
              why: 单个桶溢出即触发局部拆页，绝不会等全表塞满拖死性能
          explain: “目录存内存引用倍增极廉价，磁盘只拆溢出那一小页”，这就是可扩展哈希能在磁盘上优雅动态扩容的秘诀！
      - item:
          id: q-hash-vs-range
          type: choice
          prompt: 一张用户积分流水表上需要频繁运行两种查询：`WHERE order_id = 88421`（精确点查）以及 `WHERE created_at BETWEEN '2026-10-01' AND '2026-10-31'`（范围筛选与按时间排序输出）。应该在 `created_at` 列上建纯散列索引还是 B+ 树索引？
          options:
            - text: 在 `created_at` 上必须建 **B+ 树** 索引，因为散列函数会把相邻日期打乱分散进毫无顺序的随机桶里，根本无法做范围区间定位和保序遍历
              correct: true
            - text: 建纯散列索引照样能只跳 1 步瞬间扫描出十月份整个区间
              why: 优秀哈希函数的使命恰恰是“哪怕仅相差 1 秒的两个时间戳也要均匀离散到彻底不相干的随机槽位里防碰撞”，天然粉碎区间相邻性！
            - text: 两个查询全都必须取消一切索引改做全表挨页扫描
              why: 精确等值可由哈希或 B+ 树胜任，一旦涉及范围与顺序需求，有序多叉 B+ 树才是毫无疑问的首选
          explain: 等值单点看哈希或 B+ 树；一旦遇见范围 `< > BETWEEN`、`ORDER BY` 或前缀 `LIKE 'abc%'`，唯有 **有序 B+ 树** 能一夫当关！
      - item:
          id: q-linear-hashing-split
          type: choice
          prompt: 与可扩展哈希依赖一个会突然倍增的全局目录数组不同，**线性哈希（Linear Hashing，1.5 节）** 采取了一个引用轮流依次按序拆分每个桶页的思路。这带来了什么主要优点？
          options:
            - text: 无需维护随时可能整体翻倍的大目录表，且能把扩容拆页的工作量平滑分摊到长期各次写入中（即使当前装满的并非分裂游标恰好指着的那 1 桶，也会先容忍极短溢出链并按序稳步推前拆分引用）
              correct: true
            - text: 线性哈希彻底禁止往数据库里写任何超过 2 个字节的键
              why: 线性哈希能正常存任意合法索引键，亮点在于把引用目录免掉并按圆环轮流平稳逐桶扩表
            - text: 线性哈希能够把 `WHERE id > 100` 的范围扫描提速成 O(1)
              why: 无论哪一种纯哈希结构，本质上都不按原键大小排序存放，依然只服务等值查找
          explain: 可扩展哈希“满哪页拆哪页（需目录）”，线性哈希“轮着引用逐个扩（免目录平滑摊派）”——两者都是针对外存分页设计的动态散列典范！

  - id: bplus
    chapter: 索引
    title: B+ 树结构、千万行高度算术与设计优化（综合练习 1）
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 数据库表膨胀到了整整 `1,000` 万行（`10^7` 行）！如果每页 `8 KB` 能存 `100` 行完整数据，顺序挨页全表扫完要读 `100,000` 页。如果改建一棵 **B+ 树**索引，每一页最多能装 `200` 个路标键/子引用（高**扇出**），那么从根节点一路顺藤摸瓜查到目标那 `1` 行，一共只需穿过多深几层索引页（综合练习 1）？
          options:
            - text: 惊人的仅需 **4 层索引页**（`50,000 叶页 → 250 内层 → 2 内层 → 1 根`）！从 `100,000` 次顺序读直降到区区 `4–5` 次磁盘页定位！
              correct: true
            - text: 肯定至少需要像普通二叉树那样走 `24` 层到 `100` 层才找得到
              why: 普通二叉树每节点只有 2 个分支（log₂ 10⁷ ≈ 24），每跳一层就是一次昂贵磁盘/内存 I/O；而 B+ 树把整页填满 `200` 个分支，log₂₀₀(50,000) 直接压成区区 **4 层**！
            - text: 因为有一千万行太重了，所以 B+ 树必须高达一百万层
              why: 恰恰靠高扇出（Fanout）矮胖设计，B+ 树就算十亿行也往往只停在 4 到 5 层高！
          explain: 亲手算一遍 B+ 树每层容量和页 I/O 对比，是理解数据库索引为什么能把秒级慢查提速上万倍的核心算术（2.1–2.4 节 & 综合练习 1）。
      - card:
          title: 什么是 B+ 树与高扇出：为什么它击败了普通 B 树和红黑树（2.1–2.2）
          body: |
            **B+ 树（B+Tree）** 是自平衡多路有序搜索树，专门针对“一次读一整页 4KB/8KB”的磁盘/内存层次优化：
            1. **内部节点不背大块行正文**，只轻装存导航键和子页引用，因此一页能塞进极大 **扇出（Fanout）**（如 `200` 个分支！）；
            2. **所有真实值引用（或聚簇表整行数据）只集中在最底层叶页**，且**叶页之间用双向引用手拉手有序串成链表**——点查直达叶子，范围扫描直接沿底边横扫一路不回头！
      - card:
          title: B+ 树设计抉择与压缩优化（2.3–2.4）
          body: |
            建一棵实用 B+ 树还要定三个工程决策（2.3–2.4 节）：
            - **聚簇索引（Clustered） vs 非聚簇（Unclustered）**：聚簇把物理数据行直接按主键序排在 B+ 树叶页内（树找到叶即拿全行，零额外回表！但表只能按 1 个主键聚簇）；非聚簇二级索引叶子只存行号/主键（点查拿到后需多 **+1 次**去数据表拿完整行）；
            - **节点大小、合并策略与变长键前缀压缩（2.4）**：把长共享字符串前缀或尾部公共后缀剪短塞进内层路标，让单页装进更大扇出、压低树高！
      - item:
          id: q-bplus-height-10m
          type: number
          prompt: "计算综合练习第 (1) 题：某表共 `10,000,000` 行，每个 B+ 树叶页容纳 `200` 条索引项，每个内部路标页的扇出（最大子分支数）同样为 `200`。从根节点（含根）到叶节点一共构成几层 B+ 树索引？（填整数）"
          answer: 4
          explain: "逐层向上除以 200 并向上取整：叶层 = `10,000,000 / 200 = 50,000` 页；上一层内节点 = `ceil(50,000 / 200) = 250` 页；再上一层 = `ceil(250 / 200) = 2` 页；最顶根页 = `ceil(2 / 200) = 1` 页。列表 `[50000, 250, 2, 1]` 共 **4 层索引树高**（点查沿路径读这 4 个索引页；若为非聚簇二级索引还需多加 1 次堆表页读取共 5 次，而全表扫描要读 `10,000,000 / 100 = 100,000` 页）！"
      - card:
          title: 例题：核对综合练习第 (1) 题全部口径与真实 SQLite `EXPLAIN QUERY PLAN` 印证！
          body: |
            综合练习第 (1) 题既要算准 B+ 树层数和两种索引差异，也要说明对比全表扫描 `10^5` 页的优势；验证脚本同时也在真实 SQLite 上检视了 `EXPLAIN QUERY PLAN`：
          reveal:
            - title: 第 1 步：算清树高 4 层（聚簇 4 次 I/O vs 非聚簇 4 + 1 = 5 次 I/O）与全表 10^5 页
              body: 务必注意两类口径说明：索引本身结构由下而上是 `50,000 → 250 → 2 → 1` 共 **4 层**，因此聚簇点查只需 **4** 次页读；若是二级非聚簇索引，先走完 **4** 层索引页拿到行物理引用（或主键值），再加 **1** 次跳去主数据页抓回完整记录合计 **5** 次 I/O——哪怕最慢 5 次也远胜于全表顺序扫描的 **`100,000` 页**（差了两万倍，且上面常驻内存的那 1 个根与 2 个顶层页还几乎 100% 命中缓冲池不用真实进盘！）。
            - title: 第 2 步：若做全表大范围 `status = 'refunded'` 且占表近半行时反倒未必比全表扫快
              body: 正如 `D.1.2.verify` 实测展示：无索引时 SQLite 报 `SCAN orders`（全表顺序扫），加上 `CREATE INDEX orders_status ON orders(status)` 且 `'refunded'` 极稀少（4 行中仅 1 行）时立刻切为 `SEARCH orders USING INDEX orders_status`！但如果表里 `90%` 全是同一状态、每个非聚簇命中都随机蹦去堆表取整行，随机蹦几十万次页可能比顺着磁盘一路连续 `SCAN` 全部 `10^5` 页慢得多（第 5 章代价模型详细算账）！
            - title: 第 3 步：利用 B+ 树叶子双向链表兼得高效率有序范围扫描
              body: 查 `WHERE score BETWEEN 85 AND 95 ORDER BY score` 时，引擎只需走 4 层树精确定位到第一条 `>= 85` 的叶子位置，然后顺着叶页底部的双向兄弟引用一路向右顺读直到遇到 `> 95` 为止，连根层都不用重新爬！
      - item:
          id: q-bplus-fullscan-pages
          type: number
          prompt: "一共 `10,000,000` 行数据，按数据页每页存 `100` 行完整记录计算，不做索引直接全表顺序扫描一共需要读取多少页？（填整数）"
          answer: 100000
          explain: 全表总数据页数 = `ceil(10,000,000 / 100) = 100,000` 页（对比走 B+ 树点查只需 `4` 次索引页读或 `5` 次非聚簇读取！）。
      - item:
          id: q-clustered-vs-unclustered
          type: choice
          prompt: 关于 **聚簇索引（Clustered Index）** 与非聚簇二级索引（Unclustered Index）的差异与适用场景，以下说法哪一项正确？
          options:
            - text: 一张表的数据物理行只能按 **1** 种顺序真实排序存放，因此至多只能有 1 个聚簇索引（其余列只能建存行地址引用/主键的二级索引，查询全行时常多出 1 次回表或靠覆盖索引免回表）
              correct: true
            - text: 一张物理表里可以在同一份硬盘位置同时把所有行按学号升序、按姓名拼音、按出生日期三套互不相干的顺序同时实体摆盘
              why: 同一份记录物理字节不可能既按姓名顺排又同时按成绩逆排摆放，多余查询维度必须使用非聚簇二级索引（或另外独立拷贝）
            - text: 非聚簇索引叶子里面从不保存任何位置引用，查到键以后只能回去再全表扫一遍
              why: 非聚簇索引叶子精确存着该键对应的数据行物理位置引用或聚簇主键号，回表点取只需 1 次精确直达查找（如果查的列恰好全在二级索引里“覆盖索引”，甚至 0 次回表！）
          explain: 记清两个工程加速妙招：**复合索引按查询高选择前导列排** + **覆盖索引（把 `SELECT` 需要的列都顺手包进索引里免去回表）**！

  - id: filters
    chapter: 索引
    title: 专用索引家族：布隆过滤器、跳表、前缀树、倒排与向量索引
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: B+ 树和普通哈希虽好，但面对四类截然不同的现代化需求就犯了难：① 海量小文件每次都要进磁盘查一遍“某个不存在的键在不在”太慢，能不能先在极小内存里一微秒直接否决“绝对不在”？② 搜一整段中文文章里包含哪些词、或搜高维语义最相近的 10 张照片？难道全部硬塞进常规 B+ 树能搞定吗？
          options:
            - text: 各自有专用利器：**布隆过滤器**用极小位图一秒否定不在、**跳表**实现无大锁高并发内存有序结构、**前缀树**做字符串共前缀检索、**倒排索引**做全文分词搜索、高维嵌入相似索引做近似最近邻语义检索！
              correct: true
            - text: 只要在 SQL 里把 `WHERE` 多写十个 `OR` 就全能替代全文分词和图像相似检索
              why: 传统精确相等或单维区间匹配搜不出“把大象装进冰箱”同义词段落，也不能在高维语义空间快速算余弦最近邻
            - text: 布隆过滤器只要存进去 1 个字节就永远既不会漏报也不会误报任何假阳性
              why: 布隆过滤器因为共享哈希比特位置，存在极低可控概率误报（“说可能在，实则不在”），但绝对保证 **零漏报（“说不在，就 100% 肯定绝对不在”）**！
          explain: 第 3 章带你扫完 B+ 树之外的整套现代引擎索引与过滤工具箱（3.1–3.7 节）！
      - card:
          title: 过滤利器：布隆过滤器（3.2）与内存有序无锁跳表/前缀树（3.1、3.3–3.4）
          body: |
            - **布隆过滤器**（Bloom Filter，3.2）：紧凑比特数组配 `k` 个哈希函数。查 `x` 时只要任一位是 **`0`**，就能 **100% 打包票：绝对不在**，省去读盘！全为 `1` 才进盘复核（绝不漏报）。
            - **跳表（3.3）与前缀树（3.4）**：跳表靠概率多层链表免去树重平衡；前缀树共享字母前缀（3.7 节含节点压缩优化）。
      - card:
          title: 全文检索与 AI 时代底座：倒排索引（3.5）与向量索引（3.6）
          body: |
            - **倒排索引（3.5）**：按 **“词项 → 所在文档列表”** 建映射（搜词交集比 `LIKE '%优化%'` 快万倍！）。
            - **向量**指由百余个浮点数组成的语义坐标表示。传统 B+ 树面对几百个维度立刻失效，因此**向量索引（3.6）**改用量化分桶（IVF）或分层近邻图（HNSW）作近似最近邻快速检索！
      - item:
          id: q-bloom-filter-guarantee
          type: choice
          prompt: 在现代 LSM-Tree 存储引擎（如 RocksDB / Cassandra）前面配上一个节省内存的 **布隆过滤器（Bloom Filter）**。当一次查询探测布隆过滤器之后返回“不存在（0）”与返回“可能存在（1）”时，分别能得出什么绝对结论？
          options:
            - text: 返回“不在”时 **100% 确定该磁盘文件绝对没有这个键**，直接跳过磁盘读取省大功夫；返回“可能存在”时可能有极低概率误报（假阳性），必须再去核对真正数据页才能下定论
              correct: true
            - text: 返回“可能存在”代表 100% 一定存在不用去查正表；返回“不在”反倒经常会漏掉真的已经插入过的老键
              why: 结论彻底说反了！布隆过滤器因为多位不同键哈希位可能恰巧碰撞叠加全亮 `1`，会有**假阳性（False Positive）**，但只要插过的键自己 `k` 个位置必全已亮 `1`，因此永远 **0 假阴性（Zero False Negative）**！
            - text: 布隆过滤器能精确记住每行记录的全部文本值和成绩分
              why: 布隆过滤器仅回答集合成员存在性判定，并不保存键以外的值内容，且通常标准版不支持直接安全删位
          explain: 把那句经典判断倒背如流：**“Bloom Filter 说有不一定真有（需实查核验）；说没有那就铁定真没有（安心跳过磁盘）！”**
      - card:
          title: 例题：为什么搜电商商品描述里的关键词不能靠 `LIKE '%蓝牙%'` + B+ 树，而必须用倒排索引？
          body: |
            假设某电商库里有 `500 万` 件商品详情文本。一位用户搜 `"无线 降噪 蓝牙"`，如果开发只建了普通 B+ 树还写了 `WHERE title LIKE '%蓝牙%'` 会发生什么？用 3.5–3.6 节解释清楚：
          reveal:
            - title: 第 1 步：通配符开头的 `LIKE '%...'` 完全踩不上 B+ 树有序前缀路标！
              body: B+ 树按照字段值从第一个字符开始按字母/编码字典序排顺；`LIKE '华为%'` 还能先定位前缀顺藤扫一小段，但一旦前面多了通配符 **`'%蓝牙%'`**，“蓝牙”可能躲在任意第 5 个或第 50 个字中间，B+ 树引用彻底失灵，被迫老老实实把 500 万行全文全扫一遍！
            - title: 第 2 步：倒排索引提前做好“词 → 有序文档号列表”逆向表，一毫秒求交集出结果
              body: 倒排索引提前把商品描述拆词（Tokenize）后记成 `“无线” → [doc 3, 19, 88...]`, `“降噪” → [19, 40, 88...]`, `“蓝牙” → [2, 19, 88...]`，搜索时只需取出这三个词的压缩文档编号列表用有序双引用极速求交集，立刻秒出 `[19, 88]`！
            - title: 第 3 步：连词字面都不匹配但意思相近（如搜“降噪”匹配“消音耳塞”）靠向量索引补齐
              body: 当用户想找“意思相近”而非字面词一模一样的高维向量表示（Embeddings）时，再靠 HNSW 分层近邻图等向量索引直接量取向量距离找 Top-K 最相似邻近，构成现代多模态搜索底座！
      - item:
          id: q-special-indexes-match
          type: match
          prompt: 把四种特定查询需求与最对口的专用索引或数据结构配对（3.2–3.6 节）。
          pairs:
            - [高速过滤掉根本不存在冷键值、省下昂贵磁盘块随机读, "**布隆过滤器（Bloom Filter）**（无漏报仅极低误报位图）"]
            - [在亿级文本商品标题和文章正文里按分词组合毫秒级搜文章, "**倒排索引（Inverted Index）**（词项到有序文档 ID 集合列表）"]
            - [实现高并发内存写结构，用概率多层链表替代全局复杂树平衡操作, "**跳表（Skip List）**与压缩前缀树（Trie）"]
            - [对几百维大模型嵌入特征算近似余弦最相似图片/语义检索, "**向量索引（Vector Index，如 HNSW / IVF）**"]
          explain: 世上没有一把万能锤——分清精确定位、区间序、存在性过滤、全文分词与高维向量近邻，选对底层索引结构性能往往差百千倍！
      - item:
          id: q-btree-prefix-like
          type: choice
          prompt: '在一列普通文本上只建了常规 **B+ 树** 索引（没有建倒排索引）。下面两条模糊搜索语句：`A: WHERE name LIKE ''Mei%''` 与 `B: WHERE name LIKE ''%Mei''`，哪一条能有效借上这棵 B+ 树索引的快速范围定位？'
          options:
            - text: '**只有 A（`''Mei%''` 固定前导前缀）能利用 B+ 树做高效范围定位**；`B`（`''%Mei''` 前导未知通配符）因为无法锁定起始首字母，通常退化为扫全索引或全表'
              correct: true
            - text: 只有 B 能用上 B+ 树索引，A 反而不能用
              why: 字典序排列永远先比较最左边第 1、第 2 个字符，固定最左前缀 `'Mei%'` 在树叶子上恰好缩成一段连续区间，完美适配 B+ 树叶子扫描！
            - text: A 和 B 全部都能一步只跳 1 个叶节点直接定位命中
              why: 前面一旦是任意长度不定通配符 `%`，树上按首字母排序的所有叶子都可能藏着以 `Mei` 结尾的单词，无法靠树路标剪枝
          explain: 这也是实际写业务最常见的一条优化常识：**单靠 B+ 树 `LIKE` 必须保持左前缀定死不能随便在最开头挂 `%`**；真有任意位置搜关键词需求，立刻切用**倒排索引 / 全文索引**！
      - item:
          id: q-vector-hnsw-why
          type: choice
          prompt: 当AI检索场景把每张图片或每段文本转成 `768` 维浮点数 **向量**，需要找出与当前查询最接近的 Top 10 个相似项（3.6 节）。为什么传统的 **B+ 树** 在 768 维上完全派不上用场？
          options:
            - text: B+ 树只能沿 1 维字典大小顺序排成一根线，几百个维度同时交织算欧氏或余弦距离会导致高维维度灾难无法靠树区间剪枝，必须换用 **向量索引**（如分层近邻图 HNSW 或 IVF 聚类倒排桶）作近似最近邻（ANN）检索
              correct: true
            - text: 因为浮点数在 B+ 树里只允许存 1 个数字就自动报错
              why: 单维浮点数建 B+ 树完全合法，失灵原因在于高维空间的几何邻域无法映射成单一 1 维保序区间
            - text: 因为 768 维图片特征只能全部当成字符串写死在 SQL 表名里
              why: 高维向量在专门的向量索引引擎里按量化倒排或近邻跳图组织，能在毫秒级从百万向量中挑出几乎最优的近似近邻
          explain: B+ 树统治 1 维标量与组合前缀、倒排索引统治文本分词、向量索引统治高维特征空间——三剑客各管一摊！

  - id: latches
    chapter: 索引
    title: 索引并发控制：Lock vs Latch、哈希闩锁与 B+ 树螃蟹协议
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 前面第 1 章用 **2PL 事务锁** 防止两个人买光同一张票。现在设想两个完全毫不相干的事务 `T1` 修改学生 `S1`、`T2` 修改学生 `S99`——逻辑上毫无半点冲突！可偏偏他俩这微秒的 B+ 树页刚好挤在同一个叶节点，而 `T1` 往里插一行刚好把那页撑爆要**拆裂成两页（Page Split）**！如果这时候允许 `T2` 同时读那个正拆了一半、内存引用乱指的页，会怎样？
          options:
            - text: 整个数据库内存树引用当场崩溃撕裂！保护事务逻辑隔离的是长达百毫秒到秒级的**事务锁（Lock）**，而保护物理页内存结构在微秒级分裂/合并期间不被踩烂的，是极其短促的微秒级内存页保护同步锁！
              correct: true
            - text: 因为 T1 和 T2 改的是不同同学，所以哪怕同一物理页引用在半拆中也可以直接随便乱读写
              why: 即使逻辑行完全无关，只要共享同一页物理数据结构（数组偏移、兄弟节点位置引用），并发写而不加短暂物理同步就会损坏页内内存结构导致段错误崩溃！
            - text: 应该用 Strict 2PL 的物理页锁一直锁住整个 B+ 树根页直到交易全部结束才放
              why: 要是事务全程攥着 B+ 树根节点一直等到 `COMMIT` 才松手，整个数据库瞬间就变成了可笑的每秒只能服务 1 个人的绝对串行卡车！
          explain: 分清数据库系统教科书必考的双子概念：**Lock（事务逻辑锁） vs Latch（物理结构同步锁）**，并掌握优雅的树形螃蟹加锁协议（4.1–4.5 节）。
      - card:
          title: Lock（事务锁） vs Latch（闩锁）五大区别（4.1–4.3）
          body: |
            千万别把这俩混为一谈（4.2 节对比核心）：
            - **事务锁（Lock）**：保护数据库逻辑内容（行/表），面向**事务**全程（可能持续好几秒），支持因崩溃或回滚撤回（Rollback），需要**死锁环检测与打破**；
            - **闩锁**（Latch）：保护数据库内存内部结构（B+ 树页、缓冲池页帧表、哈希槽），面向并发操作仅持有短短**微秒/纳秒**，绝不需要回滚语义——必须靠代码规矩严守无等待环（常用底层 CAS 原子对比或读写互斥自旋实现，4.3 节）！
      - card:
          title: 哈希闩锁与 B+ 树“螃蟹加锁法（Latch Crabbing）”（4.4–4.5）
          body: |
            - **哈希表加闩（4.4）**：按桶或槽加轻量读写闩，无需锁死全表；
            - **B+ 树螃蟹协议（4.5）**：拿父闩抢子闩；若发现子节点“安全（Safe）”不会往上波及分裂或合并，**立刻松掉全套祖先闩**（含根节点！）。99% 插入不分裂，可采用**乐观螃蟹**：上层一路只拿并发共享读闩，仅底部目标叶拿写闩！
      - item:
          id: q-lock-vs-latch-match
          type: match
          prompt: 把 **Lock（事务锁）** 与 **Latch（闩锁）** 体系中的四个设计要点与它们的精确含义匹配（4.2、4.5 节）。
          pairs:
            - ["**保护目标为表、行记录与逻辑范围免遭事务冲突**", 事务锁（Lock）：随事务持有至提交/回滚，支持回滚并有等待图死锁检测]
            - ["**保护目标为内存 B+ 树页或哈希桶结构免被踩烂**", 闩锁（Latch）：微秒级持有不写回滚日志，靠编码次序严防等待成环]
            - ["**节点“安全（Safe）”判定触发时机**", 螃蟹加锁协议确认子节点插入未满或删除超半满时，立即提前松开父/根祖先闩]
            - ["**乐观螃蟹（Optimistic Latch Crabbing）**", 根和上层内节点一律走并发共享 S 读闩高速穿过，仅底部叶页上 X 写闩]
          explain: 记死一句对比：**Lock 保护“用户的账目逻辑正确性（对人）”**，**Latch 保护“引擎程序员自己的内存引用不断裂（对内部代码数据结构）”**！
      - card:
          title: 例题：为什么乐观 B+ 树螃蟹（Optimistic Latch Crabbing）能让根节点热点吞吐猛涨十倍？
          body: |
            哪怕是一棵只有 `4` 层的千万行 B+ 树，几乎每一笔 `INSERT` 都必须从那 **唯一 1 个根节点页** 开始往下走！如果每次一上来就拿悲观写锁，100 个并发插入在根节点门前全堵死！看看螃蟹+乐观提速三步走：
          reveal:
            - title: 第 1 步：基础螃蟹规则——什么叫节点“安全（Safe）”？
              body: 对“插入”来说，只要当前拿到的子节点目前还没装满（仍有空余槽位），就算等下真的把子叶塞满往上推一个分隔键，这个子节点最多只是吸收掉那个键，**绝不可能继续往上引起分裂波及父亲与祖先**！这叫插入安全——立即放心释放上面父节点和根节点的锁！对“删除”来说，只要节点当前条目超过半满下限，也保证不会往上合并借键，同理安全放祖！
            - title: 第 2 步：悲观螃蟹依然会给根节点上写锁 `X`（即便大多数情况立刻又放掉）
              body: 悲观写法开局就先给根上排他 X 闩，直到步入第 2 层确认它没满才松掉根。问题在于多核心争抢着改写根节点“同一份排他闩标记位”本身，就会造成剧烈的硬件缓存行乒乓拖慢所有核！
            - title: 第 3 步：乐观螃蟹——上面一路只拿不互阻的共享 S 闩锁，只在最底叶拿 X 闩！
              body: 现实中扇出 200 的节点平均每 200 次插入才有 1 次会真分裂叶子！于是乐观策略全程让所有人**并发拿读共享 S 闩锁顺畅滑过根和所有内层**（只读共享互不相斥，硬件核心零排队冲突！），只把最底下的目标叶子页锁上写 X 闩。真碰巧这叶装满会连累上层 1% 罕见分裂时，才退回重走一遍老实写闩版本——99% 场景直接起飞！
      - item:
          id: q-crabbing-safe-node
          type: choice
          prompt: 当一个 B+ 树**插入**操作顺着螃蟹协议（Latch Crabbing）从根节点往下拿到下一层子节点页的写闩锁（X Latch）时，依据什么条件能立刻放心**提前释放掉父节点与所有祖先节点的闩锁**？
          options:
            - text: 当确认当前拿到的这个子节点目前**尚未装满**（即使再往里插一个来自下层分裂上来的键，本页也能直接装下、绝不会波及更上层父亲分裂）时
              correct: true
            - text: 当发现这个子节点已经 100% 塞得满满当当、正准备把上面祖宗十八代全部连环拆开时
              why: 这恰好是最危险的不安全状态！马上就要回过头来往父节点插入分隔键甚至分裂父亲，此时绝不能把父锁放掉，必须紧紧攥着待改！
            - text: 插入操作从根节点起必须一直锁死到第 5 年才允许松手
              why: 正是为了把根节点和其他上层热页尽快让给并发操作，才利用“安全点提前放祖宗”大幅缩减锁范围
          explain: 同理对**删除**来说，“半满以上还有富余（删掉一个元素也不会少于最低要求需要合并借键）”才叫安全可提前放父！
      - item:
          id: q-optimistic-crabbing-why
          type: choice
          prompt: 为什么面对多并发插入，**乐观螃蟹协议（Optimistic Latch Crabbing）** 对根节点与上层内节点仅申请共享读闩锁（S Latch）、只在叶节点申请写闩锁（X Latch），能比纯悲观螃蟹协议快出很多？
          options:
            - text: 扇出极大的 B+ 树几乎很少触发连环分裂到上层（例如不到 1%），改用不阻塞彼此的 S 读闩高速穿过根和上层内节点消除了全系统最严重的热点排他争用；万一真遇上满叶再退回悲观重试
              correct: true
            - text: 因为共享读闩 S 完全不允许任何操作经过根节点
              why: 正相反，共享 S 闩允许多路并发一起同时穿过读根节点，互不堵车！
            - text: 因为乐观螃蟹把 B+ 树所有叶节点全删掉了只留根节点
              why: 树形完整不变，优化纯靠把“极少真分裂的悲观写占用”置换为“99% 只读快速通道”
          explain: 用“大概率乐观只读路过 + 小概率撞满退回重走”换极高并发度，是整个现代 B+ 树引擎实现的核心秘技（4.5 节）！
      - item:
          id: q-hash-latch-avoid-deadlock
          type: choice
          prompt: 不仅 B+ 树需要防止加闩锁互相等待死锁，如果在哈希表内部执行多槽位移位（如罗宾汉或布谷鸟置换）时同一操作需要顺次拿两个不同桶的 **闩锁（Latch）**，应该用什么最简单硬核的规矩彻底避免互相拿错顺序卡死（4.4 节）？
          options:
            - text: 硬性统一加闩顺序（例如一律只能从桶编号小的槽位向桶编号大的槽位依次拿闩锁），或使用不等待直接尝试 `try_latch` 失败就先退回松手的规程，从而破坏死锁成环的必要条件
              correct: true
            - text: 干脆只在每年年底检查一次哈希表有没有因为加闩死锁彻底卡死机
              why: 闩锁持用仅微秒且底层往往不含通用死锁检测器，代码协议层必须从设计上保证 **永远不可能出现拿闩环**！
            - text: 直接使用 Strict 2PL 事务锁一直锁死整张哈希表到明年底
              why: 事务逻辑锁无法也不该代替保护内部内存桶结构的轻量短时闩锁
          explain: 记死两条实现铁律：**树形结构严格按从父到子同向取闩；多桶结构严格按固定编号升序（或退避重尝）取闩——绝对禁止逆向回头抢锁！**

  # ======================================================================== 执行计划
  - id: operators
    chapter: 执行计划
    title: 物理执行模型（Iterator / 向量化 / 物化）、外部排序与聚合算子（5、7 章）
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 面对一个要从 500 万行数据里排序再汇总分组的复杂 SQL，执行引擎怎么把关系代数树一环套一环跑起来？难道每次执行一个节点都要先傻傻把整整 500 万行中间表全算完存满硬盘再传给父节点，还是父节点每喊一声 `next()` 才按需吐出几条？
          options:
            - text: 各自对应经典流水线拉取模型：**流式拉取模型**每次 `Next()` 逐行吐出、**向量化模型**每次攒一小批数组吐出减掉海量函数调用损耗、**物化模型**才全算完传整块！
              correct: true
            - text: 每次执行查询前必须把所有列的数据写死进硬编码里
              why: 执行引擎依靠标准抽象统一 **算子** 接口驱动整棵 **执行计划** 树流转运行，灵活组合任意关系操作
            - text: 因为只能用内存放全量数据，超过内存一行的表永远排不了序
              why: 当要排的数据超出内存缓冲池时，数据库靠**外部归并排序（External Merge Sort）**分批刷入临时归并段再多路归并排完！
          explain: 本课梳理查询执行器的核心骨架：物理算子处理模型、外部排序分组聚合以及表达式求值优化（5.1–5.3、7.1–7.5 节）。
      - card:
          title: 什么是执行计划与算子处理模型：火山模型、物化与向量化（5.1、7.1–7.4）
          body: |
            优化器输出由基本 **算子** 拼成的物理树就是 **执行计划**。三种拉取模型各有侧重（7.2 节）：
            - **火山流式模型**：每次调 `Next()` 拉 **1 行**，省内存通用但逐行调用开销高；
            - **物化模型**：子算子算完一整块再全交上去，适合小事务；
            - **向量化模型**：每次 `Next()` 拉 **1,000 行紧凑向量批**，极契合分析扫描与 SIMD。
      - card:
          title: 外存排序、两种聚合与访问方法/表达式（5.2–5.3、7.3–7.5）
          body: |
            内存装不下全表时靠**外部归并排序**（5.2）：每 `B` 帧输出初始有序顺串，随后每趟留 `B-1` 输入加 `1` 输出做多路归并（`1000` 页配 `B=102` 产 10 串，一趟合并）。**聚合**（5.3）可选先排序顺扫或哈希散列计数；同时留意访问路径（7.3）、增删改（7.4）与表达式 JIT（7.5）。
      - item:
          id: q-exec-models-match
          type: match
          prompt: 把查询执行引擎的三种经典 **执行计划** 处理模型与各自的核心适用权衡对应起来（7.2 节）。
          pairs:
            - ["**火山流式拉取模型（Volcano Iterator）**", 每次 `Next()` 逐行向上拉取元组，内存占用极低且易配合 `LIMIT` 早停，但逐行调用虚函数控制开销大]
            - ["**物化模型（Materialization）**", 子算子把全量中间结果一次性算完打包交出，省去来回切换调用，适合结果行不大的内存事务]
            - ["**向量化模型（Vectorized）**", 每次 `Next()` 返回一小批紧凑列式数组（如 1024 行向量），兼享流式低内存与现代 CPU 高吞吐批处理]
            - ["**B 帧外存归并排序（External Sort）**", "先按每次 `B` 页生成有序初始段（Runs），随后每趟使用 `B-1` 帧做多路输入加 1 帧输出流式合并，突破内存上限"]
          explain: 记清：**OLTP 逐行点查偏爱简单流式拉取/物化，现代 OLAP 分析扫描几乎一边倒转向向量化批拉取！**
      - card:
          title: 例题：用 `B = 102` 缓冲帧给 `1,000` 页的表 `R` 和 `500` 页的表 `S` 做外部排序，各需几趟读写几次磁盘？
          body: |
            这个关键数据正是下一课计算“排序归并连接 I/O 成本”和综合练习第 (2) 题的前置基本功！一步步把账算死：
          reveal:
            - title: 第 1 步：Pass 0 生成有序顺串——算出 `ceil(1000/102)=10` 个和 `ceil(500/102)=5` 个
              body: 对 `1,000` 页的 `R`：可用全部 `B = 102` 缓冲帧，需拆分产生 `ceil(1000 / 102) = 10` 个各自内部排好序的顺串！同理对 `500` 页的 `S` 产出 `ceil(500 / 102) = 5` 个顺串。这一步 Pass 0 把全表完整读进内存又写出有序段各 1 次，花去 `2 × R`（和 `2 × S`）页 I/O！
            - title: 第 2 步：Pass 1 多路合并——因为 `10 <= 101` 且 `5 <= 101`，各自只需短短 **1** 趟合并就能排完全表！
              body: 留 1 帧做输出缓冲，剩下有多达 `B - 1 = 101` 帧可以同时接不同顺串一起比最小键输出！既然 `R` 才 10 个顺串（`10 <= 101`）、`S` 才 5 个顺串（`5 <= 101`），两张表各自都只要 **1** 趟 Pass 1 就能彻底合出最终全排序整张表——整个外部排序只经历 `2` 趟（Pass 0 + Pass 1），合计共花 **`2 × 2 × 页数 = 4 × 页数`** 次磁盘页 I/O！
            - title: 第 3 步：顺便认识为什么插入/更新需要小心“万圣节问题（Halloween Problem, 7.4）”
              body: 如果执行 `UPDATE emp SET sal = sal * 1.1 WHERE sal < 1000` 顺着按 `sal` 排的 B+ 树索引一边扫一边往后挪索引位置，那位原本工资 `950` 的员工被改成 `1045` 重新插回 B+ 树右边后，扫描光标待会儿又会再次撞到已经改过工资的他再给他涨一次 10% 甚至无限涨下去！因此 7.4 节要求先记下原定目标行快照或延迟更新索引防止重复命中自己！
      - item:
          id: q-external-sort-runs
          type: number
          prompt: "手算一次外部归并排序（Pass 0）：假设一张表 `R` 一共占据 `1,000` 个磁盘页，缓冲池一共分给排序算法 `B = 102` 个内存槽页（每次顺串按整批 `102` 页排序写出）。在 Pass 0 结束时一共生成了多少个初始有序顺串？（填整数）"
          answer: 10
          explain: "`ceil(1000 / 102) = ceil(9.8039) = 10` 个有序顺串！（每 102 页 1 段，前 9 段满 102 页，最后第 10 段含余下 82 页。）由于随后合并最多支持 `B - 1 = 101` 路一次归并，而 `10 <= 101`，因此只需要紧接着 **1** 趟合并（Pass 1）就能把整张 1000 页的表全部彻底排顺！"
      - item:
          id: q-halloween-problem
          type: choice
          prompt: 执行器处理带 `WHERE` 更新语句 `UPDATE emp SET salary = salary * 1.1` 时，若正顺着 `salary` 上的 B+ 树索引向右扫描、一边把刚涨过薪的记录在树里原地删掉插到更靠右的新高薪位置，结果导致同一个员工在一条语句里被反复再扫到涨薪多次！这叫什么著名边界现象（7.4 节），怎么防？
          options:
            - text: 这叫 **万圣节问题（Halloween Problem）**；解决办法是把受影响目标行 ID 先物化收好再改，或者用基于修改前快照的多版本视图读取原键，绝不边挪动索引光标位置边扫新插入索引项
              correct: true
            - text: 这叫图遍历成环死锁，只能重启服务器解决
              why: 这是单事务自己内部更新正在遍历依赖的同一索引键引起的光标重复命中BUG，与多事务死锁无关
            - text: 只要规定全世界没人允许在公司涨工资就绝不触发
              why: 任何修改被当前扫描索引使用的列值的 `UPDATE` 都天然面对万圣节重扫隐患，所有成熟执行器均靠快照/先收集主键避开
          explain: 把理论概念（7.4 Modification Queries）落进具体真 BUG 案例里记，再也不忘！

  - id: joins
    chapter: 执行计划
    title: 三大物理连接算法（BNL / Sort-Merge / Grace Hash）与 I/O 成本算术（综合练习 2）
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 现在要把两张大表连起来：$R$ 占 `1,000` 页、$S$ 占 `500` 页，手里只有 `B = 102` 帧缓冲池内存。如果傻傻拿 `S` 当外层、每抓 `S` 里面**区区 1 页**就老老实实把 `R` 全表 `1000` 页扫一遍，总共要读惊人的 `500 + 500 × 1000 = 500,500` 页！如果我们一次性多用点内存框把 `S` 塞进 `100` 页大块再跟 `R` 对碰，或者干脆哈希拆桶——能把磁盘 I/O 从 **50 万页直接砍到 4,500 页**吗？
          options:
            - text: 完全可以！块嵌套循环（BNL）靠把 `B - 2 = 100` 页一次装块就把 `50 万` 砍到 **`5,500`** 页；而如果能做排序归并（合趟优化）或 **Grace 哈希连接**，更是直接压到仅 **`4,500`** 页（仅 `3 × (R + S)`）！
              correct: true
            - text: 不可能，只要连接就必须把两张表各自行数直接相乘扫描五十万页
              why: 按磁盘页（Block）批量分块和哈希分区分而治之，正是数据库连接算法把几分钟慢查变成半秒出结果的核心绝活！
            - text: 因为 `S` 比较大所以应当把大表 `R` 当成外层大块多扫几次小表
              why: 对嵌套循环而言，**小表永远当外表（Outer Relation）** 才能把划分出来的块数降到最少、让大表重读遍数最少！
          explain: 这一课带你手算通关综合练习第 (2) 题的三大连接成本对比：块嵌套循环（BNL）、排序归并连接（SMJ）与 Grace 哈希连接（GHJ）（6.1–6.5 节）。
      - card:
          title: 块嵌套循环连接（BNL）精确 I/O 公式（6.3、综合练习 2）
          body: |
            手里有 `B` 帧缓冲池内存时，**块嵌套循环（Block Nested Loop Join）** 的内存账怎么分？
            - 留 **1** 帧读内表 $R$ 流水页，留 **1** 帧装输出合并结果，剩下整整 **`B - 2`** 帧一口气装入小外表 $S$ 的一整个大块！
            - 外表 $S$ 总共被切成了 `ceil(|S| / (B - 2))` 块；每换装一大块 $S$，就把内表 $R$ 完整扫 1 遍。总页 I/O 精确公式：**`|S| + ceil(|S| / (B - 2)) × |R|`**！（记得：**永远挑总页数更小的表作外表 $S$**！用 $R=1000, S=500, B=102$ 算：`500 + ceil(500/100) × 1000 = 5,500` 页！）
      - card:
          title: 排序归并连接（SMJ）与 Grace 哈希连接（GHJ）（6.4–6.5、综合练习 2）
          body: |
            对于等值连接（$R.k = S.k$），还有两种更猛的分治大师：
            - **排序归并连接（SMJ，6.4）**：先分别对 $R$ 和 $S$ 做外部排序（两趟各读写 4 倍总页，共 `4 × (|R| + |S|) = 6,000`），再双引用同时扫一遍排好序的 $R$ 和 $S$（加 `|R| + |S| = 1,500`）→ 常规未合并优化总计 **`5 × (|R| + |S|) = 7,500`** 页！若内存足够多路归并最后一步顺道**边合并顺串边直接连接输出**（省掉最后写回排好序大表再重读的两倍开销 `2 × (|R|+|S|)`），I/O 立即降至 **`3 × (|R| + |S|) = 4,500`** 页！
            - **Grace 哈希连接（6.5）**：Pass 1 用同哈希函数把 $R, S$ 分拆落入磁盘 `B-1` 个小分区桶（读写 `2(|R|+|S|)`）；Pass 2 对每对同名小桶读进内存哈希连接即出（加 `|R|+|S|`）→ 稳定仅 **`3 × (|R| + |S|) = 4,500`** 页！
      - item:
          id: q-bnl-cost-ex2
          type: number
          prompt: "计算综合练习第 (2) 题第一问：已知表 `R = 1,000` 页、表 `S = 500` 页，缓冲池可用槽帧 `B = 102` 帧。以较小表 `S` 作外表执行块嵌套循环连接（BNL，每次取 `B - 2 = 100` 页为一块），总共产生多少次磁盘页 I/O？（填整数）"
          answer: 5500
          explain: "`S` 每块装 `102 - 2 = 100` 页，共分 `ceil(500 / 100) = 5` 块。总 I/O = `500 + 5 × 1000 = 5,500` 页（如果糊涂选大表 `R=1000` 作外表，分 10 块再乘 `S`，虽然算得 `1000 + 10×500 = 6,000`，依然比小表作外表多了 500 次 I/O！）。"
      - card:
          title: 例题：拆算并检验验证脚本里的三组真实数字（大表与小练习对比）
          body: |
            面对 `R = 1000, S = 500, B = 102`（综合练习 2），以及另一组小数据 `R = 60, S = 40, B = 12` 与 `R = 40, S = 25, B = 12`。逐个代入验证到底哪种算法省纸省 I/O：
          reveal:
            - title: 第 1 步：`R=1000, S=500, B=102` —— 为什么“未经合趟优化的 SMJ (`7,500`)”竟还不如 BNL (`5,500`)，合并后才齐平 Grace (`4,500`)？
              body: 算得清清楚楚！朴素 SMJ 因为把 $R$ 和 $S$ 各自彻底外部排序落地写出后再读一遍连接，总花 `5 × (1000 + 500) = 7,500` 页，反倒输给了能一块塞进 100 页的 BNL（`5,500` 页）！可一旦像上节发现的“$R$ 只有 `10` 个顺串、$S$ 才 `5` 个顺串，总顺串 `10 + 5 = 15 <= B - 1 = 101`”，在最后一步**直接对 10+5=15 路排头同时边归并边做等值连接**，立刻省掉 `2 × (1000+500) = 3,000` 次多余读写，把 SMJ 压到 **`4,500` 页**——恰好打平一步到位的 **Grace Hash Join（`3 × 1500 = 4,500`）**！
            - title: 第 2 步：小例 `R=60, S=40, B=12` 与 `R=40, S=25, B=12` 的 BNL 代数检查
              body: 面对 `B = 12`，每块装 `12 - 2 = 10` 页。于是第一组：`40 + ceil(40/10) × 60 = 40 + 4 × 60 = 280` 页 I/O；第二组：`25 + ceil(25/10) × 40 = 25 + 3 × 40 = 145` 页 I/O！完全复用同一条通用公式零出错。
            - title: 第 3 步：如果小表小到连 `B - 2` 都装得下整个表，BNL 直接变成只需读一遍 `|S| + |R|`！
              body: 而且如果之后查询紧接着恰好还要按连接键 `ORDER BY` 排序，SMJ（顺便免费自带排好序输出！）常常在全局计划里力压 Grace Hash Join 胜出（衔接下一章代价模型选择）！
      - item:
          id: q-grace-and-smj-ex2
          type: number
          prompt: "计算综合练习第 (2) 题第二问：同样 `R = 1,000` 页、`S = 500` 页、`B = 102` 帧。执行 **Grace 哈希连接（Grace Hash Join）**（无数据严重倾斜且各分区小桶能装入内存哈希表）一共需要多少次磁盘页 I/O？（填整数）"
          answer: 4500
          explain: "Pass 1（哈希分区落盘）：完整读一遍再写出到桶文件花费 `2 × (1000 + 500) = 3,000` 页；Pass 2（逐桶读入内存哈希匹配输出）：再读一遍花费 `1000 + 500 = 1,500` 页；总计 `3 × (1000 + 500) = 4,500` 页！（而做合并优化的排序归并连接同样是 4,500 页，未做合并优化的朴素排序归并是 `5 × 1500 = 7,500` 页。）"
      - item:
          id: q-join-choice-match
          type: match
          prompt: 把四种物理连接场景与最匹配且 I/O 表现最优的物理连接算法配对（6.1–6.5 节）。
          pairs:
            - ["连接条件是非等值范围条件（如 `R.start < S.end`），无哈希和索引可用", 块嵌套循环连接（BNL，记得拿页数小的当外表）]
            - ["大数据等值连接且外表与内表都不需保留顺序、内存够容最小分区", "Grace 哈希连接（`3 × (|R| + |S|)` 页）"]
            - ["连接后面紧跟着还写了 `ORDER BY` 同一连接键，或两表本身已按该键有序", 排序归并连接（SMJ，无排序费只需扫一遍甚至顺带免费满足后继排序）]
            - ["外表很小能一次性全部装入 `B - 2` 个缓冲帧（内存哈希表直接全容纳）", 单纯内存哈希连接（只需各自顺读一遍 `|S| + |R|`，总计仅 1 趟！）]
          explain: 记死连接选型四句口诀：**能一趟装下走内存哈希，大等值无序走 Grace 哈希，需顺带输出有序走 SMJ，非等值万金油走小表作外表的 BNL！**

  - id: parallel
    chapter: 执行计划
    title: 并行执行模型、查询间与查询内并行及 I/O 并行（8.1–8.6）
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 当现代服务器拥有了 64 个 CPU 核心和 8 块高速 NVMe 固态盘。如果引擎只派 1 个单核工作单元去慢慢扫描十亿行、且全盘文件只挤在单一块磁盘上，再贵的机器也跑不出速度！把多核与多盘榨干的方法，是让“好几个查询一起跑”，还是把“同一个大查询本身拆给 64 个核合力跑”？
          options:
            - text: 两者皆要！同时允许大量短小查询并发跑（**查询间并行**），并且能把单个巨型大查询拆开切分片流让多个核心合力跑完（**查询内并行**），同时把表分散条带跨多块盘读取（**I/O 并行**）！
              correct: true
            - text: 必须二选一，多核处理器同一时刻绝对不能在数据库里同时服务超过一个用户
              why: 现代并行数据库把系统多核心、多内存通道和多块独立硬盘全调动起来同时服务成百上千短请求和大型分析查询
            - text: 所谓并行和分布式数据库指的完全是一回事
              why: 并行数据库主要运行在高速互联的单机多核/紧耦合共享同一控制域内（8.2 节），而跨机房网络、容忍部分节点独立宕机分区的**分布式数据库**将在下一站 `D.1.3` 专讲！
          explain: 第 8 章对比了单机并行架构与分布式边界（8.1–8.2），并讲透工作体系模型、查询间/查询内并行以及存储 I/O 并行（8.3–8.6 节）。
      - card:
          title: 体系结构模式与“并行 vs 分布式”边界（8.1–8.3）
          body: |
            - **并行 vs 分布式（8.2）**：**并行**指单机/紧耦合多核高速协同；**分布式**节点通过普通网络独立，需正面解决单机崩溃与网络分区（`D.1.3` 专讲）。
            - **工作体系模型（8.3）**：可为每条连接开独立执行单元，但现代系统更常用**受控复用工作池（Worker Pool）**省下海量任务切换和内存开销。
      - card:
          title: 查询间、查询内（水平/垂直）与 I/O 并行（8.4–8.6）
          body: |
            榨干多核靠三条路径：
            - **查询间并行（8.4）**：不同请求并发执行提总吞吐（靠第 1 章隔离保护）；
            - **查询内并行（8.5）**：单个巨型查询靠 `Exchange` 算子切多片同时扫算（水平）与算子流水线（垂直）；
            - **I/O 并行（8.6）**：把大表跨多块物理磁盘条带切分并发读取，突破单盘上限！
      - item:
          id: q-parallel-types-match
          type: match
          prompt: 把并行查询执行中的四项核心技术（8.2–8.6 节）与各自重点提升的系统维度配对。
          pairs:
            - ["**查询间并行（Inter-Query）**", 同时允许 500 个不同客户端运行各自独立的下单或查询，提升总并发吞吐量]
            - ["**算子内水平并行 + `Exchange` 算子**", 把单一巨型查询数据切成 16 个分区片段交给 16 个核心同时扫算，缩短单次超大查询响应延迟]
            - ["**统一受控工作池模型（Worker Pool）**", 提前维持有限固定大小工作执行池并队列派活，防止来一万条短连接把内存与任务切换拖死]
            - ["**I/O 并行（多盘条带与分区表空间）**", 把一张巨大表拆分散放到多块物理盘并发读取，消除所有算力一起干等一块慢磁盘的瓶颈]
          explain: 哪怕你在 CPU 上开了 64 个工人，如果表全挤在同一块老硬盘上排队读取，同样卡在磁盘单行道上——**算力并行与 I/O 带宽并行必须成对配合**！
      - card:
          title: 例题：执行计划里的 `Exchange`（数据重分布交换）算子到底在干什么？（8.5 节）
          body: |
            在并行数据库的 **执行计划** 树里，常常能看见一个叫 `Exchange` 的特殊节点。它不查数据也不算总数，为什么能无痛让原本单路的扫描和哈希连接自动变成 8 核并行？
          reveal:
            - title: 第 1 步：把原先写死给单核跑的算子封装隔离在 `Exchange` 两头
              body: 面对 `SELECT dept, COUNT(*) FROM emp GROUP BY dept`：底下 8 个工人各自并行扫描手里分到的那 `1/8` 块员工表磁盘片，紧接着底层 `Exchange` 按照 `hash(dept) % 8` 把同一部门的所有行精准发往指定负责那个部门的汇总工人邮箱！
            - title: 第 2 步：各汇总工人毫无锁冲突地算完各自部门总数，最后再由顶层 `Exchange(Gather)` 合回一份表
              body: 因为按 `hash(dept)` 完成了精准分片派发，每位上层汇总工人手里拿到的是若干部门的 **完整全量记录**、绝不会跟旁边核撞到同一个部门名上！无需任何全局大锁就瞬间完成 8 倍速并发聚合，最后仅需把各部分算完的少许汇总结果收拢交还客户端！
            - title: 第 3 步：注意警惕数据严重“倾斜（Skew）”拖垮整条并行线
              body: 如果某个“神秘超大默认部门”占了全公司 95% 的员工，靠简单 `hash(dept)` 分发会导致 7 个工人干等 0.1 秒收工发呆，唯独 1 个倒霉工人默默一个人算那 95% 慢十倍！工程上遇到倾斜还要做动态负载均衡或加随机盐两阶段聚合打散！
      - item:
          id: q-inter-vs-intra-parallel
          type: choice
          prompt: 一家在线商城在日常高峰有上千个只查 1 个订单号的高频微小事务同时涌入，而同时凌晨需要用 10 分钟跑完 1 份涵盖全年的十亿行财务对账大查询。这两类负载分别重点依赖什么并行优化？
          options:
            - text: 高频微小事务主要依靠**查询间并行**（多请求同时并跑配合受控工作池与高并发 MVCC/锁）拉高总吞吐；而十亿行单条巨型大报表则靠**查询内并行**（多核切分片合力加速）压低单条查询延时
              correct: true
            - text: 两者正好反过来：微小单行点查必须切分成 64 核互相协调来查那 1 行，大报表必须单核排队慢慢读
              why: 一条 1 毫秒查完 1 行的点查本身比在多核心之间通信汇总还要快得多，强行切碎给 64 个核协调反而慢几十倍！
            - text: 只要单机 CPU 核数超过 4 个就自动成了分布式数据库，不需任何并行执行计划改动
              why: 协调单条查询拆片用多核仍需执行计划里显式插入分区算子与 `Exchange` 汇聚
          explain: “小快多”用查询间并行（省协调开销、控工作池）；“单条超大慢”用查询内水平/流水并行（劈开吃干多核与多盘带宽）！
      - item:
          id: q-parallel-vs-distributed-boundary
          type: choice
          prompt: 依据 CMU 15-445 第 15 讲（8.2 节）对“并行数据库（Parallel DBMS）”与“分布式数据库（Distributed DBMS）”的划分界线，下面哪项特征专属于**分布式数据库**面临的核心新挑战（即下一站 `D.1.3` 主题）？
          options:
            - text: 节点之间通过普通不可靠网络相连并分布在各自独立故障域中，必须显式解决单节点半路宕机、网络分区切裂、数据跨机复制一致性与两阶段原子提交等问题
              correct: true
            - text: 单台物理主板上插着 2 个以上的 CPU 芯片算并行计算就叫分布式数据库
              why: 同一机箱紧耦合共内存或同机架高速互联共享控制面通称为**并行系统**，还远不涉及广域网分区故障语义
            - text: 支持写 `SELECT * FROM Student` 就算分布式数据库
              why: 单机数据库与分布式数据库表面都支持标准 SQL，根本边界在于底层多节点存储、网络故障与协调协议模型
          explain: 到这里，单机执行与多核并行的最后一环也已合拢——下面看优化器怎么从几十万种等价计划里算出花 I/O 最少的那棵好树！

  # ======================================================================== 代价模型
  - id: rewrite
    chapter: 代价模型
    title: 逻辑查询优化：关系代数等价改写、谓词下推与子查询去关联（9.1–9.4, 9.13–9.14）
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 业务工程师随手写了一条包含多张百万行大表和 `SELECT *` 的多层嵌套查询，心里嘀咕：“是不是要把我这 SQL 写成极其怪异的反人类语法数据库才跑得快？”其实只要你先搞懂关系代数的等价变形律，哪怕原 SQL 写得再直白，现代 **查询优化器（Query Optimizer）** 第一步也会悄无声息帮你做哪件事（综合练习 3 第二问）？
          options:
            - text: 在完全不改变最终结果集合的前提下做**逻辑等价改写**（启发式规则优化）：把能过滤掉大批无用行的选择（`WHERE`）与投影剪列尽早**下推**到连接最下方执行，砍掉多余列与庞大中间表！
              correct: true
            - text: 优化器直接把你的 `WHERE` 过滤条件全部删光假装所有行都合格
              why: 任何优化的不可动摇底线是**语义 100% 严格等价**——改写前后的结果集必须一模一样
            - text: SQL 必须写得像机器底层命令一样顺序执行，优化器绝对不敢调换连接和过滤的次序
              why: 正如关系代数的封闭与可交换/结合性质，优化器拥有完全合法权利自由重排等价算子树以节省百倍内存与 I/O！
          explain: 优化器分两段发力：先做**基于规则的逻辑改写**把明显笨重结构先瘦身（本课），再靠**基于代价与统计信息的物理搜索**选定具体索引和连接（后两课）（9.1–9.5、9.13–9.14 节）。
      - card:
          title: 查询优化两段流水：启发式逻辑改写（Rule-Based） vs 代价寻优（Cost-Based）（9.1–9.5）
          body: |
            当一条 SQL 经过解析变成抽象语法树后，优化器先套用一套几乎总是稳赚不赔的**启发式逻辑重写规则（Logical Optimization，9.2–9.4）**，无需看表格多少行就能立竿见影瘦身：
            - **选择下推（Predicate Pushdown）**：只要 `WHERE c.title = 'Databases'` 只依赖 `Course` 一张表，就把过滤条件**推到连接 `⋈` 之前**率先把千门课滤成 1 门！
            - **投影下推（Projection Pushdown）**：提前扔掉后续父节点既不展示也不参与连接/过滤的大字段（如商品几 KB 长的富文本描述），让中间临时表与排序缓冲体积缩小十倍！
      - card:
          title: 表达式化简（9.14）与嵌套子查询去关联（Unnesting，9.13）
          body: |
            还有两条极猛的代数逻辑重写（9.13–9.14 节）：
            - **常量折叠与矛盾消除（9.14）**：写 `WHERE 1 = 0 AND ...` 或 `WHERE age > 30 AND age > 50` 时，直接折叠消成空集短路或单条更紧条件 `age > 50`（合并 `1+2` 为 `3`），避免跑一遍全表后才发现恒假；
            - **嵌套子查询去关联化（9.13）**：把每来 1 行外层记录就傻傻重复跑一遍的嵌套 `WHERE EXISTS (...)` 相关子查询，改写成高效的普通半连接（Semi-Join）或哈希连接一次性成批跑完！
      - item:
          id: q-pushdown-ex3
          type: choice
          prompt: 针对综合练习第 (3) 题第二问：为什么查询优化器在执行多表连接和排序之前，总是尽可能先把 **`WHERE` 选择条件** 和 **`SELECT` 所需列裁剪（投影）** **下推**到靠近叶子扫表的地方率先执行？
          options:
            - text: 尽早过滤掉大量无关行并丢弃不用的多余宽列，能把后续极其昂贵的连接、排序或网络传输需要处理的中间元组数量与每行字节体积同时大幅缩小几个数量级
              correct: true
            - text: 因为把过滤条件放上面会导致最后返回给用户的结果变成空白
              why: 只要下推只针对那张局部表的可用条件且保持后续所需连接/筛选列，逻辑结果 100% 等价不变，差距纯在少算几百万次无用配对和少搬几十 GB 临时数据！
            - text: 因为数据库规定连接算子本身绝对看不懂任何带字段名的输出元组
              why: 连接算子当然能看清完整行，只是没必要把十个既不用显示又不用连接的冗余长文本字段一直背过连接和外存排序！
          explain: 一句话背下启发式优化第一原则：**“越早淘汰无用行（选择下推）、越早丢弃无用列（投影下推），上层连接排序就越轻快！”**
      - card:
          title: 例题：手写对比改写前后的两棵算子树——体会什么叫“降维打击式”逻辑瘦身！
          body: |
            假设 `orders` 有 `1,000 万` 行（每行 12 列共 `800` 字节含长备注文本），`users` 有 `100 万` 行。执行 `SELECT u.name, o.total FROM users u JOIN orders o ON u.uid = o.uid WHERE o.status = 'refunded' AND u.country = 'SG'`。对比改写前后开销：
          reveal:
            - title: 第 1 步：傻傻按直觉从下往上看——千万行全列硬对百万行全列再滤！
              body: 如果老老实实先把 `1000万 × 800B` 的全量宽订单跟 `100万` 全量宽用户做完整连接，所有无辜订单的备注长文本都要被搬进哈希表/连接算子折腾一番，内存和磁盘瞬间爆掉，连接完 99.9% 的行才被最顶上的 `WHERE` 和只取两列扔掉！
            - title: 第 2 步：下推 `status='refunded'`、下推 `country='SG'`，外加只留 `(uid, name)` 和 `(uid, total)`！
              body: 优化器瞬间完成三项重整：① 在扫 `orders` 时就立刻用 `status='refunded'` 把千万行裁成比如 `2 万` 退款行，并且只保留 `uid, total` 仅 `16` 字节（体积缩 50 倍！）；② 在扫 `users` 时提前滤成少量 `'SG'` 用户只留 `uid, name`；③ 最后把两张瘦成闪电的小结果轻巧一连直接出结果——语义一分没变，耗时天壤之别！
            - title: 第 3 步：连“外连接把右表放 `WHERE` 错写”也能被等价消除规则认出！
              body: 还记得 D.1.1 讲的 `LEFT JOIN ... WHERE right.col = 'X'` 会暗中变成普通内连接吗？优化器同样靠逻辑重写一眼识破，将外连接降回可自由调换左右表顺序的普通 `INNER JOIN` 以解锁更优连接路径！
      - item:
          id: q-subquery-decorrelation
          type: choice
          prompt: 一位开发写了一条相关子查询：`SELECT e.name FROM emp e WHERE e.sal > (SELECT AVG(e2.sal) FROM emp e2 WHERE e2.dept = e.dept);`。如果执行器天真地每扫 `1` 个员工就重扫全表算一次该部门平均薪资，十万员工就要扫百亿行！成熟优化器怎么通过 **逻辑等价改写**（9.13 节）化解？
          options:
            - text: 将嵌套相关子查询**去关联化（Decorrelation / Unnesting）**：改写为先按 `dept` 分组一次性全表算好一张 `(dept, avg_sal)` 小临时汇总表，再跟 `emp` 按部门号高效连接比大小即可！
              correct: true
            - text: 直接随机删掉全公司一半员工使平均分加快完成
              why: 优化器严禁改变任何最终语义输出，去关联改写能用单次扫描聚合 + 一次普通连接给出 100% 精确一致的结果
            - text: 只能告诉用户 SQL 禁止在 `WHERE` 里写嵌套子查询
              why: 正因为 SQL 是“只描述我要什么、不管具体怎么跑”的声明式语言，才由优化器默默担起将笨拙嵌套写法翻成高效连接的重任
          explain: 哪怕你在 D.1.1 里写的是逻辑上很直白的 `EXISTS` 相关子查询，好引擎在背后也会把它悄悄展平重写成快速半连接（Semi-Join）！
      - card:
          title: 例题：为什么启发式改写遇到“大概率为真、甚至完全不值得下推”的谓词也会谨慎？
          body: |
            是不是所有能拆开的东西无脑往最底下推永远稳赚？看以下两个微妙例子（9.4 与 9.14 节边界）：
          reveal:
            - title: 第 1 步：把昂贵的正则或自定义大函数错下推到毫无索引的亿行全表前反而变慢
              body: 如果 `WHERE u.vip = 1 AND slow_regex(u.bio) = 1`，应该先用索引极快把百万用户筛成 `500` 名 VIP，最后才拿那短短 500 人去跑极慢的正则匹配！如果胡乱调换先全表跑百万次正则，CPU 瞬间拉满。
            - title: 第 2 步：注意带副作用或不满足 `NULL` 安全性的表达式不能胡乱消除
              body: 像 `WHERE x = 0 OR 1 / x > 0`（利用短路防除以零报错），或者含随机数的表达式，一旦乱调换顺序就会改写语义甚至触发本来被短路躲开的除零异常！因此优化器每套一条改写规则都必须先核实表达式纯洁性与等价前提。
      - item:
          id: q-rule-rewrite-match
          type: match
          prompt: 把四种常见的 **逻辑查询改写（Rule-Based Optimization）** 手法与它们各自立刻带来的结构收益匹配。
          pairs:
            - [选择谓词下推（Predicate Pushdown）, 尽早筛选剔除不符合条件的大批行，缩减随后连接与排序输入规模]
            - [投影列裁剪下推（Projection Pushdown）, 尽早丢掉既不上屏展示也不参与连接筛选的宽列，减小内存与缓冲页拷贝体积]
            - [常量折叠与矛盾消除（Constant Folding / Simplification）, 合并化简 `1+2`、`x > 5 AND x > 10 → x > 10`，直接短路跳过恒假 `1 = 0` 空分支]
            - [相关子查询去关联（Subquery Unnesting）, 把原本对外表每一行都要嵌套循环重查的子查询，展平重构为单次聚合加常规高效连接]
          explain: 搞定无需读统计数据的逻辑改写后，紧接着就面临真正最难也最精彩的算术：**走索引到底快不快，全靠选择率估计和代价算账！**

  - id: selectivity
    chapter: 代价模型
    title: 选择率估计、直方图统计与“索引扫描 vs 全表扫描”抉择（综合练习 3）
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 优化器面对一条 SQL：`SELECT * FROM orders WHERE status = 'refunded'`（表占 `100,000` 页、含 1000 万行）。`status` 列上明明已经辛辛苦苦建了一棵 **非聚簇 B+ 树索引**，难道有索引就**百分之百**闭眼走索引吗？假设退货 `'refunded'` 只占全表的 **`0.01%`**（1,000 行） vs 如果有 90% 的订单都是已完成 `'paid'`（900 万行）——优化器该怎么挑？
          options:
            - text: 绝不拍脑袋死定一个僵硬百分比阈值！而是用 **统计信息估计选择率**：只中 1,000 行时，走非聚簇索引加回表最多随机跳几千页远少于 100,000 页，坚决走**索引扫描**；一旦命中上百万行导致随机回表跳页成本算下来超越顺序全表 `100,000` 页，就果断改走**全表顺序扫描**！
              correct: true
            - text: 只要表上存在索引，哪怕要返回全表 `99.9%` 的行，走索引回表也一定比顺序扫快十倍
              why: 非聚簇索引命中 990 万行意味着每查 1 条就得拿着行地址往主表里东跳西蹦做百万次随机离散读（同一主表页还会被重复乱跳百次！），慢出顺序全扫几十倍！
            - text: 有索引时只需要读 1 页就能凭空猜完 900 万条订单的所有详情
              why: 若查询写着 `SELECT *` 需要非索引列内容，非聚簇索引必须根据命中数目老老实实逐条去数据页取完整行（除非改用“覆盖索引”把需要的列全包含在索引叶内）
          explain: 这正是 **代价模型（Cost Model）与选择率估计（Selectivity Estimation）** 要算清的核心问题（7.3、9.5–9.6、9.8、10.2–10.3 节 & 综合练习 3）。
      - card:
          title: 什么是选择率与直方图统计信息（9.6、10.2–10.3）
          body: |
            优化器怎么在还没真运行查询之前，就提前猜准 `WHERE status = 'refunded'` 会冒出几行（**选择率 = 命中行数 ÷ 总行数**）？全靠后台定期采集保存的数据统计信息：
            - `N_rows`（总行数）、`N_distinct(col)`（唯一值个数，如一共 4 种状态）：若假设均匀分布，`= 'refunded'` 选择率约 **`1 / 4`**；
            - **实际常数据极度倾斜**（95% 是 `'paid'`，只有 0.1% 是 `'refunded'`！）：于是优化器维护 **直方图（Histograms，等宽或等深）** 和 **高频值清单（MCV）**，精确记录高频与长尾真实分布，防止均匀假设把成本算歪！
      - card:
          title: 索引扫描 vs 全表扫描与“覆盖索引”（2.4 opt、7.3、9.8）
          body: |
            优化器靠 **I/O + CPU 代价模型** 精确权衡（**放弃死板固定经验百分比**）：
            - **全表顺序扫描**：连续顺读总数据页（顺读吞吐极高）；
            - **非聚簇索引 + 回表**：定位索引叶后按地址随机跳主表页取全行——若命中稍多、几乎每页都被随机戳中，极易输给顺序扫！
            - **覆盖索引（Index-Only，9.8）**：若索引本身含 `SELECT` 和 `WHERE` 全列，直接出答案 **0 回表**！
      - item:
          id: q-index-vs-seqscan-ex3
          type: choice
          prompt: '接上面例子与综合练习第 (3) 题：`orders` 共 `100` 万行、分占 `10,000` 个数据页（每页约 `100` 行），`status` 上建有普通**非聚簇索引**。执行 `SELECT * FROM orders WHERE status = ...` 时，为什么仅仅靠死记一个“小于某个固定经验百分比就用索引”并不严谨，真正在代价模型里决定取舍的是什么？'
          options:
            - text: 真正决定胜负的是“预估**命中行数 × 离散回表随机页 I/O 开销 + 索引叶遍历代价**”对比“**全表顺序读 10,000 页（含顺序 I/O 低单页耗时加成）**”的总代价：还要考虑是否聚簇、记录分布聚集度以及是否命中**覆盖索引**免回表！
              correct: true
            - text: 因为如果某个字段名叫 `'refunded'` 字母超过 5 个，数据库规定一律禁用索引
              why: 字符串字母长短与走不走索引无关，关键在满足该条件的选择率是否低到让非聚簇回表随机跳页总量（和开销）明显少于全表顺读
            - text: 因为非聚簇索引只能用来数总行数，绝对读不出 `WHERE status = 'refunded'` 对应的任何记录
              why: 只要选出来的稀有记录占比极低（比如上万行里仅几十行），非聚簇索引加上少量回表只用读写区区几十页，远胜于顺扫全表一万页！
          explain: 试着算笔小账就知道多惊人：每页 100 行，哪怕随机挑出仅 **2%** 的行分散在各地——平均每页就会撞中 2 行，几乎 **86%+ 的全部数据页全得被随机戳一遍**，总代价反而惨败给干净利落的全表顺序扫描！
      - card:
          title: 例题：同样搜 `WHERE status = 'refunded'`，`SELECT *` vs `SELECT oid` 怎么走，直方图与组合谓词又怎么算？
          body: |
            把综合练习第 (3) 题和 10.2–10.3 节统计估算规则放在同一个实例里过三关（对应验证 `D.1.2.verify` SQLite 实测计划）：
          reveal:
            - title: 第 1 步：稀疏命中时 SQLite 立即从 `SCAN orders` 切去 `SEARCH orders USING INDEX orders_status`
              body: 如验证脚本在测试表里插了 4 行（仅 1 行 `'refunded'`），在未建 `orders_status` 索引时优化器无奈报 `SCAN orders` 全表扫描；一加上 `CREATE INDEX orders_status ON orders(status)`，执行计划即刻变为 `SEARCH orders USING INDEX orders_status` 精确直取 `[(2, 'refunded', 30)]`！而当 `'refunded'` 分布稀少且主表百万页时，差距可达数千倍！
            - title: 第 2 步：若只查 `SELECT status` 或建了联合索引 `(status, oid, amount)`，直接升级“仅索引扫描”免回表！
              body: 面对高频大命中查询，如果建上包含全部读取列的**覆盖索引**（或把热点前缀聚簇排列），不仅彻底砍掉几万次随机回表跳转，顺着有序紧密排列的索引叶子连续扫描甚至比读笨重全宽主表还省 5 倍页数！
            - title: 第 3 步：独立假设算多条件交集与 MCV 直方图救偏斜（10.2–10.3 节）
              body: 假设 `P(A) = 0.1` 且 `P(B) = 0.2`，若缺乏联合统计信息，优化器常按条件独立相乘估计 `P(A AND B) ≈ 0.1 × 0.2 = 0.02`；同时靠 **高频值清单（MCV）+ 等深直方图** 精准记清 `'paid'` 占 `95%` 而 `'refunded'` 只占 `0.1%` 这种高度倾斜事实，绝不会拿平均数错估把高频词错派去走回表！
      - item:
          id: q-covering-index-win
          type: choice
          prompt: 某业务最频繁的一条大查询是 `SELECT oid, total FROM orders WHERE status = 'paid'`，恰巧 `'paid'` 订单占到了全表的 `60%`，使得原本只建在 `(status)` 上的普通非聚簇索引因回表代价太高被迫退回全表扫描。在不改 SQL、不改变聚簇主表的前提下，工程师新建了一个联合索引 `CREATE INDEX idx_cover ON orders(status, oid, total)` 后性能忽然猛增好几倍！为什么？
          options:
            - text: 建成了**覆盖索引（Covering / Index-Only Scan）**：查询所需的过滤列与输出列全部已经直接躺在轻薄窄小的二级索引叶子里，引擎顺着连续有序索引叶扫完 `'paid'` 切片即可交卷，**完全省掉了几十万次跳回宽主表抓整行的随机回表**！
              correct: true
            - text: 因为加上两个列名以后，`paid` 在表里的比例被强制删成 `0.01%`
              why: 真实数据一行未少（还是那 60% 订单！），加速全靠 **免去回表随机 I/O** 与 **索引行比包含几十列的原始主表行更瘦、连续页更少**！
            - text: 因为联立三列以后这个索引会自动变成纯哈希散列表
              why: 这仍然是一棵以左前缀 `status` 有序排列的 B+ 树索引，只是每个叶项顺手附带了 `oid` 和 `total` 避免二次回跳
          explain: 高频热点接口想突破索引瓶颈时，第一时间检查一下 **“是不是因为要拿其他列被迫回表了，能否补成覆盖索引免回表？”**！
      - item:
          id: q-histogram-skew
          type: choice
          prompt: 某电商 `orders` 表一共有 `100` 万行，其中 `status` 有 4 种取值，但数据极度不均：`paid` 占 98 万行、`refunded` 仅 1 千行、另两种共 1.9 万行。如果数据库引擎**没建直方图或高频值统计**，天真采用“4 种状态均匀各占 `1 / 4 = 25%`”来估计选择率，会酿成什么错误决策？
          options:
            - text: 查极稀有的 `status = 'refunded'`（其实才 0.1%）会被误高估成 `25%` 而错选笨重全表扫描；查满大街都是的 `'paid'`（其实 98%）也会被错低估成 25%，如果阈值偏向导致错走大量随机回表就慢如蜗牛！
              correct: true
            - text: 均匀假设会自动把 `orders` 里的 98 万笔已完成订单平均删成 25 万笔
              why: 优化器估算失误从不更改真数据行，只会选错慢十倍百倍的物理执行计划！
            - text: 直方图需要把全表每一行抄写一模一样复制两遍进磁盘
              why: 等深直方图和高频值清单（MCV）通常仅占区区几千字节、定期抽样更新即可极其精准地刻画倾斜分布
          explain: 懂了直方图与统计信息（`ANALYZE` 命令就是干这个的！），以后线上遇到慢 SQL 你立刻知道先看是不是**统计信息过期**让优化器估算歪了执行计划！
      - item:
          id: q-independent-selectivity-math
          type: number
          prompt: "某千万行大表同时带有两个筛选条件 `WHERE region = 'east' AND vip = 1`。从单列直方图分别查知：满足 `region = 'east'` 的选择率为 `0.2`（20%），满足 `vip = 1` 的选择率为 `0.05`（5%）。若优化器采用标准“列相互独立近似假设”估算组合选择率 `P(region='east' AND vip=1)`，估算出来大约占全表多少百分比？（填入百分号前面的数字，如 `2.5` 表示 2.5%）"
          answer: 1
          explain: "在独立假设下两个 `AND` 谓词联合选择率相乘：`0.2 × 0.05 = 0.01 = 1%`！（即如果总共 100 万行，估算大约命中 1 万行。当然现实里有些列高度强相关比如“国家='中国' AND 城市='北京'”，这时简单独立相乘就会低估行数，工业界还会补上多列组合统计。）"

  - id: plans
    chapter: 代价模型
    title: 多表连接顺序寻优、System R 自底向上 vs Volcano 自顶向下搜索（9.7, 9.9–9.12, 10.1）
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 如果一条复杂查询同时连接 `8` 张大表，光是换不同连接前后配对顺序加不同连接括号（左深树、稠密树），再乘上每一步挑 BNL、SMJ 还是 Grace Hash、扫表用全扫还是索引扫——候选物理 **执行计划** 的总组合数量早就轻松突破几百万种！优化器既不能真正全跑一遍再挑最快的，也不可能真把一百万棵树全都毫无遗漏地枚举算完！它怎么在几毫秒之内搜出一棵几乎最优的计划？
          options:
            - text: 靠**动态规划剪枝**掉明显较差的等价子树（或把搜索空间收窄为左深连接树），搭配自底向上（System R）或按需记忆化分支定界剪枝的自顶向下（Volcano/Cascades）搜索，并在设定的预算门限终止搜索！
              correct: true
            - text: 优化器直接按用户 `FROM` 列表写的表顺序从左往右盲连到底，从不做任何连接重排
              why: 谁先连谁、是先挑小结果集过滤后连接还是先把两个亿级大表硬撞一起，性能差异往往上万倍！连接重排（Join Ordering）正是代价优化器最值钱的核心价值
            - text: 只能先把所有一百万种候选计划全部真的从头运行到底比对谁最慢，最后选出跑最快那次结果再跑一遍给用户
              why: 真把最烂的一百万种计划跑一遍服务器早崩半年了，优化器全靠基于统计代价估算公式在毫秒间算出优胜树再正式启动唯一入选树！
          explain: 本章收官课带你看清两大工业界搜寻框架：**System R（自底向上动态规划）** 与 **Volcano / Cascades（自顶向下带记忆剪枝）**（9.7、9.9–9.12、10.1 节）。
      - card:
          title: 单表方案、有趣序与 System R 自底向上动态规划（9.9–9.11）
          body: |
            **System R**（9.11）为控住组合数，把搜索限定在右表为单基础表的 **左深连接树**：
            1. 先选每张单表最优路径（全扫 vs 索引，9.9）；
            2. 再逐层从 2 表动态规划扩至 `k` 表：同集合仅留最小代价树——唯独保留能免费省去后续排序费的 **“有趣序（Interesting Orders）”**！
      - card:
          title: Volcano / Cascades 自顶向下搜索与搜索终止边界（9.7、9.12、10.1）
          body: |
            现代优化器常选用 **Volcano / Cascades**（自顶向下，9.12）：从目标逻辑表达出发按规则展开存进记忆表 Memo，并靠已知最佳总代价上限**分支定界剪枝**（超标直接整支砍掉）。面对十余张表连接，务必设优化预算门限**及时终止（9.7）**，绝不让想方案比真正跑查询还慢！
      - item:
          id: q-interesting-order-why
          type: choice
          prompt: 在 **System R 自底向上动态规划** 选择两张表连接方案时，算法通常会狠心把同集合下代价较高的差计划当场丢弃，但唯独会把一个表面上局部略贵一丁点、却具备所谓 **“有趣序（Interesting Order）”** 的计划额外保留下来！这“有趣序”真正帮了后续哪一步的大忙？
          options:
            - text: 若后续紧跟着还要对这个字段做排序归并连接（SMJ）、`GROUP BY` 分组聚合或顶层 `ORDER BY`，前面留着的有序输出可以直接被后继算子免费白嫖复用，从而省去一笔远超刚才那丁点差价的巨额外部排序开销！
              correct: true
            - text: 所谓有趣序就是把表的列名按幽默搞笑程度从高到低排一排
              why: “Interesting Order” 是数据库优化器专有术语，专指“物理上已经按某列排好序，恰好匹配后面查询里 `JOIN / GROUP BY / DISTINCT / ORDER BY` 用到的目标排序列”
            - text: 因为动态规划算法在保留任何有顺序的结果之后就彻底禁止做连接了
              why: 留着它恰恰是为了给上面紧挨着的连接或分组聚合提供免排序直通车，全局算下来总价反而最低！
          explain: 如果只贪心看当前第 1 步最便宜就砍掉后续有用有序流，全局反倒得多跑一趟耗时耗磁盘的外存归并排序——“有趣序”就是动态规划里防止短视局部贪心的绝妙维！
      - card:
          title: 例题：比较“Left-Deep 左深树”、“Bushy 稠密树”与 System R vs Volcano 各自特长（9.10–9.12, 10.1）
          body: |
            当连接表达到 `4` 张表 `A ⋈ B ⋈ C ⋈ D` 时，优化器怎么决定搜索树形状、怎么选框架、什么时候及时踩刹车停手（9.7、9.10–9.12）？
          reveal:
            - title: 第 1 步：Left-Deep（左深树）把中间流水线右手锁死在单表，大幅砍小搜索树个数
              body: 像 `(((A ⋈ B) ⋈ C) ⋈ D)` 这样永远把左边中间产物继续连接右边一张原装基础表叫 **左深树**——右端基础表可直接开单索引探针嵌套或构建哈希流水线，且只用把 $n$ 张表按顺序排，比允许任意 `(A⋈B) ⋈ (C⋈D)` 对称交叉组合的**稠密树（Bushy Tree）**搜索空间小几个数量级！当然在多机并行时代（10.1），适当允许关键大子树独立并算成 Bushy 树也能把两个分支拆给不同多核一起跑。
            - title: 第 2 步：System R 像填表、Volcano/Cascades 像带备忘录和代价边界剪枝的聪明树搜索
              body: System R 把逻辑规则写死在几个硬编码流程里从底往上按连接张数枚举算，容易写却很难轻松塞进上百条花式扩展等价规则；Volcano/Cascades 将逻辑规则与物理实施（如把“逻辑连接”转成“物理 Grace Hash Join”并顺便按要求索取输入物理排序性质 Enforcer）统一成规则库，自上而下展开并用 Memo 表免除同一子问题重复算两遍！
            - title: 第 3 步：搜索终止条件（9.7）防止“思考计划花了 5 秒，跑查其实只需 0.1 秒”
              body: 面对几十张关联表的巨型查询，绝对不能无休止搜到全组合算尽——设好耗时配额上限、代价达标早停线或达到固定步数即刻收手并吐出当前 Memo 里的全局最优计划，这才是工程上稳健的工业优化器！
      - item:
          id: q-systemr-vs-volcano-match
          type: match
          prompt: 把查询优化搜寻框架中的四个核心机制（9.7、9.10–9.12 节）与它们的精准工程含义配对。
          pairs:
            - ["**System R（自底向上动态规划）**", 先算各单表访问策略再逐层按表数拼出左深连接树，靠保留“有趣序”防局部短视]
            - ["**Volcano / Cascades（自顶向下搜索）**", 从总目标向下按等价规则展开至 Memo 记忆结构，用“已算最优总代价上限”早剪掉超支分支]
            - ["**Left-Deep 左深连接树**", 右侧输入永远保持单张基础表而非另一棵大中间树，大幅缩减排列组合数并利于单道流式执行]
            - ["**优化搜索终止门限（9.7）**", 避免优化器规划耗时反超真正运行查询，在成本满意、时间配额满或规则变换完毕时及时交出当前最棒计划]
          explain: 至此你已经走完从 `SQL 文本 → 关系代数树 → 逻辑等价瘦身 → 统计直方图选路 → 搜索寻优 → 并行算子执行 → 缓冲/日志/MVCC并发落地` 整个现代数据库引擎全貌！
      - item:
          id: q-search-termination-why
          type: choice
          prompt: 现代数据库（尤其是连接了十几张表的复杂商业报表 SQL）里，优化器为什么必须设置明确的 **搜索终止条件（Search Termination，9.7 节）**，而不是非得穷尽整个地球全部可能连接树组合才准开工？
          options:
            - text: 多表连接的合法物理组合数随表数量呈组合乘法级指数爆炸，若不设耗时配额或足够好阈值及时止步，光是寻找最佳计划就能白白卡死几十秒——“用 20 毫秒选出前 1% 顶尖好方案”远胜于“花 30 秒只为抠掉那最后 0.5 毫秒”
              correct: true
            - text: 因为优化器内存限制每次最多只允许看清 2 张表的存在
              why: 现代优化器能轻松处理十余甚至几十张表连接，靠启发式早剪枝与预算终止把极高复杂搜索平稳压在毫秒内
            - text: 因为搜索停下来以后系统会放弃执行整条用户 SQL 直接报 500
              why: 一旦达到搜索预算门限停止继续探索新变换，优化器立刻把截至该瞬间已经找到、且经过严格正确性校验的目前最优执行计划交付执行器开跑！
          explain: 整个数据库引擎工程处处渗透着这同一条实用哲学：**既要数学严密不出错（可串行化、ARIES、等价改写），也要懂得靠代价估界、采样与时间预算做到最快总体端到端响应！**
      - item:
          id: q-left-deep-vs-bushy
          type: choice
          prompt: 经典 IBM **System R** 优化器为什么在搜索多表连接顺序时故意只探索 **左深连接树（Left-Deep Trees）**（右端永远是一张单基础表），而不去穷举允许两侧都是巨大中间连接结果的稠密树（Bushy Trees）？
          options:
            - text: 右端固定为单基础表不仅把 $n$ 表连接的搜索空间从卡特兰树形级巨量锐减为可控排列数，而且右端单表能流式配合左侧结果做流水线拉取或直接挂单表索引探针，无需把两边海量中间结果全物化进磁盘！
              correct: true
            - text: 因为数据库语法绝对不允许同时连接超过 3 张表
              why: 无论是 System R 还是现代 Cascades，支持几十张表连接毫无压力，限制左深纯为控制搜索爆炸和契合单流水线执行
            - text: 因为左深树只能使用全表扫描，绝对不许碰任何 B+ 树索引
              why: 左深树右端单表恰恰非常适合走索引嵌套循环探针（Index Nested Loop Join）！
          explain: 不过到了多核或分布式并行查询时代，现代优化器也会适度打开 **Bushy 稠密树**，好把左右两个相对独立的大子树分支同时丢给两路多核并算提速！

boss:
  items:
    - id: boss-precedence-cycle
      type: choice
      prompt: 对调度 `R1(A) W1(A) R2(A) W2(A) R2(B) W2(B) R1(B) W1(B)` 画出冲突优先图并用 **Strict 2PL** 执行控制时，下列哪项结论完全精确？
      options:
        - text: 优先图同时包含 `T1 → T2`（因 A）和 `T2 → T1`（因 B）构成双向环，绝非冲突可串行化；在 Strict 2PL 下 `T1` 提交前绝不松开 `X(A)`，因此会阻断 `T2` 插队（交叉先拿各自锁时则引发死锁并由回滚一方重跑安全化解）
          correct: true
        - text: 该调度因为 `A` 和 `B` 互不重叠所以完全合法、没有任何有向环，可放心随便交错并发运行
          why: 正因为 `T1` 和 `T2` 都先后碰了 `A` 和 `B` 两个共同对象且次序颠倒（A 上 T1 在前、B 上 T2 在前），优先图必然形成双向死环！
        - text: Strict 2PL 允许 `T1` 写完 `A` 的下一微秒立刻提前释放 `X(A)` 再去读 `B`
          why: 提前松开排他写锁不仅打破“收缩后不再拿新锁”的两阶段原则，更会当场放出这条成环错调度！
        - text: 只有乐观并发控制（OCC）能处理 A 和 B，2PL 连单表都加不了锁
          why: Strict 2PL 靠持有排他锁至提交，天然就能彻底堵死非冲突可串行化交错调度
      explain: 先靠优先图判环辨是非，再用 Strict 2PL 死守写锁至提交（或 MVCC/OCC）保执行隔离。
    - id: boss-isolation-mvcc-latch
      type: match
      prompt: 把并发控制与索引内部保护中的四项机制与它们各自防住的具体隐患精确对应起来。
      pairs:
        - ["索引范围锁 / 间隙锁（Gap Locks）", 在可串行化并发下锁住键范围空隙，防住另一事务中途 `INSERT` 新行制造 **幻读**]
        - ["**MVCC** 多版本快照 + 后台 **GC（`VACUUM`）**", 让长只读查询读旧历史版本互不阻塞，并及时清掉无人再见的废旧墓碑版防表膨胀]
        - ["**闩锁（Latch）** + 乐观 B+ 树螃蟹协议", 用共享读闩高速穿过上层热节点、微秒级保护 B+ 树页在拆裂期间不被踩烂内存引用]
        - ["**`SELECT ... FOR UPDATE`**（在默认 `READ COMMITTED` 下）", 抢票扣库存前显式对读出的特定余量行挂排他写锁，避免俩并发事务读出同一份余量造成超卖]
      explain: 事务锁管逻辑（Lock/Gap/FOR UPDATE），多版本解读写阻塞（MVCC+GC），闩锁护内存物理树结构（Latch）——三层各司其职！
    - id: boss-aries-recovery-order
      type: order
      prompt: 面对启用 `STEAL + NO-FORCE` 与 WAL 预写日志的数据库意外断电重启，请把 **ARIES** 崩溃恢复及正常运行时写页防线的先后顺序按逻辑因果排好。
      steps:
        - "正常运行写脏页前必保证 `flushedLSN >= pageLSN`（先将包含旧值的 WAL 日志落盘，后才许把未提交脏页写入主数据文件）"
        - "重启启动后先走 **Analysis** 阶段正向扫过检查点之后日志，重构崩溃瞬间的未提交输家名单与脏页列表"
        - "接着走 **Redo** 阶段重演一切历史动作将全库恢复到崩溃最后一毫秒（使已提交修改全就位且幂等跳过新页）"
        - "最后走 **Undo** 阶段倒序抹除所有未提交失败者修改并追加 CLR 补偿日志，彻底保障原子性与再次崩溃幂等安全"
      explain: 记住那组验证状态演变：`{A:10, B:20}` → Redo 结束 `{A:12, B:25}` → Undo 结束 `{A:12, B:20}`！
    - id: boss-bplus-height-math
      type: number
      prompt: '一张表包含 `10,000,000`（一千万）行记录。每页 B+ 树叶节点能存放 `200` 条索引项，每个内部路标节点页的最大分支扇出同样为 `200`。从顶部根节点（第 1 层）一直数到底部叶节点页，这棵 B+ 树一共只有多少层索引高度？（填整数）'
      answer: 4
      explain: '逐层向上整除 200：`10,000,000 / 200 = 50,000` 个叶页 → `ceil(50,000/200) = 250` → `ceil(250/200) = 2` → `1` 个根页。一共 `[50,000, 250, 2, 1]` 仅 **4** 层！（若是聚簇索引直接查叶即得数据共 4 次 I/O，若是非聚簇索引再加 1 次回表取堆行共 5 次 I/O，均远胜全表扫描的 100,000 页！）'
    - id: boss-bnl-io-math
      type: number
      prompt: '计算两表连接的总磁盘页读写 I/O：`R` 占 `1,000` 页，`S` 占 `500` 页，分得可用缓冲池缓冲帧 `B = 102` 帧。若选择较小表 `S` 作为外表执行 **块嵌套循环连接（BNL）**，总共产生多少页磁盘 I/O？（填整数）'
      answer: 5500
      explain: '每次用 `102 - 2 = 100` 帧把 `S` 切分成 `ceil(500 / 100) = 5` 块；每换 1 块完整扫一遍内表 `R`，合计 `500 + 5 × 1000 = 5,500` 页 I/O！（注意若换成 Grace 哈希连接，只需 `3 × (1000 + 500) = 4,500` 页；而朴素未合趟排序归并要 `7,500` 页，做最后顺串合趟边连边归并优化后也可降至 `4,500` 页。）'
    - id: boss-grace-hash-math
      type: number
      prompt: '仍看上题参数：`R = 1,000` 页、`S = 500` 页、`B = 102` 帧（无数据倾斜且各散列桶能装进内存）。改用 **Grace 哈希连接（Grace Hash Join）** 执行等值连接，总共需要多少页磁盘 I/O？（填整数）'
      answer: 4500
      explain: '第一遍分区读写全表 `2 × (1000 + 500) = 3,000` 页；第二遍按对应同号桶顺次读进内存哈希连完输出 `1000 + 500 = 1,500` 页；两遍总计 `3 × (1000 + 500) = 4,500` 页 I/O！'
    - id: boss-special-indexes-exec
      type: match
      prompt: 把专用索引结构与物理查询执行器中的四项工程利器与其核心场景配对。
      pairs:
        - ["**布隆过滤器（Bloom Filter）**", 用极小内存位图保证“说没有就 100% 肯定没这键”，大幅拦下无效磁盘盲查]
        - ["**向量化模型 + `Exchange` 并行算子**", 按上千行小数组批次顺流执行并跨多核心按哈希分片协作汇总，榨干现代分析硬件性能]
        - ["**外部多路归并排序（B 帧限制）**", 先按 B 页产出顺串，再借助 `B-1` 路输入帧与 1 帧输出合并超出内存上限的十亿行大表]
        - ["**倒排索引 & 向量近邻索引**", 分别专门攻克全文多词交集搜文章（防 `LIKE '%..%'` 慢扫）以及高维大模型特征相似检索]
      explain: 索引选型、执行模型与并分片协同发力，才搭得起又省内存又飞快的新一代引擎底座。
    - id: boss-opt-index-vs-scan
      type: choice
      prompt: 面临查询 `SELECT * FROM orders WHERE status = 'refunded'`（`status` 上建有普通**非聚簇索引**），关于优化器在“索引扫描 vs 全表顺序扫描”间的抉择与逻辑改写原则，哪一组全部准确？
      options:
        - text: 优化器借助统计信息与直方图估计选择率（绝不死卡固定经验百分比）：只当估算的“非聚簇定位 + 随机回表页 I/O 代价”明显低于顺序扫全表时才选索引扫描（若补全覆盖索引免回表或数据聚簇有序，适用面大幅拓宽）；同时逻辑优化会把局部选择/投影尽早下推至连接之前
          correct: true
        - text: 只要表上建了任何索引，哪怕查全表 `95%` 的订单，非聚簇索引加随机回表也绝对碾压顺序全表扫
          why: 命中率极高时大量随机分散回表会让同一主表页被翻来覆去踩几十遍，总耗远超顺溜一条线扫完的顺序扫描
        - text: 逻辑优化时必须先把两张千万大表全部列全量连完放到最后一步才做 `WHERE` 过滤和选两列
          why: 必须尽早做谓词下推与投影列下推裁剪，在源头处就把不需要的行与宽字段直接扔掉
        - text: 只要把列建在直方图里，哪怕没有写 `WHERE` 条件也会自动扔掉一半用户数据
          why: 直方图仅作只读统计基数估价，绝不会改写半条结果语义
      explain: 代价公式算清物理 I/O + 直方图抓准数据倾斜 + 下推剪枝瘦身中间表，就是理性选择最棒计划的全部依据！
    - id: boss-systemr-interesting-order
      type: choice
      prompt: 在 **System R 自底向上动态规划** 与 **Volcano / Cascades 自顶向下搜索** 寻找最优多表连接计划时，下面哪一项描述精确揭示了它们的核心工程智慧？
      options:
        - text: System R 限定在左深连接树里逐步按表数做动态规划剪枝并特意保留带有“有趣序”的子计划免去后续昂贵排序；Volcano 则用 Memo 记忆化自顶向下按规则展开并以已知代价上界做分支剪枝，且设时间/步数上限终止防止优化耗时失控
          correct: true
        - text: 优化器每次都必须在真正执行之前先试运行完所有十万棵候选计划并取平均耗时
          why: 优化器靠代价估算公式（I/O 与 CPU 模型）在执行前纯靠估算快速筛选唯一最优计划，只需真跑 1 次！
        - text: System R 会丢弃所有带排序输出的子计划，逼迫最顶层的 `ORDER BY` 每次再重排一遍全表
          why: 保留能顺便满足后续算子（SMJ/GROUP BY/ORDER BY）排序需求的 **Interesting Order（有趣序）**，正是 System R 动态规划最精髓的设计之一
        - text: 左深树比稠密树需要遍历更多倍数的中间交叉树组合
          why: 恰恰相反！左深树限制右端始终为单基础表，正是为了把极庞大的交叉树空间锐减为更易流水线求优的子集
      explain: 至此 `D.1.2 数据库内核与查询优化` 全部五大关卡顺利打通！下一步在 `D.1.3` 你将走出单机边界，把分片、复制、法定集合、2PC 与共识推向分布式集群！
