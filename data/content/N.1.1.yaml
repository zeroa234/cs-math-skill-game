skill: N.1.1
version: 2
authors: [main-agent]
brief:
  why: 电路里的电荷怎么受力、电机为什么能转、发动机为什么总有一部分热量白白散掉，背后都是力学和热学。这一关从“位置怎样随时间变”讲起：速度和加速度、牛顿三定律、动量和角动量、功和能量、刚体转动，再到温度、热量、热力学两条定律和气体分子的运动。假设你学过一元微分学（导数）；矢量和积分用到时课里现讲。
  outcomes:
    - 用导数从位置求速度和加速度，用匀加速公式算自由落体和抛体的时间、射程、高度
    - 画受力分析图，用牛顿第二定律算斜面、摩擦、绳子拉力和圆周运动的问题
    - 用动量守恒算碰撞后的速度，分清弹性碰撞和完全非弹性碰撞里动能怎么变
    - 用动能定理和机械能守恒算速度和高度，说清保守力和非保守力的区别
    - 算转动惯量、力矩和角加速度，用角动量守恒解释滑冰运动员收臂转得更快
    - 用热力学第一定律算等温、等压、等容、绝热过程的功和热，算卡诺热机的效率和熵变
    - 用气体动理论从温度算分子的方均根速率，说出能量均分定理和速率分布的意思
terms:
  - term: 质点
    def: '只看位置、不管形状和大小的物体模型；物体的尺寸比它运动的范围小很多时可以这样简化'
  - term: 位移
    def: '末位置减初位置，Δx = x₂ − x₁；有正负（一维）或有方向（二三维），和走过的路程不同'
  - term: 平均速度
    def: '位移除以所用时间，Δx/Δt；只看起点和终点，不管中间怎么走'
  - term: 瞬时速度
    def: '某一时刻的速度，是位置对时间的导数 v = dx/dt'
  - term: 速率
    def: '瞬时速度的大小，不带方向，总是大于或等于 0'
  - term: 加速度
    def: '速度对时间的导数 a = dv/dt，单位 m/s²；表示速度变化的快慢'
  - term: 匀加速运动
    def: '加速度不随时间变化的运动；满足 v = v₀ + at，x = x₀ + v₀t + ½at²'
  - term: 自由落体
    def: '只受重力、从静止或某个初速度开始的竖直运动，加速度向下、大小为 g'
  - term: 重力加速度
    def: '地面附近物体只受重力时的加速度，大小约 9.8 m/s²，方向竖直向下，记作 g'
  - term: 矢量
    def: '既有大小又有方向的量，如位移、速度、力；数学里叫向量，可以拆成沿坐标轴的分量'
  - term: 向量
    def: '数学里对矢量的叫法：既有大小又有方向的量，写成分量形式 (x, y, z)'
  - term: 标量
    def: '只有大小、没有方向的量，如质量、时间、温度、能量'
  - term: 分量
    def: '矢量在某根坐标轴上的投影；大小 A、与 x 轴夹角 θ 的矢量，分量是 (A cos θ, A sin θ)'
  - term: 抛体运动
    def: '只受重力的斜抛或平抛运动：水平方向匀速，竖直方向是加速度为 −g 的匀加速运动'
  - term: 匀速圆周运动
    def: '沿圆周运动且速率不变；速度方向一直在变，所以仍有指向圆心的加速度'
  - term: 向心加速度
    def: '圆周运动中指向圆心的加速度，大小 v²/r；只改变速度的方向'
  - term: 切向加速度
    def: '沿轨迹切线方向的加速度，大小等于速率对时间的导数；只改变速度的大小'
  - term: 周期
    def: '转一整圈（或重复一次）所用的时间，记作 T；匀速圆周运动 T = 2πr/v'
  - term: 参考系
    def: '用来描述运动的观察者和他的坐标轴；同一个运动在不同参考系里速度可以不同'
  - term: 相对速度
    def: '物体相对某个参考系的速度；P 对 A 的速度 = P 对 B 的速度 + B 对 A 的速度（速度远小于光速时）'
  - term: 合力
    def: '作用在同一物体上的所有力按矢量相加的结果，记作 ΣF'
  - term: 惯性
    def: '物体保持原来运动状态的性质；质量越大，惯性越大，越难改变它的运动'
  - term: 惯性参考系
    def: '牛顿第一定律成立的参考系：不受合力的物体在其中静止或匀速直线运动'
  - term: 牛顿第一定律
    def: '物体所受合力为 0 时，保持静止或匀速直线运动'
  - term: 牛顿第二定律
    def: '合力等于质量乘加速度：ΣF = ma，合力的方向就是加速度的方向'
  - term: 质量
    def: '物体惯性大小的量度，单位千克（kg）；在哪里都一样，不随地点变化'
  - term: 重量
    def: '物体受到的重力 w = mg，单位牛顿（N）；随所在位置的 g 变化'
  - term: 牛顿第三定律
    def: '两个物体之间的作用力和反作用力大小相等、方向相反，分别作用在两个物体上'
  - term: 支持力
    def: '接触面推物体的力，垂直于接触面，记作 N；大小由其他力和运动情况决定'
  - term: 张力
    def: '绳子拉物体的力，沿绳子方向；轻绳两端的张力大小相等'
  - term: 胡克定律
    def: '弹簧在弹性限度内的弹力 F = −kx：大小和伸长量成正比，方向指向原长位置'
  - term: 受力分析图
    def: '只画一个物体，把它受到的每个力画成从物体出发的箭头的图，用来列牛顿第二定律'
  - term: 静摩擦力
    def: '两个接触面没有相对滑动时阻碍滑动趋势的力，大小可变，最大值为 μₛN'
  - term: 动摩擦力
    def: '两个接触面相对滑动时的摩擦力，大小约为 μₖN，方向和相对滑动方向相反'
  - term: 摩擦因数
    def: '摩擦力和支持力的比值 μ；分静摩擦因数 μₛ 和动摩擦因数 μₖ，通常 μₖ < μₛ'
  - term: 向心力
    def: '让物体做圆周运动的合力在指向圆心方向的分量，大小 mv²/r；不是一种新的力'
  - term: 收尾速度
    def: '下落物体的阻力增大到和重力相等时，加速度变为 0，此后保持的最大速度'
  - term: 惯性力
    def: '在加速的参考系里为了让牛顿第二定律仍能使用而添上的假想力，大小 ma，方向和参考系加速度相反'
  - term: 动量
    def: '质量乘速度 p = mv，矢量，单位 kg·m/s；牛顿第二定律可写成 F = dp/dt'
  - term: 冲量
    def: '力在一段时间里的累积 J = F·Δt（力会变时是 F–t 图下的面积），单位 N·s，等于动量的变化'
  - term: 动量定理
    def: '物体所受合力的冲量等于它动量的变化：J = Δp'
  - term: 动量守恒定律
    def: '系统所受合外力为 0 时，系统的总动量保持不变'
  - term: 动能
    def: '物体因运动而具有的能量 K = ½mv²，标量，单位焦耳（J）'
  - term: 弹性碰撞
    def: '碰撞前后总动能不变的碰撞；动量守恒，动能也守恒'
  - term: 完全非弹性碰撞
    def: '碰后两个物体粘在一起、以同一速度运动的碰撞；动量守恒，动能损失最多'
  - term: 质心
    def: '按质量加权的平均位置 Σmᵢrᵢ / Σmᵢ；系统的质心像一个集中了全部质量的质点那样运动'
  - term: 力矩
    def: '力使物体转动的效果 τ = rF sin θ（r 是力的作用点到转轴的距离，θ 是 r 和 F 的夹角），单位 N·m'
  - term: 角动量
    def: '质点对某点的角动量 L = r × p，大小 rp sin θ；刚体绕定轴的角动量 L = Iω'
  - term: 角动量守恒定律
    def: '系统所受合外力矩为 0 时，系统的总角动量保持不变'
  - term: 动能定理
    def: '合力对物体做的总功等于物体动能的变化：W = ΔK'
  - term: 功率
    def: '做功的快慢 P = dW/dt，单位瓦特（W），1 W = 1 J/s；恒力下 P = Fv'
  - term: 势能
    def: '系统因各部分的相对位置而储存的能量，如重力势能 mgh、弹性势能 ½kx²；只对保守力定义'
  - term: 保守力
    def: '做功只取决于起点和终点、与路径无关的力，如重力、弹簧弹力；沿闭合路径做功为 0'
  - term: 非保守力
    def: '做功与路径有关的力，如摩擦力；它做的功不能写成势能的变化，常把机械能变成内能'
  - term: 机械能
    def: '动能与势能之和 E = K + U'
  - term: 机械能守恒定律
    def: '只有保守力做功时，系统的机械能 K + U 保持不变'
  - term: 稳定平衡
    def: '势能曲线最低点处的平衡：稍微偏离后，力把物体推回来'
  - term: 刚体
    def: '形状和大小都不变的物体模型：内部任意两点之间的距离始终不变'
  - term: 角速度
    def: '角位置对时间的导数 ω = dθ/dt，单位 rad/s；刚体上每一点的角速度都相同'
  - term: 角加速度
    def: '角速度对时间的导数 α = dω/dt，单位 rad/s²'
  - term: 转动惯量
    def: '刚体绕某轴转动时惯性的大小 I = Σmᵢrᵢ²，单位 kg·m²；质量离轴越远，转动惯量越大（电机、拖动一类工程书上记作 J）'
  - term: 转动动能
    def: '刚体绕定轴转动的动能 K = ½Iω²'
  - term: 平行轴定理
    def: '绕任一轴的转动惯量 I = I_cm + Md²，I_cm 是绕过质心的平行轴的转动惯量，d 是两轴距离'
  - term: 转动定律
    def: '刚体定轴转动的牛顿第二定律：合外力矩等于转动惯量乘角加速度，Στ = Iα'
  - term: 无滑滚动
    def: '车轮滚动时与地面接触的点瞬间静止、不打滑；此时质心速度 v = Rω'
  - term: 进动
    def: '高速自转的陀螺在重力矩作用下，自转轴绕竖直方向缓慢转圈的运动'
  - term: 热力学系统
    def: '被选出来研究的那部分物质（如气缸里的气体），其余部分叫外界'
  - term: 温度
    def: '物体冷热程度的量度；两个物体接触后温度相同就不再有热量传递。热力学温度单位开尔文（K）'
  - term: 理想气体
    def: '分子本身的大小和分子间作用力都可以忽略的气体模型；常温常压下的空气近似是理想气体'
  - term: 物质的量
    def: '以摩尔（mol）为单位数分子：1 mol 含约 6.022 × 10²³ 个分子'
  - term: 理想气体状态方程
    def: 'pV = nRT：压强、体积、物质的量和热力学温度的关系，R ≈ 8.314 J/(mol·K)'
  - term: 热量
    def: '因为温度不同而在系统和外界之间传递的能量，记作 Q；系统吸热时 Q > 0'
  - term: 内能
    def: '系统内部所有分子无规则运动的动能和分子间势能的总和；理想气体的内能只取决于温度'
  - term: 热力学第一定律
    def: '系统内能的增加等于吸收的热量减去对外做的功：ΔU = Q − W'
  - term: 等容过程
    def: '体积保持不变的过程；气体不做功，吸收的热量全部用来增加内能'
  - term: 等压过程
    def: '压强保持不变的过程；气体对外做功 W = pΔV'
  - term: 等温过程
    def: '温度保持不变的过程；理想气体等温时内能不变，吸收的热量全部用来对外做功'
  - term: 绝热过程
    def: '系统和外界没有热量交换（Q = 0）的过程；理想气体缓慢绝热时 pV^γ 不变'
  - term: 摩尔热容
    def: '1 mol 物质温度升高 1 K 吸收的热量；理想气体分等容摩尔热容 C_V 和等压摩尔热容 C_p，C_p = C_V + R'
  - term: 可逆
    def: '热学里指过程能沿原路倒回去，让系统和外界都完全复原（不是矩阵的可逆）；只有没有摩擦、每一步都接近平衡的理想过程才可逆'
  - term: 可逆过程
    def: '每一步都无限接近平衡、没有摩擦，可以让系统和外界都完全回到原状的理想过程'
  - term: 循环
    def: '热学里指工作物质经过一系列过程后回到原来状态的一整轮；回到原状态时内能不变'
  - term: 热机
    def: '工作物质循环工作，从高温热源吸热、一部分变成功、其余放给低温热源的装置'
  - term: 热机效率
    def: '一个循环里对外做的净功和从高温热源吸收的热量之比 η = W / Q_h，总小于 1'
  - term: 性能系数
    def: '制冷机从低温处取走的热量和消耗的功之比 K = Q_c / W，可以大于 1'
  - term: 热力学第二定律
    def: '热量不能自发地从低温物体传到高温物体；也不存在把吸收的热量全部变成功而不产生其他影响的循环'
  - term: 卡诺循环
    def: '由两个等温过程和两个绝热过程组成的可逆循环，效率 1 − T_c/T_h，是两个热源之间效率最高的循环'
  - term: 熵
    def: '状态量，可逆过程中 dS = dQ/T，单位 J/K；微观上 S = k ln Ω，Ω 是微观状态数'
  - term: 熵增加原理
    def: '孤立系统的熵永不减少：可逆过程熵不变，不可逆过程熵增加'
  - term: 微观状态
    def: '把系统中每个分子的状态都指定出来的一种具体排列；同一个宏观状态可以对应很多微观状态'
  - term: 方均根速率
    def: '分子速率平方的平均值再开方 v_rms = √(3RT/M) = √(3kT/m)'
  - term: 玻尔兹曼常数
    def: 'k = R/N_A ≈ 1.38 × 10⁻²³ J/K，把一个分子的能量和温度联系起来'
  - term: 自由度
    def: '描述一个分子的能量需要的独立平方项个数：单原子分子 3 个（平动），常温下双原子分子 5 个（3 平动 + 2 转动）'
  - term: 能量均分定理
    def: '平衡时分子每个自由度平均分得 ½kT 的能量'
  - term: 麦克斯韦速率分布
    def: '理想气体分子速率的分布规律：速率很小和很大的分子都少，中间多，温度越高分布越向高速率扩展'
  - term: 平均自由程
    def: '一个分子连续两次碰撞之间平均走过的距离'

lessons:
  # ==== 质点运动学 ====
  - id: position-velocity
    chapter: 质点运动学
    title: 位置、速度和加速度
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你从家出发，向东走 300 米到便利店，又原路返回 100 米。用了 5 分钟。你离家的位置变化了多少？
          options:
            - text: 向东 200 米
              correct: true
            - text: 400 米
              why: 400 米是走过的路程。位置变化只看起点和终点：终点在家以东 200 米
            - text: 0 米，因为最后往回走了
              why: 你只往回走了 100 米，没有回到家，所以终点仍在家以东
          explain: 走过的路程是 400 米，但位置只变了“向东 200 米”。这两个量不一样，这一课先把它们分清。
      - card:
          title: 位置和位移
          body: |
            研究一辆车怎么跑，先不管车的形状，把它看成一个点，这叫**质点（particle）**。物体的大小比它跑的距离小很多时，这样简化不影响结果。

            在路上画一根 $x$ 轴，规定一个原点和正方向，质点的**位置（position）**就是一个数 $x$。从时刻 $t_1$ 到 $t_2$，位置从 $x_1$ 变到 $x_2$，**位移（displacement）**是

            $$\Delta x = x_2 - x_1$$

            位移可以是负的，负号表示往负方向移动。走过的总长度叫路程，总是正的。开头的例子里路程 400 米，位移 +200 米。
      - card:
          title: 平均速度
          body: |
            位移除以所用时间，叫**平均速度（average velocity）**：

            $$\bar v = \frac{\Delta x}{\Delta t} = \frac{x_2 - x_1}{t_2 - t_1}$$

            开头的例子：$\bar v = 200\text{ m} / 300\text{ s} \approx 0.67\text{ m/s}$。平均速度只看起点和终点，中间走走停停都不影响它。

            在 $x$–$t$ 图上，平均速度就是连接两个时刻对应点的割线的斜率。
      - item:
          id: avg-velocity
          type: number
          prompt: 一辆车在 $t = 2\text{ s}$ 时位于 $x = 10\text{ m}$，在 $t = 6\text{ s}$ 时位于 $x = -6\text{ m}$。这段时间的平均速度是多少 m/s？
          answer: -4
          unit: m/s
          hint: 位移是多少？带上正负号。
          explain: 位移 $\Delta x = -6 - 10 = -16\text{ m}$，时间 $\Delta t = 4\text{ s}$，平均速度 $-16/4 = -4\text{ m/s}$。负号表示车往 $x$ 轴的负方向开。
      - card:
          title: 瞬时速度就是导数
          body: |
            车速表上显示的是某一时刻的速度。把时间间隔 $\Delta t$ 缩到趋近于 0，平均速度的极限就是**瞬时速度（instantaneous velocity）**：

            $$v(t) = \lim_{\Delta t \to 0} \frac{x(t + \Delta t) - x(t)}{\Delta t} = \frac{dx}{dt}$$

            这正是位置对时间的导数，也就是 $x$–$t$ 图上切线的斜率。瞬时速度的大小叫**速率（speed）**，不带方向，总是 $\ge 0$。

            例如 $x(t) = 3t^2$（米），$v(t) = 6t$，在 $t = 2\text{ s}$ 时 $v = 12\text{ m/s}$。
      - item:
          id: inst-velocity
          type: number
          prompt: 质点的位置是 $x(t) = 2t^3 - 4t$（$x$ 以米计，$t$ 以秒计）。$t = 1\text{ s}$ 时的瞬时速度是多少 m/s？
          answer: 2
          unit: m/s
          hint: 先对 $x(t)$ 求导，再代入 $t = 1$。
          explain: $v(t) = \frac{dx}{dt} = 6t^2 - 4$，代入 $t = 1$ 得 $v = 6 - 4 = 2\text{ m/s}$。
      - card:
          title: 加速度
          body: |
            速度也会变。速度对时间的导数叫**加速度（acceleration）**：

            $$a(t) = \frac{dv}{dt} = \frac{d^2x}{dt^2}$$

            单位是 m/s²，读作“米每二次方秒”：每过 1 秒，速度改变多少 m/s。平均加速度是 $\Delta v / \Delta t$。

            加速度的正负和速度的正负是两回事。车往正方向开（$v > 0$）但在刹车，速度变小，$a < 0$。$v$ 和 $a$ 同号时速率增大，异号时速率减小。
      - item:
          id: accel-from-x
          type: number
          prompt: 质点的位置是 $x(t) = 2t^3 - 4t$（米，秒）。$t = 1\text{ s}$ 时的加速度是多少 m/s²？
          answer: 12
          unit: m/s²
          hint: 加速度是位置对时间的几阶导数？
          explain: $v(t) = 6t^2 - 4$，再求一次导数得 $a(t) = 12t$，$t = 1$ 时 $a = 12\text{ m/s}^2$。
      - item:
          id: sign-of-a
          type: choice
          prompt: 一辆车沿 $x$ 轴负方向行驶，越开越慢。它的速度 $v$ 和加速度 $a$ 的符号分别是？
          options:
            - text: $v < 0$，$a > 0$
              correct: true
            - text: $v < 0$，$a < 0$
              why: $v$ 和 $a$ 同号时速率会增大，而这辆车在减速
            - text: $v > 0$，$a < 0$
              why: 车往负方向开，速度是负的
            - text: $v < 0$，$a = 0$
              why: 速度在变（越来越慢），加速度不为 0
          explain: 往负方向开，$v < 0$。越开越慢说明速度的大小在减小，加速度方向和速度方向相反，所以 $a > 0$。
      - item:
          id: speed-vs-velocity
          type: choice
          prompt: 一位跑步者绕 400 米的操场跑一整圈，用时 80 秒，回到起点。下面哪个说法对？
          options:
            - text: 平均速度是 0，平均速率是 5 m/s
              correct: true
            - text: 平均速度和平均速率都是 5 m/s
              why: 回到起点，位移是 0，所以平均速度是 0
            - text: 平均速度和平均速率都是 0
              why: 平均速率用路程算：400 m / 80 s = 5 m/s
          explain: 平均速度 = 位移 / 时间 = 0；平均速率 = 路程 / 时间 = 400/80 = 5 m/s。两者只有在不掉头的直线运动里才相等。

  - id: constant-acceleration
    chapter: 质点运动学
    title: 匀加速运动和自由落体
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 在没有空气阻力的地方，同时从同一高度放开一个铁球和一个木球（铁球重得多）。哪个先落地？
          options:
            - text: 同时落地
              correct: true
            - text: 铁球先落地，因为它更重
              why: 不计空气阻力时，所有物体下落的加速度都一样，和质量无关
            - text: 木球先落地，因为它更轻
              why: 轻的物体并不会下落得更快；不计阻力时两者加速度相同
          explain: 不计空气阻力时，所有物体下落的加速度都是同一个值，约 9.8 m/s²。这一课学怎样用它算下落的时间和速度。
      - card:
          title: 加速度不变时的三个公式
          body: |
            加速度保持不变的运动叫**匀加速运动（motion with constant acceleration）**。设 $t = 0$ 时位置 $x_0$、速度 $v_0$，加速度恒为 $a$：

            $$v = v_0 + at$$
            $$x = x_0 + v_0 t + \tfrac12 a t^2$$
            $$v^2 = v_0^2 + 2a(x - x_0)$$

            验证：对第二式求导得 $v_0 + at$，正是第一式；再求导得 $a$。第三式由前两式消去 $t$ 得到，题目没给时间时用它。
      - card:
          title: 例题：刹车距离
          body: 汽车以 20 m/s 行驶，刹车后以 5 m/s² 的大小减速。它要多久停下？刹车距离多长？
          reveal:
            - title: 第 1 步：定方向，写出已知量
              body: 取前进方向为正：$v_0 = 20\text{ m/s}$，$a = -5\text{ m/s}^2$（减速，所以为负），末速度 $v = 0$。
            - title: 第 2 步：求时间
              body: 由 $v = v_0 + at$：$0 = 20 - 5t$，得 $t = 4\text{ s}$。
            - title: 第 3 步：求距离
              body: 由 $v^2 = v_0^2 + 2a\Delta x$：$0 = 400 - 10\Delta x$，得 $\Delta x = 40\text{ m}$。用第二式检验：$20 \times 4 - \tfrac12 \times 5 \times 16 = 80 - 40 = 40\text{ m}$。
      - item:
          id: braking-half
          type: number
          prompt: 一辆车以 30 m/s 行驶，刹车后以大小 6 m/s² 的加速度匀减速直到停下。刹车距离是多少米？
          answer: 75
          unit: m
          hint: 题目没问时间，用哪一个公式可以不经过时间？
          explain: 取前进方向为正，$a = -6\text{ m/s}^2$。由 $v^2 = v_0^2 + 2a\Delta x$：$0 = 900 - 12\Delta x$，$\Delta x = 75\text{ m}$。
      - card:
          title: 自由落体
          body: |
            只受重力的竖直运动叫**自由落体（free fall）**。地面附近，它的加速度方向竖直向下，大小几乎处处相同，叫**重力加速度（acceleration due to gravity）**，记作 $g \approx 9.8\text{ m/s}^2$。

            取向上为正，自由落体就是 $a = -g$ 的匀加速运动。往上抛的球，上升时速度为正、越来越小；到最高点速度为 0，但加速度仍是 $-g$；然后下落。

            从静止释放、下落高度 $h$ 所用的时间：由 $h = \tfrac12 g t^2$ 得 $t = \sqrt{2h/g}$。
      - item:
          id: drop-time
          type: number
          prompt: 一块石头从 19.6 米高处由静止落下，不计空气阻力，取 $g = 9.8\text{ m/s}^2$。它落地要多少秒？
          answer: 2
          unit: s
          hint: 从静止开始，下落高度和时间是什么关系？
          explain: 由 $h = \tfrac12 g t^2$：$19.6 = 4.9t^2$，$t^2 = 4$，$t = 2\text{ s}$。
      - item:
          id: top-accel
          type: choice
          prompt: 把一个球竖直向上抛出，不计空气阻力。球到达最高点的那一瞬间，下面哪个说法对？
          options:
            - text: 速度为 0，加速度大小为 g、方向向下
              correct: true
            - text: 速度为 0，加速度也为 0
              why: 重力一直在作用，加速度一直是 g；如果加速度为 0，球会停在空中不再下落
            - text: 速度向上，加速度向下
              why: 最高点是由上升变为下落的转折点，那一瞬间速度为 0
          explain: 速度为 0 只是一瞬间。重力从未消失，所以加速度始终是向下的 $g$，下一瞬间速度就变成向下。
      - card:
          title: 加速度会变时：反过来求速度和位置
          body: |
            加速度随时间变化时，三个公式不能用。反过来想：速度的导数是 $a(t)$，所以 $v(t)$ 是“哪个函数求导后等于 $a(t)$”，再加上初速度定下的常数。

            例如 $a(t) = 6t$，$v_0 = 2$：求导得 $6t$ 的函数是 $3t^2 + C$，由 $v(0) = 2$ 得 $C = 2$，所以 $v(t) = 3t^2 + 2$。同样地，$x(t)$ 是求导后等于 $v(t)$ 的函数：$x(t) = t^3 + 2t + x_0$。

            在 $a$–$t$ 图上，速度的变化量等于曲线下的面积；在 $v$–$t$ 图上，位移等于曲线下的面积。数学里把曲线下的面积叫积分，记作 $\int_{t_1}^{t_2} v\,dt$（曲线落到横轴下方的面积算负的，所以积分给的是净变化）：把区域切成很多窄条，每条面积约 $v\,\Delta t$，全部加起来，窄条越切越细时的极限就是它。
      - item:
          id: varying-accel
          type: number
          prompt: 质点的加速度 $a(t) = 6t$（m/s²），$t = 0$ 时速度为 2 m/s、位置为 0。$t = 2\text{ s}$ 时它的位置是多少米？
          answer: 12
          unit: m
          hint: 先找出求导后等于 $6t$ 的速度函数，再找出求导后等于它的位置函数。
          explain: $v(t) = 3t^2 + 2$（满足 $v(0) = 2$），$x(t) = t^3 + 2t$（满足 $x(0) = 0$）。$x(2) = 8 + 4 = 12\text{ m}$。检验：$x'(t) = 3t^2 + 2 = v(t)$。
      - item:
          id: area-vt
          type: number
          prompt: 一辆车的速度从 $t = 0$ 时的 4 m/s 均匀增加到 $t = 6\text{ s}$ 时的 16 m/s。这 6 秒内的位移是多少米？
          answer: 60
          unit: m
          hint: 在 $v$–$t$ 图上，位移是哪块图形的面积？
          explain: $v$–$t$ 图是一条直线，曲线下是一个梯形，面积 $= \frac{(4 + 16)}{2} \times 6 = 60\text{ m}$。也可以用匀加速公式：$a = 2\text{ m/s}^2$，$x = 4 \times 6 + \tfrac12 \times 2 \times 36 = 60\text{ m}$。

  - id: vectors-projectile
    chapter: 质点运动学
    title: 矢量和抛体运动
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 在同一高度，一颗子弹水平射出，同时另一颗子弹从手中自由落下。不计空气阻力，地面水平。哪颗先落地？
          options:
            - text: 同时落地
              correct: true
            - text: 自由落下的先落地，因为射出的子弹要飞很远
              why: 水平飞得远不影响竖直方向的下落；两颗子弹竖直方向的运动完全一样
            - text: 射出的先落地，因为它速度快
              why: 水平速度不会让竖直方向下落得更快
          explain: 水平方向的运动和竖直方向的运动互不影响。这一课把运动拆成两个方向分别算。
      - card:
          title: 矢量和分量
          body: |
            位移、速度、加速度都既有大小又有方向，这样的量叫**矢量（vector）**，数学里叫**向量（vector）**。只有大小的量，如时间、质量，叫**标量（scalar）**。

            在平面上画 $x$、$y$ 两根轴。大小为 $A$、与 $x$ 轴夹角为 $\theta$ 的矢量，可以拆成沿两根轴的**分量（component）**（常用值：$\sin 30° = 0.5$，$\cos 30° \approx 0.866$）：

            $$A_x = A\cos\theta,\quad A_y = A\sin\theta$$

            反过来，由分量求大小：$A = \sqrt{A_x^2 + A_y^2}$。两个矢量相加，就是分量分别相加。
      - item:
          id: components
          type: number
          prompt: 一个速度大小为 10 m/s、方向与水平方向成 30° 斜向上。它的竖直分量是多少 m/s？
          answer: 5
          unit: m/s
          hint: 竖直分量用 sin 还是 cos？sin 30° 是多少？
          explain: $v_y = 10 \sin 30° = 10 \times 0.5 = 5\text{ m/s}$；水平分量 $v_x = 10\cos 30° \approx 8.66\text{ m/s}$。
      - card:
          title: 位移、速度、加速度都是矢量
          body: |
            二维运动里，位置写成 $\vec r = (x, y)$。速度矢量 $\vec v = (dx/dt,\ dy/dt)$，加速度矢量 $\vec a = (dv_x/dt,\ dv_y/dt)$：每个分量分别求导。

            速度矢量总是沿着轨迹的切线方向。加速度矢量不一定沿轨迹：它指向速度“正在被拉向”的方向。

            关键在于：$x$ 方向和 $y$ 方向可以分开处理，各自用一维的公式。
      - card:
          title: 抛体运动
          body: |
            只受重力的斜抛、平抛叫**抛体运动（projectile motion）**。取水平为 $x$、竖直向上为 $y$：

            - 水平方向没有力，$a_x = 0$，匀速：$x = v_0\cos\theta \cdot t$；
            - 竖直方向 $a_y = -g$，匀加速：$y = v_0\sin\theta \cdot t - \tfrac12 g t^2$。

            落回同一高度时 $y = 0$，得飞行时间 $T = \frac{2v_0\sin\theta}{g}$。最高点竖直速度为 0，最大高度 $H = \frac{(v_0\sin\theta)^2}{2g}$。射程 $R = v_0\cos\theta \cdot T = \frac{v_0^2 \sin 2\theta}{g}$。
      - item:
          id: projectile-time-half
          type: number
          prompt: 以 20 m/s、仰角 30° 抛出一个小球，落回同一高度，不计空气阻力，$g = 9.8\text{ m/s}^2$。小球在空中飞行多少秒？（保留两位小数）
          answer: 2.04
          tolerance: 0.01
          unit: s
          hint: 先算竖直初速度。竖直方向从抛出到落回，用了多长时间？
          explain: 竖直初速度 $v_0\sin 30° = 10\text{ m/s}$。$T = 2 \times 10 / 9.8 \approx 2.04\text{ s}$。
      - card:
          title: 例题：求射程和最大高度
          body: 以 20 m/s、仰角 30° 抛出的小球落回同一高度。求水平射程和最大高度。
          reveal:
            - title: 第 1 步：拆成两个方向
              body: 水平速度 $v_x = 20\cos 30° \approx 17.32\text{ m/s}$，竖直初速度 $v_y = 10\text{ m/s}$。
            - title: 第 2 步：水平方向匀速，乘以飞行时间
              body: $R = v_x T = 17.32 \times 2.041 \approx 35.3\text{ m}$。用公式检验：$R = 20^2 \sin 60° / 9.8 \approx 35.3\text{ m}$。
            - title: 第 3 步：竖直方向到最高点速度为 0
              body: 由 $0 = v_y^2 - 2gH$：$H = 10^2 / (2 \times 9.8) \approx 5.10\text{ m}$。
      - item:
          id: projectile-height
          type: number
          prompt: 一个足球以 15 m/s、仰角 53° 踢出（$\sin 53° \approx 0.8$），不计空气阻力，$g = 9.8\text{ m/s}^2$。足球能上升的最大高度是多少米？（保留一位小数）
          answer: 7.3
          tolerance: 0.05
          unit: m
          hint: 只看竖直方向：初速度多少？到最高点时竖直速度是多少？
          explain: 竖直初速度 $15 \times 0.8 = 12\text{ m/s}$。最高点竖直速度为 0：$H = 12^2/(2 \times 9.8) = 144/19.6 \approx 7.3\text{ m}$。
      - item:
          id: max-range-angle
          type: choice
          prompt: 在水平地面上以相同的速率、不同的仰角抛出物体，不计空气阻力。仰角多少时水平射程最大？
          options:
            - text: 45°
              correct: true
            - text: 90°
              why: 竖直向上抛时水平速度为 0，射程是 0
            - text: 越小越好
              why: 仰角太小，飞行时间很短，射程也小
            - text: 60°
              why: 射程 $R = v_0^2\sin 2\theta/g$，$\sin 2\theta$ 在 $\theta = 45°$ 时最大；60° 和 30° 射程相等，都比 45° 小
          explain: 射程 $R = v_0^2 \sin 2\theta / g$。$\sin 2\theta$ 最大为 1，此时 $2\theta = 90°$，即 $\theta = 45°$。这是不计空气阻力时的结论。

  - id: circular-relative
    chapter: 质点运动学
    title: 圆周运动和相对运动
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一辆车以恒定的速率 20 m/s 在环形跑道上绕圈。这辆车有加速度吗？
          options:
            - text: 有，因为速度的方向一直在变
              correct: true
            - text: 没有，因为速率不变
              why: 速度是矢量，方向变了速度就变了，速度在变就有加速度
            - text: 只有在跑道变陡的地方才有
              why: 只要在拐弯，速度方向就在变，与坡度无关
          explain: 速度是矢量。速率不变，但方向在变，速度仍在变化，所以有加速度。这一课算它有多大、指向哪里。
      - card:
          title: 匀速圆周运动和向心加速度
          body: |
            沿半径 $r$ 的圆周、以不变的速率 $v$ 运动，叫**匀速圆周运动（uniform circular motion）**。转一圈的时间叫**周期（period）**：$T = 2\pi r / v$。

            速度方向一直沿切线，每时每刻都在转，这需要一个始终指向圆心的加速度，叫**向心加速度（centripetal acceleration）**：

            $$a_c = \frac{v^2}{r}$$

            速率越大、半径越小，向心加速度越大。它只改变速度的方向，不改变速度的大小。
          reveal:
            - title: 第 1 步：一小段时间里速度转过多大角度
              body: 在很短的 $\Delta t$ 里，质点走过弧长 $v\Delta t$，对应圆心角 $\Delta\theta = v\Delta t / r$。速度矢量始终垂直于半径，所以它也转过 $\Delta\theta$。
            - title: 第 2 步：速度的变化量有多大、指向哪里
              body: 两个长度都是 $v$、夹角 $\Delta\theta$ 的速度矢量相减，差 $\Delta v \approx v\Delta\theta$；$\Delta\theta$ 很小时，这个差垂直于速度、指向圆心。
            - title: 第 3 步：除以时间
              body: $a = \Delta v / \Delta t = v \cdot \frac{v\Delta t / r}{\Delta t} = \frac{v^2}{r}$，方向指向圆心。
      - item:
          id: centripetal-a
          type: number
          prompt: 一辆车以 20 m/s 的速率驶过半径 50 米的圆形弯道。它的向心加速度是多少 m/s²？
          answer: 8
          unit: m/s²
          hint: 向心加速度和速率、半径是什么关系？
          explain: $a_c = v^2/r = 400/50 = 8\text{ m/s}^2$，方向指向弯道的圆心。
      - card:
          title: 非匀速圆周运动
          body: |
            如果在圆周上越转越快（或越慢），加速度有两个分量：

            - **向心加速度** $v^2/r$，指向圆心，改变速度的方向；
            - **切向加速度（tangential acceleration）** $a_t = dv/dt$，沿切线，改变速度的大小。

            两者互相垂直，总加速度的大小 $a = \sqrt{a_c^2 + a_t^2}$。例如半径 2 米、某时刻速率 4 m/s、速率每秒增加 6 m/s：$a_c = 16/2 = 8$，$a_t = 6$，$a = 10\text{ m/s}^2$。
      - item:
          id: total-accel
          type: number
          prompt: 一个小球沿半径 1 米的圆周运动，某一时刻速率为 3 m/s，速率正以每秒 12 m/s 的快慢增加。这一时刻它的总加速度大小是多少 m/s²？
          answer: 15
          unit: m/s²
          hint: 分别算向心加速度和切向加速度。两者是什么方向关系？
          explain: $a_c = 9/1 = 9\text{ m/s}^2$，$a_t = 12\text{ m/s}^2$，两者垂直：$a = \sqrt{81 + 144} = 15\text{ m/s}^2$。
      - card:
          title: 参考系和相对速度
          body: |
            描述运动要先说“相对谁”。用来描述运动的观察者和他的坐标轴叫**参考系（reference frame）**。坐在火车上的人看车厢里的杯子是静止的，站台上的人看它以火车的速度前进。

            物体相对某个参考系的速度叫**相对速度（relative velocity）**。设 P 是物体，A、B 是两个参考系：

            $$\vec v_{PA} = \vec v_{PB} + \vec v_{BA}$$

            读作：P 相对 A 的速度 = P 相对 B 的速度 + B 相对 A 的速度。这个关系在速度远小于光速时成立。
      - item:
          id: train-walk
          type: number
          prompt: 火车以 20 m/s 向东行驶，乘客在车厢里以 2 m/s 向西走。站在地面上的人看，乘客的速度是向东多少 m/s？
          answer: 18
          unit: m/s
          hint: 取向东为正，乘客相对火车的速度是正还是负？
          explain: 取向东为正：$v_{\text{人地}} = v_{\text{人车}} + v_{\text{车地}} = -2 + 20 = 18\text{ m/s}$，向东。
      - card:
          title: 例题：小船过河
          body: 河宽 120 米，水流速度 3 m/s（向东）。小船相对水的速度 4 m/s，船头始终垂直河岸指向北岸。船到对岸要多久？上岸点在出发点下游多远？船相对岸的速率多大？
          reveal:
            - title: 第 1 步：写出相对关系
              body: $\vec v_{\text{船岸}} = \vec v_{\text{船水}} + \vec v_{\text{水岸}} = (0, 4) + (3, 0) = (3, 4)\text{ m/s}$（$x$ 向东，$y$ 向北）。
            - title: 第 2 步：过河时间只由垂直河岸的分量决定
              body: $t = 120 / 4 = 30\text{ s}$。
            - title: 第 3 步：顺流方向的漂移和合速度
              body: 下游漂移 $3 \times 30 = 90\text{ m}$。相对岸的速率 $\sqrt{3^2 + 4^2} = 5\text{ m/s}$。
      - item:
          id: boat-drift
          type: number
          prompt: 河宽 60 米，水流速度 2 m/s。小船相对水的速度 5 m/s，船头始终垂直河岸。船到达对岸时，上岸点在正对岸的下游多少米？
          answer: 24
          unit: m
          hint: 过河时间由哪个方向的速度决定？这段时间里水把船带走多远？
          explain: 过河时间 $60/5 = 12\text{ s}$，下游漂移 $2 \times 12 = 24\text{ m}$。
      - item:
          id: rain-frame
          type: choice
          prompt: 无风的雨天，雨滴竖直下落。你骑车向前快速行驶时，觉得雨是斜着从前方打来的。原因是什么？
          options:
            - text: 在你的参考系里，雨的速度 = 雨对地的速度 − 你对地的速度，多出一个向后的分量
              correct: true
            - text: 骑车带起的风把雨吹斜了
              why: 题目说无风；即使在没有空气的地方，换到运动的参考系里看，雨的方向也会变斜
            - text: 雨滴真的斜着落下，只是站着时看不出来
              why: 地面上的人看雨是竖直落下的；斜是因为换了参考系
          explain: $\vec v_{\text{雨人}} = \vec v_{\text{雨地}} - \vec v_{\text{人地}}$。你向前走，减去你的速度相当于给雨加了一个向后的水平分量，雨看起来从前方斜着打来。

  # ==== 牛顿定律 ====
  - id: newton-laws
    chapter: 牛顿定律
    title: 牛顿三定律
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 冰面上一个冰球被击出后，几乎不减速地滑了很远。如果冰面完全没有摩擦，冰球会怎样？
          options:
            - text: 一直以同样的速度沿直线滑下去
              correct: true
            - text: 慢慢停下来，因为推它的力用完了
              why: 运动不需要力来维持；让它停下来的是摩擦，没有摩擦它就不会减速
            - text: 立刻停下，因为没有力推它了
              why: 物体会保持原来的运动状态，离开球杆时有多快就一直多快
          explain: 让物体减速的是摩擦和空气阻力，不是“力用完了”。没有任何阻碍时，运动会一直保持。这一课从这条规律讲起。
      - card:
          title: 力和牛顿第一定律
          body: |
            推、拉、压、吸引，统称力（force），是矢量，单位牛顿（N）。作用在同一物体上的所有力按矢量相加，结果叫**合力（net force）**，记作 $\Sigma\vec F$。

            **牛顿第一定律（Newton's first law）**：合力为 0 时，物体保持静止或匀速直线运动。物体保持原来运动状态的性质叫**惯性（inertia）**。

            第一定律只在某些参考系里成立：在急刹车的车厢里，没人推的行李也会往前滑。第一定律成立的参考系叫**惯性参考系（inertial reference frame）**，地面在大多数问题里可以近似看作惯性参考系。
      - item:
          id: const-velocity-force
          type: choice
          prompt: 一辆车在平直公路上以 90 km/h 匀速行驶。作用在车上的合力是多少？
          options:
            - text: 合力为 0
              correct: true
            - text: 向前，等于发动机的牵引力
              why: 牵引力被阻力和摩擦抵消了；速度不变说明合力为 0
            - text: 向前，比阻力大一点，否则车会停
              why: 合力向前时车会加速；匀速说明牵引力和阻力恰好相等
          explain: 匀速直线运动，加速度为 0，所以合力为 0。牵引力存在，只是和阻力大小相等、方向相反。
      - card:
          title: 牛顿第二定律
          body: |
            合力不为 0 时，物体获得加速度。**牛顿第二定律（Newton's second law）**：

            $$\Sigma\vec F = m\vec a$$

            加速度的方向就是合力的方向。$m$ 是**质量（mass）**，单位千克（kg），它衡量惯性的大小：同样的合力，质量越大，加速度越小。$1\text{ N}$ 就是让 1 kg 的物体获得 1 m/s² 加速度的力。

            用分量写：$\Sigma F_x = m a_x$，$\Sigma F_y = m a_y$，两个方向分别列方程。
      - item:
          id: f-ma
          type: number
          prompt: 一个 1200 kg 的汽车受到 3000 N 的向前牵引力和 600 N 的阻力。它的加速度是多少 m/s²？
          answer: 2
          unit: m/s²
          hint: 先求合力。
          explain: 合力 $3000 - 600 = 2400\text{ N}$，$a = 2400/1200 = 2\text{ m/s}^2$，方向向前。
      - card:
          title: 质量和重量
          body: |
            地球对物体的引力叫重力。物体只受重力时加速度是 $g$，由第二定律，重力的大小是

            $$w = mg$$

            这个力叫**重量（weight）**，单位牛顿。质量和重量不是一回事：质量是物体本身的属性，在月球上也一样；月球表面的 $g$ 约为地球的 1/6，同一个物体在月球上的重量只有地球上的约 1/6。

            日常说“体重 60 公斤”指的是质量 60 kg，对应的重量是 $60 \times 9.8 = 588\text{ N}$。
      - item:
          id: moon-weight
          type: number
          prompt: 一名宇航员的质量是 72 kg。月球表面的重力加速度取 1.6 m/s²。他在月球上的重量是多少牛顿？
          answer: 115.2
          unit: N
          hint: 重量等于质量乘以哪个加速度？
          explain: $w = mg_{\text{月}} = 72 \times 1.6 = 115.2\text{ N}$。他的质量仍是 72 kg。
      - card:
          title: 牛顿第三定律
          body: |
            你推墙，墙也推你。**牛顿第三定律（Newton's third law）**：物体 A 对 B 施力 $\vec F_{AB}$ 时，B 同时对 A 施力 $\vec F_{BA} = -\vec F_{AB}$，大小相等、方向相反。

            这两个力作用在两个不同的物体上，所以不能互相抵消。马拉车时，车也拉马；马能前进，是因为地面给马蹄向前的摩擦力大于车拉马的力。判断一个物体怎么动，只看作用在它身上的力。
      - item:
          id: third-law-pair
          type: choice
          prompt: 一本书静止放在桌面上。和“地球吸引书的重力”构成牛顿第三定律作用力与反作用力的是哪个力？
          options:
            - text: 书吸引地球的引力
              correct: true
            - text: 桌面对书的支持力
              why: 支持力和重力都作用在书上，它们平衡是因为书静止，不是第三定律；第三定律的一对力作用在两个物体上
            - text: 书对桌面的压力
              why: 压力是书和桌面之间的接触力，它的反作用力是桌面对书的支持力，不是重力
          explain: 第三定律的一对力是“A 对 B”和“B 对 A”。重力是地球对书的力，它的反作用力是书对地球的引力，作用在地球上。
      - item:
          id: truck-car
          type: choice
          prompt: 一辆大卡车和一辆小轿车正面相撞。碰撞过程中，哪辆车受到的撞击力更大？
          options:
            - text: 一样大
              correct: true
            - text: 小轿车受到的力更大，因为它损坏得更严重
              why: 两车之间的力是一对作用力和反作用力，大小相等；轿车损坏更重是因为它质量小、加速度大
            - text: 大卡车受到的力更大，因为它更重
              why: 第三定律说两者之间的力大小相等，与质量无关
          explain: 两车之间的力大小相等。由 $a = F/m$，质量小的轿车加速度大得多，所以里面的人受伤更重。

  - id: forces-friction
    chapter: 牛顿定律
    title: 常见的力、受力分析和摩擦
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你用 50 N 的力水平推一个很重的箱子，箱子纹丝不动。这时地面给箱子的摩擦力是多大？
          options:
            - text: 50 N，方向与你的推力相反
              correct: true
            - text: 0，因为箱子没有动
              why: 如果摩擦力为 0，你的推力就是合力，箱子会加速
            - text: 比 50 N 大，所以你推不动
              why: 摩擦力比推力大的话，箱子会被推回你这边；静止说明两个力正好平衡
          explain: 箱子静止，合力为 0，所以摩擦力正好等于 50 N。这种不滑动时的摩擦力会随推力变化，这一课讲它的规律。
      - card:
          title: 常见的几种力
          body: |
            - 重力 $mg$，竖直向下（$g$ 来自地球的引力）。
            - **支持力（normal force）** $N$：接触面推物体的力，垂直于接触面。它的大小由其他力决定，不一定等于 $mg$。
            - **张力（tension）** $T$：绳子拉物体的力，沿着绳子。质量可以忽略的轻绳，两端张力相等。
            - 弹簧的弹力，满足**胡克定律（Hooke's law）**：$F = -kx$。$x$ 是偏离原长的长度，$k$ 是劲度系数（弹簧有多硬：拉长 1 m 需要多大的力，单位 N/m），负号表示弹力指向原长位置。
      - item:
          id: spring-k
          type: number
          prompt: 一根弹簧挂上 2 kg 的物体后伸长了 0.05 米并保持静止，$g = 9.8\text{ m/s}^2$。弹簧的劲度系数是多少 N/m？
          answer: 392
          unit: N/m
          hint: 物体静止时，弹力和什么力平衡？
          explain: 静止时弹力等于重力：$kx = mg$，$k = 2 \times 9.8 / 0.05 = 392\text{ N/m}$。
      - card:
          title: 受力分析图和解题步骤
          body: |
            用牛顿定律解题，最关键的是**受力分析图（free-body diagram）**：只画你要研究的那一个物体，把它受到的每个力画成从它出发的箭头。

            步骤：
            1. 选研究对象，画受力分析图；
            2. 选坐标轴，常把一根轴沿着加速度方向（斜面问题沿斜面）；
            3. 把每个力分解到两根轴上，每根轴写 $\Sigma F = ma$；
            4. 解方程，检查单位和数量级。
      - card:
          title: 摩擦力
          body: |
            两个接触面没有相对滑动时，阻碍滑动趋势的力叫**静摩擦力（static friction）**。它的大小随外力变化，最大值约为 $\mu_s N$。

            相对滑动时的摩擦力叫**动摩擦力（kinetic friction）**，大小约为 $f_k = \mu_k N$，方向和相对滑动方向相反。$\mu_s$、$\mu_k$ 叫静、动**摩擦因数（coefficient of friction）**，没有单位，通常 $\mu_k < \mu_s$，所以推动箱子比让它保持滑动更费力。

            注意 $f = \mu N$ 用的是支持力 $N$，不是重力。
      - item:
          id: static-threshold
          type: number
          prompt: 一个 20 kg 的箱子放在水平地面上，静摩擦因数 0.5，$g = 9.8\text{ m/s}^2$。至少用多大的水平推力才能推动它（单位 N）？
          answer: 98
          unit: N
          hint: 水平地面上支持力等于多少？最大静摩擦力是多少？
          explain: $N = mg = 196\text{ N}$，最大静摩擦力 $\mu_s N = 0.5 \times 196 = 98\text{ N}$。推力超过 98 N 箱子才会动。
      - card:
          title: 例题：斜面上有摩擦的下滑
          body: 2 kg 的木块放在倾角 30° 的斜面上，动摩擦因数 0.2，由静止开始下滑。求加速度（$g = 9.8\text{ m/s}^2$）。
          reveal:
            - title: 第 1 步：画受力分析图
              body: 木块受三个力：重力 $mg$ 竖直向下，支持力 $N$ 垂直斜面向上，动摩擦力 $f$ 沿斜面向上（和下滑方向相反）。
            - title: 第 2 步：沿斜面和垂直斜面建立坐标轴，分解重力
              body: 重力沿斜面向下的分量 $mg\sin 30°$，垂直斜面的分量 $mg\cos 30°$。垂直斜面方向没有加速度：$N = mg\cos 30°$。
            - title: 第 3 步：沿斜面写牛顿第二定律
              body: $mg\sin 30° - \mu_k mg\cos 30° = ma$，所以 $a = g(\sin 30° - \mu_k\cos 30°) = 9.8 \times (0.5 - 0.2 \times 0.866) \approx 3.20\text{ m/s}^2$。质量被约掉了。
      - item:
          id: incline-half
          type: number
          prompt: 一个物体在倾角 37° 的斜面上下滑（$\sin 37° \approx 0.6$，$\cos 37° \approx 0.8$），动摩擦因数 0.25，$g = 9.8\text{ m/s}^2$。它的加速度是多少 m/s²？（保留两位小数）
          answer: 3.92
          tolerance: 0.01
          unit: m/s²
          hint: 支持力等于重力的哪个分量？摩擦力和重力沿斜面的分量方向相反。
          explain: $a = g(\sin 37° - \mu_k \cos 37°) = 9.8 \times (0.6 - 0.25 \times 0.8) = 9.8 \times 0.4 = 3.92\text{ m/s}^2$。
      - item:
          id: normal-not-mg
          type: choice
          prompt: 你用一根绳子以斜向上 30° 的方向拉一个放在水平地面上的箱子，箱子沿地面滑动。地面对箱子的支持力和箱子的重力 $mg$ 相比怎样？
          options:
            - text: 比 $mg$ 小，因为拉力有一个向上的分量
              correct: true
            - text: 等于 $mg$，支持力总是等于重力
              why: 竖直方向 $N + T\sin 30° = mg$，拉力向上的分量分担了一部分，支持力变小
            - text: 比 $mg$ 大，因为箱子正被拉着向前滑动
              why: 支持力只由竖直方向的力决定；竖直方向没有加速度，向前滑动不会让支持力变大
          explain: 竖直方向没有加速度：$N + T\sin 30° - mg = 0$，$N = mg - T\sin 30° < mg$。所以这时摩擦力 $\mu_k N$ 也比 $\mu_k mg$ 小。

  - id: centripetal-drag
    chapter: 牛顿定律
    title: 向心力、空气阻力和惯性力
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 用绳子拴着一个小球在水平面上做圆周运动，突然绳子断了。小球会往哪个方向飞？
          options:
            - text: 沿断开那一刻的切线方向直线飞出
              correct: true
            - text: 沿半径方向向外飞出
              why: 绳断后小球不再受指向圆心的力，它保持断开时的速度，而那时速度沿切线
            - text: 继续沿圆弧转一会儿再飞出
              why: 没有指向圆心的力，速度方向就不会再改变，不会继续拐弯
          explain: 绳子的拉力是让小球拐弯的原因。拉力一消失，小球按第一定律保持当时的速度，沿切线飞出。
      - card:
          title: 向心力
          body: |
            做匀速圆周运动的物体有向心加速度 $v^2/r$，由第二定律，指向圆心方向的合力必须是

            $$F_c = m\frac{v^2}{r}$$

            这个合力叫**向心力（centripetal force）**。它不是一种新的力，而是由已有的力提供的：绳子的张力、汽车轮胎和路面的静摩擦力、卫星受到的引力。画受力分析图时不要额外画一个“向心力”。
      - item:
          id: car-curve-friction
          type: number
          prompt: 一辆 1000 kg 的汽车以 10 m/s 的速度在水平路面上转过半径 25 米的弯。提供向心力的静摩擦力是多少牛顿？
          answer: 4000
          unit: N
          hint: 向心力等于质量乘以向心加速度。
          explain: $f = mv^2/r = 1000 \times 100 / 25 = 4000\text{ N}$。
      - card:
          title: 例题：不打滑的最大转弯速度
          body: 水平路面，轮胎和路面的静摩擦因数 0.8，弯道半径 50 米。汽车不打滑的最大速度是多少（$g = 9.8\text{ m/s}^2$）？
          reveal:
            - title: 第 1 步：找出谁提供向心力
              body: 水平方向只有静摩擦力，它提供向心力：$f = mv^2/r$。
            - title: 第 2 步：写出摩擦力的上限
              body: 静摩擦力最大为 $\mu_s N = \mu_s mg$，所以要求 $mv^2/r \le \mu_s mg$。
            - title: 第 3 步：解出速度
              body: $v_{\max} = \sqrt{\mu_s g r} = \sqrt{0.8 \times 9.8 \times 50} = \sqrt{392} \approx 19.8\text{ m/s}$，约 71 km/h。质量约掉了。
      - item:
          id: max-curve-speed
          type: number
          prompt: 在静摩擦因数 0.5 的水平路面上，汽车转过半径 20 米的弯道，$g = 9.8\text{ m/s}^2$。不打滑的最大速度是多少 m/s？（保留一位小数）
          answer: 9.9
          tolerance: 0.05
          unit: m/s
          hint: 向心力需要的大小不能超过最大静摩擦力。
          explain: $v_{\max} = \sqrt{\mu_s g r} = \sqrt{0.5 \times 9.8 \times 20} = \sqrt{98} \approx 9.9\text{ m/s}$。
      - card:
          title: 空气阻力和收尾速度
          body: |
            物体在空气或水中运动会受到阻力（drag force），方向和速度相反，速度越大阻力越大。高速时阻力近似为 $F_D = \tfrac12 C\rho A v^2$，其中 $\rho$ 是空气密度，$A$ 是迎风面积，$C$ 是由形状决定的阻力系数。

            下落时，速度增大，阻力随之增大。当阻力增大到等于重力时，合力为 0，速度不再增加，这个最大速度叫**收尾速度（terminal speed）**：由 $\tfrac12 C\rho A v_T^2 = mg$ 得

            $$v_T = \sqrt{\frac{2mg}{C\rho A}}$$
      - item:
          id: terminal-speed
          type: number
          prompt: 一名跳伞运动员连同装备 80 kg，张开四肢下落时 $C = 1$，迎风面积 $A = 0.8\text{ m}^2$，空气密度 $\rho = 1.2\text{ kg/m}^3$，$g = 9.8\text{ m/s}^2$。他的收尾速度约为多少 m/s？（保留一位小数）
          answer: 40.4
          tolerance: 0.05
          unit: m/s
          hint: 收尾速度时阻力等于重力。
          explain: $v_T = \sqrt{2 \times 80 \times 9.8 / (1 \times 1.2 \times 0.8)} = \sqrt{1568/0.96} \approx \sqrt{1633} \approx 40.4\text{ m/s}$。
      - card:
          title: 在加速的车厢里：惯性力
          body: |
            公交车突然加速，你觉得被往后推了一把，可是并没有谁推你。站在地面（惯性参考系）看，是车加速了，你的身体由于惯性还想保持原来的速度。

            如果坚持在加速的车厢里用 $\Sigma F = ma$，就要在每个物体上添一个假想的力 $-m\vec a_0$（$\vec a_0$ 是车厢的加速度），叫**惯性力（inertial force）**。加速的参考系叫非惯性参考系。转弯时乘客感到的“离心力”，就是转动参考系里的惯性力；在地面上看，并不存在这样一个向外的力。
      - item:
          id: inertial-force-angle
          type: choice
          prompt: 车厢以加速度 $a$ 向前加速，车顶用细线挂着一个小球，小球相对车厢静止时细线偏离竖直方向。细线往哪边偏？
          options:
            - text: 往后偏，偏角满足 $\tan\theta = a/g$
              correct: true
            - text: 往前偏，偏角满足 $\tan\theta = a/g$
              why: 小球要随车向前加速，需要张力有一个向前的分量，所以线的上端（悬挂点）在小球前方，小球落在后面
            - text: 仍然竖直，因为小球相对车厢静止
              why: 小球相对车厢静止，但相对地面在加速，需要一个水平的合力，线必须倾斜
          explain: 地面上看：张力的水平分量 $T\sin\theta = ma$，竖直分量 $T\cos\theta = mg$，相除得 $\tan\theta = a/g$；小球落在悬挂点后方。车厢里看：惯性力 $ma$ 向后，和重力、张力平衡，结论相同。
      - item:
          id: centrifugal-misconception
          type: choice
          prompt: 汽车向左急转弯时，乘客觉得被甩向右侧车门。站在路边看，正确的解释是什么？
          options:
            - text: 乘客由于惯性要保持直线运动，车门向左推乘客，使他跟着转弯
              correct: true
            - text: 有一个向右的离心力把乘客推向车门
              why: 在地面这个惯性参考系里不存在向外的力；“离心力”只是在转动的车里描述时添上的惯性力
            - text: 车门对乘客的力向右
              why: 车门推乘客的力指向弯道内侧（向左），正是这个力提供了乘客的向心力
          explain: 地面上看，乘客想沿直线走，车身向左拐，车门挡住他并向左推他，这个推力提供向心力。“被甩出去”的感觉来自在车这个转动参考系里观察。

  # ==== 动量与角动量守恒 ====
  - id: momentum-impulse
    chapter: 动量与角动量守恒
    title: 动量、冲量和动量守恒
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 从同样高度掉下一个鸡蛋，一次落在水泥地上，一次落在厚海绵垫上。鸡蛋落在海绵上不容易碎，主要原因是什么？
          options:
            - text: 海绵让鸡蛋停下来的时间变长，受到的平均力变小
              correct: true
            - text: 落在海绵上时，鸡蛋的速度变化更小
              why: 两次都是从同样的速度变成 0，速度变化一样大；不同的是停下来所用的时间
            - text: 海绵对鸡蛋没有作用力
              why: 海绵必须对鸡蛋施力，鸡蛋才会停下来
          explain: 两次鸡蛋的速度都是从同一个值变成 0。海绵把这个变化拉长到更长的时间里完成，平均力就小了。这一课用动量和冲量说清这件事。
      - card:
          title: 动量
          body: |
            质量乘速度叫**动量（momentum）**：

            $$\vec p = m\vec v$$

            动量是矢量，单位 kg·m/s。牛顿当年写下的第二定律其实是“合力等于动量的变化率”：

            $$\Sigma\vec F = \frac{d\vec p}{dt}$$

            质量不变时 $d\vec p/dt = m\,d\vec v/dt = m\vec a$，就是 $\Sigma\vec F = m\vec a$。质量会变的物体（如喷气的火箭）要用 $d\vec p/dt$ 这个写法。
      - item:
          id: momentum-value
          type: number
          prompt: 一个 0.15 kg 的棒球以 40 m/s 的速度飞行。它的动量大小是多少 kg·m/s？
          answer: 6
          unit: kg·m/s
          hint: 动量等于质量乘速度。
          explain: $p = mv = 0.15 \times 40 = 6\text{ kg·m/s}$。
      - card:
          title: 冲量和动量定理
          body: |
            力在一段时间内的累积效果叫**冲量（impulse）**。力不变时 $\vec J = \vec F\Delta t$；力随时间变化时，冲量等于 $F$–$t$ 图下的面积。单位 N·s。

            由 $\Sigma\vec F = d\vec p/dt$ 得**动量定理（impulse-momentum theorem）**：

            $$\vec J = \Delta\vec p$$

            同样的动量变化，作用时间越长，平均力 $\bar F = \Delta p / \Delta t$ 越小。汽车安全气囊、跳远的沙坑、海绵垫都是这个道理。
      - item:
          id: egg-force
          type: number
          prompt: 一个 0.06 kg 的鸡蛋以 5 m/s 的速度落到海绵垫上，经过 0.1 秒停下。这段时间里海绵对鸡蛋的平均作用力是多少牛顿？（不计这段时间内的重力）
          answer: 3
          unit: N
          hint: 动量变化了多少？用了多长时间？
          explain: $\Delta p = 0.06 \times 5 = 0.3\text{ kg·m/s}$，$\bar F = 0.3 / 0.1 = 3\text{ N}$。若落在水泥地上 0.002 秒停下，平均力就是 150 N。
      - item:
          id: bounce-impulse
          type: number
          prompt: 一个 0.5 kg 的球以 6 m/s 的速度水平撞墙，以 4 m/s 的速度沿原路弹回。墙对球的冲量大小是多少 N·s？
          answer: 5
          unit: N·s
          hint: 取一个正方向，弹回后的速度要带负号。
          explain: 取原来的运动方向为正：$\Delta p = 0.5 \times (-4) - 0.5 \times 6 = -5\text{ kg·m/s}$。冲量大小 5 N·s，方向与原来的运动方向相反。
      - card:
          title: 动量守恒
          body: |
            把几个物体看成一个系统。系统内物体之间的力叫内力，外面物体施加的力叫外力。由第三定律，内力总是成对出现、大小相等方向相反，它们的冲量相加为 0。

            所以：系统所受合外力为 0 时，总动量不变。这就是**动量守恒定律（conservation of linear momentum）**：

            $$\vec p_{1} + \vec p_{2} + \cdots = \text{常量}$$

            碰撞、爆炸时内力很大、时间很短，重力、摩擦这些外力的冲量相比可以忽略，所以碰撞前后动量近似守恒。
      - item:
          id: skater-push
          type: number
          prompt: 冰面上，一个 60 kg 的人和一个 40 kg 的人原来都静止，互相推了一下后分开，60 kg 的人以 2 m/s 向东滑去。40 kg 的人的速度是多少？（向东为正，单位 m/s）
          answer: -3
          unit: m/s
          hint: 推之前两人的总动量是多少？
          explain: 推之前总动量为 0，推之后仍为 0：$60 \times 2 + 40 v = 0$，$v = -3\text{ m/s}$，即以 3 m/s 向西滑去。
      - item:
          id: when-conserved
          type: choice
          prompt: 下列哪种情况中，所说系统的总动量守恒（或近似守恒）？
          options:
            - text: 两个冰球在光滑冰面上相撞，以两个冰球为系统
              correct: true
            - text: 汽车在路上加速，以汽车为系统
              why: 地面给车轮向前的摩擦力是外力，汽车动量在增加
            - text: 苹果从树上落下，以苹果为系统
              why: 重力是外力，苹果的动量一直在增加；如果把地球也算进系统，总动量才守恒
          explain: 动量守恒的条件是合外力为 0（或外力冲量可以忽略）。光滑冰面上，竖直方向重力和支持力平衡，水平方向没有外力。

  - id: collisions
    chapter: 动量与角动量守恒
    title: 碰撞的类型
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一辆小车撞上另一辆静止的小车并粘在一起，车身被撞瘪、发热。碰撞前后，两车的总动量怎样变化？两车因为运动而具有的能量呢？
          options:
            - text: 总动量不变，运动的能量减少
              correct: true
            - text: 总动量和运动的能量都不变
              why: 车身变形、发热都要消耗能量，这些能量来自两车的运动
            - text: 总动量减少，运动的能量不变
              why: 碰撞时外力冲量可以忽略，总动量守恒
          explain: 碰撞时动量守恒，但运动的能量不一定守恒，粘在一起时损失得最多。这一课先给这种能量起名字，再按它是否守恒给碰撞分类。
      - card:
          title: 动能
          body: |
            运动的物体能做功，比如飞来的锤子能把钉子敲进木头。物体因运动而具有的能量叫**动能（kinetic energy）**：

            $$K = \tfrac12 m v^2$$

            动能是标量，没有方向，总是 $\ge 0$。单位是焦耳（J），$1\text{ J} = 1\text{ kg·m}^2/\text{s}^2$。

            动量和动能都由质量和速度算出，但不一样：动量是矢量，两个相向运动的物体动量可以相互抵消；动能都是正数，只会相加。
      - item:
          id: ke-value
          type: number
          prompt: 一个 2 kg 的小车以 3 m/s 的速度运动。它的动能是多少焦耳？
          answer: 9
          unit: J
          hint: 动能和速度的几次方成正比？
          explain: $K = \tfrac12 \times 2 \times 3^2 = 9\text{ J}$。
      - card:
          title: 三类碰撞
          body: |
            碰撞时动量总是守恒（外力冲量可忽略），按动能分三类：

            - **弹性碰撞（elastic collision）**：总动能也守恒，如两个钢球或台球相撞（近似）。
            - 非弹性碰撞（介于前两类之间）：总动能减少，一部分变成形变、声音和热。
            - **完全非弹性碰撞（perfectly inelastic collision）**：碰后两物体粘在一起、以同一速度运动，动能损失最多。

            粘在一起时只有一个未知速度，由动量守恒直接求出：$m_1v_1 + m_2v_2 = (m_1 + m_2)v$。
      - card:
          title: 例题：两车相撞粘在一起
          body: 2 kg 的小车以 3 m/s 撞上静止的 1 kg 小车并粘在一起。求碰后速度和损失的动能。
          reveal:
            - title: 第 1 步：动量守恒求末速度
              body: $2 \times 3 + 1 \times 0 = (2 + 1)v$，$v = 2\text{ m/s}$。
            - title: 第 2 步：分别算碰前碰后的动能
              body: 碰前 $\tfrac12 \times 2 \times 3^2 = 9\text{ J}$；碰后 $\tfrac12 \times 3 \times 2^2 = 6\text{ J}$。
            - title: 第 3 步：相减并解释
              body: 损失 $9 - 6 = 3\text{ J}$，变成了车身的形变和热。动量守恒是因为碰撞时间内外力冲量可以忽略；动能不守恒是因为两车之间的内力做的总功不为 0。
      - item:
          id: inelastic-loss
          type: number
          prompt: 一个 3 kg 的物块以 4 m/s 的速度撞上静止的 1 kg 物块并粘在一起，在光滑水平面上运动。碰撞损失了多少焦耳动能？
          answer: 6
          unit: J
          hint: 先用动量守恒求共同速度，再分别算碰前碰后的动能。
          explain: 共同速度 $v = 3 \times 4 / 4 = 3\text{ m/s}$。碰前 $\tfrac12 \times 3 \times 16 = 24\text{ J}$，碰后 $\tfrac12 \times 4 \times 9 = 18\text{ J}$，损失 6 J。
      - card:
          title: 一维弹性碰撞
          body: |
            弹性碰撞要同时满足动量守恒和动能守恒，两个方程解两个未知速度。$m_1$ 以 $v_1$ 撞静止的 $m_2$，结果是

            $$v_1' = \frac{m_1 - m_2}{m_1 + m_2}v_1,\qquad v_2' = \frac{2m_1}{m_1 + m_2}v_1$$

            两个特例：质量相等时 $v_1' = 0$、$v_2' = v_1$，两球交换速度（台球正碰就是这样）；轻球撞很重的球时，轻球几乎以原速弹回。
      - item:
          id: elastic-equal
          type: choice
          prompt: 两个质量相同的台球在光滑桌面上正碰，A 以 2 m/s 撞静止的 B，碰撞是弹性的。碰后两球的速度是多少？
          options:
            - text: A 停下，B 以 2 m/s 前进
              correct: true
            - text: A、B 都以 1 m/s 前进
              why: 这满足动量守恒，但动能从 $\tfrac12 m \cdot 4$ 变成 $\tfrac12 \cdot 2m \cdot 1$，减少了一半，这是完全非弹性碰撞的结果
            - text: A 以 2 m/s 弹回，B 静止
              why: 这样动量从 $+2m$ 变成 $-2m$，动量不守恒
          explain: 代入公式 $v_1' = 0$、$v_2' = v_1$。可以检验：动量 $2m = 0 + 2m$，动能 $\tfrac12 m \cdot 4 = \tfrac12 m \cdot 4$，都守恒。
      - card:
          title: 二维碰撞
          body: |
            斜着相撞时，动量守恒对 $x$、$y$ 两个方向分别成立：

            $$\Sigma p_x \text{ 不变},\qquad \Sigma p_y \text{ 不变}$$

            例：1 kg 的冰球以 4 m/s 向东运动，和 1 kg、以 3 m/s 向北运动的冰球相撞后粘在一起。$x$ 方向：$1 \times 4 = 2v_x$，$v_x = 2$；$y$ 方向：$1 \times 3 = 2v_y$，$v_y = 1.5$。合速度大小 $\sqrt{2^2 + 1.5^2} = 2.5\text{ m/s}$。
      - item:
          id: two-d-collision
          type: number
          prompt: 一辆 1500 kg 的车以 20 m/s 向东行驶，在路口和一辆 2500 kg、以 12 m/s 向北行驶的车相撞并卡在一起。碰后瞬间两车的共同速度大小是多少 m/s？（保留一位小数）
          answer: 10.6
          tolerance: 0.05
          unit: m/s
          hint: 东西方向和南北方向各自动量守恒。
          explain: $x$ 方向：$1500 \times 20 = 4000 v_x$，$v_x = 7.5$；$y$ 方向：$2500 \times 12 = 4000 v_y$，$v_y = 7.5$。合速度 $\sqrt{7.5^2 + 7.5^2} \approx 10.6\text{ m/s}$，方向东北。

  - id: center-of-mass-rocket
    chapter: 动量与角动量守恒
    title: 质心和火箭推进
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一枚烟花沿抛物线飞行，在最高点炸成很多碎片向四面八方飞散。不计空气阻力，所有碎片“合起来的平均位置”接下来怎样运动？
          options:
            - text: 继续沿原来那条抛物线运动
              correct: true
            - text: 停在爆炸点
              why: 爆炸的力是内力，不改变系统的总动量，平均位置仍按原来的方式运动
            - text: 竖直落下
              why: 爆炸前烟花有水平速度，内力不会把总的水平动量变成 0
          explain: 爆炸力是碎片之间的内力，外力只有重力。所以碎片的“平均位置”（质心）还沿原来的抛物线走。
      - card:
          title: 质心
          body: |
            一组质点的**质心（center of mass）**是按质量加权的平均位置：

            $$x_{cm} = \frac{m_1x_1 + m_2x_2 + \cdots}{m_1 + m_2 + \cdots}$$

            $y$、$z$ 坐标同样算。质量均匀、形状对称的物体，质心就在几何中心。

            质心的意义在于：系统的总动量等于总质量乘质心速度，$\vec P = M\vec v_{cm}$，所以 $\Sigma\vec F_{\text{外}} = M\vec a_{cm}$。内力再复杂，质心都像一个集中了全部质量、只受外力的质点那样运动。
      - item:
          id: cm-position
          type: number
          prompt: 一根轻杆上，$x = 0$ 处固定 2 kg 的小球，$x = 3\text{ m}$ 处固定 1 kg 的小球。系统的质心在 $x$ 等于多少米处？
          answer: 1
          unit: m
          hint: 按质量加权平均。
          explain: $x_{cm} = (2 \times 0 + 1 \times 3)/(2 + 1) = 1\text{ m}$，离重的那个球更近。
      - item:
          id: boat-walk
          type: number
          prompt: 一条 120 kg 的小船静止在平静的水面上，船上一个 60 kg 的人从船尾走到船头，相对船走了 3 米。不计水的阻力，船相对岸后退了多少米？
          answer: 1
          unit: m
          hint: 没有水平外力，人和船组成的系统质心在水平方向动不动？
          explain: 质心不动：设船后退 $d$，人相对岸前进 $3 - d$。$60(3 - d) = 120d$，$d = 1\text{ m}$。
      - card:
          title: 火箭推进
          body: |
            太空里没有可以“推”的东西，火箭靠向后喷出气体前进。设火箭质量 $m$，喷出的气体相对火箭的速度是 $u$（排气速度）。在短时间 $dt$ 里喷出质量 $dm_{\text{气}}$，由动量守恒，火箭获得的速度增量 $dv = u\,dm_{\text{气}}/m$。

            把这些小增量从初质量 $m_0$ 累加到末质量 $m$，相当于求 $1/m$ 曲线下的面积；因为 $\ln m$ 的导数是 $1/m$，这块面积是 $\ln(m_0/m)$，结果是火箭方程：

            $$\Delta v = u\ln\frac{m_0}{m}$$

            $\ln$ 是自然对数。速度增量只取决于排气速度和质量比，与燃料烧得快慢无关。
      - item:
          id: rocket-eq
          type: number
          prompt: 一枚火箭的排气速度为 3000 m/s，点火时总质量是燃料烧完后质量的 $e^2$ 倍（约 7.39 倍）。不计重力和空气阻力，燃料烧完时火箭的速度增加了多少 m/s？
          answer: 6000
          unit: m/s
          hint: 质量比 $m_0/m$ 是多少？自然对数和 $e$ 的幂是什么关系？
          explain: $\Delta v = u\ln(m_0/m) = 3000 \times \ln(e^2) = 3000 \times 2 = 6000\text{ m/s}$。
      - item:
          id: rocket-push
          type: choice
          prompt: 关于火箭在真空中加速的原因，下面哪个说法对？
          options:
            - text: 火箭把燃气向后推，燃气把火箭向前推
              correct: true
            - text: 喷出的燃气推开了后面的空气，空气反推火箭
              why: 真空里没有空气，火箭照样能加速；推火箭的是燃气本身
            - text: 真空里火箭不能加速，只能靠惯性飞行
              why: 喷气时燃气和火箭之间的作用力与反作用力在真空里依然存在
          explain: 第三定律：火箭对燃气施加向后的力，燃气对火箭施加向前的力。这不需要外面有空气。

  - id: angular-momentum-particle
    chapter: 动量与角动量守恒
    title: 力矩、角动量和它的守恒
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 推门时，你在离门轴远的门把手处推，和在靠近门轴的地方推，哪个更容易把门推开？
          options:
            - text: 在离门轴远的地方推更容易
              correct: true
            - text: 一样容易，只要用的力一样大
              why: 转动的效果不只看力的大小，还看力离转轴多远
            - text: 在靠近门轴的地方推更容易，因为离支点近
              why: 离转轴越近，同样的力产生的转动效果越小，你会感到门很“沉”
          explain: 让物体转起来，力的大小和力离转轴的距离都重要。这个“转动效果”叫力矩，这一课从它讲起。
      - card:
          title: 力矩
          body: |
            力使物体绕某点转动的效果叫**力矩（torque）**：

            $$\tau = rF\sin\theta$$

            $r$ 是从转轴到力的作用点的距离，$\theta$ 是 $\vec r$ 和 $\vec F$ 的夹角。$r\sin\theta$ 叫力臂，是转轴到力的作用线的垂直距离。单位 N·m。

            力沿着 $\vec r$ 的方向推（$\theta = 0$），力臂为 0，门不会转；垂直于门推（$\theta = 90°$）效果最大。习惯上逆时针转动的力矩取正，顺时针取负。
      - item:
          id: torque-value
          type: number
          prompt: 用扳手拧螺母，手离螺母中心 0.25 米，用 40 N 的力，力的方向和扳手成 30°。力矩是多少 N·m？
          answer: 5
          unit: N·m
          hint: 力矩等于距离、力和哪个角的正弦相乘？
          explain: $\tau = rF\sin\theta = 0.25 \times 40 \times \sin 30° = 0.25 \times 40 \times 0.5 = 5\text{ N·m}$。
      - card:
          title: 质点的角动量
          body: |
            一个质点相对某点 O 的**角动量（angular momentum）**是

            $$L = rp\sin\theta = rmv\sin\theta$$

            $r$ 是 O 到质点的距离，$\theta$ 是位置矢量和动量的夹角。完整的写法是矢量叉乘 $\vec L = \vec r \times \vec p$：方向垂直于 $\vec r$ 和 $\vec p$ 所在的平面，用右手定则判断（四指从 $\vec r$ 转向 $\vec p$，拇指指向 $\vec L$）。

            绕半径 $r$ 的圆以速率 $v$ 运动的质点，$\theta = 90°$，$L = mvr$。
      - item:
          id: l-circular
          type: number
          prompt: 一个 0.2 kg 的小球用 0.5 米长的绳子拴着，以 4 m/s 的速率在水平面上做圆周运动。它对圆心的角动量是多少 kg·m²/s？
          answer: 0.4
          unit: kg·m²/s
          hint: 圆周运动中速度和半径是什么夹角？
          explain: 速度沿切线，和半径垂直，$L = mvr = 0.2 \times 4 \times 0.5 = 0.4\text{ kg·m}^2/\text{s}$。
      - card:
          title: 角动量守恒
          body: |
            和 $\Sigma\vec F = d\vec p/dt$ 对应，转动有

            $$\Sigma\tau = \frac{dL}{dt}$$

            合外力矩为 0 时，角动量不变，这是**角动量守恒定律（conservation of angular momentum）**。

            行星绕太阳运动时，引力始终指向太阳（这样的力叫中心力），对太阳的力矩为 0，所以行星对太阳的角动量守恒：离太阳近时 $r$ 小、$v$ 就大。这正是开普勒第二定律：行星和太阳的连线在相等时间内扫过相等的面积。
      - item:
          id: planet-speed
          type: number
          prompt: 一颗彗星绕太阳运动，在远日点离太阳 $6 \times 10^{12}$ 米，速率 1000 m/s。在近日点离太阳 $1.5 \times 10^{11}$ 米。它在近日点的速率是多少 m/s？（远日点和近日点处速度都与连线垂直）
          answer: 40000
          unit: m/s
          hint: 引力对太阳的力矩为 0，什么量守恒？
          explain: 角动量守恒，$m v_1 r_1 = m v_2 r_2$：$v_2 = 1000 \times 6 \times 10^{12} / (1.5 \times 10^{11}) = 40000\text{ m/s}$。
      - item:
          id: string-pull
          type: choice
          prompt: 光滑水平桌面上，小球用穿过桌面中心小孔的绳子拴着做圆周运动。在桌下慢慢把绳子往下拉，使半径变成原来的一半。小球的速率怎样变化？
          options:
            - text: 变成原来的 2 倍
              correct: true
            - text: 不变，因为拉绳子的力沿半径方向，不做功
              why: 拉绳时小球一边绕一边往小孔靠近，速度斜向内；拉力指向小孔，和速度的夹角小于 90°，拉力做正功，小球变快。拉力对小孔的力矩为 0，不变的是角动量
            - text: 变成原来的 1/2
              why: 绳子的拉力始终指向小孔，力矩为 0，角动量 $mvr$ 守恒，$r$ 减半时 $v$ 加倍
          explain: 拉力指向小孔，对小孔的力矩为 0，角动量 $mvr$ 守恒。$r$ 变成一半，$v$ 变成 2 倍。

  # ==== 功与能量 ====
  - id: work-energy
    chapter: 功与能量
    title: 功、动能定理和功率
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你提着一桶水在水平走廊里匀速走了 20 米。按物理里“功”的定义，你提水的力对水桶做了多少功？
          options:
            - text: 0 J
              correct: true
            - text: 提水的力乘以 20 米
              why: 提水的力竖直向上，位移水平，两者垂直；力在位移方向上的分量是 0
            - text: 很多，因为手臂很累
              why: 累是肌肉内部在消耗能量；按物理定义，力和位移垂直时不做功
          explain: 物理里的功是“力在位移方向上的分量乘位移”。提水的力和水平位移垂直，所以做功为 0。
      - card:
          title: 功
          body: |
            恒力 $\vec F$ 使物体发生位移 $\vec d$，力做的**功（work）**是

            $$W = Fd\cos\theta$$

            $\theta$ 是力和位移的夹角。用分量写是 $W = F_xd_x + F_yd_y$：两个矢量对应分量相乘再相加得到一个数，这种乘法叫点乘，记作 $\vec F\cdot\vec d$。功是标量，单位焦耳（J），$1\text{ J} = 1\text{ N·m}$。

            $\theta < 90°$ 时功为正，力在帮物体运动；$\theta = 90°$ 时功为 0；$\theta > 90°$ 时功为负，如摩擦力对滑动物体做负功。
      - item:
          id: work-angle
          type: number
          prompt: 用 50 N 的力沿与水平方向成 60° 的方向拉雪橇，雪橇在水平地面上前进了 10 米。拉力做了多少焦耳的功？
          answer: 250
          unit: J
          hint: 只有沿位移方向的分量做功。
          explain: $W = Fd\cos 60° = 50 \times 10 \times 0.5 = 250\text{ J}$。
      - card:
          title: 力会变时：图像下的面积
          body: |
            力随位置变化时，把位移分成很多小段，每段近似看成恒力，功是各段 $F\,\Delta x$ 之和。小段无限细分后，功等于 $F$–$x$ 图下的面积，写成积分 $W = \int F\,dx$。

            例：拉伸弹簧，拉力 $F = kx$ 从 0 均匀增大。$F$–$x$ 图是一条过原点的直线，从 $x = 0$ 拉到 $x$，图下是一个三角形：

            $$W = \tfrac12 \cdot x \cdot kx = \tfrac12 kx^2$$
      - item:
          id: spring-work
          type: number
          prompt: 一根劲度系数 200 N/m 的弹簧，从原长缓慢拉长 0.1 米。拉力做了多少焦耳的功？
          answer: 1
          unit: J
          hint: 拉力从 0 增大到 kx，$F$–$x$ 图下是什么形状？
          explain: $W = \tfrac12 kx^2 = \tfrac12 \times 200 \times 0.01 = 1\text{ J}$。
      - card:
          title: 动能定理
          body: |
            合力对物体做的总功，等于物体动能的变化，这叫**动能定理（work-energy theorem）**：

            $$W_{\text{合}} = \Delta K = \tfrac12 mv_2^2 - \tfrac12 mv_1^2$$

            恒力时可以这样看出来：$W = F\Delta x = ma\Delta x$，而匀加速有 $v_2^2 - v_1^2 = 2a\Delta x$，代入就是 $\tfrac12 m(v_2^2 - v_1^2)$。

            动能定理不需要知道过程中加速度怎么变，只要知道各个力做的功，适合求速度。
      - item:
          id: wet-theorem
          type: number
          prompt: 一个 2 kg 的箱子以 3 m/s 的速度在水平面上滑行，受到 4 N 的动摩擦力，最后停下。它滑行了多少米？
          answer: 2.25
          unit: m
          hint: 摩擦力做的功等于什么的变化？
          explain: 摩擦力做功 $-4d$，动能从 $\tfrac12 \times 2 \times 9 = 9\text{ J}$ 变成 0：$-4d = 0 - 9$，$d = 2.25\text{ m}$。
      - card:
          title: 功率
          body: |
            做功的快慢叫**功率（power）**：

            $$P = \frac{dW}{dt}$$

            单位瓦特（W），$1\text{ W} = 1\text{ J/s}$。恒力推着物体以速度 $v$ 运动时，$P = Fv\cos\theta$，力和速度同向时 $P = Fv$。

            同样的发动机功率，牵引力和速度此消彼长：汽车爬坡需要大牵引力，所以挂低速挡。电费账单上的“度”是千瓦时：$1\text{ kW·h} = 1000\text{ W} \times 3600\text{ s} = 3.6 \times 10^6\text{ J}$。
      - item:
          id: power-car
          type: number
          prompt: 一辆汽车以 25 m/s 的速度在平直公路上匀速行驶，所受阻力为 800 N。发动机的输出功率是多少千瓦？
          answer: 20
          unit: kW
          hint: 匀速行驶时牵引力和阻力是什么关系？
          explain: 匀速时牵引力等于阻力 800 N，$P = Fv = 800 \times 25 = 20000\text{ W} = 20\text{ kW}$。
      - item:
          id: work-sign
          type: choice
          prompt: 一个箱子沿斜面滑下。下列哪个力对箱子做负功？
          options:
            - text: 斜面对箱子的摩擦力
              correct: true
            - text: 重力
              why: 箱子向下移动，重力向下，夹角小于 90°，重力做正功
            - text: 斜面对箱子的支持力
              why: 支持力垂直斜面，位移沿斜面，两者垂直，支持力不做功
          explain: 摩擦力沿斜面向上，位移沿斜面向下，夹角 180°，做负功；它把箱子的一部分动能变成热。

  - id: potential-conservation
    chapter: 功与能量
    title: 势能和能量守恒
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 两个同样的小球从同一高度静止释放，一个沿陡的光滑滑梯滑下，一个沿缓的光滑滑梯滑下，滑梯底端在同一高度。到达底端时哪个更快？
          options:
            - text: 一样快
              correct: true
            - text: 陡滑梯上的更快，因为加速度大
              why: 陡的加速度大但路程短，缓的加速度小但路程长；到底端的速度只由下降的高度决定
            - text: 缓滑梯上的更快，因为滑的路更长
              why: 路长也不会多得到速度；没有摩擦时，速度只由下降的高度决定
          explain: 没有摩擦时，速度只取决于下降了多少高度，和路径无关。这一课用势能解释为什么。
      - card:
          title: 势能和保守力
          body: |
            把物体举高 $h$，重力做功 $-mgh$；物体落回原处，重力做功 $+mgh$。重力做的功只取决于起点和终点的高度差，和走哪条路无关。这样的力叫**保守力（conservative force）**，弹簧的弹力也是。

            对保守力，可以定义**势能（potential energy）** $U$，使保守力做的功等于势能的减少：$W = -\Delta U$。

            - 重力势能 $U = mgh$（$h$ 从你选的零点量起）；
            - 弹性势能 $U = \tfrac12 kx^2$。
      - card:
          title: 非保守力
          body: |
            摩擦力做的功和路径有关：把箱子从 A 推到 B，绕远路时摩擦力做的负功更多。这样的力叫**非保守力（non-conservative force）**。

            判断方法：沿任意闭合路径走一圈回到起点，保守力做的总功为 0；摩擦力每一段都做负功，一圈下来总功小于 0。

            非保守力没有对应的势能。摩擦力做的负功把机械能变成热（物体和接触面变热），不能再自动变回来。
      - item:
          id: conservative-check
          type: choice
          prompt: 下列哪个力是非保守力？
          options:
            - text: 地面对滑动箱子的动摩擦力
              correct: true
            - text: 重力
              why: 重力做功只取决于高度差，沿闭合路径做功为 0，是保守力
            - text: 理想弹簧的弹力
              why: 弹力做功只取决于起止的伸长量，等于 $\tfrac12 kx_1^2 - \tfrac12 kx_2^2$，是保守力
          explain: 动摩擦力总和相对运动方向相反，走得越远做的负功越多，与路径有关，是非保守力。
      - card:
          title: 机械能守恒
          body: |
            动能和势能之和叫**机械能（mechanical energy）**：$E = K + U$。

            由动能定理，$W_{\text{保守}} + W_{\text{非保守}} = \Delta K$，又 $W_{\text{保守}} = -\Delta U$，所以

            $$W_{\text{非保守}} = \Delta K + \Delta U = \Delta E$$

            只有保守力做功时，$\Delta E = 0$，机械能不变，这就是**机械能守恒定律（conservation of mechanical energy）**。有摩擦时，机械能的减少量等于摩擦力做功的大小，这部分变成了热，总能量仍然守恒。
      - item:
          id: slide-speed
          type: number
          prompt: 一个小孩从高 5 米的光滑滑梯顶端由静止滑下，$g = 9.8\text{ m/s}^2$。到达底端时速度是多少 m/s？（保留一位小数）
          answer: 9.9
          tolerance: 0.05
          unit: m/s
          hint: 重力势能的减少变成了什么？
          explain: $mgh = \tfrac12 mv^2$，$v = \sqrt{2gh} = \sqrt{98} \approx 9.9\text{ m/s}$，与滑梯的形状无关。
      - card:
          title: 例题：有摩擦时机械能去了哪里
          body: 2 kg 的物块从 3 米高的斜面顶端由静止滑下，到底端时速度为 6 m/s（$g = 9.8\text{ m/s}^2$）。求摩擦力做的功。
          reveal:
            - title: 第 1 步：算初、末机械能
              body: 取底端为势能零点。初态 $E_1 = mgh = 2 \times 9.8 \times 3 = 58.8\text{ J}$；末态 $E_2 = \tfrac12 \times 2 \times 36 = 36\text{ J}$。
            - title: 第 2 步：机械能的变化等于非保守力做的功
              body: $W_f = E_2 - E_1 = 36 - 58.8 = -22.8\text{ J}$。
            - title: 第 3 步：解释
              body: 摩擦力做了 22.8 J 的负功，这些能量变成了物块和斜面的热。总能量守恒，机械能不守恒。
      - item:
          id: spring-launch
          type: number
          prompt: 一根劲度系数 800 N/m 的弹簧被压缩 0.1 米，把一个 0.5 kg 的小球沿光滑水平面弹出。小球离开弹簧时的速度是多少 m/s？
          answer: 4
          unit: m/s
          hint: 弹性势能全部变成了什么？
          explain: $\tfrac12 kx^2 = \tfrac12 mv^2$：$\tfrac12 \times 800 \times 0.01 = 4\text{ J} = \tfrac12 \times 0.5 \times v^2$，$v = 4\text{ m/s}$。
      - card:
          title: 势能曲线、平衡和能源
          body: |
            一维时，保守力等于势能曲线斜率的相反数：$F = -dU/dx$。势能曲线的最低点 $dU/dx = 0$，力为 0，稍微偏离后力把物体推回来，叫**稳定平衡（stable equilibrium）**；曲线的最高点也是平衡点，但稍微偏离就会越跑越远，叫不稳定平衡。

            给定机械能 $E$ 的物体只能出现在 $U(x) \le E$ 的地方，因为 $K = E - U \ge 0$。

            人类使用的能源，本质上都是把某种储存的能量转换成可用的形式：化石燃料和电池储存化学能，水电站利用水的重力势能，风能和太阳能来自太阳辐射。
      - item:
          id: force-from-u
          type: number
          prompt: 一个质点的势能 $U(x) = 3x^2 - 12x$（焦耳，$x$ 以米计）。它在哪个位置受力为 0？（填 $x$ 的值，单位 m）
          answer: 2
          unit: m
          hint: 力和势能曲线的斜率是什么关系？
          explain: $F = -dU/dx = -(6x - 12)$，令 $F = 0$ 得 $x = 2\text{ m}$。这里 $U$ 取最小值，是稳定平衡位置。

  # ==== 刚体转动 ====
  - id: rotation-kinematics
    chapter: 刚体转动
    title: 角速度、角加速度和线量
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 旋转木马匀速转动时，坐在最外圈的小孩和坐在靠近中心的小孩相比，谁的速度更大？
          options:
            - text: 外圈的小孩速度更大，但两人转一圈的时间一样
              correct: true
            - text: 一样大，因为两人在同一个木马上
              why: 两人转一圈用的时间相同，但外圈的小孩一圈走的路更长，所以速度更大
            - text: 内圈的小孩速度更大，因为离中心近转得快
              why: 两人每秒转过的角度相同，内圈走的圆周更短，速度反而更小
          explain: 两人每秒转过的角度一样（角速度相同），外圈的小孩每秒走过的弧长更长（线速度更大）。这一课区分这两种量。
      - card:
          title: 刚体和转动的描述
          body: |
            形状和大小都不变的物体叫**刚体（rigid body）**。刚体绕一根固定的轴转动叫定轴转动。

            刚体上每一点都绕轴画圆，转过的角度都一样，所以用一个角度 $\theta$（单位弧度）就能描述整个刚体的位置。和直线运动一一对应：

            - **角速度（angular velocity）** $\omega = d\theta/dt$，单位 rad/s；
            - **角加速度（angular acceleration）** $\alpha = d\omega/dt$，单位 rad/s²。

            转速常用“转每分”（rpm）：$1\text{ rpm} = 2\pi/60\text{ rad/s}$。
      - item:
          id: rpm-to-rad
          type: number
          prompt: 一个电风扇的转速是 1200 转每分钟。它的角速度是多少 rad/s？（保留一位小数）
          answer: 125.7
          tolerance: 0.05
          unit: rad/s
          hint: 每秒转几圈？一圈是多少弧度？
          explain: 每秒转 $1200/60 = 20$ 圈，$\omega = 20 \times 2\pi = 40\pi \approx 125.7\text{ rad/s}$。
      - card:
          title: 角加速度不变的转动
          body: |
            角加速度 $\alpha$ 不变时，公式和匀加速直线运动完全对应（$x \to \theta$，$v \to \omega$，$a \to \alpha$）：

            $$\omega = \omega_0 + \alpha t$$
            $$\theta = \theta_0 + \omega_0 t + \tfrac12\alpha t^2$$
            $$\omega^2 = \omega_0^2 + 2\alpha(\theta - \theta_0)$$

            例：砂轮从静止开始以 $4\text{ rad/s}^2$ 加速 5 秒，$\omega = 20\text{ rad/s}$，转过 $\tfrac12 \times 4 \times 25 = 50\text{ rad}$，约 8 圈。
      - item:
          id: wheel-stop
          type: number
          prompt: 一个飞轮以 30 rad/s 转动，关掉电源后以大小 3 rad/s² 的角加速度匀减速直到停下。停下前它转过了多少弧度？
          answer: 150
          unit: rad
          hint: 不需要时间时用哪一个公式？
          explain: 由 $\omega^2 = \omega_0^2 + 2\alpha\Delta\theta$：$0 = 900 - 6\Delta\theta$，$\Delta\theta = 150\text{ rad}$，约 24 圈。
      - card:
          title: 角量和线量
          body: |
            刚体上离轴距离为 $r$ 的一点，转过角度 $\theta$ 时走过的弧长是 $s = r\theta$（$\theta$ 用弧度）。对时间求导：

            $$v = r\omega,\qquad a_t = r\alpha$$

            $v$ 是这一点的线速度，$a_t$ 是切向加速度。这一点同时有向心加速度 $a_c = v^2/r = \omega^2 r$。

            所以同一个刚体上，角速度处处相同，线速度和到轴的距离成正比：旋转木马外圈的小孩跑得最快。
      - item:
          id: rim-speed
          type: number
          prompt: 一张光盘半径 6 厘米，以 50 rad/s 的角速度转动。光盘边缘一点的线速度是多少 m/s？
          answer: 3
          unit: m/s
          hint: 先把半径换成米。
          explain: $v = r\omega = 0.06 \times 50 = 3\text{ m/s}$。
      - item:
          id: centripetal-rim
          type: number
          prompt: 一个洗衣机滚筒半径 0.25 米，脱水时角速度 40 rad/s。滚筒壁上衣服的向心加速度是多少 m/s²？
          answer: 400
          unit: m/s²
          hint: 向心加速度用角速度怎么写？
          explain: $a_c = \omega^2 r = 1600 \times 0.25 = 400\text{ m/s}^2$，约为 $g$ 的 41 倍。
      - item:
          id: same-omega
          type: choice
          prompt: 一根绕一端转动的木棒，正在加速转动。棒上中点 A 和末端 B 相比，下面哪个说法对？
          options:
            - text: 角加速度相同，B 的切向加速度是 A 的 2 倍
              correct: true
            - text: B 的角加速度是 A 的 2 倍
              why: 刚体上每一点转过的角度、角速度、角加速度都相同
            - text: 切向加速度相同，因为是同一根棒
              why: 切向加速度 $a_t = r\alpha$ 和到轴的距离成正比，B 离轴的距离是 A 的 2 倍
          explain: 同一刚体 $\alpha$ 处处相同；$a_t = r\alpha$，$r_B = 2r_A$，所以 $a_{tB} = 2a_{tA}$。

  - id: inertia-torque
    chapter: 刚体转动
    title: 转动惯量和转动定律
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 两个质量和半径都相同的轮子，一个是实心圆盘，一个是质量都集中在边缘的圆环。用同样大小的力矩让它们从静止开始转，哪个先转快？
          options:
            - text: 实心圆盘
              correct: true
            - text: 圆环
              why: 圆环的质量都离轴很远，转起来更难；同样的力矩下它的角加速度更小
            - text: 一样快，因为质量相同
              why: 转动的难易不只看质量，还看质量分布得离轴多远
          explain: 质量离轴越远，越难转起来。衡量这一点的量叫转动惯量，这一课学怎样算它和用它。
      - card:
          title: 转动动能和转动惯量
          body: |
            刚体转动时，每个质点 $m_i$ 以 $v_i = r_i\omega$ 运动，总动能

            $$K = \sum \tfrac12 m_i r_i^2\omega^2 = \tfrac12 I\omega^2,\qquad I = \sum m_i r_i^2$$

            $I$ 叫**转动惯量（moment of inertia）**，单位 kg·m²。$K = \tfrac12 I\omega^2$ 叫**转动动能（rotational kinetic energy）**，和 $\tfrac12 mv^2$ 对应：转动里 $I$ 扮演质量的角色。

            同样的质量，离轴越远 $I$ 越大。所以同一个物体绕不同的轴转，转动惯量不同。
      - item:
          id: point-masses-inertia
          type: number
          prompt: 一根质量可以忽略的轻杆长 2 米，两端各固定一个 3 kg 的小球，绕杆的中点转动。系统的转动惯量是多少 kg·m²？
          answer: 6
          unit: kg·m²
          hint: 每个小球离轴多远？
          explain: 每个小球离轴 1 米，$I = 3 \times 1^2 + 3 \times 1^2 = 6\text{ kg·m}^2$。
      - card:
          title: 常见形状的转动惯量
          body: |
            质量连续分布时，求和变成积分 $I = \int r^2\,dm$。几个常用结果（质量 $M$）：

            | 物体，转轴 | $I$ |
            |---|---|
            | 细圆环，过圆心垂直环面，半径 $R$ | $MR^2$ |
            | 均匀圆盘，过圆心垂直盘面，半径 $R$ | $\tfrac12 MR^2$ |
            | 细杆，过中点垂直杆，长 $L$ | $\tfrac{1}{12}ML^2$ |
            | 细杆，过一端垂直杆，长 $L$ | $\tfrac13 ML^2$ |
            | 均匀实心球，过球心，半径 $R$ | $\tfrac25 MR^2$ |

            **平行轴定理（parallel-axis theorem）**：绕任一轴的 $I = I_{cm} + Md^2$，$d$ 是这根轴到过质心的平行轴的距离。细杆：$\tfrac{1}{12}ML^2 + M(L/2)^2 = \tfrac13 ML^2$。
      - item:
          id: parallel-axis
          type: number
          prompt: 一个质量 2 kg、半径 0.3 米的均匀圆盘，绕一根垂直于盘面、穿过盘边缘的轴转动。它的转动惯量是多少 kg·m²？
          answer: 0.27
          unit: kg·m²
          hint: 先写出绕圆心的转动惯量，再用平行轴定理，两轴相距多远？
          explain: $I_{cm} = \tfrac12 \times 2 \times 0.09 = 0.09$，$d = 0.3$，$I = 0.09 + 2 \times 0.09 = 0.27\text{ kg·m}^2$。
      - card:
          title: 转动定律
          body: |
            对定轴转动的刚体，每个质点切向满足 $F_i = m_i a_{ti} = m_i r_i\alpha$，两边乘 $r_i$ 再求和，得**转动定律（Newton's second law for rotation）**：

            $$\Sigma\tau = I\alpha$$

            合外力矩决定角加速度，和 $\Sigma F = ma$ 一一对应。力矩的算法和前面一样：$\tau = rF\sin\theta$。

            转动中的功和功率也对应：力矩转过角度 $\Delta\theta$ 做功 $W = \tau\Delta\theta$，功率 $P = \tau\omega$；合外力矩做的功等于转动动能的变化。
      - card:
          title: 例题：圆盘、绳子和物块
          body: 质量 2 kg、半径 0.1 米的均匀圆盘可绕固定水平轴转动，边缘绕一根轻绳，绳下挂 1 kg 的物块，由静止释放（$g = 9.8\text{ m/s}^2$）。求物块的加速度、圆盘的角加速度和绳的拉力。
          reveal:
            - title: 第 1 步：分别对物块和圆盘列方程
              body: 物块（向下为正）：$mg - T = ma$。圆盘：绳拉力的力矩 $TR = I\alpha$，$I = \tfrac12 MR^2 = 0.01\text{ kg·m}^2$。
            - title: 第 2 步：用绳子不打滑把两者联系起来
              body: 绳子不打滑，物块的加速度等于圆盘边缘的切向加速度：$a = \alpha R$。代入 $T = I\alpha/R = Ia/R^2$。
            - title: 第 3 步：解方程
              body: $mg - Ia/R^2 = ma$，$a = \frac{mg}{m + I/R^2} = \frac{9.8}{1 + 1} = 4.9\text{ m/s}^2$；$\alpha = a/R = 49\text{ rad/s}^2$；$T = m(g - a) = 4.9\text{ N}$。
      - item:
          id: disk-block-tension
          type: number
          prompt: 一个质量 4 kg、半径 0.2 米的均匀圆盘可绕固定水平轴自由转动，边缘绕一根轻绳，绳下挂 2 kg 的物块，由静止释放，$g = 9.8\text{ m/s}^2$。物块的加速度是多少 m/s²？
          answer: 4.9
          unit: m/s²
          hint: 圆盘的 $I/R^2$ 等于多少千克？
          explain: $I = \tfrac12 \times 4 \times 0.04 = 0.08$，$I/R^2 = 2\text{ kg}$。$a = \frac{mg}{m + I/R^2} = \frac{2 \times 9.8}{2 + 2} = 4.9\text{ m/s}^2$。
      - item:
          id: rot-power
          type: number
          prompt: 一台电动机输出 30 N·m 的力矩，转轴以 100 rad/s 的角速度匀速转动。它的输出功率是多少瓦？
          answer: 3000
          unit: W
          hint: 转动的功率和力矩、角速度是什么关系？
          explain: $P = \tau\omega = 30 \times 100 = 3000\text{ W}$。

  - id: rolling-gyroscope
    chapter: 刚体转动
    title: 滚动、刚体的角动量和进动
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 花样滑冰运动员原地旋转时，把伸开的手臂收拢到胸前，转速会怎样变化？
          options:
            - text: 变快
              correct: true
            - text: 变慢，因为收手臂要花力气
              why: 收手臂时冰面对她几乎没有力矩，角动量不变；转动惯量变小，角速度就变大
            - text: 不变，因为没有人推她
              why: 没有外力矩时不变的是角动量 $I\omega$，不是角速度
          explain: 收拢手臂使质量靠近转轴，转动惯量变小。外力矩近似为 0，角动量 $I\omega$ 不变，所以角速度变大。
      - card:
          title: 无滑滚动
          body: |
            车轮在地面上滚而不打滑时，和地面接触的那一点瞬间是静止的。这叫**无滑滚动（rolling without slipping）**，此时质心的速度和角速度满足

            $$v_{cm} = R\omega$$

            滚动的动能 = 质心平动动能 + 绕质心的转动动能：

            $$K = \tfrac12 Mv_{cm}^2 + \tfrac12 I_{cm}\omega^2$$

            滚动时地面的静摩擦力不做功（接触点不动），所以从斜面上无滑滚下时机械能守恒。
      - item:
          id: rolling-ke-fraction
          type: number
          prompt: 一个均匀圆盘（绕中心轴的转动惯量 $\tfrac12 MR^2$）在水平地面上无滑滚动。它的转动动能占总动能的几分之几？（填小数，保留三位）
          answer: 0.333
          tolerance: 0.001
          hint: 用 $v = R\omega$ 把两部分动能都写成 $Mv^2$ 的倍数。
          explain: 平动 $\tfrac12 Mv^2$，转动 $\tfrac12 \cdot \tfrac12 MR^2 \cdot (v/R)^2 = \tfrac14 Mv^2$，总共 $\tfrac34 Mv^2$。转动占 $\tfrac14 / \tfrac34 = 1/3 \approx 0.333$。
      - card:
          title: 例题：圆盘滚下斜面
          body: 均匀圆盘从高 $h = 1.5$ 米的斜面顶端由静止无滑滚下（$g = 9.8\text{ m/s}^2$）。到底端时质心速度多大？和光滑斜面上滑下的物块比呢？
          reveal:
            - title: 第 1 步：机械能守恒，动能有两部分
              body: $Mgh = \tfrac12 Mv^2 + \tfrac12 I\omega^2 = \tfrac12 Mv^2 + \tfrac14 Mv^2 = \tfrac34 Mv^2$。
            - title: 第 2 步：解出速度
              body: $v = \sqrt{4gh/3} = \sqrt{4 \times 9.8 \times 1.5 / 3} = \sqrt{19.6} \approx 4.43\text{ m/s}$。
            - title: 第 3 步：对比光滑滑下的物块
              body: 物块 $v = \sqrt{2gh} = \sqrt{29.4} \approx 5.42\text{ m/s}$。圆盘慢一些，因为一部分势能变成了转动动能。
      - item:
          id: rolling-hoop
          type: number
          prompt: 一个细圆环（转动惯量 $MR^2$）从高 2.5 米的斜面顶端由静止无滑滚下，$g = 9.8\text{ m/s}^2$。到达底端时质心速度是多少 m/s？（保留两位小数）
          answer: 4.95
          tolerance: 0.01
          unit: m/s
          hint: 圆环的转动动能用 $v$ 表示等于多少？和平动动能比大小如何？
          explain: 转动动能 $\tfrac12 MR^2(v/R)^2 = \tfrac12 Mv^2$，总动能 $Mv^2 = Mgh$，$v = \sqrt{gh} = \sqrt{24.5} \approx 4.95\text{ m/s}$。
      - card:
          title: 刚体的角动量和守恒
          body: |
            刚体绕定轴转动时，各质点角动量 $m_ir_i^2\omega$ 相加，得

            $$L = I\omega$$

            转动定律可以写成 $\Sigma\tau = dL/dt$。合外力矩为 0 时 $I\omega$ 不变：$I_1\omega_1 = I_2\omega_2$。

            转动惯量变小，角速度就变大。滑冰运动员收臂、跳水运动员抱膝翻腾，都是这样。注意角动量守恒时转动动能 $\tfrac12 I\omega^2 = L^2/(2I)$ 会增大，多出来的能量来自运动员收臂时肌肉做的功。
      - item:
          id: skater-spin
          type: number
          prompt: 一名滑冰运动员原地旋转，转动惯量从 4 kg·m² 收臂变为 1.6 kg·m²，原来每秒转 2 圈。收臂后每秒转几圈？
          answer: 5
          unit: 圈/秒
          hint: 外力矩近似为 0，哪个量守恒？
          explain: 角动量守恒：$I_1\omega_1 = I_2\omega_2$，$\omega_2 = 4 \times 2 / 1.6 = 5$ 圈/秒。转动动能变为原来的 2.5 倍，增加的能量来自运动员收臂做的功。
      - card:
          title: 陀螺的进动
          body: |
            一个高速自转的陀螺斜着立在桌上，按理重力会让它倒下，但它的自转轴却绕着竖直方向慢慢转圈，这叫**进动（precession）**。

            原因：重力对支点有力矩 $\tau = Mgr$，方向水平。$\Sigma\vec\tau = d\vec L/dt$ 说明角动量的变化方向和力矩一致，也是水平的，于是 $\vec L$ 的大小不变、方向在水平面内转。力矩每秒把 $\vec L$ 的端点推过 $\tau$ 这么长，相当于每秒转过 $\tau/L$ 的角度，所以进动的角速度

            $$\omega_p = \frac{Mgr}{I\omega}$$

            自转越快，进动越慢。
      - item:
          id: precession-rate
          type: number
          prompt: 一个陀螺质量 0.5 kg，质心离支点 0.04 米，绕自转轴的转动惯量 $5 \times 10^{-4}\text{ kg·m}^2$，自转角速度 200 rad/s，$g = 9.8\text{ m/s}^2$。它的进动角速度是多少 rad/s？（保留两位小数）
          answer: 1.96
          tolerance: 0.005
          unit: rad/s
          hint: 进动角速度等于重力矩除以什么？
          explain: $\omega_p = \frac{Mgr}{I\omega} = \frac{0.5 \times 9.8 \times 0.04}{5 \times 10^{-4} \times 200} = \frac{0.196}{0.1} = 1.96\text{ rad/s}$。
      - item:
          id: spin-faster
          type: choice
          prompt: 把同一个陀螺转得更快一些再放到桌上，进动会怎样？
          options:
            - text: 进动变慢
              correct: true
            - text: 进动变快
              why: $\omega_p = Mgr/(I\omega)$，自转角速度 $\omega$ 在分母上，自转越快进动越慢
            - text: 进动不变，因为重力矩没变
              why: 重力矩没变，但角动量 $I\omega$ 变大了，同样的力矩只能让它转过更小的角度
          explain: 力矩决定 $\vec L$ 每秒改变多少；$L = I\omega$ 越大，同样大小的改变让它转过的角度越小，进动越慢。

  # ==== 热力学定律 ====
  - id: first-law
    chapter: 热力学定律
    title: 温度、热量、内能和热力学第一定律
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 用打气筒快速给自行车打气，打气筒的筒壁会变热。这些热主要是从哪里来的？
          options:
            - text: 你推活塞对空气做功，空气温度升高
              correct: true
            - text: 从你的手上传过去的体温
              why: 手的温度没有那么高，而且慢慢压同样多的气筒壁不会明显变热；热来自快速压缩时对气体做的功
            - text: 空气和筒壁摩擦产生的
              why: 活塞和筒壁的摩擦会贡献一点，但主要是压缩气体做的功让气体变热
          explain: 对气体做功能让它变热，给它加热也能让它变热。这一课把“做功”和“传热”放进同一个能量账本里。
      - card:
          title: 系统、状态和温度
          body: |
            选出来研究的那部分物质叫**热力学系统（thermodynamic system）**，比如气缸里的气体；其余部分叫外界。系统的状态用压强 $p$、体积 $V$、温度 $T$ 这些量描述。

            **温度（temperature）**衡量冷热：两个物体接触足够久，温度相同后冷热就不再变化，这叫热平衡。热力学中温度用开尔文（K）：$T(\text{K}) = t(°\text{C}) + 273.15$。

            分子本身的大小和分子之间的作用力都可以忽略的气体叫**理想气体（ideal gas）**，常温常压下的空气近似是理想气体。
      - card:
          title: 理想气体状态方程
          body: |
            分子数目用**物质的量（amount of substance）**计，单位摩尔（mol），1 mol 含 $N_A \approx 6.022 \times 10^{23}$ 个分子。

            理想气体的压强、体积、温度满足**理想气体状态方程（ideal gas law）**：

            $$pV = nRT$$

            $n$ 是物质的量，$R \approx 8.314\text{ J/(mol·K)}$ 是摩尔气体常数，$T$ 必须用开尔文。压强单位帕斯卡（Pa），$1\text{ Pa} = 1\text{ N/m}^2$，一个标准大气压约 $1.013 \times 10^5\text{ Pa}$。
      - item:
          id: ideal-gas-volume
          type: number
          prompt: 1 mol 理想气体在 273.15 K、101325 Pa 下占多大体积？（单位升，保留一位小数；1 升 = 0.001 m³，R = 8.314 J/(mol·K)）
          answer: 22.4
          tolerance: 0.05
          unit: L
          hint: 由 $pV = nRT$ 解出 $V$，再换算成升。
          explain: $V = nRT/p = 1 \times 8.314 \times 273.15 / 101325 \approx 0.0224\text{ m}^3 = 22.4\text{ L}$。
      - card:
          title: 功、热量和内能
          body: |
            系统内部所有分子无规则运动的动能和分子之间势能的总和叫**内能（internal energy）**，记作 $U$。理想气体分子间没有势能，内能只取决于温度。

            改变内能有两种方式：

            - 做功：气体膨胀推动活塞，对外做功 $W = \int p\,dV$，等于 $p$–$V$ 图上曲线下的面积；压强不变时 $W = p\Delta V$。
            - 传热：因温度差而传递的能量叫**热量（heat）**，记作 $Q$，系统吸热时 $Q > 0$。

            热量和功都是过程中传递的能量，不是系统“含有”的量。
      - item:
          id: isobaric-work
          type: number
          prompt: 气缸里的气体在恒定压强 $2 \times 10^5\text{ Pa}$ 下，体积从 0.01 m³ 膨胀到 0.03 m³。气体对外做了多少焦耳的功？
          answer: 4000
          unit: J
          hint: 压强不变时，功等于压强乘以什么？
          explain: $W = p\Delta V = 2 \times 10^5 \times 0.02 = 4000\text{ J}$。
      - card:
          title: 热力学第一定律
          body: |
            能量守恒用在热现象上，就是**热力学第一定律（first law of thermodynamics）**：

            $$\Delta U = Q - W$$

            $Q$ 是系统吸收的热量，$W$ 是系统对外做的功。吸热让内能增加，对外做功让内能减少。

            符号要统一：本课 $W$ 指“系统对外做的功”。有的教材用“外界对系统做的功”，写成 $\Delta U = Q + W$，两种写法意思一样，只是 $W$ 的正负约定相反。
      - item:
          id: first-law-calc
          type: number
          prompt: 一个气体系统吸收了 500 J 的热量，同时对外做了 200 J 的功。它的内能增加了多少焦耳？
          answer: 300
          unit: J
          hint: 吸收的热量里，有一部分用来对外做功了。
          explain: $\Delta U = Q - W = 500 - 200 = 300\text{ J}$。
      - item:
          id: compress-sign
          type: choice
          prompt: 外界压缩气体，对气体做了 300 J 的功，同时气体向外界放出 100 J 的热量。按 $\Delta U = Q - W$（$W$ 是气体对外做的功），各量的符号和结果是什么？
          options:
            - text: $Q = -100\text{ J}$，$W = -300\text{ J}$，$\Delta U = +200\text{ J}$
              correct: true
            - text: $Q = 100\text{ J}$，$W = 300\text{ J}$，$\Delta U = -200\text{ J}$
              why: 放热时 $Q$ 为负；外界对气体做功，气体对外做的功 $W$ 为负
            - text: $Q = -100\text{ J}$，$W = 300\text{ J}$，$\Delta U = -400\text{ J}$
              why: 气体被压缩，是外界对它做功，气体对外做的功是负的
          explain: 放热 $Q = -100$，气体对外做功 $W = -300$。$\Delta U = -100 - (-300) = +200\text{ J}$，内能增加，气体变热，这就是打气筒变热的原因。

  - id: thermo-processes
    chapter: 热力学定律
    title: 等容、等压、等温和绝热过程
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 把同样多的气体从 20 °C 加热到 30 °C，一次把它关在体积固定的钢瓶里加热，一次让它在可以自由移动的活塞下保持压强不变加热。哪次需要的热量更多？
          options:
            - text: 压强不变那次
              correct: true
            - text: 体积固定那次
              why: 体积固定时气体不做功，吸的热全部用来升温；压强不变时还要对外做功，需要更多热量
            - text: 一样多，因为温度变化相同
              why: 内能的增加一样多，但压强不变时气体膨胀对外做功，这部分也要靠吸热提供
          explain: 温度升高一样多，内能增加一样多。压强不变时气体还要膨胀做功，所以要多吸一部分热。这一课按过程分类算功和热。
      - card:
          title: 四种典型过程
          body: |
            - **等容过程（isochoric process）**：$V$ 不变，$W = 0$，$\Delta U = Q$。
            - **等压过程（isobaric process）**：$p$ 不变，$W = p\Delta V$。
            - **等温过程（isothermal process）**：$T$ 不变。理想气体内能只取决于温度，$\Delta U = 0$，所以 $Q = W$：吸的热全部用来对外做功。
            - **绝热过程（adiabatic process）**：和外界不交换热量，$Q = 0$，$\Delta U = -W$：对外做功时内能减少、温度下降。

            理想气体等温时 $pV = nRT$ 为常量，$p$–$V$ 图上是一条双曲线。
      - card:
          title: 等温膨胀的功
          body: |
            等温过程 $p = nRT/V$，功是 $p$–$V$ 图上双曲线下从 $V_1$ 到 $V_2$ 的面积。$1/V$ 曲线下的面积是 $\ln(V_2/V_1)$（因为 $\ln V$ 的导数是 $1/V$），所以

            $$W = nRT\ln\frac{V_2}{V_1}$$

            例：1 mol 理想气体在 300 K 下等温膨胀到原来的 2 倍：$W = 8.314 \times 300 \times \ln 2 \approx 1729\text{ J}$（$\ln 2 \approx 0.693$）。等温 $\Delta U = 0$，所以同时吸热 $Q = W \approx 1729\text{ J}$。
      - item:
          id: isothermal-work
          type: number
          prompt: 2 mol 理想气体在 400 K 下等温膨胀，体积从 10 升变为 30 升。气体吸收了多少焦耳热量？（R = 8.314 J/(mol·K)，取整数）
          answer: 7307
          tolerance: 1
          unit: J
          hint: 等温时内能变不变？吸的热和做的功是什么关系？
          explain: 等温 $\Delta U = 0$，$Q = W = nRT\ln(V_2/V_1) = 2 \times 8.314 \times 400 \times \ln 3 \approx 7307\text{ J}$。
      - card:
          title: 理想气体的摩尔热容
          body: |
            1 mol 物质温度升高 1 K 吸收的热量叫**摩尔热容（molar heat capacity）**。气体在等容和等压下不同：

            - 等容：$Q = nC_V\Delta T$。实验和理论都给出单原子理想气体 $C_V = \tfrac32 R$，所以它的内能 $U = \tfrac32 nRT$，且任何过程都有 $\Delta U = nC_V\Delta T$。
            - 等压：$Q = nC_p\Delta T$，多出对外做的功 $p\Delta V = nR\Delta T$，所以 $C_p = C_V + R$。

            比值 $\gamma = C_p/C_V$ 叫比热容比，单原子气体 $\gamma = 5/3$，空气（双原子）约 1.4。
      - item:
          id: isobaric-heat
          type: number
          prompt: 2 mol 单原子理想气体在压强不变的情况下温度升高 10 K。它吸收了多少焦耳热量？（R = 8.314 J/(mol·K)，保留一位小数）
          answer: 415.7
          tolerance: 0.05
          unit: J
          hint: 单原子气体的 $C_p$ 等于几倍 $R$？
          explain: $C_p = C_V + R = \tfrac52 R$。$Q = nC_p\Delta T = 2 \times 2.5 \times 8.314 \times 10 = 415.7\text{ J}$，其中 249.4 J 增加内能，166.3 J 对外做功。
      - card:
          title: 绝热过程
          body: |
            理想气体绝热膨胀或压缩时，如果过程足够慢、每一步都接近平衡，可以推出

            $$pV^{\gamma} = \text{常量},\qquad TV^{\gamma - 1} = \text{常量}$$

            因为 $\gamma > 1$，绝热线在 $p$–$V$ 图上比等温线更陡。绝热压缩时外界做的功全部变成内能，气体变热；柴油机正是靠快速压缩空气，使温度高到足以点燃喷入的燃油。
      - item:
          id: adiabatic-temp
          type: number
          prompt: 单原子理想气体（$\gamma = 5/3$）从 300 K 开始缓慢绝热压缩，体积变为原来的 1/8。压缩后温度是多少开尔文？
          answer: 1200
          unit: K
          hint: $TV^{\gamma - 1}$ 不变，$\gamma - 1$ 等于多少？
          explain: $T_2 = T_1(V_1/V_2)^{\gamma - 1} = 300 \times 8^{2/3} = 300 \times 4 = 1200\text{ K}$。
      - item:
          id: process-match
          type: match
          prompt: 把每种理想气体过程和它的特征配对（$W$ 是气体对外做的功）。
          pairs:
            - ['等容过程', '$W = 0$，吸的热全部变成内能']
            - ['等温过程', '$\Delta U = 0$，吸的热全部用来对外做功']
            - ['绝热过程', '$Q = 0$，对外做功时内能减少']
            - ['等压过程', '吸的热一部分增加内能，一部分对外做功 $p\Delta V$']
          explain: 抓住每个过程里哪个量为 0，再代入 $\Delta U = Q - W$。

  - id: heat-engines
    chapter: 热力学定律
    title: 可逆过程、热机和制冷机
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 冰箱的门开着，在一间关严门窗、和外界隔热的房间里一直运行。房间的温度会怎样变化？
          options:
            - text: 慢慢升高
              correct: true
            - text: 慢慢降低，因为冰箱在制冷
              why: 冰箱从冷藏室取走的热量又从背后的散热器放回房间，还要加上压缩机消耗的电能，总的是往房间里加热
            - text: 不变，冰箱只是把热量搬来搬去
              why: 搬热量要消耗电能，这部分电能最后也变成热留在房间里
          explain: 冰箱把热量从冷的地方搬到热的地方，必须消耗功，这些功最后也变成热。这一课讲热机和制冷机的能量账。
      - card:
          title: 可逆过程和不可逆过程
          body: |
            热量会自发地从热的物体传给冷的物体，但从不会自发地倒过来。摩擦生热、气体向真空自由膨胀也都只朝一个方向发生，这些叫不可逆过程。

            **可逆过程（reversible process）**是一种理想情况：每一步都无限接近平衡、没有摩擦，沿原路倒回去时系统和外界都能完全复原。真实过程都不可逆，可逆过程是它们的极限，用来算出效率的上限。
      - card:
          title: 热机
          body: |
            工作物质（如气缸里的气体）经过一系列过程又回到原来的状态，叫一个**循环（cycle）**。**热机（heat engine）**让工作物质一轮轮循环：每个循环从高温热源吸热 $Q_h$，对外做净功 $W$，向低温热源放热 $Q_c$（取正值）。循环回到原状态，$\Delta U = 0$，所以

            $$W = Q_h - Q_c$$

            **热机效率（efficiency）**：

            $$\eta = \frac{W}{Q_h} = 1 - \frac{Q_c}{Q_h}$$

            汽车汽油机的实际效率约 25%–30%，大部分热量通过排气和冷却水散掉。
      - item:
          id: engine-eff
          type: number
          prompt: 一台热机每个循环从高温热源吸热 2000 J，向低温热源放热 1400 J。它的效率是百分之几？
          answer: 30
          unit: '%'
          hint: 每个循环做的净功是多少？
          explain: $W = 2000 - 1400 = 600\text{ J}$，$\eta = 600/2000 = 30\%$。
      - card:
          title: 制冷机和热泵
          body: |
            把热机倒过来：消耗功 $W$，从低温处吸热 $Q_c$，向高温处放热 $Q_h = Q_c + W$。用来让低温处更冷的叫制冷机（冰箱、空调制冷），用来让高温处更暖的叫热泵（空调制热）。

            制冷机的**性能系数（coefficient of performance）**：$K = Q_c/W$；热泵的性能系数：$K_{\text{热泵}} = Q_h/W = K + 1$。

            性能系数可以大于 1：热泵每消耗 1 J 电能，能往屋里送进 3 J 甚至更多的热，因为大部分热是从室外搬进来的。
      - item:
          id: fridge-cop
          type: number
          prompt: 一台冰箱每消耗 100 J 电能，从冷藏室取走 300 J 热量。它向厨房放出多少焦耳热量？
          answer: 400
          unit: J
          hint: 放出的热量来自哪两部分？
          explain: $Q_h = Q_c + W = 300 + 100 = 400\text{ J}$。它的性能系数 $K = 300/100 = 3$。
      - item:
          id: heatpump-cop
          type: number
          prompt: 一台热泵制冷时的性能系数是 3。同一台机器用来制热、在同样的两个温度之间工作时，性能系数是多少？
          answer: 4
          hint: 制热时送进屋里的热量，等于从室外取的热加上什么？
          explain: $K_{\text{热泵}} = Q_h/W = (Q_c + W)/W = K + 1 = 4$。
      - item:
          id: efficiency-100
          type: choice
          prompt: 有人说：“只要把发动机的摩擦和漏气全部消除，热机效率就能达到 100%。”这个说法对吗？
          options:
            - text: 不对，即使理想的热机也必须向低温热源放热，效率小于 100%
              correct: true
            - text: 对，热机效率低完全是因为摩擦和漏气
              why: 消除摩擦后仍有 $Q_c > 0$，这是热力学第二定律的要求，不是工艺问题
            - text: 对，因为能量守恒，吸收的热量都能变成功
              why: 能量守恒（第一定律）只要求 $W = Q_h - Q_c$，并不保证 $Q_c$ 可以为 0
          explain: 第一定律允许 $Q_c = 0$，但第二定律不允许：循环工作的热机必须向低温热源放热。理想可逆热机的效率也只有 $1 - T_c/T_h$。

  - id: carnot-entropy
    chapter: 热力学定律
    title: 热力学第二定律、卡诺循环和熵
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一杯热水放在桌上，慢慢冷到室温。你见过一杯室温的水自己从周围空气里吸热、变得滚烫吗？
          options:
            - text: 没有，这违反热力学第二定律
              correct: true
            - text: 没有，因为这违反能量守恒
              why: 空气少一点热、水多一点热，总能量并没有变；不发生的原因是第二定律
            - text: 有可能，只要等得足够久
              why: 热量不会自发地从低温物体传到高温物体，等多久都不会
          explain: 能量守恒允许这件事发生，但它从不发生。说明除了能量守恒，还有另一条规律管着过程的方向，这就是第二定律。
      - card:
          title: 热力学第二定律的两种表述
          body: |
            **热力学第二定律（second law of thermodynamics）**常见两种说法：

            - 克劳修斯表述：热量不能自发地从低温物体传到高温物体。要让热量从冷处到热处，必须消耗功（冰箱）。
            - 开尔文表述：不可能从单一热源吸热，使之全部变成功，而不产生其他影响。所以热机必须向低温热源放热。

            两种说法等价：如果一种能违反，就能造出违反另一种的装置。
      - card:
          title: 卡诺循环
          body: |
            **卡诺循环（Carnot cycle）**由四个可逆过程组成：在 $T_h$ 下等温膨胀吸热、绝热膨胀降温到 $T_c$、在 $T_c$ 下等温压缩放热、绝热压缩回到 $T_h$。两个等温过程吸热 $Q_h = nRT_h\ln(V_2/V_1)$、放热 $Q_c = nRT_c\ln(V_3/V_4)$；两个绝热过程保证 $V_2/V_1 = V_3/V_4$，两个对数相同，所以 $Q_c/Q_h = T_c/T_h$。卡诺热机的效率

            $$\eta_C = 1 - \frac{T_c}{T_h}$$

            卡诺定理：工作在同样两个温度之间的所有热机，效率都不超过卡诺热机。温度必须用开尔文。
      - item:
          id: carnot-eff
          type: number
          prompt: 一台卡诺热机工作在 600 K 和 300 K 两个热源之间。它的效率是百分之几？
          answer: 50
          unit: '%'
          hint: 卡诺效率只和两个温度的比值有关。
          explain: $\eta_C = 1 - 300/600 = 0.5 = 50\%$。
      - item:
          id: carnot-celsius
          type: number
          prompt: 一座发电厂的锅炉蒸汽温度是 527 °C，冷却水温度是 27 °C。理论上它的最高效率是百分之几？（保留一位小数）
          answer: 62.5
          tolerance: 0.05
          unit: '%'
          hint: 先把两个温度换成开尔文（用 273 换算即可）。
          explain: $T_h = 800\text{ K}$，$T_c = 300\text{ K}$，$\eta_C = 1 - 300/800 = 62.5\%$。若直接用摄氏度算 $1 - 27/527$，会得到错误的 94.9%。
      - card:
          title: 熵
          body: |
            可逆过程中系统在温度 $T$ 下吸收一小份热量 $dQ$，定义**熵（entropy）**的变化 $dS = dQ/T$，单位 J/K。等温可逆过程 $\Delta S = Q/T$。

            熵是状态量：只取决于状态，和怎么到达那个状态无关。对不可逆过程，可以找一条连接同样两个状态的可逆过程来算 $\Delta S$。

            **熵增加原理（principle of entropy increase）**：孤立系统的熵永不减少；可逆过程熵不变，不可逆过程熵增加。热从热处传到冷处时，冷物体增加的熵 $Q/T_c$ 大于热物体减少的熵 $Q/T_h$，总熵增加。
      - item:
          id: entropy-flow
          type: number
          prompt: 1200 J 热量从 400 K 的物体传到 300 K 的物体（两个物体都很大，温度基本不变）。两个物体的总熵变是多少 J/K？
          answer: 1
          unit: J/K
          hint: 热物体失去热量，熵减少多少？冷物体呢？
          explain: 热物体 $\Delta S = -1200/400 = -3\text{ J/K}$，冷物体 $\Delta S = +1200/300 = +4\text{ J/K}$，总熵变 $+1\text{ J/K}$，大于 0，符合熵增加原理。
      - card:
          title: 熵的微观意义
          body: |
            把系统中每个分子的状态都指定出来，叫一个**微观状态（microstate）**；只看压强、温度这些整体量，叫宏观状态。同一个宏观状态可以对应很多个微观状态，个数记作 $\Omega$。玻尔兹曼给出

            $$S = k\ln\Omega$$

            $k \approx 1.38 \times 10^{-23}\text{ J/K}$ 叫玻尔兹曼常数。例：4 个分子分在左右两半，全在左边只有 1 种排法，左右各 2 个有 6 种排法。分子数巨大时，“均匀分布”对应的微观状态数压倒性地多，所以气体总是自发地散开，不会自己挤回一边。熵增加，就是系统走向微观状态数更多的宏观状态。
      - item:
          id: microstates
          type: number
          prompt: 6 个不同的分子分布在容器的左右两半，每个分子要么在左边要么在右边。“左边恰好 3 个、右边 3 个”这个宏观状态对应多少个微观状态？
          answer: 20
          hint: 4 个分子分成 2 + 2 有 6 种排法。6 个分子时，放在左边的那 3 个可以是哪几个？
          explain: 从 6 个分子里挑 3 个放左边：第一个有 6 种挑法、第二个 5 种、第三个 4 种，共 $6 \times 5 \times 4 = 120$ 种；同样 3 个分子的不同挑选顺序算同一种，要除以 $3 \times 2 \times 1 = 6$，得 $\Omega = 20$。而“全在左边”只有 1 个微观状态。

  # ==== 气体动理论 ====
  - id: gas-molecules
    chapter: 气体动理论
    title: 气体分子模型、压强和方均根速率
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 同样温度下的氢气和氧气，哪种气体的分子平均跑得更快？
          options:
            - text: 氢气
              correct: true
            - text: 氧气，因为分子更重、冲劲更大
              why: 同样温度下分子的平均动能相同，质量小的分子速度更大
            - text: 一样快，因为温度相同
              why: 温度相同的是分子的平均动能 ½mv²，质量不同时速度就不同
          explain: 温度决定分子的平均动能。动能一样时，轻的分子跑得快。这一课从分子的碰撞推出压强和温度的意义。
      - card:
          title: 理想气体的分子模型
          body: |
            气体动理论把理想气体想成这样：

            - 分子数目极多，各自做无规则运动，每个方向的机会均等；
            - 分子本身的体积比它们占据的空间小得多，可以看成质点；
            - 除了碰撞的瞬间，分子之间、分子和器壁之间没有作用力；
            - 碰撞是弹性的。

            气体的压强来自大量分子不断撞击器壁：每次撞击改变分子的动量，器壁受到冲量，单位时间、单位面积上的平均冲量就是压强。
      - card:
          title: 压强和温度的微观意义
          body: |
            按上面的模型做动量计算（一个分子撞墙动量变化 $2mv_x$，再对所有分子求平均），得到

            $$pV = \tfrac13 Nm\overline{v^2} = \tfrac23 N\cdot\overline{\tfrac12 mv^2}$$

            和 $pV = nRT = NkT$ 比较（$k = R/N_A$ 是**玻尔兹曼常数（Boltzmann constant）**，约 $1.38 \times 10^{-23}\text{ J/K}$），得到

            $$\overline{\tfrac12 mv^2} = \tfrac32 kT$$

            温度是分子平均平动动能的量度，和分子种类无关。
          reveal:
            - title: 第 1 步：一个分子撞一次墙
              body: 边长 $L$ 的立方容器里，速度 $x$ 分量为 $v_x$ 的分子弹性撞到右壁，速度分量变成 $-v_x$，动量变化 $2mv_x$，器壁受到同样大小的冲量。
            - title: 第 2 步：一秒内撞多少次
              body: 它来回一趟要走 $2L$，用时 $2L/v_x$，所以每秒撞右壁 $v_x/(2L)$ 次，给器壁的平均力是 $2mv_x \cdot v_x/(2L) = mv_x^2/L$。
            - title: 第 3 步：对所有分子求和
              body: $N$ 个分子的平均力是 $Nm\overline{v_x^2}/L$，除以面积 $L^2$ 得 $p = Nm\overline{v_x^2}/V$。各方向机会均等，$\overline{v_x^2} = \tfrac13\overline{v^2}$，所以 $pV = \tfrac13 Nm\overline{v^2}$。
      - item:
          id: avg-ke-molecule
          type: number
          prompt: 300 K 时，理想气体分子的平均平动动能是多少？（单位 $10^{-21}$ J，保留两位小数；$k = 1.38 \times 10^{-23}\text{ J/K}$）
          answer: 6.21
          tolerance: 0.005
          unit: ×10⁻²¹ J
          hint: 平均平动动能等于几倍 kT？
          explain: $\tfrac32 kT = 1.5 \times 1.38 \times 10^{-23} \times 300 = 6.21 \times 10^{-21}\text{ J}$。任何理想气体在 300 K 都是这个值。
      - card:
          title: 方均根速率
          body: |
            由 $\tfrac12 m\overline{v^2} = \tfrac32 kT$，分子速率平方的平均值再开方，叫**方均根速率（root-mean-square speed）**：

            $$v_{\text{rms}} = \sqrt{\overline{v^2}} = \sqrt{\frac{3kT}{m}} = \sqrt{\frac{3RT}{M}}$$

            $M$ 是摩尔质量，单位必须用 kg/mol。例：300 K 的氮气（$M = 0.028\text{ kg/mol}$），$v_{\text{rms}} = \sqrt{3 \times 8.314 \times 300 / 0.028} \approx 517\text{ m/s}$，比声速还快。
      - item:
          id: vrms-oxygen
          type: number
          prompt: 300 K 时氧气分子（摩尔质量 0.032 kg/mol）的方均根速率是多少 m/s？（R = 8.314 J/(mol·K)，取整数）
          answer: 484
          tolerance: 1
          unit: m/s
          hint: 摩尔质量要用 kg/mol 代入。
          explain: $v_{\text{rms}} = \sqrt{3 \times 8.314 \times 300 / 0.032} = \sqrt{233831} \approx 484\text{ m/s}$。
      - item:
          id: vrms-ratio
          type: number
          prompt: 同一温度下，氢气（摩尔质量 0.002 kg/mol）分子的方均根速率是氧气（0.032 kg/mol）的几倍？
          answer: 4
          hint: 方均根速率和摩尔质量的几次方成反比？
          explain: $v_{\text{rms}} \propto 1/\sqrt{M}$，比值 $\sqrt{0.032/0.002} = \sqrt{16} = 4$。
      - item:
          id: double-t
          type: choice
          prompt: 把一瓶理想气体的热力学温度从 300 K 升到 600 K，分子的方均根速率怎样变化？
          options:
            - text: 变为原来的 $\sqrt 2$ 倍
              correct: true
            - text: 变为原来的 2 倍
              why: 温度翻倍时平均动能翻倍，速率和温度的平方根成正比
            - text: 变为原来的 4 倍
              why: 平均动能 $\propto T$，速率 $\propto \sqrt T$，不是 $T^2$
          explain: $v_{\text{rms}} = \sqrt{3RT/M} \propto \sqrt T$。$T$ 翻倍，速率变为 $\sqrt 2 \approx 1.41$ 倍。

  - id: equipartition-distribution
    chapter: 气体动理论
    title: 能量均分、速率分布和平均自由程
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 同样 1 mol 的氦气（单原子）和氮气（双原子），在体积不变时都升高 1 K。哪种需要的热量更多？
          options:
            - text: 氮气
              correct: true
            - text: 氦气，因为它更轻、跑得更快
              why: 需要的热量看每个分子能把能量分配到多少种运动形式上，不看分子轻重
            - text: 一样多，因为温度变化相同
              why: 双原子分子除了平动还能转动，升温时转动也要分走一部分能量
          explain: 氮气分子除了到处跑，还会转动，升温时要多给转动一份能量。这一课学能量怎样在这些运动形式之间分配。
      - card:
          title: 自由度和能量均分定理
          body: |
            分子的能量里每一个独立的平方项（如 $\tfrac12 mv_x^2$、绕某轴的 $\tfrac12 I\omega^2$）叫一个**自由度（degree of freedom）**。

            **能量均分定理（equipartition theorem）**：平衡时，每个自由度平均分得 $\tfrac12 kT$ 的能量。

            - 单原子分子：3 个平动自由度，平均能量 $\tfrac32 kT$；
            - 双原子分子（常温）：3 个平动 + 2 个转动 = 5 个，平均能量 $\tfrac52 kT$。

            1 mol 气体的内能 $U = \tfrac{f}{2}RT$，$f$ 是自由度数，所以 $C_V = \tfrac{f}{2}R$：单原子 $\tfrac32 R$，双原子 $\tfrac52 R$。
      - item:
          id: cv-diatomic
          type: number
          prompt: 1 mol 氮气（常温下按 5 个自由度计）在体积不变时温度升高 12 K，需要吸收多少焦耳热量？（R = 8.314 J/(mol·K)，保留一位小数）
          answer: 249.4
          tolerance: 0.05
          unit: J
          hint: 双原子气体的 $C_V$ 是几倍 $R$？
          explain: $C_V = \tfrac52 R$，$Q = nC_V\Delta T = 2.5 \times 8.314 \times 12 \approx 249.4\text{ J}$。同样条件下氦气只要 $1.5 \times 8.314 \times 12 \approx 149.7\text{ J}$。
      - item:
          id: gamma-diatomic
          type: number
          prompt: 按能量均分定理，常温下双原子理想气体的比热容比 $\gamma = C_p / C_V$ 是多少？
          answer: 1.4
          hint: 先写出 $C_V$，再用 $C_p = C_V + R$。
          explain: $C_V = \tfrac52 R$，$C_p = \tfrac72 R$，$\gamma = 7/5 = 1.4$，和空气的实测值一致。
      - card:
          title: 麦克斯韦速率分布
          body: |
            气体分子的速率各不相同。用 $f(v)$ 表示速率分布：$f(v)\,dv$ 是速率在 $v$ 到 $v + dv$ 之间的分子占的比例。理想气体的这个规律叫**麦克斯韦速率分布（Maxwell–Boltzmann distribution）**：速率很小和很大的分子都少，中间多，曲线下的总面积是 1。

            三个特征速率（$M$ 是摩尔质量）：

            $$v_p = \sqrt{\frac{2RT}{M}} < \bar v = \sqrt{\frac{8RT}{\pi M}} < v_{\text{rms}} = \sqrt{\frac{3RT}{M}}$$

            $v_p$ 是曲线最高点对应的最概然速率。温度升高，曲线变矮变宽，峰向高速率移动。
      - item:
          id: speed-order
          type: choice
          prompt: 对同一种理想气体在同一温度下，最概然速率 $v_p$、平均速率 $\bar v$、方均根速率 $v_{\text{rms}}$ 的大小关系是？
          options:
            - text: $v_p < \bar v < v_{\text{rms}}$
              correct: true
            - text: 三者相等
              why: 分布曲线不对称，高速一侧拖得更长，三种“平均”方式得到不同的数
            - text: $v_{\text{rms}} < \bar v < v_p$
              why: 三个公式的系数分别是 $\sqrt 2$、$\sqrt{8/\pi} \approx 1.60$、$\sqrt 3$，从小到大是 $v_p$、$\bar v$、$v_{\text{rms}}$
          explain: 系数 $\sqrt 2 \approx 1.41 < \sqrt{8/\pi} \approx 1.60 < \sqrt 3 \approx 1.73$。曲线在高速一侧有长尾，平方后再平均更受高速分子影响，所以 $v_{\text{rms}}$ 最大。
      - card:
          title: 平均自由程和碰撞频率
          body: |
            分子跑得飞快，香水的气味却要好几秒才飘过房间，因为分子不停地和别的分子相撞，走的是曲折的路。一个分子连续两次碰撞之间平均走过的距离叫**平均自由程（mean free path）**：

            $$\lambda = \frac{kT}{\sqrt2\,\pi d^2 p}$$

            $d$ 是分子直径。压强越低、分子越小，自由程越长。每秒平均碰撞次数 $z = \bar v/\lambda$。常温常压下空气分子的自由程约 70 纳米，每秒碰撞约几十亿次。

            重力场中，分子数密度随高度按 $e^{-mgh/(kT)}$ 减小（玻尔兹曼分布），所以高山上空气稀薄。
      - item:
          id: mean-free-path
          type: number
          prompt: 氮气分子直径取 $3.7 \times 10^{-10}$ 米，在 300 K、101325 Pa 下，平均自由程约多少纳米？（$k = 1.38 \times 10^{-23}\text{ J/K}$，取整数）
          answer: 67
          tolerance: 1
          unit: nm
          hint: 温度、分子直径、压强分别放在公式的分子还是分母？算出的米数怎样换成纳米？
          explain: $\lambda = \frac{1.38 \times 10^{-23} \times 300}{1.414 \times 3.1416 \times (3.7 \times 10^{-10})^2 \times 101325} \approx 6.7 \times 10^{-8}\text{ m} = 67\text{ nm}$，约为分子直径的 180 倍。
      - item:
          id: low-pressure-lambda
          type: choice
          prompt: 把容器抽成真空，压强降到原来的百万分之一，温度不变。平均自由程怎样变化？
          options:
            - text: 变为原来的一百万倍
              correct: true
            - text: 变为原来的一千倍
              why: 自由程和压强成反比（$\lambda \propto 1/p$），不是和压强的平方根成反比
            - text: 不变，因为分子大小没变
              why: 压强降低，单位体积里的分子变少，分子要走更远才会撞上另一个
          explain: $\lambda = kT/(\sqrt2\pi d^2 p)$，$T$、$d$ 不变时 $\lambda \propto 1/p$。压强降为百万分之一，自由程变为一百万倍。

boss:
  items:
    - id: b-projectile
      type: number
      prompt: 以 20 m/s、仰角 30° 抛出一个小球，落回同一高度，不计空气阻力，$g = 9.8\text{ m/s}^2$。水平射程是多少米？（保留一位小数）
      answer: 35.3
      tolerance: 0.05
      unit: m
      hint: 飞行时间由竖直分速度决定，射程是水平分速度乘飞行时间。
      explain: 飞行时间 $T = 2 \times 10/9.8 \approx 2.041\text{ s}$，水平速度 $20\cos 30° \approx 17.32\text{ m/s}$，射程 $\approx 35.3\text{ m}$；也可用 $R = v_0^2\sin 2\theta/g = 400 \times 0.866/9.8$。
    - id: b-incline
      type: number
      prompt: 5 kg 的木块在倾角 30° 的斜面上由静止下滑，动摩擦因数 0.3，$g = 9.8\text{ m/s}^2$。它的加速度是多少 m/s²？（保留两位小数）
      answer: 2.35
      tolerance: 0.01
      unit: m/s²
      hint: 沿斜面方向，重力分量和摩擦力谁大？支持力等于重力的哪个分量？
      explain: $a = g(\sin 30° - \mu_k\cos 30°) = 9.8 \times (0.5 - 0.3 \times 0.8660) \approx 2.35\text{ m/s}^2$，与质量无关。
    - id: b-collision
      type: number
      prompt: 一个 4 kg 的物块以 5 m/s 的速度在光滑水平面上撞上静止的 6 kg 物块，两者粘在一起。碰撞损失了多少焦耳动能？
      answer: 30
      unit: J
      hint: 先求共同速度，再比较碰前碰后的动能。
      explain: 共同速度 $v = 4 \times 5/10 = 2\text{ m/s}$。碰前 $\tfrac12 \times 4 \times 25 = 50\text{ J}$，碰后 $\tfrac12 \times 10 \times 4 = 20\text{ J}$，损失 30 J。
    - id: b-energy
      type: choice
      prompt: 一个物块从光滑的弧形轨道上高 h 处由静止滑下，进入粗糙的水平面后滑行一段距离停下。下面哪个说法对？
      options:
        - text: 弧形轨道上机械能守恒，水平面上机械能减少，减少的变成内能
          correct: true
        - text: 整个过程机械能守恒，因为能量守恒
          why: 能量守恒指总能量；水平面上摩擦力做负功，机械能变成内能，机械能不守恒
        - text: 弧形轨道上动量守恒，所以到底端的速度和轨道形状无关
          why: 下滑时重力和支持力的合力不为 0，动量不守恒；速度和形状无关是机械能守恒的结果
        - text: 水平面上动能减少，但动量守恒
          why: 摩擦力是外力，物块的动量在减少
      explain: 光滑轨道只有重力做功，机械能守恒，$v = \sqrt{2gh}$。粗糙水平面上摩擦力做负功，机械能减少，变成物块和地面的内能。
    - id: b-disk
      type: number
      prompt: 一个质量 2 kg、半径 0.1 米的均匀圆盘可绕固定水平轴自由转动，边缘绕一根轻绳，绳下挂 1 kg 的物块，由静止释放，$g = 9.8\text{ m/s}^2$。绳的拉力是多少牛顿？
      answer: 4.9
      unit: N
      hint: 物块用牛顿第二定律，圆盘用转动定律，再用 $a = \alpha R$ 把两者联系起来。
      explain: $I = \tfrac12 MR^2 = 0.01$，$a = mg/(m + I/R^2) = 9.8/2 = 4.9\text{ m/s}^2$，$T = m(g - a) = 4.9\text{ N}$。
    - id: b-angular
      type: number
      prompt: 一个转盘绕竖直轴自由转动，转动惯量 2 kg·m²，角速度 3 rad/s。一块 0.5 kg 的泥块竖直落下，粘在离轴 1 米的转盘边缘。之后转盘的角速度是多少 rad/s？
      answer: 2.4
      unit: rad/s
      hint: 泥块落下时对竖直轴没有角动量。粘上后转动惯量变成多少？
      explain: 角动量守恒：$2 \times 3 = (2 + 0.5 \times 1^2)\omega$，$\omega = 6/2.5 = 2.4\text{ rad/s}$。
    - id: b-isothermal
      type: number
      prompt: 1 mol 理想气体在 300 K 下等温膨胀到原体积的 2 倍。气体吸收了多少焦耳热量？（R = 8.314 J/(mol·K)，取整数）
      answer: 1729
      tolerance: 1
      unit: J
      hint: 等温时内能怎样变化？吸热和做功是什么关系？
      explain: 等温 $\Delta U = 0$，$Q = W = nRT\ln 2 = 8.314 \times 300 \times 0.6931 \approx 1729\text{ J}$。
    - id: b-carnot
      type: number
      prompt: 一台卡诺热机工作在 227 °C 和 27 °C 之间，每个循环从高温热源吸热 1000 J。每个循环对外做多少焦耳的功？
      answer: 400
      unit: J
      hint: 先把温度换成开尔文（用 273 换算），算出效率。
      explain: $T_h = 500\text{ K}$，$T_c = 300\text{ K}$，$\eta = 1 - 300/500 = 40\%$，$W = 0.4 \times 1000 = 400\text{ J}$。
    - id: b-vrms
      type: number
      prompt: 300 K 时氮气分子（摩尔质量 0.028 kg/mol）的方均根速率是多少 m/s？（R = 8.314 J/(mol·K)，取整数）
      answer: 517
      tolerance: 1
      unit: m/s
      hint: 摩尔质量用 kg/mol 代入 $\sqrt{3RT/M}$。
      explain: $v_{\text{rms}} = \sqrt{3 \times 8.314 \times 300/0.028} = \sqrt{267236} \approx 517\text{ m/s}$。
    - id: b-dof
      type: choice
      prompt: 按能量均分定理，常温下 1 mol 双原子理想气体的内能是多少？
      options:
        - text: $\tfrac52 RT$
          correct: true
        - text: $\tfrac32 RT$
          why: 这是单原子气体的结果；双原子分子在常温下还有 2 个转动自由度
        - text: $\tfrac72 RT$
          why: $\tfrac72 R$ 是双原子气体的 $C_p$；内能对应的是 5 个自由度，$\tfrac52 RT$
        - text: $3RT$
          why: 常温下双原子分子的振动自由度基本没有被激发，按 5 个自由度计
      explain: 3 个平动 + 2 个转动 = 5 个自由度，每个 $\tfrac12 kT$，1 mol 共 $\tfrac52 N_A kT = \tfrac52 RT$。
