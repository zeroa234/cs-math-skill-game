skill: M.6.2.2
version: 2
authors: [main-agent]
brief:
  why: |
    点估计和假设检验能判断“一个均值是不是 0.5”，但现实数据往往同时带着多个特征：房屋面积、地段和房龄怎样共同影响售价？预测结果离真实值还差多少、图形里的极端点或共线性会不会把系数拉歪？这一关从简单与多元线性回归起步，用设计矩阵和正规方程打通几何投影与统计推断，讲清变量变换、定性编码、广义线性模型、残差与杠杆诊断，直到交叉验证、岭回归、Lasso 与主成分回归。
  outcomes:
    - 建立简单与多元线性回归模型，理解斜率控制其余变量的含义及关联不等于因果的边界
    - 写出设计矩阵并用正规方程求解回归系数，处理定性示性变量、交互项与变量变换
    - 理解 Logistic 回归与泊松回归中的连接函数与广义线性模型框架
    - 看懂方差分析表与一般线性 F 检验，用残差图、正态概率图与杠杆值诊断异方差、自相关和影响点
    - 准确计算并区分均值响应置信区间与新观测预测区间，用方差膨胀因子诊断多重共线性
    - 用调整 R²、信息准则、交叉验证、岭回归、Lasso、PCR 与 PLS 挑选稳健模型并抑制过拟合
terms:
  - term: 变量
    def: '回归与统计模型中记录研究对象特征或结果的量，分为用来预测的自变量（解释变量）与被预测的响应变量（因变量）'
  - term: 简单线性回归
    def: '用一条直线 y = β₀ + β₁x 拟合单个解释变量与连续响应之间线性关系的统计模型'
  - term: 普通最小二乘
    def: '通过最小化全部样本残差平方和 SSE 来求解回归系数的经典估计方法，简称 OLS'
  - term: 残差
    def: '观测值减去模型拟合预测值的差 eᵢ = yᵢ − ŷᵢ，反映模型未能解释的剩余误差'
  - term: 决定系数
    def: 'R² = 1 − SSE/SST，表示回归模型解释了响应变量总变异平方和中的多少比例'
  - term: 设计矩阵
    def: '把截距项全 1 列和各解释变量观测值按行样本、列特征排成的矩阵 X'
  - term: 正规方程
    def: '由最小二乘导数为零推得的线性方程组 XᵀXβ = Xᵀy，用来直接解出最优系数'
  - term: 示性变量
    def: '用 0 和 1 表示某个定性类别是否出现的虚拟变量，k 个类别只需设 k − 1 个'
  - term: 交互效应
    def: '一个解释变量对结果的影响幅度随着另一个解释变量的取值不同而改变，常写成乘积项'
  - term: 非线性回归
    def: '回归函数关于未知参数本身呈非线性（如饱和曲线），无法直接靠正规方程一步求解'
  - term: 广义线性模型
    def: '通过连接函数把线性预测器与非正态分布的均值连起来的统一建模框架，简写为 GLM'
  - term: 发生比
    def: '事件发生的概率与不发生概率之比 p / (1 − p)，取对数即为 Logistic 回归的 logit 连接'
  - term: 方差分析
    def: '把响应变量总平方和拆成回归解释部分与残差误差部分并用 F 检验比较显著性的方法'
  - term: 偏决定系数
    def: '在已有模型中加入新变量后，把原先剩余残差平方和又进一步削减了多少比例'
  - term: 异方差
    def: '残差的波动方差随预测值或自变量增大而改变（如漏斗形散开），破坏常规标准误与检验'
  - term: 杠杆值
    def: '衡量第 i 个样本自变量组合离其余样本中心有多远的数值 hᵢᵢ，取值越大对拟合线拉力越强'
  - term: 学生化残差
    def: '按各自杠杆率对应的标准误缩放（常并剔除当前点重算）后的残差，方便跨点直接识别离群值'
  - term: 影响点
    def: '一旦从数据里删掉就会让回归斜率或预测发生明显改动的样本，常兼具高杠杆与大残差'
  - term: 加权最小二乘
    def: '在存在异方差时按各点误差方差倒数赋予权重来拟合回归、重新恢复估计效率的方法，简称 WLS'
  - term: 自相关
    def: '按时间或空间顺序排列的相邻残差彼此相关而非独立，导致标准误被明显低估'
  - term: 多重共线性
    def: '多个解释变量之间存在高度线性相关，导致最小二乘系数的标准误显著膨胀、符号不稳定'
  - term: 方差膨胀因子
    def: 'VIFⱼ = 1 / (1 − Rⱼ²)，衡量第 j 个系数方差因与其余特征共线而被放大了多少倍'
  - term: 交叉验证
    def: '把样本分成若干折，轮流留出一折充当样本外验证集以评估泛化预测误差的方法'
  - term: 正则化
    def: '在拟合目标里加入对模型系数大小的惩罚项，牺牲少许偏差换取方差下降以防过拟合'
  - term: 岭回归
    def: '在平方误差损失上加入系数的 L2 平方和惩罚 λ∑βⱼ²，能均匀收缩系数并解决共线求逆问题'
  - term: Lasso
    def: '在平方误差损失上加入系数的 L1 一阶离差惩罚 λ∑|βⱼ|，能把次要特征系数压成零'
  - term: 主成分回归
    def: '先对自变量矩阵提取少数几个正交主成分降维，再用这些主成分做线性回归的方法，简称 PCR'
  - term: 偏最小二乘
    def: '在构造降维线性组合时同时考虑自变量方差与响应变量相关性、有监督提取成分的回归方法，简称 PLS'
lessons:
  # =====================================================================
  # 第 1 章：线性/广义线性模型
  # =====================================================================
  - id: simple-linear-regression
    chapter: 线性/广义线性模型
    title: 简单线性回归与决定系数
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            统计一家冰激凌店和附近海滩救生员出勤的数据，发现某月“冰激凌销量每高 100 支，海滩溺水人数就多 2 人”，斜率显著。能直接下结论说“吃冰激凌导致人更容易溺水”吗？
          options:
            - text: 不能，观察数据里的线性斜率只反映伴随关联，背后可能有“夏季高温”这个共同混杂因素
              correct: true
            - text: 可以，只要回归直线斜率 $b_1$ 算出是正数且通过了显著性检验，就能直接证明自变量对响应变量存在因果效应
              why: 回归方程只是把观察到的关联总结成一条直线，它本身分辨不出“谁导致谁”还是“共同受第三方影响”
            - text: 可以，但前提是在拟合时把回归直线的截距项 $b_0$ 固定为 0，强制让回归线经过坐标原点
              why: 强行过原点只是改变直线几何约束，不能把观察关联变成因果结论
          explain: |
            回归直线中的 $b_1$ 描述的是“已知 $x$ 大 1 单位时，$y$ 的平均预期差了多少”，非实验的观察数据不能直接当因果结论用。
      - card:
          title: 简单线性回归模型与误差方差
          body: |
            在回归分析里，用来预测的特征（自变量 $x$）和被预测的结果（响应 $Y$）统称为模型的**变量（variable）**。用单一自变量 $x$ 预测连续响应 $Y$ 时，**简单线性回归（simple linear regression）**假设数据由直线加随机噪声生成：
            $$Y_i = \beta_0 + \beta_1 x_i + \varepsilon_i$$
            其中 $\varepsilon_i$ 是互不相关、均值 0 且共同方差为 $\sigma^2$ 的随机误差。拟合出直线 $\hat{y}_i = b_0 + b_1 x_i$ 后，实际值与预测值之差 $e_i = y_i - \hat{y}_i$ 称为**残差（residual）**。用残差平方和 $\mathrm{SSE} = \sum_{i=1}^n (y_i - \hat{y}_i)^2$ 除以自由度 $n - 2$（估计了截距和斜率 2 个参数），就得到误差方差的无偏估计 $s^2 = \frac{\mathrm{SSE}}{n - 2}$。
      - card:
          title: 最优拟合直线与决定系数 R²
          body: |
            通过最小化残差平方和 $\mathrm{SSE}$ 来求解系数的方法称为**普通最小二乘（ordinary least squares, OLS）**，由此解出唯一最优直线：
            $$b_1 = \frac{\sum (x_i - \bar{x})(y_i - \bar{y})}{\sum (x_i - \bar{x})^2} = \frac{S_{xy}}{S_{xx}},\qquad b_0 = \bar{y} - b_1 \bar{x}$$
            总变异平方和 $\mathrm{SST} = \sum (y_i - \bar{y})^2$ 衡量“只用样本均值 $\bar{y}$ 预测时的总平方误差”。用它定义**决定系数（coefficient of determination）** $R^2 = 1 - \frac{\mathrm{SSE}}{\mathrm{SST}}$，表示这条直线消除了多少比例的预测平方误差。
      - item:
          id: slr-r2-calc
          type: number
          prompt: |
            在另一项线性回归分析中，总变异平方和 $\mathrm{SST} = 50$，拟合后的残差平方和 $\mathrm{SSE} = 12$。这次拟合的决定系数 $R^2$ 是多少？
          answer: 0.76
          hint: 算一算 $1 - \mathrm{SSE}/\mathrm{SST}$。
          explain: |
            $R^2 = 1 - \frac{12}{50} = 1 - 0.24 = 0.76$。
      - card:
          title: 例子：手算最小二乘直线与决定系数
          body: |
            测得 5 组数据 $(x, y)$：`(1, 2)`、`(2, 3)`、`(3, 5)`、`(4, 4)`、`(5, 6)`。怎样一步步算出拟合直线与 $R^2$？
          reveal:
            - title: 第 1 步：算均值与离差乘积和、平方和
              body: |
                $\bar{x} = 3$，$\bar{y} = 4$。中心化偏差分别为 $x-\bar{x}$：$-2,-1,0,1,2$；$y-\bar{y}$：$-2,-1,1,0,2$。
                于是 $S_{xx} = 4+1+0+1+4 = 10$，$S_{xy} = 4+1+0+0+4 = 9$，$\mathrm{SST} = 4+1+1+0+4 = 10$。
            - title: 第 2 步：求斜率、截距、残差与 R²
              body: |
                斜率 $b_1 = \frac{9}{10} = 0.9$，截距 $b_0 = 4 - 0.9 \times 3 = 1.3$，直线为 $\hat{y} = 1.3 + 0.9x$。
                各点残差依次为 $-0.2, -0.1, 1.0, -0.9, 0.2$，平方和 $\mathrm{SSE} = 0.04 + 0.01 + 1.00 + 0.81 + 0.04 = 1.90$。
                因此 $R^2 = 1 - \frac{1.90}{10} = 0.81$，解释了 $81\%$ 的变异。
      - item:
          id: slr-predict-calc
          type: number
          prompt: |
            已知由样本拟合出的简单线性回归直线为 $\hat{y} = 1.3 + 0.9x$。当自变量取 $x = 6$ 时，这条直线给出的预测值 $\hat{y}$ 是多少？
          answer: 6.7
          hint: 直接把 $x = 6$ 代入 $\hat{y} = 1.3 + 0.9x$。
          explain: |
            $\hat{y} = 1.3 + 0.9 \times 6 = 1.3 + 5.4 = 6.7$。注意若 $6$ 已超出原样本范围，实际外推要谨慎。
      - item:
          id: slr-error-var
          type: number
          prompt: |
            用简单线性回归拟合 $n = 12$ 个样本，测得残差平方和 $\mathrm{SSE} = 45$。按自由度 $n - 2$ 计算误差方差的无偏估计 $s^2 = \frac{\mathrm{SSE}}{n - 2}$ 是多少？
          answer: 4.5
          hint: 简单线性回归估计了截距和斜率两个参数，自由度是 $12 - 2 = 10$。
          explain: |
            $s^2 = \frac{45}{12 - 2} = \frac{45}{10} = 4.5$（即残差标准差 $s \approx 2.12$）。
      - card:
          title: 使用 R² 的四个常见注意陷阱
          body: |
            看到较高的 $R^2$ 时，仍需留意四个常见局限：
            1. $R^2$ 高不代表真实关系一定是直线（弯曲抛物线的单调段也能算出 0.95 的 $R^2$，需要配合残差图检查）；
            2. $R^2$ 高不代表存在因果关系，可能只是两个变量共同受时间或混杂因素驱动；
            3. 只要往模型里增加新特征，哪怕是随机噪声，普通 $R^2$ 也只升不降；
            4. 在样本观测范围之外做外推时，原有的直线趋势可能不再成立。
      - item:
          id: slr-cautions-choice
          type: choice
          prompt: |
            在分析观察数据时算得斜率 $b_1 = 0.9$、$R^2 = 0.81$，下面哪项解读是严谨的？
          options:
            - text: $x$ 每高 1 个单位，$y$ 的平均预期约高 0.9；但不能仅凭非实验观察数据直接断定因果关系，且仍需画残差图核实线性假设是否成立
              correct: true
            - text: $R^2 = 0.81$ 已经证明 $x$ 与 $y$ 的真实关系一定是严格直线，不需要再绘制残差图检查弯曲形态
              why: 弯曲曲线的单调段也可以有很高的 $R^2$，仍需要通过残差图检查是否存在系统性弯曲
            - text: 在任何学科的回归分析中，只要算出来的 $R^2$ 低于 0.5，就说明自变量对响应变量没有任何解释价值
              why: 在医疗、社会科学或金融等个体随机波动较大的领域，$R^2$ 在 0.1 到 0.3 之间依然可能对应稳健且有价值的规律
            - text: 如果再往这个线性回归里加入两列独立的随机噪声特征，普通 $R^2$ 会因为自由度减少而显著下降
              why: 普通最小二乘加入新列只会让残差平方和 $\mathrm{SSE}$ 变小或保持不变，因此普通 $R^2$ 不会下降
          explain: |
            把 $R^2$ 当成“线性近似消除平方误差的比例”来看，配合残差图和研究设计背景解读，才能避免误判。

  - id: multiple-regression-matrix
    chapter: 线性/广义线性模型
    title: 多元线性回归与正规方程
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            某城市二手房数据里，先单独看“地铁距离”和“房价”的相关性，可能发现距离越远房价未必低；可一旦把“建筑面积”和“房龄”也同时放进多元回归，地铁越近房价越高的规律就显现出来。为什么多放几个特征，单个斜率含义就变了？
          options:
            - text: 多元回归的每个斜率表示在控制其余特征不变时，单独改变这一个特征对应的平均响应变化
              correct: true
            - text: 因为多元最小二乘在求解正规方程时，会自动把单变量回归里算出的所有负斜率翻转成正斜率以减小总残差
              why: 改变的是比较基准（从“混着郊区大面积新房一起比”变成“同面积同房龄下比地铁距离”），并非强行翻转正负号
            - text: 因为往回归模型里多加入解释变量以后，原有的每一个回归系数的数值都会按特征个数的倍数同步放大
              why: 加入新变量后原有系数可能变大、变小甚至改变符号，取决于各特征之间的相关方向
          explain: |
            多元回归的作用在于同时控制多个混杂变量，把每个特征在其他条件相同时的净关联分离出来。
      - card:
          title: 多元线性回归与设计矩阵
          body: |
            有 $p$ 个解释变量时，多元线性回归模型写成 $Y_i = \beta_0 + \beta_1 x_{i1} + \dots + \beta_p x_{ip} + \varepsilon_i$。每个斜率 $\beta_j$ 衡量**其余所有自变量保持不变**时，$x_j$ 每大 1 个单位对应的 $E[Y]$ 变化量。
            为了同时处理成千上万个样本和特征，把全部 $n$ 个样本的自变量排成一张 $n \times (p+1)$ 的大表，第一列全填 1（对应截距 $\beta_0$），后面依次放 $x_1, \dots, x_p$——这张矩阵称为**设计矩阵（design matrix）** $\mathbf{X}$，于是模型简洁地写成 $\mathbf{y} = \mathbf{X}\boldsymbol{\beta} + \boldsymbol{\varepsilon}$。
      - item:
          id: design-matrix-shape
          type: number
          prompt: |
            在一项包含 $n = 50$ 套房子的数据集上，打算用“面积、房龄、距地铁站距离”这 $p = 3$ 个特征加一个截距项做多元线性回归。对应的设计矩阵 $\mathbf{X}$ 一共有多少列？
          answer: 4
          hint: 别忘了最前面对应截距 $\beta_0$ 的那一整列常数 1。
          explain: |
            设计矩阵有 1 列全 1（对应截距）加上 3 个特征列，共 $3 + 1 = 4$ 列，形状是 $50 \times 4$。
      - item:
          id: mlr-ceteris-paribus
          type: choice
          prompt: |
            拟合二手房价格（万元）的多元回归方程得到：$\hat{y} = 80 + 4.2 \cdot \text{面积} - 1.5 \cdot \text{房龄}$。对斜率 $-1.5$ 的准确解释是哪一句？
          options:
            - text: 在面积相同的房子之间比较，房龄每多 1 年，平均房价大约低 1.5 万元
              correct: true
            - text: 不论房屋面积相差多大，只要房龄多 1 年，每一套房子的实际成交价都会比前一年固定减少 1.5 万元
              why: 多元回归系数描述的是“在控制面积相同时平均预期售价”的差异，不能抛开面积控制条件或当成无误差的个体确定值
            - text: 如果一套房子的面积扩大 1 平方米、同时房龄也增加 1 年，它的预测售价就会下降 1.5 万元
              why: 面积和房龄同时增加 1 个单位时，预测售价的变化是 $+4.2 - 1.5 = +2.7$ 万元
            - text: 当房龄为 0 年、建筑面积也为 0 平方米时，该回归模型给出的基准预测房价是 $-1.5$ 万元
              why: 所有自变量都取 0 时的基准预测值是截距 $80$ 万元，$-1.5$ 是房龄这一项的偏斜率
          explain: |
            “在其余特征保持不变时”是解释多元回归中每一个偏回归系数的前提。
      - card:
          title: 几何投影与正规方程
          body: |
            在线性代数里学过：找 $\hat{\boldsymbol{\beta}}$ 让残差向量 $\mathbf{e} = \mathbf{y} - \mathbf{X}\hat{\boldsymbol{\beta}}$ 长度平方 $\|\mathbf{e}\|_2^2$ 最小，在几何上就是把向量 $\mathbf{y}$ 正交投影到设计矩阵 $\mathbf{X}$ 的列空间上。
            因为投影误差 $\mathbf{e}$ 必须与 $\mathbf{X}$ 的每一列都正交，直接写下 $\mathbf{X}^\top(\mathbf{y} - \mathbf{X}\hat{\boldsymbol{\beta}}) = \mathbf{0}$，移项即得**正规方程（normal equations）**：
            $$\mathbf{X}^\top\mathbf{X}\hat{\boldsymbol{\beta}} = \mathbf{X}^\top\mathbf{y}$$
            当 $\mathbf{X}$ 各列线性无关时，$\mathbf{X}^\top\mathbf{X}$ 可逆，解得 $\hat{\boldsymbol{\beta}} = (\mathbf{X}^\top\mathbf{X})^{-1}\mathbf{X}^\top\mathbf{y}$。
      - card:
          title: 例子：用设计矩阵与正规方程重求回归直线
          body: |
            把第一课的 5 个点 `(1, 2),(2, 3),(3, 5),(4, 4),(5, 6)` 改写成矩阵形式，检验正规方程算出的结果是否完全一致。
          reveal:
            - title: 第 1 步：写出设计矩阵 X 与响应向量 y
              body: |
                $$\mathbf{X} = \begin{pmatrix} 1 & 1 \\ 1 & 2 \\ 1 & 3 \\ 1 & 4 \\ 1 & 5 \end{pmatrix},\qquad \mathbf{y} = \begin{pmatrix} 2 \\ 3 \\ 5 \\ 4 \\ 6 \end{pmatrix}$$
            - title: 第 2 步：算出 XᵀX 和 Xᵀy 并解方程
              body: |
                $\mathbf{X}^\top\mathbf{X} = \begin{pmatrix} 5 & \sum x_i \\ \sum x_i & \sum x_i^2 \end{pmatrix} = \begin{pmatrix} 5 & 15 \\ 15 & 55 \end{pmatrix}$，$\mathbf{X}^\top\mathbf{y} = \begin{pmatrix} \sum y_i \\ \sum x_i y_i \end{pmatrix} = \begin{pmatrix} 20 \\ 69 \end{pmatrix}$。
                解线性方程组 $5\beta_0 + 15\beta_1 = 20$ 与 $15\beta_0 + 55\beta_1 = 69$：第二式减三倍第一式得 $10\beta_1 = 9 \implies \hat{\beta}_1 = 0.9$，代回得 $\hat{\beta}_0 = 1.3$，与最小二乘公式一模一样。
      - item:
          id: normal-eq-solve
          type: number
          prompt: |
            某回归问题经居中化处理后算得 $\mathbf{X}^\top\mathbf{X} = \begin{pmatrix} 4 & 0 \\ 0 & 10 \end{pmatrix}$，$\mathbf{X}^\top\mathbf{y} = \begin{pmatrix} 12 \\ 35 \end{pmatrix}$。解正规方程 $\mathbf{X}^\top\mathbf{X}\hat{\boldsymbol{\beta}} = \mathbf{X}^\top\mathbf{y}$ 得出的斜率 $\hat{\beta}_1$（第二个分量）是多少？
          answer: 3.5
          hint: 这里是非对角项为 0 的对角矩阵，两个方程各自独立。
          explain: |
            由第二行方程 $10\hat{\beta}_1 = 35$，直接解得 $\hat{\beta}_1 = 3.5$（同时第一行 $4\hat{\beta}_0 = 12$ 给出 $\hat{\beta}_0 = 3$）。
      - item:
          id: projection-orthogonality
          type: choice
          prompt: |
            从线性代数正交投影的角度看，正规方程 $\mathbf{X}^\top(\mathbf{y} - \mathbf{X}\hat{\boldsymbol{\beta}}) = \mathbf{0}$ 说明了残差向量 $\mathbf{e} = \mathbf{y} - \mathbf{X}\hat{\boldsymbol{\beta}}$ 具有什么性质？
          options:
            - text: 残差向量与设计矩阵 $\mathbf{X}$ 的每一列都正交，因此含截距时残差总和为 0，且残差与各特征列的内积均为 0
              correct: true
            - text: 只要正规方程有唯一解，残差向量 $\mathbf{e}$ 的每一个分量就都会等于 0，所有样本点都落在回归超平面上
              why: 只有所有点恰好严格共面时残差向量才为零向量；一般情况是残差向量垂直于 $\mathbf{X}$ 的列空间
            - text: 设计矩阵 $\mathbf{X}$ 的样本行数 $n$ 与特征列数 $p+1$ 必须相等，否则无法计算矩阵乘积 $\mathbf{X}^\top\mathbf{X}$
              why: $\mathbf{X}$ 是 $n \times (p+1)$ 的长方矩阵，无论 $n$ 比 $p+1$ 大多少，$\mathbf{X}^\top\mathbf{X}$ 都是 $(p+1) \times (p+1)$ 的方阵
            - text: 正规方程通过正交投影找到的系数向量 $\hat{\boldsymbol{\beta}}$，能够使所有样本残差的一阶大小之和达到最小
              why: 正交投影最小化的是欧氏距离平方 $\sum e_i^2$，而非残差一阶离差之和
          explain: |
            与全 1 列正交保证了含截距回归的残差之和必定为 0，与每个特征列正交则保证残差里不再留有该特征能线性解释的信息。
      - card:
          title: 多元斜率与投影矩阵视角
          body: |
            把最优拟合值写成 $\hat{\mathbf{y}} = \mathbf{X}\hat{\boldsymbol{\beta}} = \mathbf{H}\mathbf{y}$，其中的方阵 $\mathbf{H} = \mathbf{X}(\mathbf{X}^\top\mathbf{X})^{-1}\mathbf{X}^\top$ 把原响应向量正交投射到特征列张成的子空间上，就像阳光垂直照向桌面落下的影子。
            实际写程序求解正规方程时，很少直接先算逆矩阵 $(\mathbf{X}^\top\mathbf{X})^{-1}$——列数多或接近共线时直接求逆容易放大浮点舍入误差，统计软件通常改用正交三角分解或奇异值分解来稳定求解最小二乘问题。

  - id: categorical-and-interactions
    chapter: 线性/广义线性模型
    title: 定性变量编码与交互效应
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            你想用线性回归分析不同城市（北京、上海、深圳）的工资差异。有同学把这三个城市编成数字 `1, 2, 3` 当作一个连续数值特征直接放进 $y = \beta_0 + \beta_1 x$。这样做会带来什么问题？
          options:
            - text: 会假定“上海与北京的平均工资差”和“深圳与上海的平均工资差”相等，把无序类别当成了等距刻度
              correct: true
            - text: 只要在数据表里把列名取成文字名称，线性回归公式 $\beta_0 + \beta_1 x$ 就会自动忽略 1、2、3 的数值大小关系
              why: 线性回归只做数值乘加 $\beta_1 \cdot x$，代入 1, 2, 3 就强制规定 3 减 2 的效应等于 2 减 1 的效应
            - text: 编成 `1, 2, 3` 会导致设计矩阵 $\mathbf{X}^\top\mathbf{X}$ 的行列式恒等于 0，使正规方程无法求出任何斜率
              why: 只要样本里三个城市都有数据，单列 `1, 2, 3` 与全 1 截距列线性无关，能算出斜率，但算出的模型结构是不合理的等差约束
          explain: |
            没有大小顺序的定性特征不能直接编成 `1, 2, 3`；正确做法是用只取 `0` 或 `1` 的示性变量（虚拟变量）来分别表示。
      - card:
          title: 示性变量与定性类别编码
          body: |
            对于没有数值顺序的定性变量（例如“春/夏/秋/冬” 4 个季节），我们挑选其中一个作为**基准组（reference level）**（比如“春”），给其余 3 个类别各设一个只取 `0` 或 `1` 的**示性变量（indicator variable）** $D_{\text{夏}}, D_{\text{秋}}, D_{\text{冬}}$。
            如果模型里已经有一列全 1 的截距，不要为全部 4 个类别都加示性列——因为 $D_{\text{春}} + D_{\text{夏}} + D_{\text{秋}} + D_{\text{冬}} = 1$ 会和全 1 列完全线性相关，导致 $\mathbf{X}^\top\mathbf{X}$ 不可逆。所以 $k$ 个类别只需设 **$k - 1$** 个示性变量，基准组的均值直接落在截距里，其余类的系数表示它相对基准组高出或低了多少。
      - item:
          id: dummy-count-rule
          type: number
          prompt: |
            某数据集里“支付方式”共有 4 个类别（现金、银行卡、移动支付、积分兑换），回归模型已经包含了常规截距项 $\beta_0$。把“支付方式”编成示性变量列时，需要额外加入几列 0/1 示性变量？
          answer: 3
          hint: 记住 $k$ 个类别需要设 $k - 1$ 个示性变量，把剩下那一个留作基准组。
          explain: |
            $4 - 1 = 3$ 个。若设足 4 个，四列相加恒等于截距全 1 列，会引发完全共线性（常说的虚拟变量陷阱）。
      - card:
          title: 可加效应与交互效应
          body: |
            同时放入定量特征 $X$ 和示性特征 $D \in \{0, 1\}$ 时，有两种常见模型：
            - **可加模型（additive model）**：$\hat{y} = \beta_0 + \beta_1 X + \beta_2 D$。当 $D=0$ 和 $D=1$ 时画出来是**两条斜率相同但上下平行移动的直线**，假设 $X$ 对 $Y$ 的斜率效应与类别无关。
            - **交互效应（interaction effect）**：加入两者的乘积项 $\beta_3 (X \cdot D)$，模型变成 $\hat{y} = \beta_0 + \beta_1 X + \beta_2 D + \beta_3 (X \cdot D)$。此时 $D=1$ 的斜率变成 $\beta_1 + \beta_3$，两条线不再平行，表示一个变量的作用大小依赖于另一个变量的取值。两个定量特征之间同样可以加乘积交互项 $\beta_3 X_1 X_2$。
      - card:
          title: 例子：拆解带交互项的拟合方程与遗漏后果
          body: |
            假设某城市与工龄薪资模型为 $\hat{y} = 40 + 5X + 10D + 2(X \cdot D)$（$X$ 为工龄年数，$D=0$ 代表普通城市，$D=1$ 代表一线城市）。
          reveal:
            - title: 第 1 步：写出两组各自的直线方程
              body: |
                当 $D = 0$ 时，带 $D$ 的两项消失，方程为 $\hat{y} = 40 + 5X$（起点 40，每年涨 5）。
                当 $D = 1$ 时，合并常数项与含 $X$ 项：$\hat{y} = (40 + 10) + (5 + 2)X = 50 + 7X$（起点 50，每年涨 7）。
            - title: 第 2 步：认识遗漏重要交互项的后果
              body: |
                如果现实中两组确实坡度不同（一陡一缓），却只用不含乘积项的平行线可加模型，拟合出的单条公共斜率会折中成“两头都不准”，造成系统性偏误和残差规律性弯曲。同时注意层级原则：只要保留了高阶交互项 $X \cdot D$，通常应保留各自的主效应项 $X$ 和 $D$。
      - item:
          id: interaction-slope-calc
          type: number
          prompt: |
            某带交互项的回归模型为 $\hat{y} = 20 + 4X + 6D + 3(X \cdot D)$，其中 $D \in \{0, 1\}$。当 $D = 1$ 时，特征 $X$ 每增加 1 个单位，预测值 $\hat{y}$ 增加多少？
          answer: 7
          hint: 把 $D = 1$ 代入模型合并含有 $X$ 的所有项系数。
          explain: |
            当 $D = 1$ 时，$\hat{y} = (20 + 6) + (4 + 3)X = 26 + 7X$，所以 $X$ 的有效斜率是 $4 + 3 = 7$。
      - item:
          id: missing-interaction-choice
          type: choice
          prompt: |
            假如某药物只在年轻人群体中有效（斜率很陡）、在老年人群体中几乎无效（斜率平缓），但分析时却漏掉了“剂量 × 年龄组”交互项。会发生什么？
          options:
            - text: 模型强迫两组共用一条平行斜率，导致年轻人效果被低估、老年人效果被高估，拟合产生明显偏差
              correct: true
            - text: 只要不写交互项，标准误就会自动缩小一半，预测变得更准
              why: 遗漏真实结构会让未解释的规律全挤进残差里，不仅估计有偏，残差方差 $s^2$ 也会偏高
            - text: 两条线会自动旋转到各自的最佳角度，不需要交互项
              why: 没有乘积项的模型数学上只能输出完全相同的 $X$ 斜率，始终保持平行
            - text: 会直接导致设计矩阵 $\mathbf{X}^\top\mathbf{X}$ 变成奇异矩阵不可逆
              why: 遗漏交互项是“少列”（欠拟合），不会增加线性相关性；多设了冗余的虚拟列才会导致奇异
          explain: |
            现实世界中交互效应十分常见（比如广告渠道与季节、肥料与土壤湿度），用乘积项搭配分组散点图很容易检查它是否存在。
      - item:
          id: additive-vs-interaction
          type: choice
          prompt: |
            对于两个连续变量构成的方程 $\hat{y} = 10 + 2x_1 + 3x_2 + 0.5 x_1 x_2$，下面哪种解读正确？
          options:
            - text: 当 $x_2 = 4$ 时，$x_1$ 每增加 1 单位导致 $\hat{y}$ 平均增加 $2 + 0.5 \times 4 = 4$
              correct: true
            - text: 因为模型里加入了两个变量的乘积项 $x_1 x_2$，它已经不再属于对参数线性的回归模型，无法通过正规方程求解
              why: 只要把 $z = x_1 x_2$ 当作设计矩阵的一列新特征，模型关于参数 $(\beta_0, \beta_1, \beta_2, \beta_3)$ 依然是线性的，可直接用正规方程求解
            - text: 无论 $x_2$ 取什么数值，只要保持 $x_2$ 固定不变，$x_1$ 每增加 1 个单位时 $\hat{y}$ 的平均增量都恒等于主效应系数 2
              why: 对 $x_1$ 求偏导得 $2 + 0.5 x_2$，因此 $x_1$ 的边际斜率会随 $x_2$ 的取值而变化
            - text: 乘积项前面的系数 $0.5$ 直接等于自变量 $x_1$ 与自变量 $x_2$ 之间的样本皮尔逊相关系数
              why: 交互系数反映的是一个自变量的斜率随另一个自变量变化的幅度，不是两个自变量自身的相关系数
          explain: |
            在设计矩阵里多添一列 $x_1 x_2$，就能用同一套线性最小二乘工具估计两个连续特征之间的交互效应。

  - id: transforms-and-nonlinear
    chapter: 线性/广义线性模型
    title: 变量变换、多项式与非线性回归
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            你在拟合汽车重量和刹车距离的关系时发现数据明显向上弯曲，于是给设计矩阵多加了一列 $x^2$，拟合 $\hat{y} = \beta_0 + \beta_1 x + \beta_2 x^2$。这条抛物线画出来明明是弯的，为什么统计书还把它归进“**线性**回归”里？
          options:
            - text: 线性回归里的“线性”指的是关于未知参数 $\beta_0, \beta_1, \beta_2$ 是线性的，而不是非要画出一条直线
              correct: true
            - text: 因为抛物线在 $x=0$ 附近其实是一条直线
              why: 即使在整个区间上弯曲，模型依然叫线性回归，关键看参数有没有被嵌进非线性函数里
            - text: 只是历史叫法错误，多项式回归没法用正规方程 $\mathbf{X}^\top\mathbf{X}\boldsymbol{\beta}=\mathbf{X}^\top\mathbf{y}$ 求解
              why: 只需把 $(1, x, x^2)$ 排进设计矩阵，正规方程就能一步精确解出 $(\beta_0, \beta_1, \beta_2)$
          explain: |
            分清“对特征非线性”和“对参数非线性”是理解回归建模和后续核方法、基展开的钥匙。
      - card:
          title: 多项式回归与真正的非线性回归
          body: |
            在多项式回归 $Y = \beta_0 + \beta_1 x + \beta_2 x^2 + \varepsilon$ 中，如果把 $x^2$ 看作第二个输入列，模型关于参数 $\boldsymbol{\beta}$ 完全是一次线性组合，依然可以用正规方程一步求解（只是高次多项式在样本范围外推时容易剧烈摆动）。
            真正超出“线性模型”边界的，是参数自身处在非线性结构里的**非线性回归（nonlinear regression）**，例如酶反应饱和曲线 $Y = \frac{\alpha x}{\gamma + x} + \varepsilon$ 或指数衰减 $Y = \alpha e^{-\gamma x} + \varepsilon$。它们的正规方程不再有闭式线性解，需要靠**牛顿法**等数值优化算法逐步逼近。
      - item:
          id: poly-is-linear-model
          type: choice
          prompt: |
            下面哪一个模型**不属于**“对参数线性”的线性回归模型，而必须使用非线性回归求解？
          options:
            - text: $Y = \frac{\beta_0 x}{\beta_1 + x} + \varepsilon$
              correct: true
            - text: $Y = \beta_0 + \beta_1 x + \beta_2 x^2 + \beta_3 x^3 + \varepsilon$
              why: 虽然有 $x^2, x^3$，但所有参数 $\beta_j$ 都是单纯的一次乘加，属于线性回归
            - text: $Y = \beta_0 + \beta_1 \ln x + \varepsilon$
              why: 先把 $x$ 取自然对数算成一列固定数值特征，对 $\beta_0, \beta_1$ 依然完全线性
            - text: $Y = \beta_0 + \beta_1 \sin(x) + \beta_2 \cos(x) + \varepsilon$
              why: $\sin(x)$ 和 $\cos(x)$ 不含未知参数，对 $\beta_0, \beta_1, \beta_2$ 依然是标准线性模型
          explain: |
            只要参数 $\beta_j$ 全以加权系数的方式排在已知函数列前面，就全部落进设计矩阵和正规方程的管辖范围；一旦参数钻进了分母或指数内部（除非能两边取对数拆开），才是真正的非线性回归。
      - card:
          title: 对数变换的三类解释与幂变换
          body: |
            数据弯曲或方差不匀时，对 $X$ 或 $Y$ 做单调幂变换常能把关系拉直并稳住方差。尤其常用**自然对数** $\ln$ 的三种组合：
            - **仅对 $X$ 取对数**（$\hat{y} = b_0 + b_1 \ln x$）：适合边际效应递减的曲线，$x$ 翻 $k$ 倍（如翻倍），$\hat{y}$ 固定变动 $b_1 \ln k$ 个单位。
            - **仅对 $Y$ 取对数**（$\ln\hat{y} = b_0 + b_1 x$）：适合指数增长且误差成比例缩放的数据，$x$ 每多 1 单位，$\hat{y}$ 乘上倍数 $e^{b_1}$。
            - **双对数变换**（$\ln\hat{y} = b_0 + b_1 \ln x$）：对应幂律关系 $y \propto x^{b_1}$，斜率 $b_1$ 是经济学常说的“弹性”——$x$ 变动 $1\%$ 约引起 $y$ 变动 $b_1\%$（精确倍数是 $(1.01)^{b_1}$）。
      - card:
          title: Box-Cox 变换族与数据变换原则
          body: |
            除了对数和开平方（$\sqrt{y}$ 常用来稳住计数方差）、取倒数（$1/y$）之外，**Box-Cox 变换**把这一整族幂变换统一写成参数化的 $y^{(\lambda)} = \frac{y^\lambda - 1}{\lambda}$（当 $\lambda = 0$ 时平滑接上 $\ln y$），用**最大似然估计**搜索最能让残差贴近正态且等方差的幂指数 $\lambda$。
            注意一条原则：对 $Y$ 做完对数或幂次变换（如 $\ln y$）再用普通线性回归预测出来的 $\widehat{\ln y}$，若直接取指数 $e^{\widehat{\ln y}}$ 估的是中位数而非算术均值，而且不能直接拿变换前后的 $R^2$ 跨尺度比高低。
      - item:
          id: semilog-multiplier
          type: number
          prompt: |
            在半对数回归模型 $\ln\hat{y} = 3 + 0.1 x$ 中，自变量 $x$ 每增加 1 个单位，预测响应 $\hat{y}$ 就会乘上哪个倍数 $e^{0.1}$？（保留至少三位小数）
          answer: 1.105171
          tolerance: 0.002
          hint: 计算 $e^{0.1} \approx 2.71828^{0.1}$。
          explain: |
            当 $x$ 变成 $x + 1$，新的 $\ln\hat{y}_{\text{new}} = \ln\hat{y}_{\text{old}} + 0.1$，两边取指数得 $\hat{y}_{\text{new}} = e^{0.1}\hat{y}_{\text{old}} \approx 1.105 \hat{y}_{\text{old}}$（大约增长 $10.5\%$）。
      - card:
          title: 例子：怎样挑选对数、幂变换或非线性模型
          body: |
            遇到非线性散点图时，怎样顺着图形决定该先试对数变换还是直接上非线性回归？
          reveal:
            - title: 第 1 步：观察误差波动是不是跟着响应放大
              body: |
                如果当 $x$ 增大时，散点不仅向上翘成指数曲线，而且上下散开的幅度也按比例变大（呈漏斗形），先试对 $Y$ 取自然对数 $\ln y$：这一步往往同时把指数曲率拉直、又把乘性误差变成等方差的加性误差。
            - title: 第 2 步：比较双对数弹性与无法线性化的饱和曲线
              body: |
                如果生物剂量或规模效应呈幂律 $y = c\,x^\alpha$，两边取对数 $\ln y = \ln c + \alpha \ln x$ 就回到了简单线性回归；但如果是 $y = \frac{\alpha x}{\gamma + x} + \varepsilon$ 这类带加性误差的米氏饱和曲线，拆不开对数，就需要保留原尺度并用数值算法拟合非线性回归。
      - item:
          id: loglog-power-ratio
          type: number
          prompt: |
            在双对数回归模型 $\ln\hat{y} = 4 - 0.8 \ln x$ 中，如果自变量 $x$ 增加到原来的 2 倍，新的预测值 $\hat{y}_{\text{new}}$ 是原来 $\hat{y}_{\text{old}}$ 的多少倍（即 $2^{-0.8}$）？（保留至少三位小数）
          answer: 0.574349
          tolerance: 0.002
          hint: 计算 $\ln\hat{y}_{\text{new}} - \ln\hat{y}_{\text{old}} = -0.8 \ln 2$ 再取指数。
          explain: |
            因为 $\hat{y} \propto x^{-0.8}$，$x$ 变成 2 倍时，$\hat{y}$ 变为原来的 $2^{-0.8} \approx 0.5743$ 倍。
      - item:
          id: boxcox-choice
          type: choice
          prompt: |
            关于 Box-Cox 变换与数据变换实践，下面哪一项说法准确？
          options:
            - text: Box-Cox 变换通过寻找合适的幂指数 $\lambda$（涵盖 $\ln y$、$\sqrt{y}$ 等）同时改善残差正态性与等方差问题
              correct: true
            - text: 对响应变量 $Y$ 取自然对数后拟合的回归决定系数 $R^2$，可以直接与未变换原尺度 $Y$ 回归的 $R^2$ 比大小来挑模型
              why: 两个模型的响应变量不在同一尺度上，总变异平方和 $\mathrm{SST}$ 的定义已经改变，不能直接跨尺度比较 $R^2$
            - text: Box-Cox 幂变换公式 $(y^\lambda - 1)/\lambda$ 可以直接套用在包含负数和零的原始响应变量 $Y$ 上
              why: 一般实数幂次和 $\ln y$（对应 $\lambda=0$）要求响应值 $Y$ 严格大于 0；含零或负数时需先平移或改用其他变换
            - text: 一旦对自变量 $X$ 做了对数变换 $\ln X$，回归模型就失去了参数正态抽样分布，无法再计算斜率的置信区间
              why: 把 $\ln X$ 当作新特征列之后，模型对回归系数依然是标准线性回归，置信区间和检验照常适用
          explain: |
            Box-Cox 为寻找“更贴合线性、等方差与正态假设”的响应尺度提供了依据，但变换后预测尺度与残差含义也要同步还原。

  - id: logistic-poisson-glm
    chapter: 线性/广义线性模型
    title: Logistic 回归、泊松回归与广义线性模型
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            如果想根据“复习小时数 $x$”预测“考试通过（$Y=1$）还是挂科（$Y=0$）”的概率 $p$，有人直接拿普通线性回归 $\hat{p} = b_0 + b_1 x$ 去拟合。这种直线模型最明显会遇到什么问题？
          options:
            - text: 当复习时间较长或较短时，直线会预测出大于 1 或小于 0 的不合法概率
              correct: true
            - text: 当响应变量只取 0 和 1 两个数值时，设计矩阵 $\mathbf{X}^\top\mathbf{X}$ 必定不可逆，无法用正规方程算出截距和斜率
              why: $\mathbf{X}^\top\mathbf{X}$ 只取决于自变量 $x$，与 $Y$ 取 0/1 无关，正规方程能算出直线，只是直线两端会越出 $[0, 1]$
            - text: 普通最小二乘拟合 0/1 数据时，求出来的斜率 $b_1$ 恒等于 0，使预测概率永远停留在常数 0.5
              why: 只要通过与挂科同学的复习时间均值不同，最小二乘斜率就不为 0，只是直线不会在 0 和 1 边界处自动弯曲变平
          explain: |
            直线会向正负无穷延伸，不能自动贴合有边界的概率（$[0, 1]$）或非负计数（$[0, +\infty)$）。我们需要一个把受限均值和实数线性预测器连接起来的函数。
      - card:
          title: 广义线性模型（GLM）的三块拼图
          body: |
            把普通线性回归推广到二元分类、计数次数等非正态问题上的统一框架，叫做**广义线性模型（generalized linear model, GLM）**。它由三部分组成：
            1. **分布族**：响应变量 $Y$ 服从某种指数族分布（如伯努利、泊松、正态），均值记作 $\mu = E[Y \mid \mathbf{x}]$；
            2. **线性预测器**：还是熟悉的特征加权和 $\eta = \beta_0 + \beta_1 x_1 + \dots + \beta_p x_p$；
            3. **连接函数（link function）** $g(\mu) = \eta$：负责把受限的均值 $\mu$ 映射到整条无约束的实轴上。普通线性回归就是取恒等连接 $g(\mu) = \mu$ 的特例。
      - item:
          id: glm-link-why
          type: choice
          prompt: |
            在广义线性模型（GLM）框架中，连接函数 $g(\mu) = \eta$ 究竟起什么关键作用？
          options:
            - text: 把受限在有限区间或正半轴的条件均值 $\mu$，映射到可取任意实数的线性预测器 $\eta$ 上
              correct: true
            - text: 对设计矩阵中的每一列自变量 $x_j$ 做非线性变换，确保所有输入特征在拟合前都服从标准正态分布
              why: 连接函数作用在响应的条件期望 $\mu = E[Y \mid \mathbf{x}]$ 上，并不对输入特征 $x_j$ 做正态化处理
            - text: 把所有非正态分布的回归问题都转化为可以用正规方程 $(\mathbf{X}^\top\mathbf{X})^{-1}\mathbf{X}^\top\mathbf{y}$ 一步求出的闭式解
              why: 除恒等连接正态模型外，一般 GLM（如 Logistic 回归、泊松回归）没有闭式解，需用牛顿法或迭代重加权最小二乘求最大似然估计
            - text: 把连续的线性预测值直接截断成离散的 0 或 1，保证模型输出的预测概率永远精确等于 0 或 1
              why: logit 连接函数把开区间 $(0, 1)$ 内的概率映射到整条实轴，而它的反函数（Sigmoid 函数）把线性预测值 $\eta$ 映回 $(0, 1)$ 内的连续概率，不会只输出 0 或 1
          explain: |
            线性预测器 $\eta$ 可以在 $(-\infty, +\infty)$ 自由取值，连接函数 $g(\mu) = \eta$ 与它的反函数 $\mu = g^{-1}(\eta)$ 构成了受限均值与实数线性组合之间的双向桥梁。
      - card:
          title: Logistic 回归与发生比
          body: |
            当结果只有 0 和 1（如是否违约、是否点击）时，我们需要预测成功概率 $p \in (0, 1)$。先算出**发生比（odds）** $\frac{p}{1 - p}$（范围为 $(0, +\infty)$），再取自然对数得到 **logit 连接函数**：
            $$\ln\left(\frac{p}{1 - p}\right) = \beta_0 + \beta_1 x_1 + \dots + \beta_p x_p = \eta$$
            反解出来，就得到 **Logistic 回归**：$p = \frac{1}{1 + e^{-\eta}}$，它画出来是一条落在 $(0, 1)$ 之间的 S 形曲线。当 $x_j$ 增加 1 个单位时，对数发生比增加 $\beta_j$，发生比自身则乘上**优势比（odds ratio）** $e^{\beta_j}$。参数不再用最小二乘闭式求解，而是通过数值方法求**最大似然估计**。
      - card:
          title: 例子：算出 Logistic 预测概率与优势比
          body: |
            已知某信用违约 Logistic 模型为 $\ln\left(\frac{p}{1-p}\right) = -2 + 0.5x$（$x$ 为未按期次数）。
          reveal:
            - title: 第 1 步：代入 x 计算线性预测值与预测概率
              body: |
                当 $x = 4$ 时，线性预测值 $\eta = -2 + 0.5 \times 4 = 0$。代入反解公式得发生比 $e^0 = 1$，因此违约概率 $p = \frac{1}{1 + e^0} = 0.5$。
            - title: 第 2 步：用优势比解释系数
              body: |
                如果 $x$ 从 $4$ 涨到 $6$（增加 2 次），线性预测值 $\eta$ 增加 $0.5 \times 2 = 1.0$，因此违约发生比 $\frac{p}{1-p}$ 会乘以 $e^{1.0} \approx 2.718$ 倍。
      - item:
          id: logistic-prob-calc
          type: number
          prompt: |
            设某逻辑（Logistic）回归模型为 $\ln\left(\frac{p}{1 - p}\right) = -1 + 0.5x$。当 $x = 4$ 时，预测成功概率 $p = \frac{1}{1 + e^{-\eta}}$ 是多少？（保留至少三位小数）
          answer: 0.731059
          tolerance: 0.002
          hint: 先算 $\eta = -1 + 0.5 \times 4 = 1$，再算 $\frac{1}{1 + e^{-1}}$。
          explain: |
            $\eta = 1$，因此 $p = \frac{1}{1 + e^{-1}} = \frac{e}{e + 1} \approx 0.7311$。
      - item:
          id: logistic-odds-ratio
          type: number
          prompt: |
            在同一模型 $\ln\left(\frac{p}{1 - p}\right) = -1 + 0.5x$ 中，当特征 $x$ 增加 $2$ 个单位时，事件发生的**发生比** $\frac{p}{1 - p}$ 会变成原来的多少倍？（保留至少三位小数）
          answer: 2.718282
          tolerance: 0.005
          hint: 对数发生比增加了 $0.5 \times 2 = 1$，取指数即得倍数。
          explain: |
            $\ln(\text{odds}_{\text{new}}) - \ln(\text{odds}_{\text{old}}) = 0.5 \times 2 = 1$，两边取指数得发生比扩大为原来的 $e^1 \approx 2.718$ 倍。
      - card:
          title: 泊松回归与计数建模
          body: |
            如果预测目标是“每天到达急诊室的病人数”或“路口一小时违章次数”这类非负整数计数，常用**泊松回归（Poisson regression）**。
            由于期望计数 $\lambda > 0$ 不能是负数，泊松回归采用**对数连接函数**：$\ln \lambda = \beta_0 + \beta_1 x_1 + \dots + \beta_p x_p$，反解得 $\lambda = e^{\beta_0 + \beta_1 x_1 + \dots + \beta_p x_p} > 0$。当需要记录不同观察时长 $t$ 下的发生率时，还可以加上固定偏移项 $\ln t$。
      - item:
          id: poisson-expected-count
          type: number
          prompt: |
            已知某路段一小时事故次数的泊松回归模型为 $\ln\hat{\lambda} = 1 + 0.2x$（$x$ 为车流密度指标）。当 $x = 5$ 时，预测的一小时平均事故次数 $\hat{\lambda}$ 是多少？（保留至少三位小数）
          answer: 7.389056
          tolerance: 0.005
          hint: 先算 $\ln\hat{\lambda} = 1 + 0.2 \times 5 = 2$，再算 $e^2$。
          explain: |
            $\ln\hat{\lambda} = 2 \implies \hat{\lambda} = e^2 \approx 7.389$ 次。对数连接保证了无论特征 $x$ 取正取负，平均计数预测始终大于 0。
      - item:
          id: glm-components-match
          type: match
          prompt: |
            把广义线性模型里的几种常见响应类型与对应的标准连接函数、适用场景配对。
          pairs:
            - ["二元 0/1 分类概率", "logit 连接 ln(p/(1−p))"]
            - ["非负整数事件次数", "对数连接 ln(λ)"]
            - ["无界连续正态响应", "恒等连接 μ"]
            - ["线性预测器 η", "各特征按系数加权求和"]
          explain: |
            在设计矩阵加上不同的连接函数和分布族，就让原本只处理连续直线的线性模型一路扩展到分类与计数问题。

  # =====================================================================
  # 第 2 章：残差诊断与不确定性
  # =====================================================================
  - id: regression-inference-anova
    chapter: 残差诊断与不确定性
    title: 回归系数推断、方差分析表与 F 检验
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            你在多元回归里同时放入了 5 个特征，总 F 检验显著，但看每个特征各自的 $t$ 检验时，却发现其中两个特征的 $p$ 值都大于 0.2。能不能直接把这两个特征一并删掉，还是得做一次联合对比检验？
          options:
            - text: 应当用一般线性 F 检验同时测试“这两个系数联合为零”，因为共线特征单独看可能都不显著、合起来却很重要
              correct: true
            - text: 只要某几个特征各自的单变量 $t$ 检验 $p$ 值都大于 0.05，就可以直接把它们一次性全部删掉，残差平方和不会明显增加
              why: 两个高度相关的特征单独看都觉得“有对方就够了”，各自 $t$ 检验不显著，但同时删掉两个会丢失整块预测信号
            - text: 只要方差分析表的总 F 检验显著，就说明模型里的每一个单独特征都具有不可替代的显著贡献，一个都不能删
              why: 总 F 检验只说明“至少有一个斜率不为 0”，并不保证每一个特征的斜率都显著不为 0
          explain: |
            单个 $t$ 检验每次只测“单独拿掉这一列”的影响，一般线性 F 检验则可以评估“同时删掉一整组特征”会不会显著增大残差平方和。
      - card:
          title: 回归系数推断与方差分析表（ANOVA）
          body: |
            在正态等方差误差假设下，每个最小二乘斜率估计 $\hat{\beta}_j$ 都服从正态抽样分布。用残差标准误 $s = \sqrt{\mathrm{SSE}/(n-p-1)}$ 算出系数标准误 $\mathrm{SE}(\hat{\beta}_j)$ 后，检验 $H_0: \beta_j = 0$ 的统计量 $t = \frac{\hat{\beta}_j}{\mathrm{SE}(\hat{\beta}_j)}$ 服从自由度为 $n - p - 1$ 的 $t$ 分布，置信区间也按 $\hat{\beta}_j \pm t_{\alpha/2,\,n-p-1}\mathrm{SE}(\hat{\beta}_j)$ 写出。
            同时，**方差分析（ANOVA）**把总变异 $\mathrm{SST} = \mathrm{SSR} + \mathrm{SSE}$ 连同自由度 $(n - 1) = p + (n - p - 1)$ 一起拆开，用整体 $F = \frac{\mathrm{SSR}/p}{\mathrm{SSE}/(n-p-1)}$ 测试“所有斜率是不是全部为 0”。
      - item:
          id: coef-t-stat
          type: number
          prompt: |
            在某回归输出表中，特征“经验年数”的斜率估计值为 $\hat{\beta}_1 = 2.4$，标准误为 $\mathrm{SE}(\hat{\beta}_1) = 0.8$。检验零假设 $H_0: \beta_1 = 0$ 时的 $t$ 统计量等于多少？
          answer: 3
          hint: 用系数估计值减去假设值 0，再除以它的标准误。
          explain: |
            $t = \frac{2.4 - 0}{0.8} = 3$。当自由度不是太小时，$|t| = 3$ 对应的双侧 $p$ 值远小于 $0.05$，有强证据拒绝 $\beta_1 = 0$。
      - item:
          id: anova-f-calc
          type: number
          prompt: |
            某简单线性回归（$p = 1$）共有 $n = 22$ 个样本，算得回归平方和 $\mathrm{SSR} = 80$，残差平方和 $\mathrm{SSE} = 160$。用均方比 $F = \frac{\mathrm{SSR}/1}{\mathrm{SSE}/(n - 2)}$ 计算 ANOVA 表中的 $F$ 统计量是多少？
          answer: 10
          hint: 自由度 $n - 2 = 20$，先分别算出分子均方 $\mathrm{MSR}$ 和分母均方 $\mathrm{MSE}$。
          explain: |
            $\mathrm{MSR} = 80/1 = 80$，$\mathrm{MSE} = 160/20 = 8$，因此 $F = 80 / 8 = 10$（且简单线性回归里恰好满足 $F = t^2$）。
      - card:
          title: 失拟 F 检验与三类参数检验
          body: |
            当同一个 $x$ 值上测到了好几次重复观测时，普通 $\mathrm{SSE}$ 其实混杂了“同一点内部固有的纯随机起伏（纯误差 $\mathrm{SSPE}$）”和“直线拟合不到真实弯曲线形的偏离（失拟误差 $\mathrm{SSLF}$）”。**失拟 F 检验**把 $\mathrm{SSE}$ 拆成这两部分并计算 $\frac{\mathrm{SSLF}/df_{\text{LF}}}{\mathrm{SSPE}/df_{\text{PE}}}$：如果显著，就说明直线模型形式不对，需要补充曲线项。
            此外在多元回归中，检验通常分三类：只测单个系数（$t$ 检验）、测整体全部系数（总 $F$ 检验），以及对比全模型与简化模型（一般线性 $F$ 检验）。
      - item:
          id: lack-of-fit-choice
          type: choice
          prompt: |
            在存在重复 $x$ 观测的回归分析中，做“失拟（Lack-of-Fit）$F$ 检验”发现 $p$ 值很小（拒绝零假设），这说明了什么？
          options:
            - text: 观测点偏离直线的程度显著大于同位置重复测量的纯随机误差，说明直线模型形式存在系统性失拟，应考虑加入曲线项
              correct: true
            - text: 同一自变量位置上重复测量的纯随机噪声方差 $\mathrm{SSPE}$ 过大，任何曲线都无法进一步减小残差平方和
              why: 若纯误差很大而失拟误差小，$F$ 比值会接近 1、不会拒绝零假设；拒绝零假设恰恰说明是均值函数形式没选对
            - text: 当前的简单线性回归已经完整捕捉了真实的均值规律，只是因为样本量太大才导致检验 $p$ 值小于 0.05
              why: 若真实关系确实是直线，失拟均方与纯误差均方的期望相等，即使样本量很大也不会系统性地给出很小的 $p$ 值
            - text: 数据集中存在相同的 $x$ 观测值违反了回归前提，必须先把重复的 $x$ 样本删到只剩一个
              why: 回归并不要求自变量取值互不相同，而且恰恰需要同一 $x$ 处的重复观测才能单独估计纯误差 $\mathrm{SSPE}$
          explain: |
            记住失拟检验的拆解思路：把 $\mathrm{SSE}$ 分成“模型改不了的重复点纯波动”与“换好模型就能消除的形状误差”。
      - card:
          title: 一般线性 F 检验与偏决定系数
          body: |
            如何检验一组系数同时为零（或者满足某些线性约束）？把带全部特征的“全模型”残差平方和记作 $\mathrm{SSE}_F$（自由度 $df_F$），删去待测变量后的“简化模型”记作 $\mathrm{SSE}_R$（自由度 $df_R$）。由于去掉特征后误差只增不减，一般线性 $F$ 检验看多出来的那部分误差是否显著：
            $$F = \frac{(\mathrm{SSE}_R - \mathrm{SSE}_F) / (df_R - df_F)}{\mathrm{SSE}_F / df_F}$$
            而**偏决定系数（partial $R^2$）**衡量新加入的特征组把简化模型原本还解释不了的那块误差又削减了多少比例：$\text{Partial } R^2 = \frac{\mathrm{SSE}_R - \mathrm{SSE}_F}{\mathrm{SSE}_R}$。
      - card:
          title: 例子：用嵌套模型比较检验新增特征组
          body: |
            已知简化模型有 1 个特征，$n = 25$ 个样本，因此 $df_R = 25 - 2 = 23$，算得 $\mathrm{SSE}_R = 140$。再多加入 2 个新特征得到全模型，自由度变为 $df_F = 25 - 4 = 21$，算得 $\mathrm{SSE}_F = 105$。
          reveal:
            - title: 第 1 步：计算一般线性 F 统计量
              body: |
                分子自由度差 $df_R - df_F = 23 - 21 = 2$。代入公式：
                $$F = \frac{(140 - 105)/2}{105/21} = \frac{17.5}{5} = 3.5$$
            - title: 第 2 步：计算新加入特征的偏决定系数
              body: |
                这 2 个特征把原先未解释的 $\mathrm{SSE}_R = 140$ 削减了 $140 - 105 = 35$，所以 $\text{Partial } R^2 = \frac{35}{140} = 0.25$（即解释了剩余误差的 $25\%$）。
      - item:
          id: partial-r2-calc
          type: number
          prompt: |
            在一个原本的简化回归模型中，残差平方和为 $\mathrm{SSE}_R = 200$。加入两个新特征构成全模型后，残差平方和降到了 $\mathrm{SSE}_F = 150$。新加入的这两个特征的偏决定系数（Partial $R^2$）是多少？
          answer: 0.25
          hint: 分子是新减少的残差平方和 $\mathrm{SSE}_R - \mathrm{SSE}_F$，分母是原来的 $\mathrm{SSE}_R$。
          explain: |
            $\text{Partial } R^2 = \frac{200 - 150}{200} = \frac{50}{200} = 0.25$。

  - id: residual-diagnostics
    chapter: 残差诊断与不确定性
    title: 回归四大假设与残差图诊断
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            某回归模型拟合完成后，把每个点的残差 $e_i$ 对拟合值 $\hat{y}_i$ 画成散点图，发现点群从左到右呈明显的“开口向右的喇叭口 / 漏斗形”（$\hat{y}_i$ 越大，残差上下散开越宽）。这种图形说明了什么？
          options:
            - text: 误差方差随拟合值增大而变大（存在异方差），导致常规标准误和假设检验不再可靠
              correct: true
            - text: 说明普通最小二乘求出的回归斜率正负号一定算反了，而且系数点估计存在严重的系统性偏差，必须作废重算
              why: 只要均值函数依然是线性的，存在异方差时普通最小二乘系数点估计仍然无偏，受损的是标准误、置信区间和 $t/F$ 检验
            - text: 说明残差已经随拟合值均匀展开，模型同时满足线性、独立、正态和等方差四条经典回归假设
              why: 满足等方差假设时，残差–拟合值图应当是一条上下宽度基本恒定的水平带状散点，而不是向右张开的漏斗形
          explain: |
            看残差图就像是给模型做体检：好的模型把系统的趋势结构都放进了回归方程，留下的残差应当像上下等宽的随机噪声。
      - card:
          title: 经典线性回归的四大假设
          body: |
            普通最小二乘虽然总能算出系数，但要让 $t$ 检验、$F$ 检验与区间公式完全可靠，需要误差满足四条经典假设（英文首字母合称 **LINE**）：
            1. **线性（Linearity）**：真实均值关系 $E[Y \mid \mathbf{x}]$ 确实是各特征的线性函数；
            2. **独立性（Independence）**：不同观测的误差彼此独立；
            3. **正态性（Normality）**：在给定 $\mathbf{x}$ 下，误差 $\varepsilon$ 服从正态分布（小样本精确推断需要它）；
            4. **等方差性（Equal variance）**：无论 $\mathbf{x}$ 或拟合值多大，误差方差恒为常数 $\sigma^2$。
      - card:
          title: 四大诊断图形看穿违背假设的信号
          body: |
            残差 $e_i = y_i - \hat{y}_i$ 是我们检验隐藏误差 $\varepsilon_i$ 的窗口。画四张图各司其职：
            - **残差–拟合值图（Residuals vs. Fits）**：最核心的一张图。若出现明显抛物线弯曲，说明违背**线性**；若呈左右不等宽的“漏斗形”，说明违背**等方差**（出现**异方差**）。
            - **残差–预测变量图**：看是否漏掉了某个特征的非线性高次项或交互作用。
            - **残差–观测次序图**：按收集顺序连线，若出现连续正/负波浪聚集，说明存在时间序列**自相关**，违背独立性。
            - **正态概率图（Q-Q 图）**：把排序残差对照标准正态理论分位数画出来，点群大致贴着斜对角直线才符合正态性。
      - item:
          id: funnel-residual-diag
          type: choice
          prompt: |
            某个回归的残差图呈“漏斗形”（$x$ 越大残差越分散），这说明违反了哪个假设、会带来什么后果、通常怎样处理？
          options:
            - text: 违反等方差假设（异方差）；系数估计仍无偏，但标准误和检验不可靠；可用对数变换、加权最小二乘或稳健标准误处理
              correct: true
            - text: 违反线性假设；说明真实均值函数一定是高次多项式，唯一办法是删掉线性项并把自变量替换成五次方项
              why: 漏斗形反映的是上下离散宽度（方差）随 $x$ 变化，而不是均值中心线发生弯曲；且异方差下斜率估计依然无偏
            - text: 违反误差独立性假设；只需在拟合前把数据表的行顺序随机打乱，重跑一次普通最小二乘就能消除漏斗形
              why: 漏斗形是误差方差与 $x$ 或拟合值大小挂钩，打乱样本行顺序不会改变任何一点的 $(x_i, y_i)$ 和残差分布宽度
            - text: 违反误差零均值假设；只需给所有响应变量 $y_i$ 加上同一个正的常数偏移量，就能让漏斗形变回水平等宽带
              why: 给所有 $y_i$ 加常数只会平移回归截距 $\hat{\beta}_0$，每个点的残差 $e_i$ 和它的离散宽度完全不变
          explain: |
            异方差的隐患在于“系数点估计没偏，但软件按常数方差算出的标准误、$p$ 值和置信区间不再准确”。对 $Y$ 做对数或 Box-Cox 变换、改用加权最小二乘（WLS）或异方差稳健标准误都可以解决。
      - item:
          id: residual-sum-zero
          type: number
          prompt: |
            在包含截距项的普通最小二乘线性回归中，已知 5 个观测的残差前 4 个依次为 `0.4, -0.7, 0.5, -0.6`。第 5 个残差 $e_5$ 必定等于多少？
          answer: 0.4
          hint: 回忆设计矩阵第一列全为 1 的正规方程：残差与全 1 列正交，即 $\sum e_i = 0$。
          explain: |
            因为含截距回归必满足 $\sum_{i=1}^5 e_i = 0$，前四个之和为 $0.4 - 0.7 + 0.5 - 0.6 = -0.4$，所以第 5 个残差必须是 $+0.4$。
      - card:
          title: 误差正态性检验与 Q-Q 图互补
          body: |
            除了肉眼看 Q-Q 图，还可以用正式的**误差正态性检验**（如 Shapiro–Wilk 或 Anderson–Darling 检验）把样本残差分布与正态理论分位数比对，零假设为“误差服从正态”。注意样本量很大时，中心极限定理会让回归系数近似正态，微小的尾部偏离通常不影响大局；小样本下则需要仔细留意厚尾与严重偏态。
      - item:
          id: qq-plot-choice
          type: choice
          prompt: |
            观察回归残差的正态概率图（Q-Q 图）时，如果中间段基本贴着直线，但最左下角明显往下掉、最右上角明显往上翘（呈两端偏离的拉长 S 形），这说明残差分布有什么特征？
          options:
            - text: 残差分布比正态分布具有更厚的两尾，出现了比正态预期更极端的正负残差
              correct: true
            - text: 残差严格服从均值为 0、方差恒定的标准正态分布，两端偏离只是正态概率图坐标轴的默认缩放效果
              why: 严格服从正态分布时，样本分位数与理论分位数在整个区间上都应大致贴近斜参考直线，不会在两尾对称翘离
            - text: 说明残差之间存在强烈的时间序列自相关，相邻两个残差的相关系数接近 1
              why: Q-Q 图只把残差排序后看分布形状（尾部厚度与偏态），把观测先后顺序抹掉了，看不出时间自相关
            - text: 说明设计矩阵里遗漏了全 1 截距列，导致所有残差的算术平均值不再等于 0
              why: 缺少截距只会整体平移残差位置，而两端对称向外偏离参考线反映的是分布峰度与重尾特征
          explain: |
            正态 Q-Q 图用来检查残差分布的形状：两端同时向远离直线的方向翘起说明厚尾（极端值偏多），整体向同一侧弯曲则对应偏态分布。
      - card:
          title: 误差等方差检验与四图联合排查
          body: |
            定量检验是否等方差，常用 Breusch–Pagan 检验或修正 Levene 检验——实质是检查“残差平方 $e_i^2$ 有没有随拟合值或特征系统性变大”。一旦同时出现曲率或漏斗，按诊断顺序先修正结构与方差再做推断。
          reveal:
            - title: 第 1 步：先修均值结构（线性与遗漏变量）
              body: |
                只要残差–拟合值图或残差–预测变量图出现弧线弯曲，就先把曲线项（如 $x^2$、$\ln x$）或遗漏交互项补进去。因为均值画歪时，连带算出来的残差方差和正态性往往也都是歪的。
            - title: 第 2 步：再处理异方差、自相关与正态性
              body: |
                均值弯度消掉后，如果残差–拟合值图仍呈漏斗形或等方差检验显著，再考虑对响应取对数、做 Box-Cox 或改用加权/稳健标准误；若残差–次序图呈现长波聚集，说明存在时间自相关，需转入时间序列建模。
      - item:
          id: match-residual-plots
          type: match
          prompt: |
            把下面四张诊断图里出现的问题信号和它揭示的违背假设连起来。
          pairs:
            - ["残差–拟合值图呈明显 U 形或倒 U 形弯曲", "违背线性假设"]
            - ["残差–拟合值图呈向右张开的漏斗形", "违背等方差（异方差）"]
            - ["残差–时间次序图呈连续波浪聚集", "违背独立性（自相关）"]
            - ["正态 Q-Q 图明显偏离参考直线", "违背正态性假设"]
          explain: |
            按这四条基本假设对照四张诊断图检查，就能在建模早期发现大部分结构问题。

  - id: confidence-and-prediction
    chapter: 残差诊断与不确定性
    title: 均值响应置信区间与新观测预测区间
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            房屋估价回归算出来“100 平方米的两居室”预测均价为 300 万元。如果你同时向房产公司问两个问题——（A）全城所有 100 平方两居室的**平均售价**大概在哪个范围？（B）明天新挂牌的**那一套** 100 平方两居室售价大概落在哪个范围？这两个范围该一样宽吗？
          options:
            - text: 不一样宽，B 问的是单个新房，还要算上每套房子装修朝向等个体随机波动，所以 B 宽得多
              correct: true
            - text: 一样宽，因为两者的自变量都取 $x_0 = 100$，代入同一个回归方程算出的点预测值和区间边界完全相同
              why: 点预测 $\hat{y}_0 = 300$ 一样，但两种问法对应的随机目标方差不同
            - text: A 更宽，因为全城所有 100 平方米房子的总套数远多于单套房，总体规模越大置信区间越宽
              why: 求平均会把大量单套房子的随机涨跌互相抵消，反而是整体均值更容易估准、区间更窄
          explain: |
            这正是“估计均值响应（置信区间）”和“预测单个新观测（预测区间）”的区别，在回归分析里同样适用。
      - card:
          title: 回归里的两类研究问题与区间公式
          body: |
            给定新自变量取值 $x_0$，点预测是 $\hat{y}_0 = b_0 + b_1 x_0$。为了汇报不确定性，简单线性回归给出两条公式（自由度均为 $n - 2$）：
            - **均值响应 $E[Y \mid x_0]$ 的置信区间**：
              $$\hat{y}_0 \pm t_{\alpha/2,\,n-2} \cdot s\sqrt{\frac{1}{n} + \frac{(x_0 - \bar{x})^2}{S_{xx}}}$$
            - **单个新响应 $Y_{\text{new}}$ 的预测区间**：
              $$\hat{y}_0 \pm t_{\alpha/2,\,n-2} \cdot s\sqrt{1 + \frac{1}{n} + \frac{(x_0 - \bar{x})^2}{S_{xx}}}$$
            根号里多出的常数 `1` 来自新个体自身的随机误差项 $\varepsilon_{\text{new}}$。
      - item:
          id: slr-ci-vs-pi-choice
          type: choice
          prompt: |
            研究人员想估计“全国每周运动 5 小时的成年人**平均**静息心率”，应该报告哪种区间？如果想告诉一位刚报名、每周运动 5 小时的学员“**你个人**的静息心率大概会在哪个范围”，又该用哪种？
          options:
            - text: 前者用均值响应的置信区间，后者用单个新观测的预测区间
              correct: true
            - text: 两者都用均值响应置信区间，这样误差范围小、看着更精确
              why: 用均值置信区间去框单个新个体，许多正常个体会落在区间外，实际覆盖率远低于 95%
            - text: 前者用预测区间，后者用置信区间
              why: 弄反了目标对象：均值聚集更稳用较窄的置信区间，单一个体带有个体起伏用较宽的预测区间
            - text: 两者都直接用常数标准误 $s/\sqrt{n}$，不需要考虑 $x_0$ 离样本均值 $\bar{x}$ 的距离
              why: 回归直线的斜率也有估计误差，因此离中心 $\bar{x}$ 越远，直线的摆动幅度越大，不能省去 $(x_0 - \bar{x})^2/S_{xx}$
          explain: |
            先问自己目标是一群人的“平均水平”，还是落到那“一个具体新对象”，区间公式就能对应上。
      - card:
          title: 例子：对比均值中心处的两条区间及多元推广
          body: |
            多元回归中只需要把 $\frac{1}{n} + \frac{(x_0 - \bar{x})^2}{S_{xx}}$ 换成矩阵二次形式 $\mathbf{x}_0^\top (\mathbf{X}^\top\mathbf{X})^{-1}\mathbf{x}_0$（其中 $\mathbf{x}_0 = (1, x_{01}, \dots, x_{0p})^\top$），预测区间同样是在里面加 `1`。
          reveal:
            - title: 第 1 步：算一元回归在均值中心处的两条区间
              body: |
                假设 $n = 10$，$s = 2$，$t_{0.025, 8} = 2.306$，在中心 $x_0 = \bar{x}$ 处 $(x_0 - \bar{x})^2 = 0$。
                均值置信区间半宽 $= 2.306 \times 2 \times \sqrt{1/10} \approx 1.458$；
                新观测预测区间半宽 $= 2.306 \times 2 \times \sqrt{1 + 1/10} \approx 4.837$，比均值置信区间宽了三倍多。
            - title: 第 2 步：看远离样本中心时为什么像喇叭张开
              body: |
                如果同一模型改问 $x_0 = 9$（已知 $\bar{x}=5, S_{xx}=40$），那么 $\frac{(9-5)^2}{40} = 0.4$。
                均值置信区间半宽增大到 $2.306 \times 2 \times \sqrt{0.1 + 0.4} \approx 3.261$——因为斜率估计哪怕偏一点，离中心越远放大的垂直误差越大。
      - item:
          id: slr-ci-at-mean
          type: number
          prompt: |
            某简单线性回归用 $n = 25$ 个样本拟合，残差标准差 $s = 5$，查得 $t_{0.025, 23} = 2.069$。在样本均值中心 $x_0 = \bar{x}$ 处计算 95% **均值响应置信区间**的半宽（误差限）是多少？
          answer: 2.069
          hint: 在 $x_0 = \bar{x}$ 时，$(x_0 - \bar{x})^2 / S_{xx} = 0$，根号里只剩 $1/n$。
          explain: |
            半宽 $= t_{0.025, 23} \cdot s\sqrt{\frac{1}{25}} = 2.069 \times 5 \times \frac{1}{5} = 2.069$。
      - item:
          id: slr-pi-at-mean
          type: number
          prompt: |
            在一元线性回归中，已知样本量 $n = 25$、残差标准误 $s = 5$、临界值 $t_{0.025, 23} = 2.069$。在 $x_0 = \bar{x}$ 处，构造单个新观测的 95% **预测区间**，其半宽 $t_{0.025, 23} \cdot s\sqrt{1 + \frac{1}{n}}$ 是多少？（保留至少两位小数）
          answer: 10.549876
          tolerance: 0.01
          hint: 计算 $2.069 \times 5 \times \sqrt{1.04}$。
          explain: |
            预测区间半宽 $= 2.069 \times 5 \times \sqrt{1 + 1/25} = 10.345 \times \sqrt{1.04} \approx 10.550$。
      - card:
          title: 多元情形的隐藏外推陷阱
          body: |
            在多元回归里，判断“有没有外推”不能只看每个自变量是不是分别落在最小值和最大值之间，还要看组合点 $\mathbf{x}_0$ 是否落在所有训练样本点云包络里面——哪怕面积和房龄各自都常见，但“市中心 300 平方 1 年房龄”如果样本里从未同时出现过，公式 $\mathbf{x}_0^\top(\mathbf{X}^\top\mathbf{X})^{-1}\mathbf{x}_0$ 依然会明显变大，区间随之张开，提醒你模型正在缺乏样本支撑的区域外推。
          reveal:
            - title: 为什么多元情形要算向量夹在中间的乘积？
              body: |
                单个特征看距均值平方 $(x_0 - \bar{x})^2 / S_{xx}$；多个相关特征时，方向上哪个轴的数据铺得稀、哪个轴彼此共线，都统一记在信息逆矩阵 $(\mathbf{X}^\top\mathbf{X})^{-1}$ 里，因此点预测的估计方差自然写成 $\sigma^2 \mathbf{x}_0^\top (\mathbf{X}^\top\mathbf{X})^{-1} \mathbf{x}_0$。
      - item:
          id: extrapolation-trumpet
          type: choice
          prompt: |
            在回归图上同时画出均值置信带和预测带时，为什么两条边界线总是在样本自变量平均数 $\bar{x}$ 附近最窄、越往左右两端越像喇叭一样张开？
          options:
            - text: 回归直线的斜率估计存在不确定性，绕着重心 $(\bar{x}, \bar{y})$ 轻微摆动时，离支点 $\bar{x}$ 越远垂直摆幅越大
              correct: true
            - text: 因为离开样本均值中心 $\bar{x}$ 之后，真实随机误差项 $\varepsilon$ 的总体方差 $\sigma^2$ 会随着距离的平方自动成倍增长
              why: 区间公式假设各处误差方差 $\sigma^2$ 恒定不变；区间变宽是因为对直线斜率本身的估计误差在远离中心时被水平距离放大了
            - text: 因为统计软件在计算远离均值的置信带时，会自动把有效样本量 $n$ 按离均值的距离折半扣减
              why: 样本量 $n$ 在整个回归模型中是固定常数，区间张开来自根号下的距离项 $(x_0 - \bar{x})^2 / S_{xx}$
            - text: 只有当模型违反了等方差假设（存在异方差）时，回归的置信带和预测带才会出现中间窄两端宽的形状
              why: 即使严格满足同方差与正态假设，线性回归的置信带和预测带也因 $(x_0 - \bar{x})^2 / S_{xx}$ 项而呈双曲线张开
          explain: |
            把回归线看成支点在重心 $(\bar{x}, \bar{y})$ 的翘翘板：支点附近位移小、两端摆幅大。这也是不宜在远离训练数据范围处做外推的几何原因。

  - id: outliers-leverage
    chapter: 残差诊断与不确定性
    title: 离群点、杠杆值、学生化残差与影响点
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一组点本来大致沿着斜率 1 上升。现在冒出一个新点：它的 $x$ 坐标在所有点正中间，但 $y$ 坐标比直线高出一大截；另一个点则跑到 $x$ 很靠右的远端，而且把整条回归直线明显拽平了。这两个特殊点对拟合直线斜率的影响一样大吗？
          options:
            - text: 不一样大，$x$ 处在远端的高杠杆点力臂更长，往往能把整条回归直线明显拉偏
              correct: true
            - text: 一样大，只要观测点的响应值 $y$ 偏离了回归趋势线相同的垂直距离，无论它的 $x$ 坐标在正中间还是在远端，对回归斜率产生的拉力都完全相同
              why: 横坐标在中心 $\bar{x}$ 处的点在左右方向上没有力臂，主要抬高截距；远端点的力臂 $(x_i - \bar{x})$ 很长，更容易改变斜率
            - text: $x$ 在远端的点因为离主点群最远，普通最小二乘在求解正规方程时会自动降低它的权重
              why: 普通最小二乘最小化的是平方误差之和，对远端的大偏差反而很敏感，会为了减小该点残差而把整条直线拉过去
          explain: |
            把“自变量 $x$ 偏离中心多远（杠杆）”和“响应 $y$ 离趋势线多远（离群程度）”拆开看，就能定位真正左右回归结论的影响点。
      - card:
          title: 高杠杆点与帽子矩阵杠杆值
          body: |
            在样本诊断里，首先要把“自变量位置特殊”的点单独认出来。自变量组合 $\mathbf{x}_i$ 远离其余样本中心时称为高杠杆点，由帽子矩阵 $\mathbf{H} = \mathbf{X}(\mathbf{X}^\top\mathbf{X})^{-1}\mathbf{X}^\top$ 的第 $i$ 个对角元 $h_{ii}$ 来衡量，称为**杠杆值（leverage）**。
            所有样本满足 $0 \le h_{ii} \le 1$ 且总和 $\sum_{i=1}^n h_{ii} = p + 1$。杠杆值高的点不一定有大残差——正因为它能把拟合线拉向自己，它的普通残差往往反而被压得很小。
      - item:
          id: hat-trace-sum
          type: number
          prompt: |
            在包含截距项的 $p = 3$ 特征多元线性回归中（设计矩阵共 4 列），共有 $n = 40$ 个样本。所有 40 个样本的杠杆值之和 $\sum_{i=1}^{40} h_{ii}$ 总是等于多少？
          answer: 4
          hint: 帽子矩阵的迹（对角线之和）等于它投影子空间的维数，即设计矩阵的列数 $p + 1$。
          explain: |
            杠杆值总和恒等于模型参数个数 $p + 1 = 3 + 1 = 4$（平均每个点的杠杆值是 $4/40 = 0.1$；经验上超过 $2(p+1)/n$ 或 $3(p+1)/n$ 的点值得留意）。
      - card:
          title: 离群点、学生化残差与影响点
          body: |
            除了自变量位置偏远的杠杆点，还要识别另外两类问题观测：
            - **离群点（outlier）**：在给定 $\mathbf{x}_i$ 时响应 $y_i$ 明显偏离总体趋势。因为第 $i$ 个普通残差的理论方差是 $\sigma^2(1 - h_{ii})$，杠杆越高残差方差越小，所以需除以各自标准误（常先剔除第 $i$ 点重算 $s_{(i)}$）化成**学生化残差（studentized residual）**后再统一比较（常以大小超过 $2$ 或 $3$ 作为排查线）。
            - **影响点（influential point）**：删掉它会让斜率 $\hat{\boldsymbol{\beta}}$ 或预测值发生明显改动的样本（常用 **Cook 距离**综合衡量杠杆值与学生化残差的共同作用）。
      - item:
          id: leverage-vs-outlier
          type: choice
          prompt: |
            某数据点的自变量值 $x_i$ 很大（远离其他点），但在拟合完后看它的普通残差 $e_i$ 却很小；删掉它重新拟合后，回归斜率变化了一半。这说明该点是什么？
          options:
            - text: 一个兼具高杠杆的强影响点，它靠长力臂把回归线拉向了自己，从而掩盖了自身的普通残差
              correct: true
            - text: 因为它的普通残差 $e_i$ 接近于 0，说明它恰好落在真实的总体回归直线上，删掉它前后的斜率变化只是浮点舍入误差
              why: 普通残差小是因为高杠杆点 $(1 - h_{ii})$ 很小、把拟合线拽到了自己身边；删掉它斜率改变一半说明它主导了拟合结果
            - text: 一个杠杆值 $h_{ii}$ 接近 0 的普通内点，只对残差平方和有微小贡献，不会影响任何预测值
              why: $x_i$ 远离样本中心且能大幅改变斜率的点，其杠杆值 $h_{ii}$ 接近 1 而非 0
            - text: 说明当前数据集不存在任何多重共线性或异方差，所有回归系数的标准误都已经达到最小
              why: 单个高杠杆影响点主导斜率会使模型对个别观测高度敏感，需要用剔除后学生化残差和 Cook 距离做专项核查
          explain: |
            这就是不能只看普通残差 $e_i$ 找问题点的原因：高杠杆点会把回归线拉向自己，使 $1 - h_{ii}$ 很小，用学生化残差和 Cook 距离才能将它识别出来。
      - card:
          title: 例子：处理问题数据点的三步策略
          body: |
            发现高杠杆点、大残差或大 Cook 距离的样本后，不能因为想让图形好看就随意删除，应按三步处置。
          reveal:
            - title: 第 1 步：核查数据来源与录入错误
              body: |
                先回头看原始记录：是不是少打了一个小数点、单位把“厘米”录成了“米”、或者设备传感器刚好断电？如果是明确的数据录入或测量故障且无法修复，才记录原因后剔除。
            - title: 第 2 步：检查模型是不是漏了重要变量或非线性项
              body: |
                有时所谓的“离群点”其实是真的，只是因为模型漏了平方项或某个关键特征（比如重点学区房比同面积普通房贵很多，只因模型没放“学区”特征）。补全特征后，它就不离群了。
            - title: 第 3 步：做敏感性对照并如实汇报
              body: |
                如果该点真实有效却拉偏了斜率，保留与剔除（或改用稳健回归）各跑一次，并在报告里同时写明删前删后的系数变化，让读者看到模型稳健程度。
      - item:
          id: problem-point-strategy
          type: choice
          prompt: |
            在分析数据时发现有一个样本的 Cook 距离很大（删掉它后关键回归系数从正变负），合理的处理方式是什么？
          options:
            - text: 先排查录入或测量是否出错、是否遗漏关键变量或曲线项；若属于真实样本，同时对比并报告保留与剔除后的结果
              correct: true
            - text: 只要删掉这个点能让 $R^2$ 升高，就直接在数据表里删除且不在报告里说明
              why: 只挑让自己结论“好看”的数据并隐瞒删除记录会误导统计推断，影响分析结果的可信度
            - text: 既然它影响很大，就把它复制 10 份加进数据集里强化它的作用
              why: 重复复制同一条样本不仅制造虚假样本量，还会破坏残差独立性与自由度计算
            - text: 改用无惩罚普通最小二乘重跑一遍并忽略 Cook 距离
              why: 普通最小二乘正是受强影响点牵制的原因，重跑一遍只会得到相同的结果
          explain: |
            高影响点既可能是录入错误，也可能是模型尚未捕捉到的重要新规律，核查来源与透明汇报对照结果才是稳妥做法。

  - id: heteroscedasticity-collinearity
    chapter: 残差诊断与不确定性
    title: 异方差矫正、自相关与多重共线性
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            你把家庭按收入分成两组做开支回归：低收入家庭开支波动很小，高收入家庭开支上下浮动很大；另外你还把连续 60 天的每日销量按时间做了回归，发现昨天是正残差时、今天往往也是正残差。这两种情况分别违背了哪两条假设？
          options:
            - text: 前者违背了等方差性（出现异方差），后者违背了观测误差彼此独立的假设（存在自相关）
              correct: true
            - text: 两者都只改变回归直线的截距项估计值，对斜率的标准误、置信区间宽度和 $t$ 检验 $p$ 值没有任何影响
              why: 异方差和正自相关都会破坏普通最小二乘的标准误公式，常常导致标准误被低估、把不显著的结果误报为显著
            - text: 前者属于自变量之间的多重共线性，后者属于设计矩阵里的高杠杆值现象
              why: 误差方差随样本变化是异方差，相邻误差相关是自相关；多重共线性和杠杆值描述的是自变量矩阵 $\mathbf{X}$ 的结构
          explain: |
            针对不同的假设违背要采取不同的处理方法：异方差可用对数变换、加权最小二乘或稳健标准误，自相关需用时间序列方法，而特征之间高度相关则是多重共线性。
      - card:
          title: 应对异方差与自相关
          body: |
            - **异方差补救**：如果知道各组误差方差大致正比于某个尺度 $\sigma_i^2 = \sigma^2 / w_i$，可用**加权最小二乘（weighted least squares, WLS）**按方差倒数赋予权重来降低高噪声点的影响、恢复估计效率；也可对响应取对数或改报异方差稳健标准误。
            - **时间序列自相关**：当残差随时间呈波浪聚集（存在**自相关**）时，普通标准误会明显偏低，需要引入时间滞后项、一阶差分或广义最小二乘等时间序列方法。
      - item:
          id: wls-autocorr-choice
          type: choice
          prompt: |
            在使用加权最小二乘（WLS）处理已知各组误差方差不等的数据时，下面哪条加权原则合理？
          options:
            - text: 给误差方差小（测量更稳定）的观测分配正比于 $1/\sigma_i^2$ 的较大权重，降低高噪声观测的权重
              correct: true
            - text: 给误差方差 $\sigma_i^2$ 越大的观测点分配越大的正比权重 $w_i \propto \sigma_i^2$，让残差波动大的样本点主导回归直线的方向
              why: 噪声越大的点提供的信息越模糊，给大方差样本高权重会让斜率估计的方差变得更大
            - text: 只要把所有样本的权重 $w_i$ 都设为同一个大于 1 的常数（如 $w_i = 5$），加权最小二乘就能自动消除异方差
              why: 所有样本同乘常数 5 只会把目标函数整体放大 5 倍，求导令零后的解与普通最小二乘完全相同
            - text: 对角加权的加权最小二乘专门用来消除相邻时间点残差之间的正自相关，不需要修改误差协方差的非对角项
              why: 对角加权处理的是不同样本方差不等（异方差）；时间前后相关性出现在协方差矩阵的非对角元上，需要自回归差分或广义最小二乘
          explain: |
            加权最小二乘的原则是：哪一个观测点的误差方差 $\sigma_i^2$ 小，它的信息精度就高，因此分配权重 $w_i \propto 1/\sigma_i^2$。
      - card:
          title: 多重共线性与方差膨胀因子（VIF）
          body: |
            如果两个或多个自变量高度相关（例如同时放入“建筑面积”与“套内使用面积”），称为**多重共线性（multicollinearity）**。共线性不会让最小二乘产生系统性偏差，但会让高度相似的特征难以区分各自的独立贡献，使单个系数的标准误显著放大、正负号对样本微小变动很敏感。
            诊断时把第 $j$ 个特征 $X_j$ 对其余特征做辅助回归得 $R_j^2$，计算**方差膨胀因子（variance inflation factor, VIF）**：
            $$\mathrm{VIF}_j = \frac{1}{1 - R_j^2}$$
            实践中常以 $\mathrm{VIF}_j > 5$ 或 $10$ 作为明显共线性的警示阈值。
      - card:
          title: 例子：算出 VIF 并消减多重共线性
          body: |
            在健康体检数据中，同时放入身高 $X_1$、体重 $X_2$ 和**身体质量指数（BMI）** $X_3$ 拟合血压回归，发现 $\mathrm{VIF}_3 = 25$，系数符号反而变成负号。怎么诊断和消减？
          reveal:
            - title: 第 1 步：反推辅助回归的自变量线性关联程度
              body: |
                由 $\mathrm{VIF}_3 = \frac{1}{1 - R_3^2} = 25$ 反算可得 $1 - R_3^2 = 0.04 \implies R_3^2 = 0.96$。这说明身体质量指数有 $96\%$ 的变化已经被身高和体重线性解释了，三列高度冗余。
            - title: 第 2 步：基于数据消减共线性的常用做法
              body: |
                消减数据型共线性主要有三条路：删掉最冗余的派生列（例如保留身高体重而去掉身体质量指数，或只留综合指标）、把高度相关列先做主成分合并成综合指标，或者转向加罚收缩的岭回归来稳定矩阵求逆。
      - item:
          id: vif-calc
          type: number
          prompt: |
            在排查多重共线性时，把特征 $X_1$ 对其余特征做辅助回归，算得决定系数 $R_1^2 = 0.8$。那么 $X_1$ 的方差膨胀因子 $\mathrm{VIF}_1 = \frac{1}{1 - R_1^2}$ 是多少？
          answer: 5
          hint: 直接代入分母 $1 - 0.8 = 0.2$ 求倒数。
          explain: |
            $\mathrm{VIF}_1 = \frac{1}{1 - 0.8} = \frac{1}{0.2} = 5$，说明因其余特征与 $X_1$ 共线，$\hat{\beta}_1$ 的估计方差被放大了 5 倍（标准误放大为 $\sqrt{5} \approx 2.24$ 倍）。
      - item:
          id: collinearity-consequence-choice
          type: choice
          prompt: |
            关于多重共线性带来的影响及处理办法，下面哪一句正确？
          options:
            - text: 多重共线性会把单个回归系数的标准误显著放大、降低单个 $t$ 检验的检验功效，但同分布下的整体拟合预测未必变差
              correct: true
            - text: 只要自变量之间存在多重共线性，普通最小二乘求出的残差平方和 $\mathrm{SSE}$ 就会变成负数
              why: 平方和恒为非负数；共线性影响的是 $(\mathbf{X}^\top\mathbf{X})^{-1}$ 对角元的大小和单个系数解的稳定性
            - text: 辅助回归的 $R_j^2$ 越接近 1，说明特征 $X_j$ 提供的独立新信息越多，应当继续加入更多近似列
              why: $R_j^2$ 越接近 1 说明 $X_j$ 越能被其余特征线性表出，继续加入近似列只会让 $\mathrm{VIF}_j$ 进一步增大
            - text: 当残差图显示存在异方差时，唯一的解决办法是计算每个特征的 VIF 并删掉 VIF 最大的特征列
              why: 计算 VIF 并删冗余列是处理多重共线性的方法；异方差应当通过对数变换、加权最小二乘或稳健标准误处理
          explain: |
            在纯预测任务里适度共线有时影响不大，但只要需要解释“某个特征单独起了多大作用”，就应当用 VIF 检查共线性。

  # =====================================================================
  # 第 3 章：正则化
  # =====================================================================
  - id: subset-and-model-selection
    chapter: 正则化
    title: 子集选择、信息准则与交叉验证
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            你收集了 20 条学生成绩记录和 15 个不同特征（甚至包含学号尾数和鞋码）。如果在训练集上不断往线性模型里多加特征，训练集的决定系数 $R^2$ 会不断升高，但拿到明年新生数据上预测误差却很大。怎么才能选出泛化表现好、不多塞冗余变量的特征子集？
          options:
            - text: 用对参数个数加惩罚的准则（如调整 R²、AIC、BIC），或用留出的样本外验证误差（交叉验证）挑选模型
              correct: true
            - text: 直接比较各候选模型在当前训练集上的普通决定系数 $R^2$，挑选训练集 $R^2$ 最高或训练残差平方和 $\mathrm{SSE}$ 最小的模型
              why: 训练 $\mathrm{SSE}$ 会随特征数量增加而单调不增，只看训练集普通 $R^2$ 总会选出包含所有噪声特征的过拟合模型
            - text: 先随机删掉一半训练样本再做普通最小二乘拟合，仍然挑在剩余训练样本上普通 $R^2$ 最高的那个模型
              why: 减少训练样本量既没有引入模型复杂度惩罚，也没有在未参与拟合的验证集上评估，反而更容易过拟合
          explain: |
            特征越多训练误差越低；评价模型好坏看的不是对已知训练数据的拟合度，而是对未知新样本的泛化预测能力。
      - card:
          title: 最优子集选择与逐步回归
          body: |
            如果一共有 $p$ 个候选特征，该保留哪几个？
            - **最优子集选择（best subsets）**：对每一个模型大小 $k = 0, 1, \dots, p$，把全部 $\binom{p}{k}$ 种特征组合都拟合一遍，挑出训练 $\mathrm{SSE}$ 最小的候选代表；最后在各大小的代表里用复杂度惩罚准则或交叉验证选出最终模型。当 $p$ 超过三四十时，$2^p$ 种组合计算量过大。
            - **逐步回归（stepwise regression）**：分步贪心搜索——**前向逐步**从空模型起步，每次添入一个最能降低残差的特征；**后向逐步**从全模型起步，每次剔除一个最不显著的特征。计算快，但不保证找到全局最优子集。
      - card:
          title: 调整 R²：给新特征加上自由度门槛
          body: |
            普通 $R^2 = 1 - \frac{\mathrm{SSE}}{\mathrm{SST}}$ 只要多加一个特征就不会下降。为了公平比较含不同特征个数 $k$（不含截距）的模型，**调整 $R^2$（Adjusted $R^2$）**在分子和分母上分别除以各自的自由度：
            $$R^2_{\text{adj}} = 1 - \frac{\mathrm{SSE}/(n - k - 1)}{\mathrm{SST}/(n - 1)}$$
            多加一个特征会让自由度 $n - k - 1$ 减少 $1$。只有当新特征带来的 $\mathrm{SSE}$ 降幅足以抵消分母自由度的损失（即残差均方 $\mathrm{MSE} = \mathrm{SSE}/(n-k-1)$ 真正变小）时，调整 $R^2$ 才会上升；塞入无用噪声特征则会让调整 $R^2$ 下降。
      - item:
          id: adj-r2-calc
          type: number
          prompt: |
            在 $n = 21$ 个样本上拟合一个含 $k = 4$ 个特征（外加截距）的线性模型，测得 $\mathrm{SSE} = 32$，$\mathrm{SST} = 100$。按 $R^2_{\text{adj}} = 1 - \frac{\mathrm{SSE}/(n-k-1)}{\mathrm{SST}/(n-1)}$ 计算，它的调整 $R^2$ 是多少？
          answer: 0.6
          hint: 分子自由度 $21 - 4 - 1 = 16$，分母自由度 $21 - 1 = 20$。
          explain: |
            $R^2_{\text{adj}} = 1 - \frac{32/16}{100/20} = 1 - \frac{2}{5} = 0.6$（注意普通 $R^2 = 0.68$，扣除自由度惩罚后降到了 $0.60$）。
      - card:
          title: 信息准则与留一预测误差
          body: |
            除了调整 $R^2$，还常用两类基于惩罚或预测误差的指标（均以**越小越好**为准则）：
            - **Mallows Cp、AIC 与 BIC**：在训练残差或负对数似然上加参数个数罚金。**Mallows Cp** 为 $\frac{\mathrm{SSE}}{\hat{\sigma}^2} + 2(k+1) - n$；**赤池信息准则（AIC）** 对每个参数罚常数 $2$（即 $-2\ell + 2(k+1)$）；**贝叶斯信息准则（BIC）** 则把每个参数的罚金加重为 $\ln n$（即 $-2\ell + (k+1)\ln n$）。当样本量 $n \ge 8$ 时 $\ln n > 2$，因此 BIC 对复杂模型惩罚更严、选出的模型更精简。
            - **预测残差平方和（PRESS）**：依次把每个样本留作测试点、用其余 $n-1$ 个样本拟合后预测它，累加全部 $n$ 个样本外预测误差平方和。
      - item:
          id: aic-vs-bic
          type: choice
          prompt: |
            在包含 $n = 200$ 个样本的回归任务中比较同一组候选模型，为什么 BIC（贝叶斯信息准则）通常会选出比 AIC 更少特征、更精简的模型？
          options:
            - text: AIC 每个额外参数只罚常数 $2$，而 BIC 每个参数罚 $\ln(200) \approx 5.30$，对复杂度的惩罚更重
              correct: true
            - text: BIC 只在训练 $\mathrm{SSE}$ 相等时才加罚，AIC 每次都会忽略 $\mathrm{SSE}$
              why: 两者都由“拟合对数似然项 + 复杂度惩罚项”组成，差异就在每个参数对应的惩罚系数是 $2$ 还是 $\ln n$
            - text: 因为 AIC 只用于简单线性回归，BIC 只用于分类问题
              why: 两者都是通用似然类信息准则，在线性回归、GLM 等各类模型中都可以直接比较
            - text: 因为 BIC 允许使用负数样本量
              why: 样本量 $n$ 是正整数，只要 $n \ge 8$ 就有 $\ln n > 2$
          explain: |
            $n \ge 8$ 时 BIC 的单参数惩罚就超过了 AIC 的 2 倍；想挑真正重要的核心解释变量时 BIC 往往更精简。
      - card:
          title: 交叉验证与完整的建模策略
          body: |
            与其依赖大样本公式推导惩罚项，不如直接用重抽样度量未知样本上的预测误差：把数据随机切成 $K$ 份（常用 5 折或 10 折），轮流留出 1 份当验证集、用其余 $K-1$ 份拟合模型并计算验证误差，最后求 $K$ 次验证误差的平均值——这就是 **$K$ 折交叉验证（K-fold cross-validation）**。当 $K = n$ 时即为留一交叉验证（对应线性模型里的 PRESS）。
            规范的建模流程把“验证与诊断”结合起来：先探索变量关系、用子集选择或交叉验证选出候选模型、画残差图并算 VIF 检查假设与共线性，最后在独立测试集上核验泛化表现。
      - item:
          id: cv-fold-order
          type: order
          prompt: |
            把用 5 折交叉验证比较两个回归模型（例如包含 3 个特征 vs 包含 6 个特征）泛化误差的步骤按正确顺序排好。
          steps:
            - "把整个训练数据集随机均匀地分成 5 份（5 折）"
            - "每次留出其中 1 折充当验证集，只用其余 4 折数据拟合模型"
            - "用拟合好的模型预测留出来的那一折，记录预测平方误差"
            - "轮流把 5 折都当过一次验证集后，求 5 次验证误差的平均值并选平均误差更小的模型"
          explain: |
            注意不要拿全部数据做完特征筛选后再切折验证（否则会造成验证集信息泄漏），特征筛选和参数拟合都要限制在每一轮的训练折内部完成。
      - item:
          id: selection-pitfall-choice
          type: choice
          prompt: |
            关于子集选择和逐步回归，下面哪项说法符合统计建模实践？
          options:
            - text: 逐步回归贪心搜索快但未必找到全局最优子集，且用同一批数据选变量后再直接报出的常规 $p$ 值往往偏小（偏乐观）
              correct: true
            - text: 只要跑完前向逐步回归，最终留在模型里的特征按常规 $t$ 分布表查出的 $p$ 值依然是严格无偏的真实显著性水平
              why: 在同一批数据上先挑出最显著的特征、再按未做筛选的公式算 $p$ 值（选择后推断），会让假阳性率明显高于名义水平 $\alpha$
            - text: 当候选特征数达到 $p = 100$ 时，最优子集选择只需要拟合 $100 \times 2 = 200$ 个模型就能穷举完所有非空特征子集
              why: $p$ 个特征共有 $2^p$ 种特征组合，$p = 100$ 时有 $2^{100} \approx 1.27 \times 10^{30}$ 种组合，无法靠穷举完成
            - text: 留一预测残差平方和（PRESS）的数值越大，说明该候选模型在样本外新数据上的泛化预测精度越高
              why: PRESS 是留一交叉验证的预测误差平方和，数值越小才代表样本外预测越准确
          explain: |
            逐步选择虽然计算简便，但存在局部贪心与选择偏误；当候选特征很多且有共线性时，下一课的“连续收缩正则化”往往更稳健。

  - id: ridge-and-lasso
    chapter: 正则化
    title: 岭回归（L2）与 Lasso（L1）正则化
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            当特征数 $p$ 很大或者特征之间高度共线时，普通最小二乘常算出一个很大正斜率（$+5000$）配上一个很大负斜率（$-4998$）来互相抵消，新数据稍微波动预测就会大幅偏离。如果在最小二乘目标里加一条约束：“斜率平方和越大惩罚越重”，会发生什么？
          options:
            - text: 系数大小会被整体往 0 的方向温和收缩，估计方差明显下降、对共线性的敏感度降低
              correct: true
            - text: 所有特征的回归系数都会被惩罚项强制拉成完全相等的非零常数，不再区分哪个特征与响应变量相关性更强
              why: 平方和惩罚是按各自特征对减残差的贡献与系数大小做平衡，会让权重向 0 收缩，但不会强迫所有系数相等
            - text: 加入系数惩罚项以后，模型在当前训练集上的残差平方和 $\mathrm{SSE}$ 会比无惩罚普通最小二乘更小
              why: 普通最小二乘本就是使训练 $\mathrm{SSE}$ 达到最小的解；加入惩罚项后训练 $\mathrm{SSE}$ 会略微增大，以此换取测试集误差下降
          explain: |
            用少许系数收缩偏差换取估计方差明显下降，从而降低样本外预测的均方误差——这就是正则化的核心思路。
      - card:
          title: 岭回归（L2 正则化）与闭式解
          body: |
            **正则化（regularization）**就是在原本的平方误差损失后面加上一项对系数的惩罚，由非负调节参数 $\lambda \ge 0$ 控制惩罚力度。
            **岭回归（ridge regression）**对截距 $\beta_0$ 以外的所有斜率加 $L_2$ 平方惩罚：
            $$\min_{\boldsymbol{\beta}} \sum_{i=1}^n (y_i - \beta_0 - \sum_{j=1}^p \beta_j x_{ij})^2 + \lambda \sum_{j=1}^p \beta_j^2$$
            写成矩阵形式（对中心化、不含截距的斜率部分），岭回归有闭式解：
            $$\hat{\boldsymbol{\beta}}_{\text{Ridge}} = (\mathbf{X}^\top\mathbf{X} + \lambda\mathbf{I})^{-1}\mathbf{X}^\top\mathbf{y}$$
            对角线上加的 $\lambda \mathbf{I}$ 保证了即使特征严重共线甚至 $p > n$，矩阵依然严格可逆。
      - card:
          title: 例子：对比单特征普通最小二乘与岭回归收缩
          body: |
            假设去中心化后的单特征数据满足 $\sum x_i^2 = 6$、$\sum x_i y_i = 18$（无截距项模型 $y = \beta x$）。普通最小二乘（OLS）和 $\lambda = 3$ 时的岭回归解分别是什么？
          reveal:
            - title: 第 1 步：算普通最小二乘解
              body: |
                $$\hat{\beta}_{\text{OLS}} = \frac{\sum x_i y_i}{\sum x_i^2} = \frac{18}{6} = 3$$
            - title: 第 2 步：代入岭回归公式并观察收缩规律
              body: |
                加上惩罚 $\lambda = 3$ 后，分母多了 $\lambda$：
                $$\hat{\beta}_{\text{Ridge}} = \frac{18}{6 + 3} = 2$$
                $\lambda$ 越大系数缩得越靠向 0，但只要 $\lambda$ 有限且 $\sum x_i y_i \neq 0$，系数只会接近 0 而不会精确等于 0。
      - item:
          id: ridge-1d-calc
          type: number
          prompt: |
            在不含截距的单变量回归中，算得 $\sum x_i^2 = 8$、$\sum x_i y_i = 20$。如果采用惩罚参数 $\lambda = 2$ 的岭回归，求出的斜率估计值 $\hat{\beta}_{\text{Ridge}} = \frac{\sum x_i y_i}{\sum x_i^2 + \lambda}$ 是多少？
          answer: 2
          hint: 在分母的平方和上加上惩罚项 $\lambda = 2$ 再做除法。
          explain: |
            $\hat{\beta}_{\text{Ridge}} = \frac{20}{8 + 2} = 2$（作为对比，普通最小二乘估计 $\hat{\beta}_{\text{OLS}} = 20/8 = 2.5$）。
      - item:
          id: ridge-matrix-choice
          type: choice
          prompt: |
            当特征数 $p$ 大于样本数 $n$（例如 50 个病人测了 200 个基因）时，普通正规方程 $\mathbf{X}^\top\mathbf{X}\hat{\boldsymbol{\beta}} = \mathbf{X}^\top\mathbf{y}$ 为什么没有唯一解，而岭回归解 $(\mathbf{X}^\top\mathbf{X} + \lambda\mathbf{I})^{-1}\mathbf{X}^\top\mathbf{y}$（$\lambda > 0$）却依然能唯一算出？
          options:
            - text: $p > n$ 时 $\mathbf{X}^\top\mathbf{X}$ 含零特征值不可逆，加上 $\lambda\mathbf{I}$ 把所有特征值抬高了 $\lambda > 0$，使矩阵正定可逆
              correct: true
            - text: 因为岭回归在求逆之前会先计算每个基因的方差，自动把 200 个基因删掉 150 个，只保留 50 个基因进入矩阵 $\mathbf{X}^\top\mathbf{X}$
              why: 岭回归保留全部 200 个特征且系数通常都不为 0，它靠对角线加 $\lambda > 0$ 消除奇异性，而不是靠删列
            - text: 因为岭回归把设计矩阵转置相乘的顺序改成了 $n \times n$ 的格拉姆矩阵 $\mathbf{X}\mathbf{X}^\top$，使待求参数个数从 200 降到了 50
              why: 岭回归闭式解里求逆的矩阵依然是 $p \times p$ 的 $\mathbf{X}^\top\mathbf{X} + \lambda\mathbf{I}$，待估斜率个数仍是 $p = 200$
            - text: 因为加上 $\lambda\mathbf{I}$ 之后，正规方程右边的向量 $\mathbf{X}^\top\mathbf{y}$ 会自动变成全 1 向量，不再需要做矩阵求逆
              why: 方程右侧依然是 $\mathbf{X}^\top\mathbf{y}$，改变的是左侧矩阵 $\mathbf{X}^\top\mathbf{X} + \lambda\mathbf{I}$ 的最小特征值和可逆性
          explain: |
            从谱定理角度看：半正定矩阵 $\mathbf{X}^\top\mathbf{X}$ 的特征值均 $\ge 0$，加上 $\lambda\mathbf{I}$ 后全部特征值 $\ge \lambda > 0$，从而消除了共线和 $p > n$ 带来的不可逆问题。
      - card:
          title: Lasso（L1 正则化）、弹性网与特征标准化
          body: |
            如果把惩罚从平方和换成一阶大小之和 $\sum |\beta_j|$，就得到 **Lasso**（$L_1$ 正则化）：
            $$\min_{\boldsymbol{\beta}} \sum_{i=1}^n (y_i - \beta_0 - \sum_{j=1}^p \beta_j x_{ij})^2 + \lambda \sum_{j=1}^p |\beta_j|$$
            在几何上，岭回归的约束区域是光滑圆盘，等高线切点一般不在坐标轴上；而 Lasso 的约束区域是带尖角的菱形，等高线容易碰在坐标轴顶点上——于是次要特征的系数会被**精确压成 0**，自动完成特征筛选。折中两者的**弹性网（Elastic Net）**同时结合 $L_1$ 和 $L_2$ 惩罚。此外，执行岭回归或 Lasso 前**必须先把各特征标准化**（否则单位从“米”换成“厘米”会改变系数尺度和受罚比重），再用**交叉验证**选出 $\lambda$。
      - item:
          id: lasso-vs-ridge-choice
          type: choice
          prompt: |
            假设你有 50 个候选特征，但实际上只有 4 个真正跟结果有关、其余 46 个全是纯噪声。下面关于岭回归与 Lasso 表现的对比，哪一项准确？
          options:
            - text: Lasso 倾向于把 46 个噪声特征的系数精确压成 0，得到稀疏模型；岭回归则会让全部 50 个特征保留非零小权重
              correct: true
            - text: 岭回归能把不相关特征精确归零，而 Lasso 不会让任何系数变成 0
              why: 说反了：圆盘边界的岭回归只收缩不归零，菱形尖角边界的 Lasso 才会把次要系数压成精确的 0
            - text: 无论惩罚系数 $\lambda > 0$ 取多大，Lasso 只会对那 46 个噪声特征施加惩罚，而对 4 个真实信号特征的系数不会产生任何收缩偏差
              why: Lasso 的惩罚项 $\lambda\sum|\beta_j|$ 同时作用于所有非零系数，留下的 4 个有效特征系数也会向 0 收缩并带有一定偏差
            - text: 用交叉验证挑出最佳 $\lambda$ 时，必须让训练折里包括所有测试集答案
              why: 选 $\lambda$ 时只能在训练集中做交叉验证，独立测试集必须留到最后报告泛化性能
          explain: |
            当真正信号集中在少数特征时，Lasso 更擅长精简筛选；当许多特征各有微小贡献（或强共线成组出现）时，岭回归和弹性网往往更稳。
      - card:
          title: 例子：面对成组共线基因特征怎样挑惩罚方法
          body: |
            假设测了 200 位患者的 500 个基因表达量来预测指标，其中同一条生物通路上往往有十几个基因高度同步升降。分别用三种正则化会发生什么？
          reveal:
            - title: 岭回归与 Lasso 各自的行为
              body: |
                岭回归会把同组十几个共线基因一起缩小并均匀分摊权重，预测稳定，但全部 500 个系数都不是 0，不好做精简汇报；单用 Lasso 则倾向从高度共线的一组基因里随机挑出 1 个代表，把其余同组基因系数压成 0，换一批样本重新训练时挑出的代表还可能换掉。
            - title: 弹性网如何兼顾稳定性与稀疏筛选
              body: |
                弹性网把惩罚写成 $\lambda_1 \sum |\beta_j| + \lambda_2 \sum \beta_j^2$：借助平方惩罚把强相关基因作为一个整体一起保留或一起舍弃（分组效应），同时借助一阶离差惩罚把其余几百个纯噪声基因直接清零，既好解释又抗抖动。
      - item:
          id: standardize-before-penalty
          type: choice
          prompt: |
            跑岭回归或 Lasso 之前，为什么标准流程总要求先把每个数值特征做标准化（减均值、除以标准差）？
          options:
            - text: 特征量纲变化（如长度用“米”还是“厘米”）会改变对应系数的大小，不标准化会让惩罚项不均衡地压制小单位特征
              correct: true
            - text: 如果不对自变量做标准化，设计矩阵 $\mathbf{X}^\top\mathbf{X} + \lambda\mathbf{I}$ 的主对角线上的项就会出现负数，导致岭回归方程无解
              why: $\mathbf{X}^\top\mathbf{X}$ 的对角元是各列平方和（非负），加上 $\lambda > 0$ 恒为正；标准化是为了让不同特征公平受罚，而非解决无解问题
            - text: 标准化可以把响应变量 $y_i$ 和所有残差都四舍五入成离散整数，从而加快坐标下降法的收敛速度
              why: 特征标准化只把每个自变量列缩放成均值 0、标准差 1 的连续实数，不会把数据或残差变成整数
            - text: 标准化能自动把设计矩阵里的共线特征和乘积交互项剔除掉，省去后续交叉验证选 $\lambda$ 的步骤
              why: 逐列线性缩放不会改变两列之间的皮尔逊相关系数，也不会删除任何特征列，仍需交叉验证选 $\lambda$
          explain: |
            普通最小二乘具有尺度不变性（$X_j$ 放大 100 倍，$\hat{\beta}_j$ 自动缩小 100 倍，预测值不变）；但正则化直接对 $\beta_j^2$ 或 $|\beta_j|$ 计罚，因此必须先把所有特征拉齐到标准差为 1 的相同尺度。

  - id: pcr-pls-highdim
    chapter: 正则化
    title: 主成分回归、偏最小二乘与正则化对比
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            假设你有 40 个高度相关的身体测量指标（身高、臂展、腿长、鞋码等），想用它们预测血压。除了用 Lasso 或岭回归外，有人先把这 40 列自变量做一次主成分分析，提取最主要的 3 个综合主成分再做普通最小二乘。这种“先无监督降维、再回归”的做法有什么潜在盲区？
          options:
            - text: 主成分只找自变量 $X$ 自身方差最大的方向；若真正影响血压的信号藏在 $X$ 方差较小的方向上，就会被丢掉
              correct: true
            - text: 提取出来的前 3 个主成分彼此之间依然存在严重的多重共线性，放进最小二乘回归后方差膨胀因子 VIF 仍然很高
              why: 主成分分析提取出的各个主成分向量彼此正交，相关系数为 0，主成分之间的 VIF 恒等于 1
            - text: 主成分回归在降维时会把响应变量血压 $Y$ 的量纲也一起做正交旋转，导致拟合出来的预测值无法还原回毫米汞柱单位
              why: 主成分变换只作用在自变量矩阵 $\mathbf{X}$ 上，响应变量依然是原始尺度的血压 $Y$
          explain: |
            只看自变量 $\mathbf{X}$ 自身的方差大小而不参考响应变量 $Y$，是主成分回归（PCR）的局限，也是引出偏最小二乘（PLS）的直接原因。
      - card:
          title: 主成分回归（PCR）：无监督提取正交方向
          body: |
            把高维共线特征浓缩成少数正交“综合方向”再回归时，常用**主成分回归（principal components regression, PCR）**：先对标准化后的特征矩阵 $\mathbf{X}$ 做**主成分分析**，保留前 $M$ 个累计解释方差最大的主成分 $Z_1, \dots, Z_M$，再用它们对 $Y$ 做最小二乘（主成分彼此正交，没有共线性）。成分数 $M$ 由**交叉验证**选出，提取方向的过程不看 $Y$。
      - item:
          id: pcr-unsupervised-choice
          type: choice
          prompt: |
            关于主成分回归（PCR）和偏最小二乘（PLS）的关键区别，下面哪一项说得对？
          options:
            - text: PCR 提取方向时不看响应变量 $Y$，只找 $\mathbf{X}$ 方差最大的正交方向；PLS 则在构造方向时同时利用 $\mathbf{X}$ 与 $Y$ 的协方差
              correct: true
            - text: PCR 是一种稀疏特征选择方法，会直接挑出原始特征里最重要的 $M$ 个保留下来，把其余 $p - M$ 个原始特征的权重精确设为 0
              why: 每个主成分都是全部 $p$ 个原始特征的线性组合，换算回原始特征后全部 $p$ 个系数通常都不为 0
            - text: PLS 因为在构造方向时参考了响应变量 $Y$，所以无论提取多少个成分都不会过拟合，不需要用交叉验证挑选成分数 $M$
              why: 正因为 PLS 用到了训练集的 $Y$，取过多成分时更容易在训练集上过拟合，同样需要通过交叉验证确定成分数 $M$
            - text: 当保留的成分个数取满 $M = p$（且 $\mathbf{X}$ 列满秩）时，PCR 给出的拟合预测值仍然与普通最小二乘回归完全不同
              why: 保留全部 $p$ 个正交主成分只是对原特征空间做了一次可逆正交基变换，列空间不变，拟合预测值与普通最小二乘完全相同
          explain: |
            PCR 假设“自变量 $\mathbf{X}$ 变化最大的方向恰好携带预测 $Y$ 的主要信号”；PLS 则顺着与 $Y$ 协方差最大的方向提取成分。
      - card:
          title: 偏最小二乘（PLS）：有监督提取综合方向
          body: |
            既然 PCR 只看自变量自己的方差、有时会漏掉“方差较小却与结果强相关”的信号，**偏最小二乘（partial least squares, PLS）**在构建正交方向 $Z_1, \dots, Z_M$ 时把响应 $Y$ 也纳入计算：每一步找的线性组合既要能概括 $\mathbf{X}$ 的波动，又要与 $Y$ 有较大的协方差（同样需用交叉验证挑选最佳成分数 $M$）。
      - card:
          title: 例子：高维与正则化工具箱全景选型
          body: |
            把这一章学过的模型选择和收缩方法放在一起对照，按任务需求选择合适的方法。
          reveal:
            - title: 第 1 步：确认是不是“纯预测 vs 要看清少数关键因素”
              body: |
                如果业务希望最终只留三五个可解释因素，优先试**最优子集 / BIC** 或 **Lasso**（能把无关噪声系数直接归零）；如果几十个弱相关指标共同起作用（例如很多微弱基因或相近传感器），**岭回归**或 **弹性网** 往往预测更稳。
            - title: 第 2 步：高维共线但特征数很多时怎么应对
              body: |
                当特征高度共线甚至 $p > n$ 时，普通最小二乘不可逆或方差失控；此时**岭回归**（闭式抬高特征值）、**Lasso**（最多挑出不超过 $n$ 个非零特征的稀疏解）或 **PCR / PLS**（压缩成少数综合因子）都能稳定求解，最终统一靠**交叉验证**比较样本外误差。
      - item:
          id: highdim-p-gt-n
          type: choice
          prompt: |
            在样本量 $n = 30$、候选特征数 $p = 100$ 的基因数据分析中，如果直接套用无惩罚的普通最小二乘回归，会发生什么？
          options:
            - text: 参数个数超过样本量，$\mathbf{X}^\top\mathbf{X}$ 不可逆，存在无穷多组使训练残差为 0 的过拟合解，在新样本上泛化误差很大
              correct: true
            - text: 普通最小二乘依然能解出唯一最优系数，而且没有任何过拟合风险
              why: 当 $p + 1 > n$ 时设计矩阵各列线性相关，$\mathbf{X}^\top\mathbf{X}$ 奇异不可逆，不存在唯一的普通最小二乘解
            - text: 误差方差自由度 $n - p - 1$ 变成负数后，会自动把测试集上的预测误差也降成 0
              why: 自由度小于 0 会让经典残差方差估计 $s^2$ 和 $t$ 检验失效，而过拟合解在独立测试集上的预测误差通常很大
            - text: 只需把评价指标从普通 $R^2$ 换成调整 $R^2$，不用加任何正则化就能在 $p = 100, n = 30$ 时直接算出唯一回归系数
              why: 调整 $R^2$ 的分母含有 $n - k - 1$，在 $k \ge n - 1$ 时同样失效，且评价指标本身不改变正规方程不可逆的事实
          explain: |
            $p > n$ 是高维统计和机器学习的常见场景：样本少、特征多时，需要依靠正则化（岭回归、Lasso）或降维（PCR、PLS）限制有效自由度。
      - item:
          id: match-regularization-methods
          type: match
          prompt: |
            把这四种处理多特征回归与过拟合的方法和它们的核心特点配对。
          pairs:
            - ["最优子集选择", "从全部特征组合里按信息准则或验证误差挑稀疏子集"]
            - ["岭回归（L2）", "加系数平方惩罚让全部权重均匀收缩，克服共线且保留所有特征"]
            - ["Lasso（L1）", "加系数一阶离差惩罚把次要特征权重精确压成零"]
            - ["主成分回归（PCR）", "先无监督提取主成分正交降维再做线性拟合"]
          explain: |
            这四条路分别对应“离散挑子集”“连续 $L_2$ 收缩”“稀疏 $L_1$ 收缩”与“正交投影降维”，构成了现代回归建模的核心工具箱。
      - item:
          id: pls-vs-pcr-compare
          type: choice
          prompt: |
            比较 PCR 与 PLS 在选择成分数 $M$ 时的调优方法，下面哪一句准确？
          options:
            - text: PCR 与 PLS 都应当用交叉验证挑选成分个数 $M$，且特征标准化必须在每个训练折内部单独计算
              correct: true
            - text: 提取的主成分个数 $M$ 越多，模型在测试集上的预测方差就越小，因此在实际建模时应当始终取满全部成分 $M = p$
              why: 取满 $M = p$ 就退化回没有任何降维和收缩作用的普通最小二乘，成分越多估计方差越大
            - text: 因为 PLS 在构造方向时已经利用了响应变量 $Y$，所以无论数据结构多复杂都只需固定取 $M = 1$，不用做交叉验证
              why: 单个综合方向往往不足以覆盖多个正交信号维度，PLS 同样需要通过交叉验证确定合适的成分数 $M$
            - text: PCR 提取出的第一个主成分在数学上保证是所有线性组合里与响应变量 $Y$ 皮尔逊相关系数最高的那一个方向
              why: PCR 第一主成分是自变量矩阵 $\mathbf{X}$ 自身方差最大的方向，不保证与 $Y$ 相关性最高；兼顾与 $Y$ 协方差的是 PLS
          explain: |
            无论是正则化强度 $\lambda$ 还是降维成分数 $M$，决定模型复杂度停在哪里的标准都是样本外验证误差（如交叉验证）。
boss:
  items:
    - id: b-ols-slope
      type: number
      prompt: |
        测得 4 组数据 $(x, y)$：`(1, 1)`、`(2, 4)`、`(3, 4)`、`(4, 7)`。用普通最小二乘拟合直线 $\hat{y} = b_0 + b_1 x$，求出的斜率 $b_1$ 是多少？
      answer: 1.8
      hint: 先算均值 $\bar{x} = 2.5$、$\bar{y} = 4$，再套公式 $b_1 = \frac{\sum(x_i-\bar{x})(y_i-\bar{y})}{\sum(x_i-\bar{x})^2}$。
      explain: |
        $x-\bar{x}$ 为 $(-1.5,-0.5,0.5,1.5)$，$y-\bar{y}$ 为 $(-3,0,0,3)$。于是 $S_{xx} = 2.25+0.25+0.25+2.25 = 5$，$S_{xy} = 4.5+0+0+4.5 = 9$，斜率 $b_1 = 9/5 = 1.8$（截距 $b_0 = 4 - 1.8 \times 2.5 = -0.5$）。
    - id: b-logistic-prob
      type: number
      prompt: |
        在 Logistic 回归模型 $\ln\left(\frac{p}{1 - p}\right) = -1 + 1.5 x$ 中，当特征 $x = 2$ 时，预测事件发生的概率 $p$ 是多少？（保留至少三位小数）
      answer: 0.880797
      tolerance: 0.002
      hint: 先算线性预测值 $\eta = -1 + 1.5 \times 2 = 2$，再代入 $p = \frac{1}{1 + e^{-\eta}}$。
      explain: |
        $\eta = 2$，因此 $p = \frac{1}{1 + e^{-2}} \approx 0.8808$。
    - id: b-partial-r2
      type: number
      prompt: |
        某简化回归模型的残差平方和为 $\mathrm{SSE}_R = 100$。再多加入 2 个新特征后全模型的残差平方和降到 $\mathrm{SSE}_F = 60$。这 2 个新特征的偏决定系数（Partial $R^2$）是多少？
      answer: 0.4
      hint: 计算新减少的误差比例 $(\mathrm{SSE}_R - \mathrm{SSE}_F) / \mathrm{SSE}_R$。
      explain: |
        $\text{Partial } R^2 = \frac{100 - 60}{100} = 0.40$。
    - id: b-vif-calc
      type: number
      prompt: |
        把特征 $X_2$ 对模型里的其余特征做辅助回归，测得决定系数 $R_2^2 = 0.75$。那么特征 $X_2$ 的方差膨胀因子 $\mathrm{VIF}_2$ 等于多少？
      answer: 4
      hint: 套用公式 $\mathrm{VIF}_j = \frac{1}{1 - R_j^2}$。
      explain: |
        $\mathrm{VIF}_2 = \frac{1}{1 - 0.75} = \frac{1}{0.25} = 4$。
    - id: b-residual-funnel
      type: choice
      prompt: |
        某线性回归拟合完后画出“残差–拟合值图”，散点从左到右呈张开的“漏斗形”。下面关于这种现象的说法哪一项正确？
      options:
        - text: 违背了等方差假设（异方差）；系数点估计仍无偏，但常规标准误和检验不再可靠，可用对数变换、加权最小二乘或稳健标准误处理
          correct: true
        - text: 说明自变量之间存在严重的多重共线性，必须先计算各特征的方差膨胀因子 VIF 并加入 L1 正则化才能消除残差图的漏斗形状
          why: 漏斗形反映的是误差方差随拟合值大小改变（异方差），而非自变量之间的共线性问题
        - text: 说明模型错误地包含了常数截距项 $\beta_0$，只要把设计矩阵的第一列全 1 删掉、强制回归线过原点就能让残差恢复等宽
          why: 强行去掉截距会破坏残差零均值性质并带来斜率偏差，不能消除误差方差随 $x$ 增大的异方差现象
        - text: 只要残差围绕水平零线上下对称分布，向右张开的漏斗形就不会影响普通最小二乘的标准误公式，原有的 $t$ 检验 $p$ 值依然精确有效
          why: 普通 OLS 的标准误公式依赖常数方差 $\sigma^2$ 假设，存在异方差时算出的常规标准误和 $p$ 值都会失准
      explain: |
        诊断图发现漏斗形后，既可以变换响应变量（如 $\ln Y$）、根据方差大小采用加权最小二乘（WLS），也可以改用异方差稳健标准误来进行可靠推断。
    - id: b-ridge-1d
      type: number
      prompt: |
        在去中心化、无截距的单特征回归中，算得 $\sum x_i^2 = 5$、$\sum x_i y_i = 15$。选用惩罚参数 $\lambda = 5$ 跑岭回归时，求出的斜率估计值 $\hat{\beta}_{\text{Ridge}}$ 是多少？
      answer: 1.5
      hint: 套用单变量岭回归公式 $\frac{\sum x_i y_i}{\sum x_i^2 + \lambda}$。
      explain: |
        $\hat{\beta}_{\text{Ridge}} = \frac{15}{5 + 5} = 1.5$（相比普通最小二乘的 $15/5 = 3$ 缩小了一半）。
    - id: b-regularization-compare
      type: choice
      prompt: |
        面对一个有 30 个候选特征（其中存在高度相关特征和不少噪声变量）的建模任务，下面哪条策略组合最合理？
      options:
        - text: 先在训练折内对特征做标准化，再用交叉验证比较 Lasso、岭回归与弹性网的泛化误差，最后做残差诊断并在独立测试集上评估
          correct: true
        - text: 不做标准化直接跑 Lasso，再挑训练集 $R^2$ 最高的 $\lambda$
          why: 不标准化会让惩罚偏向数值范围小的特征，而挑训练 $R^2$ 最高只会永远选中 $\lambda = 0$ 的无惩罚过拟合模型
        - text: 只看普通最小二乘的全模型，哪个系数数值最大就只留哪一个特征
          why: 当特征量纲不同或存在多重共线时，普通最小二乘系数大小既不可比又极不稳定，不能直接按系数大小删变量
        - text: 用主成分回归提取全部 30 个主成分就能既降维又自动把噪声特征权重清零
          why: 保留全部 30 个主成分等价于无收缩和无降维的普通最小二乘，而且主成分会混入所有原始特征，不能清零
      explain: |
        标准化、交叉验证调优以及模型诊断三者配合，才能既防过拟合又守住可信的统计推断与预测能力。
