skill: S.2.3
version: 2
authors: [main-agent]
brief:
  why: |
    手机天天装着我们的银行账号、聊天记录、照片和指纹。和后端服务器不一样，手机应用不仅直接运行在用户自己手上（可能被拆包反编译），还可能一边被恶意邻近 App 借权偷文件，一边连着不安全的咖啡馆公共 Wi-Fi。这一关对照国际权威 OWASP MASVS/MASTG 移动安全标准，从平台沙箱与导出权限边界一直学到 Keystore/Keychain、TLS 证书校验与抗篡改测试。
  outcomes:
    - 比较 Android（独立 UID 进程 + SELinux + 可侧载）与 iOS（严格应用容器 + 苹果强制签名 + App Store 审核）的安全模型差异
    - 识别导出 Intent 组件借权读文件的“混淆代理”风险，用 android:exported="false"、调用者签名校验与资源允许表堵住越权入口
    - 区分最小运行时权限、服务端业务授权与绑定硬件芯片的生物识别/密钥证明，避免只凭客户端布尔值或隐藏按钮做假控制
    - 落实 OWASP MASVS 本地存储加密、Keystore/Keychain、安全认证加密（不重用 nonce）及绝不在客户端硬编码长期服务密钥
    - 配置 Android networkSecurityConfig 禁用明文并保留默认 TLS 证书链与主机名校验，开展隐私最小收集与基于信任边界的静动态安全测试
terms:
  - term: 沙箱
    def: '操作系统给每个应用划出的隔离运行牢笼，默认禁止应用 A 随意偷看应用 B 的私有文件或篡改系统'
  - term: 进程
    def: '运行起来的应用实例，Android 为每个应用分配独立进程与编号以落实系统级隔离'
  - term: 内核
    def: '手机操作系统最底层掌管硬件、进程编号与文件读写权限的核心系统部分'
  - term: 混淆代理
    def: '本来有权限读写私密文件的组件被坏人骗着当了“传话替死鬼”，帮无权限的调用者读走了越权资源'
  - term: 密钥证明
    def: '由设备硬件安全区签出的可验证凭证（Key Attestation），向远端服务器证明密钥确实生成并锁在真硬件芯片里'
  - term: 证书固定
    def: '英文叫 Pinning，客户端除了系统根证书检验之外额外指定只认自家特定证书或公钥，防被装了伪造根证书的代理窃听'
  - term: 函数
    def: '把输入检查和对应返回规则包装成一段可复用的操作动作'
  - term: 调试
    def: '开发期间连接设备查看报错日志、单步追踪代码执行与检查内部状态的过程'

lessons:
  # ==== 移动平台与沙箱 ====
  - id: sandbox
    chapter: 移动平台与沙箱
    title: Android vs iOS 平台安全模型与沙箱隔离
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            你手机里同时装着“手机银行”和另一个刚从网页随便下载的小游戏。小游戏能不能自己偷偷去打开手机银行的私有目录，直接把银行缓存文件全读走？系统靠什么拦住它？
          options:
            - text: 不能。手机系统靠“应用隔离沙箱”按独立系统身份隔开每个应用，默认绝不允许互相访问私有目录
              correct: true
            - text: 不能，只是因为小游戏默认猜不到银行文件是不是叫 `bank.txt`
              why: 靠“猜不到文件名”毫无安全性；底层是操作系统按独立应用身份强行阻止越权访问
            - text: 能。手机上所有软件本来就全部共享同一个大文件夹随便互读
              why: 桌面老式操作系统可能混用用户目录，但现代手机从诞生起就默认实行严苛的每应用独立隔离
          explain: |
            移动安全第一道高墙就是**沙箱（Sandbox）**。这一课还会比较 Android 和 iOS 的沙箱、权限、签名与审核差异。
      - card:
          title: 操作系统怎样隔离应用：沙箱、UID 与进程
          body: |
            **沙箱（Sandbox）**指平台对每个安装应用施加的资源隔离牢笼，而**进程（Process）**是运行中的应用实例，受操作系统最底层的**内核（Kernel）**管理：
            - **Android 沙箱**：系统在安装时给每个 App 分配唯一的系统用户编号（UID），让它跑在独立进程里——内核利用文件权限加上 **SELinux**（强制访问控制安全策略）确保 A 进不去 B 的私有文件夹；
            - **iOS 沙箱**：同样强制每款应用待在自己专属应用容器与严格授权声明范围里，不准乱碰系统和其他应用数据。
          reveal:
            - title: Android 沙箱是如何随版本越筑越牢的？
              body: |
                现代 Android 不仅靠进程 UID 划清应用界线：从 5.0 起用 SELinux 实行强制隔离、6.0 收紧私密家目录默认权限（700 仅本 UID 可读写）、9.0 起为普通应用各自配独立安全域隔离、10.0 起收窄外部共享存储可见范围——哪怕恶意软件拿到单个普通权限也不再轻易看光整机文件。
            - title: 原生、跨平台与网页套壳三类移动形态怎么看边界？
              body: |
                无论应用是纯原生开发、Flutter 跨平台自绘还是套了网页外框（Hybrid/WebView），只要打包成 Android **APK** 安装包或 iOS 应用，系统一律按同一套沙箱隔离与权限门禁管束；而网页套壳还要多盯紧网页脚本桥接接口是否放开了过宽权限。
      - card:
          title: 比较 Android vs iOS 四维安全模型
          body: |
            无论是原生、网页套壳还是跨平台应用都须遵守平台边界：
            - **沙箱与权限**：两侧都隔开私有目录，敏感硬件须等用户**运行时授权**；
            - **Android**：安装包必须数字签名（确认身份与更新连续性），但**开放允许从商店外侧载安装**，厂商更新碎片化较多；
            - **iOS**：程序**必须经苹果签名**，默认**仅限经严格审核的 App Store 安装**，管控极紧但生态可控。
          reveal:
            - title: 既然包已经通过商店审核且数字签名有效，说明 App 一定绝对安全吗？
              body: |
                **不是。** 签名只证明“这个包确是某开发者发布且没人半路改过代码内容”，审核也查不出所有隐藏业务后端漏洞。权限最小化、本地存储加密、接口防越权依然一条不能少。
      - item:
          id: android-vs-ios-match
          type: match
          prompt: |
            比较 Android 和 iOS 应用安全模型的各自特点，把描述与对应系统配对。
          pairs:
            - ["每个应用分配独立 Linux 用户 ID（UID）跑在独立进程加 SELinux 策略，开放允许侧载安装", "Android 应用安全模型特点"]
            - ["所有程序须经苹果签名，默认仅能通过经审核的官方 App Store 分发安装", "iOS 应用安全模型特点"]
            - ["敏感能力须运行时弹窗经用户授权，私有目录默认禁止跨应用直接读取", "Android 与 iOS 的共同隔离原则"]
          explain: |
            记住核心对照：两者都做每应用沙箱隔离与运行时授权；差异主要在签名强制方与开放侧载 vs 统一商店审核。
      - item:
          id: signature-scope-choice
          type: choice
          prompt: |
            一家手机银行下载检查显示“安装包由正版商店分发且开发者数字签名校验完全有效”。据此**能直接得出**什么结论，还有什么仍必须核查？
          options:
            - text: 仅能确认包来源与完整性未被篡改；依然必须核查它的运行权限、本地数据保护和后台接口是否写对权限校验
              correct: true
            - text: 证明代码里 100% 不可能存在任何泄露密码、跳过 HTTPS 验证或组件越权 bug
              why: 数字签名与分发审核并不能代替应用内部业务安全编码检查
            - text: 证明该应用可以把所有本地密码都直接写成公开可读文件
              why: 应用依然受本地权限保护原则和行业标准严格约束
          explain: |
            分发签名验“身份与包没被人改过”，却不自动给烂代码颁发“无安全漏洞免死金牌”。
      - item:
          id: sandbox-world-readable
          type: choice
          prompt: |
            早年曾有开发者在保存文件时图省事把权限设为“所有人可读（World-Readable）”。在现代 Android 沙箱下为什么高危且被严格禁止？
          options:
            - text: 一旦放开全局可读权限就相当于自己拆掉了应用沙箱门锁，任何装在同一手机上的其他陌生 App 都能读走这些文件；应改用私有存储或受控分享组件
              correct: true
            - text: 因为这样会让文件体积膨胀成十倍大小
              why: 风险在于向同机所有第三方应用敞开了未经授权的数据读取通道
            - text: 因为手机系统要求全部图片都必须公开给任意游戏读取
              why: 系统官方指南严禁把应用内部私有文件设为全局可读可写
          explain: |
            跨应用需要协作分享单个文档时，请走受控授权通道而不是把私房目录大门敞开。
      - item:
          id: sideload-tradeoff-choice
          type: choice
          prompt: |
            相比 iOS 默认闭环机制，Android 允许用户在开启开关后安装商店以外的第三方安装包（侧载），这在移动安全模型上意味着什么？
          options:
            - text: 带来更高的开发测试与分发自由度，但也让用户更容易绕过商店安全筛查误装恶意伪造包，企业应用更需要自身严谨防护
              correct: true
            - text: 意味着 Android 根本没有任何 UID 和进程沙箱隔离
              why: 允许侧载安装只是分发入口更开放，系统安装后的进程与 SELinux 沙箱隔离依然严格运行
            - text: 意味着侧载安装的软件不需要开发者做任何签名
              why: Android 安装任何 APK 包同样强制要求具有数字签名才允许系统安装
          explain: |
            侧载开放性 + 硬件厂商系统更新差异（碎片化），正是评估 Android 威胁面时绕不开的背景。

  - id: ipc
    chapter: 移动平台与沙箱
    title: 导出组件边界、混淆代理攻击与资源允许表
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            你写了一个手机应用组件（Android `Activity`，用 **Intent** 接收别人发来的消息和文件名）。组件代码自己有权读写本应用私有目录里的私密账单。可它写了个大漏洞：收到外部陌生应用传来的路径文字后不做验证就直接按那个路径读文件并返回给对方。这属于什么安全漏洞？
          options:
            - text: 越权代读漏洞：本来没权限读你私有文件的恶意 App，借着这个组件自己的高文件权限偷走了你的私有文件。
              correct: true
            - text: 只是把文件名拼写错了一个标点符号而已，毫无危险
              why: 恶意来访方能传入 `../private_secret` 等路径，让拥有权限的组件乖乖把文件读出来送上。
            - text: 只要不把这个组件的名字写进对外网页文档里，坏人就绝对永远找不到
              why: 手机上其他恶意软件可以直接读清单里的所有公开导出组件名。隐藏入口不是安全控制
          explain: |
            这一课从 Manifest 清单 XML 到权限允许表把跨组件边界彻底守死。
      - card:
          title: 默认关闭对外导出，显式写 `android:exported="false"`
          body: |
            在 Android 里，`Activity`（页面）、`Service`（后台服务）、`BroadcastReceiver`（消息接收）和 `ContentProvider`（数据提供方）统称四大组件。如果某组件**只给自己内部页面跳来跳去用**，第一反应就是在 `AndroidManifest.xml` 里把 **`android:exported="false"`** 显式锁死。iOS 里的自定义 URL Scheme、Universal Links 与应用扩展同样要严格核对来路边界。
            ```xml
            <manifest xmlns:android="http://schemas.android.com/apk/res/android"
                package="com.example.mobilelesson">
                <application android:networkSecurityConfig="@xml/network_security_config">
                    <activity android:name=".FilePreview" android:exported="false" />
                </application>
            </manifest>
            ```
          reveal:
            - title: 什么是**混淆代理（Confused Deputy）**？
              body: |
                就像门卫自己手里拿着全楼保险柜钥匙，但谁走过来喊一嗓子“帮我拿 A 柜里的东西”，门卫也不核对对方是谁直接开门递出去——门卫就是被骗利用高权限替坏人干活的“混淆代理”。
      - card:
          title: 确实需要对外分享时：验来访者 + 签名权限 + 允许表
          body: |
            上面这出闹剧就是**混淆代理（Confused Deputy）**——高权限门卫不问来客身份就傻傻替坏人跑腿递东西。如果必须开放预览组件给自家合作应用，三条铁律缺一不可：
            1. **校验来访方身份与签名权限**（例如只允许签过相同公司证书的应用请求）；
            2. **不信外部路径。改用“合法资源编号允许表”映射**（传 `"receipt"` 查白名单映射对应资源）；
            3. **路径清理（删 `../`）不能替代授权校验**；不把入口写进文档更不算控制。
            以下**函数**演示按请求方、动作和资源名查白名单返回安全映射（其余全被拒绝）：
            ```python
            allowed = {("reader", "preview", "receipt"): "receipt-preview"}

            def resolve(caller, action, resource):
                return allowed.get((caller, action, resource))

            print(resolve("reader", "preview", "receipt"))
            print(resolve("stranger", "preview", "receipt"))
            print(resolve("reader", "preview", "../private"))
            ```
          reveal:
            - title: 什么叫 Intent，这段 Python 映射又是怎么挡住偷渡的？
              body: |
                `Intent` 就像 Android 组件之间递消息启动页面的快递信封，陌生 App 也能往里塞文件名发给你的公开页面。上面代码用固定白名单查找表 `allowed` 配 `.get(...)` 方法（找不到匹配项时温和返回 `None` 而不会报错）——只有当 `("reader", "preview", "receipt")` 三项严丝合缝匹配才回给对应资源代号，其余无论换陌生来客、换未登记动作还是塞进 `../private`，全被挡在门外。
      - item:
          id: ipc-confused-deputy-why
          type: choice
          prompt: |
            一个导出的 Android Intent 组件收到外部传入路径后，直接读取内部文件并返回。为什么这是严重的**权限边界问题（混淆代理）**？
          options:
            - text: 外部原本没有任何权限的应用可以借用该导出组件自身的文件读权限，把本不该对外开放的私有文件骗取出去
              correct: true
            - text: 因为手机系统禁止任何组件读取自己应用内部的任何文件
              why: 组件自己本来就有权读自家内部文件，危险在于“代未授权外人去读”
            - text: 只会把手机字体大小变大两号，不会漏掉数据
              why: 这类越权组件可以直接造成跨应用敏感私有数据窃取泄露
          explain: |
            跨沙箱边界收到请求的那一瞬间，组件必须站在来客自身权限视角重新严格审查，决不能拿自己全部特权替陌生来客跑腿。
      - item:
          id: ipc-exported-false-fix
          type: choice
          prompt: |
            如果某应用里的一个预览组件 `FilePreview` 其实**只供本应用自己内部切换界面用**，不需要其他 App 来启动它。最彻底干净的首要修复措施是什么？
          options:
            - text: 在 `AndroidManifest.xml` 里显式设置 `android:exported="false"`，关闭外部应用拉起入口
              correct: true
            - text: 保持 `exported="true"` 不变，但把组件名字故意起得复杂一点而且不写进公开说明书
              why: 所有安装包里的 Manifest 清单对同机其他应用几乎透明可读，“藏名字不写文档”完全防不住探测
            - text: 只写一行代码去掉路径文字里的 `../`，依然谁请求都全盘返回任意现存文件
              why: 即使不含 `../`，未授权陌生应用照样可以直接传已知合法相对名字读走不该看的文件
          explain: |
            能关门就坚决锁门（`exported="false"`），这是缩减暴露面成本最低、最有效的招数。
      - item:
          id: ipc-allowlist-eval
          type: text
          prompt: 看下面基于允许表的资源查询函数，依次查询 `resolve("reader", "preview", "receipt")`、`resolve("stranger", "preview", "receipt")`、`resolve("reader", "preview", "../private")` 的三个返回结果（用单个空格连接，`None` 照实写出）是什么？
          lang: python
          code: |
            allowed = {("reader", "preview", "receipt"): "receipt-preview"}
            def resolve(caller, action, resource):
                return allowed.get((caller, action, resource))
          answers: ["receipt-preview None None"]
          hint: 只有完全匹配白名单元 `("reader", "preview", "receipt")` 才返回 `"receipt-preview"`，其余未授权来客或越权路径都返回 `None`。
          explain: |
            用白名单明确绑死 `(谁能来, 做什么动作, 拿哪个资源)`，陌生人或恶意路径 `../private` 全部落空返回 `None`。
      - item:
          id: deep-link-webview-check
          type: choice
          prompt: |
            不仅 Intent 组件，从外部短信打开 App 内某页面的深层跳转入口（Deep Link）或内置网页组件（WebView）接到外部输入时，同样需要做哪些校验？
          options:
            - text: 核对跳转目标域名与协议白名单、校验传入内容格式及当前账号是否有权看对应资源，拒绝加载不可信网页与任意跳转
              correct: true
            - text: 只要消息从通知栏点进来的就无条件信任跳过一切账号校验
              why: 任何应用或网页都可能构造跳转请求，从外面空降传来的数据同样不可信任
            - text: 允许网页脚本随便触发应用所有本地读取接口
              why: 向不可信网页暴露原生功能接口极易导致本地文件失窃
          explain: |
            凡是跨出自己应用隔离墙进来的数据（Intent、URL Scheme、Universal Links、WebView），统统按不可信外部输入处理。

  # ==== 权限与设备身份 ====
  - id: permissions
    chapter: 权限与设备身份
    title: 最小运行时权限、系统选择器与服务端独立鉴权
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            某快递 App 里只在“修改头像”时想让用户从手机相册挑 1 张照片上传。需要申请“读取并遍历手机里全部几万张个人照片”的全局大权限吗？
          options:
            - text: 不需要。直接拉起操作系统提供的“系统照片选择器（Photo Picker）”，让用户在系统框里只挑那 1 张图，应用压根碰不到其余几万张隐私照片
              correct: true
            - text: 必须一打开 App 就把全部相册、通信录和通话记录全都扫一遍存回服务器
              why: 过度索权既违背最小权限原则、极易被用户拒装和商店拒审，也放大隐私泄露面
            - text: 根本不用问用户同意，偷读用户存储卡就行
              why: 现代平台强制要求在用到敏感能力时向用户申请，且推荐使用范围最窄的系统选择器
          explain: |
            移动授权讲究**最小暴露面** + **客户端控制与服务端鉴权分清界线**。
      - card:
          title: 最小运行时权限与优雅处理拒绝
          body: |
            在 Android 清单声明与 iOS `Info.plist` 用途说明之外，真正使用相机、位置或通讯录等敏感能力时要遵守三项规范：
            - **用时再申请、能窄尽量窄**：使用系统级单张照片选择器、iOS 仅当次授权（Allow Once）或模糊近似定位，避免一口气全拿；
            - **必须测过“用户拒绝 / 撤回权限”场景**：拒绝后绝不能卡死闪退或重复不停地疯狂弹系统授权框；当有替代手输路径时保持主功能可用；
            - **设备识别号克制使用**：优先选用只限单一应用范围、可重置的普通标识（避免抓不可重置的硬件出厂编号跨公司长期跟踪用户）。
      - card:
          title: 客户端隐藏按钮 ≠ 服务端权限边界
          body: |
            **千万别把“界面没显示管理员按钮”当成安全控制。**
            - 客户端运行在用户手里——攻击者随时能绕过手机界面直接往你的后台服务器发网络请求（例如直接请求删除别人账单的后台接口）；
            - **唯一可信防线**：哪怕客户端已经做了前端权限控制或页面隐藏，**服务端收到每一条敏感请求时，依然必须独立核验当前登录账号会话、所属租户与这条资源的访问权限**。
          reveal:
            - title: 两套常用平台权限实操写法对照（Android vs iOS）
              body: |
                - **Android**：真正点击功能时先调 `ContextCompat.checkSelfPermission` 检查是否已授权，再由系统合约 `RequestPermission` 弹出授权框，被拒后留出备用人工路径不崩溃；
                - **iOS**：提前在 `Info.plist` 写出用途人话说明（例如为何读照片或用定位），并在代码里兼容“仅这次允许”或“只挑单张照片”授权结果。
      - item:
          id: photo-picker-privacy
          type: choice
          prompt: |
            开发头像更换功能时，只为了从手机里选 1 张图片，以下哪种实现最贴近 OWASP MASVS 最小权限规范？
          options:
            - text: 拉起平台内置系统照片选择器（Photo Picker），仅把用户亲手勾选的那 1 张照片交给应用，免申请全盘读取整个相册权限
              correct: true
            - text: 要求“永久后台随时扫描全手机照片”全部权限
              why: 只挑一张图却拿走用户一万张生活照访问权，严重过度索权
            - text: 把用户整本相册偷偷先传到测试环境备用
              why: 未经明确同意私自全量上传隐私文件属于重大违规与泄密事故
          explain: |
            尽量把选取权交给系统的安全选择器组件，App 只接触最终那一张选定图片，皆大欢喜。
      - item:
          id: hidden-button-vs-server
          type: choice
          prompt: |
            某移动应用后台有一个管理员“导出全公司员工薪资报表”的接口，客户端只在普通员工账号的页面上隐藏了“导出报表”按钮，服务端却懒得校验该用户到底是不是管理员。这安全吗？
          options:
            - text: 极其危险。攻击者完全能脱离手机页面直接构造请求访问后台接口，服务端必须独立核验每个敏感接口的账号权限
              correct: true
            - text: 绝对安全，因为普通人在 App 界面上用手指点不到隐藏按钮
              why: 后台接口暴露在网络上，任何人都可用抓包或脚本工具直接发起 HTTP 请求绕开手机页面 UI
            - text: 依然安全，因为服务端接口路径没有写在公开网页里，只要对应用安装包做代码混淆，外部就找不到该接口路径
              why: 代码混淆与路径隐藏属于脆弱的“隐匿即安全”，抓包或逆向很快就能定位接口路径，真正的访问控制边界必须立在可信后端服务器里
          explain: |
            客户端只管展示体验与采集输入，一切业务级“能不能查、能不能删”的裁判权永远死守在服务端。
      - item:
          id: perm-rationale-deny
          type: choice
          prompt: |
            当应用向用户请求相机扫码权限遭到拒绝，但业务上依然可以通过手动输入订单号完成查询时，合规的响应是？
          options:
            - text: 顺畅保留“手输订单号”正常查询路径，仅在用户主动重新点扫码时温和说明为何需要相机及如何去设置开启
              correct: true
            - text: 只要不给相机权限就立刻让整个 App 闪退退出
              why: 拒绝非必须权限不应破坏核心可用功能或主动闪退
            - text: 不停地每秒再弹出 50 次系统权限申请框逼用户同意
              why: 反复不停地强制弹窗极其恶劣且会被平台系统直接拦截屏蔽
          explain: |
            尊重用户拒绝权并保持替代流程畅通，既过得了商店审核也能赢回用户好感。
      - item:
          id: platform-vs-server-match
          type: match
          prompt: |
            区分移动端两层不同意义的“权限控制”各自到底管谁。
          pairs:
            - ["Android/iOS 运行时系统权限（如相机、定位）", "决定该应用进程能否触碰这台设备上的本地硬件或系统数据"]
            - ["系统照片选择器（Photo Picker）", "由系统代选只露出单张用户指定照片，避免交出整个相册读权"]
            - ["后端接口鉴权与越权检查", "决定当前登录账号是否有权读取或修改服务器上的这条具体业务订单"]
          explain: |
            平台管“设备硬件门”，服务端管“业务账号门”，两道门各自不能替对方代劳。

  - id: identity
    chapter: 权限与设备身份
    title: 本地生物认证、硬件密钥解锁与设备证明
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            用户在一台解锁过或者已被动过手脚测试过的手机上点击“指纹确认转账 5000 元”。最糟糕的写法是：手机指纹框一通过，代码就简单给后端发一句 `{"ok": true}` 让服务端直接转账。为什么这么容易被假冒绕过？
          options:
            - text: 纯粹一个 `true` 标记值没有任何密码签名证明，攻击者可以在被修改的设备上直接捏造 `true` 跳过指纹把钱转走。应当由硬件密钥解锁对挑战做签名再验证
              correct: true
            - text: 因为手机无法区分数字 true 和 false
              why: 简单真假字段在网络包里就是明文几个字母，篡改拦截工具一秒就能把 false 改成 true 骗过后台
            - text: 因为指纹比密码永远慢十小时
              why: 生物认证体验极快，错在“只上报真假值而没拿锁在安全芯片里的私钥对服务器挑战签名”
          explain: |
            区分“方便本地体验的解锁 UI”与“真正能向后端交差的密码学设备签名/证明”。
      - card:
          title: BiometricPrompt 与受生物认证保护的硬件密钥
          body: |
            Android 的 **BiometricPrompt** 和 iOS 的 **LocalAuthentication** 是标准生物认证接口，分两种写法：
            - **脆弱写法**：认证框回调通过后只在代码里直接往下走——若运行时被修改，攻击者可强行假装认证成功；
            - **硬件密钥绑定用法**：把私钥锁进安全硬件芯片（Keystore / Secure Enclave），规定“**只有刚做完强生物识别后芯片才答应动用私钥对服务器新发的随机挑战签名**”。
          reveal:
            - title: 这样修改客户端条件判断还能绕过吗？
              body: |
                不能。哪怕坏人强行改写了应用里的 `if (passed)` 逻辑，因为手机没有过真指纹解锁，安全硬件芯片依然会拒绝签发那枚私钥签名——向后端交不出有效密码学签名就转不走一分钱。
      - card:
          title: 密钥证明（Key Attestation）与防旧证据重放
          body: |
            如果服务器还想知道“这把签名私钥是不是真的躺在合规真硬件芯片里而非软件仿造”？就要用**密钥证明（Key Attestation）**：
            - **硬件背书**：平台安全芯片签发包含系统版本与安全状态的证书链；
            - **必须绑每次新发的随机挑战**：防止坏人把昨天截获的老证明数据原封重放，并且只当风控参考信号配合账号会话使用。
          reveal:
            - title: 如果服务器直接收了一张不带新挑战的老证明会怎样？
              body: |
                攻击者可以在自己正常的合规手机上拿一次通过的证明包存成录像或固定数据，然后去任意魔改设备或模拟器上回放那同一份旧文件冒充真机——绑定服务端刚发的一次性随机挑战才能证明“此时此刻就在这台真机上”。
      - item:
          id: biometric-crypto-why
          type: choice
          prompt: |
            在高敏金融转账确认场景里，把“指纹验证成功”与“硬件支持的私钥签名操作”强绑定（Crypto-bound Biometric），主要防住了哪种绕过攻击？
          options:
            - text: 防住了攻击者在测试手机上用运行时工具直接强行篡改回调函数返回 `成功`，因为没有真指纹解锁，安全硬件拒绝对服务器挑战进行真实签名
              correct: true
            - text: 能把用户的指纹原始图像自动上传到服务端数据库保存，方便客服人工肉眼比对
              why: 合规生物识别绝不把原始指纹图像传出设备安全芯片，硬件密钥绑定只用片内私钥对服务端挑战做数字签名
            - text: 能保证服务器后台永远再也不用验证任何账号登录令牌
              why: 账号服务端会话权限验证任何时候都不可缺少，硬件密钥只证明本台物理设备的用户确认
          explain: |
            不依赖软件里的一句 `if (passed)`，而是把通行证锁在只有指纹解锁后芯片才肯动用的、外部无法读出的私钥里。
      - item:
          id: attestation-replay-trap
          type: choice
          prompt: |
            服务端要求客户端上交“密钥证明（Key Attestation）”确认运行环境安全。万一有人把昨天那台合规手机曾经成功验证通过的证明数据保存下来，今天直接重发给服务端企图冒充合规设备，该怎么防？
          options:
            - text: 每次验证都由服务端下发一条全新的随机一次性挑战码（Challenge），要求设备安全芯片把该挑战码签进本次证明并核对证书签名链
              correct: true
            - text: 只核对设备传上来的文字是不是同样叫 `Pixel` 或 `iPhone` 型号名字
              why: 设备型号名称可以一行改掉随便填，不能当安全凭据
            - text: 只要证明长度超过 5 个字母就直接永远放行
              why: 必须靠包含新鲜一次性随机挑战的签名链来防止旧证据重放
          explain: |
            “新鲜挑战（防重放） + 签发证书链有效（防伪造） + 与当前账号操作绑定”，缺一不可。
      - item:
          id: lockscreen-change-risk
          type: choice
          prompt: |
            一台支持强生物认证加密密钥的手机，如果用户后来在手机系统设置里删掉了所有锁屏方式或重新录入了一个全新陌生人指纹，安全设计中通常要怎么应对这种本地状态变更？
          options:
            - text: 配置密钥使新增或改动系统生物特征后使旧认证密钥自动失效（触发 KeyPermanentlyInvalidated），要求重新输入账号口令重新登录认证后再签发新密钥
              correct: true
            - text: 继续无条件默认放行新录入的任意人指纹直接自动大额转账
              why: 一旦设备锁屏认证人发生变更，出于安全性应作废原快捷授权并要求主凭证重认
            - text: 直接彻底永久封死这个用户的银行账号这辈子再也不让找回
              why: 提供可靠的重新主密码认证与解绑恢复流程，既安全又不误伤正常换机或换指纹用户
          explain: |
            生物特征改动、换新手机与遗失注销都要有明确的安全失效与恢复闭环策略。
      - item:
          id: auth-layers-match
          type: match
          prompt: |
            把移动端身份验证体系中的各个构件与它真正证明的事实配对。
          pairs:
            - ["服务端会话校验与业务账号权限", "确定现在请求的后端账号是谁、能查/能改哪笔资源"]
            - ["受生物认证绑定的安全芯片私钥签名", "证明真有合法机主刚在本机通过指纹解锁才动用了那把受保护私钥"]
            - ["密钥证明（Key Attestation）含新鲜挑战", "向服务端提供“这把密钥确实躺在真实合规硬件里而非软件仿造”的佐证信号"]
          explain: |
            账号认证、硬件密钥和环境信号各管一摊，层层相扣才构筑起高可信移动认证。

  # ==== 应用数据与通信保护 ====
  - id: storage
    chapter: 应用数据与通信保护
    title: 本地存储隔离、日志防泄漏与备份清除边界
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            小王在排查登录 bug 时顺手写了一句打印代码：`Log.d("Auth", "login token=" + refreshToken)`，以为手机私有沙箱挺安全就没删。应用发上线后，哪个看似不起眼的路径最容易把用户的敏感登录令牌悄悄泄露出去？
          options:
            - text: 系统日志缓存或自动崩溃上报工具。哪怕沙箱私有目录有隔离，明文日志、系统截图预览和自动云备份依然可能把敏感令牌传出去或被连接工具读走
              correct: true
            - text: 绝对不会泄露。只要写了 Log.d，信息就永远留在开发者的脑子里不会写出去
              why: 手机系统日志、崩溃上报记录或未脱敏的请求头采集会把日志带离应用私有边界
            - text: 令牌一旦打成日志就会自动变身加密乱码
              why: 日志里打印的就是彻头彻尾的明文文字。
          explain: |
            OWASP **MASVS-STORAGE** 的第一条警告：**先减少落盘不必要的秘密**，非存不可的秘密要检查**私有目录、加密存储、日志、崩溃上报、剪贴板与备份**每一条外泄出口。
      - card:
          title: 不安全本地存储陷阱与修复
          body: |
            核心反例：**把登录令牌或身份证号明文存进普通偏好文件（`SharedPreferences`）、未加密本地库（SQLite）或公共外部存储**。一旦设备开启云备份、被连接导出或系统提权，明文配置一览无遗。
            **修复**：尽量少存敏感数据；必须存的钥匙交给 **Android Keystore**（推荐现代安全封装替代已废弃旧库）或 **iOS Keychain + Data Protection**，业务文件走加密存储。
          reveal:
            - title: 为什么公共外部存储尤其危险？
              body: |
                因为应用私有内部目录受沙箱紧盯，只有本应用能直接读写；而放进外部公共存储（如公共下载文件夹）的文件可能被手机里其他拿了文件访问权限的陌生应用一览无余。
      - card:
          title: 除了存储文件，还要检查五条隐形旁路
          body: |
            很多团队记得把数据库加了密，却忘了下面五条最容易漏查的旁路：
            1. **系统日志与崩溃上报**：禁止把密码、令牌、完整请求头打进 `Logcat` 或崩溃报告；
            2. **自动备份（AllowBackup / iCloud）**：凭据文件排除自动明文备份；
            3. **退后台缩略图快照**：敏感页开启防截屏或模糊遮罩；
            4. **系统剪贴板**：敏感口令或密保输入避免轻易留进跨应用共享剪贴板；
            5. **退出清理**：点退出账号时务必彻底清本地缓存并撤销服务端会话。
          reveal:
            - title: Android 文件级加密（FBE）怎么保“锁屏没解锁前数据读不出来”？
              body: |
                现代手机在设备刚通电开机、还没输入解锁密码之前，只有闹钟电话这类极基础系统目录被提前解开；而属于各个应用和用户的私密文件全部处在“凭据加密存储区”里，**只有等机主真输入过锁屏密码或刷对指纹之后才允许读出密钥解封目录**——既防丢机时直接拿走磁盘，也保障未解锁期间的隐私安全。
      - item:
          id: insecure-storage-c4
          type: choice
          prompt: |
            以下哪种本地数据保存做法属于 OWASP MASVS 重点指出的典型安全漏洞，应该如何修复？
          options:
            - text: 把用户令牌或证件号明文写进 SharedPreferences 或外部公共存储；应改由 Keystore / Keychain 保护密钥加密保存私有存储且禁写日志
              correct: true
            - text: 哪怕用明文把管理员私钥写进外部公共目录图片夹里也完全合规，只要把文件名改成 `a.txt` 就好
              why: 公共存储暴露给其他具备存储权限的应用，“文件名不写 password”不是加密保护
            - text: 为了绝对不加密又显得安全，把所有用户令牌明文写进全机公开日志里
              why: 系统日志极易被手机数据线研发探测工具或三方收集套件读走
          explain: |
            不把敏感秘密乱放公共存储或明文偏好文件，是移动安全审计必查第一条。
      - item:
          id: backup-screenshot-trap
          type: choice
          prompt: |
            某财务 App 在测试环境已经禁止打印日志了，但安全复测时依然能看到“刚刚展示的支付账单截图”和“崩溃报告里携带的认证请求头”。下一步该补齐哪项控制？
          options:
            - text: 敏感财务界面开启防截屏/切后台遮罩遮挡，并在崩溃与分析 SDK 上报前严格过滤脱敏请求头与敏感字段
              correct: true
            - text: 只把崩溃报告的上传目的路径从 HTTP 改成 HTTPS 就万事大吉
              why: HTTPS 只防止路上被外人偷看，依然会把本不该收的认证请求头完整交到三方崩溃统计服务商手里
            - text: 强制要求所有用户永远不要按 Home 键切到别的 App
              why: 切后台系统自动保存屏幕缩略图是系统默认行为，必须在敏感界面显式加防截屏保护（如 Android `FLAG_SECURE` / iOS 遮罩）
          explain: |
            从生成、渲染截图、剪切板、日志到上报，沿数据全流向每站堵住旁路才算数。
      - item:
          id: ios-data-protection-choice
          type: choice
          prompt: |
            在 iOS 设备上，应用存进沙箱文件与 Keychain 的保护策略除了加密以外，还能设定何时才允许系统解密读出（Data Protection / Accessible 属性）。对于一个**锁屏状态下绝不需要在后台使用的敏感隐私文件**，合理设定是？
          options:
            - text: 设为仅在设备当前处于“已解锁”状态下才允许解密读取，锁屏时密钥从受保护环境锁定不让读出
              correct: true
            - text: 设为哪怕设备一辈子从未输过解锁密码在开机刚点亮前也随时无条件任意明文开放
              why: 选对解锁时机保护级别能让丢手机且处于锁屏状态时攻击者更难从底层读出数据
            - text: 每次点开应用就先自动删除整个文件系统
              why: 正确做法是通过平台保护属性绑定到设备解锁周期
          explain: |
            根据业务是否真需要在后台/锁屏工作，给数据选紧最收紧的解锁可见条件。
      - item:
          id: storage-paths-match
          type: match
          prompt: |
            把移动应用里的敏感数据泄密途径与对症堵漏措施配对起来。
          pairs:
            - ["明文存在 SharedPreferences 或公共外部存储", "改存私有目录加密存储并用 Keystore / Keychain 保管密钥"]
            - ["正式发布版在排错日志或崩溃分析里带入认证令牌", "发布包关闭敏感测试日志并在上报前按白名单脱敏清理"]
            - ["银行余额与验证码页面切后台时被系统抓成任务缩略图", "在敏感页开启禁止系统截屏及退后台自动模糊遮罩"]
            - ["未排除敏感情境的系统云端自动整包备份", "配置备份策略排除敏感秘密与凭据文件，退出账号时清缓存"]
          explain: |
            本地存储防线从来不是“只调一次加密 API”，而是全链路排查每一条数据去向。

  - id: crypto
    chapter: 应用数据与通信保护
    title: 客户端加密规范：防硬编码密钥、随机数 Nonce 与平台密码库
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            小赵要调第三方短信验证码付费平台接口，图方便直接把一段固定不变的“全公司共用后端超级 API 密钥”写进手机安装包代码里（还信心满满启用了代码名字打乱把内部代号改成了 `x1`）。别人用免费拆包工具打开他发上网的安装包后，还能翻出这把密钥吗？
          options:
            - text: 照样三分钟轻松找出来。客户端分发给千千万万用户设备运行，运行要用的任何固定长期秘钥都藏不住；必须留在自己可控的后端服务器里
              correct: true
            - text: 绝对翻不出来。把英文名字改成代号 x1 后，手机就自己把密钥删掉了
              why: 名字打乱只是让代码读着眼晕，真实要发出去的密钥值依然原封不动躺在安装产物里运行。
            - text: 因为只能被安装 1 次，所以没人能同时下两份研究
              why: 安装包一旦分发上架任何人都能反复下载拆包、甚至运行时直接拦下来读取流出的明文密钥
          explain: |
            OWASP **MASVS-CRYPTO** 的核心要求之一：**客户端绝不可硬编码长期高权限密钥，更别自己乱拼暗号，要靠成熟平台加密库与安全随机规则**。
      - card:
          title: 破除“客户端藏密钥”幻想 & 正确替代路径
          body: |
            **为什么“改名混淆 / Base64（公开无密钥可转回原文的字符编码） / 拆段拼接”全都不算藏住了密钥？**
            因为到了程序真发网络请求那一微秒，最终的真密钥必定以明文形态传给网络库——拆包静态扫描或运行期抓包直接人赃并获。
            **正确修复做法**：
            1. **根本不要让长期服务级秘钥进客户端**：让自家后端服务器拿着秘钥替手机代发第三方接口请求；
            2. 若必须直连：由自家后台在用户登录后**按当下账号下发时效很短、权限受限的临时令牌**，出事随时后台吊销失效。
          reveal:
            - title: Android Keystore 与 iOS Keychain 的硬件护城河
              body: |
                当需要在本机保存加密用的对称或签名私钥时，放进普通应用文件就怕被人整份复制走；而交给 **Android Keystore**（由可信安全执行区 TEE 或独立专用高安全芯片 StrongBox 硬件保护）或 **iOS Secure Enclave / Keychain** 后，连设备真机主人在普通系统里也直接复制不出原始密钥，只能请安全区硬件按授权替你完成加解密和签名。
      - card:
          title: 平台密钥库与“绝不复用 Nonce”
          body: |
            需要在本机对私有数据加密时，别自己发明算法或拿固定日期当初始设置值。遵守三步：
            1. **密钥交系统保护**：由 **Android Keystore** 或 **iOS Keychain / CryptoKit** 生成保管；
            2. **用“认证加密（AEAD）”**（一类同时管加密保密与防篡改校验的标准算法族，如 AES-GCM）；
            3. **每次全新随机 Nonce**：同一密钥绝不重复用同一个初始随机数（Nonce）。
          reveal:
            - title: 为什么“同一密钥绝对不能重复用同一个 Nonce”？
              body: |
                现代流式认证加密就像每次加密配一个独一无二的一次性盐水瓶盖编号——只要同一把密钥对两条消息复用了同一个 Nonce，攻击者不用猜密钥就能把两段密文相抵消直接泄露出两条明文的异或差异甚至伪造校验标签。
      - item:
          id: hardcoded-key-c4
          type: choice
          prompt: |
            某 App 把调付费地图服务的全局长期管理员秘钥 `"map-master-live-8899"` 拆成两段拼接写死在代码里，以为这样能绕过安全检查。以下评价与修法正确的是？
          options:
            - text: 拆成两段甚至 Base64 或代码混淆依然属于客户端硬编码硬密钥，拆包分析或运行时抓包秒破；应撤回换新，由自己服务端代为转发请求或仅向已登录用户下发受限短期临时凭证
              correct: true
            - text: 只要拿 `Base64` 转一遍外观看不清就变成了军用级加密保险箱，可以放心永久留在客户端
              why: Base64 只是公开的字符正反编码方法，没有任何秘密密钥，一秒钟就能解码回原文。
            - text: 只要写进 `Release` 版就再也不会出现在手机安装文件里面了
              why: 客户端请求接口用得到的常量必须实际放进安装产物才能运行
          explain: |
            凡是下发到几百万人手里的客户端代码，本质上就是半公开代码；秘密密钥永远只留可控后端。
      - item:
          id: nonce-reuse-trap
          type: choice
          prompt: |
            使用现代认证加密（例如 AES-GCM）用同一把密钥加密多条用户敏感记录时，下面关于“Nonce（一次性随机数）”的做法哪一项符合标准安全规范？
          options:
            - text: 按密码学库规范为每一次加密操作生成绝不重复的新鲜随机数（并检查从不重用），失败篡改时拒绝解密
              correct: true
            - text: 为了省事写死 `nonce = "000000000000"`，全 App 一百万次加密全都用同一串固定值
              why: 对同一把密钥复用相同 Nonce 在 GCM 等流式模式下会直接泄密破坏明文保密性与认证防篡改保证
            - text: 不用任何成熟库，自己把每个字母往后挪 3 位当最新最安全密码
              why: 绝不自造弱加密，优先调经安全检验的平台认证加密官方安全库（如 CryptoKit / Android Jetpack Security）
          explain: |
            选平台成熟库 + 用认证加密 + 严格绝不重用 Nonce，客户端密码才站得住脚。
      - item:
          id: revoke-lost-device
          type: choice
          prompt: |
            如果用户带着登录好你 App 的手机不幸在外面丢失被捡走，下面哪项设计最能真正立刻止损“已下发到那台手机上的授权凭证不再继续有效”？
          options:
            - text: 服务端签发短期有效的访问令牌，并在账号后台支持一键踢出旧设备会话及立即使关联令牌过期失效
              correct: true
            - text: 给应用商店提交新版安装包，在客户端代码里加一行判断如果发现是丢失的设备号就清空本地缓存
              why: 手机丢了后捡到或窃取的人根本不会去升级新版，且本地判断可被绕过，必须靠服务端侧的会话撤销与令牌到期控制
            - text: 只把令牌用固定密钥加密存在手机本地文件里，但服务端对这枚令牌设置永不过期且不建黑名单
              why: 即使本地加密存储，只要手机处于解锁状态或被动态注入，攻击者仍能复用该令牌；凭据的有效裁判权必须在服务端已撤销清单和较短有效期策略里
          explain: |
            凭证要能生成、能轮换，更能在手机丢失被盗时从后端一秒废除。
      - item:
          id: crypto-mistakes-match
          type: match
          prompt: |
            把客户端密码保护常见踩坑点和正确工程解法连起来。
          pairs:
            - ["把固定第三方管理员秘钥写死在客户端包里", "移回可信后端代为转发，客户端只领有时效的用户短期令牌"]
            - ["用同一把密钥配合完全固定的全零 Nonce 反复加密多条数据", "遵从库要求每次使用加密安全随机源生成不重复 Nonce"]
            - ["只用无校验加密，没检查密文是否被本地篡改过", "使用 AEAD 认证加密模式，密文一旦被改动立刻拒解报错"]
          explain: |
            管住密钥位置、Nonces 唯一性与完整性检验，才不会让“加密了”变成心理安慰。

  - id: tls
    chapter: 应用数据与通信保护
    title: TLS 证书校验、禁明文传输（ATS/网络安全配置）与证书固定
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            开发人员测试期间因为测试服务器用了自己临时签的假 HTTPS 证书，觉得麻烦，就顺手写了一段“无条件信任全天下任何证书（哪怕证书过期、域名不对也全部放行）”的代码。忘了删就发了正式上线版。当用户连上咖啡馆公共恶意 Wi-Fi 时，会发生什么？
          options:
            - text: 彻底破坏了服务器身份认证。咖啡馆里的攻击者只需拿一张假证书就能假冒银行服务器站在中间偷听甚至篡改全部加密通信
              correct: true
            - text: 只要连接仍然使用对称加密算法传输密文，即使完全不校验对方证书归属，中间人也只能转发密文而无法解密偷看
              why: 如果不校验服务端证书真伪，中间人会在握手阶段直接用自己的假证书与手机协商出另一把对称密钥，从而彻底解密并篡改全部通信。
            - text: 手机会自动把假证书变成真银行证书
              why: 跳过证书校验等于彻底废除了 TLS 核验服务器真伪的核心防线
          explain: |
            OWASP **MASVS-NETWORK** 的核心：**传输必须加密且拒绝明文（HTTP）**，**绝不能关掉证书链和域名校验证明**。
      - card:
          title: 保留系统信任链、主机名校验与禁止明文 HTTP
          body: |
            一个安全的 TLS（HTTPS）连接必须在三项核查全部过关：**① 证书签名来自受信任 CA 机构** + **② 证书处于有效期内且没吊销** + **③ 证书中的域名与访问的主机名严格匹配**（同时在配置里禁用明文 `http://` 流量，测试期临时放宽只准留在测试覆盖配置里，绝不进正式发布包）。
            ```xml
            <!-- Android 网络安全配置 res/xml/network_security_config.xml：全站默认拒绝明文传输 -->
            <network-security-config>
                <base-config cleartextTrafficPermitted="false" />
            </network-security-config>
            ```
          reveal:
            - title: iOS 对应的 ATS（App Transport Security）怎么管？
              body: |
                iOS 从系统层面默认开启 **ATS** 强制要求走现代版本 TLS 安全加密且校验完整证书链与主机名；如果某特殊旧合作方需要极窄例外，也只能精准对单一特定域名申请最小例外并写清依据，严禁全盘关闭 ATS。
            - title: 本地 OpenSSL 命令行工具有过哪三项真实校验证书试验？
              body: |
                我们用本地开源证书工具 OpenSSL 对一张 RSA 2048 证书做过三组对比验证：① 带受信任自建 CA 证书且访问匹配主机名 `api.example.test` → **校验通过**；② 同张证书拿去匹配 `other.invalid`（主机名不符）→ **立刻拒连失败**；③ 清空信任根证书库再检 → **同样拒连失败**。
      - card:
          title: 证书固定（Certificate Pinning）与防自锁死预案
          body: |
            对高安全金融或核心接口，有时还会在默认系统校验基础上再加一层**证书固定（Pinning）**：应用内置自家服务器公钥指纹（即对证书内公钥提取出的 SPKI 哈希摘要），就算恶意用户或代理在手机系统里强行装了一张自己的“代理根证书”，App 依然认出“你不是我固定的公钥”，直接掐断防中间人抓包。
          reveal:
            - title: 为什么上证书固定前**必须先备好“备用固定密钥”**？
              body: |
                万一服务端下个月证书到期常规换新密钥，而老手机里写死了旧单一密钥指纹又没内置下一轮备份密钥——**全网老版本 App 会瞬间全员连不上网，连强制弹窗升级的接口都被掐死了。** 务必同时固定现用公钥 + 备份备用公钥，并提供安全策略更新与失效切换方案。
      - item:
          id: trust-all-certs-c4
          type: choice
          prompt: |
            在测试代码时为了图快重写了一个“什么证书都不校验、全部返回信任通过”的 `TrustManager`（或自定义 SSL 忽略域名错配放行），结果不小心带进了发布包。这打破了哪一项网络安全前提，如何修复？
          options:
            - text: 破坏了验证服务器真身身份的能力，中间人可拿任意伪造或其它域名证书拦截劫持流量；应删除全部不安全宽松实现，恢复系统默认证书链与主机名严格校验，测试证书只留 `debug-overrides` 配置
              correct: true
            - text: 没有任何安全漏洞，只要URL开头写了 `https://` 就算绕过全盘检查也绝不可能被冒充
              why: 通信双方的“防窃听”依赖于“确认密钥属于真服务器”，不验证书等于直接向中间人递钥匙。
            - text: 只在连接自签名测试服务器时才会跳过校验，一旦连上公网正式域名，自定义的无条件返回通过逻辑会自动恢复严格检查
              why: 自定义 `TrustManager` 一旦无条件返回通过而未做环境隔离，对所有公网连接都会统统跳过校验，令全部口令、令牌与财务请求暴露给中间人窃听或篡改
          explain: |
            测试便利性配置只能放进测试专用变体/覆盖域（例如 Android `debug-overrides`），发布版本干干净净走默认严格验证。
      - item:
          id: tls-hostname-check
          type: choice
          prompt: |
            你的 App 正在请求 `api.example.test`。收到对方回传了一张证书：这张证书确实由手机信任的合法根机构签发、也没过期，但证书上的域名写的是 `other.invalid`（而非 `api.example.test`）。按规范客户端应该怎么做？
          options:
            - text: 立刻拒绝连接。有效不仅要求签名链和有效期正确，还必须核对证书中的主机名与目标主机名匹配
              correct: true
            - text: 直接放行连接，反正只要证书不是过期的就行
              why: 任何人都可以为自己名下的 `other.invalid` 合法申请一张真证书。如果不核对域名，他就能拿那张合法证书冒充银行或你的 API。
            - text: 自动把用户访问目标悄悄改写跳转成 `other.invalid`
              why: 客户端访问谁就必须验证对方拿得出对应谁域名的匹配证书
          explain: |
            “根链信任 + 未过期 + 主机名匹配”三关缺一不可。
      - item:
          id: cleartext-policy-choice
          type: choice
          prompt: |
            在 Android 应用里添加 `network_security_config.xml` 并设置 `<base-config cleartextTrafficPermitted="false" />`，并在 Manifest 中启用之后，系统层能帮应用守住哪条底线？
          options:
            - text: 全局拦截禁止应用通过不加密的明文 HTTP 发出流量，迫使全部接口必须使用加密 HTTPS 连接（防止三方 SDK 暗中走明文）
              correct: true
            - text: 系统会自动把应用代码里写死的所有 `http://` 请求在发包时无条件静默改写成 `https://` 并自动补齐服务端证书
              why: 'cleartextTrafficPermitted="false" 的作用是在系统层直接阻断并报错拒绝明文 HTTP 请求，而不是替未部署 TLS 的服务端自动变出证书'
            - text: 会替服务端自动删除全部过期的旧日志
              why: 它是应用级的明文网络出站防护开关
          explain: |
            禁用明文不仅管住自己写的网络库，更常顺手拦住某个悄悄发明文数据的老旧第三方 SDK。
      - item:
          id: pinning-backup-plan
          type: choice
          prompt: |
            开发团队给自家金融 App 上了 HTTPS **证书固定（Pinning）**只写死了当前这一张单张证书指纹。半年后服务器正常到期更换了新证书，结果全网几十万没立刻升级 App 的老用户彻底连接不上服务器甚至连“下载新版本”弹窗都打不开了。开启固定前漏设计了什么？
          options:
            - text: 漏配了至少一个线下冷保存的“备用公钥固定指纹”、证书轮换平滑过渡窗口，以及应急切换恢复更新策略
              correct: true
            - text: 应该干脆彻底删除全部 HTTPS 和全部密码校验避免下次出错
              why: 不能因怕配置轮换麻烦就退回裸奔明文或放行假证书；应该设计包含备用公钥引脚的轮换全过程方案
            - text: 只要在固定代码里加上一行中文说明就能自动续期十年
              why: 说明文字不影响运行时密码指纹匹配判断
          explain: |
            上证书固定是一把双刃剑，务必先写好“现役主钥 + 至少一枚应急备钥 + 定期滚动机制”才上线。

  - id: privacy
    chapter: 应用数据与通信保护
    title: 最小隐私采集、第三方 SDK 监控与撤回清理闭环
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            你做了一款简洁离线手电筒/天气查询小工具（用户手动选城市看天气），结果市场部门顺手引入了一个免费的第三方数据统计包：该统计包刚初始化完，就把用户剪贴板里刚复制的内容和永久设备码全打包传出去了。怎么从工程上管住这种越权隐形外传？
          options:
            - text: 按隐私最小化盘点每条数据流：只采集实现功能必需数据，逐一审查三方组件真正发出的网络包体，并提供可落地的“撤回同意/关闭采集与数据删除”能力
              correct: true
            - text: 在用户协议第 99 页用极小灰字写一句“可能会收集任何内容”就代表技术上彻底安全合规了
              why: 法律文字免责条款不能阻止隐私泄露与商店下架审查；工程上必须真实削减和核验出网字段
            - text: 只要界面上不画出来提示框，数据发去别家服务器就不算收集
              why: 暗中采集恰恰是最严重的隐私合规违规和信任危机根源
          explain: |
            OWASP **MASVS-PRIVACY**聚焦数据留存与清理全阶段：收少、传净、真撤回、能删除。
      - card:
          title: 隐私梳理“五步台账”与第三方 SDK 审计
          body: |
            发版前拿一张纸拉出应用的**敏感隐私数据流清单**：
            1. **收集是否真必要**：手动选城市能用的天气，决不硬索后台连续精准位置；
            2. **第三方 SDK 都吐出去了什么**：抓包观察分析 SDK、广告包与崩溃统计发出的实际载荷，警惕顺手带上会话令牌、手机号或可跨应用串追踪的设备硬编号；
            3. **同意撤回与删除实测**：当用户在设置里关掉“个性化统计”或点击注销账号时，必须测试**排好队的旧后台发送任务是否真的停发**，本地、备份及云端按约定清除。
          reveal:
            - title: 为什么别乱采集 IMEI / MAC 等永久不变硬件串号？
              body: |
                永久硬编号跟着这部手机一辈子，用户哪怕卸载重装 App 甚至换了登录账号都甩不掉它，极易被不同软件串起来偷偷画像跨应用跟踪；遵循隐私标准，应当只用应用自己范围内可重置或随机的普通业务标识，给用户留住真正的控制权。
      - card:
          title: 避免拿测试环境当真实生产隐私泄洪口
          body: |
            开发测试与定位问题时，**绝不允许把真实生产用户的敏感个人信息整库拉回本地测试机或直接塞进测试代码里**。应采用人工构造脱敏假数据进行验证，并确保测试包与正式包严格隔离。
      - item:
          id: sdk-leak-check
          type: choice
          prompt: |
            抓包排查发版候选包时，意外发现引入的某个第三方统计分析库每次请求都会暗中把用户当前的会话登录令牌（Token）捎带发去统计方后台。首要动作应该是？
          options:
            - text: 立刻关停该字段采集配置或直接移除替换不合格三方组件，并抓包实测确认网络请求中彻底消失了令牌字段
              correct: true
            - text: 只改一下设置页面里的“隐私条款说明文字”，代码和组件原封不动继续发令牌
              why: 改文字声明不改变真实流出去的敏感认证凭据，一旦分析组件方泄露别人就能直接冒充登录你用户账号
            - text: 允许统计组件发令牌，只是在界面把字调小一点
              why: 第三方统计方完全不需要也不应该收到用户的账号认证令牌
          explain: |
            既看自己写的代码，更要用抓包工具紧盯第三方 SDK 真正往外发了哪些包。
      - item:
          id: consent-withdraw-test
          type: choice
          prompt: |
            用户昨天开启过“使用统计上传”（当时手机没网，有几条统计数据还在本地排队），今天用户进设置页面把“允许统计”彻底关掉撤回了同意。隐私验证测试最核心要测什么？
          options:
            - text: 检查待发送后台队列在今天联网恢复时，是否会重新核对当下最新的“已关闭同意”状态并作废清空、绝不把昨天的旧队列再偷偷发出去。
              correct: true
            - text: 只看设置页面上那个小开关动画有没有向左滑成灰色就行
              why: 界面按钮动效只是假象，真正在后台队列躺着的待发包如不重新检查同意标志照样会违规偷发。
            - text: 重新再弹三次窗口强迫用户打开开关
              why: 尊重用户的明确撤回决定并立刻停止后续采集和残留上传才是合规核心
          explain: |
            测隐私开关别只看按钮 UI 有没有变灰，要测数据链路是不是真的彻底闭嘴。
      - item:
          id: privacy-minimize-match
          type: match
          prompt: |
            把隐私工程规范动作和它防范的核心合规风险配对起来。
          pairs:
            - ["按需收集、能粗不细（用城市名代替持续高精度 GPS）", "减少位置敏感信息过度留存与泄露面"]
            - ["测试网络包审查第三方分析与广告 SDK 的实际外发字段", "拦截不受控插件顺手带走令牌、剪贴板或永久设备识别号"]
            - ["用手工造好的匿名脱敏样本替代真实生产数据在开发机测试", "防止海量真实客户个人信息流落出生产边界"]
          explain: |
            最少采集 + 抓包核验 + 脱敏测试，守好隐私合规每道门。
      - item:
          id: delete-account-scope
          type: choice
          prompt: |
            当用户按规定点击“永久注销删除账号数据”时，开发团队在后端和移动端本地分别还需要核对什么才算到位？
          options:
            - text: 既要清理手机本地数据库、偏好缓存与登录状态，也要通知后端服务及受控第三方关联数据按保留期限约定删除或失效撤销
              correct: true
            - text: 只把首页页面上的用户名隐藏成星号显示，本地文件库和后端表全部照常永久保留不动
              why: 仅在前端界面隐藏不展示并不算真正履行删除数据与失效会话责任
            - text: 只把手机系统时区改慢一小时即可
              why: 删除流程应真正清理本地缓存并在可信后端按约定执行注销删除
          explain: |
            前端删干净、会话立即失效、后端按规消除或脱敏，才是完整的清理闭环。

  # ==== 移动应用威胁建模与测试 ====
  - id: test
    chapter: 移动应用威胁建模与测试
    title: 从信任边界画威胁模型，再用静/动态测试验证
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            安全团队准备给一款手机购物应用做全面安全排查。如果直接拿一堆工具扫一通或者漫无目的地东点西点，很容易漏掉真正致命漏洞（比如导出组件越权）。规范第一步应该先画什么、标清什么？
          options:
            - text: 先梳理应用里最值钱的“关键资产”（令牌/账本），画出跨界面、跨组件、跨本地存储到云端的数据流与信任边界，逐条问这些边界会怎么失效。
              correct: true
            - text: 先把所有最新黑客名词全部抄进幻灯片首页就算查完了
              why: 脱离自家应用真实入口、资产与业务流的工具扫查容易抓错重点甚至盲人摸象
            - text: 只挑用户每天点击次数最多的首页界面做手工点按测试，完全忽略后台静默运行的导出组件与外部唤起入口
              why: 许多高危漏洞恰恰藏在无界面的导出组件、外部唤起入口与本地存储边界里，威胁建模必须覆盖所有外部数据流入与跨边界节点
          explain: |
            用**威胁建模**找到“敌人能从哪里进来、能拿走什么”，再精准对症下发 OWASP **MASTG** 静/动态验证用例。
      - card:
          title: 威胁建模（STRIDE）串联 OWASP 三大标准
          body: |
            对着你的移动系统，先把“手机端界面、本地组件、其他陌生 App、本地存储文件、网络通道、云端后台”之间的数据流连线画出来，在每跨过一条**信任边界**处用六字真言拷问：**假冒、篡改、抵赖、泄露、拒绝服务、越权**（简称 STRIDE）。
            OWASP 移动安全生态正好各司其职帮你落地：
            - **MASVS**：列好 8 大领域的目标安全标准清单（我们要达到什么要求）；
            - **MASTG**：手把手教 Android和 iOS两条线怎么写实测步骤；
            - **MASWE**：把具体漏洞弱点归类编号方便追踪修复。
          reveal:
            - title: 拿 STRIDE 六维度现场拆一次“扫码登录 + 文件预览”
              body: |
                沿着手机端与服务端交界一问：**假冒**（换签名假包或盗令牌冒充吗？）、**篡改**（本地包或无验证传输被改包了吗？）、**抵赖**（高敏操作没记录留证吗？）、**泄露**（令牌打进日志/明文偏好里了吗？）、**拒绝服务**（恶意传超大载荷卡死组件吗？）、**越权**（导出 Intent 组件被陌生 App 当混淆代理偷文件了吗？）。
      - card:
          title: 静态检查 + 动态测试双轮驱动
          body: |
            安全测试绝不能只看源码或只跑脚本，必须**静态 + 动态双管齐下**：
            - **静态排查（不运行 App）**：拆看最终打包出来的 Manifest、权限声明、网络安全 XML、`Info.plist`、第三方依赖版本号及包里残留常量；
            - **动态观察（真跑在测试设备或测试包上）**：在真机或可控测试环境下，实际发一个恶意 Intent 尝试访问对方组件、抓包观察到底走没走明文或漏了哪些字段、查本地沙箱与系统日志里到底有没有写出明文令牌。
            **完整安全缺陷报告**必须包含：受影响平台版本与包环境、稳定复现步骤、实际业务影响、以及修复后重测结果。
          reveal:
            - title: 为什么“只测 Android 通过，就能直接宣布 iOS 也绝对安全”是不对的？
              body: |
                Android 的组件暴露点在 `AndroidManifest.xml` 与 Intent/Deep Link；而 iOS 的安全边界在容器配置、Keychain 解锁属性、ATS 传输例外和 URL Scheme / Universal Links——两者底层实现和配置细节完全不同，必须按各自平台线（MASTG Android / iOS）各自抽查取证。
      - item:
          id: threat-model-first
          type: choice
          prompt: |
            给一款移动支付应用启动安全测试之前，最值得先做哪一件事来避免盲目测试漏掉高危攻击面？
          options:
            - text: 标出关键保护资产（支付口令/凭据/余额）、梳理跨应用和网络的数据流向与信任边界，推导出对应优先要测的安全用例
              correct: true
            - text: 不梳理业务数据流，直接把市面上所有的自动化扫描器对准登录页跑一遍默认规则就算完成全部排查
              why: 自动化扫描器很难理解特定业务的授权逻辑，没基于资产和信任边界建模的盲目扫描几乎必定错过深层导出接口和隐形存储问题
            - text: 因为用最新框架写的所以直接跳过所有安全测试
              why: 新框架无法自动替你设计好跨组件访问控制与服务端接口鉴权
          explain: |
            围绕资产和信任边界做威胁建模，每一条测试都能说清“测这步到底是在防谁哪一招”。
      - item:
          id: intent-verify-order
          type: order
          prompt: |
            针对一个必须向合作应用开放的导出组件，按严谨安全测试顺序排列验证步骤。
          steps:
            - 确认需要保护的私有资产以及该组件的外部来访入口协议
            - 列出法律与业务明确允许的合法来访者名单及允许操作资源表
            - 在测试环境分别用“已授权合法来访方”和“未授权陌生来访方/恶意输入”实发请求测试边界
            - 记录系统版本、构建包版本、真实观察结果以及修好后的复测通过证据
          explain: |
            “定资产与入口 → 列预期权限边界 → 正反实测 → 留版本重现与复测证明”，完整闭环。
      - item:
          id: exported-static-vs-dynamic
          type: choice
          prompt: |
            静态排查最终安装包清单时，发现组件 `OrderShare` 确实标成了 `exported="true"`（公开可被别的 App 启动）。据此就能立刻下结论“别人的订单肯定全部被偷光了”吗？
          options:
            - text: 还不够。公开标志只是入口线索，必须结合静态代码加上动态真机实测：传不同未授权传入值和陌生来客身份，观察它是不是真校验并拦截住了。
              correct: true
            - text: 只要写了 exported="true" 就说明电脑一定会立刻自动毁灭
              why: 有些公开分享或系统入口本来就需要导出，核心是看里面有没有配套严格的签名/身份和资源授权校验
            - text: 可以不用做动态测，直接在文本里删掉 true 字母假装测完通过
              why: 静态发现公开入口之后必须配合授权审查与实际请求测试验证防护是否真的有效
          explain: |
            静态扫查帮你精准找出“怀疑入口点”，动态实测帮你坐实“防线到底挡不挡得住”。
      - item:
          id: owasp-masvs-match
          type: match
          prompt: |
            把 OWASP 移动应用安全体系的三份资料与它们各自的用途连起来。
          pairs:
            - ["OWASP MASVS", "移动安全核心控制域与应当满足的基线标准清单"]
            - ["OWASP MASTG", "针对 Android 与 iOS 具体操作验证测试的手册指南"]
            - ["OWASP MASWE", "系统分类列举常见移动安全弱点条目方便缺陷定性与对齐"]
          explain: |
            MASVS 定标准、MASTG 教测法、MASWE 归类弱点。

  - id: build
    chapter: 移动应用威胁建模与测试
    title: 审查最终交付产物：合并清单、调试后门开关与依赖扫描
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            开发同学自信满满地说：“我自己的主 `AndroidManifest.xml` 里一个敏感权限和导出组件都没写啊。”结果把包真编出来拆开一查：最终生效清单里居然多出三个神秘的导出入口和一条允许明文传输开关。它们是从哪里冒出来的？
          options:
            - text: 是某个三方组件包在构建合并环节自动带进最终生效清单的。所以绝不能只看自己手写的源码，必须审查最终打包出来的有效配置与产物
              correct: true
            - text: 手机自己会趁人睡觉随机编造几条新组件加进去
              why: Android Gradle 构建会自动把主项目和全部引入包自带的 Manifest 片段合并成一份最终清单
            - text: 因为文件夹名字写错了导致自己多出一半代码
              why: 合并引入是构建系统的标准特性，必须检查最终合并输出产物才能揪出“猪队友依赖”带来的隐患
          explain: |
            OWASP **MASVS-CODE**强调：只审自己敲的几行代码远远不够，要紧盯**最终出厂安装包有效状态、依赖漏洞、测试后门与越范围读写防线**。
      - card:
          title: 最终打包制品必须亲眼核对的六项检查
          body: |
            别轻信“我打包点的是 Release 按钮肯定就没问题开关了”，直接抽查**最终产出包**：
            1. **Android 核对最终合并 Manifest**：查是否残留 `android:debuggable="true"`、意外设为对外开放的组件（`exported="true"`）、开启明文传输或默认宽松备份；
            2. **iOS 核对最终签名包授权声明与 `Info.plist`**：查权限描述、ATS 例外配置、是否误带了研发测试环境配置；
            3. **扫描三方依赖与硬编码常数**：排查已知高危漏洞老依赖包；用扫描工具找出像密钥一样的长随机文本常量，逐个确认用途、缩小权限或撤换清理。
      - card:
          title: 把安全门禁自动化接进每次构建交付流水线
          body: |
            靠人肉发布前临时记着看一眼早晚会漏。最佳实践是把配置核对和依赖扫描接进**自动化构建交付流水线**里：
            - 每次打包自动验证最终产物的签名归属、禁明文开启状态、无测试开关标志、已知高危依赖扫描与禁止硬编码密钥检查；
            - 原生底层扩展代码（例如用 C/C++ 写音视频处理程序时）开启平台防护检测防止越范围读写；并清晰登记产出构建版本，方便任何缺陷修完后针对同一精确构建物重跑复测验证。
          reveal:
            - title: 发版前自动安全核查清单（一键过五关）
              body: |
                每次打出正式发布包后让流水线自动查一遍：① 确认最终合并清单里 `debuggable` 与不必要的 `exported` 已关闭；② 确认网络安全策略禁掉了明文 `HTTP` 放行；③ 扫描确认没有测试假证书或硬编码服务密钥混入包内；④ 依赖组件清点无高危已知漏洞；⑤ 对照真实测试设备或真机记录再跑一次关键边界测试。
      - item:
          id: merged-manifest-trap
          type: choice
          prompt: |
            开发人员自己手写的 `src/main/AndroidManifest.xml` 文件里并没有开启明文传输，也没有把某服务设成导出，但引入了某老版广告或支付三方包后。哪个检查证据最能说明正式上线安装包到底安不安全？
          options:
            - text: 检查打包构建合并后的最终 `AndroidManifest.xml`（以及实际拆包分析产物），并在对应包上实测关键边界场景
              correct: true
            - text: 只对着工程自己手写的那单个源文件看一眼就行，三方包里的清单绝不可能合进来
              why: 构建合并器会把全部引入库携带的 Manifest 声明全部融合进最终应用清单里面
            - text: 看一下代码仓库一共几行说明文字就行
              why: 说明文字行数与实际生效配置毫无关系
          explain: |
            审查原则：**交付什么，就检查什么**——永远对着最终出厂构建包验真。
      - item:
          id: constant-secret-scan
          type: choice
          prompt: |
            自动化发布检查工具在包里扫出来一串长得像密钥的常量字符 `AKIA...` 或长随机密钥串。正确处置流程是？
          options:
            - text: 逐个核实它的真实用途、所属系统与权限边界——若确实是私密高权限密钥，立即从后端撤换轮换作废并彻底移出客户端
              correct: true
            - text: 闭眼把代码里所有的长文本常量一律直接删空不管功能报错
              why: 有的常量只是公开无害的图标标识或协议号，应按真实用途核查定性后再处置
            - text: 确认它是管理员秘密后反而把它放进公开说明文字里保留着
              why: 确定为高权限密钥泄露后，不仅要移除源码和打包产物，还必须立刻轮换使已发出旧密钥作废。
          explain: |
            不仅要删，如果已经提交进公开包或库，更要**立刻作废轮换那把密钥**。
      - item:
          id: build-check-match
          type: match
          prompt: |
            把发版前交付流水线审查的检查对象和各自防住的风险配对。
          pairs:
            - ["最终合并后的 Manifest / Info.plist", "抓住三方依赖带入的意外导出组件、宽松明文和开发测试选项"]
            - ["三方依赖清单与公开漏洞编号（CVE）扫描", "及时淘汰带有已知高危公开漏洞的陈旧外挂组件"]
            - ["正式发布包的签名与测试入口关闭校验", "防止测试版后门开关及弱签名混入面向公众的分发渠道"]
          explain: |
            流水线里设好自动化防线，上线前心里才真正有底。
      - item:
          id: native-code-boundary-check
          type: choice
          prompt: |
            为了加速图像处理，移动应用里通过原生绑定引入了自写的 C/C++ 原生底层库。除了 Kotlin / Swift 层自身，对这部分原生底层代码还需要额外注意什么安全审查？
          options:
            - text: 仔细检查传入文本或数据长度边界、空间释放清理安全，并开启系统推荐构建保护选项防范越范围写入破坏
              correct: true
            - text: C/C++ 底层代码永远不会出现任何溢出或越范围崩溃，无需任何检查
              why: C/C++ 不像 Kotlin/Swift 默认带安全边界拦阻，处理不可信输入时最易因越范围成为高危突破口
            - text: 只要用原生代码写，TLS 证书就自动免验了
              why: 原生处理数据层依然要做好边界防护，网络传输层照样严格走安全配置
          explain: |
            跨进底层原生部分就等于离开了高级语言托管安全网，输入长度与缓冲区检查一点也不能松懈。

  - id: resilience
    chapter: 移动应用威胁建模与测试
    title: 反逆向与防篡改纵深防御：看清客户端加固的真实边界
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            某 App 团队花重金买了一套“代码混淆 + 加壳 + 越狱/Root 检测 + 防运行时探测跟踪”安全加固套件。上线后老板开心极了：“太好了。这下黑客肯定拆不动包了，我们可以放心把会员 VIP 价格计算、免密免检扣款权限全都放回手机本地做决定，后台彻底不用校验了。”这样行得通吗？
          options:
            - text: 绝对不行。任何客户端运行在他人手上，加固只是大幅拉高拆解分析和篡改成本（纵深防御一层），绝不可取代服务端的可信授权校验
              correct: true
            - text: 完全行得通，经过混淆器处理后的客户端代码在本地无法被逆向还原或篡改
              why: 只要程序需要加载进设备真实运行，有经验的分析者在物理可控机器上总能不断逆向拆解与运行时探测
            - text: 因为加壳混淆会自动替服务器给钱
              why: 加固只是让自动化批量抄袭和轻易改动变得更耗时费力
          explain: |
            OWASP **MASVS-RESILIENCE**把客户端反逆向防篡改放在极其清醒客观的位置上：**它不是铁桶阵，而是提高攻击门槛的纵深防线之一**。
      - card:
          title: 客户端四类抗逆向与防篡改信号
          body: |
            针对确实高价值或易被外挂盗版的客户端（如游戏、高净值移动客户端），可在常规混淆之外视威胁加上四类防线：
            1. **代码结构混淆与敏感文字防明文**：让静态逆向拆包更费时；
            2. **自身签名与完整性校验**：启动或关键步骤核对包签名与核心代码哈希是否被重打包篡改；
            3. **反调试检测**：发现正在被人挂着**调试（开发跟踪窥探）**工具单步查看或注入时记录风险；
            4. **设备环境完整性信号（Root / 越狱检测 / 模拟器信号）**：评估当前设备是否处于安全底座已被破坏的受控高危环境。
      - card:
          title: 别拿高误报环境信号直接“永久封死账号”
          body: |
            Root / 越狱 / 模拟器检测都存在**误报与被绕过可能**：
            - **清醒应对误报**：别一发现环境可疑就把正常用户永久封号；按操作风险分级——逛普通页面放行，大额转账或敏感操作才走服务端风控加二次核验。
            - **分别验证两道闸门**：故意绕开调试包的本地防篡改后，若后台依然坚定拒绝对方越权，整套防御才算合格。
      - item:
          id: obfuscation-cannot-replace-server
          type: choice
          prompt: |
            为什么在 OWASP MASVS 原则下，即便已经开启最高级别代码混淆、防调试和安装包防重打包校验，核心敏感权限定价与余额扣款依然必须留在可信服务端裁决？
          options:
            - text: 客户端控制运行在外部不可控的终端设备环境里，防篡改只提升逆向作案成本，不能作为唯一信任根替代服务端业务裁决
              correct: true
            - text: 因为代码混淆只会修改文件修改日期而不改任何函数名
              why: 混淆确实会打乱类名函数名，但在运行者彻底物理可控的设备上，分析者总有动态注入等办法绕开本地逻辑
            - text: 因为混淆只能用在 iOS 绝对不能用在 Android
              why: Android (R8/ProGuard) 与 iOS 都可以混淆，但两者同样在可信边界外
          explain: |
            加固防线的作用是“劝退 90% 的顺手抄袭和初级外挂玩家、为风控争取信号”，真正的大门钥匙永远捏在后端服务器手里。
      - item:
          id: false-positive-root-strategy
          type: choice
          prompt: |
            某版本发布的“越狱/Root 检测组件”在某种新手机系统更新后产生了误报，把一批全新正版未改动过系统的新手机判成了“高风险环境”。更成熟的应对策略是什么？
          options:
            - text: 结合风险评估分级响应：不因单一环境信号就永久误封账号，改用限制高危操作、补充强二次核验或把信号送服务端综合风控，并留有顺畅申诉与热更新调整空间
              correct: true
            - text: 只要检测到任一本地信号哪怕全是误报，一毫秒内把用户一辈子的账号余额直接清零销户
              why: 误判就永久销毁账号会对真实正常用户造成灾难性打击，任何客户端风控信号都要容许误报兜底与降级路径
            - text: 永远把全部风险检测结果全改成假装全是安全，完全不给后端看
              why: 高可信风险信号上报后端风控或触发二次核验仍有正面防御价值，只是不可当成唯一盲杀判决书
          explain: |
            安全机制要算误杀账和兼容代价，“风险分级 + 服务端联动”比“前端一刀切永久拉黑”聪明得多。
      - item:
          id: resilience-bypass-test
          type: choice
          prompt: |
            团队自己做红蓝演练：测试员用受控测试构建样本成功模拟绕过了客户端本地的防重打包完整性校验，接着拿着修改后的客户端继续尝试直接篡改订单价格提交给后端，结果后端严格核对商品原价当场拒绝了该订单。这次测试证明了什么？
          options:
            - text: 客户端抗篡改层虽然在对抗环境下被绕开了，但可信服务端作为独立的第二道主防线完全顶住了攻击，纵深防御设计有效
              correct: true
            - text: 说明整个系统全部防线彻底垮塌，服务端校验一点用都没有
              why: 恰恰相反，测试证实了纵深防御里最根本的后端主权校验防线真实有效，并指明了客户端防护有待加强的一处环节
            - text: 说明测试员把客户端代码删除干净了
              why: 实验验证了不同层面各自独立的失败边界
          explain: |
            “假设前端已被黑，后端依然屹立不倒”，正是移动应用安全架构通过验证的最高标准。
      - item:
          id: resilience-controls-match
          type: match
          prompt: |
            把各种移动抗逆向与防篡改手段配对到各自主要应对的威胁环节。
          pairs:
            - ["安装后对比包自身数字签名或核心代码完整性校验", "尽早察觉包是否被人偷偷拆包加料后重新打包签名分发"]
            - ["运行时检测挂载调试连接或底层方法被注入篡改", "察觉正在进行的动态逆向窥探或绕过前端限制意图"]
            - ["向服务端发送本地硬件认证+设备风险评估信号", "帮后端识别高风险自动化黑产批量环境，驱动分级风控或二次核验"]
          explain: |
            签名防重打包 + 动态防探测 + 服务端联合风控，共同拉高恶意逆向的门槛。

boss:
  items:
    - id: boss-sandbox-ios-android-c4
      type: choice
      prompt: |
        对照比较 Android 与 iOS 移动应用平台安全模型时，下面哪一项对比准确完整？
      options:
        - text: 两者都用每应用沙箱隔离私有目录并靠运行时询问敏感权限；Android 按独立 Linux UID 跑加 SELinux 且允许官方商店以外的侧载安装；iOS 则必须由苹果签名且默认只走严格审核的 App Store 分发
          correct: true
        - text: iOS 允许从全球任意网页直接免签名随便侧载运行软件，而 Android 完全没有独立进程沙箱
          why: 正好把开放与封闭、侧载与严格统一商店审核两边的生态特征彻底写反了
        - text: 只要 APK 包上带有有效数字签名，系统就证明这应用绝对写不出隐私漏洞
          why: 代码签名只证明来源身份与未被改动，无法保证逻辑没有漏洞
        - text: 手机上所有 App 本身都在一个共同大文件夹里随便互相查看各自本地密码
          why: 每应用隔离沙箱是 Android 和 iOS 最底层的安全基石
      explain: |
        掌握两端共性（沙箱 + 运行时授权）与生态差异（侧载碎片化 vs 严格签名统一审核），才能因地制宜评估威胁面。
    - id: boss-confused-deputy-c4
      type: choice
      prompt: |
        一个导出的 Android Intent 组件接收到外界传入的路径文本后，直接拼起来去读取本应用私有文件并返回给对方。这为什么叫“混淆代理（Confused Deputy）”越权问题，该怎样堵死？
      options:
        - text: 外部原本没权访问私有目录的 App 可以骗取该组件替它动用自己的高文件权限读出文件。若只限自己用则直接设 `android:exported="false"`；必须对外共享时校验请求方签名权限并使用固定“允许业务编号白名单映射表”（绝不信外部路径）
          correct: true
        - text: 根本不用设 `exported="false"`，只要把代码里路径里的 `../` 替换成空字符或者不把组件名字写进说明书里就彻底 100% 安全了
          why: 光删 `../` 照样可以传入其他已知合法相对名字越权读取；而清单导出名字公开可见，“藏名字不写文档”不算访问控制
        - text: 因为手机绝对禁止导出组件读取自家应用的任何数据
          why: 组件本来就能合法读取自家数据，错就错在“没验证外人资格就傻傻代读并交出去”
        - text: 只要在导出组件的 Intent Filter 里声明一个自定义的 Action 名称，其他应用就无法构造显式 Intent 启动该组件
          why: 只要 `android:exported="true"` 且未配置签名级权限保护，攻击者应用无需经过 Intent Filter 就能直接按包名和类名发送显式 Intent 启动该组件。
      explain: |
        能关就关（`exported="false"`）；真要开就双查（调方身份权限 + 严格业务资源允许表）。
    - id: boss-masvs-storage-c4
      type: choice
      prompt: |
        对照 OWASP MASVS 检查“不安全的本地数据存储”漏洞：下面哪组做法**属于高危漏洞，且配对的修复措施完全正确**？
      options:
        - text: 漏洞：把登录刷新令牌或隐私号明文存进 SharedPreferences / 外部存储或打入系统日志；修复：最小化保存，敏感密钥走 Keystore / Keychain，私有加密存储数据并禁止写日志和排除明文备份
          correct: true
        - text: 漏洞：用了 Android Keystore 保护密钥；修复：为了方便以后查 bug 把所有用户的密码和令牌全都打印到公共日志并存进共享图片目录
          why: 刚好把正规安全实践和最危险的泄密反例说反了
        - text: 只要文件名不要叫 `secret.txt` 改名叫 `cat.txt`，放在公共存储卡里就能防住一切应用扫描
          why: 靠混淆名字无法阻止恶意程序遍历和文件分析
        - text: 只要不设置注销登录清本地缓存按钮就自动最安全
          why: 退出账号时不清理敏感本地缓存容易让借用或转手设备拿到旧账信息
      explain: |
        牢记存储防线：能不存不存 → 存必加密与 Keystore/Keychain → 日志/截屏/备份旁路全排查。
    - id: boss-masvs-tls-c4
      type: choice
      prompt: |
        开发期间团队为了连自签测试接口在代码里放行了一段“不校验服务器证书真假、不检查域名匹配与允许明文 HTTP”的逻辑并混进了发布包。发布前的正确整改方式是？
      options:
        - text: 删掉全信任放行代码，恢复系统默认完整证书链与主机名严格匹配校验，在正式配置里禁止明文传输（如 `cleartextTrafficPermitted="false"`），必要时使用带备用公钥计划的证书固定
          correct: true
        - text: 保留“全盘信任任何证书”代码上线，只要界面网址栏悄悄加上 `https` 五个字母就能靠信仰防住中间人攻击
          why: 不验证对方证书是不是真属于目标域名，加密等于直接和中间假冒者加密沟通，毫无身份保障
        - text: 证书只要还没过期就行，哪怕证书里写的域名完全是另一家陌生网站也应该放行通过
          why: 必须同时验证签名受信任机构、未过期、以及证书域名与所访问主机名严密匹配
        - text: 为了方便开发，把所有线上正式生产用户请求全部降回不加密的明文 HTTP
          why: 生产环境应当坚决全面关闭明文流量传输
      explain: |
        证书信任来源、未过期与主机名三项核验守稳，加上禁止明文传输，无线公共网络下通信才不怕中间人劫持。
    - id: boss-masvs-hardcoded-key-c4
      type: choice
      prompt: |
        关于 OWASP MASVS“硬编码密钥”脆弱性，下面哪一项判断和修复方案完全正确？
      options:
        - text: 任何固定写死在客户端包里的管理员秘钥哪怕经过代码混淆或分两段拼接，拆包分析几分钟即可提走；必须立刻撤换作废，由可信后端服务器持有秘钥代发请求或仅下发按账号受限的短期令牌
          correct: true
        - text: 把秘钥先做一次 Base64 编码放进客户端就绝对等于高强度不可破解保护了
          why: Base64 只是一种无密钥正反双向字符编码规则，任何工具一秒解码回原文，根本不算加密保密
        - text: 只要公司内部约定好不在官网博客上写出秘钥数值，就没有人有本事拆开手机安装包读到它
          why: 发在应用商店给全网安装下载的安装包文件本身就包含这串原始字符常量，任何人用拆包或抓包工具都能拿到
        - text: 客户端一旦开启混淆器后，这串密钥就会在手机上自己变成空值从而再也发不出去请求
          why: 程序正常运行必须能使用真密钥值，混淆改不了运行时传出的密钥内容本身
      explain: |
        客户端只拿“有时效、有限权、可从后端随时废除的用户令牌”，永远别让全局秘钥出门。
    - id: boss-biometric-attestation
      type: choice
      prompt: |
        设计手机端“指纹解锁大额转账”与“判断客户端运行设备环境真实安全”时，最抗篡改的配合机制是？
      options:
        - text: 本地生物认证通过后解锁锁在安全硬件区里的受保护私钥，对服务端随机新发的挑战值做数字签名；搭配带新随机挑战的密钥证明（Key Attestation）辅助核验环境
          correct: true
        - text: '指纹弹框通过后只在应用代码里直接给服务端发 `{"isOk": true}` 三个字段而不带任何私钥签名证明'
          why: 纯真假标志 JSON 在可控设备上可直接篡改拦截伪造
        - text: 只要手机第一次出厂发回过一张证明，未来十年每次交易全部直接复制回放这张老证明就行
          why: 不绑新鲜一次性挑战值的旧证明包会被别人截获重放冒充，必须绑定每回新随机挑战
        - text: 在界面上隐藏了转账确认页就永远不用在后端验证登录用户权限
          why: 服务端账号权与金额权限校验是每笔交易任何时候都不可省掉的底线
      explain: |
        生物认证解锁硬件签名私钥 + 新随机挑战防重放 + 服务端完整账号授权校验，三合一才牢靠。
    - id: boss-privacy-sdk
      type: choice
      prompt: |
        在检查隐私合规时，测试发现：用户昨天已经进设置关掉了“个性化数据分析”，但应用昨天下线没网前积压在本地记录里的老分析包今天刚一连网又暗中发上去了。哪一环节出了疏漏？
      options:
        - text: 离线排队任务唤醒发送前没有重新检查当下最新用户授权同意状态；应清理已撤销队列且在任何数据流发送前复核授权
          correct: true
        - text: 只要设置页里那个小开关动画能左右滑动就算合规通过了，后台想发什么随它便
          why: 隐私测试必须紧盯真实网络外发包与后台队列清理，不能停留在 UI 按钮外观
        - text: 给所有分析 SDK 都顺便抄送一份登录授权令牌就能自动变合规
          why: 统计分析包里带入用户敏感会话令牌本身就是重大越权泄露漏洞
        - text: 把生产环境十万个真实用户信息全拷进自己笔记本电脑当日常调试数据用
          why: 生产真实用户隐私数据严禁直接拷贝进本地开发测试环境中
      explain: |
        撤回授权意味着从这一秒起“立即停发、按规清除历史残留排队”。
    - id: boss-build-artifact-audit
      type: choice
      prompt: |
        发布包安全检查里，为什么安全工程师坚持要查“真正打包构建出来的最终合并包”，而不是只拿开发机源码目录里那一个手写 `AndroidManifest.xml` 文件就签字放行？
      options:
        - text: 三方组件依赖和构建环境往往会在合并构建阶段带进额外的导出组件声明、明文放开开关或忘记关掉的调试标记，只有核验最终出厂制品和动态运行实测才不留死角
          correct: true
        - text: 因为构建打包工具在生成 Release 包时会自动删掉源码目录里手写的所有权限声明
          why: 构建工具不会无故删掉手写声明，真正的风险是多方依赖的清單合并（Manifest Merger）可能额外塞入未预期的权限或导出组件
        - text: 因为源码目录里的 `AndroidManifest.xml` 只能声明界面标题，无法声明 `android:exported` 或权限配置
          why: 源码清单同样可以声明导出属性与权限，但最终生效的是经过 Gradle 合并三方库与构建变体覆盖后的打包成品清单
        - text: 只要在源码里把 `buildTypes.release` 的名字写对，Gradle 就会自动拦截一切三方 SDK 夹带的明文流量开关与导出组件
          why: Manifest Merger 默认会合并依赖库里的清单项，必须对最终构建产物（APK/AAB）解包复核合并后的实际配置
      explain: |
        交付给千千万万用户的是最终出厂安装包，安全验证就必须盯住那个出厂包本身。
    - id: boss-threat-test-order
      type: order
      prompt: |
        为一个跨应用开放的新增移动功能入口安排威胁建模与安全验证测试流程，排出正确顺序。
      steps:
        - "列出需要重点保护的核心资产，画出跨界面、本地库与网络的数据流及信任边界"
        - "沿着边界分析可能出现的假冒、篡改、泄露或越权混淆代理等风险路径"
        - "制定包含授权与未授权来访方/恶意传入值的正反安全核验场景，在目标测试版本实测验证"
        - "如实记录构建包版本、触发条件与业务影响，修复后使用同构建流程复测确认闭环"
      explain: |
        围绕边界先建模找高风险路径，再静动态双查与正反实测，效率比盲测高出十倍。
    - id: boss-resilience-depth
      type: choice
      prompt: |
        某移动应用加上了混淆、签名校验与反调试检查后，在一次演练中被验证：即便攻击者在魔改设备里强行绕开了本地反调试弹窗，当他尝试提交篡改后的订单金额 0.01 元去请求后台扣款时，服务端依然独立核价报错拒绝。这次演练得出了什么核心工程结论？
      options:
        - text: 客户端加固有效拉高了恶意分析难度，而服务端作为独立的后端主防线成功守住了核心业务逻辑——纵深防御各司其职、互不单点依赖。
          correct: true
        - text: 证明客户端防线完全没必要，以后顺便把后台服务端的价格检查也全部删掉算了
          why: 服务端恰恰是防线能够守住底线的最后主权核心，绝不可撤掉；客户端加固也仍能阻止大部分廉价自动化攻击
        - text: 证明这台设备只要改名就能无限白嫖 0.01 元订单
          why: 服务端独立核价拒绝了篡改金额的请求，演示了纵深防御阻止实质资损
        - text: 证明手机应用只要不开日志就可以完全不用测试任何网络安全问题
          why: 每层风险都要各自独立测试验收，客户端加固不能替代网络校验或后端授权
      explain: |
        祝贺通关《移动应用与设备安全》。现在你已经拥有以 OWASP MASVS 为标尺、覆盖平台沙箱、导出权限、安全存储/加密/TLS 到纵深测试的完整移动安全护城河能力。
