skill: N.2.1
version: 2
authors: [main-agent]
brief:
  why: 晶体管、激光器、闪存、太阳能电池和芯片的工作原理都要用量子力学来讲。这一关从光的能量一份一份讲起：光子、物质波、波函数和薛定谔方程，势阱里的能级、隧穿和谐振子，算符和测量，氢原子、自旋，最后是泡利不相容原理、原子的壳层结构、X 射线和激光。假设你学过力学和电磁学、振动和波（复数、驻波、波包）、一元积分、二阶常系数微分方程和矩阵的特征值。
  outcomes:
    - 用 $E = hf$、$p = h/\lambda$ 算光子的能量和动量，用光电方程算遏止电压和逸出功，用康普顿公式算散射后的波长
    - 用玻尔模型算氢原子的能级、轨道半径和谱线波长，算电子、中子的德布罗意波长
    - 由波函数算一段区间里的概率、做归一化，用不确定关系估算速度的不确定量和能级宽度
    - 写出薛定谔方程和定态薛定谔方程，说明定态的概率分布为什么不随时间变
    - 算无限深势阱的能级、波函数和跃迁波长，说明有限深阱和势垒外的指数衰减，估算隧穿的透射系数
    - 写出量子谐振子的能级，说明零点能的来历，用升降算符在能级之间上下移动
    - 算位置和动量的期望值与不确定度，判断算符是不是厄米的，由展开系数算测量结果的概率、期望值和测后的状态
    - 说出氢原子的量子数和简并度，算角动量的大小和分量、轨道磁矩和塞曼分裂
    - 用泡利矩阵算自旋沿各方向的测量概率，说明施特恩–格拉赫实验和自旋进动
    - 用泡利不相容原理往势阱和原子里填电子，写出电子组态，算 X 射线的最短波长和特征谱线，说明激光的条件
terms:
  # 波粒二象性
  - term: 黑体
    def: '能把照到它上面的电磁波全部吸收的物体；它辐射的光谱只由温度决定'
  - term: 维恩位移定律
    def: '黑体辐射最强的波长和温度成反比：λ_max·T = 2.898×10⁻³ m·K'
  - term: 斯特藩–玻尔兹曼定律
    def: '黑体单位面积辐射的总功率和热力学温度的四次方成正比：P/A = σT⁴'
  - term: 紫外灾难
    def: '经典理论算出的黑体辐射在短波一侧无限增大、和实验不符的问题'
  - term: 能量子
    def: '普朗克假设的能量的最小份额 hf：频率为 f 的振动只能吸收或放出 hf 的整数倍'
  - term: 普朗克常数
    def: '能量子和频率的比例常数 h = 6.626×10⁻³⁴ J·s'
  - term: 光子
    def: '光的能量和动量的最小单元：一个光子的能量 E = hf = hc/λ，动量 p = h/λ'
  - term: 光电效应
    def: '光照到金属表面把电子打出来的现象；光子能量 hf 至少要等于逸出功'
  - term: 逸出功
    def: '把一个电子从金属表面拿出去至少要给它的能量 W，各种金属不同，一般几个电子伏特'
  - term: 遏止电压
    def: '光电效应中让光电流正好降到零的反向电压 V_s，满足 eV_s 等于光电子的最大动能'
  - term: 康普顿散射
    def: '光子和电子相撞后波长变长的散射：Δλ = (h/mₑc)(1 − cos θ)'
  - term: 定态
    def: '能量确定、概率分布不随时间变化的状态；波函数写成 ψ(x)e^(−iEt/ħ)'
  - term: 能级
    def: '原子或其他束缚系统的定态所允许的能量值，一个个分立'
  - term: 基态
    def: '能量最低的定态'
  - term: 激发态
    def: '能量比基态高的定态；处在激发态的原子会跃迁到较低的能级并放出光子'
  - term: 约化普朗克常数
    def: 'ħ = h/2π = 1.055×10⁻³⁴ J·s，读作“h 拔”'
  - term: 跃迁
    def: '原子在两个能级之间的变化；向下跃迁放出能量等于两能级之差的光子，向上跃迁吸收光子'
  - term: 玻尔半径
    def: '氢原子基态的特征半径 a₀ = ħ²/(mₑke²) ≈ 0.0529 nm'
  - term: 物质波
    def: '实物粒子对应的波，波长 λ = h/p、频率 f = E/h'
  - term: 德布罗意波长
    def: '动量为 p 的粒子对应的波长 λ = h/p'
  - term: 波粒二象性
    def: '光和实物粒子都既有波动性又有粒子性，一次实验显出哪一面取决于测的是什么'
  # 薛定谔方程
  - term: 波函数
    def: '描述粒子状态的函数 Ψ(x, t)，一般取复数值；|Ψ|² 是在各处找到粒子的概率密度'
  - term: 复共轭
    def: '把复数 a + bi 里的 i 换成 −i 得到的 a − bi，记作 z*；z*z = |z|²'
  - term: 概率密度
    def: '单位宽度上的概率：在 x 附近宽 dx 的区间里找到粒子的概率是 |Ψ|²dx'
  - term: 归一化
    def: '让波函数满足 ∫|Ψ|²dx = 1，也就是在整个空间找到粒子的概率为 1'
  - term: 不确定关系
    def: '位置和动量的标准差满足 Δx·Δp ≥ ħ/2；能量和时间之间也有 ΔE·Δt ≥ ħ/2'
  - term: 方差
    def: '各次结果减平均值后平方、再按概率求平均：(ΔA)² = ⟨A²⟩ − ⟨A⟩²'
  - term: 标准差
    def: '方差的平方根，表示一组结果离平均值的典型距离'
  - term: 平面波
    def: '动量确定的自由粒子的波函数 Ae^(i(kx − ωt))，p = ħk，E = ħω'
  - term: 薛定谔方程
    def: '决定波函数随时间变化的方程 iħ∂Ψ/∂t = −(ħ²/2m)∂²Ψ/∂x² + VΨ'
  - term: 算符
    def: '把一个函数变成另一个函数的规则，如动量算符 p̂ = −iħ d/dx'
  - term: 哈密顿算符
    def: '对应能量的算符 Ĥ = −(ħ²/2m)d²/dx² + V(x)'
  - term: 定态薛定谔方程
    def: '定态的空间部分满足的方程 Ĥψ = Eψ，即 −(ħ²/2m)ψ″ + Vψ = Eψ'
  # 一维势阱与隧穿
  - term: 势阱
    def: '中间低、两边高的势能分布，能量不够的粒子被困在中间；无限深势阱的能级 Eₙ = n²h²/(8mL²)'
  - term: 量子数
    def: '标记定态的整数（或半整数），如势阱的 n、氢原子的 n、l、m'
  - term: 零点能
    def: '束缚粒子不可能去掉的最低能量，如无限深势阱的 E₁、谐振子的 ½ħω；来自不确定关系'
  - term: 经典禁区
    def: '总能量低于势能、经典粒子不可能到达的区域；量子的波函数在这里按指数衰减但不为零'
  - term: 势垒
    def: '一段比两边高的势能，像一堵墙；能量低于墙高的粒子经典上过不去'
  - term: 隧穿
    def: '粒子穿过能量不够、经典上过不去的势垒，透射概率约为 e^(−2κa)'
  # 谐振子
  - term: 量子谐振子
    def: '在势能 ½mω²x² 里运动的粒子，能级 Eₙ = (n + ½)ħω，n = 0, 1, 2, …'
  - term: 对易子
    def: '两个算符按两种顺序作用之差 [Â, B̂] = ÂB̂ − B̂Â；位置和动量 [x̂, p̂] = iħ'
  - term: 升降算符
    def: '谐振子里让能量升或降一级 ħω 的两个算符 â₊、â₋；â₋ψ₀ = 0 定出基态'
  # 算符与测量
  - term: 期望值
    def: '对很多个处在同一状态的系统测同一个量的平均值，如 ⟨x⟩ = ∫x|ψ|²dx'
  - term: 傅里叶变换
    def: '把一个函数拆成各个波数的平面波 e^(ikx)，求出每个波数分量大小的运算'
  - term: 埃伦费斯特定理
    def: '期望值按牛顿定律的样子变化：d⟨x⟩/dt = ⟨p⟩/m，d⟨p⟩/dt = ⟨−dV/dx⟩'
  - term: 本征值
    def: '算符作用在某个函数上只等于原函数乘一个数时的那个数，就是线性代数里的特征值'
  - term: 本征态
    def: '算符的本征函数代表的状态；处在本征态时测这个量一定得到对应的本征值'
  - term: 内积
    def: '两个函数 f、g 的 ⟨f|g⟩ = ∫f*g dx，是向量点积的推广'
  - term: 厄米算符
    def: '对任意 f、g 满足 ⟨f|Âg⟩ = ⟨Âf|g⟩ 的算符；本征值都是实数，可测的物理量都对应厄米算符'
  - term: 正交
    def: '两个向量点积为 0；两个函数内积 ∫f*g dx 为 0 也叫正交'
  - term: 完备
    def: '一组本征函数能叠加出任何波函数时，说它们是完备的'
  - term: 坍缩
    def: '测量得到某个本征值后，状态立刻变成对应的本征态'
  # 角动量与氢原子
  - term: 角量子数
    def: '决定角动量大小的量子数 l = 0, 1, 2, …，L² = l(l + 1)ħ²；氢原子里 l 最大是 n − 1'
  - term: 磁量子数
    def: '决定角动量 z 分量的量子数 m，L_z = mħ，m 从 −l 到 l 共 2l + 1 个值'
  - term: 主量子数
    def: '氢原子能级 Eₙ = −13.6 eV/n² 里的 n = 1, 2, 3, …'
  - term: 简并
    def: '几个不同的状态有相同的能量；状态数叫简并度，氢原子第 n 能级只数 n、l、m 时是 n²'
  - term: 玻尔磁子
    def: '原子磁矩的单位 μ_B = eħ/(2mₑ) = 9.27×10⁻²⁴ J/T = 5.79×10⁻⁵ eV/T'
  - term: 塞曼效应
    def: '原子放进磁场后能级按磁量子数分开、谱线分裂的现象，相邻能级差 μ_B·B'
  # 自旋
  - term: 自旋
    def: '电子等粒子固有的角动量，电子的自旋量子数 s = 1/2，S_z 只能是 ±ħ/2'
  - term: 自旋–轨道耦合
    def: '电子的自旋磁矩和它绕核运动产生的磁场之间的相互作用，让 l ≥ 1 的能级分成两个'
  - term: 精细结构
    def: '自旋–轨道耦合等效应造成的能级细小分裂，如钠的 589.0 nm 和 589.6 nm 两条黄线'
  - term: 泡利矩阵
    def: '三个 2×2 矩阵 σ_x、σ_y、σ_z，自旋分量的算符是 (ħ/2)σ；本征值都是 ±1'
  # 全同粒子与泡利不相容
  - term: 全同粒子
    def: '质量、电荷、自旋等内在性质完全相同、在量子力学里无法区分的粒子，如所有电子'
  - term: 玻色子
    def: '交换两个粒子后波函数不变的粒子，自旋为整数，如光子；多个玻色子可以处在同一状态'
  - term: 费米子
    def: '交换两个粒子后波函数变号的粒子，自旋为半整数，如电子、质子、中子'
  - term: 泡利不相容原理
    def: '两个全同的费米子不能处在同一个量子态；一个空间状态最多放两个自旋相反的电子'
  - term: 费米能
    def: '电子按不相容原理从低到高填满能级后，最高被占据的能级的能量'
  - term: 壳层
    def: '原子里主量子数 n 相同的电子组成的一层，最多容纳 2n² 个电子'
  - term: 支壳层
    def: '原子里 n 和 l 都相同的电子，如 2p；最多容纳 2(2l + 1) 个电子'
  - term: 电子组态
    def: '原子里电子在各支壳层上的分布，如氧 1s²2s²2p⁴'
  - term: 元素
    def: '原子核里质子数相同的一类原子，如氢、氦、碳；质子数叫原子序数'
  - term: 价电子
    def: '原子最外层参与成键的电子，如硅的 4 个 3s、3p 电子'
  - term: 半导体
    def: '导电能力介于导体和绝缘体之间的材料，如硅、锗；掺入少量别的原子能大大改变导电性'
  - term: 选择定则
    def: '原子放出或吸收一个光子的跃迁要满足的条件，最常见的是 Δl = ±1'
  - term: 莫塞莱定律
    def: 'K_α 特征 X 射线的能量约为 10.2(Z − 1)² eV，Z 是原子序数'
  - term: 纵模
    def: '激光谐振腔里两镜之间正好放下整数个半波长的驻波，相邻纵模的频率差 c/(2L)'
  - term: 自发辐射
    def: '高能级的原子自己跳到低能级放出光子，方向和相位随机'
  - term: 受激辐射
    def: '入射光子促使高能级的原子放出一个和它频率、方向、相位都相同的光子'
  - term: 粒子数反转
    def: '高能级上的原子比低能级的多；激光放大的必要条件'
  - term: 亚稳态
    def: '寿命比普通激发态长得多（毫秒级）的激发态，原子能在上面积累'
lessons:
  - id: blackbody-photons
    chapter: 波粒二象性
    title: 黑体辐射和光子
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 电炉丝通电后越来越热，颜色从暗红变成橙黄，再变得发白。温度升高时，它发出的光里最强的那部分往哪边移？
          options:
            - text: 往短波长（蓝紫）一边移
              correct: true
            - text: 往长波长（红外）一边移
              why: 颜色从红变到橙黄再发白，说明短波长的光占的比例越来越大，最强的波长在变短
            - text: 哪边也不移，各种颜色只是一起变亮
              why: 如果各种颜色按同样的比例变亮，颜色就不会变；颜色变了，说明最强的波长移动了
          explain: 温度越高，辐射最强的波长越短。这一课会给出这条规律的公式（维恩位移定律），再讲为什么经典物理解释不了黑体的光谱。
      - card:
          title: 热辐射和黑体
          body: |
            任何有温度的物体都在向外辐射电磁波，这叫热辐射。室温下的物体主要辐射看不见的红外线，烧到上千摄氏度才发出明显的可见光。

            能把照到它上面的电磁波全部吸收、一点也不反射的物体叫**黑体（blackbody）**。在空腔的壁上开一个小孔，射进小孔的光在腔里反射许多次，几乎全被吸收，这个小孔就很接近黑体。黑体辐射的光谱只由温度决定，和它是什么材料无关。
      - card:
          title: 光谱的两条规律
          body: |
            测出黑体在每个波长上辐射的强弱，画成曲线，有两条规律。第一条，辐射最强的波长 $\lambda_{\max}$ 和热力学温度 $T$ 成反比：

            $$\lambda_{\max}T = b,\qquad b = 2.898\times10^{-3}\ \text{m·K}$$

            这叫**维恩位移定律（Wien's displacement law）**。第二条，单位面积辐射的总功率和 $T^4$ 成正比：

            $$\frac{P}{A} = \sigma T^4,\qquad \sigma = 5.67\times10^{-8}\ \text{W/(m}^2\text{·K}^4)$$

            这叫**斯特藩–玻尔兹曼定律（Stefan–Boltzmann law）**。
      - item:
          id: sun-peak
          type: number
          prompt: 太阳表面温度约 5800 K，把太阳当成黑体。它辐射最强的波长约多少纳米？
          answer: 499.6
          tolerance: 3
          unit: nm
          hint: 维恩位移定律里，最强波长和温度是什么关系？
          explain: $\lambda_{\max} = b/T = 2.898\times10^{-3}/5800 \approx 5.00\times10^{-7}\text{ m} = 500\text{ nm}$，落在可见光的青绿色一带。人眼在白天最敏感的是 555 nm 附近的黄绿光，离这里不远。
      - item:
          id: body-peak
          type: number
          prompt: 人体皮肤的温度约 310 K，把皮肤当成黑体。它辐射最强的波长约多少微米？
          answer: 9.35
          tolerance: 0.1
          unit: μm
          hint: 温度只有太阳的约十九分之一，最强波长会变成太阳的多少倍？
          explain: $\lambda_{\max} = 2.898\times10^{-3}/310 \approx 9.35\times10^{-6}\text{ m} = 9.35\ \mu\text{m}$，在红外区。测体温的热像仪就工作在 8–14 μm 这一段。
      - item:
          id: double-temperature
          type: number
          prompt: 一个黑体的温度从 300 K 升到 600 K。它单位面积辐射的总功率变成原来的几倍？
          answer: 16
          hint: 总功率和温度的几次方成正比？
          explain: '$P/A \propto T^4$，温度变成 2 倍，功率变成 $2^4 = 16$ 倍。常见的错误是只乘 2：功率和温度不是正比关系。'
      - card:
          title: 紫外灾难
          body: |
            19 世纪末，物理学家用经典理论推算黑体光谱：把空腔里的电磁波看成许多驻波模式，按能量均分定理，每个模式平均分到 $kT$ 的能量（$k$ 是玻尔兹曼常数）。波长越短，腔里能容下的模式越多，于是算出的辐射强度随波长变短一直增大（大致和 $1/\lambda^4$ 成正比），总功率是无穷大。

            实验曲线却在短波一侧降回零。理论在紫外一侧和实验对不上，后人把这叫做**紫外灾难（ultraviolet catastrophe）**。
      - card:
          title: 普朗克的能量子
          body: |
            1900 年普朗克提出：频率为 $f$ 的振动，能量不能连续变化，只能是 $hf$ 的整数倍：

            $$E = nhf,\qquad n = 0, 1, 2, \dots$$

            $hf$ 这一份叫**能量子（energy quantum）**，$h = 6.626\times10^{-34}\ \text{J·s}$ 叫**普朗克常数（Planck constant）**。高频模式的一份能量 $hf$ 比 $kT$ 大得多，热运动很难给它凑齐一份，这些模式几乎不被激发，短波一侧的辐射就降了下来。按这个假设算出的曲线和实验相符。
      - item:
          id: why-planck
          type: choice
          prompt: 普朗克的假设为什么能让黑体光谱在短波一侧降下来？
          options:
            - text: 短波模式一份能量 $hf$ 远大于 $kT$，难被激发
              correct: true
            - text: 每个模式分到的能量都比 $kT$ 少一点，加起来就有限了
              why: 低频模式的 $hf$ 远小于 $kT$，照样平均分到约 $kT$；被压下去的只有高频模式
            - text: 短波的电磁波从小孔漏出去了，留在腔里的少
              why: 小孔对各个波长一样敞开，漏出去的正是被测到的辐射；问题出在腔里每个模式分到多少能量
          explain: 能量只能一份一份地给，一份的大小 $hf$ 随频率增大。$hf \gg kT$ 的模式几乎分不到能量，所以短波一侧的辐射趋于零，总功率变成有限值。
      - card:
          title: 光子
          body: |
            1905 年爱因斯坦更进一步：不只是振动的能量一份一份，光本身就由一份一份的能量组成，每一份叫一个**光子（photon）**。频率 $f$、波长 $\lambda$ 的光，一个光子的能量

            $$E = hf = \frac{hc}{\lambda}$$

            用电子伏特和纳米计算时，记住 $hc \approx 1240\ \text{eV·nm}$ 很方便：波长 620 nm 的红光，一个光子的能量是 $1240/620 = 2.00\text{ eV}$。
      - item:
          id: violet-photon
          type: number
          prompt: 波长 400 nm 的紫光，一个光子的能量是多少电子伏特？取 $hc = 1240\ \text{eV·nm}$。
          answer: 3.1
          tolerance: 0.01
          unit: eV
          hint: 光子能量和波长是正比还是反比？
          explain: $E = hc/\lambda = 1240/400 = 3.10\text{ eV}$。波长比红光短，光子能量就比红光的 2.00 eV 大。
      - item:
          id: laser-photon-rate
          type: number
          prompt: 一支功率 1 mW 的激光笔发出波长 620 nm 的红光。它每秒发出 $N\times10^{15}$ 个光子，$N$ 是多少？取 $hc = 1240\ \text{eV·nm}$，$1\text{ eV} = 1.602\times10^{-19}$ J。
          answer: 3.12
          tolerance: 0.03
          hint: 一个光子带多少焦耳的能量？1 mW 是每秒多少焦耳？
          explain: 一个光子 $1240/620 = 2.00\text{ eV} = 3.20\times10^{-19}$ J。每秒发出的能量是 $10^{-3}$ J，光子数 $10^{-3}/3.20\times10^{-19} \approx 3.12\times10^{15}$。一支普通激光笔每秒就有上千万亿个光子，所以平时看不出光是一份一份的。
      - item:
          id: uv-sunburn
          type: choice
          prompt: 晒太阳时，紫外线能把皮肤晒伤；暖气片发出的红外线总功率可以大得多，却只让人觉得暖和。主要原因是什么？
          options:
            - text: 一个紫外光子的能量够打断化学键，红外光子不够
              correct: true
            - text: 红外线照不进皮肤，能量都被衣服挡住了
              why: 红外线照样被皮肤吸收，所以才觉得暖；关键在于它每个光子的能量太小
            - text: 暖气片发出的红外线，总功率其实比太阳光里的紫外线小
              why: 题里说红外线的总功率可以更大，却仍然不晒伤；起作用的是每个光子的能量，不是总功率
          explain: 化学键的能量约几个电子伏特。波长 300 nm 左右的紫外光子约 4 eV，能打断皮肤细胞里的化学键；10 μm 的红外光子只有约 0.12 eV，再多也只是让分子振动得更厉害，也就是发热。
  - id: photoelectric
    chapter: 波粒二象性
    title: 光电效应
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 用很强的红光照一块锌板，没有电子飞出来；换成很弱的紫外光，立刻有电子飞出来。原因可能是什么？
          options:
            - text: 光的能量一份一份交给电子，每份多大由频率决定
              correct: true
            - text: 红光要多照一会儿，电子才能攒够能量
              why: 实验里红光照多久都打不出电子，而紫外光再弱，电子也几乎是立刻飞出来
            - text: 紫外光比红光亮，给电子的能量多
              why: 题里的紫外光很弱、红光很强；决定能不能打出电子的不是亮度
          explain: 一个电子一次吸收一个光子。光子能量 $hf$ 不够，光再强、照再久也打不出电子。这一课把这个想法写成方程。
      - card:
          title: 光电效应
          body: |
            光照到金属表面，能把金属里的电子打出来，这叫**光电效应（photoelectric effect）**，打出来的电子叫光电子。

            在真空管里放两块金属板，光照其中一块，另一块收集光电子，接上电流表就能测到电流。把电压反过来加，让收集板的电势比被照的板低，电子要克服电场才能过去。反向电压加到某个值时，连跑得最快的光电子也过不去，电流正好降到零。
      - card:
          title: 四条实验事实
          body: |
            1. 每种金属有一个截止频率（也叫红限），光的频率低于它时，照多强也没有光电子。
            2. 光电子的最大动能随光的频率线性增大，和光强无关。
            3. 光强只改变每秒打出的光电子数目，也就是电流的大小。
            4. 光一照上就有光电子，几乎没有延迟。

            如果光是连续的波，强光应该打出更快的电子，弱光要照一阵电子才能攒够能量。这和第 1、2、4 条都矛盾。
      - item:
          id: wave-contradiction
          type: choice
          prompt: 下面哪一条是从“光是连续的波、能量均匀铺开”推出的预言，并且被光电效应的实验推翻了？
          options:
            - text: 光越强，光电子的最大动能越大
              correct: true
            - text: 光越强，每秒打出的光电子越多
              why: 波动说和光子说都这样预言，实验也证实了：光强加倍，电流也加倍，没有被推翻
            - text: 频率越高的光，每秒打出的光电子越多
              why: 波动说不这样预言；实验里每秒打出的电子数主要由光强决定，频率决定的是电子的最大动能
          explain: 实验上光电子的最大动能只取决于频率，光强加倍它不变。这正说明每个电子只从一个光子那里拿能量，一份的大小 $hf$ 和光强无关。
      - card:
          title: 爱因斯坦的光电方程
          body: |
            一个光子把能量 $hf$ 全部交给一个电子。电子离开金属至少要花掉一部分能量 $W$，剩下的变成动能，离开表面时损失最少的电子动能最大：

            $$hf = W + K_{\max}$$

            $W$ 叫**逸出功（work function）**，每种金属不同，一般几个电子伏特。$hf = W$ 时 $K_{\max} = 0$，这个频率 $f_0 = W/h$ 就是截止频率。让电流降到零的反向电压 $V_s$ 叫**遏止电压（stopping voltage）**，它正好挡住最快的电子：$eV_s = K_{\max}$。例如逸出功 2.00 eV 的金属用 400 nm 的光照：光子 3.10 eV，$K_{\max} = 1.10$ eV，遏止电压 1.10 V。
      - item:
          id: stopping-400
          type: number
          prompt: 某金属的逸出功是 2.30 eV，用波长 400 nm 的光照射它。遏止电压是多少伏特？取 $hc = 1240\ \text{eV·nm}$。
          answer: 0.8
          tolerance: 0.01
          unit: V
          hint: 一个光子多少电子伏特？减去逸出功剩多少？
          explain: 光子能量 $1240/400 = 3.10\text{ eV}$，$K_{\max} = 3.10 - 2.30 = 0.80\text{ eV}$。电子带电 $e$，动能 0.80 eV 的电子正好被 0.80 V 的反向电压挡住，所以 $V_s = 0.80\text{ V}$。
      - item:
          id: cutoff-wavelength
          type: number
          prompt: 某金属的逸出功是 2.30 eV。能从它上面打出光电子的光，波长最长是多少纳米？取 $hc = 1240\ \text{eV·nm}$。
          answer: 539.1
          tolerance: 1
          unit: nm
          hint: 光子能量恰好等于逸出功时，波长是多少？
          explain: $hc/\lambda_0 = W$，$\lambda_0 = 1240/2.30 \approx 539\text{ nm}$，在绿光一带。波长更长（频率更低）的光，一个光子的能量不到 2.30 eV，打不出电子。
      - item:
          id: double-intensity
          type: choice
          prompt: 用同一频率的光照射同一块金属，把光强加倍。遏止电压怎样变化？
          options:
            - text: 不变
              correct: true
            - text: 变成原来的 2 倍
              why: 光强加倍是光子数加倍，每个光子的能量 $hf$ 不变，最快电子的动能也不变
            - text: 变成原来的 $\sqrt2$ 倍
              why: 这是把光电子的动能当成和光强成正比、再按 $v \propto \sqrt{K}$ 推出来的；实际上 $K_{\max}$ 只取决于频率
          explain: $eV_s = K_{\max} = hf - W$，式子里没有光强。光强加倍只让每秒打出的电子加倍，电流变大，遏止电压不变。
      - card:
          title: 例题：由两组数据求 h 和逸出功
          body: 用波长 250 nm 的光照某金属，遏止电压 2.66 V；换成 400 nm 的光，遏止电压 0.80 V。求普朗克常数和这种金属的逸出功（$c = 3.00\times10^8$ m/s，$e = 1.602\times10^{-19}$ C）。
          reveal:
            - title: 第 1 步：把两组数据写成两个方程
              body: |
                $eV_s = hf - W$。两种光的频率 $f = c/\lambda$：$f_1 = 3.00\times10^8/250\times10^{-9} = 1.20\times10^{15}$ Hz，$f_2 = 3.00\times10^8/400\times10^{-9} = 7.50\times10^{14}$ Hz。
            - title: 第 2 步：两式相减，消去 W，求 h
              body: |
                $e(V_1 - V_2) = h(f_1 - f_2)$，所以

                $$h = \frac{1.602\times10^{-19}\times(2.66 - 0.80)}{1.20\times10^{15} - 7.50\times10^{14}} = \frac{2.98\times10^{-19}}{4.50\times10^{14}} \approx 6.62\times10^{-34}\ \text{J·s}$$

                以 $V_s$ 为纵轴、$f$ 为横轴画图，所有金属的直线斜率都是 $h/e$，密立根 1916 年就是这样测出 $h$ 的。
            - title: 第 3 步：代回一个方程，求 W
              body: |
                400 nm 的光子能量 $1240/400 = 3.10$ eV，$W = 3.10 - 0.80 = 2.30$ eV。用 250 nm 的数据代也一样：$4.96 - 2.66 = 2.30$ eV。
      - item:
          id: work-function-300
          type: number
          prompt: 用波长 300 nm 的光照某金属，测得遏止电压 1.83 V。这种金属的逸出功是多少电子伏特？取 $hc = 1240\ \text{eV·nm}$。
          answer: 2.3
          tolerance: 0.01
          unit: eV
          hint: 光子能量减去逸出功等于什么？最大动能用遏止电压怎样表示？
          explain: 光子能量 $1240/300 = 4.13\text{ eV}$，最大动能 $eV_s = 1.83\text{ eV}$，$W = 4.13 - 1.83 = 2.30\text{ eV}$。
      - item:
          id: silicon-cutoff
          type: number
          prompt: 手机相机的感光元件是硅做的。光子要把硅里的一个电子“打”到能导电的状态，至少要 1.12 eV 的能量（电子留在硅里，这叫内光电效应）。硅能响应的光，波长最长约多少纳米？取 $hc = 1240\ \text{eV·nm}$。
          answer: 1107
          tolerance: 5
          unit: nm
          hint: 和金属的截止波长一样算，这里的“逸出功”换成了多少？
          explain: $\lambda_{\max} = 1240/1.12 \approx 1107\text{ nm}$，在近红外。所以硅既能感受可见光（400–700 nm），也能感受一部分近红外光；手机相机前面通常加一片滤掉红外的滤光片。
  - id: compton
    chapter: 波粒二象性
    title: 康普顿效应和光子的动量
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 用 X 射线照石墨，X 射线被石墨里的电子散射到各个方向。散射出来的 X 射线，波长和原来相比怎样？
          options:
            - text: 有一部分变长了，散射角越大变得越多
              correct: true
            - text: 不变，散射只改变传播方向
              why: 经典的电磁波理论确实这样预言，但实验在散射线里测到了一个波长更长的成分
            - text: 变短了，电子把能量交给了 X 射线
              why: 电子原来几乎静止，碰撞后被撞得运动起来，能量是从 X 射线那里拿走的，X 射线的能量变小
          explain: 光子像小球一样和电子相撞，把一部分能量和动量交给电子，自己的能量变小、波长变长。这一课把它算出来。
      - card:
          title: 光子的动量
          body: |
            光子没有静止质量。狭义相对论（适用于接近光速运动的力学，这里只用它的一条结论）给出，这样的粒子能量和动量满足 $E = pc$。代入 $E = hc/\lambda$：

            $$p = \frac{E}{c} = \frac{h}{\lambda}$$

            波长越短，光子的动量越大。光照到物体上产生的辐射压，就是大量光子把动量交给物体的结果。
      - item:
          id: photon-momentum
          type: number
          prompt: 波长 500 nm 的光子，动量是 $N\times10^{-27}$ kg·m/s，$N$ 是多少？取 $h = 6.626\times10^{-34}$ J·s。
          answer: 1.325
          tolerance: 0.005
          hint: 光子的动量等于普朗克常数除以什么？
          explain: $p = h/\lambda = 6.626\times10^{-34}/(500\times10^{-9}) = 1.325\times10^{-27}$ kg·m/s。和一个以 1 m/s 运动、质量 1 g 的物体（$10^{-3}$ kg·m/s）相比小了二十多个数量级。
      - card:
          title: 康普顿散射
          body: |
            1923 年康普顿用 X 射线照石墨，在不同角度测散射线的波长。除了原来的波长 $\lambda$，还出现一个更长的波长 $\lambda'$，多出的部分只和散射角 $\theta$ 有关，和散射物质无关：

            $$\Delta\lambda = \lambda' - \lambda = \frac{h}{m_ec}(1 - \cos\theta)$$

            $h/(m_ec) = 2.43$ pm（1 pm = $10^{-12}$ m）叫康普顿波长。把光子和静止的电子当成两个相撞的粒子，按能量守恒和动量守恒（电子用相对论的能量）就能推出这个式子。这种光子和电子的碰撞叫**康普顿散射（Compton scattering）**。
      - item:
          id: compton-90
          type: number
          prompt: X 射线在电子上发生康普顿散射，散射角 90°。波长增加了多少皮米？康普顿波长取 2.43 pm。
          answer: 2.43
          tolerance: 0.01
          unit: pm
          hint: $\cos 90°$ 是多少？
          explain: $\Delta\lambda = 2.43\times(1 - \cos 90°) = 2.43\times(1 - 0) = 2.43$ pm。散射角 180°（光子被弹回）时最大，是 4.86 pm。
      - card:
          title: 例题：反冲电子拿走多少能量
          body: 波长 71.0 pm 的 X 射线被一个静止的电子散射，散射光子沿原路弹回（$\theta = 180°$）。求散射光子的波长和电子获得的动能。康普顿波长取 2.43 pm，$hc = 1.240$ keV·nm。
          reveal:
            - title: 第 1 步：用康普顿公式求新波长
              body: $\Delta\lambda = 2.43\times(1 - \cos180°) = 2.43\times2 = 4.86$ pm，$\lambda' = 71.0 + 4.86 = 75.86$ pm。
            - title: 第 2 步：求散射前后光子的能量
              body: $E = hc/\lambda = 1.240/0.0710 = 17.46$ keV；$E' = 1.240/0.07586 = 16.35$ keV。皮米换成纳米要除以 1000。
            - title: 第 3 步：用能量守恒求电子的动能
              body: 电子原来静止，光子少掉的能量全部变成电子的动能：$17.46 - 16.35 = 1.12$ keV。
      - item:
          id: recoil-90
          type: number
          prompt: 波长 71.0 pm 的 X 射线被一个静止的电子散射，散射角 90°。电子获得多少千电子伏特的动能？康普顿波长取 2.43 pm，$hc = 1.240$ keV·nm。
          answer: 0.578
          tolerance: 0.003
          unit: keV
          hint: 散射后的波长是多少？电子拿走的能量从哪里来？
          explain: $\lambda' = 71.0 + 2.43 = 73.43$ pm，$E = 1.240/0.0710 = 17.465$ keV，$E' = 1.240/0.07343 = 16.887$ keV，电子的动能是两者之差 0.578 keV，比弹回时的 1.12 keV 少。
      - item:
          id: visible-compton
          type: choice
          prompt: 用可见光（比如 500 nm）照射物体，几乎观察不到康普顿效应。为什么？
          options:
            - text: 波长的相对变化只有约十万分之一
              correct: true
            - text: 可见光的光子没有动量，撞不动电子
              why: 任何光子都有动量 $h/\lambda$，500 nm 的光子同样有，只是比 X 射线光子小
            - text: 可见光光子能量太小，全被电子吸收了，没有散射光
              why: 可见光照样被散射，天空的蓝色就是散射光；问题在于散射后的波长变化太小
          explain: $\Delta\lambda$ 和入射波长无关，最多 4.86 pm。对 71 pm 的 X 射线是 7% 的变化，很容易测；对 500 nm 的可见光只有 $4.86\times10^{-12}/500\times10^{-9} \approx 10^{-5}$，淹没在谱线本身的宽度里。
      - card:
          title: 光到底是波还是粒子
          body: |
            双缝干涉、衍射、偏振说明光是波；黑体辐射、光电效应、康普顿散射又说明光的能量和动量一份一份地交换，像粒子。两类实验各自只显出光的一面：传播时按波的规律走，和物质交换能量时一份一份地进行。德布罗意后来提出，电子这样的实物粒子也有同样的双重性质。
      - item:
          id: which-shows-wave
          type: choice
          prompt: 下面哪个实验最直接地显示了光的波动性？
          options:
            - text: 光通过两条窄缝后在屏上形成明暗相间的条纹
              correct: true
            - text: 紫外光照到锌板上立刻打出电子
              why: 光电效应显示的是光的能量一份一份地交给电子，是粒子性
            - text: X 射线被电子散射后波长变长
              why: 康普顿散射把光子当成和电子相撞的粒子来算，显示的是粒子性
          explain: 双缝干涉的条纹来自两列波的叠加，相位相同处加强、相反处减弱，这是波才有的行为。
  - id: hydrogen-spectrum
    chapter: 波粒二象性
    title: 氢原子的线状光谱
    minutes: 11
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 让氢气放电管发出的光通过光栅，分开各个波长。屏上看到的是什么样子？
          options:
            - text: 几条分开的彩色亮线，中间是暗的
              correct: true
            - text: 从红到紫连续的一整片彩带
              why: 白炽灯这样的热物体才发出连续光谱；稀薄气体里的原子只发出几个特定的波长
            - text: 只有一条白色的亮线
              why: 光栅会把不同波长分到不同角度，白光也会被分开；看到的是几条不同颜色的线
          explain: 每种原子只发出几种特定波长的光，叫线状光谱，可以用来判断发光的是哪种原子。氢的谱线排得很有规律，这一课看这个规律，以及经典物理为什么解释不了它。
      - card:
          title: 氢的线状光谱
          body: |
            1885 年巴耳末发现，氢在可见光区的四条谱线（656、486、434、410 nm）满足一个简单的式子。后来推广成里德伯公式：

            $$\frac{1}{\lambda} = R\left(\frac{1}{n_1^2} - \frac{1}{n_2^2}\right),\qquad n_2 > n_1$$

            $R = 1.097\times10^7\ \text{m}^{-1}$ 叫里德伯常量，$n_1$、$n_2$ 都是正整数。$n_1 = 1$ 的一组在紫外区，叫赖曼系；$n_1 = 2$ 的一组在可见光区，叫巴耳末系；$n_1 = 3$ 的一组在红外区，叫帕邢系。
      - item:
          id: h-alpha
          type: number
          prompt: 氢的巴耳末系（$n_1 = 2$）里波长最长的一条谱线对应 $n_2 = 3$。它的波长是多少纳米？$R = 1.097\times10^7\ \text{m}^{-1}$。
          answer: 656.3
          tolerance: 0.5
          unit: nm
          hint: 括号里两个分数各是多少？算出来的结果是波长，还是波长的倒数？
          explain: $1/\lambda = 1.097\times10^7\times(1/4 - 1/9) = 1.524\times10^6\ \text{m}^{-1}$，$\lambda = 656.3$ nm，是红色的 H$\alpha$ 线。$n_2$ 越大两项差越大，波长越短，所以 $n_2 = 3$ 的这条最长。
      - card:
          title: 经典模型的困难
          body: |
            卢瑟福的实验表明，原子的正电荷和几乎全部质量集中在很小的原子核上，电子在外面。如果电子像行星一样绕核转，它在做加速运动，按电磁学会不断辐射电磁波、损失能量，沿螺旋线落进核里，算出来用时不到一纳秒。而且辐射的频率随轨道连续变化，光谱应该是连续的。现实中原子是稳定的，光谱是线状的。
      - item:
          id: classical-collapse
          type: choice
          prompt: 按经典电磁学，绕原子核做圆周运动的电子会怎样？
          options:
            - text: 不断辐射电磁波、损失能量，沿螺旋线落进核里
              correct: true
            - text: 像行星一样一直稳定地转下去
              why: 行星不带电；电子带电，做圆周运动有加速度，加速运动的电荷会辐射电磁波，把能量带走
            - text: 越转越快，最后被甩出原子
              why: 辐射让电子损失能量，它会越转越靠近核，而不是飞出去；核对电子是吸引力
          explain: 加速运动的电荷会辐射电磁波。电子的能量被辐射带走，轨道越来越小，最后落进核里。现实中的原子却是稳定的，这说明经典物理在原子尺度上失效了。
      - item:
          id: paschen-alpha
          type: number
          prompt: 氢的帕邢系（$n_1 = 3$）里波长最长的一条谱线对应 $n_2 = 4$。它的波长是多少纳米？$R = 1.097\times10^7\ \text{m}^{-1}$。
          answer: 1875
          tolerance: 2
          unit: nm
          hint: 括号里两个分数各是多少？它们的差比巴耳末系的大还是小？
          explain: $1/\lambda = 1.097\times10^7\times(1/9 - 1/16) = 5.33\times10^5\ \text{m}^{-1}$，$\lambda = 1875$ nm，在红外区。$n_1$ 越大，能级越密，谱线波长越长。
  - id: bohr-model
    chapter: 波粒二象性
    title: 玻尔模型
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 假如原子里的电子只能处在一些特定的能量上。它从高的能量跳到低的能量时，多出来的那部分能量到哪里去了？
          options:
            - text: 变成一个光子放出去
              correct: true
            - text: 消失了，原子的能量本来就可以变少
              why: 能量是守恒的，原子少掉的能量一定转成了别的形式
            - text: 交给原子核，让原子核转得更快
              why: 原子核几乎不参与这种跳变；实验看到的是原子放出特定波长的光，能量被光带走了
          explain: 多出的能量变成一个光子，光子能量正好等于两个能量之差。玻尔用这个想法解释了氢原子的线状光谱。
      - card:
          title: 玻尔的前两条假设
          body: |
            1913 年玻尔提出：

            1. 电子只能在一些特定的轨道上运动，在这些轨道上不辐射，原子处在能量确定的稳定状态，叫**定态（stationary state）**。定态的能量值叫**能级（energy level）**，能量最低的是**基态（ground state）**，其余是**激发态（excited state）**。
            2. 允许的轨道满足角动量 $L = mvr = n\hbar$，$n = 1, 2, 3, \dots$，其中 $\hbar = h/2\pi = 1.055\times10^{-34}$ J·s，读作“h 拔”，叫**约化普朗克常数（reduced Planck constant）**。
      - card:
          title: 第三条假设：跃迁
          body: |
            玻尔的第三条假设：电子从能级 $E_i$ 变到较低的能级 $E_f$ 时放出一个光子，光子的能量等于两个能级之差：

            $$hf = E_i - E_f$$

            吸收一个能量正好等于能级差的光子，电子就从低能级升到高能级。能级之间的这种变化叫**跃迁（transition）**。能级是一个个分立的值，能级差也就只有特定的几种。
      - item:
          id: why-lines
          type: choice
          prompt: 玻尔模型用哪一点解释了“氢原子只发出几种特定波长的光”？
          options:
            - text: 能级只能取一些分立的值，光子能量等于两个能级之差
              correct: true
            - text: 电子在允许的轨道上运动时不辐射电磁波
              why: 这一点解释的是原子为什么稳定、不会塌缩；谱线分立要靠能级分立和 $hf = E_i - E_f$
            - text: 电子绕核运动的频率就是发出的光的频率
              why: 这是经典图像，按它频率会随轨道连续变化；玻尔模型里光的频率由两个能级的差决定，和绕核频率不同
          explain: 能级是一个个分立的值，两两之差也只有特定的几种，所以发出的光子能量和波长也只有特定的几种。
      - card:
          title: 例题：算出轨道半径和能级
          body: 电子质量 $m$、电荷 $-e$，绕带电 $+e$ 的原子核做圆周运动，库仑常数记作 $k$（和 $kT$ 里的玻尔兹曼常数不是同一个）。用玻尔的第二条假设求第 $n$ 个轨道的半径和能量。
          reveal:
            - title: 第 1 步：库仑力提供向心力
              body: $\dfrac{ke^2}{r^2} = \dfrac{mv^2}{r}$，即 $mv^2 = \dfrac{ke^2}{r}$。
            - title: 第 2 步：代入角动量条件，消去 v
              body: |
                由 $mvr = n\hbar$ 得 $v = n\hbar/(mr)$，代入第 1 步：$\dfrac{n^2\hbar^2}{mr^2} = \dfrac{ke^2}{r}$，

                $$r_n = n^2\frac{\hbar^2}{mke^2} = n^2a_0,\qquad a_0 = 0.0529\text{ nm}$$

                $a_0$ 叫**玻尔半径（Bohr radius）**。
            - title: 第 3 步：动能加势能得到能级
              body: |
                动能 $\tfrac12mv^2 = \dfrac{ke^2}{2r}$，电势能 $-\dfrac{ke^2}{r}$，总能量 $E = -\dfrac{ke^2}{2r}$。代入 $r_n$：

                $$E_n = -\frac{13.6\text{ eV}}{n^2}$$

                能量是负的，表示电子被束缚着；$n \to \infty$ 时 $E \to 0$，电子刚好挣脱。
      - item:
          id: bohr-r3
          type: number
          prompt: 按玻尔模型，氢原子 $n = 3$ 轨道的半径是多少纳米？玻尔半径取 0.0529 nm。
          answer: 0.476
          tolerance: 0.002
          unit: nm
          hint: 半径和 $n$ 的几次方成正比？
          explain: $r_3 = 3^2\times0.0529 = 0.476$ nm。半径按 $n^2$ 增大，所以激发态的原子比基态大得多。
      - item:
          id: h-beta-energy
          type: number
          prompt: 氢原子从 $n = 4$ 跃迁到 $n = 2$，放出的光子波长是多少纳米？用 $E_n = -13.6\text{ eV}/n^2$，$hc = 1240\ \text{eV·nm}$。
          answer: 486.3
          tolerance: 0.5
          unit: nm
          hint: 两个能级各是多少电子伏特？它们的差就是光子的能量。
          explain: $E_4 = -0.85$ eV，$E_2 = -3.40$ eV，光子能量 $13.6\times(1/4 - 1/16) = 2.55$ eV，$\lambda = 1240/2.55 = 486$ nm，是青色的 H$\beta$ 线，和里德伯公式算出的一致。
      - item:
          id: ionize-n2
          type: number
          prompt: 一个氢原子处在 $n = 2$ 的激发态。至少要给它多少电子伏特的能量，才能让电子完全脱离原子？用 $E_n = -13.6\text{ eV}/n^2$。
          answer: 3.4
          tolerance: 0.01
          unit: eV
          hint: 电子刚好脱离原子时，能量是多少？
          explain: 电子脱离原子对应 $n \to \infty$、$E = 0$。从 $E_2 = -13.6/4 = -3.40$ eV 升到 0，要 3.40 eV。从基态出发要 13.6 eV，这叫氢的电离能。
      - item:
          id: line-count-n3
          type: number
          prompt: 一大群氢原子都被激发到 $n = 3$，然后各自向下跃迁回基态（可以一步跳下，也可以分几步）。最多能看到几条不同波长的谱线？
          answer: 3
          hint: 把 $n = 3, 2, 1$ 三个能级两两配对，有几种跳法？
          explain: 可能的跃迁是 3→2、3→1、2→1，三种能级差各不相同，所以有 3 条谱线。一般从第 $n$ 能级往下最多有 $n(n-1)/2$ 条。
      - card:
          title: 玻尔模型的局限
          body: |
            玻尔模型准确算出了氢的能级，却算不了氦这样有两个以上电子的原子，也说不出各条谱线为什么有的强、有的弱。它说基态电子的角动量是 $\hbar$，后来的量子力学给出的是 0。它把经典的轨道和人为加上的量子化条件拼在一起，后来被量子力学取代：能级公式保留下来，确定的轨道这个概念被放弃了。
      - item:
          id: bohr-limit
          type: choice
          prompt: 下面哪件事是玻尔模型做到了的？
          options:
            - text: 算出氢原子各条谱线的波长
              correct: true
            - text: 算出氦原子的能级
              why: 氦有两个电子，电子之间还有相互作用，玻尔模型处理不了
            - text: 说明各条谱线的强弱
              why: 谱线强弱取决于跃迁发生的概率，玻尔模型只给出能级，给不出概率
          explain: 玻尔模型的能级 $-13.6\text{ eV}/n^2$ 和氢的谱线对得上，这是它成功的地方；多电子原子和谱线强度要等到量子力学才能解决。
  - id: matter-waves
    chapter: 波粒二象性
    title: 物质波和波粒二象性
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个 0.145 kg 的棒球以 40 m/s 飞行。假如它也像光一样有波长，按光子 $\lambda = h/p$ 的规律算，这个波长大约多大？
          options:
            - text: 约 $10^{-34}$ m，比原子核还小得多
              correct: true
            - text: 约 $10^{-10}$ m，和电子的波长差不多
              why: 波长和动量成反比；棒球的动量 $0.145\times40 = 5.8$ kg·m/s 比电子大二十多个数量级，波长相应小得多
            - text: 和棒球本身一样大，约 7 cm
              why: 波长由动量决定，和物体的大小无关；棒球的动量很大，波长极短
          explain: $\lambda = 6.626\times10^{-34}/5.8 \approx 1.1\times10^{-34}$ m。波长这么短，任何仪器都显不出它的波动性；只有电子这样质量极小的粒子，波长才大到能测出来。
      - card:
          title: 德布罗意的假设
          body: |
            1924 年德布罗意提出：既然光有波动性也有粒子性，电子这样的实物粒子也应该如此。动量为 $p$ 的粒子对应一列波，波长和频率是

            $$\lambda = \frac{h}{p},\qquad f = \frac{E}{h}$$

            这样的波叫**物质波（matter wave）**，$\lambda$ 叫**德布罗意波长（de Broglie wavelength）**。式子和光子的 $p = h/\lambda$ 是同一个关系，只是现在用在有质量的粒子上。
      - card:
          title: 例题：加速电子的波长
          body: 电子从静止开始，经过 50 V 的电压加速。求它的德布罗意波长（$m_e = 9.109\times10^{-31}$ kg，$e = 1.602\times10^{-19}$ C，$h = 6.626\times10^{-34}$ J·s）。
          reveal:
            - title: 第 1 步：求动能
              body: 经过电压 $U$，电场对电子做功 $eU$，动能 $K = eU = 1.602\times10^{-19}\times50 = 8.01\times10^{-18}$ J（就是 50 eV）。
            - title: 第 2 步：由动能求动量
              body: 速度远小于光速，$K = p^2/2m$，所以 $p = \sqrt{2mK} = \sqrt{2\times9.109\times10^{-31}\times8.01\times10^{-18}} = 3.82\times10^{-24}$ kg·m/s。
            - title: 第 3 步：求波长
              body: |
                $\lambda = h/p = 6.626\times10^{-34}/3.82\times10^{-24} = 1.73\times10^{-10}$ m $= 0.173$ nm。合起来是

                $$\lambda = \frac{h}{\sqrt{2m_eeU}} \approx \frac{1.226}{\sqrt{U}}\text{ nm}\quad(U\text{ 以伏特计})$$
      - item:
          id: electron-100v
          type: number
          prompt: 电子从静止经过 100 V 电压加速，德布罗意波长是多少纳米？$m_e = 9.109\times10^{-31}$ kg，$e = 1.602\times10^{-19}$ C，$h = 6.626\times10^{-34}$ J·s。
          answer: 0.1226
          tolerance: 0.0005
          unit: nm
          hint: 动能是多少焦耳？由动能怎样求动量？
          explain: $K = 1.602\times10^{-17}$ J，$p = \sqrt{2\times9.109\times10^{-31}\times1.602\times10^{-17}} = 5.40\times10^{-24}$ kg·m/s，$\lambda = h/p = 0.123$ nm。电压变成 2 倍，波长变成 $1/\sqrt2$ 倍：$0.173/\sqrt2 = 0.123$ nm。
      - item:
          id: electron-150v
          type: number
          prompt: 电子从静止经过 150 V 电压加速，德布罗意波长是多少纳米？可以用 $\lambda \approx 1.226/\sqrt{U}$ nm。
          answer: 0.1001
          tolerance: 0.0005
          unit: nm
          hint: 150 的平方根是多少？
          explain: $\lambda = 1.226/\sqrt{150} = 1.226/12.25 = 0.100$ nm，约 1 埃，和固体里原子的间距差不多。
      - card:
          title: 电子的衍射
          body: |
            0.1 nm 左右的波长和晶体里原子的间距差不多，排得整整齐齐的原子正好可以当光栅用。1927 年戴维孙和革末把 54 eV 的电子射到镍晶体上，在 50° 方向测到了电子特别多的衍射峰。镍表面原子行的间距 $d = 0.215$ nm，按光栅方程 $d\sin\theta = \lambda$，$\lambda = 0.215\times\sin50° = 0.165$ nm，和德布罗意公式算出的 0.167 nm 相符。
      - item:
          id: davisson-54
          type: number
          prompt: 戴维孙–革末实验用的是 54 eV 的电子。它的德布罗意波长是多少纳米？可以用 $\lambda \approx 1.226/\sqrt{U}$ nm。
          answer: 0.1669
          tolerance: 0.0005
          unit: nm
          hint: 54 eV 的电子相当于经过多少伏特加速？
          explain: 54 eV 就是经过 54 V 加速，$\lambda = 1.226/\sqrt{54} = 0.167$ nm。衍射峰给出 0.165 nm，相差约 1%。
      - item:
          id: why-crystal
          type: choice
          prompt: 验证电子的波动性时，为什么要用晶体，而不是像光学实验那样用刻出来的光栅？
          options:
            - text: 电子波长约 0.1 nm，和原子间距相当
              correct: true
            - text: 电子只能被金属表面反射回来，而普通光栅是玻璃做的
              why: 用什么材料不是关键；缝距比波长大几千倍时，衍射角太小，根本分不开条纹
            - text: 晶体能让电子加速，光栅不能
              why: 电子是先用电压加速好再射到晶体上的，晶体只起光栅的作用
          explain: 衍射要求缝距和波长差不多。普通光栅的缝距约 1 μm，是电子波长的一万倍，衍射角小到测不出；晶体里原子的间距约 0.1–0.3 nm，正合适。
      - card:
          title: 一个一个通过双缝的电子
          body: |
            把电子束调得极弱，让电子一个一个地通过双缝。每个电子到达屏时只打出一个点，像粒子；点越积越多，却排成了双缝干涉的条纹，像波。条纹描述的是电子落在各处的可能性有多大。

            如果在缝边放探测器，测出每个电子走的是哪条缝，干涉条纹就消失，只剩两条亮带。
      - card:
          title: 波粒二象性
          body: |
            光和实物粒子都既有波动性又有粒子性，这叫**波粒二象性（wave–particle duality）**。一次实验显出哪一面，取决于测的是什么：问“落在哪里”时看到一个个点，问“各处落多少”时看到波的干涉。两面不会在同一次测量里同时完整地显出来，玻尔把这叫互补原理。这里说的“波”不是电子本身被拉散开，它描述的是电子出现在各处的可能性。
      - item:
          id: which-slit
          type: choice
          prompt: 在双缝实验中测出每个电子走的是哪条缝，屏上最后的图样会怎样？
          options:
            - text: 干涉条纹消失，只剩两条亮带
              correct: true
            - text: 条纹照样出现，只是暗一些
              why: 测出路径就破坏了两条路径的叠加，干涉条纹整个消失，而不只是变暗
            - text: 屏上什么也没有，电子被探测器挡住了
              why: 理想的探测只记下电子经过，电子照样到达屏，只是不再干涉
          explain: 干涉要求两条路径的波叠加。知道了每个电子走哪条缝，就只剩一条路径的波，图样变成两条单缝的亮带相加。
      - item:
          id: neutron-wavelength
          type: number
          prompt: 核反应堆里出来的“热中子”速度约 2200 m/s，中子质量 $1.675\times10^{-27}$ kg。它的德布罗意波长是多少纳米？$h = 6.626\times10^{-34}$ J·s。
          answer: 0.1798
          tolerance: 0.001
          unit: nm
          hint: 动量是质量乘速度。
          explain: $p = 1.675\times10^{-27}\times2200 = 3.685\times10^{-24}$ kg·m/s，$\lambda = h/p = 0.180$ nm，和原子间距相当，所以中子也能在晶体上衍射，常用来研究材料的结构。
      - item:
          id: electron-microscope
          type: choice
          prompt: 电子显微镜能看清光学显微镜看不清的细节，主要是因为什么？
          options:
            - text: 电子的波长比可见光短得多，衍射模糊小
              correct: true
            - text: 电子比光子跑得快，同样时间里能拍下更多细节
              why: 分辨本领取决于波长，和成像速度无关；而且电子比光慢
            - text: 电子带电，能被原子吸引过去
              why: 电子带电只是让它可以用电磁透镜来聚焦；看清细节靠的是短波长
          explain: 按瑞利判据，能分辨的最小角度约 $1.22\lambda/D$，和波长成正比。几十千伏加速的电子波长只有几皮米，比 500 nm 的可见光短十万倍。
  - id: wavefunction
    chapter: 薛定谔方程
    title: 波函数和概率
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 电子一个一个通过双缝，屏上某处的亮度和落到那里的电子数成正比。对一列波来说，亮度由它的什么量决定？
          options:
            - text: 振幅的平方
              correct: true
            - text: 振幅本身
              why: 振幅可以是负的，亮度不会是负的；波的强度和振幅的平方成正比
            - text: 波长
              why: 同一列波在屏上各处波长相同，亮暗不同是因为各处叠加后的振幅不同
          explain: 波的强度和振幅的平方成正比。量子力学沿用这个想法：描述电子的波，振幅的平方告诉你电子落在各处的可能性。
      - card:
          title: 波函数
          body: |
            量子力学里，一个粒子的状态由一个随位置和时间变化的函数 $\Psi(x, t)$ 描述，叫**波函数（wave function）**。它一般取复数值，就像用复数写振动那样。

            把复数 $a + bi$ 里的 $i$ 换成 $-i$，得到 $a - bi$，叫它的**复共轭（complex conjugate）**，记作 $\Psi^*$。一个复数乘它的复共轭：$(a + bi)(a - bi) = a^2 + b^2$，是它的模的平方 $|\Psi|^2$，总是不小于 0 的实数。
      - card:
          title: 玻恩的概率解释
          body: |
            1926 年玻恩提出：$|\Psi(x, t)|^2 = \Psi^*\Psi$ 是在 $t$ 时刻、在 $x$ 处找到粒子的**概率密度（probability density）**：在 $x$ 附近宽 $dx$ 的小区间里找到粒子的概率是 $|\Psi|^2dx$，在 $a$ 到 $b$ 之间找到它的概率是

            $$P(a \le x \le b) = \int_a^b |\Psi|^2dx$$

            一维的 $|\Psi|^2$ 乘上一段距离才是概率，所以它的单位是距离单位的倒数，比如 $\text{nm}^{-1}$。波函数本身测不到，测到的是由它算出的概率。
      - item:
          id: small-interval
          type: number
          prompt: 某时刻电子的波函数在 $x_0$ 处的值是 $\Psi(x_0) = 0.3 + 0.4i$（单位 $\text{nm}^{-1/2}$）。在 $x_0$ 附近宽 0.01 nm 的小区间里找到电子的概率是多少？
          answer: 0.0025
          hint: 先算 $|\Psi|^2$，它的单位是什么？
          explain: $|\Psi|^2 = 0.3^2 + 0.4^2 = 0.25\ \text{nm}^{-1}$，概率 $\approx 0.25\times0.01 = 0.0025$。注意不是直接用 $\Psi$ 乘区间宽度：$\Psi$ 是复数，概率要用它的模的平方。
      - item:
          id: overall-phase
          type: choice
          prompt: 把一个波函数整个乘上 $-1$，变成 $-\Psi$。在各处找到粒子的概率会怎样？
          options:
            - text: 不变
              correct: true
            - text: 变成负的
              why: 概率密度是 $|-\Psi|^2 = |\Psi|^2$，平方以后负号没有了
            - text: 粒子出现的位置变到原来位置的对面
              why: 乘一个常数不改变各处 $|\Psi|^2$ 的大小，也就不改变粒子可能出现的位置
          explain: $|-\Psi|^2 = (-1)^2|\Psi|^2 = |\Psi|^2$。乘上任何模为 1 的复数（比如 $i$）也一样，所以整体乘一个这样的常数，物理上是同一个状态。
      - card:
          title: 归一化
          body: |
            粒子总在某处，在整个空间找到它的概率是 1：

            $$\int_{-\infty}^{\infty}|\Psi|^2dx = 1$$

            波函数满足这个条件叫**归一化（normalization）**。写出的波函数如果还差一个常数，就靠它定出来。比如粒子只在 $0 \le x \le L$ 内，$\psi = A\sin(\pi x/L)$，外面为 0。因为 $\int_0^L\sin^2(\pi x/L)dx = L/2$，所以 $A^2L/2 = 1$，$A = \sqrt{2/L}$。
      - item:
          id: normalize-linear
          type: number
          prompt: 一个粒子的波函数在 $0 \le x \le 1$ nm 内是 $\psi = Ax$，其余地方为 0。归一化以后，$A^2$ 是多少（单位 $\text{nm}^{-3}$）？
          answer: 3
          hint: $\int_0^1 x^2dx$ 是多少？它乘 $A^2$ 应该等于几？
          explain: $\int_0^1A^2x^2dx = A^2/3 = 1$，所以 $A^2 = 3\ \text{nm}^{-3}$，$A = \sqrt3 \approx 1.73\ \text{nm}^{-3/2}$。
      - card:
          title: 例题：一段区间里的概率
          body: 粒子的波函数在 $0 \le x \le 1$ nm 内是 $\psi = \sqrt2\sin(\pi x)$（$x$ 以 nm 计），其余地方为 0。求在 $0 \le x \le 0.25$ nm 内找到它的概率。
          reveal:
            - title: 第 1 步：写出要算的积分
              body: $P = \int_0^{0.25}|\psi|^2dx = \int_0^{0.25}2\sin^2(\pi x)dx$。
            - title: 第 2 步：用倍角公式去掉平方
              body: $2\sin^2\theta = 1 - \cos2\theta$，所以被积函数是 $1 - \cos(2\pi x)$，原函数是 $x - \dfrac{\sin(2\pi x)}{2\pi}$。
            - title: 第 3 步：代入上下限
              body: $P = 0.25 - \dfrac{\sin(\pi/2)}{2\pi} - 0 = 0.25 - 0.159 = 0.091$。宽度占全区间的四分之一，概率却只有约 9%，因为 $|\psi|^2$ 在边上小、在中间大。
      - item:
          id: middle-third
          type: number
          prompt: 粒子的波函数在 $0 \le x \le 1$ nm 内是 $\psi = \sqrt2\sin(\pi x)$（$x$ 以 nm 计），其余地方为 0。在中间三分之一（$1/3 \le x \le 2/3$ nm）找到它的概率是多少？
          answer: 0.609
          tolerance: 0.002
          hint: 被积函数可以写成 $1 - \cos(2\pi x)$，原函数是什么？
          explain: $P = \left[x - \dfrac{\sin2\pi x}{2\pi}\right]_{1/3}^{2/3} = \dfrac13 + \dfrac{\sin(2\pi/3) - \sin(4\pi/3)}{2\pi} = 0.333 + \dfrac{0.866 + 0.866}{6.283} = 0.609$。中间三分之一占了六成的概率。
      - card:
          title: 什么样的函数能当波函数
          body: |
            按概率解释，波函数要满足几个条件：在每一点只有一个值（概率不能有两个）；处处连续；能归一化，也就是 $|\Psi|^2$ 在整个空间的积分是有限的，离得很远时 $|\Psi|^2$ 要趋于 0。另外，势能不是无穷大的地方，$\Psi$ 的导数也要连续。
      - item:
          id: not-a-wavefunction
          type: choice
          prompt: 在整条 $x$ 轴上，下面哪个函数不能当作一个粒子的波函数？
          options:
            - text: $e^{x}$
              correct: true
            - text: $e^{-x^2}$
              why: 它处处连续，离得远时迅速趋于 0，积分有限，乘上适当的常数就能归一化
            - text: $\dfrac{1}{1 + x^2}$
              why: 它的平方 $1/(1 + x^2)^2$ 在整条轴上的积分等于 $\pi/2$，是有限的，可以归一化
          explain: $e^x$ 在 $x \to \infty$ 时越来越大，$|\psi|^2$ 的积分发散，无法归一化，也就不能表示“粒子总在某处”。
      - item:
          id: normalize-exponential
          type: number
          prompt: 一个粒子的波函数是 $\psi = Ae^{-|x|/a}$，$a = 0.5$ nm，$x$ 取整条轴。归一化以后 $A^2$ 是多少（单位 $\text{nm}^{-1}$）？
          answer: 2
          hint: $|\psi|^2 = A^2e^{-2|x|/a}$。先算 $x \ge 0$ 一半的积分，再乘 2。
          explain: $\int_0^\infty e^{-2x/a}dx = a/2$，两边合起来是 $a$，所以 $A^2a = 1$，$A^2 = 1/a = 2\ \text{nm}^{-1}$。
  - id: uncertainty
    chapter: 薛定谔方程
    title: 不确定关系
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 想把光子的位置确定得更准，于是让光通过一条越来越窄的单缝。屏上的中央亮纹会怎样？
          options:
            - text: 越来越宽
              correct: true
            - text: 越来越窄，因为光子被限制在更小的范围里
              why: 缝越窄，衍射越明显；单缝的第一暗纹满足 $\sin\theta = \lambda/a$，$a$ 变小，角度变大
            - text: 宽度不变，只是变暗
              why: 变暗是对的，但中央亮纹的角宽度由 $\lambda/a$ 决定，缝变窄它就变宽
          explain: 缝越窄，过缝时位置越确定，光子往旁边偏的角度却越分散。位置确定得越准，横向动量就越不确定。
      - card:
          title: 从单缝衍射看
          body: |
            动量为 $p$ 的电子沿 $y$ 方向射向宽 $a$ 的单缝。过缝时它的 $x$ 坐标被限制在宽 $a$ 的范围里，位置的不确定量约为 $\Delta x \approx a$。

            过缝后大部分电子落在中央亮纹里，第一暗纹满足 $\sin\theta = \lambda/a$，所以 $x$ 方向的动量分散在大约 $p\sin\theta = p\lambda/a = h/a$ 的范围里。两者相乘：$\Delta x\,\Delta p_x \sim h$，和缝宽无关。
      - item:
          id: slit-halve
          type: number
          prompt: 电子通过宽 $a$ 的单缝，过缝后 $x$ 方向的动量大约分散在 $h/a$ 的范围里。把缝宽减到一半，这个动量范围变成原来的几倍？
          answer: 2
          hint: 动量范围和缝宽是正比还是反比？
          explain: 动量范围约 $h/a$，$a$ 减半，它变成 2 倍。位置限制得越紧，动量越分散，两者的乘积保持在 $h$ 左右。
      - card:
          title: 方差和标准差
          body: |
            对很多个处在同一状态的粒子测同一个量，结果有散有聚。各次结果减去平均值、平方后再按概率求平均，得到**方差（variance）**；它的平方根叫**标准差（standard deviation）**，记作 $\Delta$，表示结果离平均值的典型距离：

            $$(\Delta A)^2 = \langle A^2\rangle - \langle A\rangle^2$$

            尖括号表示平均值。所有结果都一样时 $\Delta A = 0$。
      - card:
          title: 不确定关系
          body: |
            对很多个处在同一状态的粒子分别测位置和动量，结果的标准差满足

            $$\Delta x\,\Delta p_x \ge \frac{\hbar}{2}$$

            这叫海森堡的**不确定关系（uncertainty principle）**。它和波包是同一件事：波包越短，包含的波数范围越宽。按标准差算，$\Delta x\,\Delta k \ge 1/2$，乘上 $p = \hbar k$ 就是上式。按“整个包络的宽度”粗估会得到 $2\pi$ 左右，那是 $\Delta$ 取法不同，不是矛盾。
      - item:
          id: electron-in-atom
          type: number
          prompt: 一个电子被限制在约 0.1 nm（原子大小）的范围内，取 $\Delta x = 0.1$ nm。它速度的不确定量至少是 $N\times10^5$ m/s，$N$ 是多少？$\hbar = 1.055\times10^{-34}$ J·s，$m_e = 9.109\times10^{-31}$ kg。
          answer: 5.79
          tolerance: 0.02
          hint: 先由 $\Delta x\,\Delta p \ge \hbar/2$ 求最小的 $\Delta p$，再除以质量。
          explain: $\Delta p \ge \hbar/(2\Delta x) = 1.055\times10^{-34}/(2\times10^{-10}) = 5.27\times10^{-25}$ kg·m/s，$\Delta v = \Delta p/m_e = 5.79\times10^5$ m/s。这和原子里电子的典型速度（约 $10^6$ m/s）同一量级，所以原子里谈不上电子的确定轨道。
      - item:
          id: dust-grain
          type: number
          prompt: 一粒 1 μg（$10^{-9}$ kg）的尘埃，位置确定到 1 μm。它速度的不确定量至少是 $N\times10^{-20}$ m/s，$N$ 是多少？$\hbar = 1.055\times10^{-34}$ J·s。
          answer: 5.27
          tolerance: 0.02
          hint: 和电子的算法一样，换上尘埃的质量和 $\Delta x$。
          explain: $\Delta v \ge \hbar/(2m\Delta x) = 1.055\times10^{-34}/(2\times10^{-9}\times10^{-6}) = 5.27\times10^{-20}$ m/s，以这个速度走过一个原子的大小（0.1 nm）要花约 60 年。宏观物体的不确定关系小到可以忽略。
      - item:
          id: uncertainty-meaning
          type: choice
          prompt: 关于不确定关系，下面哪个说法对？
          options:
            - text: 粒子本身没有同时确定的位置和动量，和仪器无关
              correct: true
            - text: 它说的是测量仪器的误差，仪器做得足够好就能突破
              why: $\hbar/2$ 这个下限来自波函数本身：一个波包不可能既很短又只含一个波数，和仪器好坏无关
            - text: 它只对电子成立，对质子、中子不成立
              why: 它对一切粒子都成立；质子、中子的质量大，同样的 $\Delta x$ 下 $\Delta v$ 小一些而已
          explain: 位置和动量由同一个波函数决定：位置分布越窄，组成它的波数（动量）范围就越宽。这是波的性质，不是测量技术的问题。
      - card:
          title: 例题：用不确定关系估算原子的大小
          body: 氢原子里电子离核约 $r$。用不确定关系估算 $r$ 和基态能量（库仑常数记作 $k$）。
          reveal:
            - title: 第 1 步：把能量写成 r 的函数
              body: 电子被限制在约 $r$ 的范围内，动量至少约 $\hbar/r$，动能约 $\dfrac{\hbar^2}{2mr^2}$；电势能 $-\dfrac{ke^2}{r}$。所以 $E(r) \approx \dfrac{\hbar^2}{2mr^2} - \dfrac{ke^2}{r}$。
            - title: 第 2 步：找让能量最低的 r
              body: $r$ 小了动能项大，$r$ 大了势能项不够负。求导令其为 0：$-\dfrac{\hbar^2}{mr^3} + \dfrac{ke^2}{r^2} = 0$，得 $r = \dfrac{\hbar^2}{mke^2} = 0.0529$ nm，正好是玻尔半径。
            - title: 第 3 步：代回求能量
              body: $E = -\dfrac{ke^2}{2r} = -13.6$ eV。估算的结果和氢原子的基态能量一致（数值吻合有一定巧合，因为“动量约 $\hbar/r$”只是数量级的估计）。不确定关系说明电子不会落进核里：挤得越近，动能涨得越快。
      - item:
          id: squeeze-kinetic
          type: number
          prompt: 用“动能约 $\hbar^2/(2mr^2)$”来估算。把电子被限制的范围 $r$ 缩小到原来的一半，动能的估计值变成原来的几倍？
          answer: 4
          hint: 动能和 $r$ 的几次方成反比？
          explain: 动能 $\propto 1/r^2$，$r$ 变成一半，动能变成 4 倍。而电势能 $\propto -1/r$ 只变成 2 倍，所以挤得太近总能量反而升高。
      - card:
          title: 能量和时间
          body: |
            能量和时间之间也有类似的关系：

            $$\Delta E\,\Delta t \ge \frac{\hbar}{2}$$

            一个激发态平均只存在一段时间 $\tau$（叫寿命）就跃迁下去，它的能量就不是完全确定的，而有大约 $\hbar/(2\tau)$ 的宽度。所以每条谱线都有一个最小的宽度，寿命越短的能级，发出的谱线越宽。
      - item:
          id: level-width
          type: number
          prompt: 原子的一个激发态寿命约 10 ns。按 $\Delta E \ge \hbar/(2\Delta t)$，它的能量宽度至少是 $N\times10^{-8}$ eV，$N$ 是多少？$\hbar = 1.055\times10^{-34}$ J·s，$1\text{ eV} = 1.602\times10^{-19}$ J。
          answer: 3.29
          tolerance: 0.02
          hint: 先算出以焦耳为单位的 $\Delta E$，再换成电子伏特。
          explain: $\Delta E \ge 1.055\times10^{-34}/(2\times10^{-8}) = 5.27\times10^{-27}$ J $= 3.29\times10^{-8}$ eV。和几个电子伏特的跃迁能量相比只有一亿分之几，所以谱线很细，但不是无限细。
  - id: schrodinger-equation
    chapter: 薛定谔方程
    title: 薛定谔方程
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个自由运动的电子，动量 $p = \hbar k$（$k$ 是波数），能量 $E = \hbar\omega$（$\omega$ 是角频率），又有 $E = p^2/2m$。角频率 $\omega$ 和波数 $k$ 是什么关系？
          options:
            - text: $\omega$ 和 $k^2$ 成正比
              correct: true
            - text: $\omega$ 和 $k$ 成正比，像光一样
              why: 光子是 $E = pc$，所以 $\omega = ck$；电子的能量是 $p^2/2m$，和动量的平方成正比
            - text: $\omega$ 是常数，和 $k$ 无关
              why: 能量随动量增大，$\omega = E/\hbar$ 也随 $k$ 增大
          explain: $\hbar\omega = \hbar^2k^2/2m$，所以 $\omega = \hbar k^2/2m$。$\omega$ 随 $k$ 变化的这个关系就是电子的色散关系；$\omega$ 不和 $k$ 成正比，说明电子的物质波在真空里也有色散。
      - card:
          title: 自由粒子的平面波
          body: |
            沿 $x$ 方向自由运动、动量确定的粒子，用一列复数形式的简谐波描述，叫**平面波（plane wave）**：

            $$\Psi = Ae^{i(kx - \omega t)},\qquad p = \hbar k,\quad E = \hbar\omega$$

            对 $x$ 求一次导数，前面多乘一个 $ik$；对 $t$ 求一次导数，多乘一个 $-i\omega$。所以

            $$-i\hbar\frac{\partial\Psi}{\partial x} = p\Psi,\qquad i\hbar\frac{\partial\Psi}{\partial t} = E\Psi$$
      - card:
          title: 薛定谔方程
          body: |
            把 $E = \dfrac{p^2}{2m} + V$ 换成对 $\Psi$ 的求导，薛定谔在 1926 年写出

            $$i\hbar\frac{\partial\Psi}{\partial t} = -\frac{\hbar^2}{2m}\frac{\partial^2\Psi}{\partial x^2} + V(x)\Psi$$

            这就是**薛定谔方程（Schrödinger equation）**，一个偏微分方程。已知势能 $V(x)$ 和开始时的波函数，就能算出以后任何时刻的波函数。它不是从旧的定律推出来的，而是一个基本假设，它的预言一再被实验证实。方程是线性的：两个解相加还是解，这就是量子力学里的叠加原理。
      - item:
          id: packet-speed
          type: choice
          prompt: 一个自由电子的波包，波数集中在 $k$ 附近，色散关系是 $\omega = \hbar k^2/2m$。这个波包以什么速度移动？
          options:
            - text: $\hbar k/m$，等于经典速度 $p/m$
              correct: true
            - text: $\hbar k/2m$，经典速度的一半
              why: 这是相速度 $\omega/k$，是单个波峰移动的速度；波包整体按群速度 $d\omega/dk$ 移动
            - text: 光速，因为它是一列波
              why: 只有光子的色散关系是 $\omega = ck$；电子的波包速度由 $d\omega/dk$ 决定
          explain: 群速度 $d\omega/dk = \hbar k/m = p/m$，正好是经典粒子的速度。粒子“在哪里”由波包的位置决定，所以波包的运动和经典力学对得上。
      - item:
          id: packet-velocity
          type: number
          prompt: 一个自由电子的波包，波数集中在 $k = 1.0\times10^{10}\ \text{m}^{-1}$ 附近。它移动的速度是 $N\times10^6$ m/s，$N$ 是多少？$\hbar = 1.055\times10^{-34}$ J·s，$m_e = 9.109\times10^{-31}$ kg。
          answer: 1.158
          tolerance: 0.005
          hint: 波包按群速度移动，群速度用 $\hbar$、$k$、$m$ 怎样表示？
          explain: $v = \hbar k/m = 1.055\times10^{-34}\times10^{10}/9.109\times10^{-31} = 1.16\times10^6$ m/s。这时 $\lambda = 2\pi/k = 0.63$ nm，正是几伏特加速的电子。
      - card:
          title: 算符
          body: |
            把一个函数变成另一个函数的规则叫**算符（operator）**，写成字母上加一个尖帽。“对 $x$ 求导”就是一个算符。从平面波看出，动量对应

            $$\hat p = -i\hbar\frac{\partial}{\partial x}$$

            能量对应**哈密顿算符（Hamiltonian）**：

            $$\hat H = -\frac{\hbar^2}{2m}\frac{\partial^2}{\partial x^2} + V(x)$$

            薛定谔方程于是写成 $i\hbar\,\partial\Psi/\partial t = \hat H\Psi$。
      - item:
          id: momentum-operator
          type: choice
          prompt: 用动量算符 $\hat p = -i\hbar\,\dfrac{d}{dx}$ 作用在 $\psi = e^{ikx}$ 上，结果是什么？
          options:
            - text: $\hbar k\,e^{ikx}$，还是原来的函数乘一个数
              correct: true
            - text: $-i\hbar\,e^{ikx}$
              why: 求导时 $e^{ikx}$ 前面会多出 $ik$，乘上 $-i\hbar$ 后是 $-i\hbar\cdot ik = \hbar k$
            - text: $\hbar k\,x\,e^{ikx}$
              why: 对 $e^{ikx}$ 求导得到 $ik\,e^{ikx}$，不会多出一个 $x$
          explain: $\dfrac{d}{dx}e^{ikx} = ik\,e^{ikx}$，乘 $-i\hbar$ 得 $\hbar k\,e^{ikx}$。函数没变，只乘了一个数 $\hbar k$，这个数就是它的动量。
      - card:
          title: 定态和定态薛定谔方程
          body: |
            势能不随时间变时，试着把波函数写成空间部分和时间部分的乘积 $\Psi = \psi(x)e^{-iEt/\hbar}$。代入薛定谔方程，左边得到 $E\psi e^{-iEt/\hbar}$，消去 $e^{-iEt/\hbar}$：

            $$-\frac{\hbar^2}{2m}\psi'' + V\psi = E\psi,\quad\text{即}\quad \hat H\psi = E\psi$$

            这叫**定态薛定谔方程（time-independent Schrödinger equation）**。它的解是能量确定的定态，就是玻尔说的定态：$|e^{-iEt/\hbar}| = 1$，$|\Psi|^2 = |\psi|^2$ 不随时间变。
      - item:
          id: stationary-density
          type: choice
          prompt: 一个粒子处在能量为 $E$ 的定态 $\Psi = \psi(x)e^{-iEt/\hbar}$。它的概率密度 $|\Psi|^2$ 随时间怎样变化？
          options:
            - text: 不随时间变化
              correct: true
            - text: 以角频率 $E/\hbar$ 振荡
              why: 振荡的是 $\Psi$ 的相位；$e^{-iEt/\hbar}$ 的模恒为 1，平方以后时间因子没有了
            - text: 随时间按指数衰减
              why: $e^{-iEt/\hbar}$ 的指数是虚数，它只转动、不衰减
          explain: $|\Psi|^2 = |\psi|^2|e^{-iEt/\hbar}|^2 = |\psi|^2$。概率分布不变，所以叫“定态”；一切可测的量在定态里都不随时间变。
      - card:
          title: 例题：两个定态叠加
          body: 粒子处在两个定态的叠加 $\Psi = \dfrac{1}{\sqrt2}\left(\psi_1e^{-iE_1t/\hbar} + \psi_2e^{-iE_2t/\hbar}\right)$，$\psi_1$、$\psi_2$ 都是实函数。它的概率密度随时间怎样变？
          reveal:
            - title: 第 1 步：写出模的平方
              body: $|\Psi|^2 = \Psi^*\Psi = \dfrac12\left[\psi_1^2 + \psi_2^2 + \psi_1\psi_2\left(e^{i(E_2 - E_1)t/\hbar} + e^{-i(E_2 - E_1)t/\hbar}\right)\right]$。
            - title: 第 2 步：用欧拉公式合并交叉项
              body: $e^{i\theta} + e^{-i\theta} = 2\cos\theta$，所以 $|\Psi|^2 = \dfrac12\left[\psi_1^2 + \psi_2^2 + 2\psi_1\psi_2\cos\dfrac{(E_2 - E_1)t}{\hbar}\right]$。
            - title: 第 3 步：读出振荡频率
              body: 概率分布以角频率 $(E_2 - E_1)/\hbar$ 来回晃动，频率 $f = (E_2 - E_1)/h$。这和两个频率叠加成拍是同一个道理，也正是原子在两个能级间跃迁时发出的光的频率。
      - item:
          id: superposition-frequency
          type: number
          prompt: 一个电子处在两个定态的叠加，两个能级相差 1.13 eV。它的概率分布来回晃动的频率是 $N\times10^{14}$ Hz，$N$ 是多少？$h = 6.626\times10^{-34}$ J·s，$1\text{ eV} = 1.602\times10^{-19}$ J。
          answer: 2.73
          tolerance: 0.01
          hint: 频率等于能级差除以哪个常数？
          explain: $f = \Delta E/h = 1.13\times1.602\times10^{-19}/6.626\times10^{-34} = 2.73\times10^{14}$ Hz，在近红外区。电子在这两个能级间跃迁时发出的光就是这个频率。
      - item:
          id: linear-superposition
          type: choice
          prompt: $\Psi_1$ 和 $\Psi_2$ 都是同一个薛定谔方程的解。下面哪个不一定是这个方程的解？
          options:
            - text: $\Psi_1\Psi_2$
              correct: true
            - text: $\Psi_1 + \Psi_2$
              why: 方程是线性的，两个解相加，左右两边各自相加，仍然相等
            - text: $3\Psi_1 - 2i\Psi_2$
              why: 线性方程的解乘上任意常数（包括复数）再相加，仍然是解
          explain: 薛定谔方程里 $\Psi$ 和它的导数都只以一次方出现，所以解的线性组合仍是解。两个解相乘，求二阶导数时会多出 $2\Psi_1'\Psi_2'$ 这样的交叉项，一般不再满足方程。
  - id: infinite-well
    chapter: 一维势阱与隧穿
    title: 无限深势阱
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 吉他弦两端固定，只能以一些特定的频率振动。把一个电子关在两堵推不动、穿不过的墙之间，它的能量会怎样？
          options:
            - text: 只能取一些分立的值
              correct: true
            - text: 可以取任意值，就像在盒子里滚动的小球
              why: 电子在墙之间的波必须在两墙处为零，像两端固定的弦，只有特定的波长放得下
            - text: 只能是 0，因为它被关住不能动
              why: 能量为 0 的解处处为零，表示根本没有粒子；被关住的电子最低能量也大于 0
          explain: 电子的波在两墙之间形成驻波，只有半波长的整数倍正好等于墙距的波才行，能量随之只能取分立的值。这一课把这些能量算出来。
      - card:
          title: 势阱和边界条件
          body: |
            粒子所处的势能在一段区域里低、两边高，它就被困在这段区域里，这样的势能分布叫**势阱（potential well）**。最简单的一种：$0 < x < L$ 内 $V = 0$，两边 $V = \infty$。粒子不可能出现在势能无穷大的地方，所以墙外 $\psi = 0$；波函数要连续，所以

            $$\psi(0) = 0,\qquad \psi(L) = 0$$

            阱内定态薛定谔方程是 $-\dfrac{\hbar^2}{2m}\psi'' = E\psi$，即 $\psi'' = -k^2\psi$，$k = \sqrt{2mE}/\hbar$。这是二阶常系数线性方程，通解 $\psi = A\sin kx + B\cos kx$。
      - card:
          title: 能级和波函数
          body: |
            $\psi(0) = 0$ 要求 $B = 0$；$\psi(L) = A\sin kL = 0$ 要求 $kL = n\pi$。于是

            $$E_n = \frac{n^2\pi^2\hbar^2}{2mL^2} = \frac{n^2h^2}{8mL^2},\qquad \psi_n = \sqrt{\frac{2}{L}}\sin\frac{n\pi x}{L}$$

            $n = 1, 2, 3, \dots$ 这样标记状态的整数叫**量子数（quantum number）**。$n = 0$ 不行，那样 $\psi$ 处处为零。所以最低能量 $E_1$ 大于 0，这个不可能去掉的最低能量叫**零点能（zero-point energy）**。系数 $\sqrt{2/L}$ 来自归一化。
      - item:
          id: n-zero
          type: choice
          prompt: 为什么无限深势阱里不能取 $n = 0$，让粒子的能量为 0？
          options:
            - text: 那样 $\psi$ 处处为零，表示没有粒子
              correct: true
            - text: $n = 0$ 时能量为负，比阱底还低
              why: $E_n \propto n^2$，$n = 0$ 时能量是 0，不是负的；问题出在波函数
            - text: 量子数按规定从 1 开始数，0 只是不用而已
              why: 这不是规定的问题：把 $k = 0$ 代回 $\psi = A\sin kx$，得到的就是处处为零的函数
          explain: $k = 0$ 时 $\psi = A\sin0 = 0$，到处找不到粒子，不能归一化。能量最低的真实状态是 $n = 1$，它的能量 $E_1 > 0$。不确定关系也说明了这一点：粒子被限制在宽 $L$ 的范围里，动量就不可能是零。
      - card:
          title: 例题：1 nm 势阱里的电子
          body: 电子在宽 $L = 1.00$ nm 的无限深势阱里。求基态能量（以 eV 计）。$h = 6.626\times10^{-34}$ J·s，$m_e = 9.109\times10^{-31}$ kg，$1\text{ eV} = 1.602\times10^{-19}$ J。
          reveal:
            - title: 第 1 步：代入能级公式
              body: $E_1 = \dfrac{h^2}{8m_eL^2} = \dfrac{(6.626\times10^{-34})^2}{8\times9.109\times10^{-31}\times(1.00\times10^{-9})^2}$。
            - title: 第 2 步：算出焦耳数
              body: 分子 $4.390\times10^{-67}$，分母 $7.287\times10^{-48}$，$E_1 = 6.025\times10^{-20}$ J。
            - title: 第 3 步：换成电子伏特
              body: $E_1 = 6.025\times10^{-20}/1.602\times10^{-19} = 0.376$ eV。其他能级是它的 $n^2$ 倍：$E_2 = 1.50$ eV，$E_3 = 3.38$ eV。
      - item:
          id: well-transition
          type: number
          prompt: 宽 1.00 nm 的无限深势阱里，电子的基态能量是 0.376 eV。电子从 $n = 2$ 跃迁到 $n = 1$，放出的光子波长是多少纳米？取 $hc = 1240\ \text{eV·nm}$。
          answer: 1099
          tolerance: 5
          unit: nm
          hint: $E_2$ 是 $E_1$ 的几倍？两者之差是多少？
          explain: $E_2 - E_1 = (4 - 1)\times0.376 = 1.128$ eV，$\lambda = 1240/1.128 \approx 1099$ nm，约 1.10 μm，在近红外。
      - item:
          id: narrow-well
          type: number
          prompt: 电子在宽 0.50 nm 的无限深势阱里。基态能量是多少电子伏特？（宽 1.00 nm 时是 0.376 eV）
          answer: 1.504
          tolerance: 0.005
          unit: eV
          hint: 能级和阱宽的几次方成反比？
          explain: $E_1 \propto 1/L^2$，宽度减半，能量变成 4 倍：$4\times0.376 = 1.50$ eV。阱越窄，能级越高、间隔越大。
      - card:
          title: 波函数的形状
          body: |
            $\psi_n$ 在阱里有 $n$ 个半波长：基态是半个正弦，中间最大；$\psi_2$ 是一个整波长，正中间为零。波函数在阱内为零的点叫节点，和驻波的波节一样；第 $n$ 个状态有 $n - 1$ 个节点，能量越高节点越多，这对一维的束缚态普遍成立。

            $|\psi_1|^2$ 在正中间最大，粒子最可能在中间被找到；$n$ 很大时 $|\psi_n|^2$ 起伏得很密，平均下来各处差不多，接近经典的小球在两墙之间来回跑、各处停留时间相等的结果。
      - item:
          id: well-nodes
          type: number
          prompt: 无限深势阱里第 4 个定态（$n = 4$）的波函数，在阱内部（不算两端的墙）有几个节点？
          answer: 3
          hint: $\psi_4$ 在阱里有几个半波长？相邻两个半波长之间是什么？
          explain: $\psi_4$ 有 4 个半波长，相邻的半波长之间各有一个零点，共 $4 - 1 = 3$ 个节点，在 $L/4$、$L/2$、$3L/4$。
      - item:
          id: n2-left-quarter
          type: number
          prompt: 电子处在无限深势阱的 $n = 2$ 态，$\psi_2 = \sqrt{2/L}\sin(2\pi x/L)$。在左边四分之一（$0 \le x \le L/4$）找到它的概率是多少？
          answer: 0.25
          tolerance: 0.001
          hint: $|\psi_2|^2$ 在 $0$ 到 $L/2$ 之间是一个完整的鼓包，左右对称吗？
          explain: $|\psi_2|^2$ 在 $0$ 到 $L/2$ 之间是一个关于 $L/4$ 对称的鼓包，占总概率的一半，左半边的鼓包又被 $L/4$ 平分，所以是 0.25。直接积分：$\int_0^{L/4}\frac{2}{L}\sin^2\frac{2\pi x}{L}dx = \left[\frac{x}{L} - \frac{\sin(4\pi x/L)}{4\pi}\right]_0^{L/4} = 0.25$。
      - item:
          id: quantum-dot
          type: choice
          prompt: 量子点是几纳米大小的晶体颗粒（如硒化镉），电子被困在里面，可以近似看成势阱。同一种材料做成的量子点，颗粒越小，发出的光的颜色往哪边变？
          options:
            - text: 往蓝光一边变（波长变短）
              correct: true
            - text: 往红光一边变（波长变长）
              why: 势阱越小，能级按 $1/L^2$ 升高，能级间隔变大，光子能量变大，波长变短
            - text: 颜色不变，只由材料决定
              why: 块状材料的颜色确实由材料决定；做到几纳米时，势阱的大小也影响能级，颜色随大小改变
          explain: 能级间隔和 $1/L^2$ 成正比，颗粒越小，跃迁放出的光子能量越大，颜色越偏蓝。量子点电视就是靠控制颗粒大小来得到不同颜色的。
  - id: finite-well-step
    chapter: 一维势阱与隧穿
    title: 有限深势阱和势阶
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 如果势阱的墙不是无限高，而是有限高 $V_0$，电子的能量 $E$ 低于 $V_0$。墙里面的波函数会怎样？
          options:
            - text: 渗进墙里一点，并且很快衰减
              correct: true
            - text: 在墙的位置立刻变成零
              why: 只有墙无限高时才这样；墙有限高时，波函数和它的导数在墙边都要连续，不会突然掉到零
            - text: 在墙里照样像正弦一样起伏
              why: 墙里 $E < V_0$，方程变成 $\psi'' = \kappa^2\psi$，解是指数而不是正弦
          explain: 在 $E < V_0$ 的地方，定态方程的解是按指数衰减的函数，所以波函数会渗进墙里一段，越往里越小。这一课算出它渗进去多深。
      - card:
          title: 墙里的指数衰减
          body: |
            在 $V = V_0 > E$ 的区域，定态方程是

            $$\psi'' = \kappa^2\psi,\qquad \kappa = \frac{\sqrt{2m(V_0 - E)}}{\hbar}$$

            $\kappa$ 在这里是衰减常数。通解是 $e^{\kappa x}$ 和 $e^{-\kappa x}$ 的组合。往墙里走时要用越来越小的那一个（另一个越来越大，不能归一化），所以 $\psi \propto e^{-\kappa x}$，$|\psi|^2$ 每走 $1/\kappa$ 就降到 $e^{-2}$。$1/\kappa$ 叫穿透深度，例如电子比墙顶低 4 eV 时 $\kappa = 10.25\ \text{nm}^{-1}$，穿透深度约 0.1 nm。在经典力学里，动能是负的地方粒子不可能去，这样的区域叫**经典禁区（classically forbidden region）**。量子力学里粒子能渗进经典禁区。
      - item:
          id: penetration-depth
          type: number
          prompt: 电子的能量比墙顶低 1.0 eV（$V_0 - E = 1.0$ eV）。穿透深度 $1/\kappa$ 是多少纳米？$\hbar = 1.055\times10^{-34}$ J·s，$m_e = 9.109\times10^{-31}$ kg，$1\text{ eV} = 1.602\times10^{-19}$ J。
          answer: 0.1952
          tolerance: 0.001
          unit: nm
          hint: 墙顶比电子的能量高多少焦耳？这个差越大，$\kappa$ 越大还是越小？
          explain: $\kappa = \sqrt{2\times9.109\times10^{-31}\times1.602\times10^{-19}}/1.055\times10^{-34} = 5.12\times10^9\ \text{m}^{-1}$，$1/\kappa = 0.195$ nm，约两个原子的大小。能量差越大，渗得越浅。
      - card:
          title: 有限深势阱的能级
          body: |
            阱里是正弦形的波，墙里是衰减的指数，在墙边两段的 $\psi$ 和 $\psi'$ 都要接上，只有某些能量办得到，所以能级仍然是分立的。和同样宽的无限深阱相比有两点不同：

            1. 波函数渗进墙里，相当于阱变宽了一点，所以每个能级都比无限深阱的低。
            2. 能量超过 $V_0$ 的粒子不再被困住，所以束缚态只有有限个；一维的阱再浅，也至少有一个。
      - item:
          id: finite-vs-infinite
          type: choice
          prompt: 宽度都是 1 nm 的两个势阱，一个无限深，一个深 2 eV。有限深阱的基态能量和无限深阱的（0.376 eV）相比怎样？
          options:
            - text: 低一些
              correct: true
            - text: 高一些，因为墙变矮以后电子更容易跑出去
              why: 能量高低看波长：波函数渗进墙里，阱里能放下的半波长变长，波长变长，能量就降低
            - text: 一样，因为阱宽相同
              why: 只有墙无限高时 $\psi$ 才在墙边为零；墙有限高时波函数渗出去，等效的宽度更大
          explain: 渗出的波函数让电子“感觉”到的阱更宽，$E \propto 1/L^2$，能级就低一些。墙越矮，渗得越多，降得越多。
      - card:
          title: 势阶上的反射
          body: |
            粒子从左边射来，在 $x = 0$ 处势能从 0 突然升到 $V_0$，这叫势阶。设 $E > V_0$，经典的粒子会全部越过去，只是变慢。量子力学里，两边的波数分别是 $k_1 = \sqrt{2mE}/\hbar$、$k_2 = \sqrt{2m(E - V_0)}/\hbar$，在 $x = 0$ 处接上 $\psi$ 和 $\psi'$，得到反射的概率和透射的概率：

            $$R = \left(\frac{k_1 - k_2}{k_1 + k_2}\right)^2,\qquad T = 1 - R$$

            和光从空气射到玻璃上有一部分被反射是同一个道理。
      - card:
          title: 例题：一次撞上势阶
          body: 电子的能量 $E = 8$ eV，射向高 $V_0 = 6$ eV 的势阶。求它被反射回来的概率。
          reveal:
            - title: 第 1 步：比较两边的波数
              body: $k \propto \sqrt{\text{动能}}$。左边动能 8 eV，右边 $8 - 6 = 2$ eV，所以 $k_2/k_1 = \sqrt{2/8} = 1/2$。
            - title: 第 2 步：代入反射公式
              body: $R = \left(\dfrac{1 - 1/2}{1 + 1/2}\right)^2 = \left(\dfrac{1}{3}\right)^2 = \dfrac19 \approx 0.111$。
            - title: 第 3 步：说出结果
              body: 约 11% 的电子被弹回，89% 越过势阶。经典粒子能量够就一定越过去，这里却有一部分回来，这是波在势能突变处的反射。
      - item:
          id: step-reflection
          type: number
          prompt: 电子的能量 $E = 5$ eV，射向高 $V_0 = 4$ eV 的势阶。它被反射回来的概率是多少？
          answer: 0.1459
          tolerance: 0.001
          hint: 两边的动能各是多少？波数之比是多少？
          explain: $k_2/k_1 = \sqrt{1/5} = 0.447$，$R = \left(\dfrac{1 - 0.447}{1 + 0.447}\right)^2 = \left(\dfrac{0.553}{1.447}\right)^2 = 0.146$。能量越接近墙高，$k_2$ 越小，反射越多。
      - item:
          id: step-down
          type: number
          prompt: 电子的能量 $E = 5$ eV，从左边射来，在 $x = 0$ 处势能从 0 突然降到 $-4$ eV（往下的势阶）。它被反射回来的概率是多少？
          answer: 0.0213
          tolerance: 0.0005
          hint: 势能降低以后，右边的动能是多少？两边波数之比是多少？
          explain: 右边动能 9 eV，$k_2/k_1 = \sqrt{9/5} = 1.342$，$R = \left(\dfrac{1 - 1.342}{1 + 1.342}\right)^2 = 0.0213$。经典粒子往下走只会加速，不会回头；波在势能突变处总会有一部分反射，往下也一样。
      - item:
          id: step-below
          type: choice
          prompt: 电子的能量 $E = 3$ eV，射向高 $V_0 = 5$ eV 的势阶（右边一直延伸下去）。下面哪个说法对？
          options:
            - text: 电子全部被反射，但波函数会渗进势阶里一小段
              correct: true
            - text: 电子有一定概率越过势阶，一直往右走下去
              why: 势阶里 $\psi \propto e^{-\kappa x}$，越往右越小，走到很远处概率趋于零，最终全部反射回来
            - text: 电子在 $x = 0$ 处被挡住，势阶里的波函数为零
              why: 只有 $V_0$ 无穷大时才为零；$V_0$ 有限时波函数渗进去 $1/\kappa$ 左右
          explain: $E < V_0$ 时势阶里是衰减的指数，没有往右传播的波，反射概率 $R = 1$。但波函数在势阶里不为零，粒子能短暂地进入经典禁区。如果势阶只有有限宽，后面又降下来，渗进去的波就能从另一边出来，粒子就穿过了这堵墙。
  - id: tunneling
    chapter: 一维势阱与隧穿
    title: 隧穿
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 能量 1 eV 的电子射向一堵高 5 eV、厚 0.5 nm 的“墙”，墙后面势能又降回 0。电子会怎样？
          options:
            - text: 绝大多数被弹回，极少数穿到墙另一边
              correct: true
            - text: 全部被弹回，因为电子的能量不够翻过墙
              why: 这是经典力学的答案；波函数会渗进墙里，墙不厚时到墙另一边还没衰减到零
            - text: 大约一半穿过去，一半被弹回
              why: 波函数在墙里按指数衰减，0.5 nm 的墙让它衰减得很厉害，穿过去的只有十万分之几
          explain: 波函数在墙里按指数衰减，到另一边还剩一点，接上一列往外走的波。粒子穿过了按经典力学过不去的墙，这一课估算它穿过的概率。
      - card:
          title: 方势垒和隧穿
          body: |
            在 $0 < x < a$ 内势能是 $V_0$，两边是 0，这样一段凸起的势能叫**势垒（potential barrier）**。能量 $E < V_0$ 的粒子从左边射来，波函数在势垒里按 $e^{-\kappa x}$ 衰减，$\kappa = \sqrt{2m(V_0 - E)}/\hbar$，到右边界时振幅剩下约 $e^{-\kappa a}$ 倍，再变成往右走的波。概率是振幅的平方，所以透射概率

            $$T \approx e^{-2\kappa a}\qquad(\kappa a \gg 1)$$

            粒子穿过经典上过不去的势垒，叫**隧穿（tunneling）**，也叫隧道效应。
      - item:
          id: barrier-thicker
          type: choice
          prompt: 其他条件不变，把势垒的厚度 $a$ 加倍。透射概率 $T \approx e^{-2\kappa a}$ 怎样变化？
          options:
            - text: 约变成原来的平方，小得多
              correct: true
            - text: 变成原来的一半
              why: $T$ 和厚度不是反比关系；厚度在指数上，$e^{-2\kappa(2a)} = (e^{-2\kappa a})^2$
            - text: 不变，只要能量不够，多厚都一样
              why: 厚度越大，波函数衰减得越多；透射概率对厚度非常敏感
          explain: $e^{-4\kappa a} = (e^{-2\kappa a})^2$。原来 $T = 10^{-5}$，加厚一倍变成约 $10^{-10}$。隧穿概率随厚度按指数下降。
      - card:
          title: 例题：估算透射系数
          body: 能量 1 eV 的电子射向高 5 eV、宽 0.5 nm 的方势垒。估算透射概率。$\hbar = 1.055\times10^{-34}$ J·s，$m_e = 9.109\times10^{-31}$ kg，$1\text{ eV} = 1.602\times10^{-19}$ J。
          reveal:
            - title: 第 1 步：算衰减常数 κ
              body: $V_0 - E = 4$ eV $= 6.41\times10^{-19}$ J，$\kappa = \sqrt{2\times9.109\times10^{-31}\times6.41\times10^{-19}}/1.055\times10^{-34} = 1.025\times10^{10}\ \text{m}^{-1}$，即 10.25 nm⁻¹。
            - title: 第 2 步：用指数近似
              body: $2\kappa a = 2\times10.25\times0.5 = 10.25$，$T \approx e^{-10.25} = 3.55\times10^{-5}$。
            - title: 第 3 步：和精确公式比较
              body: |
                精确解是

                $$T = \left[1 + \frac{V_0^2\sinh^2(\kappa a)}{4E(V_0 - E)}\right]^{-1} = 9.09\times10^{-5}$$

                比指数近似大约 2.56 倍。$\kappa a$ 较大时，精确公式约等于 $\dfrac{16E(V_0 - E)}{V_0^2}e^{-2\kappa a}$，前面的因子 $16\times1\times4/25 = 2.56$。指数近似抓住了数量级，前置因子把它修正到准确值。
      - item:
          id: barrier-1nm
          type: number
          prompt: 能量 1 eV 的电子射向高 5 eV、宽 1.0 nm 的方势垒，$\kappa = 10.25\ \text{nm}^{-1}$。按 $T \approx e^{-2\kappa a}$，透射概率是 $N\times10^{-9}$，$N$ 是多少？
          answer: 1.25
          tolerance: 0.02
          hint: $2\kappa a$ 是多少？
          explain: $2\kappa a = 2\times10.25\times1.0 = 20.5$，$e^{-20.5} = 1.25\times10^{-9}$。宽度从 0.5 nm 加到 1.0 nm，透射概率从 $3.6\times10^{-5}$ 掉到 $1.3\times10^{-9}$，约是原来的平方。
      - item:
          id: proton-tunnel
          type: choice
          prompt: 一个质子和一个电子能量相同，射向同一个势垒。谁更容易隧穿？
          options:
            - text: 电子，因为质量小，$\kappa$ 小，衰减得慢
              correct: true
            - text: 质子，因为它更重、冲得更猛
              why: $\kappa = \sqrt{2m(V_0 - E)}/\hbar$，质量大 $\kappa$ 就大，波函数在势垒里衰减得更快
            - text: 一样容易，因为能量相同
              why: 透射概率还取决于质量；质子质量是电子的 1836 倍，$\kappa$ 大约 43 倍，指数上差得非常多
          explain: 质子的 $\kappa$ 是电子的 $\sqrt{1836} \approx 43$ 倍。同样 0.5 nm、4 eV 的势垒，电子的 $2\kappa a$ 约 10，质子约 440，$e^{-440}$ 小到完全可以忽略。所以隧穿在电子身上最明显。
      - card:
          title: 扫描隧道显微镜
          body: |
            扫描隧道显微镜（STM）把一根极尖的金属针移到样品表面上方不到 1 nm 处，加一个小电压。针尖和样品之间的真空是势垒，电子靠隧穿通过，形成很小的隧道电流，它约正比于 $e^{-2\kappa d}$，$d$ 是针尖到表面的距离。金属的逸出功约 4–5 eV，$\kappa \approx 10\ \text{nm}^{-1}$，$d$ 变化 0.1 nm，电流就变化好几倍。针尖扫过表面，保持电流不变而上下移动，就画出了一个个原子的轮廓。
      - item:
          id: stm-factor
          type: number
          prompt: 扫描隧道显微镜的隧道电流约正比于 $e^{-2\kappa d}$，取 $\kappa = 10\ \text{nm}^{-1}$。针尖离表面近了 0.1 nm，电流变成原来的几倍？
          answer: 7.39
          tolerance: 0.02
          hint: 距离变小 0.1 nm，指数 $-2\kappa d$ 变了多少？
          explain: 比值是 $e^{2\kappa\times0.1} = e^{2} = 7.39$。距离只变了一个原子直径的几分之一，电流就差 7 倍多，所以 STM 能分辨单个原子的起伏。
      - item:
          id: gate-leakage
          type: choice
          prompt: 芯片里的 MOS 晶体管（金属–氧化物–半导体结构）用一个叫栅极的电极控制开关，栅极和硅之间隔着一层很薄的二氧化硅绝缘层。这一层减薄到 1–2 nm 时，从栅极漏到硅里的电流急剧增大。主要原因是什么？
          options:
            - text: 电子隧穿过这层薄绝缘层
              correct: true
            - text: 绝缘层太薄被高电压击穿烧坏了
              why: 击穿是不可逆的损坏；这里说的是正常工作时就存在的漏电，而且随厚度按指数变化，是隧穿的特征
            - text: 绝缘层里的电子太多，变成了导体
              why: 二氧化硅仍然是绝缘体，里面几乎没有能自由移动的电子；电流来自电子从一边穿过势垒到另一边
          explain: 绝缘层对电子是一个势垒，透射概率随厚度按指数增大。厚度降到 1–2 nm 时隧穿电流大到不能接受，芯片厂商因此在 45 nm 工艺前后改用相对介电常数更大、可以做得更厚的绝缘材料（业内叫高 k 介质，这里的 k 指相对介电常数）。闪存则反过来利用隧穿，把电子推进或拉出被绝缘层包住的浮栅来存数据。
  - id: quantum-oscillator
    chapter: 谐振子
    title: 量子谐振子
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 经典的弹簧振子，振幅越来越小，能量可以任意接近 0。量子力学里的弹簧振子（角频率 $\omega$），能量最低是多少？
          options:
            - text: $\tfrac12\hbar\omega$，不为零
              correct: true
            - text: 0，静止在平衡位置
              why: 静止在平衡位置意味着位置和动量都确定为零，违反不确定关系
            - text: $\hbar\omega$，一份能量子
              why: 普朗克的振子能量是 $nhf$，最低是 0；量子力学解出的最低能量是半份 $\tfrac12\hbar\omega$
          explain: 量子力学里弹簧振子的能级是 $(n + \tfrac12)\hbar\omega$，最低的 $n = 0$ 时是 $\tfrac12\hbar\omega$。这一课解释这半份能量从哪里来。
      - card:
          title: 谐振子的能级
          body: |
            弹簧振子的势能 $V = \tfrac12kx^2 = \tfrac12m\omega^2x^2$，$\omega = \sqrt{k/m}$。原子在平衡位置附近的小振动、分子里两个原子之间的振动，都可以近似成这样的势能。粒子在这个势能里叫**量子谐振子（quantum harmonic oscillator）**。定态方程

            $$-\frac{\hbar^2}{2m}\psi'' + \frac12m\omega^2x^2\psi = E\psi$$

            的能归一化的解只有在下面这些能量上才存在：

            $$E_n = \left(n + \frac12\right)\hbar\omega,\qquad n = 0, 1, 2, \dots$$

            能级等间距，相邻两级差 $\hbar\omega$；最低的 $E_0 = \tfrac12\hbar\omega$ 就是谐振子的零点能。
      - item:
          id: oscillator-ground
          type: number
          prompt: 一个量子谐振子的 $\hbar\omega = 0.1$ eV。它的基态能量是多少电子伏特？
          answer: 0.05
          tolerance: 0.0005
          unit: eV
          hint: 基态对应 $n$ 等于几？
          explain: $E_0 = (0 + \tfrac12)\times0.1 = 0.05$ eV。注意谐振子的 $n$ 从 0 开始，和无限深势阱从 1 开始不同。
      - item:
          id: oscillator-e3
          type: number
          prompt: 一个量子谐振子的 $\hbar\omega = 0.1$ eV。第 4 个能级（$n = 3$）的能量是多少电子伏特？
          answer: 0.35
          tolerance: 0.0005
          unit: eV
          hint: $E_n = (n + \tfrac12)\hbar\omega$，$n = 3$ 时括号里是多少？
          explain: $E_3 = 3.5\times0.1 = 0.35$ eV。常见的错误是算成 $3\times0.1 = 0.3$ eV，漏了零点能那半份。
      - card:
          title: 例题：零点能从哪里来
          body: 用不确定关系估算谐振子的最低能量。设位置的不确定量为 $\Delta x$，平均位置和平均动量都是 0。
          reveal:
            - title: 第 1 步：把能量写成 Δx 的函数
              body: 平均位置为 0 时，$x^2$ 的平均值是 $(\Delta x)^2$，$p^2$ 也一样。能量约 $E = \dfrac{(\Delta p)^2}{2m} + \dfrac12m\omega^2(\Delta x)^2$。取最小的 $\Delta p = \hbar/(2\Delta x)$：$E = \dfrac{\hbar^2}{8m(\Delta x)^2} + \dfrac12m\omega^2(\Delta x)^2$。
            - title: 第 2 步：找让能量最低的 Δx
              body: 第一项随 $\Delta x$ 减小而增大，第二项随 $\Delta x$ 增大而增大。对 $(\Delta x)^2$ 求导令其为 0：$-\dfrac{\hbar^2}{8m(\Delta x)^4} + \dfrac12m\omega^2 = 0$，得 $(\Delta x)^2 = \dfrac{\hbar}{2m\omega}$。
            - title: 第 3 步：代回求能量
              body: 两项各是 $\tfrac14\hbar\omega$，$E_{\min} = \tfrac12\hbar\omega$，正好是基态能量。粒子不能既停在原点又不动，挤得太窄动能大，放得太开势能大，折中的结果就是零点能。
      - item:
          id: why-zero-point
          type: choice
          prompt: 量子谐振子的基态能量为什么不是 0？
          options:
            - text: 位置和动量不能同时为零（不确定关系）
              correct: true
            - text: 粒子在不停地辐射光子，需要能量补充
              why: 基态是定态，不辐射；它是能量最低的状态，没有更低的能级可以跳下去
            - text: 温度不可能降到绝对零度，所以总有热运动
              why: 零点能和温度无关；即使在绝对零度，谐振子也处在基态，能量仍是 $\tfrac12\hbar\omega$
          explain: 动能为 0 要求动量确定为 0，势能为 0 要求位置确定在原点，两者不能同时做到。折中之后最低能量是 $\tfrac12\hbar\omega$。
      - card:
          title: 波函数的形状
          body: |
            基态波函数是一个钟形的高斯函数：

            $$\psi_0 = \left(\frac{m\omega}{\pi\hbar}\right)^{1/4}e^{-m\omega x^2/2\hbar}$$

            谐振子从 $n = 0$ 编号，$\psi_n$ 有 $n$ 个节点。经典的振子能量为 $E$ 时只能在 $V(x) \le E$ 的范围里运动，两端 $V = E$ 的点叫转折点。量子的波函数在转折点外并不立刻为零，而是很快衰减：基态的粒子有约 16% 的概率出现在转折点外的经典禁区里。
      - item:
          id: forbidden-probability
          type: choice
          prompt: 一个处在基态的量子谐振子，粒子出现在经典转折点以外的概率是多少？
          options:
            - text: 约 16%，不为零但不大
              correct: true
            - text: 0，转折点外动能为负，粒子不可能去
              why: 这是经典力学的结论；量子力学里波函数在转折点外按指数衰减，但不为零
            - text: 约 50%，波函数有一半在外面
              why: 高斯函数大部分集中在转折点以内；对基态的 $|\psi_0|^2$ 在转折点外积分，得到约 0.157
          explain: 基态的转折点在 $x = \pm\sqrt{\hbar/m\omega}$。对 $|\psi_0|^2$ 在这个范围外积分得 0.157，约 16%。这和势阱外的渗透是同一种现象。
      - card:
          title: 分子的振动光谱
          body: |
            一氧化碳这样的双原子分子，两个原子像用弹簧连着，在平衡距离附近振动，振动能级近似是等间距的 $(n + \tfrac12)\hbar\omega$。分子从 $n = 0$ 跳到 $n = 1$ 要吸收能量为 $\hbar\omega$ 的光子，一般在红外区。所以每种分子有自己的红外吸收波长，气体分析仪、测温室气体浓度的卫星都靠测这些吸收线。
      - item:
          id: co-infrared
          type: number
          prompt: 一氧化碳分子的振动能级间隔 $\hbar\omega \approx 0.266$ eV。它从基态跳到第一激发态吸收的光子，波长约多少微米？取 $hc = 1.240\ \text{eV·μm}$。
          answer: 4.66
          tolerance: 0.02
          unit: μm
          hint: 吸收的光子能量等于哪两个能级之差？
          explain: 光子能量 $E_1 - E_0 = \hbar\omega = 0.266$ eV，$\lambda = 1.240/0.266 = 4.66\ \mu\text{m}$，在中红外。汽车尾气分析仪就是用 4.6 μm 附近的红外光测一氧化碳。
      - item:
          id: spring-hw
          type: number
          prompt: 一个质量 $1.6\times10^{-27}$ kg 的原子，被劲度系数 500 N/m 的“化学键弹簧”拉着振动。振动能级间隔 $\hbar\omega$ 是多少电子伏特？$\hbar = 1.055\times10^{-34}$ J·s，$1\text{ eV} = 1.602\times10^{-19}$ J。
          answer: 0.368
          tolerance: 0.002
          unit: eV
          hint: 先由 $\omega = \sqrt{k/m}$ 算角频率。
          explain: $\omega = \sqrt{500/1.6\times10^{-27}} = 5.59\times10^{14}$ rad/s，$\hbar\omega = 1.055\times10^{-34}\times5.59\times10^{14} = 5.90\times10^{-20}$ J $= 0.368$ eV，基态能量是它的一半 0.184 eV。
      - item:
          id: pendulum-classical
          type: choice
          prompt: 一个 1 kg 的物体挂在弹簧上，每秒振动一次。为什么看不出它的能量是一级一级的？
          options:
            - text: 每级只差约 $7\times10^{-34}$ J，远小于振动能量
              correct: true
            - text: 宏观物体不遵守量子力学
              why: 量子力学对宏观物体同样成立，只是 $\hbar$ 太小，量子效应小到测不出
            - text: 宏观振子的能级间隔不相等，各级混在一起分辨不出
              why: 谐振子的能级总是等间距的；看不出台阶是因为每一级太小
          explain: $\omega = 2\pi$ rad/s，$\hbar\omega = 6.6\times10^{-34}$ J。振幅 1 cm 时振动能量约 $2\times10^{-3}$ J，相当于 $n \approx 3\times10^{30}$，一级一级的台阶细到看起来是连续的。
  - id: ladder-operators
    chapter: 谐振子
    title: 升降算符
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 谐振子的能级像一架等间距的梯子，每级差 $\hbar\omega$。假如有一个操作，能把任何一个定态变成能量高 $\hbar\omega$ 的定态。从基态出发反复用它，能得到什么？
          options:
            - text: 所有的能级，一级一级往上
              correct: true
            - text: 只能得到第一激发态，再用就不行了
              why: 题里说它对任何定态都能用，所以可以一直往上爬
            - text: 能得到能量是基态 2 倍、4 倍、8 倍……的能级
              why: 每用一次加的是 $\hbar\omega$，不是乘 2；从 $\tfrac12\hbar\omega$ 出发得到 $\tfrac32\hbar\omega$、$\tfrac52\hbar\omega$……
          explain: 每用一次能量加 $\hbar\omega$，从基态出发就能走遍整架梯子。这一课用算符造出这样的操作，不解微分方程也能得到谐振子的全部能级。
      - card:
          title: 对易子
          body: |
            两个算符先后作用，顺序可能有关。$\hat A\hat B - \hat B\hat A$ 叫它们的**对易子（commutator）**，记作 $[\hat A, \hat B]$；它等于 0 时说两个算符对易。

            位置算符 $\hat x$ 就是“乘以 $x$”。作用在任意函数 $f$ 上：

            $$\hat x\hat pf - \hat p\hat xf = x(-i\hbar f') - (-i\hbar)(xf)' = -i\hbar xf' + i\hbar(f + xf') = i\hbar f$$

            所以 $[\hat x, \hat p] = i\hbar$。位置和动量不对易，这和它们不能同时确定是一回事：不对易的两个量，没有一个状态能让两者同时取确定值。
      - item:
          id: commutator-x2
          type: choice
          prompt: 把 $\hat x\hat p$ 和 $\hat p\hat x$ 分别作用在 $f = x^2$ 上（$\hat p = -i\hbar\,d/dx$）。两个结果之差 $\hat x\hat pf - \hat p\hat xf$ 是什么？
          options:
            - text: $i\hbar x^2$
              correct: true
            - text: 0，乘法和求导的顺序不影响结果
              why: $\hat x\hat pf = x(-2i\hbar x) = -2i\hbar x^2$，$\hat p\hat xf = -i\hbar(x^3)' = -3i\hbar x^2$，两者不同
            - text: $i\hbar$
              why: 对易子 $[\hat x, \hat p] = i\hbar$ 作用在 $f$ 上得到 $i\hbar f$，这里 $f = x^2$，结果还要乘上 $x^2$
          explain: $\hat x\hat pf = -2i\hbar x^2$，$\hat p\hat xf = -i\hbar\cdot3x^2 = -3i\hbar x^2$，相减得 $i\hbar x^2 = i\hbar f$，和 $[\hat x, \hat p] = i\hbar$ 一致。
      - card:
          title: 升降算符
          body: |
            定义两个算符

            $$\hat a_\pm = \frac{1}{\sqrt{2\hbar m\omega}}\left(\mp i\hat p + m\omega\hat x\right)$$

            把 $\hat a_+$ 和 $\hat a_-$ 相乘，用 $[\hat x, \hat p] = i\hbar$ 整理，得到

            $$\hat H = \hbar\omega\left(\hat a_+\hat a_- + \frac12\right),\qquad [\hat a_-, \hat a_+] = 1$$

            $\hat a_+$ 和 $\hat a_-$ 叫**升降算符（ladder operators）**。由上面两式算出 $[\hat H, \hat a_\pm] = \pm\hbar\omega\,\hat a_\pm$，所以如果 $\hat H\psi = E\psi$，则 $\hat H(\hat a_+\psi) = (\hat a_+\hat H + \hbar\omega\hat a_+)\psi = (E + \hbar\omega)\hat a_+\psi$，同样 $\hat H(\hat a_-\psi) = (E - \hbar\omega)\hat a_-\psi$。$\hat a_+$ 让能量升一级，$\hat a_-$ 让能量降一级。
      - item:
          id: climb-three
          type: number
          prompt: 谐振子处在 $\psi_1$（能量 $\tfrac32\hbar\omega$）。连续用 $\hat a_+$ 作用三次，得到的状态能量是 $\hbar\omega$ 的几倍？
          answer: 4.5
          hint: 每用一次 $\hat a_+$，能量加多少？
          explain: 每次加 $\hbar\omega$，$\tfrac32 + 3 = 4.5$，得到的是 $\psi_4$（乘上一个系数），能量 $(4 + \tfrac12)\hbar\omega$。
      - card:
          title: 梯子的最低一级
          body: |
            谐振子的动能和势能都不会是负的，能量不能无限往下降，所以一定有一个最低的状态 $\psi_0$，再用 $\hat a_-$ 不能更低，只能得到 0：

            $$\hat a_-\psi_0 = 0$$

            代入 $\hat H = \hbar\omega(\hat a_+\hat a_- + \tfrac12)$：$\hat H\psi_0 = \hbar\omega(0 + \tfrac12\psi_0)$，所以 $E_0 = \tfrac12\hbar\omega$。往上每级加 $\hbar\omega$，$E_n = (n + \tfrac12)\hbar\omega$，和解微分方程得到的一样。
      - card:
          title: 例题：由 â₋ψ₀ = 0 求基态波函数
          body: 把 $\hat a_-\psi_0 = 0$ 写成微分方程，解出 $\psi_0$。
          reveal:
            - title: 第 1 步：写出方程
              body: $\hat a_- \propto i\hat p + m\omega\hat x = \hbar\dfrac{d}{dx} + m\omega x$，所以 $\hbar\dfrac{d\psi_0}{dx} + m\omega x\psi_0 = 0$。这只是一阶方程。
            - title: 第 2 步：分离变量
              body: $\dfrac{d\psi_0}{\psi_0} = -\dfrac{m\omega}{\hbar}x\,dx$，两边积分：$\ln\psi_0 = -\dfrac{m\omega x^2}{2\hbar} + C$。
            - title: 第 3 步：写出结果
              body: $\psi_0 = Ae^{-m\omega x^2/2\hbar}$，正是高斯函数，$A$ 由归一化定出。其余的 $\psi_n$ 都可以由 $\hat a_+$ 反复作用在 $\psi_0$ 上得到。
      - item:
          id: lower-ground
          type: choice
          prompt: 用降算符 $\hat a_-$ 作用在谐振子的基态 $\psi_0$ 上，结果是什么？
          options:
            - text: '0'
              correct: true
            - text: 能量为 $-\tfrac12\hbar\omega$ 的状态
              why: 这样的状态不存在：谐振子的能量不可能是负的，梯子在 $\psi_0$ 就到底了
            - text: $\psi_0$ 本身，降不下去就不变
              why: 如果 $\hat a_-\psi_0 = \psi_0$，它的能量就要比自己低 $\hbar\omega$，矛盾；$\hat a_-\psi_0$ 只能是 0
          explain: 梯子必须有底，最低一级满足 $\hat a_-\psi_0 = 0$。正是这个条件定出了基态的波函数和零点能 $\tfrac12\hbar\omega$。
      - card:
          title: 升降时的系数
          body: |
            $\hat a_\pm$ 作用在归一化的 $\psi_n$ 上，得到的状态还差一个系数：

            $$\hat a_+\psi_n = \sqrt{n + 1}\,\psi_{n+1},\qquad \hat a_-\psi_n = \sqrt{n}\,\psi_{n-1}$$

            两个合起来，$\hat a_+\hat a_-\psi_n = \sqrt n\sqrt n\,\psi_n = n\psi_n$：$\hat a_+\hat a_-$ 数出当前在第几级，所以 $\hat H = \hbar\omega(\hat a_+\hat a_- + \tfrac12)$ 给出 $(n + \tfrac12)\hbar\omega$。$n = 0$ 时 $\hat a_-\psi_0 = 0$，和上面一致。
      - item:
          id: raise-twice
          type: number
          prompt: 用 $\hat a_+$ 连续作用两次在 $\psi_0$ 上，结果是 $c\,\psi_2$。系数 $c$ 是多少？（填小数，保留三位）
          answer: 1.414
          tolerance: 0.001
          hint: 第一次从 $\psi_0$ 到 $\psi_1$ 乘多少？第二次从 $\psi_1$ 到 $\psi_2$ 乘多少？
          explain: $\hat a_+\psi_0 = \sqrt1\,\psi_1$，$\hat a_+\psi_1 = \sqrt2\,\psi_2$，所以 $c = \sqrt1\times\sqrt2 = \sqrt2 \approx 1.414$。
      - item:
          id: number-operator
          type: number
          prompt: 谐振子处在 $\psi_5$。$\hat a_+\hat a_-\psi_5 = c\,\psi_5$，$c$ 是多少？
          answer: 5
          hint: 先用 $\hat a_-$ 降一级，系数是多少？再用 $\hat a_+$ 升回来，系数又是多少？
          explain: $\hat a_-\psi_5 = \sqrt5\,\psi_4$，$\hat a_+\psi_4 = \sqrt5\,\psi_5$，合起来 $\sqrt5\times\sqrt5 = 5$。$\hat a_+\hat a_-$ 作用在 $\psi_n$ 上得到 $n$，也就是能级的序号。
  - id: expectation-values
    chapter: 算符与测量
    title: 期望值和动量空间
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 掷一个均匀的骰子很多次，把点数平均起来，大约是多少？
          options:
            - text: '3.5'
              correct: true
            - text: '3'
              why: 1 到 6 的平均是 $(1 + 2 + \dots + 6)/6 = 21/6 = 3.5$；3 是把中间的数取成了整数
            - text: 没法说，每次掷出的数都不一样
              why: 每次结果确实不同，但掷很多次以后平均值会稳定在一个数附近
          explain: 每个点数出现的概率都是 1/6，平均值是 $\sum k\cdot\tfrac16 = 3.5$。注意 3.5 是一次也掷不出来的数。量子力学里的期望值也是这样的平均。
      - card:
          title: 期望值
          body: |
            准备很多个处在同一状态 $\psi$ 的粒子，各测一次位置，结果的平均值叫位置的**期望值（expectation value）**：

            $$\langle x\rangle = \int x\,|\psi|^2dx$$

            它是按概率密度加权的平均。同样，$x$ 的任意函数 $f(x)$ 的期望值是 $\int f(x)|\psi|^2dx$。期望值不一定是最可能测到的值，也不一定是某一次能测到的值，就像骰子的 3.5。
      - item:
          id: mean-linear
          type: number
          prompt: 粒子的波函数在 $0 \le x \le 1$ nm 内是 $\psi = \sqrt3\,x$（$x$ 以 nm 计），其余地方为 0。位置的期望值是多少纳米？
          answer: 0.75
          tolerance: 0.001
          unit: nm
          hint: 按概率密度加权平均，要对什么乘 $|\psi|^2$ 再积分？
          explain: $\langle x\rangle = \int_0^13x^3dx = 3/4 = 0.75$ nm。$|\psi|^2 = 3x^2$ 在右边大，所以平均位置偏右，不在正中间。
      - card:
          title: 例题：位置的标准差
          body: 同一个波函数 $\psi = \sqrt3\,x$（$0 \le x \le 1$ nm）。求位置的标准差 $\Delta x$。
          reveal:
            - title: 第 1 步：算 x² 的期望值
              body: $\langle x^2\rangle = \int_0^1x^2\cdot3x^2dx = 3/5 = 0.6\ \text{nm}^2$。
            - title: 第 2 步：用方差公式
              body: 方差等于“平方的平均”减“平均的平方”：$(\Delta x)^2 = \langle x^2\rangle - \langle x\rangle^2 = 0.6 - 0.75^2 = 0.0375\ \text{nm}^2$。
            - title: 第 3 步：开方
              body: $\Delta x = \sqrt{0.0375} = 0.194$ nm。测很多次，结果大多落在 $0.75 \pm 0.19$ nm 的范围里。
      - item:
          id: well-mean-x
          type: number
          prompt: 电子处在宽 $L = 1$ nm 的无限深势阱的基态，$|\psi_1|^2 = 2\sin^2(\pi x)$（$x$ 以 nm 计）。位置的期望值是多少纳米？
          answer: 0.5
          tolerance: 0.001
          unit: nm
          hint: $|\psi_1|^2$ 关于阱的中点对称吗？
          explain: $|\psi_1|^2$ 关于 $x = 0.5$ nm 左右对称，左边每一点都有右边对称的一点和它一样可能，平均值就在正中间 0.5 nm，不用积分。
      - card:
          title: 动量的期望值
          body: |
            动量要用算符算：

            $$\langle p\rangle = \int\psi^*\left(-i\hbar\frac{d\psi}{dx}\right)dx,\qquad \langle p^2\rangle = \int\psi^*\left(-\hbar^2\frac{d^2\psi}{dx^2}\right)dx$$

            先让算符作用在 $\psi$ 上，再乘 $\psi^*$ 积分。势阱的定态 $\psi_n$ 是实函数，在两墙处为零，算出来 $\langle p\rangle = 0$：粒子往左、往右的可能一样大。基态 $\psi_1'' = -(\pi/L)^2\psi_1$，所以 $\langle p^2\rangle = (\pi\hbar/L)^2$，$\Delta p = \pi\hbar/L$，正好满足 $\langle p^2\rangle/2m = E_1$。
      - item:
          id: well-uncertainty-product
          type: number
          prompt: 无限深势阱基态的 $\Delta x = 0.181L$，$\Delta p = \pi\hbar/L$。$\Delta x\,\Delta p$ 是 $\hbar$ 的几倍？
          answer: 0.568
          tolerance: 0.003
          hint: 两个量相乘时 $L$ 会怎样？
          explain: $0.181L\times\pi\hbar/L = 0.568\hbar$，和阱宽无关，比不确定关系的下限 $0.5\hbar$ 稍大，满足 $\Delta x\,\Delta p \ge \hbar/2$。
      - item:
          id: real-psi-momentum
          type: choice
          prompt: 无限深势阱的定态波函数是实函数。它的动量期望值 $\langle p\rangle$ 为什么是 0？
          options:
            - text: 粒子在阱里往左、往右运动的可能一样大，平均起来动量为 0
              correct: true
            - text: 粒子在定态里静止不动
              why: 定态的 $\langle p^2\rangle = (n\pi\hbar/L)^2 > 0$，粒子在动；只是左右平均抵消
            - text: 势阱里势能为 0，所以动量为 0
              why: 势能为 0 时动能等于总能量，大于 0；$\langle p\rangle = 0$ 是因为方向平均掉了
          explain: $\sin(n\pi x/L) = \dfrac{e^{ikx} - e^{-ikx}}{2i}$，是一列往右和一列往左的平面波各占一半，动量 $+\hbar k$ 和 $-\hbar k$ 的可能相等，平均为 0。
      - card:
          title: 动量空间
          body: |
            任何波函数都可以拆成许多平面波 $e^{ikx}$ 的叠加，每个波数 $k$ 的分量的大小是

            $$\phi(k) = \frac{1}{\sqrt{2\pi}}\int\psi(x)e^{-ikx}dx$$

            从 $\psi(x)$ 得到 $\phi(k)$ 的这种运算叫**傅里叶变换（Fourier transform）**。$|\phi(k)|^2$ 是测到动量 $p = \hbar k$ 的概率密度，所以 $\phi$ 就是同一个状态“在动量空间里的波函数”。$\psi(x)$ 越窄，$\phi(k)$ 就越宽，这又是不确定关系。
      - item:
          id: narrow-gaussian
          type: choice
          prompt: 一个高斯形状的波包，把它在位置上的宽度压成原来的一半（形状不变）。它在动量空间的宽度怎样？
          options:
            - text: 变成原来的 2 倍
              correct: true
            - text: 也变成原来的一半
              why: 位置和动量的宽度此消彼长；高斯波包的 $\Delta x\,\Delta p = \hbar/2$ 保持不变
            - text: 不变，动量分布和位置分布互不影响
              why: 动量分布正是由位置上的波函数做傅里叶变换得到的，波函数变窄，它就变宽
          explain: 高斯波包恰好取到下限 $\Delta x\,\Delta p = \hbar/2$。$\Delta x$ 减半，$\Delta p$ 加倍。
      - card:
          title: 期望值随时间怎样变
          body: |
            由薛定谔方程可以证明

            $$\frac{d\langle x\rangle}{dt} = \frac{\langle p\rangle}{m},\qquad \frac{d\langle p\rangle}{dt} = \left\langle -\frac{dV}{dx}\right\rangle$$

            期望值按牛顿定律的样子运动，这叫**埃伦费斯特定理（Ehrenfest's theorem）**。在定态里一切期望值都不变；两个定态叠加时，$\langle x\rangle$ 以频率 $(E_2 - E_1)/h$ 来回振荡。
      - item:
          id: well-oscillation-period
          type: number
          prompt: 宽 1 nm 的无限深势阱里，电子处在 $\psi_1$ 和 $\psi_2$ 的叠加态，$E_2 - E_1 = 1.128$ eV。它的位置期望值来回振荡一次要多少飞秒（$10^{-15}$ s）？$h = 6.626\times10^{-34}$ J·s，$1\text{ eV} = 1.602\times10^{-19}$ J。
          answer: 3.67
          tolerance: 0.02
          unit: fs
          hint: 两个定态叠加时，概率分布以什么频率来回晃？周期和频率是什么关系？
          explain: $T = h/(E_2 - E_1) = 6.626\times10^{-34}/(1.128\times1.602\times10^{-19}) = 3.67\times10^{-15}$ s。电子在阱里左右来回晃，几飞秒一次。
      - item:
          id: free-mean-motion
          type: choice
          prompt: 一个自由粒子（$V = 0$）的波包，开始时 $\langle p\rangle = p_0$。之后它的位置期望值怎样变化？
          options:
            - text: 以速度 $p_0/m$ 匀速移动
              correct: true
            - text: 越走越快，因为波包会散开
              why: 波包会散开，但 $V = 0$ 时 $d\langle p\rangle/dt = 0$，平均动量不变，平均位置匀速走
            - text: 停在原地，只是波包变宽
              why: $d\langle x\rangle/dt = \langle p\rangle/m = p_0/m \ne 0$，平均位置在移动
          explain: $V = 0$ 时 $\langle p\rangle$ 不随时间变，$\langle x\rangle$ 以 $p_0/m$ 匀速前进，和不受力的经典粒子一样。波包同时会慢慢变宽，这是经典粒子没有的。
  - id: hermitian-operators
    chapter: 算符与测量
    title: 可观测量和厄米算符
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 量子力学里测能量、动量、位置，读数总是实数。如果每个可测的量对应一个算符，测量结果是这个算符的特征值，那么这些算符的特征值必须满足什么？
          options:
            - text: 全部是实数
              correct: true
            - text: 全部是正数
              why: 动量、位置可以是负的，氢原子束缚态的能量也是负的；要求的只是实数
            - text: 全部是整数
              why: 动量、位置可以连续取值；只有某些量（比如束缚态的能级序号）才是整数
          explain: 读数是实数，所以代表可测量的算符，特征值必须都是实数。满足这一点的算符有一个共同的性质，这一课讲它。
      - card:
          title: 本征值方程
          body: |
            算符 $\hat A$ 作用在某个函数上，结果只是原函数乘一个数：

            $$\hat A\psi = a\psi$$

            这个数 $a$ 叫**本征值（eigenvalue）**，就是线性代数里的特征值；$\psi$ 叫本征函数，它代表的状态叫 $\hat A$ 的**本征态（eigenstate）**。处在本征态时，测这个量一定得到本征值 $a$。例子：$\hat p\,e^{ikx} = \hbar k\,e^{ikx}$，平面波是动量本征态；$\hat H\psi_n = E_n\psi_n$，定态就是能量本征态。
      - item:
          id: sin-eigen
          type: choice
          prompt: 函数 $\sin kx$ 是动量算符 $\hat p = -i\hbar\,d/dx$ 的本征函数吗？是 $\hat p^2$ 的本征函数吗？
          options:
            - text: 只是 $\hat p^2$ 的，本征值 $\hbar^2k^2$
              correct: true
            - text: 两个都是
              why: $\hat p\sin kx = -i\hbar k\cos kx$，变成了余弦，不是原函数乘一个数
            - text: 是 $\hat p$ 的，本征值 $-i\hbar k$
              why: 结果是 $\cos kx$ 而不是 $\sin kx$，函数变了；本征函数要求作用后还是同一个函数
          explain: 求一次导数 $\sin$ 变 $\cos$，所以不是 $\hat p$ 的本征函数；求两次导数回到 $-k^2\sin kx$，$\hat p^2\sin kx = \hbar^2k^2\sin kx$。$\sin kx$ 是往左、往右两列平面波的叠加，动量的大小确定，方向不确定。
      - card:
          title: 内积和厄米算符
          body: |
            两个函数的**内积（inner product）**定义为

            $$\langle f|g\rangle = \int f^*g\,dx$$

            它是向量点积的推广，$\langle f|f\rangle = \int|f|^2dx \ge 0$。如果对任意 $f$、$g$ 都有 $\langle f|\hat Ag\rangle = \langle\hat Af|g\rangle$，$\hat A$ 叫**厄米算符（Hermitian operator）**。量子力学规定：每个可测的物理量对应一个厄米算符，位置、动量、能量的算符都是厄米的。
      - card:
          title: 厄米算符的两条性质
          body: |
            1. 本征值都是实数。
            2. 不同本征值的本征函数互相**正交（orthogonal）**：$\langle\psi_m|\psi_n\rangle = 0$，就像两个垂直的向量点积为 0。

            写成矩阵时，厄米算符对应的矩阵等于自己的共轭转置（转置后每个数取复共轭），叫厄米矩阵。实数的厄米矩阵就是对称矩阵，谱定理说它的特征值是实数、特征向量可以选成两两正交，厄米矩阵也一样。
      - item:
          id: well-orthogonal
          type: number
          prompt: 宽 1 nm 的无限深势阱，$\psi_1 = \sqrt2\sin(\pi x)$，$\psi_2 = \sqrt2\sin(2\pi x)$（$x$ 以 nm 计）。内积 $\langle\psi_1|\psi_2\rangle = \int_0^12\sin(\pi x)\sin(2\pi x)dx$ 是多少？
          answer: 0
          hint: 两个能量不同的定态是同一个厄米算符的本征函数，它们之间有什么关系？
          explain: $\psi_1$、$\psi_2$ 是 $\hat H$ 的不同本征值的本征函数，必定正交，内积为 0。直接积分也一样：$2\sin\pi x\sin2\pi x = \cos\pi x - \cos3\pi x$，在 0 到 1 上积分两项都是 0。
      - item:
          id: hermitian-matrix
          type: choice
          prompt: 下面哪个矩阵是厄米矩阵？
          options:
            - text: $\begin{pmatrix}1 & i\\ -i & 2\end{pmatrix}$
              correct: true
            - text: $\begin{pmatrix}1 & i\\ i & 2\end{pmatrix}$
              why: 它是对称的，但转置后还要取复共轭，右上角 $i$ 对应左下角应是 $-i$
            - text: $\begin{pmatrix}0 & 1\\ -1 & 0\end{pmatrix}$
              why: 它的转置是自己的相反数，叫反对称矩阵；它的特征值是 $\pm i$，不是实数
          explain: 厄米矩阵要求第 $j$ 行第 $k$ 列的数等于第 $k$ 行第 $j$ 列的数的复共轭。第一个矩阵对角线是实数，右上 $i$ 和左下 $-i$ 互为复共轭，满足要求。
      - item:
          id: hermitian-eigenvalue
          type: number
          prompt: 厄米矩阵 $\begin{pmatrix}2 & i\\ -i & 2\end{pmatrix}$ 的两个特征值中，较大的是多少？
          answer: 3
          hint: 特征值满足 $(2 - \lambda)^2 - i\cdot(-i) = 0$，$i\cdot(-i)$ 等于多少？
          explain: $i\cdot(-i) = -i^2 = 1$，于是 $(2 - \lambda)^2 = 1$，$\lambda = 1$ 或 $3$，都是实数，较大的是 3。
      - card:
          title: 完备性和展开系数
          body: |
            一个可测量的全部本征函数是**完备（complete）**的：任何波函数都能写成它们的叠加

            $$\psi = \sum_nc_n\psi_n,\qquad c_n = \langle\psi_n|\psi\rangle$$

            这和用两两正交、长度为 1 的一组向量做基，求一个向量在每个方向上的分量是同一回事，也和把弦的形状拆成傅里叶级数一样。归一化的 $\psi$ 满足 $\sum|c_n|^2 = 1$。
      - card:
          title: 例题：一个波函数里有多少基态
          body: 宽 1 nm 的势阱里，粒子的波函数是 $\psi = \sqrt{30}\,x(1 - x)$（$0 \le x \le 1$，$x$ 以 nm 计），已经归一化。求它按定态展开时的系数 $c_1$。
          reveal:
            - title: 第 1 步：写出系数的积分
              body: $c_1 = \langle\psi_1|\psi\rangle = \int_0^1\sqrt2\sin(\pi x)\cdot\sqrt{30}\,x(1 - x)dx = \sqrt{60}\int_0^1x(1 - x)\sin(\pi x)dx$。
            - title: 第 2 步：算积分
              body: 分部积分两次（或数值积分），$\int_0^1x(1 - x)\sin(\pi x)dx = 4/\pi^3 = 0.1290$。
            - title: 第 3 步：得到系数
              body: $c_1 = \sqrt{60}\times0.1290 = 0.9993$。这个抛物线形状的波函数几乎就是基态，$|c_1|^2 = 0.9986$，其余的激发态加起来只占 0.14%。
      - item:
          id: parabola-ground-share
          type: number
          prompt: 宽 1 nm 的势阱里，波函数 $\psi = \sqrt{30}\,x(1 - x)$ 按定态展开，基态的系数 $c_1 = 0.9993$。各个激发态的 $|c_n|^2$ 加起来是多少？
          answer: 0.0014
          tolerance: 0.0002
          hint: 归一化的波函数，所有 $|c_n|^2$ 加起来等于几？
          explain: $\sum|c_n|^2 = 1$，激发态合计 $1 - 0.9993^2 = 1 - 0.9986 = 0.0014$。抛物线和半个正弦的形状非常接近，所以几乎全是基态。
  - id: measurement
    chapter: 算符与测量
    title: 测量、坍缩和对易
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 势阱里的电子处在叠加态 $\psi = \tfrac12\psi_1 + \tfrac{\sqrt3}{2}\psi_2$，两个能级是 $E_1$ 和 $E_2 = 4E_1$。测一次它的能量，会得到什么？
          options:
            - text: 要么 $E_1$，要么 $E_2$
              correct: true
            - text: 两者按系数平均后的 $3.25E_1$
              why: $3.25E_1$ 是测很多次的平均值；单独一次测量只会得到某一个本征值
            - text: $E_1$ 和 $E_2$ 之间的任意一个值
              why: 测量结果只能是能量算符的本征值，介于两个能级之间的值测不到
          explain: 一次测量只得到一个本征值，至于是哪一个，只能给出概率。这一课讲怎样由系数算出这些概率。
      - card:
          title: 测量的规则
          body: |
            把状态按可测量 $\hat A$ 的本征函数展开，$\psi = \sum c_n\psi_n$。测量 $A$：

            1. 结果只能是某个本征值 $a_n$；
            2. 得到 $a_n$ 的概率是 $|c_n|^2$；
            3. 测得 $a_n$ 之后，状态立刻变成对应的本征态 $\psi_n$，紧接着再测一次一定还是 $a_n$。

            第 3 条里状态的突变叫**坍缩（collapse）**。期望值就是 $\langle A\rangle = \sum|c_n|^2a_n$。
      - card:
          title: 例题：测量叠加态的能量
          body: 宽 1 nm 的势阱，$E_1 = 0.376$ eV。电子处在 $\psi = \tfrac12\psi_1 + \tfrac{\sqrt3}{2}\psi_2$。测一次能量，可能得到哪些值、概率各多少？能量的期望值是多少？测后的状态是什么？
          reveal:
            - title: 第 1 步：读出系数，算概率
              body: $c_1 = 1/2$，$c_2 = \sqrt3/2$。测得 $E_1$ 的概率 $|c_1|^2 = 1/4$，测得 $E_2 = 4E_1 = 1.50$ eV 的概率 $3/4$。两者加起来是 1。
            - title: 第 2 步：按概率加权求期望值
              body: $\langle E\rangle = \tfrac14E_1 + \tfrac34\times4E_1 = 3.25E_1 = 1.22$ eV。一次也测不到 1.22 eV，它是很多次测量的平均。
            - title: 第 3 步：写出测后的状态
              body: 测得 $E_1$，状态坍缩成 $\psi_1$；测得 $E_2$，坍缩成 $\psi_2$。之后再测能量，结果不再有不确定性。
      - item:
          id: three-level-mean
          type: number
          prompt: 宽 1 nm 的势阱，$E_1 = 0.376$ eV，$E_n = n^2E_1$。电子处在 $\psi = \tfrac{1}{\sqrt3}(\psi_1 + \psi_2 + \psi_3)$。能量的期望值是多少电子伏特？
          answer: 1.755
          tolerance: 0.005
          unit: eV
          hint: 三个能级的概率各是多少？
          explain: 每个概率都是 $1/3$，$\langle E\rangle = \tfrac13(1 + 4 + 9)E_1 = \tfrac{14}{3}\times0.376 = 1.75$ eV。
      - item:
          id: complex-coefficient
          type: number
          prompt: 电子处在 $\psi = \tfrac{1}{\sqrt5}\psi_1 + \tfrac{2i}{\sqrt5}\psi_3$。测能量得到 $E_3$ 的概率是多少？
          answer: 0.8
          tolerance: 0.001
          hint: 概率是系数的模的平方，$|2i|^2$ 是多少？
          explain: $|c_3|^2 = |2i|^2/5 = 4/5 = 0.8$。系数是复数时，要用模的平方，不能直接平方：$(2i)^2 = -4$ 是负的，不是概率。
      - item:
          id: repeat-measurement
          type: choice
          prompt: 电子处在 $\tfrac12\psi_1 + \tfrac{\sqrt3}{2}\psi_2$。测能量得到 $E_2$。紧接着再测一次能量，会得到什么？
          options:
            - text: 一定是 $E_2$
              correct: true
            - text: 和第一次一样，有 $3/4$ 的概率是 $E_2$
              why: 第一次测量后状态已经坍缩成 $\psi_2$，原来的叠加没有了，概率也就不再是 $3/4$
            - text: 一定是 $E_1$，因为 $E_2$ 已经被测过了
              why: 测量不会把状态推到别的能级；坍缩成 $\psi_2$ 后再测还是 $E_2$
          explain: 测得 $E_2$ 后状态是 $\psi_2$，它是能量本征态，$|c_2|^2 = 1$，再测必定是 $E_2$。
      - card:
          title: 测量结果的分散程度
          body: |
            测很多次，结果的分散程度用标准差表示：

            $$(\Delta A)^2 = \langle A^2\rangle - \langle A\rangle^2,\qquad \langle A^2\rangle = \sum|c_n|^2a_n^2$$

            处在本征态时只有一个 $c_n$ 不为零，$\Delta A = 0$，结果完全确定。$\Delta A$ 越大，状态里混进的本征态越分散。
      - item:
          id: energy-spread
          type: number
          prompt: 电子处在 $\psi = \tfrac12\psi_1 + \tfrac{\sqrt3}{2}\psi_2$，$E_2 = 4E_1$，$\langle E\rangle = 3.25E_1$。能量的标准差 $\Delta E$ 是 $E_1$ 的几倍？
          answer: 1.299
          tolerance: 0.005
          hint: 标准差要用两个平均值：一个是 $\langle E\rangle$，另一个是哪个量的平均？
          explain: $\langle E^2\rangle = (0.25 + 12)E_1^2 = 12.25E_1^2$，$\langle E\rangle^2 = 10.5625E_1^2$，$(\Delta E)^2 = 1.6875E_1^2$，$\Delta E = 1.30E_1$。
      - card:
          title: 对易和同时测量
          body: |
            两个可测量的算符对易（$[\hat A, \hat B] = 0$）时，可以找到一组函数同时是两者的本征函数，叫共同本征态，在这些状态里两个量都有确定值。比如自由粒子的 $\hat H$ 和 $\hat p$ 对易，平面波同时是两者的本征态。

            不对易时，一般的不确定关系是

            $$\Delta A\,\Delta B \ge \frac12\left|\langle[\hat A, \hat B]\rangle\right|$$

            代入 $[\hat x, \hat p] = i\hbar$，得到 $\Delta x\,\Delta p \ge \hbar/2$。
      - item:
          id: x-p-x
          type: choice
          prompt: 先测一个粒子的位置，得到 $x_0$；接着测它的动量；再测一次位置。第二次的位置读数会怎样？
          options:
            - text: 一般不再是 $x_0$
              correct: true
            - text: 一定还是 $x_0$，因为中间没有测位置
              why: 测动量让状态坍缩成动量本征态（平面波），在各处的概率一样，原来的位置信息没了
            - text: 一定是 0
              why: 测动量后位置是不确定的，各处都有可能，不会特别落在原点
          explain: $\hat x$ 和 $\hat p$ 不对易，没有共同本征态。测动量把状态变成动量本征态，位置就重新变得不确定，再测位置一般得到别的值。
      - item:
          id: commuting-pair
          type: choice
          prompt: 一个自由粒子（$V = 0$），下面哪一对量可以同时有确定的值？
          options:
            - text: 能量和动量
              correct: true
            - text: 位置和动量
              why: '$[\hat x, \hat p] = i\hbar \ne 0$，两者不能同时确定'
            - text: 位置和能量
              why: 自由粒子的 $\hat H = \hat p^2/2m$ 和 $\hat x$ 不对易；能量确定的平面波在各处的概率相同，位置完全不确定
          explain: $V = 0$ 时 $\hat H = \hat p^2/2m$，和 $\hat p$ 对易。平面波 $e^{ikx}$ 的动量是 $\hbar k$，能量是 $\hbar^2k^2/2m$，两个都确定。
  - id: angular-momentum
    chapter: 角动量与氢原子
    title: 角动量的量子化
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 经典的陀螺，角动量可以指向任意方向、大小任意。量子力学里，粒子的角动量在 $z$ 方向的分量可以取哪些值？
          options:
            - text: 只能取 $\hbar$ 的整数倍中的几个值
              correct: true
            - text: 任意值，只要不超过角动量的大小
              why: 角动量的分量也是可测量，对应的算符有分立的本征值，只能取 $m\hbar$
            - text: 只能是 0 或者等于角动量的大小
              why: 中间的值也可以取：$l = 2$ 时 $L_z$ 可以是 $-2\hbar$、$-\hbar$、0、$\hbar$、$2\hbar$
          explain: 角动量的分量只能是 $\hbar$ 的整数倍，而且有上下限。这一课讲它可以取哪些值，以及为什么角动量不能完全指向 $z$ 方向。
      - card:
          title: 角动量算符的对易关系
          body: |
            角动量 $\vec L = \vec r\times\vec p$，各分量换成算符，例如 $\hat L_z = \hat x\hat p_y - \hat y\hat p_x$。用 $[\hat x, \hat p_x] = i\hbar$（不同方向的位置和动量对易）可以算出

            $$[\hat L_x, \hat L_y] = i\hbar\hat L_z,\quad [\hat L_y, \hat L_z] = i\hbar\hat L_x,\quad [\hat L_z, \hat L_x] = i\hbar\hat L_y$$

            三个分量两两不对易，一般不能同时确定两个分量。但大小的平方 $\hat L^2 = \hat L_x^2 + \hat L_y^2 + \hat L_z^2$ 和每个分量都对易，所以可以找 $\hat L^2$ 和 $\hat L_z$ 的共同本征态。
      - card:
          title: 本征值
          body: |
            解出的本征值是

            $$L^2 = l(l + 1)\hbar^2,\quad l = 0, 1, 2, \dots;\qquad L_z = m\hbar,\quad m = -l, -l + 1, \dots, l$$

            $l$ 叫**角量子数（orbital quantum number）**，决定角动量的大小 $|L| = \sqrt{l(l + 1)}\,\hbar$；$m$ 叫**磁量子数（magnetic quantum number）**，决定 $z$ 分量。给定 $l$，$m$ 有 $2l + 1$ 个取值。
      - item:
          id: l2-magnitude
          type: number
          prompt: 角量子数 $l = 2$ 时，角动量的大小是 $\hbar$ 的几倍？（保留三位小数）
          answer: 2.449
          tolerance: 0.001
          hint: 大小是 $\sqrt{l(l + 1)}\,\hbar$，$l = 2$ 时根号里是多少？
          explain: $|L| = \sqrt{2\times3}\,\hbar = \sqrt6\,\hbar = 2.449\hbar$，比 $L_z$ 的最大值 $2\hbar$ 大。
      - item:
          id: l3-m-count
          type: number
          prompt: 角量子数 $l = 3$ 时，磁量子数 $m$ 有几个可能的取值？
          answer: 7
          hint: $m$ 从 $-l$ 到 $l$，每次加 1，一共几个？
          explain: $m = -3, -2, -1, 0, 1, 2, 3$，共 $2l + 1 = 7$ 个。
      - card:
          title: 矢量模型
          body: |
            $L_z$ 最大是 $l\hbar$，而 $|L| = \sqrt{l(l + 1)}\,\hbar$ 总比它大，所以角动量永远不能完全指向 $z$ 方向。可以把它想成一根长 $|L|$ 的箭头，和 $z$ 轴成一定角度，$\cos\theta = m/\sqrt{l(l + 1)}$，箭头在一个圆锥面上，$L_x$、$L_y$ 不确定。$l = 0$ 是唯一的例外，三个分量都是 0。
      - item:
          id: l2-min-angle
          type: number
          prompt: $l = 2$ 时，角动量和 $z$ 轴之间可能的最小夹角是多少度？
          answer: 35.26
          tolerance: 0.05
          unit: °
          hint: 夹角最小时 $m$ 取多少？$\cos\theta$ 等于 $L_z$ 除以什么？
          explain: $m = 2$ 时 $\cos\theta = 2/\sqrt6 = 0.816$，$\theta = 35.3°$。即使取最大的 $m$，角动量也偏离 $z$ 轴 35°。
      - item:
          id: why-not-along-z
          type: choice
          prompt: 一个 $l = 1$ 的状态，为什么角动量不能正好指向 $z$ 方向？
          options:
            - text: 那样三个分量会同时确定，违反对易关系
              correct: true
            - text: 角动量太小，转不到正好沿 $z$ 方向的位置
              why: 问题不在大小：$l$ 再大，$|L| = \sqrt{l(l + 1)}\,\hbar$ 也总比 $L_z$ 的最大值 $l\hbar$ 大一点
            - text: 磁场总把它推离 $z$ 轴
              why: 这里没有外磁场，结论只来自角动量算符的对易关系
          explain: 若 $\vec L$ 正好沿 $z$ 轴，三个分量就同时确定（$L_x = L_y = 0$），违反 $[\hat L_x, \hat L_y] = i\hbar\hat L_z$ 带来的不确定关系。所以 $|L|$ 总比 $|L_z|$ 大，$\sqrt2\,\hbar > \hbar$。
      - card:
          title: 角动量的升降算符
          body: |
            和谐振子一样，可以定义 $\hat L_\pm = \hat L_x \pm i\hat L_y$。由对易关系可以证明：作用在 $L_z = m\hbar$ 的本征态上，$\hat L_+$ 把 $m$ 加 1，$\hat L_-$ 把 $m$ 减 1，$L^2$ 不变。$m$ 不能无限增大（$L_z^2$ 不能超过 $L^2$），所以有一个最高的 $m$，对它 $\hat L_+$ 只能给出 0。由这个条件可以推出 $L^2 = l(l + 1)\hbar^2$，最高的 $m$ 就是 $l$。
      - item:
          id: l-plus-top
          type: choice
          prompt: 一个状态 $l = 2$、$m = 2$。用 $\hat L_+$ 作用在它上面，结果是什么？
          options:
            - text: 0，因为 $m$ 已经是最大值
              correct: true
            - text: $l = 2$、$m = 3$ 的状态
              why: $l = 2$ 时 $m$ 最大是 2；$m = 3$ 会让 $L_z^2 = 9\hbar^2$ 超过 $L^2 = 6\hbar^2$
            - text: $l = 3$、$m = 3$ 的状态
              why: $\hat L_\pm$ 和 $\hat L^2$ 对易，不改变 $l$，只改变 $m$
          explain: 升算符不改变 $l$，只能把 $m$ 加 1；$m = l$ 是最高一级，再往上不存在，结果是 0。这和谐振子 $\hat a_-\psi_0 = 0$ 是同一个思路，只是这里梯子有顶。
      - card:
          title: 分子的转动能级
          body: |
            双原子分子可以绕质心转动，转动惯量 $I$，经典的转动动能是 $L^2/2I$。量子化以后

            $$E_l = \frac{l(l + 1)\hbar^2}{2I},\qquad l = 0, 1, 2, \dots$$

            相邻能级的间隔随 $l$ 增大。分子从 $l = 0$ 跳到 $l = 1$ 吸收的光子在微波区，射电天文学家就用这条谱线在星际空间里找一氧化碳分子。
      - item:
          id: co-rotation
          type: number
          prompt: 一氧化碳分子的转动惯量 $I = 1.449\times10^{-46}$ kg·m²。它从 $l = 0$ 跳到 $l = 1$ 吸收的光子，波长是多少毫米？$\hbar = 1.055\times10^{-34}$ J·s，$h = 6.626\times10^{-34}$ J·s，$c = 3.00\times10^8$ m/s。
          answer: 2.59
          tolerance: 0.01
          unit: mm
          hint: $E_1 - E_0$ 用 $\hbar$ 和 $I$ 怎样表示？
          explain: $E_1 - E_0 = \dfrac{2\hbar^2}{2I} = \dfrac{\hbar^2}{I} = 7.67\times10^{-23}$ J，$\lambda = hc/\Delta E = 2.59\times10^{-3}$ m $= 2.59$ mm，频率约 116 GHz，在微波区。
  - id: hydrogen-atom
    chapter: 角动量与氢原子
    title: 氢原子
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 玻尔模型说，氢原子基态的电子在半径 $a_0 = 0.0529$ nm 的圆轨道上运动。量子力学的说法是什么？
          options:
            - text: 电子没有确定的轨道，离核 $a_0$ 处找到它的可能最大
              correct: true
            - text: 和玻尔模型一样，电子在半径 $a_0$ 的圆上运动
              why: 不确定关系不允许电子同时有确定的位置和动量，也就没有确定的轨道
            - text: 电子均匀地分布在原子里，哪里都一样可能
              why: 离核越远，波函数越小；在各个距离上找到电子的概率不同，$a_0$ 附近最大
          explain: 量子力学只给出电子在各处出现的概率。基态的电子在各个距离上都可能出现，最可能的距离恰好是玻尔半径。
      - card:
          title: 三维的薛定谔方程
          body: |
            氢原子里电子的势能 $V = -ke^2/r$ 只和到核的距离有关。定态薛定谔方程在三维里用球坐标（距离 $r$ 和两个角度）解，波函数分成两部分相乘：只和 $r$ 有关的径向部分，和只和角度有关的部分。角度部分正是 $\hat L^2$ 和 $\hat L_z$ 的共同本征函数，带来量子数 $l$ 和 $m$；径向方程又带来一个整数 $n$。解出的能级

            $$E_n = -\frac{13.6\text{ eV}}{n^2}$$

            和玻尔模型的相同。$n$ 叫**主量子数（principal quantum number）**。
      - card:
          title: 三个量子数的取值
          body: |
            给定 $n$，角量子数可以取 $l = 0, 1, \dots, n - 1$；给定 $l$，磁量子数可以取 $m = -l, \dots, l$。一组 $(n, l, m)$ 确定一个状态。

            习惯上用字母表示 $l$：$l = 0, 1, 2, 3$ 分别叫 s、p、d、f。把 $n$ 写在前面：“3d”就是 $n = 3$、$l = 2$。
      - item:
          id: n3-states
          type: number
          prompt: 每组 $(n, l, m)$ 算一个状态。氢原子 $n = 3$ 的能级一共有几个不同的状态？
          answer: 9
          hint: $l$ 可以取哪几个值？每个 $l$ 有几个 $m$？
          explain: $l = 0, 1, 2$，各有 1、3、5 个 $m$，共 $1 + 3 + 5 = 9 = 3^2$ 个状态，能量都是 $-13.6/9 = -1.51$ eV。
      - item:
          id: impossible-orbital
          type: choice
          prompt: 下面哪个记号表示的状态在氢原子里不存在？
          options:
            - text: 2d
              correct: true
            - text: 3p
              why: $n = 3$ 时 $l$ 可以取 0、1、2，p 是 $l = 1$，存在
            - text: 4f
              why: $n = 4$ 时 $l$ 最大是 3，f 是 $l = 3$，存在
          explain: d 是 $l = 2$，要求 $n \ge 3$。$n = 2$ 时 $l$ 只能是 0 或 1，只有 2s 和 2p。
      - card:
          title: 简并
          body: |
            氢原子的能量只由 $n$ 决定，同一个 $n$ 下不同的 $l$、$m$ 能量相同。几个不同的状态有相同的能量，叫**简并（degeneracy）**，这样的状态数叫简并度。对每个 $l$ 有 $2l + 1$ 个 $m$，加起来

            $$\sum_{l=0}^{n-1}(2l + 1) = n^2$$

            所以只数 $(n, l, m)$ 时，第 $n$ 个能级的简并度是 $n^2$。
      - item:
          id: n4-degeneracy
          type: number
          prompt: 只数 $(n, l, m)$ 三个量子数，氢原子 $n = 4$ 的能级简并度是多少？
          answer: 16
          hint: 简并度和 $n$ 是什么关系？也可以把 $l = 0$ 到 $3$ 的 $2l + 1$ 加起来。
          explain: $1 + 3 + 5 + 7 = 16 = 4^2$。
      - card:
          title: 例题：基态电子最可能离核多远
          body: 氢原子基态 $\psi_{1s} = \dfrac{1}{\sqrt{\pi a_0^3}}e^{-r/a_0}$。求电子最可能出现在离核多远处。
          reveal:
            - title: 第 1 步：写出距离在 r 到 r + dr 之间的概率
              body: 这是一个半径 $r$、厚 $dr$ 的薄球壳，体积 $4\pi r^2dr$。概率 $= |\psi|^2\times4\pi r^2dr$，所以径向概率密度 $P(r) = 4\pi r^2|\psi|^2 = \dfrac{4r^2}{a_0^3}e^{-2r/a_0}$。
            - title: 第 2 步：求 P(r) 的最大值
              body: $\dfrac{d}{dr}\left(r^2e^{-2r/a_0}\right) = \left(2r - \dfrac{2r^2}{a_0}\right)e^{-2r/a_0} = 0$，得 $r = a_0$。
            - title: 第 3 步：说出结果
              body: 最可能的距离是 $a_0 = 0.0529$ nm，正是玻尔半径。但电子在其他距离上也有一定概率，距离的平均值是 $1.5a_0$。
      - item:
          id: density-vs-radial
          type: choice
          prompt: 氢原子基态的概率密度 $|\psi_{1s}|^2$ 在核所在处（$r = 0$）最大，可是最可能的距离却是 $a_0$。为什么两者不矛盾？
          options:
            - text: 球壳体积 $4\pi r^2dr$ 随 $r$ 增大
              correct: true
            - text: 核所在处被原子核占着，电子进不去，那里的概率其实是零
              why: 波函数在 $r = 0$ 处不为零，电子有一定概率出现在核附近；差别来自球壳的体积
            - text: 其中一个算错了，两者应该在同一处
              why: 两个量问的不是一件事：一个是单位体积的概率，一个是单位距离的概率
          explain: $|\psi|^2$ 是单位体积里的概率，$P(r) = 4\pi r^2|\psi|^2$ 是单位距离上的概率。$r$ 很小时球壳体积趋于零，所以 $P(r)$ 从 0 升起，在 $a_0$ 处最大。
      - card:
          title: 节点
          body: |
            氢原子的波函数也有节点：径向部分在 $n - l - 1$ 个距离上为零（球面节点），角度部分有 $l$ 个节点面。所以 1s 没有节点；2s 有一个球面节点；2p 没有球面节点，但有一个穿过核的节点面。$n$ 越大，节点越多，能量越高，和一维势阱的规律一致。
      - item:
          id: radial-nodes
          type: number
          prompt: 氢原子 3s 态的波函数，径向部分有几个节点（不算 $r = 0$ 和无穷远）？
          answer: 2
          hint: 径向节点数等于 $n - l - 1$。3s 的 $n$ 和 $l$ 各是多少？
          explain: 3s 是 $n = 3$、$l = 0$，径向节点 $3 - 0 - 1 = 2$ 个，是两个球面；3p 有 1 个，3d 有 0 个。
      - item:
          id: lyman-alpha
          type: number
          prompt: 氢原子从 $n = 2$ 跃迁到 $n = 1$ 放出的光子（赖曼 $\alpha$ 线），波长是多少纳米？用 $E_n = -13.6\text{ eV}/n^2$，$hc = 1240\ \text{eV·nm}$。
          answer: 121.6
          tolerance: 0.3
          unit: nm
          hint: 两个能级的差是多少电子伏特？
          explain: $\Delta E = 13.6\times(1 - 1/4) = 10.2$ eV，$\lambda = 1240/10.2 = 121.6$ nm，在紫外区，地面上看不到，要靠太空望远镜观测。
  - id: orbital-magnetic-moment
    chapter: 角动量与氢原子
    title: 轨道磁矩和塞曼效应
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 绕核运动的电子像一个小电流环。把氢原子放进磁场，原来同一个能级的几个状态（$l$ 相同、$m$ 不同）的能量会怎样？
          options:
            - text: 按 $m$ 分开，变成几个能量略有不同的能级
              correct: true
            - text: 仍然一样，磁场对束缚的电子不起作用
              why: 电流环在磁场里的能量取决于它和磁场的夹角，磁矩方向不同，能量就不同
            - text: 一起升高同样多
              why: 不同 $m$ 的磁矩在磁场方向的分量不同，有的能量升高、有的降低
          explain: 不同 $m$ 的状态磁矩在磁场方向的分量不同，能量随之分开。这一课算出分开多少。
      - card:
          title: 例题：电流环的磁矩和角动量
          body: 电子（质量 $m_e$、电荷 $-e$）以速度 $v$ 绕核做半径 $r$ 的圆周运动。求它的磁矩和角动量的关系。
          reveal:
            - title: 第 1 步：算等效电流
              body: 电子每转一圈用时 $T = 2\pi r/v$，相当于电流 $I = e/T = \dfrac{ev}{2\pi r}$。
            - title: 第 2 步：算磁矩
              body: 磁矩是电流乘面积：$\mu = I\cdot\pi r^2 = \dfrac{evr}{2}$。
            - title: 第 3 步：和角动量比较
              body: 角动量 $L = m_evr$，所以 $\mu = \dfrac{e}{2m_e}L$。电子带负电，磁矩方向和角动量相反：$\vec\mu = -\dfrac{e}{2m_e}\vec L$。这个关系对量子力学的轨道角动量同样成立。
      - card:
          title: 玻尔磁子
          body: |
            $L_z = m\hbar$，所以轨道磁矩的 $z$ 分量是

            $$\mu_z = -\frac{e}{2m_e}L_z = -m\mu_B,\qquad \mu_B = \frac{e\hbar}{2m_e}$$

            $\mu_B$ 叫**玻尔磁子（Bohr magneton）**，是原子磁矩的天然单位，$\mu_B = 9.27\times10^{-24}$ J/T $= 5.79\times10^{-5}$ eV/T。
      - item:
          id: bohr-magneton
          type: number
          prompt: 用 $e = 1.602\times10^{-19}$ C、$\hbar = 1.055\times10^{-34}$ J·s、$m_e = 9.109\times10^{-31}$ kg 算玻尔磁子。结果是 $N\times10^{-24}$ J/T，$N$ 是多少？
          answer: 9.277
          tolerance: 0.005
          hint: $\mu_B = e\hbar/(2m_e)$，先算分子再除以分母。
          explain: $\mu_B = 1.602\times10^{-19}\times1.055\times10^{-34}/(2\times9.109\times10^{-31}) = 9.28\times10^{-24}$ J/T。用更精确的常数是 $9.274\times10^{-24}$ J/T。
      - card:
          title: 塞曼效应
          body: |
            磁矩和磁场成 $\theta$ 角时受力矩 $\mu B\sin\theta$，把它从顺着磁场转到 $\theta$ 要克服这个力矩做功，积出来能量是 $U = -\mu B\cos\theta = -\mu_zB$：顺着磁场时最低。代入 $\mu_z = -m\mu_B$（磁场沿 $z$），$U = m\mu_BB$。原来能量相同的 $2l + 1$ 个状态按 $m$ 分开，相邻两个差 $\mu_BB$。原子放进磁场后谱线分裂成几条，叫**塞曼效应（Zeeman effect）**。

            这里只算了绕核运动带来的轨道磁矩。电子还有别的磁矩来源，真实原子里大多数谱线分裂的样子比这复杂，叫反常塞曼效应。
      - item:
          id: zeeman-2t
          type: number
          prompt: 一个 $l = 1$ 的能级放进 2 T 的磁场。相邻两个 $m$ 的能量相差 $N\times10^{-4}$ eV，$N$ 是多少？$\mu_B = 5.79\times10^{-5}$ eV/T。
          answer: 1.158
          tolerance: 0.005
          hint: 相邻两个 $m$ 的能量差是 $\mu_B$ 乘什么？
          explain: $\Delta E = \mu_BB = 5.79\times10^{-5}\times2 = 1.16\times10^{-4}$ eV，比原子能级的几个电子伏特小四五个数量级，只是很细的分裂。
      - item:
          id: zeeman-d-width
          type: number
          prompt: 只考虑轨道磁矩，一个 $l = 2$ 的能级放进 2 T 的磁场。分裂后最高和最低的能级相差 $N\times10^{-4}$ eV，$N$ 是多少？$\mu_B = 5.79\times10^{-5}$ eV/T。
          answer: 4.632
          tolerance: 0.005
          hint: 最高和最低的能级各对应哪个 $m$？中间隔了几个间距？
          explain: $m$ 从 $-2$ 到 $2$，分成 5 个等间距的能级，最高和最低差 4 个间距：$4\mu_BB = 4\times5.79\times10^{-5}\times2 = 4.63\times10^{-4}$ eV。
      - item:
          id: s-no-split
          type: choice
          prompt: 只考虑轨道磁矩，为什么 s 态（$l = 0$）在磁场中不分裂？
          options:
            - text: 没有轨道角动量，也就没有轨道磁矩
              correct: true
            - text: s 态的电子离核太近，感受不到外磁场
              why: s 态电子同样处在外磁场中；不分裂是因为它的轨道角动量为零，没有轨道磁矩
            - text: s 态的能量太低，磁场的能量不够把它分开
              why: 分裂和能量高低无关，只看有几个 $m$；$l = 0$ 只有一个 $m$
          explain: $l = 0$ 时 $L = 0$，$m$ 只能是 0，$U = m\mu_BB = 0$，没有可以分开的状态。实际的 s 态在磁场里仍会分成两个，原因是电子本身还带着一个和绕核运动无关的磁矩。
      - item:
          id: zeeman-wavelength
          type: number
          prompt: 波长 656.3 nm 的谱线，在 1 T 磁场中，能量差 $\Delta E = \mu_BB = 5.79\times10^{-5}$ eV 对应的波长差是多少纳米？用 $\Delta\lambda = \lambda^2\Delta E/(hc)$，$hc = 1240\ \text{eV·nm}$。
          answer: 0.0201
          tolerance: 0.0002
          unit: nm
          hint: 把 $\lambda = 656.3$ nm、$\Delta E$ 和 $hc$ 代进去，单位都用 eV 和 nm。
          explain: $\Delta\lambda = 656.3^2\times5.79\times10^{-5}/1240 = 0.0201$ nm。$\lambda = hc/E$，能量变一点点，波长变 $\lambda^2\Delta E/hc$。0.02 nm 的分裂要用高分辨率的光谱仪才看得出。
      - item:
          id: sunspot-field
          type: choice
          prompt: 1908 年海尔第一次测出了太阳黑子里的磁场（约 0.3 T）。他测的是什么？
          options:
            - text: 黑子发出的谱线分裂成几条，分开的大小正比于磁场
              correct: true
            - text: 用指南针在地面上测太阳磁场对它的作用
              why: 太阳的磁场传到地球已经极弱，而且分不出黑子的；海尔是从光谱里读出磁场的
            - text: 黑子的颜色比周围暗，暗的程度正比于磁场
              why: 黑子暗是因为温度低，暗的程度不能直接给出磁场大小；谱线分裂才和磁场成正比
          explain: 塞曼分裂 $\Delta E = \mu_BB$ 和磁场成正比。测出谱线分开多少，就能算出远处的磁场，天文学家至今仍用这种方法测恒星和太阳表面的磁场。
  - id: stern-gerlach
    chapter: 自旋
    title: 施特恩–格拉赫实验和电子自旋
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一束银原子（每个原子像一个小磁针）穿过一块一边强、一边弱的磁铁之间的缝，再打到屏上。小磁针的方向原本是随机的。屏上会看到什么？
          options:
            - text: 上下分开的两个斑点
              correct: true
            - text: 一条连续的竖线，因为磁针可以朝任何方向
              why: 这是经典的预言；实验看到的是分开的两点，说明磁矩在磁场方向的分量只有两个值
            - text: 一个斑点，磁场不会让原子偏转
              why: 磁场一边强一边弱时，磁矩受到一个净的力，原子会偏转
          explain: 1922 年施特恩和格拉赫做这个实验，屏上只出现两个斑点。磁矩在磁场方向的分量只能取两个值，这一课讲它的来历。
      - card:
          title: 施特恩–格拉赫实验
          body: |
            磁矩在均匀磁场里只受力矩，不受净力；磁场沿 $z$ 方向一边强一边弱时，受力 $F_z = \mu_z\dfrac{dB}{dz}$，偏转的大小正比于磁矩的 $z$ 分量 $\mu_z$。

            银原子最外层只有一个电子，处在 $l = 0$ 的 s 态，其余电子的磁矩互相抵消，所以没有轨道磁矩。如果磁矩方向随机，屏上应该是连续的一片；实际只有两个斑点，说明 $\mu_z$ 只有一正一负两个值。
      - card:
          title: 电子的自旋
          body: |
            轨道角动量给出 $2l + 1$ 个 $m$，总是奇数个，不可能是两个。两个值说明电子自己还带着一种角动量，叫**自旋（spin）**，它的量子数是 $s = \tfrac12$：

            $$S^2 = s(s + 1)\hbar^2 = \frac34\hbar^2,\qquad S_z = m_s\hbar,\quad m_s = \pm\frac12$$

            自旋是电子固有的性质，就像电荷和质量一样，不能把它理解成一个小球在自转。质子、中子也有 $s = \tfrac12$ 的自旋。
      - item:
          id: spin-magnitude
          type: number
          prompt: 电子自旋角动量的大小是 $\hbar$ 的几倍？（保留三位小数）
          answer: 0.866
          tolerance: 0.001
          hint: $|S| = \sqrt{s(s + 1)}\,\hbar$，$s = \tfrac12$ 时根号里是多少？
          explain: $|S| = \sqrt{\tfrac12\times\tfrac32}\,\hbar = \sqrt{3/4}\,\hbar = 0.866\hbar$，比 $S_z$ 的 $\tfrac12\hbar$ 大，和轨道角动量一样不能完全指向 $z$ 轴。
      - item:
          id: spin-angle
          type: number
          prompt: 电子处在 $m_s = +\tfrac12$ 的状态。自旋角动量和 $z$ 轴的夹角是多少度？
          answer: 54.74
          tolerance: 0.05
          unit: °
          hint: $\cos\theta = S_z/|S|$，两个量各是 $\hbar$ 的几倍？
          explain: $\cos\theta = 0.5/0.866 = 0.577$，$\theta = 54.7°$。
      - card:
          title: 自旋磁矩
          body: |
            自旋也带来磁矩，但比例和轨道的不一样：

            $$\mu_z = -g\frac{e}{2m_e}S_z,\qquad g \approx 2$$

            轨道磁矩相当于 $g = 1$，电子自旋的 $g = 2.0023$，所以 $\mu_z \approx \mp\mu_B$。在磁场 $B$ 中，自旋向上和向下的能量相差约 $2\mu_BB$。用频率合适的微波照射，电子吸收光子把自旋翻过来，这叫电子自旋共振，化学和材料研究用它探测不成对的电子。
      - item:
          id: esr-frequency
          type: number
          prompt: 在 0.35 T 的磁场中，取 $g = 2$，电子自旋向上和向下的能量差是 $2\mu_BB$。让自旋翻转的微波频率是多少吉赫兹？$\mu_B = 9.274\times10^{-24}$ J/T，$h = 6.626\times10^{-34}$ J·s。
          answer: 9.80
          tolerance: 0.02
          unit: GHz
          hint: 光子能量 $hf$ 要等于哪个能量差？
          explain: $f = 2\mu_BB/h = 2\times9.274\times10^{-24}\times0.35/6.626\times10^{-34} = 9.80\times10^9$ Hz。常见的电子自旋共振谱仪正是在 0.35 T 左右用约 9.8 GHz 的微波。
      - item:
          id: why-silver
          type: choice
          prompt: 施特恩–格拉赫实验用的是银原子。它最外层电子处在 s 态，这一点为什么重要？
          options:
            - text: s 态没有轨道磁矩，看到的分裂只来自自旋
              correct: true
            - text: s 态的电子离核最远，最容易被磁场拉走
              why: 磁场不会把电子从原子里拉出来，整个原子一起偏转；关键是轨道磁矩为零
            - text: s 态的能量最高，偏转最明显
              why: 偏转只看磁矩的 $z$ 分量，和能量高低无关
          explain: $l = 0$ 时没有轨道角动量，也就没有轨道磁矩；其余电子的磁矩又两两抵消。所以那两个斑点直接显示了一个电子自旋的两个取值。
      - card:
          title: 自旋–轨道耦合和精细结构
          body: |
            站在电子上看，原子核绕着它转，产生一个磁场。电子的自旋磁矩在这个磁场里的能量和自旋相对轨道角动量的方向有关，这叫**自旋–轨道耦合（spin–orbit coupling）**。于是 $l \ge 1$ 的能级分成两个，总角动量量子数 $j = l + \tfrac12$ 和 $j = l - \tfrac12$，能级里的这种细小分裂叫**精细结构（fine structure）**。钠灯的黄光是两条靠得很近的线，589.0 nm 和 589.6 nm，来自 3p 能级的这种分裂。
      - item:
          id: sodium-doublet
          type: number
          prompt: 钠的两条黄线波长是 588.995 nm 和 589.592 nm。两个光子的能量相差多少毫电子伏特（meV）？取 $hc = 1239.84\ \text{eV·nm}$。
          answer: 2.13
          tolerance: 0.01
          unit: meV
          hint: 分别算两个光子的能量，再相减；差很小，计算时多保留几位。
          explain: $1239.84/588.995 = 2.10501$ eV，$1239.84/589.592 = 2.10288$ eV，差 $2.13\times10^{-3}$ eV，约是光子能量的千分之一。这就是 3p 能级的精细结构分裂。
      - item:
          id: n3-with-spin
          type: number
          prompt: 计入自旋，氢原子 $n = 3$ 的能级一共有几个不同的状态？
          answer: 18
          hint: 不计自旋时有几个状态？每个状态的电子自旋有几种取法？
          explain: 不计自旋有 $n^2 = 9$ 个 $(n, l, m)$，每个再配上 $m_s = \pm\tfrac12$ 两种，共 $2n^2 = 18$ 个。
  - id: spin-matrices
    chapter: 自旋
    title: 自旋矩阵和两态系统
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一束电子先通过沿 $z$ 方向的施特恩–格拉赫装置，只留下 $S_z = +\hbar/2$ 的那一束。再让它通过一个沿 $x$ 方向的装置。会怎样？
          options:
            - text: 分成两束，各占一半
              correct: true
            - text: 不分开，全部从中间直着过去，因为 $x$ 分量是 0
              why: $S_x$ 的测量结果也只能是 $\pm\hbar/2$，不会是 0；屏上照样是两个斑点
            - text: 全部偏向 $+x$ 一边，因为原来是“向上”的
              why: $S_z$ 确定为 $+\hbar/2$ 的状态里，$S_x$ 完全不确定，两个结果各有一半可能
          explain: 沿任何方向测自旋都只得到 $\pm\hbar/2$。$S_z$ 确定的状态里 $S_x$ 不确定，两个结果各占一半。这一课用矩阵算这些概率。
      - card:
          title: 自旋态的写法
          body: |
            自旋只有两个基本状态：$S_z = +\hbar/2$（向上）和 $S_z = -\hbar/2$（向下）。任意自旋态是它们的叠加，写成一列两个复数：

            $$\chi = \begin{pmatrix}a\\ b\end{pmatrix} = a\begin{pmatrix}1\\ 0\end{pmatrix} + b\begin{pmatrix}0\\ 1\end{pmatrix},\qquad |a|^2 + |b|^2 = 1$$

            测 $S_z$ 得到向上的概率是 $|a|^2$，向下是 $|b|^2$。只有两个基本状态的系统叫两态系统。
      - card:
          title: 泡利矩阵
          body: |
            自旋分量的算符写成 $2\times2$ 矩阵，$\hat S_x = \tfrac\hbar2\sigma_x$，$\hat S_y = \tfrac\hbar2\sigma_y$，$\hat S_z = \tfrac\hbar2\sigma_z$，其中

            $$\sigma_x = \begin{pmatrix}0 & 1\\ 1 & 0\end{pmatrix},\quad \sigma_y = \begin{pmatrix}0 & -i\\ i & 0\end{pmatrix},\quad \sigma_z = \begin{pmatrix}1 & 0\\ 0 & -1\end{pmatrix}$$

            叫**泡利矩阵（Pauli matrices）**。三个都是厄米矩阵，本征值都是 $\pm1$，所以每个方向的自旋分量都只能测到 $\pm\hbar/2$。$\sigma_x$ 的本征向量是 $\tfrac{1}{\sqrt2}(1, 1)$（$S_x = +\hbar/2$）和 $\tfrac{1}{\sqrt2}(1, -1)$（$S_x = -\hbar/2$）。
      - item:
          id: up-measure-x
          type: number
          prompt: 电子处在 $S_z = +\hbar/2$ 的状态 $\begin{pmatrix}1\\ 0\end{pmatrix}$。测 $S_x$ 得到 $+\hbar/2$ 的概率是多少？
          answer: 0.5
          tolerance: 0.001
          hint: 把状态按 $\sigma_x$ 的两个本征向量展开，系数各是多少？
          explain: $\begin{pmatrix}1\\ 0\end{pmatrix} = \tfrac{1}{\sqrt2}\left[\tfrac{1}{\sqrt2}\begin{pmatrix}1\\ 1\end{pmatrix}\right] + \tfrac{1}{\sqrt2}\left[\tfrac{1}{\sqrt2}\begin{pmatrix}1\\ -1\end{pmatrix}\right]$。方括号里是归一化的两个本征向量，前面的 $1/\sqrt2$ 是展开系数，概率是它的平方 $1/2$。
      - item:
          id: spinor-prob
          type: number
          prompt: 电子的自旋态是 $\chi = \begin{pmatrix}0.6\\ 0.8\end{pmatrix}$。测 $S_z$ 得到 $+\hbar/2$ 的概率是多少？
          answer: 0.36
          tolerance: 0.001
          hint: 向上的概率是哪个分量的模的平方？
          explain: $|a|^2 = 0.6^2 = 0.36$，向下的概率 $0.8^2 = 0.64$，加起来是 1。
      - item:
          id: spinor-mean-sz
          type: number
          prompt: 电子的自旋态是 $\chi = \begin{pmatrix}0.6\\ 0.8\end{pmatrix}$。$S_z$ 的期望值是 $\hbar$ 的几倍？
          answer: -0.14
          tolerance: 0.001
          hint: 两个结果 $\pm\hbar/2$ 的概率各是多少？按概率加权平均。
          explain: $\langle S_z\rangle = 0.36\times\tfrac\hbar2 + 0.64\times(-\tfrac\hbar2) = -0.14\hbar$。向下的可能更大，所以平均值是负的。
      - card:
          title: 例题：沿斜方向的自旋
          body: 在 $x$–$z$ 平面里，和 $z$ 轴成 $\theta$ 角的方向上自旋为 $+\hbar/2$ 的状态是 $\chi = \begin{pmatrix}\cos(\theta/2)\\ \sin(\theta/2)\end{pmatrix}$。取 $\theta = 60°$，测 $S_z$ 得到 $+\hbar/2$ 的概率是多少？
          reveal:
            - title: 第 1 步：检查几个特殊角
              body: $\theta = 0$ 得 $(1, 0)$，就是向上；$\theta = 90°$ 得 $\tfrac{1}{\sqrt2}(1, 1)$，就是 $S_x = +\hbar/2$；$\theta = 180°$ 得 $(0, 1)$，向下。公式和已知的结果对得上。
            - title: 第 2 步：算概率
              body: 向上的概率 $\cos^2(\theta/2) = \cos^230° = 0.75$。
            - title: 第 3 步：和偏振比较
              body: 这和偏振光通过偏振片的马吕斯定律很像，只是角度要取一半：自旋方向转 180° 才变成相反的状态，而偏振方向转 90° 就完全挡住。
      - item:
          id: tilted-120
          type: number
          prompt: 电子自旋沿和 $z$ 轴成 120° 的方向（在 $x$–$z$ 平面里）为 $+\hbar/2$。测 $S_z$ 得到 $+\hbar/2$ 的概率是多少？
          answer: 0.25
          tolerance: 0.001
          hint: 概率是 $\cos^2(\theta/2)$，$\theta/2$ 是多少度？
          explain: $\cos^260° = 0.25$。自旋方向偏离 $z$ 轴越多，测到“向上”的概率越小，转到 180° 时为 0。
      - card:
          title: 连续几个装置
          body: |
            先用沿 $z$ 的装置只留下向上的一束，再用沿 $x$ 的装置只留下 $S_x = +\hbar/2$ 的一束，最后再沿 $z$ 测。结果又是一半向上、一半向下：测 $S_x$ 让状态坍缩成 $S_x$ 的本征态，原来 $S_z$ 确定的信息被抹掉了。$\sigma_x$ 和 $\sigma_z$ 不对易，两个分量不能同时确定。
      - item:
          id: sg-chain
          type: number
          prompt: 一束电子先通过沿 $z$ 的装置，只留 $S_z = +\hbar/2$；再通过沿 $x$ 的装置，只留 $S_x = +\hbar/2$；最后通过沿 $z$ 的装置，只留 $S_z = -\hbar/2$。最后留下的电子占第一个装置后那一束的几分之几？（填小数）
          answer: 0.25
          tolerance: 0.001
          hint: 第二个装置留下几分之几？第三个装置又留下几分之几？
          explain: $z$ 向上的状态测 $S_x$，留下一半；$S_x$ 向上的状态再测 $S_z$，向下的又占一半。$\tfrac12\times\tfrac12 = 0.25$。如果没有中间那个 $x$ 装置，最后一个装置留下的是 0。
      - card:
          title: 自旋进动和核磁共振
          body: |
            把自旋放进沿 $z$ 方向的磁场，它不会转到磁场方向停下，而是像倾斜的陀螺一样绕 $z$ 轴转动，这叫进动，角频率 $\omega = g\mu_BB/\hbar$，和磁场成正比。质子也有自旋和磁矩，它在磁场里的进动频率是每特斯拉 42.58 MHz。医院的磁共振成像（MRI）就是让人体里水分子中氢原子核的自旋进动，用射频线圈接收它们发出的信号来成像。
      - item:
          id: mri-frequency
          type: number
          prompt: 质子自旋在磁场中的进动频率是每特斯拉 42.58 MHz。一台 3 T 的磁共振成像设备，射频线圈要工作在多少兆赫兹？
          answer: 127.7
          tolerance: 0.2
          unit: MHz
          hint: 进动频率和磁场是什么关系？
          explain: 频率和磁场成正比，$42.58\times3 = 127.7$ MHz，比调频电台的波段（88–108 MHz）还高一些。磁场越强，频率越高，信号也越强。
  - id: identical-particles
    chapter: 全同粒子与泡利不相容
    title: 全同粒子、费米子和玻色子
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 两个电子在一个盒子里运动，过了一会儿你测到一个在左边、一个在右边。能不能说出左边的这个是“原来的第一个电子”还是“第二个”？
          options:
            - text: 不能，电子完全一样，也没有轨迹
              correct: true
            - text: 能，只要一直盯着它们的运动轨迹
              why: 量子力学里粒子没有确定的轨迹，两个电子的波函数会交叠，没法一路追踪下来
            - text: 能，给其中一个做个记号就行
              why: 电子没有可以做记号的地方：质量、电荷、自旋都完全相同，任何“记号”都会让它不再是普通的电子
          explain: 同一种粒子在量子力学里是真正不可区分的。这一点会限制两个粒子的波函数能取的形式，带来“两个电子不能处在同一个状态”的规律。
      - card:
          title: 全同粒子
          body: |
            质量、电荷、自旋等内在性质完全相同的粒子叫**全同粒子（identical particles）**，比如所有的电子。经典力学里可以靠轨迹区分两个小球，量子力学里没有轨迹，全同粒子无法区分。

            两个粒子的状态用波函数 $\psi(x_1, x_2)$ 描述。交换两个粒子，所有可测的结果都不能变，所以 $|\psi(x_2, x_1)|^2 = |\psi(x_1, x_2)|^2$。再交换一次要回到原样，于是只有两种可能：$\psi(x_2, x_1) = +\psi(x_1, x_2)$ 或 $-\psi(x_1, x_2)$。
      - card:
          title: 玻色子和费米子
          body: |
            交换后波函数不变（对称）的粒子叫**玻色子（boson）**，交换后变号（反对称）的叫**费米子（fermion）**。实验发现这由自旋决定：自旋是整数（0、1、2……）的是玻色子，如光子；自旋是半整数（1/2、3/2……）的是费米子，如电子、质子、中子。由几个粒子组成的原子也一样看总自旋：氦-4 原子由偶数个费米子组成，总自旋是整数，是玻色子。
      - item:
          id: which-fermion
          type: choice
          prompt: 下面哪一个是费米子？
          options:
            - text: 中子
              correct: true
            - text: 光子
              why: 光子的自旋是 1，整数，是玻色子
            - text: 氦-4 原子
              why: 它由 2 个质子、2 个中子、2 个电子组成，6 个费米子的总自旋是整数，所以整个原子是玻色子
          explain: 中子的自旋是 1/2，是费米子。判断的规则只看自旋是整数还是半整数。
      - card:
          title: 泡利不相容原理
          body: |
            两个粒子分别处在单粒子状态 $a$ 和 $b$。对费米子，反对称的波函数是

            $$\psi(x_1, x_2) = \frac{1}{\sqrt2}\left[\psi_a(x_1)\psi_b(x_2) - \psi_b(x_1)\psi_a(x_2)\right]$$

            如果 $a = b$，方括号里两项相同，$\psi = 0$，这样的状态不存在。所以两个全同的费米子不能处在同一个量子态，这就是**泡利不相容原理（Pauli exclusion principle）**。对电子，“量子态”包括自旋：同一个空间状态最多放两个电子，自旋一上一下。玻色子没有这个限制。
      - item:
          id: same-orbital-spin
          type: choice
          prompt: 一个原子里两个电子处在同一个空间状态（$n$、$l$、$m$ 都相同）。它们的自旋必须怎样？
          options:
            - text: 一个向上、一个向下
              correct: true
            - text: 都向上，这样能量最低
              why: 自旋也相同的话，两个电子的全部量子数就都一样，违反泡利不相容原理
            - text: 没有要求，自旋和空间状态无关
              why: 泡利不相容原理说的是完整的量子态，包括自旋；空间状态相同时只能靠自旋区分
          explain: 四个量子数 $n$、$l$、$m$、$m_s$ 全同的两个电子不存在。前三个相同，$m_s$ 就必须一个 $+\tfrac12$、一个 $-\tfrac12$，所以每个空间状态最多两个电子。
      - card:
          title: 例题：往势阱里放 5 个电子
          body: 宽 1 nm 的无限深势阱，$E_n = n^2E_1$，$E_1 = 0.376$ eV。放进 5 个电子，忽略电子之间的相互作用。求基态（总能量最低的状态）的总能量。
          reveal:
            - title: 第 1 步：每个能级能放几个
              body: 每个 $n$ 是一个空间状态，自旋一上一下，最多放 2 个电子。
            - title: 第 2 步：从低到高填
              body: $n = 1$ 放 2 个，$n = 2$ 放 2 个，第 5 个只能放到 $n = 3$。
            - title: 第 3 步：加起来
              body: $E = 2E_1 + 2\times4E_1 + 9E_1 = 19E_1 = 7.14$ eV。如果电子可以挤在一起，5 个都放 $n = 1$ 只要 $5E_1 = 1.88$ eV；不相容原理让总能量高了很多。
      - item:
          id: three-electrons
          type: number
          prompt: 宽 1 nm 的无限深势阱，$E_1 = 0.376$ eV。放进 3 个电子（忽略相互作用），基态总能量是多少电子伏特？
          answer: 2.256
          tolerance: 0.005
          unit: eV
          hint: $n = 1$ 能放几个？第 3 个放到哪里？
          explain: 2 个在 $n = 1$，1 个在 $n = 2$：$E = 2E_1 + 4E_1 = 6E_1 = 2.26$ eV。
      - item:
          id: three-bosons
          type: number
          prompt: 宽 1 nm 的无限深势阱，$E_1 = 0.376$ eV。放进 3 个没有自旋的玻色子（质量和电子相同，忽略相互作用），基态总能量是多少电子伏特？
          answer: 1.128
          tolerance: 0.005
          unit: eV
          hint: 玻色子受不受不相容原理的限制？
          explain: 玻色子可以都待在同一个状态，3 个都在 $n = 1$：$E = 3E_1 = 1.13$ eV，只有电子情形的一半。
      - card:
          title: 费米能
          body: |
            $N$ 个电子从最低的能级往上，每级两个地填满，最上面那个被占据的能级的能量叫**费米能（Fermi energy）**。金属里每立方厘米有约 $10^{23}$ 个能自由移动的电子，即使在绝对零度，它们也要一直填到几个电子伏特高，大多数电子的动能远大于热运动的 $kT \approx 0.026$ eV。这是不相容原理的直接结果，金属和硅这类材料的导电性质都离不开这一点。
      - item:
          id: ten-electrons-top
          type: number
          prompt: 宽 1 nm 的无限深势阱，$E_1 = 0.376$ eV。放进 10 个电子（忽略相互作用），基态里被占据的最高能级的能量是多少电子伏特？
          answer: 9.4
          tolerance: 0.02
          unit: eV
          hint: 10 个电子每级两个，要填到第几级？
          explain: 10 个电子填满 $n = 1$ 到 $5$，最高的是 $n = 5$：$25E_1 = 9.40$ eV。这就是这个系统的费米能，电子越多，它越高。
      - item:
          id: laser-bosons
          type: choice
          prompt: 一束激光里有大量光子处在同一个状态（同频率、同方向、同相位）。为什么电子不能像这样大量挤在同一个状态里？
          options:
            - text: 电子是费米子，同一个量子态最多一个
              correct: true
            - text: 电子带负电，互相排斥，挤不到一起
              why: 不带电的中子同样不能处在同一个状态；限制来自费米子的反对称性，不是电荷
            - text: 电子有质量，光子没有
              why: 有质量的玻色子（如氦-4 原子）可以大量处在同一个状态，在极低温下形成玻色–爱因斯坦凝聚
          explain: 光子是玻色子，可以任意多个处在同一个状态；电子是费米子，受不相容原理限制。决定这一点的是自旋，不是电荷或质量。
  - id: periodic-table
    chapter: 全同粒子与泡利不相容
    title: 四个量子数和周期表
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 锂、钠、钾都是很软、遇水剧烈反应的金属，化学性质很像。猜猜它们的原子有什么共同点？
          options:
            - text: 最外层都只有一个电子
              correct: true
            - text: 原子核里的质子数一样多
              why: 质子数不同正是它们成为不同物质的原因：锂 3 个、钠 11 个、钾 19 个
            - text: 原子的大小一样
              why: 钾原子比锂原子大得多；化学性质主要由最外层的电子决定
          explain: 化学反应主要由最外层的电子参与。锂、钠、钾的电子按不相容原理一层层填好后，最外面都剩一个电子，所以性质相似。
      - card:
          title: 四个量子数
          body: |
            原子里每个电子的状态由四个量子数确定：主量子数 $n$，角量子数 $l$，磁量子数 $m_l$（前面写作 $m$，这里为了和 $m_s$ 区分加上下标），自旋磁量子数 $m_s = \pm\tfrac12$。泡利不相容原理说，一个原子里没有两个电子的四个量子数全部相同。

            $n$ 相同的电子组成一个**壳层（shell）**，$n$、$l$ 都相同的组成一个**支壳层（subshell）**。支壳层里有 $2l + 1$ 个 $m_l$，每个放两个电子，所以 s、p、d、f 支壳层最多放 2、6、10、14 个电子；第 $n$ 个壳层最多放 $2n^2$ 个。
      - item:
          id: shell-n3
          type: number
          prompt: $n = 3$ 的壳层最多能放几个电子？
          answer: 18
          hint: 这个壳层有哪几个支壳层？各放几个？
          explain: 3s 放 2 个、3p 放 6 个、3d 放 10 个，共 18 个，等于 $2n^2 = 2\times9$。
      - item:
          id: f-subshell
          type: number
          prompt: f 支壳层（$l = 3$）最多能放几个电子？
          answer: 14
          hint: $l = 3$ 时 $m_l$ 有几个取值？每个放几个电子？
          explain: $m_l$ 有 $2\times3 + 1 = 7$ 个，每个放 2 个电子，共 14 个。周期表里镧系那一排正是在填 4f 支壳层。
      - card:
          title: 填充顺序和电子组态
          body: |
            多电子原子里，内层电子挡住了一部分核电荷，外层电子感到的吸引变弱。s 电子有较大的概率钻到靠近核的地方，被挡得少，能量比同一个 $n$ 的 p、d 电子低。所以能量不再只由 $n$ 决定，填充顺序大致是

            1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p, 5s, 4d, 5p, …

            按这个顺序把电子从低往高填，每个支壳层右上角写上电子数，叫**电子组态（electron configuration）**。氧有 8 个电子：$1s^22s^22p^4$。
      - item:
          id: sodium-config
          type: choice
          prompt: 钠原子有 11 个电子。它的基态电子组态是什么？
          options:
            - text: $1s^22s^22p^63s^1$
              correct: true
            - text: $1s^22s^22p^7$
              why: 2p 支壳层最多放 6 个电子，第 7 个只能进入下一个支壳层 3s
            - text: $1s^22s^22p^53s^2$
              why: 2p 还没填满时，电子会先填能量更低的 2p，基态不会空着 2p 去填 3s
          explain: 1s 放 2、2s 放 2、2p 放 6，共 10 个，第 11 个进 3s。最外面只有一个 3s 电子，和锂（$2s^1$）、钾（$4s^1$）一样。
      - card:
          title: 元素周期表
          body: |
            原子核里质子数相同的一类原子叫一种**元素（element）**，质子数 $Z$ 叫原子序数，中性原子有 $Z$ 个电子。按 $Z$ 排列，电子组态一层层填下去：每开始填一个新的 s 支壳层就开始新的一行（周期），最外层组态相同的元素排在同一列（族），化学性质相似。最外层 s、p 填满（$s^2p^6$）的是稀有气体，很难发生反应；只比填满多一个电子的是锂、钠、钾这样的碱金属，容易失去它；只差一个的是氟、氯这样的卤素，容易再接受一个电子。
      - item:
          id: period-two
          type: number
          prompt: 周期表的第二行（第二周期）从锂开始，填 2s 和 2p 支壳层，到氖填满为止。这一行有几种元素？
          answer: 8
          hint: 2s 和 2p 一共能放几个电子？每多一个电子就是下一种元素。
          explain: 2s 放 2 个、2p 放 6 个，共 8 个电子位置，从锂（$Z = 3$）到氖（$Z = 10$）正好 8 种元素。
      - item:
          id: first-4s
          type: number
          prompt: 按填充顺序 1s, 2s, 2p, 3s, 3p, 4s, …，第一个有 4s 电子的元素原子序数是多少？
          answer: 19
          hint: 把 4s 之前的支壳层全部填满要多少个电子？
          explain: 1s、2s、2p、3s、3p 共 $2 + 2 + 6 + 2 + 6 = 18$ 个电子，到氩为止；第 19 个电子进 4s，是钾（$Z = 19$），所以钾排在钠的下面。
      - card:
          title: 硅的四个价电子
          body: |
            最外层参与成键的电子叫**价电子（valence electron）**。硅 $Z = 14$：$1s^22s^22p^63s^23p^2$，最外层 $n = 3$ 有 4 个电子，在晶体里和周围 4 个硅原子各共用一对电子。锗（$Z = 32$）的最外层也是 4 个电子（$4s^24p^2$）。硅和锗的导电能力介于导体和绝缘体之间，叫**半导体（semiconductor）**，是做晶体管的材料。往里面掺入最外层有 5 个或 3 个电子的原子，就能改变它的导电性。
      - item:
          id: silicon-valence
          type: number
          prompt: 硅原子 $Z = 14$。它最外层（$n = 3$）有几个电子？
          answer: 4
          hint: 先写出电子组态，$n = 3$ 的支壳层里一共有几个电子？
          explain: $1s^22s^22p^6$ 用掉 10 个，剩下 4 个是 $3s^23p^2$，所以硅有 4 个价电子。
      - item:
          id: phosphorus-extra
          type: choice
          prompt: 硅晶体里每个原子用 4 个价电子成键。往硅里掺进少量下面哪种原子，会多出一个没有参与成键的电子？
          options:
            - text: 磷（$Z = 15$）
              correct: true
            - text: 硼（$Z = 5$）
              why: 硼是 $1s^22s^22p^1$，最外层只有 3 个电子，成键时反而少一个
            - text: 锗（$Z = 32$）
              why: 锗最外层也是 4 个电子，和硅一样，不多不少
          explain: 磷是 $1s^22s^22p^63s^23p^3$，最外层 5 个电子，用掉 4 个和硅成键后多出 1 个，这个电子很容易移动，让硅更能导电。
  - id: xrays
    chapter: 全同粒子与泡利不相容
    title: 原子光谱和 X 射线
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: X 射线管里，电子经过 30 kV 的电压加速后撞上金属靶，发出 X 射线。发出的 X 射线波长有没有一个最短值？
          options:
            - text: 有，由加速电压决定，电压越高越短
              correct: true
            - text: 没有，波长可以任意短
              why: 一个光子的能量不可能超过一个电子带来的全部动能 $eV$，所以波长有下限
            - text: 有，由靶的材料决定，换电压不变
              why: 靶的材料决定的是几条特征谱线的位置；最短波长只由电子的动能，也就是电压决定
          explain: 一个电子最多把它的全部动能 $eV$ 交给一个光子，这个光子的波长最短。这一课算出这个波长，再讲靶材料决定的特征谱线。
      - card:
          title: 选择定则
          body: |
            原子跃迁时放出一个光子，光子带走 $\hbar$ 的角动量。由角动量守恒和光子本身的性质可以推出，最常见的跃迁要满足

            $$\Delta l = \pm1,\qquad \Delta m = 0, \pm1$$

            这叫跃迁的**选择定则（selection rule）**。2p→1s 可以发生，2s→1s 却不行（$\Delta l = 0$），处在 2s 的氢原子要停留得久得多，只能通过别的、慢得多的方式回到基态。
      - item:
          id: allowed-transition
          type: choice
          prompt: 按选择定则 $\Delta l = \pm1$，下面哪个跃迁可以放出一个光子？
          options:
            - text: 3d → 2p
              correct: true
            - text: 3d → 1s
              why: d 是 $l = 2$，s 是 $l = 0$，$\Delta l = -2$，不满足选择定则
            - text: 3s → 2s
              why: 两个都是 $l = 0$，$\Delta l = 0$，不满足选择定则
          explain: 3d → 2p 的 $l$ 从 2 变到 1，$\Delta l = -1$，允许。能量够不够不是限制，角动量守恒才是。
      - card:
          title: X 射线管的连续谱
          body: |
            X 射线管里，电子经电压 $V$ 加速，带着动能 $eV$ 撞进金属靶，在原子核附近急剧减速，放出 X 射线。减速的方式各种各样，所以 X 射线的波长连成一片，叫连续谱。但一个电子最多把全部动能交给一个光子，所以有一个最短波长：

            $$\lambda_{\min} = \frac{hc}{eV}$$

            它只和电压有关，和靶的材料无关。这又是光子说的一个证据：按连续的电磁波，不该有这样一条截然的边界。
      - item:
          id: lambda-min
          type: number
          prompt: X 射线管的加速电压是 30 kV。它发出的 X 射线最短波长是多少皮米？取 $hc = 1240\ \text{eV·nm}$。
          answer: 41.3
          tolerance: 0.1
          unit: pm
          hint: 一个电子的动能是多少电子伏特？
          explain: 电子动能 30 keV $= 30000$ eV，$\lambda_{\min} = 1240/30000 = 0.0413$ nm $= 41.3$ pm。电压加倍，最短波长减半。
      - card:
          title: 特征谱线和莫塞莱定律
          body: |
            连续谱上还叠着几条很尖的峰，位置由靶的材料决定，叫特征谱线。高速电子把靶原子最内层（$n = 1$，K 壳层）的一个电子打出去，留下一个空位，$n = 2$ 的电子落进来，放出 K$_\alpha$ 线。K 壳层本来是满的，按不相容原理，没有空位外层电子就落不进去。

            落下来的电子感到的核电荷，被剩下的那个 1s 电子挡掉约一个，相当于 $Z - 1$。套用类氢原子的能级 $-13.6(Z - 1)^2/n^2$ eV：

            $$E_{K\alpha} \approx 13.6\left(1 - \frac14\right)(Z - 1)^2 = 10.2(Z - 1)^2\ \text{eV}$$

            这叫**莫塞莱定律（Moseley's law）**。1913 年莫塞莱用它确认，周期表的排序依据是核电荷数 $Z$。
      - card:
          title: 例题：铜靶的 K-alpha 线
          body: 铜的 $Z = 29$。估算铜靶 K$_\alpha$ 线的光子能量和波长（$hc = 1.240$ keV·nm）。
          reveal:
            - title: 第 1 步：代入莫塞莱定律
              body: $E \approx 10.2\times(29 - 1)^2 = 10.2\times784 = 7997$ eV，约 8.0 keV。
            - title: 第 2 步：换成波长
              body: $\lambda = 1.240/7.997 = 0.155$ nm。
            - title: 第 3 步：和测量值比较
              body: 实测铜的 K$_\alpha$ 线是 8.05 keV、0.154 nm，估算差不到 1%。这条线和晶体里原子的间距差不多，是 X 射线衍射测晶体结构时最常用的光源。
      - item:
          id: iron-kalpha
          type: number
          prompt: 铁的 $Z = 26$。用莫塞莱定律 $E \approx 10.2(Z - 1)^2$ eV 估算铁的 K$_\alpha$ 线光子能量，是多少千电子伏特？
          answer: 6.375
          tolerance: 0.01
          unit: keV
          hint: $Z - 1$ 是多少？它的平方乘 10.2 eV 是多少？
          explain: $10.2\times25^2 = 6375$ eV $= 6.38$ keV（实测 6.40 keV）。原子序数越大，K$_\alpha$ 线能量越高，按 $(Z - 1)^2$ 增长。
      - item:
          id: identify-z
          type: number
          prompt: 某种未知金属靶的 K$_\alpha$ 线测得 8.04 keV。用莫塞莱定律 $E \approx 10.2(Z - 1)^2$ eV 推算，它的原子序数是多少？（填整数）
          answer: 29
          tolerance: 0.5
          hint: 先由 $E/10.2$ 求出 $(Z - 1)^2$，再开方。
          explain: $(Z - 1)^2 = 8040/10.2 = 788$，$Z - 1 = 28.1$，$Z \approx 29$，是铜。莫塞莱当年就是这样确定各元素在周期表里的位置的，还据此预言了几种当时没发现的元素。
      - item:
          id: line-vs-voltage
          type: choice
          prompt: 把 X 射线管的电压从 30 kV 升到 40 kV（都够把 K 壳层的电子打出去），连续谱的最短波长和特征谱线的波长各怎样变？
          options:
            - text: 最短波长变短，特征谱线的波长不变
              correct: true
            - text: 两者都变短
              why: 特征谱线的能量是靶原子两个能级之差，只由靶的材料决定，和电子带来多少能量无关
            - text: 最短波长不变，特征谱线变短
              why: 最短波长 $hc/eV$ 随电压升高而变短；特征谱线反而不随电压变
          explain: $\lambda_{\min} = hc/eV$ 由电压决定，40 kV 时是 31.0 pm；特征谱线是靶原子内层能级之差，电压只要够打出 K 电子，它的位置就不变，只是更强。
  - id: lasers
    chapter: 全同粒子与泡利不相容
    title: 激光
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 灯泡发出的光朝四面八方、各种频率混在一起；激光却频率单一、方向集中、各处步调一致。猜猜激光里的光子是怎样产生的？
          options:
            - text: 一个光子引发原子放出和它一样的光子
              correct: true
            - text: 每个原子各自随机地发光，只是用透镜把光聚拢了
              why: 透镜能让光集中，却不能让各个原子发出的光频率相同、步调一致
            - text: 用滤光片把灯泡的光里其他颜色滤掉
              why: 滤光后频率是单一了，但光很弱，各处的相位仍然杂乱，不是激光
          explain: 激光（laser）是英文“受激发出辐射使光放大”的缩写：一个光子引发出一模一样的光子，越来越多。这一课讲这个过程要满足什么条件。
      - card:
          title: 吸收、自发辐射和受激辐射
          body: |
            原子有两个能级，差 $\Delta E$。光和原子之间有三种过程：

            1. 吸收：低能级的原子吸收一个能量为 $\Delta E$ 的光子，升到高能级。
            2. **自发辐射（spontaneous emission）**：高能级的原子自己跳下来放出光子，方向和相位都是随机的，灯泡和日光灯的光都来自它。
            3. **受激辐射（stimulated emission）**：能量为 $\Delta E$ 的光子经过高能级的原子，促使它跳下来，放出一个和入射光子频率、方向、相位、偏振都相同的光子。光子是玻色子，可以大量处在同一个状态。
      - item:
          id: stimulated-photon
          type: choice
          prompt: 受激辐射放出的光子和引发它的那个光子相比，怎样？
          options:
            - text: 频率、方向、相位和偏振都相同
              correct: true
            - text: 频率相同，方向随机
              why: 方向随机的是自发辐射；受激辐射的光子连方向也和入射光子一样
            - text: 能量是入射光子的 2 倍
              why: 放出的光子能量等于两个能级之差，和入射光子一样；结果是两个相同的光子，不是一个能量加倍的光子
          explain: 受激辐射产生的光子是入射光子的复制品。一个变两个、两个变四个，光就被放大了，而且所有光子处在同一个状态。
      - card:
          title: 为什么平时放大不起来
          body: |
            受激辐射和吸收的概率相同，哪个占上风取决于高、低能级上的原子哪个多。热平衡时按玻尔兹曼分布（和大气里分子数随高度减少是同一条规律），两个能级上的原子数之比是

            $$\frac{N_2}{N_1} = e^{-\Delta E/kT}$$

            室温 $kT \approx 0.026$ eV，可见光的 $\Delta E$ 约 2 eV，高能级上的原子极少，光子多半被吸收掉。要放大，必须让高能级上的原子比低能级的多，这叫**粒子数反转（population inversion）**。
      - item:
          id: hene-boltzmann
          type: number
          prompt: 氦氖激光器发 632.8 nm 的红光，对应的两个能级差 $\Delta E = 1240/632.8$ eV。在 300 K（$kT = 0.02586$ eV）的热平衡下，$\Delta E/kT$ 是多少？
          answer: 75.8
          tolerance: 0.2
          hint: 先算 $\Delta E$ 是多少电子伏特，再除以 $kT$。
          explain: $\Delta E = 1.960$ eV，$\Delta E/kT = 1.960/0.02586 = 75.8$。$N_2/N_1 = e^{-75.8} \approx 10^{-33}$，热平衡下高能级几乎是空的，不可能放大，必须另想办法把原子“泵”上去。
      - card:
          title: 亚稳态和抽运
          body: |
            用电流、闪光灯或别的光源不断把原子送到高能级，叫抽运。原子很快离开这一级的话，还是攒不起来。办法是利用**亚稳态（metastable state）**：原子被抽运上去后很快落到它上面，而它的寿命长（有的达到毫秒级，普通激发态只有纳秒级），原子越积越多，就和下面的能级形成反转。

            三能级系统（如 1960 年的红宝石激光器）的下能级就是基态，要抽走一半以上的原子才能反转；四能级系统的下能级本来几乎是空的，更容易反转。氦氖激光器里，放电把氦送到亚稳态，氦把能量交给氖，氖的下能级又很快被抽空。
      - item:
          id: why-metastable
          type: choice
          prompt: 激光器为什么要用寿命长的亚稳态作为激光的上能级？
          options:
            - text: 原子停得久，才能积累到比下能级多
              correct: true
            - text: 寿命长的能级发出的光波长更短
              why: 波长由两个能级的差决定，和寿命长短无关
            - text: 亚稳态的原子不会自发辐射，所以没有损耗
              why: 亚稳态也会自发辐射，只是慢得多；正因为慢，原子才来得及积累
          explain: 原子到了上能级如果纳秒级就掉下来，抽运再快也攒不起来。亚稳态的寿命长上百万倍，原子能积累起来形成粒子数反转。
      - card:
          title: 谐振腔
          body: |
            把能放大光的介质（如红宝石棒、氦氖气体）放在两面平行的反射镜之间，一面全反射、一面透过百分之几。沿轴线的光来回反射，每经过一次就被受激辐射放大一次，偏离轴线的光很快跑出去，所以激光方向集中。腔里只能存在两镜之间正好放下整数个半波长的驻波，叫**纵模（longitudinal mode）**，相邻两个纵模的频率差

            $$\Delta f = \frac{c}{2L}$$

            叫纵模间隔。透过的那一面镜子输出的就是激光。
      - item:
          id: mode-spacing
          type: number
          prompt: 一台激光器的两面反射镜相距 30 cm。腔里相邻两个纵模的频率差是多少兆赫兹？$c = 3.00\times10^8$ m/s。
          answer: 500
          tolerance: 1
          unit: MHz
          hint: 两端固定的驻波，相邻频率差是 $c/2L$。
          explain: $\Delta f = 3.00\times10^8/(2\times0.30) = 5.00\times10^8$ Hz $= 500$ MHz，和两端固定的弦的基频是同一个公式。
      - item:
          id: hene-photons
          type: number
          prompt: 一台 5 mW 的氦氖激光器发 632.8 nm 的光，一个光子能量 1.960 eV。它每秒发出 $N\times10^{16}$ 个光子，$N$ 是多少？$1\text{ eV} = 1.602\times10^{-19}$ J。
          answer: 1.59
          tolerance: 0.01
          hint: 5 mW 是每秒多少焦耳？一个光子多少焦耳？
          explain: 一个光子 $1.960\times1.602\times10^{-19} = 3.14\times10^{-19}$ J，$5\times10^{-3}/3.14\times10^{-19} = 1.59\times10^{16}$ 个/秒，它们几乎全部处在同一个状态。
      - card:
          title: 半导体激光器
          body: |
            半导体激光器只有米粒大小，在两种掺杂不同的半导体交界处通入电流，让交界附近形成粒子数反转，电子从高能级落到低能级放出光子；晶体两端沿晶面劈开的平整端面就当反射镜。光纤通信用 1310 nm 和 1550 nm 两个波段的半导体激光器，因为石英光纤在 1550 nm 处损耗最低，在 1310 nm 处色散最小、损耗也低。光盘、条码扫描器和激光雷达用的也大多是它。
      - item:
          id: fiber-photon
          type: number
          prompt: 光纤通信常用 1550 nm 的激光。这个波长的光子能量是多少电子伏特？取 $hc = 1240\ \text{eV·nm}$。
          answer: 0.8
          tolerance: 0.005
          unit: eV
          hint: 光子能量和波长成反比。
          explain: $E = 1240/1550 = 0.80$ eV。半导体激光器发出的光子能量由材料里两个能级的差决定，做 1550 nm 的激光器要选能级差约 0.8 eV 的半导体材料（如铟镓砷磷这类化合物半导体）。
boss:
  items:
    - id: b-photoelectric
      type: number
      prompt: 钨的逸出功约 4.5 eV。用波长 200 nm 的紫外光照射钨，遏止电压是多少伏特？取 $hc = 1240\ \text{eV·nm}$。
      answer: 1.7
      tolerance: 0.01
      unit: V
      hint: 一个光子的能量减去逸出功，剩下的是什么？
      explain: 光子能量 $1240/200 = 6.20$ eV，光电子最大动能 $6.20 - 4.5 = 1.70$ eV，挡住它要 1.70 V 的反向电压。
    - id: b-de-broglie
      type: number
      prompt: 电子从静止经过 200 V 电压加速，德布罗意波长是多少纳米？可以用 $\lambda \approx 1.226/\sqrt{U}$ nm。
      answer: 0.0867
      tolerance: 0.0005
      unit: nm
      hint: 200 的平方根是多少？
      explain: $\lambda = 1.226/\sqrt{200} = 1.226/14.14 = 0.0867$ nm。电压越高，动量越大，波长越短。
    - id: b-bohr-line
      type: number
      prompt: 氢原子从 $n = 5$ 跃迁到 $n = 2$，放出的光子波长是多少纳米？用 $E_n = -13.6\text{ eV}/n^2$，$hc = 1240\ \text{eV·nm}$。
      answer: 434.2
      tolerance: 0.5
      unit: nm
      hint: 两个能级的差是多少电子伏特？
      explain: $\Delta E = 13.6\times(1/4 - 1/25) = 2.856$ eV，$\lambda = 1240/2.856 = 434$ nm，是巴耳末系里紫色的 H$\gamma$ 线。
    - id: b-uncertainty
      type: number
      prompt: 一个质子被限制在原子核大小的范围里，取 $\Delta x = 1.0\times10^{-14}$ m。它速度的不确定量至少是 $N\times10^6$ m/s，$N$ 是多少？$\hbar = 1.055\times10^{-34}$ J·s，质子质量 $1.673\times10^{-27}$ kg。
      answer: 3.15
      tolerance: 0.02
      hint: 由 $\Delta x\,\Delta p \ge \hbar/2$ 求最小的 $\Delta p$，再除以质量。
      explain: $\Delta v \ge \hbar/(2m\Delta x) = 1.055\times10^{-34}/(2\times1.673\times10^{-27}\times10^{-14}) = 3.15\times10^6$ m/s，约光速的 1%。核里的质子在不停地快速运动。
    - id: b-normalize
      type: number
      prompt: 一个粒子的波函数在 $0 \le x \le 1$ nm 内是 $\psi = Ax(1 - x^2)$（$x$ 以 nm 计），其余地方为 0。归一化以后 $A^2$ 是多少（单位 $\text{nm}^{-7}$）？保留三位小数。
      answer: 13.125
      tolerance: 0.001
      hint: $|\psi|^2$ 展开成几项？在 0 到 1 上积分各是多少？
      explain: $x^2(1 - x^2)^2 = x^2 - 2x^4 + x^6$，$\int_0^1 = \tfrac13 - \tfrac25 + \tfrac17 = \tfrac{8}{105}$，所以 $A^2\cdot\tfrac{8}{105} = 1$，$A^2 = 105/8 = 13.125$。
    - id: b-well-transition
      type: number
      prompt: 电子在宽 0.80 nm 的无限深势阱里（宽 1.00 nm 时基态能量是 0.376 eV）。电子从 $n = 3$ 跃迁到 $n = 1$，放出的光子波长是多少纳米？取 $hc = 1240\ \text{eV·nm}$。
      answer: 263.8
      tolerance: 1
      unit: nm
      hint: 先由 $E_1 \propto 1/L^2$ 求这个阱的基态能量，$E_3 - E_1$ 是它的几倍？
      explain: $E_1 = 0.376/0.8^2 = 0.5875$ eV，$E_3 - E_1 = 8E_1 = 4.70$ eV，$\lambda = 1240/4.70 = 264$ nm，在紫外区。
    - id: b-tunnel
      type: number
      prompt: 能量 2 eV 的电子射向高 6 eV、宽 0.30 nm 的方势垒，$\kappa = 10.25\ \text{nm}^{-1}$。按 $T \approx e^{-2\kappa a}$ 估算，透射概率是 $N\times10^{-3}$，$N$ 是多少？
      answer: 2.13
      tolerance: 0.02
      hint: $2\kappa a$ 是多少？
      explain: $2\kappa a = 2\times10.25\times0.30 = 6.15$，$e^{-6.15} = 2.13\times10^{-3}$。势垒高出电子能量 4 eV，和 1 eV 撞 5 eV 的情形 $\kappa$ 相同，宽度更窄，所以透射概率大得多。
    - id: b-ladder
      type: number
      prompt: 用降算符 $\hat a_-$ 连续作用两次在谐振子的 $\psi_4$ 上，结果是 $c\,\psi_2$。系数 $c$ 是多少？（保留三位小数）
      answer: 3.464
      tolerance: 0.002
      hint: 降算符每用一次，前面乘的系数和当时的 $n$ 有什么关系？
      explain: $\hat a_-\psi_4 = \sqrt4\,\psi_3$，$\hat a_-\psi_3 = \sqrt3\,\psi_2$，$c = \sqrt4\times\sqrt3 = \sqrt{12} = 3.464$。能量从 $4.5\hbar\omega$ 降到 $2.5\hbar\omega$。
    - id: b-measure-mean
      type: number
      prompt: 宽 1 nm 的势阱，$E_1 = 0.376$ eV，$E_n = n^2E_1$。电子处在 $\psi = \sqrt{0.2}\,\psi_1 + \sqrt{0.8}\,\psi_2$。能量的期望值是多少电子伏特？
      answer: 1.278
      tolerance: 0.005
      unit: eV
      hint: 两个结果的概率各是多少？
      explain: 概率 0.2 和 0.8，$\langle E\rangle = 0.2E_1 + 0.8\times4E_1 = 3.4E_1 = 1.28$ eV。
    - id: b-collapse
      type: choice
      prompt: 电子处在 $\psi = \sqrt{0.2}\,\psi_1 + \sqrt{0.8}\,\psi_2$。测一次能量得到 $E_1$。测量之后电子处在什么状态？
      options:
        - text: $\psi_1$
          correct: true
        - text: 仍是 $\sqrt{0.2}\,\psi_1 + \sqrt{0.8}\,\psi_2$
          why: 测量会让状态坍缩；测得 $E_1$ 以后，状态就是 $E_1$ 对应的本征态
        - text: $\psi_2$，因为 $\psi_1$ 那部分已经被测走了
          why: 测得哪个本征值，就坍缩到哪个本征态；测得 $E_1$ 对应的是 $\psi_1$
        - text: $\tfrac{1}{\sqrt2}(\psi_1 + \psi_2)$，两部分变得一样多
          why: 测量不会把系数拉平；测量后只剩下测到的那一个本征态
      explain: 测得本征值 $E_1$ 后，状态坍缩成对应的本征态 $\psi_1$，紧接着再测能量一定还是 $E_1$。
    - id: b-l-angle
      type: number
      prompt: 角量子数 $l = 3$ 时，角动量和 $z$ 轴之间可能的最小夹角是多少度？
      answer: 30
      tolerance: 0.05
      unit: °
      hint: 夹角最小时 $m$ 取多少？角动量的大小是 $\hbar$ 的几倍？
      explain: $m = 3$，$|L| = \sqrt{12}\,\hbar$，$\cos\theta = 3/\sqrt{12} = 0.866$，$\theta = 30°$。
    - id: b-zeeman
      type: number
      prompt: 只考虑轨道磁矩，一个 $l = 1$ 的能级放进 1.5 T 的磁场。相邻两个 $m$ 的能量相差 $N\times10^{-5}$ eV，$N$ 是多少？$\mu_B = 5.788\times10^{-5}$ eV/T。
      answer: 8.68
      tolerance: 0.02
      hint: 相邻两个 $m$ 的能量差是 $\mu_B$ 乘什么？
      explain: $\Delta E = \mu_BB = 5.788\times10^{-5}\times1.5 = 8.68\times10^{-5}$ eV。
    - id: b-spin-tilt
      type: number
      prompt: 电子自旋沿和 $z$ 轴成 45° 的方向（在 $x$–$z$ 平面里）为 $+\hbar/2$。测 $S_z$ 得到 $+\hbar/2$ 的概率是多少？（保留三位小数）
      answer: 0.854
      tolerance: 0.002
      hint: 自旋方向和 $z$ 轴夹角 45°，概率公式里的角度该取多少？
      explain: $\cos^2(22.5°) = 0.854$。注意角度要取一半：用 $\cos^245° = 0.5$ 是把自旋当成偏振光了。
    - id: b-pauli-seven
      type: number
      prompt: 宽 1 nm 的无限深势阱，$E_1 = 0.376$ eV。放进 7 个电子（忽略相互作用），基态总能量是多少电子伏特？
      answer: 16.54
      tolerance: 0.05
      unit: eV
      hint: 每个能级放 2 个电子，7 个要填到第几级？
      explain: $n = 1, 2, 3$ 各放 2 个，第 7 个放到 $n = 4$：$E = 2(1 + 4 + 9)E_1 + 16E_1 = 44E_1 = 16.5$ eV。
    - id: b-exclusion
      type: choice
      prompt: 碳原子有 6 个电子，基态电子组态是 $1s^22s^22p^2$。为什么 6 个电子不能都待在能量最低的 1s 上？
      options:
        - text: 1s 只有一个空间状态，按泡利不相容原理最多放两个自旋相反的电子
          correct: true
        - text: 电子之间互相排斥，6 个挤在一起能量太高，原子会散开
          why: 排斥确实存在，但即使不计排斥，费米子也不能处在同一个量子态；限制来自不相容原理
        - text: 1s 离核太近，放不下那么多电子
          why: 能放几个电子不由大小决定，而由状态数决定：1s 只有 $m_l = 0$ 一个空间状态
        - text: 1s 还能放下更多电子，只要它们的自旋各不相同
          why: 电子的自旋只有向上、向下两种，1s 放满两个以后，再没有不同的自旋可选
      explain: 1s 的 $n = 1$、$l = 0$、$m_l = 0$ 都确定，只剩自旋可以不同，所以最多两个。其余 4 个只能依次填进 2s 和 2p。
    - id: b-moseley
      type: number
      prompt: 镍的 $Z = 28$。用莫塞莱定律 $E \approx 10.2(Z - 1)^2$ eV 估算镍的 K$_\alpha$ 线光子能量，是多少千电子伏特？
      answer: 7.436
      tolerance: 0.01
      unit: keV
      hint: $Z - 1$ 是多少？
      explain: $10.2\times27^2 = 7436$ eV $= 7.44$ keV（实测 7.48 keV）。
