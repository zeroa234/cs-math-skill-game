skill: D.1.3
version: 2
authors: [main-agent]
brief:
  why: |
    在 D.1.2 里我们已经能把单机数据库引擎的并发控制、B+ 树与代价优化器打磨得飞快。但只要数据量超过单块硬盘上限、全球多地机房同时要读写，或者一台机器突然整台断网宕机，单台服务器就再也扛不住了。本包建立在 D.1.2 基础之上，带你跨出单机边界进入分布式数据库与 NoSQL 世界：拆解分片与一致性哈希迁键算术、主从复制与读写法定集合、CAP/PACELC 权衡、两阶段提交阻塞恢复与 Raft 共识分工，以及键值（含 Web 旁路缓存 TTL）、宽列、文档与图四大 NoSQL 模型选型。
  outcomes:
    - 对比 OLTP 与 OLAP 负载差异，权衡哈希分片与范围分片并手算一致性哈希新增节点时的键迁移比例 `K/(N+1)` 与传统 `mod N` 全盘重洗差异
    - 比较同步/异步复制代价、理解“读己之写”与 Dynamo `N/W/R` 法定集合交集（明确 `W+R>N` 的能力边界），并用 CAP 与 PACELC 分析系统取舍
    - 区分跨分片原子提交（两阶段提交 2PC 及其协调者崩溃阻塞与推断中止）与单副本组日志一致（Paxos/Raft 共识）的不同定位
    - 为不同场景合理选择键值（配合旁路缓存与 TTL）、宽列（时间序列）、文档（异构嵌套属性）与图数据（多跳路径遍历）模型
terms:
  - term: 分片
    def: 将同一张大型逻辑表按主键范围或散列值横向切分成多个独立片段，分别存储并交由多台不同服务器节点承载的水平扩展技术。
  - term: 一致性哈希
    def: 把服务器节点和键共同映射到同一个首尾相接的哈希环上、键归顺时针首个节点承载，从而在增减节点时仅迁移约 `K/(N+1)` 邻近键的散列分片算法。
  - term: 复制
    def: 在多台服务器节点上保存同一份数据的多个物理副本，用来提高容错高可用性、容忍单机断网与就近分摊读取吞吐。
  - term: 读己之写
    def: 会话级一致性保证：同一位用户刚刚成功修改提交了自己的档案或评论后，紧接着自己再刷新读取时保证绝不会读到未更新的旧副本。
  - term: 法定集合
    def: 分布式存储中每次写入或读取至少需获确认的副本数量门槛（记为 `W` 与 `R`），当总副本数 `N` 满足 `W + R > N` 时读写样本必有交集。
  - term: 网络分区
    def: 机房之间或集群节点之间的通信链路发生断开或超时隔离，导致集群分裂成彼此无法正常收发消息的孤立小组。
  - term: 线性一致性
    def: 最强单对象实时一致保证：所有节点对外表现如同只有 1 份数据存在，任意读请求一旦读到某新版写入，后续任何时刻的读绝不允许倒退回旧版。
  - term: 最终一致性
    def: 弱化实时性的复制模型：若停止所有新写入一段时间后，全部副本最终会同步达成一致结果，但允许期间部分从副本短时读到旧值。
  - term: 共识
    def: 分布式节点群中即使出现少数节点崩溃或丢包，多数派存活节点依然能就一系列状态变更或操作日志的先后顺序达成唯一一致决议的算法（如 Raft、Paxos）。
  - term: 两阶段提交
    def: 跨多个独立数据分片协调分布式事务的原子提交协议：先由协调者向全体参与者发 Prepare 锁资源表决，全部同意后再发 Commit 或任意反对即全体 Abort。
  - term: 缓存
    def: 放在靠近应用或内存中的高速临时键值存储层，用来拦下重复热点读取减轻后端主库压力，并按超时淘汰和失效策略与主库保持同步。
  - term: "TTL"
    def: 生存时间（Time To Live）：写进高速临时存储键上的倒计时过期秒数，到点自动失效驱逐以限定陈旧数据存活上限。

lessons:
  # ======================================================================== 分片
  - id: workloads
    chapter: 分片
    title: 走出单机的动因：OLTP vs OLAP 与 NoSQL 兴起
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 上一站单机引擎再厉害，一旦遇到全球几百万用户同时刷社交动态或秒杀写订单，或者后台需要实时统计几百 TB 历年日志，把所有鸡蛋都装进仅仅 **1** 台昂贵超级大主机（垂直扩展）为什么终究会撞墙？
          options:
            - text: 单台机器内存、硬盘和 CPU 终有物理天花板且极其昂贵，单机一挂全站瘫痪；必须拆成多台普通服务器横向协作（水平扩展），并区分高并发小事务（OLTP）与大扫描分析（OLAP）负载！
              correct: true
            - text: 因为单台物理服务器绝对装不下任何关系型 SQL 引擎
              why: 垂直升级硬件短期有效，但达到硬件顶峰后单价呈指数级飙升且照样存在单点停服隐患
            - text: 因为关系模型永远不适用于银行转账或订单存储
              why: 关系型数据库至今依然稳居严格事务一致性核心账务主力，NoSQL 则作为应对极高规模水平扩展与半结构化/稀疏/多跳数据的有力补充
          explain: 本课梳理从单机走向分布式与 NoSQL 的历史背景与核心业务分流。
      - card:
          title: 两类截然不同的工作负载：OLTP vs OLAP
          body: |
            看清系统面对的究竟是哪一类工作，才能挑对架构：
            - **OLTP（联机事务处理）**：比如网购下单、转账、修改个人资料——每次只查改 **很少几行**、每秒并发几万次、严要求毫秒级延迟与事务原子正确；
            - **OLAP（联机分析处理）**：比如年度全站销售报表、用户画像漏斗统计——一次顺扫**几百万至百亿行**、按几列算聚合求和与趋势，可以容忍秒级耗时但吞吐要求恐怖！
      - card:
          title: 水平扩展与 Web 2.0 时代的 NoSQL 兴起
          body: |
            为了接住 Web 2.0 时代每天亿级并发写入与海量非整齐文档/社交数据，系统开始把压力分散到多台普通廉价机器上：**水平扩展（Scale-Out）**。

            早期传统单机关系库死守强一致性、严格模式与跨表 `JOIN` 反倒在海量水平切分上步履维艰；一批号称 **NoSQL（Not Only SQL）** 的系统主动放松局部跨表复杂连接或改采灵活模型，换取极其容易向成百上千台机器横向扩展和应对各异灵活字段的能力！
      - item:
          id: q-oltp-vs-olap
          type: match
          prompt: 把下面四种典型数据库场景或工程取舍分别归入对应的工作负载与演进特征。
          pairs:
            - [用户点击下单扣减 1 件商品库存并生成唯一订单号（毫秒级点改点查 + 严事务）, "**OLTP（联机事务处理）**"]
            - [数据团队半夜扫描过去 3 年全部 20 亿笔订单的 3 个金额列算季度地区均值, "**OLAP（联机分析处理）**"]
            - [当 1 台超级大主机加满顶配硬件仍装不下，改成用 50 台普通服务器联合分摊数据与流量, "**水平扩展（Scale-Out）**"]
            - [面对每天几亿条字段各不相同的商品快照或社交发帖，适当舍弃跨机强连接换取轻松横向扩机, "**NoSQL 扩展取舍**"]
          explain: 分清你是为“几毫秒精准确认 1 笔钱（OLTP）”服务，还是为“几秒扫干十亿行算总结（OLAP）”服务，接下来挑存储模型和分片策略就全对路了。
      - card:
          title: 例题：为什么把 OLTP 与 OLAP 全混跑在同一台主库上往往两头挨骂？
          body: |
            某小公司把实时交易下单和市场部跑季度大报表的全表 `GROUP BY` 全部接在同一台数据库上。大促下午分析师跑了一条大报表，瞬间把前台收银台拖垮卡死！原因与标准解法看两步：
          reveal:
            - title: 第 1 步：两类负载在 I/O 习惯和缓冲需求上天然掐架
              body: 实时下单希望那几个热点账户和最新库存页老老实实呆在内存里瞬间命中；大报表一上来把陈年 3 年几百 GB 冷数据页大扫一遍，瞬间把内存热点全冲干净（并且长事务拖住 MVCC 垃圾清理还拉高锁冲突！）。
            - title: 第 2 步：生产架构常用只读分析副本或专用列存分析库隔离分流
              body: 正因如此，成熟系统会把核心强一致写入留在 OLTP 主分片上，同时通过流式变更日志（WAL 复制）把数据异步源源不断送进专供报表查询的只读副本或列式 OLAP 引擎里各跑各的，互不干扰！
      - item:
          id: q-scale-up-vs-out
          type: choice
          prompt: 业务访问量两年涨了一百倍，架构师放弃继续加钱买世上最贵的单台巨型主机（Scale-Up 垂直扩展），改采 **Scale-Out（水平扩展）** 拆分到几十台常规机器上。这样改造后立刻需要正面解决哪个原本单机上几乎不存在的新难题？
          options:
            - text: 必须解决跨多台机器的数据切分安置（**分片**）、副本同步（复制）、网络断线失联容错与跨机多份更新的一致性协调问题
              correct: true
            - text: 因为用多台常规机器之后就再也不允许使用任何主键索引了
              why: 每个分片内部照样跑着熟悉的 B+ 树和本地锁机制，新挑战在于怎么跨机器把请求路由对、并在单机宕机或网断时不出错乱
            - text: 因为 Scale-Out 会自动把全部机器物理焊接成同一颗芯片
              why: 多台机器之间隔着普通机房网络，随时存在网络延迟与局部宕机失联风险
          explain: 正因水平扩展引出了 **“怎么按片拆放数据？”** 与 **“怎么跨机器复制协调？”**，我们立刻进入下面两课的核心！
      - item:
          id: q-nosql-meaning
          type: choice
          prompt: 现代软件工程界常把“NoSQL”理解为 **“Not Only SQL”** 而不是“永远禁用一切关系表”。这句话背后的理性取舍是什么？
          options:
            - text: 关系模型+强事务依然最适合结构规整、需要复杂连接与严格一致性的核心账务；针对高频简单键值、多变半结构化文档、宽列时序或深层图遍历等特定工作负载，再精准选用更契合的 NoSQL 数据模型混合搭配
              correct: true
            - text: 只要用了任何一款 NoSQL 数据库，就证明公司彻底摆脱了任何备份、索引和磁盘容量的烦恼
              why: 无论哪一种存储引擎都逃不开硬件容量、索引代价与复制一致性的物理规律
            - text: NoSQL 代表强迫开发者连一句 `SELECT` 都不许学、全部退回纯记事本存文件
              why: 许多现代分布式系统甚至专门为开发者重新提供类 SQL 查询接口（如 NewSQL），只是底层换成了高可扩展分布式架构
          explain: 没有任何技术能靠口号包打天下——认清每种数据模型的甜蜜点与短板才是硬道理！
      - item:
          id: q-olap-columnar-read
          type: choice
          prompt: 当设计只服务高吞吐 **OLAP（联机分析处理）** 的报表仓库（每次查亿行里的仅 2 列金额与地区做求和）时，为什么常把不同列拆成只读分析副本或列式存储格式，而不是直接与在线收银下单库跑在同一主盘？
          options:
            - text: 避免大扫表把 OLTP 高频热数据页挤出内存缓冲池并引发长锁/MVCC 膨大，同时列存只扫描那 2 列大幅减少无效带宽消耗
              correct: true
            - text: 因为 OLAP 系统从不允许读取超过 100 行的数据
              why: OLAP 天生就是面向百万乃至百亿行海量数据扫描汇总的，分离资源只是为了保护延迟敏感的在线 OLTP 主交易稳定
            - text: 因为主库数据库绝不支持执行 `SUM()` 函数
              why: 事务主库同样支持完整 SQL 聚合，隔离或走只读分析副本纯粹出于资源隔离与面向全列读取的架构优化
          explain: “OLTP 与 OLAP 资源分离 + 面向场景挑架构”，是 Web 与大数据工程常见架构演化。

  - id: shards
    chapter: 分片
    title: 水平分区：范围分片 vs 哈希分片与再平衡算术
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你手里有 1,200 万条日志记录要均匀拆给 4 台数据库分片节点保管（每台存 300 万条）。如果图方便按时间或递增编号切“范围分片”（1–300 万放 1 号机，最后 900–1200 万放 4 号机），每天实时涌进来的最新下单记录和最新热看帖子**全部**会集中砸向哪一台机器？
          options:
            - text: 全部死死砸向负责最大编号末尾范围的那 **1 台最新机器（形成严重写入热点）**，另外 3 台空闲看戏！改用按主键做散列拆分的**哈希分片**才能把写入均匀打散给 4 台节点！
              correct: true
            - text: 全世界新订单会自动均等平均写进过去去年的 1 号历史机器里
              why: 按时间或自增 ID 做范围切分，所有当下此刻刚发生的新订单全都拥有最新最大值，必全部落入最后一段范围！
            - text: 只要用范围分片就可以不建任何索引直接秒找单条主键
              why: 无论范围分片还是哈希分片，都先由路由表找对目标分片节点，再到节点内部局部索引定位
          explain: 分清 **分片（Sharding）** 两大经典路线：**范围分片（Range）** 与 **哈希分片（Hash）** 各自的致命短板与适用场。
      - card:
          title: 什么是分片，以及“范围分片 vs 哈希分片”对比
          body: |
            把巨表按行水平拆到多台机器叫 **分片（Sharding）**：
            - **范围分片**：按连续值域分段（`A–F` 在 S1）。区间扫描极快；但按递增时间写入**全流量会挤死末尾热分片**；
            - **哈希分片**：按 `h(key)` 散打分散给所有机消除写入热点；但区间查询不得不向全部分片**扇出归并**！
      - card:
          title: 扩展方法总览与分片容量分配算术
          body: |
            除了水平分片，常见的数据库扩展手段还有一整套：**读副本分摊只读流量** + **内存高速暂存减少回盘** + **垂直拆表（冷热列拆开）** + **水平分片切行扩展写入和容量上限**。

            若把 $K$ 个键按均匀哈希分片分配到 $N$ 个分片节点，每个分片平均扛大约 **`K / N`** 个键（如 1,200 键分 4 片每片 300；1,500 分 5 片得 300；2,500 分 5 片得 500）！当某片装得太不均或增机时必须再平衡（Rebalancing）——这就引出了为什么朴素 `hash(key) % N` 会在这里翻大车！
      - item:
          id: q-range-vs-hash-sharding
          type: match
          prompt: 把 **范围分片** 与 **哈希分片** 在实际工程中的四大特征对应匹配。
          pairs:
            - ["执行 `WHERE ts BETWEEN t1 AND t2` 区间范围扫描极其高效（只需访问少数连续区间分片）", 范围分片优势]
            - ["当分片键随时间单向递增（如自增订单 ID 或当前时间戳），全网实时新写入全砸向同一末梢分片", 范围分片典型写入热点坑]
            - ["并发新增与查询在全集群所有分片机器间近似均匀分摊负载、不易形成单机瓶颈", 哈希分片优势]
            - ["想做连续范围查询时无法判断邻近值落在哪几片，不得不发给全部分片（Scatter-Gather）", 哈希分片典型查询短板]
          explain: 如果既想要均匀写散、又常按某用户自己最近时间段范围查询，真实大厂常采用**复合分片键**：比如先按 `hash(user_id)` 均匀打散到各分片，同一用户的行在片内 B+ 树里再按 `timestamp` 有序摆排！
      - card:
          title: 例题：为什么不能把“用户表按 `country` 分片”就万事大吉？注意偏斜热点再平衡！
          body: |
            某国际电商决定用国家名做范围或直接按国家代码做分片：中国区节点、美国区节点、某迷你岛国节点……运行半年后出现什么问题，需要怎么再平衡？
          reveal:
            - title: 第 1 步：数据量与读写压力严重倾斜（Data Skew）
              body: 迷你岛国节点一年只有 200 条记录清闲得发慌，中美两国节点各自塞满上亿行彻底跑不动！即便是均匀范围划分，业务爆火区域的分片也常瞬间吃爆单机磁盘。
            - title: 第 2 步：动态分裂（Auto-Split）并把半片搬迁到空闲机器
              body: 像 HBase / TiDB 等现代基于范围的分布引擎一旦监测到某个分片体积超过阈值（例如 96 MB 或 64 MB），自动就地把该重范围一劈两半成两个更窄区间段，随后由后台均衡调度把其中一半区间连同底层副本平滑迁移给集群里更空的那几台机器，化解热点！
      - item:
          id: q-shard-share-math
          type: number
          prompt: 某分布存储集群均匀托管了 `2,500` 万个主键值，当前一共水平分布拆给 `5` 个同规格散列分片节点负责。在不考虑极大碰撞偏斜的理想均匀哈希分片下，平均每台分片节点大约托管多少万个键？（填整数）
          answer: 500
          explain: "`2,500 / 5 = 500` 万个键（同理 1,200 分 4 片 = 300；1,500 分 5 片 = 300）。一旦以后需要扩容加到第 6 台节点，用什么分片路由法才不用把已经存好的两千多万键几乎全搬一遍？这就是一致性哈希要解决的问题。"
      - item:
          id: q-composite-shard-key
          type: choice
          prompt: 一款物联网应用有 10 万台传感器每秒不停上传带时间戳的数据。日常最常见查询总是“按某 1 台特定设备编号 `device_id` 查过去 24 小时历史曲线”。若以纯粹的全局 `timestamp` 做范围分片，写流全会撞死同一末梢机器；若以纯粹 `(device_id, timestamp)` 合起来一起哈希，查某设备一天曲线又要全集群扇出扫描。怎么设分片键最聪明？
          options:
            - text: 用 **`device_id` 作哈希分片键**把十万台设备均匀打散到全部分片写不热点，而在每个分片内部再用 **`(device_id, timestamp)` 建有序存储**——这样查单台设备的 24 小时范围只用精准去那 **1** 台分片里顺序拉区间即可！
              correct: true
            - text: 彻底删掉时间戳，每台设备每天只准上传 1 个永远覆盖不留历史的数
              why: 复合分片思想“外层按实体 `device_id` 散列防写热点，内层按时间有序排列支撑快速区间扫”，既吃全集群写入带宽又保证单实体范围查询极快
            - text: 把十万台设备全部写进 1 台最小的老旧电脑里永远不扩容
              why: 一台机根本扛不住十万台设备高频写入吞吐，必须合理水平分片
          explain: 记死这一招工业级建模绝学：**“散列分片键（打散写热点） + 片内有序聚类键（区间快扫）”**，这也是 Cassandra / DynamoDB 等宽列模型的核心数据分布模式！
      - item:
          id: q-uniform-share-1500
          type: number
          prompt: 若把 `1,500` 万条主键值采用均匀哈希分片均分到 `5` 台分片节点上，理想平均分布下每台分片节点承担多少万个键？（填整数）
          answer: 300
          explain: "`1,500 / 5 = 300` 万个键；同理 `1,200 / 4 = 300` 万，`2,500 / 5 = 500` 万。"

  - id: ring
    chapter: 分片
    title: 传统 mod N 灾难 vs 一致性哈希算术与虚拟节点
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 原本有 `N = 3` 台缓存/分片服务器，直接图省事按 `node = key % 3` 把 `1,200` 个数据安安静静放进这 3 台机器。现在流量太高紧急扩容新增第 4 台机器变成 `N = 4`（`key % 4`）！请问原本的 `1,200` 个键里大约有多少个不得不换机搬家？
          options:
            - text: 灾难性的 **`900` 个（整整 `75%`！）** 键都算出了新余数不得不全网大搬迁或全部瞬间穿透打向主库！（而且节点数 N 越多，迁移比例越逼近 100%！）
              correct: true
            - text: 恰好只有 `1/4 = 300` 个键会搬去第 4 台新机器，其余 `900` 个稳稳留在原地不动
              why: 拿 0..11 验证试一试：`0,1,2` 对 3 和 4 同余留在原地；而 **`3,4,5,6,7,8,9,10,11` 整整 9/12 = 75%** 全部算出了不同机器编号！如果从 10 台扩到 11 台，搬家比例更是飙到惊人的 `90.9%`！
            - text: 一个键也不会动，`key % 3` 和 `key % 4` 永远相等
              why: 除数 `N` 只要一改，除前几个比旧 `N` 小的正整数外，后面几乎全周期数取模余数全面错位大洗牌！
          explain: 所以要记住：**普通 `hash(key) % N` 在增减机器时会触发毁灭级全网雪崩大搬迁，必须改用 `一致性哈希` 环**！
      - card:
          title: 什么是一致性哈希环与只搬相邻那一小片？
          body: |
            把散列值域（例如 `[0, 100)` 或 `[0, 2^32)`）首尾弯成一个封闭圆环，这就是 **一致性哈希（Consistent Hashing）**：
            - 用同一个散列函数把所有物理**节点位置**和**数据键位置**全投到这个圆环上；
            - **归属规则**：每个键从自己在环上的点**沿顺时针方向往前走，碰到的第一个物理节点**就归它管！
            - **加节点奇迹**：原本有 `N` 台机、存着 `K` 个键；往环里新插进第 `N+1` 台新节点后，只需从它逆时针方向原本那唯一 1 个老邻居节点手里切回介于两人之间的那一小弧段——全网平均只迁移 **`K / (N + 1)`** 个键，其余 `N - 1` 台老节点一根毫毛也不用搬！
      - card:
          title: 工程补丁：为什么真实环上必须加“虚拟节点（Virtual Nodes）”？
          body: |
            如果一共才 3 台真实物理服务器随机丢到环上，万一手气差全挤在圆环左半边，那右手边孤零零 1 台机器就得独自扛下全环 80% 的巨大弧长，不仅平摊不均，一挂机压力全倒进顺时针下家把下家一并压死！

            解法超巧：**把每 1 台真实物理机虚拟化出 100 到 200 个带编号分身（如 `NodeA#1..#200`）均匀洒满整圆环**——不仅全网负载分布失衡骤降到极均，单机挂了压力也同时分散给全集群上百个分身均衡兜底！
      - item:
          id: q-ring-verify-11-30
          type: number
          prompt: "实测检验一条大小 100（`0..99`）的一致性哈希环（归属规则：按 `key % 100` 找环上顺时针首个 `node >= pos`，无则回绕至最小节点）。原有节点 `[10, 50, 90]`，现加入新节点 `30` 变为 `[10, 30, 50, 90]`。把 `0..99` 共 100 个键重新对照，一共有多少个键发生了归属变动搬去节点 `30`？（填整数）"
          answer: 20
          explain: "原来节点 `50` 负责 `11..50` 整整 40 个键；新节点 `30` 落在了 `10` 与 `50` 之间后，只有落在弧段 **`11..30` 的那 20 个键** 顺时针先撞上了新来的 `30` 并只从 `50` 手里搬给 `30`！原来节点 `10`（管 91..99, 0..10）和节点 `90`（管 51..90）的 60 个键 **0 个移动**！"
      - card:
          title: 例题：用数字硬核对比 `key % N` vs 一致性哈希增删节点大搬家差距（verify 实验实测）
          body: |
            精确比较 `K` 个键、`N` 台节点增到 `N+1` 台时，传统取模与一致性哈希各自需要迁移多少键？拿真实计算数字说话：
          reveal:
            - title: 第 1 步：`1,200` 个键从 `N=3` 扩成 `N=4`，`key % N` 居然搬飞了整整 `900` 个（`75%`）！
              body: 对 `0..11` 这一个公倍数 `lcm(3,4) = 12` 周期检查 `k % 3 != k % 4`：仅 `0, 1, 2` 这 3 个数余数没变；`3..11` 整整 **`9 / 12 = 75%`** 全变了主机！换算到 `1,200` 个键上共有 **`900` 个键失效重迁**（仅有 300 个原地留守，却有 600 个在原本老机器之间互相无意义瞎转圈！）。
            - title: 第 2 步：换成一致性哈希（含虚拟节点），平均只迁移 `K / (N + 1)` ≈ `300` 个（仅 25%）！
              body: 在理想均匀一致性哈希环上增至 4 台节点时，平均每台新平衡负担恰占总数的 `1 / (N+1) = 1 / 4`（即 1,200 个键只移 **300** 个到新机器），并且这 300 个键是老老实实从各自逆时针原有邻居直接搬去新机器的，**老节点相互之间 0 搬迁**！如果在 100 台大集群扩 1 台，传统取模移动高达 `99%`，一致性哈希移动仅仅 **`1 / 101 ≈ 0.99%`**！
      - item:
          id: q-consistent-hash-avg-formula
          type: choice
          prompt: 依据分布式存储内有 `K` 个键分散在 `N` 个节点上，现新接入 1 个新节点变成 `N + 1` 个节点。采用带虚拟节点的 **一致性哈希** 与采用传统 **`hash(key) % N`** 相比，各自平均需要迁移多少键？
          options:
            - text: 一致性哈希仅迁移新节点接管的那一份（平均约 **`K / (N + 1)`** 个键），老节点互相之间无搬迁；而 `hash(key) % N` 随除数变动会导致几乎全网 **`(1 - 1/N)` 到接近 100%** 的绝大部分键全部大迁移
              correct: true
            - text: 一致性哈希需要搬走全部 `K` 个键，而 `mod N` 只搬 `1` 个键
              why: 两者事实彻底相反：`mod N` 除数一换余数全乱洗牌，正是引入一致性哈希环的根本原因
            - text: 两个方案在扩容时都会搬动完全一样多的一半数据
              why: 随着节点数 `N` 变大（如 20 台扩 21 台），一致性哈希只需挪动不到 5%，`mod N` 却几乎把 95% 以上的数据全搬乱
          explain: 记死答案基准：**一致性哈希新增节点平均迁移仅约 `K / (N + 1)` 键，远优于 `mod N` 几乎全盘重洗！**
      - item:
          id: q-vnodes-why
          type: choice
          prompt: 真实系统落地 **一致性哈希** 时，通常给每台物理节点映射上百个 **虚拟节点（Virtual Nodes）** 洒进圆环，而不只放 1 个点。这样做的两个核心好处是什么？
          options:
            - text: 即使物理主机只有几台，大量虚拟节点均匀分布也能消除环段极不均衡引发的负载倾斜；而且若其中 1 台物理机故障离线，其上百个碎片弧段会均匀分摊给全集群其他节点共同接盘，不压垮单一顺时针下家！
              correct: true
            - text: 虚拟节点能把集群总共能存的物理硬盘容量凭空免费扩大一百倍
              why: 虚拟节点只是在路由环表里为同一台物理机多放了百个逻辑路标名称，真实数据照样存在这几台物理硬盘上
            - text: 让每个键把同一份数据必须抄写进一百个重复槽里
              why: 每个键顺时针遇到第 1 个虚拟节点后，即精确落到该虚拟节点归属的那 1 台真实主物理机上
          explain: “虚拟节点”是用几十 KB 路由表内存成本彻底解决小集群环上数据倾斜与单点宕机雪崩的神来之笔！
      - item:
          id: q-consistent-hash-no-neighbor-chaos
          type: choice
          prompt: 在有 `10` 台节点的 **一致性哈希** 环上共存着 `1,000` 万个键。现在新加第 `11` 台节点进入环内，老节点彼此之间（如节点 2 与节点 3 之间）原本保存妥当的数据会发生相互搬家调换吗？
          options:
            - text: 绝不互相搬迁！只有落在新节点接管那段弧段上、约占 `1/11` 的数据会搬去第 11 台新节点，其余老节点互相之间 0 搬迁
              correct: true
            - text: 会，因为加了第 11 台机导致 `key % 11` 变化，10 台老节点之间几乎全部键都得互相洗牌搬家
              why: 整组全盘互相洗牌正是传统 `key % N` 取模的灾难缺陷，一致性哈希专门把它锁定在局部弧段内
            - text: 会把全部 1,000 万个键清空删除重新算
              why: 一致性哈希加减机器时绝大多数老键纹丝不动，在线迁移平稳平滑
          explain: 记住两条关键优势：**总迁移量极少（平均约 `K/(N+1)`） + 老节点互不牵连折腾！**

  - id: parallel-shards
    chapter: 分片
    title: 跨分片并行查询处理与分散-汇总代偿
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 既然我们已经把一张 1 亿行的大表拆成 10 个独立分片散放在 10 台不同服务器上。现在业务跑一句带全局排序取前十名 `SELECT sid, total FROM Orders ORDER BY total DESC LIMIT 10;`，如果各分片傻傻把各自整整 **1,000 万行** 全部通过网卡倒进协调汇总机然后再排序拿前 10 个，网络和内存岂不瞬间炸掉？有什么聪明办法压掉 99.99% 的跨网流量？
          options:
            - text: '**计算下推（Pushdown）到各分片本地并行做过滤与局部 `Top-10`！** 10 台机各自先本地跑完只吐出自己最猛的 **10 行**（全网跨网才传 `10 × 10 = 100` 行！），协调机再一毫秒归并挑出最终 10 行！'
              correct: true
            - text: 跨分片绝对禁止写 `ORDER BY`、`COUNT` 或 `AVG`，用户只准查单条主键
              why: 现代并行分布查询引擎利用**两阶段部分聚合/局部排序下推**，能在十台机器合力跑出惊人的分析吞吐！
            - text: 只要在 SQL 前加上 `FAST` 关键字，全网流量就会变成 0 字节
              why: 跨机器查询省流量的物理诀窍就是“**在源头各分片本地先缩减数据量，能传汇总中间结果绝不传原始大表**”
          explain: 跨分片并行查询（*Parallel Query Processing*）把单机的查询优化思想推广到多机集群。
      - card:
          title: 分片路由两态：单分片精确路由 vs 分散-汇总（Scatter-Gather）
          body: |
            协调器拿到一条 SQL，看条件里含不含分片键立刻走两条路：
            1. **点精确下发（Single-Shard Routing）**：若 `WHERE user_id = 42` 刚好踩中分片键，协调器直接算路由只把 SQL 发去那唯一 1 台对应分片——其余 `N - 1` 台毫无感知、整个集群吞吐随机器数**线性放大**！
            2. **分散-汇总（Scatter-Gather）**：若条件没带分片键或要做全局统计，只能并发扇出撒网问全部 `N` 个分片再收拢汇总。
      - card:
          title: 并行跨分片连接的三种核心策略
          body: |
            跨分片做表连接 `R ⋈ S` 有三招：
            - **共置连接（Co-located）**：常用表共按同一分片键同位部署，本机内直连 **0 跨网流量**；
            - **小表分发连接**：把极小字典表整份拷发各分片本地连；
            - **混洗连接（Shuffle）**：按连接键临时散列跨机重发大表再配对，跨网开销极高。
      - item:
          id: q-parallel-query-match
          type: match
          prompt: 把跨分片并行查询处理中的四种经典策略与最贴合的场景配对。
          pairs:
            - [按分片键精确路由单分片（Single-Shard）, 查询精准带全了分片键值（如 `uid = 42`），只惊动 1 台节点极低延迟吞吐无限扩]
            - ["局部 `LIMIT / SUM / COUNT` 下推预聚合", "各分片先本地筛选并只向上回传局部 Top-K 或 `(部分和, 部分计数)`，砍掉 99% 跨网卡传数"]
            - [同分片键共置本地连接（Co-located Join）, 建表时把常连的两表共用同一分片键同位摆盘，连接时零跨机器网络混洗开销]
            - [全片分发小表连接（Broadcast Join）, 当 1 张亿行大表连接 1 张几万行的极小字典表时，把小字典复制分发给大表各片各自本地完成连接]
          explain: 记死：**在分布式查询里，网络带宽和跨节点往返延迟远慢于本机内存与磁盘**——凡是能下推到本地消掉的字节、能靠共置避开的混洗，都直接省下数量级级的请求耗时！
      - card:
          title: 例题：为什么计算全局平均分 `AVG(grade)` 时，协调节点不能直接“把各分片的局部平均分再取个平均”？
          body: |
            假设某全国教育平台把成绩分成东区（`100` 万条，平均 `90` 分）和西区（`1` 万条，平均 `60` 分）。协调者如果偷懒下推 `SELECT AVG(grade)` 后对两个返回的数 `(90 + 60) / 2` 求平均得出 `75` 分，彻底算错！正确的分布式下推做法怎么做？
          reveal:
            - title: 第 1 步：把“非直接可加”的平均数拆解成两个可直接相加的底层汇总量！
              body: 算术平均数根本不满足直接合并律！如果东区占 99% 人数而直接和占 1% 的西区等权平均，真实全库均分是 `(90×100万 + 60×1万) / 101万 ≈ 89.7` 分，绝不是 `75` 分！于是优化器下推给每个分片跑的是 **`SELECT SUM(grade), COUNT(grade)`**（两项完美可加的局部和与非空计数）！
            - title: 第 2 步：协调节点只收回区区每片 `1` 行二元组，一步总和除总计得出满分精确均值
              body: 东区只传回 `(90000000, 1000000)`、西区只传回 `(600000, 10000)`，全网仅传两行几十字节！协调机汇总总和除以总非空行数 `(90000000 + 600000) / 1010000 = 89.70`——既彻底免疫偏斜误差、又避开把百万原始分数全拖过网卡！
      - item:
          id: q-distributed-avg-decompose
          type: choice
          prompt: 分布式并行查询需要把跨 `16` 个分片上亿条交易的全局 `AVG(amount)` 下推到各节点预聚合以节省跨网流量。协调器应该下令每个分片统计并返回什么中间值？
          options:
            - text: 下令每个分片各自算出局部 **`SUM(amount)` 与 `COUNT(amount)`** 两个值并回传给协调器，最后协调器把全部部分和相加再除以全部部分非空计数之和
              correct: true
            - text: 下令每个分片各只返回 1 个 `AVG(amount)` 浮点均值，最后协调器直接把这 16 个均分加起来除以 16
              why: 各个分片里的非空数据行数量极可能相差几十倍，直接平均各片平均数会让小样本分片的极端值严重扭曲全局真均值！
            - text: 下令各分片把亿条原始交易金额行全部一字不漏通过网络传回协调器单机累加
              why: 跨网传输上亿条原始记录会把网络彻底打爆，完全违背“局部下推预聚合”减流量宗旨
          explain: 分清聚合函数三类：可直接合（`SUM/COUNT/MIN/MAX`）、可拆代数合（`AVG → SUM/COUNT`，波动偏差也同理可拆）以及只能靠近似或全收集精确排序的整体中位数分位！
      - item:
          id: q-colocated-join-benefit
          type: choice
          prompt: 在设计一个分布式电商订单库时，工程师特意把 `Users` 表按 `uid` 哈希分片，同时也把 `Orders` 表按同一个 **`uid`** 哈希分片（而不是按 `order_id` 分片），确保同一位用户和他的全部订单永远落在同一台物理分片机里。这样设计对查询有什么显著收益？
          options:
            - text: 查“某位用户的详情以及他的历史订单明细（`Users ⋈ Orders`）”时实现了**共置连接（Co-located Join）**：匹配数据都在本机内直接连完，避免极其昂贵的跨节点大规模 Shuffle 混洗流量
              correct: true
            - text: 这会导致以后任何用户再也不允许下超过 1 笔订单
              why: 同一个 `uid` 可以对应任意多条订单行，且按相同哈希全都整整齐齐落在该用户所属的单一分片机器内
            - text: 这样做会让所有用户的订单全挤在同一个节点导致其他分片闲置
              why: 全站几百万个不同 `uid` 依然通过哈希分片均匀散落分布在所有机器之间，只把“同一人的主表与明细表”凑对放一起！
          explain: '**“常做主从连接的业务实体共用同一分片键同位部署”**，这是分布式数据库表建模性价比极高的结构优化！'

  # ======================================================================== 复制
  - id: replicas
    chapter: 复制
    title: 主从复制机制：同步 vs 异步、复制延迟与读己之写
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 上一章把表水平拆成 4 个分片放到 4 台普通机器上。可普通服务器一年总会坏一两台硬盘或者断一次电源——要是第 2 号分片只有唯一 1 份单盘拷贝就挂了，那 25% 用户的全套账户记录不就瞬间灰飞烟灭？！所以每份分片都必须在多台机上存几份副本（**复制**）。主节点刚写完一笔修改准备提交时，它该**死等所有远方从副本全都确认写盘才告诉用户成功**，还是自己先落盘立刻回复成功、随后再慢慢异步同步过去？
          options:
            - text: '**同步复制**保你不丢数据却拉高每次写入延迟且任何副本卡顿都会拖死写入可用性；**异步复制**写入快、主节点挂了却可能丢掉还没来得及传走的最后几条已提交写入，还可能让从副本短时读到旧值！'
              correct: true
            - text: 异步复制可以做到既永远一微秒都不等远端确认、又能保证主节点刚写完就物理着火爆炸时远方从库也早就百分百收到那条还没发出去的包
              why: 在光速网络往返完成确认之前，如果主节点瞬间被物理摧毁且日志还未传到其他节点，异步复制天然无法防止这极窄窗口内最近已提交写入的丢失！
            - text: 同步复制只要多加了副本就会比只写本机自己 1 台还要快十倍
              why: 等待越远甚至跨城跨洲多个副本网络往返加写盘确认，必会明显增加每次写事务确认延迟
          explain: 本课围绕 **复制（Replication）** 的核心两难展开：同步 vs 异步代价权衡，以及用户在面对复制延迟时怎么保住“自己刚改完就立刻看见（**读己之写**）”。
      - card:
          title: 什么是复制，以及同步 vs 异步复制各自代价
          body: |
            多机保存同一份数据副本即 **复制**：
            - **同步复制**：主副本等从副本确认落盘才返回成功。主毁 **0 丢失**，但拉高写延迟且受卡顿副本拖累；
            - **异步复制**：主写完立刻回包、后台异步推日志。延迟极低耐失联，但主突毁可能丢最近写入且从库短时读旧！
      - card:
          title: 复制延迟坑与“读己之写”
          body: |
            异步从库滞后半秒常让刚改完资料的用户刷新却看到老模样而惊慌连点！**读己之写**保证同一用户自己写后紧接必读到自己刚改的新值：只需把该用户近期改动路由回主库，或追上对应写入号以上的副本即可。
      - item:
          id: q-sync-vs-async-match
          type: match
          prompt: 把 **同步复制**、**异步复制** 以及常见的工程组合（如半同步与读己之写）与各自特性精准配对。
          pairs:
            - ["**纯异步复制**", 主库写完立即回复成功延迟最低、耐单从库失联，但主库突毁会丢未传出写入且从库短时有读旧滞后]
            - ["**同步复制**", 必须等到从副本确认写稳才回成功，保住主库突发报废也零数据丢失，代价是拉高写入延迟并受从库响应拖累]
            - ["**读己之写（Read-Your-Writes）**", 同一用户刚发完修改后，把该用户自己的后续读请求发往主库或已追上该版本的副本防止“刚发就看不见”]
            - ["**主从混合（1 同步 + 多异步，Semi-Sync）**", 至少死保 1 台热备从库同步落盘防主死丢数，其余几台分析只读副本异步追赶兼顾安全与扩展]
          explain: 一主一从全同步往往太脆（从库重启主库就卡死），工业常见把 3 副本设成“多数派同步（如 2 份确认即过，这就是法定集合和共识的思路）”或“1 同步防丢 + 多异步扛读”！
      - card:
          title: 例题：同样遭遇“异步从副本落后 500 毫秒”，普通访客和刚刚修改密码的本人体验为何大不相同？
          body: |
            某大型论坛主从集群为了顶住每秒几万次浏览采用主写从读（WAL 异步推送至 5 台只读从库，平时滞后约 200–500ms）。两位用户在同一秒访问发生了啥：
          reveal:
            - title: 第 1 步：刚改完个人简介的作者如果被发到滞后从库——惊恐以为保存失败甚至疯狂重填！
              body: 只要刚写入保存成功的本人 100 毫秒后刷首页被分发到滞后从库看见自己简介依然写着老句子，99% 的人会以为数据库刚才抽风没存进！不仅制造恐慌投诉，还会引发连续重复点击提交垃圾数据！因此系统在会话层面贴一个“最后一次亲自修改时间戳/LSN”，规定**本人近期修改窗口或个人资料必路由回主库读取**，保住“**读己之写**”。
            - title: 第 2 步：万里之外看新闻的吃瓜路人晚 0.5 秒才刷到这条新评论——完全无所谓！
              body: 远隔千里的千万普通浏览读者既不知道你是在 12:00:01.200 还是 12:00:01.700 发帖，晚半秒看见完全满足可用体验，刚好由那几台异步只读从库丝滑扛住海量读流！
      - item:
          id: q-read-your-writes-fix
          type: choice
          prompt: 某网站主库写入成功后采用异步复制同步给多台只读从库。很多用户在修改完个人头像后立即自动刷新页面，竟然发现头像变回了老照片（其实半秒后又变成了新的）。怎么优雅修复这个问题同时又不把全部游客查询压垮主库？
          options:
            - text: 实施**读己之写（Read-Your-Own-Writes）**路由：仅把“本人刚刚在几秒内发生过更新的请求 / 本人档案读取”路由去主库或追平版本号大于本人写入号的副本，普通他人只读流照常留在异步从库
              correct: true
            - text: 直接彻底关掉全部只读从库让全世界千万游客每秒全打在 1 台主库上
              why: 全局撤掉只读分流会让主库瞬间过载宕机，只需按写入者会话粒度精准定向路由即可两全其美
            - text: 让客户端在修改头像后继续随机读取任意滞后从库，因为异步复制保证在 0 毫秒内同步到全球所有从库
              why: 异步复制存在百毫秒级复制延迟（Replication Lag），不带会话版本路由就会在刚写完立刻读从库时读到旧数据
          explain: 用会话写入版本号（Session Token / LSN）跟踪机制保证用户“只进不退读取”与“读己之写”，是分布读写分离架构中最实用的工程技巧！
      - item:
          id: q-replica-lag-stale
          type: choice
          prompt: 当某台主库采用 **异步复制** 同步日志给从库、并在刚向客户确认某笔“充值成功”后的第 50 毫秒突然整机硬件主板起火彻底烧毁不可恢复，此时强行把滞后的异步从库提升为新主库。会发生什么严重后果？
          options:
            - text: 这 50 毫秒内尚未及传输过去的那几笔**已提交确认“充值成功”的记录在从库里根本不存在而永久丢失**（若原主库修好重启还会冒出两份冲突历史）
              correct: true
            - text: 从库虽然还没收到那 50 毫秒的复制日志，但可以通过读取自己本地旧的检查点自动推算出主库刚才收到了哪些新充值请求
              why: 尚未通过网络送达从库的客户端写请求，从库本地日志与检查点里完全没有记录，不可能凭空还原；因此金融核心账本不能只依赖纯异步复制！
            - text: 异步复制可以保证任何时候无论哪台主库烧毁都不丢半个比特
              why: 零丢失提交保证只能靠至少同步等待安全多数派副本（或至少 1 台同步备库）落盘确认再回包才能达成
          explain: 既然“全员等同步太脆（挂一台全挂）、全不等异步怕丢数（主死即丢）”，有没有办法只等 **`N` 个副本里的 `W` 个写、读 `R` 个**，在两者之间取得平衡？这就是 **法定集合（Quorums）**。

  - id: quorum
    chapter: 复制
    title: 法定集合（Quorums）算术：Dynamo `N=3, W=2, R=2` 与严格边界
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 复制面临两难：每份数据存了 `N = 3` 个副本，要是每次写入都死等全员 3 台同意，坏掉 1 台写就立刻瘫痪；要是只写 1 台就急着返回、另一头随便挑 1 台来读，极可能读到没收新写的陈年旧值！有没有办法要求写和读各凑够一定人数，让**任意 `1` 个副本坏掉时还能正常写、还能正常读，而且读写两组人必然撞见至少 1 个拿最新值的共用节点**？
          options:
            - text: 取 `N = 3`、`W = 2`（写确认至少 2 台）、`R = 2`（读询问至少 2 台）！只要满足 **`W + R > N`**（这里 `2 + 2 = 4 > 3`），写过的两个副本与读问的两个副本在 3 选 2 时**必然至少重合 1 台**，同时容忍任意 1 台节点失联！
              correct: true
            - text: 必须写满 `3` 台且读满 `3` 台，没有任何中间数能满足交集
              why: 3 选 2 的鸽巢原理保证了只要 `W + R > N`，任意两个大小分别为 `W` 和 `R` 的子集都不可能避开彼此，刚好用较少确认换取既容错 1 机又有重合！
            - text: 取 `W = 1, R = 1, N = 3` 也保证读集合和写集合必定相交
              why: '`1 + 1 = 2 <= 3` 时写入副本 `{A}` 与读取副本 `{C}` 完全不相交，读回的纯粹是未同步的旧数据！'
          explain: 这就是 Dynamo 无主（Leaderless）或多数派配置最巧妙的组合算术——**法定集合（Quorums）**。
      - card:
          title: 什么是法定集合与 `W + R > N` 鸽巢定理
          body: |
            把一次写入必须落盘确认的最少副本数记为 `W`，一次读取必须拉取比对的最少副本数记为 `R`，总副本数为 `N`——这组配置门槛就叫 **法定集合（Quorums）**：
            - **容错余量**：写可容忍 `N - W` 台失联，读可容忍 `N - R` 台失联；
            - **读写交集红线 **`W + R > N`**：例如 **`N = 3, W = 2, R = 2`**（`2 + 2 = 4 > 3`），每次写 2 台、每次读 2 台并挑最新版本，即使 1 台宕机读写照常可用，且读写集合**必然相交**！
      - card:
          title: 重要边界：为什么 `W + R > N` 本身不直接等于强线性一致性？（边界声明）
          body: |
            千万别把 `W + R > N` 当成万能灵药！**严格法定集合相交仅说明“读样本集与写样本集存在至少一个重合节点”，并不能单独直接推出强线性一致性**：
            - 如果并发写没分清全局严格递增版本（只靠不同机易偏移的本地物理时钟比大小，旧时钟可能盖掉新写）；
            - 如果第 1 次读碰上还没完成的一半写、第 2 次重读反而读不到（需先做**读修复 Read Repair** 补齐落后副本，或再加协调定序规则才能挡住并发回退！）。
      - item:
          id: q-quorum-n3-w2-r2
          type: choice
          prompt: 按照在 Dynamo 风格的分布存储配置中，取 **`N = 3, W = 2, R = 2`** 分别代表什么具体行为与容错能力？
          options:
            - text: 每条数据共保存 `3` 份副本；写入需得到其中至少 `2` 个副本确认成功；读取需向至少 `2` 个副本拉取版本比对取最新；因 `2 + 2 > 3` 读写集合必相交，且任意 `1` 台副本宕机时读写仍全部可用
              correct: true
            - text: 把数据分成 3 份各不相同的字段，每次写只存第 2 份，每次读必须全员 3 台不准少任何 1 台
              why: 副本数量 `N=3` 指的是同一份数据的 3 份冗余镜像，而 `W=2, R=2` 恰恰允许在失去 1 台副本时照常可用！
            - text: 该配置代表完全禁止任何人修改数据，因为 `2 + 2 > 3` 溢出了
              why: "`W + R > N` 正是为了利用鸽巢交集原理让读到最新版本与单机容错兼得"
          explain: 再举个常见极端对比：`N = 3, W = 3, R = 1` 读得飞快且全靠 1 台就交集，但挂掉 1 台就全写不了；`N = 3, W = 1, R = 3` 写极快却挂 1 台就读不了——因此 **`W = 2, R = 2`（均取 `⌊N/2⌋ + 1` 多数派）最均衡！**
      - card:
          title: 例题：实测 `N=3, W=2, R=2` 全交集 vs `N=5, W=3, R=2` 读不到新版（边界反例）
          body: |
            假设某人拿 `N = 5`（副本 `A, B, C, D, E`）来配 `W = 3, R = 2`，心想“写入过半了（3/5）应该很安全了吧”？立刻用验证集合实验检验一下：
          reveal:
            - title: 第 1 步：`N=3, W=2, R=2` 全部 `3×3 = 9` 种读写组合 100% 相交
              body: 写出 `{A, B, C}` 的全部 2 元子集：`{A,B}`、`{A,C}`、`{B,C}`。拿任意一个写集合配任意一个读集合，交集至少有 1 个重合元素（甚至完全同组时重合 2 个），100% 能碰见刚成功写过的最新副本！
            - title: 第 2 步：`N=5, W=3, R=2` 时 `3 + 2 = 5 <= 5`，立刻撞出反例：`{C,D,E}` 写 vs `{A,B}` 读交集为空！
              body: 只要写入落在了 `C, D, E` 这 3 台机器上，紧接着读请求按 `R = 2` 只查了 `A` 和 `B`，`set("AB") & set("CDE") == set()`——**0 个重合**！读出来的全是没有更新的老版本！想让 `W=3` 下必相交，读门槛至少必须提到 **`R >= 3`**（使 `3 + 3 = 6 > 5`）。
      - item:
          id: q-quorum-min-r-for-n5-w3
          type: number
          prompt: "接上面公式：若一份数据在集群一共保存 `N = 5` 个副本，写入规则规定必须等其中 `W = 3` 个副本写成功才算提交。为了让每一次读取的副本集合与成功写入集合在数量上必然存在至少 `1` 个交集，每次读取至少需要询问多少个副本 `R`？（填最小正整数）"
          answer: 3
          explain: "必须满足 `W + R > N`：代入 `3 + R > 5` 得 `R > 2`，因为副本数为整数，故最小需要 **`R = 3`**！（当 `R = 2` 时 `3 + 2 = 5`，若写 `CDE` 而读 `AB` 则彻底不相交读到旧数据。）"
      - item:
          id: q-quorum-not-linearizable
          type: choice
          prompt: 某团队配置了 `N = 3, W = 2, R = 2` 的无主法定集合，于是骄傲宣布：“只要 `W + R > N` 相交，我就已经完美实现了绝对无敌的强**线性一致性**，读完之后再也不会出现倒退或乱序！”这个判断是否严谨？
          options:
            - text: 不严谨！`W + R > N` 只证明读写集合之间“存在交集样本”，如果在异步并发读写半途出现版本冲突、缺乏严格递增最新时间戳、不做读修复（Read Repair）协调读完写回，依然可能出现先读到新版、紧接着再读倒退回旧版等非线性现象
              correct: true
            - text: 完全严谨，只要 `W + R > N` 连全世界的时钟倒流、并发写入乱序都会自动消失
              why: 交叉仅仅是个“鸽巢存在性条件”，要真正达到每一步对外如同只有 1 台机的严密线性一致，往往还得配合全序共识状态机（Raft/Paxos）与强领导租约读或 Read-Index
            - text: 应该把 `W` 和 `R` 都改成 `0` 才能达到线性一致性
              why: '`W=0` 连写盘都不做，根本不存在数据保存'
          explain: 牢记学术边界：**`W + R > N` 保证读写样本相交；从“相交”到严谨“线性一致”，还差全局递增定序与并发读修复协议！**
      - item:
          id: q-quorum-n3-w1-r3
          type: choice
          prompt: 同样总副本数为 `N = 3`，有组架构把写确认设成了极端高吞吐写法 `W = 1, R = 3`（写只要 `1` 台确认即成功，读则问全员 `3` 台）。相比 `W = 2, R = 2`，这套极端配置牺牲了什么？
          options:
            - text: 写入虽然极快且耐 2 台挂机，但只要有任意 **1** 台副本宕机或失联，读请求就会凑不齐全员 `3` 个确认而全部不可用！
              correct: true
            - text: 写入和读取集合完全不相交，`1 + 3 <= 3` 读不到最新写
              why: '`1 + 3 = 4 > 3` 依然满足交集条件，代价不是缺交集，而是把“任何 `1` 台机失联”的故障成本全部压垮了读取可用性（允许 0 台读失联）'
            - text: 这套配置下哪怕全部 3 台机全断网也能成功读完 3 份副本
              why: 一旦 `R = 3`，必须 3 台副本全部活着才能凑满读取门槛，容错降为 `N - R = 0`！
          explain: 这也是为什么多副本集群最常取居中平衡：`N=3, W=2, R=2` 让写与读双双容忍 1 台宕机！

  - id: cap
    chapter: 复制
    title: CAP 定理与 PACELC 权衡模型
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 横跨北京和上海两个机房布置了一套双活副本库。突然挖断了京沪之间的海底/陆地主光缆（两边机房彼此断网隔离失联，**各自机房自己内部的业务机其实依然活着能开机工作**）！就在光缆断了这一分钟里，有用户往北京写了一笔改动：现在是**为了保证上海绝对不读到和北京不一致的旧数据而坚决拒绝两边提供服务（停服保一致）**，还是**干脆先放行北京和上海各自继续照常响应用户读写（等网通后再对账修冲突）**？
          options:
            - text: 这正是分布式理论基石 **CAP 定理** 揭示的铁律：真实网络绝不可能免除偶发断开隔离（Partition `P`），一旦光缆断开分裂成孤岛，系统在**可用性（A）**与**线性一致性（C）**之间**不可能兼得，必舍其一**！
              correct: true
            - text: 只要装上最新款数据库软件，光缆物理拔断了之后北京和上海之间依然能靠意念瞬间传完一万次修改同时既不停服又绝对 100% 强一致
              why: 光速通信都穿不过被物理拔断的网络光缆！只要两边无法通信，让上海既放行读改又想同步拿到北京刚刚写完的新值在物理信息论上是不可能的！
            - text: 只要把服务器搬进地下二层，地球上就永远不会发生网络丢包与断开
              why: 交换机崩溃、光缆施工挖断与防火墙规则误操作都是大型分布式生产环境下注定周期性发生的常态事件
          explain: '**CAP 定理** 与更贴近日常无故障状态的升级版框架 **PACELC**，教会你科学评判不同复制与一致取舍。'
      - card:
          title: 什么是网络分区（P）与 CAP 定理核心取舍
          body: |
            机房间通信断掉孤立称 **网络分区（`P`）**。**CAP** 指：
            - **线性一致性**（CAP 中的 C）：所有节点对外如同唯一实时副本；
            - **A（可用性）**：活节点收到请求必返回正常非错回包；
            - **P（分区容错）**：链路分裂时集群仍运作。
            因 `P` 必遇，分区时只能 **`CP`（保一致拒少数孤岛服务）** 或 **`AP`（各接写入并随同步成 **最终一致性**）**！
      - card:
          title: PACELC 框架与“评机制而不僵化贴标签”边界
          body: |
            光看 CAP 不够——平时 `99.9%` 的日子网络并没有断网分区（`Else`），系统还在纠结啥？**PACELC** 补充完整了全貌：**若发生分区（If `P`），在 `A` 与 `C` 间选；否则正常运行时（Else `E`），在 `低延迟 Latency (L)` 与 `一致性 (C)` 间选！**
            - **Dynamo 风格默认策略（`PA / EL`）**：分区时保可用（`PA`），平时异步走近节点降延迟接受**最终一致性**（`EL`）；
            - **Spanner 风格默认策略（`PC / EC`）**：分区时多数派外的孤岛拒服保一致（`PC`），平时照样走同步多数派共识与时钟等待严保一致（`EC`）。（**注意：现代产品常支持可调参数 `W/R`，评判针对的是具体机制与配置策略，不可死贴僵化终身标签！**）
      - item:
          id: q-cap-tradeoff-exact
          type: choice
          prompt: 在分布式理论与 **CAP 定理** 语境下，当跨机房链路突然发生真实 **网络分区（Partition, `P`）** 导致左右两边集群彻底通信失联时，为什么说系统必须面临“CP vs AP”二选一？
          options:
            - text: 若允许失联的两边孤岛都继续接收写入并立即响应（保 A），另一边就必然看不到对方的最新修改产生分叉，打破**线性一致性（C）**；若为保强一致拒绝对不连通/少数派侧继续提供服务（保 C），则丧失全部节点的**可用性（A）**
              correct: true
            - text: 因为 CA 关系数据库永远只准安装在单机房，只要一多买一台电脑就绝对支持 CA + P 全满
              why: 凡是跨节点网络异步运行的分布系统就必须面对潜在网络分区 `P`，不存在能在分区期间同时“既两边都接改又不分叉不一致”的奇迹！
            - text: CAP 里的 C 指的是 SQL 外键检查，和主从数据一不一致没半点关系
              why: CAP 里的 C 严格特指**单对象读取绝不倒退的强线性一致性（Linearizability）**，不要跟 ACID 的 C（约束与业务不变式一致性）混淆！
          explain: 记死防混考点：**ACID 里的 C 指规则与不变式守恒，CAP 里的 C 指跨副本实时线性一致（如同只有 1 份副本）**！
      - card:
          title: 例题：分别用 PACELC 剖析“银行余额系统（PC/EC）”和“商品浏览点赞计数（PA/EL）”的工程配置！
          body: |
            用 **PACELC** 完整描述：在不同业务场景下，“发生分区（P）时”与“平常无故障运行（E）时”各做何选择？
          reveal:
            - title: 第 1 步：核心银行总账 / 强一致库存配置 —— `PC / EC` 路线
              body: 银行余额绝不能出现上海取出 1 万、断网时北京那半边孤岛不知情又取走 1 万！因此遇到分区（P）时，断在少数派的那半边立刻报错拒服务以死守一致（**PC**）；甚至平时网络畅通（Else）时，每一次写钱也甘愿多等几十毫秒跨地域多数派共识确认（**EC**），宁可慢几十毫秒也不容许读出未确认旧余额！
            - title: 第 2 步：社交点赞 / 购物车（如 Dynamo 默认策略）—— `PA / EL` 路线
              body: 刷视频点赞多 1 个少 1 个晚半秒全网同步根本无人抱怨，但网页一转圈卡住三秒用户马上滑走！所以万一断网（P），两边照样让用户顺手点赞放入购物车保持完全可用（**PA**）；平时正常跑（E）更是直接走最近本机节点毫秒级回包追求极低延迟（**EL**），后台异步靠版本号/CRDT 合并慢慢达到**最终一致性**！
            - title: 第 3 步：同时尊重“配置可调”事实——不把整款产品贴死终身单一标签
              body: 哪怕是同款数据库（如 Cassandra 配 `QUORUM/ALL` 或 MongoDB 改 `writeConcern="majority"` + `readConcern="linearizable"`），调整配置即可在 `PA/EL` 与偏 `PC/EC` 间移动权衡——架构师谈的是**特定配置与模式**的取舍！
      - item:
          id: q-pacelc-ex5
          type: choice
          prompt: 按照 **PACELC** 理论模型：`PA / EL`（如 Dynamo 风格默认异步/近邻配置）与 `PC / EC`（如 Spanner 默认强一致模式）在**没有发生网络分区（Else）的日常正常时刻**，各自在权衡什么，各自选择了什么？
          options:
            - text: 正常无分区时在**低延迟（Latency, `L`）**和**一致性（Consistency, `C`）**之间权衡：`PA/EL` 选择优先保低延迟（`EL`）而容忍最终一致性；`PC/EC` 则宁愿承受更多跨副本等待延迟也坚持保强一致性（`EC`）
              correct: true
            - text: 没有发生分区时，两类系统全都会彻底关机停止运行
              why: '`Else (E)` 指的正是 99% 日常网络正常畅通时间段，PACELC 正是为了弥补 CAP 只看断网瞬间而忽略平时延迟代价的不足'
            - text: "`PA/EL` 在正常时刻选择绝对禁用全部副本复制，只存 1 份裸盘"
              why: 副本照样多地留存提高读吞吐和容灾，只是写回包与读取无需强行同步拉齐全多数派以把响应压缩至极低延迟
          explain: 记死全拼：**If P then A else C; Else (E) L else C** —— 分区问可用还是强一致，平时问极速低延迟还是强一致！
      - item:
          id: q-linear-vs-eventual
          type: match
          prompt: 把复制一致模型中的四个核心术语与它们最精确的承诺强度对应匹配。
          pairs:
            - ["**线性一致性（Linearizability）**", 所有节点对外像单一实体，任一写提交后全世界后续任何时刻读取绝不倒退回旧版]
            - ["**最终一致性（Eventual Consistency）**", 允许短暂窗口读到旧滞后副本或跨地区分叉，只要停写一段时间各副本终将达成完全一致]
            - ["**ACID 的 C vs CAP 的 C**", 前者保数据库规则与不变式正确；后者特指跨多个分布式副本间实现单副本般的实时读取一致]
            - ["**网络分区（Partition, P）**", 集群间通信断开隔离，迫使多副本系统不得不在“允许孤岛继续响应分叉”与“暂停局部可用防分裂”间拍板]
          explain: 分清一致模型不同强度后，就能顺理成章看懂：机器到底怎样不用“总管一人拍板”，就能让一堆节点自动选出领导者并统一日志顺序？这就是 **共识（Consensus）** 要解决的问题。
      - item:
          id: q-cap-no-freeze-product-label
          type: choice
          prompt: 当我们评价开源数据库或云存储处于 PACELC 里的哪个位置（如 `PA/EL` 或 `PC/EC`）时，工程上最准确严谨的表述态度是什么？
          options:
            - text: 针对特定系统当前启用的**具体一致性配置策略与默认协议模式**进行评估，而不是给整个支持多模式调节的产品死死贴上一辈子不变的僵化标签
              correct: true
            - text: 每款数据库只要名字里带字母 C 就永远无法调整读写参数，终身锁死同一行为
              why: 现代许多存储（如 Cassandra 切换 `ONE/QUORUM/ALL`、MongoDB 切读写关注级别）均可通过配置改变可用性、延迟与一致性位置
            - text: 因为能调配置所以 CAP 定理根本不成立
              why: 在你**实际选定生效的那一套当前运行配置**下，分区时照样严格服从 CAP 二选一物理铁律，改变不了同时既分叉接改又强一致！
          explain: '**物理定律铁面无情（CAP），架构评价实事求是（看当前落地的机制与配置参数）**！'

  - id: consensus
    chapter: 复制
    title: 共识算法（Paxos / Raft）：多数派日志复制与脑裂防御
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个 3 副本组本来由 `A` 当主节点、`B` 和 `C` 当备份从节点。某天网络抖动把 `A` 隔开了（其实 `A` 自己没死，只是 `B` 和 `C` 几秒收不到 `A` 的心跳，于是 `B` 被选成新主节点）。万一此时傻傻不靠多数派裁决，旧主 `A` 以为自己还是主、新主 `B` 也以为自己是主——同时两边都在接用户写请求！这种双主乱写灾难叫“脑裂（Split-Brain）”。靠什么数学规矩能绝对杜绝两个主同时合法提交修改？
          options:
            - text: '**多数派投票与任期递增（Raft / Paxos 共识）**：任何一届领导上任以及每一条操作日志确认提交，都**必须拿到超过半数（`⌊N/2⌋ + 1`，3 台里至少 2 台）节点的同意票**——两个互不相交的小组绝不可能同时各有多数派！'
              correct: true
            - text: 让每个节点只凭本地心跳超时就立刻自封为主节点并直接接受单机写入，不需要任何其他节点投票确认
              why: 没有多数派投票约束和任期（Term）比较的话，被隔在少数孤岛的老主照样会自顾自写下冲突的本地账本引发双主脑裂
            - text: 规定集群总共只允许部署偶数个如 2 台机器并且只用单机投票就行
              why: 2 台机器一旦网断成 `1 vs 1` 各自只有 1 票谁也过不了半（需要至少 3 台奇数副本才有意义容忍 1 台失联并保多数派 `2/3`！）
          explain: 这一课讲共识算法的核心直觉，并划清“**同组多副本共识（Raft/Paxos）**”与“**跨分片原子提交（2PC）**”的分界！
      - card:
          title: 什么是共识（Consensus）与为什么 2F + 1 容忍 F 台故障？
          body: |
            如果同一个数据分片有 `N` 个副本（形成一个副本组），怎么保证哪怕任意 `F` 台死机断网，全组对“第 1 步改谁、第 2 步改谁”的 WAL 状态机操作历史依然永远一致不脑裂？靠 **共识算法（如 Paxos、Raft）**：
            - **核心基线 `N = 2F + 1`**：用 **3** 个副本可容忍 `1` 个故障（多数派 = `2`）；用 **5** 个副本可容忍 `2` 个故障（多数派 = `3`）；
            - 任两个不同“多数派集合”**绝对必定至少有 `1` 个共用节点**！这个共用节点只要守住“绝不投给同一届两个不同人 / 绝不承认落伍任期”，老主 `A` 孤立在 `1` 人区再怎么吼叫也凑不够 2 票提交，彻底消灭双主脑裂！
      - card:
          title: Raft 直观两步：领导选举 + 日志多数派复制（与 2PC 严格区分！）
          body: |
            **Raft** 把同组复制拆成两步：① **选主**：心跳超时后增大任期发起选举，赢过半选票且日志不落后才当选；② **写日志**：Leader 发给全员，收过半确认即正式提交。
            **明确区分**：**共识**保障同组副本高可用等价单机；而下章 **2PC** 专管跨**独立分片**同成同败原子提交！
      - item:
          id: q-consensus-quorum-2f-1
          type: number
          prompt: 基于 Raft / Paxos **共识** 协议的分布式复制组（不考虑恶意拜占庭篡改），如果架构设计要求：**即使同时有 `F = 2` 台机房服务器突然断电或断网失联，整个副本组依然能够合法选出新主并照常提交新写入数据**。该副本组最少必须配置多少个节点 `N`？（填整数）
          answer: 5
          explain: "崩溃容错多数派共识最少需要 **`N = 2F + 1`** 个副本：容忍 `F = 2` 台同时失联，需要 `2 × 2 + 1 = 5` 台节点（此时哪怕挂 2 台还剩 3 台，依然满足超过 `5/2 = 2.5` 的法定多数派 `3`；若只配 4 台，挂 2 台后只剩 2 台凑不满严格过半的 3 票，就会卡住无法选新主！）。"
      - card:
          title: 例题：为什么 Raft 选举不仅看“拿多数派选票”，还要严查“候选人的日志必须至少和我一样新”？
          body: |
            设想 `N = 3` 集群中：`A` 刚把一笔已经收到 `(A, B)` 多数派确认提交的记录记在自己日志第 10 号（`C` 刚才恰好网络丢包慢了一步日志只停到第 8 号）。突然 `A` 断电，如果 `B` 和 `C` 同时去抢选主，为什么绝不能让落后的 `C` 当选新主？
          reveal:
            - title: 第 1 步：一旦让日志停在第 8 号的 `C` 当选强行覆写全组，第 10 号已提交记录会消失！
              body: 在标准 Raft 里，新主上台后有霸权要求所有从节点照着自己的日志抹齐覆盖！如果让漏掉了第 10 号提交的 `C` 当主，它会把 `B` 手上原本已经合法提交生效给用户的第 10 号记录强行抹平抹掉——彻底击穿持久性保证！
            - title: 第 2 步：限制“只给日志索引与任期都不落后于自己的候选人投票”
              body: 投票规则规定：`B` 检查 `C` 发来的拉票请求里的最后一条日志任期和索引号，一看“你的才第 8 号，我的已经到第 10 号比你新”，当场**果断拒绝对 `C` 投赞成票**！由于之前 `A` 必须拿到过多数派（`{A, B}`）确认才能提交第 10 号，而新主当选同样必须拿到新的多数派——**两个多数派的交集成员（`B`！）手里必存着第 10 号已提交记录**，保证选出来的新主 100% 天然自带历史所有已提交数据！
      - item:
          id: q-consensus-vs-2pc-role
          type: choice
          prompt: 对一个现代分布式 NewSQL 数据库（例如 Spanner 或 TiDB/TiKV）来说，里面往往**同时**跑着两套协议：**Raft/Paxos 共识** 和 **两阶段提交（2PC）**。请问它们各自到底解决哪一个层面的问题？（边界核心辨析）
          options:
            - text: '**Raft/Paxos 共识**保证**同一个数据分片内部的多个物理备份副本之间日志序列完全一致且主死秒切无单点**；而 **2PC 两阶段提交**则负责当一笔大事务跨越了**多个互不相干的独立分片**（如账户 A 在分片 1、账户 B 在分片 2）时，确保全部分片要么一起提交生效、要么一起回滚撤销'
              correct: true
            - text: Raft 和 2PC 干的完全是同一件事，都是用来把 SQL 字符串变成 JSON 网页
              why: 两者定位截然不同且常层层嵌套合作：把每个本来会死机阻塞的 2PC 协调者或单分片做成 3 副本 Raft 共识组，就能彻底治好经典 2PC 协调者挂掉卡死的顽疾！
            - text: Raft 共识只支持全库总共只有 1 条记录且不能发生任何节点断电
              why: Raft 正是为多副本强一致复制与主故障自动切换高可用而生的共识日志协议
          explain: 共识管一组副本内部的一致，2PC 管跨分片的原子提交；业界常把两者合起来（“Raft + 2PC”），做出既跨片原子、又不会因协调者宕机而卡住的分布式事务。
      - item:
          id: q-odd-replicas-why
          type: choice
          prompt: 生产部署 Raft / etcd / ZooKeeper 等多数派 **共识** 集群时，为什么大家总是配 **`3` 台或 `5` 台**奇数节点，很少有人故意配置 `4` 台节点？
          options:
            - text: "`3` 台过半要 `2`（容忍 1 故障）；`4` 台过半要 `3`（也只能容忍 `4 - 3 = 1` 个故障！），多花钱买了第 4 台机器却一点都没增加容灾台数反而还可能引出选票对半僵局！"
              correct: true
            - text: 因为电脑网络协议禁止使用偶数的 IP 地址通信
              why: 原因纯属“多数派算术 $N - (\lfloor N/2 \rfloor + 1)$”：3 台容 1 错，4 台仍然只能容 1 错，5 台才能容 2 错
            - text: 因为 4 台机器合在一起必须全部 4 台同时下线才能选出新领导
              why: 恰恰相反，要选出唯一新主必须凑够至少 `⌊N/2⌋ + 1` 的严格过半赞成票
          explain: 偶数节点 `2F + 2` 和奇数 `2F + 1` 的崩溃容错台数完全相同（都只容 `F` 台！），奇数最经济实在！
      - item:
          id: q-raft-3-node-split
          type: choice
          prompt: 一个 `3` 节点 Raft 共识集群（主 `A` 与从 `B, C`），机房网线抽风把节点 `A` 独自切进少数孤岛里（`{A}` vs `{B, C}` 彼此断联，但三台机器电源都没断）。这期间客户端把一条新写请求发给了孤立的老主 `A` 和发给了多数派选出的新主 `B`，分别会发生什么？
          options:
            - text: 老主 `A` 在孤岛凑不够 `2` 票多数派确认，这条写请求绝不会提交生效（超时报错防脑裂）；而在连通的 `{B, C}` 侧顺利凑齐 2 票选出新主并稳稳提交成功！
              correct: true
            - text: '`A` 和 `B` 会各自独立宣布提交成功，产生两条完全冲突的历史记录'
              why: 这正是 Raft/Paxos **多数派机制** 重点消灭的双主脑裂——在 `{A}` 侧孤军永远过不了 2 票门槛！
            - text: 只要 `A` 被隔开，就算 `{B, C}` 还有两台活着也彻底选不出新主
              why: '`B` 和 `C` 占 2 台刚好满足 `⌊3/2⌋ + 1 = 2` 法定多数派，立刻在数秒内选出新主继续服务！'
          explain: 这恰好验证了前面 CAP 中的 **CP（少数孤岛 `{A}` 拒写保一致，多数派 `{B, C}` 继续正常服务）**！

  # ======================================================================== 分布式事务
  - id: distributed-locks
    chapter: 分布式事务
    title: 分布式锁、租约（Lease）与跨节点死锁应对
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 在单机事务里如果用 Strict 2PL，锁表都在一台机器内存中，事务出错本地立刻放锁。现在换成分布事务：分片 1（持有 A 的锁）与分片 2（持有 B 的锁）各管各的本地锁。万一拿着 A 锁的客户脚本刚拿到锁下一秒就断网死机失联了，分片 1 会怎么傻等？或者双方互相在两台机上等对方锁形成跨机等待死锁，又该怎么发现或预防？
          options:
            - text: 必须给跨网络持有的分布锁引入带倒计时过期回收的**租约（Lease）**防止持有方失联永占不放；对跨分片等待环则要么收集全局等待图检测打破，要么用基于超时或全局唯一时间戳（如 Wait-Die）无等待预防！
              correct: true
            - text: 分布锁只能永远永久死死锁定，哪台客户端失联了就永远不要再去动那行记录一百年
              why: 网络随时断开、客户端任务随时被强杀，无限期无超时的跨网锁会让热点资源直接永久僵死变成黑洞
            - text: 只要不用 B+ 树，分布在不同服务器上的两把锁就会自己物理连在一起绝对不发生死锁
              why: 两事务分布在不同机器各自先锁本地行再互相伸手申请对方机器上的另一行，照样会在全局形成 `T1 ↔ T2` 跨节点分布式死锁环！
          explain: 这一课看清把单机锁搬上分布网络后新添的**断线孤儿锁、租约（Lease）时钟漂移与跨机死锁**问题。
      - card:
          title: 分布式锁管理器、租约（Lease）与时钟保护
          body: |
            把事务锁分散到各个分片自己管理本地分片行后，两类单机不会碰到的坑浮出水面：
            1. **持有者半路失联**：靠 **租约（Lease）**——锁带上有限寿命，持有人必须定期发送续租心跳；如果持有人死掉忘了放锁，租约一到自动释放；
            2. **万一持有人没死只是卡顿了几秒后醒来误以为锁还在自己手里！**：必须每次修改目标存储时附带一个严格递增的**防呆栅栏令牌（Fencing Token）**，存储节点发现令牌号比已受理的旧，当场拒绝过期的假老板写入！
      - card:
          title: 跨节点分布式死锁处理
          body: |
            当 `T1` 拿着分片 1 上的 `X(A)` 去申请分片 2 上的 `B`，而同时 `T2` 拿着分片 2 上的 `X(B)` 来申请分片 1 上的 `A`——每一台机器只看自己本地的那半张等待表，完全看不见成环了！解法三条：
            - **汇总全局等待图周期检测**：把各分片局部等待边定期汇报给中心检测器拼出大图抓环；
            - **老牌简单“超时自毁（Lock Timeout）”**：只要等任何跨机锁超过几百毫秒或几秒直接放弃回滚重试（省协调却可能错杀只是稍微慢了点的大事务）；
            - **年龄时间戳防环（如 Wound-Wait / Wait-Die）**：单凭事务出生编号决定谁等谁死，零跨节点沟通直接无环！
      - item:
          id: q-dist-lock-fencing-token
          type: choice
          prompt: 一位客户端 `C1` 从分布式锁服务拿到一把有效期 10 秒的共享资源锁（并领到递增栅栏令牌 `token = 33`），随后 `C1` 突然本地卡顿冻结了整整 15 秒才苏醒。期间租约早已在第 10 秒到期失效、锁已被正经转授给带 `token = 34` 的客户端 `C2` 并先修改完数据。此刻 `C1` 苏醒，完全没意识到自己的租约早已作废，还想把 `token = 33` 的旧覆盖写发给数据库。怎样彻底拦住这个僵尸写入？
          options:
            - text: 存储引擎校验每次带锁写入的递增栅栏令牌：因为之前已经处理过 `token = 34` 的写请求，存储看到晚到的旧 `token = 33 < 34` 立刻拒绝拦截，彻底挡住失效旧租约僵尸写入！
              correct: true
            - text: 让数据库再把 15 秒前的状态删光配合 `C1` 再错改一遍
              why: 绝不能让早已经过期的延迟网络包或卡顿僵尸客户端盖坏新合法主人的最新数据
            - text: 只要给锁设置“1 万年永不过期”就不会被别人接手了
              why: 永不过期的锁会导致只要 `C1` 真的当机断网，全系统所有人都永远再也改不了这行记录
          explain: '**带租约超时防止永占死锁 + 严格递增 Fencing Token 防止失忆僵尸覆盖**，是现代分布式锁极其关键的一对黄金组合！'
      - card:
          title: 例题：为什么把 `Wound-Wait` 按起始时间排尊卑用到跨分片上能省去全局死锁排查网通信？
          body: |
            假设每个跨节点事务启动时由协调器分配唯一的全局出生编号（年长的号小，年轻的号大）。对比跨机器“发消息查全网等待环”与 **Wait-Die / Wound-Wait**：
          reveal:
            - title: 第 1 步：每次跨越机器周期收集汇总等待边不仅延迟高，还常拍到“假环”
              body: 跨多台机房异步收集本地等待消息需要时间——可能刚把 A 机的老等边发过来时，那边的事务早就提交放锁了，拼出来的“幽灵假环”容易白白错杀无辜好事务；还占了不少协调控制流量。
            - title: 第 2 步：每台分片本地只需比较“申请者编号 vs 持有者编号”就一秒无死锁！
              body: 采用 **Wound-Wait（老抢少）** 时：如果老前辈事务（号更小）来抢年轻人（号更大）手里的锁，年轻人直接干脆利落让路回滚并拿原号（保留资格变老！）稍后再重试；反过来若年轻人要老前辈的锁，乖乖原地等老前辈跑完。因为全集群永远只存在“编号大等编号小”或相反的单向箭头，**数学上彻底不可能在任何多台机器之间绕成封闭环**！
      - item:
          id: q-dist-deadlock-match
          type: match
          prompt: 把跨分片分布式加锁中遇到的四种挑战与它们各自的工程应对策略匹配。
          pairs:
            - [持有某锁的客户端半路客户端崩溃或彻底失联, 用有时限的 **租约（Lease）** 到点自动回收，防止资源永久锁死]
            - [卡顿冻结太久的旧客户端苏醒后自以为仍持有锁强写旧数据, 要求存储节点校验递增 **栅栏令牌（Fencing Token）**，拒收小号旧写入]
            - [跨两台不同机器交叉申请对方锁，单机各自只看到半条边看不出死锁, 全局汇总等待图检环、超时直接重跑，或按出生编号单向规则预防]
            - [只凭局部时间猜想另一方还活着导致误回收前冲突, 在分布式环境不依赖纯绝对时间信任，用多数派共识管理锁状态与令牌号]
          explain: 分布式锁不是“加完再说”，**防失联（Lease）+ 防僵尸（Fencing Token）+ 防跨机成环（Timeout/Wound-Wait）** 缺一不可！
      - item:
          id: q-lease-clock-drift
          type: choice
          prompt: 即使使用了带固定时长 `10 秒` 的租约锁，如果分布式锁服务器上的物理时间时钟偶尔出现快慢偏差，或者网络来回花了 8 秒，仅仅依赖“申请方自己看着本机手表倒数 10 秒”可靠吗？
          options:
            - text: 不可靠！客户机本地看表和网络传递延迟极易产生时间认知偏差，必须在服务端以权威租约签发端核准，并且写入数据存储层时必搭严格严格递增校验的 **Fencing Token** 或事务版本校验作最后底线防御
              correct: true
            - text: 非常可靠，全地球所有便宜服务器的石英表误差绝对在 0 纳秒以内
              why: 普通物理主机石英晶振漂移、NTP 校时跳变与系统卡顿十分常见，工程上绝不能假设两台分离电脑的时钟分毫不差
            - text: 可以把所有锁的租约全设成 `0.0001` 毫秒防止时钟偏差
              why: 0.0001 毫秒连正常网络来回一次都走不完，锁还没传到客户端手里就已经过期作废了
          explain: 搞完如何把跨分片并发锁稳住之后，下一个问题更核心：**当事务准备收尾说提交时，怎么保证分片 1 和分片 2 绝不会出现“一个交了、另一个却失败回了滚”的裂半事务？**
      - item:
          id: q-wound-wait-order
          type: choice
          prompt: 跨分片分布式死锁预防采用 **Wound-Wait（老抢少）** 机制。假设早期启动的老事务 `T1 (TS=100)` 想申请一把目前正被年轻事务 `T2 (TS=250)` 持有的锁，系统会立刻怎么做？
          options:
            - text: 直接伤退并回滚年轻的 `T2`，让老资格 `T1` 立刻拿到锁往前推进；随后 `T2` 用原先较老的 `TS=250` 重启避免永远饿死
              correct: true
            - text: 让老事务 `T1` 站在原地无限死等，同时允许年轻 `T2` 再反手等 `T1` 形成闭环
              why: 这恰恰成了会导致跨机死锁的乱等待！单向只准“小号等老号”或“老号抢小号”才保证永远无环
            - text: 把两台分片全部同时删掉
              why: 只需单向中止冲突中按年龄判定劣势的一方并让其重跑，即可免去全局等待环检查开销
          explain: 与之对称的 **Wait-Die（老等少、少自裁）** 同理严格保持年龄单向序，永远杜绝跨节点等待环！

  - id: commit
    chapter: 分布式事务
    title: 两阶段提交（2PC）：投票表决、决定执行与协调者崩溃阻塞
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 小明在网银从北京机房的分片 1（扣款 500 元）向深圳机房的分片 2（入账 500 元）发起一笔跨分片转账。如果协调者简单群发一条“你们提交吧！”，结果分片 2 因为触发业务约束拒绝了入账，或者网断了分片 1 提交了而分片 2 失败回滚了——500 元就凭空蒸发光了！怎样在互不相干的分片之间保证**全提交或全回滚**？
          options:
            - text: 分两轮走！第 1 轮先问清楚全体参与者“各自能不能保证稳妥写下日志和锁住资源做好提交准备（Prepare）？”；只有收到 **全体全票同意（YES）** 才在第二轮统一下令提交，否则一票否决统统回滚！
              correct: true
            - text: 让分片 1 先彻底提交完，万一分片 2 报错就算用户 500 元自动没收充公
              why: 跨分片分布式事务必须严格维护全库原子性（要么两片全提交、要么两片全撤销）
            - text: 让用户拿手机给北京机房和深圳机房各发一条短信分别手动修改
              why: 自动化原子提交协议（2PC）由协调者与持久化日志严密驱动完成，绝无需人工干预
          explain: 这套跨多个独立数据分片的原子裁决机制正是经典的 **两阶段提交（Two-Phase Commit, 2PC）**。
      - card:
          title: 2PC 协议完整两阶段流程
          body: |
            设**协调者（Coordinator）**统筹多个 **参与者（Participants）** 执行 **两阶段提交**（2PC）：
            - **第一阶段（Prepare 准备与投票）**：协调者发 `Prepare`；各参与者检查约束、上好所需锁并把 `Undo/Redo` 日志及状态**持久化写入本地磁盘**后回复 `YES（同意提交）` 或 `NO（反对中止）`（回 `NO` 者可就地安全回滚）；
            - **第二阶段（Commit / Abort 决议落地）**：协调者收齐全部回票——若**全票 YES**，协调者先在自己日志写稳 `COMMIT` 决议再发正式 `COMMIT` 指令各参与者落盘回 `ACK` 放锁；**只要有任何 1 票 NO（或等待投票超时）**，写 `ABORT` 后通知全员统统回滚！
      - card:
          title: 2PC 的致命软肋：协调者收集全 YES 后突然崩溃阻塞！
          body: |
            看清 **2PC 的经典阻塞（Blocking）陷阱**：
            - 假如各参与者已经把准备日志写盘、死死攥住数据行写锁并回复了 **`YES`（代表“我已放弃单方面后悔权，完全听从协调者总裁判”）**；
            - 偏偏此时，**协调者在还没把最终 `COMMIT / ABORT` 决定通知出来之前突然崩溃失联了**！
            - 参与者进退维谷：不能私自提交（万一协调者早就决定 `ABORT` 或其他机器投了 `NO` 呢？），也不能私自中止（万一协调者崩溃前最后一秒已经记下 `COMMIT` 并发给了另一半机器呢？）。于是全员只能**一直攥着行写锁死等协调者重新恢复醒来**，造成业务表长期锁死阻塞！
      - item:
          id: q-2pc-steps-order
          type: order
          prompt: 请把一笔全票通过正常落地的 **两阶段提交（2PC）** 跨分片事务关键流程按先后顺序排好。
          steps:
            - 阶段 1 发 Prepare：协调者向全体相关分片参与者发送准备请求
            - 阶段 1 写盘投票：各参与者校验约束、持锁并将本地准备状态（含可重做与撤销记录）先刷盘，再回复 `YES` 投票
            - 阶段 2 协调者落盘拍板：收齐所有 `YES` 后，协调者必须先将 `COMMIT` 最终决议写入自己的持久化日志，再群发 `COMMIT` 令
            - 阶段 2 执行放锁并应答：各参与者把事务彻底标记提交、释放独占锁并向协调者返回完成确认 `ACK`
          explain: 记死每个节点的“先落磁盘日志再发网络回音”原则——只有把状态记进盘里，节点半路重启才知道刚才已经投过票还是已经拍过板！
      - card:
          title: 例题：验证 2PC 三种决策边界与“为什么参与者投过 YES 就丧失单方面反悔权”？
          body: |
            用一个模拟状态机 `two_phase_decision(votes, coord_alive)` 过三关：
          reveal:
            - title: 第 1 步：任意参与者回 `NO`（或未投就超时）→ 全部安全 `ABORT`
              body: 只要看到 `votes = ["YES", "NO"]`（有一方约束报错或没资源），协调者直接写下 `ABORT` 并通知另外那位刚投 `YES` 的也安全回滚解锁；而投 `NO` 的那位自己本来就没承诺过，发完 `NO` 后连协调者回信都不用等即可当场清理资源退出。
            - title: 第 2 步：收到 `["YES", "YES"]` 后协调者活着 → `COMMIT`；协调者此刻崩溃 → `BLOCKED_HOLDING_LOCKS`！
              body: 如果参与者 A 和 B 都答复了 `YES` 承诺就绪，协调者正准备掏出日志笔写决定却突然断电崩溃：此时 A 可能不知道“B 到底投了 `YES` 还是 `NO`？协调者临死前写下了 `COMMIT` 还是没写？”。万一 A 自作主张私下提交了，其实 B 投了 `NO` 就立刻破坏原子性！反之亦然——唯一保不犯错的代价就是 **一直持有写锁阻塞等待协调者修好重启查日志揭晓谜底**！
            - title: 第 3 步：怎么真正缓解 2PC 的这种单点阻塞？（工程答案）
              body: 理论上可以用加多一轮“预提交（Pre-Commit）”的三阶段提交（3PC，但网络分区下依然无法绝对完美免撕裂）；现代分布式工业界最稳妥主流方案是**直接把无状态易挂的“单台协调者”替换为“3 节点 Raft/Paxos 共识副本组”**（它的恢复细节与无单点化后面会讲到）。
      - item:
          id: q-2pc-coordinator-crash
          type: choice
          prompt: 在 **两阶段提交（2PC）** 中，协调者发完 `prepare`，全部分片参与者也老老实实把准备记录写盘锁定了局部数据行并回复了“同意（YES）”，紧接着**协调者在发出最终决定前突然崩溃失联**。此刻参与者会发生什么？
          options:
            - text: 参与者已经承诺交出了决定权，既不敢单方面提交（怕别的参与者其实投了反对或协调者决定中止），也不敢单方面回滚（怕协调者死前已决定提交并通知了别人），只能**继续死死持有数据行锁阻塞等待协调者恢复**
              correct: true
            - text: 全部参与者会在 1 秒后直接忽略一致性，一半自动提交另一半自动回滚
              why: 宁愿阻塞等待也绝不拿原子性冒险，这正是 2PC 著名的 **阻塞问题（Blocking Protocol）**
            - text: 因为还没有发 `commit`，所以全部分片自动清零刚才扣走的锁完全无任何阻塞
              why: 参与者已经投了 `YES` 并写了准备日志，在协调者公布结果前一旦放锁让外部事务篡改这些行就再也没法履约提交或安全撤销！
          explain: 注意**只要你在“投 `YES` 之后、收到决定之前”这段不确定窗口里，你就是无助的人质，必须等协调者醒来或靠共识复制的高可用协调者接班**！
      - item:
          id: q-2pc-why-log-before-vote
          type: choice
          prompt: 为什么参与者必须在**回复 `YES` 投票之前**，先把自己的准备状态和 `Undo/Redo` 日志强制落入本地持久化磁盘（而不能先回 `YES` 过后再慢慢存盘）？
          options:
            - text: 万一参与者刚发完 `YES` 回信就立刻断电重启，协调者那边可是算上这票然后全票通过下达了最终 `COMMIT`！重启后的参与者必须从自己的持久化日志里查到刚才曾投过 `YES` 并拥有完整的 `Redo` 数据把这笔账稳稳提交上去
              correct: true
            - text: 因为如果先发回信再存盘会导致协调者把刚才发的钱倒扣十倍
              why: 核心矛盾在于“你嘴上对外做出了‘随时准备被告知必须提交’的刚性承诺，如果下一毫秒失忆忘了数据就无法履约了！”
            - text: 因为磁盘规定每次写日志前必须先收到三次网络错误
              why: 与前面 WAL 逻辑一模一样——**对外做出任何无法单方面撤销的承诺之前，先把承诺凭据和完整数据稳妥刻进持久化磁盘**！
          explain: '**“先落盘后承诺，先写日志再发令”**——单机 WAL 的魂直接延续到了跨机 2PC 协议的每一步里！'

  - id: recovery
    chapter: 分布式事务
    title: 2PC 分布崩溃恢复、推断中止（Presumed Abort）与去单点化
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 2PC 最怕半途机器突然崩掉又重启。现在设想更细致一点的恢复成本：全集群每天跑 `10 亿` 笔跨分片事务，其中有不少事务其实因为某步报错直接就 `ABORT` 中止了。协调者每碰到一笔决定要中止或还没记完就意外重启找不到的事务，难道还要永久把几亿条陈年“中止日志”全死记一辈子等永远可能失联的参与者回头来问吗？有没有让协调者**记不住/没查到日志就一律按默认“中止（Abort）”处理**的聪明优化？
          options:
            - text: 有！就是 **推断中止（Presumed Abort）**：一旦没查到任何该事务提交记忆，协调者无需写盘保存冗长持久化的 ABORT 日志、也不用等非提交确认 ACK，一律安全默认回答“已中止（Abort）”即可！
              correct: true
            - text: 协调者遇到不认识、内存忘了的失联事务干脆一律默许回答“直接提交吧（Presumed Commit）”最省事
              why: 极其危险！协调者可能在投票都还没收齐甚至没记录前刚启动重崩溃，“不认识就糊涂说提交”会把半死不活甚至只跑一半的烂事务错放进正账！唯一安全默认缺省值只可能是**中止回滚（Abort）**
            - text: 只要在参与者崩溃重启时把硬盘格式清空重新来过就行了
              why: 恢复逻辑必须依赖双方协调日志准确分出“还没投过票（可安全 Abort）”“投了 YES 等死裁决（去问协调者）”和“已经明确 COMMIT/ABORT 完结”几种精确状态
          explain: 这一课讲 **2PC 的全部崩溃恢复分支**，以及极其聪明的工程减负优化 **推断中止（Presumed Abort）**！
      - card:
          title: 崩溃重启后协调者与参与者各自翻日志怎么接续？
          body: |
            假设某节点断电修好重新上线，立刻翻本地 WAL 确定处于哪个时间口：
            - **协调者重启**：查看自己日志里有没有记下最终决议（`COMMIT` 或 `ABORT`）——若有，顺手重发通知让还没回完 `ACK` 的参与者落账结束；若连决议都还没写进盘就崩了，**协调者自己就有权拍板写 `ABORT` 统统安全中止回滚**！
            - **参与者重启**：① 日志里连 `PREPARE-YES` 都没写到过就崩了 → 从没做过承诺，直接原地当场局部回滚；② 已经写过 `PREPARE-YES` 却没看到 `COMMIT/ABORT` 结局 → 必须维持该事务锁并主动发消息向协调者（或同伴共识组）追问到底结果如何！
      - card:
          title: 推断中止（Presumed Abort）与“3PC / 共识复制协调者”缓解阻塞
          body: |
            **推断中止**：为省掉海量的中止日志同步刷盘和最终 `ACK` 通信开销，规定协调者只要决定 `ABORT`，只需在内存通知大家撤销即可直接抹掉状态（无需刷盘等待慢吞吞回音）——万一以后有延迟重启的参与者跑来傻问“X 号事务提交还是中止呀？”，协调者查记忆里找不到这号，按默认规矩一律回复 **`ABORT`**，安全且省掉半数刷盘延迟！

            另外为了避免单台协调者挂了拖死所有人，现代系统用**把协调者状态存进 Raft 共识组**（或者让首个关键分片充当带多数派副本备份的协调组）消除协调者单点阻塞！
      - item:
          id: q-2pc-recovery-match
          type: match
          prompt: 机器在 **两阶段提交（2PC）** 执行中途崩溃重启翻看本地日志后，把四种精确日志状态与节点应当采取的唯一安全恢复动作配对。
          pairs:
            - [参与者翻本地日志，发现根本没有写过 `PREPARE-YES` 记录, 自己从没向外许诺过提交，当场原地回滚释锁安全撤销即可]
            - [参与者翻本地日志，发现已写下 `PREPARE-YES` 但还没收到结局通知, 已把决定权交出不能自裁，保持该事务资源锁并主动向协调者追问最终裁决]
            - [协调者翻自己日志，发现还没写下最终 `COMMIT` 决议就已经崩溃, 协调者自身绝未发过 COMMIT 指令，安全拍板直接宣布整体 `ABORT` 中止回滚]
            - [开启 **推断中止（Presumed Abort）** 后协调者记忆里完全查无某久远事务号, 无需翻海量废中止日志，按照安全默认一律回复“该事务已 `ABORT` 回滚”]
          explain: 这四行状态表一字不漏覆盖了经典 2PC 崩溃恢复所有分支——每一条背后的唯一铁律依然是：**谁还没发过无法单方面撤销的承诺，谁就能退；发了 `YES` 的人质唯一能信的只有协调者持久态结果**。
      - card:
          title: 例题：为什么把 2PC 和 Raft 组合起来（如 TiKV / Spanner 模式）就能突破 2PC 单点卡死瓶颈？
          body: |
            教科书经常说“2PC 是阻塞协议，一旦协调者挂了大家全完蛋！”可在真实工业云库里跨分片事务照样跑得极稳。它究竟怎么用“共识”治好了 2PC 的病？
          reveal:
            - title: 第 1 步：把易死的“单台协调者机器”变成由 3 台副本构成的“Raft 协调副本组”
              body: 协调者把 `COMMIT` 决议不再只写进自己 1 台机的孤零零硬盘里，而是作为一条记录通过 **Raft 多数派共识**复制到该小组的 3 台物理机器上（甚至每一个参与分片自身也各自是个 3 副本 Raft 共识组）！
            - title: 第 2 步：只要协调组和每个分片组里各自多数派存活（例如挂 1 台），全程 **零阻塞无感知秒续**！
              body: 就算刚才那台负责统筹协调的主节点物理炸毁，协调副本组里的另一位成员 1 秒内借 Raft 接替上任，手上稳稳握着刚刚多数派记下的 `COMMIT/ABORT` 权威历史，顺手就把第二阶段下令推完！结合各分片内部也是多副本 Raft 不容易丢盘失联，在绝大多数常见单机故障下彻底化解了老式单机 2PC 的长时间人工介入阻塞困境。
      - item:
          id: q-presumed-abort-why
          type: choice
          prompt: 2PC 恢复优化 **推断中止（Presumed Abort）** 为什么能够大幅降低正常中止事务和海量只读事务的强制写盘及网络开销，同时又不损害任何安全性？
          options:
            - text: 只要协调者决定 `ABORT` 或发现记忆里找不到某个事务，一律不需要同步刷一条持久中止日志等所有回音，因为后续无论哪个迟到的参与者再来询问，找不到对应 `COMMIT` 一律安全按回滚撤销（ABORT）答复！
              correct: true
            - text: 因为推断中止允许所有节点遇到不认识的事务全都大胆直接提交生效
              why: 决不能默认提交（Presumed Commit 反倒必须在发之前强刷不知去向记录）；唯有默认 **Abort（安全回滚一切不确定事务）** 才能大胆省去中止日志强制落盘！
            - text: 因为开启推断中止后所有成功事务也不需要写日志直接扔掉
              why: 凡是决定 **`COMMIT`** 的成功事务，协调者与参与者依然**100% 必须将 `COMMIT` 决议强制写入持久化日志**直到全部完成！省下的只是占很大比例的中止/只读路径开销
          explain: 看准精妙不对称性：**成功提交必须白纸黑字强刷盘记死，失败回滚只需查无提交即默认安全撤回！**
      - item:
          id: q-participant-no-prepare-log
          type: choice
          prompt: 参与者服务器在第一阶段收到了协调者的 `Prepare` 请求，还没来得及把自己本地的准备状态刷进磁盘日志（因此也绝不可能发回过 `YES` 投票）就突然断电崩溃了。重启后这名参与者直接本地原地撤销这笔事务，协调者那边会发生什么冲突吗？
          options:
            - text: 绝无冲突！因为该参与者压根没发出过 `YES`，协调者收不到全体全票 `YES`（会按等待投票超时处理），协调者必然也统一下令整体 `ABORT`，两边完全一致！
              correct: true
            - text: 协调者会在没收到这名参与者任何投票的情况下，自作主张替他假装投 `YES` 并提交成功
              why: 协调者只有在收到**全部**参与者明确回复的 `YES` 后才允许写 `COMMIT`，任何参与者超时未应答一定触发全盘 `ABORT`！
            - text: 这名参与者重启后必须永远把那几行数据永久锁死不准再用
              why: 没写 `PREPARE-YES` 说明从未交付决策权，本地无条件回滚放锁 100% 安全合法
          explain: 正如 2PC 协议对称安全证明：只要协调者没收齐所有人的 `YES`，它死也不会发 `COMMIT`！
      - item:
          id: q-2pc-coord-before-decision-crash
          type: choice
          prompt: 如果某参与者收到了协调者的 `Prepare` 并稳妥回复 `YES` 后自己崩溃过一次重启；与此同时协调者收齐票后决定 `COMMIT` 并已通知了其他参与者，协调者日志里也存下了 `COMMIT`。重启后的这名参与者主动去问协调者，结局应该是什么？
          options:
            - text: 协调者从持久日志中查到确切的 `COMMIT` 决议并重新回复给这名重启参与者，参与者凭之前存盘的 `Prepare` 日志完成本地最终提交（Redo）并放锁，保障全员严格一致！
              correct: true
            - text: 重启的参与者因为曾经掉线一分钟，可以自行忽略全局决定悄悄回滚自己这一半
              why: 绝对不行！只要协调者已经写下 `COMMIT` 甚至通知了别人提交，重启后的参与者**必须**无条件把这笔账顺着持久化日志补提交上去以维持原子性！
            - text: 重启后会直接报错退出不让任何协调者再连上它
              why: 这正是恢复机制的使命：靠先持久化准备状态和持久化决策记录，让哪怕重启后也能安稳走完收尾
          explain: 看完整个对称状态机——任何一边出错都有唯一且无歧义的安全答案，这就是形式化恢复协议的严谨魅力！

  # ======================================================================== 键值/文档/列族/图数据模型
  - id: key-value
    chapter: 键值/文档/列族/图数据模型
    title: 键值存储模型（Key-Value Stores）与用户会话实战
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 打开任何网站点登录后，你的登录凭证对应着一串随机编码 `sid = 9f8a...`，背后挂着你的用户编号、昵称与权限配置。每次页面跳转，后端都要毫秒级根据 `sid` 一把取出这整小包信息，并且根本**不用**跟另一张表做复杂 `JOIN` 或 `WHERE 昵称 LIKE '%a%'` 搜索！面对这种只需“拿着唯一 Key 瞬间读写一个 Value”的场景，用最极简的哪类 NoSQL 模型最快最顺手？
          options:
            - text: '**键值存储（Key-Value Store）**——把数据库视作一个分布式的超大高并发持久化字典 `key -> opaque value`（常配合自动过期倒计时），按唯一键做 O(1) 极速点读写！'
              correct: true
            - text: 必须用支持十重多表外连接与三层嵌套子查询的大型多表系统，而且把一个会话拆进八张规范化表里
              why: 会话高频读取只需要通过精准 `session_id` 一跳整块读取与到期失效，拆进八张规范化关系表反而带来大量无谓连接和锁损耗
            - text: 把所有人的会话写进一个单一纯文本日志文件每次用正则表达式从头扫描到尾
              why: 千万级并发读取需要 $O(1)$ 哈希/内存索引直达与分布式水平切分扩展能力
          explain: 接下来是四种核心 **NoSQL 数据模型**，先从最简单的 **键值存储（Key-Value）** 看起，它最常见的用途之一是做 **旁路缓存**。
      - card:
          title: 什么是键值存储与它的边界取舍
          body: |
            **键值存储（Key-Value Store）** 将整套存储简化到极简接口：`GET(key)`、`PUT(key, value)`、`DELETE(key)`（部分支持带过期倒计时自动清理，如 Redis / DynamoDB 基础键值形态）：
            - **底层视角**：数据库根本不关心（或者极少解析）`value` 里面是一段 JSON 文本还是序列化二进制数据，全部按**分片键 `key` 哈希分片 + 一致性哈希**均匀撒进海量节点，极易做到亚毫秒高吞吐！
            - **天然边界**：不支持按 `value` 内部某无索引普通属性做复杂条件过滤、不支持多表 `JOIN`！一旦发现总需要按 `value` 里面好多不同字段拆开搜，就该换文档模型或关系库！
      - card:
          title: 典型场景与键命名规范
          body: |
            典型选型：**用户会话（User Sessions）→ 首选键值存储**（按唯一会话编号高速读写、常带过期淘汰机制，天然抗高并发热点切换）。

            实际工程习惯用带冒号分层的清晰命名空间做键（例如 `session:9f8a...`、`cart:user:42`、`product:42`），方便按业务前缀隔离管理；但别忘了：**当业务要求强多对象跨行金融账务原子事务或频繁交叉统计报表时，老老实实回到关系型 SQL 模型！**
      - item:
          id: q-kv-best-fit
          type: choice
          prompt: 针对“网站保存数百万在线用户的**用户会话（Session）状态**：以随机唯一会话号为主键秒级存取用户信息且几个小时不用后自动销毁失效”，最恰当的首选数据模型是什么？
          options:
            - text: '**键值存储（Key-Value Store，如 Redis）**，天生契合按单一明确键高速 `GET/SET` 读写与内置过期时间清理，且极易水平扩分片'
              correct: true
            - text: 必须用图数据库顺着每个字画五层社交关系网来查一个会话 ID
              why: 会话查询几乎永远是 1 次直接按 `session_id` 精确点取，没有任何多跳图谱遍历或嵌套文档检索需要
            - text: 只能用单机本地磁盘 Excel 文件保存
              why: 多台无状态 Web 服务节点背后需要集中高速、支持过期自动淘汰的共享键值会话库
          explain: 凡是查询路径高度单一锁定“**几乎 100% 只靠单一确定 Key 查整包 Value**”的场景（会话、购物车快照、限流计数器、特征配置字典），键值存储是无可争议的效率冠军！
      - card:
          title: 例题：为什么不能滥用纯 Key-Value 去硬做“多条件后台管理订单检索”？
          body: |
            开发用键值存储存了一百万个订单 `order:1001 -> {"uid": 5, "status": "paid", "date": "2026-11"}`。前端下单按 `order:1001` 查飞快！第二天运营提需求：“帮我筛选上个月所有已支付且用户来自北京的总金额排行！”纯键值库会怎么惨翻车？
          reveal:
            - title: 第 1 步：纯键值把 Value 当黑盒，根本没有针对 `status` 或 `date` 的二级索引！
              body: 键值存储的路由与索引只认最外层的 `key`（`"order:1001"`）。运营想按 Value 里面的 `"status"` 或 `"date"` 筛全站订单时，纯键值引擎根本无法定位哪几个订单符合条件——要么报错不支持，要么只能笨拙地 `SCAN` 全集群几百万个键全拉出来挨个解码 JSON 过滤，性能当场归零！
            - title: 第 2 步：认清选型界线——一旦需要按内部属性条件检索/汇总或强一致性，就别硬上纯键值！
              body: 如果确实既需要按内部半结构化各异字段建二级索引查询，选择 **文档数据库（如 MongoDB）**；如果同时还需要严谨外键参照、跨实体 `JOIN` 和复杂资金事务汇总统计，则老老实实归位 **关系型 SQL（D.1.1/D.1.2）**！
      - item:
          id: q-kv-limitations
          type: choice
          multi: true
          prompt: 在选用纯粹的 **键值存储（Key-Value Store）** 作为数据持久化层前，工程师需要清醒认识到它为了换取极高吞吐与易分片所做的哪些边界取舍？（多选）
          options:
            - text: 原生不擅长也不主打“按 Value 内部非主键随机字段做多条件组合筛选或跨多个不同集合做多表连接 `JOIN`”
              correct: true
            - text: 绝大多数业务存取逻辑完全依赖“已知明确精确 Key 的整值存取”（必须仔细设计好如 `entity:id` 这样明确的 Key 构造规则）
              correct: true
            - text: 它会自动把全库所有 JSON 字段建成免费的多维向量和全表外键参照约束
              why: 纯键值存储故意把 Value 视为不透明包裹以最大化分片路由简便与读写速率，外键参照与多列交叉查询并非它擅长之事
            - text: 键值模型绝对无法横跨多台服务器切分扩展，只能死死塞在单台单盘上运行
              why: 正相反，结构极简无交叉依赖正是键值模型最容易配合一致性哈希水平扩到成百上千台机器的突出强项而非缺点
          explain: 看！选对模型的第一步就是问自己：**我的查询是不是全都能提前转化成已知 `Key` 的精确提取？**
      - item:
          id: q-kv-match-scenarios
          type: match
          prompt: 把下面四种具体数据读写需求与“最该交给 KV 还是不该硬上纯 KV”的工程判断配对。
          pairs:
            - ["按唯一 `session_id` 每秒 10 万次秒取当前登录用户身份包并设 2 小时超时销毁", 最合适 **键值存储**（天然 `O(1)` 点查 + 原生过期）]
            - ["记录接口每秒限流计数 `ratelimit:uid:42:min10` 与原子递增拦截", 最合适 **键值存储**（明确单键前缀 + 极高速原子计数）]
            - ["后台运营按“下单城市、商品品类、价格区间、发货状态”任意组合动态查报表", 不该硬用纯 KV（应选关系型 SQL 或配齐二级索引的文档/分析库）]
            - ["多方资金对账账户间严格遵循外键、CHECK 约束与跨账户转账原子更新", 不该单靠普通无外键 KV（首选支持 ACID 强约束关系型或分布式 SQL）]
          explain: 会用键值模型存高并发的短期状态只是开始，它更常见的用法是：**把键值存储当作网站数据库前面的高速“旁路缓存”，并用好 `TTL`**。

  - id: cache
    chapter: 键值/文档/列族/图数据模型
    title: 网站补充练习 · 缓存未命中时回哪里与 TTL 失效策略
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 在“网站开发”路线里我们讲过：每次刷新商品详情页 `product:42` 如果都要回后端主数据库查一次，大促秒杀时主数据库 1 秒就被压垮了。于是工程师在前端后端与主数据库之间挡了一层高速内存键值对——**缓存**（如 Redis）。如果缓存里正好没找到（**Cache Miss，缓存未命中**），或者刚刚后台管理员把商品价格从 `99` 改成了 `79` 元，网站接下来应该怎么走才不会永久显示错价钱，也不会压死主库？
          options:
            - text: 缓存未命中时回源去**持久化主数据库**查询并写回缓存（旁路缓存 Cache-Aside）；同时给缓存项设好明确的倒计时失效时长（**TTL**），并在主库更新价格后主动删除/失效旧缓存键防脏数据长期滞留！
              correct: true
            - text: 缓存未命中就直接返回 404 说“这件商品不存在”，反正永远不要去问后端主数据库
              why: '**缓存**只是主数据库前面加速读取的“易失高速副本代理”，绝对不能取代主库成为唯一数据源！未命中时必须老老实实“回源”问主库补全'
            - text: 把商品价格永久锁死存进缓存十万年都不设过期时间，哪怕主库改了价钱也不管不删除缓存
              why: 没有**过期时间（TTL）**与主动更新失效机制的话，一旦错过更新通知，用户将在几个月里永远看见过时假价格！
          explain: 这一课把键值存储用在 Web 高并发缓存上，重点是“**缓存**未命中时回哪里取、怎么用 **TTL** 避免长期读到旧数据”。
      - card:
          title: 什么是缓存与旁路缓存（Cache-Aside）工作流（Web 衔接）
          body: |
            放进高速内存键值库充当后端保护盾的临时数据副本层就是 **缓存（Cache）**。最普遍的 **旁路缓存（Cache-Aside）** 读流程只需三步：
            1. 收到查询请求 `product:42`，先查高速 **缓存**：若**命中（Hit）**，亚毫秒直接返回给浏览器！
            2. 若**未命中（Miss）**（第一次查或刚过期）：**回源查询权威持久化主数据库**（如 PostgreSQL/MySQL），拿到真实行数据；
            3. 将拿回的结果顺手写进缓存（如 `SET product:42 ... EX 60`）并附上超时秒数，下次千万人再查全在内存秒回！
      - card:
          title: TTL 超时兜底与“先写主库、再删除缓存”防脏一致纪律
          body: |
            主库数据更新时缓存怎么跟着变？遵循两条铁律：
            - **必须设置生存时间 **TTL**（Time To Live）**：例如给每条商品详情带 `EX 60`（`60` 秒倒计时，到第 20 秒查剩 `40` 秒，满 60 秒自动驱逐回主库重拉最新值）——**TTL 是哪怕清理消息丢包时也能限制数据陈旧上限的最后保底安全阀！**
            - **写路径用“先更新主库，再 `DEL` 删除（作废）缓存”**：别直接并发盲写覆盖新值进缓存以免乱序覆盖成旧值；直接 **`DEL product:42`** 让它干脆失效（Verify 验证得返回 `1` 删除成功，紧接着 `GET` 为空迫使下次读稳稳从主库回源捞出新版！）。
      - item:
          id: q-cache-miss-flow
          type: order
          prompt: 请把经典网站 **旁路缓存（Cache-Aside）** 在收到商品详情请求且恰逢**缓存未命中（Cache Miss）**时的完整回源步骤按先后顺序排好。
          steps:
            - 请求抵达后端，先以明确规范键 `product:42` 查询高速缓存（发现未命中 Cache Miss）
            - 回源查询持久化主数据库获取当前权威且最新的商品记录
            - 把查出来的最新记录序列化写入缓存并设置合理的超时过期时间 **TTL**（如 `EX 60` 秒）
            - 将最新商品数据返回给前端响应，后续大量重复请求将直接从缓存高速命中
          explain: 记死：**读未命中去主库回源并重填带 TTL 的缓存；写更新时则坚决优先更新权威主库然后直接 `DEL` 删掉对应旧缓存键！**
      - card:
          title: 例题：`TTL = 60s`、`EX 1` 过期以及 `DEL` 作废的实测状态演变
          body: |
            按真实 Redis 的缓存存活规则，一步步跟踪 `product:42` 在时间轴上的状态变化：
          reveal:
            - title: 第 1 步：`t = 100s` 初次查询 MISS 回源加载并写入 `TTL = 60s`
              body: '在 `t = 100s` 首次请求 `product:42` 时缓存为空，系统判定 **`MISS`** 后去主库拉回 `''{"id": 42, "price": 99}''` 并设为在 `t = 160s` 过期。到了 `t = 120s` 第二个用户再来读，直接 **`HIT`** 命中无需惊动主库，此时查看剩余寿命 `TTL = 160 - 120 = 40` 秒！'
            - title: 第 2 步：一到 `t = 160s` 过期时刻，自动变成未命中重新拉取最新主库
              body: 到了 `t = 160s`（或实验里设短 `EX 1` 等 1 秒过期后 `TTL == -2` 表示键已被驱逐不存在），再次读取立即再次变为 `MISS`，顺势回到主库把这段时间可能悄悄变过的最新价重拉进新一批 60 秒窗口里！
            - title: 第 3 步：同时警惕生产三大缓存灾难——穿透、击穿与雪崩怎么防？
              body: ① **雪崩**（大批量键同一秒集体过期压垮主库）→ 给基础 TTL 加上一个随机几秒小抖动错峰过期；② **击穿**（爆款热点键过期瞬间上万人同时穿透去回源查同 1 行）→ 只放 1 个抢到互斥加载权去主库回源重填，其余稍微等待共享回 fill 结果；③ **穿透**（恶意一直查根本不存在的 `product:-999` 每次都 MISS 穿透打穿主库）→ 对查不到结果的空值也短存几十秒或前面加 **布隆过滤器** 一微秒挡死！
      - item:
          id: q-cache-update-vs-delete
          type: choice
          prompt: 管理员刚刚把商品 `42` 的价格在主数据库从 `99` 元调成了 `79` 元。在旁路缓存最佳实践里，更新主库之后对缓存里的 `product:42` 推荐做什么动作，以及为什么要同时保留合理的 **TTL**？
          options:
            - text: 优先安全更新持久化主数据库后，立即执行 **`DEL product:42`** 直接**删除失效**旧缓存（等下次真有人读时按最新主库回源懒加载），同时依托原有 **TTL** 作哪怕删键指令偶发失联时的最坏陈旧时限兜底
              correct: true
            - text: 先把缓存删掉、然后再去慢吞吞改主库、最后祈祷永远不要设任何 TTL
              why: 若先删缓存在主库还没改完前的空档里，另一个并发读请求极易立刻从老主库把旧价格 `99` 重新读回并重新填进缓存导致长期卡成脏数据！先写主库再删缓存（外加兜底 TTL）安全得多
            - text: 从此永久禁止主数据库修改任何商品价格
              why: 缓存是服务于多变真实主库的加速层，绝不能反客为主锁死主库变更
          explain: 同时记住三个防灾招：**随机打散 TTL 错峰防雪崩、单飞回源防热点击穿、布隆或短空值防不存在键穿透！**
      - item:
          id: q-cache-anomalies-match
          type: match
          prompt: 把高并发网页 **缓存** 系统常见的四种工程现象与对应的应对手段匹配起来。
          pairs:
            - [缓存雪崩（大量热点键恰好同时在这一秒集体 TTL 到期，流量全冲垮主库）, 在基础 TTL 上叠加随机抖动分钟/秒数错峰过期，配限流兜底]
            - [缓存击穿（某超级爆款单键刚到期那一毫秒，上万并发请求全直扑主库查同 1 行）, 单个回源加载独占锁（Singleflight）只放 1 路去主库加载重写，余下复用结果]
            - [缓存穿透（攻击者专查库里根本不存在的负编号，次次都 Miss 并直接透传打主库）, 对空查结果也短时缓存空占位，或在前面用布隆过滤器极速直接拦截不存在键]
            - [主库改价后想尽量减少并发读写交错把老值重塞进缓存并限制最坏滞后, 坚持“先稳妥提交主库再 `DEL` 删旧缓存”配合有限 **TTL** 超时保底]
          explain: 把这篇补齐，“网站开发”远征中那句“常用的数据怎么放进缓存、未命中回哪里”就有了无比坚实的系统工程根基！

  - id: wide-column
    chapter: 键值/文档/列族/图数据模型
    title: 宽列/列族存储模型（Wide-Column）与时序/稀疏海量表实战
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 想象一个要存亿级台物联网传感器每秒发来的温度、电量与各种可选自定义报错字段的系统（或者像 Google Bigtable / Apache HBase / Cassandra 那样存全互联网抓取网页快照和历史版本）：有的行有 5 个字段、有的行有 500 个不同字段，如果硬塞进固定几百列的关系型表格，不仅大半格子全浪费成 `NULL`，每秒几百万条带时间戳的追加写入也会卡爆！哪类 NoSQL 数据模型专门为此而生？
          options:
            - text: '**宽列 / 列族存储（Wide-Column Store）**——按“行键（Row Key）→ 列族（Column Family）→ 任意动态排序列限定符 → 带时间戳多版本值”组织稀疏二维映射，同一列族物理按有序键极速扫描并极致压缩！'
              correct: true
            - text: 在普通关系数据库表里预先硬性 `CREATE TABLE` 写出 5,000 列名为 `col_1..col_5000`
              why: 固定死写 5,000 列不仅超过绝大多数引擎单表列数限制、严重浪费空间且每次新增一个传感指标都要发极其昂贵的 `ALTER TABLE` 改全局骨架
            - text: 把十亿条时序数据全部合并成一个 100 TB 的超长单个文本行存进 1 个键下
              why: 单一超大键值对根本没法按时间区间切片范围读，也撑死单节点内存
          explain: 搞清 **宽列/列族模型（Wide-Column Store）** 为什么适合“**设备时序指标**”这类稀疏、海量写入的场景。
      - card:
          title: 宽列（列族）存储结构解剖：行键 + 列族 + 动态列
          body: |
            像 HBase / Bigtable / Cassandra 属于 **多维有序稀疏映射（行键 → 列族 → 动态列限定符 → 时间戳值）**：
            - **列族（Column Family）**：建表仅需定几个粗分组，同列族磁盘连续存放高压缩；
            - **动态列**：各行可按需自由增列，缺失指标**绝不占磁盘半字节空间**！
      - card:
          title: 为什么宽列极其适合“设备时序指标”与写入吞吐
          body: |
            看清宽列在 **设备时序指标**（如百万台车联网/机房传感器日志）场景的三大杀招：
            1. **复合有序键布局**：把 `行键 = 设备ID`、片内按 `时间戳` 顺序排列（或组合行键 `device_id#timestamp` 并靠哈希散列打散写入热点），一次范围顺读就能直接拉出某台设备连续一天的温度序列，顺路按列特征高效压缩省下几倍空间；
            2. **配合 LSM-Tree 顺序追加写**：新写入先写内存跳表缓冲 + WAL 日志，凑批后按有序行键刷成不可变磁盘段（SSTable），把大量随机写变成高速磁盘顺序写！
      - item:
          id: q-widecol-timeseries
          type: choice
          prompt: 为“几十万台物联网**设备持续高频上报的时序监控指标**（按设备编号与时间区间高效范围扫描并具备高度压缩比）”挑选最匹配的经典 NoSQL 数据模型，应当优先选哪一类？
          options:
            - text: '**宽列 / 列族存储（Wide-Column Store，如 Cassandra / HBase）或专用时序优化引擎**，利用“行键哈希打散写热点 + 内部按时间戳有序排列 + 同类型列族连续紧凑高压缩”'
              correct: true
            - text: 图数据库（把每一秒的温度点画成一个社交圆圈用七重图路径找）
              why: 时序指标核心操作是按“某设备 + 时间区间”顺序高速追加与顺序范围扫聚合，而不是在复杂实体网里跳转找二度好友
            - text: 必须禁用任何时间戳排序并强制全网每次查 1 分钟均值时全表随机乱扫
              why: 宽列和时序引擎的核心正是“让同一设备的相邻时间数据在物理磁盘页上紧密有序连排”！
          explain: 记清对应：**高频会话快照 → 键值**；**海量大吞吐时序指标/稀疏多版本大表 → 宽列（列族）**！
      - card:
          title: 例题：拆解 HBase / Cassandra 表里真实存的一条传感器记录长什么样
          body: |
            假设某环境监测宽列库定义了 `meta`（固定小元信息）与 `sensor`（高频传感器读数）两个列族。看第 `dev-01` 号和 `dev-02` 号设备物理上各自存什么：
          reveal:
            - title: 第 1 步：稀疏零浪费——不同行拥有的动态列名完全不必一模一样！
              body: '`dev-01` 这一行在 `sensor` 列族里可以只存 `sensor:temp = 26.4` 与 `sensor:co2 = 410`；隔壁 `dev-02` 是特种型号，多带了个风速计和气压计，直接顺手塞入 `sensor:wind = 3.2` 与 `sensor:pressure = 1013`——**完全不用改任何共享表定义，`dev-01` 也不用替自己没有的风速计浪费哪怕 1 个字节存 `NULL`！**'
            - title: 第 2 步：冷热分隔——列族分离防止查大日志时顺手拖慢小元数据
              body: 正因为建表时把小巧常用的 `meta:location` 和体积庞大的实时 `sensor:*` 划分进了两个彼此独立存储文件的**列族**，平时只需核对全网设备安装地点清单时引擎根本不用打开那几十 TB 的传感器海量曲线数据文件，I/O 骤降百倍！
      - item:
          id: q-widecol-sparse-null
          type: choice
          prompt: 在如 HBase / Bigtable 这类 **宽列（列族）存储** 中，一张表里记录着一万台设备的五百种不同类型监测指标，但每台设备实际往往只上报其中三五项。相比在严格关系表里建 500 个固定列，宽列存储怎么做到几乎“零空值空间浪费”？
          options:
            - text: 列限定符（Column Qualifier）是每一行自带动态键值的稀疏映射元素——某行如果没出现某个指标就根本不在该行磁盘存储里写入该列条目，不像固定二维表必须留出 `NULL` 占位！
              correct: true
            - text: 引擎会自动把所有没上报的传感器随便填进数字 `100` 充数
              why: 绝不能伪造任何不存在的测量值，不存储即代表稀疏缺省
            - text: 宽列引擎强迫这 1 万台设备必须完全删掉只准用同一模一样的 1 个数字字段
              why: 宽列模型支持在同一列族内逐行自由追加成千上万个任意稀疏动态列名！
          explain: 这也是为什么宽列在极度稀疏异构海量日志、爬虫网页快照与多指标设备监控场景下所向披靡。
      - item:
          id: q-widecol-vs-columnar
          type: choice
          prompt: 初学者常常混淆 **宽列存储（Wide-Column，如 HBase/Cassandra）** 和 OLAP 数据仓库常讲的 **纯列式存储文件（Columnar Store，如 Parquet）**。对它们底层本质更准确的区分是什么？
          options:
            - text: 宽列存储更像是“按行键分片排序 + 内部按列族分开存储、支持实时高频点读写（OLTP 级高并发追加）的稀疏多层键值映射”；而 OLAP 纯列存格式把同一整列成千万行打包连续压死放在一起以服务大批量只读分析扫描
              correct: true
            - text: 两者 100% 是同一个词的不同中文翻译，全都不支持按主键实时单行更新插入
              why: HBase 和 Cassandra 天生用来接住每秒数十万次实时点写插入，而不可变 Parquet 文件主要面向离线海量批扫描统计，不可混淆！
            - text: HBase 绝对不允许建超过 1 个列族，且根本不能按行键定位单行
              why: HBase 通过按字典序排列的 `Row Key` 快速单行点查与局部区间扫描，可配 1–3 个列族分隔读写冷热特征
          explain: 分清术语陷阱以后无论别人问起 Bigtable/Cassandra 还是 OLAP 列存分析表，都能一眼答出两者本质差异！

  - id: documents
    chapter: 键值/文档/列族/图数据模型
    title: 文档数据库模型与“文档 vs 关系模型”深度对比
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 做一家百货商城的商品目录库：有“笔记本电脑（需要存 CPU 型号、内存、屏幕刷新率）”、“纯棉 T 恤（需要存尺码 S/M/L、面料成分、颜色列表）”还有“生鲜牛奶（需要存保质期、冷链温度）”，成百上千种品类商品的属性各不相同且经常带有两三层嵌套数组！而且要求能按“尺码 = M”或“内存 >= 16GB”建索引快速搜货！除了刚学过的 KV 和宽列，哪种 NoSQL 模型就像把一个个灵活自洽的 JSON 对象直接放进集合里搜？
          options:
            - text: '**文档数据库（Document Store，如 MongoDB）**——把一条完整记录连同它的全部异构子属性和嵌套子列表直接存成一篇自描述 JSON/BSON 文档，既免除拆碎多表连接又能对任意嵌套字段建索引查询！'
              correct: true
            - text: 强迫 T 恤必须填 CPU 频率、强制笔记本电脑必须填纯棉含棉量
              why: 强行往整齐定死的关系单一表塞各异品类会导致遍地空列，要么被迫建几十张极零散的子类继承表每次展示还要做五重外连接！
            - text: 只要改用纯键-值不透明黑盒就自动能按嵌套的 `"memory >= 16"` 做内部范围索引查询
              why: 纯 KV 把整个 Value 当盲黑盒无法感知里面有什么结构；**文档模型**专门解析感知自身半结构化字段，支持直接在内部深层属性上建索引！
          explain: 本课梳理 **文档存储（Document Stores）** 及其与经典 **关系数据模型（Relational）** 的全景适用对照。
      - card:
          title: 什么是文档存储（Document Store）与为什么适合异构商品目录？
          body: |
            **文档数据库**以集合（Collection）管理一篇篇结构自洽的半结构化 **文档**（JSON / BSON 等树状对象）：
            - **柔性模式（Schema-Flexible）**：同一集合里上一件存笔记本硬件规格、下一件存服装尺码配列，各自独立描述互不强求统一字段，升级业务添个新嵌套字段不用全库锁表改列；
            - **局部性好免 JOIN**：把订单头与它那几条不会单独被别处引用的商品快照小明细直接内嵌写进同一文档（反范式嵌套），读一次拿全整页面！且与单纯键值不同，**引擎读得懂内部属性、支持按嵌套路径（如 `specs.ram`）建二级索引**！
      - card:
          title: 文档模型 vs 关系模型：什么时候必须坚持关系表？
          body: |
            如果文档这么自由好用，为什么银行、ERP 和教务系统绝不轻言放弃关系表？
            - **无统一跨文档复杂关联与严参照约束**：当你的数据高度互联（多对多图网、多个实体的共享主档不断被互相引用且要求改一处姓名全站瞬间同步一致，例如学生档案和几百条跨表选课）——如果把学生全名和专业强行冗余嵌进几十万份选课文档里，改一次专业就会瞬间跌回 D.1.1 第一课骂过的**修改更新异常深渊**！
            - **多文档复杂事务与规范化清洁度**：高度规范化且关系纵横交叉的业务，依然属于严谨 **关系模型** 的主场！
      - item:
          id: q-doc-vs-relational-match
          type: match
          prompt: 把 **文档模型** 与 **关系模型** 在工程设计决策中的四项典型特征各自匹配。
          pairs:
            - ["属性千差万别的电商百货商品目录（品类各异且经常嵌套多层规格与图片数组）", "**文档数据库（Document Store）**"]
            - ["必须严守外键参照完整性、消除多处冗余抄写（防更新异常）的教务/ERP 多表体系", "**关系型数据库（Relational）**"]
            - ["虽然各文档结构灵活不同，却仍需针对内部深度路径 `attrs.color` 建 B+ 树索引过滤", "**文档数据库**（胜过不透明盲黑盒 KV 之处）"]
            - ["强迫在大量不同文档里到处冗余嵌入同一家频繁改名厂商的完整名称和联系档案", "**反范式嵌套陷阱**（该用规范外键/引用拆表，否则引发更新异常）"]
          explain: 记死判断准则：**被嵌套的子东西只随主人一起生死且很少单独变动/跨方共享（如订单里的地址历史快照）→ 嵌进同一篇文档！会被成百上千其他地方同时独立引用并同步更新（如作者资料/学生主档）→ 拆出引用/走关系模型！**
      - card:
          title: 例题：同样是“评论系统 + 个人主页”，哪些东西应该嵌进一篇文档，哪些必须分表拆开引用？
          body: |
            假设拿文档库开发一个博客文章平台：每篇文章有作者、正文标签、以及下方可能高达 `5 万` 条读者评论和点赞人列表。全塞进唯一 1 篇“文章 JSON 文档”里会发生什么惨剧？
          reveal:
            - title: '第 1 步：把“几条标签数组 `tags: [''db'',''nosql'']`”内嵌在文章文档里完美！'
              body: 几项标签短小固定、永远跟文章一同查询展示、几乎不会自己单独爆涨成几 MB——直接内嵌进同一篇 JSON 文档，读文章 1 次 I/O 全拿回，比关系库连建两张中间关联表爽快得多！
            - title: 第 2 步：把“5 万条不断新增评论”或“会随时改头像的作者详情”硬嵌进去必炸！
              body: 绝大多数文档库对**单篇文档最大体积存在硬限制（如 MongoDB 16 MB 上限）**！一篇文章火了涨到 5 万条评论，每次别人追加新评论就得不断整篇改写拉长那 10 MB 巨无霸文档引发剧烈磁盘写放大直到撑爆上限！同样，若把作者头像网址硬抄进他写过的 500 篇文章内嵌块里，作者换一次头像就得全库改 500 篇文档！因此“评论”必须独立抽为按 `post_id` 分片/索引的集合，而作者只留个 `author_id` 引用！
      - item:
          id: q-doc-anti-pattern
          type: choice
          prompt: 一位开发用文档数据库存社交平台“用户”和他的“全部历史关注粉丝动态”。他直接把每位用户的所有上百万条关注者信息与实时动态列表全内嵌进那位大 V 自己的**单一篇用户文档**的数组里。随着大 V 涨粉到 50 万，系统为什么会彻底崩溃？
          options:
            - text: 无界无限增长的内嵌数组不仅很快会撞穿单篇文档大小物理上限（如 16 MB），而且每次仅增删 1 个粉丝都可能导致引擎不得不整篇重搬写放大并触发严重文档锁/版本膨胀——无界一对多极长列表必须独立拆集合按外引用关联，不能死嵌！
              correct: true
            - text: 因为文档数据库语法禁止在一个 JSON 对象里放哪怕 2 个元素的列表
              why: 少量有界定长嵌套数组（如 `3–5` 个收货地址或文章标签）正是文档模型最拿手的强项，唯独“无界可能涨成十万百万的数组”是典型文档反模式！
            - text: 因为 JSON 数组里不允许出现英文名字
              why: 核心崩溃根源在于无界无限膨胀单篇物理文档突破尺寸上限并引发巨量写入放大
          explain: 学完这课你已经掌握文档建模两条生死线：**① 有界局部私属子对象放心内嵌免 JOIN；② 无界无限增长子集合、以及共享高频改动的外部主实体必须拆开单独引用！**
      - item:
          id: q-doc-secondary-index
          type: choice
          prompt: '同样把商品规格 `{"title": "Book A", "specs": {"pages": 420, "lang": "zh"}}` 用文档库和用纯不透明键值（KV）存储。当页面想查询“页数大于 300 且语言为中文的全部图书”时，文档数据库凭什么比纯 KV 轻松得多？'
          options:
            - text: 文档数据库能解析认识存储的 JSON/BSON 内部字段结构，允许直接在嵌套路径 `specs.pages` 与 `specs.lang` 上建立二级 B+ 树索引极速定位筛选，而纯 KV 把值视为不可读黑盒只能全扫
              correct: true
            - text: 文档数据库会自动删掉书本页数让所有书变成一样长
              why: 引擎只是读取解析结构化字段以构建内部字段索引，从不篡改数据内容
            - text: 纯键值模型同样默认内置支持对 Value 内部任意嵌套 JSON 路径做跨多字段 SQL 连接优化
              why: 传统纯 KV 接口只围绕外层单一 Key 做存取与路由；正是在需要深入文档内部按属性查询过滤时才演进出文档数据库
          explain: 走到这一步，仅剩最后一种“专门解决实体与实体之间交织跳来跳去关系网络”的模型：**图数据模型（Graph Database）**。

  - id: graph
    chapter: 键值/文档/列族/图数据模型
    title: 图数据模型（Node / Relationship / Property）与多跳遍历实战
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 面对一个千万级用户社交网络或金融反欺诈资金网络，产品经理提了一个看似很简单的需求：“请实时找出小美‘关注的好友关注的好友’（三度到五度人脉），或者追踪一笔诈骗黑钱倒了 6 手之后最后流进了谁的卡里！”如果硬用关系型 `JOIN` 自连接一张几亿行的好友边表连跳 5 次 `FROM Friends f1 JOIN f2 JOIN f3 JOIN f4 JOIN f5`，为什么关系数据库会瞬间卡成幻灯片？
          options:
            - text: 关系表每次 `JOIN` 都要反复去庞大全局索引树里做全量集合大匹配，5 跳自连接中间组合与索引查找呈指数级炸裂！而 **图数据库** 直接在每个实体节点旁物理保存着直通相连邻边引用（免索引邻接），沿边顺藤多跳像内存走链表一样毫秒极速穿透！
              correct: true
            - text: 因为图论数学规定朋友之间绝对不允许超过 2 度跳数
              why: 现实推荐、知识图谱与风控反欺诈极度高频需要 3 到 6 跳深层路径检索，正是为了跑得飞快才催生了原生图数据库
            - text: 因为关系数据库根本禁止对同一张表自己连接自己
              why: SQL 语法完全支持自连接和 `WITH RECURSIVE` 递归查询，卡死的纯粹是多跳大规模索引探测的物理成本与中间膨胀代价
          explain: 这一课讲图数据库的核心概念，并把四种 NoSQL 模型放在一起对比。
      - card:
          title: 属性图模型的五大核心元素
          body: |
            **属性图（如 Neo4j）**把网状实体画成点线：
            - **节点（Node）与节点标签（Label）**：实体（如 `:Person` 节点 `Mei`）；
            - **关系（Relationship）与类型（Type）**：有向动词边（如 `-[:FOLLOWS]->`）；
            - **属性（Properties）**：**节点和关系边本身**皆可直接挂键值对属性！
      - card:
          title: 路径遍历（Traversals & Paths）与免索引邻接（Index-Free Adjacency）
          body: |
            为什么图数据库敢于一秒跑出五度人脉与环路资金反欺诈？
            - **免索引邻接**：在存储结构上，每个节点直接紧挨着物理记录“指向所有出边/入边邻居节点的直接地址引用”；从起点找完 1 度好友再去 2 度、3 度……完全**不需要每跳一次就回到几千万行的全局大 B+ 树根从头二分查表**，单跳复杂度只与当前这点自己的局部邻边度数成正比（跟全图一共几亿人几乎无关！）。
            - **四种模型怎么选**：会话 → **键值**；异构商品目录 → **文档**；设备时序 → **宽列/列族**；社交多跳关系 → **图**！
      - item:
          id: q-graph-elements-match
          type: match
          prompt: 把属性图数据库（Property Graph）里的五个核心构成要件与具体实例精准对应。
          pairs:
            - ["**Node & Node Label**", "代表独立实体与它的分类标签（如 `:Student:Athlete` 节点 `Mei`）"]
            - ["**Relationship & Type**", "连接两个实体、带明确方向且标注动词类型的边（如 `(Mei)-[:FRIENDS_WITH]->(Lin)`）"]
            - ["**Properties on Both**", "既可附着在节点（`{name: 'Mei'}`），也能直接挂载在关系边上（`{since: 2024}`）的属性字典"]
            - ["**Traversals & Paths**", "顺着局部直接邻接边向多跳外围延伸探路（免全局大索引重查）定位朋友的朋友或资金闭环"]
          explain: 特别留意这一点：关系数据库中 `M:N` 边要挂属性还得再建中间连接表；属性图里连线（Relationship）自身就能直接原生揣着属性（如转账金额与时间）！
      - card:
          title: 例题：四种业务场景各选哪种模型
          body: |
            假设你作为首席架构师评审一家大型互联网平台的存储底座方案，需要将以下四块业务数据精准分派给 **键值 / 文档 / 宽列 / 图** 四类模型并讲透硬核原因：
          reveal:
            - title: 第 1 步：用户会话（Key-Value） + 异构商品目录（Document）
              body: '**用户会话** 100% 是按唯一随机 `session_id` 做单点高频读写兼设 TTL 到期销毁，用 **键值存储**（如 Redis）最轻快省内存；**商品目录** 不同品类（手机/服饰/生鲜）自带大量千差万别规格和两三层嵌套参数且按内部属性筛选建索引，用 **文档数据库**（如 MongoDB）存自洽 JSON/BSON 文档最灵活！'
            - title: 第 2 步：设备时序指标（Wide-Column） + 社交关系多跳（Graph）
              body: '**设备时序指标** 每秒涌入千万条带设备编号与时间戳的稀疏高频写入、查询总沿着单个设备按时间区间顺序横扫压缩，选 **宽列/列族存储**（如 Cassandra/HBase 或专用时序库）把顺序写吞吐和压缩率吃满；**社交网络** 需要高频做“朋友的朋友”、“共同关注最短路径”与反欺诈环路侦测等多跳遍历，选 **图数据库**（如 Neo4j）靠免索引邻接毫秒级顺边跃迁！'
            - title: 第 3 步：同时别忘了什么场景仍该守在关系 SQL（D.1.1/D.1.2）里？
              body: 只要遇到跨账户扣款资金账本、需要严防孤儿引用的多对多核心交易明细及复杂报表关联核算，**关系型数据库（含分布式 NewSQL）依然是不可动摇的核心主心骨**！
      - item:
          id: q-nosql-four-models-ex4
          type: match
          prompt: 把平台中四种经典业务数据类型与最契合的 NoSQL 存储模型及其原因连线。
          pairs:
            - [用户登录会话状态（仅按 `sid` 高频点读写并带失效时间）, "**键值存储（Key-Value）**（极速按唯一键定位 + 原生过期淘汰）"]
            - [百货商品目录（电器/服饰/食品属性各异且带嵌套规格）, "**文档数据库（Document）**（灵活半结构 JSON 模式 + 内部字段可索引）"]
            - [千万传感器高频设备时序指标（按设备与时间段追加顺序扫）, "**宽列 / 列族存储（Wide-Column）**（顺序追加写 + 分设备有序范围扫描与压缩）"]
            - [社交好友多跳推荐与黑产资金流环路排查（3–5 跳关系遍历）, "**图数据库（Graph）**（节点直连邻边遍历，免全局大表多轮自连接爆炸）"]
          explain: 每种模型都按数据的访问方式来选：按键存取用键值，结构不固定的文档用文档库，按设备和时间范围扫描用宽列，多跳关系查询用图。
      - item:
          id: q-graph-adjacency-why
          type: choice
          prompt: 同样是求“从用户 Alice 出发沿着 `:FOLLOWS` 关系走 4 跳能到达的圈内大 V 列表”。为什么原生 **图数据库（Graph DB）** 在千万乃至上亿边规模下比传统关系表写 `JOIN ... JOIN ... JOIN ...` 快得多？
          options:
            - text: 原生图引擎具备“免索引邻接（Index-Free Adjacency）”：每个节点物理旁直存连向邻接边与邻点的直接地址，走每跳只需顺局部邻边直接跳转，耗时只与沿途经过的极少数邻居度数有关，不随全图总边数涨大而急剧变慢
              correct: true
            - text: 因为图数据库把每个用户全部限制为最多只能关注 0 个好友
              why: 哪怕存在几十万粉丝的大 V 超级节点，图数据库同样可按关系类型和方向顺边局部过滤展开，只是无需每一跳都在几亿行全局边表索引根上从头二分检索一遍
            - text: 因为图数据库根本不允许保存任何边属性或方向
              why: 属性图不仅严格区分有向边方向（谁关注谁）与边类型，还允许直接把时间、权重属性挂在边本身上
          explain: 至此整条数据库学习路线 **`D.1.1（建模与 SQL）→ D.1.2（单机引擎与优化）→ D.1.3（分布分片、复制、2PC/共识与 NoSQL）`** 三站全面贯通！
      - item:
          id: q-property-on-relationship
          type: choice
          prompt: '在如 Neo4j 这样的 **属性图（Property Graph）** 数据库中，“员工 `Mei` 从 2022 年起以 `全职` 角色入职某公司 `Acme`”。这里的入职年份 `since: 2022` 与职位状态可以直接保存在哪里，不需要像关系数据库那样额外建表吗？'
          options:
            - text: '直接以键值对**属性（Properties）**形式原生挂在代表雇佣关系的那条有向边 `(Mei)-[:WORKS_AT {since: 2022, role: "full-time"}]->(Acme)` 上！'
              correct: true
            - text: 图数据库规定关系连线上绝对不准写任何属性，只能把每年新开一家假公司 `Acme_2022`
              why: 与简单无属性图不同，属性图的核心特性正是**节点与关系连线自身均支持独立挂载键值对属性**
            - text: 必须把整张员工表抄成一张百万列的宽列大表存到外部
              why: 边上原生属性正是属性图直观刻画真实关联上下文（时间、权重、金额）最自然的优势所在
          explain: 节点（点）+ 有向分类边（线）+ 两端皆带属性（Prop）+ 免索引邻边多跳（Traversal），构成了现代知识图谱与风控图库的全部底座。

boss:
  items:
    - id: boss-sharding-range-hash
      type: choice
      prompt: 面对千万级高频写入、且常按“单个设备查过去一天记录”的物联网表，关于分片（Sharding）策略的对比与选择，下列哪一组分析全部准确？
      options:
        - text: 纯自增时间范围分片会把全部实时新写挤死在最后一个分片；纯复合全局哈希会把单设备的一天范围查询打散成全网扫描；而外层按 `device_id` 哈希分片分散热点 + 片内按时间戳有序存储，兼得了高并发写散与单设备快速范围查！
          correct: true
        - text: 只要用按最新时间做范围分片，所有实时写入流量会自动均匀平均倒进十年前的历史老分片里
          why: 最新此刻的时间永远落在最大区间末端，必定把当前负责末端范围的机器打成单一写入热点瓶颈
        - text: 用普通哈希分片把数据随机打散后，查 `BETWEEN t1 AND t2` 只需问其中任意 1 台分片就绝对不漏数据
          why: 随机哈希拆散了相邻键连续性，纯全局时间范围查必须全量扇出至全部分片（Scatter-Gather）才能不漏结果
        - text: 如果不建表直接把 1 亿条设备日志全塞在单个节点里就能永远免除分片再平衡烦恼
          why: 单机总有磁盘容量与写 I/O 天花板，突破单机硬件上限必然需要分片水平扩展
      explain: 识别热点、控制跨片扇出与善用“外散内序”分片键，是做对分布切表的关键。
    - id: boss-consistent-hashing-math
      type: number
      prompt: '在一个大小为 `100`（槽位 `0..99`，键按 `key % 100` 找顺时针首个节点 `node >= pos`，回绕至最小节点）的 **一致性哈希环** 上，原本部署了 `3` 台节点 `[10, 50, 90]`。现在向环上新增第 4 台节点 `30`（变为 `[10, 30, 50, 90]`）。检验键 `0..99` 共 100 个键，请问**究竟有多少个键**发生了归属变化迁移到了新节点 `30` 上？（填整数）'
      answer: 20
      explain: '只有原本顺时针归节点 `50` 管辖的区间 `[11..30]` 这 **`20`** 个键（占比 20%，理论均值为 `100/4 = 25`）搬去新节点 `30`；其余节点 `10`、`90` 和 `50` 剩下的 `[31..50]` 这 80 个键纹丝不动！反观若用 `key % 3` 扩成 `key % 4`，`range(12)` 里足足 `9/12 = 75%` 全盘乱迁（如 1,200 键里搬走 900 个）！'
    - id: boss-mod-n-vs-ring
      type: number
      prompt: '对照上题痛点：假设原本有 `1,200` 个键通过最天真的取模公式 `key % 3`（按键连续编号 `0..1199`）散落放在 `N = 3` 台分片节点上。现在紧急扩容加 1 台机，规则改为 `key % 4`（`N = 4`）。请问 `1,200` 个键里一共有多少个键不得不换节点搬迁？（填整数）'
      answer: 900
      explain: '因为 `lcm(3, 4) = 12`，每连续 12 个键里仅 `k % 12 ∈ {0, 1, 2}` 的 3 个键余数相同留守原地，其余 `{3..11}` 整整 **`9/12 = 75%`** 的键全算出新目标机器不得不大迁徙，对应 `1,200 × 9/12 = 900` 个！（节点越多比例越接近 100%，这正是一致性哈希平均仅移 `K/(N+1)` 的原因。）'
    - id: boss-quorum-math
      type: number
      prompt: '在副本容错配置里，一份数据一共保存在 `N = 5` 个互不相同的副本节点上，写策略设定为 `W = 3`（写入至少等 3 份确认成功才返回）。为保证读副本集合与任何已成功写入集合之间必然存在至少 `1` 个交集，每次读取最起码需要询问多少个副本 `R`？（填整数；并谨记交集本身仍需配合版本比对与防并发机制才推出强一致）'
      answer: 3
      explain: '根据鸽巢交集条件 **`W + R > N`**：`3 + R > 5` 得整数 `R >= 3`（若取 `R = 2`，则写入 `{C,D,E}` 与读取 `{A,B}` 完全不相交！而对 Dynamo 常见的 `N=3, W=2, R=2`，`2 + 2 = 4 > 3` 既保证任意写读集合相交又可容忍 1 台副本离线）。'
    - id: boss-cap-pacelc
      type: choice
      prompt: 关于 **CAP 定理**、**PACELC 框架** 以及“读己之写”复制一致性的工程理解，下列哪一组判断**全部正确**？
      options:
        - text: 发生网络分区（P）时必须在可用性（A）和强线性一致（C）间二选一；平时正常（E）则在低延迟（L）和一致性（C）间选（如 `PA/EL` 重可用低延迟并接受异步最终一致、`PC/EC` 重强一致）；且评判针对的是具体机制与可调配置，可通过主库定向路由守住“读己之写”
          correct: true
        - text: 只要 `W + R > N` 读写样本有交集，就等同于绝对完成了严格的线性一致性，完全无需管版本冲突或读修复
          why: 法定集合交集只说明“读集和写集存在重合节点”，若缺乏最新递增版本比对和并发读取保护/修复，仍可能出现先后读版本倒退
        - text: 如果不发生断网分区（E），无论选延迟优先还是选一致优先耗时永远一毫秒不差
          why: 平时正常状态下等着跨地域多数派共识写盘确认（`EC`）天然会增加网络往返延迟，远高于本地异步立即返回（`EL`）
        - text: 同一个分布式数据库产品在出厂那一刻就被永远定死唯一 CAP 标签，哪怕调整写/读副本策略也改不了半毫
          why: 许多现代分布存储允许同一款产品按不同业务需求调整配置（如切换多数派读或异步局部读）而处于不同权衡位置
      explain: 把严密定理、平时延迟权衡、会话一致性路由与谨慎不贴死标签的态度全部统一到一块，才算真懂分布式一致性！
    - id: boss-2pc-vs-raft
      type: match
      prompt: 把分布式事务原子提交（2PC）与高可用共识（Raft/Paxos）里的四个核心场景与准确结论或协议定位匹配。
      pairs:
        - ["协调者发出 `Prepare` 并收到全体参与者同意 `YES` 投票后突然崩溃失联", "参与者交出决策权不敢擅自提交或中止，**继续持锁阻塞等待协调者恢复**"]
        - ["**推断中止（Presumed Abort）**优化", "协调者不必持久化保存失败中止日志：记忆里查无 `COMMIT` 记录即统一按已安全回滚答复"]
        - ["**Raft / Paxos 共识**定位（容忍 `F` 台死机需 `2F + 1` 副本）", "解决“**同一副本组多份冗余之间状态机操作历史一致**”——也可用来让 2PC 协调者摆脱单点阻塞"]
        - ["**两阶段提交（2PC）**定位", "解决一笔跨多个**彼此独立不同数据分片**的大事务如何严格同提交或同回滚的原子提交问题"]
      explain: 这四个区分点是分布式存储领域最核心也最常考的基本功！
    - id: boss-parallel-avg-and-cache
      type: choice
      prompt: 一个高并发电商网页后端采用“分布式分片主库（含订单表 `Orders` 按 `uid` 切分）+ 旁路键值缓存（存热点商品 `product:42` 并设随机抖动 TTL）”架构。以下哪两组操作既算准了全局统计又护住了缓存不崩？
      options:
        - text: 算全局平均金额 `AVG(total)` 时向各分片下推返回 **`SUM(total)` 与 `COUNT(total)`** 汇总相除；查 `product:42` 未命中（MISS）时回源查主库并重填带 TTL 缓存，改价时先改主库再 `DEL` 删旧缓存
          correct: true
        - text: 各分片直接各自算出局部平均分后让协调者直接取各分片平均分的简单平均，且缓存一旦 MISS 直接放弃回源向用户报错
          why: 各分片非空行数不等时直接平均各分片均值会严重算偏结果；且缓存未命中必须安全回源主库加载并填充缓存
        - text: 改价时先删缓存再慢吞吞等一分钟改主库，并且把所有上万种商品的 TTL 全死定在每天凌晨整点 `00:00:00` 一起集体过期
          why: 先删后改极易把旧值重塞进缓存污染好几分钟；而万千热点键齐刷刷同一秒集体到期正是触发**缓存雪崩**打垮主库的元凶！
        - text: 永远把全部亿条商品全塞进不透明键值缓存里永不设 TTL，彻底扔掉持久化主数据库
          why: 内存易失有限且必须有持久化权威主库作真源，同时用 TTL + 主动失效限制滞后上限
      explain: 并行聚合归并 + 旁路缓存回源与防雪崩穿刺，直接把大流量 Web 系统后端撑稳！
    - id: boss-nosql-selection
      type: match
      prompt: 为现代大型互联网平台中这四类截然不同的核心数据选择最匹配的 NoSQL 数据模型（注意：强复杂多对多交易资金仍归关系 SQL）：
      pairs:
        - ["网站高并发登录会话令牌存储（按 `sid` 快速存取并随过期时间自动失效）", "**键值存储（Key-Value，如 Redis）**"]
        - [规格字段多变且包含多层嵌套属性的电商全品类商品目录（支持按内部规格建索引）, "**文档数据库（Document，如 MongoDB）**"]
        - [百万物联网传感器每秒按设备+时间戳持续追加、范围扫描与高压缩时序指标, "**宽列 / 列族存储（Wide-Column，如 HBase / Cassandra）**"]
        - [社交“好友的好友”多跳推荐与黑产资金链路追踪（免索引邻接多跳遍历）, "**图数据库（Graph，如 Neo4j）**"]
      explain: 从单机建表建模（D.1.1），一路钻透索引、WAL 与优化引擎（D.1.2），再到今日分片、共识与多元 NoSQL 选型（D.1.3）——整个现代数据系统蓝图已在你手中合拢！
