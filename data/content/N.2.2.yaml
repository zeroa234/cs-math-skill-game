skill: N.2.2
version: 2
authors: [main-agent]
brief:
  why: 晶体管、二极管、太阳能电池和芯片里的每一个器件，都建立在半导体物理上。这一关从原子在晶体里怎样排列讲起：晶格、晶面和倒格子，电子在周期势里为什么形成能带和带隙，有效质量和空穴，掺杂怎样改变载流子，费米能级和载流子浓度，漂移、扩散、复合，最后是 PN 结的内建电势、耗尽区、二极管方程和击穿。假设你学过量子力学基础（平面波、势阱、隧穿、泡利不相容原理）和电磁学。
  outcomes:
    - 说出晶格、基元、原胞和晶胞，算立方晶体的原子密度、晶面间距和密勒指数，用布拉格条件算衍射角或晶格常数
    - 求简单立方、三角晶格的倒格子，说明面心和体心互为倒格子、倒格矢和晶面的关系、第一布里渊区的意义
    - 用自由电子模型算金属的费米能和费米速度，用近自由电子近似说明带隙出现在布里渊区边界的原因
    - 按能带的填充说明金属、半导体和绝缘体的区别，区分直接带隙和间接带隙
    - 由能带曲率求有效质量，说明空穴为什么带正电、有效质量为正
    - 用质量作用定律、电中性条件算掺杂和补偿半导体的电子、空穴浓度
    - 用态密度、费米–狄拉克分布和有效态密度算载流子浓度和费米能级的位置，判断是否简并，说明准费米能级
    - 算漂移速度、迁移率、电导率、电阻率和扩散电流，用爱因斯坦关系求扩散系数，用霍尔效应测载流子
    - 说明三种复合方式，算过剩载流子的衰减、少子寿命和扩散长度
    - 算 PN 结的内建电势、耗尽区宽度和结电容，用理想二极管方程算电流和电压，区分雪崩击穿和齐纳击穿
terms:
  # 晶体结构与倒格子
  - term: 晶体
    def: '原子按固定图样在空间里周期性重复排列的固体，如金属、食盐、单晶硅'
  - term: 非晶体
    def: '原子只在相邻几个之间有大致固定的距离和角度、没有长程周期性的固体，如玻璃'
  - term: 晶格
    def: '周围环境完全相同的一组点 r = n₁a₁ + n₂a₂ + n₃a₃（nᵢ 取整数），描述晶体的周期性'
  - term: 基元
    def: '放在每个格点上的那一组原子；晶体等于晶格加基元'
  - term: 原胞
    def: '由晶格的基本矢量围成、平均只含一个格点的最小重复单元'
  - term: 晶胞
    def: '为了看清对称性而取的重复单元，可以含几个格点，如面心立方的立方晶胞含 4 个'
  - term: 晶格常数
    def: '晶胞的边长 a，硅为 0.5431 nm'
  - term: 晶面
    def: '穿过许多原子的平面；一族平行等距的晶面用密勒指数 (hkl) 表示'
  - term: 密勒指数
    def: '表示晶面朝向的三个整数 (hkl)：取晶面在三个轴上截距的倒数，再化成最小整数'
  - term: 布拉格条件
    def: '间距 d 的晶面族产生衍射峰的条件 2d sin θ = nλ，θ 是光线和晶面的夹角'
  - term: 周期
    def: '一个量每隔多远（或多久）重复一次；晶格沿某个方向的周期就是那个方向上相邻格点的间隔'
  - term: 倒格子
    def: '满足 e^(iG·r) = 1（r 取所有格点）的全部波矢 G 组成的格子；一维时 G = 2πm/a'
  - term: 第一布里渊区
    def: '倒格子里离原点比离其他倒格点都近的区域；一维时是 −π/a < k ≤ π/a'
  # 能带理论
  - term: 自由电子模型
    def: '把金属的价电子看成在势能为零的盒子里自由运动的模型，能量 E = ħ²k²/2m'
  - term: 费米能
    def: '绝对零度时电子按不相容原理填到的最高能量；自由电子模型里 E_F = ħ²(3π²n)^(2/3)/2m'
  - term: 布洛赫定理
    def: '周期势里薛定谔方程的解可写成 e^(ikx) 乘一个和晶格同周期的函数'
  - term: 布洛赫波
    def: '形如 e^(ikx)u_k(x)、u_k 和晶格同周期的波函数，平移一个原胞只多一个相位因子'
  - term: 近自由电子近似
    def: '把晶格的周期势看作对自由电子的小扰动来求能带的方法，带隙等于 2|V_G|'
  - term: 能带
    def: '晶体里电子允许的能量连成的一段段区间，每个能带每个原胞能放 2 个电子'
  - term: 带隙
    def: '两个能带之间没有电子状态的能量范围；半导体常指导带底和价带顶之差 E_g'
  - term: 克勒尼希–彭尼模型
    def: '把晶格势换成一排方势垒、能严格求解的一维能带模型，能解释能带和带隙的出现'
  - term: 价带
    def: '绝对零度下半导体里被电子填满的最高能带，顶部能量记作 E_v'
  - term: 导带
    def: '半导体里价带上面那个绝对零度下全空的能带，底部能量记作 E_c'
  - term: 直接带隙
    def: '导带最低点和价带最高点在同一个 k 上的带隙，如砷化镓；复合时能直接放出光子'
  - term: 间接带隙
    def: '导带最低点和价带最高点不在同一个 k 上的带隙，如硅、锗；光跃迁要声子补足动量'
  - term: 声子
    def: '量子化的晶格振动，能和电子交换能量和动量'
  # 有效质量
  - term: 空穴
    def: '价带里缺了一个电子的状态，整体表现为带 +e、有效质量为正的粒子'
  - term: 电子–空穴对
    def: '一个价带电子被激发到导带时同时产生的一个导带电子和一个空穴'
  - term: 载流子
    def: '能运载电流的粒子，半导体里指导带电子和价带空穴'
  - term: 有效质量
    def: '由能带曲率定义的质量 1/m* = (1/ħ²)d²E/dk²，晶体里的电子受力后按 a = F/m* 加速'
  - term: 晶体动量
    def: '布洛赫电子的 ħk，外力 F 使它按 ħ dk/dt = F 变化'
  # 本征与掺杂半导体
  - term: 本征半导体
    def: '不掺杂质的纯净半导体，载流子全部来自热激发，电子和空穴一样多'
  - term: 本征载流子浓度
    def: '本征半导体的电子（也是空穴）浓度 nᵢ，硅 300 K 时约 1×10¹⁰ cm⁻³'
  - term: 质量作用定律
    def: '热平衡时电子和空穴浓度的乘积只由温度决定：np = nᵢ²，掺杂时也成立'
  - term: 施主
    def: '能放出一个电子到导带的杂质，如硅里的磷、砷'
  - term: 电离能
    def: '把杂质拴着的电子（或空穴）放到能带里所需的能量，硅里的磷、硼约 0.045 eV'
  - term: n 型半导体
    def: '掺施主、电子是多数载流子的半导体'
  - term: 受主
    def: '能接受一个电子、在价带里产生空穴的杂质，如硅里的硼、镓'
  - term: p 型半导体
    def: '掺受主、空穴是多数载流子的半导体'
  - term: 多数载流子
    def: '半导体里浓度大的那种载流子，n 型里是电子，p 型里是空穴'
  - term: 多子
    def: '多数载流子的简称'
  - term: 少数载流子
    def: '半导体里浓度小的那种载流子，n 型里是空穴，p 型里是电子'
  - term: 少子
    def: '少数载流子的简称'
  - term: 杂质补偿
    def: '同时掺施主和受主时两者互相抵消，起作用的是两者之差'
  # 载流子统计
  - term: 态密度
    def: '每单位体积、每单位能量的电子状态数 g(E)；导带底附近 g ∝ √(E − E_c)'
  - term: 有效态密度
    def: '把导带（或价带）的状态等效成集中在带边上的浓度 N_c（N_v），硅 300 K 时 N_c ≈ 2.8×10¹⁹ cm⁻³'
  - term: 费米–狄拉克分布
    def: '能量为 E 的状态被电子占据的概率 f(E) = 1/(1 + e^((E − E_F)/kT))'
  - term: 费米能级
    def: '费米–狄拉克分布里占据概率正好是 1/2 的能量 E_F；热平衡时处处相同，半导体里常在带隙中'
  - term: 玻尔兹曼近似
    def: 'E − E_F 比 kT 大好几倍时把占据概率近似为 e^(−(E − E_F)/kT)'
  - term: 本征费米能级
    def: '本征半导体的费米能级 E_i，在带隙中点附近；n = nᵢe^((E_F − E_i)/kT)'
  - term: 费米积分
    def: '不用玻尔兹曼近似时表示载流子浓度的积分 F_1/2(η)，n = N_c F_1/2((E_F − E_c)/kT)'
  - term: 简并半导体
    def: '掺杂很重、费米能级离带边不到 3kT 或进入能带的半导体，玻尔兹曼近似不再适用'
  - term: 非平衡载流子
    def: '光照或注入使电子、空穴比热平衡时多出的部分 Δn、Δp，也叫过剩载流子'
  - term: 小注入
    def: '过剩载流子远少于多数载流子浓度的情形，多子浓度几乎不变'
  - term: 准费米能级
    def: '非平衡时分别描述电子和空穴浓度的两条能级 E_Fn、E_Fp；np = nᵢ²e^((E_Fn − E_Fp)/kT)'
  # 漂移与扩散
  - term: 散射
    def: '载流子被晶格振动或电离杂质撞得改变运动方向'
  - term: 平均自由时间
    def: '载流子两次散射之间的平均时间 τ，硅里约零点几皮秒'
  - term: 漂移速度
    def: '载流子在电场作用下叠加在热运动上的平均定向速度，弱电场时 v = μE'
  - term: 迁移率
    def: '漂移速度和电场之比 μ = qτ/m*，单位 cm²/(V·s)；硅里电子约 1350'
  - term: 电导率
    def: '电流密度和电场之比 σ = q(nμ_n + pμ_p)，单位 S/cm'
  - term: 电阻率
    def: '电导率的倒数 ρ = 1/σ，表示材料本身导电的难易，单位 Ω·cm'
  - term: 速度饱和
    def: '强电场下漂移速度不再随电场增长、趋于上限的现象，硅里电子约 10⁷ cm/s'
  - term: 霍尔系数
    def: '由霍尔电压测出的 R_H = 1/(qn)，p 型取正、n 型取负，用来得到载流子类型和浓度'
  - term: 扩散
    def: '浓度不均匀时载流子靠热运动从浓处向淡处的净流动'
  - term: 扩散系数
    def: '扩散的粒子流和浓度梯度之比 D，Φ = −D dn/dx，单位 cm²/s'
  - term: 爱因斯坦关系
    def: '扩散系数和迁移率之比等于热电压：D/μ = kT/q'
  - term: 漂移–扩散模型
    def: '把电流写成漂移和扩散两部分之和，配上泊松方程和连续性方程描述半导体器件的模型'
  - term: 内建电场
    def: '不加外电压时由不均匀掺杂产生的电场，热平衡下它使漂移电流和扩散电流抵消'
  # 产生与复合
  - term: 复合
    def: '导带电子落回价带填掉一个空穴，两者一起消失'
  - term: 直接复合
    def: '导带电子直接落到价带并放出光子的复合，在直接带隙材料里很快'
  - term: 间接复合
    def: '通过带隙里杂质或缺陷能级分两步完成的复合（SRH 复合），能量交给晶格'
  - term: 复合中心
    def: '能先后抓住电子和空穴、帮助它们复合的杂质或缺陷能级，在带隙中间附近最有效'
  - term: 俄歇复合
    def: '复合放出的能量交给第三个载流子的复合，载流子很多时才重要'
  - term: 少子寿命
    def: '过剩少数载流子平均存在的时间 τ，关光后按 e^(−t/τ) 衰减'
  - term: 连续性方程
    def: '载流子数守恒的方程：浓度的变化率等于流进减流出加产生减复合'
  - term: 扩散长度
    def: '过剩少子在复合前平均扩散的距离 L = √(Dτ)，光照稳定后按 e^(−x/L) 衰减'
  # PN结物理
  - term: PN 结
    def: '同一块晶体里 p 型区和 n 型区的交界，二极管和晶体管的基本结构'
  - term: 二极管
    def: '在 PN 结的 p 区和 n 区各接一个电极做成的器件，正向容易导电、反向几乎不导电'
  - term: 耗尽区
    def: 'PN 结交界附近几乎没有自由载流子、只剩电离杂质的区域，也叫空间电荷区'
  - term: 内建电势
    def: '热平衡 PN 结两侧的电势差 V_bi = (kT/q)ln(N_aN_d/nᵢ²)'
  - term: 耗尽近似
    def: '假设耗尽区里载流子完全没有、区外完全电中性的近似'
  - term: 结电容
    def: '耗尽区像平行板电容器形成的电容，单位面积 C_j = ε/W，反偏越大越小'
  - term: 热电压
    def: 'V_T = kT/q，300 K 时 0.02585 V'
  - term: 少子注入
    def: '正偏时多子越过降低了的势垒进入另一侧成为少子，边上浓度升为平衡值的 e^(V/V_T) 倍'
  - term: 理想二极管方程
    def: '二极管电流和电压的关系 I = I_s(e^(V/V_T) − 1)'
  - term: 反向饱和电流
    def: '理想二极管方程里的 I_s，反偏时电流趋于 −I_s，不再随反向电压增大'
  - term: 碰撞电离
    def: '被强电场加速的载流子撞出一个新的电子–空穴对'
  - term: 雪崩击穿
    def: '碰撞电离连锁倍增使反向电流急剧增大的击穿，掺杂较轻、击穿电压较高的结里发生'
  - term: 齐纳击穿
    def: '两侧重掺杂的薄耗尽区里电子直接隧穿过带隙造成的击穿，击穿电压一般低于约 5 V'
  - term: 稳压二极管
    def: '专门工作在反向击穿区的二极管，也叫稳压管，击穿后电流变化很大而电压几乎不变'
lessons:
  - id: crystal-lattices
    chapter: 晶体结构与倒格子
    title: 原子怎样排成晶体
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一块芯片用的硅片，里面的硅原子是怎样排的？
          options:
            - text: 按固定的图样在三个方向上一直重复下去
              correct: true
            - text: 杂乱无章，只是挤得很紧
              why: 那是玻璃这类固体的排法；芯片用的硅片是单晶，原子位置在整块里都按同一个图样重复
            - text: 连成一条条长链，链和链之间随便缠在一起
              why: 这是塑料等高分子的样子；硅原子之间是向四个方向成键，不形成长链
          explain: 芯片用的硅片是一整块单晶：选一个原子，沿某个方向每隔固定距离就会遇到一个和它环境完全相同的原子。原子排得这样整齐，电子在晶体里的运动才有规律可算。
      - card:
          title: 晶体和非晶体
          body: |
            食盐、金属、硅片里的原子按固定的图样在空间里重复排列，这样的固体叫**晶体（crystal）**。从一个原子出发走过一定的距离，会看到和出发点一模一样的环境，这种规律能延续到几百万个原子以外，叫长程有序。

            玻璃、非晶硅这类固体只在相邻几个原子之间有大致固定的距离和角度，再远就没有规律了，叫**非晶体（amorphous solid）**。整块只有一个取向的晶体叫单晶，由许多取向不同的小晶粒拼成的叫多晶，比如大多数金属零件和芯片里的多晶硅导线。
      - item:
          id: kinds-of-solid
          type: choice
          prompt: 太阳能电池板有一种是由许多颜色略有差别的小块拼成的，每一小块内部原子整齐排列，各块的取向不同。它属于哪一种？
          options:
            - text: 单晶
              why: 单晶是整块只有一个取向；颜色不同的小块说明各块取向不同
            - text: 多晶
              correct: true
            - text: 非晶体
              why: 非晶体内部连小块的整齐排列都没有；这里每一小块内部是整齐的
          explain: 每一小块是一个晶粒，内部长程有序；块与块取向不同，合起来是多晶。光照在取向不同的晶粒上反射得不一样，所以看起来颜色略有差别。
      - card:
          title: 晶格加基元
          body: |
            描述晶体分两步。先取一组点，每个点周围的环境完全相同，这组点叫**晶格（lattice）**，可以写成 $\vec r = n_1\vec a_1 + n_2\vec a_2 + n_3\vec a_3$（$n_i$ 取所有整数，$\vec a_i$ 是三个基本矢量）。再在每个点上放同样的一组原子，这组原子叫**基元（basis）**。

            晶体 = 晶格 + 基元。石墨烯的碳原子排成蜂窝状，蜂窝的所有顶点并不构成晶格：相邻两个顶点，一个的三根键朝上开口，另一个朝下开口，环境不同。它是三角晶格，每个点上放两个碳原子作基元。
      - item:
          id: honeycomb
          type: choice
          prompt: 蜂窝状排列的全部顶点为什么不能直接当作晶格？
          options:
            - text: 相邻两个顶点周围的键方向不同，环境不一样
              correct: true
            - text: 顶点之间的距离不全相等
              why: 蜂窝里相邻顶点的距离全都相等；问题在于方向，不在距离
            - text: 二维的排列不能有晶格，晶格只在三维里有
              why: 晶格可以是一维、二维或三维的，石墨烯的三角晶格就是二维的
          explain: 晶格要求从任何一个点看出去都一模一样。蜂窝里相邻的两种顶点互为镜像，所以要把一对顶点合起来当基元，放在三角晶格的每个点上。
      - card:
          title: 原胞和晶胞
          body: |
            用基本矢量 $\vec a_1, \vec a_2, \vec a_3$ 围成的平行六面体叫**原胞（primitive cell）**，它平均只含一个格点，把它平移就能铺满整个空间。原胞的形状常常是斜的，所以又取一个能直接看出对称性的较大盒子，叫**晶胞（conventional unit cell）**，它的边长叫**晶格常数（lattice constant）**，记作 $a$。

            立方晶胞有三种常见的格点排法：只在 8 个角上的叫简单立方，角上加体心一个的叫体心立方，角上加 6 个面心的叫面心立方。
      - item:
          id: fcc-points
          type: number
          prompt: 面心立方的一个晶胞里平均有几个格点？角上的点由 8 个晶胞共用，面心的点由 2 个晶胞共用。
          answer: 4
          hint: 8 个角各算几分之几？6 个面心各算几分之几？
          explain: 角：$8\times\tfrac18 = 1$；面心：$6\times\tfrac12 = 3$；合计 4 个。所以面心立方的晶胞是原胞体积的 4 倍。
      - item:
          id: bcc-points
          type: number
          prompt: 体心立方的晶胞在 8 个角上各有一个格点（每个由 8 个晶胞共用），体心还有一个。一个晶胞里平均有几个格点？
          answer: 2
          hint: 体心那个点只属于这个晶胞，角上的点呢？
          explain: 角上 $8\times\tfrac18 = 1$，体心 1 个完全属于这个晶胞，合计 2 个。
      - card:
          title: 例题：硅里每立方厘米有多少个原子
          body: 硅是金刚石结构：面心立方晶格，每个格点上放两个硅原子作基元，第二个原子相对第一个错开 $\tfrac a4(1, 1, 1)$。晶格常数 $a = 0.5431$ nm。求原子密度。
          reveal:
            - title: 第 1 步：数一个晶胞里的原子
              body: 面心立方晶胞有 4 个格点，每个格点 2 个原子，一个晶胞里共 $4\times2 = 8$ 个硅原子。
            - title: 第 2 步：算晶胞体积
              body: $a = 0.5431\ \text{nm} = 5.431\times10^{-8}$ cm，$a^3 = 1.602\times10^{-22}\ \text{cm}^3$。
            - title: 第 3 步：算每立方厘米的原子数
              body: $8/a^3 = 4.99\times10^{22}\ \text{cm}^{-3}$，约 $5\times10^{22}$。室温下纯硅里能导电的电子只有约 $10^{10}\ \text{cm}^{-3}$，五万亿个原子里才有一个。
      - item:
          id: si-neighbor
          type: number
          prompt: 金刚石结构里，一个原子和它错开 $\tfrac a4(1, 1, 1)$ 的那个原子是最近邻。硅的 $a = 0.5431$ nm，最近邻距离是多少纳米？
          answer: 0.2352
          tolerance: 0.0005
          unit: nm
          hint: 矢量 $\tfrac a4(1, 1, 1)$ 的长度是 $a$ 的几倍？
          explain: 长度 $= \tfrac a4\sqrt{1 + 1 + 1} = \tfrac{\sqrt3}{4}a = 0.433\times0.5431 = 0.2352$ nm。每个硅原子有 4 个这样的最近邻，排成正四面体，正好用上它的 4 个价电子成键。
      - card:
          title: 闪锌矿结构
          body: |
            砷化镓（GaAs）的排法和硅一样，只是基元里的两个原子换成一个镓、一个砷，这叫闪锌矿结构。也可以看成两套面心立方：一套全是镓，一套全是砷，互相错开 $\tfrac a4(1, 1, 1)$。每个镓原子的 4 个最近邻都是砷，反过来也一样。

            同一个晶胞里有 4 个镓原子和 4 个砷原子。砷化镓的 $a = 0.5653$ nm，和锗（0.5658 nm）几乎相等，所以可以在锗上长砷化镓的薄层。
      - item:
          id: gaas-density
          type: number
          prompt: 砷化镓的晶格常数 $a = 0.5653$ nm。每立方厘米里有多少个镓原子？写成 $N\times10^{22}\ \text{cm}^{-3}$，$N$ 是多少？
          answer: 2.21
          tolerance: 0.02
          hint: 一个晶胞里有几个镓原子？晶胞体积是多少立方厘米？
          explain: 一个晶胞里 4 个镓原子，$a^3 = (5.653\times10^{-8})^3 = 1.806\times10^{-22}\ \text{cm}^3$，$4/a^3 = 2.21\times10^{22}\ \text{cm}^{-3}$。砷原子一样多，两种合计 $4.43\times10^{22}$。
      - item:
          id: zincblende-vs-diamond
          type: choice
          prompt: 金刚石结构和闪锌矿结构的区别是什么？
          options:
            - text: 金刚石结构两套面心立方上是同一种原子，闪锌矿是两种原子
              correct: true
            - text: 金刚石结构是体心立方，闪锌矿是面心立方
              why: 两者都是面心立方晶格加两个原子的基元，格子相同
            - text: 闪锌矿每个原子有 8 个最近邻，金刚石只有 4 个
              why: 两者每个原子都只有 4 个最近邻，排成正四面体
          explain: 原子的位置完全一样。硅、锗、金刚石的两个位置上是同一种原子；砷化镓、磷化铟这类化合物半导体一个位置上是镓、铟这类有 3 个价电子的原子，另一个是砷、磷这类有 5 个价电子的原子。
  - id: miller-planes
    chapter: 晶体结构与倒格子
    title: 晶面和布拉格衍射
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 想看清晶体里原子一排排的间隔（约 0.3 nm），用波长 500 nm 的可见光不行，要用波长约 0.15 nm 的 X 射线。主要原因是什么？
          options:
            - text: X 射线的波长和原子间距差不多
              correct: true
            - text: X 射线能量高，能把原子打出来看
              why: 衍射测晶格靠的是波的干涉，不需要打出原子；能量高是 X 射线的另一个性质
            - text: 可见光照不进晶体
              why: 很多晶体（石英、食盐）是透明的，可见光能照进去，但波长太长，干涉不出原子尺度的图样
          explain: 衍射只有在波长和障碍物的间隔相近时才明显。一排排原子相隔零点几纳米，波长 0.15 nm 的 X 射线被各排原子反射后互相干涉，在特定角度上出现亮点，从角度能反推出间距。
      - card:
          title: 晶向和晶面
          body: |
            在立方晶体里取一个原子作原点，从原点指向 $u\vec a_1 + v\vec a_2 + w\vec a_3$ 的方向记作 $[uvw]$，叫晶向，三个数化成互质的整数，负数在上面加一横。$[100]$ 是 $x$ 轴方向，$[111]$ 是立方体对角线方向。

            穿过许多原子的平面叫**晶面（lattice plane）**。一族平行、等距的晶面里每一个的样子都相同，所以只需要说明它的朝向。
      - card:
          title: 密勒指数的求法
          body: |
            1. 找出晶面在三个轴上的截距，以晶格常数为单位，比如 1、2、∞（和这个轴平行时写 ∞）；
            2. 取倒数：1、1/2、0；
            3. 乘同一个数化成最小的整数：2、1、0。

            得到的 $(210)$ 叫这族晶面的**密勒指数（Miller indices）**。和轴平行的方向倒数是 0，所以 $(100)$ 面只和 $x$ 轴相交，和 $x$ 轴垂直。立方晶体里 $[hkl]$ 方向正好垂直于 $(hkl)$ 面。
      - item:
          id: miller-320
          type: text
          prompt: 立方晶体里一个晶面在 $x$、$y$、$z$ 轴上的截距分别是 2、3、∞（以晶格常数为单位）。它的密勒指数是多少？
          answers: ["(320)", "320"]
          format: 照 (hkl) 的写法写三个数字，如 (101)
          hint: 1/2、1/3、0 乘上几能都变成整数？
          explain: 倒数是 1/2、1/3、0，乘 6 得 3、2、0，所以是 $(320)$。直接把截距写成 (230) 是常见的错：密勒指数取的是截距的倒数。
      - item:
          id: plane-100
          type: choice
          prompt: 立方晶体里的 $(100)$ 晶面和哪个方向垂直？
          options:
            - text: $x$ 轴
              correct: true
            - text: $y$ 轴
              why: $(100)$ 面在 $y$ 轴上的截距是 ∞，说明它和 $y$ 轴平行，$y$ 方向躺在面里，不和面垂直
            - text: 立方体的对角线 $[111]$
              why: 垂直于 $[111]$ 的是 $(111)$ 面；$(100)$ 面只和 $x$ 轴相交
          explain: $(100)$ 的截距是 1、∞、∞：只在 $x = a$ 处和 $x$ 轴相交，和另外两个轴平行，所以它是垂直于 $x$ 轴的平面。
      - card:
          title: 晶面间距
          body: |
            同一族相邻两个晶面的距离叫晶面间距。立方晶体里

            $$d_{hkl} = \frac{a}{\sqrt{h^2 + k^2 + l^2}}$$

            例如 $(100)$ 面相隔 $a$，$(110)$ 面相隔 $a/\sqrt2$，$(111)$ 面相隔 $a/\sqrt3$。指数越大，晶面越密，间距越小。
      - item:
          id: si-d111
          type: number
          prompt: 硅的 $a = 0.5431$ nm。$(111)$ 晶面的间距是多少纳米？
          answer: 0.3136
          tolerance: 0.0005
          unit: nm
          hint: $\sqrt{1^2 + 1^2 + 1^2}$ 是多少？
          explain: $d_{111} = 0.5431/\sqrt3 = 0.3136$ nm。
      - card:
          title: 布拉格条件
          body: |
            X 射线照到一族间距为 $d$ 的晶面上，和晶面成 $\theta$ 角。被相邻两层反射的两束光，下面一束多走了 $2d\sin\theta$。多走的路程正好是波长的整数倍时两束同相叠加，出现亮的衍射峰：

            $$2d\sin\theta = n\lambda,\quad n = 1, 2, 3, \dots$$

            这叫**布拉格条件（Bragg condition）**。注意 $\theta$ 是光线和晶面的夹角，不是和法线的夹角。$n = 1$ 叫一级衍射。
      - card:
          title: 例题：算衍射角
          body: 简单立方晶体，$a = 0.40$ nm，用波长 $\lambda = 0.154$ nm 的 X 射线测 $(110)$ 面。一级衍射角是多少？
          reveal:
            - title: 第 1 步：算晶面间距
              body: $d_{110} = 0.40/\sqrt2 = 0.2828$ nm。
            - title: 第 2 步：代入布拉格条件求 sin θ
              body: $n = 1$：$\sin\theta = \lambda/(2d) = 0.154/0.5657 = 0.2722$。
            - title: 第 3 步：求角度
              body: $\theta = \arcsin 0.2722 = 15.8°$。衍射仪记录的通常是入射光和衍射光的夹角 $2\theta = 31.6°$。
      - item:
          id: bragg-sc100
          type: number
          prompt: 简单立方晶体 $a = 0.5$ nm，用 $\lambda = 0.154$ nm 的 X 射线测 $(100)$ 面。一级衍射角 $\theta$ 是多少度？
          answer: 8.86
          tolerance: 0.02
          unit: °
          hint: $(100)$ 面的间距等于多少？
          explain: $d_{100} = a = 0.5$ nm，$\sin\theta = 0.154/(2\times0.5) = 0.154$，$\theta = 8.86°$。
      - item:
          id: bragg-second
          type: number
          prompt: 简单立方晶体 $a = 0.5$ nm，$\lambda = 0.154$ nm，$(100)$ 面的二级衍射（$n = 2$）出现在多少度？
          answer: 17.94
          tolerance: 0.03
          unit: °
          hint: $n = 2$ 时 $\sin\theta$ 变成一级时的几倍？
          explain: $\sin\theta = 2\times0.154/(2\times0.5) = 0.308$，$\theta = 17.94°$。角度并不是一级时的两倍（8.86° × 2 = 17.72°），因为加倍的是 $\sin\theta$。
      - item:
          id: measure-a
          type: number
          prompt: 用 $\lambda = 0.15406$ nm 的 X 射线测一块立方晶体，$(111)$ 面的一级衍射峰在 $\theta = 14.22°$。晶格常数 $a$ 是多少纳米？
          answer: 0.5431
          tolerance: 0.001
          unit: nm
          hint: 先由布拉格条件求 $d_{111}$，$a$ 是 $d_{111}$ 的几倍？
          explain: $d = \lambda/(2\sin\theta) = 0.15406/(2\times0.2457) = 0.3136$ nm，$a = \sqrt3\,d = 0.5431$ nm，正是硅。实验室测晶格常数就是这样从衍射角反推的。
      - item:
          id: longest-wavelength
          type: choice
          prompt: 晶面间距 $d = 0.31$ nm。下面哪种波长的波不可能在这族晶面上产生布拉格衍射？
          options:
            - text: 0.15 nm
              why: $\sin\theta = 0.15/0.62 = 0.24$，有解，$\theta \approx 14°$
            - text: 0.60 nm
              why: $\sin\theta = 0.60/0.62 = 0.97$，接近 1 但仍然有解，$\theta \approx 75°$
            - text: 0.70 nm
              correct: true
          explain: $\sin\theta = \lambda/(2d)$ 不能超过 1，所以 $\lambda$ 最长只能到 $2d = 0.62$ nm。比这更长的波（包括可见光）在这族晶面上找不到满足条件的角度。
  - id: reciprocal-1d
    chapter: 晶体结构与倒格子
    title: 一维的倒格子
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一条原子链上原子相隔 $a$，电子的分布每隔 $a$ 重复一次。把这个分布拆成一个个正弦波时，里面会有哪些波长？
          options:
            - text: 只有 $a$、$a/2$、$a/3$……
              correct: true
            - text: 各种波长都有
              why: 每隔 $a$ 重复的函数只能由在长度 $a$ 里正好容纳整数个波长的正弦波组成，其他波长平移 $a$ 后对不上
            - text: 只有波长 $a$ 这一种
              why: 波长 $a/2$、$a/3$ 的波平移 $a$ 后也回到原样，同样可以出现；原子附近电子密度的尖峰就要靠它们拼出来
          explain: 平移 $a$ 后不变的正弦波，在长度 $a$ 里必须正好容纳整数个波长，波长只能是 $a/m$。换成波数 $2\pi/\lambda$，就是 $2\pi m/a$。这一课就从这组波数讲起。
      - card:
          title: 周期函数只含哪些波数
          body: |
            设电子密度 $n(x)$ 每隔 $a$ 重复一次：$n(x + a) = n(x)$，$a$ 叫它的**周期（period）**。按傅里叶级数把它写成

            $$n(x) = \sum_m c_m e^{iG_mx},\qquad G_m = \frac{2\pi m}{a},\ m = 0, \pm1, \pm2, \dots$$

            每一项平移 $a$ 后多出因子 $e^{iG_ma} = e^{i2\pi m} = 1$，所以和不变。别的波数 $k$ 平移后多出 $e^{ika} \ne 1$，不能出现。
      - card:
          title: 倒格子
          body: |
            这组波数 $G = 2\pi m/a$ 本身也排成一个间隔为 $2\pi/a$ 的格子，叫原来那个晶格的**倒格子（reciprocal lattice）**，里面的每个 $G$ 叫倒格矢。它的单位是长度的倒数，和波数的单位相同，所以倒格子画在“波数空间”里，原来的晶格叫正格子，画在普通空间里。

            正格子的间隔越大，倒格子越密：$a$ 加倍，$2\pi/a$ 减半。
      - item:
          id: g-shortest-1d
          type: number
          prompt: 一维晶格间隔 $a = 0.5$ nm。最短的非零倒格矢有多长（单位 $\text{nm}^{-1}$）？
          answer: 12.57
          tolerance: 0.02
          unit: nm⁻¹
          hint: 最短的非零倒格矢是 $m$ 取几的那个？
          explain: $m = \pm1$：$G = 2\pi/a = 2\pi/0.5 = 12.57\ \text{nm}^{-1}$。
      - item:
          id: double-spacing
          type: choice
          prompt: 把一维晶格的间隔从 0.3 nm 拉长到 0.6 nm，倒格子的间隔怎样变？
          options:
            - text: 变成原来的一半
              correct: true
            - text: 变成原来的两倍
              why: 倒格子间隔是 $2\pi/a$，和 $a$ 成反比，$a$ 加倍时它减半
            - text: 不变，倒格子只和原子种类有关
              why: 倒格子只由晶格的周期决定，和原子是什么无关；原子种类影响的是各个 $c_m$ 的大小
          explain: 间隔 $2\pi/a$ 从 $2\pi/0.3 = 20.9\ \text{nm}^{-1}$ 变成 $2\pi/0.6 = 10.5\ \text{nm}^{-1}$。普通空间里稀，波数空间里就密。
      - card:
          title: 倒格子是晶格的傅里叶变换
          body: |
            把晶格看成在 $x = 0, a, 2a, \dots, (N-1)a$ 处的 $N$ 个点，对它做傅里叶变换（各点的 $e^{-ikx}$ 加起来）：

            $$S(k) = \sum_{n=0}^{N-1} e^{-ikna}$$

            当 $ka = 2\pi m$ 时每一项都是 1，$S = N$；别的 $k$ 下各项的方向在复平面上转着圈，加起来大部分抵消。所以晶格的傅里叶变换只在倒格矢上有大的值。X 射线衍射测到的强度正比于 $|S|^2$，亮点的位置就是倒格矢。
      - item:
          id: sum-pi-over-a
          type: number
          prompt: 5 个原子在 $x = 0, a, 2a, 3a, 4a$。取 $k = \pi/a$，$S(k) = \sum_{n=0}^{4} e^{-ikna}$ 等于多少？
          answer: 1
          hint: $e^{-i\pi n}$ 在 $n = 0, 1, 2, 3, 4$ 时分别是多少？
          explain: $e^{-i\pi n} = (-1)^n$，五项是 $1 - 1 + 1 - 1 + 1 = 1$。而在倒格矢 $k = 2\pi/a$ 上五项都是 1，$S = 5$。原子越多，倒格矢上的值（$N$）和别处的值（不超过几）差得越悬殊，衍射点就越锐利。
      - item:
          id: sum-at-g
          type: number
          prompt: 1000 个原子等间隔排成一条链。在 $k = 2\pi/a$ 处，$|S(k)|^2$ 是多少？写成 $N\times10^{6}$，$N$ 是多少？
          answer: 1
          hint: $k = 2\pi/a$ 时每一项 $e^{-ikna}$ 是多少？
          explain: 每一项都是 $e^{-i2\pi n} = 1$，$S = 1000$，$|S|^2 = 10^6$。衍射强度和原子数的平方成正比，这就是衍射点那么亮的原因。
      - card:
          title: 倒格子的周期性
          body: |
            一个波 $e^{ikx}$ 只在原子所在的位置 $x = na$ 上起作用时，$k$ 和 $k + G$ 给出完全相同的值：

            $$e^{i(k+G)na} = e^{ikna}e^{i2\pi mn} = e^{ikna}$$

            所以描述晶格上的波时，$k$ 只需要在一个长 $2\pi/a$ 的范围里取，通常取 $-\pi/a < k \le \pi/a$，这个范围叫**第一布里渊区（first Brillouin zone）**。范围外的 $k$ 减去适当的 $G$ 就落回区内。
      - item:
          id: fold-back
          type: number
          prompt: 一维晶格 $a = 0.5$ nm（$2\pi/a = 12.57\ \text{nm}^{-1}$）。波数 $k = 10\ \text{nm}^{-1}$ 不在第一布里渊区里，和它等价的区内波数是多少 $\text{nm}^{-1}$？
          answer: -2.57
          tolerance: 0.01
          unit: nm⁻¹
          hint: 第一布里渊区的边界是 $\pm\pi/a$，10 减去多少才能落进这个范围？
          explain: $10 - 12.57 = -2.57\ \text{nm}^{-1}$，在 $-6.28$ 到 $6.28$ 之间。在原子的位置上，$k = 10$ 和 $k = -2.57$ 的波取值完全相同。
      - item:
          id: why-first-zone
          type: choice
          prompt: 为什么讨论晶体里的波时只看第一布里渊区就够了？
          options:
            - text: 区外的每个 $k$ 都和区内某个 $k$ 相差一个倒格矢，描述的是同一个波
              correct: true
            - text: 区外的 $k$ 能量太高，电子到不了
              why: 能量高低和是否等价是两回事；把 $k$ 平移一个 $G$ 后描述的状态完全相同，能量也一样
            - text: 区外的波会被晶体吸收，不存在
              why: 不是被吸收，而是区外的 $k$ 在格点上的取值和区内某个 $k$ 一模一样，没有新的状态
          explain: 在格点上 $e^{i(k+G)na} = e^{ikna}$，两个 $k$ 分不出来。所以把所有状态都平移进第一布里渊区来画，不会漏也不会重复。
  - id: reciprocal-3d
    chapter: 晶体结构与倒格子
    title: 三维的倒格子和布里渊区
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 二维的正方形晶格，格点间隔 $a$。猜猜它的倒格子是什么样子？
          options:
            - text: 也是正方形格子，间隔 $2\pi/a$
              correct: true
            - text: 三角形格子
              why: 正方形晶格两个方向互相垂直、间隔相等，倒格子在两个方向上也各自是 $2\pi/a$，仍是正方形
            - text: 正方形格子，间隔还是 $a$
              why: 倒格子的间隔和正格子成反比，是 $2\pi/a$，单位也变成了长度的倒数
          explain: 两个方向互相垂直时，每个方向各按一维的规则处理：$x$ 方向周期 $a$，倒格子在 $x$ 方向间隔 $2\pi/a$；$y$ 方向也一样。所以还是正方形。
      - card:
          title: 三维的定义
          body: |
            三维晶格的基本矢量是 $\vec a_1, \vec a_2, \vec a_3$。倒格子的基本矢量 $\vec b_1, \vec b_2, \vec b_3$ 由下面的条件确定：

            $$\vec a_i\cdot\vec b_j = 2\pi\delta_{ij}$$

            $\delta_{ij}$ 在 $i = j$ 时是 1，否则是 0。也就是说，$\vec b_1$ 和 $\vec a_2$、$\vec a_3$ 都垂直，和 $\vec a_1$ 的点积是 $2\pi$。倒格矢是 $\vec G = h\vec b_1 + k\vec b_2 + l\vec b_3$（$h, k, l$ 取整数），它满足 $e^{i\vec G\cdot\vec r} = 1$ 对每个格点 $\vec r$ 都成立。
      - card:
          title: 简单立方的倒格子
          body: |
            简单立方 $\vec a_1 = a\hat x$、$\vec a_2 = a\hat y$、$\vec a_3 = a\hat z$。和 $\vec a_2$、$\vec a_3$ 都垂直的方向是 $\hat x$，再要求 $\vec a_1\cdot\vec b_1 = 2\pi$，得 $\vec b_1 = \frac{2\pi}{a}\hat x$；同样 $\vec b_2 = \frac{2\pi}{a}\hat y$，$\vec b_3 = \frac{2\pi}{a}\hat z$。

            所以简单立方的倒格子还是简单立方，边长 $2\pi/a$。三个轴互相垂直但长度不同时（如长方体格子），每个方向各自取 $2\pi$ 除以那个方向的周期。
      - item:
          id: tetragonal-shortest
          type: number
          prompt: 一个格子的三个基本矢量互相垂直，长度分别是 0.4 nm、0.4 nm、0.6 nm。最短的非零倒格矢有多长（单位 $\text{nm}^{-1}$）？
          answer: 10.47
          tolerance: 0.02
          unit: nm⁻¹
          hint: 三个方向的倒格矢长度分别是多少？哪个方向最短？
          explain: 三个方向分别是 $2\pi/0.4 = 15.71$、$15.71$、$2\pi/0.6 = 10.47\ \text{nm}^{-1}$。正格子里最长的周期对应倒格子里最短的矢量。
      - card:
          title: 例题：三角晶格的倒格子
          body: 二维三角晶格 $\vec a_1 = a(1, 0)$，$\vec a_2 = a\left(\tfrac12, \tfrac{\sqrt3}{2}\right)$，两者夹 60°。求 $\vec b_1$。
          reveal:
            - title: 第 1 步：写出两个条件
              body: 设 $\vec b_1 = (x, y)$。要求 $\vec a_1\cdot\vec b_1 = ax = 2\pi$，$\vec a_2\cdot\vec b_1 = a\left(\tfrac x2 + \tfrac{\sqrt3}{2}y\right) = 0$。
            - title: 第 2 步：解出分量
              body: 第一个式子 $x = 2\pi/a$；第二个式子 $y = -x/\sqrt3 = -\dfrac{2\pi}{\sqrt3\,a}$。
            - title: 第 3 步：长度和形状
              body: $|\vec b_1| = \dfrac{2\pi}{a}\sqrt{1 + \tfrac13} = \dfrac{4\pi}{\sqrt3\,a}$。同样解出 $\vec b_2 = \left(0, \dfrac{4\pi}{\sqrt3\,a}\right)$，和 $\vec b_1$ 一样长，两者夹 120°，所以倒格子仍是三角晶格，只是转了 30°。
      - item:
          id: graphene-b
          type: number
          prompt: 石墨烯的三角晶格常数 $a = 0.246$ nm。倒格子基本矢量的长度 $4\pi/(\sqrt3\,a)$ 是多少 $\text{nm}^{-1}$？
          answer: 29.49
          tolerance: 0.05
          unit: nm⁻¹
          hint: 先算 $\sqrt3\times0.246$。
          explain: $\sqrt3\times0.246 = 0.4261$ nm，$4\pi/0.4261 = 29.49\ \text{nm}^{-1}$。注意它不是 $2\pi/a = 25.5$：两个基本矢量不垂直时，每个 $\vec b$ 要同时满足和另一个 $\vec a$ 垂直。
      - card:
          title: 面心和体心互为倒格子
          body: |
            用同样的方法可以算出：立方晶胞边长为 $a$ 的面心立方晶格，倒格子是体心立方，它的立方晶胞边长是 $4\pi/a$；反过来，体心立方的倒格子是面心立方，晶胞边长也是 $4\pi/a$。

            硅、锗、砷化镓都是面心立方晶格，倒格子是体心立方。它们的第一布里渊区是离原点比离其他倒格点都近的那块区域，形状是一个削掉了六个角的八面体（截角八面体）。
      - item:
          id: fcc-reciprocal
          type: choice
          prompt: 硅的晶格是面心立方。它的倒格子是哪种？
          options:
            - text: 面心立方
              why: 简单立方的倒格子才是自己；面心立方的倒格子是体心立方
            - text: 体心立方
              correct: true
            - text: 简单立方
              why: 面心立方的原胞基本矢量不互相垂直，倒格子不是简单立方
          explain: 面心和体心互为倒格子。硅的倒格子是体心立方，所以硅的能带图画在体心立方倒格子的第一布里渊区里。
      - card:
          title: 倒格矢和晶面
          body: |
            倒格矢 $\vec G = h\vec b_1 + k\vec b_2 + l\vec b_3$ 有一个用处：它垂直于密勒指数为 $(hkl)$ 的那族晶面，长度是

            $$|\vec G_{hkl}| = \frac{2\pi}{d_{hkl}}$$

            立方晶格里 $\vec G = \frac{2\pi}{a}(h, k, l)$，长度 $2\pi\sqrt{h^2 + k^2 + l^2}/a$，正好是 $2\pi/d_{hkl}$。布拉格条件也可以换个说法：入射波矢和衍射波矢的差正好等于一个倒格矢。每个衍射点对应一个倒格矢，也就对应一族晶面。
      - item:
          id: g111-si
          type: number
          prompt: 硅的 $(111)$ 晶面间距 $d = 0.3136$ nm。对应的倒格矢 $\vec G_{111}$ 有多长（单位 $\text{nm}^{-1}$）？
          answer: 20.04
          tolerance: 0.03
          unit: nm⁻¹
          hint: 倒格矢长度和晶面间距是什么关系？
          explain: $|\vec G| = 2\pi/d = 2\pi/0.3136 = 20.04\ \text{nm}^{-1}$。晶面越密（$d$ 越小），对应的倒格矢越长。
      - item:
          id: bcc-reciprocal-size
          type: number
          prompt: 体心立方晶格的立方晶胞边长 $a = 0.30$ nm。它的倒格子是面心立方，倒格子的立方晶胞边长是多少 $\text{nm}^{-1}$？
          answer: 41.89
          tolerance: 0.05
          unit: nm⁻¹
          hint: 体心立方和面心立方互为倒格子时，晶胞边长是多少？
          explain: $4\pi/a = 4\pi/0.30 = 41.89\ \text{nm}^{-1}$。用 $2\pi/a$（20.9）是把它当成了简单立方。
      - item:
          id: g-perpendicular
          type: choice
          prompt: 立方晶体里倒格矢 $\vec G = \frac{2\pi}{a}(1, 1, 0)$ 和哪族晶面垂直？
          options:
            - text: $(110)$ 面
              correct: true
            - text: $(001)$ 面
              why: $(001)$ 面的法线是 $z$ 方向；$(1, 1, 0)$ 没有 $z$ 分量，和 $(001)$ 面平行
            - text: $(1\bar10)$ 面
              why: $(1\bar10)$ 面的法线是 $(1, -1, 0)$，和 $(1, 1, 0)$ 的点积是 0，两者互相垂直，所以这个倒格矢躺在 $(1\bar10)$ 面里
          explain: $\vec G_{hkl}$ 垂直于 $(hkl)$ 面，长度是 $2\pi/d_{hkl} = 2\pi\sqrt2/a$。立方晶体里这和“$[hkl]$ 方向垂直于 $(hkl)$ 面”是一回事。
  - id: free-electron
    chapter: 能带理论
    title: 自由电子模型
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 铜里每个原子贡献一个能在整块金属里自由移动的电子。在绝对零度下，这些电子里动能最大的大约有多少？
          options:
            - text: 0，绝对零度时电子都静止
              why: 电子是费米子，一个状态最多放两个自旋相反的电子，大量电子不可能都挤在动能为零的状态里
            - text: 约 0.03 eV，和室温的热运动能量差不多
              why: 温度降到绝对零度，热运动的能量趋于零，但电子被不相容原理一层层往上填，最高能量和温度无关
            - text: 约 7 eV，和温度几乎无关
              correct: true
          explain: 电子按泡利不相容原理从最低的状态往上填，每个状态放两个。铜里电子很密，要填到约 7 eV 才放得下。这一课把这个数算出来。
      - card:
          title: 把金属当成一个盒子
          body: |
            **自由电子模型（free electron model）**把金属里的价电子看成在一个边长 $L$ 的盒子里自由运动：盒子内势能为零，不管原子核的吸引，也不管电子之间的排斥。电子的定态是平面波 $e^{i\vec k\cdot\vec r}$，能量

            $$E = \frac{\hbar^2k^2}{2m}$$

            为了不用管盒壁，取周期性边界条件：波函数在 $x$ 和 $x + L$ 处相同，于是 $k_x = 2\pi n_x/L$（$n_x$ 取整数），$k_y$、$k_z$ 也一样。
      - item:
          id: k-count
          type: number
          prompt: 一条由 1000 个原子组成的链，间隔 $a$，长 $L = 1000a$，取周期性边界条件。第一布里渊区（$-\pi/a < k \le \pi/a$）里一共有多少个允许的 $k$ 值？
          answer: 1000
          hint: 相邻两个允许的 $k$ 相隔多少？第一布里渊区有多宽？
          explain: 允许的 $k$ 相隔 $2\pi/L$，第一布里渊区宽 $2\pi/a$，个数是 $(2\pi/a)/(2\pi/L) = L/a = 1000$。原胞有几个，区内就有几个 $k$。
      - item:
          id: k-spacing
          type: choice
          prompt: 一块 1 cm 长的金属，允许的 $k$ 相隔 $2\pi/L$。和布里渊区边界 $\pi/a$（$a$ 约 0.3 nm）比起来，这个间隔怎样？
          options:
            - text: 小得多，$k$ 可以看成连续的
              correct: true
            - text: 差不多，$k$ 只有几个值
              why: $2\pi/L = 6.3\ \text{cm}^{-1}$，$\pi/a \approx 10^8\ \text{cm}^{-1}$，相差约一亿倍
            - text: 大得多，区内一个 $k$ 也没有
              why: 区内允许的 $k$ 的个数等于原胞数，宏观样品里有约 $10^{22}$ 个
          explain: 宏观样品的 $L$ 远大于 $a$，允许的 $k$ 密密麻麻，算总数时可以把求和换成积分。分立只在数个数时才重要。
      - card:
          title: 填到费米能
          body: |
            每个允许的 $\vec k$ 在波数空间里占 $(2\pi/L)^3$ 的体积，能放两个自旋相反的电子。$N$ 个电子从 $k = 0$ 往外填，填满一个半径 $k_F$ 的球：

            $$N = 2\cdot\frac{\tfrac43\pi k_F^3}{(2\pi/L)^3}\ \Rightarrow\ k_F = (3\pi^2n)^{1/3}$$

            $n = N/L^3$ 是电子密度。球面上的能量叫**费米能（Fermi energy）**：$E_F = \hbar^2k_F^2/2m$，它是绝对零度时电子占据的最高能量，只由电子密度决定。电子在费米能处的速度 $v_F = \hbar k_F/m$ 叫费米速度。
      - card:
          title: 例题：铜的费米能
          body: 铜的自由电子密度 $n = 8.47\times10^{22}\ \text{cm}^{-3}$。求 $E_F$ 和 $v_F$。$\hbar = 1.0546\times10^{-34}$ J·s，$m = 9.109\times10^{-31}$ kg。
          reveal:
            - title: 第 1 步：换成国际单位求 k_F
              body: $n = 8.47\times10^{28}\ \text{m}^{-3}$，$k_F = (3\pi^2\times8.47\times10^{28})^{1/3} = 1.36\times10^{10}\ \text{m}^{-1}$。
            - title: 第 2 步：求费米能
              body: $E_F = \dfrac{(\hbar k_F)^2}{2m} = \dfrac{(1.433\times10^{-24})^2}{2\times9.109\times10^{-31}} = 1.13\times10^{-18}$ J $= 7.03$ eV。
            - title: 第 3 步：求费米速度
              body: $v_F = \hbar k_F/m = 1.433\times10^{-24}/9.109\times10^{-31} = 1.57\times10^6$ m/s，约光速的 0.5%。电子跑得这么快，却不是热运动造成的。
      - item:
          id: sodium-ef
          type: number
          prompt: 钠的自由电子密度 $n = 2.65\times10^{22}\ \text{cm}^{-3}$。它的费米能是多少电子伏特？$\hbar = 1.0546\times10^{-34}$ J·s，$m = 9.109\times10^{-31}$ kg，$1\text{ eV} = 1.602\times10^{-19}$ J。
          answer: 3.24
          tolerance: 0.02
          unit: eV
          hint: 先换成 $\text{m}^{-3}$ 求 $k_F$，再求能量。
          explain: $k_F = (3\pi^2\times2.65\times10^{28})^{1/3} = 9.22\times10^9\ \text{m}^{-1}$，$E_F = (\hbar k_F)^2/2m = 5.19\times10^{-19}$ J $= 3.24$ eV。钠的电子比铜稀，费米能也低。
      - item:
          id: ef-scaling
          type: number
          prompt: 按自由电子模型，电子密度变成原来的 8 倍，费米能变成原来的几倍？
          answer: 4
          hint: $E_F$ 和 $k_F$ 的几次方成正比？$k_F$ 和 $n$ 的几次方成正比？
          explain: $k_F \propto n^{1/3}$，$E_F \propto k_F^2 \propto n^{2/3}$，$8^{2/3} = 4$。
      - item:
          id: thermal-few
          type: choice
          prompt: 室温下 $kT \approx 0.026$ eV，铜的 $E_F \approx 7$ eV。热运动能把哪些电子激发到更高的空状态上？
          options:
            - text: 只有费米能附近约 $kT$ 范围内的少数电子
              correct: true
            - text: 全部电子，每个都多得到约 $kT$ 的能量
              why: 费米能以下深处的电子，往上 0.026 eV 的状态都被别的电子占着，不相容原理不允许它跳上去
            - text: 一个也不能，因为 $kT$ 比 $E_F$ 小得多
              why: 靠近费米能的电子，往上一点就是空状态，$kT$ 足够把它们激发上去
          explain: 只有能量离 $E_F$ 不到几个 $kT$ 的电子上方才有空位，它们只占全部电子的约 $kT/E_F$，不到百分之一。这解释了金属的电子比热为什么远小于经典理论的预言。
  - id: periodic-potential
    chapter: 能带理论
    title: 周期势和带隙
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个电子的波沿原子链传播，链上原子相隔 $a$。如果电子的波长正好是 $2a$，被每个原子反射回来的小波会怎样？
          options:
            - text: 全部同相叠加，电子的波被反射回去
              correct: true
            - text: 互相抵消，电子畅通无阻
              why: 相邻两个原子反射的小波相差的路程是 $2a$，正好一个波长，是同相加强，不是抵消
            - text: 方向杂乱，平均下来没有影响
              why: 原子排得整齐，各个反射波的相位差都是一个波长的整数倍，不会杂乱
          explain: 这是一维的布拉格条件 $2a = n\lambda$。满足它的波被强烈反射，不能作为单一的行波传播，电子的能量在这里会出现一段空缺。
      - card:
          title: 布洛赫定理
          body: |
            晶体里电子的势能每隔一个原子重复一次：$V(x + a) = V(x)$。**布洛赫定理（Bloch theorem）**说，这时薛定谔方程的解可以写成

            $$\psi_k(x) = e^{ikx}u_k(x),\qquad u_k(x + a) = u_k(x)$$

            也就是一个平面波乘上一个和晶格同周期的函数，叫**布洛赫波（Bloch wave）**。等价的说法是 $\psi(x + a) = e^{ika}\psi(x)$：平移一个原子，波函数只多一个相位因子，$|\psi|^2$ 在每个原胞里都一样。$k$ 和 $k + G$ 描述同一个状态，所以只取第一布里渊区里的 $k$。
      - item:
          id: bloch-density
          type: choice
          prompt: 按布洛赫定理，晶体里一个定态电子在各个原胞里被找到的概率怎样？
          options:
            - text: 每个原胞都一样
              correct: true
            - text: 越往晶体深处越小
              why: 那是势垒外衰减的波函数；周期势里的布洛赫波平移一个原胞只多一个模为 1 的相位因子，概率不变
            - text: 只在一个原胞里不为零
              why: 布洛赫波是 $e^{ikx}$ 乘周期函数，遍布整块晶体，电子不属于哪一个原子
          explain: $|\psi(x + a)|^2 = |e^{ika}|^2|\psi(x)|^2 = |\psi(x)|^2$。电子是整块晶体共有的，这正是金属和半导体能导电的基础。
      - item:
          id: bloch-phase
          type: number
          prompt: 一个布洛赫波 $k = \pi/a$。$\psi(x + 3a) = c\,\psi(x)$，$c$ 是多少？
          answer: -1
          hint: 平移 $3a$ 多出的相位因子是 $e^{ik\cdot3a}$。
          explain: $c = e^{i(\pi/a)(3a)} = e^{i3\pi} = -1$。$k = \pi/a$ 的布洛赫波每过一个原胞变一次号，是第一布里渊区边界上的状态。
      - card:
          title: 边界上变成驻波
          body: |
            一维的布拉格条件 $2a = n\lambda$ 换成波数是 $k = n\pi/a$，$n = 1$ 正好是第一布里渊区的边界。在这里向右的 $e^{i\pi x/a}$ 和向左的 $e^{-i\pi x/a}$ 被反射来反射去，叠加成两种驻波：

            $\cos(\pi x/a)$ 的波腹在原子上，电子多待在离原子核近、势能低的地方，能量偏低；$\sin(\pi x/a)$ 的波腹在原子之间，能量偏高。同一个 $k$ 出现两个能量，中间的能量没有状态。
      - card:
          title: 能带和带隙
          body: |
            把势能看作对自由电子的小扰动，这种处理叫**近自由电子近似（nearly free electron approximation）**。结果是：离边界远的地方 $E(k)$ 和自由电子的抛物线几乎一样，靠近边界时曲线被掰开，分成上下两段。

            允许的能量连成一段段的**能带（energy band）**，两段之间没有状态的能量范围叫**带隙（band gap）**。带隙的大小是 $2|V_1|$，$V_1$ 是势能的傅里叶级数里 $G = 2\pi/a$ 那一项的系数。
      - item:
          id: where-gaps
          type: choice
          prompt: 按近自由电子近似，一维晶格（间隔 $a$）的 $E(k)$ 曲线在哪些 $k$ 处被掰开、出现带隙？
          options:
            - text: $k = \pm\pi/a, \pm2\pi/a, \dots$
              correct: true
            - text: 只在 $k = 0$ 处
              why: 带隙出在 $k$ 和 $k - G$ 两个波能量相等、可以混合的地方，即 $|k| = |k - G|$，$k = G/2 = n\pi/a$；$k = 0$ 附近没有能量相同的另一个波，曲线仍和自由电子相同
            - text: 每个 $k$ 处都掰开一点
              why: 离 $n\pi/a$ 远的地方，反射的小波相位杂乱、互相抵消，曲线几乎就是自由电子的抛物线
          explain: 只有满足布拉格条件 $2a = n\lambda$、即 $k = n\pi/a$ 的波才被强烈反射，形成两种能量不同的驻波。第一个带隙在第一布里渊区的边界上。
      - card:
          title: 例题：边界上的能量
          body: 原子链 $a = 0.5$ nm，势能的傅里叶系数 $|V_1| = 0.2$ eV。求布里渊区边界上两种驻波的能量。
          reveal:
            - title: 第 1 步：自由电子在边界上的能量
              body: $E = \dfrac{\hbar^2(\pi/a)^2}{2m} = \dfrac{h^2}{8ma^2}$，和宽 $a$ 的无限深势阱的基态能量是同一个式子。宽 1 nm 时是 0.376 eV，所以 $a = 0.5$ nm 时是 $0.376/0.5^2 = 1.504$ eV。
            - title: 第 2 步：上下各移开 |V₁|
              body: 两种驻波的能量是 $1.504 \mp 0.2$ eV，即 1.304 eV 和 1.704 eV。
            - title: 第 3 步：读出带隙
              body: 下面的能带最高到 1.304 eV，上面的能带最低从 1.704 eV 开始，带隙 0.4 eV。
      - item:
          id: upper-band-bottom
          type: number
          prompt: 原子链 $a = 0.4$ nm，势能的傅里叶系数 $|V_1| = 0.3$ eV。第二个能带的最低能量是多少电子伏特（以自由电子 $k = 0$ 处为零点）？宽 1 nm 的无限深势阱基态能量是 0.376 eV。
          answer: 2.65
          tolerance: 0.01
          unit: eV
          hint: 先算自由电子在 $k = \pi/a$ 处的能量，再往哪个方向移 $|V_1|$？
          explain: 边界上自由电子的能量 $0.376/0.4^2 = 2.35$ eV。上面那种驻波高出 $|V_1|$：$2.35 + 0.3 = 2.65$ eV。下面的能带最高到 $2.35 - 0.3 = 2.05$ eV，带隙 0.6 eV。
      - card:
          title: 克勒尼希–彭尼模型
          body: |
            把原子换成一排很窄很高的方势垒，薛定谔方程可以严格求解，叫**克勒尼希–彭尼模型（Kronig–Penney model）**。势垒取又窄又高的极端情形时，结果是

            $$\cos(ka) = \cos(\alpha a) + P\frac{\sin(\alpha a)}{\alpha a},\qquad \alpha = \frac{\sqrt{2mE}}{\hbar}$$

            $P$ 越大，势垒越强。左边的 $\cos(ka)$ 只能在 $-1$ 到 $1$ 之间，所以右边超出这个范围的能量没有解，那里就是带隙。
      - item:
          id: kp-forbidden
          type: choice
          prompt: 克勒尼希–彭尼模型取 $P = 3\pi/2$。能量对应 $\alpha a = \pi/2$ 时，右边等于 $0 + \frac{3\pi}{2}\cdot\frac{1}{\pi/2} = 3$。这个能量怎样？
          options:
            - text: 落在带隙里，没有这个能量的状态
              correct: true
            - text: 在能带里，对应 $k = 3/a$
              why: $\cos(ka) = 3$ 无解，任何实数 $k$ 的余弦都不超过 1
            - text: 在能带里，只是电子的速度为零
              why: 速度为零的是能带边缘 $\cos(ka) = \pm1$ 的状态；右边等于 3 时连状态都没有
          explain: 右边超过 1，左边的余弦够不着，这个能量没有布洛赫波解。$\alpha a = \pi$ 时右边是 $-1 + 0 = -1$，正好对应 $k = \pi/a$，是一个能带的边缘。
      - item:
          id: states-per-band
          type: number
          prompt: 一块晶体有 $10^{22}$ 个原胞。一个能带最多能放多少个电子？写成 $N\times10^{22}$，$N$ 是多少？
          answer: 2
          hint: 第一布里渊区里有几个允许的 $k$？每个 $k$ 能放几个电子？
          explain: 第一布里渊区里允许的 $k$ 的个数等于原胞数 $10^{22}$，每个 $k$ 放自旋相反的两个电子，共 $2\times10^{22}$ 个。能带能不能填满，就看每个原胞贡献几个电子。
      - item:
          id: strong-barrier
          type: choice
          prompt: 克勒尼希–彭尼模型里势垒越来越强（$P$ 越来越大），能带会怎样？
          options:
            - text: 能带越来越窄，最后缩成孤立原子的能级
              correct: true
            - text: 能带越来越宽，带隙消失
              why: 那是 $P \to 0$ 的情形，回到没有势能的自由电子，曲线连续；$P$ 大时电子很难穿过势垒
            - text: 能带宽度不变，只是整体升高
              why: $P$ 越大，右边超出 $\pm1$ 的范围越多，允许的能量段越来越窄
          explain: 势垒强，电子难以隧穿到相邻的原子，几乎被困在各自的势阱里，能量接近孤立势阱的能级。$P$ 从 0 到 ∞，模型从自由电子过渡到孤立原子，能带介于两者之间。
  - id: bands-metals-insulators
    chapter: 能带理论
    title: 金属、半导体和绝缘体
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个能带里的每个状态都被电子占满了。加上电场，这个能带里的电子会形成电流吗？
          options:
            - text: 会，电场推着所有电子一起动
              why: 电场要改变电子的状态才能产生净的定向运动，而满带里所有状态都占满，没有空位可去
            - text: 不会，满带里没有空状态可去
              correct: true
            - text: 会，但只有一半电子参与
              why: 满带里向左和向右运动的电子成对出现，不管哪一半，总电流都是零
          explain: 满带里每个速度为 $v$ 的电子都有一个速度为 $-v$ 的同伴，合起来电流为零；电场想让电子换到别的状态，可别的状态也都满了。满带不导电。
      - card:
          title: 满带不导电
          body: |
            能带里的状态按 $k$ 排列，$k$ 和 $-k$ 的电子速度相反。能带全满时两者成对，总电流为零。电场想把每个电子推到相邻的状态上，可在满带里这只是电子之间换了位置，占据情况没变，仍然没有电流。

            能带只占了一部分时就不同了：电场把电子往一边推到原来空着的状态上，向一个方向运动的电子多于反方向的，就有了电流。所以导电要看最高的那个有电子的能带是不是填满了。
      - card:
          title: 价带和导带
          body: |
            绝对零度下，半导体里被电子填满的最高能带叫**价带（valence band）**，它上面紧挨着的空能带叫**导带（conduction band）**。导带底的能量记作 $E_c$，价带顶记作 $E_v$，带隙 $E_g = E_c - E_v$。

            室温下的带隙：硅 1.12 eV，锗 0.66 eV，砷化镓 1.42 eV。硅的一个原胞有 2 个原子、每个原子 4 个价电子，共 8 个，一个能带放得下 2 个（每个原胞），正好填满 4 个能带，所以绝对零度下硅不导电。
      - item:
          id: si-bands-filled
          type: number
          prompt: 一个能带放得下的电子数是原胞数的 2 倍。硅的每个原胞有 2 个原子、每个原子 4 个价电子。绝对零度下硅的电子正好填满几个能带？
          answer: 4
          hint: 每个原胞有几个价电子？每个能带每个原胞能放几个？
          explain: 每个原胞 $2\times4 = 8$ 个价电子，每个能带每个原胞放 2 个，$8/2 = 4$ 个能带全满，第 5 个能带（导带）全空。
      - item:
          id: calcium-metal
          type: choice
          prompt: 钙是面心立方晶格，每个原胞 1 个原子、2 个价电子，按“每个能带每个原胞放 2 个”数下来正好填满一个能带，可钙是金属。原因是什么？
          options:
            - text: 钙的两个能带在能量上有重叠，电子同时分在两个都没填满的能带里
              correct: true
            - text: 钙的带隙比硅大
              why: 带隙大只会更难导电；钙导电恰恰是因为它的能带之间没有带隙
            - text: 计数错了，一个能带每个原胞只能放 1 个电子
              why: 每个 $k$ 能放自旋相反的两个电子，每个原胞对应一个 $k$，所以是 2 个
          explain: 三维晶体里不同方向的能带高低不同，第一个能带的最高处可能比第二个能带的最低处还高。这时电子先填两个能带的低处，两个都只填了一部分，就能导电。镁、锌每个原胞有 2 个原子、4 个价电子，数下来该正好填满两个能带，同样因为能带重叠而是金属。
      - card:
          title: 金属、半导体、绝缘体
          body: |
            - 金属：最高的有电子的能带只填了一部分（如钠，每个原胞 1 个价电子），或者能带重叠。
            - 半导体：绝对零度下价带全满、导带全空，带隙不大（约 0.5–2 eV），室温下有少量电子被热运动激发到导带，能导一点电。
            - 绝缘体：带隙很大（二氧化硅约 9 eV，金刚石约 5.5 eV），热激发的电子少到可以忽略。

            半导体和绝缘体的区别只是带隙大小，没有截然的分界线。
      - item:
          id: insulator-ratio
          type: choice
          prompt: 硅和金刚石都是金刚石结构，都是价带全满、导带全空。为什么硅算半导体，金刚石算绝缘体？
          options:
            - text: 硅的带隙小，室温下能激发出可观的电子；金刚石带隙大，几乎激发不出
              correct: true
            - text: 金刚石的价带没有填满
              why: 金刚石和硅一样，每个原胞 8 个价电子填满 4 个能带
            - text: 硅是金属，金刚石不是
              why: 硅的价带全满、导带全空，不是金属；它的导电靠热激发，随温度升高而变好
          explain: 被激发的电子数大致按 $e^{-E_g/2kT}$ 变化。硅 1.12 eV，室温下这个因子约 $4\times10^{-10}$；金刚石 5.5 eV，约 $10^{-46}$，差了 30 多个数量级。
      - card:
          title: 直接带隙和间接带隙
          body: |
            画出能量随 $k$ 的变化（能带图），导带最低点和价带最高点若在同一个 $k$ 上，叫**直接带隙（direct band gap）**，如砷化镓；不在同一个 $k$ 上，叫**间接带隙（indirect band gap）**，如硅、锗。

            电子吸收或放出一个光子时，光子带走的动量 $h/\lambda$ 很小，电子的 $k$ 几乎不变。直接带隙材料里电子从导带底落到价带顶可以直接发光；间接带隙材料还要同时借助晶格振动（量子化的晶格振动叫**声子（phonon）**）补足动量，发光很慢，所以发光二极管和激光器用砷化镓、氮化镓，不用硅。
      - item:
          id: photon-momentum
          type: number
          prompt: 波长 1 μm 的光子动量 $h/\lambda$，和间隔 $a = 0.543$ nm（硅的晶格常数）的一维晶格在布里渊区边界上的 $\hbar\pi/a$ 比，是它的多少倍？写成 $N\times10^{-3}$，$N$ 是多少？
          answer: 1.09
          tolerance: 0.01
          hint: $h/\lambda$ 除以 $\hbar\pi/a$，把 $h = 2\pi\hbar$ 代进去能约掉什么？
          explain: $\dfrac{h/\lambda}{\hbar\pi/a} = \dfrac{2\pi/\lambda}{\pi/a} = \dfrac{2a}{\lambda} = \dfrac{2\times0.543}{1000} = 1.09\times10^{-3}$。光子的动量只有布里渊区尺度的千分之一，所以光跃迁在能带图上几乎是竖直的。硅的布里渊区沿 [100] 方向的边界在 $2\pi/a$，比例还要再小一半。
      - item:
          id: gaas-cutoff
          type: number
          prompt: 砷化镓的带隙 1.42 eV。光子能量至少等于带隙才能把电子从价带激发到导带。它能吸收的光，波长最长是多少纳米？取 $hc = 1240$ eV·nm。
          answer: 873
          tolerance: 1
          unit: nm
          hint: $E = hc/\lambda$，反过来求 $\lambda$。
          explain: $\lambda = 1240/1.42 = 873$ nm，在近红外。波长更长的光光子能量不够，直接穿过去。硅的截止波长是 $1240/1.12 = 1107$ nm。
      - item:
          id: led-material
          type: choice
          prompt: 想做一个高效的发光二极管，下面哪种材料合适？
          options:
            - text: 硅，因为它最便宜、工艺最成熟
              why: 硅是间接带隙，导带电子落回价带时几乎不发光，能量大多变成热
            - text: 锗，因为带隙小、容易激发
              why: 锗也是间接带隙，同样发光效率很低
            - text: 砷化镓，它是直接带隙
              correct: true
          explain: 砷化镓是直接带隙，导带底和价带顶在同一个 $k$，复合时直接放出光子，波长约 $1240/1.42 = 873$ nm。红外遥控器的发光管就用它。
  - id: electrons-holes
    chapter: 有效质量
    title: 电子和空穴
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一排座位坐满了人，只有最右边空着一个。每次让空位左边的那个人往右挪进空位，挪了几次以后，空位跑到哪里去了？
          options:
            - text: 往左移了
              correct: true
            - text: 往右移了
              why: 人往右挪，空出来的位置在他原来的地方，也就是更靠左
            - text: 一直在最右边
              why: 每挪一次，原来那个人的位置就空出来，空位跟着往左走
          explain: 人往右走，空位往左走。与其盯着一排人每次谁动了，不如只盯着那一个空位。价带里缺一个电子的情形也这样处理。
      - card:
          title: 电子–空穴对
          body: |
            室温下，硅价带里少数电子被热运动激发到导带。导带几乎是空的，这些电子在里面有很多空状态可去，能导电。

            价带里同时少了一个电子，留下一个空状态，叫**空穴（hole）**。用化学键来说，就是某根共价键少了一个电子。一次激发同时产生一个导带电子和一个空穴，叫**电子–空穴对（electron–hole pair）**。纯硅里电子和空穴总是一样多。
      - item:
          id: excess-energy
          type: number
          prompt: 一个能量 1.5 eV 的光子被硅吸收，产生一个电子–空穴对。硅的带隙 1.12 eV。多出来的能量有多少电子伏特（它很快以热的形式交给晶格）？
          answer: 0.38
          tolerance: 0.001
          unit: eV
          hint: 产生一个电子–空穴对至少要多少能量？
          explain: $1.5 - 1.12 = 0.38$ eV。电子先被送到导带底以上 0.38 eV 左右的地方，在约皮秒内把多余能量交给晶格振动，落到导带底附近。这是太阳能电池的一种主要损耗。
      - item:
          id: photoconductor
          type: choice
          prompt: 一块纯硅在暗处电阻很大，用光照射后电阻明显变小。原因是什么？
          options:
            - text: 光子把价带电子激发到导带，电子和空穴都多了
              correct: true
            - text: 光照使硅变热，像金属那样电阻变小
              why: 金属变热时电阻是变大的；而且光电导主要来自光子直接产生的电子–空穴对，不是加热
            - text: 光子本身带电，进入硅里成了载流的电荷
              why: 光子不带电；能带电导电的是被它激发出来的电子和空穴
          explain: 能量大于带隙的光子每被吸收一个，就多一个导带电子和一个空穴，两者都能导电。光敏电阻就是这个原理。
      - card:
          title: 为什么空穴带正电
          body: |
            价带全满时不导电，价带里的电子和原子核的正电荷合起来也是电中性的。拿走一个电子，这一处就多出 $+e$ 的电荷。

            再看电流：满带的电流是零，缺一个电子的价带的电流，等于“满带的电流”减去“那个缺掉的电子本来贡献的电流”，也就是负的那个电子的电流。一个负电荷的电流取负号，相当于一个正电荷在跟着那个状态运动。所以缺一个电子的价带，整体表现得像一个带 $+e$ 的粒子。
      - item:
          id: hole-drift
          type: choice
          prompt: 一块硅里沿 $+x$ 方向加电场，空穴往哪个方向漂移？
          options:
            - text: $+x$ 方向，和电场同向
              correct: true
            - text: $-x$ 方向，因为空穴是由电子组成的
              why: 价带里的电子确实往 $-x$ 挪，但它们一个个挪进空位，空位本身往 $+x$ 走，正像座位的例子
            - text: 不动，空穴只是一个空位，不受电场作用
              why: 空位由周围电子的移动带着走，整体就像一个受电场作用的正电荷
          explain: 电场推价带电子往 $-x$ 走，空位 $+x$ 一侧的电子挪进空位，空位就移到了 $+x$ 一侧。所以空穴沿电场方向漂移，就像一个受力 $+eE$ 的正电荷。电子和空穴运动方向相反，电流方向却相同，都沿 $+x$。
      - card:
          title: 载流子和能带图
          body: |
            导带里的电子和价带里的空穴都能运载电流，合称**载流子（carrier）**。

            画能带图时，横轴是位置，纵轴是电子的能量，画两条线 $E_c$ 和 $E_v$。电子画在 $E_c$ 上面，越往上能量越高；空穴画在 $E_v$ 下面，空穴的能量向下增加。所以电子像水往低处流，落在导带底；空穴像气泡往上浮，聚在价带顶。
      - item:
          id: hole-energy
          type: choice
          prompt: 能带图上，价带里的两个空穴，一个紧贴价带顶，一个在价带顶以下 0.1 eV。哪一个能量更高？
          options:
            - text: 紧贴价带顶的那个
              why: 对电子来说价带顶的状态能量更高，但空穴是“缺了电子”，把一个空位往下挪要让上面的电子补进来，能量增加
            - text: 在价带顶以下 0.1 eV 的那个
              correct: true
            - text: 两个一样，空穴没有能量的高低
              why: 空穴有动能，离价带顶越远动能越大，正像电子离导带底越远动能越大
          explain: 空穴的能量在能带图上向下增加。空位往深处移，意味着一个更深处的电子被换到了更高的地方，系统的能量变大。所以没有外力时，空穴会“浮”到价带顶。
      - item:
          id: pair-count
          type: number
          prompt: 一块纯硅在室温下每立方厘米有 $10^{10}$ 个导带电子。每立方厘米有多少个空穴？写成 $N\times10^{10}$，$N$ 是多少？
          answer: 1
          hint: 纯硅里的导带电子都是从哪里来的？
          explain: 纯硅里每个导带电子都是从价带激发上去的，每激发一个就留下一个空穴，所以空穴也是 $10^{10}\ \text{cm}^{-3}$。掺了杂质以后两者就不再相等。
  - id: effective-mass
    chapter: 有效质量
    title: 有效质量
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 同样的电场力作用在真空里的电子和砷化镓导带里的电子上。两者的加速度一样吗？
          options:
            - text: 一样，加速度只由力和电子质量决定
              why: 晶体里的电子还受到周期势的作用，它对外力的响应和真空里不同
            - text: 不一样，砷化镓里的电子像是变轻了，加速度大十几倍
              correct: true
            - text: 晶体里的电子不停地被原子挡住，根本不会加速
              why: 布洛赫波在完美的周期势里可以畅通无阻地运动；减速来自杂质和晶格振动对电子的碰撞，而在两次碰撞之间电子照样加速
          explain: 周期势的影响可以折算成电子的质量变了。砷化镓导带底的电子表现得只有真空中电子质量的 6.7%，同样的力下加速度约是 15 倍。
      - card:
          title: 能带底附近像自由电子
          body: |
            导带底附近，$E(k)$ 曲线可以用一条抛物线近似：

            $$E \approx E_c + \frac{\hbar^2k^2}{2m^*}$$

            和自由电子的 $E = \hbar^2k^2/2m$ 比一比，只是把 $m$ 换成了 $m^*$。抛物线越陡，$m^*$ 越小。一般地，**有效质量（effective mass）**由曲线的弯曲程度定义：

            $$\frac{1}{m^*} = \frac{1}{\hbar^2}\frac{d^2E}{dk^2}$$
      - item:
          id: gaas-mass
          type: number
          prompt: 自由电子的 $\hbar^2/2m = 0.0381\ \text{eV·nm}^2$。某导带底附近 $E = E_c + 0.569\,k^2$（$E$ 以 eV、$k$ 以 $\text{nm}^{-1}$ 计）。有效质量是自由电子质量的几倍？
          answer: 0.067
          tolerance: 0.001
          hint: 抛物线的系数 0.569 对应哪个量？它是自由电子的 0.0381 的几倍？
          explain: $\dfrac{m^*}{m} = \dfrac{\hbar^2/2m}{\hbar^2/2m^*} = \dfrac{0.0381}{0.569} = 0.067$，这正是砷化镓的导带有效质量。抛物线比自由电子陡 15 倍，电子就像轻了 15 倍。
      - item:
          id: curvature-mass
          type: choice
          prompt: 两种半导体的导带底，A 的 $E(k)$ 曲线比 B 的更陡、更尖。哪个的电子有效质量更小？
          options:
            - text: A
              correct: true
            - text: B
              why: 有效质量和曲率成反比，曲线平缓的 B 曲率小，有效质量反而大
            - text: 一样，有效质量是电子固有的性质
              why: 有效质量描述的是电子在某个能带里怎样响应外力，换了能带或材料就不同
          explain: $1/m^* \propto d^2E/dk^2$。曲线越尖，同样的 $k$ 变化带来更大的能量和速度变化，电子显得越轻。
      - card:
          title: 为什么能当质量用
          body: |
            布洛赫电子的速度是波包的群速度。$E = \hbar\omega$，所以

            $$v = \frac{d\omega}{dk} = \frac{1}{\hbar}\frac{dE}{dk}$$

            外力 $F$ 做功 $F v\,dt = dE = \hbar v\,dk$，得 $\hbar\,dk/dt = F$：力改变的是 $\hbar k$，叫**晶体动量（crystal momentum）**。再对时间求导：

            $$\frac{dv}{dt} = \frac{1}{\hbar}\frac{d^2E}{dk^2}\frac{dk}{dt} = \frac{1}{\hbar^2}\frac{d^2E}{dk^2}F = \frac{F}{m^*}$$

            形式上和牛顿第二定律一样，周期势的影响都藏在 $m^*$ 里。
      - item:
          id: accel-ratio
          type: number
          prompt: 同样的电场力下，砷化镓导带里的电子（$m^* = 0.067m$）的加速度是真空中电子的几倍？
          answer: 14.9
          tolerance: 0.1
          hint: $a = F/m^*$，力相同时加速度和什么成反比？
          explain: $a_{\text{GaAs}}/a_{\text{真空}} = m/m^* = 1/0.067 = 14.9$。电子轻，在电场里就跑得快，所以砷化镓适合做高频晶体管。
      - card:
          title: 例题：一维紧束缚能带
          body: 原子靠得不太近时，一维能带可以写成 $E(k) = E_0 - 2t\cos(ka)$（$t$ 是电子隧穿到相邻原子的能量，叫跳跃积分）。取 $t = 1$ eV、$a = 0.3$ nm，求能带底和能带顶的有效质量。
          reveal:
            - title: 第 1 步：求二阶导数
              body: $\dfrac{dE}{dk} = 2ta\sin(ka)$，$\dfrac{d^2E}{dk^2} = 2ta^2\cos(ka)$。
            - title: 第 2 步：能带底 k = 0
              body: $\cos 0 = 1$，$\dfrac{d^2E}{dk^2} = 2ta^2$，$m^* = \dfrac{\hbar^2}{2ta^2}$。和自由电子比：$\dfrac{m^*}{m} = \dfrac{\hbar^2/2m}{ta^2} = \dfrac{0.0381}{1\times0.09} = 0.423$。
            - title: 第 3 步：能带顶 k = π/a
              body: $\cos\pi = -1$，曲率变成负的，$m^* = -0.423m$。能带顶附近的电子受力后反而往相反方向加速：它在被晶格的布拉格反射推回来。
      - item:
          id: tb-mass
          type: number
          prompt: 一维紧束缚能带 $E = E_0 - 2t\cos(ka)$，$t = 0.5$ eV，$a = 0.4$ nm。能带底的有效质量是自由电子质量的几倍？$\hbar^2/2m = 0.0381\ \text{eV·nm}^2$。
          answer: 0.476
          tolerance: 0.003
          hint: $E(k)$ 对 $k$ 求两次导数，在 $k = 0$ 处等于多少？
          explain: $ta^2 = 0.5\times0.16 = 0.08\ \text{eV·nm}^2$，$m^*/m = 0.0381/0.08 = 0.476$。$t$ 越大（原子间耦合越强）能带越宽，有效质量越小。
      - card:
          title: 空穴的有效质量
          body: |
            价带顶附近 $E(k)$ 向下弯，曲率为负，那里的电子有效质量是负的。缺一个电子时，价带的整体响应等于“去掉一个带 $-e$、质量 $m_e^* < 0$ 的电子”，相当于加上一个带 $+e$、质量 $-m_e^* > 0$ 的粒子。

            所以空穴带正电，有效质量也是正的，受力方向和加速方向一致。硅的导带有几个椭球形的谷，沿长轴 $m_l = 0.98m$，两个短轴 $m_t = 0.19m$，算电导时用平均 $\dfrac{3}{m_c} = \dfrac{1}{m_l} + \dfrac{2}{m_t}$。
      - item:
          id: si-conductivity-mass
          type: number
          prompt: 硅导带电子沿长轴 $m_l = 0.98m$、两个短轴 $m_t = 0.19m$。用 $\dfrac{3}{m_c} = \dfrac{1}{m_l} + \dfrac{2}{m_t}$ 求电导有效质量 $m_c$ 是 $m$ 的几倍。
          answer: 0.26
          tolerance: 0.003
          hint: 先算 $1/0.98 + 2/0.19$。
          explain: $1/0.98 + 2/0.19 = 1.020 + 10.53 = 11.55$，$m_c = 3/11.55 = 0.26m$。轻的两个方向占了主导，因为它们响应快，电流主要靠它们。
      - item:
          id: hole-positive-mass
          type: choice
          prompt: 空穴的有效质量为什么是正的？
          options:
            - text: 价带顶的 $E(k)$ 向下弯，那里电子的有效质量为负，缺掉它等于多了一个正的质量
              correct: true
            - text: 空穴是正电荷，正电荷的质量都是正的
              why: 有效质量的正负由能带曲率决定，和电荷符号无关；导带顶附近的电子同样会有负的有效质量
            - text: 空穴的有效质量等于自由电子质量
              why: 空穴的有效质量由价带顶的曲率决定，一般和 $m$ 不相等；硅的价带顶有重、轻两种空穴，约 $0.49m$ 和 $0.16m$
          explain: 价带顶 $d^2E/dk^2 < 0$，那里电子的 $m^* < 0$。空穴是“少了这个电子”，电荷和质量都取反：$+e$ 和 $-m_e^* > 0$。
  - id: intrinsic
    chapter: 本征与掺杂半导体
    title: 本征半导体
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 铜丝加热以后电阻变大。一块很纯的硅加热以后，电阻会怎样？
          options:
            - text: 也变大
              why: 铜里电子数不变，加热只让电子更频繁地被晶格振动撞偏；纯硅里能导电的电子数随温度急剧增加，效果相反
            - text: 明显变小
              correct: true
            - text: 几乎不变
              why: 纯硅导电靠热激发的电子和空穴，它们的数目对温度非常敏感
          explain: 温度越高，被热运动激发到导带的电子越多，空穴也一样多，载流子数按指数增长，远远压过碰撞变多的影响。半导体温度计（热敏电阻）就利用了这一点。
      - card:
          title: 本征半导体
          body: |
            不掺杂质的纯净半导体叫**本征半导体（intrinsic semiconductor）**。它的载流子全部来自热激发，每个导带电子都对应一个空穴，所以电子浓度 $n$ 和空穴浓度 $p$ 相等：

            $$n = p = n_i$$

            $n_i$ 叫**本征载流子浓度（intrinsic carrier concentration）**。室温（300 K）下硅约 $1\times10^{10}\ \text{cm}^{-3}$（有的教材取 $1.5\times10^{10}$），锗约 $2\times10^{13}$，砷化镓约 $2\times10^6$：带隙越大，$n_i$ 越小。
      - item:
          id: fraction-ionized
          type: number
          prompt: 硅的原子密度 $5\times10^{22}\ \text{cm}^{-3}$，室温 $n_i = 1\times10^{10}\ \text{cm}^{-3}$。平均多少个硅原子才有一个导带电子？写成 $N\times10^{12}$，$N$ 是多少？
          answer: 5
          hint: 用原子密度除以电子浓度。
          explain: $5\times10^{22}/10^{10} = 5\times10^{12}$，五万亿个原子里才有一个。所以纯硅的导电性很差，也正因为载流子这么少，掺一点点杂质就能大大改变它。
      - card:
          title: 随温度和带隙变化
          body: |
            本征载流子浓度可以写成

            $$n_i = \sqrt{N_cN_v}\,e^{-E_g/2kT}$$

            $N_c$、$N_v$ 是和材料有关、随温度缓慢变化（$\propto T^{3/2}$）的常数，$k$ 是玻尔兹曼常数（不是库仑常数），300 K 时 $kT = 0.02585$ eV。$n_i$ 的变化主要来自指数：产生一个电子–空穴对要付出 $E_g$，电子和空穴浓度的乘积按 $e^{-E_g/kT}$ 变化；两者相等，各自是乘积的平方根，所以指数里是 $E_g/2kT$。
      - item:
          id: ni-400k
          type: number
          prompt: 只看指数项 $e^{-E_g/2kT}$，硅（$E_g = 1.12$ eV）从 300 K 升到 400 K，$n_i$ 变成原来的多少倍？玻尔兹曼常数 $k = 8.617\times10^{-5}$ eV/K。
          answer: 225
          tolerance: 2
          hint: $E_g/2k$ 是多少开尔文？$1/300$ 和 $1/400$ 相差多少？
          explain: $\dfrac{E_g}{2k} = \dfrac{1.12}{2\times8.617\times10^{-5}} = 6499$ K，$\dfrac{1}{300} - \dfrac{1}{400} = \dfrac{1}{1200}$，$e^{6499/1200} = e^{5.42} = 225$。再算上 $T^{3/2}$ 的变化（$(4/3)^{1.5} = 1.54$），约 350 倍。温度升高 100 K，载流子多了两个多数量级。
      - item:
          id: ge-vs-si
          type: choice
          prompt: 室温下锗的 $n_i$（约 $2\times10^{13}$）比硅（约 $10^{10}$）大三个数量级。主要原因是什么？
          options:
            - text: 锗的带隙（0.66 eV）比硅（1.12 eV）小
              correct: true
            - text: 锗原子的价电子比硅多
              why: 锗和硅在元素周期表的同一列，每个原子都有 4 个价电子
            - text: 锗的晶格常数比硅大，原子多
              why: 晶格常数大反而原子密度小；$n_i$ 的差别来自指数里的带隙
          explain: 只看指数，$e^{-0.66/2kT}$ 和 $e^{-1.12/2kT}$ 之比是 $e^{0.46/0.0517} \approx 7\times10^3$。实际比值约 $2\times10^3$，差的部分来自两种材料不同的 $N_c$、$N_v$。锗的 $n_i$ 大，温度一高本征载流子就会淹没掺杂，这是锗晶体管被硅取代的原因之一。
      - card:
          title: 质量作用定律
          body: |
            热平衡时，产生电子–空穴对的速率只取决于温度。复合要一个电子碰上一个空穴，速率正比于 $np$。两者相等时 $np$ 是一个只由温度决定的常数，纯净时它是 $n_i^2$，所以

            $$np = n_i^2$$

            这叫**质量作用定律（mass action law）**。掺了杂质以后它照样成立：电子多了，复合加快，空穴就相应变少。
      - item:
          id: mass-action-p
          type: number
          prompt: 一块硅在室温热平衡下电子浓度 $n = 10^{15}\ \text{cm}^{-3}$，$n_i = 10^{10}\ \text{cm}^{-3}$。空穴浓度是多少？写成 $N\times10^{5}\ \text{cm}^{-3}$，$N$ 是多少？
          answer: 1
          hint: 质量作用定律 $np = n_i^2$。
          explain: $p = n_i^2/n = 10^{20}/10^{15} = 10^5\ \text{cm}^{-3}$。电子比本征时多了 10 万倍，空穴就少了 10 万倍。
      - item:
          id: mass-action-misread
          type: choice
          prompt: 往硅里掺杂，使电子浓度从 $n_i$ 增加到 $10^{16}\ \text{cm}^{-3}$。下面哪个说法对？
          options:
            - text: 空穴浓度不变，仍是 $n_i$，因为掺进去的是电子
              why: 电子多了，电子和空穴相遇复合得更快，空穴被大量消灭，$p = n_i^2/n$ 只剩 $10^4$
            - text: 空穴浓度降到 $10^4\ \text{cm}^{-3}$
              correct: true
            - text: 空穴浓度也增加到 $10^{16}$，因为电子和空穴总是成对的
              why: 成对只在本征激发时成立；掺杂提供的电子来自杂质原子，不伴随空穴
          explain: 热平衡时 $np = n_i^2 = 10^{20}$，$p = 10^{20}/10^{16} = 10^4\ \text{cm}^{-3}$。多的一方越多，少的一方越少。
  - id: doping
    chapter: 本征与掺杂半导体
    title: 掺杂：施主和受主
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 往硅里每一百万个原子换进 1 个磷原子。室温下硅的导电能力会怎样变？
          options:
            - text: 提高几百万倍
              correct: true
            - text: 几乎不变，一百万个里才一个
              why: 磷的浓度是 $5\times10^{22}/10^6 = 5\times10^{16}\ \text{cm}^{-3}$，比纯硅的载流子 $10^{10}$ 多几百万倍
            - text: 变差，杂质会破坏晶格
              why: 少量杂质对晶格的影响很小；关键在于每个磷原子能放出一个电子
          explain: 每个磷原子几乎都能贡献一个导带电子，$5\times10^{16}$ 比纯硅的 $10^{10}$ 多 500 万倍。掺杂让半导体的导电能力可以在很大的范围里精确控制。
      - card:
          title: 施主
          body: |
            磷在元素周期表上在硅右边一格，有 5 个价电子。它替代一个硅原子以后，4 个价电子和周围 4 个硅原子成键，多出的第 5 个只被磷离子松松地拴着，很容易挣脱成为导带电子。这种能放出电子的杂质叫**施主（donor）**，砷、锑也是。

            挣脱需要的能量叫**电离能（ionization energy）**，硅里的磷约 0.045 eV，比带隙小得多，室温下几乎全部电离。掺施主、电子多的半导体叫 **n 型半导体（n-type semiconductor）**。
      - card:
          title: 用氢原子估算电离能
          body: |
            多出的电子绕着带 $+e$ 的磷离子转，很像氢原子，只有两点不同：电子在硅里，质量换成有效质量 $m^*$；库仑力被硅的介电常数 $\varepsilon_r = 11.7$ 削弱。氢原子的基态能量 13.6 eV 和轨道半径 0.0529 nm 相应变成

            $$E_d \approx 13.6\ \text{eV}\times\frac{m^*/m}{\varepsilon_r^2},\qquad r \approx 0.0529\ \text{nm}\times\frac{\varepsilon_r}{m^*/m}$$
      - item:
          id: donor-hydrogen
          type: number
          prompt: 取 $m^* = 0.26m$、$\varepsilon_r = 11.7$，用氢原子模型估算硅里施主的电离能，是多少电子伏特？
          answer: 0.0258
          tolerance: 0.0003
          unit: eV
          hint: 有效质量和介电常数分别让氢原子的 13.6 eV 乘上什么？
          explain: $13.6\times0.26/136.9 = 0.0258$ eV。实测磷是 0.045 eV，数量级对上了：电离能只有几十毫电子伏，室温的 $kT = 0.026$ eV 足以让绝大多数施主电离。
      - item:
          id: donor-radius
          type: choice
          prompt: 同样的模型算出施主电子的轨道半径约 $0.0529\times11.7/0.26 = 2.4$ nm。这说明什么？
          options:
            - text: 轨道跨过好几个晶胞，把电子看成在均匀的硅介质里运动是合理的
              correct: true
            - text: 电子被关在磷原子内部，和硅无关
              why: 2.4 nm 是硅晶格常数（0.54 nm）的四倍多，电子轨道里包着几千个硅原子
            - text: 半径这么大，电子不可能被拴住，施主根本不存在
              why: 被拴住只是拴得松，电离能约几十毫电子伏；低温下施主电子确实被拴在磷离子附近
          explain: 轨道远大于晶格常数，电子感受到的是硅的平均效果，用有效质量和介电常数修正氢原子才说得通。
      - card:
          title: 受主
          body: |
            硼在硅左边一格，只有 3 个价电子，和周围 4 个硅原子成键时缺一个。邻近的电子只需约 0.045 eV 就能跳过来补上，于是在价带里留下一个空穴。这种能接受电子、产生空穴的杂质叫**受主（acceptor）**，铝、镓也是。掺受主、空穴多的半导体叫 **p 型半导体（p-type semiconductor）**。

            在能带图上，施主能级 $E_d$ 画在导带底下面一点，受主能级 $E_a$ 画在价带顶上面一点。
      - item:
          id: which-donors
          type: choice
          multi: true
          prompt: 下面哪些元素掺进硅里是施主？（多选）
          options:
            - text: 磷
              correct: true
            - text: 砷
              correct: true
            - text: 硼
              why: 硼有 3 个价电子，成键时缺一个，是受主
            - text: 镓
              why: 镓和硼一样只有 3 个价电子，是受主
          explain: 比硅多一个价电子的磷、砷、锑是施主；少一个的硼、铝、镓是受主。
      - card:
          title: 多子、少子和电中性
          body: |
            n 型半导体里电子多，叫**多数载流子（majority carrier）**，简称**多子**；空穴少，叫**少数载流子（minority carrier）**，简称**少子**。p 型的反过来。

            半导体整体是电中性的：正电荷（电离的施主 $N_d^+$ 和空穴）等于负电荷（电离的受主 $N_a^-$ 和电子），$n + N_a^- = p + N_d^+$。只掺施主、全部电离且 $N_d \gg n_i$ 时，$n \approx N_d$，再由质量作用定律 $p = n_i^2/N_d$。
      - item:
          id: p-type-minority
          type: number
          prompt: 硅掺硼 $N_a = 2\times10^{17}\ \text{cm}^{-3}$，全部电离，$n_i = 10^{10}\ \text{cm}^{-3}$。电子浓度是多少 $\text{cm}^{-3}$？
          answer: 500
          tolerance: 1
          unit: cm⁻³
          hint: 先定空穴浓度，再用 $np = n_i^2$。
          explain: $p \approx N_a = 2\times10^{17}$，$n = n_i^2/p = 10^{20}/(2\times10^{17}) = 500\ \text{cm}^{-3}$。电子成了少子，一立方厘米里只有几百个。
      - card:
          title: 杂质补偿
          body: |
            同时掺了施主和受主时，施主的电子先去填受主的空位，两者互相抵消，叫**杂质补偿（compensation）**。$N_d > N_a$ 时剩下的是 n 型，$n \approx N_d - N_a$。芯片制造里常在已经是 p 型的区域再掺更多的施主，把它改成 n 型，就是靠补偿。

            净掺杂和 $n_i$ 差不多时不能再近似，要解电中性和质量作用定律联立的二次方程：

            $$n = \frac{N_d - N_a}{2} + \sqrt{\left(\frac{N_d - N_a}{2}\right)^2 + n_i^2}$$
      - item:
          id: compensated
          type: number
          prompt: 硅里同时掺了 $N_d = 3\times10^{16}$ 和 $N_a = 1\times10^{16}\ \text{cm}^{-3}$，全部电离，$n_i = 10^{10}\ \text{cm}^{-3}$。空穴浓度是多少 $\text{cm}^{-3}$？
          answer: 5000
          tolerance: 5
          unit: cm⁻³
          hint: 补偿以后净的施主浓度是多少？
          explain: $n \approx N_d - N_a = 2\times10^{16}$，$p = 10^{20}/(2\times10^{16}) = 5000\ \text{cm}^{-3}$。只把 $N_d$ 当电子浓度会得到 $3.3\times10^3$，漏掉了被受主吃掉的那部分电子。
      - item:
          id: light-doping
          type: number
          prompt: 硅只掺施主 $N_d = 10^{10}\ \text{cm}^{-3}$，和 $n_i = 10^{10}$ 一样大。电子浓度是多少？写成 $N\times10^{10}\ \text{cm}^{-3}$，$N$ 是多少？
          answer: 1.618
          tolerance: 0.005
          hint: 这时 $n \approx N_d$ 不能用了，代进二次方程的解里（$N_a = 0$）。
          explain: $n = 0.5\times10^{10} + \sqrt{0.25\times10^{20} + 10^{20}} = (0.5 + 1.118)\times10^{10} = 1.618\times10^{10}$。电子既来自施主，也来自本征激发，比 $N_d$ 和 $n_i$ 都多。
      - item:
          id: hot-intrinsic
          type: choice
          prompt: 一块掺施主 $10^{14}\ \text{cm}^{-3}$ 的硅加热到 600 K，那时 $n_i$ 已超过 $10^{15}$。它的电子浓度大约是多少？
          options:
            - text: 仍约 $10^{14}$，由掺杂决定
              why: 这只在 $N_d \gg n_i$ 时成立；600 K 时本征激发的载流子已经比施主多十倍
            - text: 约等于 $n_i$，材料又变回了本征
              correct: true
            - text: 约为 $10^{14} \times n_i$
              why: 浓度是加起来的关系（解二次方程），不是乘起来；$n$ 约为 $n_i$ 再略多一点
          explain: $n_i \gg N_d$ 时二次方程的解 $n \approx n_i + N_d/2 \approx n_i$，掺杂的作用被淹没。器件的最高工作温度就受这个限制，带隙大的材料（碳化硅、氮化镓）能在更高温度下工作。
  - id: density-of-states
    chapter: 载流子统计
    title: 态密度
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 导带底以上，能量在 0.01–0.02 eV 之间的状态多，还是 0.10–0.11 eV 之间的状态多？两段一样宽。
          options:
            - text: 0.10–0.11 eV 之间的多
              correct: true
            - text: 0.01–0.02 eV 之间的多，越靠近导带底越密
              why: 导带底附近 $k$ 小，对应波数空间里一个很小的球壳，装得下的状态少；能量高的地方球壳大
            - text: 一样多，能量间隔相同状态数就相同
              why: 状态在波数空间里是均匀的，但能量和 $k^2$ 成正比，同样宽的能量段在 $k$ 大的地方对应更厚的球壳体积
          explain: 状态在波数空间里均匀分布。能量越高，等能面（球面）越大，同样宽的能量段里装的状态越多。这一课把这个关系定量地算出来。
      - card:
          title: 在波数空间里数状态
          body: |
            边长 $L$ 的晶体里，每个允许的 $\vec k$ 占波数空间 $(2\pi/L)^3$ 的体积，能放两个自旋相反的电子。导带底附近 $E - E_c = \hbar^2k^2/2m^*$，能量低于 $E$ 的状态都在半径 $k$ 的球里，每单位体积的状态数是

            $$N(E) = 2\cdot\frac{\tfrac43\pi k^3}{(2\pi)^3} = \frac{k^3}{3\pi^2} = \frac{1}{3\pi^2}\left(\frac{2m^*(E - E_c)}{\hbar^2}\right)^{3/2}$$

            这和自由电子模型里算费米能的式子是同一个，只是把 $m$ 换成 $m^*$、能量从 $E_c$ 算起。
      - card:
          title: 例题：数砷化镓导带底附近的状态
          body: 砷化镓 $m^* = 0.067m$。每立方厘米里，能量在导带底以上 0.1 eV 以内的状态有多少个？$\hbar = 1.0546\times10^{-34}$ J·s，$m = 9.109\times10^{-31}$ kg，$1\text{ eV} = 1.602\times10^{-19}$ J。
          reveal:
            - title: 第 1 步：在国际单位下算括号里的量
              body: $\dfrac{2m^*E}{\hbar^2} = \dfrac{2\times0.067\times9.109\times10^{-31}\times1.602\times10^{-20}}{(1.0546\times10^{-34})^2} = 1.76\times10^{17}\ \text{m}^{-2}$。
            - title: 第 2 步：取 3/2 次方，再除以 3π²
              body: $(1.76\times10^{17})^{3/2} = 7.37\times10^{25}$，除以 $3\pi^2 = 29.6$，得 $2.49\times10^{24}\ \text{m}^{-3}$。
            - title: 第 3 步：换成每立方厘米
              body: $1\ \text{m}^3 = 10^6\ \text{cm}^3$，所以是 $2.49\times10^{18}\ \text{cm}^{-3}$。有效质量越小，同样 0.1 eV 里的状态越少。
      - item:
          id: states-below
          type: number
          prompt: 取 $m^* = 1.08m$（硅导带用来数状态的有效质量），每立方厘米里能量在导带底以上 0.1 eV 以内的状态有多少个？写成 $N\times10^{20}$，$N$ 是多少？$\hbar = 1.0546\times10^{-34}$ J·s，$m = 9.109\times10^{-31}$ kg，$1\text{ eV} = 1.602\times10^{-19}$ J。
          answer: 1.61
          tolerance: 0.02
          hint: 和砷化镓的例题相比，只有哪个量变了？最后每立方米换成每立方厘米要除以多少？
          explain: $2m^*E/\hbar^2 = 2\times1.08\times9.109\times10^{-31}\times1.602\times10^{-20}/(1.0546\times10^{-34})^2 = 2.83\times10^{18}\ \text{m}^{-2}$，取 3/2 次方得 $4.77\times10^{27}$，除以 $3\pi^2 = 29.6$ 得 $1.61\times10^{26}\ \text{m}^{-3} = 1.61\times10^{20}\ \text{cm}^{-3}$。
      - card:
          title: 态密度
          body: |
            对 $N(E)$ 求导，得到每单位体积、每单位能量的状态数，叫**态密度（density of states）**：

            $$g_c(E) = \frac{dN}{dE} = \frac{1}{2\pi^2}\left(\frac{2m^*}{\hbar^2}\right)^{3/2}\sqrt{E - E_c},\quad E \ge E_c$$

            导带底处为零，往上按平方根增长。价带的态密度形状相同，从 $E_v$ 往下长，用空穴的有效质量。带隙里 $g = 0$。有效质量越大，抛物线越平，同样的能量里装的状态越多。
      - item:
          id: dos-ratio
          type: number
          prompt: 导带态密度在 $E - E_c = 0.04$ eV 处是 $0.01$ eV 处的几倍？
          answer: 2
          hint: 导带态密度随 $E - E_c$ 怎样变化？
          explain: $\sqrt{0.04/0.01} = \sqrt4 = 2$。能量离导带底远 4 倍，态密度大 2 倍。
      - item:
          id: dos-mass
          type: choice
          prompt: 砷化镓导带的有效质量（$0.067m$）比硅（$1.08m$，态密度用）小得多。在导带底以上同样的能量范围里，哪种材料的状态更少？
          options:
            - text: 砷化镓
              correct: true
            - text: 硅
              why: $g_c \propto (m^*)^{3/2}$，硅的有效质量大，同样能量范围里状态更多
            - text: 一样多，状态数只和体积有关
              why: 波数空间里状态的密度只和体积有关，但能量和 $k$ 的关系由有效质量决定，换算到能量上就不同了
          explain: 有效质量小，$E(k)$ 抛物线陡，到同样的能量 $k$ 只走了一小段，球里的状态少。$(0.067/1.08)^{3/2} = 0.015$，砷化镓的态密度只有硅的 1.5%。
      - card:
          title: 有效态密度
          body: |
            能量越高，状态被电子占据的概率越小，所以导带里的电子绝大多数挤在导带底以上几个 $kT$ 的范围里。把 $g_c(E)$ 乘上电子占据的概率积分，结果可以写成“好像所有状态都集中在 $E_c$ 这一个能量上”，这个等效的状态浓度叫导带的**有效态密度（effective density of states）**：

            $$N_c = 2\left(\frac{2\pi m^*kT}{h^2}\right)^{3/2}$$

            硅 300 K 时 $N_c \approx 2.8\times10^{19}\ \text{cm}^{-3}$（用 $m^* = 1.08m$），价带的 $N_v \approx 1.8\times10^{19}$（用空穴的 $0.81m$；有的教材取的空穴质量小些，$N_v$ 约 $1.0\times10^{19}$）。它们随温度按 $T^{3/2}$ 变化。
      - item:
          id: nc-400
          type: number
          prompt: 硅 300 K 时 $N_c = 2.8\times10^{19}\ \text{cm}^{-3}$。400 K 时是多少？写成 $N\times10^{19}$，$N$ 是多少？
          answer: 4.31
          tolerance: 0.02
          hint: $N_c$ 随温度按几次方变化？
          explain: $2.8\times(400/300)^{1.5} = 2.8\times1.540 = 4.31$，即 $4.31\times10^{19}\ \text{cm}^{-3}$。和 $n_i$ 的指数变化比，这个变化慢得多。
      - item:
          id: nc-gaas
          type: number
          prompt: 用 $N_c = 2(2\pi m^*kT/h^2)^{3/2}$，硅（$m^* = 1.08m$）300 K 时 $N_c = 2.82\times10^{19}\ \text{cm}^{-3}$。砷化镓 $m^* = 0.067m$，同温度下 $N_c$ 是多少？写成 $N\times10^{17}$，$N$ 是多少？
          answer: 4.35
          tolerance: 0.03
          hint: 温度相同时 $N_c \propto (m^*)^{3/2}$。
          explain: $2.82\times10^{19}\times(0.067/1.08)^{1.5} = 2.82\times10^{19}\times0.01545 = 4.35\times10^{17}\ \text{cm}^{-3}$，比硅少六十多倍。砷化镓掺杂到 $10^{18}$ 以上时导带就很容易被“填满”。
  - id: fermi-dirac
    chapter: 载流子统计
    title: 费米–狄拉克分布
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 金属里电子在绝对零度时从低往高填到费米能为止。那么一个能量比费米能低 0.1 eV 的状态被电子占据的概率是多少？比费米能高 0.1 eV 的呢？
          options:
            - text: 1 和 0
              correct: true
            - text: 都是 1/2
              why: 只有正好在费米能上的状态才说得上一半一半；绝对零度时下面全满、上面全空
            - text: 0 和 1
              why: 电子总是先占低能量的状态，费米能以下才是满的
          explain: 绝对零度时占据概率是一个台阶：费米能以下为 1，以上为 0。温度升高时台阶会被抹平一点，这一课讲抹平以后的形状。
      - card:
          title: 费米–狄拉克分布
          body: |
            温度为 $T$ 时，能量为 $E$ 的一个状态被电子占据的概率是

            $$f(E) = \frac{1}{1 + e^{(E - E_F)/kT}}$$

            这叫**费米–狄拉克分布（Fermi–Dirac distribution）**，它来自泡利不相容原理加上热平衡。式中的 $E_F$ 叫**费米能级（Fermi level）**：$E = E_F$ 时 $f = 1/2$。绝对零度时它就是金属的费米能；温度不为零时，$f$ 从 1 降到 0 的过渡带大约有几个 $kT$ 宽。半导体的费米能级常常落在带隙里，那里没有状态，但它仍决定两边的占据概率。
      - item:
          id: f-2kt
          type: number
          prompt: 一个状态的能量比费米能级高 $2kT$。它被电子占据的概率是多少？（保留三位小数）
          answer: 0.119
          tolerance: 0.001
          hint: $E - E_F = 2kT$ 时，分母里的指数项是多少？
          explain: $e^2 = 7.389$，$f = 1/8.389 = 0.119$。高出 $2kT$ 时只有约八分之一的机会被占。
      - item:
          id: f-01ev
          type: number
          prompt: 300 K（$kT = 0.02585$ eV）时，一个比费米能级高 0.1 eV 的状态被占据的概率是多少？（保留三位有效数字）
          answer: 0.0205
          tolerance: 0.0002
          hint: 先算 $0.1/0.02585$ 是几个 $kT$。
          explain: $0.1/0.02585 = 3.87$，$e^{3.87} = 47.9$，$f = 1/48.9 = 0.0205$。
      - card:
          title: 空穴的占据概率
          body: |
            一个状态没被电子占据的概率是 $1 - f(E)$，在价带里这就是“有一个空穴”的概率。分布关于 $E_F$ 对称：

            $$1 - f(E_F - \Delta) = f(E_F + \Delta)$$

            比 $E_F$ 低 $\Delta$ 的状态空着的概率，等于比 $E_F$ 高 $\Delta$ 的状态被占的概率。费米能级离导带近，导带里电子就多；离价带近，价带里空穴就多。
      - item:
          id: empty-3kt
          type: number
          prompt: 一个状态比费米能级低 $3kT$。它空着（没有电子）的概率是多少？（保留三位小数）
          answer: 0.047
          tolerance: 0.001
          hint: “比 $E_F$ 低 $3kT$ 的状态空着”和“比 $E_F$ 高 $3kT$ 的状态被占”，概率有什么关系？
          explain: $1 - f = f(E_F + 3kT) = 1/(1 + e^3) = 1/21.09 = 0.047$。
      - card:
          title: 玻尔兹曼近似
          body: |
            当 $E - E_F$ 比 $kT$ 大好几倍时，分母里的 $e^{(E-E_F)/kT}$ 远大于 1，可以把 1 略去：

            $$f(E) \approx e^{-(E - E_F)/kT}$$

            这叫**玻尔兹曼近似（Boltzmann approximation）**，就是经典的玻尔兹曼因子。$E - E_F = 3kT$ 时精确值 0.0474、近似值 0.0498，误差约 5%；差得越远越准。费米能级在带隙里、离两边能带都有好几个 $kT$ 时，导带电子和价带空穴都可以用这个近似。
      - item:
          id: boltzmann-02
          type: number
          prompt: 300 K（$kT = 0.02585$ eV）时，导带底比费米能级高 0.2 eV。用玻尔兹曼近似，导带底一个状态被占据的概率是多少？写成 $N\times10^{-4}$，$N$ 是多少？
          answer: 4.36
          tolerance: 0.02
          hint: 0.2 eV 是几个 $kT$？
          explain: $0.2/0.02585 = 7.74$，$e^{-7.74} = 4.36\times10^{-4}$。这时分母里的 1 只占约万分之四，近似几乎没有误差。
      - card:
          title: 例题：多高的状态只剩 1% 被占
          body: 300 K 时，比费米能级高多少的状态被占据的概率正好是 1%？
          reveal:
            - title: 第 1 步：把条件写成方程
              body: $\dfrac{1}{1 + e^{x/kT}} = 0.01$，其中 $x = E - E_F$。
            - title: 第 2 步：解出指数
              body: $1 + e^{x/kT} = 100$，$e^{x/kT} = 99$，$x/kT = \ln 99 = 4.595$。
            - title: 第 3 步：换成电子伏特
              body: $x = 4.595\times0.02585 = 0.119$ eV。只要高出约 $4.6kT$，占据概率就降到 1%。
      - item:
          id: f-0001
          type: number
          prompt: 300 K（$kT = 0.02585$ eV）时，比费米能级高多少电子伏特的状态被占据的概率是 0.1%？
          answer: 0.1785
          tolerance: 0.001
          unit: eV
          hint: $e^{x/kT} = ?$
          explain: $1 + e^{x/kT} = 1000$，$x/kT = \ln 999 = 6.907$，$x = 6.907\times0.02585 = 0.1785$ eV。
      - item:
          id: hotter-f
          type: choice
          prompt: 温度升高时，费米–狄拉克分布的曲线怎样变化（费米能级不动）？
          options:
            - text: 过渡带变宽，$E_F$ 处的值仍是 1/2
              correct: true
            - text: 整条曲线往高能量方向平移
              why: 平移意味着 $E_F$ 变了；温度只出现在 $kT$ 里，它让台阶变缓，中心点不动
            - text: $E_F$ 处的占据概率升高到 1/2 以上
              why: 代入 $E = E_F$，分母是 $1 + e^0 = 2$，不论温度多少都是 1/2
          explain: 温度只改变 $kT$ 这个尺度：$kT$ 大，从 1 降到 0 所用的能量范围就宽。$E_F$ 上下对称地被抹平。
  - id: carrier-densities
    chapter: 载流子统计
    title: 由费米能级算载流子浓度
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: n 型硅里导带电子很多、空穴很少。它的费米能级应该靠近导带还是价带？
          options:
            - text: 靠近导带
              correct: true
            - text: 靠近价带
              why: 费米能级离价带近时，价带里空着的状态多，那是空穴多的 p 型
            - text: 永远在带隙正中间
              why: 只有本征半导体的费米能级在带隙中间附近；掺杂会把它推向一边
          explain: 导带状态被占的概率由 $E_c - E_F$ 决定，费米能级离导带越近，导带里电子越多。所以 n 型的费米能级在带隙上半部，p 型在下半部。
      - card:
          title: 态密度乘占据概率
          body: |
            导带里的电子浓度是每个能量上的状态数乘以被占据的概率，再加起来：

            $$n = \int_{E_c}^{\infty} g_c(E)f(E)\,dE$$

            费米能级在导带底以下好几个 $kT$ 时，用玻尔兹曼近似 $f \approx e^{-(E-E_F)/kT}$，积分可以算出来，结果是

            $$n = N_ce^{-(E_c - E_F)/kT}$$

            同样，价带空穴 $p = N_ve^{-(E_F - E_v)/kT}$。这就是“好像所有状态都在带边”的意思：有效态密度乘以带边处的玻尔兹曼因子。
      - item:
          id: ef-1e16
          type: number
          prompt: 硅掺磷 $N_d = 10^{16}\ \text{cm}^{-3}$，全部电离，300 K，$N_c = 2.8\times10^{19}\ \text{cm}^{-3}$，$kT = 0.02585$ eV。费米能级在导带底以下多少电子伏特？
          answer: 0.205
          tolerance: 0.001
          unit: eV
          hint: 由 $n = N_ce^{-(E_c - E_F)/kT}$ 解出 $E_c - E_F$，$n$ 取多少？
          explain: $n \approx N_d = 10^{16}$，$E_c - E_F = kT\ln(N_c/n) = 0.02585\times\ln 2800 = 0.02585\times7.937 = 0.205$ eV。比 $3kT = 0.078$ eV 大得多，玻尔兹曼近似成立。
      - card:
          title: 乘积和本征浓度
          body: |
            把两个式子乘起来，费米能级消掉了：

            $$np = N_cN_ve^{-(E_c - E_v)/kT} = N_cN_ve^{-E_g/kT}$$

            这就是质量作用定律的来历，$n_i^2 = N_cN_ve^{-E_g/kT}$，开方得 $n_i = \sqrt{N_cN_v}\,e^{-E_g/2kT}$。不管费米能级在哪里，乘积都一样。
      - item:
          id: ni-from-nc
          type: number
          prompt: 用 $N_c = 2.8\times10^{19}$、$N_v = 1.8\times10^{19}\ \text{cm}^{-3}$、$E_g = 1.12$ eV、$kT = 0.02585$ eV 算硅的 $n_i$。写成 $N\times10^{9}\ \text{cm}^{-3}$，$N$ 是多少？
          answer: 8.77
          tolerance: 0.05
          hint: $\sqrt{N_cN_v}$ 乘上 $e^{-1.12/(2\times0.02585)}$。
          explain: $\sqrt{2.8\times1.8}\times10^{19} = 2.245\times10^{19}$，$e^{-21.66} = 3.91\times10^{-10}$，乘积 $8.77\times10^9$。和常用的 $1\times10^{10}$ 差 12%：带隙和有效质量都会随温度略有变化，指数又把小差别放大了，所以教材一般直接用实测的 $n_i$。
      - card:
          title: 本征费米能级
          body: |
            本征半导体 $n = p$，令两个式子相等，解出它的费米能级，叫**本征费米能级（intrinsic Fermi level）**，记作 $E_i$：

            $$E_i = \frac{E_c + E_v}{2} + \frac{kT}{2}\ln\frac{N_v}{N_c}$$

            $N_c$ 和 $N_v$ 相差不大时第二项很小，$E_i$ 几乎在带隙正中间。以 $E_i$ 为参照，浓度可以写成 $n = n_ie^{(E_F - E_i)/kT}$，$p = n_ie^{(E_i - E_F)/kT}$。
      - item:
          id: ei-gaas
          type: number
          prompt: 砷化镓的空穴和电子态密度有效质量分别是 $0.48m$ 和 $0.067m$，所以 $N_v/N_c = (0.48/0.067)^{3/2}$。300 K（$kT = 0.02585$ eV）时它的本征费米能级比带隙中点高多少毫电子伏？
          answer: 38.2
          tolerance: 0.3
          unit: meV
          hint: $\dfrac{kT}{2}\ln\dfrac{N_v}{N_c} = \dfrac{kT}{2}\cdot\dfrac32\ln\dfrac{0.48}{0.067}$。
          explain: $\ln(0.48/0.067) = 1.969$，$\dfrac{0.02585}{2}\times1.5\times1.969 = 0.0382$ eV $= 38.2$ meV。导带态少，要让 $n = p$，费米能级得往导带那边靠一点。硅只偏 $-5.7$ meV（往价带偏）。
      - card:
          title: 例题：从浓度定费米能级
          body: 硅掺磷 $N_d = 10^{17}\ \text{cm}^{-3}$，300 K。求费米能级离导带底多远、离本征费米能级多远。$N_c = 2.8\times10^{19}$，$n_i = 10^{10}\ \text{cm}^{-3}$。
          reveal:
            - title: 第 1 步：定电子浓度
              body: 全部电离且 $N_d \gg n_i$：$n = 10^{17}\ \text{cm}^{-3}$。
            - title: 第 2 步：算费米能级离导带底多远
              body: $E_c - E_F = kT\ln(N_c/n) = 0.02585\times\ln 280 = 0.146$ eV。
            - title: 第 3 步：算费米能级离本征费米能级多远
              body: $E_F - E_i = kT\ln(n/n_i) = 0.02585\times\ln 10^7 = 0.417$ eV。两段加起来约 0.56 eV，正是半个带隙，说明 $E_i$ 在中间附近。
      - item:
          id: ef-p-type
          type: number
          prompt: 硅掺硼 $N_a = 10^{15}\ \text{cm}^{-3}$，300 K（$kT = 0.02585$ eV），$N_v = 1.8\times10^{19}\ \text{cm}^{-3}$。费米能级在价带顶以上多少电子伏特？
          answer: 0.253
          tolerance: 0.001
          unit: eV
          hint: $E_F - E_v = kT\ln(N_v/p)$，$p$ 取多少？
          explain: $p \approx N_a = 10^{15}$，$E_F - E_v = 0.02585\times\ln(1.8\times10^4) = 0.02585\times9.798 = 0.253$ eV。掺杂越轻，费米能级离价带越远、越靠近中间。
      - card:
          title: 费米积分和简并半导体
          body: |
            不用玻尔兹曼近似时，积分要用**费米积分（Fermi integral）**表示：$n = N_cF_{1/2}(\eta)$，$\eta = (E_F - E_c)/kT$，$F_{1/2}(\eta) = \frac{2}{\sqrt\pi}\int_0^\infty\frac{\sqrt x\,dx}{1 + e^{x-\eta}}$。$\eta$ 很负时 $F_{1/2} \approx e^\eta$，回到上面的公式；$\eta = -3$ 时 $F_{1/2} = 0.0489$，$e^{-3} = 0.0498$，差约 2%。

            掺杂很重、费米能级进到离带边不到 $3kT$ 甚至进入能带里时，玻尔兹曼近似明显不准，这样的材料叫**简并半导体（degenerate semiconductor）**。
      - item:
          id: degenerate-onset
          type: number
          prompt: 硅 300 K，$N_c = 2.8\times10^{19}\ \text{cm}^{-3}$。电子浓度多大时费米能级升到导带底以下 $3kT$？写成 $N\times10^{18}\ \text{cm}^{-3}$，$N$ 是多少？
          answer: 1.39
          tolerance: 0.01
          hint: $n = N_ce^{-3}$。
          explain: $2.8\times10^{19}\times e^{-3} = 2.8\times10^{19}\times0.0498 = 1.39\times10^{18}\ \text{cm}^{-3}$。掺杂超过约 $10^{18}$ 就可能成为简并半导体，晶体管的源、漏区常常掺到这个程度以上。
      - item:
          id: boltzmann-overestimate
          type: choice
          prompt: 费米能级正好在导带底（$\eta = 0$）时，精确的 $F_{1/2}(0) = 0.765$。用玻尔兹曼公式 $n = N_ce^{\eta}$ 会怎样？
          options:
            - text: 算多了约 30%
              correct: true
            - text: 算少了约 30%
              why: 玻尔兹曼近似 $e^{-x}$ 总比 $1/(1 + e^{x})$ 大，近似得到的占据概率偏高，浓度也偏高
            - text: 正好相等，费米能级在带边时两者一样
              why: 两者只在 $\eta$ 很负时才接近；$\eta = 0$ 时 $e^0 = 1$，比 0.765 大
          explain: 玻尔兹曼近似给出 $N_c\times1$，精确值 $N_c\times0.765$，多算了 $1/0.765 - 1 = 31\%$。它忽略了不相容原理“占满就不能再放”的限制，所以总是偏多。
  - id: quasi-fermi
    chapter: 载流子统计
    title: 非平衡载流子和准费米能级
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一块 n 型硅（电子 $10^{16}$、空穴 $10^4\ \text{cm}^{-3}$）被光照着，每立方厘米多出 $10^{14}$ 对电子和空穴。哪一种载流子的浓度变化的倍数大？
          options:
            - text: 电子，因为它本来就多
              why: 电子从 $10^{16}$ 变成 $1.01\times10^{16}$，只多了 1%
            - text: 空穴，它本来很少
              correct: true
            - text: 两者变化的倍数一样，因为是成对产生的
              why: 增加的数目一样，但空穴本来只有 $10^4$，同样加 $10^{14}$，倍数完全不同
          explain: 空穴从 $10^4$ 变成约 $10^{14}$，涨了一百亿倍。光照、注入这类扰动主要改变少子，多子几乎不变。
      - card:
          title: 非平衡载流子
          body: |
            光照、或者从别处注入载流子时，电子和空穴比热平衡时多出 $\Delta n$、$\Delta p$，叫**非平衡载流子（excess carriers）**，也叫过剩载流子。光照产生的是成对的，$\Delta n = \Delta p$：

            $$n = n_0 + \Delta n,\qquad p = p_0 + \Delta p$$

            $n_0$、$p_0$ 是热平衡时的浓度。这时 $np > n_i^2$，质量作用定律不再成立。过剩载流子远少于多子浓度的情形叫**小注入（low-level injection）**，这时多子浓度几乎不变，少子浓度主要由 $\Delta p$ 决定。
      - item:
          id: np-ratio
          type: number
          prompt: n 型硅 $n_0 = 10^{16}$、$p_0 = 10^4\ \text{cm}^{-3}$（$n_i = 10^{10}$），光照产生 $\Delta n = \Delta p = 10^{14}\ \text{cm}^{-3}$。$np$ 是 $n_i^2$ 的多少倍？写成 $N\times10^{10}$，$N$ 是多少？
          answer: 1.01
          tolerance: 0.005
          hint: $n = 1.01\times10^{16}$，$p$ 呢？
          explain: $p = 10^{14} + 10^4 \approx 10^{14}$，$np = 1.01\times10^{16}\times10^{14} = 1.01\times10^{30}$，是 $n_i^2 = 10^{20}$ 的 $1.01\times10^{10}$ 倍。离热平衡很远，可多子只变了 1%。
      - item:
          id: low-injection
          type: choice
          prompt: 下面哪种情形是小注入？
          options:
            - text: p 型硅 $p_0 = 10^{17}$，光照产生 $\Delta n = 10^{13}\ \text{cm}^{-3}$
              correct: true
            - text: p 型硅 $p_0 = 10^{15}$，光照产生 $\Delta n = 10^{16}\ \text{cm}^{-3}$
              why: 过剩载流子比多子还多十倍，多子浓度被大大改变，是大注入
            - text: 本征硅 $n_0 = p_0 = 10^{10}$，光照产生 $\Delta n = 10^{12}\ \text{cm}^{-3}$
              why: 过剩载流子是平衡浓度的 100 倍，两种载流子都被大大改变，不是小注入
          explain: 小注入看的是过剩载流子和多子浓度比：$10^{13} \ll 10^{17}$，多子几乎不变。和过剩载流子跟少子比无关，少子总是被改变很多。
      - card:
          title: 准费米能级
          body: |
            非平衡时一个费米能级描述不了两种载流子。可以给电子和空穴各定一个：

            $$n = n_ie^{(E_{Fn} - E_i)/kT},\qquad p = n_ie^{(E_i - E_{Fp})/kT}$$

            $E_{Fn}$、$E_{Fp}$ 叫电子和空穴的**准费米能级（quasi-Fermi level）**。导带里的电子之间、价带里的空穴之间交换能量很快（约皮秒），各自很快达到热平衡；导带和价带之间靠复合交换，慢得多。两者相乘：$np = n_i^2e^{(E_{Fn} - E_{Fp})/kT}$，两条准费米能级分开得越多，离平衡越远；热平衡时 $E_{Fn} = E_{Fp} = E_F$。
      - card:
          title: 例题：光照下的准费米能级
          body: 一块 n 型硅在光照下 $n = 1.01\times10^{16}$、$p = 10^{14}\ \text{cm}^{-3}$，$n_i = 10^{10}$，$kT = 0.02585$ eV。求两条准费米能级的位置和间距。
          reveal:
            - title: 第 1 步：电子的准费米能级
              body: $E_{Fn} - E_i = kT\ln(n/n_i) = 0.02585\times\ln(1.01\times10^6) = 0.3574$ eV。光照前 $E_F - E_i = 0.02585\times\ln 10^6 = 0.3571$ eV，只升了 0.26 meV。
            - title: 第 2 步：空穴的准费米能级
              body: $E_i - E_{Fp} = kT\ln(p/n_i) = 0.02585\times\ln 10^4 = 0.238$ eV，在 $E_i$ 下面。光照前 $E_{Fp} = E_F$，在 $E_i$ 上面 0.357 eV，现在一下子挪了近 0.6 eV。
            - title: 第 3 步：间距
              body: $E_{Fn} - E_{Fp} = 0.357 + 0.238 = 0.595$ eV，也等于 $kT\ln(np/n_i^2)$。
      - item:
          id: qf-split
          type: number
          prompt: 一块太阳能电池光照下开路，测得两条准费米能级相距 0.6 eV。300 K（$kT = 0.02585$ eV）时 $np$ 是 $n_i^2$ 的多少倍？写成 $N\times10^{10}$，$N$ 是多少？
          answer: 1.2
          tolerance: 0.01
          hint: $np/n_i^2 = e^{(E_{Fn} - E_{Fp})/kT}$。
          explain: $0.6/0.02585 = 23.21$，$e^{23.21} = 1.20\times10^{10}$。准费米能级的间距除以电子电荷就是开路电压，这块电池约 0.6 V。
      - item:
          id: which-qf-moves
          type: choice
          prompt: n 型硅在小注入光照下，哪条准费米能级离原来的费米能级远？
          options:
            - text: 电子的 $E_{Fn}$，因为光主要产生电子
              why: 光产生的电子和空穴一样多，但电子本来就多，相对变化很小，$E_{Fn}$ 只挪了零点几毫电子伏
            - text: 空穴的 $E_{Fp}$，少子涨了好几个数量级
              correct: true
            - text: 两条都不动，小注入时可以忽略
              why: 小注入只保证多子几乎不变；少子空穴涨了很多个数量级，$E_{Fp}$ 挪得很远
          explain: 准费米能级的位置取决于浓度的对数。空穴从 $10^4$ 涨到 $10^{14}$，对数变了 $\ln 10^{10}$，$E_{Fp}$ 挪了约 0.6 eV；电子只涨 1%，$E_{Fn}$ 几乎不动。
      - item:
          id: qf-equilibrium
          type: number
          prompt: 一块 p 型硅在暗处、热平衡下，$p = 10^{16}\ \text{cm}^{-3}$。它的两条准费米能级相距多少电子伏特？
          answer: 0
          hint: 热平衡时 $np$ 等于什么？
          explain: 热平衡时 $np = n_i^2$，$E_{Fn} - E_{Fp} = kT\ln(np/n_i^2) = kT\ln 1 = 0$，两条合成一条，就是费米能级。
  - id: drift-mobility
    chapter: 漂移与扩散
    title: 漂移和迁移率
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一块硅里加上 100 V/cm 的电场，导带电子会怎样运动？
          options:
            - text: 越跑越快，一直加速
              why: 电子不断被晶格振动和杂质撞得改变方向，每次碰撞都把攒下的定向速度打乱，平均速度不会一直涨
            - text: 平均下来以一个固定的速度沿电场反方向漂移
              correct: true
            - text: 原地不动，只是热运动变剧烈
              why: 热运动是杂乱的，平均为零；电场在热运动之上叠加了一个定向的平均速度
          explain: 电子在两次碰撞之间被电场加速，碰撞后方向被打乱，平均下来得到一个和电场成正比的定向速度。这和导体里电子的漂移是一回事，只是同样的电场下，硅里的电子比铜里的电子漂移得快约 30 倍；铜里能移动的电子比硅多得多，所以同样的电场下铜的电流仍然大得多。
      - card:
          title: 漂移速度和迁移率
          body: |
            电子在晶格里一边做很快的热运动，一边不时被**散射（scattering）**：被晶格振动或电离的杂质撞得改变方向。两次散射之间平均间隔 $\tau$，叫**平均自由时间（mean free time）**，硅里约零点几皮秒。

            两次散射之间电场使电子获得 $qE\tau/m^*$ 的定向速度，平均下来

            $$v = \mu E,\qquad \mu = \frac{q\tau}{m^*}$$

            $v$ 叫**漂移速度（drift velocity）**，比例系数 $\mu$ 叫**迁移率（mobility）**，单位 $\text{cm}^2/(\text{V·s})$。室温下轻掺杂的硅 $\mu_n \approx 1350$，$\mu_p \approx 480$（不同教材取值略有差别）。
      - item:
          id: tau-from-mu
          type: number
          prompt: 硅的电子迁移率 $1350\ \text{cm}^2/(\text{V·s})$，电导有效质量 $0.26m$。平均自由时间是多少皮秒？$m = 9.109\times10^{-31}$ kg，$q = 1.602\times10^{-19}$ C。
          answer: 0.2
          tolerance: 0.002
          unit: ps
          hint: $\tau = \mu m^*/q$，迁移率先换成 $\text{m}^2/(\text{V·s})$。
          explain: $\mu = 0.135\ \text{m}^2/(\text{V·s})$，$\tau = 0.135\times0.26\times9.109\times10^{-31}/1.602\times10^{-19} = 2.0\times10^{-13}$ s $= 0.2$ ps。每秒被散射约五万亿次。
      - item:
          id: hole-drift-v
          type: number
          prompt: 空穴迁移率 $480\ \text{cm}^2/(\text{V·s})$，电场 500 V/cm。漂移速度是多少？写成 $N\times10^5$ cm/s，$N$ 是多少？
          answer: 2.4
          tolerance: 0.001
          hint: 漂移速度和迁移率、电场是什么关系？
          explain: $v = 480\times500 = 2.4\times10^5$ cm/s。比热运动速度（约 $10^7$ cm/s）小得多，所以叫“漂移”。
      - card:
          title: 电导率和电阻率
          body: |
            电流密度是单位体积的电荷乘漂移速度：电子贡献 $qn\mu_nE$，空穴贡献 $qp\mu_pE$，加起来

            $$J = \sigma E,\qquad \sigma = q(n\mu_n + p\mu_p)$$

            $\sigma$ 叫**电导率（conductivity）**，单位 S/cm。它的倒数 $\rho = 1/\sigma$ 是**电阻率（resistivity）**，单位 Ω·cm。半导体的电阻率能靠掺杂在很大范围里调节，掺杂一种以后通常只有多子那一项要紧。
      - card:
          title: 例题：p 型硅的电阻率
          body: 硅掺硼 $N_a = 10^{16}\ \text{cm}^{-3}$，$\mu_p = 480\ \text{cm}^2/(\text{V·s})$，$q = 1.602\times10^{-19}$ C。求电导率和电阻率。
          reveal:
            - title: 第 1 步：定载流子浓度
              body: $p \approx 10^{16}$，$n = n_i^2/p = 10^4$，电子那一项小 12 个数量级，略去。
            - title: 第 2 步：算电导率
              body: $\sigma = qp\mu_p = 1.602\times10^{-19}\times10^{16}\times480 = 0.769$ S/cm。
            - title: 第 3 步：取倒数
              body: $\rho = 1/0.769 = 1.30$ Ω·cm。同样掺杂浓度的 n 型硅电阻率是 0.46 Ω·cm，因为电子迁移率大。
      - item:
          id: rho-n-1e15
          type: number
          prompt: 硅掺磷 $N_d = 10^{15}\ \text{cm}^{-3}$，$\mu_n = 1350\ \text{cm}^2/(\text{V·s})$，$q = 1.602\times10^{-19}$ C。电阻率是多少 Ω·cm？
          answer: 4.62
          tolerance: 0.02
          unit: Ω·cm
          hint: 先算 $\sigma = qn\mu_n$。
          explain: $\sigma = 1.602\times10^{-19}\times10^{15}\times1350 = 0.216$ S/cm，$\rho = 4.62$ Ω·cm。硅片的规格常常就写电阻率，从它能反推掺杂浓度。
      - item:
          id: rho-intrinsic
          type: number
          prompt: 本征硅 $n = p = 10^{10}\ \text{cm}^{-3}$，$\mu_n = 1350$，$\mu_p = 480\ \text{cm}^2/(\text{V·s})$。电阻率是多少？写成 $N\times10^5$ Ω·cm，$N$ 是多少？
          answer: 3.41
          tolerance: 0.02
          hint: 两种载流子都要算：$\sigma = qn_i(\mu_n + \mu_p)$。
          explain: $\sigma = 1.602\times10^{-19}\times10^{10}\times1830 = 2.93\times10^{-6}$ S/cm，$\rho = 3.41\times10^5$ Ω·cm，比 $10^{15}$ 掺杂的硅大七万多倍。
      - card:
          title: 迁移率随掺杂和温度变化
          body: |
            两种散射各自限制迁移率。晶格振动随温度增强，晶格散射使迁移率随温度升高而下降；电离杂质散射在杂质多、温度低时更强（慢的电子在杂质离子旁边被偏转得更厉害）。几种散射同时存在时，散射的次数相加：

            $$\frac{1}{\mu} = \frac{1}{\mu_L} + \frac{1}{\mu_I}$$

            这叫马西森定则。所以掺杂越重，迁移率越低：硅掺到 $10^{18}$ 时电子迁移率降到 300 以下。
      - item:
          id: matthiessen
          type: number
          prompt: 某块硅里只有晶格散射时电子迁移率是 $1500$，只有杂质散射时是 $3000\ \text{cm}^2/(\text{V·s})$。两种散射都有时是多少？
          answer: 1000
          tolerance: 0.5
          unit: cm²/(V·s)
          hint: 两种散射同时存在时，是迁移率相加，还是它们的倒数相加？
          explain: $1/\mu = 2/3000 + 1/3000 = 3/3000$，$\mu = 1000$。比两个都小：多一种散射，自由时间只会更短。直接取平均（2250）是常见的错。
      - item:
          id: doping-mobility
          type: choice
          prompt: 把硅的掺杂从 $10^{15}$ 提高到 $10^{18}\ \text{cm}^{-3}$，电子迁移率怎样变？
          options:
            - text: 明显下降
              correct: true
            - text: 明显上升，因为电子多了
              why: 电子多让电导率变大，但迁移率是单个电子的平均响应，杂质离子多了散射更频繁，迁移率反而降
            - text: 不变，迁移率是材料常数
              why: 迁移率由散射决定，会随掺杂和温度变化
          explain: 电离的杂质离子会散射电子，离子越多，电子越容易被偏转。电导率 $qn\mu$ 仍然随掺杂增大，只是增大得比 $n$ 慢。
  - id: velocity-saturation-hall
    chapter: 漂移与扩散
    title: 速度饱和和霍尔效应
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 硅里的电场从 $10^3$ V/cm 增加到 $10^5$ V/cm（100 倍），电子的漂移速度会增加多少倍？
          options:
            - text: 正好 100 倍，速度和电场成正比
              why: 正比只在电场不太强时成立；电场很强时电子获得的能量很快被晶格振动带走，速度涨不上去
            - text: 远不到 100 倍，速度会饱和
              correct: true
            - text: 超过 100 倍，强电场下电子越跑越快
              why: 强电场下散射更频繁，速度增加得比电场慢，最后停在约 $10^7$ cm/s
          explain: 弱电场时 $v = \mu E$。电场强到电子的能量明显高于热运动时，它会频繁地激发晶格振动、把能量交出去，漂移速度趋于一个上限。硅里电子约 $10^7$ cm/s。
      - card:
          title: 速度饱和
          body: |
            强电场下漂移速度不再和电场成正比地增长，而是趋于一个上限，叫**速度饱和（velocity saturation）**，上限叫饱和速度 $v_{sat}$，硅里电子约 $10^7$ cm/s。一个常用的近似式是

            $$v = \frac{\mu E}{1 + \mu E/v_{sat}}$$

            $\mu E \ll v_{sat}$ 时回到 $v = \mu E$；$\mu E \gg v_{sat}$ 时 $v \to v_{sat}$。现代晶体管的沟道只有几十纳米，加 1 V 电压电场就超过 $10^5$ V/cm，电子基本以饱和速度运动。
      - item:
          id: sat-field
          type: number
          prompt: 电子迁移率 $1350\ \text{cm}^2/(\text{V·s})$，饱和速度 $10^7$ cm/s。电场多大时 $\mu E$ 等于 $v_{sat}$？写成 $N\times10^3$ V/cm，$N$ 是多少？
          answer: 7.41
          tolerance: 0.01
          hint: $\mu E = v_{sat}$ 里，要求的是哪个量？
          explain: $E = 10^7/1350 = 7.41\times10^3$ V/cm。这时按近似式 $v = v_{sat}/2$，已经明显偏离直线。
      - item:
          id: sat-1e4
          type: number
          prompt: 用 $v = \mu E/(1 + \mu E/v_{sat})$，$\mu = 1350\ \text{cm}^2/(\text{V·s})$，$v_{sat} = 10^7$ cm/s。电场 $10^4$ V/cm 时漂移速度是多少？写成 $N\times10^6$ cm/s，$N$ 是多少？
          answer: 5.74
          tolerance: 0.01
          hint: 先算 $\mu E$，再除以 $1 + \mu E/v_{sat}$。
          explain: $\mu E = 1.35\times10^7$ cm/s，$v = 1.35\times10^7/2.35 = 5.74\times10^6$ cm/s。按线性公式会得到 $1.35\times10^7$，超过了饱和速度。
      - item:
          id: transit-time
          type: number
          prompt: 一段 0.1 μm 长的硅沟道上加 1 V，电场约 $10^5$ V/cm。用同一个近似式（$\mu = 1350$，$v_{sat} = 10^7$ cm/s）求漂移速度，再求电子走完沟道的时间，是多少皮秒？
          answer: 1.07
          tolerance: 0.01
          unit: ps
          hint: 速度算出来以后，时间是长度除以速度；0.1 μm $= 10^{-5}$ cm。
          explain: $\mu E = 1.35\times10^8$，$v = 1.35\times10^8/14.5 = 9.31\times10^6$ cm/s，时间 $10^{-5}/9.31\times10^6 = 1.07\times10^{-12}$ s。这段走完沟道的时间叫渡越时间，它对应的工作频率上限约 $1/(2\pi\tau) \approx 150$ 吉赫兹（GHz），晶体管能工作到上百吉赫兹，靠的就是它这么短。
      - card:
          title: 霍尔效应测载流子
          body: |
            电流沿 $x$ 方向流过一块半导体，磁场沿 $z$ 方向。洛伦兹力把载流子推向 $y$ 方向的一侧，那一侧积累电荷，形成横向电压 $V_H$，直到电场力和洛伦兹力平衡。这就是霍尔效应。

            空穴和电子沿 $x$ 运动的方向相反、电荷也相反，受的洛伦兹力却是同一个方向，所以两种载流子把同一侧分别充成正电和负电：看霍尔电压的正负就知道是 n 型还是 p 型。
      - card:
          title: 由霍尔电压求浓度
          body: |
            平衡时 $qE_y = qvB$。电流 $I = qnvwt$（$w$、$t$ 是样品的宽和厚），霍尔电压 $V_H = E_yw$，消去 $v$ 和 $w$：

            $$n = \frac{IB}{qtV_H}$$

            $1/(qn)$ 叫**霍尔系数（Hall coefficient）**，n 型取负号、p 型取正号。再测出电阻率，迁移率就是 $\mu = 1/(qn\rho)$。
      - item:
          id: hall-n
          type: number
          prompt: 一块 n 型硅片厚 0.2 mm，电流 2 mA，磁场 0.4 T，测得霍尔电压 2.0 mV。电子浓度是多少？写成 $N\times10^{16}\ \text{cm}^{-3}$，$N$ 是多少？$q = 1.602\times10^{-19}$ C。
          answer: 1.25
          tolerance: 0.01
          hint: 全部用国际单位代入 $n = IB/(qtV_H)$，得到的是每立方米。
          explain: $n = \dfrac{2\times10^{-3}\times0.4}{1.602\times10^{-19}\times2\times10^{-4}\times2\times10^{-3}} = 1.25\times10^{22}\ \text{m}^{-3} = 1.25\times10^{16}\ \text{cm}^{-3}$。注意厚度 $t$ 是沿磁场方向的尺寸。
      - item:
          id: hall-mobility
          type: number
          prompt: 一块 n 型硅由霍尔测量得到 $n = 1.25\times10^{16}\ \text{cm}^{-3}$，又测得电阻率 0.5 Ω·cm。电子迁移率是多少 $\text{cm}^2/(\text{V·s})$？$q = 1.602\times10^{-19}$ C。
          answer: 999
          tolerance: 2
          unit: cm²/(V·s)
          hint: $\rho = 1/(qn\mu)$，解出 $\mu$。
          explain: $\mu = \dfrac{1}{qn\rho} = \dfrac{1}{1.602\times10^{-19}\times1.25\times10^{16}\times0.5} = 999\ \text{cm}^2/(\text{V·s})$。霍尔测量加电阻率测量，同时得到浓度、类型和迁移率，是半导体材料最常用的表征方法。
      - item:
          id: hall-sign
          type: choice
          prompt: 两块半导体样品，电流和磁场方向都相同，A 的霍尔电压是正的，B 是负的。下面哪个判断对？
          options:
            - text: A 和 B 的多子类型相反
              correct: true
            - text: A、B 是同一类型，只是浓度不同
              why: 浓度只影响霍尔电压的大小，正负由载流子电荷的符号决定
            - text: 霍尔电压的正负只取决于磁场方向，和材料无关
              why: 磁场方向相同时，电子和空穴被推到同一侧，但带的电荷相反，所以那一侧的电压正负相反
          explain: 两种载流子被推向同一侧，一个让那里带正电，一个带负电。哪块是 p 型要看具体的方向约定，但两块一定一个 n 型、一个 p 型。
  - id: diffusion
    chapter: 漂移与扩散
    title: 扩散和爱因斯坦关系
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一滴墨水滴进静止的水里，没有任何外力推它，墨水也会慢慢散开。半导体里电子在左边多、右边少时，没有电场也会有净的电子流吗？
          options:
            - text: 会，从多的一边流向少的一边
              correct: true
            - text: 不会，没有电场就没有力，电子不会定向运动
              why: 每个电子的热运动方向是随机的，但左边电子多，往右跑的总数多于从右边往左跑的，合起来就有净的流动
            - text: 会，从少的一边流向多的一边
              why: 随机运动只会把浓度抹平，从浓的地方往淡的地方净流
          explain: 热运动让每个电子往各个方向乱跑。哪边电子多，从那边跑过来的就多，净效果是从浓到淡，这叫扩散。
      - card:
          title: 扩散电流
          body: |
            浓度不均匀时，载流子从浓处向淡处的净流动叫**扩散（diffusion）**。单位时间穿过单位面积的粒子数（粒子流）和浓度梯度成正比：$\Phi = -D\,dn/dx$，$D$ 叫**扩散系数（diffusion coefficient）**，单位 $\text{cm}^2/\text{s}$。

            乘上电荷得电流密度。电子带 $-q$，空穴带 $+q$：

            $$J_n = qD_n\frac{dn}{dx},\qquad J_p = -qD_p\frac{dp}{dx}$$

            电子往淡处跑，电流方向和它相反，所以电子扩散电流的符号和梯度相同。
      - item:
          id: diffusion-linear
          type: number
          prompt: 电子浓度在 10 μm 内从 $10^{16}\ \text{cm}^{-3}$ 线性降到 0，$D_n = 35\ \text{cm}^2/\text{s}$，$q = 1.602\times10^{-19}$ C。电子扩散电流密度有多大（取绝对值，A/cm²）？
          answer: 56.1
          tolerance: 0.2
          unit: A/cm²
          hint: 梯度是 $\Delta n/\Delta x$，10 μm $= 10^{-3}$ cm。
          explain: $dn/dx = -10^{16}/10^{-3} = -10^{19}\ \text{cm}^{-4}$，$|J| = 1.602\times10^{-19}\times35\times10^{19} = 56.1$ A/cm²。只靠浓度差就能有很大的电流。
      - item:
          id: diffusion-direction
          type: choice
          prompt: 电子浓度从左往右减小。电子扩散电流的方向是？
          options:
            - text: 向左，和电子运动方向相反
              correct: true
            - text: 向右，和电子运动方向相同
              why: 电子往右扩散，但电子带负电，电流方向和电子运动方向相反
            - text: 没有电流，扩散只是粒子的运动，不算电流
              why: 带电粒子的定向运动就是电流，不管推动它的是电场还是浓度差
          explain: 电子从浓（左）向淡（右）扩散，负电荷向右运动等于电流向左。用公式：$dn/dx < 0$，$J_n = qD_n\,dn/dx < 0$，指向左。
      - card:
          title: 爱因斯坦关系
          body: |
            扩散和漂移都由同样的热运动和散射决定，所以扩散系数和迁移率不是独立的：

            $$\frac{D}{\mu} = \frac{kT}{q}$$

            这叫**爱因斯坦关系（Einstein relation）**。300 K 时 $kT/q = 0.02585$ V，硅里 $D_n = 1350\times0.02585 = 34.9\ \text{cm}^2/\text{s}$。迁移率大的载流子扩散也快。
      - item:
          id: dp-einstein
          type: number
          prompt: 300 K 时硅的空穴迁移率 $480\ \text{cm}^2/(\text{V·s})$，$kT/q = 0.02585$ V。空穴扩散系数是多少 $\text{cm}^2/\text{s}$？
          answer: 12.4
          tolerance: 0.05
          unit: cm²/s
          hint: 爱因斯坦关系把扩散系数和哪两个量连起来？
          explain: $D_p = 480\times0.02585 = 12.4\ \text{cm}^2/\text{s}$。
      - item:
          id: einstein-350
          type: number
          prompt: 某半导体 350 K 时电子迁移率 $1000\ \text{cm}^2/(\text{V·s})$。扩散系数是多少 $\text{cm}^2/\text{s}$？玻尔兹曼常数 $k = 8.617\times10^{-5}$ eV/K。
          answer: 30.16
          tolerance: 0.05
          unit: cm²/s
          hint: 先算 350 K 时的 $kT/q$。
          explain: $kT/q = 8.617\times10^{-5}\times350 = 0.03016$ V，$D = 1000\times0.03016 = 30.2\ \text{cm}^2/\text{s}$。直接套 300 K 的 0.02585 会得到 25.85。
      - card:
          title: 例题：指数分布的扩散电流
          body: n 型硅里注入的空穴按 $p(x) = 10^{14}e^{-x/L}\ \text{cm}^{-3}$ 分布，$L = 10$ μm，$D_p = 12.4\ \text{cm}^2/\text{s}$。求 $x = 0$ 处的空穴扩散电流密度。
          reveal:
            - title: 第 1 步：求梯度
              body: $\dfrac{dp}{dx} = -\dfrac{10^{14}}{L}e^{-x/L}$，$x = 0$ 处为 $-10^{14}/10^{-3} = -10^{17}\ \text{cm}^{-4}$。
            - title: 第 2 步：代入空穴的扩散电流
              body: $J_p = -qD_p\dfrac{dp}{dx} = 1.602\times10^{-19}\times12.4\times10^{17} = 0.199$ A/cm²。
            - title: 第 3 步：判断方向
              body: 结果为正，沿 $+x$：空穴从浓的 $x = 0$ 处向深处扩散，空穴带正电，电流和它同向。
      - item:
          id: diffusion-at-l
          type: number
          prompt: n 型硅里注入的空穴按 $p(x) = 10^{14}e^{-x/L}\ \text{cm}^{-3}$ 分布，$L = 10$ μm，$D_p = 12.4\ \text{cm}^2/\text{s}$，$q = 1.602\times10^{-19}$ C。$x = L$ 处的空穴扩散电流密度是多少 A/cm²？
          answer: 0.0731
          tolerance: 0.0005
          unit: A/cm²
          hint: 指数函数的梯度和函数本身成正比，$x = L$ 处的浓度是 $x = 0$ 处的几倍？
          explain: $x = 0$ 处 $J_p = qD_p\times10^{14}/L = 0.199$ A/cm²，$x = L$ 处梯度乘了 $e^{-1}$，$J_p = 0.199\times0.368 = 0.0731$ A/cm²。扩散电流越往深处越小，因为空穴在路上不断被复合掉。
  - id: drift-diffusion
    chapter: 漂移与扩散
    title: 漂移–扩散模型和内建电场
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一根 n 型硅棒左端掺杂重、右端掺杂轻，不接任何电源，放在室温下。电子从左往右扩散，会一直有电流流下去吗？
          options:
            - text: 会，只要浓度差在，扩散电流就一直流
              why: 那样孤立的硅棒会无中生有地放出能量；电子往右一跑，左边留下带正电的施主离子，产生的电场把电子往回拉
            - text: 不会，很快出现一个电场把电子往回拉，两种电流抵消
              correct: true
            - text: 不会，因为施主离子把电子全部拴住了
              why: 室温下施主几乎全部电离，电子是自由的；挡住净流动的是电场，不是束缚
          explain: 电子稍微往右挪一点，左边正、右边负，形成从左指向右的电场，它推电子往左。热平衡时漂移电流和扩散电流正好抵消，总电流为零。
      - card:
          title: 漂移–扩散模型
          body: |
            把两种运动加起来，电子和空穴的电流密度是

            $$J_n = qn\mu_nE + qD_n\frac{dn}{dx},\qquad J_p = qp\mu_pE - qD_p\frac{dp}{dx}$$

            再配上描述电荷产生电场的泊松方程 $dE/dx = \rho/\varepsilon$，以及描述载流子增减的方程，就是**漂移–扩散模型（drift-diffusion model）**。半导体器件仿真软件解的就是这一组方程。
      - item:
          id: dd-terms
          type: choice
          prompt: n 型硅里电场为零，电子浓度处处相同。电子电流是多少？
          options:
            - text: 零，漂移和扩散都没有
              correct: true
            - text: $qn\mu_nE$，因为电子多
              why: 电场为零时漂移项是零，浓度处处相同时扩散项也是零
            - text: $qD_n n$，扩散一直在进行
              why: 扩散电流和浓度的梯度成正比，不和浓度本身成正比；浓度均匀时梯度为零
          explain: 漂移要电场，扩散要浓度梯度，两个都没有，电流为零。热运动一直在，但各个方向一样多，没有净流动。
      - card:
          title: 热平衡时的内建电场
          body: |
            不接电源时电子电流为零：$qn\mu_nE + qD_n\,dn/dx = 0$，用爱因斯坦关系 $D_n/\mu_n = kT/q$ 解出电场

            $$E = -\frac{kT}{q}\,\frac{1}{n}\frac{dn}{dx}$$

            掺杂不均匀，热平衡时内部就有电场，叫**内建电场（built-in field）**。反过来说，爱因斯坦关系正是从“平衡时电流必须为零”推出来的。
      - card:
          title: 例题：指数掺杂的内建电场
          body: n 型硅里电子浓度 $n(x) = N_0e^{-x/\lambda}$，$\lambda = 1$ μm，300 K。求内建电场。
          reveal:
            - title: 第 1 步：求 (1/n)(dn/dx)
              body: $\dfrac{dn}{dx} = -\dfrac{n}{\lambda}$，所以 $\dfrac{1}{n}\dfrac{dn}{dx} = -\dfrac{1}{\lambda}$，处处相同。
            - title: 第 2 步：代入
              body: $E = \dfrac{kT}{q\lambda} = \dfrac{0.02585\ \text{V}}{10^{-4}\ \text{cm}} = 258.5$ V/cm。
            - title: 第 3 步：看方向
              body: 结果为正，指向 $+x$。电子往 $+x$（淡处）扩散，电场对电子的力 $-qE$ 指向 $-x$，正好把它推回来。双极晶体管由 n、p、n 三层半导体叠成，中间很薄的一层叫基区，它常常这样掺杂，让这个电场帮电子加速穿过基区。
      - item:
          id: dd-drift-balance
          type: number
          prompt: n 型硅里电子浓度 $n(x) = N_0e^{-x/\lambda}$，$\lambda = 1$ μm，内建电场 258.5 V/cm。在 $n = 10^{16}\ \text{cm}^{-3}$ 的地方，电子漂移电流密度有多大（A/cm²）？$\mu_n = 1350\ \text{cm}^2/(\text{V·s})$，$q = 1.602\times10^{-19}$ C。
          answer: 559
          tolerance: 1
          unit: A/cm²
          hint: 漂移电流 $qn\mu_nE$。
          explain: $1.602\times10^{-19}\times10^{16}\times1350\times258.5 = 559$ A/cm²。扩散电流大小相同、方向相反，总电流为零。平衡并不是“什么都不流”，而是两股大电流正好抵消。
      - item:
          id: built-in-voltage
          type: number
          prompt: 一段 n 型硅里电子浓度从 $10^{17}$ 降到 $10^{15}\ \text{cm}^{-3}$，热平衡，300 K（$kT/q = 0.02585$ V）。两端的电势差是多少伏特？
          answer: 0.119
          tolerance: 0.001
          unit: V
          hint: 平衡时 $n \propto e^{qV/kT}$，所以 $V_1 - V_2 = \dfrac{kT}{q}\ln\dfrac{n_1}{n_2}$。
          explain: $0.02585\times\ln 100 = 0.02585\times4.605 = 0.119$ V，浓的一端电势高。不管浓度怎样分布，电势差只由两端的浓度比决定。
      - card:
          title: 平衡时费米能级是平的
          body: |
            用 $n = n_ie^{(E_F - E_i)/kT}$ 代进电子电流，电场写成 $E = \frac{1}{q}\frac{dE_i}{dx}$（能带的倾斜就是电场），两项可以合成一项：

            $$J_n = \mu_nn\frac{dE_F}{dx}$$

            电流为零当且仅当 $E_F$ 处处相同。所以画热平衡下的能带图有一条规则：费米能级是一条水平线，能带随掺杂上下弯曲。有电流流过时，电流正比于准费米能级的斜率。
      - item:
          id: flat-ef
          type: choice
          prompt: 一块掺杂不均匀的硅处于热平衡。能带图上哪条线是水平的？
          options:
            - text: 费米能级 $E_F$
              correct: true
            - text: 导带底 $E_c$
              why: 掺杂不均匀时 $E_c - E_F$ 处处不同，$E_F$ 水平，$E_c$ 就要弯；弯曲正是内建电场
            - text: 本征费米能级 $E_i$
              why: $E_i$ 和 $E_c$ 一起弯；它的倾斜表示电场，平衡时不均匀掺杂处有电场
          explain: $J_n = \mu_nn\,dE_F/dx$，平衡时电流为零，$E_F$ 必须是平的。掺杂重的地方 $E_c$ 离 $E_F$ 近，轻的地方远，于是能带弯曲。
  - id: recombination
    chapter: 产生与复合
    title: 复合和少子寿命
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一块硅被光照着，里面多出很多电子和空穴。关掉光以后，多出来的载流子大约多久消失？
          options:
            - text: 微秒量级，要等电子碰上空穴
              correct: true
            - text: 立刻消失，光一关就没了
              why: 电子要碰上空穴才能消失，这需要时间；硅里过剩载流子一般能存在微秒到毫秒
            - text: 几小时，要慢慢漏走
              why: 电子和空穴在材料内部就会相遇复合，不需要从表面漏出去，所以快得多
          explain: 多出来的电子会和空穴相遇而消失，硅里一般要微秒量级，质量好的硅片能到毫秒。这一课讲它们怎样消失、快慢由什么决定。
      - card:
          title: 产生和复合
          body: |
            价带电子跳到导带、产生一个电子–空穴对，叫产生（generation）；导带电子落回价带、填掉一个空穴，两者一起消失，叫**复合（recombination）**。热平衡时两者速率相等。有过剩载流子时复合多于产生，过剩载流子逐渐减少。

            复合放出约 $E_g$ 的能量，去向有三种，对应三种复合方式。
      - card:
          title: 三种复合方式
          body: |
            - **直接复合（band-to-band recombination）**：导带电子直接落到价带，放出一个光子。在砷化镓这类直接带隙材料里很快，在硅里很慢。
            - **间接复合（SRH recombination）**：通过带隙里杂质或缺陷的能级分两步完成，先抓一个电子、再抓一个空穴，能量交给晶格变成热。这种能级叫**复合中心（recombination center）**，硅里主要是它。
            - **俄歇复合（Auger recombination）**：复合的能量交给第三个载流子，载流子很多（重掺杂、强注入）时才重要。
      - item:
          id: si-led
          type: choice
          prompt: 硅的发光效率很低，一个主要原因是什么？
          options:
            - text: 间接带隙，放光子的复合太慢
              correct: true
            - text: 硅的带隙太大，放不出光子
              why: 硅的带隙 1.12 eV 对应 1107 nm 的近红外光，并不大；问题是放光子的跃迁需要声子帮忙补动量
            - text: 硅里的电子和空穴不会复合
              why: 硅里电子和空穴照样复合，只是主要通过复合中心，以热的形式放出能量
          explain: 间接带隙里直接复合要同时有声子参与，很慢，SRH 复合抢先完成。所以硅适合做晶体管和光电探测器，却很少用来发光。
      - card:
          title: 少子寿命
          body: |
            p 型硅里多出 $\Delta n$ 个电子（少子）。空穴（多子）很多，每个过剩电子在单位时间里被复合掉的概率是一个常数，记作 $1/\tau_n$。于是复合速率 $U = \Delta n/\tau_n$，关掉光以后

            $$\frac{d\Delta n}{dt} = -\frac{\Delta n}{\tau_n}\ \Rightarrow\ \Delta n(t) = \Delta n(0)e^{-t/\tau_n}$$

            $\tau_n$ 叫**少子寿命（minority carrier lifetime）**：过剩少子平均存在多久。每过一个 $\tau$，剩下原来的 $1/e$。
      - item:
          id: decay-3tau
          type: number
          prompt: p 型硅的少子寿命 1 μs。关掉光 3 μs 后，过剩电子还剩原来的多少？（写成小数，保留三位有效数字）
          answer: 0.0498
          tolerance: 0.0002
          hint: $e^{-t/\tau}$，$t/\tau$ 是多少？
          explain: $e^{-3} = 0.0498$，约 5%。
      - item:
          id: decay-1percent
          type: number
          prompt: 少子寿命 1 μs。关掉光后过多少微秒过剩少子降到原来的 1%？
          answer: 4.61
          tolerance: 0.01
          unit: μs
          hint: 解 $e^{-t/\tau} = 0.01$。
          explain: $t = \tau\ln 100 = 4.61$ μs。降到 1% 要 4.6 个寿命，不是 100 个。
      - card:
          title: 复合中心和寿命
          body: |
            SRH 复合的寿命由这类缺陷能级的浓度 $N_t$、它抓载流子的本领（俘获截面 $\sigma$，像一个小靶子的面积）和载流子的热运动速度 $v_{th}$（约 $10^7$ cm/s）决定：

            $$\tau = \frac{1}{\sigma v_{th}N_t}$$

            能级在带隙正中附近的最有效：靠近导带的能级抓了电子以后容易又把它放回导带，靠近价带的能级也容易把抓到的空穴放回价带，只有在中间的能级抓住一个以后还能等到另一种载流子。快恢复二极管故意掺金或用电子辐照引入这类能级，缩短寿命。
      - item:
          id: srh-tau
          type: number
          prompt: 硅里复合中心浓度 $10^{14}\ \text{cm}^{-3}$，俘获截面 $10^{-15}\ \text{cm}^2$，热运动速度 $10^7$ cm/s。少子寿命是多少微秒？
          answer: 1
          tolerance: 0.001
          unit: μs
          hint: $\tau = 1/(\sigma v_{th}N_t)$，三个数乘起来是多少？
          explain: $\sigma v_{th}N_t = 10^{-15}\times10^7\times10^{14} = 10^6\ \text{s}^{-1}$，$\tau = 1$ μs。复合中心多 10 倍，寿命就短 10 倍。
      - item:
          id: midgap-traps
          type: choice
          prompt: 为什么带隙中间附近的复合中心最有效？
          options:
            - text: 抓住的载流子不容易被热运动送回能带
              correct: true
            - text: 中间的能级离导带最近，最容易抓电子
              why: 离导带最近的是靠近 $E_c$ 的能级；它抓电子容易，可抓住后也容易被热运动放回导带，复合不完成
            - text: 中间的能级放出的光子能量最大
              why: SRH 复合主要把能量交给晶格，不放光子
          explain: 复合要先后抓住一个电子和一个空穴。能级靠近哪个能带，抓到的载流子就容易被热激发送回那个能带，等不到另一种。中间的能级两边都远，抓住了就留得住。
      - card:
          title: SRH 复合率的一般式
          body: |
            缺陷能级在带隙正中、电子和空穴的寿命分别为 $\tau_n$、$\tau_p$ 时，SRH 的净复合率（复合减去产生）是

            $$U = \frac{np - n_i^2}{\tau_p(n + n_i) + \tau_n(p + n_i)}$$

            分子决定了 $U$ 的正负：热平衡 $np = n_i^2$ 时 $U = 0$；有过剩载流子、$np > n_i^2$ 时 $U > 0$，复合多于产生；载流子被抽走、$np < n_i^2$ 时 $U < 0$，产生多于复合。p 型小注入时分母约为 $\tau_np$，分子约为 $p\,\Delta n$，$U \approx \Delta n/\tau_n$，回到少子寿命那个式子。
      - item:
          id: srh-rate
          type: number
          prompt: p 型硅 $p_0 = 10^{16}\ \text{cm}^{-3}$，$n_i = 10^{10}$，光照产生 $\Delta n = \Delta p = 10^{12}\ \text{cm}^{-3}$，$\tau_n = \tau_p = 1$ μs，复合中心在带隙正中。用 SRH 一般式算净复合率，写成 $N\times10^{18}\ \text{cm}^{-3}\text{s}^{-1}$，$N$ 是多少？
          answer: 1
          tolerance: 0.005
          hint: 先写出 $n$、$p$，分子和分母里哪些项可以略去？
          explain: $n = 10^{12} + 10^4$，$p = 10^{16} + 10^{12}$。分子 $np - n_i^2 \approx 1.0001\times10^{28}$，分母 $\approx 10^{-6}\times1.0002\times10^{16}$，$U = 1.00\times10^{18}\ \text{cm}^{-3}\text{s}^{-1}$，和 $\Delta n/\tau_n = 10^{12}/10^{-6}$ 一样。小注入时一般式退回简单式。
      - item:
          id: depletion-generation
          type: choice
          prompt: 反偏二极管里有一层区域，载流子被那里的强电场扫走，$n$ 和 $p$ 都远小于 $n_i$。按 SRH 一般式，那里的净复合率 $U$ 怎样？
          options:
            - text: 是负的，那里在净产生电子–空穴对
              correct: true
            - text: 是零，没有载流子就没有复合
              why: 分子 $np - n_i^2 \approx -n_i^2$ 不为零；复合几乎停了，产生却照常进行
            - text: 是正的，电场强的地方复合快
              why: 分子是负的，$U < 0$；SRH 复合率由浓度决定，和电场强弱无关
          explain: $n, p \ll n_i$ 时 $U \approx -n_i^2/(\tau_pn_i + \tau_nn_i) = -n_i/(2\tau)$（$\tau_n = \tau_p = \tau$），1 μs 时约 $-5\times10^{15}\ \text{cm}^{-3}\text{s}^{-1}$。这些新产生的电子和空穴被电场扫走，形成实际二极管反向电流里随电压略有增加的那一部分。
  - id: continuity
    chapter: 产生与复合
    title: 连续性方程和扩散长度
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一根很长的 p 型硅棒，只在左端一直照光，光只在表面被吸收。光产生的电子一边往里扩散、一边复合。稳定后电子浓度沿棒怎样分布？
          options:
            - text: 离左端越远越少，按指数衰减
              correct: true
            - text: 整根棒里一样多，扩散会把它抹平
              why: 电子在扩散的路上不断被复合掉，走得越远剩下的越少，不会均匀
            - text: 线性减少，到某处正好降到零
              why: 每段距离上复合掉的比例相同，减少量和剩下的量成正比，这是指数衰减，不是直线
          explain: 每往里走一段，剩下的电子都要被复合掉同样的比例，浓度按指数下降。下降到 $1/e$ 所走的距离由扩散系数和寿命决定，这一课把它算出来。
      - card:
          title: 连续性方程
          body: |
            取一薄层 $x$ 到 $x + dx$，数里面的电子：从左边流进来的减去从右边流出去的，加上产生的，减去复合的，就是电子数的增加。电子电流 $J_n$ 对应的粒子流是 $-J_n/q$，整理得

            $$\frac{\partial n}{\partial t} = \frac{1}{q}\frac{\partial J_n}{\partial x} + G_n - R_n$$

            这叫**连续性方程（continuity equation）**，空穴的式子把 $\frac1q$ 换成 $-\frac1q$。它只是把粒子“不会凭空出现或消失”写成了方程，配上漂移–扩散的电流式就能求浓度分布。
      - item:
          id: continuity-sign
          type: choice
          prompt: 某处电子的粒子流（每秒穿过单位面积的电子数）从左往右越来越小，没有产生和复合。这一处的电子浓度怎样变化？
          options:
            - text: 增加，流进来的比流出去的多
              correct: true
            - text: 减少，粒子流越来越小说明电子在流失
              why: 左边流进来的多、右边流出去的少，差额留在这一层里，浓度增加
            - text: 不变，粒子流的大小和浓度变化无关
              why: 连续性方程说的正是：粒子流在空间上的变化等于浓度随时间的变化
          explain: 进来的多于出去的，电子在这里积累。写成方程就是 $\partial n/\partial t = -\partial\Phi/\partial x$（$\Phi$ 是粒子流），$\Phi$ 沿 $x$ 减小时右边为正。
      - card:
          title: 例题：光照一端的稳定分布
          body: p 型硅，没有电场，左端表面一直照光，过剩电子 $\Delta n(0)$ 保持不变。求稳定后（不再随时间变化）的 $\Delta n(x)$。
          reveal:
            - title: 第 1 步：写出电流和复合
              body: 没有电场，只有扩散：$J_n = qD_n\,d\Delta n/dx$。光只在表面，体内 $G = 0$，复合 $R = \Delta n/\tau_n$。
            - title: 第 2 步：代入连续性方程
              body: 稳定后 $\partial n/\partial t = 0$：$D_n\dfrac{d^2\Delta n}{dx^2} - \dfrac{\Delta n}{\tau_n} = 0$。
            - title: 第 3 步：解方程
              body: 猜 $e^{sx}$，得 $s^2 = 1/(D_n\tau_n)$，$s = \pm1/L_n$，$L_n = \sqrt{D_n\tau_n}$。棒很长，往里浓度不能无限增长，舍去正根：$\Delta n(x) = \Delta n(0)e^{-x/L_n}$。
      - card:
          title: 扩散长度
          body: |
            $L = \sqrt{D\tau}$ 叫**扩散长度（diffusion length）**：过剩少子在被复合之前平均能扩散多远。硅里一般是几十微米到几百微米。

            它决定了很多器件的尺寸：太阳能电池里光产生的载流子要在一个扩散长度内走到结区才能被收集；双极晶体管的基区要比扩散长度薄得多，电子才能穿过去而不被复合。
      - item:
          id: hole-diff-length
          type: number
          prompt: n 型硅里空穴的扩散系数 $12.4\ \text{cm}^2/\text{s}$，少子寿命 10 μs。扩散长度是多少微米？
          answer: 111.4
          tolerance: 0.5
          unit: μm
          hint: $L = \sqrt{D\tau}$，注意单位：得到的是厘米。
          explain: $L = \sqrt{12.4\times10^{-5}} = 1.114\times10^{-2}$ cm $= 111$ μm。
      - item:
          id: at-2l
          type: number
          prompt: 光照稳定后过剩少子按 $\Delta n(0)e^{-x/L}$ 分布。在 $x = 2L$ 处剩下表面处的多少？（保留三位小数）
          answer: 0.135
          tolerance: 0.001
          hint: $x = 2L$ 时指数上是多少？
          explain: $e^{-2} = 0.135$。走过两个扩散长度只剩 13.5%，五个扩散长度以外基本为零。
      - item:
          id: tau-from-l
          type: number
          prompt: 测得 p 型硅里电子的扩散长度 100 μm，扩散系数 $30\ \text{cm}^2/\text{s}$。少子寿命是多少微秒？
          answer: 3.33
          tolerance: 0.01
          unit: μs
          hint: 由 $L = \sqrt{D\tau}$ 解出 $\tau$；100 μm $= 10^{-2}$ cm。
          explain: $\tau = L^2/D = 10^{-4}/30 = 3.33\times10^{-6}$ s。测扩散长度是测少子寿命的一种办法。
      - item:
          id: short-region
          type: choice
          prompt: 一个 p 型区只有 5 μm 宽，远小于电子的扩散长度（100 μm），左边注入电子、右边是一个把电子全部抽走的接触。区内过剩电子的分布接近什么形状？
          options:
            - text: 接近一条直线
              correct: true
            - text: 和长棒一样按 $e^{-x/L}$ 衰减
              why: 指数衰减要走几个扩散长度才看得出；5 μm 内 $e^{-x/L}$ 只降了 5%，主要是右端接触把浓度压到零
            - text: 处处相同
              why: 右端接触把过剩电子压到零，左端有注入，两端浓度不同，中间必然有梯度
          explain: 区域比扩散长度短得多时，复合几乎来不及发生，$d^2\Delta n/dx^2 \approx 0$，分布是连接两端的直线。双极晶体管的薄基区和短二极管都是这种情形。
  - id: pn-structure
    chapter: PN结物理
    title: PN 结和内建电势
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 把一块 p 型硅和一块 n 型硅紧紧接成一体。接触处会发生什么？
          options:
            - text: 电子和空穴互相扩散过去，留下的离子形成电场挡住它们
              correct: true
            - text: 什么也不发生，因为两块各自都是电中性的
              why: 两边各自电中性，但 n 区电子多、p 区空穴多，浓度差会推动扩散
            - text: 电子和空穴不停地流过去复合，直到两边都变成本征硅
              why: 扩散一开始，接触处就留下不能动的施主正离子和受主负离子，它们的电场很快挡住了继续扩散
          explain: 浓度差让载流子扩散过去，扩散走的载流子留下不能动的电离杂质，n 侧带正电、p 侧带负电，电场从 n 指向 p，把载流子推回去。两者平衡时，接触处形成一个几乎没有载流子的区域。
      - card:
          title: PN 结
          body: |
            同一块晶体里一边是 p 型、一边是 n 型，交界处叫 **PN 结（p-n junction）**，在 p 区和 n 区各接一个金属电极就是**二极管（diode）**。芯片里的 PN 结不是把两块粘起来，而是在一块晶体里掺出来的，晶格连续。

            交界附近，电子扩散进 p 区和那里的空穴复合，空穴扩散进 n 区和电子复合，留下一层几乎没有自由载流子、只剩电离杂质的区域，叫**耗尽区（depletion region）**，也叫空间电荷区。n 侧是施主正离子，p 侧是受主负离子，它们的电场从 n 指向 p。
      - item:
          id: field-direction
          type: choice
          prompt: 热平衡的 PN 结里，耗尽区的电场指向哪边？
          options:
            - text: 从 n 区指向 p 区
              correct: true
            - text: 从 p 区指向 n 区，因为 p 区带正电的空穴多
              why: 耗尽区里空穴已经离开，p 侧剩下的是带负电的受主离子；电场从正的 n 侧指向负的 p 侧
            - text: 没有电场，两边加起来是电中性的
              why: 整体电中性，但正负电荷分在两侧，像一个电容器，中间有电场
          explain: n 侧留下施主正离子，p 侧留下受主负离子，电场从正指向负，即从 n 指向 p。这个电场把电子推回 n 区、空穴推回 p 区，阻止继续扩散。
      - card:
          title: 能带图和内建电势
          body: |
            接触前，n 型的费米能级靠近导带，p 型的靠近价带。热平衡时费米能级必须处处相同，于是两边的能带上下错开，在耗尽区里弯曲：p 侧的能带比 n 侧高。

            能带错开的量除以 $q$ 叫**内建电势（built-in potential）**，就是接触前两边费米能级的差：

            $$qV_{bi} = (E_F - E_i)_n + (E_i - E_F)_p = kT\ln\frac{N_d}{n_i} + kT\ln\frac{N_a}{n_i}$$

            即 $V_{bi} = \dfrac{kT}{q}\ln\dfrac{N_aN_d}{n_i^2}$。
      - card:
          title: 例题：算内建电势
          body: 硅 PN 结 $N_a = 5\times10^{17}$、$N_d = 2\times10^{16}\ \text{cm}^{-3}$，300 K，$n_i = 10^{10}$，$kT/q = 0.02585$ V。求 $V_{bi}$。
          reveal:
            - title: 第 1 步：n 侧费米能级在 E_i 上方多远
              body: $\dfrac{kT}{q}\ln\dfrac{N_d}{n_i} = 0.02585\times\ln(2\times10^6) = 0.375$ V。
            - title: 第 2 步：p 侧费米能级在 E_i 下方多远
              body: $\dfrac{kT}{q}\ln\dfrac{N_a}{n_i} = 0.02585\times\ln(5\times10^7) = 0.458$ V。
            - title: 第 3 步：相加
              body: $V_{bi} = 0.375 + 0.458 = 0.833$ V，和 $0.02585\times\ln(10^{34}/10^{20})$ 一样。
      - item:
          id: vbi-1e17-1e15
          type: number
          prompt: 硅 PN 结 $N_a = 10^{17}$、$N_d = 10^{15}\ \text{cm}^{-3}$，300 K，$n_i = 10^{10}\ \text{cm}^{-3}$，$kT/q = 0.02585$ V。内建电势是多少伏特？
          answer: 0.714
          tolerance: 0.001
          unit: V
          hint: $N_aN_d/n_i^2$ 是 10 的几次方？
          explain: $N_aN_d/n_i^2 = 10^{32}/10^{20} = 10^{12}$，$V_{bi} = 0.02585\times27.63 = 0.714$ V。掺杂每重 10 倍，$V_{bi}$ 只增加 $0.02585\times\ln10 = 0.06$ V。
      - item:
          id: vbi-ge
          type: number
          prompt: 锗 PN 结 $N_a = 10^{17}$、$N_d = 10^{15}\ \text{cm}^{-3}$，300 K，锗的 $n_i = 2\times10^{13}\ \text{cm}^{-3}$，$kT/q = 0.02585$ V。内建电势是多少伏特？
          answer: 0.321
          tolerance: 0.001
          unit: V
          hint: $n_i^2 = 4\times10^{26}$。
          explain: $V_{bi} = 0.02585\times\ln(10^{32}/4\times10^{26}) = 0.02585\times12.43 = 0.321$ V。同样的掺杂，锗的带隙小、$n_i$ 大，内建电势比硅（0.714 V）小得多，这也是锗二极管导通电压低的原因。
      - item:
          id: voltmeter-vbi
          type: choice
          prompt: 用电压表直接接在一个不通电的硅二极管两端，能读出约 0.7 V 的内建电势吗？
          options:
            - text: 能，内建电势就是两端的电压
              why: 电表的金属表笔和半导体接触时也有接触电势，一圈加起来正好抵消内建电势
            - text: 能读出来，但要很灵敏的电压表
              why: 不是灵敏度的问题；热平衡下回路里没有能量来源，任何电压表都读出 0
            - text: 不能，读数是 0
              correct: true
          explain: 热平衡时整个回路的费米能级都是平的，电压表测的正是费米能级的差，所以读数为零。如果读得出，接上负载就能从一块静置的二极管里源源不断地取出能量，这违反热力学第二定律。
  - id: depletion
    chapter: PN结物理
    title: 耗尽区的宽度和结电容
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个 PN 结的 p 区掺杂重（$10^{17}$），n 区掺杂轻（$10^{15}$）。耗尽区主要伸进哪一边？
          options:
            - text: 掺杂轻的 n 区
              correct: true
            - text: 掺杂重的 p 区，因为那边载流子多
              why: 两侧的电荷要相等；p 区每立方厘米的受主多，只需很薄一层就够，n 区施主少，要很厚一层才能凑出同样多的电荷
            - text: 两边一样宽
              why: 只有两边掺杂相同时才对称；电荷相等要求宽度和掺杂成反比
          explain: 耗尽区两侧的正负电荷总量相等：$N_ax_p = N_dx_n$。n 区掺杂只有 p 区的百分之一，就要伸进去一百倍的宽度。
      - card:
          title: 耗尽近似
          body: |
            掺杂在交界处突然从 p 型变成 n 型的结叫突变结，下面都按它算。**耗尽近似（depletion approximation）**假设：在 $-x_p < x < x_n$ 这一段里载流子完全没有，电荷只有电离杂质，p 侧 $-qN_a$、n 侧 $+qN_d$；这一段以外完全电中性。两侧的电荷必须相等：

            $$N_ax_p = N_dx_n$$

            耗尽区总宽 $W = x_p + x_n$。所以单边重掺杂的结（$N_a \gg N_d$）几乎全部耗尽区都在轻掺杂的一边。
      - item:
          id: xn-share
          type: number
          prompt: PN 结 $N_a = 10^{17}$、$N_d = 10^{16}\ \text{cm}^{-3}$，耗尽区总宽 0.332 μm。伸进 n 区的部分 $x_n$ 是多少微米？
          answer: 0.302
          tolerance: 0.001
          unit: μm
          hint: 由 $N_ax_p = N_dx_n$ 可知 $x_n/W = N_a/(N_a + N_d)$。
          explain: $x_n = 0.332\times\dfrac{10^{17}}{1.1\times10^{17}} = 0.302$ μm，$x_p = 0.030$ μm。九成以上在轻掺杂的 n 侧。
      - card:
          title: 电场和电势
          body: |
            耗尽区里由泊松方程 $dE/dx = \rho/\varepsilon$：p 侧电荷密度恒为负，电场沿一段直线变化；n 侧恒为正，电场再沿直线变回零。电场图是一个三角形，最大值在交界处：

            $$E_{max} = \frac{qN_dx_n}{\varepsilon} = \frac{qN_ax_p}{\varepsilon}$$

            电势差是电场三角形的面积：$V_{bi} - V = \tfrac12E_{max}W$，$V$ 是外加电压（正向为正）。联立电荷相等，解出

            $$W = \sqrt{\frac{2\varepsilon(V_{bi} - V)}{q}\left(\frac{1}{N_a} + \frac{1}{N_d}\right)}$$
      - card:
          title: 例题：耗尽区宽度
          body: 硅 PN 结 $N_a = 10^{17}$、$N_d = 10^{15}\ \text{cm}^{-3}$，$V_{bi} = 0.714$ V，零偏。$\varepsilon = 11.7\varepsilon_0 = 1.036\times10^{-12}$ F/cm，$q = 1.602\times10^{-19}$ C。求 $W$、$x_n$ 和 $E_{max}$。
          reveal:
            - title: 第 1 步：算括号里的倒数和
              body: $\dfrac{1}{N_a} + \dfrac{1}{N_d} = 10^{-17} + 10^{-15} = 1.01\times10^{-15}\ \text{cm}^3$，几乎全由轻掺杂的一边决定。
            - title: 第 2 步：代入求 W
              body: $W = \sqrt{\dfrac{2\times1.036\times10^{-12}\times0.714}{1.602\times10^{-19}}\times1.01\times10^{-15}} = 9.66\times10^{-5}$ cm $= 0.966$ μm。
            - title: 第 3 步：分配和最大电场
              body: $x_n = W\dfrac{N_a}{N_a + N_d} = 0.956$ μm。$E_{max} = 2V_{bi}/W = 2\times0.714/9.66\times10^{-5} = 1.48\times10^4$ V/cm。
      - item:
          id: width-reverse
          type: number
          prompt: 硅 PN 结 $N_a = 10^{17}$、$N_d = 10^{16}\ \text{cm}^{-3}$，$V_{bi} = 0.774$ V，加 5 V 反向电压（$V = -5$ V）。耗尽区总宽是多少微米？$\varepsilon = 1.036\times10^{-12}$ F/cm，$q = 1.602\times10^{-19}$ C。
          answer: 0.906
          tolerance: 0.003
          unit: μm
          hint: $V_{bi} - V = 0.774 + 5$；$1/N_a + 1/N_d = 1.1\times10^{-16}$。
          explain: $W = \sqrt{2\times1.036\times10^{-12}\times5.774\times1.1\times10^{-16}/1.602\times10^{-19}} = 9.06\times10^{-5}$ cm $= 0.906$ μm。零偏时是 0.332 μm，加反偏后变成约 2.7 倍。
      - card:
          title: 结电容
          body: |
            耗尽区两侧是正负电荷，中间没有载流子，像一个平行板电容器，板间距就是 $W$。单位面积的**结电容（junction capacitance）**是

            $$C_j = \frac{\varepsilon}{W}$$

            反向电压越大，$W$ 越宽，$C_j$ 越小。变容二极管（电容随电压变化的二极管）利用这一点，用电压调谐收音机和压控振荡器的频率。
      - item:
          id: cj-value
          type: number
          prompt: 硅 PN 结零偏时耗尽区宽 0.966 μm，$\varepsilon = 1.036\times10^{-12}$ F/cm。单位面积结电容是多少？写成 $N\ \text{nF/cm}^2$，$N$ 是多少？
          answer: 10.7
          tolerance: 0.05
          unit: nF/cm²
          hint: $C_j = \varepsilon/W$，W 换成厘米。
          explain: $C_j = 1.036\times10^{-12}/9.66\times10^{-5} = 1.07\times10^{-8}\ \text{F/cm}^2 = 10.7\ \text{nF/cm}^2$。一个 $100\times100$ μm² 的结约 1 pF。
      - item:
          id: cj-ratio
          type: number
          prompt: 一个 PN 结的 $V_{bi} - V$ 从 1 V 变成 4 V（加了反偏）。结电容变成原来的多少倍（写成小数）？
          answer: 0.5
          hint: $W \propto \sqrt{V_{bi} - V}$，$C_j \propto 1/W$。
          explain: $W$ 变成 $\sqrt4 = 2$ 倍，$C_j$ 变成 $1/2$。测 $1/C_j^2$ 随电压的变化是一条直线，从斜率能求出轻掺杂一侧的掺杂浓度，这叫 C-V 测量。
      - item:
          id: forward-width
          type: choice
          prompt: 给 PN 结加正向电压 0.5 V（$V_{bi} = 0.7$ V），耗尽区怎样变？
          options:
            - text: 变窄
              correct: true
            - text: 变宽，因为加了电压
              why: 正向电压抵消一部分内建电势，$V_{bi} - V$ 变小，$W$ 变窄；反向电压才让它变宽
            - text: 不变，耗尽区宽度只由掺杂决定
              why: $W \propto \sqrt{V_{bi} - V}$，外加电压直接改变它
          explain: $V_{bi} - V$ 从 0.7 降到 0.2，$W$ 变成原来的 $\sqrt{0.2/0.7} = 0.53$ 倍。势垒降低、耗尽区变窄，载流子就容易越过去，这是正向导通的开始。
  - id: diode-current
    chapter: PN结物理
    title: 二极管的电流
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个硅二极管正向电压从 0.6 V 加到 0.7 V，只加了 0.1 V。电流大约变成原来的几倍？
          options:
            - text: 约 1.17 倍，和电压同比例增加
              why: 二极管不是电阻，电流随电压按指数增长，不是成正比
            - text: 约 2 倍
              why: 指数增长比这快得多：每增加约 0.06 V 电流就翻十倍
            - text: 约 50 倍
              correct: true
          explain: 室温下电流按 $e^{V/0.02585}$ 增长，0.1 V 对应 $e^{3.87} \approx 48$ 倍。这一课讲这个指数是怎么来的。
      - card:
          title: 正偏时的少子注入
          body: |
            加正向电压 $V$（p 接正），势垒从 $qV_{bi}$ 降到 $q(V_{bi} - V)$。能越过势垒的载流子数按玻尔兹曼因子增加 $e^{V/V_T}$ 倍，$V_T = kT/q$ 叫**热电压（thermal voltage）**，300 K 时 0.02585 V（有的教材取约 25 mV）。

            结果是耗尽区边上的少子浓度从平衡值 $n_{p0} = n_i^2/N_a$ 升到

            $$n_p(-x_p) = n_{p0}e^{V/V_T}$$

            n 侧边上的空穴同样是 $p_{n0}e^{V/V_T}$。多子越过势垒进入另一边成为少子，叫**少子注入（minority carrier injection）**。
      - item:
          id: injected-np
          type: number
          prompt: 硅 PN 结 p 区 $N_a = 10^{17}\ \text{cm}^{-3}$，$n_i = 10^{10}$，加正向 0.6 V，$V_T = 0.02585$ V。p 侧耗尽区边上的电子浓度是多少？写成 $N\times10^{13}\ \text{cm}^{-3}$，$N$ 是多少？
          answer: 1.2
          tolerance: 0.01
          hint: 先求平衡时的少子 $n_{p0}$，再乘 $e^{V/V_T}$。
          explain: $n_{p0} = 10^{20}/10^{17} = 10^3$，$e^{0.6/0.02585} = e^{23.21} = 1.20\times10^{10}$，$n_p = 1.20\times10^{13}\ \text{cm}^{-3}$。仍远小于多子 $10^{17}$，是小注入。
      - card:
          title: 理想二极管方程
          body: |
            注入的少子在耗尽区以外仍电中性的区域（中性区）里一边扩散一边复合。中性区比扩散长度长得多时（叫长二极管），少子按 $e^{-x/L}$ 衰减。结边上的扩散电流就是二极管电流，两种载流子加起来：

            $$J = J_s\left(e^{V/V_T} - 1\right),\qquad J_s = q\left(\frac{D_pp_{n0}}{L_p} + \frac{D_nn_{p0}}{L_n}\right)$$

            这叫**理想二极管方程（ideal diode equation）**。$J_s$ 叫**反向饱和电流（reverse saturation current）**：反偏时 $e^{V/V_T} \to 0$，电流趋于 $-J_s$，不再随反向电压增大。
      - card:
          title: 例题：算饱和电流和正向电流
          body: 硅 PN 结：p 区 $N_a = 10^{17}$，电子 $D_n = 25\ \text{cm}^2/\text{s}$、$L_n = 50$ μm；n 区 $N_d = 10^{16}$，空穴 $D_p = 10\ \text{cm}^2/\text{s}$、$L_p = 30$ μm；$n_i = 10^{10}$。求 $J_s$ 和 0.6 V 时的电流密度。
          reveal:
            - title: 第 1 步：两边的少子浓度
              body: $n_{p0} = 10^{20}/10^{17} = 10^3$，$p_{n0} = 10^{20}/10^{16} = 10^4\ \text{cm}^{-3}$。
            - title: 第 2 步：两项分别算
              body: 空穴项 $D_pp_{n0}/L_p = 10\times10^4/(3\times10^{-3}) = 3.33\times10^7$；电子项 $25\times10^3/(5\times10^{-3}) = 5\times10^6$。空穴项大近 7 倍：轻掺杂一侧的少子多，它注入的电流占主导。
            - title: 第 3 步：乘 q，再乘指数
              body: $J_s = 1.602\times10^{-19}\times3.83\times10^7 = 6.14\times10^{-12}$ A/cm²。0.6 V 时 $J = 6.14\times10^{-12}\times1.20\times10^{10} = 0.074$ A/cm²。
      - item:
          id: ratio-01v
          type: number
          prompt: 300 K（$V_T = 0.02585$ V）时，理想二极管正向电压从 0.6 V 增加到 0.7 V，电流变成原来的多少倍？（$e^{V/V_T} \gg 1$）
          answer: 47.9
          tolerance: 0.1
          hint: 两个电流之比是 $e^{0.1/V_T}$。
          explain: $e^{0.1/0.02585} = e^{3.868} = 47.9$。所以二极管导通后电压几乎不变，可以当作约 0.6–0.7 V 的固定压降。
      - item:
          id: mv-per-decade
          type: number
          prompt: 300 K（$V_T = 0.02585$ V）时，理想二极管的正向电流每增加 10 倍，电压要增加多少毫伏？
          answer: 59.5
          tolerance: 0.1
          unit: mV
          hint: 解 $e^{\Delta V/V_T} = 10$。
          explain: $\Delta V = V_T\ln 10 = 0.02585\times2.303 = 0.0595$ V $= 59.5$ mV。电流跨好几个数量级，电压只变零点几伏。实际二极管的指数常写成 $e^{V/(nV_T)}$，理想因子 $n$ 在 1 到 2 之间，每十倍要 60–120 mV。
      - item:
          id: v-at-1ma
          type: number
          prompt: 一个二极管 $I_s = 10^{-14}$ A。300 K（$V_T = 0.02585$ V）时正向电流 1 mA，两端电压是多少伏特？
          answer: 0.655
          tolerance: 0.001
          unit: V
          hint: 由 $I = I_s(e^{V/V_T} - 1)$ 解出 $V = V_T\ln(I/I_s + 1)$。
          explain: $I/I_s = 10^{11}$，$V = 0.02585\times\ln(10^{11}) = 0.02585\times25.33 = 0.655$ V。
      - item:
          id: reverse-current
          type: choice
          prompt: 理想二极管上的反向电压从 1 V 加到 10 V（还没到击穿），反向电流怎样变？
          options:
            - text: 几乎不变，约等于 $-I_s$
              correct: true
            - text: 增加到 10 倍，和电压成正比
              why: 反向电流来自少子从两边扩散到结边被扫过去，少子的数目很少且不随电压变，所以电流饱和
            - text: 按指数增加
              why: 指数增长是正偏的情形；反偏时 $e^{V/V_T}$ 已经几乎为零，电流停在 $-I_s$
          explain: 反偏时势垒变高，多子过不去；只有两边本来就很少的少子漂到结边被电场扫过去，形成 $I_s$。少子供应有限，所以叫饱和电流。实际二极管还有耗尽区里的产生电流，会随电压略有增加。
  - id: breakdown
    chapter: PN结物理
    title: 反向击穿
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个二极管的反向电压不断加大。反向电流会怎样？
          options:
            - text: 一直很小，二极管反向永远不导电
              why: 电场强到一定程度，载流子会成倍增加或直接穿过势垒，电流突然增大
            - text: 到某个电压突然急剧增大
              correct: true
            - text: 随电压慢慢地线性增大
              why: 击穿前反向电流几乎饱和不变，到击穿电压附近才急剧上升，转折很陡
          explain: 到某个电压，反向电流突然急剧增大，这叫击穿。只要电流被外电路限制住、不过热，击穿本身不会损坏二极管，有一种二极管就是专门工作在击穿区的。
      - card:
          title: 雪崩击穿
          body: |
            反偏时耗尽区里电场很强。偶尔穿过耗尽区的电子被电场加速，在下一次碰撞前获得超过带隙的能量，撞上晶格时能把一个价带电子打到导带，产生一个新的电子–空穴对，这叫**碰撞电离（impact ionization）**。新产生的载流子又被加速、再去碰撞，数目像雪崩一样倍增，叫**雪崩击穿（avalanche breakdown）**。

            硅里电场达到约 $3\times10^5$ V/cm（这个临界电场随掺杂略有变化）时开始雪崩。
      - card:
          title: 击穿电压和掺杂
          body: |
            对单边重掺杂的结，最大电场 $E_{max} = qNx/\varepsilon$（$N$ 是轻掺杂一侧的浓度），而 $V = \tfrac12E_{max}W$。令 $E_{max}$ 等于临界电场 $E_{crit}$，得到击穿电压

            $$V_{BR} \approx \frac{\varepsilon E_{crit}^2}{2qN}$$

            轻掺杂一侧越淡，耗尽区越宽，同样的电压下电场越弱，击穿电压越高。功率二极管为了耐高压，就把一侧做得很淡、很厚。
      - item:
          id: vbr-1e15
          type: number
          prompt: 单边突变结，轻掺杂一侧 $N = 10^{15}\ \text{cm}^{-3}$，取临界电场 $3\times10^5$ V/cm，$\varepsilon = 1.036\times10^{-12}$ F/cm，$q = 1.602\times10^{-19}$ C。估算雪崩击穿电压是多少伏特？
          answer: 291
          tolerance: 1
          unit: V
          hint: 代入 $V_{BR} = \varepsilon E_{crit}^2/(2qN)$。
          explain: $V_{BR} = 1.036\times10^{-12}\times9\times10^{10}/(2\times1.602\times10^{-19}\times10^{15}) = 291$ V。常用的经验公式 $V_B \approx 60\,(N/10^{16}\ \text{cm}^{-3})^{-3/4}$ V 给出约 340 V，同一量级。
      - item:
          id: vbr-1e16
          type: number
          prompt: 同样用 $V_{BR} = \varepsilon E_{crit}^2/(2qN)$、临界电场 $3\times10^5$ V/cm，轻掺杂一侧 $N = 10^{16}\ \text{cm}^{-3}$ 时击穿电压估算是多少伏特？$\varepsilon = 1.036\times10^{-12}$ F/cm。
          answer: 29.1
          tolerance: 0.1
          unit: V
          hint: 和 $N$ 是什么关系？
          explain: $V_{BR} \propto 1/N$，掺杂浓 10 倍，击穿电压降到 29.1 V。实际的临界电场在较浓的掺杂下略高，经验公式 $V_B \approx 60\,(N/10^{16}\ \text{cm}^{-3})^{-3/4}$ V 在这里给出 60 V，比这个估算大，但“越浓越早击穿”的趋势不变。
      - card:
          title: 齐纳击穿
          body: |
            两侧都重掺杂时，耗尽区只有十几纳米宽，电场超过约 $10^6$ V/cm。这时 p 侧价带的电子和 n 侧导带的空状态在能量上对齐、相隔又很近，电子直接隧穿过带隙，叫**齐纳击穿（Zener breakdown）**。一般击穿电压低于约 5 V 的是齐纳击穿，高于约 7 V 的是雪崩击穿，中间两种都有。

            两者的温度特性相反：温度升高，带隙变小，隧穿更容易，齐纳击穿电压下降；而晶格振动加剧，载流子更难攒够能量，雪崩击穿电压上升。
      - item:
          id: tunnel-width
          type: number
          prompt: 硅 PN 结两侧都掺到 $10^{19}\ \text{cm}^{-3}$，$V_{bi} \approx 1.07$ V，再加 2 V 反偏。用耗尽区宽度公式估算 $W$ 是多少纳米？$\varepsilon = 1.036\times10^{-12}$ F/cm，$q = 1.602\times10^{-19}$ C。
          answer: 28.2
          tolerance: 0.2
          unit: nm
          hint: $V_{bi} - V = 3.07$ V，$1/N_a + 1/N_d = 2\times10^{-19}$。
          explain: $W = \sqrt{2\times1.036\times10^{-12}\times3.07\times2\times10^{-19}/1.602\times10^{-19}} = 2.82\times10^{-6}$ cm $= 28.2$ nm，平均电场 $3.07/2.82\times10^{-6} \approx 1.1\times10^6$ V/cm。这么薄、这么强，电子能隧穿过去。
      - card:
          title: 稳压二极管
          body: |
            专门设计在反向击穿区工作的二极管叫**稳压二极管（Zener diode）**，也叫稳压管或齐纳二极管，不管是哪种击穿机制都这么叫。击穿后电流在很大范围里变化，两端电压几乎不变。

            最简单的稳压电路：电源经一个电阻接到稳压管上（稳压管反接），负载和稳压管并联。电阻上的压降吸收电源电压的波动，多出来的电流从稳压管流走，负载上的电压保持在击穿电压附近。
      - item:
          id: temp-coefficient
          type: choice
          prompt: 一个 3.3 V 的稳压二极管和一个 12 V 的稳压二极管，温度升高时击穿电压分别怎样变？
          options:
            - text: 3.3 V 的下降，12 V 的上升
              correct: true
            - text: 都上升，温度高了载流子更活跃
              why: 3.3 V 的是齐纳击穿，温度升高带隙变小、隧穿更容易，击穿电压下降
            - text: 都下降，温度高了更容易击穿
              why: 12 V 的是雪崩击穿，温度升高散射增强，载流子要更强的电场才能攒够能量，击穿电压上升
          explain: 低压管靠隧穿，温度系数为负；高压管靠雪崩，温度系数为正。5–6 V 附近两种机制都有、互相抵消，温度系数接近零，所以精密的稳压电路常用这一档。
      - item:
          id: zener-current
          type: number
          prompt: 12 V 电源经 470 Ω 电阻接到一个 5.1 V 的稳压二极管上，负载和稳压管并联，取电流 5 mA。稳压管里流过多少毫安？
          answer: 9.68
          tolerance: 0.02
          unit: mA
          hint: 电阻两端电压是多少？电阻上的电流分给负载以后还剩多少？
          explain: 电阻上的电流 $(12 - 5.1)/470 = 14.68$ mA，负载取走 5 mA，稳压管里 9.68 mA。负载电流变大时稳压管的电流相应变小，只要它不降到零，输出就稳在 5.1 V。
boss:
  items:
    - id: b-bragg
      type: number
      prompt: 简单立方晶体 $a = 0.36$ nm，用波长 0.154 nm 的 X 射线测 $(111)$ 面。一级布拉格衍射角 $\theta$ 是多少度？
      answer: 21.75
      tolerance: 0.03
      unit: °
      hint: 先求 $(111)$ 面的间距。
      explain: $d_{111} = 0.36/\sqrt3 = 0.2078$ nm，$\sin\theta = 0.154/(2\times0.2078) = 0.3705$，$\theta = 21.75°$。
    - id: b-bcc-reciprocal
      type: number
      prompt: 体心立方晶格的立方晶胞边长 0.35 nm。它的倒格子的立方晶胞边长是多少 $\text{nm}^{-1}$？
      answer: 35.9
      tolerance: 0.05
      unit: nm⁻¹
      hint: 体心立方的倒格子是哪种格子，晶胞边长怎样算？
      explain: 体心立方的倒格子是面心立方，晶胞边长 $4\pi/a = 4\pi/0.35 = 35.9\ \text{nm}^{-1}$。
    - id: b-band-top
      type: number
      prompt: 一维原子链 $a = 0.30$ nm，周期势的傅里叶系数 $|V_1| = 0.25$ eV。按近自由电子近似，最低能带的最高能量是多少电子伏特（以 $k = 0$ 处为零点）？宽 1 nm 的无限深势阱基态能量是 0.376 eV。
      answer: 3.93
      tolerance: 0.01
      unit: eV
      hint: 先求自由电子在 $k = \pi/a$ 处的能量，最低能带的顶在它的上方还是下方？
      explain: 自由电子在边界上的能量 $0.376/0.3^2 = 4.18$ eV。两种驻波分在 $4.18 \pm 0.25$ eV，最低能带的顶是 $4.18 - 0.25 = 3.93$ eV，带隙 0.5 eV。
    - id: b-odd-electrons
      type: choice
      prompt: 一种晶体每个原胞只有 1 个原子，每个原子有 3 个价电子。仅凭这一点能判断它是哪类材料？
      options:
        - text: 金属，有一个能带只填了一半
          correct: true
        - text: 半导体，3 个价电子和硼一样
          why: 硼作为杂质在硅里是受主；这里说的是纯晶体，每个原胞 3 个电子，最高的那个能带只能填一半
        - text: 绝缘体，电子都被束缚在原子上
          why: 晶体里的价电子按能带填充，判断导电看最高的能带满没满，不看束缚得紧不紧
      explain: 每个能带每个原胞放 2 个电子。3 个电子填满一个能带后还剩 1 个，下一个能带只填了一半，所以一定导电。铝就是这样。
    - id: b-tb-mass
      type: number
      prompt: 一维紧束缚能带 $E = E_0 - 2t\cos(ka)$，$t = 0.8$ eV，$a = 0.25$ nm。能带底的有效质量是自由电子质量的几倍？$\hbar^2/2m = 0.0381\ \text{eV·nm}^2$。
      answer: 0.762
      tolerance: 0.003
      hint: 能带底的 $d^2E/dk^2 = 2ta^2$。
      explain: $m^*/m = (\hbar^2/2m)/(ta^2) = 0.0381/(0.8\times0.0625) = 0.762$。
    - id: b-hole
      type: choice
      prompt: 关于半导体里的空穴，下面哪个说法对？
      options:
        - text: 价带里缺一个电子的状态，表现为带正电、有效质量为正的粒子
          correct: true
        - text: 它是带正电的质子，从原子核里跑出来参与导电
          why: 空穴不是真实的粒子，是价带里缺电子的状态；原子核里的质子不会离开原子
        - text: 它带负电，因为它由价带电子的运动形成
          why: 缺一个电子的价带比满带多 $+e$，电流也等效于正电荷的运动
        - text: 它的有效质量是负的，因为价带顶向下弯
          why: 向下弯使价带顶那个电子的有效质量为负；空穴是少了这个电子，质量取反，变成正的
      explain: 满带电中性、不导电。少一个带 $-e$、质量 $m_e^* < 0$ 的电子，相当于多一个带 $+e$、质量 $-m_e^* > 0$ 的粒子。
    - id: b-compensation
      type: number
      prompt: 硅里同时掺了 $N_a = 5\times10^{16}$ 和 $N_d = 1\times10^{16}\ \text{cm}^{-3}$，全部电离，$n_i = 10^{10}\ \text{cm}^{-3}$。电子浓度是多少 $\text{cm}^{-3}$？
      answer: 2500
      tolerance: 3
      unit: cm⁻³
      hint: 补偿以后多出来的是哪种杂质？
      explain: 受主多，补偿后 $p \approx N_a - N_d = 4\times10^{16}$，$n = n_i^2/p = 10^{20}/(4\times10^{16}) = 2500\ \text{cm}^{-3}$。
    - id: b-fermi-level
      type: number
      prompt: 硅掺硼 $N_a = 10^{17}\ \text{cm}^{-3}$，全部电离，300 K，$N_v = 1.8\times10^{19}\ \text{cm}^{-3}$，$kT = 0.02585$ eV。费米能级在价带顶以上多少电子伏特？
      answer: 0.134
      tolerance: 0.001
      unit: eV
      hint: $E_F - E_v = kT\ln(N_v/p)$。
      explain: $E_F - E_v = 0.02585\times\ln 180 = 0.02585\times5.193 = 0.134$ eV，比 $3kT$ 大，玻尔兹曼近似可用。
    - id: b-resistivity
      type: number
      prompt: 硅掺磷 $N_d = 2\times10^{15}\ \text{cm}^{-3}$，$\mu_n = 1350\ \text{cm}^2/(\text{V·s})$，$q = 1.602\times10^{-19}$ C。电阻率是多少 Ω·cm？
      answer: 2.31
      tolerance: 0.01
      unit: Ω·cm
      hint: $\rho = 1/(qn\mu_n)$。
      explain: $\sigma = 1.602\times10^{-19}\times2\times10^{15}\times1350 = 0.433$ S/cm，$\rho = 2.31$ Ω·cm。
    - id: b-diff-length
      type: number
      prompt: p 型硅里电子迁移率 $1160\ \text{cm}^2/(\text{V·s})$，少子寿命 2 μs，300 K（$kT/q = 0.02585$ V）。电子的扩散长度是多少微米？
      answer: 77.4
      tolerance: 0.2
      unit: μm
      hint: 先用爱因斯坦关系求扩散系数。
      explain: $D_n = 1160\times0.02585 = 30.0\ \text{cm}^2/\text{s}$，$L_n = \sqrt{30.0\times2\times10^{-6}} = 7.74\times10^{-3}$ cm $= 77.4$ μm。
    - id: b-decay
      type: number
      prompt: p 型硅的少子寿命 2 μs。关掉光以后，过多少微秒过剩少子降到原来的 10%？
      answer: 4.61
      tolerance: 0.01
      unit: μs
      hint: 过剩少子随时间按什么规律衰减？
      explain: $\Delta n(t) = \Delta n(0)e^{-t/\tau}$，令 $e^{-t/\tau} = 0.1$，$t = \tau\ln 10 = 2\times2.303 = 4.61$ μs。
    - id: b-depletion
      type: number
      prompt: 硅突变结 $N_a = 10^{18}$、$N_d = 10^{16}\ \text{cm}^{-3}$，300 K，$n_i = 10^{10}$，$kT/q = 0.02585$ V，零偏。耗尽区总宽是多少微米？$\varepsilon = 1.036\times10^{-12}$ F/cm，$q = 1.602\times10^{-19}$ C。
      answer: 0.33
      tolerance: 0.002
      unit: μm
      hint: 先求内建电势，再代入耗尽区宽度公式。
      explain: $V_{bi} = 0.02585\times\ln(10^{34}/10^{20}) = 0.833$ V；$1/N_a + 1/N_d = 1.01\times10^{-16}$；$W = \sqrt{2\times1.036\times10^{-12}\times0.833\times1.01\times10^{-16}/1.602\times10^{-19}} = 3.30\times10^{-5}$ cm $= 0.33$ μm，几乎全在 n 侧。
    - id: b-diode-voltage
      type: number
      prompt: 一个二极管 $I_s = 2\times10^{-15}$ A，300 K（$V_T = 0.02585$ V）。正向电流 2 mA 时两端电压是多少伏特？
      answer: 0.714
      tolerance: 0.001
      unit: V
      hint: $V = V_T\ln(I/I_s + 1)$。
      explain: $I/I_s = 10^{12}$，$V = 0.02585\times27.63 = 0.714$ V。
