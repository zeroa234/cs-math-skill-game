skill: C.3.2
version: 2
authors: [main-agent]
brief:
  why: |
    你在浏览器里输入一个网址，网页就能从地球另一端出现在屏幕上；游戏突然卡顿、视频缓冲、手机连上 Wi-Fi 就拿到地址，背后全是网络协议在分工协作。这一关从比特怎样变成电信号和帧讲起，一路穿过以太网交换机、IPv4 子网和路由表、TCP 可靠字节流与拥塞控制，一直讲到 DNS、HTTP/3 和 Python socket 编程。只假设你学过 Python（P.1.1）、C/内存与字节（P.2.2）以及图与队列（F.1.1）。
  outcomes:
    - 用网络分层、延迟带宽积和线路编码/成帧算清链路性能与位流边界
    - 手算互联网校验和与模 2 CRC 除法，用滑动窗口序号公式判断窗口上限
    - 模拟交换机 MAC 自学习与生成树选根，手算 IPv4 CIDR 子网划分、分片偏移与最长前缀匹配
    - 用 Dijkstra 和距离向量更新转发表，解释无穷计数与 BGP 商业策略选路
    - 追踪 TCP 三次握手/四次挥手、慢启动到拥塞避免的 cwnd 变化，并用 Python socket 写出正确处理字节流边界的回显程序
    - 说明 DNS 逐层解析与缓存 TTL、HTTP/1.1 到 HTTP/3 的演进、SMTP/IMAP/SNMP 与 CDN/P2P 的工作原理
terms:
  - term: 封装
    def: 一层协议把上层数据当作载荷，加上自己的首部控制信息后交给下一层发送。
  - term: 统计复用
    def: 多路突发流量按需共享同一条物理链路，有数据就插空发送而不必提前固定切分带宽。
  - term: 二进制
    def: 只用 0 和 1 两个数字、每一位按 2 的幂计数的表示方法，如 1011 表示 11。
  - term: 帧
    def: 链路层在一段直连线路上传输的数据单元，带有起止边界、链路地址和差错校验。
  - term: 校验和
    def: 把数据按固定位宽相加并取反得到的短校验值，接收方重算以发现部分传输出错。
  - term: 停等协议
    def: 每发出一帧就原地等待对方确认回来后再发下一帧的简单可靠传输协议。
  - term: 滑动窗口
    def: 允许发送方在收到确认前连续发出多个分组的机制，用来同时保证可靠性和链路利用率。
  - term: MAC 地址
    def: 烧录在网卡上的 48 位链路层地址，用来在同一局域网内标明发送和接收接口。
  - term: 广播
    def: 把一份数据帧或分组送往当前局域网范围内的所有接口，而不只发给某一台机器。
  - term: 生成树协议
    def: 交换机之间通过选根与阻塞冗余环路端口，把有圈的物理局域网裁剪成无环树状拓扑的协议。
  - term: VLAN
    def: 虚拟局域网：在一台或多台物理交换机内部用标签把端口隔成互不串扰的多个广播域。
  - term: MTU
    def: 最大传输单元：某段链路单帧最多能承载的字节上限（常见以太网为 1500 字节）。
  - term: 子网
    def: 共享同一网络前缀的一组 IP 地址，同一子网内的主机可以直接在链路层互发数据。
  - term: CIDR
    def: 无类别域间路由：用“地址/前缀长度”灵活划分网段并汇总路由，替代僵化的 A/B/C 分类。
  - term: 默认网关
    def: 本地子网里负责把发往外网的数据包转发出去的那台出口路由器接口。
  - term: ARP
    def: 地址解析协议：在本地局域网内询问“谁拥有某个 IP”，从而查出下一跳对应的 MAC 地址。
  - term: DHCP
    def: 动态主机配置协议：新接入设备自动向本地网络租用 IP 地址、子网掩码、默认网关和 DNS 地址。
  - term: NAT
    def: 网络地址转换：网关把内网私有地址和端口改写成公网地址和端口，让多台主机共用少数公网 IP。
  - term: ICMP
    def: 互联网控制报文协议：在网络层向发送端报告超时、不可达等差错，并支撑 ping 等诊断。
  - term: 组播
    def: 把同一份数据包在网络分支处按需复制，只送给加入特定组播组的多个接收者。
  - term: 端口
    def: 传输层用来区分同一台主机上不同网络程序的 16 位编号，如 HTTP 默认 80、DNS 默认 53。
  - term: UDP
    def: 用户数据报协议：无连接、不重传、保留消息边界的极简传输协议，首部只有 8 字节。
  - term: TCP
    def: 传输控制协议：面向连接、按字节编号并带有流量控制与拥塞控制的可靠字节流协议。
  - term: 三次握手
    def: TCP 建连时的三次交互（SYN、SYN-ACK、ACK），同步双方初始序号并确认双向收发正常。
  - term: 通告窗口
    def: 接收方在 TCP 确认段里填上的剩余接收缓冲区大小，用来限制发送方不要发太快（流量控制）。
  - term: 最长前缀匹配
    def: 转发表有多条网段同时包含目标 IP 时，选用前缀位数最多、范围最具体那一条的查表规则。
  - term: TCAM
    def: 三态内容寻址存储器：支持 0、1 和通配符三种状态，可在单次硬件查找中并行匹配所有前缀。
  - term: 链路状态路由
    def: 路由器把直连链路信息泛洪给全网，各自拼出完整网络图后运行 Dijkstra 算法计算最短路径。
  - term: 向量
    def: 这里指按各个目的地排成一列、记录自己到每个目的地最短估计距离的一维数组。
  - term: 距离向量路由
    def: 路由器只和直连邻居交换自己的距离表格，再用邻边代价加上邻居的汇报来更新最短距离。
  - term: 无穷计数
    def: 链路断开后，距离向量路由器互相听信对方的过时路径汇报，导致距离估价步步攀升的现象。
  - term: 自治系统
    def: 由同一机构或运营商管理、对外呈现统一路由策略的一组网络，拥有全局编号（ASN）。
  - term: BGP
    def: 边界网关协议：在自治系统之间交换网段可达性与完整路径，并按商业策略挑选路由。
  - term: 路径向量
    def: 路由通告中携带到达目的地所经过的完整自治系统编号列表，用来防环并支持策略筛选。
  - term: 拥塞
    def: 进入网络路径的流量持续超过某处路由器或链路的承载能力，造成排队变长乃至丢包。
  - term: 公平排队
    def: 为每条流分别维护队列并按虚拟完成时刻轮流发送，防止单条大流量流饿死其他连接的排队规则。
  - term: 拥塞窗口
    def: 发送端根据网络拥塞反馈动态调整的窗口上限，限制尚未收到确认的在途数据量。
  - term: 慢启动
    def: TCP 建连或超时后从极小拥塞窗口起步、每收到确认按往返翻倍探测可用带宽的阶段。
  - term: 拥塞避免
    def: 当拥塞窗口达到慢启动门限后转为每个往返线性加 1 MSS 的保守试探阶段。
  - term: DNS
    def: 域名系统：把人读的域名通过根、顶级域和权威服务器逐层解析成 IP 地址等记录。
  - term: HTTP
    def: 超文本传输协议：客户端与服务器按请求和响应格式交换网页与接口数据的应用层协议。
  - term: TLS
    def: 传输层安全协议：在传输连接之上提供身份认证、密钥协商与数据加密保护（如用于 HTTPS）。
  - term: QUIC
    def: 构筑在 UDP 之上的现代传输协议，把加密握手与传输层多路复用流结合以消除 TCP 队头阻塞。
  - term: 覆盖网络
    def: 在已有底层 IP 网络之上搭建逻辑拓扑与隧道，不用修改底层路由器即可实现新路径或新功能。
lessons:
  # ======================================================================== 链路/IP/TCP/UDP
  - id: layers-perf
    chapter: 链路/IP/TCP/UDP
    title: 网络分层、封装与传输性能
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你在手机上点开一个新闻网页，请求会依次经过家里的 Wi-Fi 路由器、运营商光缆里的多台路由器，最后到达远方服务器。中间那些路由器需要看懂网页里的 HTML 文字吗？
          options:
            - text: 不需要，路由器只看外层写着目的地地址的包装就能往下转发
              correct: true
            - text: 需要，路由器必须先把请求全文翻译一遍才知道送去哪
              why: 互联网上有成千上万种应用，如果每台路由器都要懂每种应用的内容，每出一个新 App 全网路由器都得升级
            - text: 只有第一台家里路由器看内容，后面的只看地址
              why: 路由器工作在网络层，无论在家还是在骨干网，都不必解析应用层正文
          explain: 这就像寄快递：中转站分拣员只看快递单上的省市区地址，不需要拆开箱子看里面装的是书还是衣服。
      - card:
          title: 为什么要分层：把复杂问题切块
          body: |
            把浏览器里一条网页请求送到远方服务器，需要经过好多不同的工作：先把字变成光脉冲或电信号、送给楼下路由器、跨过几家运营商挑出最短路、发现丢包后补发、最后看懂网页格式。

            如果全揉在一个大程序里，换根网线就得重写浏览器。网络采用**分层体系结构**：每一层只专注做好一件事，让每层独立演进而不影响别层。
      - card:
          title: 五层模型与程序接口
          body: |
            日常和教材最常用这五层分工（对应互联网协议栈）：

            | 层次 | 解决什么问题 | 常见协议 |
            |---|---|---|
            | 应用层 | 应用程序彼此按约定格式对话 | HTTP（网页）、DNS（域名）、SMTP（邮件） |
            | 传输层 | 区分同一电脑上的不同程序、决定是否可靠 | TCP（可靠字节流）、UDP（简短报文） |
            | 网络层 | 跨越多台路由器把分组送到目标机器 | IP（寻址转发）、ICMP（差错报告） |
            | 链路层 | 只管相邻两台设备之间传一帧 | 以太网、Wi-Fi、点到点协议 PPP |
            | 物理层 | 把 0/1 变成光、电或无线电波 | 光纤、双绞线 |

            应用通过操作系统提供的 **socket（套接字）** 接口把字节交给传输层。
      - item:
          id: layer-roles
          type: match
          prompt: 把每项网络任务和负责它的层次配对。
          pairs:
            - [把域名翻译成网络地址并请求网页, 应用层]
            - [跨越多台路由器把分组送到目标主机, 网络层]
            - [把数据交给目标主机上对应的应用并管可靠传输, 传输层]
            - [把一串比特调制成光纤里的光脉冲, 物理层]
          explain: 应用层管业务协议（HTTP、DNS），网络层管跨网寻址转发（IP），传输层管端到端应用通道（TCP/UDP），物理层负责光/电波形传输。
      - card:
          title: 封装：一层套一层的信封
          body: |
            就像寄跨国包裹：里面先写好信纸（网页请求），装进标明收信部门的信封，再放进写着省市门牌的大纸箱，最后贴上只送楼下快递站的条码。

            数据从上往下走时的**封装（encapsulation）**就是这样：每层把上层数据当载荷，贴上自己的首部控制信息：
            ```text
            应用数据          [ 网页请求 ]
            加传输层首部      [ 传输编号与序号 | 网页请求 ]
            加网络层首部      [ 源/目的网络地址 | 传输首部 | 网页请求 ]
            加链路层帧头帧尾  [ 本跳物理地址 | 网络地址 | 传输首部 | 网页请求 | 检错尾 ]
            ```
      - item:
          id: encap-order
          type: order
          prompt: 浏览器发出一个网页请求，从应用层往下封装到网线发出去，依次加上哪些部分？
          steps:
            - 形成应用层 HTTP 请求报文
            - 加上传输层 TCP 首部（应用编号与字节序号）
            - 加上网络层 IP 首部（源和目的网络地址）
            - 加上链路层以太网头尾（下一跳设备地址与检错码）
          explain: 数据自顶向下逐层加包装：应用 → 传输 → 网络 → 链路。每台中间路由器只拆到网络层看目的地址，再换上新的一跳链路包装。
      - card:
          title: 共享线路的秘密：分组交换与统计复用
          body: |
            为什么全城几万户共用一条主干光缆还很流畅（教材 1.2 节）？老式电话网用**电路交换**：通话前先占死一条专线，不说话时链路也空着浪费。

            互联网改用**分组交换**：把数据切成带目的地址的小分组，谁有数据就按需塞上公用链路，这叫**统计复用（statistical multiplexing）**。因为大家很少在同一毫秒一起满速下载，统计复用能让同一根主干容纳比固定专线多得好几倍的用户！
      - item:
          id: stat-mux
          type: choice
          prompt: 一条 100 Mbps 的主干链路给一批间歇浏览网页的用户使用（每个人看网页时只在点链接那瞬间用到 20 Mbps，其余时间几乎空闲）。与固定给每人划死 20 Mbps 专线的电路交换相比，分组交换靠统计复用能做到什么？
          options:
            - text: 只要大家不同时在同一刻猛传，可以同时服务远超过 5 个用户，空隙被其他人的分组填满
              correct: true
            - text: 每个用户无论何时都能独占 100 Mbps 固定专线，绝不发生任何排队
              why: 大家共享同一条 100 Mbps 线路，如果恰好在同一瞬间有多人同时猛发，分组仍需要短时排队
            - text: 统计复用能把 100 Mbps 的物理链路速率变成 1000 Mbps
              why: 统计复用提高的是链路“利用率”和可接入人数，物理链路的最大传输速率本身还是 100 Mbps
          explain: 突发流量“错峰填谷”正是互联网选择分组交换的核心原因——只要平均总流量不超过 100 Mbps，统计复用就比死分专线高效得多。
      - card:
          title: 性能的两个基本指标：带宽与延迟
          body: |
            衡量一条链路快不快，有两个完全不同的维度（教材 1.5 节）：
            - **带宽（bandwidth）**：每秒能往线路上塞进多少比特（单位 bps、Mbps、Gbps，1 Mbps = $10^6$ bps，网络速率用 10 的幂）。
            - **延迟（latency）**：第一个比特出发到最后一个比特到达要多久；**往返时间（RTT）**则是发出去再等回信一来一回的总耗时。

            好比高速公路：车道宽窄决定每小时过几辆车（带宽），路程长度和车速决定一辆车跑完要多久（延迟）。
      - card:
          title: 例题：总延迟由哪三段组成
          body: |
            总延迟 = **传播延迟** + **发送（传输）延迟** + **排队延迟**。算算一段 100 km 光纤（光在玻璃里约 $2 \times 10^8\text{ m/s}$）、速率 10 Mbps，发一个 1000 字节的包（不计排队）：
          reveal:
            - title: 第 1 步：先算传播延迟（第一个比特跑到对岸的时间）
              body: 距离除以信号速度：$\frac{100{,}000\text{ m}}{2 \times 10^8\text{ m/s}} = 0.0005\text{ s} = 0.5\text{ ms}$。注意这和包大小、带宽都没关系。
            - title: 第 2 步：再算发送延迟（把整包比特全部推上链路的时间）
              body: 1000 字节 = 8000 比特。除以速率 10 Mbps（$10^7$ bps）：$\frac{8000}{10^7} = 0.0008\text{ s} = 0.8\text{ ms}$。
            - title: 第 3 步：相加得到单向总延迟
              body: $0.5 + 0.8 = 1.3\text{ ms}$。如果中间有路由器排队，还要再加上队列里等待前面数据包的时间。
      - item:
          id: delay-prop-only
          type: number
          prompt: 先拆开练一步：一段 300 km 长的光纤（信号速度 $2 \times 10^8\text{ m/s}$），只算第一个比特从起点跑到终点的**传播延迟**，是多少毫秒？
          answer: 1.5
          unit: ms
          explain: 传播延迟只看距离和信号速度：300,000 m / (2 × 10^8 m/s) = 0.0015 s = 1.5 ms，与数据包大小无关。
      - item:
          id: delay-calc
          type: number
          prompt: 一条 200 km 长的光纤（信号速度 $2 \times 10^8\text{ m/s}$），传输速率 20 Mbps。发送一个 2500 字节（20000 比特）的数据包，不计排队延迟，单向总延迟是多少毫秒？
          answer: 2
          unit: ms
          explain: 传播延迟 = 200000 / 2e8 = 1 ms；发送延迟 = 20000 / 2e7 = 1 ms；两者相加为 2 ms。
      - card:
          title: 管道容量：延迟带宽积
          body: |
            把链路想象成一根水管：**带宽**是水管截面积，**往返时间（RTT）**是水管长度。乘积 $\text{RTT} \times \text{Bandwidth}$ 叫**延迟带宽积（delay-bandwidth product）**，表示“管子里同时能装多少还没收到确认的在途比特”。

            比如 Peterson & Davie 的例子：1.5 Mbps 的横跨大陆链路，RTT = 45 ms。管子容量是 $1.5 \times 10^6 \times 0.045 = 67{,}500\text{ bits} \approx 8.4\text{ KB}$。你至少要在收到第一个确认前连续发出这么多数据，才能把线路装满。
      - item:
          id: bdp-calc
          type: number
          prompt: 一条 10 Mbps 的链路往返时间（RTT）为 80 ms。它的延迟带宽积是多少千字节（KB，按 1 KB = 1000 字节换算，1 字节 = 8 比特）？
          answer: 100
          unit: KB
          explain: 总比特数 = 10e6 bps × 0.080 s = 800,000 bits；除以 8 得 100,000 字节 = 100 KB。
      - item:
          id: router-swap
          type: choice
          prompt: 一台路由器从左边的以太网口收到一个 IP 分组，查表后决定从右边的 Wi-Fi 接口发往下一跳路由器。它会改动这个包的哪一部分？
          options:
            - text: 拆掉旧以太网帧，把剩余转跳寿命（TTL）减 1 并更新首部检错码，再重新包上新 Wi-Fi 帧
              correct: true
            - text: 连同应用层网页请求的 URL 路径一起改写
              why: 路由器只处理到网络层（IP），不碰传输层和应用层正文
            - text: 保留原来的以太网链路层地址原封不动转发到 Wi-Fi 上
              why: 下一跳设备的链路层地址和介质类型都变了，必须重新封装成下一跳的链路帧
          explain: 路由器每跳都要把网络层寿命计数减 1 防止死循环、更新网络层检错字段，并把外层链路包装彻底换成下一段链路的新帧。

  - id: encoding-framing
    chapter: 链路/IP/TCP/UDP
    title: 信号编码、成帧与接入网
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 两台机器用一根铜线连着，约定高电压代表 1、低电压代表 0。如果发送方连着发了一万个 0，接收方一直量到平稳的低电压，最容易出什么问题？
          options:
            - text: 接收方不知道中间究竟经过了多少个比特，时钟容易跑偏
              correct: true
            - text: 低电压代表 0，所以永远不会出错
              why: 接收方的本地时钟总有微小误差，没有电平跳变就无法重新对齐“每个比特从哪到哪”
            - text: 铜线会因为电压不变而自动断开连接
              why: 物理线路不会断开，问题出在收发双方的时钟同步和直流基线漂移上
          explain: 如果信号长时间不变，接收方靠自己的表数“一共几个 0”，只要时钟差千分之一，几千位之后就会多算或少算一位。
      - card:
          title: 用二进制表示信息：编码的问题
          body: |
            计算机内部所有数据最终都要拆成一串 **二进制（binary）** 的 0 和 1。直接用高电压代表 1、低电压代表 0 的做法叫 **NRZ（非归零编码）**。

            NRZ 有两个毛病：连着发一串 0 或一串 1 时，信号长久不动，接收端没法靠跳变校准时钟（**时钟恢复**失败）；而且长期偏高或偏低会让平均电压漂移（**基线漂移**），收端更难分辨高低门槛。
      - card:
          title: 曼彻斯特编码与 4B/5B
          body: |
            为了强制信号经常跳变，Peterson & Davie 介绍了两种常见办法：
            - **曼彻斯特编码（Manchester）**：把时钟和 NRZ 做异或。教材里 0 跳成低→高，1 跳成高→低。每位必跳变一次，但代价是信号变化速率翻倍，效率只有 **50%**。
            - **4B/5B + NRZI**：NRZI 规定遇 1 就跳变、遇 0 不跳（解决了连续 1，没解决连续 0）。4B/5B 把每 4 个数据位映射成 5 位编码，刻意挑“最多 1 个前导 0、最多 2 个结尾 0”的组合，保证串里**最多连续 3 个 0**，效率升到 **80%**！
      - item:
          id: encoding-eff
          type: number
          prompt: 某种链路需要发送每秒 80 兆比特（80 Mbps）的用户数据，采用 4B/5B 编码（每 4 位数据编成 5 位信号）。物理线路上每秒需要传输多少兆比特的信号码元（Mbps）？
          answer: 100
          unit: Mbps
          explain: 4B/5B 的编码效率是 4/5 = 80%，因此线路需要传输 80 × (5/4) = 100 Mbps 的信号。
      - card:
          title: 成帧：怎么看出一帧从哪到哪
          body: |
            线路上只是一串接一串的信号，接收方怎么知道哪一段是一整**帧（frame）**？常见三种切分法：
            - **字节填充**（早年 BISYNC 协议）：用特殊控制字节包住正文；若正文里碰巧出现结束标记，前面加转义字节 `DLE`（正文里的 `DLE` 也加倍成 `DLE DLE`）。
            - **比特填充**（HDLC 与点到点协议 **PPP**）：首尾放标志 `01111110`（六个连续 1）。发端只要看到正文里有连续 **5 个 1**，就硬塞进一个 `0`；收端看到 5 个 1 后跟 `0` 就删掉它。
            - **基于时钟**（高速光纤网 **SONET**）：每帧固定 810 字节，隔 810 字节直接看对齐标记。
      - card:
          title: 例题：用比特填充保护 HDLC 帧
          body: |
            HDLC（高级数据链路控制协议）的帧边界标志是 `01111110`（六个连续 1）。假设要发送的数据比特是 `01111110111110`，做一次比特填充会变成什么？
          reveal:
            - title: 第 1 步：从左到右扫描，数出连续 5 个 1
              body: 开头是 `0` 后接 `11111`，第 5 个 1 后面必须立刻插入一个填充位 `0`，变成 `011111` + **`0`**。
            - title: 第 2 步：接着处理剩下的位
              body: 剩下的原数据是 `10111110`。其中前半段 `10` 不够 5 个 1；后面的 `11111` 又凑够了连续 5 个 1，于是再插一个 `0`，最后接上末尾的 `0`。
            - title: 第 3 步：写出最终发送序列
              body: 原数据里只要碰到 5 个连续 1 就补一个 `0`，结果是 `0111110101111100`（正文部分），再在整段前后套上真正的 `01111110` 边界。
      - item:
          id: bit-stuff-half
          type: text
          prompt: 按 HDLC 比特填充规则（连续 5 个 1 后插一个 0），待发正文是 `1111110`。前 5 个 1 后面已经插了 0 成 `111110...`，接着剩下 `10`。完整的填充后正文的比特串是什么？
          answers: ['11111010']
          explain: 前面 5 个 1 后面立刻塞进一个 `0`，剩下的 `10` 不够 5 个 1 直接接在后面，所以整体变成 `11111010`（只有 8 位，刚好避开 6 个连续 1）。
      - item:
          id: bit-stuff
          type: text
          prompt: 按 HDLC 的比特填充规则（每出现连续 5 个 1 就立即在后面插入一个 0），发送正文的比特串 `01111101` 经填充后会变成哪串二进制位？
          answers: ['011111001']
          explain: 前面 `0` 后面刚好连续 5 个 1（位置 2–6），必须立刻插入一个 `0`（即使原本第 7 位已经是 0 也必须插，否则接收方会把那原本的 0 误删！），后面剩下的 `01` 照写，共 `011111001`。
      - item:
          id: framing-errors
          type: choice
          prompt: 接收端按 HDLC 规则解码时，突然在数据中收到了连续 7 个 1（`1111111`）。这意味着什么？
          options:
            - text: 传输中发生了比特错误，这一帧已损坏应丢弃
              correct: true
            - text: 正文里正好有连续 7 个 1，直接原样保留即可
              why: 正常发送端遇到 5 个 1 就已经插入 0 了，绝不可能发出连续 7 个 1
            - text: 这是正常的帧结束标志，说明上一帧平安收完
              why: 正常标志是 `01111110`（刚好 6 个 1 后跟 0），7 个 1 说明第 7 位的 0 变成了 1
          explain: Peterson & Davie 专门指出：5 个 1 后跟 `0` 是去填充；跟 `10` 是正常帧尾；跟 `11`（即连续 7 个 1）说明信号出错，直接判为帧损坏并丢弃。
      - card:
          title: 接入网：从家里怎么连进运营商
          body: |
            用户设备怎么接进骨干网（教材 2.8 节）？现代最常见两类接入网：
            - **光纤无源光网络（PON，常用于光纤到户）**：从机房局端光线路终端（**OLT**）出发，经无源光分路器树形分给各户光猫（**ONU**）。下行一份光信号同时送往所有光猫并加密；上行由 OLT 分时段发许可轮流发。
            - **蜂窝移动网（4G/5G）**：手机连基站，核心网（**EPC**）管认证与路由，移动时基站间执行**切换**，无线信道按时频网格分配。
      - item:
          id: pon-direction
          type: choice
          prompt: 在家庭光纤无源光网络（PON）中，如果多户人家共用同一根主干光纤往运营商机房（上行）发送数据，靠什么避免光信号撞在一起？
          options:
            - text: 机房的 OLT 按时段轮流给各光猫发发送许可（时分复用 TDM）
              correct: true
            - text: 靠家里光猫自己监听其他邻居家有没有在向上发送光信号，没人发再抢着发
              why: 无源光分路器在物理方向上把各户上行支路隔开了，邻居家光猫互相看不见对方往机房发的光
            - text: 各户同时全速发送，反正同一根光纤里不同亮度的光波能自动叠加分离
              why: 同一波长的光脉冲同时到达合路点会直接互相干扰混成一团，必须由 OLT 按时间错开上行许可
          explain: PON 下行是“一传多”按编号过滤，上行则是“多汇一”，所以必须由顶端的 OLT 集中分配上行发送时段。
      - item:
          id: framing-methods
          type: match
          prompt: 把四种物理编码或成帧方式和它们的特点配对。
          pairs:
            - [曼彻斯特编码, 每位中间必跳变一次但效率只有 50%]
            - [4B/5B 编码, 用 5 位编 4 位保证最多连续 3 个 0，效率 80%]
            - [HDLC 比特填充, 正文碰到连续 5 个 1 就插入一个 0 避开边界标志]
            - [SONET 基于时钟成帧, 每帧固定 810 字节按固定周期寻找帧头]
          explain: 编码解决底层时钟与电平同步问题，成帧解决“一整帧从哪开始到哪结束”的切分问题。

  - id: error-detection
    chapter: 链路/IP/TCP/UDP
    title: 差错检测：校验和与 CRC
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 发送方把数据里所有 16 位数字加起来附在后面当“核对码”。如果第 1 个数在路上多加了 1，第 2 个数恰好少加了 1，这种简单的加法核对能查出来吗？
          options:
            - text: 查不出来，两个错误正好互相抵消，总和一模一样
              correct: true
            - text: 只要有任何两个位出错，加法核对百分之百能查出
              why: 两个相反方向的改动会让总和保持不变，这就是简单加法核对的盲区
            - text: 只有所有位全变成 0 时才会漏过
              why: 不必全变 0，只要一增一减抵消，总和就看不出破绽
          explain: 简单累加计算快、代码短，适合软件层面粗检；但遇到一增一减相互抵消的错就会放行，所以链路层需要基于多项式余数的更强检错法。
      - card:
          title: 互联网校验和：16 位反码求和
          body: |
            IP、TCP 和 UDP 都用同一种简单的 **校验和（checksum）**：把数据切成每段 16 位的无符号整数，做**反码求和**（最高位产生进位时，把进位加回到最低位，叫回卷进位），最后把总和按位取反放进检验字段。

            接收方把含校验和在内的所有 16 位字再做一次反码求和，如果没出错，结果应当全为 `1`（再取反就是 `0`）。
      - card:
          title: 例题：用反码求和算 16 位校验和
          body: |
            假设数据只有两个 16 位字：`0x1234` 和 `0xABCD`（无进位），以及另一种有进位的情况 `0xFF00` + `0x0200`。看看怎么算：
          reveal:
            - title: 第 1 步：先看无进位例子 0x1234 + 0xABCD
              body: '`0x1234 + 0xABCD = 0xBE01`，没有超过 `0xFFFF`。按位取反（即 `0xFFFF - 0xBE01`）得到校验和 `0x41FE`。'
            - title: 第 2 步：有进位例子 0xFF00 + 0x0200
              body: 直接相加是 `0x10100`，溢出 16 位产生了进位 `1`。把高位的 `1` 加回低 16 位：`0x0100 + 1 = 0x0101`，再按位取反得 `0xFEFE`。
            - title: 第 3 步：接收方怎么验算
              body: 接收方算 `0x1234 + 0xABCD + 0x41FE = 0xFFFF`，全 1 取反就是 `0`（通过）。如果第一字多 `1` 变成 `0x1235` 而第二字少 `1` 变成 `0xABCC`，总和仍是 `0xFFFF`，就会漏网。
      - item:
          id: checksum-carry
          type: text
          prompt: 先练一步进位回卷：两个 16 位字 `0xFFFF` 和 `0x0002` 直接相加得 `0x10001`。把高位的进位 `1` 回卷加到低 16 位后再按位取反，得到的 4 位十六进制校验和是多少？
          answers: ['FFFD', '0xFFFD', 'fffd', '0xfffd']
          explain: 低 16 位 `0x0001` 加上回卷进位 `1` 得 `0x0002`，再按位取反（`0xFFFF - 0x0002`）得到 `0xFFFD`。
      - item:
          id: checksum-hex
          type: text
          prompt: 两个 16 位字是 `0x0001` 和 `0xFFFE`（提示：`0xFFFE + 1 = 0xFFFF`）。按互联网校验和规则求和并取反后，得到的 16 位校验和（写 4 位十六进制，如 `0000`）是多少？
          answers: ['0000', '0x0000', '0']
          explain: 0x0001 + 0xFFFE = 0xFFFF（没有进位），再按位取反就是 0x0000。
      - card:
          title: CRC：把比特串看成模 2 多项式
          body: |
            以太网、Wi-Fi 和 PPP 不用加法校验和，而用 **CRC（循环冗余校验）**。它把一串比特看成系数只有 0 和 1 的多项式，加减法一律是**按位异或（XOR，不借位也不进位）**。

            双方先约定一个 $k$ 次生成多项式 $C(x)$（对应 $k+1$ 位）。发送端在原消息 $M$ 后面先补 $k$ 个 0，再拿它做模 2 除法除以 $C(x)$，把 $k$ 位余数填进末尾发出去。
      - card:
          title: 演示：用 Python 单步做模 2 CRC 除法
          body: |
            这是 Peterson & Davie 的原书例题：消息 $M = 10011010$（8 位），除数 $C = 1101$（对应 $x^3 + x^2 + 1$，$k = 3$）。在 `M` 后面补 3 个 `0` 变成 11 位，逐位对齐异或，留下的最后 3 位余数就是 CRC！
          sim:
            name: trace
            params:
              code: |
                buf = [1, 0, 0, 1, 1, 0, 1, 0, 0, 0, 0]
                gen = [1, 1, 0, 1]
                for i in range(8):
                    if buf[i] == 1:
                        for j in range(4):
                            buf[i + j] ^= gen[j]
                crc = buf[-3:]
              stdin: ''
      - item:
          id: trace-crc
          type: sim
          sim: trace
          params:
            code: |
              buf = [1, 0, 0, 1, 1, 0, 1, 0, 0, 0, 0]
              gen = [1, 1, 0, 1]
              for i in range(8):
                  if buf[i] == 1:
                      for j in range(4):
                          buf[i + j] ^= gen[j]
              crc = buf[-3:]
            stdin: ''
          goal:
            ask:
              - line: 7
                var: crc
                hit: 1
          prompt: 单步运行这段 CRC 计算程序：当第 7 行 `crc = buf[-3:]` 执行完毕后，算出的 3 位余数 `crc` 是什么？
          explain: 对齐每一步异或后，`10011010000` 模 2 除以 `1101` 余下 `[1, 0, 1]`，所以最终发出去的帧尾带上 `101`，整串变成 `10011010101`。接收端拿整串除以 `1101`，余数恰好是 `000`。
      - item:
          id: crc-calc
          type: text
          prompt: 用同一个 4 位生成多项式 `1101`（$k=3$），计算 4 位短消息 `1001` 的 CRC 余数：先把 `1001` 补 3 个 0 成 `1001000`，再按模 2 异或除以 `1101`，最后的 3 位余数是什么？
          answers: ['011']
          explain: 从左向右逐位对齐异或：`1001000` 先与 `1101` 异或得 `0100000`；第 1 位 `1000` 异或 `1101` 得 `0101`（余 `0010100`）；第 2 位 `1010` 异或 `1101` 得 `0111`（余 `0001110`）；第 3 位 `1110` 异或 `1101` 得 `0011`，所以末尾 3 位余数是 `011`。
      - card:
          title: CRC 能保证发现哪些错误
          body: |
            只要合理挑选 $k$ 次生成多项式 $C(x)$（如以太网的 32 位 CRC-32），硬件用按位存储移位的电路（移位寄存器）和异或门就能在极高速下保证查出：
            - **所有 1 比特错误**（只要首尾系数非 0）；
            - **所有双比特错误**（只要 $C(x)$ 含有至少三项的因子且周期长过帧长）；
            - **任意奇数个错误**（只要 $C(x)$ 含有因子 $x + 1$）；
            - **所有长度不超过 $k$ 位的连续突发错误**（如 CRC-32 必能查出 32 位以内的整片脉冲干扰）。
      - item:
          id: crc-guarantees
          type: choice
          prompt: 以太网帧用 32 位的 CRC-32 保护（且满足上述全部选型条件）。下面哪种情况，接收端的 CRC-32 **查不出来**？
          options:
            - text: 中间人故意改动了帧里的余额数字，同时用公开的 CRC-32 公式重新算出新校验尾替换掉
              correct: true
            - text: 一段长 16 比特的连续突发电磁干扰把帧中间 16 位全翻转了
              why: 16 位小于 32 位，CRC-32 保证 100% 查出任何不超过 32 位的连续突发错误
            - text: 线路噪声导致整帧里恰好有 3 个分散的比特同时翻转
              why: 3 是奇数，只要生成多项式含 $x+1$ 因子，任意奇数个比特出错都会留下非零余数
            - text: 整帧里相距 100 位的两个单独比特同时翻转
              why: CRC-32 设计时保证了极长周期内任意双比特错误都无法被整除
          explain: CRC 只防无意发生的随机物理噪声，它没有秘密密钥——任何人都知道公开的 CRC-32 多项式，因此防不住蓄意改包后重算校验尾的恶意篡改。

  - id: reliable-link
    chapter: 链路/IP/TCP/UDP
    title: 可靠传输：停等协议与滑动窗口
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 甲给乙发了一个数据包，乙收到后回复“收到了（ACK）”，但这张 ACK 在路上丢了。甲等不到回信只好重发一次，乙怎么知道这是重发的旧包，而不是甲又发了一条新消息？
          options:
            - text: 在每个包上写上序号，乙看到和上次一样的序号就知道是重复包
              correct: true
            - text: 靠数据包的长度来猜是不是同一条
              why: 两条完全不同的新消息也可以恰好一样长
            - text: 乙不用区分，直接把重发的包再交一份给上层应用
              why: 这样用户付款请求发两次就会扣两次钱，破坏了“不重复”要求
          explain: 光靠确认和超时重传（自动重传请求，简称 ARQ）只能保证“不错过”，必须加上序号才能把重复包认出来丢掉。
      - card:
          title: 停等协议：只有 0 和 1 的序号，为什么不够快
          body: |
            最简单的可靠协议叫**停等协议（Stop-and-Wait）**：发送方发一帧，原地干等确认（ACK）回来再发下一帧。只需 **1 位序号**（0 和 1 交替）就能分清“重发的旧帧”和“下一帧”。

            可这在长途高速链路上极其浪费！拿前面 1.5 Mbps、RTT = 45 ms 的例子算：每次只发 1 KB（8192 位），一趟来回 45 ms，有效速度只有 $\frac{8192}{0.045} \approx 182\text{ kbps}$，连链路容量的 **1/8** 都不到！
      - item:
          id: stop-wait-util
          type: number
          prompt: 一条 10 Mbps 的长途链路 RTT = 10 ms（管道能装 $10^7 \times 0.01 = 100{,}000$ 比特）。用停等协议每次发 1000 字节（8000 比特）的帧，忽略帧本身的发送延迟，只按一个 RTT 的管道容量算，链路利用率是百分之多少？
          answer: 8
          unit: '%'
          explain: 每 10 ms 的管道容量是 100,000 比特，停等协议一个 RTT 只往里送 8000 比特，利用率为 8000 / 100000 = 8%。
      - card:
          title: 滑动窗口：同时让多帧在路上飞
          body: |
            假设发送端最多能连续发 4 帧（0, 1, 2, 3）而不等确认，收到 0 的确认后再接着发 4。这种机制叫**滑动窗口（sliding window）**，用几个编号边界记账：
            - 发端限制 **SWS（发送窗口大小）**：已发出未确认的帧不能超过 SWS（即最后发出帧 `LFS` 减最后确认帧 `LAR` $\le \text{SWS}$）。
            - 收端维护 **RWS（接收窗口大小）**：只接收紧接在已收齐末尾 `LFR` 之后最多 RWS 格内的帧（确认通常是累计到连续收齐处）。
      - card:
          title: 例题：有限序号绕回时的坑
          body: |
            帧头里的序号位数有限（比如 3 位只能编 `0..7`，一共 $\text{MaxSeqNum} = 8$ 个号，用完要绕回 0）。如果收端缓冲区能收乱序帧（`RWS = SWS`），窗口开太大就会闹出新旧帧撞号。看看怎么挑安全上限：
          reveal:
            - title: 第 1 步：构造一个反例（MaxSeqNum = 8, SWS = RWS = 5）
              body: 发端发出 0,1,2,3,4 号帧，收端全都收到并把窗口滑到等待 `{5,6,7,0,1}`，发回 ACK。
            - title: 第 2 步：ACK 在路上全丢了
              body: 发端超时重发旧的 0 号帧！收端一看 0 恰好落在新窗口 `{5,6,7,0,1}` 里，误把旧的 0 当成新一轮的 0 收下。
            - title: 第 3 步：记住两条安全不等式
              body: 如果收端不缓存乱序（`RWS = 1`），只需 $\text{MaxSeqNum} \ge \text{SWS} + 1$。如果收端支持乱序（`RWS = SWS`），必须保证两个窗口加起来不超一圈：$\text{SWS} < \frac{\text{MaxSeqNum} + 1}{2}$（也就是 $\text{SWS} \le \lfloor \text{MaxSeqNum}/2 \rfloor$）。
      - item:
          id: sws-no-ooo
          type: number
          prompt: 先练不缓存乱序的情况：同样用 3 个比特编序号（可用序号 0 到 7，共 8 个），如果接收端**不缓存**乱序帧（RWS = 1），发送窗口 SWS 最大能设为多少？
          answer: 7
          explain: 不缓存乱序时只需满足 MaxSeqNum ≥ SWS + 1，即 8 ≥ SWS + 1，所以 SWS 最大可设为 7（总留至少 1 个未用号区分新一轮）。
      - item:
          id: sws-limit
          type: number
          prompt: 协议用 3 个比特编序号（可用序号 0 到 7，共 8 个）。如果收端支持缓存乱序帧且令 RWS = SWS，为了绝不把重发的旧帧误当成新帧，发送窗口 SWS 最大能设为多少？
          answer: 4
          explain: 当 MaxSeqNum = 8 且 RWS = SWS 时，要求 SWS < (8 + 1) / 2 = 4.5，所以最大整数是 4（旧窗口 0..3 与新窗口 4..7 完全不重叠）。
      - item:
          id: cumulative-ack
          type: choice
          prompt: 滑动窗口协议用累计确认，接收端依次收到了序号 1、2、4、5（第 3 号包在路上丢了）。接收端给发送端回累计确认时，应当确认到哪一号（或期待下一号）？
          options:
            - text: 确认已连续收齐到 2（期待下一号 3），不能跳过 3 确认 5
              correct: true
            - text: 直接确认 5，因为 5 是目前收到的最大编号
              why: 累计确认一旦报出 5，发送端就会以为 3 也已经收到了，永远不会重传 3
            - text: 什么都不回，等 3 到了再一起确认
              why: 及时回“期待 3”能让发送端知道 3 可能丢了（连续收到重复的 ACK 就能触发快速重传）
          explain: 累计确认必须严格止于第一个缺口之前，否则发送端会误以为缺口里的数据已经安全送达。

  - id: shared-media
    chapter: 链路/IP/TCP/UDP
    title: 共享介质：以太网与 Wi-Fi
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一间教室里十个人同时想大声说话，大家共用同一片空气。要是两个人同时开口，最好怎么办？
          options:
            - text: 立刻都闭嘴，各自等一段随机的时间再开口
              correct: true
            - text: 谁声音大就继续喊，把别人盖过去
              why: 信号在电线上叠加会互相毁掉，两边的话谁都听不清
            - text: 每次冲突后固定都等整整 1 秒再同时开口
              why: 两个人等一样长的时间，1 秒后又会再撞一次
          explain: 共用同一信道时，边说边听、撞了就退让并随机等一会儿，这正是早期以太网 CSMA/CD 的核心思想。
      - card:
          title: 以太网帧与 MAC 地址
          body: |
            IEEE 802.3 以太网是局域网的主力。每张网卡出厂都有全球唯一的 48 位 **MAC 地址（MAC address）**（6 字节十六进制，如 `08:00:20:03:04:05`，前 24 位是厂商前缀）。

            全 1 的 `ff:ff:ff:ff:ff:ff` 代表**广播（broadcast）**：这一局域网里所有主机都得收下。以太网帧结构是：64 位前导码（不计入主机看到的首部）+ 14 字节首部（目的 MAC 6 + 源 MAC 6 + 2 字节类型）+ 46–1500 字节载荷 + 4 字节 CRC-32。
      - item:
          id: eth-min-frame
          type: number
          prompt: 以太网规定除前导码外，最短一帧（目的 MAC + 源 MAC + 类型 + 载荷 + 4 字节 CRC）必须是 64 字节（512 比特）。如果上层只发 10 字节的数据，以太网必须在载荷末尾填充多少字节？
          answer: 36
          explain: 14 字节首部 + 4 字节 CRC = 18 字节，因此载荷至少要有 64 - 18 = 46 字节。只给了 10 字节，必须补 46 - 10 = 36 字节填充。
      - card:
          title: 为什么以太网帧不能短于 512 比特（CSMA/CD）
          body: |
            早期共享同轴电缆时，主机用 **CSMA/CD（带冲突检测的载波监听多路访问）**：先听线路闲不闲，闲了就发；边发边听，一旦撞车就发 32 位拥塞信号通知全网并停下。

            为什么帧至少要 512 比特？10 Mbps 以太网最大跨度 2500 米（最多 4 个中继器），最坏单程延迟 $d$、最迟在 **$2d = 51.2\,\mu\text{s}$** 时才知道最远端撞了车。如果帧在 $51.2\,\mu\text{s}$（正好 **512 比特**）前就发完了，发送方就会误以为发送成功！
      - card:
          title: 冲突后退避：二进制指数退避
          body: |
            撞车停下后，第 $n$ 次冲突（$n$ 最大算到 10），适配器从 $0$ 到 $2^n - 1$ 之间随机挑一个整数 $k$，等待 **$k \times 51.2\,\mu\text{s}$** 再重发；连续 16 次还失败就向系统报错。冲突越多，随机等待的上限翻倍拉宽，降低再次同时撞车的概率。
      - item:
          id: backoff-range
          type: number
          prompt: 一台早期以太网主机连续发生了 3 次发送冲突（$n = 3$）。按二进制指数退避规则从 $[0, 2^n - 1]$ 中挑选整数 $k$，一共有多少种不同的 $k$ 值可选？
          answer: 8
          explain: 2 的 3 次方减 1 等于 7，从 0 到 7 一共有 8 个可选整数（0, 1, 2, 3, 4, 5, 6, 7）。
      - card:
          title: Wi-Fi 的难处：隐藏终端与 CSMA/CA
          body: |
            无线网络（802.11 / Wi-Fi）没法在发射的同时听清远处的微弱信号（自己发出的电波太大声把接收天线淹没了），而且电波传不穿墙还会遇到**隐藏终端**：

            ```text
            A -----> (B) <----- C
            ```
            A 和 C 都够得着中间的路由器 B，但 A 和 C 互相听不到对方。A 以为空中没人，直接给 B 发，结果和正在发给 B 的 C 在 B 处撞车。
      - card:
          title: 冲突避免：显式 ACK 与 RTS/CTS
          body: |
            所以 Wi-Fi 改用 **CSMA/CA（冲突避免）**：
            1. 只有收到接收方发回的**显式 ACK**，才算发成功（否则按指数退避重传）。
            2. 可选 **RTS/CTS**：A 发前先向 B 发短消息 RTS（里面写着本次通信要占用多久）；B 回发 CTS。C 虽然听不见 A，却听得见 **B 发出的 CTS**，于是乖乖闭嘴等待那段时间，避开冲突。
      - item:
          id: wifi-hidden
          type: choice
          prompt: 在隐藏终端场景 `A --> B <-- C` 中，A 和 C 互相听不见对方，只能各自听见中间节点 B。用 RTS/CTS 机制时，是什么消息让 C 知道“接下来一段时间内别给 B 发数据”？
          options:
            - text: B 广播回复给 A 的 CTS 控制帧（C 能听见 B 的信号并读出占用的时长）
              correct: true
            - text: A 发给 B 的 RTS 控制帧（C 在收到 RTS 后主动让路）
              why: C 就在 A 的覆盖范围之外，根本听不见 A 发出的 RTS
            - text: C 边发数据边监听 B 处是否发生电压叠加碰撞
              why: 无线电发射信号比接收信号强得多，节点无法边发边检测接收端是否碰撞
          explain: 关键在于“接收端 B 发出的 CTS”能被 B 周围的所有邻居（包括听不见 A 的 C）听到，CTS 里携带的持续时间会让 C 保持静默。

  - id: switching-vlan
    chapter: 链路/IP/TCP/UDP
    title: 交换式以太网、生成树与 VLAN
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 现代办公室的电脑不再共用一根同轴电缆，而是各自插到一台以太网交换机的不同端口上。交换机刚开机时，转发表还是空的，这时收到发给机器 B 的帧会怎么办？
          options:
            - text: 除了进来的端口外，向其他所有端口复制发送（泛洪），同时记住发送方的端口
              correct: true
            - text: 直接丢掉这帧，直到管理员手工把所有机器的 MAC 表填进去
              why: 以太网交换机是即插即用的，不需要管理员手工配置每台电脑的 MAC 地址
            - text: 给发件人回一个报错包说查无此人
              why: 交换机只转发帧，不自己构造三层报错
          explain: 交换机一收到帧就先记下“源 MAC 在哪个端口”，目的地未知时就向其他端口泛洪，这样不用配置也能很快学全整张表。
      - card:
          title: 交换转发的两种思路：数据报与虚电路
          body: |
            多台交换机连成网络，转发有两类经典方式（教材 3.1 节）：
            - **数据报交换（无连接）**：每个包自带完整目的地址，交换机逐包查表，不提前建路。IP 和以太网都走这条路。
            - **虚电路交换（面向连接）**：先花至少一个往返建立一条逻辑通路，在沿途各台交换机登记“入端口 + 入虚电路号 VCI $\to$ 出端口 + 出 VCI”的映射（VCI 只在单条链路上局部有效），之后数据包只带短小的 VCI 转发。
      - item:
          id: vc-vs-datagram
          type: choice
          prompt: 在虚电路交换网络里，一条连接依次穿过交换机 S1、S2、S3，同一组数据包上携带的虚电路号 VCI 通常是怎样的？
          options:
            - text: 每经过一条链路都可以由交换机按映射表换成下一段链路上的局部 VCI
              correct: true
            - text: 全世界必须统一给这条连接分配一个绝不重复的永久全局 VCI
              why: VCI 只在单条物理链路上局部有效，不同链路可以独立编号，免去了全局号冲突
            - text: 数据包里只写最终收件人的 128 位地址，完全不写任何电路编号
              why: 带完整目的地址逐包查表的是数据报交换，不是虚电路
          explain: 虚电路提前沿着路径在每台交换机建好 `(入端口, 入VCI) → (出端口, 出VCI)` 表项，所以 VCI 只需链路上局部唯一。
      - card:
          title: 例题：交换机怎么靠自学习建 MAC 表
          body: |
            一台 3 口交换机刚开机，转发表为空。接在端口 1 的主机 A、端口 2 的 B、端口 3 的 C 依次发帧：
          reveal:
            - title: 第 1 步：端口 1 收到 A -> B 的帧
              body: '交换机先学源地址：记下 `{A: 端口 1}`。查目的地址 B，表里没有！于是向除端口 1 外的**端口 2 和端口 3 泛洪**。'
            - title: 第 2 步：端口 2 收到 B -> A 的回信
              body: '先学源地址：记下 `{B: 端口 2}`。查目的地址 A，表里已有 `{A: 端口 1}`！于是**只从端口 1 单播送出**，端口 3 不会收到。'
            - title: 第 3 步：表项会过期，广播帧永远泛洪
              body: 电脑拔掉换口后表项不能一直留着，教材例子里每条记录约 120 秒没人用就老化删掉；目的 MAC 为广播地址 `ff:ff:ff:ff:ff:ff` 时永远向其余端口泛洪。
      - item:
          id: switch-learn
          type: choice
          prompt: 一台 4 口以太网交换机初始转发表为空。先从端口 1 收到“源 X → 目的 Y”的帧，接着从端口 3 收到“源 Y → 目的 X”的帧，再从端口 2 收到“源 Z → 目的 Y”的帧。第三帧从哪些端口发出去？
          options:
            - text: 只从端口 3 发出去
              correct: true
            - text: 从端口 1、3、4 一起泛洪出去
              why: 第二帧进来时，交换机已经从源地址学到了 Y 在端口 3
            - text: 从端口 1 和端口 3 发出去
              why: Z 要找的是 Y，与 X 无关；第一帧时只学到了 X 在端口 1
          explain: 第 1 帧学到 `{X:1}` 并泛洪；第 2 帧学到 `{Y:3}` 并单播去端口 1；第 3 帧查表已知 `{Y:3}`，直接只走端口 3，同时学到 `{Z:2}`。
      - card:
          title: 环路会引发广播风暴：生成树协议
          body: |
            为了怕一条网线断掉，机房常把几台交换机连成一个圈。可一旦有圈，广播帧（比如刚开机找不到目的地）就会在圈里一圈一圈永远复制下去，瞬间把网络塞死（广播风暴）。

            **生成树协议（IEEE 802.1D）**让交换机互发配置消息 `(发送方ID, 认为的根ID, 到根跳数)`：选编号最小的交换机当**根网桥**，每个网段选离根最近的端口转发，**堵住多余的环路端口**。代价是冗余链路平时闲着，不能做负载均衡。
      - item:
          id: stp-cmp
          type: choice
          prompt: 交换机 S3 同时从两个端口收到配置消息：消息甲是 `(S2, root=S1, 2 跳)`，消息乙是 `(S4, root=S1, 1 跳)`。按生成树规则，哪一条更优？
          options:
            - text: 消息乙，因为根相同且到根跳数 1 比 2 短
              correct: true
            - text: 消息甲，因为发送方编号 S2 比 S4 小
              why: 只有在“根 ID 相同且到根跳数也相同”平局时，才比较发送方 ID 谁更小
            - text: 两条都要保留同时转发，用来分担流量
              why: 同时保留两条路径会留下环路，生成树必须只选最优的一条通路、阻塞另一条
          explain: 生成树比较优先级依次为：1. 根 ID 更小；2. 到根距离更短；3. 发送方 ID 更小。所以 1 跳的乙胜出。
      - card:
          title: VLAN：在一台交换机里隔出多张独立局域网
          body: |
            同一组相连交换机能到达的所有主机合称一个**广播域**，规模大了又慢又不安全（财务部不想收到研发部的广播包）。

            **VLAN（虚拟局域网，802.1Q）**在以太网帧里打上 12 位的标签。同一台交换机上的端口按标签分进不同 VLAN（比如红组和蓝组），广播帧只在同一组端口内转发；跨组通信必须经过路由器按策略放行，这正是以后分网隔离的基础。
      - item:
          id: vlan-effect
          type: choice
          prompt: 主机 A 在交换机的 VLAN 10，主机 B 在同一台交换机的 VLAN 20。A 发出一条链路层广播帧（目的 MAC 全 F），B 能收到吗？
          options:
            - text: 收不到，同一交换机里的不同 VLAN 是隔离的广播域
              correct: true
            - text: 能收到，因为它们物理上插在同一台交换机里
              why: VLAN 正是在同一台物理交换机内部逻辑上隔开广播域的
            - text: 只有 A 的 IP 和 B 在同一前缀时才能收到
              why: 交换机看链路层 VLAN 标签转发，不看 IP 前缀
          explain: 一个 VLAN 就是一个独立的广播域，广播帧绝不会越过 VLAN 边界跑进另一个 VLAN。

  - id: ip-cidr
    chapter: 链路/IP/TCP/UDP
    title: IPv4 分组、分片与 CIDR 子网划分
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个 1400 字节的 IP 包在路上碰到一段只允许每帧最多装 532 字节（含 20 字节 IP 头）的链路，路由器把它切成了 3 片发出去。这 3 片在下一跳又遇到更宽的链路，途中的路由器会立刻把它们拼回原样吗？
          options:
            - text: 不会，IP 分片只在最终目的主机上重新组装
              correct: true
            - text: 下一台路由器一定会全部等齐了拼好再往下发
              why: 途中 3 个分片甚至可能走不同的路到达，中间路由器根本不一定全看得到，也太占内存
            - text: 路由器遇到太大的包会直接删掉，绝不会切分
              why: IPv4 允许路由器在允许分片时切包（IPv6 才禁止中间路由器分片）
          explain: 互联网是“尽力而为、无连接”的，分片可能各自绕路，只有终点主机才一定能集齐所有分片并重组。
      - card:
          title: IPv4 分组头里的关键字段与分片
          body: |
            IPv4 是无连接、尽力而为的服务（可能丢包、乱序或重复）。无选项的 IPv4 首部固定 **20 字节**（`HLen = 5` 个 32 位字）：
            - **TTL（生存时间，常见默认 64）**：每经过一台路由器减 1，减到 0 就丢弃，防止包因路由环路永远在网里转圈。
            - **协议号（Protocol）**：告诉接收端把载荷交给谁（**TCP = 6，UDP = 17**）。
            - **标志与片偏移**：包超过该链路允许单帧携带的字节上限——**MTU（最大传输单元，以太网通常 1500 字节）**——就必须切开分片，偏移以 **8 字节为单位**。丢了一片，整包作废。
      - item:
          id: ipv4-frag
          type: number
          prompt: 一个总长 1400 字节的 IPv4 包（20 字节首部 + 1380 字节载荷）进入 MTU 为 532 字节的链路，每个分片带 20 字节首部和最多 512 字节载荷。第 1 片载荷偏移为 0，第 2 片的片偏移（以 8 字节为单位）字段是多少？
          answer: 64
          explain: 第 1 片装了前 512 字节载荷，第 2 片从第 512 字节开始；片偏移以 8 字节为单位，512 / 8 = 64（第 3 片则为 1024 / 8 = 128）。
      - card:
          title: 子网与 CIDR：用 /n 划清网络前缀
          body: |
            早年把 IPv4 死板地分成 A/B/C 三类，255 台主机的网络得拿 65534 个地址的 B 类，浪费率超 99%。

            如今全用 **CIDR（无类别域间路由）**：把 32 位 IP 写成 `a.b.c.d/n`，代表前 $n$ 位是网络前缀，其余 $32 - n$ 位是主机号。共享同一前缀的叫一个**子网（subnet）**。用 32 位掩码（高 $n$ 位全 1、低 $32-n$ 位全 0）和 IP 做按位与（`&`），就能算出网段地址。
      - card:
          title: 演示：用 Python 位运算切出子网边界
          body: |
            手算 `192.168.10.77/26` 其实就是先把地址拼成 32 位整数，再和 `/26` 掩码做按位与。运行这段代码看看网络地址、广播地址和可用主机数怎样算出来：
          sim:
            name: trace
            params:
              code: |
                ip = (192 << 24) | (168 << 16) | (10 << 8) | 77
                mask = (0xFFFFFFFF << (32 - 26)) & 0xFFFFFFFF
                net = ip & mask
                bcast = net | (~mask & 0xFFFFFFFF)
                net_last = net & 0xFF
                bcast_last = bcast & 0xFF
                usable = (bcast - net) - 1
              stdin: ''
      - item:
          id: trace-cidr
          type: sim
          sim: trace
          params:
            code: |
              ip = (192 << 24) | (168 << 16) | (10 << 8) | 77
              mask = (0xFFFFFFFF << (32 - 26)) & 0xFFFFFFFF
              net = ip & mask
              bcast = net | (~mask & 0xFFFFFFFF)
              net_last = net & 0xFF
              bcast_last = bcast & 0xFF
              usable = (bcast - net) - 1
            stdin: ''
          goal:
            ask:
              - line: 5
                var: net_last
                hit: 1
              - line: 6
                var: bcast_last
                hit: 1
              - line: 7
                var: usable
                hit: 1
          prompt: 观察代码单步执行完第 5、6、7 行后：`192.168.10.77/26` 的网络地址最后一段 `net_last`、广播地址最后一段 `bcast_last` 以及可用主机数 `usable` 分别是多少？
          explain: '`/26` 主机位有 32 - 26 = 6 位，每块 64 个地址（0..63, 64..127, 128..191, 192..255）。77 落在 64..127，所以网络地址末段 64，广播末段 127，扣掉全 0（网段本身）和全 1（广播）剩 62 个可用主机（.65 到 .126）。'
      - card:
          title: 例题：30 秒心算 CIDR 子网边界
          body: |
            不打开 Python，也能三步心算出 `192.168.10.150/26` 或 `/27` 的所有边界：
          reveal:
            - title: 第 1 步：算主机位数与每块大小
              body: 对 `/n`，主机位有 $h = 32 - n$ 位；如果 $n \ge 24$，都在最后一段内分块，块大小是 $2^{32-n}$。如 `/26` 是 $2^6 = 64$，`/27` 是 $2^5 = 32$。
            - title: 第 2 步：找该主机号落入哪个块
              body: '`/26` 的块起点依次是 0、64、128、192。150 落在 `128..191` 这一块。'
            - title: 第 3 步：读出四项结果
              body: 块起点 `192.168.10.128` 是网络地址，块终点 `.191` 是子网广播地址，中间的 `.129` 到 `.190` 共 $64 - 2 = 62$ 个给普通主机用。
      - item:
          id: cidr-block-step
          type: number
          prompt: 先练第一步找块大小：`192.168.10.0/26` 的子网一共有多少个总地址（含网络地址和广播地址）？
          answer: 64
          explain: 主机位有 32 - 26 = 6 位，每块大小是 $2^6 = 64$ 个地址。
      - item:
          id: cidr-hosts
          type: number
          prompt: 一个常规的 IPv4 `/27` 子网（掩码 `255.255.255.224`），扣除全 0 的网络地址和全 1 的广播地址后，最多能分配给几台普通主机？
          answer: 30
          explain: '`/27` 留下 32 - 27 = 5 个主机位，共 $2^5 = 32$ 个地址，减去首尾 2 个保留地址，剩 30 个可用地址。'
      - item:
          id: cidr-netaddr
          type: text
          prompt: 已知主机 IP 是 `192.168.10.200/26`，它所在子网的网络地址是什么？（写出完整点分十进制，如 `192.168.10.0`）
          answers: ['192.168.10.192']
          explain: '`/26` 块大小为 64，分块是 `0..63`、`64..127`、`128..191`、`192..255`。200 落在最后一块，所以网络地址是 `192.168.10.192`。'

  - id: arp-dhcp-icmp
    chapter: 链路/IP/TCP/UDP
    title: 本地找路：ARP、DHCP、NAT 与 ICMP
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你的笔记本想给远在太平洋另一端的服务器 `93.184.216.34` 发一个 IP 包，家里路由器就在桌边。笔记本发送的以太网帧里，“目的 MAC 地址”应该填谁？
          options:
            - text: 填家里默认网关路由器的 MAC 地址
              correct: true
            - text: 填远处服务器的 MAC 地址
              why: MAC 地址只在同一局域网内有效，路由器隔开了不同广播域，你的电脑根本收不到远处服务器的 MAC
            - text: 填广播地址 ff:ff:ff:ff:ff:ff 让路由器自己挑
              why: 用网关 MAC 单播送过去就行，用广播会让局域网所有其他设备白白处理
          explain: 帧只走“这一跳”：IP 目的填终点服务器，MAC 目的填下一跳网关！
      - card:
          title: ARP：把下一跳的 IP 翻译成 MAC 地址
          body: |
            把内网连接到外网的那台出口路由器，叫本地子网的**默认网关（default gateway）**。本地网线只认 48 位 MAC 地址，不认 32 位 IP。怎么查出同网段邻近设备或默认网关的 MAC？靠 **ARP（地址解析协议）**。

            本机先查本地缓存；没查到就在局域网发广播问“谁是 `192.168.1.1`？”。对方单播回 MAC。**注意：传统 ARP 没有任何身份认证**，同一局域网任何设备都能抢答假回复——这正是以后要防的伪造 ARP 应答攻击。
      - item:
          id: arp-target
          type: choice
          prompt: 主机 A（`192.168.1.10/24`）要发数据给不同网段的服务器 S（`203.0.113.5`），已知本地默认网关是 `192.168.1.1`。主机 A 的 ARP 缓存为空时，发出的 ARP 广播询问哪个 IP？
          options:
            - text: 询问默认网关 `192.168.1.1` 的 MAC 地址
              correct: true
            - text: 询问远端服务器 `203.0.113.5` 的 MAC 地址
              why: 路由器不会把本地 ARP 广播转发到外网，问远端 IP 永远得不到回复
            - text: 询问本机自己的 `192.168.1.10` 的 MAC 地址
              why: 本机早就知道自己的网卡 MAC 地址
          explain: 用子网掩码算出目的 IP 不在同一子网后，主机只负责把帧交给默认网关，所以 ARP 查网关 IP，而 IP 包头里的目的地址仍写 `203.0.113.5`。
      - card:
          title: DHCP：新设备进门自动领地址（DORA）
          body: |
            手机连上新 Wi-Fi 时还没有 IP，靠 **DHCP（Dynamic Host Configuration Protocol）** 四步租约过程领用配置（常简记为 DORA）：
            1. **DISCOVER**：手机往本地广播地址 `255.255.255.255` 喊“有没有 DHCP 服务器？”。
            2. **OFFER**：服务器挑一个空闲 IP 报价发回。
            3. **REQUEST**：手机回应“我要租这个 IP”（免得多台服务器报价打架）。
            4. **ACK**：服务器正式确认租约。
      - item:
          id: dhcp-order
          type: order
          prompt: 把主机刚接入局域网时通过 DHCP 获取 IP 配置的四步交互排好顺序。
          steps:
            - 客户端广播 DHCPDISCOVER 寻找服务器
            - 服务器发回 DHCPOFFER 提供候选 IP
            - 客户端发出 DHCPREQUEST 确认选用该报价
            - 服务器回发 DHCPACK 正式下发租约与网关/DNS 参数
          explain: 记为 D-O-R-A。由于路由器不转发 255.255.255.255 的受限广播，如果 DHCP 服务器在另一个子网，必须靠本子网的中继代理转发。
      - card:
          title: DHCP 下发的参数与跨子网中继
          body: |
            最后一封 `DHCPACK` 不只给一个 IP 地址，还一并下发**子网掩码、默认网关和 DNS 服务器地址**——少任何一项，主机都连不上外网或查不到域名。

            因为 `255.255.255.255` 广播传不出本局域网，大公司不必每个子网都放一台服务器：只需在路由器或网段里配一个 **DHCP 中继代理**，把本地广播改写成单播转送给远处的中心 DHCP 服务器。
      - item:
          id: dhcp-relay
          type: choice
          prompt: 某大学有 20 个教学楼子网，却只在中心机房放了一台 DHCP 服务器。各个教学楼的主机靠什么领到 IP？
          options:
            - text: 每个子网配置 DHCP 中继代理，把本地收到的 DISCOVER 广播转成单播发往中心服务器
              correct: true
            - text: 路由器把 `255.255.255.255` 广播直接泛洪转发到全校所有楼栋
              why: 路由器默认绝对禁止转发全网受限广播 `255.255.255.255`，否则全校广播立刻泛滥
            - text: 主机自己先随便猜一个 IP 发单播去找中心服务器
              why: 刚入网的主机连中心服务器的 IP 和默认网关都不知道，必须先在本地发广播找中继
          explain: 靠中继代理把二层本地广播“接力”成三层单播，全网只需集中维护少数几台 DHCP 服务器。
      - card:
          title: NAT 与 ICMP：公网共享和道路报错
          body: |
            - **NAT（网络地址转换）**：公网 IPv4 不够每人分一个，路由器让内网设备用私有地址（如 `192.168.x.x`、`10.x.x.x`），出门时把内网的 `(私网 IP, 源端口)` 改写成 `(路由器公网 IP, 新分配端口)` 并记在映射表里，回包时再改回来。
            - **ICMP（互联网控制报文协议）**：网络层的小信使，向源端报告差错或探测连通性：`ping` 用回显请求/应答；`traceroute` 故意把 TTL 从 1、2、3… 往上加，靠沿途路由器返回“TTL 超时”暴露每一跳；**ICMP 重定向**则告诉主机同网段有另一台更近的路由器。
      - item:
          id: nat-icmp-match
          type: match
          prompt: 把现象或机制和对应协议配对。
          pairs:
            - [用本地广播查询下一跳 IP 对应的 MAC 地址, ARP]
            - [给刚连上 Wi-Fi 的手机自动分配 IP 和 DNS 地址, DHCP]
            - [把内网私有 IP 和源端口改写成共用公网 IP 和端口, NAT]
            - [在 TTL 减到 0 时向发送端报告包已超时丢弃, ICMP]
          explain: ARP 解析本地 MAC，DHCP 租用入网配置，NAT 让多台内网主机共用少量公网 IP，ICMP 负责网络层差错与诊断通知。

  - id: ipv6-multicast
    chapter: 链路/IP/TCP/UDP
    title: IPv6 与组播
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: IPv4 一共 32 位，最多约 43 亿个地址，早就分完了。为了彻底解决地址不够用，IPv6 把地址从 32 位扩到 128 位，还顺便把每台路由器都得重算的首部校验和删掉了。为什么敢删 IP 头的校验和？
          options:
            - text: 链路层（CRC）和传输层（TCP/UDP 校验和）已经各自校验过了，路由器不用再每跳重算
              correct: true
            - text: 128 位太长了，发生比特错误也不可能改坏关键字段
              why: 物理干扰随时会发生，地址长不会免疫比特翻转
            - text: 只要改用光纤，网络就不会出现任何比特错误
              why: 光纤误码率虽低但仍非零，而且中间还有很多铜线和无线路段
          explain: IPv4 每跳把 TTL 减 1 就得重新算一次首部校验和，拖慢高速路由器；IPv6 去掉这步，让链路层和端到端传输层各自负责纠错检错。
      - card:
          title: IPv6 的 128 位地址与固定 40 字节首部
          body: |
            IPv6 地址长 **128 位**（$2^{128} \approx 3.4 \times 10^{38}$ 个），写成 8 组十六进制数，允许用 `::` 缩写一处连续的全 0 段（只能用一次，否则长度推不出来）：如环回地址 `::1`，本地链路前缀 `fe80::/10`（可用固定前缀拼上接口标识无状态自动配出地址）。

            IPv6 基础首部永远固定 **40 字节**：把不常改的选项挪去链表式的**扩展首部**（靠 `NextHeader` 字段串起来，如 6=TCP、44=分片、51=认证）；把 `TTL` 改名 `HopLimit`；**中间路由器从不分片**，包太大就丢包并回 ICMPv6 通知发送端用**路径 MTU 发现**缩小包长。
      - item:
          id: ipv6-diff
          type: choice
          prompt: 与 IPv4 相比，关于 IPv6 基础首部和转发规则，下面哪一项说法是正确的？
          options:
            - text: IPv6 基础首部固定 40 字节且没有首部校验和，途中路由器不再替发送端分片
              correct: true
            - text: IPv6 因为地址变成 4 倍长，首部长度也是可变的 20 到 60 字节
              why: 可变首部和选项正是 IPv4 路由器处理慢的原因之一；IPv6 刻意把基础首部固定在 40 字节
            - text: IPv6 允许把每个全 0 段都用 `::` 省略好几次以进一步缩短写法
              why: 一个地址里 `::` 最多只能出现一次，出现两次就无法确定每段补多少组 0
          explain: 固定 40 字节、去掉首部校验和、将选项与分片移至扩展首部并由源端负责分片，都是为了简化高速路由器的转发路径。
      - card:
          title: 组播：一发多收不把链路线挤爆
          body: |
            万一要给一万名观众同时发同一场直播流，发一万份单播太占带宽，发全网广播又会吵到不看的人。**组播（multicast）**让想看的观众先用组成员协议（IPv4 用 **IGMP**、IPv6 用 **MLD**）向本地路由器报告“我要加入某组播组”（IPv4 的 D 类地址 `224.0.0.0/4`）。

            路由器只在必要分支点复制数据，避免源服务器重复发送上万份。
      - card:
          title: 逆向路径检查与 PIM-SM 会合点转发
          body: |
            组播最怕包在网络环路里越复制越多。路由器收到源为 `S` 的组播包时做**逆向路径转发（RPF）**检查：只收从“回到 `S` 的最短路接口”进来的包，其余接口绕路进来的直接丢掉。

            在稀疏组播协议 **PIM-SM** 中，观众的路由器先向**会合点（RP）**发 `Join` 搭起共享树 `(*,G)`；流量一大，再切到直接连往发送源的最短路径树 `(S,G)`。
      - item:
          id: pim-tree
          type: choice
          prompt: 观众主机通过 IGMP 刚加入一个稀疏模式组播组 G（PIM-SM），还没有拿到某个特定发送源 S 的高速直连树时，路由器先把流沿着什么路径送过来？
          options:
            - text: 先沿着通往公用会合点（RP）的共享树 `(*,G)` 送来，流量大后再切到连向源的最短路径树 `(S,G)`
              correct: true
            - text: 让每个观众直接向全网每一台路由器周期泛洪“我要看直播”
              why: 稀疏模式特意通过统一的会合点 RP 汇合订阅，避免向全网无差别泛洪
            - text: 发送端为每个加入的观众分别开一条单播 TCP 连接逐一发送
              why: 一对一发单播会失去组播节省骨干带宽的意义
          explain: PIM-SM 先靠共享树 `(*,G)` 把少众订阅聚在会合点，确认有稳定流量后各路由器再向源 `S` 切换更短的 `(S,G)` 树。
      - card:
          title: IPv4 组播映射到以太网 MAC 的小细节
          body: |
            一个 IPv4 组播地址有 28 位组号，但 IEEE 给以太网组播留的映射槽位只有低 **23 位**（`01:00:5e:` 开头加 23 位）。这意味着每 **$2^{28-23} = 32$ 个**不同的 IP 组播地址会撞到同一个以太网 MAC 地址，主机网卡放行后，操作系统 IP 层还要再对照一次真正的 32 位 IP。
      - item:
          id: mcast-mac-collision
          type: number
          prompt: IPv4 组播地址的低 28 位有效，但以太网组播 MAC 地址只保留了其中低 23 位做映射。会有多少个不同的 IPv4 组播地址映射到同一个以太网 MAC 地址？
          answer: 32
          explain: 丢掉了高出的 28 - 23 = 5 位，这 5 位任意组合共有 $2^5 = 32$ 个 IP 组播地址撞在同一个以太网 MAC 地址上。
      - item:
          id: multicast-rpf
          type: choice
          prompt: 组播路由器收到一份源为 S 的组播包时，为什么要做“逆向路径转发（RPF）”检查？
          options:
            - text: 只收从“往 S 走最短路径的那个接口”进来的包，避免同一份组播在网里兜圈复制
              correct: true
            - text: 验证发送者的数字签名，防止别人冒充源 S 发假数据
              why: RPF 只核对入接口是不是到达 S 的最短路径方向，本身不包含密码学签名校验
            - text: 统计当前有多少台观众正在看直播，用来计算流量费用
              why: 观众人数由本地路由器用 IGMP/MLD 探知，RPF 只负责过滤多余绕路的组播包防环
          explain: RPF 利用单播路由表的“到 S 怎么走”，只放行来自最短路径方向的那一份副本，其它接口收到的绕路副本直接丢弃，天然消除环路和重复。

  - id: udp-rpc-rtp
    chapter: 链路/IP/TCP/UDP
    title: UDP、RPC 与实时传输 RTP
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 打语音电话时，0.5 秒前的一帧声音半路丢了。如果像下载文件那样一定要等对方重传补齐这一帧再往下播，听起来会怎样？
          options:
            - text: 整通电话会卡住等待，等补到时那半秒已经过时，反而把后面的话全都拖慢了
              correct: true
            - text: 语音会变得一模一样清楚，完全没有延迟感
              why: 等待重传至少多耗一个往返时间，实时对话会明显卡顿滞后
            - text: 手机会自动把丢失的话重新猜出来
              why: 协议层不会凭空捏造内容，只能跳过或做简单的静音平滑
          explain: 实时音视频宁可丢一小格声音，也要保证紧跟着的新话准时播出来，这就是为什么不总是用可靠传输。
      - card:
          title: 端口号与极简的 UDP
          body: |
            一台主机同时跑着浏览器和 DNS 查询，靠传输层 16 位**端口（port）**（0–65535，如 DNS 常用 53、HTTP 用 80）区分交给哪个程序。

            **UDP**（协议号 17）只比 IP 多一个 **8 字节首部**（源端口、目的端口、长度、校验和各 2 字节）。它保留每次发送的消息边界、不建连接也不重传。其校验和覆盖“伪首部（含源/目的 IP）+ 头 + 数据”，IPv4 可选、IPv6 强制。
      - item:
          id: udp-header
          type: number
          prompt: UDP 首部由源端口、目的端口、长度和校验和四个 16 位字段组成。加上 20 字节无选项的 IPv4 首部，一个仅装 12 字节数据的 UDP/IPv4 包总共有多少字节？
          answer: 40
          unit: 字节
          explain: 20（IPv4 头）+ 8（UDP 头）+ 12（数据）= 40 字节。
      - card:
          title: RPC：把网络请求包装成函数调用
          body: |
            写业务程序时不想手工拼字节，可以用 **RPC（远程过程调用）**：本地“桩代码”把参数打包发给远端，远端执行完把结果送回（回复本身就顺带当了确认）。

            网络会丢包也会重启，如果客户端没收到回复就重传一次：
            - **至多一次（at-most-once）**：服务端记下 `(客户端, 消息 ID)`，再加上每次开机变的 `boot ID`，发现重复请求直接回旧结果而不重跑一遍。
            - 如果不做去重（可能跑 0 次或多次），就只适合像“把余额设为 100”这种重复做结果也一样的**幂等**操作。
      - item:
          id: rpc-idempotent
          type: choice
          prompt: 网银服务端没有记录请求去重，客户端把下面哪个操作超时后直接重发一次，最可能造成严重错误？
          options:
            - text: 从账户 A 向账户 B 转账 500 元
              correct: true
            - text: 查询账户 A 当前余额是多少
              why: 查两次余额还是同一个结果，只读查询天然幂等
            - text: 把用户头像编号设置为 7
              why: 设为 7 做一次和做十次状态都一样，也是幂等的
          explain: 转账会累计扣款，是非幂等操作；若原请求其实已成功只是回信丢了，盲目重发会转出双倍金额，必须靠唯一消息号实现至多一次语义。
      - card:
          title: RTP：跑在 UDP 之上的实时传输格式
          body: |
            语音和直播经常在 UDP 上再加一层 **RTP（实时传输协议）**（固定前 **12 字节**首部含版本号、载荷类型、16 位序号、32 位采样时间戳和 32 位同步源编号 **SSRC**，用来识别哪路音频流）。

            注意 RTP 用一个偶数端口传媒体流，紧挨着的**下一个奇数端口**跑控制协议 RTCP 汇报丢包和抖动。RTP 自己**不重传**丢掉的包，只让收端看序号发现丢包、看时间戳按匀速把声音平滑放出来（应用层成帧，把容忍局部丢失的权利留给音视频解码器自己）。
      - item:
          id: udp-rpc-rtp-match
          type: match
          prompt: 把机制和它的作用配对。
          pairs:
            - [16 位源和目的端口号, 把数据报准确分交给同一主机上的不同程序]
            - [RPC 里的消息 ID 与开机 ID, 识别重发请求或服务器重启后的旧包]
            - [RTP 里的 32 位时间戳, 让接收方忽略网络抖动按正确播放节奏还原音视频]
            - [UDP 伪首部校验和, 顺带核对 IP 地址是否被写错或破坏]
          explain: 端口做程序解复用，消息 ID / boot ID 防 RPC 重复执行或跨重启混乱，RTP 时间戳对齐播放时机，UDP 伪首部连带保护了源目的 IP。

  - id: tcp-reliable
    chapter: 链路/IP/TCP/UDP
    title: TCP：三次握手、四次挥手与可靠字节流
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 假想 TCP 建连只用两步：客户发一个连接请求说“我要连”，服务器回完确认就立刻分配好内存开干。如果客户早先发过的一张旧请求包在网里堵了 20 秒才晃到服务器，而客户早就下线了，会怎样？
          options:
            - text: 服务器误以为客户又来建新连接，白白开着内存干等，客户却根本不理它
              correct: true
            - text: 服务器会自动立即发探测包把旧连接关掉，完全不浪费资源
              why: 服务器刚刚“建立”连接正在正常等客户发第一条数据，在长达几十秒的超时前都会一直占着连接表项
            - text: 只要两次交互就绝对不会把旧请求当成新连接
              why: 没有第三步来自客户的最终回执，服务器分不清收到的是刚发的请求还是网上迟到的旧包
          explain: 这就是为什么建连至少要三次往来——最后由客户端再确认一次“这个请求确实是我刚刚发起的”。
      - card:
          title: TCP 与面向字节流的四元组
          body: |
            **TCP（传输控制协议，协议号 6）**一条连接由**四元组 `(源 IP, 源端口, 目的 IP, 目的端口)`**唯一确定（同一服务器的 80 端口可以同时服务上万位不同客户）。

            与 UDP 保消息边界不同，TCP 对应用层是一条连续无边界的**字节流**：发端调一次 `send("hello")` 塞进 5 个字节，收端调一次 `recv(1024)` 可能只先读到 `"he"` 两个字节，剩下的下次再读。
      - card:
          title: 三次握手：同步随机初始序号与半开队列
          body: |
            TCP 首部最小 **20 字节**，给每个字节编 32 位序号。建连通过**三次握手（three-way handshake）**完成：
            1. 客户发 `SYN`（请求同步），带随机初始序号 `seq = x`。
            2. 服务器回 `SYN-ACK`，确认 `ack = x + 1`，带上自己随机的 `seq = y`，并把这条未完成连接记在**半开连接队列**里。
            3. 客户发 `ACK`，确认 `ack = y + 1`，建连正式完成。

            随机选初始序号既防旧包串连，也防外人猜中序号伪造数据；后面网络安全还会看到有人故意发海量假 `SYN` 不回第 3 步来挤爆半开队列！
      - item:
          id: handshake-order
          type: order
          prompt: 客户随机选初始序号 x = 100，服务器选 y = 500。把正常 TCP 三次握手报文依次排好。
          steps:
            - 客户 → 服务器：SYN, seq = 100
            - 服务器 → 客户：SYN-ACK, seq = 500, ack = 101
            - 客户 → 服务器：ACK, ack = 501
          explain: SYN 标志位本身占 1 个逻辑序号，所以对方收到 seq = 100 后回 ack = 101；收到 seq = 500 后回 ack = 501。
      - card:
          title: 四次挥手与 TIME_WAIT 的 2×MSL
          body: |
            TCP 是双向全双工通道，关闭要各自关掉自己发往对方的方向（**半关闭**）：A 发 `FIN` 说“我不发了”，B 回 `ACK`（此时 B 还能继续发完手头数据）；B 发完也发 `FIN`，A 回最后一个 `ACK`。

            主动关闭方在回完最后 `ACK` 后，还要在 **`TIME_WAIT` 状态等 2 × MSL（最大报文段生存时间，教材建议 MSL = 120 秒，共 240 秒）**：一来若最后 `ACK` 丢了还能响应重发的 `FIN`；二来让残留在网里的老包彻底过期。
      - item:
          id: time-wait-why
          type: choice
          prompt: 主动关闭方发出四次挥手的最后一个 ACK 后，为什么要等 $2 \times \text{MSL}$（如 240 秒）才释放端口，而不立刻在原四元组上重开新连接？
          options:
            - text: 为了能重发丢失的最终 ACK，同时等网上滞留的旧分组彻底过期消失
              correct: true
            - text: 为了等接收端最后发回一条“我已经彻底关闭”的第四次确认报文
              why: 第四个 ACK 本身就是最后一条报文，对端收到后不会再回新确认了
            - text: 为了等本地磁盘缓存把所有刚读到的网络文件写盘完成
              why: 写盘与四次挥手后四元组重用无关，问题在于网上滞留旧包和 ACK 丢失重传
          explain: 若不等待就直接重用相同四元组，上次连接里迟到的老包会被新连接当成有效数据收下；同时保留状态才能回应可能重传的 FIN。
      - card:
          title: 滑动窗口流量控制与动态超时（Jacobson/Karels）
          body: |
            TCP 接收方在确认包里填上 **通告窗口（AdvertisedWindow）**：我现在缓存还空多少字节，别发超了让我溢出（**流量控制**）。

            重传定时器不能定死成固定秒数。早期用平滑平均 $\text{EstimatedRTT} = \alpha \text{EstimatedRTT} + (1-\alpha)\text{SampleRTT}$ 配 $\text{TimeOut} = 2\text{EstimatedRTT}$；后来 **Jacobson/Karels 算法**同时跟踪抖动偏差：
            $$\text{Difference} = \text{SampleRTT} - \text{EstimatedRTT}$$
            $$\text{EstimatedRTT} \mathrel{+}= \delta \cdot \text{Difference},\quad \text{Deviation} \mathrel{+}= \delta (|\text{Difference}| - \text{Deviation})$$
            $$\text{TimeOut} = \mu \cdot \text{EstimatedRTT} + \phi \cdot \text{Deviation}\quad (\mu=1,\ \phi=4)$$
      - card:
          title: 例题：手算一次 Jacobson/Karels 超时更新时间
          body: |
            已知当前 $\text{EstimatedRTT} = 100\text{ ms}$，$\text{Deviation} = 10\text{ ms}$，平滑权重 $\delta = \frac{1}{8}$。新测得一次 $\text{SampleRTT} = 140\text{ ms}$。按教材 $\mu=1, \phi=4$ 算新超时：
          reveal:
            - title: 第 1 步：算新测值与原估计的差
              body: $\text{Difference} = 140 - 100 = +40\text{ ms}$。
            - title: 第 2 步：更新估计值 EstimatedRTT 和偏差 Deviation
              body: $\text{EstimatedRTT} = 100 + \frac{1}{8}\times 40 = 105\text{ ms}$；$|\text{Difference}| - \text{Deviation} = 40 - 10 = 30$，所以 $\text{Deviation} = 10 + \frac{1}{8}\times 30 = 13.75\text{ ms}$。
            - title: 第 3 步：算出新超时 TimeOut
              body: $\text{TimeOut} = 1 \times 105 + 4 \times 13.75 = 105 + 55 = 160\text{ ms}$。波动一大，Deviation 马上拉高，防止误判重传。
      - item:
          id: tcp-jacobson-half
          type: number
          prompt: 先练一步平滑更新：当前 $\text{EstimatedRTT} = 80\text{ ms}$，权重 $\delta = \frac{1}{8}$，刚测得 $\text{SampleRTT} = 120\text{ ms}$（差值 $+40$）。更新后的 $\text{EstimatedRTT}$ 是多少毫秒？
          answer: 85
          unit: ms
          explain: EstimatedRTT = 80 + (1/8) × (120 - 80) = 80 + 5 = 85 ms。
      - item:
          id: tcp-jacobson
          type: number
          prompt: 按 Jacobson/Karels 公式 $\text{TimeOut} = \text{EstimatedRTT} + 4 \times \text{Deviation}$。若当前算出 $\text{EstimatedRTT} = 80\text{ ms}$、$\text{Deviation} = 15\text{ ms}$，重传超时 TimeOut 设为多少毫秒？
          answer: 140
          unit: ms
          explain: 80 + 4 × 15 = 80 + 60 = 140 ms。
      - item:
          id: tcp-ack-byte
          type: number
          prompt: TCP 连接里，客户端发出两段数据：第一段从序号 1000 开始共 400 字节（1000–1399），第二段从 1400 开始共 300 字节（1400–1699）。两段都顺利到达服务器。服务器回发的累计确认号是多少？
          answer: 1700
          explain: TCP 确认号表示“下一个期待收到的字节序号”。服务器已连续收齐 1000..1699，下一个期待的就是 1700。
      - item:
          id: tcp-flow-ctrl
          type: number
          prompt: TCP 发送端已发出尚未确认的在途数据有 1800 字节，接收方在 ACK 首部里通告的接收窗口 AdvertisedWindow 是 4096 字节。仅考虑流量控制，发送端此刻还能再立即发出多少字节（EffectiveWindow）？
          answer: 2296
          explain: EffectiveWindow = AdvertisedWindow - (LastByteSent - LastByteAcked) = 4096 - 1800 = 2296 字节。
  # ======================================================================== 路由
  - id: forwarding-lpm
    chapter: 路由
    title: 逐跳转发与最长前缀匹配
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 路由器转发表里有两条规则：`10.0.0.0/8` 走接口 A，`10.1.0.0/16` 走接口 B。现在来了一个目的地址为 `10.1.2.3` 的数据包，两条都能匹配上。路由器应该选哪条？
          options:
            - text: 选 `10.1.0.0/16`（走接口 B），因为它的前缀更长、范围更具体
              correct: true
            - text: 选 `10.0.0.0/8`（走接口 A），因为它的范围更大、能包住对方
              why: 如果总是选宽泛的大网段（甚至默认路由 0.0.0.0/0），所有细分的专用出口就永远不会被命中了
            - text: 把数据同时发往接口 A 和接口 B，谁先到算谁
              why: 路由查表必须给出唯一确定的下一跳，不能每跳复制两份造成全网流量爆炸
          explain: 就像寄信时既有“中国 → 走上海”，又有“中国上海市徐汇区 → 走徐汇分部”，按最具体的那条规则分拣才能送到区里的分站。
      - card:
          title: 路由平面与转发平面分工
          body: |
            一台路由器同时做两件节奏完全不同的事：
            - **控制面（路由）**：在后台每隔几秒或拓扑变化时和邻居算路，生成全局**路由表**，告诉路由器“去某个前缀走哪个下一跳”。
            - **数据面（转发）**：每到一个数据包，只按它的目的 IP 查精简后的**转发表**，瞬间决定从哪个网口发给下一跳。

            **逐跳转发**意味着每个路由器只负责把包推给“下一跳”，不用把整条沿途清单塞进包头。
      - card:
          title: 最长前缀匹配与硬件查表实现
          body: |
            当多条前缀都能匹配同一个目的 IP 时，必须选前缀位数最多的那条，叫做**最长前缀匹配（longest prefix match）**，默认路由 `0.0.0.0/0` 前缀长度为 0，只在毫无匹配时兜底。

            逐条按位与遍历几万条规则太慢。教材 3.5 节指出，软件常用按位分叉的**前缀树（Trie）**（类似二叉搜索树一步看 1 位或几位），高速硬件路由器则用**TCAM（三态内容寻址存储器）**在一个时钟周期里并行匹配通配符 `10*1`，让新一代**网络处理器（NPU）**跑出几十太比特（如 25.6 Tbps）。
      - item:
          id: lpm-practice
          type: choice
          prompt: 路由器转发表包含四条记录：`192.168.0.0/16 → 口1`、`192.168.12.0/24 → 口2`、`192.168.12.128/25 → 口3`、`0.0.0.0/0 → 口4`。收到目的地址为 `192.168.12.50` 的包，走哪个口？
          options:
            - text: 口 2（`192.168.12.0/24`）
              correct: true
            - text: 口 3（`192.168.12.128/25`）
              why: '`192.168.12.128/25` 覆盖的是 `.128` 到 `.255`，50 不在里面'
            - text: 口 1（`192.168.0.0/16`）
              why: 虽然 `/16` 也匹配，但 `/24` 的前缀更长，优先级更高
            - text: 口 4（`0.0.0.0/0`）
              why: 默认路由只在没有其他匹配时使用
          explain: '`/25` 要求第 25 位为 1（即 128..255），50 的最后一段最高位是 0，不匹配 `/25`；匹配上的 `/0`、`/16`、`/24` 里最长的是 `/24`，走口 2。'
      - card:
          title: 演示：用 Python 实现最长前缀匹配查表
          body: |
            下面的程序按位掩码检查每条转发表项是否命中目标 IP，如果有多条命中，挑前缀长度 `plen` 最大的那一条。单步看看 `10.1.2.3` 最后选了谁：
          sim:
            name: trace
            params:
              code: |
                def ip_int(a, b, c, d):
                    return (a << 24) | (b << 16) | (c << 8) | d
                table = [(ip_int(0, 0, 0, 0), 0, "default"), (ip_int(10, 0, 0, 0), 8, "A"), (ip_int(10, 1, 0, 0), 16, "B")]
                dst = ip_int(10, 1, 2, 3)
                best_len, next_hop = -1, None
                for prefix, plen, hop in table:
                    mask = 0 if plen == 0 else (0xFFFFFFFF << (32 - plen)) & 0xFFFFFFFF
                    if (dst & mask) == prefix and plen > best_len:
                        best_len, next_hop = plen, hop
              stdin: ''
      - item:
          id: trace-lpm
          type: sim
          sim: trace
          params:
            code: |
              def ip_int(a, b, c, d):
                  return (a << 24) | (b << 16) | (c << 8) | d
              table = [(ip_int(0, 0, 0, 0), 0, "default"), (ip_int(10, 0, 0, 0), 8, "A"), (ip_int(10, 1, 0, 0), 16, "B")]
              dst = ip_int(10, 1, 2, 3)
              best_len, next_hop = -1, None
              for prefix, plen, hop in table:
                  mask = 0 if plen == 0 else (0xFFFFFFFF << (32 - plen)) & 0xFFFFFFFF
                  if (dst & mask) == prefix and plen > best_len:
                      best_len, next_hop = plen, hop
            stdin: ''
          goal:
            ask:
              - line: 9
                var: best_len
                hit: 3
              - line: 9
                var: next_hop
                hit: 3
          prompt: 单步执行完三条表项的循环后，最终胜出的前缀长度 `best_len` 和下一跳 `next_hop` 分别是什么？
          explain: 三条规则都匹配到了 `10.1.2.3`，长度分别是 0、8、16；其中 16 最大，所以 `best_len` 为 16，`next_hop` 为 `'B'`。
      - item:
          id: plane-split
          type: choice
          prompt: 为什么高速软件/硬件交换机（教材 3.5 节）要把“运行路由协议（OSPF/BGP）”和“逐包查转发表”分在控制面和数据面？
          options:
            - text: 控制面每隔几秒才更新路由表，数据面用精简硬件表（如 TCAM）全速转发，互不拖累
              correct: true
            - text: 如果不拆分，数据面每次转发一个包都得通知所有邻居重算一遍全局最短路径
              why: 每秒几千万包的速度（如 40 Mpps，即每秒四千万包）只够几十纳秒查表，不可能每来一个包都重新运行图算法
            - text: 控制面只在路由器开机的那一秒跑一次，之后哪怕断网也永远不动
              why: 断线或新网络接入时，控制面必须一直在后台接收通告并重算更新转发表
          explain: 40 Mpps（每秒四千万个小包）下每个包只有几十纳秒预算；把复杂算路留在慢速控制面，把极简查表留在快速数据面，才能跑出太比特级转发能力。
      - item:
          id: lpm-tcam
          type: choice
          prompt: 硬件路由器用 TCAM 做最长前缀匹配查表时，为什么比在软件内存里逐行用掩码遍历几万条规则快得多？
          options:
            - text: TCAM 支持通配符（0/1/任意），能在单次硬件查表中把所有前缀条目并行同时比较完
              correct: true
            - text: TCAM 不比对前缀位数，直接挑地址范围最宽泛的那条匹配项输出
              why: TCAM 按前缀从长到短排列条目，并行比对后直接输出匹配到的最长前缀
            - text: TCAM 把全网前缀都硬编码成固定两级查找表，遇到变长 CIDR 就退回默认路由
              why: TCAM 天然支持任意 `0..32` 位的通配掩码，是专门为变长 CIDR 并行查表设计的
          explain: 软件常用前缀树（Trie）按位分支缩减步数，硬件路由器则用带通配符的 TCAM 在一个时钟周期并行匹配。

  - id: link-state
    chapter: 路由
    title: 链路状态路由（OSPF）与 Dijkstra
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 几台路由器连成网：A 直连 C 费用 4，但 A 到 B 费用 1、B 到 C 费用 2。如果路由器算路只看“经过几站（跳数）”，而不看每条线的快慢和费用，会选哪条路去 C？
          options:
            - text: 直接 A → C（1 跳），错过了总费用更低（1+2=3）的 A → B → C
              correct: true
            - text: 总能挑出费用最低的那条 A → B → C
              why: 只数跳数时 1 跳永远小于 2 跳，根本看不出直连线其实更慢更贵
            - text: 两边费用一样，系统会随机选一条
              why: 按费用算 3 < 4 并不相同，只是“跳数”这个粗略指标看不出来
          explain: 把每条链路想成带权重的边，网络就是一张加权无向图——你甚至可以根据带宽或延迟给每条边打上不同的代价。
      - card:
          title: 链路状态路由：先拼出全网地图，再自己算最短路
          body: |
            把路由器当顶点、链路当带权重（非负代价）的边。**链路状态路由（link-state routing）**（代表协议 **OSPF，开放最短路径优先**）分两步走：
            1. **可靠泛洪**：每台路由器测出自己直连了谁、链路代价多少，打包成带序列号和寿命的链路状态分组（LSP/LSA），泛洪转发给全网其他路由器。
            2. **独立算路**：每台路由器手里都攒出同一份完整地图后，各自以自己为起点跑 **Dijkstra 最短路径算法**，再把每个目的地的“第一跳邻居”填进转发表。
      - card:
          title: 演示：用 Dijkstra 在网络图上定下最短路
          body: |
            看看网状图 `A–B: 1`、`A–C: 4`、`B–C: 2`、`B–D: 5`、`C–D: 1`。从路由器 `A` 出发：先确定 `A(0)`，然后一步步挑出当前暂定距离最小的未确定节点，再用它去松弛更新邻居的暂定距离。试着点一遍算法步骤：
          sim:
            name: graph
            params:
              mode: dijkstra
              directed: false
              start: A
              nodes:
                - id: A
                  x: 45
                  'y': 92
                - id: B
                  x: 120
                  'y': 45
                - id: C
                  x: 205
                  'y': 120
                - id: D
                  x: 295
                  'y': 65
              edges:
                - [A, B, 1]
                - [A, C, 4]
                - [B, C, 2]
                - [B, D, 5]
                - [C, D, 1]
      - item:
          id: spf-sim
          type: sim
          sim: graph
          params:
            mode: dijkstra
            directed: false
            start: A
            nodes:
              - id: A
                x: 45
                'y': 92
              - id: B
                x: 120
                'y': 45
              - id: C
                x: 205
                'y': 120
              - id: D
                x: 295
                'y': 65
            edges:
              - [A, B, 1]
              - [A, C, 4]
              - [B, C, 2]
              - [B, D, 5]
              - [C, D, 1]
          goal: {}
          solution: [A, B, C, D]
          prompt: 从路由器 A 出发运行 OSPF 的 Dijkstra 算法，依次点出每个节点最短距离被最终确定的顺序。
          explain: A 距 0 先确定；邻居中 B(1) 小于 C(4)，第二个确定 B；经 B 到 C 缩短成 1+2=3、到 D 是 1+5=6，所以第三个确定 C(3)；经 C 到 D 缩短成 3+1=4，最后确定 D(4)。
      - item:
          id: ospf-nexthop
          type: choice
          prompt: 无向图里边代价为 `A–B:1, A–C:4, B–C:2, B–D:5, C–D:1`。用 Dijkstra 算出 A 的最短路径后，A 完整转发表 `(目的地 → 下一跳, 最小总代价)` 应该填成哪张表？
          options:
            - text: '`B → (B, 1)`、`C → (B, 3)`、`D → (B, 4)`'
              correct: true
            - text: '`B → (B, 1)`、`C → (C, 4)`、`D → (C, 5)`'
              why: A 直连 C 要花 4，不如先走 B 再经 B–C（1+2=3）更短，去 C 和 D 都该先交给 B
            - text: '`B → (B, 1)`、`C → (B, 3)`、`D → (C, 4)`'
              why: A 并不与 C 跑最短路（最短路 A→B→C→D），且转发表只写自己直连的第一跳邻居 B，不能直接填 C
          explain: 这正是本技能综合练习第 (4) 题的转发表：去 B、C、D 的最短路全部从 B 出发，所以 A 转发表的下一跳全写 B！
      - card:
          title: 链路代价怎么定？为什么别乱用瞬时队列长度
          body: |
            边代价怎么设（教材 3.4.4 节）？早期 ARPANET 试过直接拿“路由器当前排队长度”当代价，结果出大乱子：大家一看某条路队列空，就一窝蜂全把流量切过去，那条路瞬间塞爆，然后大家又集体切走，来回震荡。

            现代 OSPF 通常由管理员设定静态权重（常见按链路带宽反比设定，带宽越宽代价越小），或者把时延与静态容量稳妥混合，避免路由高频乱摆。
      - item:
          id: ospf-lsa-flood
          type: choice
          prompt: 在 OSPF 可靠泛洪中，每台路由器发出的链路状态通告（LSA）里为什么必须带上序列号和年龄计数（LS Age）？
          options:
            - text: 用序列号丢掉收过的旧副本防止全网泛洪死循环，并让过期的老链路记录按时失效
              correct: true
            - text: 用来替邻居计算到各自直连网络的最短距离，免去运行 Dijkstra
              why: LSA 只汇报链路状态，序列号和年龄并不包含算好的路径，每台路由器仍要自己跑 Dijkstra
            - text: 用来协调各路由器的发送时段，防止光纤上同时发包冲突
              why: 光纤链路成帧和介质访问由下层处理，LSA 序列号和年龄专管泛洪去重与过期清理
          explain: 没有序列号识别新旧版本，同一份泛洪通告会在网络环路里没完没了地互相转发下去。
      - card:
          title: OSPF 区域划分：用骨干区 0 控制全网泛洪规模
          body: |
            如果全球几十万台路由器都在一张图里泛洪 LSA，光重算 Dijkstra 就能把 CPU 烧坏。OSPF 把大网络切成多个**区域（Area）**，其中必须有一个叫**区域 0（骨干区域）**。

            跨区域连接的路由器叫**区域边界路由器（ABR）**：它把本区域的网段**汇总摘要**发往骨干区，而不是把本区每条明细链路都泛洪给外人。跨区流量必须经过区域 0，用“轻微牺牲全局最优性”换来成倍缩小的图规模。
      - item:
          id: ospf-area0
          type: choice
          prompt: OSPF 网络分成区域 0（骨干）、区域 1 和区域 2 后，为什么能够大幅减少单台路由器的内存和计算开销？
          options:
            - text: 详细链路状态只在本区域内部泛洪，ABR 只跨区域通告汇总后的前缀信息
              correct: true
            - text: 划分区域后，区域内部只保留本区直连表，只有区域 0 才跑 Dijkstra
              why: 区域内部依然各自收集本区完整链路图并跑 Dijkstra，只是每张图变小了
            - text: 区域之间不再直接转发，必须把全部跨区流量交给外部电信运营商绕转
              why: 同一机构内部各区域之间依然靠 ABR 经区域 0 互相连通，不必借道外部运营商网络
          explain: 层次化路由的核心就是信息摘要：区内看清每根线，跨区只看汇总块和边界出口。

  - id: distance-vector
    chapter: 路由
    title: 距离向量路由（RIP）与无穷计数
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你不知道去火车站有多远，于是问两个邻居：张三说他去火车站要 5 分钟，你走到张三家要 2 分钟；李四说他去火车站要 4 分钟，你走到李四家要 6 分钟。不看全城地图，你能直接算出自己至少要几分钟吗？
          options:
            - text: 能，选“到张三 2 + 张三去车站 5 = 7 分钟”比“6 + 4 = 10”更近
              correct: true
            - text: 不能，必须先拿到全城所有街道的地图才能比较
              why: 只要每个邻居都已经报出了自己的最短估价，我只需要把“到邻居的距离 + 邻居的估价”取最小就行
            - text: 选 4 分钟，因为李四说得最小
              why: 忘了算你自己先走到李四家也要花 6 分钟
          explain: “到某邻边的代价 + 邻居到目的地的已知最短距离”取最小值，这就是分布式的 Bellman–Ford 思想！
      - card:
          title: 向量和距离向量路由（RIP）
          body: |
            前面看的是每个节点先拼全图再算路。另一种叫**距离向量路由（distance-vector routing）**（代表协议 **RIP，路由信息协议**）：每个节点根本不画全图，只维护一张按目的地排成一列的距离表——这里的**向量（vector）**就是一串 `(目的地, 估计最短距离)` 列表。

            每隔几十秒或拓扑有变时，每台路由器把自己的距离表发给直连邻居；收到邻居 B 的汇报后，节点 A 按 Bellman–Ford 公式更新：如果“自己到 B 的代价 + B 到目的地的距离”比现在更短，就改写并把下一跳设为 B。
      - item:
          id: dv-update
          type: number
          prompt: 路由器 X 到邻居 Y、Z 的直连链路代价分别是 2 和 5。现在 Y 汇报自己到目的地 D 的代价是 6，Z 汇报自己到 D 的代价是 2。按距离向量更新规则，X 到 D 算出的新最短距离是多少？
          answer: 7
          explain: 经 Y 的总代价是 2 + 6 = 8；经 Z 的总代价是 5 + 2 = 7。取较小者 7（下一跳改设为 Z）。
      - card:
          title: 麻烦来了：断线后的无穷计数
          body: |
            链路变好时消息传得飞快，可一旦一条链路断了，只看邻居汇报就会闹出**无穷计数（count-to-infinity）**！假设线性拓扑 `A —(1)— B —(1)— C`，突然 `A–B` 断线了：
            - B 发现自己直连不了 A，距离改成不可达上限，可此时 C 还不知道，照常按老表汇报“我到 A 只要 2（走 B）”。
            - B 一听喜出望外：“太好了，我走 C 过去只需 $1 + 2 = 3$！”下一轮 C 又听到 B 报 3，改成 $1 + 3 = 4$……两个邻居互相相信对方的过时老路，距离 3、4、5、6……一路涨上去！
      - card:
          title: 演示：用 Python 追踪三路由器的无穷计数
          body: |
            看看下面这段代码怎样模拟 `B — C` 互相听信对方过时信息的过程：最初 `C` 以为走 `B` 到 `A` 距离是 `2`；`A–B` 断开后，`B` 先向 `C` 求助算成 `3`，`C` 再根据 `B` 算成 `4`……运行每一步看看 `dB` 和 `dC` 怎么一路飙到 RIP 的不可达上限 `16`：
          sim:
            name: trace
            params:
              code: |
                dB, dC = 1, 2
                dB = 999
                history = []
                for step in range(4):
                    dB = 1 + dC
                    dC = 1 + dB
                    history.append((dB, dC))
              stdin: ''
      - item:
          id: trace-cti
          type: sim
          sim: trace
          params:
            code: |
              dB, dC = 1, 2
              dB = 999
              history = []
              for step in range(4):
                  dB = 1 + dC
                  dC = 1 + dB
                  history.append((dB, dC))
            stdin: ''
          goal:
            ask:
              - line: 7
                var: dB
                hit: 2
              - line: 7
                var: dC
                hit: 2
          prompt: '单步追踪这段无穷计数模拟：经过第 2 轮更新（即 `hit: 2` 结束时），`B` 和 `C` 以为自己到 `A` 的距离 `dB` 和 `dC` 分别涨到了多少？'
          explain: 第 1 轮后 B 用 C 的旧值 2 算出 `dB = 3`，C 跟着 B 算出 `dC = 4`；第 2 轮后 B 用 4 算出 `dB = 5`，C 跟着 B 算出 `dC = 6`。两台机器其实都在绕回彼此兜圈！
      - card:
          title: RIP 怎么缓解：水平分割、毒性逆转与 16 跳上限
          body: |
            为了别让计数一直涨到天荒地老，距离向量协议加了三道补丁（教材 3.4.2 节）：
            1. **设一个很小的不可达上限**：RIP 规定跳数 1–15 有效，**16 就代表不可达**，这样哪怕兜圈也最多十几轮就停。
            2. **水平分割（Split Horizon）**：如果我去 A 的路是从 C 学的，我汇报给 C 时干脆不报 A。
            3. **带毒性逆转的水平分割**：汇报给 C 时故意说“我到 A 的距离是 16（不可达）”。注意：**水平分割和毒性逆转只治得好两节点兜圈，三个或以上节点围成三角环时照样会无穷计数！**
      - item:
          id: dv-vs-ls
          type: choice
          prompt: 与链路状态路由（OSPF）相比，关于距离向量路由（RIP）的说法哪一项是对的？
          options:
            - text: 路由器只把自己的距离向量交给直连邻居，好消息传得快但链路断开时可能出现无穷计数
              correct: true
            - text: 每台路由器都会把完整全网拓扑图泛洪到每一跳，再用 Dijkstra 算路
              why: 全网泛洪拓扑 + Dijkstra 是链路状态路由（OSPF）的做法，距离向量并不知道全图边长
            - text: 只要开启了毒性逆转，不管多复杂的环路网都绝对不可能再出现无穷计数
              why: 毒性逆转只能阻断两个直连节点互指；三个节点成环时仍可能相互推高距离直到撞上不可达上限 16
          explain: RIP 协议简单、消息小（每 30 秒交换一次，每跳代价 1，16 即不可达），缺点是坏消息传播慢、易短暂兜圈且路径规模受限。
      - item:
          id: dv-rip-max
          type: number
          prompt: 在 RIP 协议里，每一跳代价记为 1，并规定了一个代表“不可达”的整数上限。一个距离目的地原本需要 15 跳的路径如果刚好还可以工作，再多串联 1 跳变成不可达时，RIP 里用来表示不可达的整数上限是多少？
          answer: 16
          explain: RIP 规定有效跳数只有 1 到 15，16 就代表不可达，这也限制了 RIP 只能用在小型局域网内。

  - id: bgp-interdomain
    chapter: 路由
    title: 自治系统与域间路由 BGP
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 互联网由全球几万家互相竞争的电信运营商和大学网拼起来。如果 A 公司和 B 公司网线接通了，可两家之间“从甲公司经过乙公司再转到丙公司”最短，乙公司就一定会无条件帮陌生人转运流量吗？
          options:
            - text: 不一定，跨公司的选路首先看商业合作和转发策略，而不是只看哪条路最短
              correct: true
            - text: 一定会，互联网协议强制每台路由器必须选全局最短路径
              why: 没有公司愿意免费替竞争对手的客户跑满自己的跨洋光缆
            - text: 只要把 OSPF 的代价改大一点就够了，不需要专门的新协议
              why: 各公司根本不愿意把自己的内部机密拓扑和商业规则通过 OSPF 泛洪给全世界
          explain: 机构内部追求“又快又短”，机构之间首先讲“合不合规矩、谁给谁付钱”，这就需要域间路由协议 BGP。
      - card:
          title: 自治系统与路径向量协议 BGP
          body: |
            由同一机构管理、对外呈现一致策略的一组网络，叫一个**自治系统（autonomous system，AS）**，各有全局唯一的 32 位 **AS 号（ASN）**。内部跑 OSPF/RIP；跨 AS 之间跑 **BGP（边界网关协议）**（跑在 TCP 之上，默认端口 179）。

            BGP 既不是链路状态（不晒内部拓扑），也不是简单距离向量（只报跳数不够防环和做策略），而是**路径向量（path-vector）**：每条通告里直接写着“要到网段 `192.0.2.0/24`，一路经过的完整 `AS_PATH` 序列”。
      - card:
          title: 用 AS_PATH 彻底防环，按商业关系选路
          body: |
            路径向量天生防环：AS 200 收到一条 `AS_PATH = [300, 200, 100]` 的路由时，一看里面已经有 `200`，就知道走过去必绕回自己，直接拒绝！

            BGP 通告的是“可达性”而非全网通用距离，选路先看**商业策略**：
            - **客户**（付我钱买接入）：优先选，并且我愿意把客户路由转告给所有人；
            - **对等（Peer）**（平等免费互连）：只帮自己客户和对方客户互转；
            - **上游供应商**（我付钱买出口）：绝不把从供应商甲学来的别人路由转告给供应商乙，免得自己倒贴流量费！
      - item:
          id: bgp-loop
          type: choice
          prompt: 自治系统 `AS 65002` 从邻居收到一条前往前缀 `198.51.100.0/24` 的 BGP 通告，里面的 `AS_PATH` 为 `[65004, 65002, 65001]`。`AS 65002` 应该怎么处理？
          options:
            - text: 丢弃这条通告，因为路径里已经包含自己 `65002`，采用它会形成路由环路
              correct: true
            - text: 把自己再加进路径前端成 `[65002, 65004, 65002, 65001]` 继续转发
              why: 这正是会绕圈的路由环路，数据包会在几个 AS 之间打转直到 TTL 耗尽
            - text: 删掉中间的 `65002` 改成 `[65004, 65001]` 后继续使用
              why: 任意篡改历史路径会破坏真实转发图并掩盖环路
          explain: BGP 靠检查 `AS_PATH` 是否已出现自身 ASN 来直接杜绝域间环路，这是比距离向量高明得多的设计。
      - item:
          id: bgp-valley
          type: choice
          prompt: 小运营商 M 同时向大运营商 P1 和大运营商 P2 付费买上游带宽（M 是 P1 和 P2 的客户）。M 应该把从 P1 学来的互联网路由再转告给 P2 吗？
          options:
            - text: 不应该，否则 P2 的流量会穿过 M 去 P1，让 M 替两家大运营商白交双份流量费
              correct: true
            - text: 应该，只要 P2 离目的地比直连 P1 近一跳就该帮它中转
              why: 商业网络遵守“无谷原则”（valley-free）：绝不在两个付费供应商之间免费中转流量
            - text: 必须转告，因为 BGP 规定所有学到的路由都要广播给所有邻居
              why: BGP 策略允许自主过滤导出路由，只导出“自己的前缀 + 自己客户的前缀”给供应商和 Peer
          explain: M 只向付费给自己的客户（如果有的话）转发全网路由，绝不帮两个上游供应商彼此充当免费过境桥梁。
      - card:
          title: 常见决胜规则与安全隐患（接轨网络安全）
          body: |
            按 RFC 4271 工程实践，两条合规的 BGP 路由按这套常用优先级依次比较：
            1. 本地策略偏好（如客户路由优先，常见 `LOCAL_PREF` 越高越优）；
            2. `AS_PATH` 经过的 AS 越少越优；
            3. 再比出口度量（如 `MED`，多出口鉴别器）和 `eBGP`（跨 AS 会话）优于 `iBGP`（AS 内部会话）。

            **关键隐患**：BGP 早年设计于互相信任的年代——任何 AS 只要发出一句“我拥有前缀 X”的 BGP 通告，邻居默认就信了！这种缺少来源签名验证（如后来引入的 RPKI/ROA）的缺陷，正是后面我们要学的 BGP 前缀劫持。
      - item:
          id: bgp-tiebreak
          type: choice
          prompt: 运营商收到两条都能到达 `203.0.113.0/24` 的 BGP 路由：一条是经过 4 个 AS 的付费客户链路（本地策略偏好高），另一条是经过 2 个 AS 的上游链路（偏好较低）。BGP 会优先选哪条？
          options:
            - text: 选经过 4 个 AS 的客户链路，因为本地商业策略优先级高于 AS 路径长度
              correct: true
            - text: 一定选只经过 2 个 AS 的那条，BGP 永远最短路径优先
              why: AS 路径长度只是第二道比较条件，本地偏好（LOCAL_PREF）排在最前面
            - text: 两条一起用，奇偶号包各走一半
              why: 默认情况下 BGP 会按优先级挑出唯一一条最佳路径写入转发表并向邻居通告
          explain: “策略优先于最短”是 BGP 区别于 OSPF 的灵魂。
      - item:
          id: bgp-origin-trust
          type: choice
          prompt: 为什么传统 BGP 协议自身容易遭受“前缀劫持”（某个无关的 AS 宣称自己拥有某银行的 IP 网段）？
          options:
            - text: BGP 在早期设计时没有起源归属认证，路由器默认信任邻居发来的前缀宣告
              correct: true
            - text: 因为 BGP 把所有路由认证密码都写进了明文 TCP 首部，被中间路由截获了
              why: 问题不是密码泄露，而是传统 BGP 协议本身压根就没有给“某 AS 有权宣告某前缀”加上签名检验机制
            - text: 因为 BGP 只允许每条前缀在全网保存一份记录，谁后发就会覆盖掉银行原本的记录
              why: 多条路径可以并存，只是攻击者宣告的新路径或更具体前缀（最长前缀匹配）会抢走流量，而邻居无从校验真伪
          explain: 记住这个伏笔：在没有起源认证的传统 BGP 里，任何 AS 发出一份假前缀或更短路径的通告，全网都可能信以为真把流量改道送过去。

  - id: mpls-mobile
    chapter: 路由
    title: 标签交换 MPLS 与移动 IP
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 手机正连着公司 Wi-Fi 看视频（IP 是 `198.51.100.8`），你走出大楼自动切到了 5G 蜂窝网络，拿到了新 IP `203.0.113.99`。如果远端服务器还在往旧地址 `198.51.100.8` 发包，怎样才能不断线继续收到？
          options:
            - text: 留在公司网里的“归属代理”替你收下旧地址的包，再打包转发（隧道）到你的新临时位置
              correct: true
            - text: 全世界每一台互联网路由器立刻在 1 毫秒内为你单独改写全球路由表
              why: 全球有几亿台移动设备同时在走动，如果每次移动都向全网广播单机路由，整个互联网转发表当场爆炸
            - text: 旧地址的包会在路上凭空自动拐弯追着你跑
              why: 路由表只看目的地 IP 字段，除非中间有显式转交机制或应用自己切流，否则旧包只会送回公司网关
          explain: 既不想为了一个人频繁改动全球路由表，又想保住不变的“永久地址”，移动 IP 用“归属代理 + 临时转交地址 + 隧道封装”解决了这个矛盾。
      - card:
          title: MPLS：入口做一次复杂查表，中途只换短标签
          body: |
            前面说过 IP 转发要做最长前缀匹配，遇到多条掩码还得比谁长。骨干网为了跑出超高速并能人为指定流量走哪条备用光缆（流量工程），引入了 **MPLS（多协议标签交换）**：
            - **边缘路由器（LER）**：做一次完整 IP 最长匹配查表，给包在二层帧头和三层 IP 头之间夹进一个 32 位的短标签（shim）。
            - **核心交换路由器（LSR）**：压根不看 IP 头，直接拿标签做**精确匹配**数组索引，换个下跳标签几十纳秒内送走！
      - item:
          id: mpls-vs-ip
          type: match
          prompt: 把转发步骤和对应机制配对。
          pairs:
            - [依据 IP 地址做最长前缀匹配并压入标签, 入口边缘路由器 LER]
            - [不查 IP 前缀，用标签精确查表并替换成下一跳标签, 核心交换路由器 LSR]
            - [把同一个 4 字节标签塞进链路层和 IP 层之间, MPLS 标签垫片位置]
          explain: MPLS 把昂贵的最长匹配只做在网络边界，核心高速节点变成极简单的“精确索引+换标签”。
      - card:
          title: 移动 IP：归属代理与隧道封装
          body: |
            移动设备有一个永久的**归属地址（home address）**，由老家的**归属代理（home agent）**守着；走到外地连上外地网络，拿到一个临时的**转交地址（care-of address）**并向老家登记。

            通信对端照常发给永久归属地址；归属代理在老家截获该包，外层套上一份新 IP 头（**IP-in-IP 隧道**）寄到外地转交地址，外地拆封后交到设备手里。
      - item:
          id: mobile-tunnel
          type: choice
          prompt: 在移动 IP 中，当外出的手机从北京连到了上海的 Wi-Fi 并拿到转交地址后，发往它永久归属地址的包是怎么穿过互联网找到它的？
          options:
            - text: 北京的归属代理拦截发往归属地址的包，用 IP-in-IP 隧道包上外地转交地址寄往上海
              correct: true
            - text: 全世界骨干路由器每秒都在全网泛洪更新这台手机当前所在的 Wi-Fi 地址
              why: 路由表按网段聚合，绝不可能为全世界上十亿台手机维护实时单机主机路由
            - text: 手机主动扔掉原来的归属地址，所有已经建立的连接立刻作废重连
              why: 移动 IP 的目标正是保住永久归属地址不变，让现有通信不断线
          explain: 外层 IP 头负责送到当前临时位置，内层 IP 头保留不变的永久归属地址。
      - card:
          title: 三角路由与绑定更新
          body: |
            通过归属代理隧道收包之后，移动设备回信其实可以直接按正常路由寄回给通信对端——这种“去程绕回老家、回程直走过去”的歪路叫**三角路由**。

            怎么拉直它？让归属代理或移动设备给通信对端发一条**绑定更新**缓存新位置，以后对端直接往转交地址发包；IPv6 移动版则利用扩展路由首部省去了外地代理。
      - item:
          id: mobile-ip-triangle
          type: choice
          prompt: 设备 A 从北京出差到上海，通过移动 IP 保持与同样也在上海的朋友 B 通话，还没有做“绑定更新”优化。从 B 发给 A 的包会走什么路线？
          options:
            - text: 先从上海绕回北京的归属代理，再由归属代理用隧道转回上海给 A（三角路由）
              correct: true
            - text: 直接在上海本地交换机之间一步送到 A，根本不经过北京
              why: 朋友 B 只知道 A 的永久归属地址（北京网段），没有收到绑定更新前只会往北京寄
            - text: 数据包在到达北京归属代理后会被立刻丢弃
              why: 归属代理专门负责接住发给 A 的包并通过隧道转送给 A 当前的转交地址
          explain: 只要对端不知道你的临时转交地址，去程就必须经过归属代理中转；发送“绑定更新”让对端直接把包发往转交地址（或路由头）就能绕开三角弯路。

  # ======================================================================== 拥塞控制
  - id: queues-aqm
    chapter: 拥塞控制
    title: 路由器排队、公平调度与主动队列管理
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 高速公路收费站每分钟最多放行 6 辆车，可这一分钟从三条匝道一共涌进来了 10 辆车。哪怕每辆车开得都飞快，收费站前面的队列会怎么样？
          options:
            - text: 队列净增加 4 辆车；如果一直这么涌入，队列最终塞满，后来的车只能被拦下掉头
              correct: true
            - text: 只要路口不停车，永远不会出现积压，10 辆全都能在同一分钟通过
              why: 出口物理容量每分钟就是 6 辆，物理瓶颈跨不过去，多出来的 4 辆只能排队等待
            - text: 出口会自动把车压扁变成 10 辆一起过
              why: 链路带宽（比特每秒）是有硬上限的，不能把比特凭空压缩
          explain: 进入速率超过瓶颈链路的输出速率时，数据包就会在路由器缓冲区排队；排满了就会丢包，这就是网络拥塞。
      - card:
          title: 拥塞与 FIFO 尾丢弃
          body: |
            当进入链路的数据量长期超过处理能力，就会产生**拥塞（congestion）**，带来排队延迟上升和丢包。

            最简单的排队纪律是**先来先服务（FIFO）+ 尾丢弃**：所有连接混进同一条队列，按到达顺序发，队满就把刚来的新包丢掉。它好实现，但一旦有一条不配合减速的 UDP 大流狂发包，就能把整条队列塞死，把守规矩的小流全挤出去。
      - item:
          id: fifo-starve
          type: choice
          prompt: 一台路由器采用单一的 FIFO + 尾丢弃队列。流 X 突然疯狂以超高速发送 UDP 大流量，流 Y 是正常低速网页请求。会发生什么？
          options:
            - text: 流 X 很快占满整个共用缓冲区，导致流 Y 的包也一起被大量尾丢弃或拖长延迟
              correct: true
            - text: 路由器会自动认出流 X 在捣乱，把全部带宽只分给流 Y
              why: 普通单一 FIFO 队列不区分连接身份，新来的包一律看当前队列满不满
            - text: 队列满了会自动把流 X 的包退回给发送端保存
              why: 路由器不会把包“退回”上游，装不下就直接原地丢弃
          explain: 单一队列里流与流之间没有隔离，需要靠公平排队为不同流隔出独立的机会。
      - card:
          title: 公平排队（FQ）与加权（WFQ）
          body: |
            **公平排队（FQ）**为每条流单独建一条子队列轮流发。为了避免某条流靠发“大包”占便宜，FQ 按假想的“逐比特轮流发送”算出每个包的结束时间戳 $F_i = \max(F_{i-1}, A_i) + P_i$（$A_i$ 到达时刻，$P_i$ 包长），每次挑 $F_i$ 最小的先发；加权公平排队（**WFQ**）则按设定权重比例分配出口带宽。
      - card:
          title: 例题：用结束时间戳模拟公平排队（FQ）
          body: |
            时刻 0，链路同时收到两路包：流 1 来了两个包，长度分别是 8 和 4；流 2 来了一个包，长度是 6。按 $F_i = \max(F_{i-1}, A_i) + P_i$（初值 $F_0=0$）决定发送顺序：
          reveal:
            - title: 第 1 步：算流 1 两个包的虚拟完成时刻
              body: 第 1 个包：$F_{1,1} = \max(0, 0) + 8 = 8$；第 2 个包排在后面：$F_{1,2} = \max(8, 0) + 4 = 12$。
            - title: 第 2 步：算流 2 第 1 个包的虚拟完成时刻
              body: 流 2 的包独立计算：$F_{2,1} = \max(0, 0) + 6 = 6$。
            - title: 第 3 步：按 F 值从小到大实际发送
              body: $6 < 8 < 12$，所以先发流 2 的包（6），再发流 1 的第 1 个包（8），最后发流 1 的第 2 个包（12）。大包小包不再占便宜！
      - item:
          id: fq-finish
          type: order
          prompt: 时刻 0，两条空闲流各收到包：流 A 来了包 `A1`（长度 5）、流 B 来了包 `B1`（长度 3）紧接着 `B2`（长度 4）。按 $F_i = \max(F_{i-1}, A_i) + P_i$（$F_0=0$）算出各自结束时间戳，把实际发送顺序排好。
          steps:
            - 流 B 的 B1（结束时间戳 3）
            - 流 A 的 A1（结束时间戳 5）
            - 流 B 的 B2（结束时间戳 7）
          explain: B1 结束于 0+3=3，A1 结束于 0+5=5，B2 排在 B1 后结束于 3+4=7；按 3 < 5 < 7 交替发送，流 A 不用苦等流 B 把两个包全发完。
      - item:
          id: wfq-share
          type: number
          prompt: 三条连接在同一台支持加权公平排队（WFQ）的路由器上持续发送数据，权重分别设为 2、1、3，总出口带宽 60 Mbps。权重为 3 的那条连接最少能稳稳分到多少 Mbps 的带宽？
          answer: 30
          unit: Mbps
          explain: 总权重 2 + 1 + 3 = 6，权重 3 占其中的 3 / 6 = 50%，所以分得 60 × 50% = 30 Mbps。
      - card:
          title: 主动队列管理（RED）与显式拥塞通知（ECN）
          body: |
            只等队列彻底塞满再“尾丢弃”，会让好几条连接同时丢包、同时降速、又同时提速，造成全网同步震荡。**RED（随机早期检测）**盯着加权平均队列长度 `AvgLen`：
            - 小于 `MinThreshold`：全收；高于 `MaxThreshold`：全丢；
            - 夹在中间：按逐渐升高的概率随机丢包（越快塞满丢的概率越高），提前只提醒个别流减速！

            - **ECN（显式拥塞通知）**更温柔：发端在 IP 头里标 **ECT** 表示自己支持它，路由器队列拥挤时把 IP 头的 **CE** 置 1（遇到拥塞），收端通过 TCP 确认回传 **ECE**，发端收到减速并回 **CWR** 确认“已降窗”。
      - item:
          id: ecn-vs-drop
          type: choice
          prompt: 路由器支持 ECN 且端到端都开启了 ECN 协商时，发现队列快满但还没溢出，路由器会怎么通知发送方减速？
          options:
            - text: 照常转发数据包，但在 IP 首部打上 CE 拥塞标记，由接收端通过 TCP 确认回传 ECE 提示减速
              correct: true
            - text: 故意把该数据包丢弃，让发送方自己等超时重传才知道堵车
              why: 直接丢包是传统尾丢弃和 RED 的隐式通知方式，会白白浪费已走过的链路并触发重传等待
            - text: 发一份 ICMP 重定向通知发送方换一条绕远的新路
              why: 拥塞标记的目的是让原连接平滑降低发送速率，不是让主机改换下一跳路由器
          explain: ECN 通过 IP 层的 ECT/CE 位与 TCP 层的 ECE/CWR 标志配合，实现“不丢包也能报拥塞”。
      - card:
          title: QoS：综合服务（IntServ）与区分服务（DiffServ）
          body: |
            视频会议怕延迟抖动，文件下载不怕多等两秒。怎么给不同业务不同待遇（**服务质量 QoS**）？
            - **IntServ（按流预约）**：每条流开播前先发 **RSVP（资源预留协议）**沿途向每台路由器申请预留资源，保证有界延迟——但在骨干网记百万条流状态扩展太难。
            - **DiffServ（粗粒度分级）**：只在网络边缘给包头的 6 位 **DSCP（区分服务码点）**字段贴标签（如加速转发 EF、确保转发 AF），核心路由器只看这 6 位标签走不同队列或权重，简单可扩展。
      - item:
          id: qos-match
          type: match
          prompt: 把四种拥塞与服务质量机制和它们的做法配对。
          pairs:
            - [FIFO 尾丢弃, 队列彻底排满时才把新到的包直接丢弃]
            - [RED 主动队列管理, 在队列还没排满时按平均队长概率性提前丢弃]
            - [WFQ 加权公平排队, 不同流分队列按设定权重比例瓜分出口带宽]
            - [DiffServ 区分服务, 在包头用 DSCP 标出类别让核心路由器按类差分对待]
          explain: 尾丢弃被动等满；RED 提前温和随机丢；WFQ 按流分权重；DiffServ 按包头的 DSCP 类标签做差异化排队。

  - id: cwnd-aimd
    chapter: 拥塞控制
    title: 拥塞窗口：慢启动、拥塞避免与 AIMD
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你刚开着一辆货车上一条完全陌生的跨国公路，没人告诉你路上最窄那座桥一秒能过几吨。一开始就一脚油门把一百辆货车全塞上路，还是先试着发一辆看看能不能安全回来？
          options:
            - text: 先发少数试探，收到顺利通过的回信再逐步加大流量
              correct: true
            - text: 直接按自己网卡的最大速度一口气全发出去，大不了堵死再说
              why: 一旦把路上路由器塞满丢包，所有重传会撞在一起引发雪崩（拥塞崩溃）
            - text: 永远只发 1 个包，等它回来再发第 2 个，绝不加速
              why: 永远停在 1 个包会浪费掉 90% 以上的长途高速链路带宽
          explain: 发送方在互联网上看不见沿途几万台路由器有多忙，只能靠“先小试、再加码、见拥塞就收手”的反馈探测出可用容量。
      - card:
          title: 两个窗口并存：保护接收方 vs 保护网络
          body: |
            在 TCP 里，发送方同时被两只手按着：
            1. **通告接收窗口（rwnd / AdvertisedWindow）**：接收方告诉你的，防把接收方内存撑爆（流量控制）。
            2. **拥塞窗口（congestion window，cwnd）**：发送方自己在心里记的变量，防把中间路由器队列塞爆（拥塞控制）。

            真正允许未确认的在途最大字节数永远取两者的较小值：$\text{MaxWindow} = \min(\text{cwnd}, \text{rwnd})$。cwnd 常用 **MSS**（单个 TCP 段最大数据载荷长度）作单位。
      - item:
          id: cwnd-vs-rwnd
          type: number
          prompt: 发送方算出当前拥塞窗口 `cwnd = 12 KB`，接收方在最新确认包里通告的接收窗口 `rwnd = 8 KB`，当前已经发出去但还没收到确认的数据有 3 KB。发送方现在最多还能再发多少 KB？
          answer: 5
          unit: KB
          explain: 允许的最大在途总量是 min(cwnd, rwnd) = min(12, 8) = 8 KB；减去已在途的 3 KB，还能再发 8 - 3 = 5 KB。
      - card:
          title: 慢启动与拥塞避免：先翻倍探底，再线性加 1
          body: |
            为什么刚连上总觉得下载前几秒越来越快？因为 TCP 有个阈值变量叫**慢启动门限（ssthresh）**，刚建连时通常把 `cwnd` 从很小的初值（教材教学模型按 **1 MSS** 讲）起步：
            - **慢启动（Slow Start）**（当 $\text{cwnd} < \text{ssthresh}$）：每收到一个新确认就加 1 MSS，等价于**每个往返（RTT）直接翻倍**（1 → 2 → 4 → 8…），虽然名字叫“慢”，其实是指数级加速！
            - **拥塞避免（Congestion Avoidance）**（当 $\text{cwnd} \ge \text{ssthresh}$）：不再翻倍，改为**每个往返稳步加 1 MSS**（加性增，8 → 9 → 10…），小心试探瓶颈边缘。
      - item:
          id: cwnd-phase
          type: choice
          prompt: 当 TCP 发送端的拥塞窗口 `cwnd` 刚好涨到并等于慢启动门限 `ssthresh` 时，下一轮每收到一整窗口的正常确认后，`cwnd` 怎么增长？
          options:
            - text: 切入拥塞避免阶段，每个 RTT 大约线性增长 1 个 MSS，不再翻倍
              correct: true
            - text: 继续维持指数翻倍，直到出现丢包为止
              why: 翻倍只发生在 cwnd 严格小于 ssthresh 的慢启动期；撞上门限后就放慢成线性 +1 试探
            - text: 立刻停在原地永远不再增加
              why: 只要没丢包、确认正常回来，拥塞避免仍会每轮稳步加 1 MSS 探测更高可用带宽
          explain: 慢启动负责快速逼近合理区间，达到 `ssthresh` 后立刻切到保守的“每 RTT +1 MSS”拥塞避免。
      - card:
          title: 例题：从 cwnd = 1 到门限 8 的前 6 个往返
          body: |
            设教学模型里初始 $\text{cwnd} = 1\text{ MSS}$，门限 $\text{ssthresh} = 8\text{ MSS}$，假设传输全程不丢包、接收窗口足够大。看看前 6 轮开始时的窗口怎么变：
          reveal:
            - title: 第 1 步：第 1–4 轮在慢启动阶段翻倍到达门限
              body: 第 1 轮开始 `cwnd = 1`；全收到确认后第 2 轮翻倍为 `2`；第 3 轮为 `4`；第 4 轮翻倍到 `8`，正好撞上 `ssthresh = 8`！
            - title: 第 2 步：从第 4 轮末尾起转入拥塞避免
              body: 一旦到达或超过门限 `8`，以后每过一个完整 RTT 只加 `1`：第 5 轮开始是 `9`，第 6 轮开始是 `10` MSS。
            - title: 第 3 步：注意题目问的是“第几轮开始时”
              body: 按顺序数清楚前 6 轮开始的值：`1, 2, 4, 8, 9, 10`。如果某轮初始翻倍本来会越过 `ssthresh`（比如初值 3、门限 8），通常在撞到门限时停在 8，之后再按 +1 递增。
      - card:
          title: 演示：用 Python 模拟慢启动与拥塞避免（含半途遇到阈值）
          body: |
            运行这段 Python 代码，观察初始 `cwnd = 2`、`ssthresh = 10` 时，窗口每过一轮怎样判断阶段并更新：
          sim:
            name: trace
            params:
              code: |
                cwnd, ssthresh = 2, 10
                log = []
                for rtt in range(1, 7):
                    log.append(cwnd)
                    if cwnd < ssthresh:
                        cwnd = min(cwnd * 2, ssthresh)
                    else:
                        cwnd += 1
              stdin: ''
      - item:
          id: trace-cwnd
          type: sim
          sim: trace
          params:
            code: |
              cwnd, ssthresh = 2, 10
              log = []
              for rtt in range(1, 7):
                  log.append(cwnd)
                  if cwnd < ssthresh:
                      cwnd = min(cwnd * 2, ssthresh)
                  else:
                      cwnd += 1
            stdin: ''
          goal:
            ask:
              - line: 4
                var: log
                hit: 6
          prompt: 单步执行完第 6 轮（即第 4 行第 6 次命中时），列表 `log` 记录下的前 6 个 RTT 开始时的 `cwnd` 依次是什么？
          explain: 第 1 轮记下 2 后翻倍成 4，第 2 轮记 4 后翻倍成 8，第 3 轮记 8 想翻倍但被 `ssthresh = 10` 截成 10，第 4、5、6 轮进入拥塞避免各加 1，所以 `log` 依次为 `[2, 4, 8, 10, 11, 12]`。
      - item:
          id: cwnd-modify
          type: number
          prompt: 改一下上面程序的条件：如果把第 1 行门限改成 `ssthresh = 4`（`cwnd` 初值仍为 2），那么跑完第 6 轮（即 `log` 里第 6 个元素）的 `cwnd` 会变成多少？
          answer: 8
          explain: 第 1 轮开始 `cwnd = 2` 翻倍到 4 撞上门限，之后每轮只加 1：前 6 轮记录依次为 `[2, 4, 5, 6, 7, 8]`，第 6 轮为 8。
      - item:
          id: cwnd-round6
          type: number
          prompt: 在标准教学模型中，初始拥塞窗口 $\text{cwnd} = 1\text{ MSS}$，慢启动门限 $\text{ssthresh} = 16\text{ MSS}$，全程没有丢包且接收窗口足够大。第 6 个 RTT 开始时的 `cwnd` 是多少 MSS？
          answer: 17
          explain: 前 5 个 RTT 开始时依次翻倍：1、2、4、8、16；第 5 轮达到门限 16 后切入拥塞避免，因此第 6 轮开始时加 1 变成 17 MSS。

  - id: loss-recovery-cc
    chapter: 拥塞控制
    title: 超时、快重传与现代拥塞控制
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 发送方连续发了 1、2、3、4、5 五个段，只有第 2 个段半路丢了，第 3、4、5 个都顺利到达。接收方连续发回三个一模一样的“我期待第 2 段”的确认。发送方收到这三条重复确认时，能猜出什么？
          options:
            - text: 第 2 段很可能丢了，但后面的 3、4、5 都过去了——路虽然小堵但根本没彻底断！
              correct: true
            - text: 整条网络完全死绝了，必须停止发送并等满超时期限
              why: 连续收到后续包触发的重复确认，恰恰证明还有好几个包正穿过网络到达对方
            - text: 接收方在开玩笑，第 2 段其实早就收到了
              why: 累计确认不会撒谎，“连续期待 2”说明 2 确实卡着没到而后续包已到
          explain: “只等超时才反应”太慢，而且连着收到后续包的重复确认本身就是极好的信息：说明网络没瘫，只需温和减半并立刻补发缺口。
      - card:
          title: 两种丢包信号：重传超时 vs 3 个重复 ACK
          body: |
            TCP 发现堵车丢包靠两种严重程度不同的信号（以经典 Reno 模型为例）：
            - **重传超时（RTO Timeout，最严重）**：半天一个确认也没回来，可能路彻底堵死！处理最狠：把门限减半 `ssthresh = max(cwnd / 2, 2)`，然后把 **`cwnd` 直接打回 `1 MSS`**，重新跑**慢启动**。
            - **收到 3 个重复 ACK（快重传 + 快恢复）**：后面的包还在到达，只是缺了一块。不用等定时器超时，立刻**快重传**那个缺失包，接着门限和窗口同时**减半**（`ssthresh = cwnd / 2`，`cwnd = ssthresh`，有的实现再加 3），直接留在**拥塞避免**阶段线性回升，形成著名的 **AIMD（加性增、乘性减）锯齿曲线**。
      - item:
          id: rto-vs-3dup
          type: choice
          prompt: 按教学版 TCP Reno 模型，当前 $\text{cwnd} = 24\text{ MSS}$，发送方连续收到 3 个重复 ACK 触发快重传与快恢复（不计额外的 +3 临时膨胀）。新的 `ssthresh` 和 `cwnd` 分别设为多少？
          options:
            - text: ssthresh = 12 MSS，cwnd = 12 MSS（减半后进入拥塞避免）
              correct: true
            - text: ssthresh = 12 MSS，cwnd = 1 MSS（打回 1 重新慢启动）
              why: 把 cwnd 打回 1 重新慢启动的是更严重的“重传超时（RTO）”，不是 3 个重复 ACK
            - text: ssthresh = 24 MSS，cwnd = 25 MSS（继续加 1 忽略缺口）
              why: 丢包说明路径已经触及上限，必须乘性减半让出缓冲空间
          explain: 区分两种拥塞反应非常关键：超时归 1 慢启动；3 重复 ACK 触发快重传与快恢复，直接减半继续线性增长。
      - card:
          title: 为什么 AIMD 的锯齿能保证公平与稳定
          body: |
            为什么每次拥塞要“加 1”慢爬、“乘 1/2”狠降？Peterson & Davie 指出，**AIMD（加性增、乘性减）**是让多条共享瓶颈的流稳步趋向公平稳态的关键：

            不管两条流原本谁占得多、谁占得少，每次拥塞两人都砍掉**一半**（占大头的人砍掉的绝对量远多于占小头的人），然后两人每次都加**同样多**（+1）。几轮锯齿之后，两条流的带宽份额自然就趋于 1:1 相等！
      - card:
          title: 现代演进：CUBIC 与基于时延/速率的控制
          body: |
            高速长距离网络下，Reno 每轮只加 1 MSS 爬得太慢！现代系统演化出几种新策略（教材 6.4 节）：
            - **CUBIC**（Linux 默认）：放弃线性加 1，改用关于时间的三次曲线，刚减半时迅速爬回上次最大窗口 `W_max` 附近，靠近时放平小心试探。
            - **Vegas 与 Google BBR（瓶颈带宽与往返时间算法）**：不等真丢包！直接测最小往返时延和真实交付速率，发现排队时延膨胀就主动控速，BBR 还按估计带宽**均匀发包（pacing）**消除突发排队。
      - item:
          id: bbr-vs-reno
          type: choice
          prompt: 传统 TCP Reno 是“等到路由器队列塞满丢包了才知道堵车”，Google BBR 和早期的 Vegas 则尝试在丢包前就控速。它们主要靠测量什么信号？
          options:
            - text: 实时监测最小往返时延（RTT）和真实交付带宽，发现排队延迟上升就提前稳速
              correct: true
            - text: 依赖路由器把排队深度直接写进 IP 首部的空闲字段里显式回传给发端
              why: Vegas 和 BBR 都是纯发送端算法，不需要中间路由器改造或写新字段，只靠测自己收到的确认时间推算
            - text: 一旦检测到延迟微涨就立刻把发送窗口清零，等十秒再重连
              why: BBR 会把发送速率稳定在测出的瓶颈带宽附近并均匀发包，而不是粗暴清零断流
          explain: 队列还没溢出时，包已经在队列里多等了——延迟上涨比丢包更早出现，正是延迟/速率型算法的观测信号。
      - card:
          title: 数据中心专用：DCTCP 利用 ECN 按轻重微调
          body: |
            数据中心内部交换机缓存极浅、微突发频繁，传统 TCP 一遇拥塞就对半砍掉太震荡。**DCTCP（数据中心 TCP）** 借助路由器打上的 ECN 标记，统计窗口内遇到拥塞的字节比例，按拥塞轻重**成比例平滑缩减**窗口，在保证极低排队时延的同时维持高吞吐。
      - item:
          id: modern-cc-match
          type: match
          prompt: 把四种拥塞控制思路和它们的核心特点配对。
          pairs:
            - [经典 Reno AIMD, 遇丢包乘性减半、平时每轮加性增 1 MSS]
            - [Linux 默认 CUBIC, 按三次曲线迅速逼近上次最大窗口再放缓试探]
            - [基于时延/速率的 BBR, 测量瓶颈带宽与最小往返时延并均匀发包，不等到丢包才降速]
            - [数据中心 DCTCP, 根据 ECN 标记字节的比例按比例微调窗口大小]
          explain: 四种算法分别针对通用互联网公平稳定、高带宽长距离链路、减少队列排队膨胀、数据中心浅缓冲超低延迟。
      - item:
          id: aimd-fairness
          type: choice
          prompt: 两条共享瓶颈队列的 TCP 连接，窗口原本分别是 16 MSS 和 4 MSS（合计 20 MSS 刚好塞满队列）。两者同时遇拥塞减半成 8 和 2 MSS，随后在拥塞避免阶段各自每轮加 1 MSS 连爬 5 轮直到再次挤满 20 MSS（变成 13 和 7）。一轮锯齿后，两者的差距怎么变？
          options:
            - text: 差距从 12 MSS 缩小到了 6 MSS（正好减半），两者的带宽份额向公平靠近
              correct: true
            - text: 差距依然保持 12 MSS 不变，因为每次加的幅度都是 1 MSS
              why: 乘性减半按比例砍掉了大窗口更多空间（16 砍掉 8、4 只砍掉 2），再等量各加 5 后差距缩了一半
            - text: 原本小的连接被永远压死在 2 MSS 涨不起来
              why: 减半让出了一半缓冲区名额后，小连接和大连接一样每轮都能稳定加上 1 MSS
          explain: 乘性减半让强者多退、加性增让双方同进，是数学上证明 AIMD 稳步趋向 45 度公平平分线的经典机制。
  # ======================================================================== 名称系统与应用协议
  - id: dns-hierarchy
    chapter: 名称系统与应用协议
    title: DNS：域名树、解析流程与缓存
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 浏览器只知道你输入的 `www.example.com`，可网络层 IP 包里必须填 32 位或 128 位的 IP 地址。如果全世界所有网站都记在电脑里同一张静态表格上，每次有新网站上线会怎样？
          options:
            - text: 这张全球表格会大到装不下，而且每天几百万次增删改根本同步不过来
              correct: true
            - text: 只要每台电脑每天自动下载一次全网名单就行，完全不会卡
              why: 互联网早期确实用过一张全网共享的 `HOSTS.TXT` 文件，很快因为机器太多彻底维护不动，才发明了分层分布式查询
            - text: 路由器会自动猜出这个名字对应的 IP 地址
              why: 域名是给人记的字符串，路由器只认 IP 前缀，猜不出名字和 IP 的对应关系
          explain: 为了既能让各地自己管理自己的域名，又能让全球随时查到，互联网把名字拆成了一棵分层树——这就是 DNS。
      - card:
          title: 域名是一棵从右往左分的层级树
          body: |
            **DNS（域名系统）**把域名用点号分层，越靠右层级越高：完整写法末尾还有个隐含的根点，如 `www.example.com.`：
            - 根域 `.`（全球 13 组根服务器地址预先写死在解析器引导文件里）；
            - 顶级域（TLD，如 `.com`、`.org`、`.cn` 等超过 1200 个）；
            - 权威域（如 `example.com`，一般至少配两台主备权威服务器）。

            这种分治让 `.com` 只管记谁负责 `example.com`，`example.com` 的管理员自己随时修改 `www` 的地址就行。
      - card:
          title: 递归请求与逐层查找（含缓存与 TTL）
          body: |
            你的电脑不亲自满世界去问，而是把请求发给预先配好的**本地递归解析器**（通常运行在 UDP **53 端口**）。如果本地缓存没命中：
            1. 问**根服务器**：“`.com` 归谁管？” → 得到顶级域服务器地址。
            2. 问 **`.com` 顶级域服务器**：“`example.com` 归谁管？” → 得到权威服务器地址。
            3. 问 **`example.com` 权威服务器**：“`www.example.com` 的 IP 是多少？” → 拿到最终答案，存进本地缓存再回给你！

            每条 DNS 记录都带着 **TTL（缓存存活秒数，与 IP 的跳数 TTL 是两个字段）**，没过期前本地解析器直接复用缓存回答。
      - item:
          id: dns-order
          type: order
          prompt: 本地 DNS 解析器缓存全部未命中时，把查询 `www.example.com` 的步骤排好顺序。
          steps:
            - 客户端向本地递归解析器发送查询请求
            - 本地解析器向根服务器询问 .com 顶级域服务器地址
            - 本地解析器向 .com 顶级域服务器询问 example.com 权威服务器地址
            - 本地解析器向 example.com 权威服务器取回 www.example.com 的 IP 并缓存返回
          explain: 客户端只向本地解析器问一次（递归查询），本地解析器替你依次问根、顶级域、权威服务器（逐层引用）。
      - card:
          title: DNS 资源记录五元组与查询安全铺垫
          body: |
            一条 DNS 记录是五元组 `(Name, TTL, Class, Type, Value)`。常见类型有：
            - **`A`**：域名 $\to$ IPv4 地址；**`AAAA`**：域名 $\to$ IPv6 地址；
            - **`CNAME`**：别名（指向另一个域名）；
            - **`NS`**：指明该区域由哪台权威域名服务器负责；
            - **`MX`**：指明发往该域名的电子邮件该交给哪台邮件服务器。

            **接轨网络安全**：DNS 一次查询默认走无连接的 UDP（16 位事务 ID + 源端口匹配回信）。如果谁能提前猜中编号并抢先塞回假应答，就会把错误地址写进本地缓存（伪造应答污染缓存）。
      - item:
          id: dns-records
          type: match
          prompt: 把四种常见 DNS 资源记录类型和它们的用途配对。
          pairs:
            - [A 记录, 把域名解析成 32 位 IPv4 地址]
            - [AAAA 记录, 把域名解析成 128 位 IPv6 地址]
            - [CNAME 记录, 把一个别名指向另一个规范域名]
            - [MX 记录, 指定负责接收该域名电子邮件的服务器]
          explain: A 给 IPv4，AAAA 给 IPv6，CNAME 是域名别名映射，MX 专门用于邮件投递路由。
      - item:
          id: dns-ttl-stale
          type: choice
          prompt: 网站运维刚刚把 `api.example.com` 的 A 记录（原 TTL = 3600 秒）从旧 IP 改成了新 IP。为什么半小时后仍有部分用户连到了旧 IP？
          options:
            - text: 权威服务器不会主动通知全网缓存，各地解析器里的旧缓存要等 3600 秒 TTL 过期才重查
              correct: true
            - text: DNS 的 IP 跳数限制了数据包最多只能走 3600 步
              why: DNS 记录的 TTL 是“缓存保留秒数”，和 IP 分组头里每跳减 1 的生存跳数毫无关系
            - text: 本地解析器一旦存过某条记录就永远不会再更新
              why: 缓存只保留 TTL 规定的秒数，到期后下一次请求就会重新向权威服务器拉取最新记录
          explain: 这也是做服务器迁移前，运维常会提前把 DNS 的 TTL 调小（如降到 60 秒）的原因。
      - item:
          id: dns-udp-match
          type: choice
          prompt: 为什么 DNS 普通查询默认先选 UDP 53 端口，而不是上来就做 TCP 三次握手？
          options:
            - text: 绝大多数 DNS 查询只有一来一回两个小包，UDP 省去建连拆连的往返延迟
              correct: true
            - text: DNS 报文超过 64 KB 时无法走 TCP，只能靠 UDP 传输
              why: 恰好相反！单条 UDP 报文有长度限制（传统 512 字节），遇到区域传送或超长应答时 DNS 会自动切回 TCP
            - text: UDP 53 端口有内置加密，能防住所有伪造回信
              why: 传统 UDP DNS 报文是明文，只靠 16 位事务 ID 和随机源端口粗略对账
          explain: 一次一问一答的短小查询用 UDP 最快（仅 1 RTT）；若报文太大或需要可靠同步才切 TCP。

  - id: http-versions
    chapter: 名称系统与应用协议
    title: HTTP/1.1 到 HTTP/3 与 Web 服务
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个网页里嵌着 20 张小图标。如果浏览器用最老的 HTTP/1.0 方式——每拿一张图片就重新做一次 TCP 三次握手、拿完立刻四次挥手断开，会有什么坏处？
          options:
            - text: 光建立和拆掉 20 次 TCP 连接就白白多耗几十个往返，而且每次都得从 cwnd=1 慢启动重新爬坡
              correct: true
            - text: 速度反而最快，因为每次建连不用排队
              why: TCP 三次握手至少花 1 个 RTT，加上慢启动刚起步窗口极小，传输小文件全耗在握手上了
            - text: HTTP/1.0 一次连接其实默认就能无限发请求
              why: 早期 HTTP/1.0 默认一次请求就关连接，是 HTTP/1.1 才默认开启持久连接的
          explain: 复用同一条连接省去重复握手和冷启动，这就是 HTTP 不断演进的核心动力之一。
      - card:
          title: HTTP 请求与响应的格式（及 HTTPS 的角色）
          body: |
            **HTTP（超文本传输协议）**是浏览器与服务器对话的文本格式（默认端口 80）：
            - **请求**：起始行（如 `GET /index.html HTTP/1.1`）+ 若干首部行（必带 `Host:`、可选条件 `If-Modified-Since`）+ **一个空行** + 可选正文。常用方法有 `GET`、`POST`、`PUT`、`DELETE`、`HEAD`、`OPTIONS`。
            - **响应**：状态行（如 `HTTP/1.1 200 OK`）+ 首部 + 空行 + 正文。状态码 `2xx` 成功、`3xx` 重定向、`4xx` 客户端错（如 `404`）、`5xx` 服务端错。

            明文 HTTP 走过公网会被窃听篡改；在 TCP 和 HTTP 之间加上 **TLS（传输层安全协议）** 做加密和身份认证，就是 **HTTPS**（端口 443）。
      - item:
          id: http-status
          type: match
          prompt: 把四类 HTTP 状态码和它们的含义配对。
          pairs:
            - [2xx（如 200 OK）, 请求已成功处理]
            - [3xx（如 301 / 304）, 需要客户端重定向或命中本地缓存条件]
            - [4xx（如 404 Not Found）, 客户端请求有误（如路径不存在或无权限）]
            - [5xx（如 502 Bad Gateway）, 服务器端处理请求时发生故障]
          explain: 2xx 成功，3xx 跳转或未修改，4xx 错在请求方，5xx 错在服务端。
      - card:
          title: HTTP/1.1 持久连接与 HTTP/2 多路复用
          body: |
            为了消除一个网页加载几十个资源的等待，HTTP 先演化出两代：
            - **HTTP/1.1**：引入**持久连接**（一条 TCP 连接按顺序接力发请求），但前一个大响应卡住时，后面的请求只能排在后头干等（应用层队头阻塞）。
            - **HTTP/2**：把文本拆成二进制帧，用 **HPACK** 算法压缩冗长首部，并在**同一条 TCP 连接**里同时交错跑多个带编号的**流（Stream）**。同一连接下各请求不必彼此等待——除非底层那条 TCP 自己丢了包！
      - item:
          id: http2-hol
          type: choice
          prompt: HTTP/2 已经在同一条 TCP 连接里通过多个流并发发送网页里的 HTML、CSS 和图片了。如果路上恰好丢了一个装有 CSS 数据的 TCP 分组，图像流会受影响吗？
          options:
            - text: 会一起暂停等待重传，因为操作系统 TCP 把整条连接当成一根不能跳读的顺序字节流
              correct: true
            - text: 完全不受影响，图像流会立刻越过 CSS 的缺口交给浏览器渲染
              why: HTTP/2 的多个流只是应用层交错，对底层内核的 TCP 来说只有同一根有序字节流，缺 1 字节就全卡住
            - text: HTTP/2 遇到丢包会自动改走 UDP 发送剩下的图片
              why: HTTP/2 固定跑在 TCP 上，不会临时切协议
          explain: HTTP/2 消除了应用层排队，但受制于单一 TCP 连接，留下了“传输层 TCP 队头阻塞”。
      - card:
          title: HTTP/3（QUIC）：摆脱 TCP 队头阻塞
          body: |
            **HTTP/3** 放弃了 TCP，改跑在基于 UDP 的 **QUIC（新一代多路复用安全传输协议）** 之上：
            1. 把多路流直接做进 QUIC 传输层，一个流丢包重传只卡那一个流，其余流照常交付；
            2. 把传输握手和 TLS 1.3 加密合并成 **1 RTT**（比 TCP + TLS 1.2 的 3 RTT，或 TCP + TLS 1.3 的 2 RTT 都要少）；
            3. 携带 **Connection ID**，手机从 Wi-Fi 切到 5G 换了 IP 也不用断线重连！
      - item:
          id: http3-quic
          type: choice
          prompt: HTTP/2 已经在一条连接里支持多路流并发了，为什么 HTTP/3 还要放弃 TCP 改用基于 UDP 的 QUIC？
          options:
            - text: HTTP/2 的多个流仍挤在同一条 TCP 字节流里，只要 TCP 丢了一个包，所有流都得一起暂停等重传；QUIC 让各流互不拖累
              correct: true
            - text: 因为 UDP 绝对不会丢包，用 QUIC 就不需要任何重传和拥塞控制了
              why: UDP 照样会丢包，QUIC 自己在 UDP 之上实现了每条流的可靠重传和类 TCP 的拥塞控制
            - text: HTTP/3 取消了加密，所以不用像 HTTP/2 那样花时间握手
              why: 恰恰相反，QUIC 把 TLS 1.3 加密直接焊进了传输握手，默认全程强制加密且更快（1 RTT 建连）
          explain: 消除跨流的 TCP 队头阻塞、融合加密减少握手轮次、用 Connection ID 抗网络切换，正是 HTTP/3 的三大突破。
      - card:
          title: Web 服务（REST）与双向实时通信（WebSocket）
          body: |
            除了给浏览器发网页，HTTP 也成了程序之间调用接口的通用底座（教材 9.1.3 节 **Web Services / REST** 表述性状态转移风格：把业务资源映射成 URL，用 `GET/POST/PUT/DELETE` 操作，通常返回 JSON）。

            如果页面需要服务器随时主动推送消息（如聊天室、实时行情），客户端先通过 HTTP 发起一次升级握手，把连接切换成 **WebSocket**：一条基于 TCP 的长连接，此后客户端和服务器随时可以双向互相发消息帧，不必每次由客户端重新问一遍。
      - item:
          id: web-proto-choice
          type: choice
          prompt: 你要写一个多人在线网页白板，任何人一落笔，服务器就要立刻把坐标推给同一房间里所有人的浏览器。下面哪种协议最贴切？
          options:
            - text: WebSocket（经 HTTP 升级后的全双工长连接，服务器可随时主动推送消息帧）
              correct: true
            - text: 传统 HTTP/1.0 短连接轮询（每次鼠标移动就重新经历一次 TCP 三次握手和完整首部请求）
              why: 每次移动都重握手、重发大段 HTTP 首部，延迟太高且很快把服务器连接打满
            - text: 让客户端只靠传统只读的 HTTP/1.1 静态资源缓存每秒反复刷新整张网页图片
              why: 每次重刷整张页面既浪费带宽又闪烁，无法实现毫秒级增量坐标同步
          explain: WebSocket 建连后保持双向消息通道，低延迟且省去了反复发 HTTP 首部的开销。

  - id: sockets-echo
    chapter: 名称系统与应用协议
    title: 用 Python Socket 写出 TCP 回显程序
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 客户端对一条已经建好的 TCP 连接调用了一次 `client.sendall(b"hello")` 发送 5 个字节。服务器那边调用 `conn.recv(1024)` 一次（缓冲区明明有 1024 字节这么大！），是不是**保证**一次就能把 `"hello"` 五个字节全读回来？
          options:
            - text: 不保证！TCP 是连续字节流，第一次 `recv` 可能只先读到 `b"he"`，剩下的下次才读到
              correct: true
            - text: 绝对保证！只要缓冲区 1024 大于 5，一次 `recv` 必定完整吐出发送方那一次 `sendall`
              why: TCP 不保存“这是你调用一次 send 塞进来的边界”，网络分包和系统读取时机都可能让 `recv` 只取回一部分字节
            - text: 会读出 `b"hello"` 加上后面一堆空格凑满 1024 个字节
              why: '`recv(1024)` 的参数只是“本次最多读多少”，实际读到几个字节就返回几个字节'
          explain: '**TCP 没有消息边界**——这是写网络程序时初学者最容易踩的大坑，也是为什么回显服务器必须放在 `while` 循环里一直读直到收到空字节串 `b""`。'
      - card:
          title: Python TCP 服务器骨架与内核缓冲
          body: |
            用标准库 `socket` 写回显服务：默认**阻塞模式**下，调用 `recv` 时若操作系统接收缓冲区暂时没数据，程序会暂停等新字节到达（C.3.5 还会学怎么绕开内核拷贝开销）：

            ```python
            import socket
            with socket.create_server(("127.0.0.1", 9000)) as srv:
                conn, addr = srv.accept()
                with conn:
                    while True:
                        data = conn.recv(1024)
                        if not data: break
                        conn.sendall(data)
            ```
      - card:
          title: 演示：为什么接收端必须用循环拼回完整数据
          body: |
            假设客户端一口气发出 `b"hello"`，由于分包，底层每次只先送到 2 个字节。看看下面模拟接收循环的代码，怎样每次取出分块直到读到 `b""` 才拼出完整报文：
          sim:
            name: trace
            params:
              code: |
                wire = [b"he", b"ll", b"o", b""]
                idx = 0
                received = []
                while True:
                    chunk = wire[idx]
                    idx += 1
                    if chunk == b"":
                        break
                    received.append(chunk)
                full = b"".join(received)
              stdin: ''
      - item:
          id: trace-stream
          type: sim
          sim: trace
          params:
            code: |
              wire = [b"he", b"ll", b"o", b""]
              idx = 0
              received = []
              while True:
                  chunk = wire[idx]
                  idx += 1
                  if chunk == b"":
                      break
                  received.append(chunk)
              full = b"".join(received)
            stdin: ''
          goal:
            ask:
              - line: 10
                var: full
                hit: 1
          prompt: 单步执行完第 10 行后，拼出的完整字节串 `full` 是什么？
          explain: 循环连续接住三块并在遇到空字节串 `b""` 时跳出，最后 `b"".join(received)` 拼回完整的 `b'hello'`。
      - item:
          id: stream-modify
          type: number
          prompt: 改一下上面模拟代码的条件：如果网络更碎，把第 1 行改成每次只到 1 个字节 `wire = [b"h", b"e", b"l", b"l", b"o", b""]`，循环里会执行几次 `chunk = wire[idx]`（包括最后一次读到 `b""`）？
          answer: 6
          explain: 5 个单字节数据块加上末尾的 1 个空字节串 `b""`，`while True` 一共读 6 次才停下。
      - card:
          title: 客户端怎么发完并安全等全部回显
          body: |
            再看客户端的写法：

            ```python
            import socket
            with socket.create_connection(("127.0.0.1", 9000)) as s:
                s.sendall(b"hello")
                s.shutdown(socket.SHUT_WR)  # 关掉写端，还继续读回显！
                chunks = []
                while True:
                    chunk = s.recv(1024)
                    if not chunk: break
                    chunks.append(chunk)
                print(b"".join(chunks))     # b'hello'
            ```

            如果客户端不关闭写端（`shutdown(SHUT_WR)`）就死等，服务器还在等它继续发，两边就会一起卡死！
      - item:
          id: socket-shutdown
          type: choice
          prompt: 下面这段 TCP 回显客户端代码里，发送完请求后为什么调用 `s.shutdown(socket.SHUT_WR)` 而不是直接调用 `s.close()`？
          code: |
            s.sendall(b"hello")
            s.shutdown(socket.SHUT_WR)
            while True:
                chunk = s.recv(1024)
                if not chunk:
                    break
          lang: python
          options:
            - text: '`SHUT_WR` 只关闭己方发送方向告知已说完，同时保留接收方向继续读完回显'
              correct: true
            - text: '`close()` 不会向对方发送 TCP 结束标志，服务器永远不知道发完了'
              why: '`close()` 也会发 FIN，但它会把整个套接字的读写通道一并关掉，自己再也不能调 `recv` 了'
            - text: '`SHUT_WR` 会清空内核发送缓冲区里还没来得及发出去的数据以腾出内存'
              why: '`shutdown(SHUT_WR)` 会把此前已经塞进套接字的数据正常发完后才跟上 FIN，不会丢数据'
          explain: 这正好用上了 TCP 的“半关闭”特性：客户端发 FIN 告诉服务器不会再写了，服务器回完剩下的回显再发 FIN，客户端优雅读到 `b""` 结束。
      - item:
          id: socket-sendall
          type: choice
          prompt: Python 的 `socket` 同时提供 `s.send(data)` 和 `s.sendall(data)` 两个方法。如果要一次发一段 100 KB 的数据，为什么通常用 `sendall` 而不是只调一次 `send`？
          options:
            - text: '`send` 在操作系统发送缓冲区暂时装不下时可能只写出一部分，`sendall` 会内部循环发完'
              correct: true
            - text: '`send` 只能用来发 UDP 小数据报，`sendall` 才是发 TCP 字节流用的'
              why: 两者都可用于已连接的 TCP 套接字，差别在于 `send` 可能部分写出并返回实际写出的字节数
            - text: '`sendall` 会把 100 KB 数据自动按 1500 字节拆包，而 `send` 不会分片'
              why: 拆包和分片由内核协议栈自动完成，和调 `send` 还是 `sendall` 无关
          explain: 与 `recv` 可能少读类似，单次 `send` 也可能只写出一部分字节并返回实际写出的字节数；`sendall` 帮我们在循环里补发剩余部分。
      - item:
          id: socket-eof
          type: choice
          prompt: '在阻塞模式下的 Python TCP 服务端代码 `data = conn.recv(1024)` 中，什么情况会返回空字节串 `b""`？'
          options:
            - text: 客户端正常关闭了写端（发出 FIN），所有先前发送的数据都已读完
              correct: true
            - text: 网络暂时卡顿 10 毫秒，接收缓冲区这一刻恰好是空的
              why: 只要连接还开着且没有报错，阻塞式的 `recv` 会一直等新字节到达，不会随便吐出 `b""`
            - text: 客户端刚刚通过 `sendall` 发送了一条空字节串 `b""`
              why: TCP 是无消息边界的字节流，`sendall(b"")` 不会向网线里发送一个叫“空消息”的包
          explain: '`b""` 是 TCP socket 唯一用来表达对端关闭发送方向（EOF）的信号。'

  - id: email-snmp
    chapter: 名称系统与应用协议
    title: 电子邮件与网络管理（SMTP/IMAP、SNMP）
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 用浏览器打开网页时，如果对方网站此时恰好宕机关了 10 秒，浏览器立刻报错打不开。可如果你给朋友发一封电子邮件，恰好对方邮件服务器在维护关机了一小时，邮件系统通常怎么处理？
          options:
            - text: 发送方的邮件服务器先把邮件存在本地队列里，隔一段时间自动重试投递（存储转发），几天内恢复都能送到
              correct: true
            - text: 只要对方关机 1 秒，电子邮件协议立刻永久删掉这封信且不重试
              why: SMTP 邮件网关天生就是异步存储转发架构，通常会坚持重试数天
            - text: 邮件必须靠浏览器网页一直开着才能收发
              why: 邮件投递由后台的邮件传输代理（MTA）服务器接力完成，你关掉电脑照样能投递
          explain: 与即时请求响应的 HTTP 不同，电子邮件基于异步的“存储转发”，能跨过短暂断网和服务器维护。
      - card:
          title: 电子邮件怎么写信封、夹附件、读信箱
          body: |
            电子邮件由三部分协议各管一摊：
            - **RFC 822 + MIME（多用途互联网邮件扩展）**：信由 ASCII 首部行（`From:`、`To:`、`Subject:`）+ 空行 + 正文组成。非文本附件靠 **MIME**（`Content-Type:`、`multipart/mixed`）和 **Base64** 编码变成纯文本传输。
            - **SMTP**（默认端口 25，跑在 TCP 上）：负责服务器之间把信接力投过去，命令像对话：`HELO` → `MAIL FROM:` → `RCPT TO:` → `DATA`（末尾单独一行 `.` 结束），返回码如 `250` 成功、`354` 请发正文、`550` 查无此人。
            - **IMAP**（端口 143，或更简单的 POP3）：让你在手机和电脑上读取、搜索和保留服务器信箱里的邮件与 `Seen/Answered` 状态标记。
      - card:
          title: 例题：Base64 怎样把 3 个字节变成 4 个字符
          body: |
            早年 SMTP 只保证 7 位 ASCII 字符不被破坏，照片和中文必须先用 **Base64** 编码：把每 **3 个字节（24 比特）** 切分成 **4 组 6 比特**，每组 0–63 映射到 `A–Z, a–z, 0–9, +, /` 共 64 个安全字符之一。算算英文 `"Cat"`：
          reveal:
            - title: 第 1 步：把 3 个字符拆成 24 位二进制
              body: '`''C''`=67(`01000011`), `''a''`=97(`01100001`), `''t''`=116(`01110100`)。连在一起是 `010000 110110 000101 110100`。'
            - title: 第 2 步：按每 6 位一组转成十进制查表
              body: 四组分别是 `010000`=16(`Q`)、`110110`=54(`2`)、`000101`=5(`F`)、`110100`=52(`0`)。（Base64 表中 0..25 是 A..Z，26..51 是 a..z，52..61 是 0..9。）
            - title: 第 3 步：写出编码结果与体积变化
              body: 结果是 `"Q2F0"`！每 3 字节原数据变成 4 字节可打印字符，数据体积会膨胀到原来的 $4/3$（约多占 33%）。
      - item:
          id: base64-size
          type: number
          prompt: 邮件里有一个正好 300 字节的二进制小图标，经过 Base64 编码后放进邮件正文，编码后的纯文本有多少个字节（不计换行符）？
          answer: 400
          unit: 字节
          explain: Base64 每 3 个字节编码成 4 个 ASCII 字符：300 × (4 / 3) = 400 个字符（字节）。
      - card:
          title: 网络管理：从 SNMP 轮询到意图驱动的 OpenConfig
          body: |
            机房里几百台交换机路由器怎么监控和改配置（教材 9.3.2 节）？
            - **传统 SNMP（简单网络管理协议）**：管理站用 UDP 161 向各设备代理定期发 `GET` / `GET-NEXT` / `SET`。指标按 **MIB（管理信息库）**树里的点分数字 **OID** 寻址（如 `1.3.6.1.2.1.4.3` 记收到的 IP 包数），用 ASN.1/BER 编码。
            - **现代声明式配置（OpenConfig / NETCONF / 遥测）**：逐台敲命令容易手滑出错，现在用统一数据模型下发全网目标意图，并由设备主动推遥测流。
      - item:
          id: email-snmp-match
          type: match
          prompt: 把四项应用与管理需求配对给合适的协议或格式。
          pairs:
            - [把二进制图片附件安全编成 ASCII 文本塞进邮件, MIME 与 Base64]
            - [跨邮件服务器存储转发投递信件, SMTP]
            - [在多台设备上同步查看和标记云端信箱状态, IMAP]
            - [按 MIB 里的数字 OID 向路由器定期查询接口收发包计数, SNMP]
          explain: MIME/Base64 管附件格式，SMTP 管发信接力，IMAP 管多端管信箱，SNMP 管传统网络监控指标读写。
      - item:
          id: smtp-code
          type: choice
          prompt: 传统 SMTP 投递邮件时，发信服务器向收信邮件服务器发送 `RCPT TO:<nobody@example.org>` 后收到回复 `550 No such user`。这表示什么？
          options:
            - text: 对方邮件服务器明确查无此收件人，属于永久性失败而不是临时堵车，不用反复重发
              correct: true
            - text: 对方服务器临时重启了，稍后重试 550 次就能收到
              why: '`5xx` 是永久拒绝码（如收件人不存在），只有 `4xx` 才是临时故障需要排队重试'
            - text: 邮件正文太长，必须立刻切分成 Base64
              why: '`550` 在还没发正文 DATA 前就已经针对收件人地址拒绝了'
          explain: SMTP 沿用三位响应码：`2xx/3xx` 成功或请继续，`4xx` 临时出错稍后重试，`5xx` 永久失败直接退信。

  - id: overlay-cdn
    chapter: 名称系统与应用协议
    title: 覆盖网络、P2P、流媒体与 CDN
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 远方有一份 1 GB 的热门系统镜像文件，突然有十万人同一分钟同时下载。如果全都死盯着公司机房里那唯一一台源服务器拉数据，会怎样？
          options:
            - text: 源服务器的出口带宽和连接数立刻被挤爆，大家全卡死；把副本分散到离用户近的节点或用户之间互传才能接住
              correct: true
            - text: 只要多开几个并发连接，一台千兆网卡的服务器就能轻松给十万人同时跑满百兆下载
              why: 十万人每人哪怕只占 1 Mbps 也需要 100 Gbps 出口，远超单台普通服务器网卡和出口光缆容量
            - text: 路由器会自动把同一份文件内容永久缓存在内核路由表里
              why: 路由器转发表只存 IP 前缀，不缓存应用层的 1 GB 文件内容
          explain: 要扛住海量并发和跨洲远距离延迟，现代互联网在底层 IP 之上又搭起了“覆盖网络”——包括 CDN 和 P2P。
      - card:
          title: 覆盖网络：在现有网络上搭逻辑层
          body: |
            **覆盖网络（Overlay Network）**是在已有 IP 网络之上再搭一层逻辑连线与隧道（把包裹装进外层包里穿过底层，如早期把 IPv6 装进 IPv4 隧道的 6-BONE）。

            例如 **RON（弹性覆盖网络）**：十几个节点互相周期探测延迟和丢包率，一旦底层 BGP 因为链路断或政策原因绕远卡死，RON 能在 **20 秒内**自动让流量先绕道一个顺畅的中间节点跳过去——这正是现代 SD-WAN 的前身。
      - item:
          id: overlay-purpose
          type: choice
          prompt: 既然底层互联网已经有 IP 和 BGP 路由了，为什么 RON 或早期 6-BONE 还要在上面再搭一层“覆盖网络”？
          options:
            - text: 不用改动全球几万家运营商的底层路由器，就能快速试行新协议或绕过底层慢故障路径
              correct: true
            - text: 覆盖网络可以在应用层重新算一条物理直连捷径，彻底避开原有运营商的物理光缆
              why: 覆盖网络的数据包照样要跑在原有物理光缆和底层 IP 路由器上，只是把包封装送到指定的逻辑跳点
            - text: 搭了覆盖网络之后就可以彻底停掉底层 BGP 和 IP 路由表，改用覆盖层编号直接寻址
              why: 覆盖节点之间互相通信依然完全依赖底层 IP 网络和 BGP 路由把隧道包送过去
          explain: 覆盖网络的本质是“在应用或边缘节点之间做逻辑拓扑，把底层网络当成传输隧道”，换来部署灵活与快速绕障。
      - card:
          title: 内容分发网络（CDN）：把静态副本放到家门口
          body: |
            **CDN（内容分发网络）**在各地运营商机房部署大量**边缘缓存代理**，存下网站的图片、脚本和视频切片（动态请求仍回源站）。

            把用户引去最近且空闲边缘节点的常见手段：用 **DNS 重定向**（把 TTL 设得很短如 20 秒，按你的位置回就近节点 IP），再用一致性哈希把相同 URL 稳稳落到同一组边缘机器上，提升缓存命中率！
      - item:
          id: cdn-mechanism
          type: choice
          prompt: 某大型视频网站使用 CDN 的两级 DNS 重定向技术来分配边缘缓存服务器。为什么 CDN 往往把这类 DNS 解析记录的 TTL 设得很短（例如 20 秒）？
          options:
            - text: 方便在某地节点过载或故障时，客户端很快重新查询 DNS 切到别的健康就近节点
              correct: true
            - text: 为了防止视频文件在边缘服务器硬盘里放超过 20 秒
              why: DNS 的 TTL 控制的是“域名解析结果缓存在本地多久”，不控制边缘节点磁盘上视频缓存多久
            - text: DNS 协议规定超过 20 秒的记录会被路由器丢弃
              why: 常规网站 DNS 记录的 TTL 经常设为几百到几千秒，短 TTL 是 CDN 为了灵活指引特意选的策略
          explain: 短 TTL 让全网用户每隔一小会儿就会重新问一次智能 DNS，这样一有某个边缘机房拥堵或断线就能迅速把新流量拨走。
      - card:
          title: 从无结构泛洪到一致性哈希 DHT
          body: |
            CDN 靠厂商多租机房，**P2P（对等网络）**则把所有用户的带宽和磁盘凑在一起：
            - **Napster** 还依赖中心目录，**Gnutella** 用带唯一查询号 `QID` 和 `TTL` 的泛洪找文件，节点一多全网都在喊“谁有这首歌”。
            - **结构化 DHT（分布式哈希表，如 Pastry）**用**一致性哈希**把节点 ID 和对象 ID 一起扔进一个巨大的 $2^{128}$ 环形空间，对象归数值最接近的节点管，按前缀路由只需 $\log_{16} N$ 跳就能找到。
      - item:
          id: dht-consistent
          type: choice
          prompt: 结构化 P2P 网络（DHT）为什么要用“一致性哈希环”来决定哪个文件归哪个节点管，而不用简单的 `hash(file) % 节点总数`？
          options:
            - text: 一致性哈希在节点加入或退出时，只需要搬移相邻极少数对象，不会让全网几乎所有映射全部洗牌
              correct: true
            - text: 因为一致性哈希能把 1 GB 大文件压成 1 个字节
              why: 一致性哈希是分布式定位映射算法，不压缩文件内容本身
            - text: 因为对节点总数取余数只能支持不超过 10 台电脑
              why: 取余数也能编任意数量节点，痛点是一旦节点数 N 变了成 N+1，绝大多数对象的余数都会改变
          explain: P2P 节点随时上线下线，用一致性哈希才能保证变动只影响局部邻居。
      - card:
          title: BitTorrent：分块校验与互惠阻塞
          body: |
            **BitTorrent** 把大文件切成许多小块：每下一块自己立刻也能当上传源，并故意**随机挑缺块**交换以免所有人缺同一块。下载前的种子文件里写着每一块的 **SHA-1 校验哈希**（防陌生人发假数据），并用 **choke/unchoke（互惠阻塞）**优先把上传带宽让给同样乐意回传数据块的邻居。
      - item:
          id: p2p-compare
          type: match
          prompt: 把四种 P2P/覆盖机制和它们解决的关键问题配对。
          pairs:
            - [一致性哈希环（DHT）, 节点加入或离开时只迁移极少数邻近对象，不用全网重算]
            - [BitTorrent 互惠阻塞（choke/unchoke）, 优先把上传带宽给同样乐意回传数据块的邻居，抑制只拿不给]
            - [Gnutella 查询号 QID 与 TTL, 防止无结构泛洪查询在环路上无限循环打转]
            - [RON 主动探测覆盖路径, 底层 BGP 绕远或故障时在二十秒内改走更通畅的中间跳点]
          explain: 每种覆盖结构都有自己要修补的痛点：DHT 解决路由扩展与变动抖动，BitTorrent 解决搭便车，Gnutella 防洪泛环路，RON/SD-WAN 绕过慢故障路径。
      - card:
          title: 多媒体自适应流媒体（DASH / HLS）
          body: |
            网上看长视频怎么能既利用普通 HTTP+CDN 缓存，又能在地铁信号变差时自动降成标清不卡顿（教材 9.2 节）？

            如今的主流方案（如 **DASH** 与 **HLS** 自适应流媒体）把整部片子切成一个个几秒长的 HTTP 小文件切片，同时准备高清、标清、流畅好几个码率版本和一份清单文件。播放器每下载完一片，就顺手测一下刚跑出来的真实下载速度——网快下一片就请求高清 URL，网慢就请求低码率 URL，既能穿防火墙又能白用现成 CDN 缓存！
      - item:
          id: adaptive-streaming
          type: choice
          prompt: 与早期专用流媒体协议相比，现代自适应流媒体（如 DASH / HLS）把视频切成几秒一段的普通 HTTP 小文件并由播放器自行挑选码率，最大好处是什么？
          options:
            - text: 能直接复用现成的 HTTP/CDN 边缘缓存体系，且播放器可根据实时网速无缝切换清晰度减少卡顿
              correct: true
            - text: 把视频放进 HTTP 后，数据包再也不会在网络里丢包或排队了
              why: 底层仍然走 TCP/QUIC 和 IP 网络，丢包排队照样会发生，只是播放器能主动降码率适应瓶颈
            - text: 播放器不需要向服务器发任何请求，全靠服务器猜你的屏幕有多大
              why: 正是由客户端播放器根据自己的缓冲区水位和实测吞吐主动发 HTTP GET 请求挑下一段清晰度
          explain: 把视频流拆成普通静态 HTTP 块文件后，全世界的通用 Web 服务器和 CDN 都能直接缓存加速，实现了双赢。

boss:
  items:
    - id: boss-encap
      type: order
      prompt: 把浏览器发出一个普通网页请求时，从上到下逐层封装的顺序排好。
      steps:
        - 生成 HTTP 请求报文
        - 添加 TCP 首部（端口号、序号）
        - 添加 IP 首部（源/目的 IP、TTL）
        - 添加以太网帧头和 CRC 帧尾
      explain: 数据自顶向下逐层套壳：应用（HTTP）→ 传输（TCP）→ 网络（IP）→ 链路（以太网帧）。
    - id: boss-bdp
      type: number
      prompt: 一条 40 Mbps 的跨海光纤往返时间（RTT）为 50 ms。它的延迟带宽积是多少千字节（KB，按 1 KB = 1000 字节、1 字节 = 8 比特计算）？
      answer: 250
      unit: KB
      explain: 40e6 bps × 0.050 s = 2,000,000 bits，除以 8 得 250,000 字节 = 250 KB。
    - id: boss-crc
      type: text
      prompt: 给定 4 位生成多项式 `1101`（$k = 3$）。计算 5 位消息 `11010` 的 CRC 余数：先在末尾补 3 个 0 成 `11010000`，再按模 2 异或除以 `1101`，最后的 3 位余数是什么？
      answers: ['000']
      explain: 前 4 位 `1101` 恰好与除数 `1101` 异或成 `0000`，后面全是 `0`，所以 3 位余数是 `000`！
    - id: boss-sws
      type: number
      prompt: 一个滑动窗口协议使用 4 位序号（可用序号 0 到 15，共 16 个）。接收端允许乱序缓存且令 RWS = SWS，为避免旧帧绕回撞进新窗口，发送窗口 SWS 最大可设为多少？
      answer: 8
      explain: 当 RWS = SWS 时要求 SWS < (MaxSeqNum + 1) / 2 = (16 + 1) / 2 = 8.5，因此最大整数为 8（旧窗口 0..7 与新窗口 8..15 互不重叠）。
    - id: boss-cidr
      type: text
      prompt: 已知主机地址是 `192.168.10.77/26`，它所在子网的网络地址是什么？（写出完整点分十进制）
      answers: ['192.168.10.64']
      explain: '`/26` 每块 $2^{32-26} = 64$ 个地址（0..63、64..127、128..191、192..255）。77 落在 64..127，所以网络地址是 `192.168.10.64`。'
    - id: boss-arp-gw
      type: choice
      prompt: 电脑 `10.0.1.5/24` 要给公网服务器 `93.184.216.34` 发一个 TCP 包，本机默认网关是 `10.0.1.1`。电脑发出的以太网帧里，“目的 MAC 地址”和“IP 包目的地址”分别写谁？
      options:
        - text: 目的 MAC 写网关 `10.0.1.1` 的 MAC，IP 目的地址写服务器 `93.184.216.34`
          correct: true
        - text: 目的 MAC 写服务器 `93.184.216.34` 的 MAC，IP 目的地址写网关 `10.0.1.1`
          why: 正好写反了！MAC 负责走当前这一跳给网关，IP 负责端到端指明最终服务器
        - text: 目的 MAC 和 IP 目的地址都填默认网关 `10.0.1.1`
          why: 如果 IP 目的地址也写网关，网关收到后就会以为包是发给自己的，不会再往外网转发
        - text: 目的 MAC 填全 F 广播地址，由网关自己拦截
          why: 查到网关 MAC 后应当单播发送给网关，不用广播打扰同网段所有其他主机
      explain: 帧首部每跳替换，IP 首部的终极目的地全程保持远端服务器不变。
    - id: boss-lpm
      type: choice
      prompt: 路由器表中有：`172.16.0.0/16 → 口1`、`172.16.8.0/24 → 口2`、`172.16.8.0/22 → 口3`、`0.0.0.0/0 → 口4`。收到目的 IP `172.16.8.42` 的包，选哪个输出接口？
      options:
        - text: 口 2（`172.16.8.0/24`）
          correct: true
        - text: 口 3（`172.16.8.0/22`）
          why: 四条规则都匹配到了 `172.16.8.42`，其中 `/24` 比 `/22` 前缀更长、更具体
        - text: 口 1（`172.16.0.0/16`）
          why: '`/16` 前缀短于 `/22` 和 `/24`'
        - text: 口 4（`0.0.0.0/0`）
          why: 默认路由长度 0，只在没有任何前缀命中时兜底
      explain: 最长前缀匹配挑前缀位数最多的命中项：24 > 22 > 16 > 0，所以走口 2。
    - id: boss-dijkstra
      type: sim
      sim: graph
      params:
        mode: dijkstra
        directed: false
        start: R1
        nodes:
          - id: R1
            x: 40
            'y': 100
          - id: R2
            x: 130
            'y': 40
          - id: R3
            x: 130
            'y': 165
          - id: R4
            x: 230
            'y': 40
          - id: R5
            x: 310
            'y': 105
        edges:
          - [R1, R2, 2]
          - [R1, R3, 5]
          - [R2, R3, 1]
          - [R2, R4, 6]
          - [R3, R4, 2]
          - [R3, R5, 7]
          - [R4, R5, 1]
      goal: {}
      solution: [R1, R2, R3, R4, R5]
      prompt: 在这张 OSPF 拓扑图上，从路由器 R1 出发运行 Dijkstra 算法，依次点击每个节点最短距离被最终确定的先后顺序。
      explain: R1(0) → R2(2)，经 R2 把 R3 缩短成 2+1=3、R4 设为 8 → R3(3)，经 R3 把 R4 缩短成 3+2=5、R5 设为 10 → R4(5)，经 R4 把 R5 缩短成 5+1=6 → R5(6)。
    - id: boss-cti
      type: choice
      prompt: 在距离向量路由（RIP）中，“带毒性逆转的水平分割”能彻底消除所有网络拓扑里的无穷计数问题吗？
      options:
        - text: 不能，它只能阻断两个直连节点互指兜圈，三个或以上节点形成环路时仍可能无穷计数
          correct: true
        - text: 能，只要所有路由器打开毒性逆转，不管有几台路由器成环都能瞬间稳定下来
          why: 三角环（例如 A、B、C 连成环，同时靠外接的断线出口去目的地 D）中，启用毒性逆转后 B 虽不直指 C，却仍可能听信 A 的过时距离绕圈抬高估价
        - text: 不能，因为它连两个相邻节点之间的环路都拦不住
          why: 对两节点互指，毒性逆转会向原下一跳通告距离为 16（代表不可达），确实能阻断两节点乒乓环路
        - text: 只有在链路状态路由协议 OSPF 里才会出现无穷计数
          why: OSPF 泛洪完整拓扑并用 Dijkstra 算路，根本不会出现距离向量的无穷计数
      explain: 毒性逆转治两跳互指有效，但三节点以上环路还要靠把 RIP 的不可达上限设小（16）来快速兜底截断。
    - id: boss-bgp
      type: choice
      prompt: 关于域间路由协议 BGP，下面哪一项描述是准确的？
      options:
        - text: BGP 在自治系统之间交换带完整 `AS_PATH` 的路径向量通告，用于检查防环并服从本地商业策略
          correct: true
        - text: BGP 和 OSPF 一样，把每个路由器自己的局域网链路代价泛洪给全世界算全局最小跳数
          why: 商业机构不会泄露内部拓扑，BGP 只传递经过的 AS 序列与可达前缀，也不以跳数为唯一准则
        - text: 只要某条路线经过的 AS 数量更少，BGP 就一定会无视商业关系强制选中它
          why: 商业策略偏好（如客户路由优先于非客户对等链路）排在 AS_PATH 长度之前
        - text: BGP 直接封装在纯以太网帧里，不依赖 TCP
          why: BGP 会话运行在可靠的 TCP（端口 179）之上
      explain: BGP 的两大基石是“AS_PATH 防环”和“商业策略优先”。
    - id: boss-tcp-2way
      type: choice
      prompt: 为什么 TCP 建连需要三次握手，且主动关闭方最后要留出 2 × MSL 的 `TIME_WAIT` 等待时间？
      options:
        - text: 三次握手防止滞留的旧 SYN 误开僵尸连接并同步双方 ISN；`TIME_WAIT` 保护重传最后 ACK 并让老包彻底过期
          correct: true
        - text: 三次握手为了给 HTTP 正文加密；`TIME_WAIT` 为了让磁盘写入缓冲区刷新
          why: 传统 TCP 不负责内容加密（由 TLS 负责），`TIME_WAIT` 也不是为了等本地磁盘 I/O
        - text: 三次握手只在 UDP 上才用；`TIME_WAIT` 由路由器负责计时
          why: UDP 无连接不用握手；`TIME_WAIT` 是主动关闭连接的那一端主机 TCP 栈维护的状态
        - text: 两次握手本来就能防止所有旧 SYN 滞留问题，三次只是历史习惯
          why: 两次握手时服务器在发出 SYN-ACK 后就立刻建好连接开始等待，根本无法确认刚收到的 SYN 是不是几分钟前的旧包
      explain: 三次握手保护“建连起点”，2×MSL 的 TIME_WAIT 保护“拆连终点”，两者都围绕着避免网络里迟到的旧段混淆连接边界。
    - id: boss-cwnd
      type: number
      prompt: 在标准教学 TCP 拥塞控制模型下，初始 `cwnd = 1 MSS`，`ssthresh = 8 MSS`，全程没有丢包。第 6 个往返（RTT）开始时，`cwnd` 是多少 MSS？
      answer: 10
      explain: 第 1 轮 1，第 2 轮 2，第 3 轮 4，第 4 轮达门限 8 后切入拥塞避免，第 5 轮 9，第 6 轮 10 MSS。
    - id: boss-dns-order
      type: order
      prompt: 浏览器想打开 `shop.example.org`，本机与本地解析器缓存均为空。把域名解析与网页获取的正确先后顺序排好。
      steps:
        - 本机向本地递归解析器请求查询 shop.example.org
        - 本地解析器依次向根、.org 顶级域和 example.org 权威服务器拿到 IP
        - 本机拿回 IP 后向目标服务器发起 TCP 三次握手
        - 连接建立后发送 HTTP GET 请求拿回网页
      explain: 先通过 DNS 拿到目标服务器 IP 地址，再与该 IP 建 TCP 连接，最后在连接上发 HTTP 请求。
    - id: boss-app-match
      type: match
      prompt: 把四类应用协议或机制和它们解决的核心问题配对。
      pairs:
        - [HTTP/3（QUIC）, 在传输层隔离多条流避免单个丢包拖垮整条连接]
        - [SMTP, 邮件服务器之间按存储转发规则接力投递电子邮件]
        - [CDN DNS 重定向, 把用户引导到离他最近且负载健康的边缘缓存节点]
        - [BitTorrent 分片哈希校验, 防止从陌生对等节点下载到被损坏或篡改的文件块]
      explain: 分别对应 Web 传输层演进、邮件投递、边缘内容分发和 P2P 数据块完整性校验。
    - id: boss-socket-stream
      type: choice
      prompt: 写一个 Python TCP 服务器接收客户端发来的消息，下面哪种认识是正确的？
      options:
        - text: TCP 是无边界字节流，一次 `sendall` 发出的内容服务端一次 `recv` 可能只读到一半，要循环读取并按应用格式切分
          correct: true
        - text: 只要发送端调用一次 `sendall` 写完，服务端调用一次 `recv(4096)` 必定原封不动一次收全这条消息
          why: '`sendall` 只保证发送端都塞进本地套接字，网络分包和系统读取时机随时可能让接收端分多次 `recv` 拿到'
        - text: 服务器调用 `recv(1024)` 返回 `b""` 说明网速太慢暂时还没数据，等半秒再读就能继续拿到新字节
          why: 阻塞模式下 `recv` 返回空字节串 `b""` 表示对方已经发 FIN 关闭了发送方向（EOF），再也读不到新数据了
        - text: 客户端发出请求后应该先调 `close()` 关掉整个套接字，然后再调 `recv(1024)` 等着接收回显
          why: '`close()` 会彻底关闭读写两端，之后再调 `recv` 会直接报错；应当用 `shutdown(SHUT_WR)` 半关闭写端'
      explain: 理解“字节流无边界”和“`b''` 代表 EOF”是用好 TCP socket 的核心。
