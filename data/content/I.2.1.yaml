skill: I.2.1
version: 2
authors: [gemini]
brief:
  why: |
    写出能运行的程序只是工程工作的起点。软件上线后会收集个人记录、决定谁能获得贷款或面试机会、消耗大量电力，也可能在失效时伤害生命。这一关从零开始，讲清隐私与再识别、知识产权与开源合规、算法偏见与统计公平、绿色软件与碳感知计算，以及软件可靠性、专业伦理准则与公共利益，让你在面对真实工程取舍时有据可依。
  outcomes:
    - 运用后果主义、义务论和美德伦理分析隐私与数据收集争议，说明告知与同意的局限及准标识符再识别原理
    - 区分版权、专利、商标与商业秘密的保护对象和失效条件，判断合理使用边界以及 MIT、GPL、AGPL 与知识共享许可的义务
    - 拆解自动化决策中的目标错位、代理特征与群体差异，计算并辨析独立性、分离度与充分性三种统计公平判据的冲突
    - 计算温室气体的二氧化碳当量，区分平均碳强度与边际碳强度，设计空间转移、时间转移与需求塑形方案
    - 从软件失效案例归纳工程可靠性与厂商责任，依据专业伦理准则在面临隐瞒缺陷压力时采取合规的逐级上报行动
terms:
  - term: 后果主义
    def: '按行为带来的整体结果好坏来判断对错的伦理框架，权衡各方收益与伤害'
  - term: 义务论
    def: '按行为本身是否遵守普遍道德义务、是否把人当目的而非手段来判断对错的伦理框架'
  - term: 美德伦理
    def: '从品格出发判断行为的伦理框架，追问诚实、审慎、可信的从业者会如何抉择'
  - term: 信息隐私
    def: '个人控制与自己有关的记录何时、以何种方式、在多大范围内被他人知晓的权利'
  - term: 告知与同意
    def: '服务方在收集数据前出示隐私政策并由用户勾选同意的常见隐私保护机制'
  - term: 准标识符
    def: '单独看不指向特定个人、但组合起来常常能唯一锁定身份的属性，如邮编、生日与性别'
  - term: 再识别
    def: '将去掉姓名后的匿名化数据与外部公开记录关联，重新还原出真实个人身份的过程'
  - term: k-匿名
    def: '对准标识符做泛化或遮蔽，使数据表中每条记录至少与另外 k-1 条记录无法区分的方法'
  - term: 二次使用
    def: '把出于某种目的收集的数据，未经重新授权就转用于最初未说明的新用途'
  - term: 知识产权
    def: '法律赋予智力创作与商业标识的专有权利，用于激励创作并规范非排他性成果的使用'
  - term: 版权
    def: '自动保护文字、代码、图像等具体表达形式的专有权利，不保护抽象思想本身'
  - term: 源代码
    def: '程序员用编程语言编写、人类可读的程序原始文本'
  - term: 专利
    def: '经申请、公开并审查后授予的排他权利，保护新颖、非显而易见且实用的技术发明'
  - term: 商业秘密
    def: '具有商业价值且通过保密措施维持秘密状态的信息，一旦合法泄露即失去保护'
  - term: 商标
    def: '用来区分不同来源商品或服务的名称、图形或标识，只要持续使用并续展就可维持保护'
  - term: 合理使用
    def: '在评论、教学、研究等法定情形下，经综合考量四项因素后无需许可即可有限使用版权作品的制度'
  - term: 数字版权管理
    def: '简称 DRM，通过加密和访问限制技术在软硬件层面阻止用户复制或转存数字内容的机制'
  - term: 开源许可证
    def: '随公开源代码附带的法律授权条款，规定他人可以如何复制、修改、分发或商用该代码'
  - term: 著佐权
    def: '英文 copyleft，要求分发包含该开源代码的衍生作品时必须按相同开源条款继续公开源代码的许可机制'
  - term: SBOM
    def: '软件物料清单（Software Bill of Materials），记录软件包含的全部第三方组件及其版本与许可证'
  - term: 知识共享许可
    def: '简称 CC，面向文档、图片、音视频等创作作品的标准化开放许可体系，由署名、相同方式共享等条件组合'
  - term: 混淆矩阵
    def: '把模型判定和真实结果交叉排成的 2×2 表，四格分别是真正例、假正例、假负例、真负例的人数'
  - term: 真正例率
    def: '简称 TPR，真实为正的人里被模型判为正的比例：TP / (TP + FN)'
  - term: 假正例率
    def: '简称 FPR，真实为负的人里被模型误判为正的比例：FP / (FP + TN)'
  - term: 阳性预测值
    def: '简称 PPV，被模型判为正的人里真实为正的比例：TP / (TP + FP)'
  - term: 校准
    def: '模型给出的分数和实际发生频率一致，例如打 70 分的人里约有 70% 真的发生'
  - term: 碳感知计算
    def: '让可以推迟或搬走的计算任务跟着电网碳强度走，挪到更清洁的时段或地区运行'
  - term: 代理特征
    def: '表面看似中性、但在统计上与性别或族裔等受保护属性高度相关的输入特征'
  - term: 申诉救济
    def: '受自动化决策影响的个人获得解释、纠正错误数据并申请人工复核的制度渠道'
  - term: 受保护属性
    def: '法律或伦理准则禁止用来实施不公平歧视的群体属性，如性别、年龄、族裔或宗教信仰'
  - term: 基础率
    def: '某个群体中真实正例所占的比例，即条件概率 P(Y=1 | A=a)'
  - term: 独立性
    def: '统计公平判据之一，又称人口均等，要求不同群体获得正面预测的比例相等'
  - term: 分离度
    def: '统计公平判据之一，又称均衡赔率，要求不同群体的真正例率与假正例率分别相等'
  - term: 充分性
    def: '统计公平判据之一，要求同一预测分数或正面预测在不同群体中对应的真实正例比例相等'
  - term: 间接歧视
    def: '规则表面上没有提及受保护属性，但在实际执行中对特定群体造成无正当理由的系统性不利'
  - term: 温室气体
    def: '大气中能够吸收地表红外辐射并阻止热量散失的气体，主要包括二氧化碳、甲烷和氧化亚氮'
  - term: 全球变暖潜能值
    def: '简称 GWP，衡量单位质量某种温室气体在规定年限内相较于二氧化碳的增温效应倍数'
  - term: 二氧化碳当量
    def: '简称 CO2eq，将不同温室气体按其全球变暖潜能值折算成等效二氧化碳质量后的统一计量单位'
  - term: 碳强度
    def: '电网每生产 1 千瓦时电能所排放的温室气体质量，常用单位为克二氧化碳当量每千瓦时（gCO2eq/kWh）'
  - term: 调度
    def: '电网运营方根据实时用电需求主动启停或调整发电设备出力的控制过程'
  - term: 弃电
    def: '当风电或光伏等可再生能源发电量超过电网接纳能力时，不得不主动削减的清洁电力'
  - term: 边际碳强度
    def: '电网为满足额外增加的 1 千瓦时用电需求而新调动的边际发电机组所对应的碳强度'
  - term: 需求转移
    def: '将对时间或地点不敏感的计算任务迁移到电网碳强度更低的区域或时段运行的绿色软件策略'
  - term: 需求塑形
    def: '根据电网当前碳强度动态调整应用功能或服务质量，以在碳强度高时主动降低能耗的策略'
  - term: 竞态条件
    def: '程序或系统的正确结果依赖于多个并发操作执行的精确先后时机，一旦时序错乱就会出错的缺陷'
  - term: 硬件互锁
    def: '独立于软件之外、由物理开关或电路直接强制执行的安全保护机构，用于阻断危险状态'
  - term: 严格产品责任
    def: '无论厂商是否存在主观疏忽，只要有缺陷的产品造成人身或财产损害就须承担赔偿责任的法律原则'
  - term: 吹哨
    def: '组织内部人员在常规途径失效后，将危及公共安全或违法的严重问题向监管方或公众揭露的行为'
  - term: 数字鸿沟
    def: '不同地区、收入或年龄群体在获取数字设备、网络接入及有效使用信息技能上的结构性差距'

lessons:
  # ======================================================================== 隐私
  - id: privacy-frameworks
    chapter: 隐私
    title: 什么是隐私：三种伦理视角与隐私边界
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一家提供免费天气查询的手机 App 打算把用户每天的精确位置轨迹卖给广告商，用来换取运营收入。你认为仅从“服务免费、公司需要赚钱”出发，就足以证明这种做法合乎伦理吗？
          options:
            - text: 足够，免费软件本来就靠出售一切可用数据维持运营
              why: 免费商业模式本身不能自动免除对用户安全与尊重的基本责任，位置轨迹会暴露住址与作息
            - text: 不足够，还需权衡行踪泄露伤害与对用户的尊重
              correct: true
            - text: 只要把位置数据按月打包卖给合法注册的广告商，就不算隐私问题
              why: 批量出售给合法注册企业同样会暴露用户住址、作息与敏感行踪，并不能自动消除伤害与知情义务
          explain: 面对数据商业化争议，不能只看商业收益，需要系统的伦理视角来衡量伤害、义务与信任。这一课从三种常见伦理框架和隐私的界定讲起。
      - card:
          title: 什么是信息隐私
          body: |
            日常说“保护隐私”，往往包含身体不被打扰、私生活不受窥探，以及数字时代最常涉及的**信息隐私（information privacy）**：个人控制与自己有关的记录何时、以何种方式、在多大范围内被他人知晓的权利。

            在公共街道上行走，路人可以看到你的外貌，但不会自动记录你每天的行动规律。一旦手机传感器与服务器持续记录你的位置、搜索词与消费记录，零散信息就会拼出完整的生活画像，隐私边界也随之改变。
      - card:
          title: 三种基本伦理框架
          body: |
            讨论计算技术带来的争议时，常使用三种经典伦理框架从不同角度检视同一项决定：

            - **后果主义（consequentialism）**：衡量行为给所有相关方带来的整体后果，比较收益与伤害的净值。
            - **义务论（deontology）**：看行为本身是否遵守普遍道德义务，是否尊重他人为独立目的，而不是当作换取利益的工具。
            - **美德伦理（virtue ethics）**：关注从业者与组织的品格，追问一个诚实、审慎、值得信赖的工程师会怎样选择。
      - item:
          id: q-privacy-three-frameworks
          type: match
          prompt: 将下面三种伦理分析视角与它们最核心的判断标准一一对应。
          pairs:
            - ["后果主义", "比较该决定对公司、用户和社会各方带来的总收益与总伤害"]
            - ["义务论", "检验该决定是否履行诚实义务、是否把用户当作工具使用"]
            - ["美德伦理", "审视采取该决定是否符合诚实、审慎与可信赖的品格要求"]
            - ["信息隐私", "个人决定自身记录何时、如何及在多大范围内被他人知晓的权利"]
          explain: 后果主义看整体结果，义务论看行为本身的道德规则与对人的尊重，美德伦理看行为体现的品格；信息隐私则是需要保护的对象。
      - card:
          title: 例题：用三种框架分析“App 出售用户位置数据”
          body: |
            假设免费天气 App 收集了用户全天候的精确卫星定位轨迹，并准备打包卖给第三方数据经纪商和广告商。按三种伦理框架逐步拆解：
          reveal:
            - title: 第 1 步：用后果主义权衡收益与伤害
              body: 收益方面，公司获得广告收入，用户继续免费看天气。伤害方面，持续位置轨迹会暴露用户的家庭住址、通勤路线、就诊医院与宗教场所；一旦数据转手或泄露，伤害难以逆转。整体净后果偏向负面。
            - title: 第 2 步：用义务论检查尊重与诚实义务
              body: 用户下载天气软件是为了查天气，把后台位置悄悄变现相当于把用户当作盈利工具，而不是享有自主决定权的个体。即便条款里含糊提及，也不构成充分知情的尊重。
            - title: 第 3 步：用美德伦理审视信任与品格
              body: 一个诚实、审慎、值得托付的工程团队，不会在提供基础工具时暗中出售用户行踪。因此结论是不应出售原始位置轨迹，最多在单独、明确且可随时撤回的授权下使用经过聚合处理的粗粒度位置。
      - item:
          id: q-consequentialism-location
          type: choice
          prompt: 某团队用后果主义评估“是否出售用户精确位置数据”，以下哪项分析最符合后果主义的推理方式？
          options:
            - text: 只要相关条款未违反现行成文法，就无需再评估数据交易可能带来的社会后果
              why: 仅凭是否触犯成文法来裁决，不符合后果主义比较各方实际收益与伤害的方法
            - text: 综合权衡公司营收与用户行踪暴露带来的长期风险，发现整体净后果偏向负面
              correct: true
            - text: 只要开发团队成员秉持诚实友善的初衷，出售位置数据就符合后果主义标准
              why: 关注行为者品格与初衷偏向美德伦理，而非后果主义对实际损益结果的系统权衡
          explain: 后果主义要求列出所有受影响方的正面收益与负面伤害并综合权衡；精确位置泄露的风险通常远大于免费天气预报带来的便利。
      - item:
          id: q-deontology-means
          type: choice
          prompt: 义务论批评“在冗长协议中夹带出售位置数据条款”的做法，最核心的理由是什么？
          options:
            - text: 隐瞒真实意图把用户当作变现工具，违背了诚实与尊重个体自主的道德义务
              correct: true
            - text: 广告商购买位置数据后转化效率偏低，难以覆盖数据采集与分发的商业成本
              why: 广告投放效率属于商业收益考量，而不是义务论关注的道德规则与对人的尊重
            - text: 长期汇总位置轨迹会推高数据泄露后的赔付总额，使公司面临更高的整体损失
              why: 比较整体损失与收益属于后果主义视角，义务论核心关注的是行为本身是否尊重人作为独立目的
          explain: 义务论的核心要求之一是不得把人仅仅当作谋利工具；隐蔽收集并变卖用户行踪，直接破坏了诚实与知情自主的原则。
      - item:
          id: q-privacy-perspectives
          type: choice
          prompt: 有人认为“只要我没做违法的事，就不需要担心隐私被收集”。下面哪一项最能指出这种说法的漏洞？
          options:
            - text: 隐私守护的是个人自主空间，也能防止合法生活轨迹被误读、歧视定价或滥用
              correct: true
            - text: 只有涉及金融与医疗交易的记录才构成隐私，普通日常出行不会形成敏感画像
              why: 普通人的通勤轨迹、搜索记录与消费习惯同样高度敏感，汇总后极易暴露生活细节并引发伤害
            - text: 合法收集的数据在技术上只能用于最初声明的单一用途，不可能发生二次泄露
              why: 数据泄露、内部滥用与数据转卖在现实中频繁发生，合法行为的记录同样可能带来实质伤害
          explain: 隐私权不是“隐藏罪行的盾牌”，而是个人控制自我呈现、免受持续监视、差异化歧视与数据滥用的基础保障。

  - id: disclosure-and-consent
    chapter: 隐私
    title: 信息暴露、告知与同意的局限
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 安装一款新软件时，屏幕上弹出长达两万字的隐私政策，底部只有一个“同意并继续”按钮。如果大多数用户只看两秒就点了同意，这是否说明用户已经真正了解数据去向？
          options:
            - text: 说明用户已经完全理解，因为文字都公开展示在屏幕上了
              why: 展示两万字法律术语并不等于用户有时间和能力读懂，更不代表用户有实际选择余地
            - text: 不能，冗长条款与捆绑授权让用户难读也难拒绝
              correct: true
            - text: 只要用户在安装时主动点击了按钮，就说明已经完成了充分知情同意
              why: 面对冗长条款和“不同意就无法使用”的捆绑条件，点击按钮往往只是无奈妥协，不代表真正理解数据去向
          explain: 现实中常见的“告知与同意”存在结构性失灵。这一课拆解信息如何在日常互动中暴露，以及为什么一纸长条款往往护不住隐私。
      - card:
          title: 信息暴露与数据汇聚
          body: |
            个人数据并非只在填表时流出，更多是在日常服务中逐步**信息暴露（information disclosure）**。刷公交卡、使用会员积分、浏览网页和连接公共无线网络，都会留下分散的痕迹。

            过去这些记录分属不同机构、难以汇总；如今数据经纪商可以把购物小票、公开登记信息、应用日志和位置记录合并成详细档案，甚至推算出用户从未主动填写的健康状况、收入区间与家庭关系。
      - card:
          title: 告知与同意的四重局限
          body: |
            许多产品依赖**告知与同意（notice and consent）**机制，即展示隐私政策并让用户点击同意。这套做法在实践中存在四重局限：

            1. **阅读成本过高**：隐私政策冗长且充满法律术语，普通人不可能逐条读完每天接触的数十个服务条款。
            2. **缺乏真实选择**：往往是“不同意就无法使用”的捆绑条件，用户几乎没有议价能力。
            3. **未来用途不可预见**：数据被保存多年后，可能用于当初收集时根本不存在的新算法或商业合作。
            4. **一次性同意与动态风险错位**：用户点一次同意，却很难察觉数据转手、合并后不断放大的风险。
      - item:
          id: q-consent-limits-multi
          type: choice
          multi: true
          prompt: 下面哪些现象直接体现了“告知与同意”作为隐私保护机制的局限性？
          options:
            - text: 隐私政策长达上万字且用词晦涩，普通用户难以在有限时间内读懂
              correct: true
            - text: 用户若拒绝非必要的数据收集条款，就无法使用软件的基础核心功能
              correct: true
            - text: 数据长期留存后可能被用于收集当时尚未出现的分析用途，一次性同意难以覆盖
              correct: true
            - text: 隐私政策使用清晰的中文分段展示并允许用户按单项功能随时开关权限
              why: 清晰分段与按需单独开关正是改进知情同意的做法，而不是告知与同意的局限
          explain: 冗长难懂、捆绑强制以及一次授权难以预见未来演变的风险，是告知与同意机制最常被指出的三大短板。
      - card:
          title: 消费者反弹与设计纠偏
          body: |
            当企业突破用户的心理预期、暗中扩大数据收集或默认公开私密记录时，往往会引发强烈的**消费者反弹（consumer backlash）**。历史上多家科技公司在推出默认共享购物记录、悄悄扫描通信内容或放宽社交默认可见范围的功能后，都因舆论抗议与监管调查被迫撤回或改版。

            这些案例表明，法律底线往往滞后于产品创新，把隐私保护做成**默认选择加入（opt-in）**与最小化收集，比事后补救更稳妥。
      - card:
          title: 例题：评估一款健身手环的隐私方案
          body: |
            一家手环厂商计划默认开启“全天位置与心率共享给保险合作方”，并在用户首次配对时放在 15 页协议的第 12 页。我们从信息暴露与知情同意两个角度做审查：
          reveal:
            - title: 第 1 步：识别超出预期的信息暴露
              body: 用户的核心预期是记录步数与心率以关注健康，将长期心率与行踪交给保险机构，可能导致保费上浮或拒保，属于高敏感度跨场景暴露。
            - title: 第 2 步：指出告知与同意的失效点
              body: 把高风险授权藏在第 12 页且默认勾选，既违背阅读可行性，也剥夺了未细读用户的真实选择，极易引发信任崩塌与消费者反弹。
            - title: 第 3 步：给出合规的改进设计
              body: 改为默认关闭（选择加入），用简短明了的独立弹窗说明共享对象、用途与后果；允许用户拒绝该共享却照常使用手环全部基础记录功能，并提供随时撤回与删除数据的入口。
      - item:
          id: q-opt-in-vs-out
          type: choice
          prompt: 某地图应用新增一项“公开分享我常去地点给陌生人推荐”的功能。为了降低非预期隐私暴露，哪种权限默认策略更合适？
          options:
            - text: 默认关闭，仅在用户阅读简要说明并主动开启后才分享，且可随时关闭
              correct: true
            - text: 默认全部公开，并在三十天后再发一封邮件提醒用户去设置深处手动取消
              why: 默认公开会让大量未留意设置的用户在不知情下暴露常去地点，属于典型的选择退出陷阱
            - text: 默认开启，如果用户关闭该功能就同步清空其所有历史收藏夹
              why: 用清空基础数据迫使用户同意共享，违背了真实自愿的选择原则
          explain: 对高敏感度的额外共享功能，采用默认关闭、独立明示的选择加入（opt-in）策略，并保证拒绝不影响基础功能，能有效避免非预期暴露。
      - item:
          id: q-backlash-lesson
          type: choice
          prompt: 多个互联网产品因“默认将用户购买记录或私密动态推送给好友”遭遇强烈消费者反弹后被迫下线。这类事件说明了什么？
          options:
            - text: 只要在长协议末尾写清免责条款，就能避免用户对默认设置变更产生抵触
              why: 现实中的多次消费者反弹证明，隐藏在长协议里的条款无法消除违背用户预期带来的信任流失
            - text: 隐私默认设置必须贴合用户的场景预期，暗中放宽共享极易引发信任反噬
              correct: true
            - text: 产品应尽量隐藏复杂的权限开关界面，由平台统一替用户决定共享范围
              why: 减少透明度会进一步削弱信任，正确的方向是提高透明度并提供合理的默认保护
          explain: 隐私不仅是合规文本问题，更是用户对产品边界的信任预期；违背场景预期的默认公开往往带来严重的声誉与商业反噬。
      - item:
          id: q-consent-order
          type: order
          prompt: 为一款需要位置权限的导航软件设计合理的权限请求流程，按由先到后的顺序排列下列步骤。
          steps:
            - 在用户首次点击导航功能时，用简短说明告知为什么需要位置权限
            - 仅申请导航所需的当前位置权限，不捆绑申请通讯录等无关权限
            - 允许用户在拒绝后台持续定位的情况下，仍可正常使用手动查路线功能
            - 在设置中提供清晰的权限撤回与历史行程删除入口
          explain: 合理的知情同意应当按需告知、最小化申请、保证拒绝非必要权限时核心功能可用，并在事后保留随时撤回与删除的通道。

  - id: reidentification-and-mining
    chapter: 隐私
    title: 去标识化、准标识符与数据挖掘
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一家医院把病历表里的姓名、身份证号和手机号全部删掉，只留下“5 位邮政编码、出生年月日、性别、诊断结果”后公开发布用于科研。你认为这样处理后，外人还能查出某条病历属于哪位真实市民吗？
          options:
            - text: 不能，只要删除了姓名和身份证号，任何人都无法还原出真实个人
              why: 邮编、生日和性别组合在一起高度独特，与选民名册等外部公开数据一对照就可能还原真实姓名
            - text: 仍然可能，邮编、出生日期和性别的组合常常足以唯一锁定一个人
              correct: true
            - text: 只有医院内部医生能查出来，外部人员手里没有病历编号就完全没办法
              why: 外部人员不需要病历编号，只需要把公开的个人基本信息表与匿名病历表按相同字段关联即可
          explain: 单纯删掉姓名等直接标识符往往不够。这一课用具体组合计算看清准标识符如何导致再识别，以及数据挖掘中的二次使用风险。
      - card:
          title: 准标识符与再识别
          body: |
            姓名、身份证号属于直接标识符，删掉它们常被称为“去标识化”。但表中剩下的字段——例如 5 位邮编、精确出生日期与性别——属于**准标识符（quasi-identifier）**：单个字段看起来很普通，组合起来却能把人群切分得极细。

            以单个邮编区为例，假设居民年龄跨度为 80 年，每年 365 天，再分 2 种性别，仅“出生日期 + 性别”就有 $80 \times 365 \times 2 = 58400$ 种组合。如果该邮编区只有 20000 名居民，平均每个组合不到 0.34 人，多数居民在这个组合下是唯一的。
      - card:
          title: 公开数据关联与位置轨迹
          body: |
            把去标识化数据集与另一份公开记录（例如选民登记表、社交资料或公开成员名录）按准标识符拼接，就能重新找回真实姓名，这一过程称为**再识别（re-identification）**。研究者曾用美国人口普查数据证明，仅凭 5 位邮编、性别与出生日期这三项，就能唯一确定超过八成居民。

            位置轨迹更难匿名：大多数人白天的常去地点是工作或学校位置，夜间的常去地点是家庭住址。只要从去名轨迹中找出这两个高频停留点，就能锁定对应个人。
      - item:
          id: q-quasi-calc
          type: number
          prompt: 某小镇共有 1 个邮编区。如果用“出生年份（共 80 种可能）× 出生月日（按 365 天计）× 性别（2 种）”作为准标识符组合，共有多少种不同组合？
          answer: 58400
          explain: 组合数为 $80 \times 365 \times 2 = 58400$。当组合数量远大于该邮编区人口时，绝大多数人的准标识符组合都是独一无二的。
      - card:
          title: 数据挖掘、二次使用与 k-匿名
          body: |
            企业与平台常通过数据挖掘从海量交易和浏览日志里寻找模式，比如根据相似用户的购买记录推荐商品、预测消费习惯。但把当初为了配送快递收集的数据拿去训练信用评分，属于典型的**二次使用（secondary use）**，超出了用户授权范围。

            为了降低发布数据时的再识别风险，常用**k-匿名（k-anonymity）**处理：对准标识符做泛化或遮蔽（如把邮编末两位改成星号、把出生日期合并为 10 岁年龄段），让表中任意一条记录在准标识符上至少与另外 $k - 1$ 条记录完全一致。
      - card:
          title: 例题：检查一张健康表的 k-匿名与再识别风险
          body: |
            某研究机构把 10 条病历的准标识符泛化后得到两个等价组：第 1 组有 2 条记录，均为“邮编 100**、30–39 岁、女”；第 2 组有 8 条记录，均为“邮编 100**、40–49 岁、男”。判断该表的保护强度：
          reveal:
            - title: 第 1 步：确定整张表的 k 值
              body: 表的匿名强度取决于最小等价组的大小，因为攻击者会盯着最容易识别的小组下手。这里 $k = \min(2, 8) = 2$，因此这张表满足 2-匿名，而非 8-匿名。
            - title: 第 2 步：估算最坏情况的猜测命中率
              body: 如果攻击者知道目标人物属于第 1 组，仅凭这两条记录随机锁定目标的概率上限为 $1 / 2 = 50\%$；如果每个等价组至少扩大到 4 条记录（4-匿名），单凭准标识符猜中的上限降为 $1 / 4 = 25\%$。
            - title: 第 3 步：警惕同质化泄露
              body: 即使做到了 4-匿名，如果某个 4 人小组里的 4 条病历诊断结果全都是同一种罕见病，攻击者虽然分不清哪一行是谁，却依然确切知道了这 4 个人都患有该病。因此发布敏感数据时还需结合聚合统计或噪声机制进一步防护。
      - item:
          id: q-k-anon-prob
          type: number
          unit: '%'
          prompt: 一张经过泛化处理的医疗数据表中，所有准标识符等价组最少包含 4 条记录（即满足 4-匿名）。若攻击者只知道目标人物在这张表的某个 4 人组中，仅凭准标识符直接猜中目标对应行的概率上限是多少（填百分数数值）？
          answer: 25
          explain: 在包含 4 条准标识符完全一致的记录组中，仅凭准标识符无法区分彼此，锁定单条记录的概率上限为 $1/4 = 25\%$。
      - item:
          id: q-location-anonymity
          type: choice
          prompt: 某出行平台删除用户手机号后，公开了一批包含每日早晚打车起止坐标的出行轨迹。为什么这份数据依然难以真正匿名？
          options:
            - text: 早晚高频起止点直接对应住址与工作地，与外部信息关联即可锁定个人身份
              correct: true
            - text: 只要对行程表做过一次随机编号替换，多条历史轨迹之间就无法再串成规律
              why: 同一随机编号下的多条历史行程连在一起，依然完整保留了该用户的日常作息与常去地点
            - text: 只有当表中同时保留了银行卡号时，出行起止坐标才具备识别特定个人的能力
              why: 少数几个高频时空停留点本身就是极强的准标识符，不需要银行卡号就能结合公开住址或办公楼信息完成再识别
          explain: 个人生活轨迹具有高度稳定性与独特性，少数几个高频时空点就构成极强的准标识符，仅删掉姓名或手机号无法阻止再识别。
      - item:
          id: q-secondary-use-choice
          type: choice
          prompt: 某零售商以“寄送纸质发票”为由收集了顾客的家庭住址和电话，随后在未重新告知的情况下把这些数据接入第三方精准营销模型。这属于哪种典型隐私问题？
          options:
            - text: 合理的 k-匿名泛化处理，有助于在共享数据时保护顾客住址不外泄
              why: 把原始住址交给第三方做营销并未做匿名泛化，反而扩大了个人信息的传播范围
            - text: 二次使用，即把个人信息转用于超出最初收集告知范围的新商业用途
              correct: true
            - text: 消费者反弹，即平台依据顾客日常消费偏好自动推送个性化营销信息
              why: 消费者反弹是指用户因隐私预期被突破而抵制或抗议产品，而非商家擅自将数据转作他用
          explain: 把为特定目的收集的数据擅自转作他用，是典型的二次使用问题，也是许多隐私法规重点限制的对象。

  - id: government-surveillance
    chapter: 隐私
    title: 政府信息收集、监控与法律边界
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 公共部门为了维护治安和反恐，提出在全城所有路口安装人脸识别摄像头并把数据长期保存，供随时检索。面对“公共安全”与“公民隐私”之间的张力，哪一种看法更接近合理的公共政策分析？
          options:
            - text: 只要出发点是维护公共安全，就无需对监控范围、保存期限和审批程序设限
              why: 缺乏界限与监督的持续监控容易被滥用，也可能造成寒蝉效应，损害公民正当自由
            - text: 须按比例权衡安全与隐私，并设法定授权和独立监督
              correct: true
            - text: 政府部门在任何情况下都不应当保留任何人口登记、税收或交通记录
              why: 现代公共治理离不开依法收集的基础人口、税务与公共卫生记录，关键在于法定目的与访问约束
          explain: 政府收集与监控数据涉及公共利益与公民权利的长期平衡。这一课梳理公共部门收集、监控、数据挖掘和传播数据的核心原则，以及为何具体法条必须按地区和时间核验。
      - card:
          title: 政府信息收集与秘密监控
          body: |
            政府出于税务、户籍、社会保障和公共卫生等职能，依法收集大量公民记录。这类公开、有法定用途的收集，与执法及情报部门的秘密监控存在明显区别。

            随着电子通信普及，秘密监控的成本大幅下降：过去跟踪一个人需要多名警员轮班，如今拦截通信元数据或调取公共监控网络，在技术上可以低成本覆盖大批人群。能力越强，对**授权门槛、最小范围和独立审查**的制度要求就越严格。
      - card:
          title: 公共与私人数据库及政府数据挖掘
          body: |
            公共部门不仅维护自身数据库，有时还会向商业数据经纪商采购或依法调取私人企业掌握的消费、定位与通信记录。这带来一个治理难题：如果法律限制政府直接收集某类信息，却允许政府自由购买商业机构收集的同类信息，原有约束就会被绕开。

            此外，政府在大规模数据库中做数据挖掘（例如从数百万旅客记录中自动筛查可疑人员）时，即使误报率很低，在庞大人口基数下也会产生大量无辜者被错误标记，需要严格的复核与纠错机制。
      - item:
          id: q-gov-data-broker
          type: choice
          prompt: 为什么许多隐私学者关注“公共机构直接向商业数据经纪商购买个人位置或消费档案”的现象？
          options:
            - text: 商业数据经纪商只整理企业财报，采购数据无法用于公共治理分析
              why: 商业数据经纪商整理汇总的恰恰包含手机应用位置轨迹、消费偏好等个人档案，争议核心在于公权力边界
            - text: 这种商业采购可能绕开法律对政府直接搜查所设的法定授权与程序限制
              correct: true
            - text: 商业机构掌握的数据天然满足 k-匿名，因此不涉及个人隐私保护争议
              why: 商业档案往往精确关联到个体画像与实时位置，并不会自动消除隐私与再识别风险
          explain: 当法律要求公共部门必须凭法定授权才能搜查或调取敏感数据时，通过商业采购绕过授权程序会削弱对公权力的制衡。
      - card:
          title: 信息传播、侵入与具体法规的地域时效性
          body: |
            隐私侵害不只发生在“收集”环节，还发生在**信息传播**（例如将本应限内部使用的记录公开上网，或被黑客窃取）与**侵入**（未经许可闯入私人空间或设备，干扰个人独处）。

            需要特别注意：不同国家和地区的隐私与监控法律差异很大，而且会随时间修订。例如美国有针对特定行业的联邦与州法律，欧盟施行《通用数据保护条例》（**GDPR**），中国施行《个人信息保护法》。工程实践中不能把某一时期、某一国家的法条当成放之四海而皆准的规则，**具体法规必须依所在地区和当前时间核验**。
      - card:
          title: 例题：审查一项公共场所反常行为自动预警项目
          body: |
            某市计划在地铁站部署自动分析系统，把所有乘客的面部特征与历史重点人员库实时比对。按公共治理与隐私原则逐步审查：
          reveal:
            - title: 第 1 步：核查法律依据与目的限定
              body: 先核验本地现行法律是否允许在公共交通场景大规模采集生物识别信息，明确数据只能用于法定安全目的，严禁转作商业分析或跨部门随意查询。
            - title: 第 2 步：评估误报代价与人工复核
              body: 面对日均百万级客流，哪怕千分之一的误报率每天也会误警上千名普通乘客。系统绝不能自动触发强制措施，必须由工作人员独立核验，并为被误拦乘客提供快速纠错渠道。
            - title: 第 3 步：设定留存期限与访问审计
              body: 未命中比对的普通乘客影像应即时丢弃而非长期归档；对数据库的每一次查询都要记录审批文号与操作人日志，接受定期外部审计。
      - item:
          id: q-law-region-time
          type: choice
          prompt: 一家公司准备把在欧洲上线的社交产品复制到亚洲和北美市场，团队打算直接沿用五年前在单一国家起草的隐私合规清单。这样做的主要隐患是什么？
          options:
            - text: 不同司法辖区的隐私法规差异显著且持续修订，必须按当地现行法律逐项核验
              correct: true
            - text: 只要底层代码与数据字段未发生变化，旧合规清单在新市场依然自动适用
              why: 法律义务取决于用户与业务所在的司法辖区以及现行有效法规，不因代码不变而自动延续
            - text: 欧盟的 GDPR 已被采纳为全球统一数据保护法，只需更新欧盟条款即可覆盖全球
              why: GDPR 主要适用于欧盟境内或面向欧盟居民的数据处理活动，不能代替其他国家和地区的本地法规
          explain: 隐私与数据治理法律具有鲜明的地域性和时效性，跨区部署或长期运营时必须对照最新本地法规逐项核验。
      - item:
          id: q-privacy-harm-types
          type: match
          prompt: 将下列隐私风险场景与对应的风险环节配对。
          pairs:
            - ["信息收集", "公共部门或企业在超出必要范围的情况下大规模留存个人生物特征"]
            - ["数据挖掘", "在大规模数据库中自动筛查人员特征，给大量无辜者贴上可疑标签"]
            - ["信息传播", "原本用于内部审批的个人住址与病历记录被公开到互联网检索页"]
            - ["侵入", "未经授权远程开启用户设备麦克风，干扰个人私密独处空间"]
          explain: 隐私风险贯穿收集、分析挖掘、对外传播与直接侵入四个环节，不同环节需要配套不同的技术与法律防线。
      - item:
          id: q-gov-safeguards
          type: choice
          multi: true
          prompt: 政府或公共机构在确有必要开展信息收集与监控时，通常应配套哪些制衡措施来降低滥用风险？
          options:
            - text: 明确的法定授权依据与独立的审批监督机制
              correct: true
            - text: 严格限定数据用途与保存期限，到期及时清理非必要记录
              correct: true
            - text: 记录所有数据库查询操作日志，以便事后追责审计
              correct: true
            - text: 由数据采集部门内部口头审批即可无限期留存并跨部门共享原始记录
              why: 缺乏独立监督、不设保存期限且随意跨部门共享，正是导致公权力监控被滥用的典型隐患
          explain: 法定授权、目的与期限限定、访问日志审计和独立监督，是平衡公共安全与公民隐私的核心制度护栏。

  # ======================================================================== 知识产权
  - id: ip-four-pillars
    chapter: 知识产权
    title: 版权、专利、商标与商业秘密
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你花三个月写出一套独特的图像去噪软件。如果竞争对手没有抄你的一行代码，只是听你分享了大致思路后自己从头写出了功能相似的程序，仅靠“版权”能告赢对方吗？
          options:
            - text: 能，只要想到一个好点子，版权就会自动禁止别人用任何代码实现同样思路
              why: 版权只保护具体的表达形式（如具体代码文本），不保护背后的抽象思想或算法思路
            - text: 不能，版权只保护代码等具体表达，不保护背后的抽象思路
              correct: true
            - text: 能，只要能证明对方是听了你的分享才想到这个思路的
              why: 版权不保护思路，能证明来源也没用；想保护思路，要靠专利或者事先签保密协议
          explain: 智力成果和实物不同，可以近乎零成本复制。法律拆出了版权、专利、商业秘密和商标四种工具来分别保护不同层面的价值。
      - card:
          title: 为什么需要知识产权
          body: |
            一辆自行车你骑走了，别人就不能同时骑，这叫排他性。但一段**源代码（source code）**、一首乐曲或一个配方不同：一百个人同时复制使用，原本的那份也不会变少。

            如果任何人都能零成本复制他人的长期研发成果，创作者就很难收回成本。**知识产权（intellectual property）**制度通过在一段时间内赋予创作者排他权利，激励创新与创作；同时在期限届满后让成果进入公共领域，兼顾社会共享。
      - card:
          title: 四大知识产权保护工具
          body: |
            保护智力成果与商业标识主要有四种法律工具：

            - **版权（copyright）**：作品完成即自动产生，保护文字、源代码与图像等具体表达，不保护抽象思想。
            - **专利（patent）**：保护新颖、非显而易见且实用的技术发明，须申请、公开方案并经审查，保护期有限（常约 20 年）。
            - **商业秘密（trade secret）**：靠保密维持商业价值的配方或内部规则，无固定年限，一旦泄露或被独立还原即失效。
            - **商标（trademark）**：区分商品或服务来源的名称与徽标，按期续展可一直维持，但长期不用或沦为通用名称会被撤销。
      - item:
          id: q-ip-four-match
          type: match
          prompt: 把下面四类知识产权工具与它们各自保护的对象和核心特点配对。
          pairs:
            - ["版权", "自动保护代码、文档等具体表达，但不保护抽象思想"]
            - ["专利", "经申请审查并公开方案后，在有限期内排他保护新颖实用发明"]
            - ["商业秘密", "靠保密措施维持价值的内部配方或算法，一旦泄露保护即失效"]
            - ["商标", "用来识别商品或服务来源的品牌名称、徽标或独特标识"]
          explain: 版权管具体表达，专利管公开审查后的技术发明，商业秘密靠持续保密维持价值，商标则保护品牌识别标识。
      - card:
          title: 软件如何组合使用多种保护
          body: |
            一款商业软件往往同时受到多重保护，但各有边界：

            - 源代码与成品安装程序作为文字作品受**版权**保护，防止他人直接拷贝代码。
            - 具有创造性的底层技术方案（如新型压缩方法或硬件协同架构）在满足法定条件时可申请**专利**。
            - 部署在云端、不向外部公开的核心风控规则与内部权重常作为**商业秘密**保护。
            - 软件名称与图标注册为**商标**，防止他人冒名混淆用户。
      - card:
          title: 例题：为一家初创软件公司的四项资产选择保护方式
          body: |
            一家初创公司开发了智能语音转写产品，手头有四项核心资产：① 前端客户端源代码；② 独创的低延迟声学特征硬件加速电路方法；③ 部署在自有云端的训练数据清洗配方；④ 产品名称与鲸鱼徽标。逐项匹配最合适的保护手段：
          reveal:
            - title: 第 1 步：区分具体表达与品牌标识
              body: 前端源代码在写完那一刻就自动获得版权保护（可做著作权登记留存证据）；产品名称与鲸鱼徽标用于让用户认出自家品牌，应当申请商标注册。
            - title: 第 2 步：在专利与商业秘密之间权衡
              body: 声学硬件加速方法需要随产品出售给客户，容易被对手拆解分析，适合申请专利——以公开方案换取有限期内的排他权。云端清洗配方只在公司内部服务器运行、外界无法接触，适合按商业秘密严格保密，省去公开细节的风险。
            - title: 第 3 步：确认商业秘密的失效边界
              body: 如果竞争对手完全独立地研发出相同清洗配方，商业秘密无法禁止对方使用；如果公司未做访问控制导致配方被公开，商业秘密保护也会立刻丧失。
      - item:
          id: q-trade-secret-vs-patent
          type: choice
          prompt: 某公司研发出一套只运行在自家后台服务器上的广告排序算法，既不想把细节公之于众，又希望只要不泄密就能保护超过二十年。它更适合采用哪种方式？
          options:
            - text: 申请专利，因为专利允许申请人永久隐瞒技术细节而不对外公开
              why: 专利制度的核心是以公开换保护，必须公开技术方案且保护期限有限
            - text: 作为商业秘密保护，通过权限隔离和保密协议维持其秘密状态
              correct: true
            - text: 注册商标，因为商标可以阻止任何竞争对手使用相似的后台排序逻辑
              why: 商标只保护品牌名称和标识，不保护后台算法或技术实现
          explain: 后台运行、外界难以逆向还原且不愿公开的内部算法，采取商业秘密保护既无须公开，也不受专利二十年期限限制；代价是必须做好保密且无法阻止他人独立研发。
      - item:
          id: q-software-copyright-scope
          type: choice
          prompt: 程序员甲阅读了程序员乙公开的一篇算法思想博客后，未复制乙的任何代码，独立用另一种编程语言写出实现该思想的程序。从版权角度看，通常如何判断？
          options:
            - text: 甲构成版权侵权，因为版权禁止任何人学习并使用文章中提到的思路
              why: 版权不垄断思想、概念或原理，只限制未经许可复制具体表达
            - text: 甲通常不构成版权侵权，因为版权保护代码等具体表达而非抽象思想
              correct: true
            - text: 只要甲更换了名称与说明文字，哪怕逐行照搬乙的整份代码也同样不构成侵权
              why: 仅做机械改名或简单改写照搬他人代码结构与表达，仍可能构成版权侵权
          explain: “思想与表达区分原则”是版权法的基本原则：学习思想并独立编写实现不侵犯版权，但直接抄袭或换皮照搬具体代码表达构成侵权。
      - item:
          id: q-patent-condition
          type: choice
          prompt: 下列哪一项最准确地概括了获得专利授权通常需要满足的核心条件？
          options:
            - text: 具备新颖性、非显而易见性与实用性，经申请审查并公开技术方案
              correct: true
            - text: 和版权一样，发明完成时自动获得保护，不需要申请
              why: 完成时自动产生、不经审查的是版权；专利必须提出申请、通过审查，并且只在有限期内有效
            - text: 发明人须全程向专利局保密技术原理，以免公开细节后被同行借鉴
              why: 专利制度要求充分公开技术细节，使本领域技术人员能够实施，否则不予授权
          explain: 专利的本质是社会契约：发明人公开新颖、非显而易见且实用的技术方案，换取国家授予的有限期排他实施权。

  - id: fair-use-and-drm
    chapter: 知识产权
    title: 合理使用、数字限制与点对点共享
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一位大学老师在写书评文章时，为了批评某本畅销技术书中的一个错误观点，逐字引用了书中一小段约 80 字的原话并注明出处。这种未经作者事先书面同意的引用一定算侵权吗？
          options:
            - text: 一定算侵权，版权作品哪怕引用一个句子都必须先签商业授权合同
              why: 版权法允许在评论、教学、研究等场景下有限度地合理使用作品，以保障公共讨论与知识传播
            - text: 通常不算，出于评论目的的少量引用常属合理使用
              correct: true
            - text: 只要注明了出处，引用多少都不算侵权
              why: 注明出处是必要的，但不够；合理使用还要看引用的目的、引用了多少、会不会替代原作的市场
          explain: 版权不是无边界的垄断，法律通过合理使用在保护创作者与促进文化交流之间留出平衡空间。这一课讲合理使用、数字版权管理以及围绕软件产权的长期争论。
      - card:
          title: 合理使用的四项考量因素
          body: |
            **合理使用（fair use）**允许在评论、新闻报道、教学与研究等场景中，无需许可有限使用版权作品。判断是否成立，通常综合权衡四项因素（各国具体条款须按本地法律核验）：

            1. **使用目的与性质**：是否用于教学、评论或具转化性价值，而非纯商业照搬。
            2. **原作品性质**：事实性作品比虚构创作的合理使用空间通常更宽。
            3. **使用量与实质性**：摘录比例是否适度，是否拿走最核心部分。
            4. **潜在市场影响**：是否直接替代原作品的销售或授权市场。
      - card:
          title: 数字版权管理与新的使用限制
          body: |
            数字文件可以无损复制后，内容厂商引入了**数字版权管理（digital rights management，DRM）**，用加密和设备绑定阻止未经授权的拷贝。许多司法辖区还立法禁止绕过这类技术保护措施。

            DRM 带来的张力在于：它既挡住了盗版，也常常一并挡住了合法用途。例如消费者买下电子书后无法备份到另一台阅读器，视障人士难以用屏幕朗读器转换受锁文档，研究人员在检测设备安全漏洞时也可能因绕过加密而触碰法律红线。
      - item:
          id: q-fair-use-factors
          type: choice
          multi: true
          prompt: 在判断一段未经授权的引用是否属于“合理使用”时，通常需要综合权衡哪些核心因素？
          options:
            - text: 使用的目的与性质（例如评论、教学或是否具有转化性）
              correct: true
            - text: 所使用部分在原作品中的数量与实质性比重
              correct: true
            - text: 该使用对原作品现有或潜在商业市场的影响
              correct: true
            - text: 引用者在文章末尾注明了“如涉侵权联系即删”的免责声明
              why: “侵权必删”声明不能替代事前授权，也不属于判断是否构成合理使用的法定四项因素之一
          explain: 合理使用需要综合考察使用目的、原作品性质、使用比例与实质性、以及对原作品市场的影响这四项因素，而非单看某一条。
      - card:
          title: 点对点网络与网盘的法律争议
          body: |
            早期音乐和影视共享大量借助**点对点网络（peer-to-peer，P2P）**：文件不存放在单一中心服务器，而是由用户电脑彼此直接传片断。后来又出现集中存储文件并生成分享网址的网盘服务。

            这类技术本身具有双刃剑特征——P2P 既可用于高效分发开源操作系统镜像，也可能被用来传播盗版电影。法律争议的关键往往在于：平台是作为中立工具并在接到侵权通知后及时下架，还是主动诱导、鼓励甚至靠盗版流量牟利。
      - item:
          id: q-p2p-dual-use
          type: choice
          prompt: 为什么法院和政策制定者在处理 P2P 文件共享软件争议时，不能简单因为“有人用它传盗版”就将整项底层技术定性为非法？
          options:
            - text: 该技术具备实质合法用途，责任判定须区分中立工具与主动诱导侵权
              correct: true
            - text: 只要平台不把完整文件存在单一中心服务器，运营者就永远免于侵权责任
              why: 即使不设中心服务器，如果平台主动诱导、鼓励或靠盗版流量牟利，运营者依然可能承担间接侵权责任
            - text: 只要受保护作品被拆成多个碎片并发传输，版权法就不再将其认定为复制
              why: 切分传输只是技术手段，把受版权保护的作品完整重组给未授权用户仍涉及侵权
          explain: 通用技术往往兼具合法与非法用途，判断责任的关键在于是否存在实质非侵权用途，以及运营者是否故意诱导侵权或拒不配合移除侵权内容。
      - card:
          title: 软件知识产权保护的正当性争论
          body: |
            围绕“软件究竟该享有怎样的知识产权保护”，长期存在两派观点。支持者认为，开发大型软件投入巨大，没有版权或专利回报，企业就缺乏动力持续研发。

            质疑者则指出，过度宽泛的软件专利会制造“专利雷区”，让小团队无意间踩中模糊权利要求而面临诉讼，反而拖慢创新；此外，许多基础软件依靠开源协作、服务收费与政府科研资助同样取得了极高质量。理解双方论据，有助于避免把单一立场当成唯一答案。
      - card:
          title: 例题：对比两起“未经授权使用版权教材”的场景
          body: |
            同样未获出版社书面授权，场景甲：一名学生在读书笔记博客里摘录某教材中的 2 个定义段落，逐句分析其优缺点；场景乙：某网站将整本教材扫描成电子版免费提供下载，并在页面投放广告。按四项因素对比：
          reveal:
            - title: 第 1 步：对比目的与使用量
              body: 场景甲用于学习评论，加入大量个人分析，具有转化性，且摘录比例极小。场景乙只是原样搬运整本教材并附带商业广告，无任何转化性价值，使用量为 100%。
            - title: 第 2 步：评估市场替代效应
              body: 读过场景甲博客的读者仍需购买原教材才能系统学习，不会替代原书销量。场景乙直接提供了完整替代品，严重侵蚀出版社和作者的市场收益。
            - title: 第 3 步：得出判断
              body: 场景甲高度符合合理使用；场景乙明显构成版权侵权。两者的分界线在于目的、比例与市场替代，而不是“网上能不能找到”。
      - item:
          id: q-drm-tension
          type: choice
          prompt: 批评者指出数字版权管理（DRM）在打击盗版之外可能带来副作用，下列哪项是最具代表性的正当担忧？
          options:
            - text: 技术锁一刀切地阻碍了合法买家的个人备份、无障碍朗读与正当安全研究
              correct: true
            - text: 会让互联网上所有未采用加密的开源项目自动丧失原作者的版权署名权
              why: DRM 仅作用于采用了该加密限制机制的受控内容，不会剥夺无关开源项目的署名权
            - text: 加密会让正版文件的画质和音质明显下降
              why: DRM 控制的是谁能打开、能做什么，解密后内容和原来一样；争议在于它也拦住了合法的使用
          explain: DRM 的核心伦理与政策难题在于：技术锁无法分辨恶意盗版与合法合理使用，往往一刀切地剥夺了消费者的合理使用空间。
      - item:
          id: q-software-ip-debate
          type: choice
          prompt: 关于“软件是否应当允许申请广泛专利”的争论中，反对宽泛软件专利的一方最核心的论点是什么？
          options:
            - text: 宽泛模糊的软件专利容易形成诉讼障碍，提高中小团队创新门槛，阻碍技术交流
              correct: true
            - text: 软件本质上是数学，任何国家都不允许给软件相关的发明授予专利
              why: 多数法域排除的是抽象算法本身；和具体技术效果结合的软件发明，在美国、欧洲和中国都可能获得专利
            - text: 开源许可证在法律上不能和专利共存，所以开源社区必须反对一切专利
              why: Apache 2.0、GPLv3 等许可证都写了专利授权条款，开源和专利可以共存；争论针对的是宽泛模糊的专利
          explain: 软件技术演进快、组合度高，过于宽泛的软件专利容易导致防守性专利囤积和诉讼威胁，这是软件产权争论的焦点之一。

  - id: open-source-and-cc
    chapter: 知识产权
    title: 开源许可证、知识共享与商业合规
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你在公开代码托管网站上看到一个没有附带任何许可证文件的项目，于是直接把它的代码复制进了公司的商业闭源产品里。你认为“代码在网上公开能看到”就等于“可以免费随便商用”吗？
          options:
            - text: 等于，只要公开在互联网上，作者就自动放弃了全部版权
              why: 版权自动产生，没有附带许可证的公开代码默认保留所有权利，他人无权擅自复制商用
            - text: 不等于，无许可证公开代码默认保留全部版权
              correct: true
            - text: 只要保留原作者的名字，就可以随便商用
              why: 保留署名不等于得到许可；没有许可证时，复制和商用都需要作者另外授权
          explain: 公开可见不等于开源授权。合法使用他人代码和创作内容，必须看清许可证的每一项义务。这一课系统梳理常见开源许可证、知识共享许可和商业合规要点。
      - card:
          title: 宽松许可与著佐权许可
          body: |
            **开源许可证（open-source license）**写明了作者允许他人做什么及须履行的义务，按是否要求衍生品开源主要分两类：

            - **宽松许可（permissive license）**：如 **MIT**、**BSD**、**Apache 2.0**。允许修改并整合进闭源商业软件，主要义务是保留版权声明与许可文本（Apache 2.0 另含明确专利授权）。
            - **著佐权（copyleft）许可**：如 **GPL**（通用公共许可证）。对外分发包含该代码的衍生软件时，整个衍生作品须按 GPL 公开源码。
      - card:
          title: 弱著佐权与网络服务触发条款
          body: |
            在宽松许可和强著佐权之间，还有两种工程中经常遇到的变体：

            - **LGPL**（宽通用公共许可证，弱著佐权）：如果你的商业闭源程序只是通过标准接口动态接入一个 LGPL 库，通常只需开源对该库本身的修改，不必把自己的业务主程序全部开源。
            - **AGPL**（Affero GPL）：传统 GPL 只在“对外分发软件副本”时触发开源义务，很多云厂商只在自家服务器运行修改后的 GPL 软件而对外提供网页接口，从而避开分发。AGPL 补上了这一口子——只要通过网络向用户提供服务，就同样触发公开修改后源码的义务。
      - item:
          id: q-oss-license-match
          type: match
          prompt: 将下面四种常见开源许可证与它们在商业闭源产品中的核心约束配对。
          pairs:
            - ["MIT 许可", "宽松许可，保留版权声明和许可文本即可用于闭源商业产品"]
            - ["GPL 许可", "强著佐权，对外分发包含该代码的衍生软件时须按 GPL 开放源码"]
            - ["LGPL 许可", "弱著佐权，动态接入该库时通常仅须开源对库本身的改动"]
            - ["AGPL 许可", "即使不分发安装包，仅通过网络提供服务也触发开源义务"]
          explain: 选型前分清宽松、强著佐权、弱著佐权与网络服务触发条款，是企业避免合规事故的基本功。
      - card:
          title: 知识共享许可（Creative Commons）
          body: |
            开源许可证主要针对软件代码；对于文档、教材、图片、音频和视频等创作作品，常用**知识共享许可（Creative Commons，CC）**。它由四个基础条件灵活组合：

            - **BY（署名）**：必须标明原作者和来源。
            - **SA（相同方式共享）**：改编后的新作品必须沿用相同许可发布（类似文档领域的著佐权）。
            - **NC（非商业性使用）**：不得用于商业盈利目的。
            - **ND（禁止演绎）**：可以原样转发，但不得修改或二次创作。

            例如 `CC BY-NC-SA` 表示：允许转载和改编，但必须署名、不得商用，且改编后的作品必须继续使用同样许可。
      - item:
          id: q-cc-combo
          type: choice
          prompt: 一位摄影师将风景照片以 `CC BY-NC-ND` 协议发布。下面哪一种使用方式遵守了该协议？
          options:
            - text: 公益科普公众号注明摄影师署名后，原图未改动地配发在非营利文章中
              correct: true
            - text: 某咖啡馆注明署名后，把照片印在对外售卖的纪念马克杯上
              why: 印在售卖商品上属于商业用途，违反了 NC（非商业性使用）条款
            - text: 一名学生注明署名后，把照片裁剪调色并加上漫画人物后发到个人免费博客
              why: 裁剪调色并添加图案属于二次演绎创作，违反了 ND（禁止演绎）条款
          explain: '`CC BY-NC-ND` 要求同时满足三项条件：署名（BY）、非商业使用（NC）以及不得修改演绎（ND）。'
      - card:
          title: 商业项目中的开源合规清单
          body: |
            商业团队引入第三方开源组件时，不能只看功能好用，通常需要建立规范的合规流程：

            1. **清点组件清单**：维护一份**SBOM（软件物料清单）**，列出直接和间接依赖的每个开源库、版本号与许可证。
            2. **核对义务与兼容性**：检查是否需要附带版权声明、是否含 GPL 或 AGPL 触发条件，以及多个许可证混用时是否存在条款冲突。
            3. **明确无证禁区**：网上没有声明许可证的代码一律视为保留所有权利，不可直接拷贝入库。
      - card:
          title: 例题：审查一款 SaaS 云服务的第三方依赖清单
          body: |
            一家公司准备上线一款付费闭源的在线文档协作网站（仅通过网页向客户收费提供服务，不分发客户端安装包）。审计工具在后端依赖清单中发现了四个组件：① MIT 协议的日期处理库；② GPL 协议的后台日志分析脚本；③ AGPL 协议的在线排版引擎；④ 网上博客里一段无许可证声明的算法代码。逐项判断合规风险：
          reveal:
            - title: 第 1 步：确认低风险与明确义务项
              body: ① MIT 日期库属于宽松许可，合规成本最低，只需在产品声明中保留其版权声明与许可文本即可安全商用。
            - title: 第 2 步：区分 GPL 与 AGPL 在云服务场景的差别
              body: ② 后台日志脚本只在公司内部运行且不对外分发，通常不触发 GPL 的分发开源义务（但仍需留意将来是否会卖给客户私有化部署）。③ 在线排版引擎采用 AGPL，即使不分发安装包，只要通过网络向用户提供服务，就触发公开修改后源码的义务，与闭源商业策略冲突，须更换组件或另行购买商业授权。
            - title: 第 3 步：处理无许可证代码
              body: ④ 无许可证博客代码默认保留全部版权，属于高侵权风险项，必须移除并自行重写，或联系作者取得正式书面授权。
      - item:
          id: q-agpl-cloud
          type: choice
          prompt: 某团队打算开发闭源付费云服务（用户只通过浏览器访问，不下载服务端程序），他们看中了一个 AGPL 协议的开源核心引擎。以下判断哪项正确？
          options:
            - text: 由于没有把客户端安装包发给用户，可以免费闭源运行而无需公开源码
              why: 这是把 AGPL 和普通 GPL 混淆了；AGPL 专门针对网络服务场景设定了开源触发条件
            - text: 仅通过网络提供交互服务同样触发 AGPL 义务，闭源须更换组件或购买授权
              correct: true
            - text: 只要像 LGPL 那样通过标准接口接入该引擎而不改写主程序，就不必公开修改
              why: AGPL 属于强著佐权且覆盖网络交互服务，不能套用 LGPL 的宽松接入例外来规避源码公开义务
          explain: AGPL 的设计初衷正是弥补 GPL 在云计算时代的“不分发就不触发”空白，通过网络交互向用户提供服务即触发源码公开义务。
      - item:
          id: q-sbom-purpose
          type: choice
          prompt: 商业软件团队在发布产品前建立并维护 SBOM（软件物料清单），最主要的合规价值是什么？
          options:
            - text: 将项目引入的所有开源与闭源代码统一转换为宽松许可，消除条款冲突
              why: SBOM 只是记录依赖成分与许可证信息的清单，不能单方面更改第三方组件的授权协议
            - text: 全面盘点直接和间接开源组件的版本与许可证，提前排查义务与兼容风险
              correct: true
            - text: 替代第三方安全测试与代码评审，直接确保所有开源组件不存在软件缺陷
              why: SBOM 帮助团队看清组件清单与合规及漏洞波及范围，但不能替代测试与代码评审
          explain: 现代软件往往层层嵌套数十上百个开源依赖，只有借助 SBOM 才能看清全部直接和间接组件的许可证义务与兼容性风险。

  # ======================================================================== 偏见
  - id: automation-legitimacy
    chapter: 偏见
    title: 自动化决策何时具有正当性
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 某医院打算引入一套自动评分系统，直接根据历史病历自动决定“哪些病人可以优先排手术，哪些病人延后”，不再让主治医生参与复核。你认为只要算法比单个医生算得更快，就应当由系统全权替代人工决策吗？
          options:
            - text: 应当，机器没有情绪波动，所以把任何决策全权交给算法都更公平
              why: 统计模型只能从历史记录找相关性，无法理解个案的特殊背景、伦理权衡和未记录的临床线索
            - text: 不应当，高风险决策中算法只能辅助，不能取代人责
              correct: true
            - text: 只要界面上显示了精确到小数点后四位的评分，医生就无需再核对病情
              why: 小数位多只代表计算格式精细，不代表评分背后的数据全面、目标合理或判断可靠
          explain: 自动化决策并非“越自动越好”。这一课从为什么现代社会既需要制度规则、又不能把一切交给机器学习谈起，区分三种不同程度的自动化。
      - card:
          title: 机器学习不能简单替代人的决策
          body: |
            预测模型擅长在大量历史样本中寻找统计规律，但“做出一项影响他人的正当决定”远不止算一个预测分数。招聘、贷款、医疗分诊或司法量刑，往往需要回答价值问题：哪些风险可以承受、误伤好人和漏放风险各占多大权重、特殊困境是否应予照顾。

            这些价值取舍没有纯数学答案，必须由承担公共责任的人或机构作出，并向受影响者说明理由。因此，机器学习工具可以提供参考信息，却不能自动替代负责任的人类决策。
      - card:
          title: 制度规程为何能抵御任意决策
          body: |
            人们常把“按章办事的官僚流程”看成繁琐低效，但在治理意义上，公开透明的成文规程恰恰是**抵御任意决策的屏障**：它要求同等情形按同一公开标准处理，限制决策者凭个人好恶或私下关系拍板。

            自动化系统看似也做到了“按统一公式处理所有人”，但两者有一个关键差别：成文规程允许人看懂规则本身并就例外情况提出异议，而黑箱模型往往把隐蔽的历史偏差固化成冰冷分数，让人无从质询。
      - item:
          id: q-bureaucracy-role
          type: choice
          prompt: 在探讨自动化决策的正当性时，为什么学者常拿“公开的成文制度规程（官僚制）”与算法系统作对照？
          options:
            - text: 成文规程以公开标准防任意拍板，并留有审查与例外空间
              correct: true
            - text: 因为传统纸质流程速度慢，所以只要把纸质表格换成黑箱模型就自然实现了更高正当性
              why: 提高处理速度并不自动带来正当性，黑箱模型反而可能隐藏偏见并削弱问责能力
            - text: 因为成文规程完全不需要人来执行，每一项决定都能脱离人类价值判断独立完成
              why: 成文规程由人制定、公开审查并由工作人员结合情境执行，并非脱离人类判断
          explain: 正当的决策既需要一致性（避免随心所欲），也需要可解释、可质询和例外纠偏机制；不能只拿算法的一致性冒充正当性。
      - card:
          title: 自动化的三种形式
          body: |
            在现实系统中，自动化并不是“全人工”和“全自动”的二选一，常见有三种形态：

            1. **辅助人类决策**：算法整理证据、标出风险提示，最终判断和签字仍由受过训练的人完成。
            2. **执行明确规则的自动处理**：规则本身公开清晰且无争议（如按法定税率表算税额、按学分门槛核对毕业学分），程序负责准确一致地执行。
            3. **基于统计预测的自主裁决**：系统直接用历史数据训练出的打分模型决定拒绝贷款、筛掉简历或冻结账号，这是伦理争议最集中的区域。
      - card:
          title: 例题：评估三个场景适合哪一种自动化形式
          body: |
            比较下面三个系统：① 图书借阅超期自动计算滞纳金；② 急诊室利用影像模型高亮肺部可疑结节供放射科医生复核；③ 某公司上线自动淘汰系统，直接删除评分低于 60 分的求职者简历且不设人工抽检。逐项评估其正当性：
          reveal:
            - title: 第 1 步：识别明确规则的自动执行
              body: 场景①的计费规则公开透明（每天固定费率），不存在复杂价值权衡，用程序自动计算既高效又公平，但仍应保留错账申诉通道。
            - title: 第 2 步：识别人机协同辅助决策
              body: 场景②把模型定位为医生的“第二双眼睛”，帮助减少漏诊，最终诊断责任和综合判断留在医生手里，同时应警惕医生过度依赖提示而放松独立检查（自动化偏见）。
            - title: 第 3 步：识别高风险自主裁决的隐患
              body: 场景③把影响个人生计的筛选全权交给历史统计模型，一旦模型学到历史歧视或遗漏非传统优秀背景，求职者既不知情也无法申诉，缺乏正当性。
      - item:
          id: q-three-automation-match
          type: match
          prompt: 将下面三种实际系统与对应的自动化形式或风险特征配对。
          pairs:
            - ["按公开固定费率自动结算停车费", "执行明确公开规则的自动处理，争议较小但需留错账更正渠道"]
            - ["影像模型标出可疑病灶由主治医生确诊", "辅助人类决策，发挥机器筛查效率同时由人承担最终责任"]
            - ["黑箱评分模型直接拒贷且不提供人工复核", "高风险自主统计裁决，易将隐蔽偏差固化并削弱问责"]
            - ["工作人员盲目照抄模型建议不再核对原始证据", "自动化偏见，名义上有人把关实则流于形式"]
          explain: 区分规则执行、人工辅助与自主统计裁决，并防范“名义复核实则盲从”，是设计负责任自动化系统的起点。
      - item:
          id: q-automation-bias-check
          type: choice
          prompt: 某信贷审批流程虽然保留了“人工审核员点确认”环节，但考核指标只看每小时审批单数，审核员几乎从不推翻模型给出的拒绝建议。这种设计存在什么问题？
          options:
            - text: 只要流程中保留了人工点击确认按钮，就说明系统已经做到实质性人工把关
              why: 缺乏时间、信息和纠偏激励的机械点击只是形式上的“橡皮图章”，无法发挥人工把关作用
            - text: 单纯追求处理速度的考核会诱发盲从模型建议，使人工复核流于形式
              correct: true
            - text: 为避免人工复核与模型打分口径不一，应当取消审核员并完全隐藏评分依据
              why: 完全取消复核并隐藏依据会进一步剥夺当事人的纠错与申诉空间
          explain: 有效的人工把关需要给予审核员充足时间、清晰依据以及推翻模型建议的权限和合理考核，否则容易滑向形式化点击。
      - item:
          id: q-when-legitimate
          type: choice
          prompt: 下列哪项条件组合最能支持一项自动化决策系统在公共或商业高风险场景中的正当性？
          options:
            - text: 明确适用边界、公开可检验依据，并保留实质人工复核与申诉救济渠道
              correct: true
            - text: 只要持续扩大历史训练数据规模，即便决策目标模糊也无需再做人工审计
              why: 数据量本身不能纠正错误的决策目标或系统性历史偏见
            - text: 只要内部测试集的总体准确率超过九成，就不再需要向被拒绝者解释理由
              why: 即使整体准确度较高，被误判的少数个体仍可能遭受严重影响，需要透明与救济机制
          explain: 正当性来自清晰的适用边界、经得起检验的依据、合理的责任归属以及有效的复核救济，而不是单纯的速度或数据规模。

  - id: targets-proxies-recourse
    chapter: 偏见
    title: 目标错位、代理特征与申诉救济
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一家公司用过去十年的招聘录用记录训练简历筛选模型，为了让模型“不歧视性别”，工程师在训练前专门删除了简历里的“性别”那一栏。你认为删掉性别字段后，模型就一定不会对女性求职者打低分了吗？
          options:
            - text: 一定不会，模型看不到性别这一栏就不可能产生与性别相关的差异
              why: 简历中的学校名称、社团经历、措辞习惯和职业空窗期都可能与性别高度相关，充当性别的替代信号
            - text: 仍有可能，因为其他看似中性的字段可能与性别高度相关并复制历史偏见
              correct: true
            - text: 只会在训练数据少于 100 份时出现偏差，数据超过一万份就自动消除偏见
              why: 如果历史录用本身存在系统性偏见，增大同源历史数据量只会让模型更稳固地学会这种偏见
          explain: 简单“遮住敏感字段”无法消除算法偏见。这一课拆解偏见的四大技术根源——目标错位、信息遗漏、代理特征与归纳局限，并说明为什么必须建立申诉救济。
      - card:
          title: 预测目标与实际目的错位
          body: |
            许多偏差在训练模型之前就已经埋下：人们真正关心的往往是难以直接测量的概念（如“谁会成为好员工”“谁最需要医疗照顾”），建模时只好选一个容易统计的替代标签。

            例如某医疗机构用“过去一年的医疗花费金额”作为“病人健康需求高”的替代标签。结果模型系统性低估了低收入或就医不便群体的病情——不是他们更健康，而是他们过去看不起病、花费更少。这种**目标与目的错位**会把社会不平等直接写进模型。
      - card:
          title: 代理特征、信息遗漏与归纳的局限
          body: |
            即使删掉性别、族裔等敏感字段，模型依然可能通过**代理特征（proxy feature）**间接重建它们：例如简历里的“女子学院”“女性工程社团”“产假导致的职业空窗期”，或居住邮政编码，在统计上都可能与受保护群体高度关联。

            此外，数据表常常**遗漏关键背景信息**（如一次短期停工源于照顾家人而非工作能力不足）；更深一层，基于历史数据的**归纳具有局限性**：把过去的录用模式推演到未来，等于默认过去的评价标准永远正确、环境不会变化。
      - item:
          id: q-hiring-bias-sources
          type: choice
          multi: true
          prompt: 某公司用历史招聘数据训练简历筛选模型，上线后发现女性求职者评分系统性偏低。以下哪些属于该偏见的合理来源？
          options:
            - text: 历史招聘决策本身存在性别倾向，模型忠实复制了这一规律
              correct: true
            - text: 历史数据中女性录用样本偏少，模型对女性履历特征学习不足
              correct: true
            - text: 女子学院、特定社团名称或职业空窗期等中性字段充当了性别的代理特征
              correct: true
            - text: “成功员工”的绩效标签定义本身带有部门偏见，导致目标与真实能力错位
              correct: true
            - text: 训练时已经删掉了性别字段，所以评分偏低只能说明女性简历本身质量较差
              why: 删掉性别字段挡不住代理特征，历史标签记录的也只是过去的录用决定，不等于真实能力
          explain: 招聘模型偏见通常不是单一原因造成，而是历史偏见、样本不均衡、代理特征与标签目标错位共同作用的结果。
      - card:
          title: 准确预测的权利、能动性与申诉救济
          body: |
            当模型对个人作出不利决定时，当事人往往会问：我是否有权获得准确评估？如果系统错判了我，该找谁说理？这涉及三个核心概念：

            - **能动性（agency）**：个体应当知道哪些行为改变可以改善自己的评估结果，而不是面对无法改变或无法理解的评分。
            - **申诉救济（recourse）**：受影响者能够获知不利决定的主要依据，纠正错误的基础数据，并申请独立的人工复核。
            - **归责（culpability）**：部署系统的机构必须对错误决定承担责任，不能用“这是算法算出来的”推卸义务。
      - card:
          title: 例题：为存在性别偏差的简历筛选模型制定整改方案
          body: |
            某科技公司审计发现，其内部简历初筛模型给同等资历的女性候选人打分明显偏低。按治理闭环分步处理：
          reveal:
            - title: 第 1 步：排查数据与特征根源
              body: 核查历史训练样本的性别分布与过往晋升/录用标签是否偏斜；检查特征重要性，识别“女子学院名称”“社团前缀”“短期职业空窗”等代理特征，并审视“高绩效”标签是否偏向特定岗位风格。
            - title: 第 2 步：修正模型并按群体持续审计
              body: 删除或规范化高关联代理特征，补充代表性样本或调整训练权重；在发布前和上线后定期按群体比较通过率与误拒率，而不是只看总体准确率。
            - title: 第 3 步：保留人工复核与停用底线
              body: 明确对外说明系统用途，为被初筛淘汰的候选人提供人工抽检与申诉复核渠道；如果经过多轮修正仍无法消除系统性偏见，应当果断停用该模型，恢复人工或结构化标准化评审。
      - item:
          id: q-target-mismatch-example
          type: choice
          prompt: 某城市想预测“哪些街区最容易发生犯罪”以便分配警力，工程师直接用“过去五年的逮捕记录数量”当作真实犯罪率的标签。这种做法最核心的风险是什么？
          options:
            - text: 逮捕数混入了历史巡逻分布与执法倾向，容易在正反馈链条中不断放大偏差
              correct: true
            - text: 五年时间跨度过短，只要把同一来源的逮捕记录扩充到五十年即可消除偏差
              why: 如果标签本身混淆了执法密度与真实发案率，拉长同类历史数据只会把原有偏差固化得更深
            - text: 逮捕记录属于结构化历史统计，模型只看记录就无法体现不同街区的警力差距
              why: 逮捕记录恰恰深深混入了过往警力投放差距，模型反而会把原本多巡逻的街区继续判为高风险
          explain: 逮捕数不等于真实发案数：原本巡逻更密的社区逮捕记录更多，模型就会派去更多警力，进一步推高逮捕数，形成自我强化的正反馈链条。
      - item:
          id: q-proxy-feature-check
          type: choice
          prompt: 在信用评分模型里已经删掉了“民族”和“家庭背景”两列，却保留了精确到街道门牌号的居住邮编。为什么审核人员仍将其视为潜在歧视风险？
          options:
            - text: 居住邮编常与群体空间聚居高度相关，会在统计上充当敏感属性的代理特征
              correct: true
            - text: 精细邮编字段取值类别过多，会让模型只看邮编而彻底忽略历史还款记录
              why: 风险不在于模型忽略还款记录，而在于邮编的统计分布与特定受保护群体高度重合，变相引入群体差异
            - text: 保留邮编会让同一城市的所有借款人拿到相同的信用分数，失去区分能力
              why: 邮编反而会拉大不同居住区人群的评分差距，带来隐蔽的群体不公
          explain: 代理特征之所以隐蔽，是因为它本身看上去客观中性，却通过社会空间或生活习惯的相关性把敏感属性重新带回模型。
      - item:
          id: q-recourse-order
          type: order
          prompt: 当一家公司发现正在试运行的简历筛选模型对女性求职者存在系统性低估时，按由先到后的治理逻辑排列下列步骤。
          steps:
            - 暂停自动淘汰功能，避免偏差在排查期间继续影响求职者
            - 按群体审计通过率与误判率，定位历史标签偏差与代理特征
            - 清理代理特征、补充平衡样本并建立人工复核与申诉通道
            - 复测确认偏差消除后再评估是否启用，若无法消除则坚决停用该模型
          explain: 发现系统性偏见时，应先止损暂停自动裁决，再诊断数据与代理特征，随后整改并配置人工救济，最后经复测确认或决定停用。

  - id: classification-and-groups
    chapter: 偏见
    title: 分类模型、混淆矩阵与群体差异
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个用于筛选奖学金申请者的自动模型，整体判断准确率达到 90%。你认为只要“总体准确率达到 90%”，就足以说明它对甲、乙两个不同院系的学生一样公平吗？
          options:
            - text: 足以说明，整体准确率高达九成意味着每个子群体内部也必然是九成
              why: 整体准确率会被人数占多数的群体主导，少数群体内部的误拒率或误判率可能远高于整体水平
            - text: 不能说明，不同群体内部的误判率和通过率仍可能存在明显差距
              correct: true
            - text: 只要准确率没有达到 100%，所有群体受到的影响就一定完全相同
              why: 剩余 10% 的错误完全可能高度集中在某一个特定群体身上
          explain: 讨论算法公平不能只看一个笼统的总体准确率。这一课用清晰的符号和一张具体的混淆矩阵，把分类模型在不同群体上的表现拆开算清楚。
      - card:
          title: 把总体与分类任务写清楚
          body: |
            为了严谨讨论公平性，统计学习把现实人群抽象为四个核心符号：

            - $X$：输入给模型的个体特征（如收入、工作年限、还款记录）。
            - $A$：**受保护属性（protected attribute）**，如性别、年龄段或族裔，用来划分需要对照检验的群体。
            - $Y \in \{0, 1\}$：真实结果（如 $Y = 1$ 表示确实按期还款，$Y = 0$ 表示违约）。
            - $R$ 与 $\hat{Y} \in \{0, 1\}$：模型输出的连续打分 $R$，以及按门槛切出的最终二元判定 $\hat{Y}$（如 $\hat{Y} = 1$ 批准，$\hat{Y} = 0$ 拒绝）。

            监督学习的过程，就是利用带历史标签 $(X, Y)$ 的数据学出从 $X$ 到预测 $\hat{Y}$ 的映射。
      - card:
          title: 混淆矩阵与四个关键比率
          body: |
            把模型的判定 $\hat{Y}$ 和真实结果 $Y$ 交叉对照，排成一张 2×2 的表，这张表叫**混淆矩阵（confusion matrix）**，四个格子是四类计数：真正例 $TP$（真 1 判 1）、假正例 $FP$（真 0 判 1）、假负例 $FN$（真 1 判 0）、真负例 $TN$（真 0 判 0）。由此定义四个常用比率：

            - **基础率（base rate）**：群体中真实正例比例 $P(Y = 1 \mid A = a)$。
            - **选中率**：模型判为正例的比例 $P(\hat{Y} = 1 \mid A = a) = \frac{TP + FP}{N}$。
            - **真正例率（TPR）**：真实正例被正确放行的比例 $\frac{TP}{TP + FN}$。
            - **假正例率（FPR）**：真实负例被误放行的比例 $\frac{FP}{FP + TN}$。
            - **阳性预测值（PPV）**：被判为正例的人中确实为真的比例 $\frac{TP}{TP + FP}$。
      - item:
          id: q-metrics-match
          type: match
          prompt: 将下面四个群体评估指标与它们在贷款审批场景（$Y=1$ 表示按期还款，$\hat{Y}=1$ 表示批准贷款）中的直观含义配对。
          pairs:
            - ["基础率 P(Y=1 | A=a)", "该群体所有申请者中，实际能够按期还款的人所占比例"]
            - ["真正例率（TPR）", "实际能按期还款的人里，顺利获得贷款批准的比例"]
            - ["假正例率（FPR）", "实际会违约的人里，被模型误判而获得批准的比例"]
            - ["阳性预测值（PPV）", "所有获得贷款批准的人里，最终确实按期还款的比例"]
          explain: 牢记分子和分母分别站在谁的视角：TPR 与 FPR 按“真实结果”分组统计，PPV 按“模型预测结果”分组统计，基础率则是数据本身的真实正例占比。
      - card:
          title: 例题：从 100 名申请者的混淆矩阵手算各项指标
          body: |
            某贷款初筛模型在 100 名申请者上的测试结果为：$TP = 36$（真还且批）、$FP = 14$（真违约却批）、$FN = 4$（真还却拒）、$TN = 46$（真违约且拒）。逐步算出四项指标：
          reveal:
            - title: 第 1 步：算选中率与阳性预测值（PPV）
              body: 模型总共批准了 $TP + FP = 36 + 14 = 50$ 人，因此选中率为 $50 / 100 = 50\%$。在这 50 名获批者中，确实还款的有 36 人，因此 $\text{PPV} = 36 / 50 = 72\%$。
            - title: 第 2 步：算真正例率（TPR）
              body: 所有实际能按期还款的人共有 $TP + FN = 36 + 4 = 40$ 人（基础率为 $40\%$）。其中 36 人获批，因此 $\text{TPR} = 36 / 40 = 90\%$，说明有 $10\%$ 的合格申请者被错拒。
            - title: 第 3 步：算假正例率（FPR）
              body: 所有实际会违约的人共有 $FP + TN = 14 + 46 = 60$ 人。其中 14 人被误批，因此 $\text{FPR} = 14 / 60 \approx 23.3\%$。审计公平性时，必须把这套指标分别按群体 $A$ 单独各算一遍再对比。
      - item:
          id: q-calc-tpr-100
          type: number
          unit: '%'
          prompt: 某分类模型在 100 名申请者上的测试结果为 $TP = 36, FP = 14, FN = 4, TN = 46$。该模型的真正例率（TPR）是多少（填百分数数值）？
          answer: 90
          explain: 真实正例总数为 $TP + FN = 36 + 4 = 40$，其中 36 人被判为正例，所以 $\text{TPR} = 36 / 40 = 90\%$。
      - item:
          id: q-calc-ppv-100
          type: number
          unit: '%'
          prompt: 某贷款审批模型的测试结果为 $TP = 36, FP = 14, FN = 4, TN = 46$。该模型的阳性预测值（PPV，即获批者中真实还款的比例）是多少（填百分数数值）？
          answer: 72
          explain: 模型共批准 $TP + FP = 36 + 14 = 50$ 人，其中真实还款 36 人，因此 $\text{PPV} = 36 / 50 = 72\%$。
      - item:
          id: q-why-disaggregate
          type: choice
          prompt: 为什么评估分类模型是否存在群体偏见时，必须按受保护属性 $A$ 拆分计算各群体的 TPR、FPR 和 PPV，而不能只看全体的单一准确率？
          options:
            - text: 少数群体较高的误拒或误判率容易被多数群体的总体均值掩盖
              correct: true
            - text: 只要各子群体的样本数量不等，总体准确率就无法反映任何样本的预测对错
              why: 总体准确率仍能统计整体预测对错，但它在人群占比悬殊时会掩盖少数群体内部的错误分布差异
            - text: 总体准确率只统计假正例而不计入假负例，必须拆群后才能把两类错误合并
              why: 总体准确率同时受假正例和假负例影响，问题在于它不区分这些错误落在了哪一个群体身上
          explain: 分群体拆解审计（disaggregated evaluation）是发现算法偏见的基础步骤：总体指标好看，不代表每个子群体都得到了公平对待。

  - id: fairness-criteria
    chapter: 偏见
    title: 三种统计公平判据与不可兼得
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一家银行开发信用评分模型，甲、乙两个群体的历史实际按期还款比例不同（甲群体 60%，乙群体 30%）。你认为只要算法足够先进，就能同时做到“甲乙获批率相同、获批者实际还款率相同、两类错误率也全部相同”吗？
          options:
            - text: 可以，只要用更深的神经网络把误差压低，这三条统计公平指标就能同时满足
              why: 除了预测百分之百零失误的理想情形外，当两个群体基础率不同时，这三条统计指标在数学上存在硬冲突
            - text: 不能，只要两个群体基础率不同且模型存在误差，这些判据在数学上无法同时成立
              correct: true
            - text: 只有在模型随机抛硬币做决定时，才能同时满足获批者还款率相同与错误率相同
              why: 抛硬币虽能让选中率和错误率相同，但获批者的实际还款率仍等于各自的基础率（60% 与 30%），并不相等
          explain: “公平”在数学上不止一种定义，而且不同定义之间常常互相打架。这一课用具体数字亲手验证独立性、分离度与充分性三种判据，看清它们为什么不能兼得。
      - card:
          title: 三种核心统计非歧视判据
          body: |
            给定受保护属性 $A$、真实结果 $Y$ 和预测 $\hat{Y}$，统计公平文献总结出三大核心判据：

            - **独立性（independence）**，又称人口均等：要求预测结果与群体属性统计独立，即各群体选中率相等，$P(\hat{Y} = 1 \mid A = a) = P(\hat{Y} = 1 \mid A = b)$。
            - **分离度（separation）**，又称均衡赔率：在给定真实结果 $Y$ 后，预测与群体独立，即各群体的 $\text{TPR}$ 相等且 $\text{FPR}$ 相等（若只要求 $\text{TPR}$ 相等，称为机会均等）。
            - **充分性（sufficiency）**：在给定预测分数或判定后，真实结果与群体独立，即同一分数或同为 $\hat{Y} = 1$ 时各群体的 $\text{PPV}$ 相等。
      - card:
          title: 为什么三种判据往往无法同时满足
          body: |
            假设某信贷模型存在真实误差（并非百分百全对），且群体 A 与群体 B 的基础率 $p_A \neq p_B$。可以推导出一个恒等式，把假正例率、真正例率、基础率与阳性预测值锁在一起：

            $$\text{FPR} = \frac{p}{1 - p} \cdot \frac{1 - \text{PPV}}{\text{PPV}} \cdot \text{TPR}$$

            看这个等式：如果模型同时满足**充分性**（两边 $\text{PPV}$ 相等）并且满足 $\text{TPR}$ 相等，那么因为 $p_A \neq p_B$，左侧的 $\text{FPR}_A$ 和 $\text{FPR}_B$ 必然不相等——**分离度就被打破了**。同样，只要基础率不同且模型有区分度，独立性与充分性也无法同时成立。
      - item:
          id: q-three-criteria-match
          type: match
          prompt: 将三种统计公平判据与它们各自要求“跨群体相等”的指标配对。
          pairs:
            - ["独立性（人口均等）", "各群体获得正面预测的比例（选中率）相等"]
            - ["分离度（均衡赔率）", "各群体的真正例率（TPR）与假正例率（FPR）分别相等"]
            - ["充分性（校准一致）", "同样获得正面预测（或同一分数）时，各群体的阳性预测值（PPV）相等"]
            - ["机会均等（分离度弱化版）", "仅要求各群体中真实合格者的放行率（TPR）相等"]
          explain: 独立性盯选中率，分离度盯 TPR/FPR 错误率，充分性盯同一预测下的真实兑现率（PPV）；三者分别代表不同利益方的公平直觉。
      - card:
          title: 例题：信用评分案例里的真实数字冲突
          body: |
            假设 A、B 两个群体各有 200 名贷款申请者。A 群体有 120 人实际能还（基础率 $60\%$），80 人违约；B 群体有 60 人实际能还（基础率 $30\%$），140 人违约。某模型是**校准（calibration）**良好的，即它给出的分数和实际发生的频率一致（打 70 分的人里约 70% 真的按期还款）；充分性和校准密切相关。模型结果如下：A 群体 $TP = 90, FN = 30, FP = 30, TN = 50$；B 群体 $TP = 45, FN = 15, FP = 15, TN = 125$。逐项验算：
          reveal:
            - title: 第 1 步：验证充分性与真正例率
              body: A 群体共批 $90 + 30 = 120$ 人，$\text{PPV}_A = 90 / 120 = 75\%$，$\text{TPR}_A = 90 / 120 = 75\%$。B 群体共批 $45 + 15 = 60$ 人，$\text{PPV}_B = 45 / 60 = 75\%$，$\text{TPR}_B = 45 / 60 = 75\%$。两边同分同风险，**充分性成立**。
            - title: 第 2 步：检查独立性与假正例率
              body: 选中率方面，A 群体是 $120 / 200 = 60\%$，B 群体是 $60 / 200 = 30\%$，**独立性不成立**。假正例率方面，$\text{FPR}_A = 30 / 80 = 37.5\%$，而 $\text{FPR}_B = 15 / 140 \approx 10.7\%$，**分离度也不成立**。
            - title: 第 3 步：如果强行改为满足独立性会怎样
              body: 若通过后处理调整门槛，强行让 A、B 都批准 90 人（选中率均为 $45\%$），B 群体总共只有 60 名真实能还者，哪怕把这 60 人全找出来，$\text{PPV}_B$ 最高也只有 $60 / 90 \approx 66.7\%$，必然低于 A 群体，从而破坏充分性。
      - card:
          title: 如何在工程上满足某一项判据
          body: |
            既然三种判据在基础率不同时不能全都要，团队就必须先结合业务与伦理目标选定主判据（例如信用放贷常看重校准与违约成本，招聘初筛常看重不埋没合格者的机会均等），再通过三类干预实现它：

            - **前处理**：在训练前修正抽样偏差、重新加权或清理代理特征。
            - **中处理**：在模型训练目标中加入公平性惩罚项或约束条件。
            - **后处理**：保持原有风险打分不变，对不同群体设定不同的通过阈值（如在信用评分中微调放贷门槛以对齐 TPR）。但需注意，按群体设不同门槛在部分法律辖区可能触及差异对待争议，须结合法律评估。
      - item:
          id: q-credit-fpr-a
          type: number
          unit: '%'
          prompt: 在某信用评分评估中，群体 A 的 80 名实际违约者里有 30 人被模型误批（$FP = 30, TN = 50$）。群体 A 的假正例率（FPR）是多少（填百分数数值）？
          answer: 37.5
          explain: $\text{FPR}_A = FP / (FP + TN) = 30 / 80 = 37.5\%$。即便两群体的 PPV 和 TPR 都是 $75\%$，由于基础率不同，群体 A 的 FPR（$37.5\%$）仍远高于群体 B（约 $10.7\%$）。
      - item:
          id: q-impossibility-condition
          type: choice
          prompt: 在什么条件下，独立性、分离度与充分性这三种统计公平判据之间必然出现无法同时满足的冲突？
          options:
            - text: 两个群体的真实基础率不同，且模型存在非零预测误差时
              correct: true
            - text: 只要两个群体人数一模一样，不管基础率是否相同都会发生数学冲突
              why: 冲突的根源是基础率（正例占比）不同，而不是群体总人数不同；即便两组人数同为 200 人，只要基础率分别为 60% 与 30% 依然冲突
            - text: 只有在模型把所有人都预测为拒绝（全 0）时，充分性和分离度才会冲突
              why: 冲突发生在存在真实误差且基础率不等的常规分类模型上，不是全 0 退化情形的专利
          explain: 基础率差异与非零预测误差共同锁死了三组比率之间的代数关系，因此必须明确价值取舍，而不是幻想靠调参同时满足全部判据。
      - item:
          id: q-interventions-match
          type: match
          prompt: 将公平性干预的三个阶段与对应的典型做法配对。
          pairs:
            - ["前处理", "训练前清洗代理特征、补充少数群体样本或对样本重新加权"]
            - ["中处理", "在模型训练优化过程中直接加入群体差异约束或惩罚项"]
            - ["后处理", "不重新训练打分模型，通过调整不同群体的决策门槛满足指定判据"]
          explain: 前、中、后处理分别作用在数据、训练过程和输出决策阈值三个位置，各有成本和合规约束。

  - id: relative-fairness
    chapter: 偏见
    title: 相对公平观、间接歧视与公平的代价
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一家公司设定了表面上“对所有性别一视同仁”的录用硬条件：应聘办公室文员必须能徒手搬起 50 公斤重物。这项规则没有提到性别，而且公司主管也声称自己毫无歧视恶意。你认为这项规定不存在歧视问题吗？
          options:
            - text: 不存在问题，只要规则条文里没写“限男性”且没有主观恶意，就一定公平
              why: 与岗位真实需求无关的严苛门槛若对特定群体造成系统性排除，即使表面中性也构成间接歧视
            - text: 存在问题，与岗位核心职责无关却系统性排斥某一群体的中性规则属于间接歧视
              correct: true
            - text: 只要这项规定写进了员工手册并贴在公告栏上，就自动符合法律上的机会均等
              why: 公开透明并不能让一条与工作职责无关的排他性门槛变得正当
          explain: 公平不只是数学公式的对齐，还关乎历史劣势、意图与后果、机会均等以及公平代价的分担。这一课从社会与伦理层面补全统计公平之外的拼图。
      - card:
          title: 系统性相对劣势与歧视为何错误
          body: |
            社会中部分群体之所以处于**系统性相对劣势**，往往源于长期累积的教育、住房、信贷或就业差距。伦理与法学对“歧视究竟错在哪里”提出了多种解释，常见的有下面几种：

            - 它源于偏见或敌意，或建立在粗糙的群体刻板印象上；
            - 它否认了个体的独立尊严与平等道德地位；
            - 它剥夺了本可自由发展的机会，或在制度上巩固了群体间的从属地位；
            - 它在决策中纳入了与当下任务毫无关系的特征。
      - card:
          title: 故意歧视与间接歧视
          body: |
            法律与伦理通常区分两种歧视形态：

            - **直接歧视（差别对待）**：明确按受保护属性区别对待（如“只招男性”），往往带有直接针对性。
            - **间接歧视（indirect discrimination，差别影响）**：规则表面上完全中性、决策者也未必怀有恶意，但在实际执行中对特定群体造成不成比例的不利后果，且无法证明该规则是完成工作所必需的合理手段。

            算法模型很少明目张胆地写下“拒绝某群体”，绝大多数算法偏见属于**没有主观恶意却造成实质伤害的间接歧视**。
      - item:
          id: q-indirect-discrim
          type: choice
          prompt: 某招聘平台为了图省事，用“住址到公司直线距离不超过 3 公里”筛选客服人员（该岗位完全可以远程或正常通勤），结果排除了居住在较远低收入社区的大量求职者。这最符合哪种概念？
          options:
            - text: 间接歧视：规则表面中性，但缺乏岗位必要性且对特定群体造成系统性不利
              correct: true
            - text: 充分性校准：模型确保了不同距离群体的阳性预测值严格相等
              why: 这一规则是人为设定的硬筛选门槛，而不是统计校准指标
            - text: 合理使用：公司出于效率目的有权设置任何与岗位无关的居住限制
              why: 合理使用是版权法概念，且与工作职责无关的排他门槛不能仅以图省事为由获得正当性
          explain: 判断间接歧视看两点：第一，中性规则是否对受保护群体造成不成比例的不利；第二，该规则是否为达成正当业务目标所真正必要。
      - card:
          title: 机会均等、功绩与应得的张力
          body: |
            人们常说要“按能力（功绩）选拔、机会均等”，但不同人对机会均等的理解存在深刻分歧：

            - **形式机会均等**：比赛发令枪响时，规则一视同仁，不看出身只看当下分数。
            - **实质机会均等**：注意到起跑线本身并不公平（有人享有优质辅导资源，有人缺少基本条件），如果只看当下分数，就会把起点差距包装成个人“应得”或“不应得”。

            这解释了为什么不同公平观之间存在张力：一方认为“只看预测还款率才尊重个人功绩”，另一方认为“如果历史信贷歧视压低了某群体信用分，沿用旧分只是在复制不公”。
      - card:
          title: 公平的代价与谁来承担
          body: |
            调整算法以满足某种公平要求时，往往伴随**公平的代价**：商业机构可能会面临预测准确率微降、违约风险略升，或额外的人工复核与审计开支。

            关键问题在于“代价不该只由处于弱势的群体默默承担”。如果我们放任有偏见的模型上线以换取机构省钱，相当于让被错误拒贷、错误淘汰的弱势个体替系统买单；反之，把审计、纠偏与人工复核列为必要运营成本，才是把外部伤害内部化的负责任做法。
      - item:
          id: q-cost-of-fairness
          type: choice
          prompt: 某团队反对给高风险审批模型增加群体偏差审计和人工复核，理由是“这会降低处理效率并让总体准确率下降 1%”。下面哪项回应切中要害？
          options:
            - text: 不做审计省下的成本，本质上是把误判带来的沉重代价转嫁给了被系统错伤的少数群体
              correct: true
            - text: 总体准确率仍在 99% 左右，少数群体的误判率高一些可以忽略
              why: 总体准确率是按人数平均的，人数少的群体错误率再高也拉不动它；审计正是为了发现这种被平均掉的伤害
            - text: 审计和人工复核做好以后，总体准确率一定会回升，不存在真正的代价
              why: 公平约束和总体准确率是两个不同的目标，加约束常让准确率略降，题干里的 1% 就是这种真实代价
          explain: “没有免费的不公平”——不付出审计与纠偏成本时，代价并没有消失，只是转移成了被错误拒绝者的真实损失。
      - card:
          title: 例题：拆解“仅按标准化笔试分数自动录取”的争议
          body: |
            某培训奖学金项目决定完全按一道在线英语编程笔试的自动分数从高到低录取，不看背景信息。支持者称其“最客观公平”，反对者指出农村地区申请者因缺少早期计算机课和英语训练，入选比例远低于大城市学生。按相对公平观分析：
          reveal:
            - title: 第 1 步：识别两种机会均等观点的冲突
              body: 支持者站在**形式机会均等**立场，强调同一套试卷对所有人标准一致、杜绝人情干扰；反对者站在**实质机会均等**立场，指出当前分数混杂了家庭与地区教育资源差距，未必准确反映未来学习潜力。
            - title: 第 2 步：检验“功绩与应得”的假设
              body: 把笔试高分直接等同于“个人努力应得”，忽略了起跑线差异。若奖学金的真实目标是资助有潜力但缺少资源的学员，单看现有英语编程熟练度还会造成目标错位。
            - title: 第 3 步：设计兼顾透明与包容的方案
              body: 可改为提供中文无障碍基础逻辑测试以降低先备资源门槛，或者保留基础合格线后结合成长潜力与资源匮乏背景做综合评审，并公开评分权重与申诉流程。
      - item:
          id: q-formal-vs-substantive
          type: match
          prompt: 将下面四个公平伦理概念与对应的核心关注点配对。
          pairs:
            - ["形式机会均等", "选拔规则在当下对所有竞争者一视同仁，不因身份设置明文障碍"]
            - ["实质机会均等", "正视起跑线资源不平等，防止将历史劣势固化为永久落差"]
            - ["功绩与应得争论", "质疑当下测得的分数究竟有多少来自个人努力、多少来自先赋条件"]
            - ["公平的代价", "衡量纠偏带来的准确率变化或审计成本，并追问原本由谁承担误判损失"]
          explain: 形式与实质机会均等的张力、功绩归因的界限以及成本分担，共同构成了统计公式之外的伦理判断框架。
      - item:
          id: q-why-wrong-multi
          type: choice
          multi: true
          prompt: 即使某项算法歧视并非出自工程师的主观恶意，为什么它依然在伦理上站不住脚？
          options:
            - text: 它以粗糙的群体统计标签替代个体真实情况，可能损害个体尊严与机会
              correct: true
            - text: 它会在制度层面不断强化既有群体的系统性相对劣势
              correct: true
            - text: 它把与任务核心能力无关的特征带入了关键资源分配决定中
              correct: true
            - text: 只要开发者主观上没有歧视意图，算法造成的群体不利后果在伦理上就无需理会
              why: 伦理和反歧视实践不仅看主观意图，更重视实际造成的系统性不利后果与可避免的伤害
          explain: 歧视之错既可以来自恶意，也可以来自刻板归类、剥夺机会、固化历史劣势以及引入无关因素——无意造成的系统性伤害同样必须治理。

  # ======================================================================== 可持续性
  - id: carbon-and-greenhouse
    chapter: 可持续性
    title: 气候变化、温室气体与二氧化碳当量
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 某年冬天你所在的城市遇到了一场罕见的暴雪，气温比往年同期低了不少。有人说“这说明全球变暖并不存在”。这种反驳成立吗？
          options:
            - text: 成立，只要地球上还有地方下暴雪，就证明全球平均气温没有上升
              why: 某地某天的暴雪属于短期局地“天气”，不能否定数十年尺度的全球平均“气候”变化趋势
            - text: 不成立，单次寒潮属于短期局地天气，而全球变暖是长期全球平均气温上升趋势
              correct: true
            - text: 成立，因为全球变暖只发生在赤道附近，不会改变中高纬度地区的极端天气
              why: 全球气候系统彼此连通，长期变暖反而会改变大气环流，增加各地极端冷暖和极端降水事件
          explain: 做绿色软件工程前，先分清天气与气候、全球变暖与气候变化，以及不同温室气体如何折算成统一碳排指标。
      - card:
          title: 天气与气候、全球变暖与气候变化
          body: |
            日常交流里常把两对概念混用，但在环境科学与绿色软件工程中需要严格区分：

            - **天气（weather）**指某个地点在几小时到几天内的短期大气状态（如下雨、寒潮）；**气候（climate）**指某一地区在几十年尺度上的长期统计平均状态与变化规律。
            - **全球变暖（global warming）**特指近现代地球表面长期平均温度的上升；**气候变化（climate change）**涵盖范围更广，包括变暖引发的海平面上升、冰川融化、降水格局改变以及更频繁的极端热浪与干旱。
      - card:
          title: 温室效应与二氧化碳当量（CO2eq）
          body: |
            大气中的**温室气体（greenhouse gases）**——主要是二氧化碳（$\text{CO}_2$）、甲烷（$\text{CH}_4$）与氧化亚氮（$\text{N}_2\text{O}$）——吸收地表红外辐射并保留热量，形成**温室效应**。化石燃料燃烧推高其浓度，打破了热量平衡。

            衡量单位质量某气体在规定年限内相当于多少倍二氧化碳增温效应的指标叫**全球变暖潜能值（GWP）**。按国际气候评估 100 年标准：$\text{CO}_2$ 为 $1$、$\text{CH}_4$ 约 $28$、$\text{N}_2\text{O}$ 约 $265$。各气体乘以 GWP 再相加，即得统一单位**二氧化碳当量（CO2eq）**。
      - item:
          id: q-climate-concepts-match
          type: match
          prompt: 将下面四个环境与碳核算基础概念与它们的准确含义配对。
          pairs:
            - ["天气与气候的区别", "前者是某地几天内的短期大气状况，后者是几十年尺度的长期统计规律"]
            - ["全球变暖与气候变化", "前者特指全球长期平均气温上升，后者还包括海平面、降水与极端事件等整体变化"]
            - ["全球变暖潜能值（GWP）", "衡量 1 千克某温室气体在给定年限内相对于 1 千克二氧化碳的增温倍数"]
            - ["二氧化碳当量（CO2eq）", "将不同温室气体按 GWP 折算为等效二氧化碳质量后的统一排放单位"]
          explain: 统一用 CO2eq 核算，软件团队才能把发电、制冷剂泄漏等不同来源的温室气体排放放到同一把尺子上比较。
      - card:
          title: 例题：把混合温室气体折算成二氧化碳当量
          body: |
            假设某数据中心园区在一次统计周期内排放了 $100\text{ kg}$ 二氧化碳（$\text{GWP} = 1$）、$5\text{ kg}$ 甲烷（$\text{GWP} = 28$）以及 $1\text{ kg}$ 氧化亚氮（$\text{GWP} = 265$）。计算总排放量对应的 $\text{CO}_2\text{eq}$：
          reveal:
            - title: 第 1 步：分别乘以各自的 100 年 GWP
              body: 二氧化碳贡献 $100 \times 1 = 100\text{ kg CO}_2\text{eq}$；甲烷贡献 $5 \times 28 = 140\text{ kg CO}_2\text{eq}$；氧化亚氮贡献 $1 \times 265 = 265\text{ kg CO}_2\text{eq}$。
            - title: 第 2 步：加总得到总二氧化碳当量
              body: 将三项相加：$100 + 140 + 265 = 505\text{ kg CO}_2\text{eq}$。
            - title: 第 3 步：理解软件碳效率的核心目标
              body: 尽管甲烷和氧化亚氮的排放质量远小于二氧化碳，但因 GWP 很高，在总温室效应中占了大头。绿色软件追求的**碳效率（carbon efficiency）**，就是在完成同等用户价值的前提下，尽可能减少排放的每一克 $\text{CO}_2\text{eq}$。
      - item:
          id: q-co2eq-calc
          type: number
          unit: 'kg'
          prompt: 某项运行活动共产生 $200\text{ kg}$ 二氧化碳（$\text{GWP} = 1$）和 $10\text{ kg}$ 甲烷（$\text{GWP} = 28$）。折算后的总二氧化碳当量（$\text{CO}_2\text{eq}$）是多少千克？
          answer: 480
          explain: 总排放为 $200 \times 1 + 10 \times 28 = 200 + 280 = 480\text{ kg CO}_2\text{eq}$。
      - item:
          id: q-greenhouse-why-matter
          type: choice
          prompt: 为什么绿色软件工程在评估排放时使用“二氧化碳当量（CO2eq）”而不是只统计纯二氧化碳的质量？
          options:
            - text: 不同温室气体的增温倍数悬殊，按 GWP 折算后才能把各类排放放进同一把尺子
              correct: true
            - text: 只有二氧化碳会在大气中留存多年，甲烷和氧化亚氮需要靠折算才能计入短期影响
              why: 恰恰相反，单位质量的甲烷和氧化亚氮在百年尺度内的增温效应远高于二氧化碳，忽略它们会严重低估真实影响
            - text: 数据中心供电排放以甲烷为主，统计纯二氧化碳会漏掉发电端的主要温室气体
              why: 化石燃料发电排放以二氧化碳为主，同时伴随甲烷、氧化亚氮与制冷剂泄漏等，因此需要统一折算为 CO2eq
          explain: 不同温室气体按质量简单相加没有物理意义；通过 GWP 折算为 CO2eq，才能把各种气体的增温贡献汇总为可比较的数字。
      - item:
          id: q-carbon-efficiency-def
          type: choice
          prompt: 在绿色软件实践中，“碳效率（carbon efficiency）”最核心的衡量思路是什么？
          options:
            - text: 在交付同等有用计算或业务价值时，把对应的温室气体排放量（CO2eq）降到最低
              correct: true
            - text: 为了减少排放，直接关闭所有服务器并停止向用户提供任何功能
              why: 碳效率强调的是“单位有用价值对应的碳排放”，目标是在满足业务需求的同时降低碳足迹
            - text: 只要额外购买碳抵消额度，软件本身无需降低耗电与碳强也算高碳效率
              why: 碳效率要求直接减少单位有用价值对应的实际碳排放（包括用电量、硬件碳排与电力碳强度），不能只靠事后抵消替代
          explain: 碳效率关注的是“每完成一份有效工作排放多少 CO2eq”，可以通过省电、提高硬件利用率和采用更清洁的电力协同降低。

  - id: carbon-intensity
    chapter: 可持续性
    title: 电网碳强度、弃电与边际碳强度
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你把同一份耗时 2 小时、消耗 10 度电（10 kWh）的视频转码任务，分别在“正午光伏大发时段”和“傍晚用电高峰靠燃煤机组顶峰时段”运行。两次耗电量完全一样，它们导致的碳排放量也会一样吗？
          options:
            - text: 一样，只要耗电量都是 10 度电，不管何时何地运行产生的碳排都完全相同
              why: 电网中清洁能源与化石能源的占比随地区和时刻不断变化，同样 1 度电背后的碳排放可能相差数倍
            - text: 不一样，不同时间电网里的电源结构不同，每度电对应的碳排放差别很大
              correct: true
            - text: 傍晚用电高峰碳排更低，因为夜间居民和工业负荷下降，电网几乎全由水电供应
              why: 傍晚失去光伏出力且居民用电攀升，电网通常需要加大燃煤或燃气机组出力，每度电碳排放反而升高
          explain: 同样是 1 度电，背后可能是零排放的风电光伏，也可能是高排放的燃煤火电。这一课讲清碳强度、电源调节能力、弃电以及平均与边际碳强度的关键差别。
      - card:
          title: 碳强度及其时空波动
          body: |
            衡量一度电（1 **kWh，千瓦时**）“有多干净”的指标叫**碳强度（carbon intensity）**：电网每生产 1 kWh 电能所排放的二氧化碳当量，单位通常写作 $\text{gCO}_2\text{eq/kWh}$。

            电网碳强度并非固定常数，它在**空间**和**时间**上剧烈波动：水电、核电或风电丰富的地区常年在几十克每千瓦时，而以煤电为主的地区可达六七百克以上。即便在同一个城市，中午阳光充足时碳强度可能显著下降，傍晚光伏退场、负荷冲高时又迅速抬升。
      - card:
          title: 可调度性、弃电与边际碳强度
          body: |
            风电、光伏出力随天气波动，难以按需增发；燃气、燃煤与水电则具备高**可调度性（dispatchability）**，电网可通过**调度（dispatch）**按需启停或增减出力来平衡实时负荷。

            当风光发电超过电网消纳上限，被迫削减多余清洁电力，这叫**弃电（curtailment）**。由此引出**边际碳强度（marginal carbon intensity）**：额外新增 $1\text{ kWh}$ 用电时，电网实际动用的边际机组的碳强度。
      - item:
          id: q-ci-concepts-match
          type: match
          prompt: 将下面四个电网与绿色计算指标和它们的含义一一配对。
          pairs:
            - ["碳强度（gCO2eq/kWh）", "电网每发 1 千瓦时电能对应的二氧化碳当量排放质量"]
            - ["可调度性", "发电厂按电网要求随时启停或调节输出功率的能力"]
            - ["弃电", "风电或光伏发电超出电网消纳能力时被迫浪费削减的清洁电力"]
            - ["边际碳强度", "新增 1 千瓦时用电需求时，负责补足这 1 度电的边际机组的碳强度"]
          explain: 电网永远优先消纳低边际成本的风光电力，再用可调度机组补足缺口，因此新增负荷的实际碳影响看边际机组而不是笼统平均。
      - card:
          title: 例题：为什么平均碳强度只有 80，新增 1 度电却可能排 400 克
          body: |
            假设某区域电网当前总负荷为 $1000$ 兆瓦，其中 $800$ 兆瓦来自已满额利用的光伏（$0\text{ gCO}_2\text{eq/kWh}$），$200$ 兆瓦来自可调度的天然气机组（$400\text{ gCO}_2\text{eq/kWh}$）。比较平均碳强度与边际碳强度：
          reveal:
            - title: 第 1 步：计算当前电网的平均碳强度
              body: 总排放速率按发电占比加权：$(800 \times 0 + 200 \times 400) / 1000 = 80\text{ gCO}_2\text{eq/kWh}$。从历史账单看，电网平均每度电只排 80 克。
            - title: 第 2 步：判断当前新增 1 kWh 时的边际碳强度
              body: 此时光伏已经全额发满、没有多余弃电，你的服务器若额外多用 1 kWh，太阳不会因为你开机就多照一点，电网只能调度天然气机组多发 1 kWh。因此这一刻的**边际碳强度是 $400\text{ gCO}_2\text{eq/kWh}$**，是平均值的 5 倍。
            - title: 第 3 步：如果此时存在 50 兆瓦弃电会怎样
              body: 若此时风电光伏有 $50$ 兆瓦过剩电力正被迫弃电，你新增的 1 kWh 刚好把原本要浪费掉的清洁电吃下来，无需火电增发，此时边际碳强度接近 **$0\text{ gCO}_2\text{eq/kWh}$**。
      - item:
          id: q-avg-ci-calc
          type: number
          unit: 'gCO2eq/kWh'
          prompt: 某区域电网当前总负荷为 $1000$ 兆瓦，其中 $800$ 兆瓦来自零排放光伏（$0\text{ g/kWh}$），$200$ 兆瓦来自天然气机组（$400\text{ g/kWh}$）。此时该电网的**平均**碳强度是多少（单位：$\text{gCO}_2\text{eq/kWh}$）？
          answer: 80
          explain: 平均碳强度为加权平均 $(800 \times 0 + 200 \times 400) / (800 + 200) = 80000 / 1000 = 80\text{ gCO}_2\text{eq/kWh}$。
      - item:
          id: q-marginal-curtailment
          type: choice
          prompt: 在某个风电大发且电网正在发生“弃电”的深夜，数据中心在此刻额外启动一批离线计算任务。关于这批新增用电的边际碳强度，哪项判断正确？
          options:
            - text: 接近 0，因为新增负荷吸收了原本会被浪费掉的可再生能源电力
              correct: true
            - text: 必然高于全天最高燃煤碳强度，因为夜间启动服务器会瞬间增加两倍煤耗
              why: 正在弃电说明清洁电力过剩，额外用电反而减少了弃风弃光，不会促使燃煤机组加负荷
            - text: 等于该地区过去十年的历史年平均碳强度，与当时是否弃电无关
              why: 边际碳强度反映的是“当下多用 1 度电由哪类机组响应”，在弃电时段它与多年历史均值相差悬殊
          explain: 弃电意味着多出来的风光电无处可去；把弹性算力挪到弃电时段运行，既降低成本，又能把新增用电的边际碳排压到接近零。
      - item:
          id: q-why-marginal-matters
          type: choice
          prompt: 工程师要决定“把一批可延迟的离线算力安排在 A 时刻还是 B 时刻运行，才能真正少排温室气体”，为什么业内常建议重点参考边际碳强度而不仅看平均碳强度？
          options:
            - text: 它直接反映额外新增用电时，电网实际调动的边际发电组对应的真实碳排
              correct: true
            - text: 平均碳强度只统计化石燃料而不计入光伏风电，因此无法用于日常排程决策
              why: 平均碳强度按全网所有电源加权计算，它适合做历史总量分摊，但不能反映新增 1 度电由谁补足
            - text: 边际碳强度在任何时段都低于平均碳强度，参考它更容易在报表里呈现减排效果
              why: 在光伏满发无弃电时，边际机组常是燃气或燃煤，边际碳强度反而可能远高于平均碳强度
          explain: 平均碳强度回答“全网已有用电平均排多少”，边际碳强度回答“我多开一台机器会额外引发多少排放”，后者更适合指导实时减排决策。

  - id: demand-shifting-shaping
    chapter: 可持续性
    title: 碳感知计算：需求转移与需求塑形
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你负责一个每晚都要跑 3 小时的离线数据分析任务，只要在次日早上 8 点前算完就行。如果想不改一行核心算法代码就减少碳排放，以下哪种思路最直接有效？
          options:
            - text: 把运行时间或机房位置挪到电网碳强度最低的时段或清洁能源富集地区
              correct: true
            - text: 固定挪到凌晨 2 点跑，因为夜里用电的人少，电一定最干净
              why: 夜里用电少不等于碳强度低；夜里没有太阳能，燃煤发电占比常常更高，要看的是碳强度
            - text: 把任务拆成很多小块，白天晚上平均分开跑
              why: 平均摊开没有利用碳强度的高低差别，总排放基本不变
          explain: 既然电网碳强度随时间和地点波动，软件就可以主动“跟着绿电走”。这一课讲碳感知计算的两大实操手段：需求转移和需求塑形。
      - card:
          title: 需求转移：空间转移与时间转移
          body: |
            **碳感知计算（carbon-aware computing）**的核心是：电网越清洁越要多做功，碳排越高越要少做功。对地点或时刻有弹性的任务，优先用**需求转移（demand shifting）**：

            - **空间转移（spatial shifting）**：在满足数据合规与延迟要求的前提下，把任务迁往碳强度更低的区域机房（如水电、风电富集区）。
            - **时间转移（temporal shifting）**：在同一机房内，将离线训练、备份等非紧急批处理移至预测碳强度最低的窗口（如午间光伏高峰或深夜弃电期）。
      - card:
          title: 需求塑形：按电网碳强度动态调档
          body: |
            不是所有计算都能推迟或搬家：在线视频会议、实时网页访问必须在当下服务用户。这时可以使用**需求塑形（demand shaping）**：应用本身感知当前电网碳强度，在高碳时段主动切换为“节能模式”，在低碳时段恢复全功能。

            典型例子包括：电网碳强度偏高时，视频会议默认关闭非必要高清画质改用标清或纯音频；新闻网站在高碳时段暂停自动播放装饰动画与高分辨率大图；手机系统根据当地电网清洁度动态安排系统大版本更新下载。
      - item:
          id: q-shift-shape-match
          type: match
          prompt: 将下面四种绿色软件工程实践与对应的碳感知策略配对。
          pairs:
            - ["空间转移", "把非实时模型训练任务调度到水电占比更高的云区域机房运行"]
            - ["时间转移", "把每日离线数据备份从晚间煤电高峰挪到午间光伏大发时段执行"]
            - ["需求塑形", "监测到当地电网碳强度高时，视频平台默认以省电标清模式播放"]
            - ["碳强度感知接口", "程序定期查询电网实时与预测碳强度数据，作为任务排程依据"]
          explain: 空间转移改“在哪算”，时间转移改“何时算”，需求塑形改“以什么能耗档位提供实时服务”。
      - card:
          title: 例题：测算一次空间转移与一次时间转移的减排量
          body: |
            某团队有两个周期任务：任务甲是 50 kWh 的模型批量评估，原跑在碳强度 $600\text{ gCO}_2\text{eq/kWh}$ 的机房，可合规迁往 $80\text{ gCO}_2\text{eq/kWh}$ 的清洁区域；任务乙是 20 kWh 的每日备份，原跑在 19:00 高峰（$550\text{ g/kWh}$），可改为 13:00 光伏高峰（$150\text{ g/kWh}$）。计算各自减排量：
          reveal:
            - title: 第 1 步：算任务甲（空间转移）的排放变化
              body: 迁移前排放 $50 \times 600 = 30000\text{ g} = 30\text{ kg CO}_2\text{eq}$；迁移后排放 $50 \times 80 = 4000\text{ g} = 4\text{ kg CO}_2\text{eq}$。单次运行减少 $30 - 4 = 26\text{ kg CO}_2\text{eq}$。
            - title: 第 2 步：算任务乙（时间转移）的排放变化
              body: 调整前排放 $20 \times 550 = 11000\text{ g} = 11\text{ kg CO}_2\text{eq}$；调整后排放 $20 \times 150 = 3000\text{ g} = 3\text{ kg CO}_2\text{eq}$。单次备份减少 $11 - 3 = 8\text{ kg CO}_2\text{eq}$。
            - title: 第 3 步：核查工程边界条件
              body: 实施空间转移前，必须先检查跨区传输海量数据的网络能耗与费用，以及用户个人数据是否受跨境合规限制；实施时间转移时，需留足截止时间缓冲，确保任务不会因推迟错过业务交付窗口。
      - item:
          id: q-shift-saving-calc
          type: number
          unit: 'kg'
          prompt: 一项消耗 $40\text{ kWh}$ 的离线批处理任务，原本在碳强度为 $450\text{ gCO}_2\text{eq/kWh}$ 的时段运行，现通过时间转移改到 $100\text{ gCO}_2\text{eq/kWh}$ 的低碳时段运行。单次执行可减少多少千克 $\text{CO}_2\text{eq}$ 排放？
          answer: 14
          explain: 每千瓦时少排 $450 - 100 = 350\text{ g}$，40 千瓦时共少排 $40 \times 350 = 14000\text{ g} = 14\text{ kg CO}_2\text{eq}$。
      - item:
          id: q-spatial-constraints
          type: choice
          prompt: 某医院打算把包含患者敏感病历的夜间分析任务，通过“空间转移”发送到境外水电最便宜的数据中心运行。在落地前最先必须核查的约束是什么？
          options:
            - text: 医疗敏感数据的跨境传输法律合规与患者隐私保护红线
              correct: true
            - text: 只要境外机房采用 100% 清洁水电，即可自动豁免本地医疗数据的跨境审查
              why: 清洁电力不能豁免数据主权与隐私法律红线，医疗病历跨境传输前必须先满足本地法律合规要求
            - text: 只需先测算跨区运行能否把年度电费降到一半，法律与隐私约束可上线后再补
              why: 隐私违规与跨境传输违法属于不可先上车后补票的硬红线，必须在迁移前完成合规评估
          explain: 绿色软件策略必须与隐私、合规和服务可用性要求协同评估：空间转移只适用于法律允许跨区处理且网络传输代价可控的任务。
      - item:
          id: q-shaping-vs-shifting
          type: choice
          prompt: 一款面向全球用户的实时视频会议软件无法把正在进行的会议推迟到 6 小时后再开。为了降低高碳时段的排放，它最适合采用哪项碳感知做法？
          options:
            - text: 需求塑形：检测到碳强度偏高时，默认切换省电低码率或关闭非必要背景特效
              correct: true
            - text: 时间转移：把正在进行的实时会议自动挂起，等待当地风电大发时段再恢复通话
              why: 实时交互会议对延迟和即时性高度敏感，无法通过时间转移推迟执行
            - text: 离线批量归档：先用最高 4K 码率完成通话，事后再把录像移到低碳时段压缩
              why: 通话期间维持最高码率依然在高碳时段消耗了大量实时算力与带宽，未能降低当下排放
          explain: 无法推迟或搬迁的实时应用适合用需求塑形（按碳强度优雅降级非核心耗能特性），而离线批处理更适合需求转移。

  # ======================================================================== 责任与公共利益
  - id: software-failures
    chapter: 责任与公共利益
    title: 软件失效、Therac-25 与仿真局限
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 1999 年美国火星气候探测者号在接近火星时烧毁失联。事后调查发现，地面两个团队交接推进器数据时，一方用了英制单位“磅力”，另一方却按国际单位“牛顿”读取（1 磅力约等于 4.45 牛顿）。这说明大型软件事故往往源于什么？
          options:
            - text: 只能源于芯片硬件被宇宙射线击穿，纯软件接口约定错误不会酿成大祸
              why: 火星气候探测者号硬件完好无损，事故正是源自两个软件团队的单位接口约定不一致与缺少端到端联调检查
            - text: 看似细小的接口约定、单位换算或并发时机错误，在缺乏独立防线时就会酿成严重事故
              correct: true
            - text: 只要程序能通过代码格式检查顺利运行，就不可能因为数据单位或时间误差导致失事
              why: 格式无误只说明程序能跑起来，无法自动发现物理单位混淆或时间累积漂移这类逻辑错误
          explain: 软件不再只是屏幕上的文字游戏，它控制着医疗设备、航天器和电网。这一课复盘几起经典软件失效事故与计算机仿真的边界。
      - card:
          title: 数据录入、计费错误与著名系统失效
          body: |
            最日常的软件事故往往来自**数据录入与检索错误**或**计费与业务系统缺陷**：一个拼写相近的姓名被误关联到通缉库，可能导致无辜公民被扣留；一条漏判闰年或四舍五入的账单规则，可能让成千上万用户被错扣费用。

            在安全关键领域，细小疏漏的代价更加高昂。例如 1991 年爱国者导弹系统因时钟用 24 位定点小数截断 $0.1$ 秒，每 0.1 秒产生约 $0.000000095$ 秒误差；连续开机 100 小时（$3600000$ 次计数）后累积漂移约 $0.34$ 秒，对飞行速度约 $1676\text{ m/s}$ 的来袭导弹造成超过 $570$ 米的拦截偏差。
      - card:
          title: Therac-25 放疗事故的工程教训
          body: |
            1985 至 1987 年，放射治疗机 **Therac-25** 造成 6 起严重过量辐射事故，至少 3 名患者死亡。暴露出三层失误：

            - **移除硬件互锁**：前代机型靠**硬件互锁（hardware interlock）**挡住高能束直照病人，Therac-25 改由软件把关。
            - **竞态条件与计数器回绕**：快速改写输入触发**竞态条件（race condition）**（结果依赖操作先后）；一个标记“需要安全检查”的 8 位数被程序每轮加 1，每满 $2^8 = 256$ 次回绕成 0，这一轮的检查就被跳过。
            - **含糊报错与傲慢**：机器仅显示难懂的错误码，厂商初期否认软件缺陷。
      - item:
          id: q-therac25-counter
          type: number
          prompt: Therac-25 放疗机的程序里有一个 8 位无符号数，用来标记“需要做安全检查”，程序却每轮把它加 1。从 0 开始不断加 1，它每经过多少次递增就会回绕成 0？
          answer: 256
          hint: 8 位无符号数一共能表示多少个不同的值？
          explain: 8 位无符号数只能表示 $0$ 到 $255$ 共 $2^8 = 256$ 个值，满 256 次后回绕为 0，在 Therac-25 中这使系统误以为无需检查而直接释放过量辐射。
      - card:
          title: 计算机仿真的能力与局限
          body: |
            造桥梁、造飞机、预测气候或测试新药时，工程师广泛使用**计算机仿真（computer simulation）**在真实建造前模拟系统行为。仿真能节省大量成本并测试极端危险场景。

            但仿真永远受制于两重局限：一是**模型假设的简化**——如果数学模型遗漏了真实物理效应（例如桥梁风振的非线性耦合或极端温度下的材料疲劳），算得再精确也是错的；二是**验证不足**——仿真结果必须与真实物理实验或历史观测交叉验证，不能把漂亮的动画当成现实保证。
      - card:
          title: 例题：拆解爱国者导弹 100 小时时钟漂移事故
          body: |
            爱国者系统的计时器每 $0.1$ 秒跳动一次，因定点小数截断误差，每次跳动少算约 $9.54 \times 10^{-8}$ 秒。按三步复原为什么“几乎看不见的微小误差”会导致严重失手：
          reveal:
            - title: 第 1 步：计算连续运行 100 小时的总跳动次数
              body: 1 小时有 $3600$ 秒，每秒跳动 $10$ 次，因此 100 小时累计跳动 $100 \times 3600 \times 10 = 3600000$ 次。
            - title: 第 2 步：算出累积时间漂移
              body: 每次截断误差约 $9.54 \times 10^{-8}$ 秒，乘以 $3600000$ 次，得到约 $0.34$ 秒的时钟滞后。单看 0.34 秒似乎很短。
            - title: 第 3 步：换算成高速目标的空间偏差与工程教训
              body: 来袭导弹速度约 $1676\text{ m/s}$，0.34 秒内飞行超过 $570$ 米，远远超出雷达跟踪窗口。教训是：设计时默认“连续运行几小时就重启”的隐含假设一旦在真实战场上被打破（开机 100 小时），微小数值误差就会演变成致命失效。
      - item:
          id: q-therac25-multi
          type: choice
          multi: true
          prompt: 在 Therac-25 放疗机致命事故的复盘报告中，哪些属于导致事故的关键工程失误？
          options:
            - text: 取消了独立于软件的硬件互锁装置，把生命安全完全寄托在软件逻辑上
              correct: true
            - text: 存在竞态条件和 8 位计数器回绕缺陷，导致高能模式安全校验失效
              correct: true
            - text: 错误提示代码含糊不清，且厂商在早期接到事故报告后未能严肃排查软件原因
              correct: true
            - text: 放疗机没有采用触控图形界面，而是使用传统键盘字符界面操作
              why: 事故根源在于移除硬件互锁、并发竞态条件、计数器回绕与含糊错误码，与是否采用触控界面无关
          explain: Therac-25 是软件工程史上最具警示意义的案例，它说明安全关键系统绝不能只靠软件单点防御，必须配合硬件互锁、严谨验证与开放的事故复盘文化。
      - item:
          id: q-simulation-limit
          type: choice
          prompt: 某团队用计算机仿真模拟一座新型跨海大桥的抗风性能，屏幕上显示结构在强风下一切平稳，于是团队决定跳过风洞缩尺实测直接施工。这种做法最核心的风险是什么？
          options:
            - text: 简化模型可能遗漏关键物理耦合效应，未经物理实测交叉验证容易失真
              correct: true
            - text: 计算机仿真只能用于可视化方案演示，不能参与桥梁或航空结构力学分析
              why: 计算机仿真在现代工程中不可或缺，但它必须与真实物理实验和边界检验相互印证
            - text: 只要提高网格划分密度与数值计算精度，仿真结果就能自动覆盖全部现实工况
              why: 数值网格再密也只求解已写进模型的假设方程，若模型本身漏掉关键物理机制，算得再细依然会失真
          explain: “所有模型都是简化的”——计算机仿真必须清楚标明假设边界，并用真实观测或物理试验交叉验证，不能盲目替代实测。
      - item:
          id: q-unit-mismatch-cause
          type: choice
          prompt: 火星气候探测者号因磅力与牛顿混用而坠毁、银行系统因未校验负数转账导致坏账，这类事故共同提醒工程师哪一条基本功？
          options:
            - text: 在系统边界上明确约定数据单位与有效取值范围，并实施自动化联调核验
              correct: true
            - text: 只要不同子团队统一使用同一种编程语言，数值的物理单位就能自动换算对齐
              why: 编程语言中的普通数值默认不携带物理单位信息，不同团队即便用同一种语言也可能把磅力和牛顿混用
            - text: 只要各个子部件分别通过了单元测试，跨部件接口的数据格式与符号就不会出错
              why: 各自单元测试通过只说明局部符合自身假设，单位混淆和边界漏洞恰恰常出在跨团队接口联调处
          explain: 清晰的接口契约（含单位与边界）、输入校验和端到端集成验证，是阻断低级数据错误演变成重大系统事故的基础防线。

  - id: engineering-and-liability
    chapter: 责任与公共利益
    title: 软件工程规范、担保与厂商责任
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你买了一款商业办公软件，安装时弹出的许可协议里有一行大写英文免责声明：“本软件按现状提供，不附带任何明示或默示担保，因使用造成的一切损失厂商概不负责。”你认为只要写了这行免责条款，无论软件出什么安全事故，厂商都能完全免责吗？
          options:
            - text: 是的，只要用户点了同意，厂商对任何严重人身伤害或欺诈缺陷都能完全免责
              why: 免责条款不能凌驾于法定安全义务之上，尤其在涉及人身安全、重大过失或医疗/汽车等嵌入式产品时，免责声明往往无效
            - text: 不一定，针对人身伤害、重大疏忽或嵌入实体产品的安全缺陷，法律往往限制免责条款效力
              correct: true
            - text: 免责条款只在软件免费时有效，只要收了 1 元钱就一律变成无效合同
              why: 消费级付费软件在一般财产损失范围内常允许有限度责任限制，关键分界在于损失类型、过失程度与所在地区法律
          explain: 软件出事后谁来赔、怎么防，一边连着工程质量体系，另一边连着合同担保与产品责任法。这一课理清这两条线。
      - card:
          title: 用软件工程实践降低失效风险
          body: |
            依靠程序员个人小心无法造出高可靠系统，成熟的**软件工程（software engineering）**用一整套可复核的流程把关：

            - **清晰规格说明**：先写明系统在正常与极端边界下各自应当做什么、禁止做什么。
            - **独立评审与测试**：写代码的人往往自带思维盲区，需要同行评审、自动化回归测试与独立质量验证。
            - **纵深安全设计**：安全关键设备保留独立于软件的硬件互锁与清晰可懂的告警信息，把“单点出错不致酿祸”落到实处。
      - card:
          title: 软件担保、EULA 与厂商责任
          body: |
            消费级软件常附带**EULA（最终用户许可协议）**，用“按现状提供”条款声明不作额外担保，或将一般赔偿上限限定为软件售价。

            但法律实务另有两条关键原则：**过失责任**（厂商未尽行业合理注意义务致损须赔偿）与**严格产品责任（strict product liability）**——含嵌入式控制软件的医疗器械、汽车刹车等产品若有安全缺陷并致人身伤害，无论厂商是否主观疏忽，都须承担赔偿责任。
      - item:
          id: q-liability-match
          type: match
          prompt: 将下面四种与软件质量和责任相关的概念与它们的核心含义配对。
          pairs:
            - ["EULA 按现状免责条款", "软件许可中声明不作额外质量担保或限制一般经济赔偿上限的合同条款"]
            - ["默示担保（implied warranty）", "法律默认商品至少应具备其宣称基本用途的起码可用性，无需写在广告里"]
            - ["过失责任", "因未尽到行业合理的开发、测试或警示注意义务而引发损害须承担的法律责任"]
            - ["严格产品责任", "缺陷产品造成人身伤害时，不论厂商主观是否疏忽都须承担的赔偿责任"]
          explain: 合同免责并非万能护身符：面对默示基本可用性、重大过失以及危及生命的缺陷产品，法律会施加比普通许可协议更强的责任约束。
      - card:
          title: 例题：对比两起软件缺陷引发的责任争议
          body: |
            比较两个案例：案例甲：某单机图片编辑软件偶发闪退，导致用户未保存的半小时修图丢失；案例乙：某汽车厂商的自动紧急制动控制软件存在逻辑缺陷，未能识别静止障碍物导致追尾致人重伤。厂商均援引 EULA 免责声明。分析差异：
          reveal:
            - title: 第 1 步：评估案例甲（通用消费软件的轻微经济/时间损失）
              body: 通用桌面软件环境复杂、售价有限，若每次闪退都要赔付高额间接损失，软件行业难以运转。因此多数法域对一般消费软件的有限免责与退款/修复补丁安排持相对宽容态度，但厂商仍须修补已知严重缺陷、不得隐瞒欺诈。
            - title: 第 2 步：评估案例乙（安全关键嵌入式产品的人身伤害）
              body: 制动软件已嵌入实体机动车并直接关乎生命安全。法院通常将其视为实体缺陷产品适用**严格产品责任**，不会认可 EULA 里单方面免除人身伤害赔偿的条款。
            - title: 第 3 步：反推工程研发投入标准
              body: 责任边界直接决定了工程标准：开发安全关键系统必须投入远高于普通应用的规格验证、独立安全认证、冗余互锁与事后召回机制。
      - item:
          id: q-strict-liability-case
          type: choice
          prompt: 某智能胰岛素泵因内置控制固件缺陷导致过量给药、危及患者生命。厂商辩称“我们团队没有故意害人，并且说明书末尾印了免责条款”。按严格产品责任原则，下列判断哪项准确？
          options:
            - text: 只要厂商证明开发团队没有主观恶意，就不需要为医疗设备缺陷致伤承担任何赔偿
              why: 严格产品责任的核心特点正是不以厂商存在主观恶意或疏忽为前提，只要产品存在安全缺陷致伤就须担责
            - text: 嵌入式医疗设备关乎生命安全，即便厂商无主观故意，缺陷致伤仍可能触发严格产品责任
              correct: true
            - text: 只有当软件完全免费下载时才适用严格产品责任，收费医疗器械一律免除责任
              why: 恰恰相反，商业出售的缺陷产品正是严格产品责任的典型适用对象
          explain: 在医疗、航空、汽车等直接关涉人身安全的领域，严格产品责任倒逼厂商在上市前投入充分的安全工程验证，不能靠免责声明转嫁风险。
      - item:
          id: q-se-practices-multi
          type: choice
          multi: true
          prompt: 为了把高风险软件的失效概率压低到可接受水平，成熟的软件工程实践通常包含哪些关键环节？
          options:
            - text: 编写清晰可验证的需求与边界规格说明，明确安全红线
              correct: true
            - text: 开展独立于原作者的同行代码评审与系统级验证测试
              correct: true
            - text: 在安全关键场景为软件逻辑配套独立的物理或硬件安全互锁
              correct: true
            - text: 用单一软件程序取代全部独立的物理或硬件安全互锁，以减少维护环节
              why: 安全关键系统不能把生命安全单点寄托于软件，独立的物理或硬件互锁是纵深安全的重要防线
          explain: 规范规格、独立评审测试、清晰的故障提示与日志机制，加上安全关键领域的硬件互锁，共同构成可靠的工程质量体系。
      - item:
          id: q-eula-why-exist
          type: choice
          prompt: 为什么普通消费级软件的最终用户许可协议（EULA）中几乎都会写明有限担保或责任上限？
          options:
            - text: 用来界定低价通用软件的一般故障赔偿边界，但不能豁免重大过失或安全致伤
              correct: true
            - text: 因为通用软件在法律上属于纯信息服务，天然豁免于消费者保护法与侵权法之外
              why: 软件行业同样受消费者保护法、合同法与侵权法约束，免责条款在法定红线面前无效
            - text: 只要用户在安装时勾选同意免责声明，厂商即可永久免除一切安全补丁与维护义务
              why: 负责任的厂商仍需提供安全更新与缺陷修复，且不少地区已立法要求联网设备在服役期间提供安全维护
          explain: EULA 有限担保平衡了通用低价软件的商业风险，但其效力存在明确法律边界，不能成为推卸安全责任或隐瞒缺陷的挡箭牌。

  - id: professional-ethics-whistleblowing
    chapter: 责任与公共利益
    title: 专业伦理准则、案例判断与吹哨
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 距离一款拥有百万用户的在线支付 App 发版只剩两天，你发现了一个能让攻击者窃取用户银行卡信息的严重漏洞。主管为了赶上线奖金，要求你先隐瞒这个漏洞、“等下个月有空再悄悄修”。你首先应该怎么做？
          options:
            - text: 听从主管安排立刻上线，既然主管发了话，出了安全事故工程师一点责任都没有
              why: 服从上级安排不能免除专业人员避免伤害、守护公共利益的伦理责任
            - text: 立刻把漏洞利用代码和公司内部源码全部发到社交媒体公开曝光
              why: 贸然公开未修补的漏洞细节会直接把攻击武器交到黑客手里，反而放大对用户的伤害
            - text: 以书面形式向主管清楚说明漏洞风险与伤害后果，提出修复或延期上线方案并保留记录
              correct: true
          explain: 面对商业进度与公众安全正面冲突时，工程师既不能盲从隐瞒，也不能鲁莽泄密。这一课系统讲解专业伦理准则和负责任的逐级上报与吹哨路径。
      - card:
          title: 计算机职业的成熟度与伦理准则
          body: |
            医生和律师通常必须通过国家统一执业资格考试、加入强制性行业协会，违规时会被吊销执照。相比之下，计算机工程与软件开发入门门槛灵活，没有统一的强制执业执照，因此行业自律与**专业伦理准则**格外重要。

            **ACM**（美国计算机协会）与 **IEEE** 计算机学会（IEEE 是电气电子工程师学会）的联合工作组在 1999 年制定了《软件工程伦理与职业实践准则》；ACM 另有自己的《ACM 职业道德与职业行为准则》（现行版 2018 年）。两份准则都把**公共利益放在首位**作为最高原则。
      - card:
          title: ACM 与 IEEE 伦理准则的核心原则
          body: |
            梳理两大准则的高频核心条款，可以归纳为两条主线：

            - **一般道德原则**：为社会与人类福祉做贡献；避免伤害；诚实可信；公平不歧视；尊重隐私；尊重知识产权；履行保密义务。
            - **专业责任原则**：在工作中追求高质量；保持并只承接自身胜任范围内的工作；了解并遵守相关法律法规；积极接受并提供客观专业评审；全面评估计算机系统及其风险，在发现重大安全隐患时坦诚报告。

            当“对雇主的忠诚”与“公众的生命财产安全”发生冲突时，准则明确规定：**公共利益与安全高于雇主或客户的短期商业利益**。
      - item:
          id: q-acm-core-multi
          type: choice
          multi: true
          prompt: 下列哪些条款属于 ACM 职业道德准则与软件工程伦理准则明确强调的核心原则？
          options:
            - text: 将公众健康、安全与福祉置于首位，努力避免对他人造成伤害
              correct: true
            - text: 保持诚实可信，全面评估并如实报告系统存在的安全风险
              correct: true
            - text: 尊重用户隐私与他人知识产权，只承接自己具备胜任能力的工作
              correct: true
            - text: 只要严格按雇主排定的交付进度与功能规格编码，产品上线后的社会安全后果全由雇主承担
              why: 准则明确强调公众健康与安全高于短期商业进度，工程师发现重大风险时有责任如实评估并上报
          explain: 公共利益优先、避免伤害、诚实、公平、尊重隐私与产权、胜任力与风险评估，是计算机专业伦理准则的基石。
      - card:
          title: 面临隐瞒压力时的逐级上报与吹哨
          body: |
            当上级要求隐瞒严重安全缺陷且常规提醒无效时，专业伦理提供有序升级路径，而非在“沉默同谋”与“冲动泄密”间二选一：

            1. **书面沟通提方案**：客观书面说明风险、潜在伤害及修复或延期方案。
            2. **内部逐级上报**：若直接上级拒绝，保留记录并向更上级、安全、法务或审计部门反映。
            3. 审慎**吹哨（whistle-blowing）**：仅当内部途径耗尽、公众面临严重伤害且证据确凿时，依法向监管机构报告；全程切勿向公众泄露可被黑客直接利用的细节。
      - card:
          title: 例题：用伦理准则处理“上级要求隐瞒高危漏洞”案例
          body: |
            某医疗预约平台上线前夕，安全测试员小陈发现只要修改请求里的用户编号就能查看任意患者的完整病历。产品经理称“明天要开新闻发布会，先上线，两周后再修”。按规范步骤拆解小陈的行动：
          reveal:
            - title: 第 1 步：对照准则确立判断
              body: 患者病历属于高度敏感隐私，一旦上线极易引发大规模信息泄露与次生诈骗伤害。依据“避免伤害”“尊重隐私”与“公共利益优先”，绝不能带着已知高危越权漏洞直接发布。
            - title: 第 2 步：书面提交风险评估与修复方案
              body: 小陈向产品经理和研发负责人发送书面报告，列出复现影响、受波及用户量及最小修复耗时（例如先在接口层加权限校验只需半天），请求延期半天或先禁用该查询入口。
            - title: 第 3 步：内部升级与合法底线
              body: 若产品经理坚持强行上线，小陈保留全部书面沟通记录，立即升级至信息安全官、法务或更高层管理者。如果整个机构仍决意隐瞒且公众健康隐私面临紧迫严重威胁，再依法向医疗与网信监管部门举报，同时严格保密漏洞利用脚本以免被攻击者抢先利用。
      - item:
          id: q-escalation-order
          type: order
          prompt: 上级要求你在产品发布前隐瞒一个会危及用户资金安全的已知高危漏洞。按专业伦理准则推荐的负责任处置顺序排列下列行动。
          steps:
            - 以书面形式向上级客观说明漏洞风险、潜在伤害及修复或延期方案
            - 若被拒绝，保留书面记录并按规定向更上级、安全或合规部门反映
            - 在内部渠道全部失效且公众面临严重伤害时，评估通过合法途径向监管机构报告
            - 全程严守边界，不向公众散布可供攻击者直接利用的机密漏洞细节
          explain: 负责任的专业回应遵循“先书面沟通提方案 → 再内部合规升级 → 必要时依法向监管报告 → 全程不鲁莽泄密给攻击者”的阶梯原则。
      - item:
          id: q-why-not-dump-public
          type: choice
          prompt: 当内部沟通受阻准备向外反映严重安全隐患时，为什么专业伦理强调“走合法监管渠道并避免公开泄露攻击细节”？
          options:
            - text: 公开未修补的机密利用细节会被恶意攻击者抢先利用，反而直接伤害本想保护的公众
              correct: true
            - text: 行业监管机构只受理已造成大规模用户资金损失的案件，无法在事发前协调限期修复
              why: 监管机构和国家应急响应中心配备专业技术团队，能够在公开前依法督促厂商限期修复隐患
            - text: 立即公开完整利用细节能让普通用户第一时间自行修改服务商后台代码来堵住漏洞
              why: 普通用户无法修改服务商后台服务器代码，未修复前公开攻击细节只会让用户暴露在更高风险中
          explain: 吹哨的根本目的是保护公众免受伤害，因此披露方式本身也必须避免制造新的、更大的现实伤害。
      - item:
          id: q-profession-compare
          type: choice
          prompt: 与医生、执业律师等传统成熟职业相比，计算机工程与软件开发目前在职业规范上最显著的差异是什么？
          options:
            - text: 多数岗位缺乏统一强制执业执照与吊销机制，更依赖行业伦理准则与内部治理
              correct: true
            - text: 软件系统极少触及人身健康与关键基础设施安全，因此无需设立类似伦理准则
              why: 软件已深度嵌入医疗、交通、金融与能源基础设施，直接关系公众安全与切身权益
            - text: 软件行业已有一部全球统一、由法院强制执行的伦理准则
              why: ACM、IEEE 的准则是行业自律文件，违反可能被学会除名，但它们不是法律，法院不直接执行
          explain: 正因为没有统一强制执业牌照作为外部闸门，每位工程师对 ACM/IEEE 伦理准则的内化与实践就显得尤为关键。

  - id: work-wealth-public-interest
    chapter: 责任与公共利益
    title: 自动化就业、全球化、数字鸿沟与赢家通吃
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 某县域政务部门为了提升办事效率，宣布下个月起关闭所有线下人工窗口，所有养老金认证和医保报销一律只能在智能手机最新款 App 里刷脸办理。这项“全数字化升级”忽视了哪一类现实公共利益问题？
          options:
            - text: 忽视了数字鸿沟——不熟悉智能设备或缺乏合适手机的老年人与偏远居民会被排除在公共服务外
              correct: true
            - text: 忽视了在线刷脸验证会略微增加后台服务器算力成本，导致政务预算上升
              why: 核心社会问题是部分群体缺乏设备、网络接入或数字操作能力，被迫丧失基本公共服务获取权
            - text: 没有任何问题，只要线上系统省下了办公纸张，公共服务就无需考虑线下群体
              why: 公共服务必须保障全体公民的平等可及性，不能以效率为名剥夺弱势群体的办事通道
          explain: 计算技术深刻重塑了工作方式、财富分配与社会公平。这一课从自动化与就业、职场变化、全球化、数字鸿沟和赢家通吃效应五个维度看技术与公共利益。
      - card:
          title: 自动化就业、职场变化与全球化
          body: |
            自动化与软件普及对就业产生双重影响：一方面替代重复性记账、流水线和基础客服岗位，带来结构性失业；另一方面催生运维、数据分析等新职业。但新旧岗位往往不在同一批人或同一城市出现，需要教育与再培训缓冲转型阵痛。

            在职场内，远程办公与灵活用工普及的同时，也出现按键监控、过严算法派单等争议。**全球化**使跨国研发与软件外包成为常态，降低了成本、加速了技术扩散，但也带来跨区劳动标准与供应链韧性的平衡难题。
      - card:
          title: 数字鸿沟与赢家通吃社会
          body: |
            **数字鸿沟（digital divide）**不仅指有没有设备与宽带（接入鸿沟），还包括能否有效检索、辨别信息并运用工具（素养鸿沟）。若医疗、教育与政务只剩线上入口，数字鸿沟就会放大城乡、代际与贫富差距。

            另一显著现象是**赢家通吃（winner-take-all）**：软件边际复制成本近乎为零，叠加网络效应（用的人越多越有价值），使少数头部平台吸走绝大部分份额与收益，财富高度集中，给中小创新与反垄断带来持久挑战。
      - item:
          id: q-society-concepts-match
          type: match
          prompt: 将下面四个计算技术社会影响概念与它们描述的典型现象配对。
          pairs:
            - ["数字鸿沟", "老年人或偏远地区因缺乏设备、网络或操作技能，难以享受线上教育与政务服务"]
            - ["赢家通吃效应", "零复制成本加网络效应，使少数头部平台占据绝大部分市场份额与利润"]
            - ["职场数字监控", "通过算法实时追踪员工敲键频率与位置轨迹，压缩劳动自主空间"]
            - ["全球化与技术外包", "跨国分散研发与服务降低成本，同时带来跨区就业竞争与供应链依赖"]
          explain: 看懂这些结构性现象，工程师才能在设计产品时主动兼顾适老化、无障碍、合理算法派单和开放生态。
      - card:
          title: 例题：为一座城市的“智慧出行与政务服务”做公共利益审查
          body: |
            某市推出一站式城市服务 App，准备全面取消公交现金投币和社区人工代办点，并对网约车司机推行“超时一分钟自动扣全单奖励”的算法考核。按公共利益视角逐项提出改进：
          reveal:
            - title: 第 1 步：弥合数字鸿沟，保留包容性通道
              body: 全面取消现金和线下窗口会把无智能手机的老人、儿童和外地旅客挡在门外。应坚持“线上提效 + 线下兜底”，保留现金/实体卡支付与社区适老化人工协助，同时提供大字版和语音无障碍界面。
            - title: 第 2 步：纠正过严算法管理对劳动者的伤害
              body: 极端刚性的超时扣款算法会迫使司机超速抢道，既损害劳动者权益又危及道路公共安全。算法派单应当预留合理交通拥堵缓冲、公开计费与申诉规则，并听取一线劳动者反馈。
            - title: 第 3 步：警惕平台锁定与数据垄断
              body: 若单一商业平台垄断全部出行入口和数据，容易演变成赢家通吃的封闭壁垒。公共基础设施接口应保持开放标准和跨平台互操作，防止公共服务被单一企业绑定。
      - item:
          id: q-digital-divide-two-layers
          type: choice
          prompt: 某公益项目给偏远乡村学校免费捐赠了一批电脑，但没有配套网络维护、中文入门课程和教师培训，一年后机房大多闲置积灰。这说明“数字鸿沟”包含哪两个缺一不可的层面？
          options:
            - text: 既包括设备与网络的“接入鸿沟”，也包括有效运用工具的“技能与素养鸿沟”
              correct: true
            - text: 只指硬件配置新旧的差距，只要把电脑定期升级为最新型号即可弥合鸿沟
              why: 仅提供新硬件无法替代持续的网络维护、适用内容和面向师生的数字技能培训
            - text: 只指城乡宽带网速的差距，只要接通光纤网络，教师和学生自然会用好设备
              why: 仅有网络连接而缺少适用课程、维护支持与数字素养培训，依然难以发挥技术普惠价值
          explain: 硬件发放只是第一步，持续的宽带接入、可负担费用、无障碍设计与数字素养教育共同决定技术成果能否真正普惠。
      - item:
          id: q-winner-take-all-cause
          type: choice
          prompt: 与开一家街头理发店相比，为什么软件与互联网平台行业更容易出现“赢家通吃”的高度集中格局？
          options:
            - text: 近乎为零的边际复制成本叠加网络效应，使头部平台迅速聚集绝大部分用户
              correct: true
            - text: 行业监管通常会给每个细分领域只发放一张经营牌照，从制度上限制竞争者进入
              why: 法律不仅没有强制垄断，反而通过反垄断法限制滥用市场支配地位；高度集中源于软件本身的经济与网络效应
            - text: 软件服务依赖高度稀缺的专用物理原料，导致市场在物理产能上只能容下极少数厂商
              why: 恰恰相反，软件边际复制成本极低，高度集中源于规模经济与网络效应而非物理原料稀缺
          explain: 极低的边际复制成本加上网络效应与数据规模优势，让排第一的平台往往能覆盖全球市场，形成典型的赢家通吃格局。
      - item:
          id: q-automation-jobs-view
          type: choice
          prompt: 关于“自动化和人工智能对就业的影响”，下面哪项描述最符合历史经验与公共政策共识？
          options:
            - text: 自动化既替代常规岗位也催生新职业，转型期存在技能错配，需配套再培训与保障
              correct: true
            - text: 自动化会在短期内全面消灭所有人类工作岗位，导致全社会进入永久零就业状态
              why: 历史上的自动化浪潮通常重构任务分工并创造新岗位，而非让所有人类劳动瞬间消失
            - text: 市场会自动消除转型期摩擦，被替代劳动者无需再培训就能无缝转入高技能新岗位
              why: 新旧岗位之间的技能门槛与地域分布往往存在显著错配，必须依靠再培训与过渡保障政策缓解冲击
          explain: 既不落入“全员永久失业”的恐慌，也不忽视转型期被替代劳动者的真实困境，通过教育、技能重塑与合理制度分担转型成本才是务实态度。

boss:
  items:
    - id: boss-privacy-ethics
      type: choice
      prompt: 一家免费天气 App 打算未经单独明示同意，就把用户持续的精确位置轨迹出售给广告商。从义务论和后果主义两个角度综合评估，哪项结论最为准确？
      options:
        - text: 应禁止出售原始轨迹：既把用户当作盈利工具违背诚实尊重义务，又带来难以逆转的行踪泄露伤害
          correct: true
        - text: 可以放心出售原始轨迹，因为免费提供天气预报的收益自动抵消了一切后续隐私泄露风险
          why: 位置轨迹暴露住址、作息与健康信息，其难以挽回的伤害远重于查天气的便利，且违背对人的尊重义务
        - text: 只要在安装时用两万字法律长文写进协议末尾，就算达成了充分知情且无可挑剔的伦理授权
          why: 把高风险数据转卖藏在冗长协议里无法形成真正知情自愿的选择，同样违背义务论与信任原则
        - text: 只需把用户姓名改成随机编号再卖掉每日早晚定位轨迹，就不存在任何再识别可能
          why: 每日早晚高频停留点直接对应家庭住址与工作地，删掉姓名依然能轻易完成再识别
      explain: 综合后果主义（难以挽回的隐私伤害重于微薄商业收益）、义务论（不能把用户当工具）和美德伦理（背离诚实可信），均不应出售原始位置轨迹。
    - id: boss-reid-kanon
      type: number
      unit: '%'
      prompt: 某医院公开发布去标识化病历表，并对准标识符（邮编前缀、年龄段、性别）做了泛化处理，使得全表满足 4-匿名（最小等价组包含 4 条记录）。若外部人员只知道某市民在表中的一个 4 人等价组里，仅凭准标识符直接锁定其对应行的概率上限是多少（填百分数数值）？
      answer: 25
      explain: 在 4-匿名等价组中，4 条记录的准标识符完全一致，单凭准标识符猜中目标记录的概率上限为 $1 / 4 = 25\%$。
    - id: boss-ip-match
      type: match
      prompt: 将四类知识产权工具与对应的软件或商业资产保护特征配对。
      pairs:
        - ["版权", "作品完成自动生效，保护代码与文档的具体表达但不保护抽象思想"]
        - ["专利", "经申请审查并公开技术方案，在有限期内排他保护新颖实用发明"]
        - ["商业秘密", "靠保密措施维持价值的内部算法或配方，一旦公开泄露或被独立还原即失效"]
        - ["商标", "区分商品或服务来源的名称与徽标，持续使用并续展可长期维持"]
      explain: 准确区分四类产权工具的保护客体、取得方式和失效边界，是技术创业与合规审查的基本功。
    - id: boss-oss-license
      type: choice
      prompt: 一家公司开发闭源付费网页云服务（不向用户分发客户端安装包），如果直接修改并集成了某个开源核心引擎，以下哪种许可证会在“仅通过网络提供服务”时也触发必须开放修改后源码的义务？
      options:
        - text: MIT 许可
          why: MIT 属于宽松许可，保留版权声明和许可文本即可闭源商用
        - text: AGPL 许可
          correct: true
        - text: GPL v3 许可
          why: 传统 GPL 仅在对外分发软件副本时触发开源义务，只在自有服务器运行并提供网页服务通常不触发
        - text: Apache 2.0 许可
          why: Apache 2.0 属于宽松许可（含明确专利授权），不强制闭源商业服务公开自身源码
      explain: 传统 GPL 仅在对外分发副本时触发开源义务，而 AGPL 明确规定通过网络向用户提供交互服务同样触发源码公开义务。
    - id: boss-bias-sources
      type: choice
      multi: true
      prompt: 某公司用历史招聘记录训练简历筛选模型后，发现模型给女性求职者的评分系统性偏低。下列哪些属于该偏见的常见成因或正确整改措施？
      options:
        - text: 历史招聘决策本身带有倾向，且女子学院、职业空窗期等中性字段充当了性别的代理特征
          correct: true
        - text: 按群体审计选中率与误判率，清理代理特征、补充样本，并保留人工复核与申诉渠道
          correct: true
        - text: 如果多轮修正后仍无法消除系统性偏见，应当停用该自动化筛选模型
          correct: true
        - text: 只需删除数据表中的“性别”一列就足以保证模型不再产生任何性别相关的评分差异
          why: 单纯删除敏感字段无法阻断代理特征间接重建群体信息，仍需做分群体审计与治理
      explain: 简历筛选偏见往往来自历史标签、样本不足与代理特征的叠加；有效治理必须靠分群体审计、去代理、人工复核及必要时的停用底线。
    - id: boss-fairness-conflict
      type: choice
      prompt: 在信用评分场景中，A、B 两个群体的真实按期还款基础率分别是 60% 和 30%，且模型存在非零预测误差。关于独立性、分离度与充分性三种统计公平判据，下列哪项判断正确？
      options:
        - text: 只要换成更复杂的深度学习架构，就能在基础率不同且有误差时同时严格满足全部三种判据
          why: 这一冲突是条件概率恒等式决定的数学限制，并非模型容量不够导致
        - text: 三种判据在数学上无法同时满足，必须结合业务场景与伦理价值明确取舍并公开权衡
          correct: true
        - text: 只要两个群体的申请总人数完全相等，三种统计公平判据就自然可以同时满足
          why: 引发冲突的是基础率（真实正例占比）不同，而不是申请总人数不同
        - text: 既然数学上不能同时满足全部判据，就不必对算法做任何分群体审计或纠偏
          why: 判据冲突恰恰说明不能盲目部署，更需要透明审计错误分布并由承担责任的人作出明确价值选择
      explain: 当群体基础率不等且分类器并非零误差时，充分性与分离度、充分性与独立性之间存在必然数学冲突，需要结合场景做公开的价值取舍。
    - id: boss-co2eq-calc
      type: number
      unit: 'kg'
      prompt: 某次计算设施运维共产生 $50\text{ kg}$ 二氧化碳（$\text{GWP} = 1$）、$2\text{ kg}$ 甲烷（$\text{GWP} = 28$）与 $1\text{ kg}$ 氧化亚氮（$\text{GWP} = 265$）。折算为统一单位后的总二氧化碳当量（$\text{CO}_2\text{eq}$）是多少千克？
      answer: 371
      explain: 总量为 $50 \times 1 + 2 \times 28 + 1 \times 265 = 50 + 56 + 265 = 371\text{ kg CO}_2\text{eq}$。
    - id: boss-carbon-aware
      type: choice
      prompt: 某区域电网在午间光伏发电过剩并发生弃电，而在晚间 20:00 用电高峰需调动天然气机组补足缺口。若把一项 40 kWh 的可延迟批处理任务从晚间高峰改到午间弃电时段运行，这属于什么策略且为何有效？
      options:
        - text: 空间转移，通过把批处理任务迁移到另一座水电城市的机房来避开本地用电高峰
          why: 该任务仍留在同一区域电网运行、改变的是执行时间窗口而非机房地点，因此属于时间转移而非空间转移
        - text: 需求塑形，通过在碳强度偏高时段主动降低实时服务画质或关闭特效来减少耗电
          why: 推迟离线批处理的执行窗口属于时间转移，而不是针对实时交互应用的功能降级塑形
        - text: 时间转移，使新增用电吸收原本会被浪费的弃电，大幅压低实际边际碳强度
          correct: true
        - text: 平均碳强度分摊，因为同一电网全天耗电量不变，移动时段只能降低账面均值
          why: 在弃电时段执行能直接吸收过剩清洁电力并避免晚间天然气边际机组增发，带来的是真实的物理减排
      explain: 将对时间不敏感的离线批处理移至电网清洁或弃电时段执行是典型的时间转移，能有效利用低碳或近零边际碳强度的电力。
    - id: boss-therac25-liability
      type: choice
      prompt: 复盘 Therac-25 放疗机过量辐射事故并结合厂商责任原则，以下哪项总结最准确？
      options:
        - text: 安全关键系统不能用软件单点取代独立硬件互锁，致伤缺陷也不能靠免责声明一笔勾销
          correct: true
        - text: 只要操作员在出事前规范慢速输入，软件里的竞态条件和 8 位计数器回绕就无需修复
          why: 将生命安全寄托于操作员绝不快速输入违背了基本的容错与安全工程原则
        - text: 计算机软件在任何场景下都不涉及产品责任，无论医疗器械造成多大伤害厂商都只需退款
          why: 嵌入医疗器械并导致人身伤害的缺陷通常适用严格产品责任，免责条款无法豁免人身安全责任
        - text: 只要为放疗机软件补全单元测试覆盖率，就不再需要额外保留独立的物理或硬件互锁
          why: 测试难以穷尽所有并发与硬件故障边界，安全关键设备必须保留独立于软件的硬件互锁防线
      explain: Therac-25 同时印证了工程防线（保留硬件互锁、消除并发与计数器回绕缺陷）和责任底线（生命安全不能靠免责声明推卸）。
    - id: boss-whistleblow-order
      type: order
      prompt: 上级在产品发布前要求你隐瞒一个会让大批用户账户被盗的严重安全缺陷。按照 ACM 职业道德准则与负责任的升级流程，将下列做法按正确先后顺序排列。
      steps:
        - 书面向上级清晰说明该缺陷的安全风险、潜在伤害，并提出修复或延期发布方案
        - 若遭到拒绝，保留书面证据并按公司规定向更上级、安全或合规部门反映
        - 当内部渠道全部失效且公众仍面临严重紧迫伤害时，依法向相关监管机构报告
        - 全过程保持客观记录，不向外部公开泄露可供攻击者直接利用的机密细节
      explain: 面对隐瞒安全缺陷的压力，工程师应以公众利益为先，依次完成书面风险沟通、内部合规升级和必要的依法监管报告，同时防止泄密导致二次伤害。
