skill: E.3.3
version: 2
authors: [main-agent]
brief:
  why: 发电厂发出的电要经过升压变压器、几百公里的输电线路和层层降压，才送到工厂和家里，而且每一刻发电都要等于用电。这一关学怎样用标幺值和等值电路描述整个电网，怎样算出各条线路上的功率和各个母线的电压（潮流计算），短路时电流有多大，受到扰动后发电机会不会失去同步，频率和电压靠什么维持，发电任务怎样分配最省钱，以及风电、光伏大量并网带来的新问题。假设你学过电路基础、线性代数和电机（相量、功角特性、摇摆方程、变压器等效电路）。
  outcomes:
    - 说出电力系统的组成、电压等级和中性点接地方式，用统一基准把电网换成标幺值等值电路
    - 由导线尺寸估算线路的电抗和电纳，选用短线路、π 型或长线路模型，解释空载长线末端电压升高
    - 由功角和电压算线路传输的有功、无功和电压降落，形成节点导纳矩阵，说明牛顿–拉夫逊潮流计算的步骤和节点类型
    - 算三相短路电流和短路容量，用对称分量法算单相接地、两相短路和两相接地短路电流
    - 由功角特性判断静态稳定，用等面积定则求临界切除角，估算小干扰下的振荡频率
    - 用调差系数和负荷频率特性算一次调频后的频率偏差，说出调压手段并选择变压器分接头
    - 用等微增率准则做经济调度，说明变流器并网电源对系统惯量和频率的影响
terms:
  - term: 电力系统
    def: '由发电、输电、配电和用电设备连成的整体，任一时刻发出的功率都要等于用掉的功率加损耗'
  - term: 中性点
    def: '三相星形接法的变压器或发电机三相绕组的公共连接点；它怎样接地决定了单相接地故障时的电流和电压'
  - term: 无穷大母线
    def: '容量大到电压幅值和频率不受所接发电机影响的电网母线，分析单台发电机时用它代表整个电网'
  - term: 视在功率
    def: '电压有效值和电流有效值的乘积，三相为 √3·V_LL·I，单位 V·A；设备容量按它标'
  - term: 标幺值
    def: '一个量的实际值除以选定的基准值得到的无单位数，写作 pu'
  - term: 基准值
    def: '计算标幺值时用作单位的那个值；电力系统一般选定基准容量和各电压等级的基准电压，其余由它们算出'
  - term: 母线
    def: '发电厂和变电站里汇集和分配电能的导体，进出线和变压器都接在它上面；电网计算里一条母线是一个节点'
  - term: 电晕
    def: '导线表面电场强到使周围空气电离的放电现象，发出嘶嘶声和微光，消耗有功、干扰无线电'
  - term: 分裂导线
    def: '每一相用几根相隔几十厘米的子导线组成的导线，等效半径大，电抗小、电晕少'
  - term: 波阻抗
    def: '长线路（电阻、电感、电容沿线分布）的特性阻抗 Z_c = √(z/y)，无损线路为 √(L/C)，单回架空线约 380 Ω'
  - term: 自然功率
    def: '线路末端接上等于波阻抗的负荷时传输的功率 V²/Z_c，此时线路电感吸收的无功等于电容发出的无功'
  - term: 复功率
    def: '电压相量乘电流相量的共轭 S = VI*，实部是有功功率，虚部是无功功率'
  - term: 稀疏矩阵
    def: '绝大部分位置都是 0 的矩阵，只存储和计算不为 0 的数，几万阶也能很快求解'
  - term: 关联矩阵
    def: '表示网络里哪条支路连在哪两个节点之间的矩阵，里面的数为 +1、−1 或 0'
  - term: 节点导纳矩阵
    def: '把节点注入电流和节点电压联系起来的矩阵 I = YV；对角元是接在该节点的导纳之和，非对角元是两节点间支路导纳的负值'
  - term: 潮流计算
    def: '已知负荷和发电机的功率、电压，求出各母线电压和各支路功率的计算，要解一组非线性方程'
  - term: PQ 节点
    def: '有功功率和无功功率已知、电压幅值和相角待求的节点，一般是负荷母线'
  - term: PV 节点
    def: '有功功率和电压幅值已知、无功功率和相角待求的节点，一般是带调压能力的发电机母线'
  - term: 平衡节点
    def: '电压幅值和相角都给定的节点，它的功率最后算出，承担全网的功率平衡和网损'
  - term: 牛顿法
    def: '也叫牛顿–拉夫逊法：用函数在当前点的切线（多变量时用雅可比矩阵）把非线性方程线性化、反复修正的迭代解法'
  - term: 偏导数
    def: '多元函数只让其中一个变量变化、其余变量不变时求出的导数'
  - term: 雅可比矩阵
    def: '一组函数对一组变量的全部偏导数排成的矩阵，牛顿法每一步用它解修正量'
  - term: 直流潮流
    def: '假设电压幅值都为 1、忽略电阻和无功、sin θ ≈ θ，把有功潮流化成线性方程 P = Bθ 的近似算法'
  - term: 短路容量
    def: '故障点额定电压和三相短路电流的乘积再乘 √3，标幺制下等于短路电流乘基准容量，表示该点电网的强弱'
  - term: 次暂态电抗
    def: '同步发电机突然短路后最初几个周期的等值电抗 X_d″，比暂态电抗和同步电抗都小'
  - term: 冲击电流
    def: '短路后约半个周期出现的最大瞬时电流，等于 √2 乘冲击系数（常取 1.8）乘次暂态电流有效值'
  - term: 正序
    def: '三相大小相等、按 a、b、c 依次滞后 120° 的一组对称分量，和正常运行时的相序相同'
  - term: 负序
    def: '三相大小相等、按 a、c、b 依次滞后 120° 的一组对称分量，相序和正常运行相反'
  - term: 零序
    def: '三相大小相等、相位相同的一组对称分量，只能经大地或中性线返回'
  - term: 对称分量法
    def: '把不对称的三相量拆成正序、负序、零序三组对称分量分别计算、再叠加的方法'
  - term: 正序等效定则
    def: '各种短路的正序电流都等于正序网络在故障点串入一个附加阻抗后的短路电流，故障电流再乘一个系数'
  - term: 静态稳定
    def: '电力系统受到小扰动后能自动回到原来运行状态的能力，单机对无穷大系统要求功角小于 90°'
  - term: 暂态稳定
    def: '电力系统受到短路、切除线路等大扰动后，各发电机能否保持同步运行的能力'
  - term: 惯性时间常数
    def: '转子在同步转速下的动能除以额定容量 H，单位秒，表示转子动能足够发电机满功率发多少秒'
  - term: 整步功率系数
    def: '电功率对功角的导数 dP/dδ = P_max·cos δ，大于 0 时运行点静态稳定'
  - term: 等面积定则
    def: '大扰动后功角特性图上加速面积等于减速面积时转子回摆；可用减速面积不小于加速面积就暂态稳定'
  - term: 临界切除角
    def: '按等面积定则，故障切除时允许的最大功角，超过它系统就会失去同步'
  - term: 一次调频
    def: '发电机调速器按频率偏差自动调整出力的过程，几秒到几十秒完成，调整后仍有频率偏差'
  - term: 调差系数
    def: '频率变化的相对值和机组出力变化的相对值之比 R，5% 表示频率降 5% 时出力增加 100%'
  - term: 二次调频
    def: '电网控制中心的自动发电控制改变机组出力设定值，把频率和联络线功率恢复到计划值的过程'
  - term: 微增率
    def: '机组多发 1 MW 每小时多花的燃料费用 dC/dP，单位元/MWh'
  - term: 等微增率准则
    def: '各机组微增率相等时总燃料费用最小，这个共同的值就是系统边际成本'
  - term: 构网型变流器
    def: '像同步发电机那样自己建立电压幅值和频率、能提供惯量和电压支撑的并网变流器'
  - term: 低电压穿越
    def: '电网电压跌落时新能源电站在规定时间内不脱网，并送出无功电流支撑电压的能力'
  - term: 变流器
    def: '用电力电子开关在交流和直流、或不同频率的交流之间变换电能的装置，把直流变成交流的叫逆变器'
lessons:
  # ==== 电力系统组成与标幺值 ====
  - id: system-overview
    chapter: 电力系统组成与标幺值
    title: 电网是怎样连起来的
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 远距离输电为什么要把电压升到几百千伏？
          options:
            - text: 电流小，线路损耗小
              correct: true
            - text: 电压高，电在导线里跑得快
              why: 电能沿线路传播的速度接近光速，和电压高低无关
            - text: 高压电对人更安全
              why: 电压越高越危险，高压线路要架得很高、离人很远
          explain: 功率一定时电流和电压成反比，线路损耗和电流的平方成正比，所以电压升高一倍，损耗降为四分之一。
      - card:
          title: 电力系统的组成
          body: |
            火电、水电、核电、风电和光伏电站发出的电，经升压变压器送上高压输电网，在变电站逐级降压，再经配电网送到用户。发电、输电、配电和用电设备连成的整体叫**电力系统（power system）**。

            电能很难大规模储存，所以任一时刻发电机发出的功率都必须等于用户用掉的功率加上线路和变压器的损耗。这条实时平衡是电力系统运行的第一原则，频率控制和发电任务的分配都是围绕它展开的。
      - item:
          id: loss-vs-voltage
          type: number
          prompt: 一条三相线路每相电阻 10 Ω，输送 100 MW、功率因数为 1。用 220 kV 线电压输送时，线路的有功损耗约是多少兆瓦？（保留两位小数）
          answer: 2.07
          tolerance: 0.005
          unit: MW
          hint: 先求线电流 $I = P/(\sqrt3V)$，三相损耗是多少？
          explain: $I = 100 \times 10^6/(\sqrt3 \times 220 \times 10^3) \approx 262.4$ A，$3I^2R \approx 2.07$ MW。同样的线路用 110 kV 输送，电流加倍，损耗约 8.26 MW。
      - card:
          title: 电压等级
          body: |
            我国常用的电压等级：用户低压 380/220 V；配电 10 kV（部分地区 20 kV），工厂内部还有 6 kV；35、66、110 kV 用于城市和地区供电；220、330、500、750 kV 组成输电主网；1000 kV 交流和 ±800、±1100 kV 直流是特高压，用于几千公里的大容量输电。

            电压越高，同样功率的电流越小、损耗越小，但绝缘、杆塔和设备越贵，所以输送的功率越大、距离越远，选的电压等级越高。
      - item:
          id: loss-ratio
          type: choice
          prompt: 同一条线路输送同样的功率（功率因数不变），电压从 110 kV 升到 220 kV，线路损耗变为原来的多少？
          options:
            - text: 四分之一
              correct: true
            - text: 一半
              why: 电流减半，而损耗和电流的平方成正比
            - text: 不变，损耗只和线路电阻有关
              why: 电阻不变，但电流变了，损耗 $3I^2R$ 跟着变
            - text: 两倍，电压高了损耗大
              why: 电压高时电流小，线路电阻上的损耗反而小
          explain: $I \propto 1/V$，$P_{loss} \propto I^2 \propto 1/V^2$，电压翻倍，损耗降到 $1/4$。
      - card:
          title: 中性点接地方式
          body: |
            三相变压器或发电机接成星形时，三相绕组的公共点叫**中性点（neutral point）**。它怎样接地，决定了一相导线碰地时会怎样。

            相和相之间、或相和地之间出现一条不经过负荷的低阻通路，叫短路。110 kV 及以上和 380/220 V 系统中性点直接接地：一相接地就是短路，电流很大，必须立刻跳闸。
      - card:
          title: 不接地和经消弧线圈接地
          body: |
            6–66 kV 系统中性点常不接地，或经消弧线圈（一个可调的电感，用来抵消接地时线路电容的电流，让电弧容易熄灭）接地。一相接地时接地电流很小，三个线电压仍然对称，可以带着故障运行 1–2 小时，继续供电；代价是另外两相对地电压升到线电压，绝缘要按线电压设计。高压系统绝缘太贵，所以用直接接地。
      - item:
          id: ungrounded-voltage
          type: number
          prompt: 一个 10 kV（线电压）中性点不接地系统，A 相导线碰地。B 相导线对地的电压约是多少千伏？
          answer: 10
          unit: kV
          hint: A 相接地后，地的电位变成了 A 相导线的电位。B 相对地电压就是 B 相和 A 相之间的什么电压？
          explain: 地电位等于 A 相电位，B 相对地电压就是线电压 $V_{BA}$，10 kV，是正常时相电压 5.77 kV 的 $\sqrt3$ 倍。
      - card:
          title: 主接线
          body: |
            发电厂和变电站里，发电机、变压器和出线经断路器和隔离开关接到**母线（busbar）**上。母线是汇集和分配电能的导体，图上画成一条粗线；这些设备的连接方式叫电气主接线。常见的有单母线、双母线（可以把线路倒换到另一条母线上检修）和 500 kV 变电站常用的一个半断路器接线（每两条回路用三台断路器）。接线越复杂越可靠，造价也越高。

            断路器能在带负荷甚至短路时切断电流；隔离开关没有灭弧能力，只用来在断开以后形成明显的断开点，绝不能带负荷拉开。
      - item:
          id: disconnector
          type: choice
          prompt: 要检修一条正在送电的线路，正确的操作顺序是什么？
          options:
            - text: 先断断路器，再拉隔离开关
              correct: true
            - text: 先拉开隔离开关，再断开断路器
              why: 隔离开关没有灭弧能力，带负荷拉开会产生电弧，造成短路和人员伤害
            - text: 只拉开隔离开关就行，不用动断路器
              why: 隔离开关不能切断负荷电流
            - text: 只断开断路器就行，不用拉隔离开关
              why: 断路器断开后触头在灭弧室里看不见，还要拉开隔离开关形成明显的断开点才能检修
          explain: 断路器负责切断电流，隔离开关负责在无电流时形成看得见的断开点。送电时顺序相反：先合隔离开关，再合断路器。

  - id: per-unit
    chapter: 电力系统组成与标幺值
    title: 标幺值
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一台变压器高压侧 110 kV、低压侧 10.5 kV。它的漏抗折算到高压侧是 12.7 Ω，折算到低压侧是多少？
          options:
            - text: 小得多，约 0.116 Ω
              correct: true
            - text: 一样，都是 12.7 Ω
              why: 阻抗折算要乘匝数比的平方，两侧的欧姆值不同
            - text: 大得多，约 1390 Ω，电压低阻抗就大
              why: 低压侧电压低，同样的漏抗折算过去欧姆值变小，不是变大
          explain: $12.7 \times (10.5/110)^2 \approx 0.116$ Ω。同一个阻抗在两侧欧姆数相差约 110 倍，每次计算都要折算很麻烦，标幺值就是为了省掉这一步。
      - card:
          title: 三相功率
          body: |
            三相平衡系统的总功率是每相的 3 倍。用线电压 $V$ 和线电流 $I$ 表示：

            $$S = \sqrt3VI,\qquad P = \sqrt3VI\cos\varphi,\qquad Q = \sqrt3VI\sin\varphi$$

            $S$ 叫**视在功率（apparent power）**，单位 V·A，变压器、发电机的容量按它标（如 120 MVA）；$P$ 是有功功率，$Q$ 是无功功率。
      - item:
          id: rated-current
          type: number
          prompt: 一台 120 MVA、110 kV（线电压）的三相变压器，高压侧额定电流约是多少安？（保留到个位）
          answer: 630
          tolerance: 0.5
          unit: A
          hint: 视在功率和线电压、线电流是什么关系？
          explain: $I = 120 \times 10^6/(\sqrt3 \times 110 \times 10^3) \approx 630$ A。
      - card:
          title: 统一基准
          body: |
            一个量的实际值除以选定的**基准值（base value）**，得到的无单位数叫**标幺值（per-unit value）**，写作 pu。电力系统计算时，全网选一个基准容量 $S_B$（常取 100 MVA），每个电压等级选一个基准电压 $V_B$（线电压，一般取该级的额定电压）；其余基准由它们算出：

            $$Z_B = \frac{V_B^2}{S_B},\qquad I_B = \frac{S_B}{\sqrt3V_B}$$

            $V_B$ 用 kV、$S_B$ 用 MVA 时，$Z_B$ 直接是欧姆。
      - item:
          id: line-per-unit
          type: number
          prompt: 一条 110 kV 线路每公里电抗 0.4 Ω、长 50 km。取 $S_B = 100$ MVA、$V_B = 110$ kV，线路电抗的标幺值约是多少？（保留三位小数）
          answer: 0.165
          tolerance: 0.0005
          hint: 先求线路电抗的欧姆值和基准阻抗。
          explain: $X = 0.4 \times 50 = 20$ Ω，$Z_B = 110^2/100 = 121$ Ω，$X_{pu} = 20/121 \approx 0.165$。
      - item:
          id: base-current
          type: number
          prompt: 取 $S_B = 100$ MVA，110 kV 电压等级的基准电流约是多少安？（保留到个位）
          answer: 525
          tolerance: 0.5
          unit: A
          hint: 基准电流由基准容量和基准电压按三相功率的关系算出。
          explain: $I_B = 100 \times 10^6/(\sqrt3 \times 110 \times 10^3) \approx 525$ A。一个 10 pu 的短路电流就是约 5.25 kA。
      - card:
          title: 为什么用标幺值
          body: |
            变压器两侧的基准电压按变比选（110 kV 和 10.5 kV），两侧的基准阻抗之比恰好是变比的平方，于是同一个阻抗在两侧的标幺值相同，等值电路里的理想变压器可以去掉，整个电网连成一张电路图。

            另外，同类设备的标幺值集中在一个小范围里（变压器漏抗约 0.05–0.15 pu），算出的结果一眼就能看出是否合理；三相公式里的 $\sqrt3$ 也消失了，$S = VI$ 直接成立。变压器铭牌上的短路电压百分数 $u_k\%$，就是以它自己额定值为基准的漏抗标幺值（忽略电阻）。
      - item:
          id: two-sides-pu
          type: number
          prompt: 一台 110/10.5 kV 变压器的漏抗折算到高压侧是 12.7 Ω，折算到低压侧约 0.1157 Ω。取 $S_B = 100$ MVA，两侧基准电压分别取 110 kV 和 10.5 kV。按低压侧算，漏抗的标幺值约是多少？（保留三位小数）
          answer: 0.105
          tolerance: 0.0005
          hint: 低压侧的基准阻抗是多少？
          explain: 低压侧 $Z_B = 10.5^2/100 = 1.1025$ Ω，$0.1157/1.1025 \approx 0.105$；高压侧 $12.7/121 \approx 0.105$，两侧相同，因为两侧基准阻抗之比 $(110/10.5)^2$ 正好等于阻抗的折算比。
      - card:
          title: 例题：换到系统基准
          body: 一台发电机额定 50 MVA、10.5 kV，铭牌电抗 0.2 pu（以自己的额定值为基准）。系统基准取 100 MVA、10.5 kV，它的电抗是多少 pu？
          reveal:
            - title: 第 1 步：换回欧姆值
              body: 自己的基准阻抗 $10.5^2/50 = 2.205$ Ω，电抗 $0.2 \times 2.205 = 0.441$ Ω。
            - title: 第 2 步：除以系统的基准阻抗
              body: 系统基准阻抗 $10.5^2/100 = 1.1025$ Ω，$0.441/1.1025 = 0.4$ pu。
            - title: 第 3 步：记成一个公式
              body: $Z_{new} = Z_{old}\cdot\frac{S_{B,new}}{S_{B,old}}\cdot\left(\frac{V_{B,old}}{V_{B,new}}\right)^2$。电压基准不变时，标幺电抗和基准容量成正比。
      - item:
          id: change-base
          type: number
          prompt: 一台 120 MVA 变压器的短路电压百分数 $u_k\% = 10.5$。系统基准取 100 MVA，电压基准等于变压器额定电压。它的漏抗是多少 pu？（保留四位小数）
          answer: 0.0875
          tolerance: 0.00005
          hint: $u_k\%$ 对应的是哪个基准下的标幺值？换到 100 MVA 要乘什么？
          explain: 自己基准下 $X = 0.105$ pu，换到 100 MVA：$0.105 \times 100/120 = 0.0875$ pu。

  # ==== 输电线路参数与模型 ====
  - id: line-parameters
    chapter: 输电线路参数与模型
    title: 线路参数
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一条三相架空线路，三相导线之间的距离都加大一倍，每相每公里的电感大约会怎样？
          options:
            - text: 略有增大
              correct: true
            - text: 增大一倍
              why: 电感和距离的对数成正比，距离加倍只给对数加上一个 ln 2
            - text: 减小一半
              why: 两根导线离得越远，它们之间包围的磁通越多，电感变大而不是变小
          explain: 电感和导线距离与半径之比的自然对数成正比，距离从 5 m 加到 10 m，电感只增大约 11%。所以各种架空线路的电抗都在 0.4 Ω/km 附近。
      - card:
          title: 线路的四个基本量
          body: |
            输电线路每公里有四个基本量：电阻 $r$（导线发热）、电感 $L$（导线周围的磁场）、导线之间和导线对地的电容 $C$（导线之间的电场），以及电导 $g$（绝缘子漏电和电晕，一般很小，常忽略）。导线表面电场强到使周围空气电离、发出嘶嘶声和蓝紫色微光时，叫**电晕（corona）**，它消耗有功、干扰无线电。

            按 50 Hz 换成电抗和电纳：单根导线的 110–220 kV 架空线路，电抗 $x \approx 0.4$ Ω/km，电纳 $b \approx 2.8 \times 10^{-6}$ S/km。电阻由导线截面决定，常用的钢芯铝绞线每公里零点零几到零点几欧。
      - item:
          id: negligible-parameter
          type: choice
          prompt: 计算架空输电线路时，下面四个量里哪一个通常可以忽略？
          options:
            - text: 电导
              correct: true
            - text: 电阻
              why: 电阻决定线路的有功损耗，中低压线路里它对电压降落的影响也很大，不能忽略
            - text: 电感
              why: 高压线路的电抗比电阻大得多，决定了线路能送多少有功和电压降落
            - text: 电容
              why: 线路越长、电压越高，电容的充电功率越大，长线路不能忽略
          explain: 天气好时绝缘子漏电和电晕损耗很小，电导一般忽略；电阻、电感、电容要按线路的长短和电压决定怎样保留。
      - card:
          title: 电感和电容的公式
          body: |
            三相导线等距离排列（或经过换位）时，每相每米的电感和电容是

            $$L = 2 \times 10^{-7}\ln\frac{D_m}{r'}\ \text{H/m},\qquad C = \frac{2\pi\varepsilon_0}{\ln(D_m/r)}\ \text{F/m}$$

            $D_m$ 是三相导线间距离的几何平均值 $\sqrt[3]{D_{ab}D_{bc}D_{ca}}$，$r$ 是导线半径，$r' = 0.7788r$（实心圆导线内部也有磁场，等效半径略小）。距离和半径都在对数里，所以电抗、电纳对线路尺寸很不敏感。
      - card:
          title: 例题：由尺寸算电抗和电纳
          body: 导线半径 10 mm，三相几何平均距离 5 m，频率 50 Hz。求每公里的电抗和电纳。
          reveal:
            - title: 第 1 步：算电感
              body: $r' = 0.7788 \times 0.01 = 7.788$ mm，$\ln(5/0.007788) \approx 6.465$，$L = 2 \times 10^{-7} \times 6.465 \approx 1.293$ μH/m，即 1.293 mH/km。
            - title: 第 2 步：算电抗
              body: $x = 2\pi \times 50 \times 1.293 \times 10^{-3} \approx 0.406$ Ω/km。
            - title: 第 3 步：算电容和电纳
              body: $\ln(5/0.01) \approx 6.215$，$C = 2\pi \times 8.854 \times 10^{-12}/6.215 \approx 8.95$ nF/km，$b = \omega C \approx 2.81 \times 10^{-6}$ S/km。和前面给的典型值一致。
      - item:
          id: line-reactance
          type: number
          prompt: 一条架空线路导线半径 12 mm，三相几何平均距离 8 m，50 Hz。每相每公里的电抗约是多少欧？（保留三位小数）
          answer: 0.424
          tolerance: 0.0005
          unit: Ω/km
          hint: 先求等效半径 $r' = 0.7788r$，再求每米电感，最后乘 $\omega$。
          explain: $r' \approx 9.35$ mm，$\ln(8/0.00935) \approx 6.752$，$L \approx 1.350$ mH/km，$x = 314.16 \times 1.350 \times 10^{-3} \approx 0.424$ Ω/km。
      - card:
          title: 充电功率、分裂导线和换位
          body: |
            线路电容在电压下产生的无功功率叫充电功率，三相合计 $Q_c = V^2bl$（$V$ 是线电压）。电压越高、线路越长，充电功率越大，空载时会把电压抬高。

            220 kV 以上常把每相分成 2–8 根相隔几十厘米的子导线，叫**分裂导线（bundled conductor）**：等效半径大大增加，电感减小（电抗约 0.3 Ω/km），电容增大，导线表面的电场减弱，电晕放电和损耗都小了。三相导线在线路上分段轮换位置叫换位，让三相的平均电感和电容相同。
      - item:
          id: charging-power
          type: number
          prompt: 一条 500 kV 线路长 300 km，每公里电纳按 $2.8 \times 10^{-6}$ S 算。三相充电功率约是多少兆乏（Mvar）？
          answer: 210
          unit: Mvar
          hint: 线路的总电纳是多少？一条导纳上的无功和电压是什么关系？
          explain: $Q_c = (500 \times 10^3)^2 \times 2.8 \times 10^{-6} \times 300 = 2.1 \times 10^8$ var，210 Mvar。实际 500 kV 线路用分裂导线、电纳更大，充电功率还要大，所以要在线路两端装并联电抗器吸收。
      - item:
          id: bundle-purpose
          type: choice
          prompt: 500 kV 线路每相用 4 根子导线组成分裂导线，而不用一根同样截面的粗导线。主要好处是什么？
          options:
            - text: 等效半径大，电抗小、电晕少
              correct: true
            - text: 电阻更小，同样电流下发热少
              why: 总截面相同时电阻差不多；分裂导线主要改变的是等效半径
            - text: 导线更轻，杆塔可以省不少钢材
              why: 总截面相同，重量也差不多
            - text: 电容更小，充电功率小
              why: 分裂导线的等效半径大，电容反而增大
          explain: 等效半径变大，$\ln(D_m/r')$ 变小，电抗下降；导线表面的电场强度降低，电晕放电和无线电干扰减少。

  - id: line-models
    chapter: 输电线路参数与模型
    title: 线路的等值电路
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一条 500 kV、400 km 的线路，末端断路器断开（空载），首端加额定电压。末端电压比首端高还是低？
          options:
            - text: 高
              correct: true
            - text: 低，电流流过线路总有压降
              why: 空载时线路上流的是电容的充电电流，它流过线路电感产生的压降和电压同方向相加
            - text: 相等，空载时线路上没有电流
              why: 空载时仍有线路电容的充电电流
          explain: 空载长线的末端电压会比首端高，400 km 时约高 10%。这一课讲线路的等值电路，并用它解释这个现象。
      - card:
          title: 短线路和 π 型等值电路
          body: |
            线路的电阻、电感和电容沿全长均匀分布。较短的线路可以把它们集中起来：一百公里以内的架空线（以及 35 kV 及以下的线路）电容电流很小，只用串联阻抗 $Z = (r + jx)l$。一百到三百公里的线路要考虑电容，把总导纳 $Y = jbl$ 分成两半，接在线路两端，中间是串联阻抗 $Z$，像字母 π，叫 π 型等值电路。三百公里以上要按沿线分布来算。各教材的分界略有不同。
      - item:
          id: pi-admittance
          type: number
          prompt: 一条 200 km 的线路每公里电纳 $2.8 \times 10^{-6}$ S，用 π 型等值电路。每一端并联的电纳是多少微西门子（μS）？
          answer: 280
          unit: μS
          hint: 总电纳是多少？π 型电路怎样分配它？
          explain: 总电纳 $2.8 \times 10^{-6} \times 200 = 560$ μS，两端各一半，280 μS。
      - card:
          title: 电报方程
          body: |
            取线路上一小段 $dx$，它有串联阻抗 $z\,dx$ 和并联导纳 $y\,dx$（$z$、$y$ 是每公里的值）。电压沿线的变化等于电流在 $z$ 上的压降，电流沿线的变化等于流进 $y$ 的电流：

            $$\frac{dV}{dx} = zI,\qquad \frac{dI}{dx} = yV$$

            这叫电报方程。两式合起来得 $\frac{d^2V}{dx^2} = zyV$，通解是 $V = Ae^{\gamma x} + Be^{-\gamma x}$，即沿线传播的两个电压波，由两个量决定：传播常数 $\gamma = \sqrt{zy}$ 和**波阻抗（surge impedance）**$Z_c = \sqrt{z/y}$。忽略电阻时 $Z_c = \sqrt{L/C}$，波速 $1/\sqrt{LC}$ 接近光速。
      - item:
          id: surge-impedance
          type: number
          prompt: 一条架空线路每公里电抗 0.4 Ω、电纳 $2.8 \times 10^{-6}$ S，忽略电阻。波阻抗约是多少欧？（保留到个位）
          answer: 378
          tolerance: 0.5
          unit: Ω
          hint: $\sqrt{L/C}$ 可以写成电抗和电纳之比再开方吗？
          explain: $x/b = \omega L/(\omega C) = L/C$，所以 $Z_c = \sqrt{0.4/(2.8 \times 10^{-6})} \approx 378$ Ω。分裂导线的波阻抗小一些，约 250–300 Ω。
      - card:
          title: 自然功率
          body: |
            无损线路末端接一个阻值恰好等于波阻抗的负荷时，线路电感吸收的无功正好等于电容发出的无功，沿线各点电压大小相同。这时传输的功率叫**自然功率（surge impedance loading）**：

            $$P_n = \frac{V^2}{Z_c}$$

            传输功率大于自然功率，线路吸收无功，末端电压下降；小于自然功率，线路发出多余的无功，末端电压升高。
      - item:
          id: natural-power
          type: number
          prompt: 一条 220 kV 线路的波阻抗按 380 Ω 算。它的自然功率约是多少兆瓦？（保留到个位）
          answer: 127
          tolerance: 0.5
          unit: MW
          hint: 自然功率由线电压和波阻抗算出。
          explain: $P_n = 220^2/380 \approx 127$ MW（kV 的平方除以欧姆直接得 MW）。500 kV 线路用四分裂导线，波阻抗约 260 Ω，自然功率约 960 MW。
      - card:
          title: 空载长线的末端电压
          body: |
            把 $x$ 从末端量起，用末端的 $V_r$、$I_r$ 定出通解里的 $A$、$B$，得 $V_s = V_r\cosh\gamma l + Z_cI_r\sinh\gamma l$。无损时 $\gamma = j\beta$，$\cosh j\beta l = \cos\beta l$，$\sinh j\beta l = j\sin\beta l$，于是 $V_s = V_r\cos\beta l + jZ_cI_r\sin\beta l$，$\beta = \omega\sqrt{LC} = \sqrt{xb}$ 是每公里的相位变化（50 Hz 时约 0.06°/km）。空载时 $I_r = 0$：

            $$V_r = \frac{V_s}{\cos\beta l}$$

            $\cos\beta l < 1$，末端电压高于首端，线路越长越明显，叫费兰梯效应。原因是电容的充电电流流过线路电感，产生的压降和电压同方向相加。超高压长线路要在两端装并联电抗器吸收充电功率。
          reveal:
            - title: 第 1 步：求每公里的相位变化
              body: |
                例：每公里电抗 0.4 Ω、电纳 $2.8 \times 10^{-6}$ S，长 200 km，末端空载。$\beta = \sqrt{xb} = \sqrt{0.4 \times 2.8 \times 10^{-6}} \approx 1.058 \times 10^{-3}$ rad/km。
            - title: 第 2 步：乘上线路长度
              body: |
                $\beta l = 1.058 \times 10^{-3} \times 200 \approx 0.212$ rad，约 $12.1°$。
            - title: 第 3 步：末端电压是首端除以 cos βl
              body: |
                $1/\cos 0.212 \approx 1.023$，末端比首端高约 2.3%。线路越长，这个倍数越大。
      - item:
          id: ferranti
          type: number
          prompt: 一条无损架空线路每公里电抗 0.4 Ω、电纳 $2.8 \times 10^{-6}$ S，长 400 km，末端空载。末端电压是首端的多少倍？（保留三位小数）
          answer: 1.097
          tolerance: 0.0005
          hint: $\beta l$ 是电压波沿线路转过的角度。空载时末端电压是首端的多少倍，和 $\cos\beta l$ 是什么关系？
          explain: $\beta = \sqrt{0.4 \times 2.8 \times 10^{-6}} \approx 1.058 \times 10^{-3}$ rad/km，$\beta l \approx 0.423$ rad（24.3°），$1/\cos\beta l \approx 1.097$。
      - item:
          id: ferranti-cause
          type: choice
          prompt: 空载长线末端电压升高，直接的原因是什么？
          options:
            - text: 充电电流流过线路电感产生电压升
              correct: true
            - text: 空载时线路电阻上没有压降
              why: 没有压降最多让两端相等，不会让末端更高
            - text: 末端开路，电流在末端被挡住，电荷越积越多抬高了电压
              why: 线路上流的是来回交变的充电电流，不会越积越多；电压升高来自充电电流在电感上的压降
            - text: 线路的电感和电容发生了谐振，电压被放大
              why: 50 Hz 时要约 1500 km（四分之一波长）才谐振，几百公里的线路远没到；这里只是充电电流在电感上的压降
          explain: 以末端电压为参考，充电电流超前 90°，记作 $\dot I_c = jI_c$；首端减末端 $\dot V_s - \dot V_r = jX\dot I_c = -XI_c$，所以 $V_r = V_s + XI_c$，末端更高。

  - id: line-power-flow
    chapter: 输电线路参数与模型
    title: 线路上的功率和电压降落
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 两条母线电压大小相同，中间用一条电抗连接，其中母线 1 的电压相角超前母线 2。有功功率朝哪个方向流？
          options:
            - text: 从相角超前的母线 1 流向母线 2
              correct: true
            - text: 不流，两端电压大小一样
              why: 有功功率由两端的相角差推动，大小相同但相角不同也会流
            - text: 从相角滞后的母线 2 流向母线 1
              why: 相角滞后的一端接收有功功率
          explain: 在电抗为主的线路上，有功功率从相角超前的一端流向滞后的一端，无功功率主要从电压高的一端流向电压低的一端。
      - card:
          title: 复功率
          body: |
            正弦稳态下，电压相量乘电流相量的共轭叫**复功率（complex power）**：$\tilde S = \dot V\dot I^* = P + jQ$。实部是有功功率，虚部是无功功率；电感性负荷电流滞后电压，$Q > 0$，叫吸收无功。三相系统用标幺值时公式不变。

            用共轭是为了让结果只和电压、电流的相位差有关：$\dot V = V\angle\theta_v$、$\dot I = I\angle\theta_i$ 时，$\dot V\dot I^* = VI\angle(\theta_v - \theta_i)$。
      - item:
          id: complex-power
          type: number
          prompt: 一个负荷的电压相量是 $1\angle0°$ pu，电流相量是 $0.5\angle{-30°}$ pu。它吸收的无功功率是多少 pu？
          answer: 0.25
          hint: 复功率是 $\dot V\dot I^*$，电流取共轭后相角变号。
          explain: $\tilde S = 1 \times 0.5\angle30° = 0.433 + j0.25$，吸收有功 0.433 pu、无功 0.25 pu。
      - card:
          title: 线路传输的有功和无功
          body: |
            忽略电阻，线路电抗 $X$，首端 $V_1\angle\delta$，末端 $V_2\angle0$。线路电流 $\dot I = \frac{\dot V_1 - \dot V_2}{jX}$，末端收到的复功率 $\dot V_2\dot I^*$ 取实部和虚部，得

            $$P = \frac{V_1V_2}{X}\sin\delta,\qquad Q_2 = \frac{V_1V_2\cos\delta - V_2^2}{X}$$

            有功由相角差 $\delta$ 推动，最大是 $\frac{V_1V_2}{X}$（$\delta = 90°$）；$\delta$ 小时 $\cos\delta \approx 1$，$Q_2 \approx \frac{V_2(V_1 - V_2)}{X}$，无功由电压差推动。这和同步发电机的功角特性是同一个式子。
      - item:
          id: two-bus-angle
          type: number
          prompt: 两条母线电压都是 1 pu，中间线路电抗 0.2 pu（忽略电阻），母线 1 向母线 2 送有功 1.0 pu。两端电压的相角差约是多少度？（保留一位小数）
          answer: 11.5
          tolerance: 0.05
          unit: °
          hint: 代入有功功率的公式，解出 $\sin\delta$。
          explain: $1.0 = \frac{1 \times 1}{0.2}\sin\delta$，$\sin\delta = 0.2$，$\delta \approx 11.5°$，母线 2 滞后。
      - card:
          title: 电压降落
          body: |
            有电阻时，末端电压 $V_2$、末端功率 $P + jQ$，线路阻抗 $R + jX$，首端电压比末端多出的部分是 $\Delta V + j\delta V$：

            $$\Delta V = \frac{PR + QX}{V_2},\qquad \delta V = \frac{PX - QR}{V_2}$$

            $\Delta V$、$\delta V$ 是电压降落的纵分量和横分量。两端电压大小之差叫电压损耗，近似等于 $\Delta V$；$\delta V$ 主要决定相角差。高压线路 $X$ 比 $R$ 大得多，所以电压大小的差主要来自无功 $Q$，相角差主要来自有功 $P$：调电压靠调无功，调相角靠调有功。
      - card:
          title: 例题：一条 110 kV 线路的首端电压
          body: 110 kV 线路 $R = 10$ Ω、$X = 20$ Ω，末端电压 110 kV，末端负荷 40 MW、30 Mvar。求首端电压。
          reveal:
            - title: 第 1 步：算纵分量
              body: $\Delta V = (40 \times 10 + 30 \times 20)/110 \approx 9.09$ kV（MW·Ω 除以 kV 得 kV）。
            - title: 第 2 步：算横分量
              body: $\delta V = (40 \times 20 - 30 \times 10)/110 \approx 4.55$ kV。
            - title: 第 3 步：合成首端电压
              body: $V_1 = \sqrt{(110 + 9.09)^2 + 4.55^2} \approx 119.2$ kV。横分量对大小的影响很小，近似用 $V_2 + \Delta V$ 就够了。
      - item:
          id: voltage-drop
          type: number
          prompt: 110 kV 线路 $R = 8$ Ω、$X = 16$ Ω，末端电压 110 kV，末端负荷 50 MW、25 Mvar。电压降落的纵分量约是多少千伏？（保留两位小数）
          answer: 7.27
          tolerance: 0.005
          unit: kV
          hint: 有功和无功分别在电阻和电抗上造成多少压降？
          explain: $\Delta V = (50 \times 8 + 25 \times 16)/110 = 800/110 \approx 7.27$ kV。其中一半来自无功；把负荷的无功就地补偿掉，电压损耗就小一半。
      - item:
          id: line-loss
          type: number
          prompt: 110 kV 线路电阻 10 Ω，末端电压 110 kV，末端负荷 50 MW、25 Mvar。线路的有功损耗约是多少兆瓦？（保留两位小数）
          answer: 2.58
          tolerance: 0.005
          unit: MW
          hint: 线路电流由末端的视在功率和电压决定，损耗是电流平方乘电阻。用功率直接写出来是什么？
          explain: $\Delta P = \frac{P^2 + Q^2}{V^2}R = \frac{2500 + 625}{12100} \times 10 \approx 2.58$ MW。无功也占用电流，同样造成有功损耗。

  # ==== 潮流计算 ====
  - id: network-matrices
    chapter: 潮流计算
    title: 节点导纳矩阵
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个有 1000 条母线的电网，每条母线平均只和两三条别的母线相连。描述它的 1000×1000 矩阵里，大部分位置上的数是什么？
          options:
            - text: '0'
              correct: true
            - text: 都不为 0，每条母线都和其他母线有关
              why: 只有直接有线路相连的两条母线之间，对应位置上的数才不为 0
            - text: 一半是 0
              why: 每行只有自己和两三个邻居不为 0，千分之几都不到一半
          explain: 每行只有几个不为 0 的数。电网计算能处理几万条母线，靠的就是只存、只算这些不为 0 的数。
      - card:
          title: 网络的图和关联矩阵
          body: |
            把电网画成一张图：母线是节点，线路和变压器是支路。**关联矩阵（incidence matrix）**$A$ 每行对应一个节点、每列对应一条支路，支路从节点 $i$ 流出记 $+1$、流入记 $-1$，不相连记 0。

            基尔霍夫电流定律可以写成 $A\mathbf i_b = \mathbf i$：每个节点流出的支路电流之和等于注入该节点的电流。支路电流又等于支路导纳乘支路两端电压之差，即 $\mathbf i_b = \mathbf y A^T\mathbf V$（$\mathbf y$ 是对角的支路导纳矩阵）。
      - card:
          title: 节点导纳矩阵
          body: |
            代入得 $\mathbf i = A\mathbf yA^T\mathbf V = Y\mathbf V$，$Y = A\mathbf yA^T$ 叫**节点导纳矩阵（bus admittance matrix）**。它可以直接按规则写出：

            - 对角元 $Y_{ii}$ = 所有接在节点 $i$ 上的导纳之和（包括对地的电容、电抗器）；
            - 非对角元 $Y_{ij}$ = 节点 $i$、$j$ 之间支路导纳的负值，没有支路就是 0。

            加一条线路或一台电容器，只改动相关的两三个位置。绝大部分位置都是 0 的矩阵叫**稀疏矩阵（sparse matrix）**，只存储和计算非零元，几万条母线的电网也能很快算完。
      - item:
          id: add-capacitor
          type: choice
          prompt: 在一个电网的母线 5 上并联一组电容器，节点导纳矩阵要改动哪些位置？
          options:
            - text: 只有 $Y_{55}$
              correct: true
            - text: 第 5 行和第 5 列的所有位置
              why: 电容器接在母线 5 和地之间，不连接别的母线，非对角元不变
            - text: 整个矩阵都要重新计算
              why: 节点导纳矩阵可以按元件逐个加进去，加一个元件只改它连接的节点
            - text: 不用改，电容器不是线路
              why: 对地支路也要计入它所接节点的对角元
          explain: 对地的元件只接一个节点，只加到那个节点的对角元上。
      - card:
          title: 例题：三母线网络
          body: 三条母线，线路电抗 $x_{12} = 0.1$、$x_{23} = 0.25$、$x_{13} = 0.2$ pu，忽略电阻和对地电容。写出节点导纳矩阵。
          reveal:
            - title: 第 1 步：求各支路导纳
              body: $y = 1/(jx)$：$y_{12} = -j10$，$y_{23} = -j4$，$y_{13} = -j5$。
            - title: 第 2 步：对角元
              body: $Y_{11} = y_{12} + y_{13} = -j15$，$Y_{22} = y_{12} + y_{23} = -j14$，$Y_{33} = y_{13} + y_{23} = -j9$。
            - title: 第 3 步：非对角元
              body: $Y_{12} = Y_{21} = j10$，$Y_{23} = Y_{32} = j4$，$Y_{13} = Y_{31} = j5$。矩阵对称，每行之和为 0（因为没有对地支路）。
      - item:
          id: ybus-diagonal
          type: number
          prompt: 母线 2 经电抗 0.1 pu 的线路接母线 1，经电抗 0.25 pu 的线路接母线 3，没有其他支路，忽略电阻和对地电容。节点导纳矩阵的 $Y_{22}$ 是纯虚数，它的虚部是多少？
          answer: -14
          hint: 每条线路的导纳是 $1/(jx)$，$Y_{22}$ 是接在母线 2 上的导纳之和。
          explain: $1/(j0.1) = -j10$，$1/(j0.25) = -j4$，$Y_{22} = -j14$，虚部 $-14$。
      - item:
          id: ybus-offdiag
          type: number
          prompt: 母线 2 和母线 3 之间只有一条电抗 0.25 pu 的线路（忽略电阻和对地电容）。节点导纳矩阵的 $Y_{23}$ 是纯虚数，它的虚部是多少？
          answer: 4
          hint: 非对角元是支路导纳的负值。
          explain: 支路导纳 $-j4$，$Y_{23} = -(-j4) = j4$，虚部 4。
      - item:
          id: sparsity
          type: number
          prompt: 一个 1000 条母线、1500 条线路的电网（没有并联的重复线路）。它的节点导纳矩阵最多有多少个不为 0 的位置？
          answer: 4000
          hint: 对角元有几个？每条线路贡献几个非对角元？
          explain: 1000 个对角元，每条线路给 $Y_{ij}$ 和 $Y_{ji}$ 两个，共 $1000 + 3000 = 4000$ 个，只占 $10^6$ 个位置的 0.4%。
  - id: load-flow-equations
    chapter: 潮流计算
    title: 潮流方程和节点类型
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 潮流计算时，负荷母线上已知的是负荷的有功和无功功率，而不是它的电流或阻抗。用功率表示时，节点方程还是线性的吗？
          options:
            - text: 不是，功率方程是非线性的
              correct: true
            - text: 是，和电路分析一样解线性方程组
              why: 已知量是功率时，方程里出现了电压和电压共轭的乘积，不再是线性的
            - text: 是，因为节点导纳矩阵是线性的
              why: $I = YV$ 是线性的，但已知量是 $S = VI^*$，代入后就非线性了
          explain: 功率方程是非线性的，只能迭代求解。这一课写出这组方程，下一步讲怎样迭代。
      - card:
          title: 节点功率方程
          body: |
            节点 $i$ 的注入复功率 $S_i = \dot V_i\dot I_i^* = \dot V_i\sum_j Y_{ij}^*\dot V_j^*$。写成实数形式，$Y_{ij} = G_{ij} + jB_{ij}$，$\theta_{ij} = \theta_i - \theta_j$：

            $$P_i = V_i\sum_j V_j(G_{ij}\cos\theta_{ij} + B_{ij}\sin\theta_{ij}),\qquad Q_i = V_i\sum_j V_j(G_{ij}\sin\theta_{ij} - B_{ij}\cos\theta_{ij})$$

            已知负荷和发电机的功率、电压，求出各母线电压和各支路功率，叫**潮流计算（load flow）**。方程里有正弦、余弦和电压的乘积，是非线性的。
      - card:
          title: 三类节点
          body: |
            每个节点有四个量：$P$、$Q$、$V$、$\theta$，方程给出两个，另外两个必须已知。

            - **PQ 节点（PQ bus）**：负荷母线，已知 $P$、$Q$，求 $V$、$\theta$；
            - **PV 节点（PV bus）**：发电机母线，已知有功出力 $P$ 和励磁维持的电压 $V$，求 $Q$、$\theta$；
            - **平衡节点（slack bus）**：选一台大发电机，给定 $V$ 和 $\theta = 0$（作相角参考）。线路和变压器上损耗掉的有功叫网损，它事先不知道，由平衡节点最后补足全网的功率平衡。
      - item:
          id: bus-types
          type: match
          prompt: 把每类节点和它事先已知的两个量配对。
          pairs:
            - [PQ 节点, 有功功率和无功功率]
            - [PV 节点, 有功功率和电压幅值]
            - [平衡节点, 电压幅值和相角]
          explain: 负荷给定功率；发电机给定出力和端电压；平衡节点给定电压和参考相角，功率最后算出。
      - item:
          id: why-slack
          type: choice
          prompt: 为什么潮流计算必须有一个平衡节点，不能把所有发电机都设成 PV 节点？
          options:
            - text: 网损要算完才知道，需要一台机组补足差额并作相角参考
              correct: true
            - text: 平衡节点的发电机容量最大，其他发电机的出力不能调整
              why: 平衡节点只是计算上的约定，通常选大机组，但其他机组也能调
            - text: PV 节点不能给定有功功率，只能给定电压幅值
              why: PV 节点正是给定了有功功率和电压幅值
            - text: 没有平衡节点时就写不出节点导纳矩阵
              why: 节点导纳矩阵只由网络决定，和节点类型无关
          explain: 如果所有发电机的有功都事先给定，发电总量减负荷不一定恰好等于网损，方程就无解；而且所有相角只有差值有意义，必须选一个作参考。
      - card:
          title: 高斯–赛德尔迭代
          body: |
            由 $S_i^* = \dot V_i^*\sum_j Y_{ij}\dot V_j$ 解出 $\dot V_i$：

            $$\dot V_i^{(k + 1)} = \frac{1}{Y_{ii}}\left[\frac{P_i - jQ_i}{\dot V_i^{(k)*}} - \sum_{j \ne i}Y_{ij}\dot V_j\right]$$

            从全部电压取 $1\angle0°$ 开始，逐个节点用最新的值更新，直到前后两次相差足够小。每一步计算量小，但收敛慢，大电网常要上百次迭代。
      - card:
          title: 例题：一次高斯–赛德尔迭代
          body: 平衡节点 1 电压 $1\angle0°$，经电抗 0.2 pu 的线路接负荷母线 2，负荷 $0.5 + j0.2$ pu。从 $\dot V_2 = 1\angle0°$ 出发，做一次迭代。
          reveal:
            - title: 第 1 步：写出导纳矩阵里用到的几个数
              body: 线路导纳 $1/(j0.2) = -j5$，$Y_{22} = -j5$，$Y_{21} = j5$。
            - title: 第 2 步：写出注入功率
              body: 负荷吸收功率，注入功率为负：$P_2 - jQ_2 = -0.5 + j0.2$。
            - title: 第 3 步：代入迭代式
              body: $\dot V_2^{(1)} = \frac{1}{-j5}\left[\frac{-0.5 + j0.2}{1} - j5 \times 1\right] = \frac{-0.5 - j4.8}{-j5} = 0.96 - j0.1$，幅值约 0.965 pu。继续迭代会收敛到约 $0.952\angle{-6.0°}$。
      - item:
          id: gauss-seidel
          type: number
          prompt: 平衡节点 1 电压 $1\angle0°$，经电抗 0.2 pu 的线路接负荷母线 2，负荷 $0.5 + j0.2$ pu。用高斯–赛德尔法从 $\dot V_2 = 1\angle0°$ 出发迭代一次，得到的 $\dot V_2$ 的幅值约是多少 pu？（保留三位小数）
          answer: 0.965
          tolerance: 0.0005
          hint: $Y_{22}$ 和 $Y_{21}$ 是多少？负荷的注入功率取什么符号？
          explain: $\dot V_2^{(1)} = (-0.5 + j0.2 - j5)/(-j5) = 0.96 - j0.1$，幅值 $\sqrt{0.96^2 + 0.1^2} \approx 0.965$ pu。
  - id: newton-raphson
    chapter: 潮流计算
    title: 牛顿–拉夫逊法和简化算法
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 要解方程 $5\sin\delta = 1$，从 $\delta = 0$ 出发。用曲线在当前点的切线代替曲线，切线和 $y = 1$ 的交点作为下一个猜测值。第一次得到的 $\delta$ 是多少弧度？
          options:
            - text: '0.2'
              correct: true
            - text: '0.1'
              why: 切线斜率是 $5\cos0 = 5$，从 0 升到 1 要走 $1/5 = 0.2$
            - text: '1.0'
              why: 切线的斜率是 5，不是 1
          explain: 在 $\delta = 0$ 处切线是 $y = 5\delta$，令它等于 1 得 $\delta = 0.2$，真解是 $\arcsin0.2 \approx 0.2014$。用切线一步步逼近，收敛得很快。
      - card:
          title: 牛顿–拉夫逊法
          body: |
            解 $f(x) = 0$：在当前点 $x_k$ 用切线代替曲线，$f(x_k) + f'(x_k)(x - x_k) = 0$，得 $x_{k + 1} = x_k - \frac{f(x_k)}{f'(x_k)}$。离真解近时，每迭代一次误差大约平方一次，几步就非常准，这叫**牛顿法（Newton–Raphson method）**，也叫牛顿–拉夫逊法。

            多个方程时，每个方程只让一个未知数变、其余不变求导，得到**偏导数（partial derivative）**；把全部偏导数排成**雅可比矩阵（Jacobian matrix）**$J$，每一步解线性方程组 $J\Delta\mathbf x = -\mathbf f(\mathbf x_k)$。
      - item:
          id: nr-first-step
          type: number
          prompt: 两母线电压都是 1 pu、线路电抗 0.2 pu，要送有功 1.0 pu，即解 $5\sin\delta = 1$。用牛顿法从 $\delta = 0$ 出发迭代一次，得到的 $\delta$ 约是多少度？（保留两位小数）
          answer: 11.46
          tolerance: 0.005
          unit: °
          hint: $f(\delta) = 5\sin\delta - 1$，在 0 处的函数值和导数各是多少？
          explain: $\delta_1 = 0 - (0 - 1)/(5\cos0) = 0.2$ rad $\approx 11.46°$。再迭代一次得 11.537°，真解 $\arcsin0.2 = 11.537°$，第二步就准到小数点后三位。
      - card:
          title: 牛顿法潮流计算
          body: |
            未知量是 PQ、PV 节点的相角 $\theta$ 和 PQ 节点的电压 $V$；方程是这些节点的功率失配 $\Delta P = P_{给定} - P(\theta, V)$ 和 PQ 节点的 $\Delta Q$。每一步：

            1. 用当前的 $\theta$、$V$ 算出各节点功率和失配；
            2. 算雅可比矩阵 $J = \partial(P, Q)/\partial(\theta, V)$；
            3. 解 $J\begin{bmatrix}\Delta\theta \\ \Delta V\end{bmatrix} = \begin{bmatrix}\Delta P \\ \Delta Q\end{bmatrix}$，修正 $\theta$、$V$；
            4. 失配都足够小时停止。

            一般 3–5 次迭代就收敛，和电网大小关系不大，是现在潮流计算的标准方法。
      - item:
          id: nr-second-case
          type: number
          prompt: 两母线电压都是 1 pu、线路电抗 0.2 pu，要送有功 2.0 pu，即解 $5\sin\delta = 2$。用牛顿法从 $\delta = 0$ 出发迭代一次，得到的 $\delta$ 约是多少度？（保留两位小数）
          answer: 22.92
          tolerance: 0.005
          unit: °
          hint: 在 0 处的函数值和导数各是多少？
          explain: $\delta_1 = 2/5 = 0.4$ rad $\approx 22.92°$，真解 $\arcsin0.4 \approx 23.58°$。离线性区越远，第一步的误差越大，但后面几步仍然很快收敛。
      - card:
          title: PQ 分解法和直流潮流
          body: |
            高压电网 $X$ 远大于 $R$，有功主要随相角变，无功主要随电压变。PQ 分解法据此忽略雅可比矩阵里 $\partial P/\partial V$ 和 $\partial Q/\partial\theta$ 两块，并把剩下两块近似成不随迭代变化的常数矩阵，每步只解两个小方程组，迭代次数多一些，但总的计算快得多。

            再进一步，令电压都为 1、忽略电阻和无功、$\sin\theta \approx \theta$，有功方程变成线性的 $\mathbf P = B\boldsymbol\theta$，线路潮流 $P_{ij} = (\theta_i - \theta_j)/x_{ij}$，叫**直流潮流（DC power flow）**。它不用迭代，常用于规划和电力市场。
      - item:
          id: dc-flow
          type: number
          prompt: 用直流潮流计算：平衡节点 1 经电抗 0.1 pu 的线路直接接负荷母线 3，又经母线 2 绕行接到母线 3（线路 1–2 电抗 0.1 pu、2–3 电抗 0.2 pu），母线 2 没有负荷和发电。母线 3 负荷 1.0 pu。线路 1–3 上的有功约是多少 pu？
          answer: 0.75
          hint: 两条路并联，有功按什么比例分配？
          explain: 直接路径电抗 0.1，绕行路径 $0.1 + 0.2 = 0.3$，两条路两端的相角差相同，功率和电抗成反比：$1.0 \times 0.3/(0.1 + 0.3) = 0.75$ pu，绕行路径 0.25 pu。
      - item:
          id: nr-vs-gs
          type: choice
          prompt: 和高斯–赛德尔法相比，牛顿–拉夫逊法的特点是什么？
          options:
            - text: 每步计算量大，但迭代次数少，且几乎不随电网规模增加
              correct: true
            - text: 每步计算量小，但要迭代上百次才能收敛
              why: 这说的是高斯–赛德尔法
            - text: 不需要迭代，一次就能解出全部电压
              why: 那是直流潮流；牛顿法仍要迭代，只是次数很少
            - text: 只能用于辐射状的配电网，不能用于环网
              why: 牛顿法适用于任意结构的网络，是大电网潮流计算的标准方法
          explain: 牛顿法在解附近二次收敛，3–5 步就够；配合稀疏矩阵技术，每步的计算量也可以接受。

  # ==== 对称与不对称故障分析 ====
  - id: three-phase-fault
    chapter: 对称与不对称故障分析
    title: 三相短路
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一条 110 kV 母线发生三相短路。短路电流和这条母线上正常的负荷电流相比，大约是什么数量级？
          options:
            - text: 大十倍以上
              correct: true
            - text: 差不多
              why: 正常时电流受负荷阻抗限制；短路后只剩很小的电网阻抗，电流大得多
            - text: 比负荷电流小，因为电压降低了
              why: 故障点电压降到接近 0，但驱动电流的是电源电动势，阻抗变小，电流猛增
          explain: 从故障点看进去的电网阻抗只有零点零几 pu，短路电流常是额定电流的十几到几十倍。
      - card:
          title: 三相短路电流和短路容量
          body: |
            三相短路时三相仍然对称，只算一相。故障前母线电压约 1 pu，从故障点看进去的电网等值阻抗 $Z_{th}$（戴维南等效阻抗）很小，短路电流 $I_f = V_f/Z_{th}$ 很大；标幺值乘基准电流就是安培数。

            算短路电流是为了选断路器（要能切断这么大的电流）、整定继电保护、校验母线和设备能否承受。故障点的**短路容量（short-circuit capacity）**$S_k = \sqrt3V_NI_f$，标幺制下就是 $I_f \cdot S_B$，表示这一点的电网有多“强”：短路容量越大，接上负荷时电压变化越小。
      - item:
          id: fault-current
          type: number
          prompt: 取 $S_B = 100$ MVA、$V_B = 110$ kV。从某 110 kV 母线看进去的系统等值阻抗是 $j0.1$ pu，故障前电压 1 pu。三相短路电流约是多少千安？（保留两位小数）
          answer: 5.25
          tolerance: 0.005
          unit: kA
          hint: 先求标幺短路电流，再求基准电流。
          explain: $I_f = 1/0.1 = 10$ pu，$I_B = 100 \times 10^6/(\sqrt3 \times 110 \times 10^3) \approx 525$ A，$I_f \approx 5.25$ kA。
      - item:
          id: short-circuit-capacity
          type: number
          prompt: 取 $S_B = 100$ MVA，某母线的三相短路电流是 10 pu。这条母线的短路容量是多少 MVA？
          answer: 1000
          unit: MVA
          hint: 标幺制下短路容量等于什么乘基准容量？
          explain: $S_k = I_f \cdot S_B = 10 \times 100 = 1000$ MVA。
      - card:
          title: 发电机的三个电抗
          body: |
            同步发电机机端突然三相短路，电流起初很大，几个周期内迅速衰减，再在约一秒内慢慢降到稳态值：转子上的阻尼绕组和励磁绕组里感应出的电流起初阻止磁通变化。分三段用不同的电抗描述：**次暂态电抗（subtransient reactance）**$X_d''$（最初几个周期）、暂态电抗 $X_d'$（零点几秒到一秒多）、同步电抗 $X_d$（稳态）。

            汽轮发电机大约 $X_d'' \approx 0.1$–$0.25$、$X_d' \approx 0.15$–$0.4$、$X_d \approx 1$–$2.3$ pu。断路器动作时刻的电流按 $X_d''$ 或 $X_d'$ 算。
      - item:
          id: subtransient-current
          type: number
          prompt: 一台发电机空载电动势 1 pu，次暂态电抗 0.15 pu（以它自己的额定值为基准）。机端三相短路后最初的短路电流有效值约是额定电流的多少倍？（保留两位小数）
          answer: 6.67
          tolerance: 0.005
          hint: 最初几个周期用哪个电抗？
          explain: $I'' = 1/0.15 \approx 6.67$ pu，即额定电流的 6.67 倍。
      - item:
          id: steady-fault-current
          type: number
          prompt: 一台发电机空载电动势 1 pu，同步电抗 1.8 pu（以自己的额定值为基准），励磁不变。机端三相短路持续到稳态后，电流约是额定电流的多少倍？（保留三位小数）
          answer: 0.556
          tolerance: 0.0005
          hint: 稳态时用哪个电抗？
          explain: $1/1.8 \approx 0.556$ pu，比额定电流还小。实际的励磁调节器会强行增加励磁，稳态电流会大一些。
      - item:
          id: series-fault
          type: number
          prompt: 取 $S_B = 100$ MVA。一台发电机次暂态电抗 0.15 pu、一台升压变压器漏抗 0.0875 pu、一条 110 kV 线路电抗 0.165 pu（都已换到系统基准）依次串联，线路末端母线发生三相短路，故障前电压 1 pu。短路电流约是多少千安？（保留两位小数）
          answer: 1.30
          tolerance: 0.005
          unit: kA
          hint: 从故障点看进去，三个电抗是怎样连接的？110 kV 的基准电流是多少？
          explain: $X_\Sigma = 0.15 + 0.0875 + 0.165 = 0.4025$ pu，$I_f = 1/0.4025 \approx 2.48$ pu，乘基准电流 524.9 A 约 1.30 kA。
      - card:
          title: 冲击电流
          body: |
            短路瞬间电感里的电流不能突变，短路电流除了正弦的周期分量，还叠加一个逐渐衰减的直流分量（非周期分量），它的大小取决于短路发生的时刻。最坏情况下，短路后约半个周期电流达到最大，叫**冲击电流（peak short-circuit current）**：

            $$i_{imp} = \sqrt2K_{imp}I''$$

            $I''$ 是次暂态电流有效值，冲击系数 $K_{imp}$ 在高压电网常取 1.8，即 $i_{imp} \approx 2.55I''$。母线和断路器要能承受冲击电流产生的电动力。
      - item:
          id: peak-current
          type: number
          prompt: 某母线三相短路的次暂态电流有效值是 20 kA，冲击系数取 1.8。冲击电流约是多少千安？（保留一位小数）
          answer: 50.9
          tolerance: 0.05
          unit: kA
          hint: 冲击电流是有效值的几倍？里面的 $\sqrt2$ 从哪里来？
          explain: $i_{imp} = \sqrt2 \times 1.8 \times 20 \approx 50.9$ kA。$\sqrt2$ 把有效值换成峰值，1.8 是直流分量叠加上去的倍数。

  - id: symmetrical-components
    chapter: 对称与不对称故障分析
    title: 对称分量法
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一相短路后，三相电压大小不等、相位差也不再是 120°。你觉得这三个不对称的相量能不能拆成几组各自对称的相量之和？
          options:
            - text: 能，拆成三组
              correct: true
            - text: 不能，不对称就只能直接算
              why: 任意三个相量都能唯一地拆成三组对称分量
            - text: 能，拆成两组：正相序和反相序
              why: 还需要一组三相大小相等、相位相同的分量，才能表示三相之和不为 0 的情况
          explain: 任意三个相量都等于正序、负序、零序三组对称分量之和。每组各自对称，可以按单相电路计算。
      - card:
          title: 算子 a 和三组对称分量
          body: |
            $a = 1\angle120°$，乘 $a$ 就是把相量逆时针转 120°；$a^2 = 1\angle240°$，$1 + a + a^2 = 0$。任意三个相量都能唯一地拆成三组对称分量之和：

            - **正序（positive sequence）**：三相大小相等，按 a、b、c 依次滞后 120°，和正常运行时一样；
            - **负序（negative sequence）**：大小相等，相序反过来，按 a、c、b 依次滞后 120°；
            - **零序（zero sequence）**：三相大小相等、相位相同。

            把不对称问题拆成三个对称问题分别计算再叠加，叫**对称分量法（symmetrical components）**。
      - item:
          id: which-zero
          type: choice
          prompt: 下面哪一组三相相量是零序分量？
          options:
            - text: 三相大小相等、相位相同
              correct: true
            - text: 三相大小相等，按 a、b、c 依次滞后 120°
              why: 这是正序分量
            - text: 三相大小相等，按 a、c、b 依次滞后 120°
              why: 这是负序分量
            - text: 三相之和为 0 的任意一组
              why: 正序和负序三相之和都是 0；零序恰恰相反，三相之和是一相的 3 倍
          explain: 零序三相同相，三相之和不为 0，所以它要经大地或中性线返回。
      - card:
          title: 变换公式
          body: |
            以 a 相为代表，右下角的 0、1、2 表示零序、正序、负序：

            $$\dot V_a = \dot V_0 + \dot V_1 + \dot V_2,\quad \dot V_b = \dot V_0 + a^2\dot V_1 + a\dot V_2,\quad \dot V_c = \dot V_0 + a\dot V_1 + a^2\dot V_2$$

            反过来

            $$\dot V_0 = \tfrac13(\dot V_a + \dot V_b + \dot V_c),\quad \dot V_1 = \tfrac13(\dot V_a + a\dot V_b + a^2\dot V_c),\quad \dot V_2 = \tfrac13(\dot V_a + a^2\dot V_b + a\dot V_c)$$

            零序分量是三相之和的三分之一：三相平衡时为 0，中性线里流的电流是 $3\dot I_0$。零序电流要有经大地或中性线的返回通路：接地短路会产生它，一相断线（非全相运行）也会产生；继电保护常用 $3\dot I_0$ 检测接地故障。
      - card:
          title: 例题：只有一相有电流
          body: a 相电流 $\dot I_a = I\angle0°$，b、c 相电流为 0。求三个序分量。
          reveal:
            - title: 第 1 步：零序
              body: $\dot I_0 = \frac13(I + 0 + 0) = \frac I3$。
            - title: 第 2 步：正序和负序
              body: $\dot I_1 = \frac13(I + a \cdot 0 + a^2 \cdot 0) = \frac I3$，$\dot I_2 = \frac I3$。
            - title: 第 3 步：验证
              body: b 相 $= \frac I3(1 + a^2 + a) = 0$，c 相同理为 0，a 相 $= I$，和原来一致。三个序分量相等，这正是单相接地短路的特点。
      - item:
          id: zero-sequence
          type: number
          prompt: 中性点接地的系统里 c 相断线，三相电流 $\dot I_a = 10\angle0°$ A、$\dot I_b = 10\angle{-120°}$ A、$\dot I_c = 0$。零序电流的大小约是多少安？（保留两位小数）
          answer: 3.33
          tolerance: 0.005
          unit: A
          hint: 零序分量是三相之和的三分之一。$10\angle0° + 10\angle{-120°}$ 的大小是多少？
          explain: $10\angle0° + 10\angle{-120°} = 10\angle{-60°}$，$|\dot I_0| = 10/3 \approx 3.33$ A。
      - item:
          id: positive-sequence
          type: number
          prompt: 中性点接地的系统里 c 相断线，三相电流 $\dot I_a = 10\angle0°$ A、$\dot I_b = 10\angle{-120°}$ A、$\dot I_c = 0$。正序电流的大小约是多少安？（保留两位小数）
          answer: 6.67
          tolerance: 0.005
          unit: A
          hint: $a\dot I_b$ 把 b 相电流转 120° 后是多少？
          explain: $a\dot I_b = 10\angle0°$，$\dot I_1 = \frac13(10 + 10 + 0) \approx 6.67$ A。
      - card:
          title: 序阻抗和接地方式
          body: |
            三相对称的元件，三组分量各走各的，互不影响，各有一个序阻抗 $Z_1$、$Z_2$、$Z_0$。线路和变压器是静止元件，负序阻抗等于正序阻抗；发电机的负序阻抗和正序不同。

            零序电流三相同相，必须经大地或中性线返回，所以零序阻抗取决于接地的路径：架空线路的零序电抗约是正序的 2–3.5 倍；中性点经阻抗 $Z_n$ 接地时，零序网络里要串入 $3Z_n$，因为三相的零序电流都流过它；中性点不接地，零序电流就没有通路。
      - item:
          id: neutral-impedance
          type: number
          prompt: 一台变压器的中性点经 0.05 pu 的电抗接地。画零序网络时，中性点这条支路要计入多少 pu 的电抗？
          answer: 0.15
          hint: 三相的零序电流都流过中性点电抗，它上面的压降是一相零序电流的几倍？
          explain: 中性点电流是 $3\dot I_0$，压降 $3\dot I_0 \cdot jX_n$，折合到每相的零序电流就是 $3X_n = 0.15$ pu。
      - card:
          title: 变压器接线和零序
          body: |
            YN（星形、中性点接地）一侧，零序电流可以经中性点流入大地；Y（星形、不接地）一侧，零序电流没有通路；d（三角形）一侧，零序电流只能在三角形内部环流，出不了线。

            所以 YNd 变压器：从 YN 侧看进去，零序阻抗是变压器的漏抗（三角形绕组相当于把零序短接）；从 d 侧看进去，零序是开路。电网的接地故障电流只在有接地中性点的那部分网络里流。
      - item:
          id: transformer-zero
          type: choice
          prompt: 一台 YNd 接线的升压变压器，d 侧接发电机，YN 侧接 220 kV 电网。220 kV 线路上发生单相接地，零序电流能不能流到发电机那一侧？
          options:
            - text: 不能，它在三角形绕组里环流
              correct: true
            - text: 能，变压器两侧总是按匝数比传递电流
              why: 正序和负序按匝数比传递；零序在三角形里自成回路，线电流里没有零序
            - text: 能，因为 YN 侧中性点接地
              why: 接地让零序电流能在 YN 侧流通，但它到了三角形绕组里就只在内部环流
            - text: 不能，因为发电机的零序阻抗非常大
              why: 真正的原因是三角形绕组挡住了零序电流，和发电机的零序阻抗无关
          explain: 三角形绕组为零序电流提供了内部环路，同时让它不能出现在 d 侧的线电流里。这也让 YNd 变压器把两侧的接地故障隔开。

  - id: unbalanced-faults
    chapter: 对称与不对称故障分析
    title: 不对称短路
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 同一个故障点，两相短路的电流和三相短路相比（正序、负序阻抗相等）？
          options:
            - text: 小一些，约 0.87 倍
              correct: true
            - text: 一样大，故障点都直接相连
              why: 两相短路时负序网络也串进了回路，阻抗变大
            - text: 大一些，两相一起短路更严重
              why: 两相短路的回路阻抗是 $Z_1 + Z_2$，比三相短路的 $Z_1$ 大，电流更小
          explain: 两相短路电流是 $\sqrt3E/(Z_1 + Z_2)$，$Z_1 = Z_2$ 时是三相短路的 $\sqrt3/2 \approx 0.87$ 倍。
      - card:
          title: 例题：单相接地短路的序网连接
          body: a 相经阻抗 $Z_f$ 接地，b、c 相电流为 0。故障前电动势 $\dot E$，从故障点看进去的三个序阻抗是 $Z_1$、$Z_2$、$Z_0$。求故障电流。
          reveal:
            - title: 第 1 步：由边界条件求序电流的关系
              body: $\dot I_b = \dot I_c = 0$，代入变换公式，$\dot I_0 = \dot I_1 = \dot I_2 = \dot I_a/3$。
            - title: 第 2 步：写出三个序网络
              body: 只有正序网络里有电源：$\dot V_1 = \dot E - Z_1\dot I_1$，$\dot V_2 = -Z_2\dot I_2$，$\dot V_0 = -Z_0\dot I_0$。
            - title: 第 3 步：用 a 相电压的边界条件
              body: $\dot V_a = \dot V_0 + \dot V_1 + \dot V_2 = Z_f\dot I_a = 3Z_f\dot I_1$，代入得 $\dot E - (Z_1 + Z_2 + Z_0)\dot I_1 = 3Z_f\dot I_1$。
            - title: 第 4 步：解出故障电流
              body: $\dot I_1 = \frac{\dot E}{Z_1 + Z_2 + Z_0 + 3Z_f}$，$\dot I_a = 3\dot I_1$。相当于三个序网络串联。
      - item:
          id: slg-current
          type: number
          prompt: 某母线 $Z_1 = Z_2 = j0.1$、$Z_0 = j0.2$ pu，故障前电压 1 pu，金属性单相接地（$Z_f = 0$）。故障电流是多少 pu？
          answer: 7.5
          hint: 三个序网络串联，故障相电流是正序电流的几倍？
          explain: $I_1 = 1/(0.1 + 0.1 + 0.2) = 2.5$ pu，$I_a = 3I_1 = 7.5$ pu。在 110 kV、100 MVA 基准下约 3.94 kA。
      - item:
          id: slg-ka
          type: number
          prompt: 取 $S_B = 100$ MVA、$V_B = 110$ kV，单相接地故障电流是 7.5 pu。它约是多少千安？（保留两位小数）
          answer: 3.94
          tolerance: 0.005
          unit: kA
          hint: 基准电流是多少？
          explain: $I_B \approx 524.9$ A，$7.5 \times 524.9 \approx 3937$ A，约 3.94 kA。
      - card:
          title: 两相短路和两相接地短路
          body: |
            b、c 两相短路（不接地）：没有零序，正序和负序网络在故障点并联，$\dot I_1 = -\dot I_2 = \frac{\dot E}{Z_1 + Z_2}$，故障相电流 $I_b = \sqrt3I_1$。

            b、c 两相短路并接地：边界条件是 $\dot I_a = 0$、$\dot V_b = \dot V_c = 0$，代入变换公式得 $\dot V_0 = \dot V_1 = \dot V_2$、$\dot I_0 + \dot I_1 + \dot I_2 = 0$，即三个序网络在故障点并联，$\dot I_1 = \frac{\dot E}{Z_1 + Z_2 /\!/ Z_0}$，$Z_2 /\!/ Z_0 = \frac{Z_2Z_0}{Z_2 + Z_0}$ 表示两者并联；零序电流 $\dot I_0 = -\dot I_1\frac{Z_2}{Z_2 + Z_0}$，流入大地的电流是 $3\dot I_0$。
      - item:
          id: ll-current
          type: number
          prompt: 某母线 $Z_1 = Z_2 = j0.1$ pu，故障前电压 1 pu，发生两相短路（不接地）。故障相电流约是多少 pu？（保留两位小数）
          answer: 8.66
          tolerance: 0.005
          hint: 正序电流是多少？故障相电流是它的几倍？
          explain: $I_1 = 1/0.2 = 5$ pu，$I_b = \sqrt3 \times 5 \approx 8.66$ pu，是三相短路 10 pu 的 0.87 倍。
      - item:
          id: llg-positive
          type: number
          prompt: 某母线 $Z_1 = Z_2 = j0.1$、$Z_0 = j0.2$ pu，故障前电压 1 pu，发生两相短路接地。正序电流是多少 pu？
          answer: 6
          hint: 负序和零序阻抗并联是多少？
          explain: $Z_2 /\!/ Z_0 = 0.02/0.3 \approx 0.0667$，$I_1 = 1/(0.1 + 0.0667) = 6$ pu。
      - card:
          title: 正序等效定则
          body: |
            几种短路的正序电流都可以写成 $I_1 = \frac{E}{Z_1 + Z_\Delta}$，故障相电流 $I_f = mI_1$：

            | 故障 | $Z_\Delta$ | $m$ |
            |---|---|---|
            | 三相短路 | 0 | 1 |
            | 两相短路 | $Z_2$ | $\sqrt3$ |
            | 单相接地 | $Z_2 + Z_0$ | 3 |
            | 两相接地 | $Z_2 /\!/ Z_0$ | $\sqrt3\sqrt{1 - \frac{Z_2Z_0}{(Z_2 + Z_0)^2}}$ |

            不对称短路相当于在正序网络的故障点串一个附加阻抗 $Z_\Delta$，叫**正序等效定则（positive-sequence equivalence rule）**。$Z_0$ 比 $Z_1$ 小时（接地变压器很多的地方），单相接地电流会超过三相短路电流。
      - item:
          id: slg-vs-3ph
          type: choice
          prompt: 某母线正序、负序阻抗相等。单相接地短路电流什么时候会大于三相短路电流？
          options:
            - text: 零序阻抗小于正序阻抗时
              correct: true
            - text: 零序阻抗大于正序阻抗时
              why: 零序阻抗越大，单相接地回路阻抗 $Z_1 + Z_2 + Z_0$ 越大，电流越小
            - text: 永远不会，三相短路总是最严重的
              why: $3E/(2Z_1 + Z_0) > E/Z_1$ 等价于 $Z_0 < Z_1$，这在接地点多的电网里会出现
            - text: 中性点不接地时
              why: 中性点不接地时零序没有通路，单相接地电流很小
          explain: $\frac{3E}{2Z_1 + Z_0} > \frac{E}{Z_1}$ 化简得 $Z_0 < Z_1$。所以选断路器要同时校核三相短路和单相接地两种电流。

  # ==== 电力系统稳定性 ====
  - id: steady-state-stability
    chapter: 电力系统稳定性
    title: 功角特性和静态稳定
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一台经长线路接入大电网的同步发电机，汽轮机不断加大出力。发电机送出的有功功率能不能一直跟着增大？
          options:
            - text: 不能，功角到 90° 时功率最大
              correct: true
            - text: 能，只要汽轮机的出力一直跟得上
              why: 发电机能送出的电功率受 $\frac{EV}{X}\sin\delta$ 限制，最大是 $\frac{EV}{X}$
            - text: 能，但线路会过热
              why: 远在过热之前，功角就会到 90°，发电机失去同步
          explain: 电功率是功角的正弦函数，有最大值。机械功率超过它，转子就会越转越快、失去同步。
      - card:
          title: 稳定的分类
          body: |
            电力系统受到扰动后能否回到一个可以接受的运行状态，叫稳定性。分三类：功角稳定（各发电机能否保持同步）、频率稳定（发电和负荷失去平衡后频率能否稳住）、电压稳定（重负荷时电压能否维持）。

            功角稳定又分两种：负荷的小波动这类小扰动下的**静态稳定（small-signal stability）**，以及短路、切除线路这类大扰动下的**暂态稳定（transient stability）**。
      - card:
          title: 惯性时间常数
          body: |
            转子在同步转速下储存的动能除以发电机额定容量，叫**惯性时间常数（inertia constant）**$H = \frac{J\omega_{sm}^2}{2S_N}$，单位秒，意思是转子的动能足够发电机满功率发多少秒。火电机组 $H$ 约 3–9 s，水电约 2–4 s。用标幺值写摇摆方程：

            $$\frac{2H}{\omega_s}\frac{d^2\delta}{dt^2} = P_m - P_e$$

            $\omega_s = 2\pi f$ 是同步电角速度，$\delta$ 用弧度，$P_m$、$P_e$ 是标幺功率。换成标幺值后，摇摆方程里的 $M$ 就是 $2H/\omega_s$。
      - item:
          id: inertia-constant
          type: number
          prompt: 一台 300 MVA 的两极汽轮发电机，转子和汽轮机的转动惯量合计 30000 kg·m²，转速 3000 r/min。惯性时间常数约是多少秒？（保留两位小数）
          answer: 4.93
          tolerance: 0.005
          unit: s
          hint: 先把转速换成机械角速度（rad/s），算出转子动能。
          explain: $\omega_{sm} = 3000 \times 2\pi/60 \approx 314.16$ rad/s，动能 $\frac12 \times 30000 \times 314.16^2 \approx 1.48 \times 10^9$ J，$H = 1.48 \times 10^9/(300 \times 10^6) \approx 4.93$ s。
      - card:
          title: 功角特性和稳定送电的上限
          body: |
            发电机内电动势 $E$ 经总电抗 $X$ 接到电压为 $V$ 的大电网，大到电压和频率不受这台机影响，叫**无穷大母线（infinite bus）**：$P_e = \frac{EV}{X}\sin\delta$，运行点在 $P_e = P_m$ 处。

            若 $\delta$ 稍有增大，$P_e$ 也增大、超过 $P_m$，转子减速，$\delta$ 回落，所以 $\delta < 90°$ 的运行点是稳定的。$\frac{dP_e}{d\delta} = \frac{EV}{X}\cos\delta$ 叫**整步功率系数（synchronizing power coefficient）**，大于 0 就静态稳定。$P_{max} = \frac{EV}{X}$ 是这台发电机能稳定送出的功率上限，运行时要留储备，用静态稳定储备系数 $K_p = \frac{P_{max} - P_0}{P_0}$ 衡量。
      - item:
          id: steady-angle
          type: number
          prompt: 发电机内电动势 1.2 pu，到无穷大母线（1 pu）的总电抗 0.5 pu，送出有功 1.0 pu。稳态功角约是多少度？（保留一位小数）
          answer: 24.6
          tolerance: 0.05
          unit: °
          hint: 先求功角特性的最大值，再解 $\sin\delta$。
          explain: $P_{max} = 1.2 \times 1/0.5 = 2.4$ pu，$\sin\delta_0 = 1/2.4$，$\delta_0 \approx 24.6°$。
      - item:
          id: stability-reserve
          type: number
          prompt: 一台发电机的功角特性最大值是 2.4 pu，正常送出 1.0 pu。静态稳定储备系数 $K_p$ 是多少？（填小数）
          answer: 1.4
          hint: 最大功率比正常送出的功率多出多少？这个余量占正常功率的几倍？
          explain: $(2.4 - 1)/1 = 1.4$，即 140%，远大于正常运行方式下一般要求的 15%–20%。
      - card:
          title: 小扰动下的振荡
          body: |
            在运行点附近线性化，$\Delta P_e = K_s\Delta\delta$，$K_s = P_{max}\cos\delta_0$ 是整步功率系数：

            $$\frac{2H}{\omega_s}\frac{d^2\Delta\delta}{dt^2} = -K_s\Delta\delta$$

            这和弹簧振子的方程一样，功角在运行点附近振荡，角频率 $\omega_n = \sqrt{\omega_sK_s/(2H)}$，一般在 1–2 Hz。阻尼绕组和电力系统稳定器（PSS）提供阻尼，让振荡衰减；阻尼不足时振荡会越来越大，叫低频振荡。
          reveal:
            - title: 第 1 步：求整步功率系数
              body: 例如 $H = 4$ s、$P_{max} = 2.0$ pu、$\delta_0 = 30°$：$K_s = 2.0\cos30° \approx 1.732$。
            - title: 第 2 步：求振荡角频率
              body: $\omega_n = \sqrt{314.16 \times 1.732/(2 \times 4)} \approx 8.25$ rad/s。
            - title: 第 3 步：换成频率
              body: $f_n = \omega_n/(2\pi) \approx 1.31$ Hz。
      - item:
          id: oscillation-frequency
          type: number
          prompt: 一台发电机 $H = 5$ s，接 50 Hz 无穷大母线，$P_{max} = 2.4$ pu，稳态功角 24.6°。小扰动下功角振荡的频率约是多少赫？（保留两位小数）
          answer: 1.32
          tolerance: 0.005
          unit: Hz
          hint: 整步功率系数是多少？它在振荡方程里像弹簧的什么？
          explain: $K_s = 2.4\cos24.6° \approx 2.18$，$\omega_n = \sqrt{314.16 \times 2.18/10} \approx 8.28$ rad/s，$f_n \approx 1.32$ Hz。
      - card:
          title: 提高静态稳定的措施
          body: |
            由 $P_{max} = EV/X$，提高这个功率上限有两个方向：一是减小发电机和电网之间的电抗，如用分裂导线、架设多回线路、提高电压等级、在线路上串联电容器抵消一部分电抗；二是提高 $E$、维持 $V$，靠快速的自动励磁调节器。

            运行时要留储备：正常运行方式下静态稳定储备系数一般要求不小于 15%–20%。
      - item:
          id: series-compensation
          type: number
          prompt: 发电机内电动势 1.2 pu，到无穷大母线（1 pu）的总电抗 0.5 pu，其中线路占 0.3 pu。在线路上串入容抗 0.1 pu 的电容器后，功角特性的最大值变为多少 pu？
          answer: 3
          hint: 串联电容器的容抗和线路的感抗是相加还是相减？
          explain: 总电抗 $0.5 - 0.1 = 0.4$ pu，$P_{max} = 1.2/0.4 = 3.0$ pu，提高了 25%。
  - id: transient-stability
    chapter: 电力系统稳定性
    title: 暂态稳定和等面积定则
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 发电机出口附近的线路发生三相短路，发电机送出的电功率突然降到接近 0，而汽轮机的机械功率来不及改变。转子会怎样？
          options:
            - text: 加速，功角增大
              correct: true
            - text: 减速，功角减小
              why: 机械功率大于电功率，多出来的功率使转子加速
            - text: 保持原来的转速
              why: 功率不平衡，转子一定会加速或减速
          explain: 机械功率不变而电功率骤减，转子加速，功角不断增大。故障切除得越晚，功角增大得越多。
      - card:
          title: 大扰动以后的过程
          body: |
            故障期间 $P_e$ 很小，$P_m > P_e$，转子加速，$\delta$ 增大；故障切除后 $P_e$ 回到较大的值、超过 $P_m$，转子开始减速，但它已经比同步转速快，$\delta$ 还会继续增大一段。

            如果转子减速到同步转速时，$\delta$ 还没有越过切除后功角特性上 $P_e = P_m$ 的第二个交点（约 $180° - \delta_0$），转子就会回摆，保持同步；越过了，$P_e$ 又小于 $P_m$，转子再次加速，失去同步。
      - item:
          id: clearing-later
          type: choice
          prompt: 同一个故障，切除时间从 0.1 s 推迟到 0.2 s。对暂态稳定有什么影响？
          options:
            - text: 更危险，切除时功角更大
              correct: true
            - text: 没有影响，故障总会被切除
              why: 切除前转子一直在加速，切除越晚积累的动能越多
            - text: 更安全，故障电流有时间衰减
              why: 故障电流衰减不会让转子少加速；电功率仍然小于机械功率
            - text: 更安全，切除时故障电流已经衰减，对转子的冲击小
              why: 决定转子加速的是机械功率和电功率之差，故障期间电功率一直很小，切除越晚转子加速越多
          explain: 切除越晚，加速面积越大，可用的减速面积越小。所以快速切除故障是提高暂态稳定最有效的办法。
      - card:
          title: 等面积定则
          body: |
            摇摆方程两边乘 $\frac{d\delta}{dt}$ 再积分，可以得到：转子相对同步转速的动能变化等于 $\int(P_m - P_e)d\delta$。转子从同步转速出发，到功角最远点又回到同步转速，加速得到的能量要等于减速释放的能量。在功角特性图上，加速面积 $A_1 = \int_{\delta_0}^{\delta_c}(P_m - P_{e,故障})d\delta$ 要等于减速面积 $A_2 = \int_{\delta_c}^{\delta_{max}}(P_{e,切除后} - P_m)d\delta$。

            可用的最大减速面积不小于加速面积，系统就暂态稳定，这叫**等面积定则（equal area criterion）**。
      - card:
          title: 例题：临界切除角
          body: 内电动势 1.2、总电抗 0.5、送出 1.0 pu（$P_{max} = 2.4$，$\delta_0 = 24.6°$）。发电机出口三相短路，故障期间 $P_e = 0$；切除后线路恢复，功角特性不变。求切除角最大能到多少。
          reveal:
            - title: 第 1 步：加速面积
              body: 故障期间 $P_e = 0$，$A_1 = P_m(\delta_c - \delta_0)$。
            - title: 第 2 步：最大可用减速面积
              body: 减速最远到 $\delta_m = 180° - \delta_0$，$A_2 = \int_{\delta_c}^{\delta_m}(P_{max}\sin\delta - P_m)d\delta = P_{max}(\cos\delta_c + \cos\delta_0) - P_m(\pi - \delta_0 - \delta_c)$。
            - title: 第 3 步：令两者相等
              body: $P_m(\delta_c - \delta_0) = P_{max}(\cos\delta_c + \cos\delta_0) - P_m(\pi - \delta_0 - \delta_c)$，两边的 $P_m\delta_c$ 消去，得 $P_{max}\cos\delta_c = P_m(\pi - 2\delta_0) - P_{max}\cos\delta_0$。再用 $P_m = P_{max}\sin\delta_0$ 除以 $P_{max}$：$\cos\delta_c = (\pi - 2\delta_0)\sin\delta_0 - \cos\delta_0$（角度用弧度）。
            - title: 第 4 步：代入数值
              body: $\delta_0 = 0.4298$ rad，$\cos\delta_c = 2.2820 \times 0.4167 - 0.9091 \approx 0.042$，$\delta_c \approx 87.6°$。切除时功角超过 87.6°，系统就会失步。这个角叫**临界切除角（critical clearing angle）**。
      - item:
          id: critical-angle
          type: number
          prompt: 一台发电机 $P_{max} = 2.4$ pu、送出 1.0 pu，出口三相短路期间电功率为 0，切除后功角特性恢复原样。临界切除角约是多少度？（保留一位小数）
          answer: 87.6
          tolerance: 0.05
          unit: °
          hint: 加速面积和最大可用减速面积各怎么写？两者相等的方程里只剩哪个未知数？
          explain: $\delta_0 \approx 24.6°$，$\cos\delta_c \approx 0.042$，$\delta_c \approx 87.6°$。
      - card:
          title: 临界切除时间
          body: |
            故障期间 $P_e = 0$ 时，摇摆方程可以直接积分：角加速度恒为 $\frac{\omega_sP_m}{2H}$，所以

            $$\delta = \delta_0 + \frac{\omega_sP_m}{4H}t^2$$

            功角到达 $\delta_c$ 的时间就是临界切除时间 $t_c = \sqrt{\frac{4H(\delta_c - \delta_0)}{\omega_sP_m}}$。继电保护和断路器必须在这之前把故障切除；高压电网的保护加断路器一般在 0.1 s 左右完成。
      - item:
          id: critical-time
          type: number
          prompt: 一台发电机 $H = 5$ s，接 50 Hz 无穷大母线，$P_m = 1.0$ pu，稳态功角 24.6°，按等面积定则求得的临界切除角是 87.6°，出口短路期间电功率为 0。临界切除时间约是多少秒？（保留两位小数）
          answer: 0.26
          tolerance: 0.005
          unit: s
          hint: 故障期间角加速度是常数吗？从同步转速出发匀加速，功角和时间是什么关系？
          explain: $\delta_c - \delta_0 \approx 63.0° \approx 1.099$ rad，$t_c = \sqrt{4 \times 5 \times 1.099/314.16} \approx 0.26$ s。
      - card:
          title: 逐步计算和提高暂态稳定的措施
          body: |
            一般情况下故障期间 $P_e$ 不为 0，又有很多台发电机，没有公式可用，就把摇摆方程分成很小的时间步长（如 0.01 s）逐步计算：每一步由 $P_m - P_e(\delta)$ 求角加速度，更新转速偏差，再更新功角，画出 $\delta$–$t$ 曲线。功角摆到最大后回落是稳定，一直增大是失步。

            提高暂态稳定的措施：快速切除故障，自动重合闸，汽轮机快关汽门，投入制动电阻，强行励磁，串联电容补偿，必要时切除部分发电机或负荷。
      - item:
          id: euler-step
          type: number
          prompt: 一台发电机 $H = 5$ s、50 Hz、$P_m = 1.0$ pu，故障期间电功率一直为 0。故障后 0.1 s 功角比故障前增大了约多少度？（保留一位小数）
          answer: 9
          tolerance: 0.05
          unit: °
          hint: 角加速度是多少 rad/s²？匀加速 0.1 s 走过多少弧度？
          explain: 角加速度 $\omega_sP_m/(2H) = 314.16/10 \approx 31.4$ rad/s²，$\Delta\delta = \frac12 \times 31.4 \times 0.1^2 \approx 0.157$ rad $= 9.0°$。

  # ==== 频率与电压控制 ====
  - id: frequency-control
    chapter: 频率与电压控制
    title: 频率和有功功率
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 用电负荷突然增加，发电机的机械功率还没来得及变。电网的频率会怎样？
          options:
            - text: 下降
              correct: true
            - text: 不变，频率由发电机决定
              why: 发电机的转速由功率平衡决定；负荷多出来的功率从转子动能里取，转子会变慢
            - text: 上升
              why: 负荷大于发电时转子减速，频率下降
          explain: 多出来的负荷先由所有转子的动能补上，转子变慢，频率下降。所以频率是全网有功是否平衡的指标。
      - card:
          title: 频率和有功平衡
          body: |
            一个交流电网里所有同步发电机同步旋转，频率处处相同。用电突然增加时，差额由所有转子的动能补上，转子变慢，频率下降；用电减少则频率上升。

            负荷本身也随频率变化：电动机类负荷在频率下降时取用的功率减小，$\Delta P_L = K_L\Delta f$。$K_L$ 叫负荷的频率调节效应系数，用标幺值（以负荷功率和额定频率为基准）表示时一般在 1–3。
      - card:
          title: 一次调频和调差系数
          body: |
            汽轮机或水轮机的调速器检测到转速（频率）下降，就开大汽门或导叶增加出力，这叫**一次调频（primary frequency control）**，几秒到几十秒内完成。出力增加量和频率下降量成正比，比例由**调差系数（droop）**$R$ 决定：

            $$R = -\frac{\Delta f/f_N}{\Delta P/P_N}$$

            式中的负号表示出力增加对应频率下降，$R$ 本身取正值。$R = 5\%$ 表示频率下降 5%（2.5 Hz）时，出力增加 100% 额定功率。机组的单位调节功率 $K_G = \frac{P_N}{Rf_N}$，单位 MW/Hz。
      - item:
          id: droop-response
          type: number
          prompt: 一台 1000 MW 机组调差系数 5%，50 Hz 系统频率下降 0.1 Hz。一次调频使它增发多少兆瓦？
          answer: 40
          unit: MW
          hint: 频率下降了额定频率的百分之几？除以调差系数得到出力的变化比例。
          explain: $\Delta P = \frac{0.1/50}{0.05} \times 1000 = 40$ MW，即单位调节功率 400 MW/Hz 乘 0.1 Hz。
      - card:
          title: 例题：负荷突增后的频率
          body: 一个系统的发电机组单位调节功率合计 400 MW/Hz；负荷 1000 MW，频率调节效应系数 1.5。负荷突然增加 100 MW，一次调频后频率下降多少？
          reveal:
            - title: 第 1 步：负荷的单位调节功率
              body: $K_L = K_{L*}\frac{P_L}{f_N} = 1.5 \times \frac{1000}{50} = 30$ MW/Hz。
            - title: 第 2 步：系统的单位调节功率
              body: 发电机增发和负荷自身减少一起弥补缺额：$K = K_G + K_L = 430$ MW/Hz。
            - title: 第 3 步：求频率偏差
              body: $\Delta f = -100/430 \approx -0.233$ Hz。发电机增发 $400 \times 0.233 \approx 93$ MW，负荷自己少用约 7 MW。
      - item:
          id: frequency-deviation
          type: number
          prompt: 一个系统的发电机组单位调节功率合计 800 MW/Hz，负荷的单位调节功率 60 MW/Hz。负荷突然增加 150 MW，一次调频后频率下降约多少赫？（保留三位小数）
          answer: 0.174
          tolerance: 0.0005
          unit: Hz
          hint: 缺额由哪两部分一起弥补？
          explain: $\Delta f = 150/(800 + 60) \approx 0.174$ Hz。
      - card:
          title: 二次调频
          body: |
            一次调频结束后，频率停在一个比 50 Hz 低的新值上，因为机组多发的出力是靠频率偏差维持的。要把频率拉回 50 Hz，由电网控制中心的自动发电控制（AGC）改变指定机组的出力设定值，叫**二次调频（secondary frequency control）**，几十秒到几分钟完成。

            互联电网里各区域按区域控制偏差 $ACE = \Delta P_{tie} + B\Delta f$ 调节，只负责弥补自己区域的功率缺额。我国大电网正常运行时频率偏差要求在 ±0.2 Hz 以内。
      - item:
          id: primary-not-enough
          type: choice
          prompt: 为什么一次调频不能把频率完全恢复到 50 Hz？
          options:
            - text: 多发的出力要靠频率偏差维持
              correct: true
            - text: 调速器动作太慢
              why: 一次调频几秒到几十秒就完成，问题不在快慢，而在有差调节
            - text: 负荷会随频率下降而减少
              why: 负荷的频率特性帮助减小频率偏差，但不是频率不能恢复的原因
            - text: 一次调频只有水电机组才参与
              why: 汽轮机和水轮机都有调速器，都参与一次调频
          explain: 调差特性是一条斜线：出力增加 $\Delta P$ 必须对应频率下降 $R\Delta P$。要零偏差，只能平移这条线，这就是二次调频。

  - id: voltage-control
    chapter: 频率与电压控制
    title: 电压和无功功率
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一座变电站的 10 kV 母线电压长期偏低。下面哪种办法最直接？
          options:
            - text: 在这条母线上投入并联电容器
              correct: true
            - text: 让远处的发电厂多发一些有功功率
              why: 高压电网里电压大小主要由无功决定，多发有功主要改变相角
            - text: 把电网频率调高一点
              why: 频率和电压分别由有功和无功决定，调频率不能解决电压低的问题
          explain: 电容器就地发出无功，减少线路和变压器上传输的无功，电压损耗随之减小。
      - card:
          title: 无功和电压
          body: |
            高压电网里电压大小主要由无功决定：$\Delta V \approx \frac{QX}{V}$。无功的用户是电动机、变压器的励磁和线路电抗上的 $I^2X$；来源是发电机、并联电容器、线路电容和静止无功补偿装置。某一地区无功不足，电压就低。

            和频率不同，各处电压不一样；无功也不宜远距离输送，会造成大的电压损耗和有功损耗，所以要分层分区、就地平衡。母线的短路容量 $S_k$ 越大，同样的无功引起的电压变化越小：$\frac{\Delta V}{V} \approx \frac{\Delta Q}{S_k}$。
      - item:
          id: capacitor-voltage
          type: number
          prompt: 一条 110 kV 母线的短路容量是 500 MVA，在它上面投入 10 Mvar 并联电容器。母线电压约升高多少千伏？
          answer: 2.2
          unit: kV
          hint: 投入的无功占这条母线短路容量的多大比例？电压变化的比例和它差不多。
          explain: $\Delta V/V \approx 10/500 = 2\%$，$110 \times 2\% = 2.2$ kV。
      - card:
          title: 调压的手段
          body: |
            - 发电机：调节励磁，改变机端电压和发出的无功；
            - 变压器分接头：改变变比，有载调压变压器可以带电调节（110 kV 常见 ±8 × 1.25%），配电变压器多是停电调节（±2 × 2.5%）；
            - 并联电容器和电抗器：电容器补无功、升电压，电抗器吸收线路多余的充电功率、降电压；
            - 静止无功补偿器（SVC）、静止同步补偿器（STATCOM）：用电力电子器件连续快速地调节无功；
            - 线路串联电容器：抵消一部分线路电抗，减小电压损耗。
      - item:
          id: capacitor-drawback
          type: choice
          prompt: 并联电容器发出的无功 $Q = V^2\omega C$。这给电压支撑带来什么问题？
          options:
            - text: 电压越低它发出的无功越少
              correct: true
            - text: 电压越低它发出的无功越多，会造成过电压
              why: $Q$ 和 $V^2$ 成正比，电压低时无功变少
            - text: 它吸收无功，电压越低吸收越多，会把电压拉得更低
              why: 电容器的电流超前电压，它发出无功；问题在于电压低时发得少
            - text: 它会吸收有功功率，增加损耗
              why: 理想电容器不消耗有功，实际损耗很小
          explain: 正需要支撑电压的时候，电容器的支撑反而减弱：电压跌落 10%，它的无功下降约 19%。STATCOM 的无功只受电流限制，和电压成正比下降，低电压时支撑更好。
      - card:
          title: 选择分接头
          body: 降压变压器高压侧额定 110 kV，低压侧额定 11 kV，有 $110 \pm 2 \times 2.5\%$ 五个分接头。最大负荷时高压母线 112 kV，变压器上的电压损耗折算到高压侧是 6 kV，希望低压母线 10.5 kV。应选哪个分接头？
          reveal:
            - title: 第 1 步：扣掉变压器的电压损耗
              body: 折算到高压侧的低压母线电压 $112 - 6 = 106$ kV。
            - title: 第 2 步：求需要的分接头电压
              body: 要让 106 kV 在低压侧变成 10.5 kV，分接头电压 $V_t = 106 \times \frac{11}{10.5} \approx 111.0$ kV。
            - title: 第 3 步：选最接近的标准分接头
              body: 五个分接头是 104.5、107.25、110、112.75、115.5 kV，111.0 kV 离 110 kV 最近，选主分接头。实际还要用最小负荷的情况再核对一次。
      - item:
          id: tap-voltage
          type: number
          prompt: 降压变压器低压侧额定 11 kV。最大负荷时高压母线 114 kV，变压器电压损耗折算到高压侧 8 kV，希望低压母线 10.5 kV。需要的分接头电压约是多少千伏？（保留一位小数）
          answer: 111.0
          tolerance: 0.05
          unit: kV
          hint: 先求折算到高压侧的低压母线电压，再按希望的低压电压和低压侧额定电压换算。
          explain: $(114 - 8) \times 11/10.5 = 106 \times 1.0476 \approx 111.0$ kV。
      - item:
          id: tap-limit
          type: choice
          prompt: 一个地区整体无功不足，电压普遍偏低。只靠调高各变电站变压器的分接头能解决吗？
          options:
            - text: 不能，分接头不产生无功
              correct: true
            - text: 能，分接头可以把电压调到任意值
              why: 调高低压侧电压会让负荷取用更多无功，缺口仍要由上一级电网补，上一级电压更低
            - text: 能，只要分接头的级数足够多
              why: 级数多只是调得更细，不改变无功总量不足的事实
            - text: 不能，因为分接头只能停电调节
              why: 有载调压变压器可以带电调节；真正的限制是它不产生无功
          explain: 分接头只是重新分配无功，调高低压侧电压会让上一级电网的电压更低。无功不足时必须增加无功电源（电容器、同步调相机即只发无功的空转同步电机、SVC 等）。分接头适合在无功充足时把电压分配合理。

  # ==== 经济调度 ====
  - id: economic-dispatch
    chapter: 经济调度
    title: 等微增率
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 两台燃煤机组一起承担 300 MW 负荷，费用曲线不同。怎样分配出力，总燃料费最少？
          options:
            - text: 让两台机组多发 1 MW 所多花的钱相等
              correct: true
            - text: 按两台机组的容量比例分配
              why: 容量比例和燃料费用没有直接关系；费用低的机组应多发
            - text: 让效率最高的那台先满发，剩下的给另一台
              why: 效率随出力变化，满发时多发 1 MW 的代价可能已经比另一台高
            - text: 两台平均分配
              why: 只有两台费用曲线完全相同时，平均分配才最省
          explain: 只要一台多发 1 MW 的代价比另一台低，就应把负荷挪给它，直到两者相等。这叫等微增率准则。
      - card:
          title: 耗量特性和微增率
          body: |
            燃料消耗量和出力的关系叫耗量特性，乘上燃料价格就得到每小时的燃料费用 $C$ 和出力 $P$ 的关系，常用二次函数 $C = aP^2 + bP + c$ 拟合，叫费用特性。多发 1 MW 每小时多花的钱

            $$\frac{dC}{dP} = 2aP + b$$

            叫**微增率（incremental cost）**，单位元/MWh。二次项系数 $a > 0$，出力越大微增率越高。
      - item:
          id: incremental-cost
          type: number
          prompt: 一台机组的费用特性 $C = 0.01P^2 + 10P$（元/h，$P$ 以 MW 计）。出力 200 MW 时的微增率是多少元/MWh？
          answer: 14
          unit: 元/MWh
          hint: 微增率是费用对出力的导数。
          explain: $\frac{dC}{dP} = 0.02P + 10 = 14$ 元/MWh：此时多发 1 MW，每小时多花 14 元。
      - card:
          title: 等微增率准则
          body: |
            总负荷 $P_D$ 一定，要让 $\sum C_i$ 最小。如果机组 1 的微增率比机组 2 低，把 1 MW 从机组 2 挪给机组 1，总费用就下降；一直挪到两者相等为止。所以最优分配满足

            $$\frac{dC_1}{dP_1} = \frac{dC_2}{dP_2} = \cdots = \lambda,\qquad \sum P_i = P_D$$

            叫**等微增率准则（equal incremental cost criterion）**。把约束乘一个系数 $\lambda$ 加进总费用、再对各 $P_i$ 求导令其为 0，也得到同样的式子。$\lambda$ 是全系统再多供 1 MW 负荷要多花的钱，叫系统边际成本。
      - card:
          title: 例题：两台机组的经济分配
          body: $C_1 = 0.01P_1^2 + 10P_1$，$C_2 = 0.02P_2^2 + 8P_2$（元/h，$P$ 以 MW 计），总负荷 300 MW，忽略网损。
          reveal:
            - title: 第 1 步：写出微增率
              body: $\frac{dC_1}{dP_1} = 0.02P_1 + 10$，$\frac{dC_2}{dP_2} = 0.04P_2 + 8$。
            - title: 第 2 步：列方程
              body: $0.02P_1 + 10 = 0.04P_2 + 8$，$P_1 + P_2 = 300$。
            - title: 第 3 步：解出分配和边际成本
              body: 代入 $P_2 = 300 - P_1$：$0.02P_1 + 10 = 20 - 0.04P_1$，$P_1 \approx 166.7$ MW，$P_2 \approx 133.3$ MW，$\lambda \approx 13.33$ 元/MWh。
      - item:
          id: dispatch-p1
          type: number
          prompt: $C_1 = 0.01P_1^2 + 10P_1$，$C_2 = 0.02P_2^2 + 8P_2$（元/h），总负荷 300 MW，忽略网损和出力限制。按等微增率，机组 1 应发多少兆瓦？（保留一位小数）
          answer: 166.7
          tolerance: 0.05
          unit: MW
          hint: 两台的微增率相等，出力之和等于负荷。
          explain: $0.02P_1 + 10 = 0.04(300 - P_1) + 8$，$0.06P_1 = 10$，$P_1 \approx 166.7$ MW。
      - item:
          id: dispatch-lambda
          type: number
          prompt: $C_1 = 0.02P_1^2 + 6P_1$，$C_2 = 0.03P_2^2 + 5P_2$（元/h），总负荷 400 MW，忽略网损和出力限制。系统边际成本是多少元/MWh？
          answer: 15.2
          unit: 元/MWh
          hint: 先按等微增率求出一台机组的出力，再代回它的微增率。
          explain: $0.04P_1 + 6 = 0.06(400 - P_1) + 5$，$0.1P_1 = 23$，$P_1 = 230$ MW，$\lambda = 0.04 \times 230 + 6 = 15.2$ 元/MWh。
      - card:
          title: 出力限制、网损和最优潮流
          body: |
            机组有出力上下限。按等微增率算出的某台机组超过上限时，就把它固定在上限，剩下的负荷由其他机组再按等微增率分配。

            考虑网损时，离负荷远的机组多发 1 MW，送到负荷的不到 1 MW，要乘一个大于 1 的网损修正系数 $\frac{1}{1 - \partial P_{loss}/\partial P_i}$ 再比较微增率。再把线路容量、母线电压等网络约束都加进去，在潮流方程的约束下求总费用最小，叫最优潮流。
      - item:
          id: dispatch-limit
          type: number
          prompt: $C_1 = 0.01P_1^2 + 10P_1$，$C_2 = 0.02P_2^2 + 8P_2$（元/h），总负荷 300 MW，忽略网损。机组 1 的出力上限是 150 MW。系统边际成本是多少元/MWh？
          answer: 14
          unit: 元/MWh
          hint: 不受限时机组 1 应发多少？超过上限时它固定在哪里？剩下的负荷由谁承担？
          explain: 不受限时机组 1 要发 166.7 MW，超过上限，固定在 150 MW；机组 2 发 150 MW，边际成本由机组 2 决定：$0.04 \times 150 + 8 = 14$ 元/MWh。

  # ==== 新能源并网概述 ====
  - id: renewables-integration
    chapter: 新能源并网概述
    title: 新能源并网
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一座光伏电站通过逆变器（把直流电变成交流电的装置）并网。电网频率突然下降时，它会像同步发电机那样自动释放转子的动能来减缓频率下降吗？
          options:
            - text: 不会，它没有转子
              correct: true
            - text: 会，所有发电设备都会
              why: 同步发电机的转子和电网频率直接耦合，光伏和逆变器没有转动部分
            - text: 会，而且比同步发电机更快
              why: 逆变器可以很快地改变输出，但只有按需要专门设计的控制才会这样做
          explain: 变流器并网的电源本身不提供转动惯量，除非专门设计控制让它模拟这种响应。它们越多，扰动后频率下降得越快。
      - card:
          title: 风电机组的类型
          body: |
            - 定速异步机组：鼠笼感应发电机经齿轮箱直接并网，转速几乎不变，要从电网吸收无功，靠电容器补偿；
            - 双馈机组：绕线转子感应发电机，定子直接并网，转子经一台容量约为额定功率三分之一的**变流器（power converter）**（用电力电子开关在交流和直流、或不同频率的交流之间变换电能的装置）接电网，转速可以在同步转速上下约 30% 范围内变化；
            - 永磁直驱机组：多极永磁同步发电机不用齿轮箱，发出的变频交流经全功率变流器整流再逆变后并网。
      - item:
          id: wind-types
          type: match
          prompt: 把每种风电机组和它的并网方式配对。
          pairs:
            - [定速异步机组, 发电机定子直接并网，转速几乎不变]
            - [双馈机组, 定子直接并网，转子经部分功率变流器]
            - [永磁直驱机组, 全部功率经变流器整流再逆变]
          explain: 变流器承担的功率越多，机组和电网的电气联系越“软”，转速越能自由变化，但对电网的惯量支撑越少。
      - item:
          id: dfig-converter
          type: choice
          prompt: 双馈风电机组的变流器为什么只需要额定功率的三分之一左右？
          options:
            - text: 变流器只处理转子回路的转差功率
              correct: true
            - text: 风电机组大多数时间只发三分之一的额定功率
              why: 变流器要按最大工况设计；容量小是因为它只处理转子回路的功率
            - text: 定子直接并网后，转子不需要任何功率
              why: 转子要吸收或送出转差功率，正是这部分功率经过变流器
            - text: 三分之一是电网标准规定的
              why: 这个比例由转速变化范围决定，不是标准规定
          explain: 转子回路的功率约等于转差率乘定子功率，转速在同步转速上下 30% 内变化时转差率在 ±0.3 以内，变流器容量约为三成。
      - card:
          title: 光伏和变流器并网
          body: |
            光伏电池发的是直流，经逆变器并网。逆变器一边跟踪光伏阵列的最大功率点，一边用锁相环测出电网电压的相位，按它注入电流，这种工作方式叫跟网型。储能电池也通过变流器接入电网。

            变流器电源没有转动的转子，和电网之间没有机械的同步关系，它的输出完全由控制决定。
      - card:
          title: 系统惯量下降
          body: |
            扰动刚发生的瞬间，频率下降的快慢只由全网转子的动能决定：

            $$\frac{df}{dt} = -\frac{\Delta Pf_0}{2H_{sys}S_{sys}}$$

            同步发电机被变流器电源替代，系统惯性时间常数 $H_{sys}$ 变小，同样的功率缺额下频率掉得更快、最低点更低，可能在一次调频起作用之前就触发低频减载（频率低于整定值时按事先排好的顺序自动切除部分负荷）。

            对策：让变流器模拟惯量响应（虚拟惯量）、用储能快速调频、用**构网型变流器（grid-forming converter）**像同步机那样自己建立电压和频率、保留或新建同步调相机。
      - item:
          id: rocof
          type: number
          prompt: 一个 50 Hz 电网总容量 10 GW，系统惯性时间常数 5 s。一台 500 MW 机组突然跳闸，频率开始下降时每秒约下降多少赫？
          answer: 0.25
          unit: Hz/s
          hint: 代入频率变化率的公式，注意容量的单位统一。
          explain: $\frac{df}{dt} = -\frac{500 \times 50}{2 \times 5 \times 10000} = -0.25$ Hz/s。惯性时间常数降到 2.5 s，下降就快一倍，0.5 Hz/s。
      - card:
          title: 低电压穿越和储能
          body: |
            电网短路时电压骤降，早期的风电机组会马上脱网，又加重了功率缺额。现在的并网标准要求新能源电站在电压跌落时、在规定的时间内不脱网，并向电网送出无功电流支撑电压，叫**低电压穿越（low voltage ride-through）**。

            风电和光伏随天气波动，还需要抽水蓄能、电池储能和风光互补来平抑出力的变化。
      - item:
          id: lvrt-why
          type: choice
          prompt: 为什么并网标准要求风电、光伏电站具备低电压穿越能力？
          options:
            - text: 大量电站同时脱网会扩大功率缺额
              correct: true
            - text: 为了保护风电机组自己的变流器
              why: 保护自己最简单的办法正是脱网；标准要求的是为电网着想而不脱网
            - text: 为了在电压跌落时多送有功电流，把频率撑住
              why: 标准要求送出的主要是无功电流，用来支撑电压；这时有功往往还要减少
            - text: 低电压时新能源的效率更高
              why: 电压跌落时它们发出的功率往往还要减少，以便送出无功电流
          explain: 一次短路会让很大范围的电压同时下降，大量新能源同时脱网会把一次故障扩大成大停电。如果这些电站都脱网，故障切除后系统突然少了大量电源，频率会急剧下降。
boss:
  items:
    - id: b-per-unit
      type: number
      prompt: 一条 220 kV 线路长 100 km，每公里电抗 0.4 Ω。取 $S_B = 100$ MVA、$V_B = 220$ kV，线路电抗的标幺值约是多少？（保留四位小数）
      answer: 0.0826
      tolerance: 0.00005
      hint: 基准阻抗由哪两个基准值算出？
      explain: $Z_B = 220^2/100 = 484$ Ω，$X = 40$ Ω，$X_{pu} = 40/484 \approx 0.0826$。
    - id: b-ferranti
      type: number
      prompt: 一条无损架空线路每公里电抗 0.4 Ω、电纳 $2.8 \times 10^{-6}$ S，长 300 km，末端空载。末端电压是首端的多少倍？（保留三位小数）
      answer: 1.053
      tolerance: 0.001
      hint: 空载时首端电压和末端电压之比是什么？
      explain: $\beta l = \sqrt{0.4 \times 2.8 \times 10^{-6}} \times 300 \approx 0.317$ rad，$1/\cos0.317 \approx 1.053$。
    - id: b-power-angle
      type: number
      prompt: 母线 1 电压 1.05 pu、母线 2 电压 1.0 pu，中间线路电抗 0.3 pu（忽略电阻），母线 1 向母线 2 送有功 1.5 pu。两端电压的相角差约是多少度？（保留一位小数）
      answer: 25.4
      tolerance: 0.05
      unit: °
      hint: 有功由相角差推动，最大能送多少？
      explain: $\sin\delta = 1.5 \times 0.3/(1.05 \times 1.0) \approx 0.4286$，$\delta \approx 25.4°$。
    - id: b-bus-type
      type: choice
      prompt: 潮流计算中，一座装有自动励磁调节器、按计划发有功的发电厂母线，通常当作哪类节点？
      options:
        - text: PV 节点
          correct: true
        - text: PQ 节点，因为它的有功按计划、励磁也是确定的
          why: 励磁调节器维持的是电压，无功随系统变化，事先不知道，所以不给定 $Q$
        - text: 平衡节点，因为它是一座发电厂
          why: 全网只需要一个平衡节点承担网损；按计划发有功的电厂有功已经给定
        - text: 设成平衡节点或 PV 节点都一样
          why: 设成平衡节点意味着它的有功不按计划，而要补足网损，和按计划发电不符
      explain: 有功出力和电压幅值已知、无功和相角待求，这正是 PV 节点。
    - id: b-dc-flow
      type: number
      prompt: 用直流潮流计算：母线 1 到母线 3 有两条并联路径，一条是电抗 0.2 pu 的线路，另一条是经过母线 2 的两段线路（各 0.1 pu），母线 2 没有负荷和发电。母线 3 负荷 1.2 pu，全部由母线 1 供给。直接线路上的有功是多少 pu？
      answer: 0.6
      hint: 两条路径的总电抗各是多少？
      explain: 两条路径的电抗都是 0.2 pu，功率平分，各 0.6 pu。
    - id: b-three-phase
      type: number
      prompt: 取 $S_B = 100$ MVA、$V_B = 220$ kV。某 220 kV 母线的系统等值正序阻抗是 $j0.04$ pu，故障前电压 1 pu。三相短路电流约是多少千安？（保留两位小数）
      answer: 6.56
      tolerance: 0.005
      unit: kA
      hint: 标幺短路电流乘这个电压等级的基准电流。
      explain: $I_f = 25$ pu，$I_B = 100/(\sqrt3 \times 220)$ kA $\approx 0.2624$ kA，$I_f \approx 6.56$ kA。
    - id: b-slg
      type: number
      prompt: 某母线 $Z_1 = Z_2 = j0.1$、$Z_0 = j0.05$ pu，故障前电压 1 pu，金属性单相接地。故障电流是多少 pu？
      answer: 12
      hint: 单相接地时三个序网络怎样连接？
      explain: $I_1 = 1/(0.1 + 0.1 + 0.05) = 4$ pu，$I_a = 12$ pu，比三相短路的 10 pu 还大，因为零序阻抗小于正序阻抗。
    - id: b-ll
      type: number
      prompt: 某母线 $Z_1 = Z_2 = j0.12$ pu，故障前电压 1 pu，发生两相短路（不接地）。故障相电流约是多少 pu？（保留两位小数）
      answer: 7.22
      tolerance: 0.005
      hint: 两相短路时哪两个序网络参与？故障相电流是正序电流的几倍？
      explain: $I_1 = 1/0.24 \approx 4.167$ pu，$I_b = \sqrt3 \times 4.167 \approx 7.22$ pu。
    - id: b-critical-angle
      type: number
      prompt: 一台发电机内电动势 1.1 pu，到无穷大母线（1 pu）的总电抗 0.5 pu，送出 1.1 pu。出口三相短路期间电功率为 0，切除后功角特性恢复原样。临界切除角约是多少度？（保留一位小数）
      answer: 79.6
      tolerance: 0.05
      unit: °
      hint: 先求功角特性的最大值和稳态功角，再用等面积定则。
      explain: $P_{max} = 2.2$，$\sin\delta_0 = 0.5$，$\delta_0 = 30°$；$\cos\delta_c = (\pi - \pi/3) \times 0.5 - \cos30° \approx 0.181$，$\delta_c \approx 79.6°$。
    - id: b-droop
      type: number
      prompt: 一台 600 MW 机组调差系数 4%，50 Hz 系统频率下降 0.2 Hz。一次调频使它增发多少兆瓦？
      answer: 60
      unit: MW
      hint: 频率下降了额定频率的几分之几？出力变化的比例是它的几倍？
      explain: $\Delta P = \frac{0.2/50}{0.04} \times 600 = 60$ MW。
    - id: b-voltage
      type: choice
      prompt: 高压电网里，下面哪一种说法是对的？
      options:
        - text: 频率主要由有功平衡决定，电压主要由无功平衡决定
          correct: true
        - text: 频率和电压都主要由有功平衡决定
          why: 线路电抗远大于电阻，电压损耗主要来自无功 $QX/V$
        - text: 频率主要由无功平衡决定，电压主要由有功平衡决定
          why: 有功不平衡改变转子转速，也就是频率；无功不平衡改变电压
        - text: 电压由发电机决定，和负荷无关
          why: 负荷取用的无功越多，线路和变压器上的电压损耗越大，电压越低
      explain: 有功不平衡由转子动能补偿，表现为频率变化；无功不平衡表现为电压变化，而且各处不同，要就地平衡。
    - id: b-dispatch
      type: number
      prompt: $C_1 = 0.015P_1^2 + 9P_1$，$C_2 = 0.025P_2^2 + 7P_2$（元/h，$P$ 以 MW 计），总负荷 400 MW，忽略网损和出力限制。系统边际成本是多少元/MWh？
      answer: 15.75
      tolerance: 0.005
      unit: 元/MWh
      hint: 两台的微增率相等，出力之和等于负荷。
      explain: $0.03P_1 + 9 = 0.05(400 - P_1) + 7$，$0.08P_1 = 18$，$P_1 = 225$ MW，$\lambda = 0.03 \times 225 + 9 = 15.75$ 元/MWh。
    - id: b-rocof
      type: number
      prompt: 一个 50 Hz 电网总容量 20 GW，系统惯性时间常数 3 s。一座 1000 MW 电站突然跳闸，频率开始下降时每秒约下降多少赫？（保留两位小数）
      answer: 0.42
      tolerance: 0.005
      unit: Hz/s
      hint: 频率下降的快慢和功率缺额成正比，和什么成反比？
      explain: $\frac{1000 \times 50}{2 \times 3 \times 20000} \approx 0.42$ Hz/s。
