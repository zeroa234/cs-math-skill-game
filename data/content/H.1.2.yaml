skill: H.1.2
version: 2
authors: [main-agent]
brief:
  why: |
    电脑芯片里其实根本没有物理意义上的“数字 0 和 1”，只有起起落落的电压。工程师靠噪声容限在连续电压里划出可靠的离散边界，再把成千上万只晶体管搭成逻辑门、卡诺图化简电路、全加器、D 触发器、有限状态机和带时序约束的流水线。这一关从 0 V 到主频 MHz，带你亲手搭出数字计算机的底层骨架。
  outcomes:
    - 理解二进制电压区间抽象、电压传输特性（VTC）与上下噪声容限计算，区分模拟波动与有效数字范围
    - 掌握 MOSFET/CMOS 互补开关原理、最小项与或式、卡诺图化简、纯与非（NAND）门实现、多路选择器、ROM 与全加器/超前进位
    - 区分电平敏感的 D 锁存器与边沿采样的 D 触发器，设计并验证可重叠检测序列的 Mealy/Moore 有限状态机及等价状态合并
    - 掌握异步跨时钟域亚稳态与双级同步器风险边界，精确核对建立时间（t_setup）求最大频率与保持时间（t_hold）最早路径防违例
    - 区分污染延迟与传播延迟、单件延迟与稳态吞吐率（流水线与交错复用），理解无全局时钟时的请求/应答自定时握手协议
terms:
  - term: 二进制
    def: '只用 0（低电压代表假）与 1（高电压代表真）两种离散符号编码表示所有信息的记数方式'
  - term: 布尔
    def: '只取真（1）与假（0）两种逻辑值，并按与、或、非规则进行推演的代数系统'
  - term: 组合逻辑
    def: '稳定后的输出完全、仅仅由当前这一刻有效输入决定的无记忆数字电路'
  - term: 电压传输特性
    def: '英文简称 VTC，刻画器件输入电压从低扫到高时，稳态输出电压随之变化的曲线关系'
  - term: 锁存器
    def: '在使能控制信号保持有效电平期间，输出像透明玻璃一样随时紧跟输入 D 变化、撤掉使能后才锁住旧值的存储元件'
  - term: 触发器
    def: '只在时钟信号的指定跳变瞬间（如上升沿）对输入 D 采样一次并稳稳锁存到下个时钟沿的边沿存储元件'
  - term: 寄存器
    def: '由一组共享同一时钟信号的触发器并排组成、用于同时保存多位状态的同步数字存储部件'
  - term: 有限状态机
    def: '简称 FSM，用有限个离散状态记住过往有用历史，按当前状态和输入决定下一状态与输出的控制模型'
  - term: 亚稳态
    def: '采样时刻数据没能在规定窗口保持稳定，导致触发器内部一时卡在既非 0 也非 1 的中间未决晃动状态'
  - term: 流水线
    def: '在较长组合逻辑中间插入寄存器分段，让多个不同先后输入在同一拍里各自在不同阶段并行重叠推进的技术'

lessons:
  # ==== 布尔代数 ====
  - id: signals
    chapter: 布尔代数
    title: 离散电压抽象、二进制编码与组合逻辑约定
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一根传向芯片引脚的电线上，刚刚测到 `0.1 V`，过了一会儿由于旁边风扇启动干扰抖动到了 `0.2 V`。数字电路会因为这 `0.1 V` 的微小波动就认为“数字彻底变成别的值”了吗？
          options:
            - text: 不会。数字系统用“合法的低电平电压区间和高电平电压区间”代表 0 和 1，只要都落在低电平规定区里就照样稳定认成 `0`
              correct: true
            - text: 会。电压只要哪怕抖动 `0.001 V`，数字系统就必定立刻当成全新不同字母
              why: 真实电路永远存在热噪声和电磁波动，强求精确到小数点后五位等于 0.000 V 根本造不出芯片。
            - text: 任何电压无论多少伏都永远只能表示数字 `5`
              why: 数字器件按低区和高区两大范围来识别 `0` 与 `1`
          explain: |
            用“连续电压中的两段安全区间”来代表抽象符号，正是数字电路能抗干扰、把亿万个晶体管稳稳串起来的魔法第一课。
      - card:
          title: 二进制编码与连续电压的数字范围抽象
          body: |
            真实电信号（比如声音波形或温度测量电压）是连续变化的模拟量；而数字计算机把它抽象成只取 `0` 和 `1` 两种符号的**二进制（Binary）**信息：
            - `1` 根独立电线有 `2` 种状态（`0` 或 `1`）；`n` 根线并排共有 **$2^n$ 种不同编码组合**（例如 `2` 根线编码 `00, 01, 10, 11` 共 `4` 种）；
            - **区间换取抗噪能力**：工程上规定例如 `0 V ~ 0.8 V` 一律视作有效输入 `0`，`2.0 V ~ 3.3 V` 一律视作有效输入 `1`——中间那段禁止踩进去。
          reveal:
            - title: 为什么千万不能让信号长期停在中间“既不算 0 也不算 1”的禁区？
              body: |
                因为器件手册只承诺当输入满足有效 `0` 或有效 `1` 时输出才符合逻辑真值；若输入长期滞留中间灰色地带（例如 `1.4 V`），门电路内部开关半开半关不仅会发热耗电，输出电压也没有任何逻辑保证。
      - card:
          title: 组合逻辑器件的四条纪律
          body: |
            **组合逻辑（Combinational Logic）**是最纯粹的无记忆功能单元：
            1. 只要所有输入端稳定停在合法数字电压范围里，经过一定传播延迟后，输出端必定稳定给出只由当下这组输入决定的唯一结果（绝不偷偷受昨天旧输入影响）；
            2. 当输入端跨越未定义中间地带切换时，器件规范允许输出在稳定前短暂抖动，不对外作行为保证；
            3. 各逻辑子电路只要输出范围能稳稳落进下级的合法输入范围，就能像积木一样级联拼成大型计算器。
          reveal:
            - title: 为什么单单“没有内部记忆”会让电路好设计这么多？
              body: |
                因为检验一块纯组合算子对不对，只需要拿输入电压扫遍真值表的每一行即可——只要给定相同的输入组合，无论昨天跑过什么算式、通电一分钟还是十小时，它吐出的稳态电压必然一模一样，彻底把复杂时间因素从单级计算里剥离出去。
      - item:
          id: binary-combos-3bits
          type: number
          prompt: |
            用 `3` 根互相独立的数字信号线并排传输二进制编码，一共能表示多少种互不相同的编码组合？
          answer: 8
          hint: '每根线有 `0` 与 `1` 两种可能，$2 \times 2 \times 2 = 2^3$。'
          explain: |
            $2^3 = 8$ 种（`000` 到 `111`），多加 1 根线编码容量立刻翻倍。
      - item:
          id: undefined-zone-rule
          type: choice
          prompt: |
            某数字逻辑芯片说明书写明：有效低电平输入不超过 `0.8 V`，有效高电平输入至少 `2.0 V`。某时刻测量到输入引脚卡在 `1.3 V` 未规定区。以下判断哪个科学严谨？
          options:
            - text: 仅靠数字逻辑规范无法保证输出端会给出确定的 0 或 1
              correct: true
            - text: 1.3 V 比较靠近 0.8 V，所以所有兼容芯片都会把它统一判定为稳定的逻辑 0
              why: 落在中间未定义禁区时，不同批次温度下的器件行为都不受数字规格保障
            - text: 芯片会自动把 1.3 V 当成数字 2 输出
              why: 二进制逻辑器件只工作在 0/1 两级抽象下，进入禁区后行为不可预测
          explain: |
            数字抽象的保证建立在“守规矩把输入电压送进有效 0/1 区间”的前提之上。
      - item:
          id: combinational-def-choice
          type: choice
          prompt: |
            如果一个黑盒芯片昨天曾算过 `1 + 1 = 2`，今天把输入引脚重新固定接回 `0` 和 `0`，它还是一个合格的**组合逻辑**器件的话，稳定后输出应该取决于什么？
          options:
            - text: 仅仅取决于今天此刻接在输入引脚上的当前输入 `0` 和 `0`，不受昨天任何历史残留影响
              correct: true
            - text: 一半看今天输入，另一半看昨天下午三点那次计算留下的余数
              why: 依靠过去历史决定输出的电路叫时序逻辑；组合逻辑必须无记忆
            - text: 每天输出必须随机变化一次
              why: 只要今天输入组合完全一致，稳定后的组合输出必须确定唯一
          explain: |
            记住**组合逻辑 = 无记忆、纯由当前输入唯一确定输出**。

  - id: vtc
    chapter: 布尔代数
    title: 电压传输特性（VTC）与上下噪声容限计算
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            左边的发送芯片承诺：“我输出数字 0 时，电压绝对不超过 `0.4 V`”；右边的接收芯片承诺：“只要收到的电压不超过 `0.8 V`，我都老实认成数字 0”。如果连线穿过电路板时混进了 `0.25 V` 的电压噪声抬高，接收端还能认准 `0` 吗？
          options:
            - text: 能。最坏情况是 `0.4 + 0.25 = 0.65 V`，依然不超过接收门限 `0.8 V`，还留着余量呢。
              correct: true
            - text: 不能，只要电线上沾了任何 `0.01 V` 噪声立刻全盘认错成 1
              why: 发送承诺上限 0.4 V 和接收容忍上限 0.8 V 之间留出了整整 0.4 V 的抗噪声缓冲空间。
            - text: 这两条线压根不能连在一起
              why: 正是因为发送输出范围严于接收要求范围，串联起来才极其抗干扰
          explain: |
            发送方要更“严格自律”（输出低必须更低、输出高必须更高），接收方要更“宽容大度”（允许一定范围误差）——中间留出来的缓冲带就是**噪声容限**。
      - card:
          title: 电压传输特性（VTC）与四个核心电压门槛
          body: |
            **电压传输特性（Voltage Transfer Characteristic, VTC）**画出了一个器件输入电压 $V_{in}$ 从低到高连续变化时，稳态输出电压 $V_{out}$ 的响应曲线（例如反相器：输入低时输出靠近供电高电平，跨过陡峭过渡区后输入高时输出靠近 `0 V`）。
            芯片手册由此定下四个生死线：
            - **输出承诺范围**：发 `0` 至多 $V_{OL}$；发 `1` 至少 $V_{OH}$；
            - **输入接收门槛**：认 `0` 至多 $V_{IL}$；认 `1` 至少 $V_{IH}$。
          reveal:
            - title: 高低电平噪声容限公式（记住“接收更宽 − 发送更严”）
              body: |
                为了让发送芯片连到接收芯片时不惧导线噪声：
                - **低电平噪声容限**：$NM_L = V_{IL} - V_{OL}$（例如 $0.8 - 0.4 = 0.4\text{ V}$）；
                - **高电平噪声容限**：$NM_H = V_{OH} - V_{IH}$（例如 $2.4 - 2.0 = 0.4\text{ V}$）。
                只要算出来是正数且越大，电路越抗干扰；哪怕有一项变成**负数**，两块芯片连起来就不安全。
            - title: 为什么叫“静态再生纪律”？噪声会被无限滚雪球放大吗？
              body: |
                不会滚雪球。因为只要前级输出电压配合导线压降仍落在接收端合法区间（例如不超过 $V_{IL}$），这一级逻辑门靠着陡峭的 VTC 增益特性，会把输出重新稳稳拉回紧贴标准电源 `VDD` 或 `0 V` 的干净区域，就像每一站都把脏信号“漂白重整”一次。
      - item:
          id: nml-calc-num
          type: number
          prompt: |
            某系列芯片规定低电平最大保证输出 $V_{OL} = 0.3\text{ V}$，接收端能识别为低电平的最大输入上限 $V_{IL} = 0.8\text{ V}$。它的低电平噪声容限是多少伏（填小数）？
          answer: 0.5
          hint: '用接收门槛减去发送上限：$NM_L = V_{IL} - V_{OL}$。'
          explain: |
            $0.8 - 0.3 = 0.5\text{ V}$，说明低电平传输途中最高能抗住 `0.5 V` 的正向毛刺噪声。
      - item:
          id: nmh-calc-num
          type: number
          prompt: |
            继续核对高电平边界：发送端高电平最低输出承诺 $V_{OH} = 2.4\text{ V}$，接收端高电平最低识别门槛 $V_{IH} = 2.0\text{ V}$。高电平噪声容限（即电压最多掉下去多少伏仍不认错）是多少伏？
          answer: 0.4
          hint: '用最低发送高电压减去最低接收识别门槛：$NM_H = V_{OH} - V_{IH}$。'
          explain: |
            $2.4 - 2.0 = 0.4\text{ V}$，两项噪声容限都为正，满足兼容准则。
      - item:
          id: vtc-gain-why
          type: choice
          prompt: |
            观察一个优质反相器的 **VTC（电压传输特性）** 曲线：为什么工程师希望中间反转过渡区越陡峭（高增益放大区越窄）越好？
          options:
            - text: 陡峭过渡区能在中间留出最小的不确定灰色地带，同时为高、低两端腾出更宽大的上下噪声容限
              correct: true
            - text: 为了让输出永远卡死在 1.5 V 不动弹
              why: 恰恰相反：陡峭开关特性让输出迅速从高跳到低，几乎不留在中间区
            - text: 为了让芯片彻底丧失任何抗干扰能力
              why: 陡峭 VTC 与高增益正是再生出清晰 0/1 电平、把前级噪声“擦干净”的关键。
          explain: |
            数字门每过一级就靠陡峭 VTC 把前级带来的毛刺噪声还原整形，所以叫“静态再生（Static Discipline）”。
      - item:
          id: compat-negative-margin
          type: choice
          prompt: |
            芯片 A 输出高电平保证至少 $V_{OH} = 2.1\text{ V}$，芯片 B 要求高电平至少 $V_{IH} = 2.5\text{ V}$ 才肯认成 `1`。不加电平转换电路能直接把 A 接到 B 上使用吗？
          options:
            - text: 不能。高电平噪声容限 $2.1 - 2.5 = -0.4\text{ V}$ 是负数，A 合法输出的 2.2 V 传过去直接被 B 当成不确定区报错
              correct: true
            - text: 完全可以，反正 2.1 和 2.5 都是正数就行
              why: 必须保证发送底线高于接收门槛（容限大于零）才兼容
            - text: 连上去以后电线会自动替你升高 0.4 V
              why: 导线只会损耗压降或引入噪声，不可能无中生有抬稳高电平
          explain: |
            接口前先用四项门槛做减法算容限，负容限直接一票否决。

  - id: truth
    chapter: 布尔代数
    title: 常用逻辑门、布尔规则与最小项“积之和”
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一间实验室门禁规则规定：**必须“刷了门卡（A=1）”并且“输对了密码（B=1）”两个条件同时满足**才打开门锁。当只刷了门卡没输密码（即输入 `A=1, B=0`）时，门会开吗？
          options:
            - text: 不会打开（输出 `0`），只有 `A=1` 且 `B=1` 同时成立时才输出 `1`
              correct: true
            - text: 会打开（输出 `1`），因为只要满足一个条件就够了
              why: 同时满足属于“与（AND）”逻辑，只要有一个为假结果就是假
            - text: 永远随机乱开
              why: 逻辑规则对每组固定输入都有唯一确定真假结果
          explain: |
            用值 `0` 和 `1` 配合 **AND（与）、OR（或）、NOT（非）、XOR（异或）** 这些基础积木，就能把任何规则刻画进真值表，再机械地翻成通用“积之和”电路。
      - card:
          title: 六种高频逻辑门与布尔规则
          body: |
            **布尔**逻辑只取真（`1`）和假（`0`）两种离散值，最常用的基础逻辑门（设输入 $A, B \in \{0, 1\}$）：
            - **与门（AND，$A \cdot B$）**：全 `1` 才 `1`，有 `0` 就 `0`；
            - **或门（OR，$A + B$）**：有 `1` 就 `1`，全 `0` 才 `0`；
            - **非门 / 反相器（NOT，$\overline{A}$）**：输入 `0` 变 `1`，`1` 变 `0`；
            - **与非门（NAND，$\overline{A\cdot B}$）** / **或非门（NOR，$\overline{A+B}$）**：在 AND / OR 结果上再反相；
            - **异或门（XOR，$A \oplus B$）**：**两人不相同才输出 `1`**，相同输出 `0`（极适合做加法与奇偶校验）。
      - card:
          title: 最小项与标准“积之和”（Sum of Products）
          body: |
            只要拿出一张完整的真值表，不用靠拍脑袋灵感就能一步写出一定正确的逻辑式：**把输出为 `1` 的那几行找出来**。
            - 每一行对应一个把所有输入相与的**最小项（Minterm，$m_k$）**（该行里值为 `1` 的信号写原字、值为 `0` 的写取反，例如行 `A=1, B=0, C=1` 是二进制 `101` = 5，写为 $m_5 = A\overline{B}C$）；
            - 把全部输出为 `1` 的行对应的最小项用 `+`（OR）加在一起，就是**与或积之和（SOP）**。例如 `Σm(1, 3, 5, 6, 7)` 就表示真值表第 1、3、5、6、7 行输出全为 `1`。
          reveal:
            - title: 为什么最小项拼出来的标准“积之和”一定 100% 还原真值表？
              body: |
                因为第 $k$ 号最小项经过专门构造，在整张真值表全 $2^n$ 行里**有且仅有第 $k$ 行会让它算出 `1`**（所有乘数正好都是 `1`），其余任何别的输入组合都会至少撞上一个 `0` 而立刻熄灭成 `0`。把所有期望输出 `1` 的行号对应的最小项用或门 `+` 并在一起，就相当于做了一份逐行点名表，绝不漏行也绝不误算。
      - item:
          id: xor-vs-and-match
          type: match
          prompt: |
            把各种基础逻辑门的名字和它的判别口诀配对。
          pairs:
            - ["AND（与门）", "只有全部输入都为 1 时输出才为 1"]
            - ["OR（或门）", "只要至少有一个输入为 1 时输出就为 1"]
            - ["XOR（异或门）", "两个输入不相同时输出 1，相同时输出 0"]
            - ["NAND（与非门）", "只有全部输入都为 1 时输出为 0，其余全输出 1"]
          explain: |
            特别留意 `XOR`（相异才出 1）和 `NAND`（全 1 才出 0），后面搭建全加器和通用门电路全靠它们。
      - item:
          id: minterm-row6
          type: choice
          prompt: |
            三输入 $(A, B, C)$ 的真值表按二进制序排位，行号 $6$ 对应二进制 `110`（即 $A=1, B=1, C=0$）。那么最小项 $m_6$ 应该写成哪一个乘积项？
          options:
            - text: '$AB\overline{C}$'
              correct: true
            - text: '$\overline{A}\overline{B}C$'
              why: '`$\overline{A}\overline{B}C$` 对应的是 `m1 (001)`；行 `110` 中 A=1、B=1 为原信号，C=0 取反'
            - text: '$A + B + \overline{C}$'
              why: 最小项是由各输入信号相与（乘积项）组成，保证全真值表只有 110 这一行能让它为 1
          explain: |
            只有把 $1$ 留原形、把 $0$ 加横线取反，乘在一起得到 $AB\overline{C}$，才能保证仅在 `(1,1,0)` 这一行输出 1。
      - item:
          id: sop-eval-101
          type: number
          prompt: |
            已知布尔式按标准积之和写为 $F = A\overline{B}C + AB$。当输入取 `A=1, B=0, C=1` 时，输出 $F$ 的逻辑值（0 或 1）是多少？
          answer: 1
          hint: '先算第一项 $A\overline{B}C = 1 \cdot \overline{0} \cdot 1 = 1$；再算与第二项相或。'
          explain: |
            第一项为 $1\cdot 1\cdot 1 = 1$，即使第二项 $AB=0$，或运算 $1 + 0 = 1$。
      - item:
          id: xor-eval-pair
          type: number
          prompt: |
            用异或门计算 `(1 ⊕ 1) + (1 ⊕ 0)` 的逻辑值结果（在二进制数字逻辑中 `+` 表示 OR 或运算，`0` 或 `1`）是多少？
          answer: 1
          hint: '相同输入异或得 `0`，不同输入异或得 `1`，然后算 `0 + 1`。'
          explain: |
            $1 \oplus 1 = 0$，$1 \oplus 0 = 1$；再由 OR 门把 `0 + 1` 合起来得到 `1`。

  - id: kmap
    chapter: 布尔代数
    title: 卡诺图化简、德摩根定理与纯 NAND 实现
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            直接把 `Σm(1, 3, 5, 6, 7)` 机械展开成 5 个三输入乘积项相加：$F = \overline{A}\overline{B}C + \overline{A}BC + A\overline{B}C + AB\overline{C} + ABC$，得用一大堆门才能搭出来。有没有一眼看穿这 5 个格子其实能合并消掉冗余信号、最后只要两项甚至 3 个简单逻辑门的化简绝招？
          options:
            - text: 用卡诺图（Karnaugh Map）：把相邻仅差 1 位的 1 格子圈成 2/4/8 格矩形，就能把在圈里“正反都取过的输入”直接消掉。
              correct: true
            - text: 任何真值表绝对永远都不能化简，5 行就必须买 50 个元件
              why: 利用合并化简规则，Σm(1,3,5,6,7) 竟能一眼化简成极其简洁的 C + AB。
            - text: 把所有加号全擦掉直接变成 0
              why: 化简必须在保持全 8 种输入下真值完全相等的前提下消去冗余因子
          explain: |
            卡诺图把只差一位的最小项排在相邻格里，圈在一起的格子中正反都出现过的输入可以直接消掉。这一课用**卡诺图**化简，再用 **3 个与非（NAND）门**在 Icarus Verilog 里搭出来，跑过全部 8 种输入。
      - card:
          title: 卡诺图化简 `Σm(1,3,5,6,7)` = `C + AB`
          body: |
            **卡诺图**按格雷码顺序排列坐标（相邻两格**只翻转 1 个输入**，左右边缘也算相邻卷通）。圈选法则：**只能圈边长为 `1, 2, 4` 的矩形、把所有 `1` 全覆盖且圈尽量大**。
            对 $F(A, B, C) = \sum m(1, 3, 5, 6, 7)$：
            - **4 格大圈**：`m1(001), m3(011), m5(101), m7(111)` 的共同点就是 $C = 1$（$A$ 与 $B$ 各自既有 0 又有 1 全被消掉），简化为一项 **$C$**；
            - **2 格圈**：剩下的 `m6(110)` 拉上邻居 `m7(111)` 合圈（$C$ 一正一反消去，留下 $AB$），写出最简与或式：**$F = C + AB$**。
          reveal:
            - title: 画出格雷码 2×4 卡诺图一目了然怎么圈
              body: |
                列标按格雷码依次排 `AB = 00, 01, 11, 10`，行标为 `C = 0`（上排：`0, 0, 1(m6), 0`）与 `C = 1`（下排：`1(m1), 1(m3), 1(m7), 1(m5)`）：
                - 下排整行 4 个全是 `1`，合圈后 $A,B$ 均正反成对抵消，剩 **$C$**；
                - `11` 那一列上下两格都是 `1`（$m_6$ 与 $m_7$），合圈消掉正反 $C$，剩 **$AB$**。
                ```text
                C\AB | 00  01  11  10
                -----+---------------
                  0  |  0   0   1   0   <- m6=1
                  1  |  1   1   1   1   <- 整行 C=1
                ```
      - card:
          title: 只用 3 个 NAND（与非）门实现 $C + AB$
          body: |
            为什么芯片厂最偏爱**与非门（NAND）**？因为它是“万能门”：既能把两脚并接当非门（$\text{NAND}(C, C) = \overline{C}$），又能靠德摩根规则（$\overline{\overline{X} \cdot \overline{Y}} = X + Y$）把与或直接翻成全 NAND 结构。
            对 $F = C + AB = \overline{\overline{C} \cdot \overline{AB}}$，只需 **3 只与非门**（下段硬件描述语言代码已在 Icarus Verilog 遍历全 8 种输入实测通过；其中 `module` 定义元件端口，`wire` 声明内部连线，`nand (out, in1, in2)` 表示把两个输入接进一只与非门）：
            ```verilog
            module nand_form(input A, B, C, output F);
                wire not_ab, not_c;
                nand (not_ab, A, B);
                nand (not_c, C, C);
                nand (F, not_ab, not_c);
            endmodule
            ```
          reveal:
            - title: 手推一遍德摩根定理看这 3 个 NAND 门为什么严丝合缝
              body: |
                第一只门算出 $X = \overline{AB}$，第二只门两端都接 $C$ 算出 $Y = \overline{C \cdot C} = \overline{C}$，第三只门把 $X, Y$ 再做一次与非：
                $\overline{X \cdot Y} = \overline{\overline{AB} \cdot \overline{C}} = \overline{\overline{AB}} + \overline{\overline{C}} = AB + C$。双反相消正好变出“积之和”的 `OR` 加号。
      - item:
          id: kmap-4-group
          type: choice
          prompt: |
            用卡诺图化简三输入逻辑 $F(A, B, C) = \sum m(1, 3, 5, 6, 7)$ 后，最简与或逻辑式是哪一个？
          options:
            - text: '$F = C + AB$'
              correct: true
            - text: '$F = ABC$'
              why: $C=1$ 的那四个奇数编号最小项（1,3,5,7）合圈就已经直接消成了单项 $C$，不是 $ABC$
            - text: '$F = \overline{C} + \overline{A}B$'
              why: '代入 `m1(0,0,1)` 时算得 `0 + 0 = 0`，与真值表要求输出 1 不符'
          explain: |
            `m1, m3, m5, m7` 组成 4 格圈出 `C`；`m6` 拉上 `m7` 组成 2 格圈出 `AB`，相加即为 `C + AB`。
      - item:
          id: nand-count-c4
          type: number
          prompt: |
            只用双输入与非门（NAND）按 $F = \overline{\overline{C} \cdot \overline{AB}}$ 实现 $F = C + AB$ 时，① 算 $\overline{AB}$、② 算 $\overline{C}$、③ 合成最终 $F$，总共需要几只 NAND 门？
          answer: 3
          hint: '数清实现这 3 步“反相与组合”动作，每步分别需要几只双输入与非门。'
          explain: |
            3 只 NAND 门就完成了全部与、非、或三级逻辑，且延迟深度仅两级半（实际中反相器可用单输入非门或并接与非门）。
      - item:
          id: demorgan-identity-match
          type: match
          prompt: |
            把德摩根规律及万能门变换配对起来。
          pairs:
            - ["$\\text{NAND}(X, X)$（把与非门两个输入端并接一起）", "等价于反相器 NOT（输出 $\\overline{X}$）"]
            - ["$\\overline{X \\cdot Y}$", "等价于 $\\overline{X} + \\overline{Y}$（反相后或运算）"]
            - ["$\\overline{\\overline{C} \\cdot \\overline{AB}}$", "双重取反利用德摩根直接等于 $C + AB$"]
          explain: |
            德摩根规则把“与或”两级电路顺滑翻译成清一色廉价规整的“全 NAND 门”两级网络。
      - item:
          id: kmap-verify-110
          type: number
          prompt: |
            拿一组典型边界值检验 `nand_form` 门级电路：当输入取 `A=1, B=1, C=0`（即对应最小项 $m_6$）时，最终门输出 `F` 等于多少（0 或 1）？
          answer: 1
          hint: '依次把 `not_ab = NAND(1, 1)` 和 `not_c = NAND(0, 0)` 算出来，再代进最后一只门 `NAND(not_ab, not_c)`。'
          explain: |
            `NAND(0, 1) = 1`，正与化简式 $C + AB = 0 + 1\cdot 1 = 1$ 以及最小项编号 `6` 完全一致。

  # ==== 组合/时序逻辑 ====
  - id: mos
    chapter: 组合/时序逻辑
    title: MOSFET 压控开关与 CMOS 反相器互补原理
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            刚才我们用的那些 AND、NAND 逻辑门到底是用什么电子元件造出来的？芯片里可没有几百万个小手去扳动机械拨片开关，里面用的 MOSFET（场效应晶体管）究竟怎么变成“开关”的？
          options:
            - text: 靠控制端“栅极（Gate）”上的电压高低形成电场，电控决定“源极和漏极”之间导通还是断开。
              correct: true
            - text: 靠里面藏了一亿只微型机械发条小马达物理拨片
              why: MOSFET 是全固态纯电控开关器件，没有机械触点运动，开关速度每秒数十亿次
            - text: 只能靠拿吹风机吹热才能开一次
              why: 芯片上靠栅极与源极之间的电势差控制导电沟道形成与否
          explain: |
            把 **MOSFET** 抽象成由栅极电压控制的电子开关，再用互补成对的 **PMOS**（拉高）与 **NMOS**（拉低）搭出 **CMOS**，就揭开了现代芯片最底层的秘密。
      - card:
          title: NMOS 拉低开关 vs PMOS 拉高开关
          body: |
            一只 **MOSFET** 有栅（Gate）、源（Source）、漏（Drain）和体四个极，我们紧盯栅源电压控制何时“闭合导通”：
            - **NMOS 管**：**高电压（1）闭合导通、低电压（0）断开**，极擅长把输出稳稳拉向地面 `0 V`（低电平）；
            - **PMOS 管**：正相反，**低电压（0）闭合导通、高电压（1）断开**，极擅长把输出稳稳拉向电源供电端 `VDD`（高电平）。
          reveal:
            - title: 为什么“阈值电压”与“导通电阻”决定开关能不能跑快？
              body: |
                真晶体管不是零阻力瞬间开合的理想机械片：栅极电压必须跨过**阈值电压**门槛才真正形成导电沟道；导通后内部也仍有一定**导通电阻**，需要透过它对后级连线与栅极的微弱电容（构成 **RC 充放电时间**）把电压冲高或放低，从而决定了每级门的开关速度与轻微压降。
      - card:
          title: 黄金搭档 CMOS 互补结构
          body: |
            **CMOS（互补金属氧化物半导体）**永远遵守两条互补配对铁律：
            1. 顶上放 **PMOS 上拉网络（接电源 VDD）**；
            2. 底下放 **NMOS 下拉网络（接 GND 地）**；
            3. 输入有效 `0` 或 `1` 稳定时，**总是一边导通、另一边关断**——绝不把电源直接短路通到地。静态几乎零功耗，只有输入高低翻转的那一瞬间才短暂有切换电流。
          reveal:
            - title: 看一眼最小 CMOS 器件——反相器（NOT 门）怎么工作
              body: |
                上面接 1 个 PMOS 到电源、下面接 1 个 NMOS 到地，两只栅极连一起接输入 `A`：
                - 当 `A = 0`（低）：上侧 PMOS 导通、下侧 NMOS 关断 → 输出被拉到电源 **`1`**；
                - 当 `A = 1`（高）：上侧 PMOS 关断、下侧 NMOS 导通 → 输出被拉到地 **`0`**。
      - item:
          id: mos-pull-direction
          type: match
          prompt: |
            把两种互补开关管和它们的物理职责与导通条件配对。
          pairs:
            - ["NMOS 开关管", "放在下拉网络接地，输入高电压时导通并把输出拉向 0"]
            - ["PMOS 开关管", "放在上拉网络接电源，输入低电压时导通并把输出拉向 1"]
            - ["CMOS 反相器稳态功耗特征", "稳定为 0 或 1 时总有一侧完全断开，几乎不形成直流短路耗电"]
          explain: |
            “N 管下拉（高导通）、P 管上拉（低导通）”是理解一切 CMOS 门电路的万能钥匙。
      - item:
          id: inverter-low-out
          type: choice
          prompt: |
            给一只标准 CMOS 反相器的输入端稳定接上有效高电平（`1`），此时内部哪一侧开关导通，输出接近哪个供电轨？
          options:
            - text: 下侧 NMOS 导通（同时上侧 PMOS 断开），输出被下拉到地电平 `0`
              correct: true
            - text: 上侧 PMOS 导通，把输出继续抬高到电源高电平 `1`
              why: 高电平输入会令 PMOS 关断而令 NMOS 导通，正好做出反相 `1 -> 0`
            - text: 两只管子永远同时死死接通把电池烧干
              why: 只有瞬态翻转经过中间电压区才会极短暂同时导通，稳态下上下绝对互补互斥
          explain: |
            记住输入高时 NMOS 接通地把输出拉低。
      - item:
          id: mosfet-switch-basis
          type: choice
          prompt: |
            尽管在逻辑图里我们常把晶体管简化成小开关，但真实芯片设计里为什么依然关注阈值电压与导通电阻？
          options:
            - text: 栅源电压必须跨过阈值才真正导通形成沟道，而导通电阻配合电容充放电时间决定了开关能跑多快以及压降损失
              correct: true
            - text: 因为只要栅源电压大于 0.001 V 沟道就会瞬间完全导通，阈值电压只决定关断时的漏电流
              why: 栅源电压必须跨过阈值电压门槛才开始形成有效导电沟道，且导通等效电阻与输出电容充放电时间限制了开关速度
            - text: 因为任何晶体管导通时电阻永远绝对等于无限大
              why: 导通时存在有限较小导通电阻使输出电容按 RC 时间完成充放电切换
          explain: |
            物理层面是栅压与 RC 充放电，数字层面才浓缩成“开关 + 传播延迟”。

  - id: cmos
    chapter: 组合/时序逻辑
    title: 用互补串并联网络构造 CMOS 与非门、或非门与复杂门
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            刚才用 1 对 PMOS+NMOS 搭出了反相器。现在想搭一个**二输入与非门（NAND）**：希望“只有当 A 和 B 全为 `1` 时才把输出拉低到 `0`，否则任一个为 `0` 就把输出拉高到 `1`”。下面的接地 NMOS 下拉管应该“串联”还是“并联”？
          options:
            - text: 下拉 NMOS 必须串联（A 和 B 全 1 才把通道打通接地）；而上面上拉 PMOS 则必须并联（A 或 B 任一个为 0 就能拉高）。
              correct: true
            - text: 下拉 NMOS 应该并联（这样 A=1, B=0 就拉低变成 0 了）
              why: 下拉并联做出来的是“有 1 出 0”的或非门（NOR），不是全 1 出 0 的与非门（NAND）
            - text: 全芯片里只能造反相器，造不出任何双输入门
              why: 只要按串并联对偶放好上拉和下拉网络，就能一次做出任意反相组合门。
          explain: |
            记住 **CMOS 构造黄金法**：串联表示“同时成立才连通（与）”，并联表示“任意一个成立就连通（或）”，而且上拉与下拉形状永远**互相对偶反转**。
      - card:
          title: CMOS 互补逻辑构造对偶法则
          body: |
            因为 MOSFET 是天然会倒相的开关（PMOS 上拉接电源、NMOS 下拉接地），**单级静态 CMOS 天然擅长做带反相的门**（NAND、NOR）：
            - **画下拉 NMOS 网络**（写出何时拉低出 `0`）：与操作用**串联**，或操作用**并联**；
            - **对偶画上拉 PMOS 网络**（保证绝不短路且无悬空状态）：下拉看到“串联”，上拉就画“并联”；下拉看到“并联”，上拉就画“串联”。
          reveal:
            - title: 举例实操：NAND 门 vs NOR 门一共各需几只晶体管？
              body: |
                - **二输入 NAND**：底下 `A, B` 两只 NMOS **串联**（全 1 接地输出 0），上面 `A, B` 两只 PMOS **并联**（任一为 0 拉电源出 1），一共只需 **4 只晶体管**。
                - **想要正向 AND 门呢？** 在 4 管 NAND 后面再接 1 个 2 管反相器即可，共 **6 只晶体管**——这就是为什么直接写 NAND/NOR 比强求 AND/OR 在芯片里更小更快更省电。
      - item:
          id: cmos-nand-topology
          type: choice
          prompt: |
            观察二输入静态 CMOS **与非门（NAND）** 与 **或非门（NOR）** 的晶体管接法，以下描述完全正确的是？
          options:
            - text: NAND 的两只下拉 NMOS 串联、两只上拉 PMOS 并联；NOR 恰反过来，两只下拉 NMOS 并联、两只上拉 PMOS 串联
              correct: true
            - text: NAND 与 NOR 的晶体管串联并联方式完全一模一样
              why: NAND 在 11 时拉低（串联下拉），NOR 在任一为 1 时拉低（并联下拉），结构刚好对偶互换
            - text: 两者都需要整整 100 只晶体管且上面全接接地线
              why: 二输入静态 NAND 和 NOR 各只需 4 只晶体管（2 只 PMOS + 2 只 NMOS）
          explain: |
            “下串上并 = NAND，下并上串 = NOR”，画多输入复杂复合门一样遵守这条对偶规律。
      - item:
          id: cmos-and-from-nand
          type: number
          prompt: |
            已知 1 只静态 CMOS 反相器用 `2` 只晶体管，1 只二输入静态 CMOS **NAND** 门用 `4` 只晶体管。那么按最标准方式用 1 只 NAND 门后面串接 1 只反相器构成 1 只二输入 **AND** 门，一共需要多少只晶体管？
          answer: 6
          hint: '把 1 只二输入与非门和 1 只反相器各自的晶体管个数加起来即可。'
          explain: |
            `4 + 2 = 6` 只晶体管；也正因为比 NAND 多出 2 只管和 1 级延迟，芯片设计常常直接拿 NAND/NOR 拼复杂逻辑而省掉多余反相器。
      - item:
          id: cmos-why-dual-must
          type: choice
          prompt: |
            设计一个静态 CMOS 复杂门时，如果只图偷懒随意画下拉 NMOS 网络，而忘了按“串并互换对偶”去配对面的 PMOS 上拉网络，最可能出现哪类致命电路故障？
          options:
            - text: 在某些合法输入组合下，可能上下同时导通把电源直接短路烧坏，或者上下全断开让输出变成既非 0 也非 1 的悬空废点。
              correct: true
            - text: 电路体积会变成负数并自己飘起来
              why: 严格互相对偶正是为了从数学上保证“全输入组合下要么唯一连电源出 1、要么唯一连地出 0”
            - text: 只会让数字 1 自动乘以 10
              why: 静态 CMOS 输出必须始终由电源或地两条通路二选一确定驱动，既不能短路也不能悬空
          explain: |
            静态 CMOS 要求任何合法输入下：**上拉连通条件恰好是下拉断开条件**，永不短路也永不悬空。

  - id: mux-rom
    chapter: 组合/时序逻辑
    title: 多路选择器（MUX）与只读存储器查表实现任意逻辑
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            手里有一个“火车扳道岔开关”：输入端有两条铁轨来数据 $D_0$ 和 $D_1$，上面还有 1 根扳道杆 `S`（选通端）。当 `S = 0` 时把 $D_0$ 放过去输出；当 `S = 1` 时把 $D_1$ 放过去输出。如果把真值表要的每行固定答案提前接在 $D_0, D_1, \dots$ 上，用输入信号去拨动 `S`，岂不是不用画逻辑门就能算出任何逻辑表了吗？
          options:
            - text: 完全正确。这叫多路选择器（MUX），按输入行号拨道选通查出答案；如果把整张真值表存成只读格子，就是查表存储器（ROM）。
              correct: true
            - text: 不可能。搬道开关永远不能选通超过 0 的数字
              why: 只要把固定常量 `0`、`1` 或简化后的小逻辑式挂在 MUX 各输入端，任何真值表都能直接实现
            - text: 只能用来听音乐，绝不能做任何逻辑判断
              why: 在现代 FPGA 和处理器里，LUT（查找表实现组合逻辑）本质上正是用多路选择器加存好真值表的小存储做的。
          explain: |
            **多路选择器（MUX）**和 **只读存储器（ROM）**让我们看到了实现组合逻辑的另一种大杀器——“先存表，再用输入去选中那一行”。
      - card:
          title: 多路选择器（Multiplexer, MUX）与只读存储器（ROM）
          body: |
            - **多路选择器（MUX）**：`k` 位选择控制端可以从 **$2^k$ 路输入数据**中精确挑出某一路送往输出（比如 `4 选 1` MUX 需要 `2` 位选择线 `S1 S0`，分别对应选中 `00->D0`、`01->D1`、`10->D2`、`11->D3`）。
            - **用 ROM / 查表存真值表**：**只读存储器（ROM）**像一本印死答案的大账本，以输入的 $n$ 位二进制组合作行号（共有 $2^n$ 行），查出那一行预先烧好写死的多位输出数据——一次能同时算出多个输出信号（甚至有限状态机的下一状态与输出表）。
          reveal:
            - title: 具体怎么把“二输入异或门”存进 4 行 ROM 里？
              body: |
                用 `(A, B)` 拼成 2 位行索引：`00`（第 0 行）存 `0`、`01`（第 1 行）存 `1`、`10`（第 2 行）存 `1`、`11`（第 3 行）存 `0`。查表不靠串并联化简，再刁钻怪异的真值表也能一次统一读出，甚至同一行并排存两列就能同时输出 `S` 和 `Cout`。
      - item:
          id: mux-select-bits
          type: number
          prompt: |
            要做一个“8 选 1”多路选择器（根据选择线从 8 路独立输入数据 $D_0 \sim D_7$ 中挑出 1 路输出），至少需要多少根二进制选择控制线？
          answer: 3
          hint: '$2^k = 8$，算出需要几根控制线 $k$。'
          explain: |
            $2^3 = 8$，因此需要 `3` 位选择线（`000` 选中 $D_0$ 一直到 `111` 选中 $D_7$）。
      - item:
          id: rom-rows-3in
          type: number
          prompt: |
            如果拿一块只读存储器（ROM）直接存放一个 **4 输入**（$A, B, C, D$）**布尔**逻辑电路的完整真值表，ROM 里需要多少行来覆盖所有可能的输入组合？
          answer: 16
          hint: '每位有 2 种可能，4 位输入共有 $2^4$ 种组合。'
          explain: |
            $2^4 = 16$ 行；ROM 实现复杂多输出逻辑极其规整，缺点是输入位数每加 1 位行容量就翻倍。
      - item:
          id: mux-and-from-mux
          type: choice
          prompt: |
            看如何用一只“2 选 1”MUX（选择端接 `A`；`A=0` 选 `D0`，`A=1` 选 `D1`）不用任何 AND 门直接做出二输入与逻辑 `A · B`？
          options:
            - text: '把 `D0` 固定接常量 `0`，把 `D1` 直接接输入线 `B`（这样 `A=0` 输出 `0`，`A=1` 时输出恰好等于 `B`）'
              correct: true
            - text: '把 `D0` 接 `1`，`D1` 接 `0`'
              why: 这样输出变成了 `A` 取反（非门），当 `A=0, B=1` 时竟错误输出了 1
            - text: '把 `D0` 和 `D1` 都固定接 `1`'
              why: 无论 A 和 B 怎么变输出都将永远卡在常量 1
          explain: |
            把选通端接一部分输入信号，其余数据端接常量或简单子式，仅用一台多路选择器就能灵活搭出各种组合逻辑。

  - id: adder
    chapter: 组合/时序逻辑
    title: 全加器、行波进位瓶颈与超前进位加速
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            做两位二进制加法，就像小学竖式加法一样：本位来了两个加数 $A=1, B=1$，加上来自右边低一位的进位 $C_{in}=0$。十进制 `1 + 1 + 0 = 2` 写成二进制就是 `"10"`。请问**留在本位的和 $S$** 以及**往左边更高位传出去的进位 $C_{out}$** 分别是多少？
          options:
            - text: 本位和 $S = 0$，向高位传出进位 $C_{out} = 1$
              correct: true
            - text: 本位和 $S = 1$，进位 $C_{out} = 0$
              why: 二进制 `10` 中，低位（右边）是本位结果 0，高位（左边）才是进位 1
            - text: 本位和 $S = 2$，进位 $C_{out} = 0$
              why: 二进制每一位只能放 0 或 1，满 2 必须向高位进 1
          explain: |
            `1 + 1 + 0 = 2`，二进制是 `10`：本位留下 0，向高位进 1。这一课推出**全加器（Full Adder）**，在 Icarus Verilog 里跑通全部 8 种输入，再看 **4 位行波进位慢在哪、超前进位怎么加速**。
      - card:
          title: 全加器公式与门级 Verilog 实测
          body: |
            1 位**全加器**把两个加数 $A, B$ 连同低位进位 $C_{in}$ 相加，产出本位和 $S$ 与高位进位 $C_{out}$：
            - **本位和**：$S = A \oplus B \oplus C_{in}$（三个里面有奇数个 `1` 时本位才是 `1`）；
            - **输出进位**：$C_{out} = AB + C_{in}(A \oplus B)$——当 $A, B$ 同为 `1` 时直接**生成（Generate）**进位；当两者恰有一个为 `1` 时把低位进位**传播（Propagate）**上去。（下段门级代码已在 `iverilog` 全 8 组实测通过，其中 `assign` 表示连续驱动输出线，`^`、`&`、`|` 分别代表异或、与、或门）：
            ```verilog
            module full_adder(input A, B, Cin, output S, Cout);
                assign S = A ^ B ^ Cin;
                assign Cout = (A & B) | (Cin & (A ^ B));
            endmodule
            ```
      - card:
          title: 4 位行波进位的最长瓶颈 vs 超前进位加速
          body: |
            把 4 个全加器首尾接进位拼成 **4 位行波进位加法器（Ripple-Carry Adder）**：
            - **瓶颈在哪？**：最低位 $C_0$ 必须像多米诺骨牌一样一路依次穿过第 0 级 → 第 1 级 → 第 2 级 → 第 3 级才能到达最左侧 $C_{out}$（或最高位 $S_3$）——延迟随位数 $N$ 线性增长。
            - **超前进位（Carry-Lookahead）怎么提速？**：提前对每位同时算出“必生成 $G_i = A_i B_i$”与“会传播 $P_i = A_i \oplus B_i$”，直接展开并行算出每一位的进位（如 $C_1 = G_0 + P_0 C_0$、$C_2 = G_1 + P_1 G_0 + P_1 P_0 C_0$），用两级逻辑跳过逐级傻等。（现实位数极大时因门扇入和连线限制会做成树形分层超前进位）。
          reveal:
            - title: 为什么 `1111 + 0001` 会触发行波进位最坏情况？
              body: |
                第 0 位 `1 + 1` 生出进位 $C_1=1$；第 1 位 `1 + 0 + C1` 本来不用进位，却因为 $P_1=1$ 把 $C_1$ 接力踢向第 2 位；第 2 位和第 3 位同样 `1 + 0` 一路把这枚多米诺进位一直滚穿 4 级直到最高位 `Cout=1, S=0000`——每增一位就要多苦等一级。而超前进位用提前展平的公式同时一口气算出 $C_1, C_2, C_3, C_4$。
      - item:
          id: full-adder-101
          type: choice
          prompt: |
            用全加器公式计算输入 $A = 1, B = 0, C_{in} = 1$ 时，本位和 $S$ 与输出进位 $C_{out}$ 分别是多少？
          options:
            - text: '$S = 0, C_{out} = 1$'
              correct: true
            - text: '$S = 1, C_{out} = 0$'
              why: $1 + 0 + 1 = 2$，写成二进制是 `10`，最低本位为 0、高位进位为 1
            - text: '$S = 1, C_{out} = 1$'
              why: $S=1, C_{out}=1$ 代表总和等于二进制 `11`（十进制 3），需要三路全为 1 才出现
          explain: |
            检查公式：$S = 1\oplus 0\oplus 1 = 0$，$C_{out} = (1\cdot 0) + 1\cdot(1\oplus 0) = 1$，恰好对应二进制 `10`。
      - item:
          id: ripple-critical-path
          type: choice
          prompt: |
            在 4 位行波进位加法器（依次算第 0、1、2、3 位）里，哪一条信号依赖链条耗时最长，决定了最晚稳定结果的时间？
          options:
            - text: 从最低位的输入 $A_0/B_0$ 或初始进位 $C_0$ 出发，逐级穿过全部 4 级进位链一直传到最高位 $C_{out}$（或 $S_3$）的路径
              correct: true
            - text: 最高位自己算 $A_3 \oplus B_3$ 只要一步就能立刻出最终正确 $S_3$，永远不用管前面第 0~2 位
              why: 假如第 0~2 位都在传播进位，最高位求和必须死等前面逐级传递来的 $C_3$ 稳定才对
            - text: 所有 4 位的 $S$ 和 $C_{out}$ 永远都在 0 纳秒瞬间一起算好
              why: 串行行波依赖导致总进位延迟与位数 4 成正比
          explain: |
            最坏情况是每级都把最低位进位往上传（例如 `1111 + 0001`），必须苦等进位一路滚到尽头。
      - item:
          id: cla-how-speeds-up
          type: choice
          prompt: |
            **超前进位加法器（Carry-Lookahead Adder）**究竟是怎么把多米诺骨牌式的逐级等待变快的？
          options:
            - text: 先同时并行算出每一位的“进位生成 $G_i = A_i B_i$”和“进位传播 $P_i = A_i \oplus B_i$”，再直接把各位进位展开成只依赖原始输入的并行逻辑式同时算出来
              correct: true
            - text: 直接把第 0 位产生的所有进位全部扔掉不进位算，错就错了
              why: 超前进位结果与行波加法器 100% 数学等价，只是把层层串行依赖展开成了两级并行逻辑
            - text: 把计算全部延迟到明天再算
              why: 展开后的并行逻辑式一步算出进位，大幅削减了级联等待深度
          explain: |
            只要看懂了 $C_2 = G_1 + P_1 G_0 + P_1 P_0 C_0$，就知道它怎么做到一步直接算清前面三位到底传不传进位给第 2 位。
      - item:
          id: gp-meaning-match
          type: match
          prompt: |
            把超前进位构造中 $G_i$、$P_i$ 和全加器各信号角色配对清楚。
          pairs:
            - ["生成信号 $G_i = A_i \\cdot B_i$", "只要本位两个加数全是 1，无论低位来不来进位，本位自己必定产生出进位"]
            - ["传播信号 $P_i = A_i \\oplus B_i$", "本位两个加数恰有一个为 1，若低位传来进位就必定顺手继续传给上一位"]
            - ["本位和 $S_i = A_i \\oplus B_i \\oplus C_i$", "由两位加数与低位进位做异或得出当前位最终结果数字"]
          explain: |
            算完每一位本地的“自产还是转发”，高位进位就可以并行同时算出。

  - id: registers
    chapter: 组合/时序逻辑
    title: 告别无记忆组合：D 锁存器（电平透明）vs D 触发器（边沿采样）
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            按键刚按过一回数字 `1` 接着手指立刻松开了（输入变回 `0`）。刚才学的组合逻辑门松手就忘了刚才按过 `1`。要想让芯片在手指松开、输入已经撤掉之后依然“牢牢记住刚才那位 `1`”，电路最起码得具备什么本事？
          options:
            - text: 必须靠内部反馈形成可保存状态的存储元件，使此刻输出不仅看现在输入，还能记住过去历史状态
              correct: true
            - text: 只要在组合逻辑门后面多串联十几个反相器拉长延迟，松手一天后输出也依然能永久锁住那个 `1`
              why: 纯组合逻辑没有记忆反馈环，级联延迟只会在几十纳秒后恢复成跟随当前输入 `0`，无法长期保存状态
            - text: 把数字永久写死成 1 永远再也改不掉
              why: 存储元件必须既能牢牢记住当前位，又能在需要时受控接收写入新值
          explain: |
            组合逻辑的输出只看此刻的输入，要记住过去，电路里必须有反馈形成的存储元件。从这里开始进入有记忆的“**时序逻辑**”，重点分清 **D 锁存器 vs D 触发器**。
      - card:
          title: D 锁存器（电平透明）vs D 触发器（边沿采样）
          body: |
            同是保存 1 位状态，两种最基本数字存储元件的采样规则天差地别：
            - **电平敏感 D 锁存器**（D Latch）：这里的 **锁存器** 在使能/门控端保持有效高电平的**整段时间窗口里像透明玻璃一样——输入 `D` 怎么变，输出 `Q` 就立刻跟着变**；直到使能降回无效低电平时，才把离开前那刻的值锁死记住。
            - **D 触发器（D Flip-Flop，边沿触发）**：只在时钟信号从 `0` 跳向 `1` 的那一瞬间（**上升沿**，就像照相机快门喀嚓一下）**采样记住当时 `D` 的值**；其余整整一个周期内哪怕 `D` 上蹿下跳十遍，输出 `Q` 都纹丝不动。
          reveal:
            - title: 为什么多个边沿触发器排在一起能组成寄存器（Register）？
              body: |
                用主从两级反相控制锁存器背靠背拼在一起就能造出只在边沿瞬间采样的**触发器（flip-flop）**；再把 32 个或 64 个触发器共接同一根时钟线并排，就得到了能一次稳稳记住整条 32/64 位二进制状态的**寄存器（register）**。
      - item:
          id: latch-vs-flipflop-c4
          type: choice
          prompt: |
            在数字电路中，**D 锁存器（Latch）**与 **D 触发器（Flip-Flop）**最核心的行为区别是什么？
          options:
            - text: D 锁存器是电平敏感的（使能为高整段期间输出紧跟输入 D 透明变化）；D 触发器是边沿触发的（仅在时钟指定跳变沿喀嚓采样一次，其余时间保持输出不变）
              correct: true
            - text: D 锁存器只能存数字 0，D 触发器只能存数字 1
              why: 两者都能稳定保存 0 和 1 两位状态，差异在于何时把新输入 D 放入内部状态
            - text: D 触发器只要一直保持时钟高电平就会每微秒不停把最新 D 穿透过去
              why: 时钟一直停在高电平时只有“电平敏感锁存器”才透明跟随；边沿触发器只认 `0→1` 跳变那一刻。
          explain: |
            区分“一整段使能高电平窗口（透明锁存）”与“瞬间时钟跳变沿拍照（边沿触发）”是设计同步数字系统的基石。
      - item:
          id: latch-enable-low
          type: choice
          prompt: |
            一只高电平透明有效的 **D 锁存器** 目前内部记住的旧输出 `Q = 1`。现在使能信号处于**低电平（`0`，关闭状态）**，同时外面的输入端 `D` 悄悄从 `1` 变成了 `0`。此刻输出 `Q` 会怎样？
          options:
            - text: 依然稳稳保持原值 `Q = 1` 不动
              correct: true
            - text: 立刻跟随输入一起跌变成 `0`
              why: 只有在使能端有效为高电平打开“透明窗”时，输出才会紧随输入变化；使能关闭期间彻底锁住原状态
            - text: 变成随机值
              why: 闭锁反馈环保证使能关闭时牢牢守住上次采样到的状态
          explain: |
            先看使能门开没开，再看输入 D。
      - item:
          id: edge-sample-moment
          type: choice
          prompt: |
            一只正上升沿采样的 **D 触发器** 此前存着 `Q = 0`。在时钟上升沿 `0 → 1` 到来的前后一小段窗口里，`D` 稳定保持在 `1`；上升沿过去很久（进入平稳高电平后）`D` 又落回 `0`。问这次上升沿之后到下个周期之前输出 `Q` 是多少？
          options:
            - text: '`1`（只看喀嚓按下快门那一刻上升沿的输入值）'
              correct: true
            - text: '`0`（因为后来 D 又变成 0 了）'
              why: 边沿过去之后输入怎么变化，都要等下一拍时钟上升沿到来才会再去关心
            - text: 随时跟随 D 先 1 后 0 来回变
              why: 这是锁存器在电平有效期间的透明特征，边沿触发器绝不在周期中途变卦。
          explain: |
            有边沿触发器把关，组合逻辑算得再久再抖，也能放心在下一拍时钟沿干净拍照更新。
      - item:
          id: storage-types-match
          type: match
          prompt: |
            把数字状态存储的三个核心部件和各自特征配对起来。
          pairs:
            - ["组合逻辑输出行为", "无记忆历史，输出严格仅取决于当前时刻有效输入"]
            - ["D 锁存器（D Latch）", "使能有效电平期间直接透出输入变化，使能撤去则保持旧值"]
            - ["D 触发器与同步寄存器", "仅在时钟跳变边沿同步采样一次，成排组合保存多位系统状态"]
          explain: |
            现代 CPU 与数字同步电路普遍以“组合计算 + 边沿同步寄存器”为标准范式，正是看中它只在时钟沿稳稳采样不怕中间毛刺。

  # ==== 状态机 ====
  - id: fsm
    chapter: 状态机
    title: 有限状态机、状态转移表与重叠 101 序列检测器
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            你要造一个“连续密码流检测电路”：每个时钟节拍从左到右依次只送进 1 个比特（0 或 1），每当最近连续三位恰好凑成 `101` 就立刻亮灯输出 `1`（允许**重叠**——比如输入 `10101` 时，前三位 `101` 亮一次灯，紧接着从第 3 位开始的 `101` 还要再亮一次）。刚匹配完前一个 `101` 时，结尾那个 `1` 能丢掉吗？
          options:
            - text: 不能丢。因为结尾的 `1` 刚好可以兼作下一组 `101` 匹配的开头第一个 `1`（保留这个前缀记忆就能连续命中）
              correct: true
            - text: 必须彻底全清零重头再等三位才能下一次匹配
              why: 清零重头等会错过像 `10101` 中第 3–5 位这种允许重叠的第二组匹配。
            - text: 需要记住一百万个过去全部历史比特，有限状态不够用
              why: 只需要记住“目前匹配进了 101 的哪一步前缀”，总共只需 3 个状态就够了。
          explain: |
            **有限状态机（FSM）**就是用有限几个状态精准浓缩“为了未来决策必须保留的历史信息”。
      - card:
          title: Mealy vs Moore 状态机与“重叠检测 101”完整转移表
          body: |
            **有限状态机（Finite-State Machine, FSM）**分两型：**Moore** 输出仅看当前状态；**Mealy** 输出由“当前状态 + 当下输入”共同决定（常能用更少状态当拍即时响应）。
            设计允许重叠检测 `101` 的 **Mealy 状态机**（`S0`：无前缀；`S1`：末尾已匹配 `1`；`S2`：末尾已匹配 `10`；每格写为 `下一状态/输出`）：
            ```text
            状态   输入0   输入1
            S0     S0/0    S1/0
            S1     S2/0    S1/0
            S2     S0/0    S1/1
            ```
          reveal:
            - title: 为什么在 `S2`（已有 `10`）收到输入 `1` 时，输出 `1` 后去 `S1` 而不是回 `S0`？
              body: |
                因为刚来的 `1` 让最近三位凑成 `101`（所以输出 `1` 报告命中），同时这个刚收到的 `1` 本身恰好又是“下一次可能再来的 `101`”的开头第一个 `1`。如果回 `S0`，紧跟着再来 `0`、`1` 就漏检了；跳到 `S1` 才能完美接住 `10101` 的第二次命中。
      - item:
          id: mealy-s2-on-1
          type: choice
          prompt: |
            在允许重叠检测 `101` 的 Mealy 状态机里（`S0` 无匹配、`S1` 已有 `1`、`S2` 已有 `10`），当机器正处于 `S2` 且当前时钟新收到输入比特 `1` 时，应该怎样输出和转移状态？
          options:
            - text: 输出 `1`（报告凑齐 `101`），并转移到 `S1`（把刚到的 `1` 留作下组前缀）
              correct: true
            - text: 输出 `1`，然后清零退回初始状态 `S0`
              why: 退回 S0 会把末尾那个 1 丢掉，遇到重叠序列 `10101` 时第 5 拍就会漏掉第二次匹配。
            - text: 输出 `0`，并停留在 `S2`
              why: '`10` 后面刚接上一个 `1`，正是最需要报出 1 的匹配时刻'
          explain: |
            同理在 `S1`（已有 `1`）收到 `1` 时要继续留在 `S1`（输出 `0`），不能跳回 `S0`——永远保住能匹配目标的最长有用后缀。
      - item:
          id: mealy-10101-count
          type: number
          prompt: |
            一台允许重叠检测 `101` 的 Mealy 状态机从复位初始态 `S0` 出发，转移规则如下：`S0` 遇 `0→S0/0`、遇 `1→S1/0`；`S1` 遇 `0→S2/0`、遇 `1→S1/0`；`S2` 遇 `0→S0/0`、遇 `1→S1/1`（斜杠后为当拍输出）。依次送入 5 比特序列 `1, 0, 1, 0, 1`，一共输出了几次 `1`？
          answer: 2
          hint: '逐拍追着状态走：重点看第 3 拍在 `S2` 收到 `1` 命中输出后，状态回到了哪个前缀从而接住后面的第 4~5 拍？'
          explain: |
            输入 `10101` 时各拍输出为 `0, 0, 1, 0, 1`，在第 3 位和第 5 位共报告 `2` 次命中（全部短序列已由 Python 脚本穷举验证通过）。
      - item:
          id: mealy-vs-moore-diff
          type: choice
          prompt: |
            设计硬件状态机时，**Mealy 状态机**和 **Moore 状态机**在输出依赖上最直接的区别是？
          options:
            - text: Moore 机器的输出仅仅由当前存储的状态唯一决定；Mealy 机器的输出则同时由当前状态和当下实时输入共同决定
              correct: true
            - text: Moore 机器没有任何状态，Mealy 机器没有输出线
              why: 两种都属于有限状态机，都有状态寄存器、次态逻辑和输出
            - text: Mealy 机器绝不能实现成硬件电路
              why: 两种状态机都能轻松实现成真实硬件，各自权衡状态数量与输入毛刺传递
          explain: |
            Moore 输出干净隔离（只在状态变才变），Mealy 状态往往少 1 个且当拍反应更快，但输出受当前输入即时波动影响。
      - item:
          id: s1-on-1-stay
          type: choice
          prompt: |
            继续推敲同一台检测 `101` 的状态机：当前在 `S1`（最近最后 1 位是 `1`），此时新输入又来了个 `1`（变成最近两位是 `11`）。为什么转移目标依然留在 `S1`（输出 `0`）？
          options:
            - text: 因为如果下两拍接着输入 `0` 和 `1`，加上刚来的这个 `1` 正好又能凑成 `101`；丢回 S0 就会漏检 `1101`
              correct: true
            - text: 因为电路规定遇到两个 1 必须卡死报错停机
              why: '`1101` 末尾三位完全是一个合法 `101`。必须停在 S1 保留末尾 `1`'
            - text: 因为已经凑成 101 所以直接输出 1
              why: 两位 `11` 还没见到中间的 `0` 和末尾的 `1`，输出仍为 `0`
          explain: |
            写状态机口诀：永远问“此刻刚读完这串尾巴，离凑齐目标还差几步、哪几个字最有用”。
      - card:
          title: Mealy 状态机一步步追踪输入序列 `10101`
          body: |
            从复位态 `S0` 出发逐拍读入 `1, 0, 1, 0, 1`，看看状态和输出怎么实时跳动：
            - 第 1 拍来 `1`：`S0 -> S1`，输出 `0`（手里攒下前缀 `1`）；
            - 第 2 拍来 `0`：`S1 -> S2`，输出 `0`（攒成 `10`，就差个 `1`）；
            - 第 3 拍来 `1`：`S2 -> S1`，输出 **`1`**（凑齐首个 `101`，并立刻留下这个刚到的 `1` 作下组前缀）；
            - 第 4 拍来 `0`：`S1 -> S2`，输出 `0`；第 5 拍来 `1`：`S2 -> S1`，再次输出 **`1`**（重叠命中第 2 个 `101`）。

  - id: fsm-design
    chapter: 状态机
    title: 从实际任务抽象 FSM、等价状态合并与硬件落地
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            MIT 6.004 讲了一个会沿着墙走的机器蚂蚁（RoboAnt）：蚂蚁头上只有左/右两根触须感知碰没碰到墙。某两秒钟里两根触须碰到的结果一模一样（都是“没碰到墙”），但第一回蚂蚁在空旷地板上该“继续往前找墙”，第二回它刚刚沿着墙边走过了一个凸出来的墙拐角，该立刻“左转拐回墙边”。控制器怎么分辨这两种明明当前传感器读数一模一样的情况？
          options:
            - text: 靠内部有限状态区分“正在寻找墙”和“已经在沿墙行走”，同一输入在不同状态下就能作出不同决策。
              correct: true
            - text: 不可能区分，控制器绝对不能记住之前碰过墙
              why: 状态机正是用来记住“现在正处在寻找阶段还是沿墙阶段”这种有用历史
            - text: 把蚂蚁所有传感器全剪掉瞎撞就行
              why: 传感器输入与内部历史状态配合才让机器蚂蚁顺利绕着迷宫走而不迷失
          explain: |
            从 RoboAnt 看透状态划分精髓：**只有当两个历史情景对未来的决策有差别时，才值得分成两个状态**；如果对所有未来输入表现完全一模一样，就能合并省掉硬件寄存器。
      - card:
          title: 机器蚂蚁选状态与硬件实现结构
          body: |
            设计一台真实控制器分三步落地：
            1. **定状态与复位态**：明确上电清零先站在哪（比如 `LOOKING` 找墙态），再按未来行为拆出 `WALL_FOLLOW` 等必须区分的少数状态；
            2. **状态编码进寄存器**：若一共需要 4 个状态，只用 2 位同步触发器（`00, 01, 10, 11`）即可保存；若用了 3 个状态编进 2 位触发器，留下的 `11` 等未用状态**务必写清默认转回安全复位态**，防辐射或毛刺误落进去永远出不来。
            3. **次态与输出电路**：把转移表放进组合逻辑门或 ROM 查表，接在状态寄存器前后形成“算下一态 → 等时钟沿更新寄存器”的同步环路。
      - item:
          id: roboant-why-two-states
          type: choice
          prompt: |
            在 MIT RoboAnt 机器人蚂蚁例子中，当左右两根触须当前读数都为 `0`（都未碰墙）时，为什么不能把所有“未碰墙”情况归成一个通用状态？
          options:
            - text: “从未找到墙的空地”与“刚走过墙角转弯丢失墙边”面对同样的未碰墙输入需要采取完全不同的转向动作，必须靠状态区分这段历史
              correct: true
            - text: 因为机器蚂蚁必须用 100 万个状态才能走直线
              why: 只需要针对确实影响未来动作的少数阶段区分 4~5 个状态即可
            - text: 因为触须传感器永远只输出数字 9
              why: 传感器只有碰或不碰两种开关信号，关键在历史上下文不同
          explain: |
            划分状态不多也不少：以“当前输入完全相同、但下一步必须做出不同动作”作为必须分态的标准。
      - item:
          id: fsm-equivalent-states
          type: choice
          prompt: |
            你在化简一台复杂的状态机转移表时，发现状态 `S3` 和状态 `S4` 不仅当前输出完全相等，而且不管未来接着喂入任何 0/1 序列，两者之后输出的全部反应结果都 100% 相同。可以怎么处理？
          options:
            - text: '`S3` 与 `S4` 属于等价状态，可以安全合并成一个状态，减少多余触发器硬件开销'
              correct: true
            - text: 绝不能合并，因为名字一个叫 3 一个叫 4
              why: 状态命名只是人工标签，对外对未来全部输入表现一致的两个状态在逻辑功能上完全等价
            - text: 虽然此刻输出相同，即使未来输入 1 时它们会产生相反动作也同样可以直接合并
              why: 等价状态必须对当前及**所有未来输入序列**都产生完全一致的响应，只要未来某输入下动作分叉就不能合并。
          explain: |
            “此刻输出相等 + 所有未来输入下转移到的目标等价”，才是合并等价状态的严谨条件。
      - item:
          id: unused-state-recovery
          type: choice
          prompt: |
            一个有限状态机实际上只有 5 个业务有效状态，硬件设计用 3 位寄存器（可表示 `000 ~ 111` 共 8 种编码）来存，剩下了 3 个没用到的非法空闲编码。出于高可靠设计，综合电路里怎么处理这些没用到的编码？
          options:
            - text: 显式指定所有未使用的非法状态编码一旦出现就自动安全返回复位初始状态，避免受到电磁干扰误跳入死胡同卡死
              correct: true
            - text: 对未使用状态不写转移逻辑，默认电路上电或受干扰后不会进入这些编码
              why: 太空辐射、电源毛刺或上电未稳都可能让寄存器偶然跳进空闲编码，必须设置安全恢复路径
            - text: 把第 3 根 trigger 线剪断改成只剩 2 位（仅能存 4 个状态）
              why: 2 位最多只能表示 $2^2 = 4$ 个不同状态，放不下 5 个有效状态，必须至少用 3 位（并管好剩余 3 个空闲值）
          explain: |
            5 个状态需要 $\lceil \log_2 5 \rceil = 3$ 位寄存器；顺手给未用编码写条回安全态路径是高稳健好习惯。

  # ==== 时钟 ====
  - id: sync
    chapter: 时钟
    title: 跨时钟域异步输入、亚稳态与双级同步器
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            芯片内部有一颗滴答滴答每秒跳几亿次的精准内部系统时钟，但用户手指按在机械按键上的时刻完全随机。万一手指按下电压刚从 `0 V` 爬到半山腰 `1.5 V` 那一微秒，系统时钟上升沿正好啪地踩上来采样，D 触发器能永远瞬间干脆给出确定的 `0` 或 `1` 吗？
          options:
            - text: 不能。违反触发器稳定时间窗后，内部电路可能一时犹豫卡在中间半悬位置摇摆（亚稳态），过随机长度时间才倒向一边
              correct: true
            - text: 肯定能。触发器绝对永远在 0 纳秒之内毫无瑕疵地猜出用户原本意图
              why: 触发器底层是互相拉扯的反馈开关门，输入恰好踩着边沿跳变会让内部平衡点像把铅笔竖在针尖上一样迟疑不定。
            - text: 按键会因为异步按下把芯片里的时钟永久变成停止状态
              why: 芯片时钟继续滴答走，风险是采到不稳定的中间态传播给后面一大堆逻辑造成系统混乱
          explain: |
            只要有两个“不是同一根时钟节奏指挥”的信号相遇（如外部按键或另一块独立时钟源），就一定会撞上硬件界最棘手的物理现象——**亚稳态（Metastability）**。
      - card:
          title: 亚稳态与双级同步器（Two-Flip-Flop Synchronizer）
          body: |
            **亚稳态（metastability）**就像把一枚硬币精准立在桌沿或铅笔尖上——原则上它能一直犹豫摇摆不倒，过了随机一小段时间受热噪声才终于随机倒向 `0` 或 `1`。
            如果让后级一堆门电路直接去看这颗晃悠的信号，可能左边门认成 `0`、右边门认成 `1` 全盘撕裂。
            **标准缓解办法（针对单比特慢变化异步信号）**：在进入本地时钟域入口串联**两级 D 触发器**（第一级哪怕进入亚稳态，给它**整整一整个时钟周期**去稳定倒向一边，第二级再去稳稳采样交出干净信号）。注意：**双级同步器极大降低失效概率，但从物理上无法把风险降成绝对 0。**
      - card:
          title: 多比特计数与脉冲跨域的经典大坑
          body: |
            千万别拿“给每位各自加一个双级同步器”去跨时钟域直接传一个多位二进制计数（例如 `0111 -> 1000`）。
            - **为什么会撕裂错乱？**：4 根线走得有快有慢且可能卡在不同周期，如果最高位早一拍翻转、低三位晚一拍倒向，接收端会拼出一个根本不存在的鬼值 `1111` 或 `0000`。
            - **正确处理**：多位总线跨域必须走**握手协议**、**跨时钟域异步缓冲队列（FIFO）**或仅在单比特相邻变一位的格雷码转换；极窄的跨时钟脉冲要先拉宽或转成翻转信号再同步。
          reveal:
            - title: 为什么“平均无故障时间（MTBF）”随等待时间呈指数暴涨？
              body: |
                触发器内部正反馈交叉反相器会让离开平衡点后的微弱电压差以指数级迅速放大倒向 `0` 或 `1`。因此只要给第一级同步触发器多留出一个完整时钟周期去“跌倒”，亚稳态延续到第二级采样沿才还没倒完的概率会以指数级骤降（工程上常拉长到数千亿年一次），可物理概率分布永远没有严格截止时间点。
            - title: 格雷码计数怎么解决多比特跨域翻转撕裂？
              body: |
                格雷码相邻数值每次只翻 1 比特（例如 `00 -> 01 -> 11 -> 10`）。即使跨时钟边沿恰好踩在正在跳变的那一位上，接收端采样到的结果只可能是“上一刻旧值”或“下一刻新值”二者之一，绝不会拼出撕裂假数值。
      - item:
          id: sync-two-ff-truth
          type: choice
          prompt: |
            在高速时钟入口处串接“两级同步 D 触发器”去接收外部异步按键单比特信号，能起什么作用、有没有局限？
          options:
            - text: 第一级用一整个时钟周期窗口让潜在亚稳态大概率稳定下来，从而呈指数级极度降低传往后续电路的错误概率，但物理上仍保留极微弱残余概率无法归零
              correct: true
            - text: 能从绝对物理定律上 100.000% 永远彻底消灭任何亚稳态发生的可能
              why: 亚稳态退出时间呈指数衰减却没有物理上界，双级或三级同步器是把平均无故障时间拉长到远超宇宙寿命级别，不能声称绝对为零
            - text: 能把按键次数自动加倍翻两番
              why: 同步器仅负责把异步信号安全对齐到本地时钟节拍上
          explain: |
            懂物理上限就会说“将平均失效率降到工程上可忽略（极大提升 MTBF），而非绝对清零”。
      - item:
          id: multibit-cdc-trap
          type: choice
          prompt: |
            两个不同频率时钟域之间要传递一个随时变化的 8 位总线计数值（比如从 `0111_1111` 加 1 跳变成 `1000_0000`）。一位新人给 8 根线每一根分别各套一个独立双级同步器就觉得万事大吉。后果会是什么？
          options:
            - text: 8 根比特线可能在不同拍先后倒向旧值与新值，导致接收端拼出一个原计数值里从没出现过的撕裂错乱数字（如 `1111_1111`）
              correct: true
            - text: 因为加了 8 个同步器，8 根线在物理上哪怕差了十纳秒也会自动合并成一个正确的 128
              why: 独立单比特同步器面对亚稳态倒向时间各自随机，无法保证多比特在同一拍整齐切换过去
            - text: 芯片会自动把 8 位变成 1 位输出
              why: 传输多比特整组数据必须配合握手协议、带使能锁存或格雷码/异步 FIFO
          explain: |
            单比特用双级同步器；多位总线要配合**格雷码（一次只变 1 位）或握手/FIFO 整体跨传协议**。
      - item:
          id: narrow-pulse-cdc
          type: choice
          prompt: |
            一个来自快时钟域、只持续 `1` 纳秒的极窄脉冲，直接送给一个每 `10` 纳秒才采样一次的慢时钟域双级同步器，最容易发生什么问题？
          options:
            - text: 这个极窄脉冲可能恰好完整落在了慢时钟两次上升沿之间的空白期里，被慢时钟彻底看漏错过。需要先拉宽脉冲或用电平翻转配握手确认后再送
              correct: true
            - text: 慢时钟会自动倒转时间回溯 10 纳秒去抓住它
              why: 时钟只按自己周期的边沿瞬间采样，抓不住两个沿之间一闪而过的极窄脉冲
            - text: 脉冲会变成永久高电平
              why: 需要扩展或握手协议确认接收端确实采样收到了这次脉冲再复位
          explain: |
            快传慢看漏窄脉冲，先“扩展/握手确认收到后再撤信号”是跨域稳健传脉冲的标准做法。

  - id: timing
    chapter: 时钟
    title: 建立时间、保持时间约束与时钟最高频率计算
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            两个同步触发器之间夹着一段逻辑计算电路。发令枪（第 1 拍时钟沿）响后，左边触发器需要 `1 ns` 把新数据送出来，中间组合逻辑最慢要算 `5 ns` 才稳稳送到右边门口；而右边接收触发器又规定：**时钟下一拍还没拍上来之前，数据必须至少提前 `0.5 ns` 静静站稳**。在不计偏斜的最简模型下，一拍时钟周期至少要留多少纳秒才不会超时出丑？
          options:
            - text: 至少 $1 + 5 + 0.5 = 6.5\text{ ns}$。必须囊括发射延迟、最慢计算时间与提前站稳窗口之和
              correct: true
            - text: 只要 $5 - 0.5 = 4.5\text{ ns}$ 就够了
              why: 数据还没送到怎么能在截止线之前扣掉准备窗口？三段时间必须全部加起来。
            - text: 只要 `0.1 ns` 就够了，时钟越快芯片永远越稳
              why: 周期缩短到小于 6.5 ns，下拍沿到来时新计算结果还没赶到门口站稳，采样必错（建立违例）
          explain: |
            数据从发射触发器出来要 `1 ns`，组合逻辑最慢 `5 ns`，还要在下一个时钟沿之前提前 `0.5 ns` 站稳，所以周期至少 `6.5 ns`。这一课用两条不等式分析时序：**最晚路径检查建立时间（决定最高主频）**，**最早路径检查保持时间（防止新数据过早冲掉旧数据）**。
      - card:
          title: 建立时间（Setup Time）与最高时钟频率
          body: |
            - **建立时间（$t_{setup}$）**：在**时钟有效沿到来之前**，输入数据 $D$ 必须提前到达并保持稳定的最短时间；
            - **建立约束公式（简化同沿、无时钟偏斜模型）**：发射端最大触发延迟 $t_{cq,max}$ + 中间组合最大传播延迟 $t_{pd,max}$ + 接收端 $t_{setup} \le T_{clk}$；
            - **实战算主频**：已知 $t_{cq,max} = 1\text{ ns}$，组合逻辑延迟 $5\text{ ns}$，$t_{setup} = 0.5\text{ ns}$：
              1. 最小周期 $T_{min} = 1 + 5 + 0.5 = 6.5\text{ ns}$；
              2. 最高时钟频率 $f_{max} = \frac{1}{6.5\text{ ns}} = \frac{1000}{6.5}\text{ MHz} \approx 153.85\text{ MHz}$（约 **154 MHz**）。
          reveal:
            - title: 现实工程里除了这三段还考虑什么裕量？
              body: |
                真实芯片上同一根时钟线到达不同角落会有时间差（时钟偏斜 Clock Skew）和周期抖动（Jitter），设计工具会自动按温度电压最坏工艺角额外留足安全裕量。
      - card:
          title: 保持时间（Hold Time）与“最早到达污染路径”检查
          body: |
            **保持时间（$t_{hold}$）**：在**时钟有效沿到来之后**，旧输入数据还必须继续稳稳赖在门口不动、不能过早被新波浪冲走的最短时间。
            **千万别和建立搞混**：同一边沿发射出来的新数据如果走一条极短直通小路太快冲到右边，就会把右边正在抓这一拍旧数据的窗口直接踢乱。
            - **保持约束公式（无偏斜模型）**：最早触发变化延迟 $t_{cq,min}$ + 最短组合污染延迟 $t_{cd,min} \ge t_{hold}$；
            - **工程铁律**：出现建立违例可以靠**调慢时钟频率（拉长 $T_{clk}$）**救活；但同边沿保持违例与周期长度 $T_{clk}$ 无关——放慢主频**绝对救不了保持违例**，必须往最短直通小路上加延迟缓冲器修。
          reveal:
            - title: 算一遍具体数字感受“保持时间撞车”怎么发生
              body: |
                假如某条直通短路径 $t_{cq,min} = 0.2\text{ ns}$、中间几乎没有门延迟仅 $t_{cd,min} = 0.1\text{ ns}$，而接收触发器规定沿后至少守住旧值 $t_{hold} = 0.5\text{ ns}$。那么时钟沿一响起，才过 $0.2 + 0.1 = 0.3\text{ ns}$ 新波浪就冲到了右端门口，提前 `0.2 ns` 踢坏了旧采样窗口。就算把时钟周期放慢到 1 秒一次也照样在同一边沿后 `0.3 ns` 撞毁。
      - item:
          id: setup-period-c4
          type: number
          prompt: |
            简化无时钟偏斜模型下，发射触发器时钟到输出最大延迟 $t_{cq,max} = 1\text{ ns}$，中间组合逻辑延迟 $5\text{ ns}$，接收触发器建立时间 $t_{setup} = 0.5\text{ ns}$。最小允许时钟周期是多少纳秒（填小数）？
          answer: 6.5
          hint: '将三段时间直接相加：$1 + 5 + 0.5$。'
          explain: |
            最小周期 $T_{min} = 6.5\text{ ns}$，对应最高工作时钟频率 $1 / 6.5\text{ ns} \approx 153.85\text{ MHz}$（约 `154 MHz`）。
      - item:
          id: freq-from-period-choice
          type: choice
          prompt: |
            沿上面算出的最小合法周期 $T_{min} = 6.5\text{ ns}$，该两级寄存器电路能稳定工作的最高时钟频率最接近哪一项？
          options:
            - text: '约 154 MHz（精确约 153.85 MHz）'
              correct: true
            - text: '650 MHz'
              why: '频率倒数算式为 $1000 / 6.5 \approx 153.85\text{ MHz}$，而不是 $100 \times 6.5$'
            - text: '200 MHz'
              why: '200 MHz 的时钟周期只有 $1000 / 200 = 5\text{ ns} < 6.5\text{ ns}$，会直接引发建立时间违例。'
          explain: |
            记忆单位换算妙招：**`1 / (纳秒 ns) = GHz = 1000 / (纳秒 ns) MHz`**，所以 $1000 / 6.5 \approx 153.85\text{ MHz}$。
      - item:
          id: hold-violation-fix
          type: choice
          prompt: |
            芯片样片流片测试时发现两级触发器之间一条几乎没逻辑门的直通短线太快变化（$t_{cq,min} + t_{cd,min} < t_{hold}$），产生了严重的**保持时间违例**。把系统工作时钟主频降慢一半能修好这个问题吗？
          options:
            - text: 不能。同一边沿的保持时间违例发生在刚采样的同一时钟沿瞬间，与下一个时钟沿来得有多慢无关；必须增加最短路径延迟（插缓冲器）来修
              correct: true
            - text: 能。不管什么时序毛病，把主频调慢一倍永远保证解决一切问题
              why: 降频只会拉长周期解决“迟到超时”的建立违例；新数据过早从同一起跑沿冲撞旧采样点的保持违例跟周期无关。
            - text: 把主频提快十倍就能解决保持违例
              why: 提高频率只会引发更严重的建立违例，同样改不了触发同沿之后的早期撞车
          explain: |
            因此芯片厂最怕**保持违例**——建立违例还能降频凑合跑，保持违例芯片直接报废必须改版垫短路径。
      - item:
          id: timing-path-match
          type: match
          prompt: |
            把同步时序分析的两个核心检查配给它们各自盯住的路径与窗口方向。
          pairs:
            - ["建立时间检查（$t_{setup}$）", "盯住最慢最迟路径：沿未到达接收端之前数据须提前站稳，决定最高时钟频率"]
            - ["保持时间检查（$t_{hold}$）", "盯住最快最短路径：沿刚刚采完之后数据须再留稳一小段，不被本拍新波冲掉"]
            - ["最小合法周期公式（无偏斜同沿）", "$T_{min} = t_{cq,max} + t_{pd,max} + t_{setup}$"]
          explain: |
            建立看最慢上界 + 周期，保持看最快下界 + 同沿瞬时，思路永不混淆。

  # ==== 时序与逻辑实现 ====
  - id: gate-delay
    chapter: 时序与逻辑实现
    title: 污染延迟 vs 传播延迟、毛刺与宽容门保障
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            当输入引脚 `A` 在 $t=0$ 时刻从 `0` 切换到 `1` 后，门电路内部晶体管与连线不是瞬间完成充放电的：在最快的温度工艺下，`0.2 ns` 后输出端可能就开始受影响出现小抖动；但直到 `1.2 ns` 之后，输出端才 100% 保证稳稳停在最终新结果上。为什么元件手册非要同时给出这两个一早一晚的时间边界？
          options:
            - text: 最早开始变的时间用于查“会否冲撞保持时间”；最晚彻底稳定的时间用于查“会不会错过下个时钟的建立时间”，缺一不可。
              correct: true
            - text: 只是把同一个数字不小心抄成了两个不同名字
              why: 最快变化边界和最慢稳定边界物理成因与时序检查用途完全相反。
            - text: 因为逻辑门每天早上最快、晚上最慢
              why: 芯片在不同工艺、供电和温度以及信号先走短支路还是长支路时，到达快慢本来就是一个区间范围
          explain: |
            这两个一快一慢边界分别叫**污染延迟（$t_{cd}$）**和**传播延迟（$t_{pd}$）**，还牵出电路的**宽容性（Leniency）**概念。
      - card:
          title: 污染延迟（$t_{cd}$）、传播延迟（$t_{pd}$）与瞬间毛刺
          body: |
            对于任何一个组合逻辑器件：
            - **污染延迟（Contamination Delay，$t_{cd}$）**：输入开始变动后，**最快可能过多久输出就已经受污染不再保真**（用于计算保持检查里的最短安全下界）；
            - **传播延迟（Propagation Delay，$t_{pd}$）**：输入全部稳定到位后，**最晚不超过多久输出保证稳定给出正确最终值**（决定关键最慢路径长度与时钟周期）；
            - **多路径竞争毛刺**：同一输入分两路一快一慢汇合到一个门时，稳态虽然正确，中途可能短暂闪出一道微小假脉冲（只要下一拍时钟沿到来前稳住就无碍）。
          reveal:
            - title: 举个极简例子：为什么 $A \cdot \overline{A}$ 在真实门上会短暂闪出一道 `1`？
              body: |
                纸上写 $A \cdot \overline{A}$ 恒为 `0`。但在真实硬件里，`A` 一根直连进与门，另一路必须多穿过一只“非门”（花 `1 ns` 才反转）。当 `A` 刚从 `0` 变成 `1` 的头 `1 ns` 里，直连那条腿已经是 `1`，经过非门那条腿还来不及撤回之前的 `1`——于是两只脚同时是 `1`，与门输出端竟会短暂闪出一小道不该存在的 `1` 毛刺。
      - card:
          title: 宽容门（Lenient Gates）：被一个输入统治的结果提前稳定
          body: |
            平常我们以为“必须所有输入全稳定后，$t_{pd}$ 才开始计时”；但有些满足**宽容性质（Lenient）**的门具有额外甜头：
            - 例如或非门（NOR）：只要其中 `A` 输入已经稳稳停在 `1`（统治了结果，不管 `B` 是 0 还是 1，输出肯定都是 `0`），哪怕另一路 `B` 还在半路上缓慢爬升波动，输出端在等完延迟后也能提前稳定给出确定无毛刺的 `0`。
      - item:
          id: tcd-vs-tpd-match
          type: match
          prompt: |
            把时序文档里两个核心延迟边界指标和它们各自的工程用法配对清楚。
          pairs:
            - ["污染延迟 $t_{cd}$（Contamination Delay）", "输入变动后输出最早可能开始变脏失效的最短时间，用于保持时间检查"]
            - ["传播延迟 $t_{pd}$（Propagation Delay）", "输入就绪后输出最迟保证到达稳定有效新值的最长时间，用于建立时间检查"]
            - ["组合逻辑中间短暂假脉冲（毛刺）", "一条信号分两条一快一慢路径先后抵达引起，只要时钟采样前稳定就不算逻辑错"]
          explain: |
            口诀：**$t_{cd}$ 管最早别弄脏（Check Hold），$t_{pd}$ 管最晚快送到（Check Setup）**。
      - item:
          id: lenient-nor-choice
          type: choice
          prompt: |
            某款具有**宽容性质（Lenient）**的二输入 **NOR（或非）门**：已知输入 `A` 早已稳稳落在 `1`，而另一输入 `B` 还在 `0 → 1` 慢吞吞转换且路过中间不确定区。按宽容器件规范，经历门传播延迟后，输出端可以保证什么？
          options:
            - text: 稳稳输出确定有效的 `0`（因为 `A=1` 作为支配输入已经足够锁定 `NOR(1, ?) = 0`）
              correct: true
            - text: 必定输出 `1`，因为只要有任意一根输入不确定输出就反转成 1
              why: 对 NOR 而言只要有任何一路明确为 1（OR 出 1 再非为 0），结果就已经铁板钉钉是 0 了
            - text: 输出永远毁坏报错无法得出 0 或 1
              why: 普通非宽容门不给保证，而专有“宽容”规格允许利用支配输入提前确保确定输出
          explain: |
            对 AND/NAND 而言 `0` 是支配输入；对 OR/NOR 而言 `1` 是支配输入。
      - item:
          id: critical-path-choice
          type: choice
          prompt: |
            串联三级组合逻辑门时，第一级每个门传播延迟 `1 ns`、第二级 `2 ns`、第三级 `1.5 ns`，另有一条直接跨过前三级的短旁路只经过 1 只延迟 `0.8 ns` 的门。计算建立检查的电路最慢总传播延迟 $t_{pd,max}$ 与保持检查的电路最快总污染延迟，思路应该分别是？
          options:
            - text: 最慢传播延迟沿最长串级路径相加（`1 + 2 + 1.5 = 4.5 ns`）；最快污染延迟沿最短路径（`0.8 ns`）考察
              correct: true
            - text: 两个延迟全都只按平均数 `1.3 ns` 算就足够
              why: 最慢决定会不会来不及，最快决定会不会过早弄脏数据，拿平均值看两边都会出错。
            - text: 两个延迟都必须永远乘起来得到 `2.4 ns`
              why: 串级各门延时是时间先后叠加，并行两条支路分别挑最长一条和最短一条看极端值
          explain: |
            时序分析永远按极端最差边界：**最长最慢路径算上界，最短最快路径算下界**。

  - id: pipeline
    chapter: 时序与逻辑实现
    title: 流水线设计：延迟（Latency）vs 吞吐率（Throughput）与对齐
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            有一块总耗时需要 `6 ns` 的大组合计算电路，如果不切分只能每隔 `6 ns` 算完 `1` 件零件（好比一个人从头洗菜切菜炒菜花 60 分钟做好一道菜）。现在我们在中间刚好切成等长的 `3` 级（每级只要 `2 ns`），级与级之间放上同步寄存器隔开。把生产线连续喂满运转起来后，每隔多久就能吐出 `1` 件成品？
          options:
            - text: 在理想忽略寄存器开销时，每隔短短 `2 ns` 就能产出 1 件成品。因为第 1 件进第 2 级时，第 2 件已经同时进第 1 级干活了。
              correct: true
            - text: 依然必须每 `6 ns` 才出 1 件，多加寄存器纯属白干活
              why: 流水线寄存器让 3 项不同先后任务同时在 3 个工位并排加工，启动出货节奏变成最慢那 1 级的周期。
            - text: 变成每 `18 ns` 才能出 1 件
              why: 切分流水线是把吞吐率拉升约 3 倍，而不是变慢 3 倍
          explain: |
            理解计算机体系结构最重要的一对词——**单件延迟（Latency）** vs **稳态吞吐率（Throughput）**。
      - card:
          title: 切分流水线：吞吐率翻倍，单件延迟反而微增
          body: |
            **流水线（Pipeline）**通过在较长组合逻辑中间插入同步**寄存器（Register）**把计算切分成多级：
            - **吞吐率（Throughput）**：单位时间能完成多少件（= `1 / 时钟周期`）。如果最慢那一级只要 `2 ns` 加上少量寄存器开销，出货速度近乎提升为原来的 $K$ 倍。
            - **单件延迟（Latency）**：单独挑**某一件任务从头到尾穿过整条线要花几纳秒**。因为中间多插了寄存器（每次过寄存器都要加触发延迟和建立开销），**单件总耗时不仅没缩短，反而比未切分时还略微多一点点**。
          reveal:
            - title: 流水线切分最常踩的坑：不同支路“跨过不一样多级寄存器”
              body: |
                设计 K 级流水线画一条切线横穿所有数据路径和控制信号：**必须让同一次输入带着的所有支路数据与控制信号跨过完全相同数量的寄存器拍数**。如果左路过了 1 拍、右路过了 2 拍就汇合相加，你加起来的其实是“下一件的新左边 + 上一件的旧右边”，全盘算错。
            - title: 逐拍看懂 2 级流水线为什么 5 拍跑完 4 件任务
              body: |
                记 4 个任务为 `T1, T2, T3, T4`：第 1 拍 `T1` 进 Stage 1；第 2 拍 `T1` 进 Stage 2 完成、`T2` 进 Stage 1；第 3 拍 `T2` 完成、`T3` 进 Stage 1；第 4 拍 `T3` 完成、`T4` 进 Stage 1；第 5 拍 `T4` 离开 Stage 2 全部收官。这就是满载时“每个新拍完成 1 件”的高吞吐。
      - item:
          id: pipeline-4-items-cycles
          type: number
          prompt: |
            一条标准的 `2 级` 同步流水线（每个任务依次在 Stage 1 花 `1` 拍、在 Stage 2 花 `1` 拍），初始时管道全空，之后从第 1 拍开始每个时钟周期连续不停送入 1 个新任务，一共连续送入 `4` 个任务且无任何停顿。全部 `4` 个任务都做完吐出共需要几拍？
          answer: 5
          hint: '先算第 1 个任务从进入 Stage 1 到离开 Stage 2 需要几拍；之后管道满载状态下，余下 3 个任务还需各自多等几拍完成？'
          explain: |
            经典流水线排程公式：**$(K - 1) + N = (2 - 1) + 4 = 5$ 拍**（第 2 拍完成第 1 件，第 3、4、5 拍相继完成第 2、3、4 件）。
      - item:
          id: latency-vs-throughput-trap
          type: choice
          prompt: |
            把原本一个总延迟 `6 ns` 的大组合电路切分成了均衡的三级流水线（每级组合 `2 ns`，忽略寄存器开销按理想 `2 ns` 一拍算）。对“**延迟**”和“**吞吐率**”的变化描述完全准确的是？
          options:
            - text: 稳态吞吐率提升了约 3 倍（每 2 ns 完成 1 件），但单个任务独自穿过全线所需的总延迟依然至少为 6 ns（加上真实寄存器开销甚至略大于 6 ns）
              correct: true
            - text: 单个任务从进入第 1 级到离开第 3 级只需要短短 2 ns 就能跑完全部 3 个阶段
              why: 单个任务依然要挨个走完 3 级共 3 拍（至少 6 ns），变快的是“同时装多件并行带来的整体出货节奏”
            - text: 吞吐率反而降到原来的 1/3
              why: 时钟周期缩短到由最慢单一阶段决定，稳态产出速度显著提高
          explain: |
            记住：“**流水线把时间换成发车密度（提高吞吐率），单趟列车过全程时间（延迟）其实还微增了换乘寄存时间。**”
      - item:
          id: pipeline-skewed-branch
          type: choice
          prompt: |
            一条 3 级流水线中，输入 `X` 分成了两路去算：左半边结果走了 `1` 个流水寄存器就提前到了终点加法器门口，而右半边结果经过 `2` 个流水寄存器才到达终点。如果直接把两边连一起相加会出什么错？
          options:
            - text: 时间不对齐。左半边送来的是下一条输入的数据，跟右半边上一条还没走完的数据混在一起错位相加了；必须给左边补齐一个平衡对齐寄存器
              correct: true
            - text: 会自动按名字相同在空气里等着右半边
              why: 同步寄存器每一拍都会刷新吐出下一批新数据，必须显式对齐经过相同的寄存器拍数
            - text: 左边少过一级会直接使最终数字自动准确加倍
              why: 错位相加属于严重数据错拍 bug
          explain: |
            画分界切线法（Cut-set Pipelining）：保证从输入边界到输出边界任意一条通路跨过的寄存器个数严格相等。
      - item:
          id: balanced-stages-why
          type: choice
          prompt: |
            把一个总耗时 `8 ns` 的逻辑切分成两级流水线时，切法 A 是“第 1 级 `4 ns` + 第 2 级 `4 ns`”；切法 B 是“第 1 级 `7 ns` + 第 2 级 `1 ns`”。哪种切法能让时钟频率跑得更快？为什么？
          options:
            - text: 切法 A（`4 ns / 4 ns`）更快。因为流水线的时钟周期受限于“全线最慢那一级”：A 只需 4 ns 一拍，而 B 必须迁就 7 ns 的第一级
              correct: true
            - text: 切法 B（`7 ns / 1 ns`）更快，因为只要看第 2 级只有 1 ns 就够了
              why: 全局同步时钟必须等全线所有各级都稳定完成才能跳下一拍，1 ns 再快也得干等 7 ns 那一级。
            - text: 两种切法频率一模一样，永远只看 8 ns 之和
              why: 木桶效应决定了流水线切分必须追求各阶段尽量**均衡划分延迟**。
          explain: |
            流水线性能遵循“木桶效应”——切成尽量等长均衡的 $K$ 段，吞吐收益才能逼近理想上限 $K$ 倍。

  - id: self-time
    chapter: 时序与逻辑实现
    title: 部件交错复用与无全局时钟请求/应答自定时握手
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            如果手里有一个死活切不开的现成计算核（比如每次吃进 1 项数据必须闷头算整整 `2` 拍才吐结果），想把系统的接单速度提升到“每 `1` 拍都能吃进 1 个新任务”，能怎么办？
          options:
            - text: 复制出两份一样的计算核并交替轮流派活（第 1 拍给核 A、第 2 拍给核 B、第 3 拍又轮回闲下来的核 A）——整体每拍接一单，单件仍算 2 拍。
              correct: true
            - text: 拿剪刀直接把单个计算核物理掰碎就自动变 1 拍
              why: 当单个计算部件本身不可拆细时，常用“多份复制交错轮转（Circuit Interleaving）”换取整体吞吐
            - text: 复制两份之后，每单自己内部计算时间会自动缩成半拍
              why: 核 A 收到任务后依然自己老老实实花满 2 拍才算完，缩短的是整体派发启动间隔
          explain: |
            如果不能用“拆成两段（流水线）”，那就用“并排买两个轮流干（**部件交错**）”换吞吐。还有，如果跨边界两个部分根本没有同一根全局时钟，那就靠**请求/应答握手协议**协调节奏。
      - card:
          title: 部件交错复用（Circuit Interleaving）
          body: |
            面对根本拆不开的多拍大核心（假设算完 1 件必须花满 $K$ 拍）：
            - **做法**：横向复制 $K$ 份一模一样的计算单元，前端按拍轮流塞给第 `1, 2, ..., K` 号，后端按序把先算完的结果依次并回输出；
            - **代价与收益**：整体立刻达到**每拍接 1 单、每拍出 1 单**的 $K$ 倍吞吐率，但单个任务自己内部仍然跑足完整 $K$ 拍延迟，且芯片硅片面积直接乘以 $K$。
      - item:
          id: interleave-single-latency
          type: choice
          prompt: |
            单个不可拆分的加密部件每次加工 `1` 组数据都要花 `2` 拍。我们横向复制了 `2` 份完全相同的加密部件并配置交错轮流派活，整体做到理想“每拍新开一单、每拍出一单”。问：**其中单独某一组数据从送入到算完出来，自己还是至少要经过几拍？**
          options:
            - text: 至少 `2` 拍（单件延迟一点也没缩短，只是两台并排轮流干抬高了吞吐率）
              correct: true
            - text: 只花 `1` 拍
              why: 整体每拍吐 1 件靠的是甲乙交替错开一拍交错完成，每单自身在某一份部件里依然得算满整整 2 拍。
            - text: 需要 `10` 拍
              why: 复制并列运行不增加单个部件自己的原本算力拍数
          explain: |
            不管是流水线还是多份交错，都要把“单件用时延迟”和“平均隔多久出厂一件的吞吐”清清楚楚分开算。
      - card:
          title: 无全局时钟时的“自定时请求/应答握手”
          body: |
            当收发两端没有一根统一全局节拍线（或每次工作耗时不固定）时，改用双线四相握手规矩：
            - **发送方**：先把新数据稳定摆在总线上，再拉高 **`Req`（请求）** 通知：“数据就绪可以取了。”；
            - **接收方**：空闲并确实取稳数据后，拉高 **`Ack`（应答）** 回复：“已拿稳。”（忙时就压着不拉高 `Ack`，反压让对方等待）；
            - 发送方见到 `Ack` 后撤销 `Req`，接着安全切换下一项。
          reveal:
            - title: 为什么必须是“数据先稳再拉高 Req”，而不是先拉 Req 再放数据？
              body: |
                因为接收端一旦看到 `Req` 上升沿就可以立刻去采总线上的值。如果先抬高 `Req` 再慢吞吞去摆数据，接收方就会一脚踩进“半新不旧”的错误垃圾数据里。同理，没等到对方 `Ack` 返回之前也绝不能撤走旧数据，否则忙着没腾出手来拿数据的接收方就会彻底丢包。
      - item:
          id: req-ack-order
          type: choice
          prompt: |
            在异步自定时握手协议中，发送方正准备送出一笔新数据到总线上，它按先后顺序必须先做哪一步，再做哪一步？
          options:
            - text: 先把新数据信号稳定放在数据总线上，确认稳妥后再拉高 `Req` 请求线通知接收方取数
              correct: true
            - text: 先拉高 `Req` 把接收方喊来读取，过几拍后再慢悠悠往总线上写数据
              why: 看到 `Req` 有效时接收方随时可能立即读取总线，数据没放稳会直接读到脏乱旧值
            - text: 从来不用管 `Req`，永远直接每隔一拍就随便改数据
              why: 没有共同全局时钟时，必须用 `Req/Ack` 握手确保双方对齐数据有效窗
          explain: |
            顺序铁律：**数据稳定到位 → 拉高 `Req` → 对方取完拉高 `Ack` → 撤 `Req` 归位准备下一轮**。
      - item:
          id: handshake-before-ack
          type: choice
          prompt: |
            采用典型异步请求-应答（`Req / Ack`）握手协议传数据时，发送方已经稳定摆出旧数据并拉高了 `Req`，但发现接收方此时正忙、还没有拉高 `Ack` 应答信号。发送方现在应该做什么？
          options:
            - text: 老老实实保持当前数据和 `Req` 信号稳定不动，一直等到确认收到接收方拉高的 `Ack` 才撤回并改放下一项新数据
              correct: true
            - text: 不等 `Ack` 直接把总线上的数据硬覆盖换成下一项新数据
              why: 接收方忙着还没取走旧数据时直接冲掉，会导致旧数据永久丢失或采样到撕裂废数据。
            - text: 自己顺手把 `Ack` 线强行剪断
              why: '`Ack` 是接收方用来反压控制节奏、告诉发送方“我已经拿稳了”的关键反馈线'
          explain: |
            谁还没回 `Ack`，谁上面的旧数据就绝对不能撤——这就是硬件异步反压防丢包的铁律。
      - item:
          id: timing-methods-match
          type: match
          prompt: |
            把三类提高并发与协调数字电路节奏的手段配对到各自核心理念。
          pairs:
            - ["流水线切分（Pipelining）", "靠级间插寄存器把大组合块切短，让不同前后任务同时在各级重叠推进"]
            - ["部件交错（Interleaving）", "面对不可切细的多拍部件，复制多份交替派活换取高吞吐率"]
            - ["异步握手协议（Req / Ack）", "无全局时钟或耗时不均时，靠请求与应答信号控制数据稳住与按序流转"]
          explain: |
            懂延迟与吞吐分离、懂切分同步又懂无时钟反压握手，你就真正摸透数字控制节奏的底层规律了。

boss:
  items:
    - id: boss-noise-margin-num
      type: number
      prompt: |
        数字输出器件高电平下限保证输出 $V_{OH} = 2.4\text{ V}$，下级接收端认作高电平的最低输入门槛 $V_{IH} = 2.0\text{ V}$。该高电平连线的高电平噪声容限是多少伏（填小数）？
      answer: 0.4
      explain: |
        $NM_H = V_{OH} - V_{IH} = 2.4 - 2.0 = 0.4\text{ V}$。
    - id: boss-kmap-c4
      type: choice
      prompt: |
        用卡诺图化简三输入逻辑式 $F(A, B, C) = \sum m(1, 3, 5, 6, 7)$，以下最简与或逻辑式哪一项正确？
      options:
        - text: '$F = C + AB$'
          correct: true
        - text: '$F = ABC$'
          why: 输入 `(0,0,1)` 时 `ABC=0` 却落在 `m1` 需要输出 `1`
        - text: '$F = A + BC$'
          why: 对照 `m1(0,0,1)` 会算出 `0` 而对不上真值表
        - text: '$F = \overline{C} + AB$'
          why: 奇数最小项 `1,3,5,7` 全都对应 `C=1` 而非 `\overline{C}`
      explain: |
        4 个奇数项合并成 `C`，加上 `m6(1,1,0)` 与 `m7(1,1,1)` 合成 `AB`，化简结果为 `C + AB`。
    - id: boss-nand-c4
      type: choice
      prompt: |
        把 $F = C + AB$ 彻底改成**仅用双输入与非门（NAND）**实现时（允许把单输入端同时接进一只与非门两端当非门），标准三门方案的原理和门数量分别是？
      options:
        - text: 共 3 只与非门：第 1 只算 $\overline{AB}$，第 2 只两端接 C 算 $\overline{C}$，第 3 只对前两者再求与非利用德摩根得出 $C + AB$
          correct: true
        - text: 共需 3 只普通的 AND 与门串联起来就行了
          why: 仅用 AND 门根本变不出取反或运算，NAND 才是万能门
        - text: 只用 1 只与非门什么都不用变换直接得出 C + AB
          why: 1 只双输入 `NAND(A,B)` 只实现 $\overline{AB}$，无法同时完成 3 个输入上的与或规则
        - text: 与非门永远做不出任何带或 `+` 的逻辑功能
          why: 借德摩根 $\overline{\overline{X}\cdot\overline{Y}} = X + Y$ 就能把与非级联等价换成或逻辑
      explain: |
        `nand(not_ab, A, B)`、`nand(not_c, C, C)`、`nand(F, not_ab, not_c)` 三只门遍历全 8 种真值与 `C + AB` 丝毫不差。
    - id: boss-adder-c4
      type: choice
      prompt: |
        关于 1 位全加器逻辑式与 4 位超前进位加法器原理，下面哪项全部说对了？
      options:
        - text: $S = A \oplus B \oplus C_{in}$，$C_{out} = AB + C_{in}(A \oplus B)$；4 位行波进位瓶颈是进位从最低位逐级滚向最高位，超前进位靠提前计算 $G=AB$ 与 $P=A\oplus B$ 并行展开各位进位提速
          correct: true
        - text: $S = A \cdot B$，$C_{out} = A \oplus B$；行波加法器完全没有任何传播链等待
          why: 把和与进位逻辑写反了，行波恰恰必须一级一级等低位进位传过去
        - text: 当 $A=1, B=1, C_{in}=1$ 时，和 $S=0$、进位 $C_{out}=1$
          why: $1+1+1 = 3$ 写成二进制 `11`，低位和 `S=1`、高位进位 `Cout=1`
        - text: 4 位行波进位加法器的最高位进位 $C_4$ 无需等待低位进位，在输入到来的第 1 级门延迟内就能直接产出
          why: 行波进位每一位的进位输出都依赖低一位进位先算完，最高位必须等进位链逐级传完才能稳定
      explain: |
        彻底吃透全加器、$G/P$ 思想与进位关键路径，就掌握了芯片 ALU 核心算术基础。
    - id: boss-latch-flipflop-c4
      type: choice
      prompt: |
        设计高速同步数字电路时，关于 **D 锁存器** 和 **D 触发器** 的差异哪项准确？
      options:
        - text: D 锁存器在使能高电平期间透明跟随输入 D 变化、撤掉使能锁住旧值；D 触发器只在时钟跳变沿瞬间采样并保存到下一拍
          correct: true
        - text: 只要在时钟周期里使能停在低电平，D 锁存器的输出照样随时立刻跟着 D 变
          why: 使能关掉时锁存器会锁住旧状态；只有使能有效期间才透明跟随
        - text: D 触发器每 1 纳秒无论时钟动不动都会不断刷新把 D 穿通给 Q
          why: 边沿触发器在边沿之外哪怕 D 来回跳变也牢牢封存上一拍的采样结果
        - text: D 锁存器和 D 触发器完全没有任何区别只是拼写名字不同
          why: 电平透明 vs 边沿采样是数字时序架构分水岭般的本质区别
      explain: |
        边沿触发把时间整齐切成一拍一拍，才让同步电路可算、可测、少毛刺干扰。
    - id: boss-mealy-101-c4
      type: choice
      prompt: |
        设计一个允许重叠检测 `101` 的 Mealy 有限状态机（`S0` 未匹配前缀、`S1` 刚收到末尾 `1`、`S2` 刚收到末尾 `10`）。当处在 `S2` 并迎来新比特 `1` 时，转移结果与整个系统收到序列 `10101` 时共输出几次 `1`？
      options:
        - text: '`S2` 收到 `1` 时输出 `1` 并转移回 `S1`（保留最后的 `1` 作下组开头）；输入 `10101` 共报告 `2` 次命中（第 3 位和第 5 位）'
          correct: true
        - text: '`S2` 收到 `1` 时必须退回 `S0` 且 `10101` 只报告 `1` 次命中'
          why: 题设明确要求“允许重叠”，`10101` 的第 3~5 位同样构成一段合法 `101`
        - text: '`S2` 收到 `1` 时输出 `0` 并停留在 `S2`'
          why: 已有 `10` 再迎 `1` 恰凑齐 `101`，必须立刻在转移上输出 `1` 报告匹配
        - text: '`S2` 收到 `1` 时输出 `1` 并直接跳到 `S2`，把刚收到的 `1` 当作 `10` 前缀'
          why: 刚收到的末尾是单个 `1`（对应 `S1`），还缺一个 `0` 才能到 `S2`，因此应转移回 `S1` 而非停在 `S2`
      explain: |
        3 个状态 + 转移时保住最长重叠后缀，是有限状态机设计课本级典范。
    - id: boss-timing-c4
      type: number
      prompt: |
        简化无时钟偏斜模型中，发射触发器时钟到输出最大延迟为 `2 ns`，两级之间组合逻辑最大延迟为 `4 ns`，接收触发器建立时间为 `1 ns`。合法的最小时钟周期至少是多少纳秒？
      answer: 7
      hint: '把这三段顺序等待与准备时间相加：$2 + 4 + 1$。'
      explain: |
        $T_{min} = 2 + 4 + 1 = 7\text{ ns}$，对应最高频率约为 $1000 / 7 \approx 142.86\text{ MHz}$。
    - id: boss-hold-path
      type: choice
      prompt: |
        进行同步电路时序检查时，为什么要区分“检查建立时间用的最大路径”与“检查保持时间用的最短污染路径”？
      options:
        - text: 建立怕新数据太晚没赶上，所以挑最慢组合延迟加周期检查；保持怕同沿发出的新变化跑太快把旧采样值踢掉，所以紧盯最快最短污染路径检查
          correct: true
        - text: 两者全都只需随便看看平均耗时就行，最快最慢永远没区别
          why: 时序违例恰恰出在极端快与极端慢两个最坏边界角上
        - text: 发现保持时间违例只需在控制台把系统时钟频率再翻快一倍就行
          why: 同边沿保持时间违例与周期长短无关，慢调频率也救不了，必须垫高最短路径延迟
        - text: 组合器件不存在任何最晚或最早延迟，全电路固定等于 0 秒
          why: 所有真实门和连线都有非零的最小污染延迟与最大传播延迟
      explain: |
        建立看最慢防超时，保持看最快防抢跑，两把标尺守全同步芯片。
    - id: boss-cmos-dual
      type: choice
      prompt: |
        在静态 **CMOS** 二输入 **NOR（或非）门** 的晶体管实现里，下拉 NMOS 网络和上拉 PMOS 网络的连接方式分别是？
      options:
        - text: 下拉 NMOS 管并联（任一输入为 1 就拉低到 0），上拉 PMOS 管串联（两个全为 0 才拉高到 1）
          correct: true
        - text: 下拉 NMOS 管串联，上拉 PMOS 管并联
          why: 下串上并做成的是“全 1 才拉低”的 NAND（与非门），不是 NOR
        - text: 上下拉全部全用 NMOS，不接任何电源也不接地
          why: 标准静态 CMOS 必由上拉 PMOS 接电源与下拉 NMOS 接地互相对偶构成
        - text: 上拉 PMOS 管并联，下拉 NMOS 管也并联
          why: 上下拉必须串并互补对偶；若两边都并联，当输入一个为 0 一个为 1 时上下同时导通会把电源到地直接短路。
      explain: |
        理解“P 管串联、N 管并联 = NOR”与“P 管并联、N 管串联 = NAND”，CMOS 门级设计手到擒来。
    - id: boss-pipeline-throughput
      type: choice
      prompt: |
        原本耗时 10 ns 的无寄存器组合计算块，切成均衡的 5 级流水线（每级 2 ns，假设忽略理想级间触发开销），稳态每拍送入新输入。与不切分前相比，“稳态吞吐率”和“单个任务从进到出所花总延迟”分别怎么变？
      options:
        - text: 稳态吞吐率翻升为约 5 倍（每 2 ns 完成 1 件），但单个任务穿过 5 级所需总延迟依然至少 10 ns（现实加上寄存器开销还会比 10 ns 略长）
          correct: true
        - text: 单个任务的总延迟缩短成只有 2 ns，比单级组合计算快 5 倍
          why: 每件仍必须踏踏实实走完 5 级共 5 拍（>= 10 ns），切分缩短的是相邻两件“出厂间隔时间”
        - text: 稳态每拍反而要等满 50 ns 才能发出一件
          why: 流水线把每一拍缩短为最慢单级（2 ns），稳态即可每 2 ns 出一件
        - text: 流水线中间的寄存器不用对齐支路拍数，左边 1 拍右边 4 拍随便相减就行
          why: 多路支路汇合前必须保持跨过完全相等的寄存器级数，否则不同批次的数据会错乱打架
      explain: |
        祝贺通关《数字电路与数字逻辑》。从电压噪声容限到 CMOS、卡诺图全 NAND、全加器、状态机、时序约束再到流水线与异步握手，你已经掌握打造数字芯片的完整基石。
