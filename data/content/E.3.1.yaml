skill: E.3.1
version: 2
authors: [main-agent]
brief:
  why: 手机充电器、电脑电源、电动车的电机驱动、光伏逆变器和高压直流输电，都靠电力电子电路把电能从一种形式变成另一种形式。这一关从“为什么用开关而不用线性调整”讲起，学功率器件、整流、DC-DC 变换、逆变和 PWM、缓冲电路和软开关、变换器的平均模型和反馈控制，最后学电感和变压器怎样设计。假设你学过模拟电子技术（二极管、MOSFET、负反馈、开关稳压电路的概念）和微积分。
  outcomes:
    - 比较二极管、晶闸管、MOSFET、IGBT 和 SiC、GaN 器件，估算导通损耗和开关损耗
    - 算二极管整流和晶闸管相控整流的平均电压，说明换流重叠和有源逆变，用谐波畸变率和功率因数评价电流波形
    - 用伏秒平衡推出 Buck、Boost、Buck-Boost 和隔离型变换器的电压比，算电感电流纹波和断续导通的边界
    - 算方波逆变、正弦 PWM 和空间矢量 PWM 的输出电压，说明死区、多电平和电流控制
    - 说明缓冲电路和软开关怎样减小开关损耗，算谐振频率和特性阻抗
    - 写出变换器的状态空间平均模型和小信号传递函数，按开关频率选穿越频率，说明多环控制和数字控制的延迟
    - 由电感系数、磁感应强度和面积积设计电感和变压器，估算趋肤深度、绕组损耗和铁芯损耗
terms:
  - term: 电力电子
    def: '用半导体开关变换和控制电能的技术：整流、直流变换、逆变和交流变换'
  - term: 逆变
    def: '把直流电变成交流电，完成这一变换的电路叫逆变器'
  - term: 全控型器件
    def: '开通和关断都能用控制信号决定的功率器件，如 MOSFET 和 IGBT'
  - term: 反向恢复
    def: 'PN 结二极管从导通转为截止时，储存的电荷先被反向电流抽走，这段时间里电流反向流动'
  - term: 导通电阻
    def: 'MOSFET 完全导通时漏极和源极之间的电阻 R_DS(on)，导通损耗等于方均根电流的平方乘它'
  - term: 体二极管
    def: '功率 MOSFET 结构里自带的、从源极指向漏极的 PN 结二极管，管子关断时可以反向导电'
  - term: 超结
    def: '在 MOSFET 漂移区里交替排列 P 柱和 N 柱、让电荷互相抵消的结构，导通电阻大约只和耐压成正比'
  - term: IGBT
    def: '绝缘栅双极型晶体管：栅压控制、靠电导调制在高压下仍有约 1.5–3 V 低导通压降的全控型器件'
  - term: 电导调制
    def: '器件导通时向轻掺杂的漂移区注入大量电荷，使它的电阻大大下降的现象'
  - term: 宽禁带
    def: '禁带宽度比硅（1.12 eV）大得多的半导体，如 SiC（约 3.3 eV）和 GaN（约 3.4 eV），耐压和耐高温能力强'
  - term: 晶闸管
    def: 'PNPN 四层的半控型器件：门极脉冲触发导通，之后自己维持，电流降到维持电流以下才关断'
  - term: 维持电流
    def: '晶闸管保持导通所需的最小阳极电流，电流低于它晶闸管就恢复阻断'
  - term: 开关损耗
    def: '开关器件在开通和关断过程中电压和电流同时不为零而消耗的能量乘开关频率'
  - term: 视在功率
    def: '电压有效值和电流有效值的乘积 S = V_rms·I_rms，单位 V·A，决定线路和变压器要按多大电流设计'
  - term: 功率因数
    def: '有功功率和视在功率之比 PF = P/S；电压电流都是正弦时等于 cos φ'
  - term: 基波
    def: '周期波形分解成正弦之和时，频率和原波形相同的那个正弦分量'
  - term: 谐波
    def: '周期波形分解成正弦之和时，频率为基波整数倍的分量，n 倍的叫 n 次谐波'
  - term: 畸变因数
    def: '基波电流有效值和总电流有效值之比 I₁/I_rms，电流越接近正弦越接近 1'
  - term: 位移因数
    def: '电压和基波电流相位差的余弦 cos φ₁；功率因数等于畸变因数乘位移因数'
  - term: 总谐波畸变率
    def: 'THD：全部谐波的有效值和基波有效值之比，正弦为 0，方波约 48%'
  - term: 触发角
    def: '从晶闸管阳极电压变正（相当于二极管自然导通的时刻）到门极触发所经过的电角度 α'
  - term: 有源逆变
    def: '相控变换器在触发角大于 90° 时输出平均电压为负、电流方向不变，把直流侧的能量送回交流电网'
  - term: 换流
    def: '电流从一组导通器件转移到另一组的过程；交流侧有电感时需要一段时间才能完成'
  - term: 重叠角
    def: '换流期间新旧两组器件同时导通所经过的电角度 μ，交流侧电感和负载电流越大它越大'
  - term: 相电压
    def: '三相电源中每一相对中性点的电压，我国低压电网为 220 V'
  - term: 线电压
    def: '三相电源中两相之间的电压，有效值是相电压的 √3 倍，我国低压电网为 380 V'
  - term: 占空比
    def: '开关导通的时间占开关周期的比例 D'
  - term: 伏秒平衡
    def: '稳态下电感两端电压在一个开关周期里的平均值为 0，用来推出 DC/DC 变换器的电压比'
  - term: 连续导通
    def: 'CCM：电感电流在整个开关周期里都大于 0 的工作状态'
  - term: 断续导通
    def: 'DCM：电感电流在每个周期里有一段降到 0 并停住的工作状态，电压比和负载有关'
  - term: 正激变换器
    def: '在 Buck 里插入变压器的隔离型变换器，V_o = (N₂/N₁)·D·V_in，变压器每个周期要复位'
  - term: 反激变换器
    def: '带隔离的 Buck-Boost，用耦合电感在开关导通时储能、关断时向输出释放'
  - term: 桥臂
    def: '桥式电路里上下串联的一对开关，中点接负载，中点电压在直流正端和负端之间切换'
  - term: 电压型逆变器
    def: '直流侧并大电容、电压恒定的逆变器，输出电压是矩形波或 PWM 波'
  - term: 电流型逆变器
    def: '直流侧串大电感、电流恒定的逆变器，开关把电流轮流分配给各相'
  - term: 多电平
    def: '让桥臂输出三种或更多电压台阶的逆变器结构，如二极管钳位三电平和级联 H 桥'
  - term: 载波
    def: 'PWM 中和调制波比较的高频三角波，它的频率就是开关频率'
  - term: 调制比
    def: '正弦调制波幅值和三角载波幅值之比 m_a，不大于 1 时输出基波和它成正比'
  - term: 过调制
    def: '调制比大于 1 时调制波峰值超出载波范围，输出被削顶并出现低次谐波'
  - term: 死区
    def: '同一桥臂关一个开关、开另一个开关之间两个都关断的一小段时间，防止直通'
  - term: 空间矢量
    def: '把三相电压合成为平面上一个旋转矢量的表示法，三相逆变器的 8 种开关状态对应 8 个矢量'
  - term: 硬开关
    def: '开关在电压和电流都不为零时切换，转换过程中有交叠损耗和电压尖峰'
  - term: 缓冲电路
    def: '并在或串在开关旁边的电容、电感等元件，改变开关转换时电压电流的轨迹以减小开关应力'
  - term: 零电压开关
    def: 'ZVS：开关两端电压为零时开通或关断，没有电压电流交叠，也不烧掉输出电容的储能'
  - term: 零电流开关
    def: 'ZCS：流过开关的电流为零时开通或关断'
  - term: 软开关
    def: '零电压开关和零电流开关的合称，用谐振或辅助电路让开关转换几乎不损耗能量'
  - term: 谐振频率
    def: 'LC 电路中电感和电容电抗相互抵消的频率 f₀ = 1/(2π√(LC))'
  - term: 平均模型
    def: '对一个开关周期取平均、抹掉纹波后描述变换器平均值怎样变化的模型'
  - term: 微分方程
    def: '含有未知量的导数的方程，电感电流和电容电压的变化由它描述'
  - term: 状态变量
    def: '决定电路以后怎样变化的一组量，在变换器里是电感电流和电容电压'
  - term: 状态空间平均
    def: '把两个开关状态的状态方程按占空比加权平均，得到变换器平均模型的方法'
  - term: 小信号线性化
    def: '在工作点附近令各量等于工作点值加小变化量，略去小量乘积，把非线性方程化成线性方程'
  - term: 传递函数
    def: '线性系统中输出和输入之比，把 d/dt 换成复数 s 得到；s = j2πf 时给出各频率的幅值比和相位差'
  - term: 极点
    def: '让传递函数分母为零的 s 值；极点都在复平面左半边时系统稳定'
  - term: 穿越频率
    def: '环路增益大小降到 1 的频率 f_c，大致决定闭环的响应速度'
  - term: 磁场强度
    def: '由电流产生的磁场的强弱 H，单位 A/m；沿磁路一圈满足 Hl = Ni'
  - term: 磁感应强度
    def: '材料中磁场的强弱 B = μH，单位特斯拉（T）'
  - term: 磁导率
    def: '材料把磁场强度变成磁感应强度的能力 μ = μᵣμ₀，μ₀ = 4π × 10⁻⁷ H/m'
  - term: 磁通
    def: '磁感应强度乘截面积 Φ = BA，单位韦伯（Wb）；它的变化在线圈里感应出电压'
  - term: 磁阻
    def: '磁路对磁通的阻碍 ℛ = l/(μA)；磁通等于匝数乘电流除以磁阻，电感 L = N²/ℛ'
  - term: 电感系数
    def: '磁芯规格书给出的 A_L = 1/ℛ，单位 nH/匝²，电感 L = N²A_L'
  - term: 磁饱和
    def: '磁感应强度增大到一定程度后 B–H 曲线变平、磁导率急剧下降的现象，电感随之几乎消失'
  - term: 磁滞
    def: '磁场强度减小时磁感应强度不沿原路返回、曲线围成回环的现象，每个来回消耗回线面积的能量'
  - term: 励磁电感
    def: '变压器模型中并在一次侧、代表建立磁通所需电流的电感 L_m'
  - term: 漏感
    def: '只穿过一个绕组、不和另一个绕组耦合的那部分磁通对应的电感，串在绕组里'
  - term: 趋肤深度
    def: '高频电流在导体中衰减到表面值 1/e 的深度 δ = √(ρ/(πfμ₀))，铜在 100 kHz 约 0.21 mm'
  - term: 面积积
    def: '磁芯截面积和窗口面积的乘积 A_eA_w，按储能或功率选磁芯大小时用'
  - term: 纹波
    def: '开关变换器里电流或电压在一个开关周期内的周期性起伏，常用峰峰值表示，如 ΔI_L、ΔV_o'
  - term: 工作点
    def: '变换器稳态时各量的平均值（占空比 D、电压 V、电流 I），小信号分析在它附近展开'
lessons:
  # ==== 功率半导体器件 ====
  - id: why-switching
    chapter: 功率半导体器件
    title: 为什么用开关
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个线性稳压器把 12 V 降到 5 V，负载电流 2 A。稳压器自己发热消耗多少功率？
          options:
            - text: 14 W
              correct: true
            - text: 10 W
              why: 10 W 是负载拿到的功率 5 V × 2 A，不是稳压器消耗的
            - text: 24 W
              why: 24 W 是从 12 V 电源取走的总功率，其中 10 W 给了负载
            - text: 几乎为 0，稳压器只是把电压调低
              why: 线性稳压的调整管两端有 7 V，又流过 2 A，它必然发热
          explain: 调整管上的电压是 12 − 5 = 7 V，电流 2 A，耗散 14 W，比负载得到的 10 W 还多。这一课讲开关电路怎样避开这部分损耗。
      - card:
          title: 线性调整和开关调整
          body: |
            串联型稳压电路的调整管工作在放大状态，像一个可调的电阻，多余的电压全部落在它上面变成热，效率最多是 $V_o/V_{in}$：12 V 降到 5 V 时只有 42%。

            换一种做法：让管子在**完全导通**和**完全关断**两种状态之间快速切换。导通时电流大而压降接近 0，关断时电压大而电流为 0，两种状态下 $v \cdot i$ 都接近 0，管子几乎不耗电；再用电感和电容把切换出来的方波滤平。用半导体开关来变换和控制电能，这门技术叫**电力电子（power electronics）**。
      - item:
          id: linear-loss
          type: number
          prompt: 一个线性稳压器把 48 V 降到 12 V，负载电流 5 A。调整管上耗散多少瓦？
          answer: 180
          unit: W
          hint: 调整管两端的电压是多少？流过它的电流是多少？
          explain: 调整管两端 48 − 12 = 36 V，电流 5 A，耗散 180 W；负载只得到 60 W，效率 25%。这么大的降压比只能用开关电路。
      - card:
          title: 例题：效率和损耗
          body: 开关电源的效率常在 85%–98%。一个开关电源输出 100 W，效率 95%，它自己消耗多少功率？
          reveal:
            - title: 第 1 步：由效率求输入功率
              body: 效率 $\eta = P_o/P_{in}$，所以 $P_{in} = 100/0.95 \approx 105.3$ W。
            - title: 第 2 步：损耗是输入减输出
              body: $P_{loss} = P_{in} - P_o \approx 5.3$ W，也可以写成 $P_o(1/\eta - 1)$。5 W 的热量一块小散热片就能带走，同样功率的线性电路可能要散掉几十瓦。
      - item:
          id: efficiency-loss
          type: number
          prompt: 一台开关电源输出 240 W，效率 96%。它自己消耗多少瓦？
          answer: 10
          unit: W
          hint: 先由效率求输入功率。
          explain: $P_{in} = 240/0.96 = 250$ W，损耗 $250 - 240 = 10$ W。
      - card:
          title: 理想开关和真实器件
          body: |
            理想开关只有两个状态：导通时两端电压为 0，关断时电流为 0，切换不花时间。真实的功率半导体器件有三处偏差：导通时有一点压降或电阻，造成导通损耗；关断时有极小的漏电流；切换要几十纳秒到几微秒，其间电压和电流同时不为 0，造成**开关损耗（switching loss）**。
      - card:
          title: 按能不能控制分三类
          body: |
            按能不能用控制信号决定通断，器件分三类。二极管不可控，由电路的电压电流决定通断。**晶闸管（thyristor）**只能用门极脉冲触发开通，关断要等电流自己降到很小。MOSFET 和 IGBT（一种用栅压控制、耐压更高的功率晶体管）加上栅压就导通、撤掉就关断，叫**全控型器件（fully controllable device）**。
      - item:
          id: device-class
          type: choice
          prompt: 下面哪种器件可以用控制信号既让它开通、又让它关断？
          options:
            - text: IGBT
              correct: true
            - text: 功率二极管
              why: 二极管没有控制端，通断由外电路的电压和电流决定
            - text: 普通晶闸管
              why: 晶闸管的门极只能触发它开通，关断要等电流降到很小
            - text: 肖特基二极管
              why: 肖特基二极管开关比普通二极管快，但它同样没有控制端
          explain: IGBT 和 MOSFET 都是全控型器件，栅极电压加上就导通，撤掉就关断。
      - card:
          title: 四类变换
          body: |
            电力电子电路按输入和输出的形式分四类：

            - AC/DC（AC 指交流，DC 指直流）：交流变直流，叫整流，如充电器的输入级；
            - DC/DC：直流变成另一个电压的直流，如手机里给处理器供电的降压电路；
            - DC/AC：直流变交流，叫**逆变（inversion）**，如光伏逆变器、电动车的电机驱动；
            - AC/AC：改变交流的电压或频率，如台灯的交流调光；变频调速常先整流再逆变，也有不经过直流环节、一步完成的交交变换器。

            一台设备常由几级串成：笔记本适配器先整流，再用一级 DC/DC 降压并隔离。
      - item:
          id: conversion-match
          type: match
          prompt: 把每个应用和它主要完成的变换配对。
          pairs:
            - [光伏板发的电送进电网, DC/AC]
            - [手机充电器接市电的第一级, AC/DC]
            - [从 12 V 电池得到 3.3 V, DC/DC]
            - [台灯的交流调光, AC/AC]
          explain: 光伏板输出直流，电网是交流，要逆变；充电器先把市电整流成直流；电池降压是直流变直流；调光是在交流上直接调电压。
      - card:
          title: 变压器在电路里的作用
          body: |
            变压器是两个绕在同一个铁芯上的线圈，电压比等于匝数比。两个线圈之间没有导线相连，叫电气隔离：用户能摸到的输出端和电网之间不会形成触电回路，所以充电器、医疗设备都要隔离。

            变压器只能传交流。开关电路先把直流斩成高频方波再送进变压器，因为电压和匝数不变时，铁芯需要的截面积和工作频率成反比：频率从 50 Hz 提高到 100 kHz，变压器可以小很多，这是开关电源比工频变压器电源轻得多的原因。
      - item:
          id: transformer-frequency
          type: number
          prompt: 一个变压器原来工作在 50 Hz，现在开关电路让它工作在 50 kHz。电压和匝数不变，铁芯截面积和频率成反比。新的截面积是原来的多少倍？
          answer: 0.001
          hint: 频率变成了原来的几倍？
          explain: 频率提高到 1000 倍，截面积可以缩小到 $1/1000$。实际设计中高频下还要考虑铁芯损耗，缩小得没有这么多，但仍然小得多。

  - id: diode-mosfet-switch
    chapter: 功率半导体器件
    title: 二极管和 MOSFET 作开关
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: MOSFET 当开关用、栅压加足完全导通时，它工作在哪个区？
          options:
            - text: 三极管区
              correct: true
            - text: 饱和区
              why: 饱和区里漏源电压可以很大，管子耗电多，放大器才用它；开关导通要的是压降尽量小
            - text: 截止区
              why: 截止区没有电流，那是关断状态
          explain: 栅压加足、漏源电压很小时，沟道像一个受控的小电阻，这就是三极管区。功率 MOSFET 导通时就在这里。
      - card:
          title: 二极管作开关
          body: |
            在功率电路里，二极管是一个由电路自己决定通断的开关：阳极电位高于阴极就导通，电流要反向时就截止。分析时常用理想二极管或恒压降模型。功率二极管在额定电流下的正向压降 $V_F$ 约 0.7–1.5 V；肖特基二极管约 0.3–0.7 V，但耐压较低（硅肖特基一般在两三百伏以内）。

            二极管的导通损耗按平均电流算：$P = V_FI_{avg}$。开关电路里的二极管常常只在一部分时间导通，平均电流要乘上导通时间的比例。
      - item:
          id: diode-loss
          type: number
          prompt: 一个二极管正向压降 0.8 V，在每个开关周期里有 40% 的时间流过 10 A，其余时间不导通。它的导通损耗是多少瓦？
          answer: 3.2
          unit: W
          hint: 先求一个周期里的平均电流。
          explain: 平均电流 $10 \times 0.4 = 4$ A，$P = 0.8 \times 4 = 3.2$ W。
      - card:
          title: 反向恢复
          body: |
            PN 结二极管导通时，有大量电荷储存在它的轻掺杂区里，正是这些电荷让它在大电流下压降不高。要关断时，这些电荷得先被反向电流抽走，二极管才开始承受反向电压：电流先反向流一段时间 $t_{rr}$，抽走的电荷叫 $Q_{rr}$。这个过程叫**反向恢复（reverse recovery）**。

            反向恢复电流流过正在开通的开关管，而管子此时还承受着整个电压，每次大约多耗 $Q_{rr}V$ 的能量。快恢复二极管、肖特基二极管和 SiC 肖特基二极管储存的电荷很少或没有，能减小这部分损耗。
      - item:
          id: qrr-loss
          type: number
          prompt: 一个二极管的反向恢复电荷 $Q_{rr} = 100$ nC，电路电压 400 V，开关频率 100 kHz。只算每次 $Q_{rr}V$ 这一项，它给开关管带来的损耗约是多少瓦？
          answer: 4
          unit: W
          hint: 先算每次开通多耗的能量，再乘每秒的次数。
          explain: 每次 $100 \times 10^{-9} \times 400 = 40$ μJ，每秒 $10^5$ 次，$P = 4$ W。
      - card:
          title: MOSFET 作开关
          body: |
            功率 MOSFET 导通时工作在三极管区，漏源之间相当于一个小电阻，叫**导通电阻（on-resistance）** $R_{DS(on)}$。导通损耗 $P = I_{rms}^2R_{DS(on)}$，要用方均根电流，因为电阻发热和电流的平方成正比。

            功率 MOSFET 的结构里自带一个从源极指向漏极的 PN 结，叫**体二极管（body diode）**：管子关断时电流可以经它反向流过，桥式电路正需要这样一个反并联二极管，不过体二极管的反向恢复一般较差。MOSFET 只靠一种载流子导电，没有 PN 结二极管那样要被抽走的储存电荷，所以开关很快（电极之间的电容仍要充放电）。
      - card:
          title: 例题：开关管的导通损耗
          body: 一个 MOSFET 的 $R_{DS(on)} = 20$ mΩ，在每个周期的一半时间里流过 10 A，另一半时间关断。导通损耗是多少？
          reveal:
            - title: 第 1 步：求方均根电流
              body: 电流在占周期比例 $D$ 的时间里是 $I$，其余时间是 0。平方的平均是 $I^2D$，所以 $I_{rms} = I\sqrt D = 10\sqrt{0.5} \approx 7.07$ A。
            - title: 第 2 步：代入导通损耗
              body: $P = I_{rms}^2R_{DS(on)} = 100 \times 0.5 \times 0.02 = 1$ W。如果误用平均电流 5 A，会算出 0.5 W，少了一半。
      - item:
          id: mosfet-conduction
          type: number
          prompt: 一个 MOSFET 的 $R_{DS(on)} = 10$ mΩ，在每个周期 30% 的时间里流过 20 A，其余时间关断。导通损耗是多少瓦？
          answer: 1.2
          unit: W
          hint: 电流的平方在一个周期里的平均值是多少？
          explain: $I_{rms}^2 = 400 \times 0.3 = 120$ A²，$P = 120 \times 0.01 = 1.2$ W。
      - card:
          title: 耐压和导通电阻的矛盾
          body: |
            MOSFET 里承受电压的那一层叫漂移区。要耐更高的电压，漂移区就得更厚、掺杂更淡，电阻随之变大。对硅 MOSFET，单位芯片面积的导通电阻大约和击穿电压的 2.5 次方成正比：耐压翻一倍，同样面积的芯片导通电阻约变成 $2^{2.5} \approx 5.7$ 倍。

            所以硅 MOSFET 主要用在几十伏到几百伏。更高的电压要么用很大的芯片，要么换用超结 MOSFET、IGBT 或 SiC 器件。
      - item:
          id: voltage-scaling
          type: number
          prompt: 一个 100 V 硅 MOSFET 单位面积的导通电阻为 $r$。按导通电阻和耐压的 2.5 次方成正比估算，400 V 的硅 MOSFET 单位面积导通电阻约是 $r$ 的多少倍？
          answer: 32
          hint: 耐压变成几倍？再取 2.5 次方。
          explain: 耐压是 4 倍，$4^{2.5} = 32$。同样的导通电阻要 32 倍的芯片面积。
      - item:
          id: why-not-mosfet
          type: choice
          prompt: 一个 1200 V、50 A 的电机驱动，为什么一般不用普通的硅 MOSFET？
          options:
            - text: 这么高的耐压下，同样芯片面积的导通电阻太大
              correct: true
            - text: 硅 MOSFET 开关太慢，跟不上电机驱动的频率
              why: MOSFET 是开关最快的硅器件之一，问题出在高耐压时导通电阻大
            - text: MOSFET 只能开通，不能用栅极关断
              why: MOSFET 是全控型器件，栅压撤掉就关断
            - text: MOSFET 没有反并联二极管，桥式电路用不了
              why: 功率 MOSFET 自带体二极管
          explain: 导通电阻随耐压按约 2.5 次方增长，1200 V 级的硅 MOSFET 导通损耗太大。这个电压等级用 IGBT 或 SiC MOSFET。

  - id: igbt-thyristor-wbg
    chapter: 功率半导体器件
    title: IGBT、晶闸管和宽禁带器件
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一种器件被门极电流脉冲触发导通后，撤掉门极信号，它仍然导通。你猜它要怎样才会关断？
          options:
            - text: 等流过它的电流降到很小
              correct: true
            - text: 给门极加一个更大的正脉冲
              why: 正脉冲是用来触发开通的，不会让它关断
            - text: 它过一段固定时间会自己关断
              why: 只要电流维持着，它可以一直导通
          explain: 这就是晶闸管：一旦导通就靠内部的正反馈自己维持，门极管不了它，只有电流降到很小它才关断。
      - card:
          title: 超结 MOSFET
          body: |
            **超结（superjunction）**MOSFET 在漂移区里交替排列很细的 P 柱和 N 柱。关断时两种柱子里的电荷互相抵消，可以承受高电压；N 柱本身可以掺得很浓，导通时电阻小。这样导通电阻大约只和耐压成正比，突破了硅 MOSFET 的 2.5 次方关系。超结 MOSFET 常见的耐压是 500–900 V，是电脑电源和充电器里的主力开关管。
      - card:
          title: IGBT
          body: |
            **IGBT（insulated-gate bipolar transistor，绝缘栅双极型晶体管）**的输入像 MOSFET，用栅压控制、几乎不取电流；导通时从集电极一侧向漂移区注入大量电荷，漂移区的电阻大大下降，叫**电导调制（conductivity modulation）**。所以 IGBT 在高压下仍有约 1.5–3 V 的低导通压降，导通损耗按 $P = V_{CE(sat)}I_{avg}$ 算，和二极管类似。
      - item:
          id: igbt-vs-mosfet
          type: number
          prompt: 一个 IGBT 的导通压降恒为 2 V，一个 MOSFET 的导通电阻是 50 mΩ。两者都持续流过同一个直流电流 $I$。$I$ 是多少安时，两者的导通损耗相等？
          answer: 40
          unit: A
          hint: IGBT 的损耗是 $2I$，MOSFET 的是 $I^2R$，令它们相等。
          explain: $2I = 0.05I^2$，$I = 40$ A。电流小于 40 A 时 MOSFET 损耗小（10 A 时 5 W 对 20 W），大于 40 A 时 IGBT 损耗小（因为 MOSFET 的损耗随电流平方增长）。
      - card:
          title: IGBT 的代价
          body: |
            电导调制的代价出在关断时：注入漂移区的电荷要靠复合慢慢消失，集电极电流先快速降一大截，再拖一个缓慢下降的尾巴，叫拖尾电流。拖尾期间管子上已经有了电压，所以 IGBT 的关断损耗比 MOSFET 大，开关频率一般是几千赫到几十千赫。

            IGBT 用在 600 V 到 6.5 kV 的电机驱动、逆变器、机车牵引和不间断电源里，这些场合电流大、频率不太高，低导通压降最划算。
      - item:
          id: igbt-frequency
          type: choice
          prompt: 为什么 IGBT 的开关频率通常比 MOSFET 低？
          options:
            - text: 关断时注入的电荷要慢慢消失，电流拖尾，开关损耗大
              correct: true
            - text: IGBT 的栅极需要很大的持续驱动电流
              why: IGBT 和 MOSFET 一样是绝缘栅，稳态时栅极几乎不取电流
            - text: IGBT 的耐压比 MOSFET 低，频率高了会击穿
              why: IGBT 用在比硅 MOSFET 更高的电压等级，频率和耐压不是这个关系
            - text: IGBT 的导通压降比 MOSFET 大，所以只能低频工作
              why: 导通压降影响的是导通损耗，和开关快慢无关；大电流时 IGBT 的导通损耗反而更小
          explain: 电导调制让 IGBT 导通压降低，同一批电荷在关断时要靠复合慢慢消失，产生拖尾电流，每次关断的能量比 MOSFET 大。
      - card:
          title: SiC 和 GaN
          body: |
            碳化硅（SiC）和氮化镓（GaN）的禁带宽度约 3.3 eV 和 3.4 eV，大约是硅（1.12 eV）的三倍，叫**宽禁带（wide bandgap）**半导体。它们的临界击穿电场约是硅的十倍，同样耐压下漂移区可以薄得多、掺杂浓得多，导通电阻和寄生电容都小，还能在更高的温度下工作。

            SiC MOSFET 常用在 650–1700 V（电动车主驱逆变器、充电桩、光伏逆变器）；GaN 晶体管多在 650 V 以下，开关极快，让几十瓦的手机充电器做得很小。
      - item:
          id: device-match
          type: match
          prompt: 把每个应用和最常用的器件配对。
          pairs:
            - [65 W 手机充电器，追求体积小, GaN 晶体管]
            - [电动车 800 V 平台的主驱逆变器, SiC MOSFET]
            - [常规高压直流输电里单只耐压几千伏的开关阀, 晶闸管]
            - [12 V 电池供电的降压电路, 低压硅 MOSFET]
          explain: 低电压用硅 MOSFET 最便宜；高频小体积选 GaN；800 V 级要高耐压又要高效率，选 SiC；常规高压直流输电要单管几千伏、几千安，用晶闸管串联。
      - card:
          title: 晶闸管
          body: |
            晶闸管又叫 SCR，是 PNPN 四层器件。阳极电压为正时给门极一个电流脉冲，它就导通，并且靠内部的正反馈自己维持，门极失去控制作用；只有阳极电流降到**维持电流（holding current）**以下，例如交流电流过零反向时，它才恢复阻断。所以晶闸管只能控制开通，叫半控型器件。

            它的耐压和电流都可以做得很大（单管几千伏、几千安），导通压降低，适合工频的大功率整流和高压直流输电。门极可关断晶闸管（GTO）能用很大的反向门极电流关断，现在大多已被 IGBT 取代。
      - item:
          id: thyristor-off
          type: choice
          prompt: 一个晶闸管接在直流电源和电阻负载之间，已经导通。怎样才能让它关断？
          options:
            - text: 设法让阳极电流降到维持电流以下，例如暂时给它加反向电压
              correct: true
            - text: 撤掉门极信号
              why: 晶闸管导通以后靠内部正反馈维持，门极信号撤掉也不关断
            - text: 在门极加一个负电压
              why: 普通晶闸管的门极加负压也关不断，能这样关断的是 GTO 这类专门的器件
            - text: 把电源电压调低一些，但不到零
              why: 只要电流还大于维持电流，它就继续导通
          explain: 直流电路里电流不会自己过零，所以晶闸管用在直流电路时要专门的换流电路把它关断；在交流电路里，电流每半周自然过零，它会自己关断。
      - card:
          title: 例题：估算开关损耗
          body: 一个开关管接在 400 V 直流电压上，负载是电感，电流基本恒为 10 A。开通和关断两次转换的时间合计 100 ns，开关频率 50 kHz。估算开关损耗。
          reveal:
            - title: 第 1 步：看一次转换里 v·i 的形状
              body: 电感负载下开通时，电流先从 0 升到 10 A，这段时间管子两端一直是 400 V；电流到位以后，电压才从 400 V 降到 0。两段里 $v \cdot i$ 先从 0 线性升到 $VI$，再线性降回 0，是一个三角形。关断时顺序反过来，也是三角形。
            - title: 第 2 步：算每个周期的能量
              body: 三角形面积是 $\frac12VIt$。开通和关断合计 $E = \frac12VI(t_{on} + t_{off}) = \frac12 \times 400 \times 10 \times 100 \times 10^{-9} = 0.2$ mJ。
            - title: 第 3 步：乘开关频率
              body: 每秒开关 50000 次，$P_{sw} = Ef = 0.2\ \text{mJ} \times 50000 = 10$ W。开关损耗和频率成正比，这是开关频率不能无限提高的主要原因。
      - item:
          id: switching-loss
          type: number
          prompt: 一个 IGBT 接在 600 V 直流电压上开关 20 A 的电感电流，开通和关断转换时间合计 200 ns，开关频率 20 kHz。按转换期间电压、电流线性变化估算开关损耗，是多少瓦？
          answer: 24
          unit: W
          hint: 每个周期的能量是 $\frac12VI(t_{on} + t_{off})$。
          explain: $E = \frac12 \times 600 \times 20 \times 200 \times 10^{-9} = 1.2$ mJ，$P = 1.2\ \text{mJ} \times 20000 = 24$ W。
      - item:
          id: frequency-scaling
          type: choice
          prompt: 一个开关管的开关频率从 20 kHz 提高到 100 kHz，电压、电流和转换时间都不变。开关损耗怎样变化？
          options:
            - text: 变成原来的 5 倍
              correct: true
            - text: 不变，每次开关的能量没有变
              why: 每次的能量不变，但每秒开关的次数变成了 5 倍
            - text: 变成原来的 25 倍
              why: 开关损耗和频率成正比，不是和频率的平方成正比
            - text: 变小，因为每个周期变短了
              why: 周期变短，但每次转换的时间不变，转换在周期里占的比例反而变大
          explain: $P_{sw} = Ef$，$E$ 不变，$f$ 变成 5 倍，损耗也变成 5 倍。提高频率能缩小电感和电容，代价是开关损耗。

  # ==== 整流电路 ====
  - id: diode-rectifiers
    chapter: 整流电路
    title: 二极管整流的平均电压
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 220 V（有效值）的市电经二极管桥式整流后直接接一个电阻。用读平均值的直流电压表量电阻两端，大约读到多少？
          options:
            - text: 198 V
              correct: true
            - text: 311 V
              why: 311 V 是峰值，整流后的电压大部分时间低于峰值
            - text: 220 V
              why: 220 V 是有效值，整流后波形的平均值比有效值小
            - text: 99 V
              why: 这是半波整流的平均值；桥式整流把两个半周都送到了负载
          explain: 桥式整流的平均值是 $0.9 \times 220 = 198$ V。这一课用积分把这个系数推出来。
      - card:
          title: 半波整流的平均值
          body: |
            功率电路的电压通常有几百伏，二极管 1 V 左右的压降可以先忽略，把它当理想二极管。电源电压 $v_s = \sqrt2V\sin\omega t$，$V$ 是有效值。记 $\theta = \omega t$，一个周期对应 $2\pi$。半波整流只留下正半周，输出的平均值是一个周期里的面积除以周期：

            $$V_d = \frac{1}{2\pi}\int_0^{\pi}\sqrt2V\sin\theta\,d\theta = \frac{\sqrt2V}{\pi} \approx 0.45V$$
      - item:
          id: half-wave
          type: number
          prompt: 220 V（有效值）的交流电经一个理想二极管半波整流后接电阻负载。负载电压的平均值约是多少伏？（保留一位小数）
          answer: 99.0
          tolerance: 0.05
          unit: V
          hint: 正半周的面积是多少？再除以整个周期 $2\pi$。
          explain: $V_d = \sqrt2 \times 220/\pi \approx 99.0$ V。
      - card:
          title: 桥式全波整流
          body: |
            桥式整流用四个二极管，正负半周都让电流同方向流过负载，输出是 $|\sqrt2V\sin\omega t|$，平均值翻倍：$V_d = 2\sqrt2V/\pi \approx 0.9V$。输出每个周期有两个波头，脉动频率是电源频率的 2 倍；每个二极管截止时承受的最大反向电压是 $\sqrt2V$。

            平均值和有效值要分清：输出电压的平方和原来的正弦一模一样，所以输出的有效值仍是 $V$。电阻发热看有效值，直流电压表读的是平均值。
      - item:
          id: full-wave
          type: number
          prompt: 380 V（有效值）的单相交流电经理想二极管桥式整流后接电阻负载。负载电压的平均值约是多少伏？（保留到个位）
          answer: 342
          tolerance: 0.5
          unit: V
          hint: 桥式整流把负半周也翻了上来，平均值是半波的几倍？
          explain: $V_d = 2\sqrt2 \times 380/\pi \approx 342$ V。
      - item:
          id: rectified-power
          type: number
          prompt: 220 V（有效值）的市电经理想二极管桥式整流，直接接一个 100 Ω 电阻，没有滤波。电阻消耗的平均功率是多少瓦？
          answer: 484
          unit: W
          hint: 电阻发热由电压的平均值决定，还是由有效值决定？
          explain: 整流后电压的平方和原正弦相同，有效值仍是 220 V，$P = 220^2/100 = 484$ W。如果用平均值 198 V 算，会得到 392 W，错在把平均值当成了有效值。
      - item:
          id: diode-piv
          type: number
          prompt: 220 V（有效值）的市电经桥式整流接电阻负载。每个二极管截止时承受的最大反向电压约是多少伏？（保留到个位）
          answer: 311
          tolerance: 0.5
          unit: V
          hint: 最大反向电压等于电源电压的什么值？
          explain: 截止的二极管承受电源电压的峰值 $\sqrt2 \times 220 \approx 311$ V，选管子时还要留出余量（常取两倍左右）。
      - card:
          title: 电感负载下的电流
          body: |
            整流器后面常串一个大电感（或者负载本身是电机绕组）。电感阻碍电流变化，负载电流近似恒定为 $I_d$。这时直流侧电压的平均值仍是 $0.9V$，因为电感两端的平均电压为 0。

            交流侧的电流却变了样：正半周是 $+I_d$，负半周是 $-I_d$，成了一个方波。方波电流和正弦电压同相，但它不是正弦：传同样的功率，它的有效值比正弦电流大，还会让电网电压的波形变形。
      - item:
          id: inductive-current
          type: choice
          prompt: 二极管桥式整流器的直流侧串了一个很大的电感。交流侧的电流是什么形状？
          options:
            - text: 幅值为 $I_d$ 的方波，每半周换一次方向
              correct: true
            - text: 和电源电压同相的正弦
              why: 电流由大电感决定，近似恒定，二极管桥只是每半周把它的方向翻一次
            - text: 只在电压峰值附近出现的窄脉冲
              why: 这是电容滤波时的电流形状；串大电感时电流连续
            - text: 恒定的直流
              why: 直流侧电流恒定，但交流侧的电流每半周换一次方向
          explain: 直流侧电流恒为 $I_d$，正半周它从电源正端流出，负半周从负端流出，所以交流侧看到的是 $\pm I_d$ 的方波。

  - id: power-distortion
    chapter: 整流电路
    title: 功率因数和谐波
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个整流器从电网取的电流是方波，和电压同相。它的功率因数是 1 吗？
          options:
            - text: 不是，大约 0.9
              correct: true
            - text: 是 1，因为电流和电压同相
              why: 同相只说明没有相位差；方波里的谐波电流不做功，却占用电流的有效值
            - text: 大约 0.5，方波和正弦差得很远
              why: 方波里大部分是基波，功率因数没有低到 0.5
          explain: 方波电流的功率因数约 0.9。这一课把功率因数拆成两部分：相位差的影响和波形畸变的影响。
      - card:
          title: 有功功率、视在功率和功率因数
          body: |
            瞬时功率 $p = vi$ 在一个周期里的平均值叫有功功率 $P$，是真正做功的部分。电压有效值乘电流有效值叫**视在功率（apparent power）**$S = V_{rms}I_{rms}$，单位 V·A，导线和变压器要按它对应的电流设计。两者之比 $\mathrm{PF} = P/S$ 叫**功率因数（power factor）**。

            电压和电流都是正弦、相位差为 $\varphi$ 时，$P = VI\cos\varphi$，$\mathrm{PF} = \cos\varphi$。功率因数低，传同样的功率要更大的电流，线路损耗也更大。
      - item:
          id: sine-power
          type: number
          prompt: 正弦电压 220 V、正弦电流 10 A（都是有效值），电流滞后电压 30°。有功功率是多少瓦？（保留到个位）
          answer: 1905
          tolerance: 0.5
          unit: W
          hint: 有功功率和视在功率之间差一个什么因数？
          explain: $P = 220 \times 10 \times \cos30° \approx 1905$ W，视在功率 2200 V·A，功率因数 0.866。
      - card:
          title: 基波和谐波
          body: |
            任何周期波形都能拆成一串正弦之和：一个和原波形同频率的**基波（fundamental）**，加上频率是基波 2 倍、3 倍……的**谐波（harmonic）**，这叫傅里叶级数。幅值为 $I_d$ 的方波只含奇次谐波：

            $$i(t) = \frac{4I_d}{\pi}\left(\sin\omega t + \frac13\sin3\omega t + \frac15\sin5\omega t + \cdots\right)$$

            第 $n$ 次谐波的幅值是基波的 $1/n$。
      - item:
          id: fifth-harmonic
          type: number
          prompt: 一个幅值为 $I_d$ 的方波电流里，5 次谐波的有效值是基波有效值的几倍？（填小数）
          answer: 0.2
          hint: 方波第 $n$ 次谐波的幅值是基波的几分之几？
          explain: 5 次谐波幅值是基波的 $1/5$，有效值之比也是 $1/5 = 0.2$。
      - card:
          title: 只有基波做功
          body: |
            电压是正弦时，不同频率的电压和电流相乘，在一个周期里平均为 0，只有基波电流和电压一起做功：$P = VI_1\cos\varphi_1$，$I_1$ 是基波电流的有效值。于是

            $$\mathrm{PF} = \frac{I_1}{I_{rms}}\cos\varphi_1$$

            $I_1/I_{rms}$ 叫**畸变因数（distortion factor）**，$\cos\varphi_1$ 叫**位移因数（displacement factor）**。谐波的多少用**总谐波畸变率（total harmonic distortion，THD）**衡量：全部谐波的有效值和基波有效值之比，$\mathrm{THD} = \sqrt{I_{rms}^2 - I_1^2}/I_1$。
      - card:
          title: 例题：方波电流的功率因数和 THD
          body: 电流是幅值 $I_d$ 的方波，和正弦电压同相。求功率因数和 THD。
          reveal:
            - title: 第 1 步：求基波有效值
              body: 基波幅值 $4I_d/\pi$，有效值 $I_1 = \frac{4I_d}{\sqrt2\pi} \approx 0.900I_d$。
            - title: 第 2 步：求总有效值
              body: 方波的平方恒等于 $I_d^2$，所以 $I_{rms} = I_d$。
            - title: 第 3 步：求功率因数
              body: 畸变因数 $I_1/I_{rms} \approx 0.900$；基波和电压同相，位移因数为 1，所以 $\mathrm{PF} \approx 0.900$。
            - title: 第 4 步：求 THD
              body: $\mathrm{THD} = \sqrt{I_d^2 - (0.900I_d)^2}/(0.900I_d) \approx 0.483$，即 48.3%。
      - item:
          id: pf-product
          type: number
          prompt: 一个整流器输入电流的畸变因数是 0.95，基波电流滞后电压、位移因数是 0.8。它的功率因数是多少？
          answer: 0.76
          hint: 功率因数等于哪两个因数的乘积？
          explain: $\mathrm{PF} = 0.95 \times 0.8 = 0.76$。
      - item:
          id: thd-from-df
          type: number
          prompt: 三相桥式整流器（大电感负载）的输入电流畸变因数是 $3/\pi \approx 0.955$。它的 THD 约是多少？（填小数，保留两位）
          answer: 0.31
          tolerance: 0.005
          hint: 由 $I_1/I_{rms}$ 求出 $I_{rms}/I_1$，再代入 THD 的定义。
          explain: $\mathrm{THD} = \sqrt{(I_{rms}/I_1)^2 - 1} = \sqrt{(\pi/3)^2 - 1} \approx 0.31$，比单相方波的 0.48 小。
      - card:
          title: 畸变带来的问题
          body: |
            谐波电流不做功，却流过导线和变压器，增加发热；它们在电网的阻抗上产生谐波电压，让接在同一电网上的其他设备电压波形也变形。三相四线制里，3 的倍数次谐波在中性线里不抵消而相加，中性线可能过热。

            所以国际标准 IEC 61000-3-2 规定了每相输入电流 16 A 以下设备的谐波电流限值。功率较大的开关电源都要加功率因数校正（PFC）电路，让输入电流接近正弦。
      - item:
          id: neutral-current
          type: choice
          prompt: 一栋楼的三相四线制线路接了大量电脑电源，三相负载平衡，中性线却过热。最主要的原因是什么？
          options:
            - text: 3 次谐波电流三相同相位，在中性线里相加
              correct: true
            - text: 三相的基波电流在中性线里相加
              why: 平衡负载的三相基波互差 120°，在中性线里相加为 0
            - text: 5 次谐波电流在中性线里相加
              why: 三相的 5 次谐波仍互差 120°（相序反过来），在中性线里也抵消
            - text: 位移因数太低，所有导线电流都偏大
              why: 位移因数低让相线电流变大，但平衡负载的基波电流不进中性线
          explain: 3 次谐波的相位差是 $3 \times 120° = 360°$，三相的 3 次谐波同相，在中性线里叠成 3 倍。
  - id: phase-control
    chapter: 整流电路
    title: 晶闸管相控整流
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 把桥式整流里的二极管换成晶闸管，每半周比二极管晚一些才触发导通。输出平均电压会怎样？
          options:
            - text: 变小
              correct: true
            - text: 不变
              why: 触发之前晶闸管不导通，这一段电压没有送到负载
            - text: 变大
              why: 晚导通只会少送一段电压，不会多送
          explain: 晚触发一段，输出就少一块面积，平均电压变小。改变触发的时刻就能连续调节输出电压。
      - card:
          title: 触发角
          body: |
            晶闸管的阳极电压变正以后，还要等门极脉冲才导通。从二极管本来会导通的时刻（单相电路里就是电源电压过零的时刻）到触发所经过的电角度叫**触发角（firing angle）**$\alpha$。改变 $\alpha$ 就能调节输出平均电压，这叫相控。

            单相半波接电阻负载：晶闸管从 $\alpha$ 导通到 $\pi$，电流随电压过零而降到 0，它自然关断。

            $$V_d = \frac{1}{2\pi}\int_\alpha^\pi\sqrt2V\sin\theta\,d\theta = 0.45V \cdot \frac{1 + \cos\alpha}{2}$$
      - item:
          id: half-wave-alpha
          type: number
          prompt: 220 V（有效值）的交流电经单个晶闸管半波相控整流接电阻负载，触发角 90°。输出平均电压约是多少伏？（保留到个位）
          answer: 50
          tolerance: 0.5
          unit: V
          hint: 半波整流的平均值乘 $(1 + \cos\alpha)/2$。
          explain: 半波不控时是 $\sqrt2 \times 220/\pi \approx 99.0$ V，$\alpha = 90°$ 时乘 $(1 + 0)/2$，约 49.5 V，保留到个位为 50 V。
      - card:
          title: 全控桥：电阻负载和大电感负载
          body: |
            单相全控桥用四个晶闸管。接电阻负载时，每半周都从 $\alpha$ 导通到电压过零，$V_d = 0.9V\cdot\frac{1 + \cos\alpha}{2}$。

            接大电感负载时电流连续：电压过零变负以后，电感维持着电流，晶闸管继续导通，负载上出现一段负电压，直到另一对晶闸管被触发，电流才换过去。每对晶闸管从 $\alpha$ 导通到 $\alpha + \pi$：

            $$V_d = \frac{1}{\pi}\int_\alpha^{\alpha + \pi}\sqrt2V\sin\theta\,d\theta = 0.9V\cos\alpha$$
      - item:
          id: bridge-r-load
          type: number
          prompt: 220 V 单相全控桥接电阻负载，触发角 45°。输出平均电压约是多少伏？（保留到个位）
          answer: 169
          tolerance: 0.5
          unit: V
          hint: 电阻负载时，电压过零以后晶闸管还导通吗？
          explain: $V_d = 0.9 \times 220 \times (1 + 0.707)/2 \approx 169$ V（用精确系数 $2\sqrt2/\pi$ 也是 169 V）。
      - item:
          id: bridge-l-load
          type: number
          prompt: 220 V 单相全控桥接大电感负载（电流连续），触发角 60°。输出平均电压约是多少伏？（保留到个位）
          answer: 99
          tolerance: 0.5
          unit: V
          hint: 电流连续时，每对晶闸管导通多长？
          explain: $V_d = 0.9 \times 220 \times 0.5 = 99$ V。同样 60°，电阻负载时是 $0.9 \times 220 \times 0.75 \approx 149$ V，因为电阻负载没有那段负电压。
      - card:
          title: 有源逆变
          body: |
            $0.9V\cos\alpha$ 在 $\alpha > 90°$ 时为负：平均电压变了号，而晶闸管只能单方向导电，电流方向不变，于是 $P = V_dI_d < 0$，功率从直流侧流回交流电网。这叫**有源逆变（line-commutated inversion）**。它的条件是直流侧有一个能提供能量的电源，例如正在制动的直流电动机、高压直流输电另一端送来的功率，并且电流连续。

            半控桥里有一半是二极管，形成续流通路，输出电压不会变负，所以半控桥不能有源逆变。
      - item:
          id: inversion-voltage
          type: number
          prompt: 220 V 单相全控桥，直流侧接一台正在制动发电的直流电机，电流连续，触发角 120°。整流桥直流侧的平均电压约是多少伏？（保留到个位，注意正负号）
          answer: -99
          tolerance: 0.5
          unit: V
          hint: 代入 $0.9V\cos\alpha$，$\cos120°$ 是多少？
          explain: $V_d = 0.9 \times 220 \times (-0.5) = -99$ V。电流方向不变而电压为负，功率由电机经晶闸管桥流回电网。
      - item:
          id: inversion-condition
          type: choice
          prompt: 一个单相全控桥要工作在有源逆变状态，下面哪一条是必需的？
          options:
            - text: 直流侧有一个能提供能量的电源，触发角大于 90°
              correct: true
            - text: 把晶闸管全部反过来接
              why: 晶闸管反接会改变电流方向；有源逆变靠的是电流方向不变、电压反号
            - text: 触发角小于 90°
              why: 触发角小于 90° 时平均电压为正，是整流
            - text: 直流侧只接一个电阻
              why: 电阻只能吸收功率，没有能量可以送回电网
          explain: 能量要从直流侧流向电网，直流侧就得有电源；触发角大于 90° 让平均电压为负，电流方向不变，功率就反向了。
      - card:
          title: 交流调压
          body: |
            把两个晶闸管反向并联后串在交流电源和负载之间，正半周触发一个、负半周触发另一个，每半周都晚 $\alpha$ 导通，负载上的交流电压被切掉一部分，有效值变小。这是最简单的 AC/AC 变换，用于调光、电热和电动机软起动。接电阻负载时，由电压平方在半周里的平均值得到输出电压有效值

            $$V_o = V\sqrt{1 - \frac{\alpha}{\pi} + \frac{\sin2\alpha}{2\pi}}$$

            它只改变电压、不改变频率。要改变频率，可以先整流再逆变，或者用交交变频器、矩阵变换器直接由交流合成另一个频率的交流。
      - item:
          id: ac-controller
          type: number
          prompt: 两个反并联的晶闸管把 220 V（有效值）交流电接到电阻负载上，每半周的触发角都是 90°。负载电压的有效值约是多少伏？（保留到个位）
          answer: 156
          tolerance: 0.5
          unit: V
          hint: 每半周只剩下后一半波形，电压平方的平均值变为原来的几分之几？
          explain: $V_o = 220\sqrt{1 - 0.5 + 0} = 220/\sqrt2 \approx 156$ V，电阻上的功率只剩不调压时的一半。
  - id: commutation
    chapter: 整流电路
    title: 换流重叠和逆变的边界
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 实际电网的变压器线圈有漏感：只穿过自己这组线圈、不参与耦合的那部分磁通对应的电感。二极管桥里，负载电流能在一瞬间从一对二极管转到另一对吗？
          options:
            - text: 不能，要经过一段四个二极管同时导通的时间
              correct: true
            - text: 能，二极管开关很快
              why: 二极管再快，交流侧电感里的电流也不能突变，转移的快慢由电感决定
            - text: 不能，中间会有一段四个二极管都不导通
              why: 大电感负载的电流必须有路可走，转移期间四个二极管都导通
          explain: 交流侧电感让电流只能逐渐转移，转移期间新旧两对二极管同时导通，把直流侧短接。
      - card:
          title: 交流侧电感让换流需要时间
          body: |
            实际电源有内部电感：变压器的漏感（不参与耦合的那部分磁通对应的电感）和线路电感，合起来记作 $L_s$。大电感负载的电流 $I_d$ 恒定，交流侧电流要从 $-I_d$ 变到 $+I_d$，而 $L_s$ 里的电流不能突变。于是有一段电角度 $\mu$，四个二极管同时导通，直流侧被短接、输出电压为 0，电源电压全部加在 $L_s$ 上推动电流变化。

            电流从一组器件转移到另一组的过程叫**换流（commutation）**，$\mu$ 叫**重叠角（overlap angle）**。
      - card:
          title: 例题：重叠角和换流压降
          body: 220 V、50 Hz 的电源，交流侧电感 $L_s = 1$ mH，二极管桥带 $I_d = 20$ A 的大电感负载。求重叠角和输出平均电压降低了多少。
          reveal:
            - title: 第 1 步：写出换流期间的方程
              body: 换流期间 $L_s$ 两端是电源电压，记 $\theta = \omega t$，$\sqrt2V\sin\theta = \omega L_s\frac{di}{d\theta}$。换流前交流侧电流是 $-I_d$，换流后是 $+I_d$，共变化 $2I_d$。把方程从 $\theta = 0$ 积分到 $\mu$：$\sqrt2V(1 - \cos\mu) = 2\omega L_sI_d$。
            - title: 第 2 步：求重叠角
              body: $2\omega L_sI_d = 2 \times 314.16 \times 0.001 \times 20 \approx 12.57$ V，$1 - \cos\mu = 12.57/311.1 \approx 0.0404$，$\mu \approx 16.3°$。
            - title: 第 3 步：求平均电压的损失
              body: 每半周丢掉的面积是 $\int_0^\mu\sqrt2V\sin\theta\,d\theta = 2\omega L_sI_d$，除以半周的 $\pi$：$\Delta V = \frac{2\omega L_sI_d}{\pi} = 4.0$ V。输出平均电压从 198 V 降到约 194 V。
      - item:
          id: commutation-drop
          type: number
          prompt: 50 Hz 单相二极管桥带 15 A 的大电感负载，交流侧电感 2 mH。换流使输出平均电压降低多少伏？（保留一位小数）
          answer: 6.0
          tolerance: 0.05
          unit: V
          hint: 每半周丢掉的面积是多少？再除以半周的 $\pi$。
          explain: $\Delta V = 2 \times 314.16 \times 0.002 \times 15/\pi \approx 6.0$ V。
      - item:
          id: drop-vs-current
          type: choice
          prompt: 一个整流桥的负载电流加倍，交流侧电感不变。换流压降怎样变化？
          options:
            - text: 加倍
              correct: true
            - text: 不变，压降只由电感决定
              why: 电流越大，电感里的电流要变化得越多，换流时间越长，丢掉的面积越大
            - text: 变成 4 倍
              why: 压降 $2\omega L_sI_d/\pi$ 和电流成正比，不是平方
            - text: 减半
              why: 电流越大换流越久，压降变大而不是变小
          explain: $\Delta V = 2\omega L_sI_d/\pi$ 和 $I_d$ 成正比。所以整流器的输出电压随负载加重而下降，像有一个内阻 $2\omega L_s/\pi$，但这个“内阻”不消耗功率。
      - card:
          title: 相控时的换流
          body: |
            晶闸管在 $\alpha$ 触发，换流从 $\alpha$ 开始。换流期间的方程不变，只是从 $\theta = \alpha$ 积分到 $\alpha + \mu$，电流同样变化 $2I_d$：$\sqrt2V[\cos\alpha - \cos(\alpha + \mu)] = 2\omega L_sI_d$，所以

            $$\cos\alpha - \cos(\alpha + \mu) = \frac{2\omega L_sI_d}{\sqrt2V}, \qquad V_d = 0.9V\cos\alpha - \frac{2\omega L_sI_d}{\pi}$$

            换流压降和 $\alpha$ 无关，重叠角却和 $\alpha$ 有关：$\alpha$ 在 90° 附近时电源电压接近峰值，推动电流转移得最快，$\mu$ 最小；$\alpha$ 接近 0° 或 180° 时电源电压小，$\mu$ 最大。
      - item:
          id: overlap-at-150
          type: number
          prompt: 220 V、50 Hz 单相全控桥，$L_s = 1$ mH，$I_d = 20$ A，工作在有源逆变，触发角 150°。重叠角约是多少度？（保留一位小数）
          answer: 5.0
          tolerance: 0.05
          unit: °
          hint: 先算 $2\omega L_sI_d/(\sqrt2V)$，再由 $\cos(\alpha + \mu) = \cos\alpha - $ 这个数求 $\alpha + \mu$。
          explain: $2\omega L_sI_d/(\sqrt2V) \approx 0.0404$，$\cos(\alpha + \mu) = -0.8660 - 0.0404 = -0.9064$，$\alpha + \mu \approx 155.0°$，$\mu \approx 5.0°$，比 $\alpha = 0$ 时的 16.3° 小得多。
      - card:
          title: 逆变的边界
          body: |
            逆变时 $\alpha$ 接近 180°，这里有一个硬限制：换流必须在电源电压过零变号（$\theta = 180°$）之前完成，被换下的晶闸管还要承受一段反向电压，对应角度 $\gamma$（关断角），才能恢复阻断能力。否则它会重新导通，直流电源经晶闸管和交流电源串联短路，叫逆变失败。所以

            $$\alpha + \mu + \gamma \le 180°$$

            电流越大，$\mu$ 越大，允许的最大触发角越小。
      - item:
          id: max-firing-angle
          type: number
          prompt: 一个相控变换器满载时的重叠角是 15°，晶闸管需要的关断角是 18°。它工作在有源逆变时，触发角最大能取多少度？
          answer: 147
          unit: °
          hint: 三个角加起来不能超过多少度？
          explain: $\alpha_{max} = 180° - 15° - 18° = 147°$。实际还要再留一点余量，因为电网电压下降或电流突增都会让 $\mu$ 变大。
      - item:
          id: inversion-failure
          type: choice
          prompt: 有源逆变时触发角取得太接近 180°，最可能发生什么？
          options:
            - text: 换流来不及完成，被换下的晶闸管重新导通，直流侧经交流电源短路
              correct: true
            - text: 输出平均电压变成正的，变回整流
              why: 触发角越接近 180°，平均电压越接近负的最大值，不会变正
            - text: 晶闸管触发不了
              why: 阳极电压在 180° 之前一直为正，晶闸管能被触发；问题出在关断
            - text: 晶闸管承受反向电压的时间太长而损坏
              why: 反向电压正是晶闸管恢复阻断所需要的，问题是它的时间太短，而不是太长
          explain: 换流要在电源电压变号之前完成，还要留出关断角。触发太晚，旧晶闸管来不及恢复阻断，电压变号后它重新导通，电流失控地增大。
  - id: three-phase-rectifier
    chapter: 整流电路
    title: 三相整流
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 三相桥式整流的输出电压比单相桥平稳得多。在一个电源周期里，它的输出有几个波头？
          options:
            - text: '6'
              correct: true
            - text: '2'
              why: 2 个是单相桥式整流；三相桥每相的正负半周都会轮到
            - text: '3'
              why: 3 个是三相半波整流；三相桥的上下两组二极管各贡献 3 次切换
          explain: 三相桥的输出每 60° 换一段线电压，每周期 6 个波头，叫六脉波整流。
      - card:
          title: 三相电源
          body: |
            三相电源是三个幅值相同、相位依次相差 120° 的正弦电压 $v_a$、$v_b$、$v_c$。每一相对中性点的电压叫**相电压（phase voltage）**，两相之间的电压叫**线电压（line voltage）**。线电压是两个相差 120° 的正弦之差，有效值是相电压的 $\sqrt3$ 倍：我国低压电网相电压 220 V、线电压 380 V。

            三相平衡负载的瞬时总功率是恒定的，不像单相那样以 2 倍频率起伏，所以大功率设备都用三相。
      - item:
          id: line-voltage
          type: number
          prompt: 一个三相电网的相电压是 230 V（有效值）。线电压约是多少伏？（保留到个位）
          answer: 398
          tolerance: 0.5
          unit: V
          hint: 线电压是相电压的几倍？
          explain: $230 \times \sqrt3 \approx 398$ V，常写作 400 V。
      - card:
          title: 三相桥式整流
          body: |
            三相桥用 6 个二极管：上面三个里，阳极电位最高的那一相导通；下面三个里，阴极电位最低的那一相导通。所以输出电压在每一时刻等于最大的那个线电压，是 6 段线电压正弦的顶部拼成的波形。每段宽 60°，取从 60° 到 120° 的一段求平均：

            $$V_d = \frac{3}{\pi}\int_{\pi/3}^{2\pi/3}\sqrt2V_{LL}\sin\theta\,d\theta = \frac{3\sqrt2}{\pi}V_{LL} \approx 1.35V_{LL}$$

            $V_{LL}$ 是线电压有效值。
      - item:
          id: three-phase-bridge
          type: number
          prompt: 线电压 380 V 的三相电网经二极管三相桥整流，接大电感负载。输出平均电压约是多少伏？（保留到个位）
          answer: 513
          tolerance: 0.5
          unit: V
          hint: 输出由六段线电压的顶部拼成，平均值是线电压有效值的几倍？
          explain: $V_d = 3\sqrt2 \times 380/\pi \approx 513$ V。变频器整流以后的直流电压（叫直流母线电压）大约就是这么高。
      - item:
          id: six-pulse-ripple
          type: number
          prompt: 50 Hz 三相桥式整流的输出电压，脉动的基本频率是多少赫？
          answer: 300
          unit: Hz
          hint: 每个电源周期有几个波头？
          explain: 每周期 6 个波头，脉动频率 $6 \times 50 = 300$ Hz。单相桥是 100 Hz，频率越高、起伏越小，滤波越容易。
      - card:
          title: 三相相控整流
          body: |
            换成晶闸管，触发角从二极管本来会换流的时刻算起，那是两相电压相等的点，比相电压过零晚 30°。电流连续时 $V_d = 1.35V_{LL}\cos\alpha$，$\alpha > 90°$ 时同样可以有源逆变。常规高压直流输电两端的换流站就是这样的晶闸管桥：一端整流，另一端逆变。

            大电感负载时每相交流电流是正负各 120° 宽的矩形波，只含 $6k \pm 1$ 次谐波（5、7、11、13……），没有偶次和 3 的倍数次谐波；畸变因数 $3/\pi \approx 0.955$，THD 约 31%。交流侧电感造成的换流压降是 $3\omega L_sI_d/\pi$。
      - item:
          id: three-phase-alpha
          type: number
          prompt: 线电压 380 V 的三相全控桥接大电感负载，触发角 30°。输出平均电压约是多少伏？（保留到个位）
          answer: 444
          tolerance: 0.5
          unit: V
          hint: 触发角让三相桥的平均值乘上什么？
          explain: $V_d = 3\sqrt2/\pi \times 380 \times \cos30° \approx 444$ V。
      - item:
          id: missing-harmonic
          type: choice
          prompt: 三相桥式整流器带大电感负载，交流侧电流里没有下面哪一次谐波？
          options:
            - text: 3 次
              correct: true
            - text: 5 次
              why: 5 = 6 × 1 − 1，是三相桥的特征谐波，而且是其中最大的
            - text: 7 次
              why: 7 = 6 × 1 + 1，也是特征谐波
            - text: 11 次
              why: 11 = 6 × 2 − 1，也是特征谐波
          explain: 120° 宽的矩形波没有 3 的倍数次谐波，三相桥只含 $6k \pm 1$ 次。单相桥的方波则含全部奇次谐波，包括 3 次。
      - item:
          id: three-phase-commutation
          type: number
          prompt: 50 Hz 三相桥式整流器带 100 A 大电感负载，每相交流侧电感 0.5 mH。换流使输出平均电压降低多少伏？（保留到个位）
          answer: 15
          tolerance: 0.5
          unit: V
          hint: 三相桥每个周期换流 6 次，每次丢掉的面积是 $\omega L_sI_d$，平均到一个周期是多少？
          explain: $\Delta V = 3 \times 314.16 \times 0.0005 \times 100/\pi \approx 15$ V。

  # ==== DC-DC变换器 ====
  - id: buck-converter
    chapter: DC-DC变换器
    title: Buck 变换器
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个开关让一个点一半时间接 12 V、一半时间接地，得到的方波送进一个 LC 低通滤波器。输出大约是多少？
          options:
            - text: 6 V
              correct: true
            - text: 12 V
              why: 一半时间是 0 V，滤波后留下的是平均值
            - text: 8.5 V
              why: 低通滤波器留下的是直流分量，也就是平均值，不是有效值
            - text: 0 V，方波正负抵消
              why: 这个方波在 0 和 12 V 之间跳，没有负值，平均值不为 0
          explain: 低通滤波器滤掉方波里的高频成分，留下平均值 6 V。改变接 12 V 的时间比例，就能调节输出，这就是 Buck 变换器。
      - card:
          title: 开关节点和占空比
          body: |
            把一个开关和一个二极管串在输入电压和地之间，它们的连接点叫开关节点：开关导通时节点电压是 $V_{in}$；开关关断、二极管导通时是 0。节点电压是一个方波，送进 LC 低通滤波器，输出就是方波的平均值。

            开关导通的时间占开关周期 $T$ 的比例叫**占空比（duty ratio）**$D$，所以 $V_o = DV_{in}$。开关、二极管和电感组成的三端结构叫标准开关单元；把它的三个端子用不同方式接到输入和输出上，就得到 Buck、Boost 和 Buck-Boost 三种基本变换器。
      - item:
          id: buck-duty
          type: number
          prompt: 一个 Buck 变换器把 24 V 降到 5 V，电感电流始终大于 0。占空比约是多少？（保留三位小数）
          answer: 0.208
          tolerance: 0.0005
          hint: 输出电压和占空比是什么关系？
          explain: $D = 5/24 \approx 0.208$。
      - card:
          title: 伏秒平衡
          body: |
            用电感上的电压再推一遍。开关导通时电感两端是 $V_{in} - V_o$，电流以斜率 $(V_{in} - V_o)/L$ 上升，持续 $DT$；关断时电感两端是 $-V_o$，电流下降，持续 $(1 - D)T$。稳态时电流每个周期回到同一个值，上升量等于下降量：

            $$(V_{in} - V_o)DT = V_o(1 - D)T \;\Rightarrow\; V_o = DV_{in}$$

            换个说法：稳态下电感电压在一个周期里的平均值为 0。这叫**伏秒平衡（volt-second balance）**，是分析所有 DC/DC 变换器的基本方法。
      - card:
          title: 例题：电感电流纹波
          body: Buck 变换器 12 V 降到 5 V，电感 22 μH，开关频率 200 kHz，电感电流连续。求占空比和电感电流纹波的峰峰值。
          reveal:
            - title: 第 1 步：求占空比
              body: $D = 5/12 \approx 0.417$。
            - title: 第 2 步：求开关导通的时间
              body: 周期 $T = 1/(200\ \text{kHz}) = 5$ μs，导通时间 $DT \approx 2.08$ μs。
            - title: 第 3 步：由导通期间的斜率求电流变化
              body: 导通期间电感电压 $12 - 5 = 7$ V，$\Delta I_L = \frac{(V_{in} - V_o)DT}{L} = \frac{7 \times 2.08 \times 10^{-6}}{22 \times 10^{-6}} \approx 0.66$ A。用关断期间算也一样：$5 \times (1 - 0.417) \times 5\ \mu\text{s}/22\ \mu\text{H} \approx 0.66$ A。
      - item:
          id: buck-ripple
          type: number
          prompt: Buck 变换器 24 V 降到 12 V，电感 30 μH，开关频率 100 kHz，电感电流连续。电感电流纹波的峰峰值是多少安？
          answer: 2
          unit: A
          hint: 占空比是多少？导通时间是多少？导通期间电感两端电压是多少？
          explain: $D = 0.5$，$T = 10$ μs，$\Delta I_L = (24 - 12) \times 0.5 \times 10\ \mu\text{s}/30\ \mu\text{H} = 2$ A。
      - card:
          title: 电流纹波和电压纹波
          body: |
            电感电流是一条三角波，平均值等于负载电流（电容的平均电流为 0）。开关变换器里电流或电压在一个开关周期内的起伏叫**纹波（ripple）**，常用峰峰值表示，如 $\Delta I_L$。只要电流的最低点大于 0，电感电流就一直在流，叫**连续导通（continuous conduction mode，CCM）**，$V_o = DV_{in}$ 和 $\Delta I_L$ 的公式都以它为前提。

            三角波的交流部分流进输出电容。电容在半个周期里多充进的电荷是一个三角形面积 $\frac12\cdot\frac T2\cdot\frac{\Delta I_L}{2}$，忽略电容自身的串联电阻，输出电压纹波

            $$\Delta V_o = \frac{\Delta I_L}{8fC}$$
      - item:
          id: buck-voltage-ripple
          type: number
          prompt: 一个 Buck 变换器的电感电流纹波峰峰值 0.66 A，开关频率 200 kHz，输出电容 100 μF（忽略电容自身的串联电阻）。输出电压纹波的峰峰值约是多少毫伏？（保留一位小数）
          answer: 4.1
          tolerance: 0.05
          unit: mV
          hint: 电容在半个周期里多充进的电荷是多少？
          explain: $\Delta V_o = 0.66/(8 \times 200000 \times 100 \times 10^{-6}) \approx 4.1$ mV。实际电容自身的串联电阻常让纹波比这大。
      - item:
          id: buck-peak-current
          type: number
          prompt: 一个 Buck 变换器负载电流 3 A，电感电流纹波峰峰值 0.66 A，电流连续。电感电流的峰值是多少安？（保留两位小数）
          answer: 3.33
          tolerance: 0.005
          unit: A
          hint: 三角波的平均值是负载电流，峰值比平均值高多少？
          explain: 峰值 = 平均值 + 纹波的一半 = $3 + 0.33 = 3.33$ A。选电感和开关管时要按峰值电流留余量，电感在这个电流下电感量不能明显下降。

  - id: boost-buckboost
    chapter: DC-DC变换器
    title: Boost、Buck-Boost 和 Cuk
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 不用变压器，只用开关、二极管、电感和电容，能把 5 V 升到 12 V 吗？
          options:
            - text: 能
              correct: true
            - text: 不能，没有变压器电压只能降不能升
              why: 电感可以在开关导通时储能，关断时把自己的电压叠加到输入电压上送出去
            - text: 能，但输出电流会比输入电流大
              why: 能量守恒，升压后输出电流比输入电流小
          explain: 这就是 Boost 变换器。电感先储能，再连同输入一起把能量推到更高的输出电压上。
      - card:
          title: Boost 变换器
          body: |
            Boost 变换器的电感接在输入端。开关导通时电感接在 $V_{in}$ 两端储能，电流上升；开关关断时电感经二极管把电流送到输出，这时电感两端电压是 $V_{in} - V_o$，为负，电流下降。伏秒平衡：

            $$V_{in}DT = (V_o - V_{in})(1 - D)T \;\Rightarrow\; V_o = \frac{V_{in}}{1 - D}$$

            输入电流就是电感电流，连续而平滑；送到输出的电流却是一段一段的，输出电容要承受较大的纹波电流。
      - item:
          id: boost-duty
          type: number
          prompt: 一个 Boost 变换器把 5 V 升到 12 V，电感电流连续。占空比约是多少？（保留三位小数）
          answer: 0.583
          tolerance: 0.0005
          hint: Boost 的电压比是多少？反过来解出 $D$。
          explain: $D = 1 - V_{in}/V_o = 1 - 5/12 \approx 0.583$。
      - item:
          id: boost-inductor-current
          type: number
          prompt: 一个 Boost 变换器从 12 V 升到 48 V，输出 60 W，按无损耗计算。电感电流的平均值是多少安？
          answer: 5
          unit: A
          hint: 输入电流流过哪个元件？无损耗时输入功率是多少？
          explain: 输入功率也是 60 W，输入电流 $60/12 = 5$ A，这就是电感电流的平均值。输出电流只有 1.25 A，等于 $5 \times (1 - D)$，$D = 0.75$。
      - card:
          title: Buck-Boost：间接变换器
          body: |
            Buck-Boost 把电感接在开关节点和地之间：开关导通时电感只从输入储能，关断时只向输出放能，能量全部先存进电感再送出去，所以它叫间接变换器，Buck 则是直接变换器。伏秒平衡给出

            $$V_o = -\frac{D}{1 - D}V_{in}$$

            输出极性和输入相反；$D < 0.5$ 时降压，$D > 0.5$ 时升压。
      - item:
          id: buckboost-output
          type: number
          prompt: 一个 Buck-Boost 变换器输入 12 V，占空比 0.6，电感电流连续。输出电压是多少伏？（注意正负号）
          answer: -18
          unit: V
          hint: 代入 $-\frac{D}{1 - D}V_{in}$。
          explain: $V_o = -\frac{0.6}{0.4} \times 12 = -18$ V，比输入高、极性相反。
      - card:
          title: Cuk 和 SEPIC
          body: |
            Cuk 变换器在输入和输出各串一个电感，中间用一个电容传递能量，电压比和 Buck-Boost 一样（也反相），但输入电流和输出电流都连续，滤波更容易。SEPIC 结构相近，输出和输入同极性，电压比是 $\frac{D}{1 - D}$，常用在电池电压可能高于、也可能低于输出电压的场合。

            分析这些变换器还要用到电容的一条规律：稳态下电容电流在一个周期里的平均值为 0，叫电荷平衡，和电感的伏秒平衡相对应。
      - item:
          id: converter-ratios
          type: match
          prompt: 把每种变换器（电感电流连续）和它的输出电压配对。
          pairs:
            - [Buck, Vo = D·Vin]
            - [Boost, Vo = Vin/(1−D)]
            - [Buck-Boost, Vo = −D·Vin/(1−D)]
            - [SEPIC, Vo = D·Vin/(1−D)]
          explain: Buck 只降压；Boost 只升压；Buck-Boost 和 SEPIC 的电压比大小相同，前者反相、后者同相。
      - item:
          id: boost-limit
          type: choice
          prompt: 按公式，Boost 的占空比取 0.95 时输出是输入的 20 倍。实际电路把占空比推近 1 时，输出电压为什么上不去，甚至下降？
          options:
            - text: 电感电流随升压比急剧增大，电感、开关和二极管上的电阻损耗跟着急剧增大
              correct: true
            - text: 伏秒平衡在占空比大时不成立
              why: 稳态下伏秒平衡总是成立；是电路里的电阻压降改变了平衡点
            - text: 输出电容太小
              why: 电容大小影响纹波，不改变平均输出电压的上限
            - text: 二极管的耐压不够
              why: 耐压不够会损坏器件，不会让输出电压平稳地停在较低值
          explain: 同样的输出功率下电感电流是输出电流的 $1/(1 - D)$ 倍，$D$ 接近 1 时电流很大，电阻压降吃掉了升压。所以单级 Boost 的升压比一般不超过 5–6 倍。
  - id: dcm
    chapter: DC-DC变换器
    title: 断续导通
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个 Buck 变换器的电感电流纹波峰峰值是 2 A。负载电流降到 0.5 A 时，按三角波算电流最低点是 −0.5 A。实际会怎样？
          options:
            - text: 电流降到 0 就停在 0，等下一个周期开关再导通
              correct: true
            - text: 电流真的变成 −0.5 A
              why: 电流反向要经过二极管，而二极管不允许电流反向
            - text: 什么都不变，输出电压仍是 $DV_{in}$
              why: 电流停在 0 以后，前面推出 $DV_{in}$ 的前提（电流连续）不成立了，输出会升高
          explain: 二极管挡住了反向电流，电感电流在每个周期的末尾有一段为 0。这叫断续导通，电压比和连续时不同。
      - card:
          title: 连续和断续的边界
          body: |
            电感电流降到 0 后停住，直到下一个周期开关再导通，叫**断续导通（discontinuous conduction mode，DCM）**。连续和断续的分界是电流最低点刚好为 0，这时负载电流等于纹波的一半：

            $$I_{o,crit} = \frac{\Delta I_L}{2} = \frac{(V_{in} - V_o)D}{2Lf}$$

            负载电流小于它就进入断续。轻载、电感小或开关频率低时容易断续。
      - item:
          id: dcm-boundary
          type: number
          prompt: Buck 变换器 12 V 降到 5 V，电感 22 μH，开关频率 200 kHz。负载电流低于多少安时进入断续？（保留三位小数）
          answer: 0.331
          tolerance: 0.0005
          unit: A
          hint: 先求纹波的峰峰值，再取一半。
          explain: $\Delta I_L = 7 \times (5/12) \times 5\ \mu\text{s}/22\ \mu\text{H} \approx 0.663$ A，一半是 0.331 A。
      - card:
          title: 断续时的电压比
          body: 断续时一个周期分三段：开关导通 $DT$，电流从 0 升到峰值 $I_{pk}$；二极管导通 $D_2T$，电流降回 0；剩下的时间电流为 0。电压比不再只由 $D$ 决定，还和负载有关。
          reveal:
            - title: 第 1 步：电感的伏秒平衡
              body: 电流为 0 的那段电感电压也为 0，所以 $(V_{in} - V_o)D = V_oD_2$。记 $M = V_o/V_{in}$，得 $D_2 = D(1 - M)/M$，于是 $D + D_2 = D/M$。
            - title: 第 2 步：电感电流的平均值等于负载电流
              body: 电流是一个三角形，平均值 $\frac12I_{pk}(D + D_2) = V_o/R$，其中 $I_{pk} = (V_{in} - V_o)DT/L = V_{in}(1 - M)DT/L$。
            - title: 第 3 步：消去 D₂，得到关于 M 的方程
              body: 代入 $D + D_2 = D/M$：$\frac12V_{in}(1 - M)\frac{DT}{L}\cdot\frac DM = \frac{MV_{in}}{R}$。两边约去 $V_{in}$，记 $K = 2L/(RT)$，得 $(1 - M)D^2 = KM^2$，即 $KM^2 + D^2M - D^2 = 0$。
            - title: 第 4 步：解二次方程，取正根
              body: $M = \frac{-D^2 + \sqrt{D^4 + 4KD^2}}{2K}$，分子分母同乘 $\sqrt{D^4 + 4KD^2} + D^2$ 化简，得 $M = \frac{2}{1 + \sqrt{1 + 4K/D^2}}$。负载越轻（$R$ 越大），$K$ 越小，$M$ 越接近 1。
      - item:
          id: dcm-ratio
          type: number
          prompt: 一个断续导通的 Buck 变换器，$D = 0.3$，$K = 2L/(RT) = 0.1$。电压比 $M = V_o/V_{in}$ 是多少？
          answer: 0.6
          hint: 代入 $M = 2/(1 + \sqrt{1 + 4K/D^2})$。
          explain: $4K/D^2 = 0.4/0.09 \approx 4.44$，$\sqrt{5.44} \approx 2.333$，$M = 2/3.333 = 0.6$，是连续导通时 $D = 0.3$ 的两倍。
      - item:
          id: dcm-output
          type: number
          prompt: Buck 变换器输入 12 V，电感 22 μH，开关频率 200 kHz，负载电阻 44 Ω，占空比 0.4，工作在断续导通。输出电压约是多少伏？（保留两位小数）
          answer: 6.96
          tolerance: 0.005
          unit: V
          hint: 先算 $K = 2L/(RT)$，再求 $M$。
          explain: $K = 2 \times 22 \times 10^{-6} \times 200000/44 = 0.2$，$4K/D^2 = 5$，$M = 2/(1 + \sqrt6) \approx 0.580$，$V_o \approx 6.96$ V，而连续时应是 4.8 V。
      - card:
          title: 断续的利弊
          body: |
            占空比固定时，负载变轻进入断续，输出电压会升高，所以断续工作的变换器一定要有闭环控制。

            断续的好处：电流每个周期都从 0 开始，开关开通时没有电流，二极管关断时电流已经是 0、没有反向恢复；电感可以小一些。坏处：峰值电流大，器件和电容承受的电流应力大；输出对占空比的响应规律也和连续时不同，控制器要另行设计。不少小功率反激电源特意工作在断续或临界导通。
      - item:
          id: dcm-light-load
          type: choice
          prompt: 一个开环工作（占空比固定）的 Buck 变换器，负载从满载减到很轻，进入了断续导通。输出电压会怎样？
          options:
            - text: 升高
              correct: true
            - text: 不变，仍等于 $DV_{in}$
              why: $DV_{in}$ 只在连续导通时成立
            - text: 降低
              why: 断续时电压比 $M = 2/(1 + \sqrt{1 + 4K/D^2})$ 大于 $D$，输出变高
            - text: 变为 0
              why: 开关仍在按占空比导通，能量仍然送到输出
          explain: 负载越轻 $K$ 越小，$M$ 越接近 1。空载时输出会一直升到接近输入电压。

  - id: isolated-dcdc
    chapter: DC-DC变换器
    title: 隔离型变换器
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 手机充电器把市电整流成约 311 V 直流后，为什么要经过一个高频变压器再输出 5 V，而不是直接用 Buck 降压？最主要的原因是什么？
          options:
            - text: 让输出和电网电气隔离，用户摸到输出端不会触电
              correct: true
            - text: 变压器能让输出电流更平滑
              why: 平滑靠的是电感和电容滤波，变压器的作用是隔离和变比
            - text: 变压器能把效率提高到 100%
              why: 变压器本身也有损耗
          explain: 隔离是安全要求。变压器的匝数比还顺便解决了另一个问题：311 V 直接降到 5 V，Buck 的占空比只有 1.6%，很难控制。
      - card:
          title: 正激变换器
          body: |
            **正激变换器（forward converter）**是在 Buck 里插入一个变压器：开关导通时一次绕组接 $V_{in}$，二次绕组感应出 $\frac{N_2}{N_1}V_{in}$，经二极管送进 LC 滤波器，所以

            $$V_o = \frac{N_2}{N_1}DV_{in}$$

            开关导通期间，铁芯里的磁场在一次绕组电压的作用下不断增强；关断期间必须让它降回原来的值（复位），否则一个周期比一个周期强，铁芯最终饱和（不能再被磁化），绕组的电感几乎消失，电流猛增。常用办法是加一个和一次绕组匝数相同的复位绕组，关断时把磁化能量送回电源。
      - item:
          id: forward-output
          type: number
          prompt: 一个正激变换器输入 48 V，变压器匝数比 $N_2/N_1 = 1/4$，占空比 0.4，电感电流连续。输出电压是多少伏？
          answer: 4.8
          unit: V
          hint: 先按匝数比求二次电压，再乘占空比。
          explain: 二次侧脉冲电压 $48/4 = 12$ V，$V_o = 12 \times 0.4 = 4.8$ V。
      - card:
          title: 占空比上限和开关电压
          body: |
            复位绕组的匝数等于一次绕组时，复位期间铁芯两端也是 $V_{in}$，只是方向相反，复位要用和磁化同样长的时间 $DT$。磁化加复位不能超过一个周期，所以 $D \le 0.5$。

            复位期间开关管承受输入电压加上复位绕组反射过来的电压，共 $2V_{in}$，选管子时要按输入电压的最大值算。
      - item:
          id: forward-stress
          type: number
          prompt: 一个复位绕组和一次绕组匝数相同的正激变换器，输入电压范围 36–75 V。开关管关断时承受的最大电压是多少伏？
          answer: 150
          unit: V
          hint: 关断复位期间开关两端是输入电压的几倍？取哪个输入电压？
          explain: $2 \times 75 = 150$ V，再加上漏感尖峰的余量，常选 200 V 或 250 V 的 MOSFET。
      - card:
          title: 反激变换器
          body: |
            **反激变换器（flyback converter）**是带隔离的 Buck-Boost，里面的“变压器”其实是绕在同一个铁芯上的两个电感线圈（耦合电感）。开关导通时一次绕组储能，二次侧二极管反偏不导电；开关关断时能量从二次绕组释放到输出：

            $$V_o = \frac{N_2}{N_1}\cdot\frac{D}{1 - D}V_{in}$$

            反激只用一个开关、一个二极管，没有输出电感，元件最少，几瓦到一百多瓦的适配器大多用它。两个绕组之间没有完全耦合的那部分电感叫**漏感（leakage inductance）**，开关关断时它会产生电压尖峰，要用电阻、电容和二极管组成的吸收电路把尖峰限住。
      - item:
          id: flyback-turns
          type: number
          prompt: 一个反激变换器输入 360 V，要输出 12 V，满载时占空比定为 0.4（电流连续）。一次和二次的匝数比 $N_1/N_2$ 应是多少？
          answer: 20
          hint: 由 $V_o = \frac{N_2}{N_1}\cdot\frac{D}{1 - D}V_{in}$ 解出 $N_1/N_2$。
          explain: $\frac{D}{1 - D}V_{in} = \frac{0.4}{0.6} \times 360 = 240$ V，$N_1/N_2 = 240/12 = 20$。
      - card:
          title: 推挽和全桥
          body: |
            功率更大时用推挽或全桥：两个（或四个）开关轮流让一次绕组正、反两个方向通电，铁芯在两个方向上都被利用，每半个周期自然复位，不需要复位绕组。

            全桥里每个开关只承受 $V_{in}$，适合几百瓦到几十千瓦。推挽的两个开关都接地，驱动简单，但每个开关要承受 $2V_{in}$，适合低压输入，如 12 V 车载电源的升压级。
      - item:
          id: isolated-match
          type: match
          prompt: 把每个应用和最常用的隔离型拓扑配对。
          pairs:
            - [电视机 5 W 待机电源, 反激]
            - [3 kW 通信电源的隔离级, 全桥]
            - [12 V 蓄电池升压的车载逆变器前级, 推挽]
          explain: 小功率要元件少，用反激；大功率要开关电压应力小、铁芯双向利用，用全桥；低压大电流输入，两个开关都接地的推挽驱动最简单。
      - item:
          id: forward-duty-limit
          type: choice
          prompt: 复位绕组和一次绕组匝数相同的正激变换器，为什么占空比不能超过 0.5？
          options:
            - text: 铁芯复位需要和磁化一样长的时间，两者加起来不能超过一个周期
              correct: true
            - text: 占空比超过 0.5 时输出电压会超过输入电压
              why: 正激的输出 $\frac{N_2}{N_1}DV_{in}$ 由匝数比决定能否高于输入，和 0.5 无关
            - text: 二次侧二极管承受不了
              why: 限制来自铁芯复位，不是二次侧的二极管
            - text: 伏秒平衡要求 $D = 0.5$
              why: 输出电感的伏秒平衡对任何 $D$ 都成立；0.5 是铁芯复位的上限
          explain: 磁化期间铁芯两端是 $V_{in}$，持续 $DT$；复位期间是 $-V_{in}$，也要 $DT$。$2DT \le T$ 即 $D \le 0.5$。

  # ==== 逆变器 ====
  - id: square-wave-inverter
    chapter: 逆变器
    title: 单相逆变器
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个全桥电路让负载两端轮流加上 $+V_{dc}$ 和 $-V_{dc}$，得到一个方波。这个方波里只有一个频率的正弦吗？
          options:
            - text: 不是，还含有 3、5、7 次等奇次谐波
              correct: true
            - text: 是，只有切换的那个频率
              why: 方波不是正弦，按傅里叶级数拆开有一串奇次谐波
            - text: 不是，只含有偶次谐波
              why: 正负半周对称的方波没有偶次谐波，只有奇次谐波
          explain: 方波的基波旁边还有幅值为 $1/3$、$1/5$……的谐波。这一课讲方波逆变器和减少谐波的第一种办法。
      - card:
          title: 全桥逆变器
          body: |
            全桥逆变器有两个**桥臂（leg）**，每个桥臂是上下串联的两个开关，负载接在两个桥臂的中点之间。S1、S4 导通时负载上是 $+V_{dc}$，S2、S3 导通时是 $-V_{dc}$。两组轮流各导通半个周期，输出方波的频率就是切换的频率，可以随意改变。

            每个开关反并联一个二极管：负载是电感性时电流滞后电压，换向后的一小段时间里电流要经二极管流回直流电源。方波的基波幅值 $\frac{4V_{dc}}{\pi}$，有效值 $\frac{2\sqrt2}{\pi}V_{dc} \approx 0.9V_{dc}$。
      - item:
          id: square-fundamental
          type: number
          prompt: 一个全桥方波逆变器的直流电压是 300 V。输出电压基波的有效值约是多少伏？（保留到个位）
          answer: 270
          tolerance: 0.5
          unit: V
          hint: 基波幅值是 $4V_{dc}/\pi$，再除以 $\sqrt2$。
          explain: $\frac{4 \times 300}{\pi\sqrt2} \approx 270$ V。
      - card:
          title: 准方波：错开两个桥臂
          body: |
            方波的 3 次谐波有基波的三分之一，不能直接接电机或电网。一种办法是让两个桥臂错开一个角度切换，输出在每半周的开头和结尾各有一段为 0，成为准方波。设这两段零电压各宽 $\alpha$，第 $n$ 次谐波的幅值是

            $$V_n = \frac{4V_{dc}}{n\pi}\cos(n\alpha)$$

            取 $\alpha = 30°$，$\cos90° = 0$，3 次谐波（以及 9、15……次）被消除，基波降到方波的 $\cos30° \approx 0.866$。改变 $\alpha$ 还能调节基波的大小。
      - item:
          id: quasi-square
          type: number
          prompt: 一个全桥逆变器直流电压 400 V，输出准方波，每半周两端的零电压段各宽 30°。输出基波的幅值约是多少伏？（保留到个位）
          answer: 441
          tolerance: 0.5
          unit: V
          hint: 零电压段让基波按什么规律减小？
          explain: $\frac{4 \times 400}{\pi} \times \cos30° \approx 509.3 \times 0.866 \approx 441$ V。
      - item:
          id: eliminate-fifth
          type: number
          prompt: 一个全桥逆变器输出准方波：每半周两端各有一段宽 $\alpha$ 的零电压，第 $n$ 次谐波的幅值和 $\cos(n\alpha)$ 成正比。$\alpha$ 取多少度可以消除 5 次谐波？（填 0° 到 90° 之间最小的那个）
          answer: 18
          unit: °
          hint: 要让 $\cos(5\alpha) = 0$，$5\alpha$ 应等于多少度？
          explain: $5\alpha = 90°$，$\alpha = 18°$。一个角度只能消掉一种谐波（和它的奇数倍），要同时消掉几种就要更多的开关角。
      - card:
          title: 单相功率在 2 倍频率上脉动
          body: |
            单相逆变器输出 $v = \sqrt2V\sin\omega t$、$i = \sqrt2I\sin(\omega t - \varphi)$，瞬时功率 $p = vi = 2VI\sin\omega t\sin(\omega t - \varphi)$，用积化和差 $2\sin A\sin B = \cos(A - B) - \cos(A + B)$ 得

            $$p = VI\cos\varphi - VI\cos(2\omega t - \varphi)$$

            除了平均功率 $VI\cos\varphi$，还有一个频率为 $2\omega$、幅值为 $VI$ 的脉动项。直流侧的电池、光伏板或前一级 DC/DC 希望输出恒定的功率，脉动的部分要由直流母线上的电容来回吞吐。三相平衡时三相的脉动项相加为 0，总功率恒定，不需要这个缓冲。
      - card:
          title: 例题：直流电容要多大
          body: 单相并网逆变器输出 3 kW，功率因数 1，电网 50 Hz，直流母线 400 V，允许的电压纹波峰峰值 20 V。估算直流电容。
          reveal:
            - title: 第 1 步：电容要吞吐多少能量
              body: 功率因数为 1 时脉动项是 $-P\cos2\omega t$，对时间积分，电容储能的变化是 $-\frac{P}{2\omega}\sin2\omega t$，最大和最小相差 $P/\omega$。
            - title: 第 2 步：用电压纹波表示能量变化
              body: $\frac12C(V_{max}^2 - V_{min}^2) = \frac12C(V_{max} + V_{min})(V_{max} - V_{min}) = CV_{dc}\Delta V$。
            - title: 第 3 步：求电容
              body: $C = \frac{P}{\omega V_{dc}\Delta V} = \frac{3000}{314.16 \times 400 \times 20} \approx 1.19$ mF，通常要用几只电解电容并联。
      - item:
          id: dc-link-capacitor
          type: number
          prompt: 单相逆变器输出 2.4 kW，功率因数 1，输出 50 Hz，直流母线 400 V，允许电压纹波峰峰值 12 V。直流电容至少约多少微法？（保留到个位）
          answer: 1592
          tolerance: 1
          unit: μF
          hint: $C = P/(\omega V_{dc}\Delta V)$，$\omega = 2\pi f$。
          explain: $C = 2400/(314.16 \times 400 \times 12) \approx 1.592 \times 10^{-3}$ F，约 1592 μF。
      - item:
          id: three-phase-no-ripple
          type: choice
          prompt: 一台三相平衡的逆变器，为什么不需要为 2 倍频率的功率脉动配那么大的直流电容？
          options:
            - text: 三相的瞬时功率相加是恒定的，脉动项互相抵消
              correct: true
            - text: 三相逆变器的开关频率更高
              why: 2 倍工频的功率脉动和开关频率无关
            - text: 三相逆变器的直流电压更高，所以电容可以小
              why: 电压高能让电容小一些，但根本原因是三相总功率没有脉动
            - text: 三相负载都是纯电阻
              why: 三相负载一般是电感性的；只要三相平衡，总功率就恒定
          explain: 三相的脉动项分别是 $\cos2\omega t$、$\cos(2\omega t - 240°)$、$\cos(2\omega t - 480°)$，相加为 0。

  - id: three-phase-inverter
    chapter: 逆变器
    title: 三相逆变器和多电平
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 三相逆变器用三个桥臂。一共有多少种不同的开关状态（每个桥臂上开或下开）？
          options:
            - text: '8'
              correct: true
            - text: '6'
              why: 6 种是三相全不相同的组合；还有三相全接正端、全接负端两种
            - text: '3'
              why: 每个桥臂有两种状态，三个桥臂共 $2^3$ 种
          explain: $2^3 = 8$ 种。其中 6 种让负载上有电压，2 种（全上或全下）让三相线电压都为 0。
      - card:
          title: 三相电压型逆变器
          body: |
            三相逆变器有三个桥臂，各接一相负载。直流侧是一个大电容，电压恒定，这类逆变器叫**电压型逆变器（voltage-source inverter）**，电机驱动和光伏逆变器大多是这种。最简单的控制是六拍方式：每个开关导通 180°，三个桥臂依次错开 120°，每 60° 切换一次。

            每个桥臂中点对直流负端的电压是 0 到 $V_{dc}$ 的方波，两相相减得到线电压：正负各 120° 宽、两边各有 30° 为 0 的准方波，正是 $\alpha = 30°$ 的准方波，没有 3 次谐波。
      - item:
          id: six-step
          type: number
          prompt: 一台三相逆变器，每个开关导通 180°、三个桥臂依次错开 120°（六拍方式），直流电压 540 V。输出线电压基波的有效值约是多少伏？（保留到个位）
          answer: 421
          tolerance: 0.5
          unit: V
          hint: 线电压是 $\alpha = 30°$ 的准方波，基波幅值 $\frac{4V_{dc}}{\pi}\cos30°$。
          explain: 幅值 $\frac{4 \times 540}{\pi} \times 0.866 \approx 595.4$ V，有效值 $\approx 421$ V，即 $\frac{\sqrt6}{\pi}V_{dc} \approx 0.78V_{dc}$。
      - item:
          id: six-step-harmonic
          type: choice
          prompt: 一台三相逆变器每个开关导通 180°、三个桥臂依次错开 120°（六拍方式）。它的线电压里最低的谐波是几次？
          options:
            - text: 5 次
              correct: true
            - text: 3 次
              why: 线电压是 $\alpha = 30°$ 的准方波，3 次谐波被消除了
            - text: 2 次
              why: 正负半周对称的波形没有偶次谐波
            - text: 7 次
              why: 7 次存在，但 5 次更低，也存在
          explain: 3 的倍数次谐波在线电压里抵消，偶次谐波因半波对称不存在，剩下 5、7、11、13……次，幅值是基波的 $1/n$。
      - card:
          title: 电流型逆变器
          body: |
            另一类逆变器的直流侧串一个大电感，电流恒定，开关把这个电流轮流分配给各相，输出电流是矩形波，叫**电流型逆变器（current-source inverter）**。它的开关要能承受反向电压，过去常用晶闸管；直流电流不会突变，负载短路时比较安全。

            大功率电机驱动和感应加热用的并联谐振逆变器属于这一类。
      - item:
          id: vsi-csi
          type: match
          prompt: 把两类逆变器和它们的特征配对。
          pairs:
            - [电压型逆变器, 直流侧并大电容，输出电压是矩形波]
            - [电流型逆变器, 直流侧串大电感，输出电流是矩形波]
          explain: 直流侧的储能元件决定了哪一个量恒定：电容让电压恒定，电感让电流恒定。
      - card:
          title: 多电平逆变器
          body: |
            两电平桥臂的输出只有两种电压，每次切换都跳一个 $V_{dc}$。**多电平（multilevel）**逆变器让输出有更多台阶。二极管钳位式三电平桥臂（NPC）把直流电容分成两半，输出 $+V_{dc}/2$、0、$-V_{dc}/2$ 三种电平，每个开关只承受 $V_{dc}/2$。级联 H 桥把 $n$ 个带独立直流电源的全桥串起来，相电压有 $2n + 1$ 个电平。

            台阶越多，输出越接近正弦，电压跳变越小，适合几千伏的中高压电机和电网设备。
      - item:
          id: cascaded-levels
          type: number
          prompt: 一台级联 H 桥逆变器每相串联 5 个全桥单元。每相输出电压有多少个电平？
          answer: 11
          hint: 每个全桥能输出 $+V$、0、$-V$，$n$ 个串联能叠出多少种值？
          explain: $n$ 个单元能叠出 $-nV$ 到 $+nV$ 之间每隔 $V$ 一个值，共 $2n + 1 = 11$ 个电平。
      - item:
          id: npc-stress
          type: number
          prompt: 一台二极管钳位式三电平逆变器的直流电压是 3000 V。每个开关管承受的电压是多少伏？
          answer: 1500
          unit: V
          hint: 三电平桥臂把直流电压分成了几份？
          explain: 每个开关只承受 $V_{dc}/2 = 1500$ V，所以可以用 1700 V 级的 IGBT 做 3000 V 直流的逆变器。

  # ==== PWM控制 ====
  - id: spwm
    chapter: PWM控制
    title: 正弦脉宽调制
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 逆变器的开关只有通和断两种状态。怎样才能让它的输出接近正弦？
          options:
            - text: 快速开关，让每个开关周期里的平均电压按正弦规律变化
              correct: true
            - text: 让开关管工作在放大状态，按正弦调节管压降
              why: 那样管子上损耗很大，又回到了线性调整
            - text: 做不到，只能输出方波，再用变压器把方波变成正弦
              why: 变压器传送的波形形状不变，方波进去还是方波出来
          explain: 开关频率远高于输出频率时，每个开关周期里的平均电压可以随时调节。让它按正弦变化，滤掉开关频率的成分就得到正弦。
      - card:
          title: 正弦脉宽调制
          body: |
            把一个正弦的调制波和一个高频三角形的**载波（carrier）**比较：调制波高于载波时桥臂接正端，低于载波时接负端。每个载波周期里桥臂电压是一个脉冲，宽度随调制波的大小变化，脉冲的平均值跟着正弦走。这就是正弦脉宽调制（SPWM）。

            调制波幅值和载波幅值之比叫**调制比（modulation index）**$m_a$。$m_a \le 1$ 时输出基波幅值和 $m_a$ 成正比：半桥是 $m_a\frac{V_{dc}}{2}$，全桥是 $m_aV_{dc}$。
      - item:
          id: spwm-full-bridge
          type: number
          prompt: 一个单相全桥逆变器直流电压 400 V，正弦 PWM 调制比 0.8。输出基波电压的有效值约是多少伏？（保留到个位）
          answer: 226
          tolerance: 0.5
          unit: V
          hint: 全桥的基波幅值是 $m_aV_{dc}$。
          explain: 幅值 $0.8 \times 400 = 320$ V，有效值 $320/\sqrt2 \approx 226$ V。
      - item:
          id: spwm-half-bridge
          type: number
          prompt: 一个单相半桥逆变器直流电压 600 V，正弦 PWM 调制比 0.9。输出基波电压的幅值是多少伏？
          answer: 270
          unit: V
          hint: 同样的直流电压，半桥能加到负载上的最大电压是全桥的几分之几？
          explain: 半桥基波幅值 $m_a\frac{V_{dc}}{2} = 0.9 \times 300 = 270$ V，是同样直流电压全桥的一半。
      - card:
          title: 谐波去了哪里
          body: |
            SPWM 输出的谐波集中在载波频率和它的 2 倍、3 倍……附近。载波频率和输出频率之比叫频率调制比 $m_f$：输出 50 Hz、载波 10 kHz 时 $m_f = 200$，最低的一组谐波在 10 kHz 附近，离 50 Hz 很远，一个不大的低通滤波器或电机绕组的电感就能滤掉。

            全桥的两个桥臂用反相的调制波分别和载波比较，输出在 $+V_{dc}$ 和 0、或 0 和 $-V_{dc}$ 之间切换，叫单极性调制，谐波移到 2 倍载波频率附近；两个桥臂总是对角同时切换，输出在 $\pm V_{dc}$ 之间跳，叫双极性调制。
      - item:
          id: unipolar-harmonics
          type: number
          prompt: 一个单相全桥逆变器用单极性 SPWM，载波 10 kHz，输出 50 Hz。输出电压里最低的一组谐波大约在多少千赫附近？
          answer: 20
          unit: kHz
          hint: 单极性调制把谐波移到了载波频率的几倍附近？
          explain: 单极性调制时两个桥臂的载波频率谐波在负载电压里抵消，最低的一组在 $2 \times 10 = 20$ kHz 附近，滤波更容易。
      - card:
          title: 过调制
          body: |
            $m_a > 1$ 时，调制波的峰值部分高过了载波的峰值，在这些地方比较结果一直不变，脉冲消失，波形被削顶，逐渐向方波靠拢，叫**过调制（overmodulation）**。

            过调制时基波还能继续增大，但不再和 $m_a$ 成正比，最多到方波的 $\frac4\pi$ 倍；同时出现 3、5、7 次等低次谐波，它们离基波很近，很难滤掉。所以一般让 $m_a \le 1$。
      - item:
          id: overmodulation
          type: choice
          prompt: 正弦 PWM 的调制比超过 1 以后，为什么输出里会出现低次谐波？
          options:
            - text: 调制波峰值附近不再和载波相交，脉冲消失，输出被削顶向方波靠拢
              correct: true
            - text: 载波频率自动降低了
              why: 载波频率是固定的，变的是调制波和载波的相交情况
            - text: 直流电压升高了
              why: 直流电压不变，是调制波超出了载波的范围
            - text: 开关管进入了放大状态
              why: 开关管仍然只有通和断，只是有些载波周期里一直不切换
          explain: 削顶的正弦接近方波，方波含 3、5、7 次谐波，这些低次谐波就出现在输出里。
  - id: pwm-details
    chapter: PWM控制
    title: 三相 SPWM、死区和谐波消除
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 同一个桥臂的上下两个开关如果同时导通，会怎样？
          options:
            - text: 直流电源被直接短路，电流很大，开关管可能烧毁
              correct: true
            - text: 输出电压变成直流电压的一半
              why: 两个开关都导通时它们把直流正负端直接连起来，是短路
            - text: 没有影响，两个开关会平分电流
              why: 直通回路里没有任何限流的元件，电流只受寄生电阻限制
          explain: 这叫直通，是桥式电路最危险的故障。控制器必须保证一个开关完全关断后才开通另一个。
      - card:
          title: 三相 SPWM 的线电压
          body: |
            三相 SPWM 用三个相差 120° 的调制波，共用一个载波。每个桥臂对直流中点的电压基波幅值是 $m_a\frac{V_{dc}}{2}$，两相相减得到线电压，幅值乘 $\sqrt3$：

            $$V_{LL1,peak} = \frac{\sqrt3}{2}m_aV_{dc} \approx 0.866m_aV_{dc}$$

            $m_a = 1$ 时线电压基波幅值只有 $0.866V_{dc}$，直流电压没有完全用上。
      - item:
          id: three-phase-spwm
          type: number
          prompt: 一台三相逆变器直流电压 600 V，用正弦 PWM，调制比 1。输出线电压基波的有效值约是多少伏？（保留到个位）
          answer: 367
          tolerance: 0.5
          unit: V
          hint: 每个桥臂的基波幅值是多少？两相相减，幅值要乘几？
          explain: 幅值 $0.866 \times 600 \approx 519.6$ V，有效值 $\approx 367$ V，即 $0.612m_aV_{dc}$。
      - card:
          title: 死区
          body: |
            开关关断需要时间，所以控制器在关一个、开另一个之间插入一小段两个都关断的时间，叫**死区（dead time）**，一般零点几到几微秒。

            死区期间负载电流经某个反并联二极管续流，输出电压由电流方向决定，而不是由控制信号决定。结果是每个开关周期少了（或多了）约 $t_dV_{dc}$ 的伏秒，平均电压误差约 $t_df_sV_{dc}$，方向和电流相反。输出电压低时这个误差占的比例大，会让电流波形在过零附近畸变。
      - item:
          id: dead-time-error
          type: number
          prompt: 一台逆变器直流电压 600 V，开关频率 10 kHz，死区 1 μs。死区造成的平均电压误差约是多少伏？
          answer: 6
          unit: V
          hint: 每个开关周期少了多少伏秒？一秒里有多少个周期？
          explain: $1 \times 10^{-6} \times 10^4 \times 600 = 6$ V。输出 300 V 时只占 2%，输出 20 V 时占 30%，所以电机低速时要做死区补偿。
      - item:
          id: dead-time-why
          type: choice
          prompt: 为什么桥臂的驱动信号里必须插入死区？
          options:
            - text: 开关关断要时间，不留间隔会让上下管同时导通而短路
              correct: true
            - text: 让输出电压更接近正弦
              why: 死区反而带来电压误差，让波形变差；它是为了安全不得不加的
            - text: 降低开关频率，减小开关损耗
              why: 死区不改变开关频率
            - text: 让反并联二极管有时间冷却
              why: 死区期间反并联二极管恰恰在导通续流
          explain: 驱动信号撤掉后器件还要一段时间才真正关断。死区保证一个管子完全关断后另一个才开通。
      - card:
          title: 选择性谐波消除
          body: |
            几兆瓦的逆变器开关频率常只有几百赫，没法用高频载波把谐波推远。选择性谐波消除（selective harmonic elimination）事先离线算好每四分之一周期里的几个开关角：波形保持四分之一周期对称时，有 $N$ 个开关角就能满足 $N$ 个条件，通常一个用来设定基波幅值，其余 $N - 1$ 个让指定的低次谐波（如 5、7、11、13 次）为 0。

            准方波里取 $\alpha = 30°$ 消除 3 次谐波，就是只用一个开关角、专门消一种谐波的例子。
      - item:
          id: she-angles
          type: number
          prompt: 一台用选择性谐波消除的三相逆变器，每四分之一周期有 5 个开关角，其中一个条件用来设定基波幅值。最多能消除几种低次谐波？
          answer: 4
          hint: 有几个开关角就能满足几个方程。
          explain: 5 个开关角满足 5 个方程，去掉设定基波的那一个，剩下 4 个，通常用来消除 5、7、11、13 次谐波（3 的倍数次在三相线电压里自然抵消）。
  - id: svpwm-current
    chapter: PWM控制
    title: 空间矢量 PWM 和电流控制
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 三相 SPWM 在调制比为 1 时，线电压幅值只有直流电压的 86.6%。你猜换一种调制方法，在不过调制的情况下能不能把线电压幅值提高到等于直流电压？
          options:
            - text: 能
              correct: true
            - text: 不能，0.866 是三相逆变器的上限
              why: 0.866 只是 SPWM 的上限；两相之间的电压最多可以达到整个直流电压
            - text: 能，而且能超过直流电压
              why: 线电压是两个桥臂之差，每个桥臂只能在 0 和 $V_{dc}$ 之间，差值不会超过 $V_{dc}$
          explain: 换一种分配开关时间的调制方法，能把线性范围内的线电压幅值提高到 $V_{dc}$，多出约 15.5%。
      - card:
          title: 8 个开关状态和空间矢量
          body: |
            三相逆变器有 $2^3 = 8$ 种开关状态。把三相电压合成为一个平面上的**空间矢量（space vector）**：6 种状态给出 6 个长度为 $\frac23V_{dc}$、相隔 60° 的矢量，围成一个正六边形；三相全接正端或全接负端的 2 种状态给出零矢量。

            要输出一个旋转的电压矢量，就在每个开关周期里按比例使用和它相邻的两个矢量和零矢量，让平均值等于需要的矢量，这叫空间矢量 PWM（SVPWM）。
      - card:
          title: 多出的 15.5%
          body: |
            矢量能连续旋转的最大圆是六边形的内切圆，半径 $\frac{V_{dc}}{\sqrt3}$，对应相电压基波幅值 $\frac{V_{dc}}{\sqrt3}$、线电压幅值 $V_{dc}$。SPWM 在 $m_a = 1$ 时相电压幅值是 $\frac{V_{dc}}{2}$，所以 SVPWM 多出 $\frac{2}{\sqrt3} - 1 \approx 15.5\%$。

            在 SPWM 的调制波里加入适量的 3 次谐波也能得到同样的效果：每相电压里加入的 3 次谐波三相相同，在线电压里互相抵消。
      - item:
          id: svpwm-gain
          type: number
          prompt: 线性调制范围内，SVPWM 能输出的最大线电压基波幅值是 SPWM（调制比 1）的多少倍？（保留三位小数）
          answer: 1.155
          tolerance: 0.0005
          hint: 两种调制方法能做出的最大线电压幅值各是多少？
          explain: $1/0.866 = 2/\sqrt3 \approx 1.155$，多出 15.5%。
      - item:
          id: svpwm-max-line
          type: number
          prompt: 一台三相逆变器直流电压 700 V，用 SVPWM，不过调制。输出线电压基波的有效值最大约是多少伏？（保留到个位）
          answer: 495
          tolerance: 0.5
          unit: V
          hint: SVPWM 的线电压幅值最大是多少？
          explain: 幅值最大 700 V，有效值 $700/\sqrt2 \approx 495$ V。
      - card:
          title: 例题：一个开关周期里各矢量用多久
          body: 要输出的矢量长 200 V，在第一个扇区里和第一个有效矢量成 20°，直流电压 600 V，开关周期 100 μs。求两个相邻有效矢量和零矢量各用多少时间。
          reveal:
            - title: 第 1 步：算归一化的长度
              body: 常用的公式是 $T_1 = T_sm\sin(60° - \theta)$、$T_2 = T_sm\sin\theta$，其中 $m = \sqrt3|V_{ref}|/V_{dc} = \sqrt3 \times 200/600 \approx 0.577$。
            - title: 第 2 步：算两个有效矢量的时间
              body: $T_1 = 100 \times 0.577 \times \sin40° \approx 37.1$ μs，$T_2 = 100 \times 0.577 \times \sin20° \approx 19.7$ μs。
            - title: 第 3 步：剩下的给零矢量
              body: $T_0 = T_s - T_1 - T_2 \approx 43.1$ μs，通常平分给两个零矢量放在周期的两头。$T_0$ 降到 0 时就到了内切圆的边上。
      - item:
          id: svpwm-zero-time
          type: number
          prompt: 用 SVPWM 输出一个长 300 V 的矢量，它恰好在两个相邻有效矢量正中间（$\theta = 30°$），直流电压 600 V，开关周期 100 μs。零矢量一共用多少微秒？（保留一位小数）
          answer: 13.4
          tolerance: 0.05
          unit: μs
          hint: 先算 $m = \sqrt3|V_{ref}|/V_{dc}$，$T_1 = T_2 = T_sm\sin30°$。
          explain: $m = \sqrt3 \times 300/600 \approx 0.866$，$T_1 = T_2 = 100 \times 0.866 \times 0.5 \approx 43.3$ μs，$T_0 \approx 100 - 86.6 = 13.4$ μs。
      - card:
          title: 逆变器的电流控制
          body: |
            接电网或电机的逆变器常常要直接控制电流。滞环控制：测量电流，超出参考值上方一个窄带就让桥臂接负端，低于下方就接正端，电流被关在带子里；它简单、响应快，但开关频率随工作点变化，谐波分散，滤波器难设计。

            另一种做法是用比例积分（PI）控制器根据电流误差算出每个周期要输出的电压，再交给固定频率的 PWM。开关频率固定，是并网逆变器和电机驱动最常用的做法。
      - item:
          id: hysteresis-drawback
          type: choice
          prompt: 滞环电流控制的主要缺点是什么？
          options:
            - text: 开关频率随输出电压和负载变化，谐波分布不固定，滤波器难设计
              correct: true
            - text: 响应太慢
              why: 滞环控制一超出带子就立即切换，响应很快
            - text: 需要复杂的数学模型
              why: 它只需要一个比较器，几乎不依赖模型
            - text: 电流误差不受控制
              why: 电流被限制在滞环带内，误差有明确的上限
          explain: 滞环控制什么时候切换取决于电流什么时候碰到边界，而这随电压、电感和负载变化，所以开关频率不固定。
      - card:
          title: PWM 整流
          body: |
            把电压型逆变器反过来用，就是 PWM 整流器：控制交流侧电流成为和电网电压同相的正弦，功率因数接近 1，谐波很小；功率还能双向流动，电机制动时的能量可以送回电网。

            交流侧要串电感，直流电压必须高于交流线电压的峰值。它本质上是一个升压电路，和二极管整流只能得到约 $1.35V_{LL}$ 不同。
      - item:
          id: pwm-rectifier-vdc
          type: number
          prompt: 一台三相 PWM 整流器接 380 V 电网，用 SVPWM。直流电压至少要高于多少伏才能正常工作？（保留到个位）
          answer: 537
          tolerance: 0.5
          unit: V
          hint: 不过调制时，逆变器能在交流侧做出的线电压峰值最多是多少？它至少要和电网的哪个量一样大？
          explain: 线电压峰值 $380\sqrt2 \approx 537$ V，直流电压至少要这么高，实际常取 600–700 V 留出控制余量。用 SPWM 时要 $537/0.866 \approx 621$ V。

  # ==== 软开关 ====
  - id: snubbers
    chapter: 软开关
    title: 硬开关和缓冲电路
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个开关管关断时，电流在 50 ns 里从 20 A 降到 0，线路上有 100 nH 的寄生电感。你猜寄生电感上会感应出多大的电压尖峰？
          options:
            - text: 几十伏
              correct: true
            - text: 几乎为 0，100 nH 太小了
              why: 电感虽小，但电流变化极快，$L\frac{di}{dt}$ 并不小
            - text: 几千伏
              why: $100 \times 10^{-9} \times 20/(50 \times 10^{-9}) = 40$ V，没有那么大
          explain: $L\frac{di}{dt} = 100\ \text{nH} \times 20\ \text{A}/50\ \text{ns} = 40$ V，叠加在直流电压上加到开关管两端。开关越快，这个尖峰越大。
      - card:
          title: 硬开关
          body: |
            开关在电压和电流都不为零时切换，叫**硬开关（hard switching）**：每次转换都损耗 $\frac12VIt$ 量级的能量；电压和电流变化很快，还会在线路的寄生电感上产生 $L\frac{di}{dt}$ 的电压尖峰，引起电磁干扰。

            关断电感负载时，开关两端的电压要先升到直流电压，续流二极管才能导通接走电流，所以关断瞬间开关同时承受高电压和大电流。**缓冲电路（snubber）**就是在开关旁边加几个元件，改变转换时电压和电流的轨迹，把这部分损耗和应力从开关管上移开。
      - item:
          id: stray-spike
          type: number
          prompt: 一个开关管关断时电流在 20 ns 里从 30 A 降到 0，回路的寄生电感是 30 nH。寄生电感上的电压尖峰约是多少伏？
          answer: 45
          unit: V
          hint: 电感电压等于 $L$ 乘电流的变化率。
          explain: $30 \times 10^{-9} \times 30/(20 \times 10^{-9}) = 45$ V。缩短功率回路的走线、减小寄生电感，是高速开关电路布板的第一条要求。
      - card:
          title: 关断缓冲
          body: |
            关断缓冲是在开关两端并联一个电容 $C_s$：电容经二极管充电，经电阻放电（RCD 缓冲）。开关关断、电流开始下降时，负载电流转入电容，电容电压从 0 慢慢升高：电流已经降下去了，电压才升起来，关断损耗大大减小。

            若希望电流降到 0 时电容电压刚好升到 $V$：电流在 $t_f$ 里线性下降时，流进电容的电流是 $I\frac{t}{t_f}$，到 $t_f$ 时电容电压是 $\frac{It_f}{2C_s}$，所以 $C_s = \frac{It_f}{2V}$。
      - item:
          id: snubber-capacitor
          type: number
          prompt: 一个开关管关断 10 A 电流，电流下降时间 100 ns，直流电压 400 V。要让电流降到 0 时缓冲电容电压刚好升到 400 V，电容是多少纳法？（保留两位小数）
          answer: 1.25
          tolerance: 0.005
          unit: nF
          hint: 电流降到 0 时，流进电容的电荷是多少？这时电容电压是多少？
          explain: $C_s = 10 \times 100 \times 10^{-9}/(2 \times 400) = 1.25$ nF。
      - card:
          title: 缓冲电容的能量去了哪里
          body: |
            电容里储存的 $\frac12C_sV^2$ 在下次开关开通时经电阻放掉，变成电阻的热，每秒 $\frac12C_sV^2f$。所以关断缓冲没有消灭损耗，而是把它从开关管搬到了电阻上：开关管温度降低、更可靠，电压上升变慢、干扰变小。

            电阻的取值要让电容在最短的导通时间里放完电；电阻太小，开通时放电电流又会加重开关管的负担。
      - item:
          id: snubber-loss
          type: number
          prompt: 一个 1.25 nF 的 RCD 关断缓冲电容每个周期充到 400 V，开关频率 50 kHz。缓冲电阻上的损耗是多少瓦？
          answer: 5
          unit: W
          hint: 每个周期放掉的能量是 $\frac12C_sV^2$。
          explain: $\frac12 \times 1.25 \times 10^{-9} \times 400^2 = 0.1$ mJ，乘 50000 次每秒，5 W。
      - card:
          title: 开通缓冲和复合缓冲
          body: |
            开通缓冲是在开关回路里串一个小电感 $L_s$：开关开通时电压先降到很低，电流才受 $L_s$ 限制慢慢上升，开通损耗减小；它还限制了二极管反向恢复时的电流尖峰。电感的储能 $\frac12L_sI^2$ 在关断时经一个二极管和电阻放掉。

            把关断缓冲和开通缓冲合在一起就是复合缓冲。用谐振把缓冲元件的储能送回电源、而不是烧在电阻上的电路叫无损缓冲。
      - item:
          id: turn-on-snubber-loss
          type: number
          prompt: 一个开通缓冲电感 1 μH，关断时电流 20 A，储能每个周期都在电阻上放掉，开关频率 20 kHz。电阻上的损耗是多少瓦？
          answer: 4
          unit: W
          hint: 每个周期放掉 $\frac12L_sI^2$。
          explain: $\frac12 \times 10^{-6} \times 400 = 0.2$ mJ，乘 20000，4 W。
      - item:
          id: which-snubber
          type: choice
          prompt: 一个 Buck 电路里，续流二极管的反向恢复电流在开关管开通时形成很大的电流尖峰。下面哪种缓冲能直接限制这个尖峰？
          options:
            - text: 串在开关回路里的开通缓冲电感
              correct: true
            - text: 并在开关管两端的 RCD 关断缓冲电容
              why: 关断缓冲改变的是关断时电压上升的速度，开通时它的电容还要经开关放电，反而加大开通电流
            - text: 加大输出滤波电容
              why: 输出电容在 LC 滤波器的另一边，管不到开关回路里的电流尖峰
            - text: 降低开关频率
              why: 降低频率减少尖峰出现的次数，但每次的尖峰大小不变
          explain: 串联电感限制了电流上升的速度 $di/dt$，二极管的反向恢复电流随之变小。
  - id: resonant-soft-switching
    chapter: 软开关
    title: 谐振和软开关
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 如果一个开关管在它两端的电压已经降到 0 以后才开通，开通损耗大约是多少？
          options:
            - text: 接近 0
              correct: true
            - text: 和硬开关一样
              why: 开通损耗来自电压和电流的交叠；电压已经是 0，乘出来的功率接近 0
            - text: 比硬开关更大
              why: 电压为 0 时开通，管子上没有电压，不会更大
          explain: 开通时电压为 0，$v \cdot i$ 接近 0，几乎没有开通损耗。这一课讲怎样让开关在电压为零时动作。
      - card:
          title: 软开关
          body: |
            让开关在电压为零时开通或关断，叫**零电压开关（zero-voltage switching，ZVS）**；在电流为零时开通或关断，叫**零电流开关（zero-current switching，ZCS）**。两者合称**软开关（soft switching）**。

            ZVS 开通的做法：在给门极信号之前，先让电路里的电感电流把开关管输出电容上的电荷抽走，管子两端电压降到 0，体二极管或反并联二极管先导通；这时再开通，电压和电流没有交叠，输出电容的储能 $\frac12C_{oss}V^2$ 也不会在沟道里烧掉。
      - item:
          id: coss-loss
          type: number
          prompt: 一个 MOSFET 的输出电容按 200 pF 算，在 400 V 下硬开通，开关频率 100 kHz。每次开通时输出电容的储能在沟道里烧掉，这部分损耗是多少瓦？
          answer: 1.6
          unit: W
          hint: 每次开通时，输出电容里存着多少能量？
          explain: $\frac12 \times 200 \times 10^{-12} \times 400^2 = 16$ μJ，乘 $10^5$，1.6 W。改成 ZVS 开通，这部分就省掉了，频率越高省得越多。
      - card:
          title: 串联谐振槽路
          body: |
            电感 $L$、电容 $C$ 和负载电阻 $R$ 串联，在 $f_0 = \frac{1}{2\pi\sqrt{LC}}$ 时 $L$ 和 $C$ 的电抗相互抵消，阻抗最小、等于 $R$，$f_0$ 叫**谐振频率（resonant frequency）**。$Z_0 = \sqrt{L/C}$ 叫特性阻抗，$Q = Z_0/R$ 叫品质因数；$Q$ 越大，电流随频率变化的峰越尖。

            用方波驱动这个槽路时，它只让接近 $f_0$ 的基波电流通过，电流近似是正弦。改变开关频率就改变了槽路的阻抗，从而调节输出功率。
      - item:
          id: resonant-frequency
          type: number
          prompt: 串联谐振槽路 $L = 100$ μH，$C = 25.3$ nF。谐振频率约是多少千赫？（保留到个位）
          answer: 100
          tolerance: 0.5
          unit: kHz
          hint: $f_0 = 1/(2\pi\sqrt{LC})$。
          explain: $\sqrt{LC} = \sqrt{100 \times 10^{-6} \times 25.3 \times 10^{-9}} \approx 1.591 \times 10^{-6}$ s，$f_0 \approx 100.1$ kHz。
      - item:
          id: quality-factor
          type: number
          prompt: 串联谐振槽路 $L = 100$ μH，$C = 25.3$ nF，负载电阻 10 Ω。品质因数 $Q$ 约是多少？（保留两位小数）
          answer: 6.29
          tolerance: 0.005
          hint: 先算特性阻抗 $Z_0 = \sqrt{L/C}$。
          explain: $Z_0 = \sqrt{100 \times 10^{-6}/(25.3 \times 10^{-9})} \approx 62.9$ Ω，$Q = 62.9/10 \approx 6.29$。
      - card:
          title: 谐振变换器怎样实现软开关
          body: |
            半桥驱动串联谐振槽路。开关频率高于 $f_0$ 时槽路呈电感性，电流滞后电压：一个开关关断的时刻电流还在原方向流，它给要开通的那个开关的输出电容放电，那个开关两端电压先降到 0，于是实现 ZVS 开通。

            开关频率低于 $f_0$ 时槽路呈电容性，电流超前，开关可以在电流过零后关断（ZCS），但开通是硬的，还会碰上二极管的反向恢复。所以用 MOSFET 的谐振变换器一般工作在谐振频率以上。
      - item:
          id: above-resonance
          type: choice
          prompt: 一个用 MOSFET 半桥驱动的串联谐振变换器，要让开关管实现零电压开通，开关频率应该怎样选？
          options:
            - text: 高于谐振频率，让槽路呈电感性
              correct: true
            - text: 低于谐振频率，让槽路呈电容性
              why: 电容性时电流超前，开通时电流已经反向，要开通的管子的输出电容没被放电，是硬开通
            - text: 正好等于谐振频率
              why: 恰好在谐振点时电流和电压同相，开关时刻电流接近 0，没有电流去给输出电容放电
            - text: 和频率无关，只要占空比是 50%
              why: 能否 ZVS 取决于开关时刻电流的方向，而这由频率相对于谐振频率的位置决定
          explain: 电感性的槽路电流滞后，开关切换的时刻电流仍在流，正好把下一个开关的电压抽到 0。
      - card:
          title: 谐振 DC/DC 和其他软开关电路
          body: |
            谐振 DC/DC 变换器先用半桥或全桥把直流变成方波，经谐振槽路和变压器，再整流成直流，靠改变开关频率而不是占空比调节输出。串联谐振变换器轻载时要把频率提得很高；LLC 变换器把变压器自身的电感也作为槽路的一部分，在很宽的负载范围内保持 ZVS，服务器电源和电视电源常用它。

            另一类软开关保留 PWM 的工作方式，只在开关前后用辅助谐振：移相全桥让两个桥臂错开一个相位，靠变压器漏感的能量实现 ZVS；零电压转换电路和谐振直流环也是这个思路。
      - item:
          id: resonant-control
          type: choice
          prompt: LLC 谐振变换器主要靠改变什么来调节输出电压？
          options:
            - text: 开关频率
              correct: true
            - text: 占空比
              why: LLC 的两个开关通常各导通接近 50%，调节靠频率改变槽路的增益
            - text: 变压器的匝数比
              why: 匝数比是设计时定下的，工作中不能改变
            - text: 输入直流电压
              why: 输入电压由前级决定，变换器要在它变化时仍稳住输出
          explain: 谐振槽路的增益随频率变化，所以谐振变换器用频率作控制量，PWM 变换器才用占空比。

  # ==== 变换器建模与控制 ====
  - id: averaged-models
    chapter: 变换器建模与控制
    title: 平均模型
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个开关频率 200 kHz 的电源，设计它的电压控制环时只关心几千赫以下的变化。需要逐个开关周期算出电感电流的三角波吗？
          options:
            - text: 不需要，用每个开关周期里的平均值就够了
              correct: true
            - text: 需要，否则控制环会算错
              why: 几千赫的变化跨越几十个开关周期，周期内的三角波对它的影响可以平均掉
            - text: 不需要，直接把电源当成一个固定的电压
              why: 输出会随占空比、输入电压和负载变化，必须描述这些变化
          explain: 我们关心的变化比开关周期慢得多，对一个周期取平均，把纹波抹掉，模型就简单得多。
      - card:
          title: 变换器的动态行为
          body: |
            负载电流突然变大时，输出电容先放电，输出电压跌落，LC 滤波器开始振荡；控制器要调整占空比把电压拉回来。设计控制器需要一个动态模型，描述电感电流、电容电压怎样随占空比、输入电压和负载变化。

            完整的模型是两套电路方程每个周期轮流切换，太细了。我们关心的变化比开关周期慢得多，所以对一个开关周期取平均，把纹波抹掉，只留下平均值的变化，这叫**平均模型（averaged model）**。
      - card:
          title: 微分方程和状态变量
          body: |
            含有未知量的导数的方程叫**微分方程（differential equation）**。Buck 变换器在开关导通时，电感和电容满足

            $$L\frac{di_L}{dt} = V_{in} - v_C,\qquad C\frac{dv_C}{dt} = i_L - \frac{v_C}{R}$$

            关断时第一个方程变为 $L\frac{di_L}{dt} = -v_C$。电感电流和电容电压决定了电路以后怎样变化，叫**状态变量（state variable）**：知道它们现在的值和以后的输入，就能算出以后的一切。
      - item:
          id: state-count
          type: number
          prompt: Cuk 变换器有两个电感和两个电容。描述它的动态，需要几个状态变量？
          answer: 4
          hint: 每个储能元件贡献一个状态变量。
          explain: 每个电感的电流、每个电容的电压各一个，共 4 个。Buck、Boost 各有 2 个。
      - card:
          title: 状态空间平均
          body: |
            对一个开关周期取平均：导通时的方程乘 $D$，关断时的方程乘 $1 - D$，相加。Buck 得到

            $$L\frac{d\bar i_L}{dt} = DV_{in} - \bar v_C,\qquad C\frac{d\bar v_C}{dt} = \bar i_L - \frac{\bar v_C}{R}$$

            写成矩阵形式是 $\dot x = [DA_1 + (1 - D)A_2]x + [DB_1 + (1 - D)B_2]u$，$A_1$、$B_1$ 和 $A_2$、$B_2$ 分别属于两个开关状态。这叫**状态空间平均（state-space averaging）**，前提是开关频率远高于 LC 的谐振频率、纹波很小。
      - item:
          id: averaged-steady-state
          type: number
          prompt: 一个 Buck 变换器的平均模型是 $L\frac{d\bar i_L}{dt} = DV_{in} - \bar v_C$、$C\frac{d\bar v_C}{dt} = \bar i_L - \bar v_C/R$。$V_{in} = 12$ V，$D = 0.4$，$R = 2$ Ω。稳态时电感电流的平均值是多少安？
          answer: 2.4
          unit: A
          hint: 稳态时导数都为 0。
          explain: 第一式给出 $\bar v_C = DV_{in} = 4.8$ V，第二式给出 $\bar i_L = \bar v_C/R = 2.4$ A。
      - card:
          title: 平均电路模型
          body: |
            也可以直接在电路图上取平均：把开关和二极管组成的开关单元换成两个受控源。开关节点电压的平均值是 $DV_{in}$，用一个受控电压源代替；输入电流的平均值是 $D\bar i_L$，用一个受控电流源代替。

            两者合起来像一个变比为 $1:D$ 的“直流变压器”。平均电路可以直接用电路分析的方法求解，也能放进电路仿真软件里跑，比逐个周期仿真快得多。这叫平均电路模型。
      - item:
          id: averaged-input-current
          type: number
          prompt: 一个 Buck 变换器输入 12 V，占空比 0.4，电感电流平均值 3 A。按平均电路模型，输入电流的平均值是多少安？
          answer: 1.2
          unit: A
          hint: 受控电流源的电流是 $D\bar i_L$。
          explain: $0.4 \times 3 = 1.2$ A。功率核对：输入 $12 \times 1.2 = 14.4$ W，输出 $4.8 \times 3 = 14.4$ W，平均模型里理想开关不消耗功率。
      - item:
          id: boost-averaged
          type: choice
          prompt: Boost 变换器开关导通时 $L\frac{di_L}{dt} = V_{in}$，关断时 $L\frac{di_L}{dt} = V_{in} - v_C$。状态空间平均后电感的方程是哪一个？
          options:
            - text: $L\frac{d\bar i_L}{dt} = V_{in} - (1 - D)\bar v_C$
              correct: true
            - text: $L\frac{d\bar i_L}{dt} = DV_{in} - \bar v_C$
              why: 这是 Buck 的电感方程
            - text: $L\frac{d\bar i_L}{dt} = V_{in} - D\bar v_C$
              why: $v_C$ 只在关断时出现在电感两端，权重应是关断时间的比例 $1 - D$
            - text: $L\frac{d\bar i_L}{dt} = (1 - D)V_{in} - \bar v_C$
              why: $V_{in}$ 在两个状态里都加在电感上，权重是 $D + (1 - D) = 1$
          explain: $D \cdot V_{in} + (1 - D)(V_{in} - v_C) = V_{in} - (1 - D)v_C$。令导数为 0 就得到 $V_o = V_{in}/(1 - D)$。
  - id: linearization
    chapter: 变换器建模与控制
    title: 线性化和传递函数
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个 Buck 变换器，让占空比做一个很小的正弦变化，从低频往高频扫。输出电压变化的幅度在 LC 谐振频率附近会怎样？
          options:
            - text: 出现一个峰，过了谐振频率后迅速下降
              correct: true
            - text: 一直不变，和频率无关
              why: LC 滤波器对不同频率的衰减不同，输出幅度随频率变化
            - text: 在谐振频率附近降到 0
              why: 串联 L、并联 C 的低通滤波器在谐振处有一个峰，而不是一个谷
          explain: LC 低通滤波器在谐振频率附近有一个峰，之后每十倍频下降 40 dB。这个峰和随之而来的相位急转是电压环设计的主要难点。
      - card:
          title: 小信号线性化
          body: |
            平均模型里常有两个变化量相乘的项，比如 Boost 的 $(1 - d)v$，方程是非线性的。设计控制器只关心稳态附近的小变化。变换器稳态时各量的平均值（$D$、$V$、$I$）叫**工作点（operating point）**；令 $d = D + \hat d$、$v = V + \hat v$，大写是工作点，带帽的是小的变化量。展开后略去两个小量的乘积 $\hat d\hat v$，剩下的方程就是线性的：

            $$(1 - d)v \approx (1 - D)V + (1 - D)\hat v - V\hat d$$

            这叫**小信号线性化（small-signal linearization）**。$V_{in}$ 不变时 Buck 的方程本来就对 $d$ 线性，不需要这一步。
      - item:
          id: boost-linearize
          type: number
          prompt: Boost 变换器 $V_o = V_{in}/(1 - D)$，$V_{in} = 12$ V，工作点 $D = 0.5$。用线性化估算：占空比从 0.50 增加到 0.51，稳态输出电压增加约多少伏？
          answer: 0.48
          tolerance: 0.005
          unit: V
          hint: 对 $D$ 求导，$\frac{dV_o}{dD} = \frac{V_{in}}{(1 - D)^2}$，再乘 $\Delta D$。
          explain: $\frac{dV_o}{dD} = 12/0.25 = 48$ V，乘 0.01 得 0.48 V。精确值 $12/0.49 - 24 \approx 0.49$ V，变化小时线性化很准。
      - card:
          title: 传递函数和极点
          body: |
            线性电路对正弦输入的稳态响应仍是同频率的正弦，只是幅值和相位变了。把微分方程里的 $\frac{d}{dt}$ 换成复数 $s$（正弦稳态时 $s = j2\pi f$），方程变成代数式，输出和输入之比叫**传递函数（transfer function）**。Buck 平均方程的变化部分是 $Ls\hat i_L = V_{in}\hat d - \hat v$、$Cs\hat v = \hat i_L - \hat v/R$；由第二式 $\hat i_L = (Cs + 1/R)\hat v$，代入第一式消去 $\hat i_L$，得占空比到输出电压的传递函数

            $$G_{vd}(s) = \frac{\hat v}{\hat d} = \frac{V_{in}}{LCs^2 + \frac{L}{R}s + 1}$$

            让分母为 0 的 $s$ 叫**极点（pole）**，让分子为 0 的叫零点；极点都在复平面的左半边，系统才稳定。
      - item:
          id: lc-pole
          type: number
          prompt: Buck 变换器的输出电感 22 μH、输出电容 100 μF。LC 双极点的频率约是多少千赫？（保留两位小数）
          answer: 3.39
          tolerance: 0.005
          unit: kHz
          hint: $f_0 = 1/(2\pi\sqrt{LC})$。
          explain: $\sqrt{LC} = \sqrt{22 \times 10^{-6} \times 100 \times 10^{-6}} \approx 4.69 \times 10^{-5}$ s，$f_0 \approx 3.39$ kHz。
      - card:
          title: LC 双极点和 Q
          body: |
            $G_{vd}$ 的分母是二阶的，两个极点在 $f_0 = \frac{1}{2\pi\sqrt{LC}}$。频率远低于 $f_0$ 时增益是 $V_{in}$；在 $f_0$ 处幅值是低频的 $Q$ 倍，$Q = R\sqrt{C/L}$（把分母和标准二阶式 $1 + \frac{s}{Q\omega_0} + \frac{s^2}{\omega_0^2}$ 对照得到，$\omega_0 = 1/\sqrt{LC}$），负载越轻 $Q$ 越大，峰越尖；高于 $f_0$ 后幅值每十倍频下降 40 dB，相位在 $f_0$ 附近迅速落后，最终落后 180°。

            这个相位急转让电压环很难做稳定，补偿器要在 $f_0$ 附近把相位补回来。
      - item:
          id: lc-q
          type: number
          prompt: Buck 变换器 $L = 22$ μH，$C = 100$ μF，负载电阻 5 Ω。占空比到输出电压的传递函数在谐振处的 $Q$ 约是多少？（保留一位小数）
          answer: 10.7
          tolerance: 0.05
          hint: $Q$ 和负载电阻、$L$、$C$ 是什么关系？
          explain: $\sqrt{100/22} \approx 2.132$，$Q \approx 10.7$，谐振峰比低频增益高约 20.6 dB。
      - card:
          title: Boost 的右半平面零点
          body: |
            Boost 的 $G_{vd}$ 还有一个分子上的零点，它在复平面的右半边，$\omega_z = \frac{R(1 - D)^2}{L}$。它的物理意义：占空比突然增大，开关导通时间变长，电感向输出送电的时间反而变短，输出电压先下降；过一会儿电感电流增大了，输出才上升。

            这种先反向、再正向的响应给相位再添 90° 的滞后，限制了 Boost 和 Buck-Boost 电压环的带宽，环路的响应频率通常要低于这个零点频率的几分之一。
      - item:
          id: rhp-zero
          type: number
          prompt: Boost 变换器负载电阻 10 Ω，占空比 0.5，电感 50 μH。右半平面零点的频率约是多少千赫？（保留两位小数）
          answer: 7.96
          tolerance: 0.005
          unit: kHz
          hint: 零点的角频率是多少？换成频率要除以什么？
          explain: $\omega_z = 10 \times 0.25/(50 \times 10^{-6}) = 50000$ rad/s，$f_z \approx 7.96$ kHz。
      - card:
          title: 采样数据模型
          body: |
            平均模型在开关频率的几分之一以下才准。要分析接近开关频率的现象（例如峰值电流控制的次谐波振荡），或者设计数字控制器时，用采样数据模型：只看每个开关周期开始时刻的状态 $x[k]$，写出

            $$x[k + 1] = \Phi x[k] + \Gamma u[k]$$

            $\Phi$、$\Gamma$ 由一个周期里各段电路方程的解拼起来。它逐周期精确，代价是推导更复杂。
      - item:
          id: sampled-data-when
          type: choice
          prompt: 下面哪种情况最需要用采样数据模型，而不是平均模型？
          options:
            - text: 分析每两个开关周期重复一次的次谐波振荡
              correct: true
            - text: 求 Buck 变换器的稳态输出电压
              why: 稳态平均值用伏秒平衡或平均模型就能求出
            - text: 估算 LC 双极点的频率
              why: LC 双极点远低于开关频率，平均模型给出的结果很准
            - text: 设计一个穿越频率为开关频率二十分之一的电压环
              why: 这么低的频率平均模型完全够用
          explain: 次谐波振荡的频率是开关频率的一半，平均模型把周期内的细节抹掉了，看不到它。
  - id: converter-control
    chapter: 变换器建模与控制
    title: 闭环控制设计
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个开关频率 200 kHz 的 Buck 电源，它的电压控制环是不是做得越快越好，快到连 200 kHz 的变化都能跟上？
          options:
            - text: 不是，控制环要比开关频率慢得多
              correct: true
            - text: 是，越快输出越稳
              why: 每个开关周期只能调一次占空比，比这更快的变化控制器来不及跟；平均模型在开关频率附近也不再成立
            - text: 是，只要把补偿器的增益调得足够大
              why: 增益大不等于快；接近开关频率时环路的相位已经乱了，增益越大越容易振荡
          explain: 电压环的响应速度通常只取到开关频率的十分之一到五分之一。这一课讲为什么，以及怎样补偿。
      - card:
          title: 反馈控制的结构
          body: |
            闭环稳压的结构：分压电阻测出输出电压，和基准比较得到误差；补偿器放大误差、整形频率特性，输出控制电压 $v_c$；PWM 调制器把 $v_c$ 和幅值为 $V_M$ 的锯齿波比较得到占空比 $d = v_c/V_M$；变换器再把占空比变成输出电压。环路增益

            $$T(s) = G_c(s)\cdot\frac{1}{V_M}\cdot G_{vd}(s)\cdot H$$

            $H$ 是分压比。和放大器的负反馈一样，环路增益越大，输出越不受输入电压和负载变化的影响；相位裕度决定稳不稳定。
      - item:
          id: modulator-gain
          type: number
          prompt: 一个 Buck 变换器输入 12 V，PWM 调制器的锯齿波幅值 $V_M = 2$ V。从控制电压到输出电压的低频增益是多少分贝？（保留一位小数）
          answer: 15.6
          tolerance: 0.05
          unit: dB
          hint: 低频时占空比变化 1，输出电压变化多少？控制电压变化 1，占空比变化多少？
          explain: $12/2 = 6$ 倍，$20\lg6 \approx 15.6$ dB。
      - card:
          title: 穿越频率和补偿器
          body: |
            环路增益大小降到 1 的频率叫**穿越频率（crossover frequency）**$f_c$，它大致决定了闭环的响应速度。平均模型只在远低于开关频率时准确，所以 $f_c$ 一般取开关频率的 $\frac{1}{10}$ 到 $\frac15$，同时在 $f_c$ 处留出 45° 以上的相位裕度。

            Buck 的 LC 双极点让相位落后 180°，只用积分器做不稳；常用 III 型补偿器（一个积分、两个零点、两个高频极点），在 $f_0$ 附近用两个零点把相位拉回来。Boost 还要让 $f_c$ 远低于右半平面零点。
      - item:
          id: crossover-limit
          type: number
          prompt: 一个开关频率 300 kHz 的变换器，按常用的经验，电压环的穿越频率最高取多少千赫？
          answer: 60
          unit: kHz
          hint: 常用范围是开关频率的 $\frac{1}{10}$ 到 $\frac15$。
          explain: $300/5 = 60$ kHz，下限 30 kHz。再往上，平均模型就不准了。
      - card:
          title: 多环控制
          body: |
            多环控制在电压环里面再套一个电感电流环：电压环的输出不直接给占空比，而是给电流环一个电流参考值，电流环快速让电感电流跟上它。电流环把电感变成了一个受控电流源，电压环面对的对象从二阶降到一阶左右，更容易补偿，还能直接限流。

            峰值电流控制是常见的一种：每个周期开关导通后，电感电流一升到参考值就关断。占空比大于 0.5 时它会出现每两个周期重复一次的次谐波振荡，要在参考值上叠加一个斜坡，叫斜坡补偿。
      - item:
          id: slope-compensation
          type: choice
          prompt: 峰值电流控制的 Buck 变换器，什么情况下必须加斜坡补偿？
          options:
            - text: 占空比大于 0.5 时
              correct: true
            - text: 负载很轻、进入断续导通时
              why: 断续时每个周期电感电流都从 0 开始，扰动不会传到下一个周期，不会出现次谐波振荡
            - text: 开关频率高于 100 kHz 时
              why: 是否振荡由占空比决定，和开关频率本身无关
            - text: 输入电压很高时
              why: 输入电压高时 Buck 的占空比反而小，更不容易振荡
          explain: 占空比大于 0.5 时电感电流下降斜率比上升斜率大，一个小扰动每个周期被放大并翻号，形成次谐波振荡。叠加的斜坡使扰动逐周期衰减。
      - card:
          title: 数字控制
          body: |
            数字控制器用 ADC 采样，在微控制器里算出占空比，下一个周期才更新 PWM。采样、计算和 PWM 的保持合起来，常相当于约 1.5 个开关周期的延迟，在穿越频率处带来 $360° \times f_c \times 1.5T_s$ 的相位滞后。

            PWM 计数器的时钟频率有限，占空比只能取离散的值，最小步长是时钟周期除以开关周期；步长太粗，输出会在两个值之间来回跳。
      - item:
          id: digital-delay
          type: number
          prompt: 一个数字控制的变换器开关频率 100 kHz，总延迟按 1.5 个开关周期计，穿越频率 10 kHz。这个延迟在穿越频率处造成多少度的相位滞后？
          answer: 54
          unit: °
          hint: 延迟占穿越频率一个周期的几分之一？一个周期是 360°。
          explain: $t_d = 1.5 \times 10\ \mu\text{s} = 15$ μs，$360° \times 10^4 \times 15 \times 10^{-6} = 54°$。相位裕度要扣掉这么多，所以数字控制的穿越频率常取得更保守。
      - item:
          id: dpwm-resolution
          type: number
          prompt: 一个数字控制的 Buck 变换器输入 12 V，开关频率 200 kHz，PWM 计数器时钟 100 MHz。输出电压能调节的最小步长约是多少毫伏？
          answer: 24
          unit: mV
          hint: 一个开关周期里有多少个时钟周期？占空比的最小步长乘 $V_{in}$。
          explain: 每周期 $100\ \text{MHz}/200\ \text{kHz} = 500$ 个时钟，占空比步长 $1/500$，输出步长 $12/500 = 0.024$ V。

  # ==== 磁性元件设计 ====
  - id: magnetics-basics
    chapter: 磁性元件设计
    title: 磁路和电感
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 同一个线圈，一次是空心的，一次绕在铁氧体磁芯上。哪种情况电感大？
          options:
            - text: 绕在磁芯上的，大很多倍
              correct: true
            - text: 一样大，电感只由匝数决定
              why: 电感还取决于磁通走的路好不好走，磁芯让同样的电流产生多得多的磁通
            - text: 空心的大，磁芯会挡住磁场
              why: 铁氧体是磁性材料，它增强磁场而不是挡住磁场
          explain: 铁氧体的相对磁导率有几千，给磁通提供了一条容易走的路。这一课从磁场的几个量讲起，推出电感的公式。
      - card:
          title: 磁场的几个量
          body: |
            绕在磁芯上的 $N$ 匝线圈通电流 $i$，沿磁芯走一圈（平均路程 $l$）的**磁场强度（magnetic field intensity）**$H$ 满足安培环路定理 $Hl = Ni$，单位 A/m。它在材料里产生**磁感应强度（magnetic flux density）**$B = \mu H$，单位特斯拉（T）。$\mu = \mu_r\mu_0$ 叫**磁导率（permeability）**，$\mu_0 = 4\pi \times 10^{-7}$ H/m，铁氧体的相对磁导率 $\mu_r$ 有几千。$B$ 乘截面积 $A$ 是**磁通（magnetic flux）**$\Phi = BA$，单位韦伯（Wb）。
      - card:
          title: 法拉第定律和磁阻
          body: |
            磁通变化时线圈两端产生电压 $v = N\frac{d\Phi}{dt}$，这是法拉第电磁感应定律，电感和变压器都靠它工作。

            由 $Hl = Ni$、$B = \mu H$、$\Phi = BA$ 得 $\Phi = \frac{Ni}{l/(\mu A)}$。$Ni$ 像电压，$\Phi$ 像电流，$\mathcal R = \frac{l}{\mu A}$ 像电阻，叫**磁阻（reluctance）**。代入法拉第定律，$v = \frac{N^2}{\mathcal R}\frac{di}{dt}$，所以电感 $L = \frac{N^2}{\mathcal R}$。
      - item:
          id: core-inductance
          type: number
          prompt: 一个磁芯的平均磁路长 50 mm，截面积 50 mm²，相对磁导率 2000，绕 20 匝。电感约是多少毫亨？（保留两位小数）
          answer: 1.01
          tolerance: 0.005
          unit: mH
          hint: 先算磁阻 $l/(\mu_r\mu_0A)$，长度和面积都换成米。
          explain: $\mathcal R = 0.05/(2000 \times 4\pi \times 10^{-7} \times 50 \times 10^{-6}) \approx 3.98 \times 10^5$ A/Wb，$L = 400/\mathcal R \approx 1.01$ mH。
      - card:
          title: 电感系数
          body: |
            磁芯厂家把 $1/\mathcal R$ 直接印在规格书上，叫**电感系数（inductance factor）**$A_L$，单位 nH/匝²，于是 $L = N^2A_L$。已知要的电感，匝数就是 $N = \sqrt{L/A_L}$，再取整。

            开了气隙的磁芯 $A_L$ 小得多，同样的电感要绕更多匝。
      - item:
          id: turns-from-al
          type: number
          prompt: 用 $A_L = 100$ nH/匝² 的磁芯绕一个 22 μH 的电感，应绕多少匝？（四舍五入到整匝）
          answer: 15
          hint: $N = \sqrt{L/A_L}$，注意单位统一。
          explain: $N = \sqrt{22000/100} \approx 14.8$，取 15 匝，电感 $225 \times 100$ nH $= 22.5$ μH。
      - card:
          title: 饱和、磁滞和剩磁
          body: |
            铁磁材料的 $B$ 不能无限增大：$H$ 加到一定程度后 $B$–$H$ 曲线变平，叫**磁饱和（magnetic saturation）**，此后磁导率急剧下降，电感几乎消失，电流会猛增。$H$ 减小时 $B$ 不沿原路返回，曲线围成一个回环，叫**磁滞（hysteresis）**；$H$ 回到 0 时还剩下的 $B$ 叫剩磁。

            由法拉第定律，加在绕组上的伏秒决定了磁感应强度变化多少：$\Delta B = \frac{Vt}{NA}$。所以变压器必须伏秒平衡，否则 $B$ 一个周期比一个周期高，最终饱和。
      - item:
          id: volt-second-flux
          type: number
          prompt: 一个变压器一次绕组 10 匝，磁芯截面积 50 mm²。开关导通时绕组上加 48 V，持续 4 μs。这段时间里磁感应强度变化多少特斯拉？（保留三位小数）
          answer: 0.384
          tolerance: 0.0005
          unit: T
          hint: $\Delta B = Vt/(NA)$，面积换成平方米。
          explain: $\Delta B = 48 \times 4 \times 10^{-6}/(10 \times 50 \times 10^{-6}) = 0.384$ T。铁氧体在 100 °C 时饱和磁感应强度约 0.3–0.4 T，从剩磁附近出发这样一摆就可能饱和，要加匝数或换大磁芯。
      - card:
          title: 磁性材料
          body: |
            - 硅钢片：饱和磁感应强度高（约 1.5–2 T），电阻率低、涡流大，叠成薄片用在 50/60 Hz 的变压器和电机；
            - 铁氧体：饱和磁感应强度较低（约 0.3–0.5 T，温度越高越低），电阻率极高、涡流很小，用在几十千赫到几兆赫的开关电源；
            - 铁粉芯、铁硅铝等粉末磁芯：颗粒之间互相绝缘，相当于把气隙分散在整个磁芯里，饱和磁感应强度约 0.7–1.5 T，适合带直流电流的电感；
            - 铁基非晶和纳米晶带材：约 1.2–1.6 T、损耗低，用在中频变压器和共模电感。
      - item:
          id: material-match
          type: match
          prompt: 把每种用途和最合适的磁芯材料配对。
          pairs:
            - [50 Hz 配电变压器, 硅钢片]
            - [100 kHz 反激变压器, 铁氧体]
            - [带大直流电流的 Boost 储能电感, 铁硅铝粉末磁芯]
          explain: 工频要高饱和磁感应强度、频率低涡流不大，用硅钢；高频要电阻率高、损耗低，用铁氧体；带直流电流的储能电感要分布气隙、不易饱和，用粉末磁芯。
  - id: transformers-losses
    chapter: 磁性元件设计
    title: 变压器模型和磁性元件的损耗
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一根直径 2 mm 的铜导线通 1 MHz 的电流，你猜电流在导线截面上怎样分布？
          options:
            - text: 挤在导线表面很薄的一层里
              correct: true
            - text: 均匀分布在整个截面上
              why: 直流时是均匀的；高频时导线内部感应出的涡流把电流挤向表面
            - text: 集中在导线中心
              why: 恰好相反，中心的电流被涡流抵消得最多
          explain: 这叫趋肤效应。1 MHz 时电流主要流在铜导线表面约 0.07 mm 厚的一层里，导线中心几乎不载流。
      - card:
          title: 变压器的模型
          body: |
            两个绕组绕在同一个磁芯上。同一个磁通穿过两个绕组，由法拉第定律 $\frac{v_1}{v_2} = \frac{N_1}{N_2}$；理想变压器里两个绕组的安匝数互相抵消，$N_1i_1 = N_2i_2$。

            实际变压器有两处不理想：磁芯磁导率有限，要一点电流来建立磁通，等效为并在一次侧的**励磁电感（magnetizing inductance）**$L_m$；有一部分磁通只穿过一个绕组，等效为串在绕组里的漏感。反激变换器靠励磁电感储能，正激的复位绕组复位的也是它；漏感造成关断时的电压尖峰。
      - item:
          id: magnetizing-current
          type: number
          prompt: 一个正激变换器的变压器励磁电感 1 mH，开关导通时一次绕组加 48 V，持续 4 μs。导通结束时励磁电流约是多少安？（保留三位小数）
          answer: 0.192
          tolerance: 0.0005
          unit: A
          hint: 电感两端加恒定电压时，电流怎样随时间变化？
          explain: $\Delta i = 48 \times 4 \times 10^{-6}/10^{-3} = 0.192$ A。这部分电流不传给负载，关断后要靠复位绕组送回电源。
      - card:
          title: 绕组损耗和趋肤效应
          body: |
            绕组的直流损耗是 $I_{rms}^2R$。频率高时，交变电流在导线内部感应出涡流，把电流挤向表面，叫趋肤效应。电流密度从表面向里按指数衰减，衰减到表面值 $1/e$ 的深度叫**趋肤深度（skin depth）**：

            $$\delta = \sqrt{\frac{\rho}{\pi f\mu_0}}$$

            铜在 20 °C 时 $\rho = 1.72 \times 10^{-8}$ Ω·m，100 kHz 下 $\delta \approx 0.21$ mm。比 $2\delta$ 粗的导线，中心部分基本不载流。多层绕组里相邻导线的磁场还会互相挤压电流（邻近效应），所以高频绕组用多股细线绞成的利兹线或薄铜箔。
      - item:
          id: skin-depth
          type: number
          prompt: 铜（$\rho = 1.72 \times 10^{-8}$ Ω·m）在 1 MHz 下的趋肤深度约是多少毫米？（保留三位小数）
          answer: 0.066
          tolerance: 0.0005
          unit: mm
          hint: $\delta = \sqrt{\rho/(\pi f\mu_0)}$，$\mu_0 = 4\pi \times 10^{-7}$ H/m。
          explain: $\delta = \sqrt{1.72 \times 10^{-8}/(\pi \times 10^6 \times 4\pi \times 10^{-7})} \approx 6.6 \times 10^{-5}$ m，约 0.066 mm。频率提高 10 倍，趋肤深度变为 $1/\sqrt{10}$。
      - item:
          id: winding-dc-loss
          type: number
          prompt: 一个电感绕组的直流电阻 20 mΩ，电流有效值 5 A，频率低到可以不计趋肤效应。绕组损耗是多少瓦？
          answer: 0.5
          unit: W
          hint: 用有效值算 $I^2R$。
          explain: $25 \times 0.02 = 0.5$ W。频率高时交流电阻会比直流电阻大，损耗也随之增大。
      - card:
          title: 铁芯损耗
          body: |
            磁芯在交变磁场里有两种损耗：磁滞损耗，每磁化一个来回消耗回线面积那么多的能量，和频率成正比；涡流损耗，和频率的平方成正比。开关电源设计里常用经验的 Steinmetz 公式

            $$P_v = kf^\alpha B^\beta$$

            $P_v$ 是单位体积的损耗，$B$ 是磁感应强度变化幅度的一半，$k$、$\alpha$、$\beta$ 由厂家的损耗曲线拟合，铁氧体的 $\alpha$ 常在 1–2、$\beta$ 在 2–3 之间。$\beta > 2$ 意味着降低工作磁感应强度能大大减小铁芯损耗。
      - item:
          id: steinmetz
          type: number
          prompt: 一种铁氧体的 Steinmetz 指数 $\alpha = 1.5$、$\beta = 2.5$。开关频率加倍、同时磁感应强度幅度减半，单位体积的铁芯损耗变为原来的几倍？
          answer: 0.5
          hint: 损耗按 $f^\alpha B^\beta$ 变化，分别乘 $2^{1.5}$ 和 $(1/2)^{2.5}$。
          explain: $2^{1.5} \times 2^{-2.5} = 2^{-1} = 0.5$。频率加倍时匝数不变、伏秒减半，$B$ 正好减半，所以提高频率反而可能降低铁芯损耗。
  - id: magnetics-design
    chapter: 磁性元件设计
    title: 电感和变压器的设计
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 开关电源里的储能电感，磁芯上常常故意开一个小气隙。主要是为了什么？
          options:
            - text: 让磁芯在大电流下不饱和，能储存更多能量
              correct: true
            - text: 增大电感
              why: 气隙增大磁阻，电感反而变小
            - text: 帮助散热
              why: 气隙很窄，对散热几乎没有作用
          explain: 能量几乎全存在气隙里。开气隙牺牲一些电感，换来在大电流下不饱和。
      - card:
          title: 滤波电感的两个约束
          body: |
            设计电感 $L$，峰值电流 $I_{pk}$、有效值 $I_{rms}$，有两个约束。一是不饱和：由 $N\Phi = LI$，峰值磁感应强度 $B_{pk} = \frac{LI_{pk}}{NA_e}$ 不能超过允许值 $B_{max}$，$A_e$ 是磁芯截面积。二是绕得下：$N$ 匝导线按电流密度 $J$ 选截面，总铜面积 $\frac{NI_{rms}}{J}$ 要放进窗口面积 $A_w$ 的一部分 $k_u$（填充系数，常取 0.3–0.5）。两式相乘消去 $N$：

            $$A_p = A_eA_w \ge \frac{LI_{pk}I_{rms}}{B_{max}Jk_u}$$

            $A_eA_w$ 叫**面积积（area product）**，只由磁芯尺寸决定，所以先按它选磁芯，再算匝数。
      - card:
          title: 例题：选磁芯、定匝数
          body: 电感 100 μH，峰值电流 10 A，有效值 9 A，允许 $B_{max} = 0.3$ T，电流密度 4 A/mm²，填充系数 0.4。求需要的面积积；选一个 $A_e = 1.2$ cm² 的磁芯后，至少绕多少匝？
          reveal:
            - title: 第 1 步：把单位统一成国际单位
              body: $J = 4\ \text{A/mm}^2 = 4 \times 10^6$ A/m²。
            - title: 第 2 步：求面积积
              body: $A_p \ge \frac{100 \times 10^{-6} \times 10 \times 9}{0.3 \times 4 \times 10^6 \times 0.4} = \frac{9 \times 10^{-3}}{4.8 \times 10^5} \approx 1.88 \times 10^{-8}$ m⁴，即 1.88 cm⁴（1 cm⁴ = $10^{-8}$ m⁴）。按目录选面积积大于它的磁芯。
            - title: 第 3 步：由不饱和条件求匝数
              body: $N \ge \frac{LI_{pk}}{B_{max}A_e} = \frac{100 \times 10^{-6} \times 10}{0.3 \times 1.2 \times 10^{-4}} \approx 27.8$，取 28 匝，再由 $A_L = L/N^2$ 定气隙。
      - item:
          id: area-product
          type: number
          prompt: 电感 47 μH，峰值电流 6 A，有效值 5 A，允许 $B_{max} = 0.25$ T，电流密度 5 A/mm²，填充系数 0.4。需要的面积积至少是多少 cm⁴？（保留三位小数）
          answer: 0.282
          tolerance: 0.0005
          unit: cm⁴
          hint: 电流密度换成 A/m²，结果从 m⁴ 换成 cm⁴ 要乘 $10^8$。
          explain: $A_p = \frac{47 \times 10^{-6} \times 6 \times 5}{0.25 \times 5 \times 10^6 \times 0.4} = \frac{1.41 \times 10^{-3}}{5 \times 10^5} = 2.82 \times 10^{-9}$ m⁴ $= 0.282$ cm⁴。
      - item:
          id: inductor-turns
          type: number
          prompt: 电感 68 μH，峰值电流 5 A，选用截面积 0.8 cm² 的磁芯，允许 $B_{max} = 0.3$ T。至少要绕多少匝才不饱和？（不足一匝按一匝算）
          answer: 15
          hint: 由 $N\Phi = LI$，峰值磁感应强度和匝数是什么关系？
          explain: $N \ge 68 \times 10^{-6} \times 5/(0.3 \times 0.8 \times 10^{-4}) \approx 14.2$，取 15 匝。匝数越多 $B$ 越低，但要绕得下。
      - card:
          title: 温升限制
          body: |
            电感的铜损和铁损最终变成热，从磁芯和绕组表面散到空气中。温升用热阻估算：$\Delta T = \theta P$，$\theta$ 由磁芯尺寸决定，尺寸越大、表面积越大，热阻越小。

            磁芯体积按尺寸的三次方增长，表面积只按平方增长，所以大磁芯单位体积允许的损耗更小。设计时往往不是饱和，而是温升（例如允许 40 °C）限制了电流密度和工作磁感应强度能取多大。
      - item:
          id: temperature-rise
          type: number
          prompt: 一个电感的铜损 1.2 W、铁损 0.8 W，磁芯的热阻 20 °C/W。温升约是多少摄氏度？
          answer: 40
          unit: °C
          hint: 总损耗乘热阻。
          explain: $\Delta T = 20 \times (1.2 + 0.8) = 40$ °C。环境 40 °C 时磁芯约 80 °C，还要核对它低于磁芯材料和绕组绝缘的允许温度。
      - card:
          title: 储能和气隙
          body: |
            电感储能 $W = \frac12LI^2$。磁场的能量密度是 $\frac{B^2}{2\mu}$：同样的 $B$，空气里的能量密度是磁芯里的 $\mu_r$ 倍。所以带直流电流的电感，能量几乎全部存在气隙里，最多能存 $W_{max} \approx \frac{B_{max}^2}{2\mu_0}V_{gap}$，$V_{gap}$ 是气隙的体积。

            不开气隙的高磁导率磁芯磁阻很小、电感大，但很小的电流就让它饱和，存不了多少能量。开气隙让磁阻增大、电感减小，换来在大电流下不饱和。
      - item:
          id: stored-energy
          type: number
          prompt: 一个 22 μH 的电感，峰值电流 3 A。峰值时储存多少微焦的能量？
          answer: 99
          unit: μJ
          hint: $W = \frac12LI^2$。
          explain: $\frac12 \times 22 \times 10^{-6} \times 9 = 99 \times 10^{-6}$ J。
      - item:
          id: gap-energy
          type: number
          prompt: 一个磁芯的气隙长 0.5 mm、截面积 50 mm²，允许 $B_{max} = 0.3$ T。气隙最多约能储存多少微焦？（保留到个位）
          answer: 895
          tolerance: 0.5
          unit: μJ
          hint: 先求气隙体积（换成 m³），再代入 $\frac{B^2}{2\mu_0}V_{gap}$。
          explain: $V_{gap} = 0.5 \times 50 = 25$ mm³ $= 2.5 \times 10^{-8}$ m³，$W = 0.09 \times 2.5 \times 10^{-8}/(2 \times 4\pi \times 10^{-7}) \approx 8.95 \times 10^{-4}$ J。
      - card:
          title: 变压器的面积积
          body: |
            变压器也有两个约束。一次绕组上的方波电压 $V$ 持续半个周期 $t = \frac{1}{2f}$，磁感应强度从 $-B_{max}$ 摆到 $+B_{max}$，变化 $2B_{max}$。由 $\Delta B = \frac{Vt}{NA_e}$，$2B_{max} = \frac{V}{2fN_1A_e}$，得 $N_1 = \frac{V}{4fB_{max}A_e}$；两个绕组的铜都要放进窗口。合起来，变压器需要的面积积和功率成正比、和频率成反比：

            $$A_p \approx \frac{P}{Kf B_{max}Jk_u}$$

            $K$ 是由波形和绕组结构决定的系数。频率提高一倍，同样功率的面积积可以减半，前提是铁芯损耗允许保持同样的 $B_{max}$。
      - item:
          id: transformer-turns
          type: number
          prompt: 一个全桥变换器的变压器一次绕组加 ±400 V 方波，频率 100 kHz，磁芯截面积 1 cm²，允许 $B_{max} = 0.1$ T。一次绕组要多少匝？
          answer: 100
          hint: 半个周期里磁感应强度要变化多少？由 $\Delta B = Vt/(NA)$ 解出 $N$。
          explain: $N_1 = 400/(4 \times 10^5 \times 0.1 \times 10^{-4}) = 100$ 匝。高频下铁氧体常把 $B_{max}$ 取得远低于饱和值，是为了限制铁芯损耗。
      - item:
          id: frequency-area-product
          type: choice
          prompt: 一个 1 kW 变压器的工作频率从 50 kHz 提高到 100 kHz，$B_{max}$、电流密度和填充系数都不变。需要的面积积怎样变化？
          options:
            - text: 减半
              correct: true
            - text: 不变，面积积只由功率决定
              why: 面积积和功率成正比、和频率成反比
            - text: 变成四分之一
              why: 面积积和频率的一次方成反比，不是平方
            - text: 加倍
              why: 频率越高，同样电压下所需的匝数和截面积越小，面积积变小
          explain: $A_p \propto \frac{P}{f}$，频率加倍，面积积减半。实际高频下铁芯损耗和趋肤效应会迫使 $B_{max}$ 和 $J$ 降低，缩小得没有这么多。
boss:
  items:
    - id: b-switching-loss
      type: number
      prompt: 一个 MOSFET 接在 300 V 直流电压上开关 15 A 的电感电流，开通和关断转换时间合计 80 ns，开关频率 100 kHz。按转换期间电压、电流线性变化估算开关损耗，是多少瓦？
      answer: 18
      unit: W
      hint: 一次开通或关断里，$v \cdot i$ 随时间的图形是什么形状？面积怎么算？
      explain: $\frac12 \times 300 \times 15 \times 80 \times 10^{-9} = 0.18$ mJ，乘 $10^5$，18 W。
    - id: b-conduction
      type: number
      prompt: 一个 MOSFET 的导通电阻 25 mΩ，在每个周期一半的时间里流过 8 A，其余时间关断。导通损耗是多少瓦？
      answer: 0.8
      unit: W
      hint: 电流只在一半时间里流，它的平方的平均值是多少？
      explain: $I_{rms}^2 = 64 \times 0.5 = 32$ A²，$P = 32 \times 0.025 = 0.8$ W。
    - id: b-device
      type: choice
      prompt: 一台 3.3 kV、几百千瓦的机车牵引逆变器，开关频率约 1 kHz。主开关最常用哪种器件？
      options:
        - text: IGBT
          correct: true
        - text: 硅 MOSFET
          why: 3.3 kV 级的硅 MOSFET 导通电阻很大，导通损耗无法接受
        - text: GaN 晶体管
          why: GaN 晶体管多在 650 V 以下，这个电压等级不适用
        - text: 晶闸管，因为它的耐压和电流都能做得最大
          why: 普通晶闸管不能用门极关断，而逆变器要在任意时刻关断电流；牵引逆变器过去用 GTO，现在用 IGBT
      explain: 高压、大电流、低频正是 IGBT 的强项：电导调制让它高压下导通压降低，低频下拖尾电流造成的开关损耗不大。
    - id: b-phase-control
      type: number
      prompt: 线电压 400 V 的三相全控桥接大电感负载，触发角 45°。输出平均电压约是多少伏？（保留到个位）
      answer: 382
      tolerance: 0.5
      unit: V
      hint: 三相桥不控时的平均值是多少？触发角让它乘上什么？
      explain: $1.35 \times 400 \times 0.707 \approx 382$ V。
    - id: b-power-factor
      type: number
      prompt: 一个整流器输入电流的基波滞后电压，位移因数 0.9，畸变因数 0.95。它的功率因数是多少？（保留三位小数）
      answer: 0.855
      tolerance: 0.0005
      hint: 功率因数是两个因数的乘积。
      explain: $0.9 \times 0.95 = 0.855$。
    - id: b-buck
      type: number
      prompt: Buck 变换器 48 V 降到 12 V，电感 10 μH，开关频率 500 kHz，电感电流连续。电感电流纹波的峰峰值是多少安？（保留一位小数）
      answer: 1.8
      tolerance: 0.05
      unit: A
      hint: 导通期间电感两端的电压是多少？持续多久？
      explain: $D = 0.25$，导通 0.5 μs，$\Delta I_L = 36 \times 0.5\ \mu\text{s}/10\ \mu\text{H} = 1.8$ A。
    - id: b-boost
      type: number
      prompt: Boost 变换器把 12 V 升到 48 V，电感电流连续。占空比是多少？
      answer: 0.75
      hint: 关断期间电感两端的电压是多少？用伏秒平衡列式。
      explain: $D = 1 - 12/48 = 0.75$。
    - id: b-dcm
      type: choice
      prompt: 一个开环工作的 Buck 变换器在轻载时进入了断续导通。下面哪一句是对的？
      options:
        - text: 输出电压高于 $DV_{in}$，并且随负载变化
          correct: true
        - text: 输出电压仍等于 $DV_{in}$
          why: $DV_{in}$ 是电感电流连续时由伏秒平衡推出的；断续时多了一段电流为 0 的时间，平衡关系变了
        - text: 输出电压低于 $DV_{in}$
          why: 断续时 $M = 2/(1 + \sqrt{1 + 4K/D^2})$ 大于 $D$
        - text: 电感电流会变成负值
          why: 二极管挡住了反向电流，电流在 0 处停住
      explain: 断续导通时电压比 $M$ 和负载有关，负载越轻越接近 1，所以断续工作必须闭环。
    - id: b-dc-link
      type: number
      prompt: 一台单相逆变器输出 2.5 kW，功率因数 1，输出 60 Hz，直流母线 400 V，允许电压纹波峰峰值 15 V。直流电容至少约多少微法？（保留到个位）
      answer: 1105
      tolerance: 1
      unit: μF
      hint: 功率脉动让电容储能在一个周期里摆动多少？这个能量变化和电压纹波是什么关系？
      explain: $C = 2500/(376.99 \times 400 \times 15) \approx 1.105 \times 10^{-3}$ F。
    - id: b-spwm
      type: number
      prompt: 一台三相逆变器直流电压 650 V，用正弦 PWM，调制比 0.9。输出线电压基波的有效值约是多少伏？（保留到个位）
      answer: 358
      tolerance: 0.5
      unit: V
      hint: 每个桥臂的基波幅值是多少？线电压是两相之差，幅值要乘几？
      explain: 幅值 $0.866 \times 0.9 \times 650 \approx 506.6$ V，有效值 $\approx 358$ V。
    - id: b-svpwm
      type: number
      prompt: 一台三相逆变器直流电压 800 V，用 SVPWM、不过调制。输出线电压基波的有效值最大约是多少伏？（保留到个位）
      answer: 566
      tolerance: 0.5
      unit: V
      hint: 不过调制时，逆变器最多能做出多大的线电压峰值？
      explain: $800/\sqrt2 \approx 566$ V，比 SPWM 的 $0.612 \times 800 \approx 490$ V 多 15.5%。
    - id: b-resonant
      type: number
      prompt: 串联谐振槽路 $L = 50$ μH，$C = 50$ nF。谐振频率约是多少千赫？（保留一位小数）
      answer: 100.7
      tolerance: 0.05
      unit: kHz
      hint: 谐振时电感和电容的电抗有什么关系？
      explain: $\sqrt{LC} = \sqrt{2.5 \times 10^{-12}} = 1.581 \times 10^{-6}$ s，$f_0 \approx 100.7$ kHz。
    - id: b-zvs
      type: choice
      prompt: 下面哪一种做法能让 MOSFET 实现零电压开通？
      options:
        - text: 开通前先用电感电流把它输出电容的电荷抽走，等体二极管导通后再给栅极信号
          correct: true
        - text: 在它两端并一个更大的电容
          why: 并联电容能减小关断损耗，但硬开通时这个电容的储能会在沟道里烧掉，开通损耗反而更大
        - text: 提高栅极驱动电压，让它开通得更快
          why: 开通再快也只是缩短交叠时间，电压不为零就不是零电压开通
        - text: 让谐振变换器工作在谐振频率以下
          why: 低于谐振频率时槽路呈电容性，开通是硬的
      explain: 零电压开通的关键是开通之前管子两端的电压已经为 0，这需要一个电流在开通之前把输出电容放电。
    - id: b-lc
      type: number
      prompt: Buck 变换器输出电感 47 μH、输出电容 220 μF。LC 双极点的频率约是多少赫？（保留到个位）
      answer: 1565
      tolerance: 0.5
      unit: Hz
      hint: LC 低通滤波器的谐振频率由什么决定？
      explain: $\sqrt{LC} \approx 1.0169 \times 10^{-4}$ s，$f_0 \approx 1565$ Hz。
    - id: b-crossover
      type: choice
      prompt: 一个 Boost 变换器开关频率 100 kHz，右半平面零点在 5 kHz。电压环的穿越频率怎样选比较合理？
      options:
        - text: 1 kHz 左右，远低于右半平面零点
          correct: true
        - text: 10–20 kHz，按开关频率的十分之一到五分之一
          why: 这条经验只考虑了开关频率；Boost 还要让穿越频率远低于右半平面零点，5 kHz 的零点把上限压得更低
        - text: 5 kHz，正好在零点上
          why: 零点带来 45° 的额外相位滞后，在零点处穿越很难留出相位裕度
        - text: 50 kHz
          why: 远超零点和平均模型的适用范围
      explain: 右半平面零点让相位额外滞后，穿越频率一般取它的几分之一以下，所以这里取 1 kHz 左右。
    - id: b-turns
      type: number
      prompt: 用 $A_L = 250$ nH/匝² 的磁芯绕一个 100 μH 的电感，应绕多少匝？
      answer: 20
      hint: 电感和匝数是什么关系？
      explain: $N = \sqrt{100000/250} = \sqrt{400} = 20$ 匝。
    - id: b-skin
      type: number
      prompt: 铜（$\rho = 1.72 \times 10^{-8}$ Ω·m）在 100 kHz 下的趋肤深度约是多少毫米？（保留两位小数）
      answer: 0.21
      tolerance: 0.005
      unit: mm
      hint: 趋肤深度和频率、电阻率是什么关系？
      explain: $\delta \approx 2.09 \times 10^{-4}$ m，约 0.21 mm。
