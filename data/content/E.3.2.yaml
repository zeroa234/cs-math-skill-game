skill: E.3.2
version: 2
authors: [main-agent]
brief:
  why: 电网里的电几乎都由同步发电机发出，工厂里的动力大多来自感应电动机，机器人、无人机和电动车靠永磁电机和步进电机。这一关从磁路和变压器讲起，学直流、同步、感应、永磁和步进电机怎样产生转矩，电机和负载配在一起时在哪里稳定运行，以及怎样用变频器和矢量控制调速。假设你学过大学物理的电磁学（磁通、法拉第电磁感应定律、安培力、电感）和电路基础。
  outcomes:
    - 用磁路欧姆定律估算磁通和电感，说明气隙、饱和和铁芯损耗的影响
    - 算出变压器的匝数比、额定电流和折算阻抗，由空载、短路试验求等效电路的各个量，算效率和标幺值
    - 由三相绕组说明旋转磁场，算同步转速，用功角特性求同步电机的功率，说出励磁对功率因数的影响
    - 用反电动势和转矩公式分析直流电动机，算起动电流和调速后的转速
    - 算感应电动机的转差率、转子频率、功率流和转矩，读转矩—转差率曲线
    - 说出步进电机、永磁同步电机和无刷直流电机的原理，算步距角和换相次数
    - 判断电力拖动的稳定运行条件，按恒压频比调压，说明矢量控制里 $i_d$、$i_q$ 的作用
terms:
  - term: 磁动势
    def: '线圈匝数和电流的乘积 F = Ni，单位安匝，在磁路里的作用相当于电路里的电压'
  - term: 磁阻
    def: '磁路对磁通的阻碍 ℛ = l/(μA)；磁通等于磁动势除以磁阻，铁芯磁阻小、气隙磁阻大'
  - term: 同步转速
    def: '三相绕组产生的旋转磁场的转速 nₛ = 60f/p（p 是极对数），单位转每分'
  - term: 相量
    def: '用一个复数表示同频率正弦量的有效值和相位，正弦电路的计算可以变成复数运算'
  - term: 功角
    def: '同步电机励磁电动势和端电压两个相量之间的夹角 δ，输出功率和 sin δ 成正比'
  - term: 功率因数
    def: '有功功率和视在功率之比 PF = P/S；电压、电流都是正弦时等于 cos φ，φ 是两者的相位差'
  - term: 无功功率
    def: 'Q = VI sin φ，在电源和电感、电容之间来回交换、不做功却占用电流的那部分功率'
  - term: 步距角
    def: '步进电机每接收一个脉冲转过的角度，反应式为 360°/(mNᵣ)，常见的两相混合式为 1.8°'
  - term: 剩磁
    def: '永磁体磁化后去掉外磁场仍保留的磁感应强度 Bᵣ，钕铁硼约 1.2–1.4 T'
  - term: 矫顽力
    def: '把永磁体退磁到零所需的反向磁场强度 H_c，越大越不容易被退磁'
  - term: 转差率
    def: '感应电机同步转速和转子转速的相对差 s = (nₛ − n)/nₛ，额定时约 0.02–0.06'
lessons:
  # ==== 磁路与变压器 ====
  - id: magnetic-circuits
    chapter: 磁路与变压器
    title: 磁路
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 同一个线圈通同样的电流，一次是空心的，一次绕在铁芯上。哪种情况线圈里的磁通大？
          options:
            - text: 绕在铁芯上的，大几千倍
              correct: true
            - text: 一样大，磁通只由电流和匝数决定
              why: 电流和匝数决定的是磁动势；同样的磁动势，铁芯这条路比空气好走得多
            - text: 空心的大，铁芯会挡住磁场
              why: 铁是铁磁质，它会大大增强磁场，而不是挡住
          explain: 铁芯给磁通提供了一条容易走的路。这一课把磁通类比成电流，用磁路欧姆定律来算。
      - card:
          title: 磁路欧姆定律
          body: |
            绕在铁芯上的 $N$ 匝线圈通电流 $i$，磁通沿铁芯闭合。由安培环路定理，$Hl = Ni$（$l$ 是磁通沿铁芯走一圈的平均路程），再用 $B = \mu H$、$\Phi = BA$，得

            $$\Phi = \frac{Ni}{l/(\mu A)} = \frac{\mathcal F}{\mathcal R}$$

            $\mathcal F = Ni$ 叫**磁动势（magnetomotive force）**，单位安匝；$\mathcal R = \frac{l}{\mu A}$ 叫**磁阻（reluctance）**。它和电路一一对应：磁动势像电压，磁通像电流，磁阻像电阻，这样的磁通路径叫磁路。$\mu = \mu_r\mu_0$，电工钢的相对磁导率 $\mu_r$ 有几千，所以铁芯磁阻很小。
      - item:
          id: core-flux-density
          type: number
          prompt: 一个铁芯的平均磁路长 0.5 m，截面积 $4 \times 10^{-4}$ m²，相对磁导率 2000，绕 200 匝，通 1 A 电流。铁芯里的磁感应强度约是多少特斯拉？（保留两位小数）
          answer: 1.01
          tolerance: 0.005
          unit: T
          hint: 同样的磁动势下，磁通由什么决定？这个铁芯的磁阻有多大，磁通除以截面积又是什么？
          explain: $\mathcal R = 0.5/(2000 \times 4\pi \times 10^{-7} \times 4 \times 10^{-4}) \approx 4.97 \times 10^5$ A/Wb，$\Phi = 200/\mathcal R \approx 4.02 \times 10^{-4}$ Wb，$B = \Phi/A \approx 1.01$ T。
      - card:
          title: 气隙和饱和
          body: |
            磁路串联时磁阻相加，和串联电阻一样。电机的定子和转子之间必须留气隙，空气的 $\mu_r = 1$，1 mm 气隙的磁阻可以比半米长的铁芯还大好几倍，所以气隙往往决定了整个磁路需要多大的磁动势。

            铁的 $\mu$ 也不是常数：磁感应强度升到 1.5 T 左右以后，$B$–$H$ 曲线变平，叫饱和，再加大电流磁通也增加得很少。电机和变压器一般工作在饱和点附近，充分利用铁芯又不至于需要太大的励磁电流。
          reveal:
            - title: 第 1 步：气隙的磁阻
              body: |
                例：铁芯磁阻 $3.0 \times 10^5$ A/Wb，截面积 $3 \times 10^{-4}$ m²，150 匝，0.8 A，切出 0.5 mm 气隙。空气 $\mu_r = 1$：$\mathcal R_g = \frac{0.5 \times 10^{-3}}{4\pi \times 10^{-7} \times 3 \times 10^{-4}} \approx 1.33 \times 10^6$ A/Wb。
            - title: 第 2 步：串联后的总磁阻
              body: |
                磁阻串联相加：$3.0 \times 10^5 + 1.33 \times 10^6 \approx 1.63 \times 10^6$ A/Wb。
            - title: 第 3 步：磁通
              body: |
                磁动势 $Ni = 150 \times 0.8 = 120$ 安匝，$\Phi = \frac{120}{1.63 \times 10^6} \approx 7.38 \times 10^{-5}$ Wb。
            - title: 第 4 步：磁感应强度
              body: |
                $B = \frac{\Phi}{A} = \frac{7.38 \times 10^{-5}}{3 \times 10^{-4}} \approx 0.246$ T。
      - item:
          id: air-gap
          type: number
          prompt: 一个铁芯磁阻 $4.97 \times 10^5$ A/Wb，截面积 $4 \times 10^{-4}$ m²，200 匝，1 A。在磁路里切出一个 1 mm 的气隙（截面积相同，铁芯磁阻不变）后，磁感应强度约是多少特斯拉？（保留三位小数）
          answer: 0.201
          tolerance: 0.0005
          unit: T
          hint: 气隙磁阻是多少？它和铁芯磁阻串联。
          explain: $\mathcal R_g = 10^{-3}/(4\pi \times 10^{-7} \times 4 \times 10^{-4}) \approx 1.99 \times 10^6$ A/Wb，是铁芯的 4 倍。总磁阻约 $2.49 \times 10^6$，$\Phi \approx 8.04 \times 10^{-5}$ Wb，$B \approx 0.201$ T，只剩原来的五分之一。
      - card:
          title: 电感和铁芯损耗
          body: |
            线圈的磁链是 $N\Phi = \frac{N^2i}{\mathcal R}$，所以电感 $L = \frac{N^2}{\mathcal R}$：磁阻越小，电感越大。

            铁芯在交变磁场里有两种损耗，合称铁耗。磁滞损耗：每磁化一个来回要消耗磁滞回线面积那么多的能量，和频率成正比。涡流损耗：交变磁通在铁芯里感应出环流，和频率的平方成正比；铁芯用彼此绝缘的薄硅钢片叠成，就是为了切断涡流的路径。
      - item:
          id: inductance
          type: number
          prompt: 一个 200 匝的线圈绕在磁阻 $4.97 \times 10^5$ A/Wb 的铁芯上。电感约是多少毫亨？（保留一位小数）
          answer: 80.5
          tolerance: 0.05
          unit: mH
          hint: 电感和匝数、磁阻是什么关系？
          explain: $L = N^2/\mathcal R = 40000/(4.97 \times 10^5) \approx 0.0805$ H。
      - item:
          id: laminations
          type: choice
          prompt: 变压器铁芯为什么用很多片涂了绝缘漆的薄硅钢片叠起来，而不用一整块铁？
          options:
            - text: 减小铁芯里的涡流损耗
              correct: true
            - text: 让磁阻变小
              why: 叠片之间的绝缘层反而让磁阻略增；叠片是为了减小涡流
            - text: 减小磁滞损耗
              why: 磁滞损耗取决于材料的磁滞回线，硅钢材料能减小它，叠片的作用是对付涡流
            - text: 节省硅钢材料，同时减轻铁芯的重量
              why: 叠片和整块的用铁量差不多
          explain: 涡流在垂直于磁通的平面里流动，绝缘薄片把它限制在每一片里，电阻大大增加，涡流损耗随片厚的平方下降。

  - id: transformer-ideal
    chapter: 磁路与变压器
    title: 理想变压器
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 把一节电池（直流）接在变压器的一个线圈上，另一个线圈会持续输出电压吗？
          options:
            - text: 不会，只在通断瞬间有
              correct: true
            - text: 会，变压器能变换任何电压
              why: 二次电压来自磁通的变化；直流稳定以后磁通不变，就没有感应电动势
            - text: 会，而且输出电压比接交流时更高
              why: 磁通不变时感应电动势为 0
          explain: 变压器靠交变磁通在两个线圈里感应电动势，只能用于交流。电压、电流和阻抗都按两个线圈的匝数之比变换。
      - card:
          title: 感应电动势
          body: |
            变压器的两个绕组绕在同一个铁芯上，接电源的叫一次绕组（一次侧），接负载的叫二次绕组（二次侧）。铁芯里的磁通按 $\Phi = \Phi_m\sin\omega t$ 变化，由法拉第电磁感应定律，$N$ 匝绕组的电动势 $e = N\frac{d\Phi}{dt} = \omega N\Phi_m\cos\omega t$。它的有效值是

            $$E = \frac{\omega N\Phi_m}{\sqrt2} = 4.44fN\Phi_m$$

            所以电压一定时，频率越低，需要的磁通越大；变压器按额定电压和频率设计，电压过高或频率过低都会让铁芯饱和。
      - item:
          id: core-flux
          type: number
          prompt: 一台变压器一次绕组 500 匝，接 220 V、50 Hz 电源（忽略绕组压降）。铁芯磁通的最大值约是多少毫韦伯？（保留两位小数）
          answer: 1.98
          tolerance: 0.005
          unit: mWb
          hint: 电压一定时，频率、匝数和磁通最大值之间是什么关系？匝数多一倍，磁通要变成多少？
          explain: $\Phi_m = 220/(4.44 \times 50 \times 500) \approx 1.98 \times 10^{-3}$ Wb。
      - card:
          title: 理想变压器
          body: |
            理想变压器没有损耗，铁芯磁阻为零。两个绕组穿过同一个磁通，所以 $\frac{V_1}{V_2} = \frac{N_1}{N_2} = a$，$a$ 叫匝数比。功率不损失，$V_1I_1 = V_2I_2$，所以 $\frac{I_1}{I_2} = \frac{N_2}{N_1}$：电压升高几倍，电流就降低几倍。

            二次侧接阻抗 $Z_2$，从一次侧看进去是 $Z_1 = \frac{V_1}{I_1} = a^2Z_2$，叫阻抗折算。电子管功放用输出变压器把 8 Ω 喇叭折算成几千欧的负载，就是这个道理。
      - item:
          id: reflected-impedance
          type: number
          prompt: 一台理想变压器匝数比 $N_1/N_2 = 5$，二次侧接 4 Ω 电阻。从一次侧看进去的电阻是多少欧？
          answer: 100
          unit: Ω
          hint: 阻抗按匝数比的几次方折算？
          explain: $Z_1 = a^2Z_2 = 25 \times 4 = 100\ \Omega$。
      - card:
          title: 额定值和额定电流
          body: |
            交流电路里电压和电流有相位差 $\varphi$，有功功率 $P = VI\cos\varphi$，$\cos\varphi$ 叫**功率因数（power factor）**；$S = VI$ 叫视在功率。变压器的额定容量用视在功率表示，单位伏安（VA）或千伏安（kVA）：铜耗随电流增大、铁耗随电压增大，所以容量用电压和电流的乘积来标。一次、二次的额定电压之比就是匝数比，额定电流 $I_1 = S/V_1$，$I_2 = S/V_2$。

            例：10 kVA、2200/220 V 的单相变压器，匝数比 10:1，$I_1 \approx 4.55$ A，$I_2 \approx 45.5$ A。低压侧电流大，所以低压绕组的导线粗、匝数少。
      - item:
          id: rated-current
          type: number
          prompt: 一台 25 kVA、2400/240 V 的单相变压器，二次侧（低压侧）额定电流约是多少安？（保留一位小数）
          answer: 104.2
          tolerance: 0.05
          unit: A
          hint: 额定电流等于额定容量除以哪一侧的额定电压？
          explain: $I_2 = 25000/240 \approx 104.2$ A；一次侧 $25000/2400 \approx 10.4$ A。
      - item:
          id: step-down
          type: choice
          prompt: 一台理想降压变压器把 10 kV 降到 400 V，二次侧电流 250 A。下面哪个说法对？
          options:
            - text: 一次侧电流是 10 A，功率两边相等
              correct: true
            - text: 一次侧电流也是 250 A，电流不变只变电压
              why: 功率守恒，电压升高 25 倍，电流就降低 25 倍
            - text: 一次侧电流是 6250 A
              why: 6250 A 是 250 × 25 算出来的；高压侧电流应该除以 25，变得更小
          explain: 匝数比 25，$I_1 = 250/25 = 10$ A，两侧功率都是 100 kVA。

  - id: transformer-equivalent
    chapter: 磁路与变压器
    title: 实际变压器：等效电路、试验和效率
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一台变压器空载时二次电压 230 V，接上满载后变成 224 V。电压为什么会降低？
          options:
            - text: 绕组电阻和漏磁的压降
              correct: true
            - text: 铁芯在满载时饱和了
              why: 一次电压不变时磁通基本不变，铁芯不会因为负载变大而饱和
            - text: 匝数比随着负载电流的增大而改变
              why: 匝数是绕好的，不会变
          explain: 实际变压器的绕组有电阻，还有一部分磁通只穿过一个绕组（漏磁）。这一课用等效电路描述它们，再讲怎样测出电路里的各个量。
      - card:
          title: 等效电路
          body: |
            实际变压器的等效电路：一次、二次绕组各有电阻 $R_1$、$R_2$ 和漏抗 $X_1$、$X_2$；并联在中间的励磁支路代表铁芯，$R_c$ 上的功率是铁耗，$X_m$ 上的电流用来建立磁通。把二次侧的量按匝数比折算到一次侧（$R_2' = a^2R_2$，$X_2' = a^2X_2$），就得到一个可以直接计算的电路。

            给铁芯建立磁场的电流叫励磁电流，只有额定电流的百分之几，常把励磁支路移到最前面，串联部分合成等效电阻 $R_{eq}$ 和等效漏抗 $X_{eq}$。
      - item:
          id: referred-resistance
          type: number
          prompt: 一台变压器匝数比 $N_1/N_2 = 10$，二次绕组电阻 0.02 Ω。折算到一次侧后是多少欧？
          answer: 2
          unit: Ω
          hint: 电阻按匝数比的几次方折算？
          explain: $R_2' = a^2R_2 = 100 \times 0.02 = 2\ \Omega$，和一次绕组电阻可以直接相加。
      - card:
          title: 空载试验和短路试验
          body: |
            空载试验：低压侧加额定电压，高压侧开路。这时电流很小，铜耗可以忽略，测到的功率 $P_0$ 就是铁耗，由电压、电流、功率算出 $R_c$ 和 $X_m$。

            短路试验：一侧短路，另一侧慢慢升高电压直到额定电流。所需电压只有额定电压的百分之几，磁通很小，铁耗可以忽略，测到的功率就是额定电流下绕组电阻上的损耗（铜耗），由此算出 $R_{eq}$ 和 $X_{eq}$。
      - card:
          title: 例题：由短路试验求等效电路的各个量
          body: 短路试验在额定电流 10 A 时测得电压 120 V、功率 400 W。求等效阻抗、电阻和漏抗。
          reveal:
            - title: 第 1 步：等效阻抗的大小
              body: $|Z_{eq}| = 120/10 = 12\ \Omega$。
            - title: 第 2 步：等效电阻
              body: 功率全是电阻上的铜耗，$R_{eq} = 400/10^2 = 4\ \Omega$。
            - title: 第 3 步：等效漏抗
              body: $X_{eq} = \sqrt{12^2 - 4^2} \approx 11.3\ \Omega$。
      - item:
          id: open-circuit
          type: number
          prompt: 空载试验在低压侧加 240 V，测得电流 2 A、功率 160 W。代表铁耗的电阻 $R_c$（并联模型）是多少欧？
          answer: 360
          unit: Ω
          hint: 空载时测到的功率几乎全花在哪个元件上？
          explain: $R_c = V^2/P_0 = 240^2/160 = 360\ \Omega$。
      - card:
          title: 效率
          body: |
            效率 $\eta = \frac{P_{out}}{P_{out} + P_{Fe} + P_{Cu}}$，$P_{Fe}$ 是铁耗，$P_{Cu}$ 是铜耗。铁耗只和电压有关，几乎不随负载变；铜耗和电流的平方成正比。两者相等时效率最高，配电变压器常设计成在半载左右达到最高效率。
      - item:
          id: efficiency
          type: number
          prompt: 一台 10 kVA 变压器满载、功率因数 0.8 时，铁耗 100 W，铜耗 200 W。效率是百分之几？（保留一位小数）
          answer: 96.4
          tolerance: 0.05
          unit: '%'
          hint: 输出的有功功率是多少？
          explain: $P_{out} = 10000 \times 0.8 = 8000$ W，$\eta = 8000/8300 \approx 96.4\%$。
      - item:
          id: max-efficiency
          type: number
          prompt: 一台变压器铁耗 100 W，满载铜耗 400 W。负载是满载的百分之几时效率最高？
          answer: 50
          unit: '%'
          hint: 效率最高时铜耗等于铁耗，而铜耗和负载电流的平方成正比。
          explain: $x^2 \times 400 = 100$，$x = 0.5$，即半载。
      - card:
          title: 电压调整率、标幺值和三相变压器
          body: |
            电压调整率 $\frac{V_{空载} - V_{额定负载}}{V_N}$ 表示带额定负载后二次电压降了多少，分母是额定电压 $V_N$。

            以额定值为基准的相对值叫标幺值：功率的基准是额定容量 $S_b$，电压的基准是额定电压 $V_b$，阻抗基准 $Z_b = V_b^2/S_b$；折算到一次侧还是二次侧，阻抗的标幺值都相同。三相变压器由三个单相变压器（或一个三柱铁芯）组成，每相按单相的方法计算。
      - item:
          id: per-unit
          type: number
          prompt: 一台 25 kVA、2400 V（一次侧）的变压器，折算到一次侧的等效阻抗是 11.52 Ω。它的标幺值是多少？
          answer: 0.05
          hint: 先算一次侧的阻抗基准。
          explain: $Z_b = 2400^2/25000 = 230.4\ \Omega$，$11.52/230.4 = 0.05$。

  - id: energy-conversion
    chapter: 磁路与变压器
    title: 机电能量转换
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 电磁铁通电后吸引旁边的一块铁。铁块会往哪个方向动？
          options:
            - text: 靠向电磁铁，让气隙变小
              correct: true
            - text: 被推开
              why: 普通的铁（不是磁铁）总是被吸引，因为靠近后磁路更好走
            - text: 不动，因为铁块本身不带电荷
              why: 磁力作用在铁磁质上，不需要带电
          explain: 磁场总要把东西拉到让磁阻更小、电感更大的位置。这一课用能量算出这个力有多大。
      - card:
          title: 电磁力和电感的变化
          body: |
            线性磁路里，线圈储存的磁场能量是 $W = \frac12Li^2$。如果可动部分移动 $dx$ 时电感改变 $dL$，电流保持不变，由能量守恒可以推出作用在可动部分上的力

            $$f = \frac12i^2\frac{dL}{dx}$$

            转动时同理，转矩 $T = \frac12i^2\frac{dL}{d\theta}$。力的方向总是让电感增大（磁阻减小）的方向。继电器、电磁阀、磁阻电机都靠这种力工作，它和电流方向无关，因为 $i^2$ 总是正的。
      - card:
          title: 例题：那个二分之一从哪里来
          body: 电流保持 $i$ 不变，可动部分移动 $dx$，电感增加 $dL$。说明为什么力是 $\frac12i^2\frac{dL}{dx}$。
          reveal:
            - title: 第 1 步：电源多送了多少能量
              body: 磁链 $Li$ 增加 $i\,dL$，电源要克服感应电动势多送 $i \cdot i\,dL = i^2dL$ 的能量。
            - title: 第 2 步：磁场能量增加了多少
              body: $W = \frac12Li^2$，电流不变时增加 $\frac12i^2dL$，只占电源多送能量的一半。
            - title: 第 3 步：另一半去了哪里
              body: 另一半 $\frac12i^2dL$ 变成机械功 $f\,dx$，所以 $f = \frac12i^2\frac{dL}{dx}$。
      - item:
          id: magnetic-force
          type: number
          prompt: 一个电磁铁的衔铁移动 2 mm 时，线圈电感从 50 mH 均匀增大到 80 mH。线圈电流保持 3 A，衔铁受到的平均电磁力是多少牛？
          answer: 67.5
          unit: N
          hint: $\frac{dL}{dx}$ 是多少亨每米？
          explain: $\frac{dL}{dx} = 0.03/0.002 = 15$ H/m，$f = \frac12 \times 9 \times 15 = 67.5$ N。
      - card:
          title: 两个绕组之间的转矩
          body: |
            电机一般有两套绕组（或一套绕组加永磁体），它们之间的互感 $M$ 随转角 $\theta$ 变化。除了上面的磁阻转矩，还有一项

            $$T = i_1i_2\frac{dM}{d\theta}$$

            它和两个电流的乘积有关。能量的去向：电源送进的电能，一部分变成磁场能量，一部分做机械功（再加上损耗）。同步电机、直流电机产生转矩，靠的主要是这一项。
      - item:
          id: mutual-torque
          type: number
          prompt: 两个绕组的互感 $M = 0.05\cos\theta$ H，电流 $i_1 = 10$ A、$i_2 = 2$ A。转角 $\theta = 30°$ 时转矩的大小是多少牛·米？
          answer: 0.5
          unit: N·m
          hint: 先求 $\frac{dM}{d\theta}$，再代入 $\theta = 30°$。
          explain: $\frac{dM}{d\theta} = -0.05\sin\theta$，$T = 10 \times 2 \times (-0.05 \times 0.5) = -0.5$ N·m，大小 0.5 N·m，负号表示转矩让 $\theta$ 减小。
      - item:
          id: reluctance-direction
          type: choice
          prompt: 一个软铁转子放在通电的定子磁极之间，转子是长条形的。它会转到什么位置停下？
          options:
            - text: 长轴对准磁极，磁阻最小
              correct: true
            - text: 长轴垂直于磁极
              why: 那时气隙最大、磁阻最大，力会把转子拉离这个位置
            - text: 一直转个不停
              why: 磁阻力矩只把转子拉到磁阻最小的位置；要持续转动，必须按顺序切换通电的磁极
          explain: 力总是指向电感增大的方向，长轴对准磁极时电感最大，转子停在那里。磁阻电机和步进电机就是按顺序给不同磁极通电，让转子一步步追着转。

  # ==== 同步电机 ====
  - id: rotating-field
    chapter: 同步电机
    title: 旋转磁场和同步转速
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 三个线圈在圆周上互隔 120° 放置，分别通入相位互差 120° 的三相交流电。中间的合成磁场是什么样？
          options:
            - text: 大小不变、匀速旋转的磁场
              correct: true
            - text: 方向不动、大小来回变化的磁场
              why: 单个线圈才是这样；三个线圈在空间和时间上都错开 120°，合起来变成旋转的
            - text: 三个磁场互相抵消，合成为零
              why: 三相电流在任一时刻之和为零，但它们的磁场方向不同，合成后不为零
          explain: 三相绕组产生旋转磁场，这是交流电机工作的基础。这一课算它转多快。
      - card:
          title: 旋转电机的结构和旋转磁场
          body: |
            旋转电机由不动的定子和转动的转子组成，中间隔着气隙。交流电机的定子上嵌有三相绕组，在圆周上互隔 120°（两极电机就是空间上的 120°）。三相电流也互差 120°，三个脉动磁场合成为一个大小恒定、匀速旋转的磁场，大小是单相磁场峰值的 1.5 倍。

            三相电源的三根相线之间的电压叫线电压，每相绕组两端的电压叫相电压；绕组接成星形时，线电压是相电压的 $\sqrt3$ 倍，例如 380 V 线电压对应约 220 V 相电压。
      - item:
          id: phase-voltage
          type: number
          prompt: 一台星形连接的三相电动机接在线电压 380 V 的电网上。每相绕组上的相电压约是多少伏？（保留一位小数）
          answer: 219.4
          tolerance: 0.05
          unit: V
          hint: 星形连接时线电压是相电压的几倍？
          explain: $380/\sqrt3 \approx 219.4$ V。
      - card:
          title: 同步转速
          body: |
            绕组每形成一对 N、S 磁极叫一对极，极对数记作 $p$。电流变化一个周期，旋转磁场转过一对极，也就是 $1/p$ 圈；所以按电流的周期算的角度（电角度）是机械角度的 $p$ 倍，转一圈走过 $p \times 360°$ 电角度。所以旋转磁场的转速，即**同步转速（synchronous speed）**是

            $$n_s = \frac{60f}{p}\ \text{r/min}$$

            50 Hz 时：2 极（$p = 1$）3000 r/min，4 极 1500 r/min，6 极 1000 r/min。
      - item:
          id: sync-speed
          type: number
          prompt: 一台 8 极（4 对极）的电机接 50 Hz 电源。同步转速是多少转每分？
          answer: 750
          unit: r/min
          hint: 极对数是多少？
          explain: $n_s = 60 \times 50/4 = 750$ r/min。
      - card:
          title: 绕组电动势和电机的大小
          body: |
            旋转磁场扫过定子绕组，每相感应出电动势 $E = 4.44fNk_w\Phi$，和变压器的公式一样，只多了一个绕组系数 $k_w$（略小于 1，因为一相的线圈分布在几个槽里，各自的电动势有相位差）。

            电磁转矩来自气隙表面的切向力。单位面积的切向力（剪切应力）受磁感应强度和电流密度限制，转矩约等于剪切应力乘转子表面积再乘半径，即 2 倍剪切应力乘转子体积。所以同样的材料和冷却，电机的转矩大致和转子体积成正比，功率等于转矩乘转速。
      - item:
          id: torque-volume
          type: choice
          prompt: 两台电机材料、冷却方式相同，甲的转子体积是乙的 2 倍，额定转速相同。甲的额定转矩大约是乙的多少倍？
          options:
            - text: 2 倍
              correct: true
            - text: 4 倍
              why: 转矩和转子体积成正比，不是和体积的平方成正比
            - text: 一样大
              why: 剪切应力相同时，转子表面积和半径都更大，转矩随体积增大
          explain: 转矩约等于 2 倍剪切应力乘转子体积，体积 2 倍，转矩约 2 倍；转速相同时功率也约 2 倍。

  - id: synchronous-machine
    chapter: 同步电机
    title: 同步电机：功角特性和励磁
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一台 4 极同步电动机接 50 Hz 电网，负载从一半加到满载。它的转速会怎样？
          options:
            - text: 不变
              correct: true
            - text: 略微下降
              why: 那是感应电动机的特点；同步电机的转子和旋转磁场同步，负载只改变两者之间的角度
            - text: 下降到原来的一半左右
              why: 同步电机只要不失步，转速就等于同步转速
          explain: 同步电机的转速只由电源频率和极对数决定。负载变化时改变的是转子落后旋转磁场的角度，这一课讲这个角度和功率的关系。
      - card:
          title: 同步电机的结构
          body: |
            同步电机的定子是三相绕组，转子上有直流励磁绕组（或永磁体），形成固定的磁极。转子被定子的旋转磁场“拖着”同步旋转，转速恒为 $n = 60f/p$。

            转子有两种：隐极式，转子是圆柱，气隙均匀，用于汽轮发电机（2 极或 4 极，转速高）；凸极式，磁极凸出，气隙不均匀，极数多，用于水轮发电机。电网里的绝大部分电能由同步发电机发出。
      - card:
          title: 等效电路和功角特性
          body: |
            正弦量可以用一个复数表示它的有效值和相位，叫**相量（phasor）**。隐极同步发电机每相的电压方程（忽略电阻）是

            $$\dot E_f = \dot V + jX_s\dot I$$

            $E_f$ 是励磁磁场感应的电动势，和励磁电流成正比；$X_s$ 是同步电抗。$\dot E_f$ 和 $\dot V$ 之间的夹角 $\delta$ 叫**功角（power angle）**，三相输出功率

            $$P = \frac{3VE_f}{X_s}\sin\delta$$

            $\delta = 90°$ 时功率最大；负载超过它，转子就拖不住而失步。
      - item:
          id: power-angle
          type: number
          prompt: 一台隐极同步发电机每相电压 230 V，励磁电动势 260 V，同步电抗 5 Ω，功角 20°。三相输出功率约是多少千瓦？（保留两位小数）
          answer: 12.27
          tolerance: 0.005
          unit: kW
          hint: 功角特性公式里的电压、电动势是每相的值，输出的是几相的总功率？
          explain: $P = 3 \times 230 \times 260 \times \sin 20°/5 \approx 12.27$ kW。
      - item:
          id: pull-out
          type: number
          prompt: 一台隐极同步发电机每相电压 230 V，励磁电动势 260 V，同步电抗 5 Ω。它能输出的最大功率（失步前）约是多少千瓦？（保留两位小数）
          answer: 35.88
          tolerance: 0.005
          unit: kW
          hint: 功角取多少时功率最大？
          explain: $\delta = 90°$ 时 $P_{max} = 3 \times 230 \times 260/5 = 35880$ W。
      - card:
          title: 励磁和功率因数
          body: |
            电压和电流的相位差为 $\varphi$ 时，有功功率 $P = VI\cos\varphi$（$\cos\varphi$ 就是功率因数），$Q = VI\sin\varphi$ 叫**无功功率（reactive power）**，它在电源和电感、电容之间来回交换，不做功，却占用电流。

            同步电动机输出功率一定时，调节励磁电流，电枢电流随之按 V 形曲线变化。过励（励磁电流大）时电动机向电网发出无功功率，功率因数超前；欠励时从电网吸收无功，功率因数滞后。专门空载运行、过励发无功来改善电网功率因数的同步电机叫同步调相机。
      - item:
          id: overexcited
          type: choice
          prompt: 一个工厂有很多感应电动机，功率因数偏低。在厂里加一台空载运行的同步电动机来改善功率因数，它的励磁应该怎样调？
          options:
            - text: 过励，让它发出无功功率
              correct: true
            - text: 欠励，让它也吸收无功功率
              why: 感应电动机已经在吸收无功，同步电机再吸收只会让功率因数更低
            - text: 把励磁电流调到零，只靠电网供电
              why: 没有励磁就没有励磁电动势，电机只能从电网吸收无功，带负载能力也很差
            - text: 调大励磁让它转得更快，带动更多负载
              why: 同步电机的转速由频率和极对数决定，励磁不改变转速，只改变它发出或吸收的无功
          explain: 过励的同步电机像一个电容，发出的无功正好抵消感应电动机吸收的无功，工厂从电网取的电流变小，功率因数提高。

  - id: synchronous-dynamics
    chapter: 同步电机
    title: 派克变换和转子运动方程
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 发电机的原动机（汽轮机）突然多给了一些机械功率。转子的功角会怎样变化？
          options:
            - text: 增大，摆动几次后稳定
              correct: true
            - text: 立刻跳到新的位置不动
              why: 转子有惯性，功角不能突变，会冲过头再摆回来
            - text: 一直增大，直到转子失步为止
              why: 只要新的机械功率小于最大电磁功率，功角会在新的平衡点附近稳定
          explain: 转子像一个挂在弹簧上的质量，受扰动后会摆动。这一课写出描述它的方程，并介绍分析电机动态的派克变换。
      - card:
          title: 双反应理论和派克变换
          body: |
            凸极转子沿磁极方向（直轴，d 轴）气隙小、磁阻小，沿两极之间（交轴，q 轴）气隙大、磁阻大，所以直轴同步电抗 $X_d$ 大于交轴同步电抗 $X_q$。把定子的磁动势分解到 d、q 两个轴上分别计算，叫双反应理论。

            派克变换把定子三相的电压、电流换算到随转子一起旋转的 d、q 坐标上。在这个坐标里，稳态时按同步转速旋转的三相正弦量变成了不随时间变化的常数，电机的方程也不再含随转角变化的电感，分析暂态和设计控制都简单得多。
      - item:
          id: xd-xq
          type: choice
          prompt: 凸极同步电机的直轴同步电抗 $X_d$ 和交轴同步电抗 $X_q$ 哪个大？为什么？
          options:
            - text: $X_d$ 大，直轴方向气隙小、磁阻小
              correct: true
            - text: $X_q$ 大，交轴方向导磁更好
              why: 交轴在两极之间，气隙大、磁阻大，电抗反而小
            - text: 一样大，电抗只由绕组匝数决定
              why: 电抗和磁阻有关，凸极转子在两个方向的磁阻不同
          explain: 磁阻越小，同样电流产生的磁通越大，电抗越大，所以 $X_d > X_q$。隐极电机两者近似相等。
      - card:
          title: 转子运动方程
          body: |
            转子的转动遵循牛顿定律：$J\frac{d\omega_m}{dt} = T_m - T_e$。功角是电角度，$\frac{d^2\delta}{dt^2} = p\frac{d\omega_m}{dt}$；两边再乘同步机械角速度 $\omega_{sm}$，转矩乘角速度变成功率：

            $$M\frac{d^2\delta}{dt^2} = P_m - P_{max}\sin\delta,\qquad M = \frac{J\omega_{sm}}{p}$$

            这叫摇摆方程。平衡点满足 $P_m = P_{max}\sin\delta_0$。在平衡点附近线性化，$P_{max}\cos\delta_0$ 像弹簧的刚度，叫整步功率系数；$\delta_0 < 90°$ 时它为正，功角受扰后在平衡点附近振荡（实际电机有阻尼，振荡会衰减）。
      - item:
          id: equilibrium-angle
          type: number
          prompt: 一台发电机的最大电磁功率是 2.0，原动机输入机械功率 1.0（都是以额定容量为基准的标幺值）。稳态的功角是多少度？
          answer: 30
          unit: °
          hint: 平衡时机械功率等于电磁功率。
          explain: $\sin\delta_0 = 1.0/2.0 = 0.5$，$\delta_0 = 30°$（另一个解 150° 不稳定）。
      - item:
          id: sync-coefficient
          type: number
          prompt: 一台发电机最大电磁功率 2.0（以额定容量为基准的标幺值），稳态功角 30°。整步功率系数 $P_{max}\cos\delta_0$ 是多少？（保留三位小数）
          answer: 1.732
          tolerance: 0.0005
          hint: 代入定义。
          explain: $2.0 \times \cos 30° \approx 1.732$。系数为正，功角受扰后会被拉回平衡点。
      - item:
          id: unstable-branch
          type: choice
          prompt: 稳态时功角特性 $P_m = P_{max}\sin\delta$ 在 $0°$ 到 $180°$ 之间有两个解，例如 30° 和 150°。为什么只有 30° 是稳定的运行点？
          options:
            - text: 150° 处功角一增大电磁功率就减小
              correct: true
            - text: 150° 处电磁功率比 30° 处大
              why: 两处的电磁功率都等于 $P_m$，区别在于功角变化时功率往哪边变
            - text: 两个点都稳定，实际运行在哪一个由初始条件决定
              why: 150° 处整步功率系数为负，任何小扰动都会被放大
          explain: 30° 处功角增大时电磁功率变大，把转子拉回来；150° 处正好相反，扰动会被放大，转子失步。

  # ==== 直流电机 ====
  - id: dc-machines
    chapter: 直流电机
    title: 直流电机
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一台励磁由独立电源供电（他励）的直流电动机空载运行，把励磁电流调小（磁场变弱）。转速会怎样？
          options:
            - text: 升高
              correct: true
            - text: 降低
              why: 磁场弱了，同样转速感应的反电动势变小，电枢电流增大、转矩增大，电机加速，直到反电动势重新接近电源电压
            - text: 不变
              why: 转速要让反电动势和电源电压基本平衡，磁场变弱就必须转得更快
          explain: 磁场减弱反而转得更快，这是直流电机的一个反直觉的特点。这一课从反电动势和转矩两个公式讲起。
      - card:
          title: 结构和换向器
          body: |
            直流电机的磁极（励磁绕组或永磁体）在定子上，电枢绕组在转子上。转子线圈转到另一个磁极下面时，电流必须反向，转矩才能保持同一个方向。换向器和电刷完成这件事：换向器是装在转轴上的一圈彼此绝缘的铜片，电刷压在上面，线圈从一个磁极下转到相邻磁极下时，它接到电刷的两端就互换一次。

            换向时线圈电流快速反向，容易在电刷下产生火花，这是直流电机维护量大、转速受限的主要原因。
      - item:
          id: commutator-role
          type: choice
          prompt: 直流电动机的换向器起什么作用？
          options:
            - text: 及时让线圈电流反向，保持转矩方向
              correct: true
            - text: 把电源的直流变成交流送给定子
              why: 定子上是磁极，换向器接的是转子的电枢绕组
            - text: 调节电动机的转速，转得越快接触越多
              why: 转速由电压、磁场和负载决定，换向器只负责及时改变线圈电流的方向
          explain: 线圈从 N 极下转到 S 极下时，受力方向会反过来；换向器同时让电流反向，转矩就始终朝同一个方向。
      - card:
          title: 反电动势、转矩和电压方程
          body: |
            电枢在磁场中转动，由法拉第电磁感应定律感应出反电动势 $E = k\Phi\omega$；电枢电流在磁场中受安培力，产生转矩 $T = k\Phi I_a$。用国际单位时两个式子里的 $k\Phi$ 是同一个数，所以 $EI_a = T\omega$：电功率全部变成机械功率。

            电动机的电压方程是 $V = E + I_aR_a$。电源电压大部分被反电动势平衡，只有一小部分降在电枢电阻上。
      - card:
          title: 例题：他励直流电动机
          body: 他励直流电动机端电压 240 V，电枢电阻 0.4 Ω，电枢电流 25 A 时转速 1200 r/min。求反电动势、$k\Phi$ 和电磁转矩。
          reveal:
            - title: 第 1 步：反电动势
              body: $E = 240 - 25 \times 0.4 = 230$ V。
            - title: 第 2 步：换算角速度，求 kΦ
              body: $\omega = 1200 \times 2\pi/60 \approx 125.7$ rad/s，$k\Phi = 230/125.7 \approx 1.83$ V·s/rad。
            - title: 第 3 步：电磁转矩
              body: $T = k\Phi I_a \approx 1.83 \times 25 \approx 45.8$ N·m。验算：$EI_a = 5750$ W，$T\omega \approx 45.8 \times 125.7 \approx 5750$ W。
      - item:
          id: dc-torque
          type: number
          prompt: 他励直流电动机端电压 120 V，电枢电阻 0.2 Ω，电枢电流 50 A 时转速 1000 r/min。电磁转矩约是多少牛·米？（保留一位小数）
          answer: 52.5
          tolerance: 0.05
          unit: N·m
          hint: 先求反电动势，再求 $k\Phi$。
          explain: $E = 120 - 10 = 110$ V，$\omega \approx 104.7$ rad/s，$k\Phi \approx 1.050$，$T \approx 1.050 \times 50 \approx 52.5$ N·m。
      - card:
          title: 起动电流和励磁方式
          body: |
            起动瞬间转速为 0，没有反电动势，电流只受很小的电枢电阻限制：$I = V/R_a$，可以是额定电流的十几到几十倍，会烧坏换向器、冲击电网。所以要在电枢回路串起动电阻，或者降低电压起动，转速升起来后再逐步切除。

            励磁方式：他励（励磁由独立电源供电）、并励（励磁绕组和电枢并联）、串励（励磁绕组和电枢串联，起动转矩大，但空载时磁场很弱，转速会飞升到危险的程度，不允许空载运行）、复励。
      - item:
          id: start-resistor
          type: number
          prompt: 一台他励直流电动机端电压 120 V，电枢电阻 0.2 Ω。要把起动电流限制在 100 A，电枢回路要串多大的起动电阻？
          answer: 1
          unit: Ω
          hint: 起动瞬间没有反电动势，回路总电阻要多大？
          explain: 总电阻 $120/100 = 1.2\ \Omega$，减去电枢电阻 0.2 Ω，串 1 Ω。不串电阻时起动电流是 600 A。
      - item:
          id: series-motor
          type: choice
          prompt: 为什么串励直流电动机不允许在空载下起动和运行？
          options:
            - text: 空载时磁场太弱，转速飞升
              correct: true
            - text: 空载时起动转矩不够，电机转不起来
              why: 串励电机的起动转矩很大，问题出在转起来以后
            - text: 空载时电枢电流太大，会烧坏绕组
              why: 空载时负载转矩小，电枢电流也小，危险的是转速
          explain: 串励电机的励磁电流就是电枢电流。空载时电流很小，$\Phi$ 很小，要让反电动势平衡电源电压，转速就要升得很高，可能甩坏转子。

  # ==== 永磁与步进电机 ====
  - id: reluctance-stepper
    chapter: 永磁与步进电机
    title: 磁阻电机和步进电机
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 3D 打印机的喷头位置控制得很准，可它的步进电机上并没有装测位置的传感器。它靠什么知道转了多少？
          options:
            - text: 一个脉冲转固定角度
              correct: true
            - text: 靠电机电流的大小推算
              why: 步进电机按脉冲个数定位，电流大小只影响它能带多大的负载
            - text: 靠转得很慢、每次只转一点点来保证准确
              why: 步进电机可以转得很快，定位靠的是“一个脉冲一步”
          explain: 步进电机是用磁阻原理一步步转的开环定位电机。这一课讲它的步距角怎么算。
      - card:
          title: 磁阻电机
          body: |
            定子绕组通电后，软铁转子的齿会被拉到和通电磁极对齐的位置，因为那里磁阻最小、电感最大。按顺序给各相绕组通电，转子就一步步追着转，这叫磁阻电机。转矩来自电感随转角的变化 $T = \frac12i^2\frac{dL}{d\theta}$，和电流方向无关。

            开关磁阻电机就是用功率电子按转子位置切换各相电流的磁阻电机，结构简单、耐高温，但转矩脉动和噪声较大。
      - card:
          title: 步进电机和步距角
          body: |
            步进电机每接收一个脉冲，就让下一相（或下一组）绕组通电，转子转过一个固定的角度，叫**步距角（step angle）**。反应式（磁阻式）步进电机的步距角是

            $$\theta = \frac{360°}{mN_r}$$

            $m$ 是相数，$N_r$ 是转子齿数。常见的两相混合式步进电机步距角 1.8°，一圈 200 步。按“一相、两相”交替通电叫半步，步距角减半；把电流细分成多级的叫微步。
      - item:
          id: vr-step
          type: number
          prompt: 一台三相反应式步进电机，转子有 8 个齿。步距角是多少度？
          answer: 15
          unit: °
          hint: 这台电机有几相？转子有几个齿？
          explain: $360°/(3 \times 8) = 15°$，一圈 24 步。
      - item:
          id: stepper-speed
          type: number
          prompt: 步距角 1.8° 的步进电机以每秒 1000 个脉冲整步运行。转速是多少转每分？
          answer: 300
          unit: r/min
          hint: 一圈要多少个脉冲？
          explain: 一圈 200 步，每秒 1000 步就是 5 r/s，即 300 r/min。
      - item:
          id: lost-steps
          type: choice
          prompt: 一台步进电机在开环控制下工作，加速太快时位置出现了偏差，而控制器并不知道。原因是什么？
          options:
            - text: 负载转矩超过电机转矩而丢步
              correct: true
            - text: 脉冲信号的电压太高
              why: 脉冲只是告诉驱动器何时走一步，丢步是因为转子跟不上
            - text: 步距角在高速时会自动变大，一步走得更远
              why: 步距角由结构决定，不随速度变化
          explain: 步进电机的转矩随转速升高而下降，加速太猛或负载太重时转子会落后几步。开环系统不测位置，所以发现不了，需要留足转矩余量，或者加编码器（测转子角位置的传感器）做成闭环。

  - id: pm-brushless
    chapter: 永磁与步进电机
    title: 永磁电机和无刷直流电机
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 无人机和高档电钻多用“无刷电机”。它和有刷直流电机比，最主要的好处是什么？
          options:
            - text: 没有电刷磨损
              correct: true
            - text: 不需要任何控制电路，接上电池就能转
              why: 无刷电机反而必须用电子电路按转子位置换相
            - text: 转子上有绕组，转矩更大
              why: 无刷电机的转子是永磁体，没有绕组
          explain: 无刷电机用电子开关代替了换向器。这一课先讲永磁材料，再讲无刷电机怎样换相。
      - card:
          title: 永磁材料
          body: |
            永磁体被磁化后，去掉外磁场仍保留的磁感应强度叫**剩磁（remanence）** $B_r$；要把它退磁到零所需的反向磁场强度叫**矫顽力（coercivity）** $H_c$。电机里的永磁体既要剩磁大（磁场强），也要矫顽力大（不容易被电枢电流的反向磁场退磁）。

            钕铁硼的剩磁约 1.2–1.4 T，比铁氧体（约 0.4 T）大得多，让电机可以做得小而有力；但它的性能随温度升高而下降，过热或过大的反向电流可能造成永久退磁。
      - item:
          id: pm-choice
          type: choice
          prompt: 一台无人机电机要求体积小、转矩大。转子永磁体选钕铁硼还是铁氧体？主要的风险是什么？
          options:
            - text: 钕铁硼；温度太高时会退磁
              correct: true
            - text: 铁氧体；钕铁硼太重
              why: 钕铁硼剩磁大，同样磁场需要的磁体更少，反而更轻小
            - text: 铁氧体；钕铁硼的剩磁比铁氧体低
              why: 正好反了，钕铁硼的剩磁约 1.2–1.4 T，是铁氧体（约 0.4 T）的三倍多
          explain: 钕铁硼剩磁约是铁氧体的三倍多，适合高功率密度的电机，设计时要控制温升和最大电流，防止退磁。
      - card:
          title: 永磁同步电机和无刷直流电机
          body: |
            两者结构相同：转子是永磁体，定子是三相绕组，由逆变器（把直流变成三相交流的电力电子开关电路）供电，靠转子磁场和定子旋转磁场同步作用产生转矩。区别在于反电动势和电流的波形：无刷直流电机的反电动势是梯形波，用三个霍尔传感器每 60° 电角度给出一次转子位置，按六种状态轮流给两相通电（六步换相）；永磁同步电机的反电动势是正弦波，通正弦电流，需要更精细的位置信息（编码器或旋转变压器），转矩更平稳。

            电角度和机械角度的关系：$p$ 对极的电机转一圈，电角度走过 $p \times 360°$。
      - item:
          id: commutation-steps
          type: number
          prompt: 一台 4 对极的无刷直流电机用六步换相。转子转一圈，要换相多少次？
          answer: 24
          hint: 每个电周期换相几次？转一圈有几个电周期？
          explain: 每个电周期 6 次，4 对极转一圈是 4 个电周期，共 24 次。
      - item:
          id: electrical-frequency
          type: number
          prompt: 一台 4 对极的永磁同步电机以 3000 r/min 运行。定子电流的频率是多少赫兹？
          answer: 200
          unit: Hz
          hint: 每秒转多少圈？每圈有几个电周期？
          explain: $3000/60 = 50$ r/s，乘以 4 对极，电频率 200 Hz。

  # ==== 感应电机 ====
  - id: induction-basics
    chapter: 感应电机
    title: 感应电机的原理和转差率
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 如果感应电动机的转子正好以同步转速旋转，它会产生多大的转矩？
          options:
            - text: 零
              correct: true
            - text: 最大
              why: 转子和旋转磁场同速时，导体不再切割磁感线，没有感应电流，也就没有转矩
            - text: 和额定转矩一样
              why: 感应电机必须比旋转磁场慢一点，转子里才有感应电流
          explain: 感应电机的转子靠“落后”于旋转磁场来感应电流，所以它总是比同步转速慢一点。这个差叫转差。
      - card:
          title: 感应原理
          body: |
            一块导体板放在移动的磁场里，板内感应出涡流，涡流受磁场的力，把导体板朝磁场移动的方向拖，这就是直线感应电机的原理。旋转电机里，定子的旋转磁场扫过转子导体，感应出电流，电流受安培力，转子被拖着朝旋转磁场的方向转。

            转子转得越接近磁场，切割越慢，感应电流和转矩越小；所以转子总比旋转磁场慢一些，这也是它又叫异步电机的原因。
      - card:
          title: 转差率和转子频率
          body: |
            同步转速 $n_s$ 和转子转速 $n$ 的相对差叫**转差率（slip）**：

            $$s = \frac{n_s - n}{n_s}$$

            起动时 $s = 1$，空载时接近 0，额定负载时一般在 0.02–0.06。旋转磁场相对转子的转速是 $sn_s$，所以转子电流的频率是 $f_2 = sf$：额定运行时只有一两赫兹，起动瞬间等于电源频率。
      - item:
          id: rotor-frequency
          type: number
          prompt: 一台 6 极、50 Hz 的感应电动机以 975 r/min 运行。转子电流的频率是多少赫兹？
          answer: 1.25
          unit: Hz
          hint: 先求同步转速和转差率。
          explain: $n_s = 1000$ r/min，$s = 25/1000 = 0.025$，$f_2 = 0.025 \times 50 = 1.25$ Hz。
      - item:
          id: rotor-speed
          type: number
          prompt: 一台 4 极、60 Hz 的感应电动机转差率 0.03。转子转速是多少转每分？
          answer: 1746
          unit: r/min
          hint: 同步转速是多少？
          explain: $n_s = 60 \times 60/2 = 1800$ r/min，$n = 1800 \times 0.97 = 1746$ r/min。
      - card:
          title: 等效电路
          body: |
            感应电机很像一台二次侧短路、而且在转动的变压器。每相的等效电路有定子电阻 $R_1$、漏抗 $X_1$、励磁电抗 $X_m$，转子折算到定子侧的漏抗 $X_2'$ 和电阻 $R_2'/s$。

            把 $\frac{R_2'}{s}$ 拆成 $R_2' + R_2'\frac{1 - s}{s}$：前一项是转子绕组真实的铜耗，后一项上消耗的功率代表变成机械功率的部分。转差率越小，这个“负载电阻”越大。
      - item:
          id: load-resistance
          type: number
          prompt: 一台感应电动机转子电阻折算到定子侧 $R_2' = 0.2\ \Omega$，转差率 0.04。等效电路里代表机械负载的电阻 $R_2'\frac{1 - s}{s}$ 是多少欧？
          answer: 4.8
          unit: Ω
          hint: 代入公式。
          explain: $0.2 \times 0.96/0.04 = 4.8\ \Omega$，加上 $R_2'$ 正好是 $R_2'/s = 5\ \Omega$。

  - id: induction-torque
    chapter: 感应电机
    title: 感应电机的功率、转矩和单相电动机
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 感应电动机从静止起动到额定转速，电磁转矩怎样变化？
          options:
            - text: 先增大到一个最大值，再减小到额定值
              correct: true
            - text: 一直保持不变
              why: 转矩随转差率变化，起动、最大、额定三处都不一样
            - text: 起动时最大，然后一直减小
              why: 普通鼠笼电机的最大转矩出现在中间某个转差率处，起动转矩比它小
          explain: 转矩随转速先升后降，中间有一个最大转矩。这一课用功率流和转矩—转差率曲线说明它。
      - card:
          title: 功率流
          body: |
            定子输入的电功率减去定子铜耗和铁耗，穿过气隙传给转子，叫电磁功率（气隙功率）$P_{ag}$。转子上它分成两部分：

            $$P_{Cu2} = sP_{ag},\qquad P_{mech} = (1 - s)P_{ag}$$

            电磁转矩 $T = \frac{P_{ag}}{\omega_s} = \frac{P_{mech}}{\omega}$，$\omega_s$ 是同步角速度。转差率就是气隙功率里变成转子铜耗的比例，所以感应电机要高效，就要在小转差率下运行。
      - card:
          title: 例题：功率和转矩
          body: 4 极、50 Hz 感应电动机的电磁功率 10 kW，转差率 0.04。求转子铜耗、机械功率和电磁转矩。
          reveal:
            - title: 第 1 步：转子铜耗
              body: $P_{Cu2} = 0.04 \times 10 = 0.4$ kW。
            - title: 第 2 步：机械功率
              body: $P_{mech} = 10 - 0.4 = 9.6$ kW。
            - title: 第 3 步：电磁转矩
              body: $\omega_s = 1500 \times 2\pi/60 \approx 157.1$ rad/s，$T = 10000/157.1 \approx 63.7$ N·m。
      - item:
          id: rotor-copper
          type: number
          prompt: 一台感应电动机电磁功率 20 kW，转差率 0.05。转子铜耗是多少千瓦？
          answer: 1
          unit: kW
          hint: 转子铜耗占电磁功率的比例是多少？
          explain: $P_{Cu2} = 0.05 \times 20 = 1$ kW，机械功率 19 kW。
      - card:
          title: 转矩—转差率曲线
          body: |
            忽略定子电阻时，转矩随转差率的变化可以近似写成（克洛斯公式）

            $$\frac{T}{T_{max}} = \frac{2}{s/s_m + s_m/s}$$

            $s_m \approx R_2'/X$ 是临界转差率（$X$ 是总漏抗），最大转矩 $T_{max}$ 和转子电阻无关。$0 < s < s_m$ 是稳定运行段，额定点在这里；$s = 1$ 处是起动转矩。绕线转子电机串电阻可以加大 $s_m$，提高起动转矩；鼠笼转子用两端短路环连起导条，结构简单可靠，用深槽或双笼来提高起动转矩。
      - item:
          id: kloss
          type: number
          prompt: 一台感应电动机临界转差率 $s_m = 0.2$，在转差率 0.04 下运行。用克洛斯公式估算，此时转矩是最大转矩的多少倍？（保留三位小数）
          answer: 0.385
          tolerance: 0.0005
          hint: 先算 $s/s_m$ 和 $s_m/s$。
          explain: $s/s_m = 0.2$，$s_m/s = 5$，$T/T_{max} = 2/5.2 \approx 0.385$。
      - item:
          id: starting-torque
          type: number
          prompt: 一台感应电动机临界转差率 $s_m = 0.25$。用克洛斯公式估算，起动转矩是最大转矩的多少倍？（保留三位小数）
          answer: 0.471
          tolerance: 0.0005
          hint: 起动时转差率是多少？
          explain: $s = 1$：$2/(1/0.25 + 0.25/1) = 2/4.25 \approx 0.471$。
      - card:
          title: 单相电动机
          body: |
            家用的风扇、洗衣机常用单相感应电动机。只有一个绕组时，它产生的是方向不变、大小脉动的磁场，可以看成两个大小相等、反向旋转的磁场之和，静止时两者的转矩抵消，没有起动转矩。

            解决办法是加一个在空间上错开 90° 的辅助绕组，并串一个电容，使它的电流和主绕组电流相位错开，两者合成旋转磁场，电机就能自己起动。起动后辅助绕组可以断开（电容起动），也可以一直接着（电容运转）。
      - item:
          id: single-phase
          type: choice
          prompt: 一台电容运转的单相风扇电机，电容坏了（开路）。通电后它会怎样？
          options:
            - text: 嗡嗡响不转，拨一下才转
              correct: true
            - text: 正常转，只是慢一点
              why: 电容开路后辅助绕组里没有电流，只剩主绕组的脉动磁场，静止时两个反向旋转分量的转矩抵消
            - text: 立即反转，朝和原来相反的方向转
              why: 脉动磁场对两个方向的转矩相等，不会自己选择方向
          explain: 单个绕组的脉动磁场没有起动转矩，但一旦转起来，同向旋转的那个分量占优，电机能继续转下去，方向由你拨的方向决定。

  # ==== 电力拖动的稳态特性 ====
  - id: drive-steady-state
    chapter: 电力拖动的稳态特性
    title: 电力拖动的运动方程和稳定运行
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 风机的转速从 1000 r/min 降到 500 r/min，它需要的转矩大约变成原来的多少？
          options:
            - text: 四分之一
              correct: true
            - text: 一半
              why: 风机的转矩大致和转速的平方成正比，转速减半，转矩变成四分之一
            - text: 不变
              why: 那是起重机、传送带这类恒转矩负载的特点
          explain: 不同的负载，转矩随转速变化的规律不同。这一课讲电机和负载配在一起时，系统在哪里稳定运行。
      - card:
          title: 运动方程和负载特性
          body: |
            电机带动负载时，转动部分遵循 $T_e - T_L = J\frac{d\omega}{dt}$：电磁转矩大于负载转矩就加速，小于就减速，相等时匀速运行。

            常见的负载转矩特性有三类：恒转矩负载，转矩和转速无关，如起重机、传送带；风机、泵类负载，转矩大致和转速的平方成正比，功率和转速的三次方成正比；恒功率负载，转矩和转速成反比，如卷绕机、机床的高速段。
      - item:
          id: fan-torque
          type: number
          prompt: 一台风机在 1500 r/min 时需要 40 N·m 的转矩。转速降到 1200 r/min 时约需要多少牛·米？
          answer: 25.6
          tolerance: 0.05
          unit: N·m
          hint: 风机的转矩和转速的几次方成正比？
          explain: $40 \times (1200/1500)^2 = 40 \times 0.64 = 25.6$ N·m，功率降到原来的 $0.8^3 \approx 51\%$。
      - card:
          title: 稳定运行的条件
          body: |
            电机的机械特性（转矩随转速的曲线）和负载特性的交点是工作点。交点处还要满足：负载转矩随转速的变化率大于电机转矩的变化率，即

            $$\frac{dT_L}{dn} > \frac{dT_e}{dn}$$

            这样转速稍升高时，净转矩 $T_e - T_L$ 变成负的，系统减速回来；转速降低时反过来。感应电机在 $0 < s < s_m$ 段电机转矩随转速升高而下降，带恒转矩负载时满足这个条件；在 $s > s_m$ 段则可能不稳定。
      - item:
          id: stability-condition
          type: choice
          prompt: 一台电机带恒转矩负载。下面哪个工作点是稳定的？
          options:
            - text: 工作点处电机转矩随转速升高而减小
              correct: true
            - text: 工作点处电机转矩随转速升高而增大
              why: 转速稍升，电机转矩变得比恒定的负载转矩大，继续加速，偏离越来越远
            - text: 只要电机转矩等于负载转矩就一定稳定
              why: 相等只说明是平衡点，还要看偏离后能不能回来
          explain: 恒转矩负载 $\frac{dT_L}{dn} = 0$，稳定要求 $\frac{dT_e}{dn} < 0$。
      - card:
          title: 直流电动机的机械特性和调速
          body: |
            他励直流电动机由 $V = k\Phi\omega + I_aR_a$ 和 $T = k\Phi I_a$ 得机械特性

            $$\omega = \frac{V}{k\Phi} - \frac{R_a}{(k\Phi)^2}T$$

            是一条略向下倾斜的直线。调速方法：降低电枢电压，特性平行下移，从额定转速往下调，可以输出额定转矩（恒转矩调速）；减弱磁场，转速升到额定以上，转矩能力下降（恒功率调速）；电枢串电阻，特性变软，电阻上耗能，不经济。制动可以用能耗制动（电枢接电阻）、回馈制动（把能量送回电网）或反接制动。
      - item:
          id: dc-speed
          type: number
          prompt: 他励直流电动机 $V = 220$ V，$k\Phi = 2$ V·s/rad，$R_a = 0.5\ \Omega$，负载转矩 40 N·m。稳态角速度是多少弧度每秒？
          answer: 105
          unit: rad/s
          hint: 先由转矩求电枢电流。
          explain: $I_a = 40/2 = 20$ A，$\omega = (220 - 20 \times 0.5)/2 = 105$ rad/s，约 1003 r/min。
      - item:
          id: dc-half-voltage
          type: number
          prompt: 他励直流电动机 $k\Phi = 2$ V·s/rad，$R_a = 0.5\ \Omega$，负载转矩 40 N·m 不变。把电枢电压从 220 V 降到 110 V，稳态角速度是多少弧度每秒？
          answer: 50
          unit: rad/s
          hint: 转矩不变，电枢电流变不变？
          explain: $I_a$ 仍是 20 A，$\omega = (110 - 10)/2 = 50$ rad/s。电压减半，转速比一半还低一点，因为电阻压降不变。

  # ==== 变频调速与矢量控制初步 ====
  - id: vf-control
    chapter: 变频调速与矢量控制初步
    title: 变频调速和恒压频比控制
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 想让感应电动机转慢一些，把电源频率从 50 Hz 降到 25 Hz，但电压保持 380 V 不变。会出什么问题？
          options:
            - text: 铁芯饱和，电流大增
              correct: true
            - text: 没问题，只是转速减半
              why: 电压一定时磁通和频率成反比，频率减半磁通就要翻倍
            - text: 电机会反转，因为三相接到绕组的先后顺序变了
              why: 转向由三相接到绕组的先后顺序决定，和频率高低无关
          explain: 由 $E = 4.44fN\Phi$，降频时必须同时降压，才能保持磁通不变。这就是恒压频比控制。
      - card:
          title: 变频器
          body: |
            通用变频器是交-直-交结构：先用整流器把电网交流变成直流，经直流母线电容滤波，再用逆变器把直流变成电压和频率都可调的三相交流。逆变器用功率开关按脉宽调制（PWM）的规律通断，输出电压的基波可以连续调节。

            感应电机的转速 $n = \frac{60f}{p}(1 - s)$，转差率很小，所以改变频率就近似按比例改变转速，而且效率高，这是变频调速被广泛使用的原因。
      - item:
          id: vf-speed
          type: number
          prompt: 一台 4 极感应电动机由变频器供电，输出 30 Hz，转差频率（$sf$）是 1.5 Hz。转子转速是多少转每分？
          answer: 855
          unit: r/min
          hint: 转子转速对应的频率是多少？
          explain: 转子的电频率 $30 - 1.5 = 28.5$ Hz，$n = 60 \times 28.5/2 = 855$ r/min。
      - card:
          title: 恒压频比和转矩提升
          body: |
            额定频率以下，按 $V/f$ 等于常数调压，磁通基本不变，电机能输出接近额定的转矩。例：380 V、50 Hz 的电机降到 25 Hz 时，电压调到 190 V。额定频率以上，电压已经到额定值不能再升，磁通随频率升高而减弱，进入恒功率区。

            低频时电压低，定子电阻上的压降占的比例变大，实际磁通会减弱、转矩不足，所以要在低频段适当多给一点电压，叫转矩提升。更进一步的转差频率控制让转差频率保持在给定值：磁通不变时，转矩近似和转差频率成正比。
      - item:
          id: vf-voltage
          type: number
          prompt: 一台 400 V、50 Hz 的感应电动机按恒压频比变频调速。运行在 30 Hz 时电压应调到多少伏？
          answer: 240
          unit: V
          hint: 电压和频率的比值保持多少？
          explain: $400 \times 30/50 = 240$ V。
      - item:
          id: torque-boost
          type: choice
          prompt: 按严格的恒压频比调到 5 Hz 时，电机带不动额定负载。最可能的原因和办法是什么？
          options:
            - text: 磁通不足；低频提升电压
              correct: true
            - text: 频率太低，电机已经饱和；应再降低电压
              why: 低频时的问题是磁通不足，而不是饱和，降压会更糟
            - text: 变频器的最高频率设得太低
              why: 问题出在低频段，与最高频率无关
          explain: 低频时 $V$ 很小，$I_1R_1$ 压降相对变大，真正加在励磁上的电压不够，磁通下降、转矩不足。转矩提升就是补上这部分压降。

  - id: vector-control
    chapter: 变频调速与矢量控制初步
    title: 坐标变换和矢量控制
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 他励直流电机的磁场和转矩可以用两个电流分别控制，所以调速性能很好。感应电机只有定子三相电流，能不能也做到这样？
          options:
            - text: 能，分解定子电流
              correct: true
            - text: 不能，感应电机只能用恒压频比
              why: 恒压频比只控制稳态；矢量控制能分别控制磁通和转矩，动态性能接近直流电机
            - text: 能，只要把定子电流加大到足够大就行
              why: 关键不在电流大小，而在于把它按磁场方向分解开来分别控制
          explain: 矢量控制把交流电机的三相电流变换到一个随磁场旋转的坐标里，在那里它们变成两个直流量，像直流电机一样分别控制。
      - card:
          title: 克拉克变换和派克变换
          body: |
            三相电流 $i_a, i_b, i_c$（和为零）可以等效成两相静止坐标里的 $i_\alpha$、$i_\beta$（克拉克变换，等幅值形式）：

            $$i_\alpha = i_a,\qquad i_\beta = \frac{i_a + 2i_b}{\sqrt3}$$

            再转到以角度 $\theta$ 旋转的 $d$、$q$ 坐标（派克变换）：$i_d = i_\alpha\cos\theta + i_\beta\sin\theta$，$i_q = -i_\alpha\sin\theta + i_\beta\cos\theta$。坐标和电流同步旋转时，三相正弦电流变成两个不变的直流量。
      - card:
          title: 例题：变换后是常数
          body: 三相电流 $i_a = 10\cos\theta$，$i_b = 10\cos(\theta - 120°)$，坐标转角就取 $\theta$。分别在 $\theta = 0$ 和 $\theta = 90°$ 时求 $i_d$、$i_q$。
          reveal:
            - title: 第 1 步：θ = 0
              body: $i_a = 10$，$i_b = -5$；$i_\alpha = 10$，$i_\beta = (10 - 10)/\sqrt3 = 0$；$i_d = 10$，$i_q = 0$。
            - title: 第 2 步：θ = 90°
              body: $i_a = 0$，$i_b = 10\cos(-30°) \approx 8.66$；$i_\alpha = 0$，$i_\beta = 2 \times 8.66/\sqrt3 = 10$；$i_d = 0 + 10 \times 1 = 10$，$i_q = 0$。
            - title: 第 3 步：结论
              body: 两个时刻 $i_d$ 都是 10、$i_q$ 都是 0：在同步旋转的坐标里，交流电流变成了直流量。
      - item:
          id: clarke
          type: number
          prompt: 某一时刻三相电流 $i_a = 5$ A，$i_b = 5$ A，$i_c = -10$ A。按等幅值克拉克变换，$i_\beta$ 是多少安？（保留两位小数）
          answer: 8.66
          tolerance: 0.005
          unit: A
          hint: $i_\beta$ 由哪两相电流算出？$i_c$ 为什么不用？
          explain: $i_\beta = (5 + 10)/\sqrt3 \approx 8.66$ A，$i_\alpha = 5$ A。
      - card:
          title: 磁场定向
          body: |
            把 $d$ 轴对准转子磁链的方向，叫磁场定向。这时 $i_d$ 只负责建立磁通，像直流电机的励磁电流；$i_q$ 只负责产生转矩，转矩和磁链乘 $i_q$ 成正比，像直流电机的电枢电流。控制器分别调节 $i_d$、$i_q$，再反变换回三相，由逆变器输出。

            难点在于要知道磁链的角度：感应电机常由测得的电流和转速通过模型推算；永磁同步电机的磁链跟着转子，用位置传感器直接得到，常取 $i_d = 0$，只用 $i_q$ 控制转矩。
      - item:
          id: iq-torque
          type: number
          prompt: 一台矢量控制的电机磁链保持不变，$i_q = 4$ A 时转矩 2 N·m。把 $i_q$ 调到 6 A，转矩是多少牛·米？
          answer: 3
          unit: N·m
          hint: 磁链不变时，转矩和 $i_q$ 是什么关系？
          explain: 转矩和 $i_q$ 成正比，$2 \times 6/4 = 3$ N·m。
      - item:
          id: foc-roles
          type: choice
          prompt: 磁场定向控制中，想在磁通不变的情况下让转矩迅速增大，应该调哪个量？
          options:
            - text: 增大转矩分量 $i_q$
              correct: true
            - text: 增大 $i_d$
              why: $i_d$ 决定磁通；增大它会加强磁场，而且磁通变化有延迟，不能迅速改变转矩
            - text: 提高输出频率
              why: 提高频率会让电机加速，而不是在原转速下立刻增大转矩；转矩由 $i_q$ 决定
          explain: $i_q$ 是转矩分量，磁通保持不变时转矩随 $i_q$ 立即改变，这正是矢量控制动态响应快的原因。

boss:
  items:
    - id: b-magnetic
      type: number
      prompt: 一个磁路的磁阻是 $4 \times 10^5$ A/Wb，线圈 100 匝，电流 2 A。磁通是多少毫韦伯？
      answer: 0.5
      unit: mWb
      hint: 先算磁动势，再想磁通和磁阻是什么关系。
      explain: $\Phi = 100 \times 2/(4 \times 10^5) = 5 \times 10^{-4}$ Wb。
    - id: b-transformer
      type: number
      prompt: 一台 50 kVA、10000/400 V 的单相变压器，低压侧额定电流是多少安？
      answer: 125
      unit: A
      hint: 额定电流等于额定容量除以哪一侧的电压？
      explain: $I_2 = 50000/400 = 125$ A；高压侧 5 A。
    - id: b-dc
      type: number
      prompt: 他励直流电动机端电压 440 V，电枢电阻 0.8 Ω，电枢电流 30 A 时转速 1000 r/min。电磁转矩约是多少牛·米？（保留一位小数）
      answer: 119.2
      tolerance: 0.05
      unit: N·m
      hint: 先求反电动势和 $k\Phi$。
      explain: $E = 440 - 24 = 416$ V，$\omega \approx 104.72$ rad/s，$k\Phi \approx 3.972$，$T \approx 119.2$ N·m。
    - id: b-sync
      type: number
      prompt: 一台隐极同步发电机每相电压 240 V，励磁电动势 300 V，同步电抗 8 Ω，功角 30°。三相输出功率是多少千瓦？
      answer: 13.5
      unit: kW
      hint: 代入功角特性。
      explain: $P = 3 \times 240 \times 300 \times 0.5/8 = 13500$ W。
    - id: b-excitation
      type: choice
      prompt: 一台同步电动机在恒定负载下运行，把励磁电流从很小逐渐调大。电枢电流和功率因数怎样变化？
      options:
        - text: 电流先减后增，功率因数由滞后变超前
          correct: true
        - text: 电枢电流一直增大，功率因数一直滞后
          why: 欠励时电流里有滞后的无功分量，调大励磁先让它减小，过了功率因数为 1 的点才变成超前的无功分量
        - text: 电枢电流不变，只有转速升高
          why: 同步电动机转速不随励磁变化，变化的是电枢电流的无功分量
        - text: 电枢电流一直减小，功率因数一直超前
          why: 励磁太大时会发出大量无功，电流又会增大，这就是 V 形曲线右半边
      explain: 这就是 V 形曲线：功率因数为 1 时电枢电流最小，左边欠励滞后，右边过励超前。
    - id: b-stepper
      type: number
      prompt: 一台四相反应式步进电机，转子有 6 个齿，整步运行。转一圈需要多少个脉冲？
      answer: 24
      hint: 先求步距角。
      explain: 步距角 $360°/(4 \times 6) = 15°$，一圈 24 步。
    - id: b-slip
      type: number
      prompt: 一台 4 极、60 Hz 的感应电动机以 1740 r/min 运行。转子电流频率是多少赫兹？
      answer: 2
      unit: Hz
      hint: 先求转差率。
      explain: $n_s = 1800$，$s = 60/1800 \approx 0.0333$，$f_2 = 60s = 2$ Hz。
    - id: b-induction-torque
      type: number
      prompt: 一台 6 极、50 Hz 的感应电动机电磁功率 15 kW，转差率 0.03。电磁转矩约是多少牛·米？（保留一位小数）
      answer: 143.2
      tolerance: 0.05
      unit: N·m
      hint: 电磁转矩等于电磁功率除以哪个角速度？
      explain: $\omega_s = 1000 \times 2\pi/60 \approx 104.72$ rad/s，$T = 15000/104.72 \approx 143.2$ N·m。
    - id: b-stability
      type: choice
      prompt: 一台感应电动机带风机负载，工作点落在转矩—转差率曲线的稳定段。转速因扰动略微下降后，会发生什么？
      options:
        - text: 电机转矩增大、负载转矩减小，转速回升
          correct: true
        - text: 电机转矩减小，转速继续下降直到停转
          why: 稳定段里转速下降（转差率增大）时电机转矩是增大的
        - text: 电机转矩和负载转矩都不变，转速停在新的值
          why: 风机的转矩随转速变化，电机转矩也随转差率变化，两者都会变
        - text: 转速振荡，越振越大
          why: 稳定段满足 $\frac{dT_L}{dn} > \frac{dT_e}{dn}$，偏离会被纠正而不会放大
      explain: 稳定段里，转速下降时电机转矩上升，风机转矩下降，电机转矩大于负载转矩，系统加速回到原工作点。
    - id: b-vf
      type: number
      prompt: 一台 460 V、60 Hz 的感应电动机按恒压频比变频调速，运行在 45 Hz。电压应调到多少伏？
      answer: 345
      unit: V
      hint: 电压和频率成正比。
      explain: $460 \times 45/60 = 345$ V。
    - id: b-vector
      type: choice
      prompt: 下面关于矢量控制的说法，哪个是对的？
      options:
        - text: $i_d$ 管磁通，$i_q$ 管转矩
          correct: true
        - text: 矢量控制只调输出电压和频率的比值
          why: 那是恒压频比控制；矢量控制分别控制两个电流分量
        - text: $i_d$ 越大，转矩就越大
          why: $i_d$ 决定磁通；磁场定向后转矩由 $i_q$ 直接控制，靠加大 $i_d$ 调转矩既慢又容易饱和
        - text: 变换到 $d$、$q$ 坐标后电流仍是正弦量
          why: 坐标和电流同步旋转时，稳态电流变成直流量
      explain: 磁场定向后 $i_d$、$i_q$ 分别对应直流电机的励磁电流和电枢电流，可以分开快速调节。
