skill: E.2.3
version: 2
authors: [main-agent]
brief:
  why: 打电话、看视频、连 Wi-Fi，都要把信息变成信号，穿过有噪声的信道送到远处，再尽量不出错地还原。这一关讲这条路上的每一环：信号和噪声怎样描述，模拟调制和数字调制怎样把信息放到载波上，码间干扰和奈奎斯特准则限制了能传多快，匹配滤波和最佳判决决定了误码率，信道编码和同步让接收机真正工作起来。假设你学过信号与系统（傅里叶变换、频谱、卷积、采样定理）和概率论（随机变量、正态分布、期望和方差）。
  outcomes:
    - 画出数字通信系统的框图，算码元速率、信息速率、误码率和香农信道容量
    - 用功率谱密度描述噪声，算热噪声功率，说出 AWGN 信道模型的假设
    - 算 AM、DSB、SSB、FM 的带宽和输出信噪比，说出包络检波和相干解调的区别
    - 用奈奎斯特准则和升余弦滚降算码元速率和带宽，看懂眼图
    - 说出匹配滤波器为什么是最佳接收，用 Q 函数算 BPSK、FSK、DPSK 等的误码率
    - 算 QAM、PSK 的比特率和频带利用率，比较各种数字调制
    - 用汉明码、循环码、卷积码检错纠错，说出载波同步、码元同步、帧同步怎样实现
terms:
  - term: 调制
    def: '把要传的信息放到载波的幅度、频率或相位上，使信号适合在信道里传输'
  - term: 零点
    def: '函数值为零的点；对频谱，指功率谱降到零的频率'
  - term: 载波
    def: '用来携带信息的固定频率的正弦波，调制就是改变它的幅度、频率或相位'
  - term: 基带
    def: '调制之前原始信号所占的频段，集中在零频附近；这样的信号叫基带信号'
  - term: 码元
    def: '数字信号里每个固定时长的波形单元，一个码元可以携带 1 个或多个比特'
  - term: 码元速率
    def: '每秒传送的码元个数，单位波特（Baud）'
  - term: 信息速率
    def: '每秒传送的比特数，单位 b/s；M 进制时等于码元速率乘以 log₂M'
  - term: 误码率
    def: '传错的码元（或比特）个数占传送总数的比例，是可靠性指标'
  - term: 信息量
    def: '一个事件发生带来的信息 I = log₂(1/p) 比特，越不可能的事件信息量越大'
  - term: 熵
    def: '信源每个符号平均的信息量 H = Σ p log₂(1/p)，单位比特/符号'
  - term: 信噪比
    def: '信号功率和噪声功率之比 S/N，常用 dB 表示'
  - term: 信道容量
    def: '信道能无差错传输的最高信息速率；加性高斯白噪声信道 C = B log₂(1 + S/N)'
  - term: dBm
    def: '以 1 mW 为基准的功率分贝数：10 log₁₀(P / 1 mW)，0 dBm 就是 1 mW'
  - term: 随机过程
    def: '随时间变化的随机信号：任一时刻的取值是一个随机变量，所有可能的波形合起来描述它'
  - term: 平稳
    def: '随机过程的均值不随时间变、自相关只和时间差有关（广义平稳）'
  - term: 自相关函数
    def: '平稳过程相隔 τ 的两个取值乘积的期望 R(τ) = E[X(t)X(t+τ)]，R(0) 是平均功率'
  - term: 白噪声
    def: '功率谱密度在所有频率上相同的噪声，双边谱 N₀/2，不同时刻的取值互不相关'
  - term: 加性高斯白噪声
    def: '和信号相加、功率谱平坦、幅度服从零均值正态分布、与信号独立的噪声，简称 AWGN'
  - term: 复包络
    def: '带通信号 v(t) = Re{g(t)e^{j2πf_c t}} 中的低通复信号 g(t)，模是包络、辐角是相位'
  - term: 调频指数
    def: '单音调频时最大频偏和调制频率之比 β = Δf/f_m'
  - term: 脉冲编码调制
    def: '把采样值量化后编成 n 位二进制传输的方法，简称 PCM，速率 n f_s'
  - term: 码间干扰
    def: '其他码元的脉冲拖尾在本码元判决时刻造成的干扰，简称 ISI'
  - term: 眼图
    def: '把接收波形按码元周期叠加显示得到的图形，张开越大，噪声和定时的余量越大'
  - term: 匹配滤波器
    def: '冲激响应为 s(T − t) 的滤波器，在白噪声中使采样时刻输出信噪比最大，达到 2E/N₀'
  - term: Q 函数
    def: '标准正态随机变量大于 x 的概率 Q(x)，用来写高斯噪声下的误码率'
  - term: 星座图
    def: '把各码元的复包络画成平面上的点得到的图，点间距离决定抗噪声能力'
  - term: 汉明距离
    def: '两个等长码字对应位不同的个数'
  - term: 循环
    def: '这里指循环移位：把码字最后一位挪到最前面，其余各位依次后移一位'
  - term: 循环码
    def: '任一码字循环移位后仍是码字的线性分组码，由生成多项式决定，CRC 是它的检错用法'
  - term: 锁相环
    def: '由鉴相器、环路滤波器和压控振荡器组成的反馈环，锁定后输出跟踪输入的频率和相位'
assumes: []
lessons:
  - id: system-model
    chapter: 通信系统模型
    title: 通信系统的组成和指标
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 同一段音乐分别用模拟方式和数字方式传过很长一段线路，中途经过很多个中继放大站。哪一种到终点时更接近原样？
          options:
            - text: 模拟方式，因为它不用把声音切成一个个数
              why: 模拟信号每经过一站，噪声也被一起放大，越积越多
            - text: 数字方式
              correct: true
            - text: 两者一样，噪声都会叠加
              why: 数字信号在中继站可以判决后重新生成干净的 0 和 1，噪声不会一路累积
          explain: 数字信号只有几种可能的取值，中继站只要判断出是哪一种，就能重新产生干净的信号，这叫再生。模拟信号做不到，噪声会一站一站累积。
      - card:
          title: 模拟信源和数字信源
          body: |
            话筒输出的电压随时间连续变化，可以取任意值，这是模拟信号；计算机文件是一串 0 和 1，只有有限种取值，这是数字信号。模拟信号经过采样和量化可以变成数字信号。

            数字通信的好处：中继站可以再生，噪声不累积；容易加密、纠错；声音、图片、数据都变成比特，用同一套设备传。代价是通常要占更宽的频带，还要收发双方保持同步。
      - card:
          title: 数字通信系统的框图
          body: |
            一个数字通信系统从发到收经过这些环节：

            信源 → 信源编码 → 信道编码 → **调制（modulation）** → 信道（加入噪声）→ 解调 → 信道译码 → 信源译码 → 信宿

            信源编码把信息压缩成尽量少的比特；信道编码反过来加一些多余的比特，用来发现和改正错误；调制把比特变成适合信道的波形，比如放到某个频率的载波上。**载波（carrier）**就是一个固定频率的正弦波，信息放在它的幅度、频率或相位上，接收端才知道去哪个频率找这段信号。接收端按相反的顺序还原。
      - item:
          id: block-order
          type: order
          prompt: 把数字通信系统里信号最先经过的五个环节按先后排好。
          steps:
            - 信源
            - 信源编码
            - 信道编码
            - 调制
            - 信道
          explain: 先压缩（信源编码），再加纠错用的冗余（信道编码），最后变成波形（调制）送进信道。顺序反了就会把纠错用的冗余也压缩掉。
      - card:
          title: 频段和电磁波的传播
          body: |
            无线电的频率由国际电信联盟和各国管理机构分配，不同业务用不同频段。波长 $\lambda = c/f$，频率不同，传播方式也不同：

            | 频段 | 频率 | 主要传播方式 |
            |---|---|---|
            | 中波（MF） | 0.3–3 MHz | 地波，沿地面绕射 |
            | 短波（HF） | 3–30 MHz | 天波，靠电离层反射传得很远 |
            | 超短波（VHF） | 30–300 MHz | 视距，直线传播 |
            | 微波 | 300 MHz 以上 | 视距，直线传播 |

            视距传播受地球曲率限制。考虑大气折射时，高 $h$ 米的天线到地面接收点的视距约 $d \approx 4.12\sqrt h$ km。所以电视塔、基站天线要架高。
      - item:
          id: los-100
          type: number
          prompt: '一座电视发射塔的天线高 100 m，按 $d \approx 4.12\sqrt h$ km 估算，它到地面接收点的视距约多少千米？（保留到个位）'
          answer: 41
          tolerance: 0.5
          hint: √100 是多少？
          explain: d ≈ 4.12 × √100 ≈ 41 km。天线高度变成 4 倍，视距只变成 2 倍。
      - card:
          title: 有效性和可靠性
          body: |
            衡量数字通信系统主要看两件事。有效性：每秒传多少。每秒传的**码元（symbol）**个数叫**码元速率（symbol rate）**，单位波特（Baud）；每秒传的比特数叫**信息速率（bit rate）**，单位 b/s。一个码元有 $M$ 种可能时携带 $\log_2 M$ 比特，

            $$R_b = R_s\log_2 M$$

            这里 $R_s$ 是码元速率，$R_b$ 是信息速率。

            可靠性：传错多少。传错的码元占总数的比例叫**误码率（symbol error rate）**，按比特算就是误比特率。两者常常此消彼长：传得越快，越容易出错。
      - item:
          id: rate-4ary
          type: number
          prompt: 某系统每个码元有 4 种可能的波形，码元速率 2400 Baud。信息速率是多少 b/s？
          answer: 4800
          hint: 4 种可能的码元，每个携带几比特？
          explain: log₂4 = 2，R_b = 2400 × 2 = 4800 b/s。
      - item:
          id: ser
          type: number
          prompt: '某系统连续传了 $10^6$ 个码元，接收端发现其中 12 个错了。误码率是多少？（单位 $10^{-5}$）'
          answer: 1.2
          tolerance: 0.001
          hint: 错的个数除以总数。
          explain: 12 / 10⁶ = 1.2 × 10⁻⁵。
      - item:
          id: digital-why
          type: choice
          prompt: 长途光纤和卫星链路几乎都用数字传输。下面哪一条是数字传输相对模拟传输的真实优势？
          options:
            - text: 中继站可以判决再生，噪声不会一站一站累积
              correct: true
            - text: 同样的内容，数字信号占用的频带总是比模拟信号窄
              why: 恰好相反，不压缩时数字信号通常占更宽的频带，这是它的代价
            - text: 数字信号不受噪声影响
              why: 噪声照样叠加在数字信号上；数字的好处是只要噪声不大到判错，就能把它去掉
          explain: 再生是数字传输最根本的优势；另外还容易纠错、加密，各种业务能统一传输。

  - id: information-capacity
    chapter: 通信系统模型
    title: 信息量、熵和信道容量
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 朋友告诉你一次抛硬币的结果，另一个朋友告诉你一次掷骰子的结果。哪一条消息带给你的信息更多？
          options:
            - text: 抛硬币的结果
              why: 硬币只有 2 种等可能的结果，骰子有 6 种，猜中骰子更难
            - text: 两条一样多，都只是一个结果
              why: 信息多少看消除了多少不确定，骰子的不确定更大
            - text: 掷骰子的结果
              correct: true
          explain: 结果越难猜，知道它以后消除的不确定越多，得到的信息越多。
      - card:
          title: 信息量
          body: |
            一个概率为 $p$ 的事件发生了，它带来的**信息量（information）**定义为

            $$I = \log_2\frac1p\ \text{比特}$$

            必然发生的事件（$p = 1$）信息量为 0；抛硬币得到正面（$p = 1/2$）是 1 比特；从 8 个等可能的结果里得知是哪一个，是 $\log_2 8 = 3$ 比特。两个独立事件同时发生，概率相乘，信息量相加。
      - item:
          id: info-16
          type: number
          prompt: 一个信源每次从 16 个等可能的符号里发出一个。得知发出的是哪一个，得到多少比特的信息？
          answer: 4
          hint: 每个符号的概率是 1/16。
          explain: I = log₂16 = 4 比特。
      - card:
          title: 熵
          body: 各个符号概率不同时，平均每个符号带来的信息量叫**熵（entropy）**：$H = \sum_i p_i\log_2\frac{1}{p_i}$，单位比特/符号。$M$ 个符号等概率时熵最大，等于 $\log_2 M$。
          reveal:
            - title: 第 1 步：每个符号的信息量
              body: |
                信源有 A、B、C、D 四个符号，概率 1/2、1/4、1/8、1/8，信息量分别是 1、2、3、3 比特。
            - title: 第 2 步：按概率加权平均
              body: |
                $H = \frac12 \times 1 + \frac14 \times 2 + \frac18 \times 3 + \frac18 \times 3 = 1.75$ 比特/符号。
            - title: 第 3 步：和等概率比较
              body: |
                四个符号等概率时 $H = 2$。概率不均匀时熵更小，所以可以用平均不到 2 比特的编码表示这个信源，这就是信源编码能压缩的原因。
      - item:
          id: entropy-3
          type: number
          prompt: 信源有三个符号，概率分别是 1/2、1/4、1/4。它的熵是多少比特/符号？
          answer: 1.5
          hint: 三个符号的信息量分别是几比特？
          explain: H = ½ × 1 + ¼ × 2 + ¼ × 2 = 1.5 比特/符号。
      - item:
          id: rate-8ary
          type: number
          prompt: 一个信源从 8 个等概率的符号里每秒发出 1000 个。它的信息速率是多少 b/s？
          answer: 3000
          hint: 先求每个符号的信息量。
          explain: 每个符号 log₂8 = 3 比特，1000 × 3 = 3000 b/s。
      - card:
          title: 香农信道容量
          body: |
            带宽 $B$、受加性高斯白噪声干扰的信道，**信道容量（channel capacity）**是

            $$C = B\log_2\left(1 + \frac SN\right)\ \text{b/s}$$

            $S/N$ 是**信噪比（signal-to-noise ratio）**，用功率之比，不是 dB。香农证明：信息速率低于 $C$ 时，总有编码方法让误码率任意小；高于 $C$ 时做不到。一个达到 $C$ 的系统叫理想通信系统，实际系统只能接近它。
          reveal:
            - title: 第 1 步：把 dB 换成倍数
              body: |
                电话信道带宽 3 kHz，信噪比 30 dB：$S/N = 10^{30/10} = 1000$。
            - title: 第 2 步：算对数
              body: |
                $\log_2 1001 \approx 9.97$。
            - title: 第 3 步：乘带宽
              body: |
                $C \approx 3000 \times 9.97 \approx 29.9$ kb/s。老式拨号上网的 28.8 kb/s 已经很接近这个界限。
      - item:
          id: capacity-1m
          type: number
          prompt: '某信道带宽 1 MHz，信噪比 20 dB。香农信道容量是多少 Mb/s？（保留两位小数）'
          answer: 6.66
          tolerance: 0.005
          hint: 20 dB 是多少倍？
          explain: S/N = 100，C = 10⁶ × log₂101 ≈ 6.66 Mb/s。把 20 直接代进公式会得到 4.39，这是忘了把 dB 换成倍数。
      - item:
          id: snr-2b
          type: number
          prompt: '要让信道容量等于带宽的 2 倍（$C = 2B$），信噪比至少要多少 dB？（保留两位小数）'
          answer: 4.77
          tolerance: 0.005
          hint: log₂(1 + S/N) = 2，先解出 S/N。
          explain: 1 + S/N = 4，S/N = 3，10 log₁₀3 ≈ 4.77 dB。
      - item:
          id: bandwidth-double
          type: choice
          prompt: 信号功率和噪声的功率谱密度都不变，把信道带宽加倍。信道容量怎样变？
          options:
            - text: 正好加倍
              why: 带宽加倍时进来的噪声功率也加倍，信噪比下降，所以对数那一项变小
            - text: 增大，但不到原来的 2 倍
              correct: true
            - text: 不变，容量只由信噪比决定
              why: 公式里 B 在对数外面，带宽变了容量一定变
          explain: 噪声功率 N = N₀B 随带宽增大，S/N 变小。带宽趋于无穷时容量趋于有限值约 1.44 S/N₀，不会无限增大。

  - id: signals-power
    chapter: 信道与噪声
    title: 信号的功率、分贝和带宽
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 通信里常用 dBm 表示功率，它把 1 mW 记作 0 dBm，每大 10 倍加 10。1 W 是多少 dBm？
          options:
            - text: 0 dBm
              why: 0 dBm 是 1 mW，1 W 是它的 1000 倍
            - text: 30 dBm
              correct: true
            - text: 1000 dBm
              why: 分贝是对数单位，1000 倍是 10 × log₁₀1000 = 30 dB，不是 1000
          explain: 1 W = 1000 mW，10 log₁₀1000 = 30，所以是 30 dBm。
      - card:
          title: 平均功率和有效值
          body: |
            电压 $v(t)$ 加在电阻 $R$ 上，平均功率是 $P = \overline{v^2}/R$，横线表示对时间求平均。通信里常把 $R$ 取 1 Ω 来比较信号，这时 $P = \overline{v^2}$，叫归一化功率。$V_{\text{rms}} = \sqrt{\overline{v^2}}$ 叫有效值（方均根值）。

            振幅 $A$ 的正弦波，$\overline{\cos^2}$ 的平均是 $\frac12$，所以 $V_{\text{rms}} = A/\sqrt2$，功率 $A^2/(2R)$。能量有限、平均功率为零的叫能量信号（一个脉冲）；平均功率有限的叫功率信号（一直持续的正弦波、噪声）。
      - item:
          id: sine-50
          type: number
          prompt: 振幅 10 V 的正弦电压加在 50 Ω 负载上。平均功率是多少瓦？
          answer: 1
          hint: 先求有效值 A/√2，再用 V²/R。
          explain: V_rms = 10/√2 ≈ 7.07 V，P = 50/50 = 1 W。用振幅直接算会得到 2 W，多了一倍。
      - card:
          title: 分贝和 dBm
          body: |
            功率比 $P_2/P_1$ 用分贝表示是 $10\log_{10}(P_2/P_1)$ dB。绝对功率常以 1 mW 为基准，写成 **dBm**：$10\log_{10}(P/1\,\text{mW})$。

            分贝的好处是乘法变加法：信号经过增益 30 dB 的放大器、再经过损耗 6 dB 的电缆，总共是 $+30 - 6 = +24$ dB。$-3$ dB 是功率减半，$+10$ dB 是 10 倍，$+20$ dB 是 100 倍。
      - item:
          id: dbm-2w
          type: number
          prompt: 一台发射机的输出功率是 2 W。合多少 dBm？（保留一位小数）
          answer: 33.0
          tolerance: 0.05
          hint: 2 W 是多少 mW？
          explain: 10 log₁₀2000 ≈ 33.0 dBm。功率翻一倍是 +3 dB，所以 1 W 的 30 dBm 加 3 dB。
      - item:
          id: db-chain
          type: number
          prompt: 天线收到的信号是 −50 dBm，先经过增益 30 dB 的放大器，再经过损耗 6 dB 的电缆。到接收机输入端是多少 dBm？
          answer: -26
          hint: 分贝的增益和损耗可以直接加减。
          explain: −50 + 30 − 6 = −26 dBm。
      - card:
          title: 带宽的几种定义
          body: |
            一个信号的频谱有多宽，常见的说法不止一种：

            - 绝对带宽：频谱不为零的范围。时间上有限长的脉冲，频谱一直延伸到无穷，绝对带宽是无穷大；
            - 3 dB 带宽：功率谱降到峰值一半处的宽度；
            - 第一零点带宽：到频谱第一个**零点（null）**，也就是频谱第一次降到零的频率为止的宽度。宽 $T$ 的矩形脉冲频谱是辛克函数，第一个零点在 $1/T$；
            - 功率带宽：包含 99% 功率的宽度。

            说一个信号“占多少带宽”时，要说清用的是哪一种。
      - item:
          id: null-bw
          type: number
          prompt: 一个宽 1 μs 的矩形脉冲，频谱第一个零点在多少 MHz？
          answer: 1
          hint: 矩形脉冲的频谱是辛克函数，它第一次过零时 fT 等于多少？
          explain: 1/(10⁻⁶ s) = 10⁶ Hz = 1 MHz。脉冲越窄，频谱越宽。
      - item:
          id: abs-bw
          type: choice
          prompt: 一个只持续 1 ms 的矩形脉冲，按哪一种定义它的带宽是无穷大？
          options:
            - text: 3 dB 带宽
              why: 功率谱降到一半的位置是确定的有限频率
            - text: 绝对带宽
              correct: true
            - text: 第一零点带宽，因为辛克函数的零点有无穷多个
              why: 第一零点带宽只看第一个零点，在 1/T = 1 kHz，是有限的
          explain: 时间上有限长的信号，频谱不可能在某个频率以外完全为零，所以绝对带宽是无穷大。实际中用 3 dB、第一零点或 99% 功率带宽。

  - id: random-processes
    chapter: 信道与噪声
    title: 随机过程和功率谱密度
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 收音机没调到电台时听到的沙沙声，是电路里的噪声。你能预测下一毫秒它的电压是多少吗？
          options:
            - text: 能，只要知道上一毫秒的电压
              why: 噪声相隔稍远的时刻几乎互不相关，前一时刻的值不能决定后一时刻
            - text: 不能预测具体的值，但能说出它的平均功率、典型的起伏范围
              correct: true
            - text: 完全无法描述
              why: 噪声虽然不能逐点预测，它的统计性质（平均、方差、频谱）很稳定，可以测量和计算
          explain: 噪声要用统计量描述：均值、方差、相关性和功率谱。描述这类信号的数学工具叫随机过程。
      - card:
          title: 随机过程
          body: |
            同一种噪声，每次测得的波形都不一样。把所有可能的波形放在一起看，就是一个**随机过程（random process）** $X(t)$：固定任一时刻 $t$，$X(t)$ 是一个随机变量，有它的均值和方差。

            两个时刻的值有多相关，用自相关来描述：$R(t_1, t_2) = E[X(t_1)X(t_2)]$。
      - card:
          title: 平稳和自相关函数
          body: |
            如果均值不随时间变，$R(t_1, t_2)$ 只和时间差 $\tau = t_2 - t_1$ 有关，这个过程叫（广义）**平稳（stationary）**，这时把

            $$R(\tau) = E[X(t)X(t + \tau)]$$

            叫**自相关函数（autocorrelation function）**。$R(0) = E[X^2]$ 就是平均功率。很多平稳过程还满足：一条波形沿时间求的平均，等于所有波形在同一时刻求的平均，这叫各态历经，于是可以用一次长时间的测量代替大量重复测量。
          reveal:
            - title: 第 1 步：写出过程
              body: |
                例：$X(t) = A\cos(\omega_0 t + \theta)$，$\theta$ 在 $[0, 2\pi)$ 上均匀分布，$A$、$\omega_0$ 是常数。
            - title: 第 2 步：求均值
              body: |
                对 $\theta$ 求平均，$\cos$ 转过一整圈的平均是 0，所以 $E[X(t)] = 0$，和 $t$ 无关。
            - title: 第 3 步：求自相关
              body: |
                $E[X(t)X(t + \tau)] = \frac{A^2}{2}\cos\omega_0\tau$，只和 $\tau$ 有关，所以平稳。$R(0) = A^2/2$，正是正弦波的功率。
      - item:
          id: r0-power
          type: number
          prompt: '平稳过程 $X(t) = 4\cos(\omega_0 t + \theta)$，$\theta$ 在 $[0, 2\pi)$ 上均匀分布。它的平均功率 $R(0)$ 是多少（归一化到 1 Ω）？'
          answer: 8
          hint: R(0) 就是平均功率。振幅为 A 的正弦波，平均功率是多少？
          explain: R(0) = 4²/2 = 8。
      - card:
          title: 功率谱密度和白噪声
          body: |
            平稳过程的功率谱密度 $S(f)$ 是自相关函数的傅里叶变换，这叫维纳–辛钦定理：

            $$S(f) = \int_{-\infty}^{\infty} R(\tau)e^{-j2\pi f\tau}\,d\tau$$

            $S(f)$ 对所有频率积分得到平均功率 $R(0)$。功率谱在所有频率上都一样的噪声叫**白噪声（white noise）**，通常写成双边谱 $S(f) = N_0/2$，它的自相关是 $\frac{N_0}{2}\delta(\tau)$：任意两个不同时刻的值都不相关。
      - item:
          id: white-lpf
          type: number
          prompt: '双边功率谱密度 $N_0/2 = 10^{-9}$ W/Hz 的白噪声，通过带宽 1 MHz 的理想低通滤波器。输出噪声功率是多少毫瓦？'
          answer: 2
          hint: 双边谱要在 −B 到 +B 上积分。
          explain: P = (N₀/2) × 2B = 10⁻⁹ × 2 × 10⁶ = 2 × 10⁻³ W = 2 mW。只积正频率会得到 1 mW，少了一半。
      - item:
          id: white-corr
          type: choice
          prompt: 白噪声的自相关函数是一个冲激。这说明什么？
          options:
            - text: 白噪声在不同时刻的取值互不相关
              correct: true
            - text: 白噪声只在 t = 0 那一刻有值
              why: 冲激在 τ = 0，说的是“时间差为零”时相关，不是噪声只在某一时刻出现
            - text: 白噪声的功率是零
              why: R(0) 是冲激，表示理想白噪声的总功率无穷大；实际噪声总在某个带宽以外衰减
          explain: R(τ) 在 τ ≠ 0 处为零，意思是相隔任意短时间的两个值都不相关。
      - item:
          id: wk-power
          type: choice
          prompt: 一个平稳过程的功率谱密度对所有频率积分，得到的是什么？
          options:
            - text: R(0)，也就是平均功率
              correct: true
            - text: 均值的平方
              why: 均值的平方只是功率里直流的那部分，对应频谱在 f = 0 处的冲激
            - text: 功率谱最高处对应的频率
              why: 积分得到的是曲线下的面积，也就是功率；峰值所在的频率要看曲线的形状，不是积分
          explain: S(f) 和 R(τ) 是一对傅里叶变换，∫S(f)df = R(0) = E[X²]。

  - id: noise-linear
    chapter: 信道与噪声
    title: 噪声通过线性系统，热噪声
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 白噪声通过一个低通滤波器。输出还是白噪声吗？
          options:
            - text: 还是，滤波器不改变噪声的性质
              why: 滤波器按 |H(f)|² 给各频率的功率加权，高频被削掉，谱不再平坦
            - text: 不是了，高频部分被削弱，谱不再平坦
              correct: true
            - text: 输出没有噪声了
              why: 通带里的噪声照样通过
          explain: 输出功率谱等于输入功率谱乘以 |H(f)|²，白噪声经过低通以后变成有色噪声，总功率也变成有限的。
      - card:
          title: 随机过程通过线性系统
          body: |
            平稳过程通过频率响应为 $H(f)$ 的线性时不变系统，输出仍是平稳过程，功率谱

            $$S_y(f) = |H(f)|^2 S_x(f)$$

            白噪声输入时，输出功率是 $\frac{N_0}{2}\int|H(f)|^2df$。把它写成 $N_0 B_N|H(0)|^2$，$B_N$ 叫等效噪声带宽：一个高度 $|H(0)|$、宽 $B_N$ 的理想低通，放进去的噪声和原滤波器一样多。RC 低通的 $B_N = \frac\pi2 f_{3\text{dB}}$，比 3 dB 带宽宽一些。
      - item:
          id: rc-noise-bw
          type: number
          prompt: 'RC 低通滤波器的 3 dB 带宽是 10 kHz。它的等效噪声带宽是多少 kHz？（保留一位小数）'
          answer: 15.7
          tolerance: 0.05
          hint: RC 低通的噪声带宽比 3 dB 带宽宽还是窄？卡里给的比例是多少？
          explain: B_N = 1.571 × 10 ≈ 15.7 kHz。RC 低通的边缘下降得慢，放进来的噪声比同样 3 dB 带宽的理想低通多。
      - card:
          title: 高斯过程和 AWGN 信道
          body: |
            正态分布也叫高斯分布。任意几个时刻的取值都服从联合正态分布的随机过程叫高斯过程。电阻里大量电子的随机运动叠加起来，按中心极限定理就是高斯的；高斯过程通过线性系统仍是高斯的。

            通信里最常用的信道模型是**加性高斯白噪声（AWGN）**：接收信号 = 发送信号 + 噪声；噪声在所关心的频带内功率谱平坦（白）；任一时刻的值服从零均值正态分布（高斯）；噪声和信号相互独立。
      - item:
          id: gauss-2sigma
          type: number
          prompt: 零均值高斯噪声的标准差为 σ。某一时刻它的绝对值超过 2σ 的概率是百分之几？（保留两位小数）
          answer: 4.55
          tolerance: 0.005
          hint: 正态分布落在 ±2σ 以内的概率约是多少？
          explain: 正态分布落在 ±2σ 以内的概率约 95.45%，所以以外约 4.55%。超过 3σ 的只有约 0.27%。
      - card:
          title: 热噪声
          body: |
            温度 $T$（开尔文）的电阻在带宽 $B$ 内能送出的最大噪声功率是

            $$N = kTB$$

            $k = 1.38 \times 10^{-23}$ J/K 是玻尔兹曼常数。按开路电压算，电阻 $R$ 两端的噪声电压有效值是 $\sqrt{4kTRB}$。
          reveal:
            - title: 第 1 步：每赫兹的噪声
              body: |
                $T = 290$ K：$kT \approx 4.00 \times 10^{-21}$ W/Hz，换成 dBm 是 $10\log_{10}(4.00 \times 10^{-18}) \approx -174$ dBm/Hz。
            - title: 第 2 步：乘带宽
              body: |
                $B = 1$ MHz 是 60 dB，$N \approx -174 + 60 = -114$ dBm。
            - title: 第 3 步：意义
              body: |
                接收机输入端的噪声至少有这么大，要正常接收，信号必须比它强出所需的信噪比。
      - item:
          id: ktb-10k
          type: number
          prompt: '290 K 下带宽 10 kHz 内的热噪声功率是多少 dBm？（$k = 1.38 \times 10^{-23}$ J/K，保留到个位）'
          answer: -134
          tolerance: 0.5
          hint: 每赫兹的热噪声是多少 dBm？带宽 10 kHz 相当于乘了多少倍？
          explain: 10 log₁₀10⁴ = 40 dB，N ≈ −174 + 40 = −134 dBm。
      - item:
          id: noise-voltage
          type: number
          prompt: '1 kΩ 电阻在 290 K、带宽 1 MHz 内的开路噪声电压有效值是多少微伏？（$k = 1.38 \times 10^{-23}$ J/K，保留一位小数）'
          answer: 4.0
          tolerance: 0.05
          hint: 开路噪声电压的平方和 k、T、R、B 都成正比，比例系数是多少？
          explain: 4 × 1.38 × 10⁻²³ × 290 × 1000 × 10⁶ ≈ 1.6 × 10⁻¹¹ V²，开方 ≈ 4.0 μV。
      - card:
          title: 带通噪声
          body: |
            白噪声通过中心频率 $f_c$、带宽远小于 $f_c$ 的带通滤波器，得到窄带噪声。它看起来像一个包络和相位慢慢随机变化的正弦波，可以写成

            $$n(t) = n_c(t)\cos 2\pi f_c t - n_s(t)\sin 2\pi f_c t$$

            $n_c$ 叫同相分量，$n_s$ 叫正交分量（和载波相差 90°，和同相分量相乘后一个周期的平均为零，互不干扰），都是低通的高斯过程，均值为零，方差都等于 $n(t)$ 的方差。它的包络服从瑞利分布（只取正值、集中在某个值附近，远大于它的值很少）。分析相干解调时，只有和载波同相的 $n_c$ 进入输出。
      - item:
          id: bandpass-noise
          type: choice
          prompt: 窄带高斯噪声 n(t) 的方差是 σ²。它的同相分量 n_c(t) 的方差是多少？
          options:
            - text: σ²/2，因为功率被两个分量平分
              why: n_c、n_s 各乘了 cos 和 sin，平均起来各贡献一半，所以它们本身的方差各是 σ²
            - text: σ²
              correct: true
            - text: 2σ²
              why: 两个分量的方差相加再乘 ½ 才回到 σ²，每个分量是 σ²，不是 2σ²
          explain: E[n²] = ½E[n_c²] + ½E[n_s²]，三者相等时都是 σ²。这个结论在算相干解调的噪声时直接要用。

  - id: channel-models
    chapter: 信道与噪声
    title: 信道模型、多径和接收信噪比
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 在室内拿着手机走几步，信号格时多时少。主要原因是什么？
          options:
            - text: 基站在不停地调整发射功率
              why: 走几步、几十厘米就变化，原因在信号传播的路径上
            - text: 信号经墙壁、家具反射，几条路径的波在不同位置时而相加、时而抵消
              correct: true
            - text: 手机电池电压在变化
              why: 电池电压不会随你走几步就跳变，接收功率的起伏来自传播
          explain: 多条路径的信号到达时相位不同，有的位置相加、有的位置相消，这叫多径衰落。移动通信要专门对付它。
      - card:
          title: 加性干扰和乘性干扰
          body: |
            把信道看成一个系统，接收到的信号可以写成

            $$r(t) = k(t)s(t) + n(t)$$

            $n(t)$ 是加性干扰（噪声），不管有没有信号都存在；$k(t)$ 是乘性干扰，表示信道对信号的衰减和变形。$k$ 基本不随时间变的叫恒参信道，如电缆、光纤、视距微波；$k$ 随时间随机变化的叫随参信道，如靠电离层反射的短波、移动通信。

            恒参信道的问题是线性失真：各频率衰减不同（幅频失真），或时延不同（相频失真），可以用均衡器（频率响应可调、把各频率的衰减和时延补平的滤波器）补偿。
      - item:
          id: channel-kind
          type: choice
          prompt: 下面哪一种是随参信道？
          options:
            - text: 光纤
              why: 光纤的衰减和时延很稳定，是恒参信道
            - text: 同轴电缆
              why: 电缆的特性基本不随时间变，是恒参信道
            - text: 靠电离层反射的短波信道
              correct: true
          explain: 电离层的高度和电子密度随时在变，短波信号的衰减和时延跟着变，是典型的随参信道。
      - card:
          title: 多径和频率选择性衰落
          body: |
            信号经几条长短不同的路径到达，最长和最短路径的时延差叫多径时延扩展 $\tau_m$。路程差 300 m 对应 $\tau_m = 300/(3 \times 10^8) = 1$ μs。

            相隔小于约 $1/\tau_m$ 的两个频率衰落起伏差不多，这个宽度叫相关带宽。信号带宽比相关带宽窄时，整个信号一起忽强忽弱（平坦衰落）；比它宽时，频谱里有的频率被加强、有的被削弱（频率选择性衰落），波形会被拉长，前后码元互相重叠，产生码间干扰。
      - item:
          id: delay-spread
          type: number
          prompt: 两条传播路径的路程差是 600 m。它们的时延差是多少微秒？
          answer: 2
          hint: 时延差 = 路程差 / 光速。
          explain: 600 / (3 × 10⁸) = 2 × 10⁻⁶ s = 2 μs。
      - item:
          id: coherence-bw
          type: number
          prompt: 某信道的多径时延扩展是 2 μs，相关带宽按 1/τ_m 估算是多少 kHz？
          answer: 500
          hint: 1/(2 μs) 是多少赫兹？
          explain: 1/(2 × 10⁻⁶) = 5 × 10⁵ Hz = 500 kHz。带宽 5 MHz 的信号在这个信道里会遇到频率选择性衰落。
      - card:
          title: 接收信号加噪声
          body: |
            接收机输入端得到的是 $r(t) = s(t) + n(t)$。决定通信质量的是接收信噪比：信号功率除以接收带宽内的噪声功率。两者都用 dBm 表示时直接相减。

            例：收到的信号是 −90 dBm，带宽 1 MHz 的热噪声是 −114 dBm，接收信噪比是 $-90 - (-114) = 24$ dB。实际接收机自身还会加入噪声，信噪比会比这个低几分贝。
      - item:
          id: rx-snr
          type: number
          prompt: 接收到的信号功率是 −100 dBm，接收带宽内的噪声功率是 −114 dBm。接收信噪比是多少 dB？
          answer: 14
          hint: 两个 dBm 相减就是 dB。
          explain: −100 − (−114) = 14 dB，即信号功率约是噪声的 25 倍。

  - id: bandpass-envelope
    chapter: 模拟调制
    title: 带通信号和复包络
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个信号只占 20–25 MHz 这一段频率，20 MHz 以下什么也没有。要无失真地采样，最低采样率要多少？
          options:
            - text: 50 MHz，最高频率的两倍
              why: 两倍最高频率对任何信号都够，但只占一小段频带的信号可以用低得多的采样率
            - text: 10 MHz 左右就可能够
              correct: true
            - text: 25 MHz，等于最高频率
              why: 25 MHz 也不会混叠，但不是最低的；按带通采样可以低到 2B = 10 MHz
          explain: 只占一段窄频带的信号，采样率可以按它的带宽而不是最高频率来定，这叫带通采样。
      - card:
          title: 复包络
          body: |
            调制之前的原始信号频率集中在零附近，这一段频率叫**基带**；调制后的信号能量集中在载频 $f_c$ 附近，叫带通信号。任何带通信号都可以写成

            $$v(t) = \operatorname{Re}\{g(t)e^{j2\pi f_ct}\} = x(t)\cos 2\pi f_ct - y(t)\sin 2\pi f_ct$$

            $g(t) = x(t) + jy(t)$ 叫**复包络（complex envelope）**，是一个慢变化的低通信号。写成 $g = R(t)e^{j\theta(t)}$ 时，$v = R(t)\cos(2\pi f_ct + \theta(t))$：$R$ 是包络（振幅），$\theta$ 是相位。各种调制的区别，只在于信息放进了 $g$ 的哪一部分。
      - item:
          id: envelope-match
          type: match
          prompt: 把每种放置信息的方式和对应的复包络 g(t) 配对（m(t) 是基带信号，A_c 是常数）。
          pairs:
            - [信息在包络上，包络始终为正, 'A_c[1 + m(t)]']
            - [信息在包络上，m 为负时相位翻转, 'A_c m(t)']
            - [信息在相位上，包络不变, 'A_c e^{jD_p m(t)}']
            - [只取两个相反的值, '±A_c，随比特取正或负']
          explain: 前两种都把信息放在 g 的实部（包络）上，区别在于包络会不会变负；第三种放在相位上，包络不变；第四种是第二种的特例，m(t) 只取 ±1。
      - card:
          title: 带通信号的频谱
          body: |
            复包络的频谱 $G(f)$ 在零频附近。乘上 $e^{j2\pi f_ct}$ 再取实部，频谱搬到 $\pm f_c$ 两处：

            $$V(f) = \tfrac12 G(f - f_c) + \tfrac12 G^*(-f - f_c)$$

            如果 $g(t)$ 是实的、最高频率 $W$，那么 $v(t)$ 占 $f_c - W$ 到 $f_c + W$，带宽 $2W$：基带的正频率部分和负频率部分都搬到了载频两侧。
      - item:
          id: bp-width
          type: number
          prompt: 实的基带信号最高频率 5 kHz，作为复包络放到 1 MHz 的载波上（复包络就是这个实信号）。调制后的信号占多宽的频带（kHz）？
          answer: 10
          hint: 频谱搬到载频两侧，各占多宽？
          explain: 从 995 kHz 到 1005 kHz，带宽 2W = 10 kHz。
      - card:
          title: 带通采样定理
          body: 只占 $f_L$ 到 $f_H$、带宽 $B = f_H - f_L$ 的带通信号，可以用 $f_s = 2f_H/n$ 采样而不混叠，$n$ 取不超过 $f_H/B$ 的最大整数。$f_H$ 正好是 $B$ 的整数倍时，$f_s = 2B$。
          reveal:
            - title: 第 1 步：算带宽和比值
              body: |
                信号占 20–25 MHz：$B = 5$ MHz，$f_H/B = 5$。
            - title: 第 2 步：取整数 n
              body: |
                $n = 5$。
            - title: 第 3 步：算采样率
              body: |
                $f_s = 2 \times 25/5 = 10$ MHz，只有按最高频率算的 50 MHz 的五分之一。
      - item:
          id: bp-sample
          type: number
          prompt: 一个信号只占 100–104 MHz。按带通采样定理，最低采样率是多少 MHz？
          answer: 8
          hint: B = 4 MHz，f_H/B = 26。
          explain: n = 26，f_s = 2 × 104 / 26 = 8 MHz = 2B。按低通采样要 208 MHz。
      - item:
          id: bp-why
          type: choice
          prompt: 为什么带通采样可以低于最高频率的两倍？
          options:
            - text: 采样定理只适用于低通信号，带通信号不用遵守
              why: 带通采样也受混叠的约束，只是条件不同：采样后各个频谱副本不能重叠
            - text: 信号在 0 到 f_L 之间没有频谱，采样产生的频谱副本可以落进这段空白而不重叠
              correct: true
            - text: 采样率低了以后高频部分会自动被滤掉
              why: 采样本身不滤波；欠采样能成立，是因为副本恰好不重叠
          explain: 采样把频谱按 f_s 周期地复制。带通信号的频谱只有窄窄一段，选合适的 f_s，副本正好排进空白处，互不重叠。

  - id: am-dsb
    chapter: 模拟调制
    title: 调幅（AM）和抑制载波双边带（DSB）
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 最简单的矿石收音机只有一个线圈、一个二极管和一副耳机，却能收听中波调幅电台。它是怎样把声音取出来的？
          options:
            - text: 二极管整流后跟踪信号的包络，包络的形状就是声音
              correct: true
            - text: 线圈把无线电波直接变成声波
              why: 线圈只是选出电台的频率；取出声音靠的是对包络的检波
            - text: 耳机自己能分辨出载波里的声音频率
              why: 载波在几百千赫以上，耳机响应不了；需要先把包络取出来
          explain: 调幅信号的包络正比于 1 + m(t)，二极管加上电容就能把包络取出来，这叫包络检波。
      - card:
          title: 调幅
          body: |
            常规调幅（AM）信号是

            $$s(t) = A_c[1 + m(t)]\cos 2\pi f_ct$$

            要求 $|m(t)| \le 1$，否则包络会过零翻转，叫过调幅。单音调制 $m(t) = \mu\cos 2\pi f_mt$ 时，$\mu$ 叫调幅指数。展开得到三个频率：载波 $f_c$，上下边带 $f_c \pm f_m$。基带最高频率是 $W$ 时，AM 占的带宽是 $2W$。
      - item:
          id: am-bw
          type: number
          prompt: 语音最高频率按 4 kHz 算（3.4 kHz 取整，留出保护间隔），做常规调幅。已调信号占多少 kHz 带宽？
          answer: 8
          hint: 上下两个边带各占多宽？
          explain: 上下边带各占 4 kHz，带宽 2W = 8 kHz。
      - card:
          title: 调幅的功率和效率
          body: 单音调制时载波功率 $P_c = A_c^2/2$，两个边带合起来 $\mu^2A_c^2/4$。只有边带携带信息，边带功率占总功率的比例叫调制效率：$\eta = \frac{\mu^2}{2 + \mu^2}$。即使 $\mu = 1$，也只有三分之一。
          reveal:
            - title: 第 1 步：写出已知量
              body: |
                载波功率 100 W，$\mu = 0.5$。
            - title: 第 2 步：边带功率
              body: |
                边带合计 $\frac{\mu^2}{2}P_c = 0.125 \times 100 = 12.5$ W，总功率 112.5 W。
            - title: 第 3 步：效率
              body: |
                $\eta = 12.5/112.5 \approx 11.1\%$，和公式 $0.25/2.25$ 一致。
      - item:
          id: am-eff
          type: number
          prompt: 单音调幅，调幅指数 0.8。调制效率是百分之几？（保留一位小数）
          answer: 24.2
          tolerance: 0.05
          hint: 载波功率和两个边带的功率各是多少？边带占总功率的比例是多少？
          explain: 0.64/2.64 ≈ 24.2%。
      - item:
          id: am-total
          type: number
          prompt: 调幅发射机载波功率 1 kW，单音调制，调幅指数 1。总发射功率是多少瓦？
          answer: 1500
          hint: 两个边带的功率加起来是载波功率的几倍？μ = 1 时是多少？
          explain: 边带 1000 × 1/2 = 500 W，总功率 1500 W。
      - card:
          title: 抑制载波双边带和相干解调
          body: |
            把载波去掉，只发 $s(t) = A_cm(t)\cos 2\pi f_ct$，叫抑制载波双边带（DSB-SC），全部功率都在边带上，带宽仍是 $2W$。但它的包络是 $|m(t)|$，$m$ 变负时相位翻转，包络检波得到的是 $|m|$，波形失真。

            解调要用相干解调：乘一个同频同相的本地载波 $\cos 2\pi f_ct$，再低通滤波，得到 $\frac{A_c}2m(t)$。本地载波相位差 $\varphi$ 时输出乘上 $\cos\varphi$，差 90° 时输出为零。所以 DSB-SC 的接收机要先恢复载波。
      - item:
          id: phase-error
          type: number
          prompt: 相干解调 DSB-SC 信号时，本地载波和发送载波相差 60°。输出幅度是相位对准时的几倍？
          answer: 0.5
          hint: 输出乘上 cos φ。
          explain: cos 60° = 0.5，输出减半。
      - item:
          id: dsb-envelope
          type: choice
          prompt: 为什么 DSB-SC 信号不能用包络检波器解调？
          options:
            - text: DSB-SC 的频率太高，二极管来不及响应
              why: 载频和 AM 一样，问题不在频率
            - text: 它没有载波，包络是 |m(t)|，m(t) 为负的部分会被翻成正的
              correct: true
            - text: 它的带宽比 AM 宽
              why: DSB-SC 和 AM 的带宽一样，都是 2W
          explain: AM 加了足够大的载波，包络 A_c[1 + m(t)] 始终为正，包络就是信息；DSB-SC 没有这个载波，包络丢掉了 m(t) 的符号。

  - id: ssb-vsb-fdm
    chapter: 模拟调制
    title: 单边带、频分复用和超外差接收机
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 调幅信号的上边带和下边带是关于载频对称的。如果只发其中一个边带，接收端还能还原出原来的声音吗？
          options:
            - text: 能，两个边带携带的是同样的信息
              correct: true
            - text: 不能，上边带只有高音，下边带只有低音
              why: 每个边带都包含完整的 m(t) 频谱，只是一个在载频上方、一个在下方镜像
            - text: 只能还原一半的音量，声音别的方面不变
              why: 单边带解调后可以放大到任意音量；丢掉的是冗余，不是信息
          explain: 实信号的频谱正负频率对称，所以两个边带互为镜像，只发一个就够了。
      - card:
          title: 单边带和残留边带
          body: |
            只发一个边带叫单边带（SSB），带宽只要 $W$，是 AM、DSB 的一半，功率也省。产生方法：先做 DSB，再用滤波器滤掉一个边带；或者用相移法，$s(t) = A_c[m(t)\cos 2\pi f_ct \mp \hat m(t)\sin 2\pi f_ct]$，$\hat m$ 是把 $m$ 的每个频率成分都移相 90° 得到的信号（希尔伯特变换）。

            语音在 300 Hz 以下几乎没有能量，滤波法容易做；电视信号低频很丰富，边带滤不干净，就发一个边带加上另一个边带的一小部分，叫残留边带（VSB）。
      - item:
          id: ssb-bw
          type: number
          prompt: 用最高频率 4 kHz 的语音做单边带调制。已调信号占多少 kHz 带宽？
          answer: 4
          hint: 只留一个边带。
          explain: SSB 带宽等于基带带宽 W = 4 kHz，是 AM 的一半。
      - card:
          title: 频分复用和调频立体声
          body: |
            让多路信号各用一个不同的载频，频谱并排放在一条线路或一个频段里，叫频分复用（FDM），路与路之间留一点保护间隔。老式载波电话把 12 路语音用 SSB 排在 60–108 kHz，每路占 4 kHz。

            调频立体声是在一个电台内部做频分复用：$L + R$ 放在 0–15 kHz，19 kHz 放一个导频，$L - R$ 用 DSB-SC 调到 38 kHz 上（占 23–53 kHz）。单声道收音机只取 $L + R$；立体声收音机把导频加倍成 38 kHz，解出 $L - R$，再和 $L + R$ 相加减得到左右声道。
      - item:
          id: fdm-12
          type: number
          prompt: 12 路语音用单边带频分复用，每路连同保护间隔占 4 kHz。合起来占多少 kHz？
          answer: 48
          hint: 每路占的宽度乘以路数。
          explain: 12 × 4 = 48 kHz，正是 60–108 kHz 的宽度。
      - item:
          id: stereo-top
          type: number
          prompt: 调频立体声里 L − R 信号最高 15 kHz，用 DSB-SC 调到 38 kHz 的副载波上。它占的频带最高到多少 kHz？
          answer: 53
          hint: DSB 占副载波两侧各 15 kHz。
          explain: 38 + 15 = 53 kHz，下边到 38 − 15 = 23 kHz，和 0–15 kHz 的 L + R、19 kHz 的导频互不重叠。
      - card:
          title: 超外差接收机
          body: |
            几乎所有收音机和手机都用超外差结构：天线 → 射频放大 → 混频（和本地振荡器相乘）→ 中频滤波和放大 → 检波。本振频率跟着要收的电台调，使混频后的差频总是同一个中频（中国的中波收音机用 465 kHz，调频收音机用 10.7 MHz）。

            好处是窄而陡的滤波器、高增益放大器都只要做在一个固定的中频上。问题是镜像频率：本振在上方时，比电台高 2 倍中频的信号混频后也落在中频上，要在混频之前的射频滤波器里把它滤掉。
      - item:
          id: image-freq
          type: number
          prompt: 中波收音机中频 465 kHz，本振比电台频率高。收 1000 kHz 的电台时，镜像频率是多少 kHz？
          answer: 1930
          hint: 本振频率是多少？镜像在本振的另一侧，离本振也是一个中频。
          explain: 本振 1000 + 465 = 1465 kHz，镜像 1465 + 465 = 1930 kHz，它和本振的差也是 465 kHz。
      - item:
          id: superhet-why
          type: choice
          prompt: 超外差接收机为什么要先把信号变到固定的中频，而不是直接在射频上滤波放大？
          options:
            - text: 中频比射频低，所以信号功率更大
              why: 混频不增加信号功率；好处在于滤波器和放大器只需针对一个固定频率设计
            - text: 中频固定，窄带滤波器和高增益放大器只需做一套，调台时不用跟着调
              correct: true
            - text: 为了消除镜像频率
              why: 镜像频率恰恰是超外差引入的问题，要靠射频滤波器抑制
          explain: 选择性和增益都在固定中频上实现，收不同电台只调本振。这也是它比直接放大式接收机好用的原因。

  - id: fm-pm
    chapter: 模拟调制
    title: 调频和调相
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个调频（FM）电台的信号大约占 180 kHz 宽，而它传的声音最高只有 15 kHz。为什么要占这么宽？
          options:
            - text: 为了让信号传得更远
              why: 传播距离由频段和功率决定，和占用带宽无关
            - text: 调频把频率摆动得比声音频率宽得多，用更宽的频带换取更好的抗噪声能力
              correct: true
            - text: 立体声需要两倍带宽
              why: 立体声复合信号最高约 53 kHz，只是一部分原因；单声道调频台同样占这么宽
          explain: 调频的瞬时频率在载频附近来回摆动 ±75 kHz，所以带宽远大于 15 kHz。多占的带宽换来了更高的输出信噪比。
      - card:
          title: 调频和调相
          body: |
            把信息放在相位上叫调相（PM）：$s(t) = A_c\cos[2\pi f_ct + D_pm(t)]$。放在瞬时频率上叫调频（FM）：瞬时频率 $f_i(t) = f_c + k_fm(t)$，相位是频率的积分。两者包络都是常数 $A_c$。

            瞬时频率偏离载频的最大值叫频偏 $\Delta f$。单音调制时，频偏和调制频率之比叫**调频指数（FM modulation index）**：

            $$\beta = \frac{\Delta f}{f_m}$$
      - item:
          id: fm-beta
          type: number
          prompt: 调频电台的最大频偏 75 kHz，调制信号最高频率 15 kHz。调频指数是多少？
          answer: 5
          hint: 调频指数是哪两个频率之比？
          explain: β = 75/15 = 5。
      - card:
          title: 卡森带宽
          body: 单音调频的频谱在 $f_c \pm nf_m$ 处有无数根谱线，大小由一组随 $\beta$ 振荡衰减的函数 $J_n(\beta)$（第一类贝塞尔函数）决定，但 98% 左右的功率集中在卡森公式给出的带宽里：$B \approx 2(\Delta f + W) = 2(\beta + 1)W$。$\beta \ll 1$ 的窄带调频带宽约 $2W$，和 AM 一样。
          reveal:
            - title: 第 1 步：宽带调频
              body: |
                调频电台 $\Delta f = 75$ kHz，$W = 15$ kHz：$B \approx 2 \times (75 + 15) = 180$ kHz。
            - title: 第 2 步：窄带调频
              body: |
                对讲机 $\Delta f = 5$ kHz，$W = 3$ kHz：$B \approx 2 \times (5 + 3) = 16$ kHz。
            - title: 第 3 步：比较
              body: |
                同样的声音，宽带调频用的带宽是 AM 的 6 倍，换来的是更好的抗噪声能力。
      - item:
          id: carson
          type: number
          prompt: 某调频系统最大频偏 50 kHz，调制信号最高频率 10 kHz。按卡森公式，带宽约多少 kHz？
          answer: 120
          hint: 卡森公式里除了频偏，还有哪一项？
          explain: 2 × (50 + 10) = 120 kHz。只算 2Δf 会得到 100 kHz，漏了调制频率那一项。
      - item:
          id: carrier-null
          type: number
          prompt: '单音调频时载波分量的大小是 $J_0(\beta)$，$J_0$ 的第一个零点在 $\beta \approx 2.405$。调制频率 2 kHz，逐渐加大频偏，载波第一次消失时频偏是多少 kHz？（保留两位小数）'
          answer: 4.81
          tolerance: 0.005
          hint: 调频指数是频偏和调制频率之比，反过来频偏等于什么？
          explain: Δf = 2.405 × 2 ≈ 4.81 kHz。用频谱仪看载波消失，是测量频偏的一种标准方法。
      - card:
          title: 鉴频
          body: |
            调频信号的解调叫鉴频。一种办法是先对信号求导：$\frac{d}{dt}\cos\phi(t)$ 的幅度正比于瞬时频率，调频就变成了调幅，再用包络检波取出。另一种办法是用一个反馈环，让本地振荡器的相位一直跟着输入，控制本地振荡频率的那个电压就正比于瞬时频率；这种环路叫锁相环。

            鉴频之前通常先加一个限幅器，把信号削成幅度恒定。信息在频率上，幅度上的噪声和起伏就这样被去掉，这是调频抗干扰的原因之一。
      - item:
          id: limiter
          type: choice
          prompt: 调频接收机在鉴频器前面加限幅器，作用是什么？
          options:
            - text: 去掉幅度上的噪声和起伏
              correct: true
            - text: 限制信号的频偏，防止超出带宽
              why: 限幅器限的是幅度，不改变瞬时频率
            - text: 放大信号，提高灵敏度
              why: 限幅器把幅度削平，不是为了放大；放大由前面的中频放大器完成
          explain: 鉴频器先求导，输出同时受幅度影响。限幅以后幅度恒定，输出只反映频率变化。

  - id: analog-noise
    chapter: 模拟调制
    title: 模拟系统的抗噪声性能
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: AM 电台和 FM 电台到达收音机的信号功率一样大。哪一个解调后的声音噪声更小？
          options:
            - text: AM，它占的带宽窄，进来的噪声少
              why: 带宽窄确实进来的噪声少，但鉴频后的输出信噪比按 (3/2)β² 提高，多占的带宽换来的抗噪声能力更大
            - text: 一样，接收功率相同信噪比就相同
              why: 不同调制方式把同样的接收功率转换成输出信噪比的效率差别很大
            - text: FM
              correct: true
          explain: FM 用更宽的带宽换取了更高的输出信噪比，只要接收信号不太弱，它的声音明显比 AM 干净。
      - card:
          title: 用同一个基准比较
          body: |
            比较各种调制，用同一个基准：接收信号功率 $S_R$，噪声双边功率谱 $N_0/2$，基带带宽 $W$，定义

            $$\gamma = \frac{S_R}{N_0W}$$

            它就是不调制、直接在基带传输时的输出信噪比。单音调制、接收信噪比足够大时，各系统的输出信噪比是：

            | 系统 | 输出信噪比 |
            |---|---|
            | DSB-SC，相干解调 | $\gamma$ |
            | SSB，相干解调 | $\gamma$ |
            | AM，包络检波 | $\frac{\mu^2}{2 + \mu^2}\gamma$，$\mu = 1$ 时 $\gamma/3$ |
            | FM，鉴频 | $\frac32\beta^2\gamma$ |
          reveal:
            - title: 第 1 步：AM
              body: |
                $\gamma = 30$ dB，$\mu = 1$：输出 $= 30 + 10\log_{10}\frac13 \approx 30 - 4.8 = 25.2$ dB。载波占了三分之二的功率，却不携带信息。
            - title: 第 2 步：FM
              body: |
                $\beta = 5$：$\frac32 \times 25 = 37.5$，$10\log_{10}37.5 \approx 15.7$ dB，输出约 45.7 dB。
            - title: 第 3 步：代价
              body: |
                FM 的带宽 $2(\beta + 1)W = 12W$，是 AM 的 6 倍。用带宽换信噪比。
      - item:
          id: fm-gain-db
          type: number
          prompt: 单音调频，调频指数 3。输出信噪比比基带直接传输高多少 dB？（保留一位小数）
          answer: 11.3
          tolerance: 0.05
          hint: 单音调频的输出信噪比是基带直接传输的多少倍？这个倍数换成分贝是多少？
          explain: 1.5 × 9 = 13.5，10 log₁₀13.5 ≈ 11.3 dB。
      - item:
          id: am-out
          type: number
          prompt: '常规调幅，调幅指数 1，单音调制，包络检波。基准信噪比 $\gamma$ = 40 dB 时，输出信噪比是多少 dB？（保留一位小数）'
          answer: 35.2
          tolerance: 0.05
          hint: μ = 1 时输出是 γ/3。
          explain: 40 − 10 log₁₀3 ≈ 40 − 4.77 ≈ 35.2 dB。
      - card:
          title: 解调增益和门限效应
          body: |
            教材里也常用解调器输出信噪比和输入信噪比之比 $G$（调制制度增益）来比较：DSB 的 $G = 2$，SSB 的 $G = 1$，AM（$\mu = 1$）$G = 2/3$，单音 FM $G = 3\beta^2(\beta + 1)$。DSB 的 $G$ 比 SSB 大，并不说明它更好：DSB 输入端的噪声带宽是 SSB 的两倍，接收功率相同时两者输出信噪比一样。

            包络检波和鉴频都有门限效应：输入信噪比低于某个值（鉴频约 10 dB），输出信噪比会急剧变坏。上面的公式只在门限以上成立。
      - item:
          id: fm-g
          type: number
          prompt: 单音调频，调频指数 5。按 G = 3β²(β + 1)，调制制度增益是多少？
          answer: 450
          hint: 代入 β = 5。
          explain: 3 × 25 × 6 = 450。它和 1.5β² = 37.5 不矛盾：G 是相对输入信噪比，输入噪声按 FM 的宽带宽 2(β + 1)W 计。
      - item:
          id: dsb-ssb
          type: choice
          prompt: DSB 的调制制度增益是 2，SSB 是 1。接收信号功率和噪声功率谱密度相同时，哪一种输出信噪比高？
          options:
            - text: DSB，因为增益是 SSB 的两倍
              why: DSB 的带宽是 SSB 的两倍，输入噪声也是两倍，输入信噪比只有 SSB 的一半，正好抵消
            - text: 一样高
              correct: true
            - text: SSB，因为带宽窄
              why: 带宽窄使输入噪声少，但 SSB 的增益也小一半，结果和 DSB 相同
          explain: 两者的输出信噪比都等于 γ。比较调制方式要用同一个基准，只看 G 会被输入噪声带宽的不同误导。

  - id: pam-pcm
    chapter: 基带传输与码间干扰
    title: 脉冲幅度调制和脉冲编码调制
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 固定电话网把每一路语音变成数字信号传输。你猜每一路要多少比特每秒？
          options:
            - text: 约 8 kb/s
              why: 8 k 是每秒的采样次数；每个样值还要用 8 位二进制表示
            - text: 64 kb/s
              correct: true
            - text: 约 1 Mb/s
              why: 语音只到 3.4 kHz，每秒 8000 个样值、每个 8 位就够了，用不到 1 Mb/s
          explain: 每秒采样 8000 次，每个样值编成 8 位，8000 × 8 = 64 kb/s。这是数字电话的基本速率。
      - card:
          title: 采样和脉冲幅度调制
          body: |
            信号与系统里讲过：最高频率 $W$ 的信号，每秒采样多于 $2W$ 次就能完整恢复。反过来说，带宽 $W$、时长 $T$ 的信号，大约只需要 $2WT$ 个数来描述。电话语音限制在 300–3400 Hz，采样率定为 8 kHz。

            用一串脉冲的高度表示样值，叫脉冲幅度调制（PAM）。脉冲顶部跟着信号变的叫自然采样；保持样值不变、顶部是平的叫平顶采样，它的频谱会被乘上一个辛克函数，接收端要补偿。PAM 还是模拟的：脉冲高度可以取任意值。
      - item:
          id: music-fs
          type: number
          prompt: 音乐信号的最高频率取 20 kHz。按采样定理，最低采样率是多少 kHz？
          answer: 40
          hint: 至少是最高频率的几倍？
          explain: 2 × 20 = 40 kHz。CD 用 44.1 kHz，留出一点余量给抗混叠滤波器的过渡带。
      - card:
          title: 脉冲编码调制
          body: 把样值量化成 $M = 2^n$ 个电平之一，再编成 $n$ 位二进制，就是**脉冲编码调制（PCM）**，信息速率 $R_b = nf_s$。量化间隔为 $\Delta$ 时，量化误差在 $\pm\Delta/2$ 内均匀分布，噪声功率 $\Delta^2/12$。满幅正弦信号的量化信噪比是 $6.02n + 1.76$ dB。
          reveal:
            - title: 第 1 步：每多一位
              body: |
                电平数翻倍，$\Delta$ 减半，噪声功率变成 1/4，信噪比提高 $10\log_{10}4 \approx 6.02$ dB。
            - title: 第 2 步：8 位
              body: |
                $6.02 \times 8 + 1.76 \approx 49.9$ dB。
            - title: 第 3 步：速率
              body: |
                电话 $f_s = 8$ kHz、$n = 8$：$R_b = 64$ kb/s。位数越多音质越好，速率也越高。
      - item:
          id: sqnr-12
          type: number
          prompt: 满幅正弦信号用 12 位均匀量化的 PCM 编码。量化信噪比是多少 dB？（保留一位小数）
          answer: 74.0
          tolerance: 0.05
          hint: 每多一位量化，信噪比提高多少 dB？8 位时是多少？
          explain: 6.02 × 12 + 1.76 = 74.0 dB。
      - item:
          id: pcm-rate
          type: number
          prompt: 某信号采样率 16 kHz，每个样值编成 12 位。PCM 的信息速率是多少 kb/s？
          answer: 192
          hint: 每秒有多少个样值？每个样值占几位？
          explain: 12 × 16 = 192 kb/s。
      - card:
          title: 非均匀量化和压扩
          body: |
            语音里小信号多、大信号少。均匀量化时小信号的信噪比很差。解决办法是对小信号用细的量化间隔、对大信号用粗的：先把信号压缩（小信号放大得多），再均匀量化，接收端扩张还原，叫压扩。

            中国和欧洲用 A 律（$A = 87.6$，实际用 13 段不同斜率的折线逼近这条压缩曲线，便于数字实现），北美和日本用 μ 律。8 位非均匀量化在很大的音量范围内都能保持差不多的信噪比，效果接近 12 位均匀量化。
      - item:
          id: compand
          type: choice
          prompt: 电话 PCM 为什么用 A 律压扩，而不直接用 8 位均匀量化？
          options:
            - text: 让小音量的语音也有足够的信噪比
              correct: true
            - text: 让编码后的速率低于 64 kb/s
              why: A 律仍是每样值 8 位，速率还是 64 kb/s；它改变的是量化间隔的分布
            - text: 为了加密语音
              why: 压扩是可以公开还原的非线性映射，不起加密作用
          explain: 均匀量化的噪声和信号大小无关，信号小时信噪比就低；压扩让量化噪声跟着信号大小变，信噪比在大范围内差不多。
      - card:
          title: 误码对 PCM 的影响
          body: |
            传输中错一位，样值就会跳到另一个电平，错在高位时跳得很远。信号在整个量化范围内均匀分布、自然二进制编码、误比特率 $P_e$ 时，PCM 的输出信噪比是

            $$\left(\frac SN\right)_{\text{out}} = \frac{M^2}{1 + 4(M^2 - 1)P_e}$$

            $P_e$ 很小时它等于量化信噪比 $M^2$；$P_e$ 大到和 $1/(4M^2)$ 相当时，误码噪声开始占主导，加位数也没用了。
      - item:
          id: pcm-pe
          type: number
          prompt: '8 位 PCM（$M = 256$），误比特率 $10^{-5}$。按 $(S/N)_{\text{out}} = M^2/[1 + 4(M^2 - 1)P_e]$，输出信噪比是多少 dB？（保留一位小数）'
          answer: 42.6
          tolerance: 0.05
          hint: 分母里误码那一项和 1 比，哪个大？
          explain: M² = 65536，4 × 65535 × 10⁻⁵ ≈ 2.62，65536 / 3.62 ≈ 18100，约 42.6 dB。没有误码时是 48.2 dB。

  - id: dpcm-dm-tdm
    chapter: 基带传输与码间干扰
    title: 差分编码、增量调制和时分复用
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 语音按 8 kHz 采样时，相邻两个样值通常很接近。利用这一点能怎样省比特？
          options:
            - text: 只传相邻样值的差，差值小，用的位数少
              correct: true
            - text: 每隔一个样值丢掉一个
              why: 那等于把采样率减半，会产生混叠
            - text: 把样值四舍五入到更少的电平
              why: 那是减少量化位数，信噪比会下降；利用相关性可以在不降低质量的情况下省比特
          explain: 相邻样值相关，差值的范围比样值本身小得多，用较少的位数就能表示。这是差分脉冲编码调制的思路。
      - card:
          title: 差分 PCM
          body: |
            差分脉冲编码调制（DPCM）用前面的样值预测当前样值，只量化和传送预测误差。接收端用同样的预测器加上误差，还原样值。预测越准，误差越小，需要的位数越少。

            自适应差分 PCM（ADPCM）让量化间隔和预测器跟着信号自动调整，32 kb/s 就能达到接近 64 kb/s PCM 的电话音质。
      - card:
          title: 增量调制
          body: |
            增量调制（DM）是最简单的 DPCM：每个样值只用 1 位，表示“比上一步高一个台阶 $\Delta$”还是“低一个台阶”。输出是一个阶梯波去追信号。采样率要比奈奎斯特速率高很多倍。

            台阶太小，信号变化快时追不上，叫斜率过载：要求 $\Delta \cdot f_s$ 不小于信号的最大斜率。台阶太大，信号平稳时阶梯来回跳，叫颗粒噪声。正弦信号 $A\sin 2\pi ft$ 的最大斜率是 $2\pi fA$。
      - item:
          id: dm-step
          type: number
          prompt: 增量调制采样率 64 kHz，输入是振幅 1 V、频率 1 kHz 的正弦波。不发生斜率过载，台阶至少要多少伏？（保留三位小数）
          answer: 0.098
          tolerance: 0.0005
          hint: 正弦波最陡的地方每秒变化多少伏？阶梯每秒最多能爬多高？
          explain: Δ ≥ 2π × 1000 × 1 / 64000 ≈ 0.098 V。
      - item:
          id: dm-noise
          type: choice
          prompt: 增量调制的输出在输入几乎不变时上下来回跳动。这是哪种失真？怎样减小？
          options:
            - text: 斜率过载，应该加大台阶
              why: 斜率过载出现在信号变化太快、阶梯追不上的时候；信号平稳时来回跳是颗粒噪声
            - text: 颗粒噪声，应该减小台阶或提高采样率
              correct: true
            - text: 量化噪声，和台阶大小无关
              why: 来回跳的幅度就是台阶大小，台阶越小这种噪声越小
          explain: 台阶小能减小颗粒噪声，却更容易斜率过载；提高采样率可以两头兼顾，代价是速率更高。自适应增量调制让台阶跟着信号变。
      - card:
          title: 时分复用
          body: |
            多路信号轮流占用同一条线路，每路在每一帧里占一个固定的时隙，叫时分复用（TDM）。

            中国和欧洲的 E1 系统：每帧 32 个时隙，每个时隙 8 位，每秒 8000 帧，速率 $32 \times 8 \times 8000 = 2.048$ Mb/s；时隙 0 放帧同步码，时隙 16 放信令，30 个时隙传语音。北美的 T1：24 路，每帧 $24 \times 8 + 1 = 193$ 位，1.544 Mb/s，多出的 1 位用来帧同步。
      - item:
          id: t1-rate
          type: number
          prompt: T1 系统每帧 24 路、每路 8 位，再加 1 位帧同步，每秒 8000 帧。总速率是多少 Mb/s？（保留三位小数）
          answer: 1.544
          tolerance: 0.0005
          hint: 每帧多少位？
          explain: 24 × 8 + 1 = 193 位，193 × 8000 = 1 544 000 b/s = 1.544 Mb/s。
      - item:
          id: e1-voice
          type: number
          prompt: E1 系统每帧 32 个时隙，其中两个用于帧同步和信令。每个时隙 64 kb/s。用来传语音的总速率是多少 kb/s？
          answer: 1920
          hint: 传语音的时隙有几个？
          explain: 30 × 64 = 1920 kb/s。总速率 2048 kb/s 里另外 128 kb/s 用于同步和信令。
      - card:
          title: 分组传输和脉冲时间调制
          body: |
            分组传输把数据切成一个个分组，每个分组带上头部（目的地、序号）和校验位，谁有数据谁占用线路，不像时分复用那样给每一路固定时隙。数据通信忽多忽少，按需占用比固定时隙省线路，代价是分组要排队，时延不固定。

            脉冲时间调制用脉冲的宽度（PWM）或位置（PPM）表示样值，脉冲高度不变。PWM 常用于电机调速和开关电源，PPM 用于红外遥控和一些光通信。
      - item:
          id: tdm-packet
          type: choice
          prompt: 时分复用和分组传输的主要区别是什么？
          options:
            - text: 时分复用给每一路固定的时隙，分组传输按需占用
              correct: true
            - text: 时分复用只能用来传语音，分组传输只能用来传数据
              why: 两者都可以传任何比特，区别在于线路怎样分配给各路
            - text: 分组传输不需要同步
              why: 收端仍要找到每个分组的开头，要靠前导码或帧定界
          explain: 固定时隙适合速率恒定的语音，没话说时隙也空着；分组传输适合忽多忽少的数据，但时延会变。

  - id: line-codes
    chapter: 基带传输与码间干扰
    title: 线路码和它们的频谱
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 在长电缆上传数据，最直接的办法是“1 发 +5 V，0 发 0 V”。这种办法有什么问题？
          options:
            - text: 没有问题，这是最好的办法
              why: 它有直流分量，经过变压器、电容耦合会被隔断；长串 0 或 1 时收端也提取不出时钟
            - text: 信号里有直流分量，长串相同的位时收端还提取不出时钟
              correct: true
            - text: 电压太低，传不远
              why: 电压可以调；问题在于这种码型的频谱和定时性质
          explain: 线路码要考虑频谱（有没有直流、占多宽）和能不能从信号里提取定时。所以人们设计了各种线路码。
      - card:
          title: 常用线路码
          body: |
            | 码型 | 规则 |
            |---|---|
            | 单极性不归零（NRZ） | 1 为 $+V$，0 为 0，整个比特期间不变 |
            | 双极性不归零 | 1 为 $+V$，0 为 $-V$ |
            | 单极性归零（RZ） | 1 在前半个比特为 $+V$，后半回到 0 |
            | AMI（传号交替反转） | 0 为 0，1 交替发 $+V$、$-V$ |
            | HDB3 | 在 AMI 基础上，把连续 4 个 0 换成 000V 或 B00V：V 故意和前一个非零脉冲同极性（破坏点），B 用来让相邻的 V 正负交替 |
            | 曼彻斯特 | 1 为先高后低，0 为先低后高，每个比特中间都跳变 |
          reveal:
            - title: 第 1 步：写出数据
              body: |
                例：用 AMI 编码 1 0 1 1 0 0 0 0 1，第一个 1 发 $+V$。
            - title: 第 2 步：0 一律为零
              body: |
                0 的位置都是 0。
            - title: 第 3 步：1 交替正负
              body: |
                $+V,\ 0,\ -V,\ +V,\ 0,\ 0,\ 0,\ 0,\ -V$。正负交替，所以没有直流；但中间 4 个 0 期间没有跳变，HDB3 就是为了消除这样的长串 0。
      - item:
          id: ami-code
          type: choice
          prompt: 用 AMI 编码 1 1 0 1，第一个 1 发 +V。编出来是什么？
          options:
            - text: +V，−V，0，+V
              correct: true
            - text: +V，+V，0，+V
              why: AMI 的 1 要交替变号，连续两个 1 不能同号
            - text: +V，−V，−V，+V
              why: 0 在 AMI 里一律发 0 电平，不参与交替
          explain: 1 依次是 +V、−V、+V，0 是 0，合起来 +V，−V，0，+V。
      - card:
          title: 线路码的频谱
          body: |
            线路码的功率谱决定了它要多宽的信道、能不能过变压器、能不能提取时钟（$R_b$ 是比特率）：

            - 单极性码有直流分量；单极性 RZ 在 $R_b$ 处有离散谱线，可以直接滤出时钟；
            - 双极性 NRZ（0、1 等概率）没有直流，谱的第一个零点在 $R_b$；
            - AMI、HDB3 没有直流，第一个零点在 $R_b$，适合经变压器耦合的电缆，E1 线路用 HDB3；
            - 曼彻斯特码没有直流，每位都跳变，定时容易，但第一个零点在 $2R_b$，占的带宽加倍。10 Mb/s 以太网用它。
      - item:
          id: manchester-bw
          type: number
          prompt: 比特率 10 Mb/s 的曼彻斯特码，功率谱的第一个零点在多少 MHz？
          answer: 20
          hint: 曼彻斯特码每个比特中间跳变一次，相当于脉冲宽度减半。
          explain: 第一个零点在 2R_b = 20 MHz，是双极性 NRZ 的两倍。
      - item:
          id: nrz-bw
          type: number
          prompt: 比特率 2 Mb/s 的双极性不归零码，功率谱的第一个零点在多少 MHz？
          answer: 2
          hint: 不归零的矩形脉冲宽 T_b = 1/R_b。
          explain: 第一个零点在 1/T_b = R_b = 2 MHz。
      - item:
          id: code-choice
          type: choice
          prompt: 一条经变压器耦合的电缆，要求信号没有直流分量，并且收端在任何数据下都能提取定时。下面哪种码最合适？
          options:
            - text: 单极性不归零码，因为它最简单
              why: 它有直流分量，过不了变压器；长串 0 或 1 时也没有跳变
            - text: AMI 码
              why: AMI 没有直流，但连续很多个 0 时没有跳变，会丢失定时
            - text: 曼彻斯特码
              correct: true
          explain: 曼彻斯特码每个比特都跳变，又没有直流，代价是带宽加倍。电话线路常用 HDB3，同样满足这两个要求而不加倍带宽。

  - id: isi-eye
    chapter: 基带传输与码间干扰
    title: 码间干扰和眼图
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 通过一条带宽有限的电缆发送一串矩形脉冲，发得越来越快。即使完全没有噪声，接收端也会开始判错。为什么？
          options:
            - text: 脉冲被拉宽，前后码元的尾巴叠在一起
              correct: true
            - text: 电缆的电阻使信号幅度变小，接收端判不出来
              why: 单纯衰减可以靠放大补回来；问题是脉冲被拉宽后相互重叠
            - text: 发得太快时电缆里的电流来不及流过
              why: 信号沿电缆以接近光速传播；限制速率的是带宽，带宽有限使脉冲展宽
          explain: 带宽有限的信道相当于一个低通滤波器，把脉冲拉宽。前后码元的拖尾落在当前码元的判决时刻，这叫码间干扰。
      - card:
          title: 码间干扰
          body: 每个码元经过发送滤波器、信道和接收滤波器以后变成脉冲 $h(t)$。在第 $k$ 个判决时刻采样，得到 $y_k = a_kh(0) + \sum_{n \ne k} a_nh((k - n)T) + n_k$。第一项是要的；中间的和是其他码元的拖尾，叫**码间干扰（ISI）**；最后是噪声。码间干扰和噪声不同：加大发送功率，它跟着一起变大，去不掉。
          reveal:
            - title: 第 1 步：写出采样值
              body: |
                双极性码 $a_n = \pm1$，$h(0) = 1$，$h(\pm T) = 0.2$，其他时刻为零。
            - title: 第 2 步：最坏情况
              body: |
                当前码元是 $+1$，前后两个都是 $-1$：$y = 1 - 0.2 - 0.2 = 0.6$。
            - title: 第 3 步：结论
              body: |
                判决余量从 1 降到 0.6，同样的噪声更容易让它判错。拖尾再大到总和超过 1，没有噪声也会判错。
      - item:
          id: isi-worst
          type: number
          prompt: '双极性码 $a_n = \pm 1$，接收脉冲 $h(0) = 1$、$h(T) = 0.3$、$h(-T) = 0.1$，其他采样时刻为零。最坏情况下判决时刻的采样值（当前码元为 +1）是多少？'
          answer: 0.6
          tolerance: 0.0001
          hint: 前后两个码元都取和当前相反的符号。
          explain: 1 − 0.3 − 0.1 = 0.6。
      - card:
          title: 眼图
          body: |
            把接收波形按两个码元周期一段段截下来，叠在示波器上，看起来像一只眼睛，叫**眼图（eye diagram）**。

            眼睛张开的高度是判决的噪声余量；张开的宽度是定时误差的余量；眼睛最大张开处是最佳采样时刻；眼睛边沿的斜率表示对定时误差有多敏感。码间干扰和噪声越大，眼睛闭得越小，完全闭上时就无法正确判决了。
      - item:
          id: eye-height
          type: choice
          prompt: 眼图在垂直方向张开得很小，说明什么？
          options:
            - text: 码间干扰或噪声大，判决的噪声余量小
              correct: true
            - text: 定时抖动大，采样时刻的余量小
              why: 定时余量看的是眼睛的水平宽度；垂直张开看的是幅度上的余量
            - text: 信号功率太大
              why: 信号大时眼睛整体放大，张开度按比例变大，不会变小
          explain: 垂直张开的高度就是正确判决还能容忍多少干扰。
      - item:
          id: eye-sample
          type: choice
          prompt: 用眼图调整接收机的采样时刻，应该选在哪里？
          options:
            - text: 眼睛开始张开的时候，越早判决越快
              why: 刚张开时余量很小，稍有噪声就判错
            - text: 眼睛张开最大的时刻
              correct: true
            - text: 两个眼睛之间交叉的地方
              why: 交叉处是码元变化的过渡区，信号在正负之间，最容易判错
          explain: 张开最大处噪声余量最大，误码率最低。

  - id: nyquist
    chapter: 奈奎斯特准则
    title: 无码间干扰的条件和升余弦滚降
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一条理想低通信道，带宽 3 kHz。不产生码间干扰，每秒最多能传多少个码元？
          options:
            - text: 3000 个
              why: 3000 波特只到上限的一半：理想低通的冲激响应是辛克脉冲，零点间隔 1/(2B)，所以每秒能放 2B 个码元
            - text: 1500 个
              why: 1500 波特只到上限的四分之一：码元间隔取 2/B 太保守，辛克脉冲的零点间隔是 1/(2B)
            - text: 6000 个
              correct: true
          explain: 带宽 B 的理想低通，最高无码间干扰码元速率是 2B = 6000 Baud，这叫奈奎斯特速率。
      - card:
          title: 奈奎斯特第一准则
          body: |
            码间干扰为零，只要求脉冲在其他码元的判决时刻正好为零：

            $$h(kT) = \begin{cases}1, & k = 0\\0, & k \ne 0\end{cases}$$

            脉冲在判决时刻以外怎样变化都没关系。宽 $B$ 的理想低通，冲激响应是 $\operatorname{sinc}(2Bt)$，零点在 $1/(2B)$ 的整数倍上。所以码元间隔取 $T = 1/(2B)$，即码元速率 $R_s = 2B$，每赫兹 2 波特，这是能达到的上限。

            但理想低通做不出来；辛克脉冲的拖尾按 $1/t$ 衰减得很慢，采样时刻稍有偏差，码间干扰就很大。
      - item:
          id: nyq-rate
          type: number
          prompt: 理想低通信道带宽 4 kHz。无码间干扰时最高码元速率是多少波特？
          answer: 8000
          hint: 奈奎斯特速率是带宽的几倍？
          explain: R_s = 2B = 8000 Baud。
      - card:
          title: 升余弦滚降
          body: 把理想低通陡峭的边沿改成余弦形状的平滑过渡，叫升余弦滚降。滚降系数 $\alpha$（0 到 1）表示多用了多少带宽：$B = \frac{(1 + \alpha)R_s}{2}$。它仍满足奈奎斯特准则，脉冲拖尾按 $1/t^3$ 衰减，对定时误差不敏感。实际中常把它拆成两个相同的“根升余弦”滤波器，串起来等于一个升余弦，发送端和接收端各放一个。
          reveal:
            - title: 第 1 步：写出公式
              body: |
                码元速率 $R_s = 1$ MBaud，滚降系数 $\alpha = 0.25$。
            - title: 第 2 步：代入
              body: |
                $B = (1 + 0.25) \times 10^6 / 2 = 625$ kHz。
            - title: 第 3 步：频带利用率
              body: |
                $R_s/B = 2/(1 + \alpha) = 1.6$ Baud/Hz，比理想的 2 低一些，换来可以实现的滤波器。
      - item:
          id: rc-bw
          type: number
          prompt: 码元速率 2 MBaud，用滚降系数 0.5 的升余弦滤波。需要多少 MHz 带宽？
          answer: 1.5
          hint: 滚降系数为 α 的升余弦，带宽比最小带宽 R_s/2 多出几成？
          explain: (1 + 0.5) × 2 / 2 = 1.5 MHz。
      - item:
          id: rc-max
          type: number
          prompt: 信道带宽 100 kHz，用滚降系数 0.25 的升余弦滤波。最高码元速率是多少 kBaud？
          answer: 160
          hint: 把 B = (1 + α)R_s / 2 反过来解 R_s。
          explain: R_s = 2B/(1 + α) = 200/1.25 = 160 kBaud。
      - item:
          id: rc-bits
          type: number
          prompt: 带宽 100 kHz 的信道，滚降系数 0.25，每个码元有 4 种电平。最高信息速率是多少 kb/s？
          answer: 320
          hint: 先求最高码元速率，每个码元携带几比特？
          explain: R_s = 160 kBaud，4 电平每码元 2 比特，R_b = 320 kb/s。
      - item:
          id: alpha-zero
          type: choice
          prompt: 滚降系数取 0 时带宽最省。实际系统为什么不用 α = 0？
          options:
            - text: α = 0 时码元速率达不到 2B
              why: α = 0 正好对应 2B 的速率；问题在于实现和定时
            - text: 理想低通做不出来，而且拖尾衰减慢，定时稍有偏差码间干扰就很大
              correct: true
            - text: α = 0 时信号会有直流分量
              why: 直流分量由线路码决定，和滚降系数无关
          explain: α 越大，滤波器越好做，拖尾越短，对定时越宽容，代价是带宽。常用 0.2–0.5。

  - id: partial-response-eq
    chapter: 奈奎斯特准则
    title: 部分响应和均衡
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 想要每赫兹传 2 波特，又不想用做不出来的理想低通。有一个思路是：故意让每个码元只影响下一个码元，而且影响多少是事先知道的。你觉得这行得通吗？
          options:
            - text: 行得通，已知的干扰可以在接收端减掉
              correct: true
            - text: 行不通，有码间干扰就一定会判错
              why: 码间干扰难对付，是因为它未知；事先规定好的干扰可以在判决时考虑进去
            - text: 行得通，但速率会降到每赫兹 1 波特
              why: 这种方法正是为了在可实现的滤波器下保持每赫兹 2 波特
          explain: 这就是部分响应系统：人为引入已知的码间干扰，换来频谱形状好做的滤波器。
      - card:
          title: 双二进制
          body: |
            最常用的部分响应是双二进制：发送 $a_k = \pm1$，让接收到的采样值是 $c_k = a_k + a_{k-1}$，取值为 $-2$、$0$、$+2$ 三种。它的频谱在 $[0, \frac{1}{2T}]$ 内按余弦下降，在边沿正好为零，滤波器容易实现，速率仍是每赫兹 2 波特。

            直接按 $a_k = c_k - a_{k-1}$ 判决，一个错会一直传下去。解决办法是预编码：先算 $b_k = d_k \oplus b_{k-1}$（$\oplus$ 是异或），再发 $a_k = 2b_k - 1$。这样 $c_k = \pm2$ 时 $d_k = 0$，$c_k = 0$ 时 $d_k = 1$，每一位单独判决。
          reveal:
            - title: 第 1 步：预编码
              body: |
                数据 $d = 1\,0\,1\,1\,0$，$b_{-1} = 0$：$b = 1\,1\,0\,1\,1$。
            - title: 第 2 步：双二进制
              body: |
                $a = +1\,{+1}\,{-1}\,{+1}\,{+1}$（$b_{-1} = 0$，所以 $a_{-1} = 2 \times 0 - 1 = -1$），$c_k = a_k + a_{k-1} = 0,\ 2,\ 0,\ 0,\ 2$。
            - title: 第 3 步：判决
              body: |
                $c = 0$ 判 1，$c = \pm2$ 判 0，得 $1\,0\,1\,1\,0$，和原数据一样。
      - item:
          id: duo-decode
          type: choice
          prompt: 带预编码的双二进制系统，判决规则是采样值 ±2 判 0、0 判 1。接收到的采样值依次是 +2、0、−2、0。原数据是什么？
          options:
            - text: 0 1 0 1
              correct: true
            - text: 1 0 1 0
              why: 预编码后的规则是 c = ±2 判 0，c = 0 判 1，正好反过来
            - text: 1 0 0 0
              why: 每一位都按 c_k 单独判决，−2 和 +2 一样判 0，第二、四位是 0 应判 1
          explain: ±2 判 0，0 判 1，得 0 1 0 1。预编码的好处是不用知道前一位判得对不对。
      - card:
          title: 均衡
          body: 实际信道的频率响应不理想，接收脉冲总会有码间干扰。在接收端加一个横向滤波器（一串延迟一个码元间隔的抽头，每个乘一个系数再相加），调系数使合成后的脉冲在判决时刻接近零干扰，叫均衡。让相邻几个采样值强制为零的叫迫零均衡。
          reveal:
            - title: 第 1 步：列方程
              body: |
                接收脉冲采样 $x_{-1} = 0.2$、$x_0 = 1$、$x_1 = -0.3$。三抽头 $c_{-1}, c_0, c_1$，均衡后 $y_k = \sum_n c_nx_{k-n}$，要求 $y_{-1} = 0$、$y_0 = 1$、$y_1 = 0$：

                $$c_{-1} + 0.2c_0 = 0,\quad -0.3c_{-1} + c_0 + 0.2c_1 = 1,\quad -0.3c_0 + c_1 = 0$$
            - title: 第 2 步：解出系数
              body: |
                $c_{-1} = -0.2c_0$，$c_1 = 0.3c_0$，代入中间式：$1.12c_0 = 1$，$c_0 \approx 0.893$，$c_{-1} \approx -0.179$，$c_1 \approx 0.268$。
            - title: 第 3 步：看剩余干扰
              body: |
                $y_{\pm1}$ 变成 0，但 $y_2 = c_1x_1 \approx -0.080$、$y_{-2} = c_{-1}x_{-1} \approx -0.036$：干扰被推到更远的时刻，而且变小了。抽头越多，能消掉的范围越大。
      - item:
          id: zf-tap
          type: number
          prompt: '接收脉冲的采样值 $x_{-1} = 0.1$、$x_0 = 1$、$x_1 = -0.2$，其余为零。用三抽头迫零均衡器使 $y_{-1} = y_1 = 0$、$y_0 = 1$。中间抽头 $c_0$ 是多少？（保留三位小数）'
          answer: 0.962
          tolerance: 0.0005
          hint: 由两边的方程得 c₋₁ = −0.1c₀、c₁ = 0.2c₀，代入中间的方程。
          explain: 中间方程 −0.2c₋₁ + c₀ + 0.1c₁ = 1，即 0.02c₀ + c₀ + 0.02c₀ = 1.04c₀ = 1，c₀ ≈ 0.962。
      - item:
          id: zf-noise
          type: choice
          prompt: 迫零均衡器的主要缺点是什么？
          options:
            - text: 只能消有限个时刻的干扰，并会放大衰减大的频率上的噪声
              correct: true
            - text: 它要在码元之间插入空闲时间，因而降低码元速率
              why: 均衡在接收端处理，码元速率不变
            - text: 它需要事先知道接收端要收到的全部数据，才能算出抽头
              why: 迫零均衡只要知道信道脉冲响应（可以用训练序列测出），不需要知道之后的数据
          explain: 迫零均衡近似于 1/H(f)，H 小的地方增益大，噪声跟着放大。最小均方误差均衡在消干扰和放大噪声之间折中。

  - id: matched-filter
    chapter: 最佳接收与匹配滤波
    title: 匹配滤波器
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 已知发送的是某个形状的脉冲，接收时叠加了白噪声。用一个滤波器处理后在某一时刻采样判决，你会选什么样的滤波器？
          options:
            - text: 带宽越窄越好的低通，尽量滤掉噪声
              why: 带宽太窄会把信号也削掉；最佳的滤波器形状由脉冲本身决定
            - text: 冲激响应是脉冲在时间上反过来的滤波器
              correct: true
            - text: 不用滤波，直接采样最好
              why: 直接采样只用了一个时刻的值，脉冲在其他时刻的能量白白浪费
          explain: 这样的滤波器把脉冲的全部能量在采样时刻汇集起来，输出信噪比最大，叫匹配滤波器。
      - card:
          title: 最大输出信噪比
          body: |
            接收 $r(t) = s(t) + n(t)$，$s(t)$ 是已知的、长 $T$ 的脉冲，能量 $E$，$n(t)$ 是双边谱 $N_0/2$ 的白噪声。经过滤波器 $h(t)$ 在 $t = T$ 采样，输出信噪比最大可以达到

            $$\left(\frac SN\right)_{\max} = \frac{2E}{N_0}$$

            条件是 $h(t) = Ks(T - t)$：把信号在时间上翻转、再右移 $T$，叫**匹配滤波器（matched filter）**。这个最大值只取决于脉冲能量，和脉冲形状无关。证明用的是柯西–施瓦茨不等式。
          reveal:
            - title: 第 1 步：矩形脉冲的匹配滤波器
              body: |
                $s(t)$ 是幅度 $A$、宽 $T$ 的矩形，翻转后还是同样的矩形，$h(t) = s(T - t)$。
            - title: 第 2 步：输出波形
              body: |
                矩形和矩形卷积得到三角形，在 $t = T$ 达到峰值 $A^2T$，正是脉冲能量 $E$。
            - title: 第 3 步：在峰值采样
              body: |
                采样时刻选在 $T$，信号最大；噪声功率是 $\frac{N_0}2\int h^2dt = \frac{N_0}2E$，信噪比 $E^2/(\frac{N_0}{2}E) = 2E/N_0$。
      - item:
          id: mf-snr
          type: number
          prompt: '矩形脉冲幅度 1 V、宽 1 μs（归一化到 1 Ω，能量 $E = 10^{-6}$ J），白噪声 $N_0 = 10^{-7}$ W/Hz。匹配滤波器输出的最大信噪比是多少 dB？（保留一位小数）'
          answer: 13.0
          tolerance: 0.05
          hint: 2E/N₀ 是多少倍？
          explain: 2 × 10⁻⁶ / 10⁻⁷ = 20，10 log₁₀20 ≈ 13.0 dB。
      - item:
          id: mf-longer
          type: choice
          prompt: 脉冲幅度不变，宽度加倍。匹配滤波器输出的最大信噪比怎样变？
          options:
            - text: 提高 3 dB
              correct: true
            - text: 不变，因为幅度没变
              why: 最大信噪比只看能量，宽度加倍能量也加倍
            - text: 提高 6 dB
              why: 能量是幅度的平方乘宽度，宽度加倍能量只加倍，是 3 dB；幅度加倍才是 6 dB
          explain: E = A²T 加倍，2E/N₀ 加倍，即 +3 dB。码元越长越抗噪声，代价是速率低。
      - card:
          title: 相关接收和最佳接收机
          body: |
            匹配滤波器在 $t = T$ 的输出 $\int_0^T r(\tau)s(\tau)\,d\tau$，就是接收信号和已知波形的相关值。所以也可以用一个乘法器加积分器（相关器）实现，两者只在采样时刻相等。

            二进制信号在加性高斯白噪声里，最佳接收机就是：对每个可能的波形求相关（匹配滤波），在码元末尾采样，再和门限比较。相关值包含了判决需要的全部信息；在此基础上判成可能性最大的那个，误码率最小。
      - item:
          id: mf-what
          type: choice
          prompt: 匹配滤波器最大化的是什么？
          options:
            - text: 输出波形和发送波形的相似程度
              why: 匹配滤波器的输出波形（如三角形）和发送的矩形并不像；它不管波形保真
            - text: 采样时刻的输出信噪比
              correct: true
            - text: 输出信号的带宽
              why: 带宽不是优化目标；匹配滤波器的带宽由脉冲本身决定
          explain: 数字接收只关心判决时刻那一个值是否可靠，所以要最大化的是这一时刻的信噪比。
      - item:
          id: corr-equal
          type: choice
          prompt: 相关器和匹配滤波器的输出在什么时候相等？
          options:
            - text: 任何时刻都相等
              why: 匹配滤波器输出是一个随时间变化的波形，相关器是积分到当前时刻，只有在 t = T 时两者相同
            - text: 只在采样时刻 t = T
              correct: true
            - text: 从不相等，它们是两种不同的接收机
              why: 在 t = T 时两者算的是同一个积分，都是 ∫r(τ)s(τ)dτ
          explain: 数字接收只在 t = T 采样，所以两者在用法上等价。
      - card:
          title: 等价的说法
          body: |
            同样的结论有两种讲法。滤波器讲法：选 $h(t)$ 使采样时刻的信噪比最大，得到 $h(t) = Ks(T - t)$。统计讲法：在高斯白噪声里，接收信号和各候选波形的相关值就是判决所需的“充分统计量”，比较这些相关值做最大似然判决，误码率最小。两种讲法得到的是同一个接收机。
      - item:
          id: mf-why-best
          type: choice
          prompt: 为什么说“匹配滤波器 + 采样 + 门限判决”在加性高斯白噪声里是最佳接收机？
          options:
            - text: 相关值含有判决所需的全部信息，按最大似然判决误码率最小
              correct: true
            - text: 因为匹配滤波器能把带内和带外的噪声全部滤掉，只留下信号
              why: 噪声只能被压到最小，不能完全去掉；剩下的噪声决定了误码率
            - text: 因为它把噪声带宽压到了最窄
              why: 噪声带宽最窄不是目标；匹配滤波器的通带由脉冲形状决定，关键是让信号在采样时刻同相叠加
          explain: 在白高斯噪声里，比较相关值等价于比较各假设的似然，所以误码率最小。

  - id: binary-error
    chapter: 最佳接收与匹配滤波
    title: 二进制判决的误码率
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 接收端采到的值是 +1 V 或 −1 V 加上高斯噪声，门限取 0。噪声的标准差从 0.5 V 增大到 1 V，误码率大约怎样变？
          options:
            - text: 加倍
              why: 误码率是高斯尾部的面积，随信号和噪声之比变化得非常快，不是线性关系
            - text: 从百分之二左右增大到百分之十几
              correct: true
            - text: 几乎不变，门限没变
              why: 门限不变，但噪声越大越容易越过门限
          explain: 误码概率是 Q(A/σ)：A/σ = 2 时约 2.3%，A/σ = 1 时约 15.9%。高斯尾部随距离衰减得很快。
      - card:
          title: Q 函数和判决门限
          body: |
            采样值 $r = s + n$，$n$ 是均值为零、标准差 $\sigma$ 的高斯噪声。标准正态随机变量超过 $x$ 的概率记作

            $$Q(x) = \int_x^\infty \frac{1}{\sqrt{2\pi}}e^{-u^2/2}\,du$$

            叫 **Q 函数（Q function）**，也就是概率论里的 $1 - \Phi(x)$。$Q(1) \approx 0.159$，$Q(2) \approx 0.0228$，$Q(3) \approx 1.35 \times 10^{-3}$，$Q(4) \approx 3.2 \times 10^{-5}$。两种信号的采样值是 $s_1$、$s_2$、先验概率相等时，门限取中点最好，误码率 $P_e = Q\left(\frac{|s_1 - s_2|}{2\sigma}\right)$。
      - item:
          id: q3
          type: number
          prompt: '采样值是 +3 V 或 −3 V（等概率），叠加标准差 1 V 的高斯噪声，门限 0。误码率是多少？（单位 $10^{-3}$，保留两位小数）'
          answer: 1.35
          tolerance: 0.005
          hint: 信号离门限 3 V，是几个 σ？
          explain: P_e = Q(3) ≈ 1.35 × 10⁻³。
      - card:
          title: 基带二进制系统的误码率
          body: 用匹配滤波器接收、噪声双边谱 $N_0/2$ 时，误码率只和每比特能量 $E_b$ 与 $N_0$ 之比有关。双极性（$\pm A$）：$P_b = Q\left(\sqrt{2E_b/N_0}\right)$。单极性（$A$ 或 0，$E_b$ 按平均算）：$P_b = Q\left(\sqrt{E_b/N_0}\right)$。同样的平均能量，单极性两点的距离小，要多 3 dB 才能达到同样的误码率。
          reveal:
            - title: 第 1 步：dB 换倍数
              body: |
                双极性，$E_b/N_0 = 9.6$ dB，$10^{0.96} \approx 9.12$。
            - title: 第 2 步：算 Q 的自变量
              body: |
                $\sqrt{2 \times 9.12} \approx 4.27$。
            - title: 第 3 步：查 Q 函数
              body: |
                $Q(4.27) \approx 1.0 \times 10^{-5}$。这个“9.6 dB 得到十万分之一”值得记住。
      - item:
          id: polar-8db
          type: number
          prompt: '双极性基带系统用匹配滤波器接收，$E_b/N_0 = 8$ dB。误比特率是多少？（单位 $10^{-4}$，保留一位小数）'
          answer: 1.9
          tolerance: 0.05
          hint: 先把 8 dB 换成倍数，再算 √(2E_b/N₀)。
          explain: 10^0.8 ≈ 6.31，√12.62 ≈ 3.55，Q(3.55) ≈ 1.9 × 10⁻⁴。
      - item:
          id: unipolar-db
          type: number
          prompt: 单极性和双极性基带系统要达到同样的误比特率，单极性的 E_b/N₀ 要多几 dB？（保留到个位）
          answer: 3
          tolerance: 0.05
          hint: 比较 Q(√(E_b/N₀)) 和 Q(√(2E_b/N₀))。
          explain: 单极性要 E_b/N₀ 加倍才能让两个 Q 的自变量相等，10 log₁₀2 ≈ 3 dB。
      - item:
          id: prior-threshold
          type: choice
          prompt: 发 +A 的概率是 0.9，发 −A 的概率是 0.1。为了让平均误码率最小，门限应该从 0 往哪边移？
          options:
            - text: 往 −A 那边移
              correct: true
            - text: 往 +A 那边移
              why: 那会让更常发的 +A 更容易被判错，平均误码率变大
            - text: 不移，门限永远取中点
              why: 只有两种信号等概率时中点才最好；概率不等时要偏向少见的那一边
          explain: +A 更常见，把门限挪向 −A，多给 +A 一些判决区域，平均误码率更小。

  - id: binary-keying
    chapter: 数字调制
    title: 二进制数字调制
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 用一个正弦载波表示 0 和 1，可以改变它的幅度、频率或相位。二进制相移键控（BPSK）改变的是哪一个？
          options:
            - text: 幅度，1 发大、0 发小
              why: 那是幅移键控（ASK）
            - text: 频率，1 发高频、0 发低频
              why: 那是频移键控（FSK）
            - text: 相位，1 和 0 的载波相差 180°
              correct: true
          explain: 数字调制和模拟调制的思路一样，只是基带信号换成了 0、1 序列：ASK 改幅度，FSK 改频率，PSK 改相位。
      - card:
          title: 幅移键控和频移键控
          body: |
            二进制幅移键控（2ASK）：1 发 $A\cos 2\pi f_ct$，0 不发，也叫通断键控（OOK）。它等于单极性 NRZ 乘上载波，频谱是基带谱搬到 $f_c$，第一零点带宽 $2R_b$。可以用包络检波，接收机简单。

            二进制频移键控（2FSK）：1 发频率 $f_1$，0 发频率 $f_2$，幅度恒定。可以看成两路 OOK 相加，带宽约 $|f_1 - f_2| + 2R_b$。解调可以用两个带通滤波器分别接包络检波器，比较哪一路大。
      - item:
          id: fsk-bw
          type: number
          prompt: 2FSK 的两个频率是 1 MHz 和 1.4 MHz，比特率 100 kb/s。按 |f₁ − f₂| + 2R_b 估算，带宽约多少 kHz？
          answer: 600
          hint: 两个频率差多少？2R_b 是多少？
          explain: 400 + 200 = 600 kHz。
      - item:
          id: ask-bw
          type: number
          prompt: 比特率 1 Mb/s 的 2ASK 信号，第一零点带宽是多少 MHz？
          answer: 2
          hint: 基带 NRZ 的第一零点在 R_b，搬到载频两侧后是多少？
          explain: 载频两侧各 R_b，共 2R_b = 2 MHz。
      - card:
          title: 相移键控和差分相移键控
          body: |
            二进制相移键控（2PSK，即 BPSK）：1 发 $A\cos 2\pi f_ct$，0 发 $-A\cos 2\pi f_ct$，相当于双极性 NRZ 乘载波，带宽 $2R_b$。它必须相干解调，而接收端从信号里恢复的载波可能整个反了 180°（倒 π 现象），所有判决就全反了。

            差分相移键控（2DPSK）用相邻码元的相位变化表示信息：先做差分编码 $b_k = d_k \oplus b_{k-1}$，再按 $b_k$ 做 BPSK。载波整个反相时，相邻两码元的相位差不变，信息不受影响。
          reveal:
            - title: 第 1 步：差分编码
              body: |
                数据 $d = 1\,0\,1\,1$，参考位 $b_0 = 0$：$b = 1\,1\,0\,1$。
            - title: 第 2 步：载波反相
              body: |
                如果接收端恢复的载波反了，解出来的是 $\bar b = 0\,0\,1\,0$，参考位也反成 1。
            - title: 第 3 步：差分译码
              body: |
                $d_k = b_k \oplus b_{k-1}$：从参考位 1 开始，$1 \oplus 0 = 1$，$0 \oplus 0 = 0$，$0 \oplus 1 = 1$，$1 \oplus 0 = 1$，仍是 $1\,0\,1\,1$。
      - item:
          id: dpsk-encode
          type: choice
          prompt: 2DPSK 差分编码 b_k = d_k ⊕ b_{k−1}，参考位 b₀ = 1，数据 d = 0 1 1 0。编出的 b₁ b₂ b₃ b₄ 是什么？
          options:
            - text: 1 0 1 1
              correct: true
            - text: 0 1 1 0
              why: 这是直接照抄数据；差分编码每一位都要和前一个 b 异或
            - text: 1 1 0 0
              why: 第二位应是 1 ⊕ 1 = 0，第三位 1 ⊕ 0 = 1，这里算错了异或
          explain: b₁ = 0 ⊕ 1 = 1，b₂ = 1 ⊕ 1 = 0，b₃ = 1 ⊕ 0 = 1，b₄ = 0 ⊕ 1 = 1。
      - item:
          id: dpsk-why
          type: choice
          prompt: 2DPSK 相对于 2PSK 主要解决了什么问题？
          options:
            - text: 节省带宽
              why: 2DPSK 和 2PSK 的带宽相同，都是 2R_b
            - text: 降低误码率
              why: 相干解调时 2DPSK 的误码率比 2PSK 略高；它解决的是相位模糊
            - text: 恢复的载波反相 180° 时，判决不会全部反过来
              correct: true
          explain: 信息放在相邻码元的相位差里，载波整体反相不改变相位差。差分检测时甚至不需要恢复载波，用前一个码元当参考。

  - id: mary-qam
    chapter: 数字调制
    title: 多进制调制、QAM 和 MSK
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 码元速率和占用的带宽都不变，想把比特率提高到 4 倍。可以怎么做？
          options:
            - text: 每个码元用 16 种波形之一，携带 4 比特
              correct: true
            - text: 把载波频率提高到原来的 4 倍，信号就快 4 倍
              why: 载频只决定频谱放在哪里，带宽和速率由码元速率决定
            - text: 做不到，速率只能靠加带宽
              why: 每个码元可以携带多个比特；代价是同样的噪声下更容易判错
          explain: M 进制调制让每个码元携带 log₂M 比特，带宽不变而比特率提高，代价是需要更高的信噪比。
      - card:
          title: 多进制相移键控和星座图
          body: |
            码元有 $M$ 种可能时，每个码元携带 $k = \log_2M$ 比特，$R_b = kR_s$，而带宽只由码元速率决定：用升余弦滚降时，调到载波上的信号占载频两侧，带宽 $B = (1 + \alpha)R_s$，是基带的两倍。

            把每种码元的复包络 $x + jy$ 画成平面上的一个点，得到**星座图（constellation diagram）**。$M$ 进制相移键控（MPSK）的 $M$ 个点等距排在一个圆上：QPSK 是 4 个点，相隔 90°；8PSK 是 8 个点，相隔 45°。点越多，相邻点越近，越容易被噪声推过界。相邻点只差 1 比特的排法叫格雷码，判错到相邻点时只错 1 比特。
      - item:
          id: psk8-rate
          type: number
          prompt: 8PSK 系统码元速率 1 MBaud。比特率是多少 Mb/s？
          answer: 3
          hint: 每个码元携带 log₂8 比特。
          explain: 3 × 1 = 3 Mb/s。
      - card:
          title: 正交幅度调制
          body: |
            同时改变幅度和相位，把星座点排成方格，叫正交幅度调制（QAM）：16-QAM 是 4 × 4 个点，每个码元 4 比特；64-QAM 是 8 × 8，每个码元 6 比特。QPSK 也可以看成 4-QAM。

            平均功率相同时，16-QAM 的相邻点距离比 16PSK 大，抗噪声更好，所以高速率系统（Wi-Fi、有线电视、4G、5G）都用 QAM。
      - item:
          id: qam16-rate
          type: number
          prompt: 16-QAM 以 1 MBaud 传输。比特率是多少 Mb/s？
          answer: 4
          hint: 16 个星座点，每个码元几比特？
          explain: log₂16 = 4，比特率 4 Mb/s。
      - item:
          id: qam64-rate
          type: number
          prompt: 64-QAM 在 10 MHz 带宽里传输，升余弦滚降系数 0.25。最高比特率是多少 Mb/s？
          answer: 48
          hint: 带通信号带宽 B = (1 + α)R_s，先求 R_s。
          explain: R_s = 10/1.25 = 8 MBaud，每码元 6 比特，48 Mb/s。
      - item:
          id: qam-vs-psk
          type: choice
          prompt: 平均功率相同的 16-QAM 和 16PSK，哪一个抗噪声更好？为什么？
          options:
            - text: 16PSK，因为它的所有点幅度相同
              why: 幅度相同只说明点在一个圆上；16 个点挤在圆上，相邻点距离比方格排列小
            - text: 16-QAM，同样平均功率下它的相邻星座点距离更大
              correct: true
            - text: 一样，都是每码元 4 比特
              why: 比特数相同，误码率由相邻点间的距离决定，两者不同
          explain: 误码率主要取决于最近两点的距离。方格排列比圆周排列更充分地利用了平面。
      - card:
          title: 最小频移键控
          body: |
            FSK 的两个频率之差取 $f_1 - f_2 = \frac{1}{2T_b}$（相当于每个频率离中心频率 $\frac{1}{4T_b}$），是相干检测时两个波形正交所需的最小间隔；再让相位在码元交界处连续，就得到最小频移键控（MSK）。它也可以看成两路错开半个码元、用半个正弦作脉冲的 QPSK。

            MSK 包络恒定，可以用效率高的非线性功率放大器；频谱旁瓣下降得比 QPSK 快。在 MSK 前面加一个高斯低通滤波器，频谱更紧凑，叫 GMSK，GSM 手机用的就是它。
      - item:
          id: msk-sep
          type: number
          prompt: MSK 系统比特率 100 kb/s。两个频率相差多少 kHz？
          answer: 50
          hint: MSK 两个频率的间隔和一个比特的时长 T_b 是什么关系？
          explain: 间隔 1/(2T_b) = R_b/2 = 100/2 = 50 kHz。
      - item:
          id: gmsk-why
          type: choice
          prompt: GSM 手机为什么选用 GMSK？
          options:
            - text: 包络恒定，功放效率高，频谱也紧凑
              correct: true
            - text: 它每个码元携带的比特比 QPSK、16-QAM 都多，所以速率最高
              why: GMSK 每个码元只携带 1 比特；它的长处在包络恒定和频谱紧凑
            - text: 它不需要任何同步
              why: GMSK 照样需要载波和码元同步
          explain: 手机靠电池工作，功率放大器的效率很重要；恒包络信号可以让放大器工作在接近饱和的高效状态。

  - id: bandpass-ber
    chapter: 误码率分析
    title: 带通二进制系统的误码率
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 每比特平均能量相同，相干解调的 BPSK 和 OOK 哪一个误码率低？
          options:
            - text: OOK，因为它只在发 1 时才发射，干扰少
              why: 发 0 时不发射，两种信号的差别小；同样平均能量下，判决距离比 BPSK 小
            - text: 一样，都是二进制
              why: 误码率取决于两种信号的距离，BPSK 是 ±A，距离是 OOK 的两倍
            - text: BPSK
              correct: true
          explain: BPSK 的两个信号正好相反，距离最大，误码率最低。同样误码率下，OOK 和相干 FSK 要多花 3 dB。
      - card:
          title: 相干检测
          body: |
            相干检测就是用匹配滤波器（相关器）配上恢复出的载波。结果和基带一样，只看两种信号的距离：

            | 调制 | 误比特率 |
            |---|---|
            | BPSK | $Q\left(\sqrt{2E_b/N_0}\right)$ |
            | OOK（$E_b$ 按平均算） | $Q\left(\sqrt{E_b/N_0}\right)$ |
            | 正交 FSK | $Q\left(\sqrt{E_b/N_0}\right)$ |

            BPSK 两个信号相反（对跖），距离最大；OOK 有一个是零；FSK 两个信号正交，距离都比 BPSK 小，要多 3 dB。
          reveal:
            - title: 第 1 步：换算
              body: |
                BPSK，$E_b/N_0 = 9.6$ dB $\approx 9.12$。
            - title: 第 2 步：代入
              body: |
                $P_b = Q(\sqrt{18.24}) = Q(4.27)$。
            - title: 第 3 步：查表
              body: |
                $P_b \approx 1.0 \times 10^{-5}$。相干 FSK 要 12.6 dB 才能达到同样的误码率。
      - item:
          id: bpsk-10db
          type: number
          prompt: 'BPSK 相干解调，$E_b/N_0 = 10$ dB。误比特率是多少？（单位 $10^{-6}$，保留一位小数）'
          answer: 3.9
          tolerance: 0.05
          hint: 10 dB 是几倍？BPSK 的 Q 函数里是 √(2E_b/N₀) 还是 √(E_b/N₀)？
          explain: Q(√20) = Q(4.47) ≈ 3.9 × 10⁻⁶。
      - item:
          id: cfsk-126
          type: number
          prompt: '相干正交 FSK，$E_b/N_0 = 12.6$ dB。误比特率是多少？（单位 $10^{-5}$，保留一位小数）'
          answer: 1.0
          tolerance: 0.05
          hint: 12.6 dB 是几倍？相干正交 FSK 和 BPSK 比，Q 函数的自变量里少了哪个系数？
          explain: 10^1.26 ≈ 18.2，√18.2 ≈ 4.27，Q(4.27) ≈ 1.0 × 10⁻⁵，和 9.6 dB 的 BPSK 一样，正好差 3 dB。
      - card:
          title: 非相干检测和差分检测
          body: |
            不恢复载波相位、只看包络的接收机叫非相干接收机，简单便宜，代价是要多一些 $E_b/N_0$：

            | 调制和检测 | 误比特率 |
            |---|---|
            | 非相干 FSK（两路包络检波比大小） | $\frac12e^{-E_b/(2N_0)}$ |
            | 差分检测的 DPSK | $\frac12e^{-E_b/N_0}$ |

            非相干 OOK 的误码率和非相干 FSK 相近（门限选得合适时）。DPSK 拿前一个码元当参考相位，不用单独恢复载波，性能只比相干 BPSK 差不到 1 dB。
      - item:
          id: dpsk-10db
          type: number
          prompt: '差分检测的 DPSK，$E_b/N_0 = 10$ dB。误比特率是多少？（单位 $10^{-5}$，保留两位小数）'
          answer: 2.27
          tolerance: 0.005
          hint: 10 dB 是几倍？差分检测 DPSK 的误码公式是 Q 函数还是指数？
          explain: ½e⁻¹⁰ ≈ 2.27 × 10⁻⁵。
      - item:
          id: ncfsk-10db
          type: number
          prompt: '非相干 FSK，$E_b/N_0 = 10$ dB。误比特率是多少？（单位 $10^{-3}$，保留两位小数）'
          answer: 3.37
          tolerance: 0.005
          hint: 非相干 FSK 的误码公式和 DPSK 很像，指数里的 E_b/N₀ 还要除以几？
          explain: ½e⁻⁵ ≈ 3.37 × 10⁻³，比同样条件下的 BPSK（3.9 × 10⁻⁶）差将近一千倍。
      - item:
          id: rank-10db
          type: choice
          prompt: E_b/N₀ = 10 dB 时，相干 BPSK、DPSK、非相干 FSK 的误比特率从低到高怎样排？
          options:
            - text: 相干 BPSK < DPSK < 非相干 FSK
              correct: true
            - text: DPSK < 相干 BPSK < 非相干 FSK
              why: DPSK 的参考相位来自前一个带噪声的码元，比恢复出的干净载波差一些，误码率比相干 BPSK 高
            - text: 非相干 FSK < DPSK < 相干 BPSK
              why: 方向反了：非相干接收不利用相位信息，误码率最高
          explain: 3.9 × 10⁻⁶ < 2.27 × 10⁻⁵ < 3.37 × 10⁻³。利用的相位信息越多、参考越干净，误码率越低。

  - id: compare-systems
    chapter: 误码率分析
    title: QPSK、MSK 和各种调制的比较
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: E_b/N₀ 相同时，QPSK 的误比特率和 BPSK 比怎样？
          options:
            - text: 一样
              correct: true
            - text: QPSK 差 3 dB，因为每个码元挤进了 2 比特
              why: 每个码元的能量也是 2E_b，两路正交分量各传 1 比特，互不干扰
            - text: QPSK 更好，因为速率高
              why: 速率高是频带利用率高，不是误码率低
          explain: QPSK 等于在 cos 和 sin 两个正交载波上各做一路 BPSK。每一路的每比特能量还是 E_b，误比特率和 BPSK 相同，同样带宽下比特率加倍。
      - card:
          title: QPSK 和 MSK 的误码率
          body: |
            QPSK 的两路（同相、正交）互不干扰，用格雷码时误比特率是

            $$P_b = Q\left(\sqrt{2E_b/N_0}\right)$$

            和 BPSK 一样，但每个码元带 2 比特，同样的码元速率和带宽下比特率翻倍。MSK 可以看成错开半个码元的 QPSK，相干检测时误比特率也是这个式子。所以 QPSK 几乎是“免费”把频带利用率提高了一倍。
      - item:
          id: qpsk-96
          type: number
          prompt: 'QPSK 用格雷码、相干解调，$E_b/N_0 = 9.6$ dB。误比特率是多少？（单位 $10^{-5}$，保留一位小数）'
          answer: 1.0
          tolerance: 0.05
          hint: 和 BPSK 的公式一样。
          explain: Q(√(2 × 9.12)) ≈ 1.0 × 10⁻⁵，和 BPSK 相同。
      - card:
          title: 各种调制的比较
          body: |
            达到 $P_b = 10^{-5}$ 需要的 $E_b/N_0$，以及用滚降系数 $\alpha$ 的升余弦滤波时每赫兹能传多少比特：

            | 调制 | 所需 $E_b/N_0$ | 频带利用率（b/s/Hz） |
            |---|---|---|
            | BPSK | 9.6 dB | $1/(1 + \alpha)$ |
            | QPSK、MSK | 9.6 dB | $2/(1 + \alpha)$ |
            | DPSK | 约 10.3 dB | $1/(1 + \alpha)$ |
            | 相干 FSK、OOK | 12.6 dB | 低于 BPSK |
            | 非相干 FSK | 约 13.4 dB | 低于 BPSK |

            16-QAM 每赫兹 $4/(1 + \alpha)$ 比特，但要多几个分贝的 $E_b/N_0$。功率受限的系统（卫星、深空）选省功率的调制，带宽受限的系统（电缆、拥挤的频段）选高阶 QAM。香农证明了 $E_b/N_0$ 的下限是 $-1.6$ dB，任何系统都不能低于它。
      - item:
          id: qpsk-eff
          type: number
          prompt: QPSK 用滚降系数 0.25 的升余弦滤波。频带利用率是多少 b/s/Hz？
          answer: 1.6
          hint: 每码元 2 比特，每赫兹 1/(1 + α) 个码元。
          explain: 2/1.25 = 1.6 b/s/Hz。
      - item:
          id: dpsk-need
          type: number
          prompt: '差分检测 DPSK 要达到误比特率 $10^{-5}$，需要的 $E_b/N_0$ 是多少 dB？（用 $P_b = \frac12e^{-E_b/N_0}$，保留一位小数）'
          answer: 10.3
          tolerance: 0.05
          hint: 从 ½e^(−x) = 10⁻⁵ 解出 x 要用什么运算？解出的倍数怎样换成 dB？
          explain: ln(5 × 10⁴) ≈ 10.82，10 log₁₀10.82 ≈ 10.3 dB，只比 BPSK 多 0.7 dB。
      - item:
          id: power-limited
          type: choice
          prompt: 深空探测器离地球很远，发射功率很小，但可用的带宽比较宽。它更适合用哪类调制？
          options:
            - text: 64-QAM，因为它每赫兹能传的比特最多，最省带宽
              why: 64-QAM 省带宽却很费功率，在信号极弱的深空链路里误码率会很高
            - text: BPSK 或 QPSK，再加强有力的信道编码
              correct: true
            - text: 非相干 FSK，因为接收机简单
              why: 非相干 FSK 比 BPSK 多需要约 4 dB，对功率受限的链路很不划算
          explain: 功率受限时要选所需 E_b/N₀ 低的调制，并用编码进一步逼近香农给出的下限；带宽多用一点没关系。

  - id: error-control
    chapter: 信道编码初步
    title: 差错控制和码距
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 每 7 位数据后面加 1 位，使整组里 1 的个数是偶数。接收端发现 1 的个数变成奇数。它能做什么？
          options:
            - text: 只知道出错了
              correct: true
            - text: 能找出错的那一位，把它改正过来
              why: 只有一位校验，任何一位错都让奇偶性变得一样，无法区分是哪一位
            - text: 什么也判断不了
              why: 奇数个 1 说明至少有一位错了，能检测出来
          explain: 一位奇偶校验能发现奇数个错误，但不能定位，更不能纠正。要纠错，就要加更多冗余。
      - card:
          title: 差错控制的方式
          body: |
            信道编码在数据里加入有规律的冗余位，让接收端能发现或改正错误。$k$ 位数据编成 $n$ 位码字，记作 $(n, k)$ 码，码率 $k/n$。

            两种用法：检错重发（ARQ），收端只检错，发现错了就请求重发，需要回传信道，时延不定；前向纠错（FEC），收端自己改正错误，不需要回传，冗余要多一些。两者也可以结合起来用。单向的电台、深空探测必须用前向纠错。
      - card:
          title: 奇偶校验
          body: |
            最简单的检错码：在 $k$ 位数据后加 1 位，使整组里 1 的个数为偶数（偶校验）或奇数（奇校验），码率 $k/(k + 1)$。发生 1 位、3 位等奇数个错时能发现，偶数个错时发现不了。

            串口通信、存储器常用它，因为便宜，而且这些场合一次错 2 位的概率很小。
      - item:
          id: even-parity
          type: number
          prompt: 数据 1011001 用偶校验，应该加的校验位是 0 还是 1？
          answer: 0
          hint: 数一下数据里有几个 1。
          explain: 1011001 里有 4 个 1，已经是偶数，校验位是 0。
      - card:
          title: 汉明距离和纠检错能力
          body: 两个码字对应位不同的个数叫**汉明距离（Hamming distance）**。一种码里任意两个码字之间的最小距离记作 $d_{\min}$。要检测 $e$ 个错，需要 $d_{\min} \ge e + 1$；要纠正 $t$ 个错，需要 $d_{\min} \ge 2t + 1$。
          reveal:
            - title: 第 1 步：一个例子
              body: |
                重复码：0 发 000，1 发 111，$d_{\min} = 3$。
            - title: 第 2 步：纠错
              body: |
                收到 010，离 000 距离 1、离 111 距离 2，按“离谁近判谁”判成 000。错 1 位总能纠正：$3 \ge 2 \times 1 + 1$。
            - title: 第 3 步：检错
              body: |
                只检错不纠错时，错 2 位（如 000 变成 011）也不会变成另一个码字，能发现：$3 \ge 2 + 1$。但错 3 位就变成 111，发现不了。
      - item:
          id: ham-dist
          type: number
          prompt: 码字 1011101 和 1001001 的汉明距离是多少？
          answer: 2
          hint: 逐位比较，数不同的位置。
          explain: 第 3 位和第 5 位不同，距离 2。
      - item:
          id: dmin5
          type: number
          prompt: 一种码的最小码距是 5。用来纠错时，最多能纠正几个错误？
          answer: 2
          hint: 要纠正 t 个错误，最小码距至少要多大？
          explain: 5 ≥ 2t + 1，t ≤ 2，最多纠 2 个。只检错时能检测 4 个。
      - item:
          id: arq-fec
          type: choice
          prompt: 一颗深空探测器把数据传回地球，单程要几十分钟。应该用哪种差错控制方式？
          options:
            - text: 检错重发，因为它的冗余少
              why: 重发一次要等一个往返（一个多小时），而且接收端常常来不及请求
            - text: 前向纠错
              correct: true
            - text: 不用差错控制，提高发射功率就行
              why: 探测器的功率很有限，靠编码换取可靠性比加功率划算得多
          explain: 往返时延太长，只能让接收端自己纠错。深空通信用的是很强的纠错码。

  - id: linear-block
    chapter: 信道编码初步
    title: 线性分组码、汉明码和循环码
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: (7,4) 码把 4 位数据编成 7 位码字。7 位一共有 128 种组合，其中有多少种是合法的码字？
          options:
            - text: 128 种
              why: 如果每种组合都合法，收到任何组合都无法判断出错，加的 3 位就没有用了
            - text: 7 种
              why: 码字的个数由数据位数决定：4 位数据有 2⁴ 种可能
            - text: 16 种
              correct: true
          explain: 4 位数据只有 16 种，所以只有 16 个合法码字。其余 112 种组合一出现，就说明出错了。
      - card:
          title: 线性分组码
          body: |
            线性分组码的码字由数据乘以生成矩阵得到（按模 2 运算，$1 + 1 = 0$）：$\mathbf c = \mathbf d G$。系统码的生成矩阵写成 $G = [I_k \mid P]$，码字前 $k$ 位就是数据，后 $n - k$ 位是校验位。

            任意两个码字相加还是码字，所以最小码距等于非零码字里 1 的最少个数。和校验矩阵 $H = [P^{\mathsf T} \mid I_{n-k}]$ 相乘，每个码字都得零：$\mathbf cH^{\mathsf T} = \mathbf 0$。
      - card:
          title: (7,4) 汉明码
          body: 汉明码的码长 $n = 2^m - 1$，数据位 $k = n - m$，$d_{\min} = 3$，能纠正 1 个错。下面用的 (7,4) 码，校验位是 $p_1 = d_1 \oplus d_3 \oplus d_4$，$p_2 = d_1 \oplus d_2 \oplus d_3$，$p_3 = d_2 \oplus d_3 \oplus d_4$，码字是 $d_1d_2d_3d_4p_1p_2p_3$。
          reveal:
            - title: 第 1 步：写出数据
              body: |
                编码数据 1011：$d_1 = 1$，$d_2 = 0$，$d_3 = 1$，$d_4 = 1$。
            - title: 第 2 步：算校验位
              body: |
                $p_1 = 1 \oplus 1 \oplus 1 = 1$，$p_2 = 1 \oplus 0 \oplus 1 = 0$，$p_3 = 0 \oplus 1 \oplus 1 = 0$。
            - title: 第 3 步：拼成码字
              body: |
                1011100。码率 $4/7$。
      - item:
          id: hamming-enc
          type: text
          format: "写 7 位 0 和 1，如 1010101"
          prompt: 用校验位 p₁ = d₁ ⊕ d₃ ⊕ d₄、p₂ = d₁ ⊕ d₂ ⊕ d₃、p₃ = d₂ ⊕ d₃ ⊕ d₄ 的 (7,4) 汉明码编码数据 0110，码字写成 d₁d₂d₃d₄p₁p₂p₃。码字是什么？
          answers: ['0110100']
          hint: 先代入 d₁ = 0，d₂ = 1，d₃ = 1，d₄ = 0。
          explain: p₁ = 0 ⊕ 1 ⊕ 0 = 1，p₂ = 0 ⊕ 1 ⊕ 1 = 0，p₃ = 1 ⊕ 1 ⊕ 0 = 0，码字 0110100。
      - card:
          title: 伴随式译码
          body: |
            收到 $\mathbf r$，算伴随式 $\mathbf s = \mathbf rH^{\mathsf T}$：等价于用收到的数据位重新算一遍校验位，和收到的校验位逐位异或。$\mathbf s = 000$ 说明没有错；否则 $\mathbf s$ 正好等于 $H$ 中出错那一位对应的列。

            上面的码里，各位对应的伴随式：$d_1$ 是 110，$d_2$ 是 011，$d_3$ 是 111，$d_4$ 是 101，$p_1$ 是 100，$p_2$ 是 010，$p_3$ 是 001。7 个都不同且非零，所以任意 1 位错都能定位。

            例：发 1011100，收到 1001100。用收到的数据 1001 重算校验位得 011，和收到的 100 异或得 111，对应 $d_3$，把第 3 位改回 1。
      - item:
          id: syndrome-pos
          type: number
          prompt: 用同一个 (7,4) 汉明码（p₁ = d₁ ⊕ d₃ ⊕ d₄，p₂ = d₁ ⊕ d₂ ⊕ d₃，p₃ = d₂ ⊕ d₃ ⊕ d₄，码字 d₁d₂d₃d₄p₁p₂p₃），收到 1100011，最多错 1 位。错的是第几位？
          answer: 1
          hint: 用收到的数据 1100 重算校验位，再和收到的 011 异或。
          explain: 重算得 101，和 011 异或得 110，对应 d₁，即第 1 位。改正后是 0100011，数据 0100。
      - card:
          title: 循环码和 CRC
          body: 码字循环移位后仍是码字的线性分组码叫**循环码（cyclic code）**。把码字看成多项式，由生成多项式 $g(x)$ 决定；编码就是做多项式除法，用几级移位电路加异或门就能实现。循环冗余校验（CRC）就是这样：在数据后面补 $n - k$ 个 0，按模 2 除以 $g(x)$，余数作为校验位接在数据后面；接收端再除一次，余数不为零就说明出错。以太网、存储设备都用 CRC 检错。
          reveal:
            - title: 第 1 步：补零
              body: |
                $g(x) = x^3 + x + 1$，即 1011。数据 1101，后面补 3 个 0：1101000。
            - title: 第 2 步：模 2 除法
              body: |
                1101 ⊕ 1011 = 0110；带下一位得 1100，⊕ 1011 = 0111；带下一位得 1110，⊕ 1011 = 0101；带最后一位得 1010，⊕ 1011 = 0001。余数 001。
            - title: 第 3 步：接上余数
              body: |
                发送 1101001。它除以 1011 余数为零。
      - item:
          id: crc-rem
          type: text
          format: "写 3 位 0 和 1，如 101"
          prompt: 生成多项式 g(x) = x³ + x + 1（1011），数据 1001。CRC 校验位（3 位余数）是什么？
          answers: ['110']
          hint: 数据后补 3 个 0 得 1001000，做模 2 除法。
          explain: 1001 ⊕ 1011 = 0010；带下一位 0100，不够除，商 0；带下一位 1000 ⊕ 1011 = 0011；带最后一位 0110，不够除。余数 110，发送 1001110。

  - id: convolutional
    chapter: 信道编码初步
    title: 卷积码和维特比译码
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 分组码每次只看当前这一组数据。如果编码器还记住前面几位数据，每次输出都和它们有关，会有什么好处？
          options:
            - text: 每位数据影响好几组输出，零星错误能靠前后关系纠正
              correct: true
            - text: 输出会比输入少，起到压缩作用
              why: 卷积编码同样是加冗余，输出比输入多
            - text: 没有好处，前面一位出错会影响后面所有的输出，让错误越传越多
              why: 译码器利用的正是前后输出之间的约束关系，纠错能力反而更强
          explain: 这就是卷积码：编码器有记忆，输出由当前位和前几位共同决定。
      - card:
          title: 卷积码编码器
          body: 一个常用的码率 1/2 卷积码：编码器记住当前位 $u_k$ 和前两位，每输入 1 位输出 2 位：$v_1 = u_k \oplus u_{k-1} \oplus u_{k-2}$，$v_2 = u_k \oplus u_{k-2}$。生成多项式记作 (111, 101)，约束长度 $K = 3$。记住的前两位的取值叫状态，共 $2^{K-1} = 4$ 个。
          reveal:
            - title: 第 1 步：从全零状态开始
              body: |
                输入 1011。第 1 位 $u = 1$，前两位 0、0：$v_1 = 1$，$v_2 = 1$，输出 11。
            - title: 第 2 步：逐位往下
              body: |
                第 2 位 $u = 0$，前两位 1、0：输出 $1, 0$；第 3 位 $u = 1$，前两位 0、1：输出 $0, 0$。
            - title: 第 3 步：最后一位
              body: |
                第 4 位 $u = 1$，前两位 1、0：输出 $0, 1$。总输出 11 10 00 01。
      - item:
          id: conv-enc
          type: text
          format: "写 4 位 0 和 1，如 1011"
          prompt: 码率 1/2 卷积码，v₁ = u_k ⊕ u_{k−1} ⊕ u_{k−2}，v₂ = u_k ⊕ u_{k−2}，从全零状态开始输入 11。输出的 4 位是什么？
          answers: ['1101']
          hint: 第 2 位输入时，前两位是 1 和 0。
          explain: 第 1 位输出 11；第 2 位 v₁ = 1 ⊕ 1 ⊕ 0 = 0，v₂ = 1 ⊕ 0 = 1，输出 01。合起来 1101。
      - card:
          title: 网格图和维特比译码
          body: |
            把每个时刻的 4 个状态排成一列，按输入 0 或 1 连到下一时刻的状态，每条边标上输出的 2 位，得到网格图。编码就是在网格图里走一条路。

            维特比译码：收到一对比特，和每条边的输出比较汉明距离，累加到路径上；每个状态只保留累计距离最小的那条路（幸存路径），其余丢掉。最后选累计距离最小的路，读出输入。计算量和状态数成正比，和消息长短成线性关系，这让卷积码很实用。这个 (111, 101) 码的自由距离（任意两条不同编码序列之间的最小汉明距离）是 5，相邻的错误不太密时能纠正 2 个错。
      - item:
          id: viterbi-dec
          type: choice
          prompt: 码率 1/2 卷积码 v₁ = u_k ⊕ u_{k−1} ⊕ u_{k−2}、v₂ = u_k ⊕ u_{k−2}，从全零状态发 4 位数据，收到 11 11 00 01，最多错 1 位。维特比译码的结果是什么？
          options:
            - text: '1011'
              correct: true
            - text: '1111'
              why: 1111 编码后是 11 01 10 10，和收到的序列差 4 位
            - text: '1001'
              why: 1001 编码后是 11 10 11 11，和收到的序列差 4 位
          explain: 1011 编码后是 11 10 00 01，和收到的只差第 2 对的第 2 位，距离 1，是最近的码序列。
      - item:
          id: viterbi-keep
          type: choice
          prompt: 维特比译码在每个时刻、每个状态上保留什么？
          options:
            - text: 到达该状态的所有路径
              why: 那样路径数随时间指数增长；维特比算法的关键就是只留一条
            - text: 到达该状态、累计距离最小的一条路径
              correct: true
            - text: 只保留距离最小的那个状态，其他状态都丢掉
              why: 现在最好的状态以后不一定最好，所以每个状态都要留一条幸存路径
          explain: 两条路在同一状态汇合后，以后的发展完全一样，累计距离大的那条永远不会胜出，可以安全丢掉。
      - item:
          id: k7-states
          type: number
          prompt: 很多卫星和深空系统用约束长度 K = 7 的卷积码。它的网格图每一时刻有多少个状态？
          answer: 64
          hint: 状态由前 K − 1 位决定。
          explain: 2⁶ = 64 个状态。维特比译码每一步要比较 64 个状态的路径。

  - id: carrier-sync
    chapter: 同步
    title: 锁相环和载波同步
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 相干解调需要一个和发送载波同频同相的本地载波。BPSK 信号里没有单独的载波分量，接收机怎样得到它？
          options:
            - text: 从收到的信号里提取
              correct: true
            - text: 用一个和发射机一样精确的晶体振荡器就行
              why: 两个振荡器总有频率和相位差，而且传播路径也会改变相位，必须从收到的信号里跟踪
            - text: 用包络检波，就不需要载波了
              why: BPSK 的包络是常数，信息在相位里，包络检波取不出来
          explain: 载波同步要从收到的信号里提取载波的频率和相位，核心部件是锁相环。
      - card:
          title: 锁相环
          body: |
            **锁相环（phase-locked loop，PLL）**由三部分组成：鉴相器（比较输入和本地振荡的相位差，常用乘法器）、环路滤波器（低通，滤掉高频成分、决定环路的快慢）、压控振荡器（VCO，频率随控制电压变化）。

            相位差经滤波后去调 VCO，使相位差减小。锁定以后，VCO 的频率等于输入频率，相位紧跟输入。锁相环用来恢复载波、解调调频信号、合成频率、恢复时钟。
      - card:
          title: 平方环和科斯塔斯环
          body: |
            抑制载波的信号要先“造出”载波分量。平方环：BPSK 信号 $\pm A\cos\omega_ct$ 平方后是 $\frac{A^2}{2}(1 + \cos 2\omega_ct)$，符号消失，出现 $2f_c$ 分量，用锁相环锁住它再二分频。

            科斯塔斯环：用 VCO 的输出和它移相 90° 的信号分别与输入相乘（同相支路和正交支路），各经低通后再相乘，得到正比于 $\sin 2\varphi$ 的误差去控制 VCO。锁定时同相支路的输出就是解调结果。两种环都有 180° 的相位模糊，所以常配合差分编码（DPSK）使用。
      - item:
          id: square-why
          type: choice
          prompt: 平方环为什么要先把 BPSK 信号平方？
          options:
            - text: 去掉 ±1 的调制，得到 2f_c 的单频分量
              correct: true
            - text: 平方能把微弱的信号放大很多倍，从而提高解调时的信噪比
              why: 平方是为了去掉调制，噪声也会被平方，信噪比并不会提高
            - text: 平方后频率减半，便于处理
              why: 平方后出现的是 2f_c，频率加倍，最后还要二分频
          explain: (±1)² = 1，相位里的信息被抹掉，留下一个纯净的二倍频载波。代价是二分频后不知道是 0° 还是 180°。
      - item:
          id: mpsk-ambig
          type: number
          prompt: QPSK 的载波恢复要用 4 次方去掉调制，再四分频。恢复出的载波有多少度的相位模糊（相邻可能相位的间隔）？
          answer: 90
          hint: M 次方再 M 分频，相位模糊是 360°/M。
          explain: 360°/4 = 90°，恢复出的载波可能差 0°、90°、180°、270° 中的一个，要靠差分编码或已知的同步序列解决。
      - card:
          title: 频率合成器
          body: |
            在锁相环的反馈路径里加一个 $N$ 分频器：VCO 输出分频后和参考频率比较，锁定时 $f_{\text{out}}/N = f_{\text{ref}}$，即

            $$f_{\text{out}} = Nf_{\text{ref}}$$

            改变 $N$ 就能得到间隔为 $f_{\text{ref}}$ 的一系列频率，稳定度和参考晶振一样。手机、收音机用它产生本振。
      - item:
          id: synth-out
          type: number
          prompt: 频率合成器参考频率 25 kHz，分频比 N = 3600。输出频率是多少 MHz？
          answer: 90
          hint: 锁定时，输出频率除以 N 以后和参考频率是什么关系？
          explain: 3600 × 25 kHz = 90 000 kHz = 90 MHz。
      - item:
          id: synth-n
          type: number
          prompt: 频率合成器参考频率 200 kHz。要输出 935.2 MHz，分频比 N 应取多少？
          answer: 4676
          hint: 锁定时，输出频率是参考频率的几倍？
          explain: 935.2 MHz / 0.2 MHz = 4676。参考频率就是能调的最小频率间隔。

  - id: symbol-frame-sync
    chapter: 同步
    title: 码元同步和帧同步
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 接收机已经恢复了载波，解调出一串连续的波形。要把它变回比特，还缺什么？
          options:
            - text: 什么也不缺，直接按时间切开就行
              why: 不知道每个码元从哪一刻开始、在哪一刻采样最好，就切不准
            - text: 知道每个码元的最佳采样时刻，还要知道一帧从哪一位开始
              correct: true
            - text: 只缺一个更好的滤波器
              why: 滤波器改善信噪比，但不告诉你码元边界和帧的开头
          explain: 除了载波同步，还要码元同步（在哪一刻采样）和帧同步（哪一位是一帧的开头），三者缺一不可。
      - card:
          title: 码元同步和早迟门
          body: |
            码元同步（位同步）要让接收端的采样时钟和码元对齐，通常从信号本身提取，不另外传时钟。信号里的电平跳变带着定时信息，所以线路码要保证足够的跳变。

            早迟门同步器：在当前估计的采样时刻前后各取一点（早门和迟门）。匹配滤波器的输出在正确时刻最大、两边对称下降。早门的值比迟门大，说明估计的时刻偏晚，应提前；迟门大则应推后；两者相等时正好对准。
      - item:
          id: early-late
          type: choice
          prompt: 早迟门同步器发现早门的输出明显大于迟门的输出。应该怎样调整采样时刻？
          options:
            - text: 提前
              correct: true
            - text: 推后
              why: 早门更靠近峰值，说明峰值在当前估计时刻之前，应该往前调
            - text: 不用调，早门大说明信号强
              why: 两门大小不等说明没有对准峰值，要调到两者相等
          explain: 匹配滤波器输出在正确时刻达到峰值。早门那一侧更高，峰值就在当前估计之前，要提前。
      - card:
          title: 帧同步和巴克码
          body: |
            帧同步（群同步）要找到每一帧的开头。办法是定期插入一个已知的同步码，接收端不断计算收到的序列和同步码的相关值，出现峰值处就是帧头。E1 把同步码集中放在时隙 0，T1 每帧只插 1 位、分散在多帧里。

            好的同步码自相关要尖：对准时值很大，错开任何位数都很小。7 位巴克码 1110010（写成 ±1 是 $+ + + - - + -$），对准时自相关为 7，错开时绝对值都不超过 1。
      - item:
          id: barker-peak
          type: number
          prompt: 7 位巴克码 + + + − − + −（取值 ±1）和自己对准时的自相关值是多少？
          answer: 7
          hint: 对准时每一位都是同号相乘。
          explain: 7 个 (+1)×(+1) 或 (−1)×(−1) 相加，等于 7。错开 1 到 6 位时的值是 0 或 −1。
      - card:
          title: 假同步和保护
          body: |
            随机数据里也可能碰巧出现和同步码一样的图样，造成假同步；噪声也可能让真的同步码被判错，造成漏同步。$n$ 位同步码被随机数据碰巧冒充的概率约为 $2^{-n}$，所以同步码不能太短。

            常用的办法是前后方保护：在失步状态下，连续几帧都在同一位置检到同步码才确认同步（防假同步）；在同步状态下，连续几帧都检不到才判失步（防漏同步）。
      - item:
          id: false-sync
          type: number
          prompt: 随机数据中某一位置的 7 位正好和 7 位同步码相同的概率是百分之几？（保留两位小数）
          answer: 0.78
          tolerance: 0.005
          hint: 每一位相同的概率是 1/2。
          explain: (1/2)⁷ = 1/128 ≈ 0.78%。一帧里有很多位置，所以单靠一次匹配不可靠，要加保护。
      - item:
          id: sync-protect
          type: choice
          prompt: 为什么帧同步系统要在“连续几帧都检测到同步码”之后才确认同步？
          options:
            - text: 防止随机数据碰巧和同步码相同造成假同步
              correct: true
            - text: 因为同步码不是每帧都有，每隔几帧才插入一次
              why: 同步码每帧都有；连续几帧检验是为了排除偶然的碰巧匹配
            - text: 为了降低误码率
              why: 保护措施降低的是同步出错的概率，不改变数据本身的误码率
          explain: 随机数据碰巧匹配的位置是随机的，不会在连续几帧的同一位置重复出现，真的帧头则会。

boss:
  items:
    - id: b-capacity
      type: number
      prompt: '某信道带宽 4 kHz，信噪比 20 dB。香农信道容量是多少 kb/s？（保留一位小数）'
      answer: 26.6
      tolerance: 0.05
      explain: S/N = 100，C = 4000 × log₂101 ≈ 26.6 kb/s。
    - id: b-ktb
      type: number
      prompt: '290 K 下 100 kHz 带宽内的热噪声功率是多少 dBm？（$k = 1.38 \times 10^{-23}$ J/K，保留到个位）'
      answer: -124
      tolerance: 0.5
      explain: −174 dBm/Hz + 10 log₁₀10⁵ = −174 + 50 = −124 dBm。
    - id: b-carson
      type: number
      prompt: 调频系统最大频偏 25 kHz，调制信号最高频率 5 kHz。按卡森公式带宽约多少 kHz？
      answer: 60
      explain: 2 × (25 + 5) = 60 kHz。
    - id: b-am-power
      type: number
      prompt: 常规调幅单音调制，载波功率 400 W，调幅指数 0.5。两个边带的功率合计是多少瓦？
      answer: 50
      explain: 边带合计 = (μ²/2) P_c = 0.125 × 400 = 50 W。
    - id: b-pcm
      type: number
      prompt: 满幅正弦信号用 10 位均匀量化的 PCM 编码。量化信噪比是多少 dB？（保留一位小数）
      answer: 62.0
      tolerance: 0.05
      explain: 6.02 × 10 + 1.76 ≈ 62.0 dB。
    - id: b-nyquist
      type: number
      prompt: 基带信道带宽 3 kHz，用滚降系数 0.5 的升余弦滤波。无码间干扰的最高码元速率是多少波特？
      answer: 4000
      explain: R_s = 2B/(1 + α) = 6000/1.5 = 4000 Baud。
    - id: b-mf
      type: choice
      prompt: 发送脉冲是 s(t)，0 ≤ t ≤ T，噪声是白噪声。匹配滤波器的冲激响应和最大输出信噪比分别是什么？
      options:
        - text: h(t) = s(T − t)，最大信噪比 2E/N₀
          correct: true
        - text: h(t) = s(t)，最大信噪比 2E/N₀
          why: 冲激响应要把 s(t) 在时间上翻转再右移 T，直接用 s(t) 一般不在 t = T 得到最大值
        - text: h(t) = s(T − t)，最大信噪比 E/N₀
          why: 噪声双边谱是 N₀/2，最大信噪比是 E 除以 N₀/2，即 2E/N₀
        - text: 用带宽等于信号带宽的理想低通，最大信噪比 2E/N₀
          why: 一般形状的脉冲用理想低通达不到 2E/N₀，只有和脉冲匹配的滤波器才能
      explain: 匹配滤波器 h(t) = Ks(T − t)，在 t = T 采样时信噪比达到最大值 2E/N₀，和脉冲形状无关。
    - id: b-qam
      type: number
      prompt: 64-QAM 以 2 MBaud 传输。比特率是多少 Mb/s？
      answer: 12
      explain: log₂64 = 6，6 × 2 = 12 Mb/s。
    - id: b-bpsk
      type: number
      prompt: 'BPSK 相干解调，$E_b/N_0 = 7$ dB。误比特率是多少？（单位 $10^{-4}$，保留一位小数）'
      answer: 7.7
      tolerance: 0.05
      explain: 10^0.7 ≈ 5.01，Q(√10.02) = Q(3.17) ≈ 7.7 × 10⁻⁴。
    - id: b-hamming
      type: number
      prompt: 一种分组码的最小码距是 7。用来纠错时最多能纠正几个错误？
      answer: 3
      explain: 7 ≥ 2t + 1，t ≤ 3。
    - id: b-sync
      type: choice
      prompt: 关于载波同步，下面哪一项正确？
      options:
        - text: 两种环恢复的 BPSK 载波都有 180° 相位模糊
          correct: true
        - text: 只要收发两端用同样精度的晶振，就不需要载波同步
          why: 晶振总有频差，传播路径也改变相位，相干解调必须跟踪收到信号的相位
        - text: BPSK 信号里有很强的载波分量，用窄带滤波器直接滤出即可
          why: 等概率的 BPSK 是抑制载波的，没有单独的载波分量，要先平方或用科斯塔斯环
        - text: 锁相环锁定后，VCO 的频率是输入频率的一半
          why: 锁定时 VCO 频率等于输入频率；只有反馈里有分频器时输出才是参考频率的 N 倍
      explain: 两种环路都从去掉了 ±1 调制的信号里恢复载波，无法分辨 0° 和 180°，所以常配合差分编码使用。
