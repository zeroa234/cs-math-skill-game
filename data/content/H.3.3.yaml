skill: H.3.3
version: 2
authors: [main-agent]
brief:
  why: |
    在芯片真正看见温度、声音或转动轮子之前，传感器吐出的往往只是几毫伏弱差值、带固定零点偏差且夹着高频干扰的原始模拟量，或是挂在 I²C、SPI、UART 总线上的数字包。从测量转导、惠斯通电桥调理放大、两点标定与准确/精密误差分辨，穿过串行总线与物理链路选型、过采样提升分辨率，直到 PWM 加 H 桥安全驱动直流电机，打通真实物理世界与嵌入式芯片的整条接口链。
  outcomes:
    - 理解传感器转导原理与惠斯通电桥微小电阻测量机制，掌握信号调理（缓冲/放大/平移/抗混叠滤波/保护）整链设计
    - 区分准确度与精密度、固定系统偏移与随机误差，用两点线性标定消除零点偏置与斜率偏差并换算元件温漂系数
    - 掌握 UART、I²C（含 7 位寻址、开漏上拉及地址冲突解法）与 SPI（4 线全双工高速片选）及 RS485/USB 物理链路选型
    - 掌握采样速率防混叠匹配及 12 位 ADC 每 4 倍过采样均值换取约 1 位有效分辨率（前提为存在充分白噪声抖动）
    - 掌握输入捕获测量频率、占空比等效平均电压计算、H 桥双向控制与感性负载续流二极管保护及整链系统验收测试
terms:
  - term: 传感器
    def: '又称转导器（Transducer），把温度、压力、光强、应变或角速度等物理量按一定规律转换成可测电信号的敏感探测器件'
  - term: 惠斯通电桥
    def: '四只电阻搭成的桥式检测网络，平时平衡输出零电压，仅当待测敏感电阻出现极微小变化时才产出对称差分电压，极擅抑制共模干扰与温漂'
  - term: 校准
    def: '用已知准确的外部物理参考基准点比对仪表原始输出，求取零点偏差与比例斜率修正规则以还原真实值的过程'
  - term: 精密度
    def: '英文 Precision，指同一真实输入下连续多次重复测量结果之间彼此靠近、波动离散有多小的稳定一致性程度'
  - term: 准确度
    def: '英文 Accuracy，指测量读数的平均中心位置距离真实物理标准真值到底有多近的偏差正确度程度'
  - term: I²C
    def: '仅靠 SDA（数据）与 SCL（时钟）两根开漏上拉线、凭 7 位器件地址半双工挂载多颗慢中速外设芯片的同步两线串行总线'
  - term: SPI
    def: '靠时钟 SCLK、主机发从机收 MOSI、主机收从机发 MISO 与每颗从机一条独立片选 CS 共 4 线高速全双工通信的同步串行总线'

lessons:
  # ==== 测量 ====
  - id: measurement
    chapter: 测量
    title: 物理量转导、传感器特性曲线与量纲单位换算
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            芯片内部核心其实只懂伏特（电压）和数字 0/1，根本看不懂屋里现在是多少“摄氏度”或压力有多“牛顿”。电子秤与温控空调怎么让微控制器感知温度、拉力与光强？
          options:
            - text: 靠前端转导器件把温度、形变或光照物理变化映射成“电阻值、电容量或毫伏电压变化”，再交给调理电路接进转换芯片。
              correct: true
            - text: 在主板上贴一张普通纸质温度计，让芯片自己睁眼看刻度
              why: 芯片必须借助把非电物理量变成可测电参量变化的物理传感元件完成桥梁转换
            - text: 不管温度高低，所有元件物理电阻永远绝对不动
              why: 金属热电阻 RTD、热敏电阻 NTC 与金属箔应变片正是靠材料电阻随温度或机械拉伸改变来感知物理量
          explain: |
            一切真实采集系统的第 1 环就是 **物理转导与测量前端**。
      - card:
          title: '传感器（转导器）核心原理与敏感类型'
          body: |
            **传感器** 又称转导器（Transducer），把非电物理量按稳定可重复规律转化成电信号：
            - **阻性敏感**：铂热电阻（RTD）、热敏电阻随温度改变电阻；应变片贴在秤台随弯曲微幅拉伸改阻值；
            - **电势 / 电流型**：热电偶靠双金属接点温差产生微弱毫伏电动势；光电二极管照光产生按比例变化的光电流；
            - **静态指标读懂手册**：灵敏度（每变化 1 单位物理量输出变化多少毫伏/欧姆）、量程与线性度。
          reveal:
            - title: 有源产生电压型 vs 无源变参数型传感器在接法上有什么区别？
              body: |
                像热电偶、压电片自带微弱输出电压可以直接送高输入阻抗放大器；而热敏电阻、应变片、光敏电阻只是“自己阻值在变”本身并不发电。必须外配恒流源激励，或塞进分压器、电桥网络里才能把“欧姆变化”先翻译成可测量的“伏特变化”。
                为什么要先懂转导？单片机只会读电压：温度、压力、光照这些量必须先在传感器里变成电压、电流或电阻的变化，再经过调理电路变成匹配量程的电压，最后才交给 ADC 变成数字。前面一环丢掉的信息，后面的电路和软件都补不回来，所以选传感器时要先看灵敏度、量程和线性度够不够用。
            - title: 看懂传感器手册上的“线性度、迟滞与时间常数”三个常踩指标
              body: |
                光看灵敏度不够：**非线性度**说明电压曲线偏离理想直线的最大弯曲百分比；**迟滞（Hysteresis）**表示温度从冷升高与从热降低经过同一温度点时读出两套略微不同的数值（由机械摩擦或材料内应力记忆效应造成）；热惰性时间常数 $\tau$ 则决定探头放进热水后要等待多少秒才能真实跟上水温的阶跃跳变并稳定下来。
      - item:
          id: transducer-sensitivity-mv
          type: number
          prompt: |
            一颗线性模拟温度传感器手册写明：灵敏度为 `10 mV / °C`，当处于 `0 °C` 时输出基准 `0 mV`。如果此刻温度计测得环境温度上升了 `4 °C`（处在 `4 °C`），传感器输出电压是多少毫伏（mV）？
          answer: 40
          hint: '用传感器灵敏度乘以相对零点的温度变化量。'
          explain: |
            $4\ ^\circ\text{C} \times 10\text{ mV/}^\circ\text{C} = 40\text{ mV}$；如果温度计标称带 `500 mV` 零度偏置（如常见 TMP36），就再叠加上去即可。
      - item:
          id: sensor-offset-mv-calc
          type: number
          prompt: |
            某商用线性模拟温度芯片（如 TMP36 风格）规定 `0 °C` 时已有基准偏置 `500 mV`，温度每上升 `1 °C` 输出增加 `10 mV`。当前室温恰好是 `25 °C` 时，芯片引脚输出端是多少毫伏（mV）？
          answer: 750
          hint: '在零度基准偏置电压基础上，加上 `25 °C` 乘以每度增大的毫伏灵敏度。'
          explain: |
            $500 + 25 \times 10 = 750\text{ mV}$（加零点偏置的好处是无需负电源也能轻松测零下 `-40 °C`）。
      - item:
          id: rtd-passive-why
          type: choice
          prompt: |
            电子秤用的金属箔应变片（阻值在 `120 Ω` 左右随重量变化零点几欧姆）属于无源变阻器件，为什么绝不能直接把两根线往芯片 **ADC** 脚上一插就指望读出电压数字？
          options:
            - text: 应变片自己并不会主动产生电压，必须借助外部激励电流或分压电桥电路把微弱电阻变化转成差分电压变化后再放大送入 ADC
              correct: true
            - text: 因为芯片的 ADC 规定永远只准读取整数 `120` 伏电压
              why: ADC 采集的是电压信号而不是直接测量纯电阻阻值
            - text: 因为应变片只能在零下二百度真空工作
              why: 金属箔应变片在常温常压下即可正常测力，问题只在于它自身不产生电压、需要外配激励电源与电桥转压。
          explain: |
            有源器件直出电势，无源阻容感器件需先“激励转压”再放大——接传感器第一步看清它是谁。
      - item:
          id: measurement-types-match
          type: match
          prompt: |
            把几类常用传感探测元件配对到各自感知的物理量与输出特征。
          pairs:
            - ["金属箔应变片", "受力微小机械拉压产生几微欧到零点几欧电阻变化，常用于电子秤"]
            - ["铂热电阻 / NTC", "随温度升高呈可预测电阻变化，广泛用于精密测温"]
            - ["热电偶", "两种不同金属焊接点受热冷温差直接产出几十微伏每度微小电压"]
            - ["光电二极管", "入射光强变化直接产出线性比例光电流信号"]
          explain: |
            搞清楚物理量怎么变成欧姆/微伏变化，紧接着就能设计干净的调理链路把这几毫伏精准撑进 ADC 满量程。

  - id: signal-chain
    chapter: 测量
    title: 惠斯通电桥测微电阻变化与传感器信号调理全链路
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            贴在电子秤上的金属应变片平时基准是 `1000 Ω`，今天上面放了个小苹果，阻值才悄悄涨了极其微小的一丁点到 **`1000.5 Ω`**（仅变化 `0.05%`）。如果拿它跟另一只固定 `1000 Ω` 串起来从 `5 V` 简单分压，平时输出就已经停在 `2.5000 V`，放苹果后仅仅微颤变成 `2.5006 V`——哪怕你想放大 100 倍，原本那巨大的 **`2.5 V` 直流底座** 早就一头把放大器直接顶死撞墙饱和了。怎么才能单独抠出那微小的 `0.05%` 变化？
          options:
            - text: 搭一只四臂惠斯通电桥（左边两臂恒定 2.5 V 作对照基准，右边放着应变片），平衡时两端压差直接抵消掉成 `0.000 V`，放重物时只剩下纯净微小压差给后端大倍放大。
              correct: true
            - text: 把苹果狠狠砸扁直到电阻变成一百万欧姆再测
              why: 实际金属应变片与 RTD 变化量极微弱，必须靠电桥先把巨大的共同静态底座减法抵消归零。
            - text: 让放大器把 2.5 V 放大 100 倍变成 250 伏直接烧坏芯片
              why: 先通过电桥差分抵消静态共模直流偏置，才能放心对纯变化差值信号上百倍高倍放大。
          explain: |
            简单分压时 `2.5 V` 的大底子里只变了 `0.6 mV`，一放大底子也跟着放大；电桥平衡时两端压差是 0，只剩那一点变化可以放大。这一课讲 **惠斯通电桥** 为什么适合测微小的电阻变化，以及完整的 **信号调理五个环节**。
      - card:
          title: '惠斯通电桥与完整传感器信号调理链路'
          body: |
            - **惠斯通电桥**（Wheatstone Bridge）：四只电阻分成左右两支分压从 `V_exc` 供电。当四臂平衡时中点压差 `V+ - V- = 0 V`；一旦敏感臂出现微变 $\Delta R$，仅微小差分压差浮出来。配合高输入阻抗仪表放大器，不仅轻松放大微伏级真变化，还把共同供电抖动与共同温漂**共模抵消**掉。
            - **调理五大核心步骤**：① 缓冲 / 阻抗匹配（不吸垮高阻探头）；② 放大至接近 ADC 满量程；③ 电平移位对齐单电源区间；④ 模拟低通滤波去噪与抗混叠；⑤ 限幅/隔离保护与非线性软件校准。
          reveal:
            - title: 为什么“先把信号放大到接近 ADC 满量程”对保住精度这么关键？
              body: |
                假使一颗 12 位 `3.3 V` ADC 每格步长固定 `0.8 mV`：如果你偷懒把传感器微弱的 `0 ~ 33 mV` 小信号直接硬塞进 ADC，全量程 `4096` 格里只用到可怜的头 `40` 格（精度跌成 5 位半废铁）；经过精密仪表放大器精准放大 100 倍撑满成 `0 ~ 3.3 V` 再进 ADC，足足吃满全部 `4096` 格高分辨能力。
            - title: 动手算一笔实际数值：惠斯通电桥中电阻臂变动 1% 产生多大差分压差？（已由 `ngspice` 实测）
              body: |
                四臂基准全为 `1000 Ω`，用 `5 V` 直流激励：平衡时左右中点同为 `2.5000 V`（压差 `0`）；若下臂阻值升高 `10 Ω` 变成 `1010 Ω`，右侧分压抬高成 $5 \times \frac{1010}{1000 + 1010} \approx 2.51244\text{ V}$，左臂仍守在 `2.5000 V`，电桥出口正好干净产出 **`12.44 mV`** 纯变化差值（由 WSL `ngspice` 仿真核验丝毫不差）。
            - title: 半桥 vs 全桥接法怎么把电桥灵敏度再翻一倍至四倍？
              body: |
                上面只换一只应变片叫“四分之一桥”。如果在弯曲钢梁正反两面各自贴两只、一边受拉变大一边受压变小接入相邻桥臂（半桥），或者四只桥臂对称全贴上应变片（全桥）：不仅总差分压差一跃变成两倍到四倍、灵敏度大幅拉高，连环境室温同时拉长全部金属箔造成的共模温漂也能互相彻底减掉。
      - item:
          id: wheatstone-why-c4
          type: choice
          prompt: |
            用金属应变片或铂热电阻测量微弱阻值变化时，硬件入口为什么几乎清一色采用 **惠斯通电桥** 接仪表放大器，而不是只靠单只电阻分压？
          options:
            - text: 平衡电桥先把静态大直流分压抵消成 0 V，使极微小电阻变化单独产生干净差分电压便于高倍放大，同时借助对称臂互相抵消温度共模漂移与激励电压波动
              correct: true
            - text: 惠斯通电桥能让电阻物理阻值自动放大一千倍且免除外部供电
              why: 电阻桥依然需要外部参考电源供电激发，只是把“静态大基底压降”在电桥两端差分减掉了。
            - text: 电桥可以把任何电阻变化彻底清零成永远不变的 0
              why: 只有四臂全平衡时输出才为 0；只要检测臂有微小失衡就会立刻按比例显现差分电压。
          explain: |
            **先差分去掉巨型直流底座、再高倍高输入阻抗仪表放大**——精密传感检测万古不变之宝典。
      - item:
          id: conditioning-chain-steps-c4
          type: choice
          prompt: |
            把微弱传感器信号干净、安全、充分利用量化精度地送入 `0 ~ 3.3 V` 单极性 ADC 引脚，典型模拟信号调理通常囊括哪些环节？
          options:
            - text: 高阻缓冲/阻抗匹配、按比例放大以贴近满量程、电平移位（对齐 0~3.3 V 窗口）、去噪与抗混叠低通滤波，以及过压钳位保护/非线性校准
              correct: true
            - text: 直接将 100 V 交流电机线裸接进 MCU 的 3.3 V ADC 引脚且禁止任何滤波与限幅
              why: 超出供电轨电压立刻烧穿芯片 ESD 保护管；缺乏滤波与满量程适配会严重引入混叠和量化精度损失
            - text: 先把信号故意缩小 1000 倍后再去进 ADC
              why: 缩小会大幅浪费 ADC 宝贵数字格数、令本底噪声占尽上风，放大匹配满量程才是正解。
          explain: |
            缓冲不拉垮、放大吃满格、移位落进窗、低通挡混叠、钳位保性命——五步记住，百发百中。
      - item:
          id: bridge-balance-choice
          type: choice
          prompt: |
            一只标准对称惠斯通电桥上方左、右两臂皆为 `1 kΩ`，下方左臂也是 `1 kΩ`，下方右臂接了一颗待测传感电阻 `R_x`。若当前电桥差分输出端 `V+ - V-` 刚好严格等于 **`0.000 V`**（电桥平衡），此时 `R_x` 必然是多少欧姆？
          options:
            - text: '`1000 Ω`（满足对称比值条件 $R_1 / R_2 = R_3 / R_4$ 时左右中点电位相等）'
              correct: true
            - text: '`0 Ω`（彻底短路时才可能平衡输出 0）'
              why: 若右下方短路为 `0 Ω`，右中点跌死到 `0 V` 而左中点停在 `2.5 V`，差分端反而冲出整整 2.5 V 最大失衡压差。
            - text: '`5000 Ω`'
              why: 仅当左臂上下比值严格等于右臂上下比值时两端电位相等
          explain: |
            记住电桥通用平衡方程：$R_1 \cdot R_4 = R_2 \cdot R_3$。
      - item:
          id: conditioning-roles-match
          type: match
          prompt: |
            把前端信号调理各环节匹配到它们解决的具体工程痛点。
          pairs:
            - ["高输入阻抗缓冲（跟随器）", "防止内阻较高的传感器一旦连入电路就被吸走电流导致电压塌陷"]
            - ["仪表/同相高倍放大", "把几毫伏弱差值撑大贴近 ADC 满量程以用足所有离散数字编码格"]
            - ["电平移位（Level Shift）", "将包含负半周的 `±1 V` 双极性信号整体抬升对齐进 `0 ~ 3.3 V` 单电源窗口"]
            - ["钳位二极管与 RC 抗混叠滤波", "挡住超过半采样率的高频混叠杂波并拦截意外高压浪涌防止烧芯片"]
          explain: |
            模拟前端（AFE）就是专为芯片 ADC 保驾护航的完美保镖与翻译官。

  # ==== 校准 ====
  - id: calibration
    chapter: 校准
    title: 两点线性标定消除零点与斜率偏差及温度系数测定
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            买来一批同一型号模拟温度计，理论上 `0 °C` 应该出 `0.50 V`、温度每涨 `100 °C` 多 `1.00 V`（即 `10 mV/°C`）。可拿到手实测：泡进标准冰水混合物 `0 °C` 时它偏偏输出 `0.52 V`（零点偏了），插进标准 `100 °C` 沸水时它输出 `1.52 V`。如果此刻读到引脚电压 `0.97 V`，难道因为出了点零点偏移这块温度计就彻底报废不能用了吗？
          options:
            - text: 完全不用扔。拿两个已知精准温度标准点（`0 °C` 和 `100 °C`）量出它的实际直线斜率与零点截距做一次两点线性校准，直接一秒反算出准确温度 `45 °C`。
              correct: true
            - text: 必须扔掉重买一万个直到碰巧遇到 0.500000 V 为止
              why: 哪怕贵价高精度工业传感器出厂也带有微小零点偏移与灵敏度公差，现场标定正是必走流程。
            - text: 把读到的电压直接当温度写成 0.97 度
              why: 电压与物理温度之间需经过实际测得的斜率与截距线性标定公式转换才准。
          explain: |
            用两个已知温度点量出实际的斜率和零点，就能反算出准确温度：斜率 $(1.52 - 0.52)/100 = 0.01$ V/°C，$0.97$ V 对应 $(0.97 - 0.52)/0.01 = 45$ °C。这一课讲 **两点线性校准、斜率推算与电阻温度系数标定**。
      - card:
          title: '**校准**（两点线性标定）与电阻温度系数换算'
          body: |
            **两点线性校准**（Two-Point Calibration）同时揪出并消灭“零点偏移（Offset）”和“灵敏度斜率偏差（Gain Error）”：
            1. 用两个已知标准点 $(x_1, y_1)$ 与 $(x_2, y_2)$ 求实际直线斜率：$$k = \frac{y_2 - y_1}{x_2 - x_1}$$
               （例如 `0 °C → 0.52 V` 与 `100 °C → 1.52 V` → 斜率 $k = \frac{1.52 - 0.52}{100 - 0} = \mathbf{0.01\text{ V/}^\circ\text{C}}$）；
            2. 测得任意新电压 $V$ 时直接反推物理量：$$T = x_1 + \frac{V - y_1}{k}$$
               （例如读到 `0.97 V` → $T = \frac{0.97 - 0.52}{0.01} = \mathbf{45\ ^\circ\text{C}}$；读到 `1.02 V` → `50 °C`）。
          reveal:
            - title: 怎样用参考温标标定铜/镍电阻的温度系数 $\alpha$？
              body: |
                实验把电阻放进恒温油浴测两端电压电流求出精密阻值：在基准温度 $T_0$（例如 `0 °C`）下阻值为 $R_0 = 100\ \Omega$，升温 $\Delta T = 20\ ^\circ\text{C}$ 后测得阻值涨至 $108\ \Omega$。温度系数定义为单位温度相对变化率：
                $$\alpha = \frac{R - R_0}{R_0 \cdot \Delta T} = \frac{108 - 100}{100 \times 20} = 0.004\ ^\circ\text{C}^{-1} = \mathbf{0.4\% / ^\circ\text{C}}$$
                知道了材料实际标定出来的 $\alpha$，电阻立刻就能变身为精确的工业测温计。
            - title: 热敏电阻 NTC 等严重非线性器件两点校准还够用吗？
              body: |
                金属铂热电阻 RTD 与模拟集成芯片在宽温区极其接近直线，做两点标定足矣；而像负温度系数热敏电阻（NTC）的阻值随温度呈剧烈指数下降弯曲，跨度超 `50 °C` 若只做一条死直线会偏出几度误差。对强非线性传感器工程常配“**多点查表插值**”或用经典三系数 **Steinhart-Hart 经验方程**还原精度。
            - title: 产线标定保存“斜率 $k$ 和零点截距 $b$”时为什么切记存入芯片断电不丢的区？
              body: |
                每一片物理传感探头都有微妙差异：产线上花五分钟把每台机器在恒温箱量出的专属校准参数写入 MCU 内部非易失 Flash（或挂在一旁的 EEPROM 存储芯片，并顺手附带一节 CRC 校验防止篡改读乱）——哪怕将来电池彻底断电拆换，下次开机依然自动加载原厂校准系数精准读数。
      - item:
          id: cal-temp-45-c4
          type: number
          prompt: |
            对某模拟温度传感器做两点**校准**测得：`0 °C` 时输出电压 `0.52 V`，`100 °C` 时输出 `1.52 V`（假设响应严格线性）。当用万用表测得输出电压为 `0.97 V` 时，对应的真实环境温度是多少摄氏度（°C）？
          answer: 45
          hint: '先用两端电压变化量除以温差求每摄氏度对应的斜率（V/°C），再看当前读数高出零度基准电压几步斜率。'
          explain: |
            斜率 $= (1.52 - 0.52) / (100 - 0) = 0.01\text{ V/}^\circ\text{C}$；真实温度 $= (0.97 - 0.52) / 0.01 = 45\ ^\circ\text{C}$。
      - item:
          id: cal-temp-50-extra
          type: number
          prompt: |
            已知一只模拟线性温度传感器经两点校准确定：`0 °C` 时基准输出电压为 `0.52 V`，灵敏度斜率为 `0.01 V/°C`。当引脚测得电压恰好为 `1.02 V` 时，环境温度是多少摄氏度（°C）？
          answer: 50
          hint: '计算新读数减去零度时的基准输出电压，再除以每度变化斜率。'
          explain: |
            $(1.02 - 0.52) / 0.01 = 0.50 / 0.01 = 50\ ^\circ\text{C}$。
      - item:
          id: tempco-04pct
          type: number
          prompt: |
            参照一个经典的测温实验：一只参考基准温度下阻值 $R_0 = 100\ \Omega$ 的测温电阻，当温度上升了 $\Delta T = 20\ ^\circ\text{C}$ 后阻值增加到了 $108\ \Omega$。它的相对电阻温度系数 $\frac{R - R_0}{R_0 \cdot \Delta T}$ 是每摄氏度百分之多少（填小数，例如 `0.5% / °C` 则填 `0.5`）？
          answer: 0.4
          hint: '先算阻值相比基准增加了百分之多少（相对变化率 $\frac{108 - 100}{100}$ 转成百分比），再除以温升度数 `20`。'
          explain: |
            总相对涨幅 $(108 - 100) / 100 = 8\%$，摊到 `20 °C` 温升上等于 `8% / 20 = 0.4% / °C`（`0.004 / °C`，与纯铂 RTD 常见标准 `0.385% / °C` 极其接近）。
      - item:
          id: one-vs-two-point-cal
          type: choice
          prompt: |
            如果只拿“冰水 `0 °C` 这 **1 个标准点**”测出传感器读数做单点偏置减法校准，和“同时拿 `0 °C` 与 `100 °C` **2 个标准点**”做两点线性校准相比，区别主要在哪？
          options:
            - text: 单点校准只能修正固定的零点偏移，无法发现并纠正灵敏度斜率放大倍数偏差；两点线性校准能同时消除零点偏移和斜率比例误差。
              correct: true
            - text: 单点校准需要用掉 100 只传感器，两点校准什么都没测出
              why: 数学上两点才能唯一确定一条直线 `y = k·x + b` 的两个未知系数（斜率 `k` 与截距 `b`）。
            - text: 两点校准只能用在数字开关 0/1 上，不能用于连续电压温度
              why: 连续线性曲线拟合正是两点乃至多点分段查找表校准的主战场
          explain: |
            零点对不上看截距（一点能修），放大倍偏了看斜率（两点必测）。遇到热敏电阻等严重非线性器件则用三参数模型或查表分段线性校准。

  # ==== 误差 ====
  - id: uncertainty
    chapter: 误差
    title: 精密度 vs 准确度、固定偏置/随机噪声与元件容差传播
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            用一支精密却没做零点校准的温度计连续测 `5` 遍同一杯恒温 `20 °C` 水，读出来稳稳当当全都在 `22.01、21.99、22.00、22.00、22.00 °C` 上下波动（几乎毫不飘散，却整整集体比真实水温多出 `2 °C`）。打靶形容就是“五发子弹全紧紧簇成一小团全打偏在左上角 5 环”。请问这叫“精密”还是叫“准确”？
          options:
            - text: '精密度（重复性）极高，但准确度很差（带着稳固的系统固定正偏差 `+2 °C`）。'
              correct: true
            - text: 准确度极高但精密度差得一塌糊涂
              why: 重复 5 次几乎一丝不晃全落在 22.00 附近叫**精密度高**；但平均中心 `22` 偏离真值 `20` 足足两度叫**准确度低**。
            - text: 在中文物理工程里“精密度”和“准确度”永远是彻底完全同义的词
              why: 分辨这两个概念是评估传感器到底只需“静态标定减偏置”还是已经因为自身噪声彻底救不活的关键分水岭。
          explain: |
            五次读数几乎不分散，说明精密度高；可它们整体比真实值高 `2 °C`，说明准确度差。这一课分清 **精密度（Precision）、准确度（Accuracy）与元件公差误差**。
      - card:
          title: '**精密度** vs **准确度**与测量误差三大来源'
          body: |
            - **精密度**（Precision）：重复多次测量相同被测量时，读数彼此相互靠近一致的**重复集中程度**（受随机噪声起伏支配，打靶越聚拢越精密）；
            - **准确度**（Accuracy）：测量平均值距离客观物理**真实真值**到底有多靠近（既需低随机散乱，更要求系统偏移校准归零）；
            - **工程救法截然不同**：**精密度高却不准确**（有固定偏差如 `22 vs 20`）极好办——做一次 **校准** 减去偏差即秒变“又准又稳”。反之若读数乱飞上下跳动整整十度（**精密度差**），靠简单减固定偏移救不了，必须先靠低通滤波或多次平均压噪声。
          reveal:
            - title: 为什么挑电阻电容做放大和电桥时还要算“元件容差（Tolerance）”？
              body: |
                商店最便宜的 `±5%` 碳膜电阻哪怕标着 `10 kΩ`，真实出厂阻值其实可能乱落在 `9.5 kΩ ~ 10.5 kΩ` 之间。如果拿两只普通 `±5%` 电阻拼分压或运放 `10` 倍放大，极限反号最坏公差可能直接让你的仪表放大倍数偏离接近 `±10%` 甚至更大。因此前端精密桥路与基准分压必选 `±0.1%` 低温漂精密金属膜电阻。
            - title: 为什么在噪声分析里总要用统计标准差与正态分布估算安全置信边界？
              body: |
                单靠减去静态均值只能对付固定偏移；随机热噪声每次跳动虽平均值为 `0`，但方均根大小（标准差 $\sigma$）决定了单次读数多远才算偶发波动——统计学说明约 `99.7%` 的高斯白噪声落进 `±3σ` 区间内。在编写报警门限软件时，把触发报警冗余量留出超过 `3σ ~ 5σ` 并辅以连续越限防抖，才能既不错报又绝不乱鸣。
      - item:
          id: precision-vs-accuracy-c4
          type: choice
          prompt: |
            用仪器测量某标准恒定 `20 °C` 恒温槽三次，读数分别为 `22.00 °C`、`22.01 °C`、`21.99 °C`。对该仪器的误差状态评价完全准确的是？
          options:
            - text: 精密度（重复性）很高，但准确度较差（存在约 `+2 °C` 固定系统偏差），只需通过一次零点校准即可修正准确
              correct: true
            - text: 准确度极高（丝毫不用校准），精密度非常糟糕
              why: 三次读数极紧密集中于 `22.00` 附近说明**精密度高**，偏离真值 `20.00` 整整两度说明**准确度不佳**
            - text: 读数发散太严重了，就算校准减掉 `+2 °C` 也永远不准
              why: 每次读数只上下晃 `0.01 °C`，减掉固定 `2 °C` 偏差后瞬间变得既精密又准确。
          explain: |
            工程谚语：**怕不精密（抖得没谱），不怕不准确（稳稳偏在一边一刀校准归正）**。
      - item:
          id: bias-error-calc
          type: number
          prompt: |
            真实真值温度为 `20 °C`，传感器连续三次测量读数全稳定落在 `22 °C`（`22, 22, 22`）。这个测量系统当前的固定系统偏差（测量均值减去真实真值）是多少摄氏度（°C）？
          answer: 2
          hint: '算出三次读数的平均观测值，减去外部标准器给出的真实物理参考真值。'
          explain: |
            均值 `22 - 20 = +2 °C` 正向偏置；在软件校准里加一句 `temp_cal = temp_raw - 2.0` 即可修正。
      - item:
          id: tolerance-worst-case
          type: choice
          prompt: |
            制作一台要求总误差小于 `±1%` 的 `10` 倍精密传感器仪表放大器（增益由外接电阻比值 $R_f / R_{in}$ 决定），新人图省钱全买了标称 `±5%` 容差的廉价普通电阻焊上去，打算靠理论公式直接算输出不标定。结果最可能出什么问题？
          options:
            - text: 两个电阻恰好往反方向各偏 `5%` 时，仅无源电阻公差一项就可能造成放大倍数偏离标称值达约 `10%` 彻底超标，必须选用 `±0.1%` 精密电阻或在出厂时逐台标定校准
              correct: true
            - text: 电阻出厂标称 10 kΩ，其真实物理阻值就严格等于 10.000 kΩ 且没有误差
              why: 真实制造存在固有离散公差（`±5%`、`±1%`、`±0.1%`）与温漂
            - text: 两只 `±5%` 电阻拼在一起会自动抵消成完美无差 `0.00%`
              why: 运气最差时分子偏大 `+5%` 同时分母偏小 `-5%`，误差不仅不抵消反而同向叠加到约 `1.05 / 0.95 ≈ +10.5%`。
          explain: |
            最坏情况误差分析（Worst-Case Tolerance Analysis）是保证批量量产十万台设备不翻车的基本习惯。
      - item:
          id: error-sources-match
          type: match
          prompt: |
            把实测工程中的各种误差表现配对到它们的成因和解决策略。
          pairs:
            - ["**精密度**（Precision）", "多次重复测量彼此间聚集一致性（越集约、随机抖动越低越精密）"]
            - ["**准确度**（Accuracy）", "测定中心均值贴近真实真值程度（要求既低抖动又消净系统固定偏移）"]
            - ["元件容差（Tolerance）", "批量制造电阻/基准电压偏离标称值的范围（如 `±5%` vs 精密 `±0.1%`）"]
            - ["零点/增益固定偏移", "每次稳稳偏在同一方向或比例偏差，可通过软硬件两点标定有效扣除"]
          explain: |
            清除了零点、压低了随机噪、卡死了元件容差，采集的数据才是真正值得信赖的物理真相。

  # ==== 总线 ====
  - id: uart-frame
    chapter: 总线
    title: UART 异步点对点通信帧开销、RS-232 电平与中断接收模型
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            把 GPS 定位模块用 `TX`（发）、`RX`（收）外加地线 `GND` 接上微控制器，采用标准 **UART** `9600` 波特、8 位数据、无校验、1 位停止位（`8N1`）发数据。两根交叉信号线（微控制器 `TX` 接模块 `RX`，模块 `TX` 接微控制器 `RX`）能不能同时在互相说话全双工收发？每秒最多传走几百几千字节？
          options:
            - text: 能同时全双工发收（点对点两人各专享一根单行线）。且因每 8 位数据必须包前后 2 位起止帧标志，满速每秒最多传 `9600 / 10 = 960` 字节。
              correct: true
            - text: 绝不能全双工，连线一发过去 `TX` 线就炸了，而且每秒传足 9600 整字节
              why: TX 和 RX 是两条物理完全独立的单工通路，因此天然支持**全双工**；每字节 `1+8+1 = 10` 比特故有效速率为 `波特率 / 10`
            - text: 一根线可以像互联网交换机一样随随便便同时挂 100 颗不同传感器从设备直接按名字喊
              why: 原生异步 UART 天生是**点对点（1 对 1）**通道、不自带设备寻址协议。多传感器共享总线通常改用 **I²C** 或带独立片选的 **SPI**。
          explain: |
            两根信号线各管一个方向，所以能同时收发；`8N1` 每个字节要送 10 位，`9600` 波特每秒最多 `960` 字节。板级常用的串行总线有三种，这一课先讲 **点对点、全双工、异步的 UART**。
      - card:
          title: UART 两线全双工、波特率帧核算与多节点局限
          body: |
            - **接线与拓扑**：**2 根信号线**（`TX`、`RX`，外加共地），**点对点（1 对 1）连接**，无需共享地址字段，收发各走一条线支持 **全双工**；
            - **同步依赖**：双方必须预先配死完全一样的**波特率**（如 `9600`、`115200 bps`），无独立时钟线；常见工业长距离抗噪会把 TTL `0/3.3 V` 转成 **RS-232** 电平；
            - **有效速率算法**：典型 `8N1` 格式每字节耗 `1 起始位 + 8 数据位 + 1 停止位 = 10` 比特 → `9600 / 10 = 960 B/s`，`115200 / 10 = 11520 B/s`。
          reveal:
            - title: 接 UART 时为什么“板卡 A 的 TX 必须交叉连去板卡 B 的 RX”，以及什么时候换中断接收？
              body: |
                因为 `TX` 代表本端说话的嘴（输出脚）、`RX` 代表倾听的耳朵（输入脚）——两只嘴对嘴喊谁也听不到还会电平顶撞短路。必须“我的嘴连你的耳、你的嘴连我的耳”**交叉对接**。接收端常借助串口**接收中断**（每满 1 字节自动进环形队列保存）而不傻死忙等。
            - title: 为什么超高速 UART 串口往往还要加流控线 `RTS / CTS`？
              body: |
                当远端无线模块或电脑以 `921600` 波特疯狂狂灌几千字节过来，而微型单片机一时忙着把数据存进慢速 Flash 腾不出缓冲空位时，单靠 `TX/RX` 没法喊“等等先别发”，一秒钟就接收队列满溢丢包。多加两根硬件流控信号（`RTS` 通知“我可以收”、`CTS` 确认“对方允许我发”）就能在硬件层零丢包踩刹车。
            - title: RS-232 标准串口与芯片原生 TTL 串口的电压摆幅差异在哪？
              body: |
                MCU 的 `TX/RX` 引脚直接跑的是 `0 V` 代表 `0`、`3.3 V` 代表 `1` 的正向 TTL 电平；而传统老式工业设备用的 **RS-232** 协议把电压抬高且极性反过来（用 `-3 ~ -15 V` 表示逻辑 `1`，用 `+3 ~ +15 V` 表示逻辑 `0`）。想让微控制器对接 RS-232 接口设备，必接一颗如 MAX3232 电平反相转换芯片护驾，直接怼接立刻冒烟。
      - item:
          id: uart-9600-bytes
          type: number
          prompt: |
            一条传感器模组采用 **UART** `9600` 波特率、`8` 位数据、无校验、`1` 位停止位（`8N1`）向微控制器持续发回测量数据包。理论满载每秒最多能送达多少**字节（Bytes）**有效数据？
          answer: 960
          hint: '先求出传出 1 个 8 位数据字节实际占用帧长总比特数，再用波特率去除它。'
          explain: |
            `9600 / (1 + 8 + 1) = 960` 字节/秒。
      - item:
          id: uart-time-96bytes-ms
          type: number
          prompt: |
            如果一条串口按 `9600` 波特 `8N1` 每秒实际最多发送 `960` 字节，连续一口气发送 `96` 字节传感日志至少需要耗费多少毫秒（ms）？
          answer: 100
          hint: '算出 96 字节占满载每秒吞吐 `960` 字节的几分之几秒，再乘以 1000 转成毫秒。'
          explain: |
            `96 / 960 = 0.1` 秒 = **`100` 毫秒**——发短短不到百字节就要白白等足十分之一秒，所以高速日志一定要用高波特率配合环形中断队列发。
      - item:
          id: uart-props-c4
          type: choice
          prompt: |
            关于 **UART** 总线，以下哪一项总结完全准确？
          options:
            - text: 核心只需 2 根数据线（`TX` 和 `RX`），无共享同步时钟线（异步、靠双方事先约定同波特率同步），天生点对点连接，支持同时收发全双工
              correct: true
            - text: 必须用到 4 根总线加上每颗从设备一根片选线，仅支持半双工且带 7 位硬件寻址
              why: 混淆成了 SPI（4 线含 SCLK/CS）和 I²C（7 位地址半双工）。UART 就是异步双线点对点全双工
            - text: 自带 100 MHz 高速共享时钟线一次同步挂 50 颗温度传感器不用任何外加选择器
              why: UART 既没有公共同步时钟线也不支持原生多机按址寻址，典型跑几 kbps 至几 Mbps 间两机互联
          explain: |
            记忆口诀：**UART = 2 线异步 + 无时钟靠约定波特率 + 点对点 + 全双工**。
      - item:
          id: uart-wiring-trap
          type: choice
          prompt: |
            一块 STM32 嵌入式板子（`3.3 V` TTL 电平）接一颗新买的 Wi-Fi 模块，程序员在面包板上把 STM32 的 **`TX` 直接连去了模块标记为 `TX` 的引脚**、`RX` 直接连了模块的 **`RX`**，结果双方怎么都收不到半个字符甚至芯片微微发烫。哪里接错了？
          options:
            - text: 两个“发送输出嘴（`TX`）”互相顶撞打架且接收端听不到对端信号。必须把双方交叉接成 `TX ↔ RX`、`RX ↔ TX` 并确认共地
              correct: true
            - text: 应该把 `TX` 连到 220 V 家用电源插座里去
              why: 交叉连接发送与接收并共接 `GND` 才构成闭环信号通路（除非模块丝印按对端反向标定外一律遵循一发对一收）
            - text: 因为 UART 每次发送都必须要等半小时才会出现第 1 比特
              why: 发完即立刻以波特微秒节拍传过去，错接极易导致双发送引脚推挽对撞大电流。
          explain: |
            调试串口永远先检查三件事：**有没有交叉接 `TX↔RX`、两边有没有共 `GND`、两边波特率设置是否分毫不差**。

  - id: i2c
    chapter: 总线
    title: I²C 两线开漏上拉总线、7 位寻址半双工与地址冲突解决
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            现在微控制器板子上想同时串联接上 **`5` 颗不同传感器**（温湿度、气压计、陀螺仪、光照计、实时时钟芯片），可芯片旁边统共只省下短短 **`2` 根空闲引脚**。这 5 颗设备能全部并联挂在同一对仅有的 `SDA`、`SCL` 两根线上而不互相喊错、不把电平烧炸吗？
          options:
            - text: 能。利用 I²C 总线的“开漏输出 + 上拉电阻”线与特性防止短路，靠报文开头喊出的 7 位唯一硬件地址 来点名选谁应答，两根线搞定数十设备轮流半双工对话。
              correct: true
            - text: 绝不可能。两根线天生最多只允许连接 0.5 颗芯片
              why: I²C 专门就是为了“极省主板引脚挂载多颗中低速外设”而诞生的两线按地址寻址共享总线。
            - text: 五颗芯片不用任何地址直接同时齐声大喊互相叠加
              why: 主机首先发出 7 位目标从机地址 + 1 位读/写方向位，仅对应从机回传应答 ACK 接入对话
          explain: |
            I²C 用开漏输出加上拉电阻，多台设备挂在同一对线上也不会短路；每次通信开头先喊 7 位地址，只有被点名的设备应答。这一课讲 **I²C**，以及**两颗传感器硬件地址相同怎么办**。
      - card:
          title: '**I²C** 两线开漏结构、7 位地址半双工与常见速率'
          body: |
            **I²C**（Inter-Integrated Circuit）是板内最常见多挂共享总线：
            - **线数与电气**：**`2` 根线**——数据线 `SDA` 与时钟线 `SCL`，所有设备都采用**开漏输出配合外部上拉电阻**（谁拉低总线全线就低，谁也不硬打高电平防短路烧脚）；
            - **寻址与方向**：主机先拉起始信号 `START` 并喊 **`7` 位从机地址 + 1 位 R/W 方向位**，对应从机必须拉低 `SDA` 给 `ACK` 应答才能续传——整根线只有一条 `SDA` 来回倒，属**半双工**。
            - **常见速率**：标准 `100 kHz`、快速 `400 kHz`、高速 `1 MHz`（相比几十兆的 SPI 偏中低速）。
          reveal:
            - title: 经典面试必问：两颗买来同型号的 I²C 传感器一模一样“7 位地址冲突”怎么办？
              body: |
                一旦两条引脚上两颗芯片出厂写死完全一样的地址（如都为 `0x48`），主机一喊 `0x48` 两个从机同时回 ACK、读取数据时互相踩死毁掉报文。三种标准解法：
                1. **拨改地址选择引脚**：查芯片手册看有无 `ADDR / A0` 引脚，将一颗接高电平、一颗接地变成 `0x48` 与 `0x49`；
                2. **分装进不同的硬件 I²C 总线控制器**（例如一颗接 `I2C1`，一颗接 `I2C2`）；
                3. **前端加一颗 I²C 多路复用器（如 TCA9548A）**：像火车道岔一样，每次只拨通其中一路子通道单独跟那一颗通话。
            - title: I²C 的 “START / 7位地址 + R/W / ACK / STOP” 一次读写到底怎么走一遍？
              body: |
                所有通讯由主机发起：趁 `SCL` 高时先把 `SDA` 拉低发 `START` → 接着连续推出 `7` 位目标从机号与 `1` 位读(`1`)/写(`0`)请求 → 第 `9` 个时钟周期主机松手，由被喊中那颗从机把 `SDA` 拉低回答 `ACK` → 随后逐字节收发数据并在每字节末尾由接收方回 `ACK` → 结束时主机趁 `SCL` 高释放 `SDA` 抬起发 `STOP` 交还总线。
            - title: 为什么 I²C 上拉电阻阻值不能随便瞎挑（比如 `100 Ω` 或 `1 MΩ`）？
              body: |
                电阻太小（如 `100 Ω`）会导致从机拉低 `SDA` 时灌进几十毫安大电流拉不低也发热耗电；电阻太大（如 `100 kΩ`）配合导线寄生电容会让高电平上升沿磨磨蹭蹭爬得很斜，跑上 `400 kHz` 快速模式时根本爬不到高门槛就错判成低电平。常用稳妥甜点在 `2.2 kΩ ~ 4.7 kΩ` 之间。
      - item:
          id: i2c-conflict-c4
          type: choice
          prompt: |
            你在同一块板子上买了两颗完全同款的数字温度传感器，可惜这两颗芯片内部固化的 **I²C** `7` 位从机地址一模一样撞车了。以下哪种工程做法**真正能解决**地址冲突问题？
          options:
            - text: 检查芯片是否提供地址配置脚 `A0/ADDR` 改接不同电平；若地址完全焊死不可改，则把两颗分接到芯片另一组独立 I²C 总线控制器上，或串入一颗 I²C 多路复用切换芯片（MUX）
              correct: true
            - text: 保持硬件接在同一对 `SDA/SCL` 不变，只在代码里给两个传感器变量起不同的 C 语言变量名就能区分
              why: 硬件总线上发出的仍然是同一个 7 位地址，两颗芯片会同时应答撞车，必须用改地址引脚、分总线或 I²C 多路开关在电气层隔离选通
            - text: 把波特率手动改为 115200 就能让两颗硬件出厂地址自动变不同
              why: I²C 7 位设备地址由硬件芯片硅片掩膜或引脚决定，与总线时钟快慢无关
          explain: |
            实战踩坑频率极高：**一查 `ADDR` 脚能改就改、二拆两路独立 I²C、三上 `I²C MUX` 分时切换**。
      - item:
          id: i2c-pullup-why
          type: choice
          prompt: |
            为什么接了 **I²C** 传感器之后，如果电路板上粗心忘了给 `SDA` 和 `SCL` 焊接上拉电阻（一般 `2.2 kΩ ~ 10 kΩ`），示波器上总是一根死贴在地的 `0 V` 线、完全通不了讯？
          options:
            - text: I²C 规定器件端口采用只能主动拉低、不能主动推高的开漏输出（Open-Drain），没有上拉电阻就没办法把总线拉回高电平 `1`。
              correct: true
            - text: 因为上拉电阻会把 3.3 V 变成 3300 V 让信号飞过去
              why: 开漏口内部只有向地导通的下拉管，释放开关时全靠外部上拉电阻替整条总线充回高电平
            - text: 因为只有电阻才能把 I²C 变成 4 根线的全双工 SPI
              why: 开漏 + 上拉还能优雅支持多主机“线与仲裁”防止两主机互撞短路烧毁驱动管
          explain: |
            **I²C 不通十次有八次先拿万用表或示波器量：SDA/SCL 上拉电阻焊没焊、平时空闲是不是稳高电平。**
      - item:
          id: i2c-specs-choice
          type: choice
          prompt: |
            归纳 **I²C** 总线在硬件线数、传输双工性和典型常见工作速率上的规格特征，哪一项完全正确？
          options:
            - text: '`2` 根总线（`SDA`、`SCL`），`7` 位地址寻址可挂多设备，单线双向收发属半双工，常见典型速率 `100 kHz / 400 kHz / 1 MHz`'
              correct: true
            - text: '`4` 根总线带独立片选 `CS`，全双工同时以 `50 MHz` 狂飙'
              why: 那是 **SPI**。I²C 仅有 1 根数据线必须主从交替说话属于半双工，速率通常百 kHz 到 1 MHz
            - text: 异步通信没有任何时钟线，每帧按起止位同步
              why: I²C 带专有时钟线 `SCL` 同步逐位锁存（属于同步串行），只是每次由 `7` 位寻址加应答发起
          explain: |
            省引脚多挂、但带宽中低速且靠地址选从机：I²C 是板载传感器大管家的不二之选。

  - id: spi
    chapter: 总线
    title: SPI 四线片选高速全双工通信与时钟极性相位模式
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            如果要接一颗每秒狂传几百万像素的高速彩色屏幕、一块 SD 卡高速闪存或者一颗千赫兹级 6 轴陀螺仪，刚才 `400 kHz` 半双工还要喊地址等 ACK 的 I²C 直接塞车卡爆。怎么在多牺牲一两根引脚的前提下让速度一口气狂飙几十倍、还能边发边收？
          options:
            - text: 改用 SPI 总线：拆开独立的发送线 `MOSI` 与接收线 `MISO` 实现全双工高速推挽驱动，再用专用片选线 `CS` 直接拉低点名谁干活（免喊地址直冲几十 MHz）。
              correct: true
            - text: 把 I²C 上拉电阻全部卸掉改接高电压电线
              why: 开漏上拉靠电阻缓慢把电容拉高，天然跑不到几十兆赫兹；换推挽高速输出加片选硬件线才是 SPI 高速秘密。
            - text: 改用 110 波特的慢速电报机发送像素图片
              why: 刷屏幕/存大文件需数十 Mbps 吞吐，非 **SPI** 莫属。
          explain: |
            SPI 收发各用一根线，可以同时进行，又用片选线直接点名，不用先发地址，所以能跑到几十 MHz。这一课讲板内高速通信最常用的 **SPI**。
      - card:
          title: '**SPI** 四线连接、独立片选 `CS` 全双工高速特性'
          body: |
            **SPI**（Serial Peripheral Interface / SSI 同步串行接口）靠主动推挽输出达到板内极速：
            - **标准 `4` 根信号线**：① `SCLK`（主机时钟）；② **`MOSI`**（主机出、从机入数据）；③ **`MISO`**（主机入、从机出数据）；④ **`CS` / `SS`**（低电平有效片选——**每多挂 1 颗从设备，主机通常要多耗 1 根独立 `CS` 引脚。**）；
            - **核心优势**：发收两条线物理分开 → **全双工同时收发**；无 7 位地址喊话与 ACK 开销、推挽驱动边沿极其陡峭 → 常见速率轻松跑上 **十几至数十 MHz**（甚至比标准 I²C 快上百倍）。
          reveal:
            - title: 为什么接新 SPI 传感器经常读出“整排错位 1 位或乱码”（CPOL / CPHA 四种模式）？
              body: |
                SPI 没有全球死规定的单一起始电平约定，于是定了两位配置开关构成 `Mode 0 ~ Mode 3`：**CPOL** 决定时钟空闲停在 `0` 还是 `1`；**CPHA** 决定到底在时钟第 1 个沿采样还是第 2 个沿采样。只要主控和传感器模式没调对齐（比如传感器用 `Mode 3` 你设成 `Mode 0`），所有读回来的字节全会整体错半拍。
            - title: 连挂载 `8` 颗 LED 移位芯片时如何免除耗掉 `8` 根独立片选（Daisy-Chain 菊花链）？
              body: |
                某些专支持菊花链（Daisy-Chain）的 SPI 器件允许把前一颗的 `MISO/DOUT` 串进下一颗的 `MOSI/DIN`，全体共用 **同一根 `CS` 片选与时钟**。主控一口气连续推出 `8` 字节数据就像火车进站依次往后顶过去，最后拉高这唯一的一根 `CS` 锁存生效——用 `4` 根线极简驱动一长串扩展外设。
            - title: 为什么 SPI 一路上从来没有类似 I²C 的从机应答位 `ACK`？
              body: |
                SPI 天生靠“物理片选拉低”强制命令从机开口，主机只管推着 `SCLK` 按拍移位交换字节，从机在硬件里**绝不会发出硬件应答 ACK** 报错（哪怕从机拔掉没焊或电源坏了，`MISO` 照样浮空或贴着上拉电阻读回来一串全 `0xFF` 或 `0x00`）。因此调试 SPI 第一步永远先发一条读固定 `WHO_AM_I` 寄存器 ID 指令验身。
      - item:
          id: spi-4wires-c4
          type: choice
          prompt: |
            关于板级 **SPI** 总线在标准单从机配置下的核心线数、寻址方式、双工特性和速度，下面哪一项描述全对？
          options:
            - text: 标准 `4` 根线（`SCLK`、`MOSI`、`MISO`、`CS`），靠每颗从设备一根专属片选线 `CS` 寻址选通，两条数据线支持全双工，典型速率可达几十 MHz
              correct: true
            - text: 只有 `2` 根开漏线（`SDA`、`SCL`），只能靠 7 位数字地址半双工通信且限于 `100 kHz`
              why: 那是 **I²C** 的特征。SPI 用独立发收双线和独立硬件片选脚换来全双工超高速率
            - text: 完全不需要时钟线也不需要任何片选引脚
              why: 必须具备主时钟 `SCLK` 及拉低选通目标芯片的片选线 `CS`
          explain: |
            **I²C 用复杂协议省引脚，SPI 用多几根片选引脚换取极简电路与几十倍极限高速**。
      - item:
          id: spi-pins-count-3slaves
          type: number
          prompt: |
            按标准独立硬件片选方式，一颗微控制器用同一组 **SPI** 控制器同时挂接 **`3` 颗独立外设**（共享时钟线 `SCLK` 与数据收发双线 `MOSI`/`MISO`，每颗外设各自占 `1` 根专属片选线 `CS`）。这总共需要占用微控制器多少根 GPIO 信号引脚？
          answer: 6
          hint: '共享共用的一组固定有几根（时钟 + 发 + 收），再加上 3 颗从设备各自独享的片选线。'
          explain: |
            `3` 根共享总线（`SCLK`, `MOSI`, `MISO`）+ `3` 根专属片选线（`CS1`, `CS2`, `CS3`）= 共需 `6` 根引脚。（挂 10 颗芯片就得消耗 13 根脚——这是 SPI 比 I²C 更费引脚的地方）。
      - item:
          id: spi-mode-mismatch
          type: choice
          prompt: |
            在连接一颗全新 SPI 陀螺仪芯片时，发现片选 `CS` 拉低对了、主时钟也在按 `1 MHz` 吐脉冲，可读出来的“设备 ID 固定常量 `0x68`”总是变成长得极像却整体左移/右移了 `1` 比特的 `0xD0` 或 `0x34`。最该立刻去核对芯片手册里的哪一对 SPI 配置参数？
          options:
            - text: 时钟极性 `CPOL` 与时钟相位 `CPHA`（检查是不是应该设为 `Mode 0 / 1 / 2 / 3` 里的另一种沿采样方式）
              correct: true
            - text: 因为 SPI 默认采用 7 位从机地址寻址，开头第 1 比特被从机当成了读/写方向位吞掉了
              why: SPI 用硬件片选线 `CS` 选通从机，不发 7 位地址；整字节固定移偏 1 位正是主机与从机 `CPOL/CPHA` 时钟采样边沿配置不一致的铁证。
            - text: 因为主控与从机之间的 `MOSI` 和 `MISO` 交叉接反了，必须改成 `MOSI` 接 `MISO`
              why: SPI 引脚按主从命名（Master Out Slave In），标准接法本来就是 `MOSI` 直连 `MOSI`、`MISO` 直连 `MISO`，移位 1 比特是时钟相位错半拍造成的
          explain: |
            接 SPI 先核对四件事：**哪根是 `CS`（低有效）、最高帧位谁先（MSB/LSB）、最高允许速率、`CPOL/CPHA` 工作模式**。

  - id: physical-links
    chapter: 总线
    title: 物理链路升级：RS-485 平衡差分抗噪、电平转换与 USB 简介
    minutes: 11
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            普通的 `0 ~ 3.3 V` 单端串行通信在电路板上走 5 厘米稳如泰山。现在客户要求把传感器拖到 **300 米** 外喧闹的电机工厂车间里——单根导线上沿途电磁干扰全抬起几十毫伏到几伏毛刺。怎样只用一对双绞线让信号哪怕在强干扰车间走几百米依然稳如泰山、不认错 `0` 和 `1`？
          options:
            - text: 用平衡差分信号传输（如 RS-485 / USB 差分对）。一根发 `+A`、另一根反向发 `-A` 紧紧绞在一起，外界干扰同时同等劈在两根线上，接收端只算它俩“相减之差 `V_A - V_B`”，共模干扰瞬间抵消归零。
              correct: true
            - text: 继续用单端 `0 ~ 3.3 V` 信号线直连 300 米，只把波特率从 9600 提高到 10 Mbps 就能抗住长线干扰
              why: 普通单端线以长地线作参照极易在压降与共模电磁感应下失真，且拉高波特率反而会让长线分布电容把波形边沿抹平导致误码更严重。
            - text: 把单端信号电压从 3.3 V 降到 0.1 V，电压越低在 300 米长线上越不容易受到外部电磁干扰
              why: 信号摆幅越低信噪比越差，几百米工业现场必须靠双绞平衡差分传输抵消共模干扰
          explain: |
            走出巴掌大电路板迈向长导线工厂现场与个人电脑外设——搞懂 **平衡差分线（RS-485 / RS-422）、逻辑电平转换与 USB 总线**。
      - card:
          title: 平衡差分传输：RS-422 与 RS-485 抗共模远传
          body: |
            - **平衡差分传输**：收发器将逻辑 `0/1` 化成一对紧绞双绞线上大小相等、方向相反的电压差 $V_+ - V_-$；
            - **为什么不怕干扰？**：外部电磁干扰同时几乎同等抬高两条紧挨导线（共模噪声），到达终端作减法后干扰彻底相消、距离一口气撑到 **1200 米且可挂几十节点**。
          reveal:
            - title: 为什么千百米 RS-485 长导线末端必须并接一颗 `120 Ω` 终端匹配电阻？
              body: |
                高频信号沿着几十上百米长导线传播时会表现得像电磁波“传输线”。如果末端直接开路悬空，电脉冲撞到尽头会像水波撞墙一样原路反射回来和后面新发出来的波形叠加干涉变成乱码；在总线最远两端各并一颗与双绞线特征阻抗一致的 `120 Ω` **终端电阻**，就能像海绵一样把末端波能量完美吸收干干净净消除回波。
            - title: 半双工 RS-485 多节点挂接时怎么避免两个从站抢着说话互撞？
              body: |
                因为两根差分线 `A/B` 同时只能朝一个方向发送。工业界常跑“主从应答制（如 Modbus RTU）”：平时所有从机全部切到收听模式，只有主机点名喊到某号从站 ID 时，那一颗才允许短暂拉高收发芯片的 `DE`（发送使能）脚吐出回应包，发完立刻关回 `DE` 听候下一轮命令。
      - item:
          id: rs485-diff-why
          type: choice
          prompt: |
            工业自动控制和远距楼宇温控器之所以放弃普通 `0/3.3 V` 单端 UART、纷纷在几十上百米外挂一对双绞线采用 **RS-485** 收发器，最根本利用了差分线的什么物理机制？
          options:
            - text: 有效信号以一对紧绞双绞线之间的电压之差传输，沿途感应到的同向共模电磁杂波在接收差分减法运算中相互抵消，抗扰与传距暴涨至数百上千米
              correct: true
            - text: 因为 RS-485 把两根线上的信号相加以获得双倍共模电压，从而把沿途干扰也一起放大两倍
              why: 差分接收器计算的是两线之**差** $(V_A - V_B)$ 而非之和，正是通过相减把两线上同时感应到的同相共模噪声抵消归零。
            - text: 因为 RS-485 规定每传输 1 个字节必须额外拉 8 根独立片选线来屏蔽干扰
              why: RS-485 只需一对双绞差分线（2 线半双工）即可在长距离强噪声环境下多点组网通信
          explain: |
            “紧绞抑制磁环路感应 + 差分减法消尽共模干扰 + 两端 `120 Ω` 消反射”——这就是工业通讯百年常青树。
      - card:
          title: 逻辑电平转换与 USB 通用串行总线
          body: |
            - **跨压域安全桥接**：把 `5 V` 老传感器直插不耐 5 V 的 `3.3 V` 单片机引脚容易击穿保护管。单向从 5 V 降 3.3 V 可用电阻分压或单向缓冲；像 I²C 这种双向开漏线则必用专用 **双向 MOS 电平转换电路**；
            - **USB 简介**：采用 `D+ / D−` 平衡差分高速传输，集供电、CRC 硬件校验、重传与热插拔自动枚举于一体。
          reveal:
            - title: 什么时候绝对不能用“两颗电阻分压”凑合代替双向电平转换芯片？
              body: |
                单向信号如从 5 V 模块出来的 UART 发送端进 3.3 V MCU 接收端，用 `1.8 kΩ + 3.3 kΩ` 分压成 `3.23 V` 安全又便宜；可一旦碰到既要发又要收的 **I²C `SDA`** 双向开漏总线或高频 20 MHz SPI 时钟线，简单分压既挡住反向导通又拖慢边沿爬升，必须上专用双向电平转换器。
      - item:
          id: level-shift-5v-3v3
          type: choice
          prompt: |
            手头有一颗老式只输出 `5 V` 数字信号的超声波模块 `ECHO` 引脚，现在要直接连入一颗核心与 IO 口**最大仅耐压 `3.6 V`** 的 `3.3 V` STM32 微控制器引脚。最安全的做法是？
          options:
            - text: 中间加装专用逻辑电平转换芯片（或合规电阻分压网络把 `5 V` 稳压降到 `3.3 V` 以内后再送入 MCU）
              correct: true
            - text: 直接用铜线硬插上去赌它烧不坏芯片
              why: '`5 V` 强行倒灌进不兼容 `5 V` 耐受的 `3.3 V` 引脚，电流直接冲进内部钳位保护二极管轻则跑飞、重则当场永久击穿引脚。'
            - text: 只在 C 语言代码里把接收变量声明为 `uint8_t` 而不是 `uint16_t`，就能在软件里把引脚输入电压降到 `3.3 V`
              why: 变量类型只影响内存字节宽度，无法改变物理引脚上承受的 `5 V` 过压，必须在硬件电路上做分压或电平转换。
          explain: |
            每次接线前多扫一眼芯片数据手册里的 **`Absolute Maximum Ratings`** 与 **`5V-tolerant`** 标注，能救下无数开发板。
      - item:
          id: bus-links-match
          type: match
          prompt: |
            把各种板级及系统外部物理链路特性与它们各自擅长的典型应用配对起来。
          pairs:
            - ["板内单端 `TTL` UART", "厘米级短距模块调试（需注意 3.3 V vs 5 V 电平耐压安全）"]
            - ["`RS-485` 平衡差分双绞线", "百米级强电磁工业现场抗共模干扰多节点远传组网"]
            - ["逻辑电平转换器", "安全桥接 `1.8 V`、`3.3 V` 与 `5 V` 等不同供电电压芯片间的双向信号"]
            - ["`USB` 通用串行总线", "基于差分对带供电、自动枚举识别与误码重传的消费级电脑外设总管"]
          explain: |
            根据**距离（几厘米还是几百米）、噪声、节点数和电压域**挑链路，从此连线不犯外行错。

  - id: choose-bus
    chapter: 总线
    title: 三大常见串行总线 UART、I²C 与 SPI 综合对比与工程选型
    minutes: 11
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            项目组正在评审方案，要在同一块微型主板挑接口接入三个完全不同的模块：**① 每秒只传 20 字节的门磁状态、需要串在 8 颗同线外设里最省 MCU 引脚；② 每秒需要 10 MB 疯狂刷 320×240 彩屏；③ 连一台串口激光测距模块（只需发/收两条线与电脑口对接）**。分别该怎么搭总线？
          options:
            - text: 8 颗慢设备挤 2 根线用 I²C；高速刷彩屏用几十兆全双工的 SPI；与测距/电脑点对点串口对话用 UART。
              correct: true
            - text: 全部都用 9600 波特的 UART 直接硬并联到同一对脚上
              why: 原生 UART 不支持多设备按址共享同根线，且慢速率根本刷不动 10 MB 彩屏。
            - text: 给 8 颗极慢门磁分别单独拉 11 根高速 `SPI` 线占用整排引脚
              why: 低速多挂载用 I²C 只需 2 线就全挂上，没必要浪费大把宝贵引脚
          explain: |
            慢设备多、引脚少选 I²C；要高速选 SPI；点对点和电脑或模块对话选 UART。这一课把 **UART、I²C、SPI** 放在一起横向比较。
      - card:
          title: UART vs I²C vs SPI 全景参数对照表
          body: |
            - **UART**：`2` 线（`TX/RX`），异步无时钟靠约定波特率，点对点（不支持多挂寻址），**全双工**，典型几 kbps–几 Mbps（常见 `9600 / 115200`）；
            - **I²C**：`2` 线（`SDA/SCL` 开漏上拉），同步，`7` 位地址寻址可挂载多设备，**半双工**，典型 `100 kHz / 400 kHz / 1 MHz`；
            - **SPI**：`4` 线（`SCLK/MOSI/MISO/CS`，多挂需每多 1 设备多 1 条 `CS`），同步，**全双工**，典型数 MHz 至几十 MHz。
          reveal:
            - title: 如果两个选型都在极限边界怎么办？（工程折中技巧）
              body: |
                比如既想用 SPI 的高速度又惜引脚如金——有些器件支持三线半双工 SPI 或用一颗 `3-to-8` 译码芯片把 3 根地址线扩成 8 根 `CS` 片选；而遇到 I²C 地址撞车又只剩 1 路总线，加一颗 I²C 开关复用芯片即可优雅解决。
            - title: 总线选型四步速查：先问几个问题就再也不纠结？
              body: |
                第一问**连几厘米还是几十米**：超过一两米工业强干扰直接转 RS-485/CAN 差分；第二问**几颗设备**：多颗低速板内芯片挤极少引脚选 I²C；第三问**流量多猛**：超过每秒上百千字节刷屏或闪存选 SPI；第四问**只和电脑/模组 1 对 1 串口打印调参**：最轻省的 2 线异步 UART。
            - title: 总线引脚规划常见隐蔽陷阱：别忘了“片选上拉与电源退耦”
              body: |
                在同一根 SPI 总线上同时挂三颗芯片时，每次烧录新程序刚复位、MCU GPIO 还浮空未初始化前，万一两颗从机同时偶然低电平误选通，两条 `MISO` 线就会顶撞打架。给每根 `CS` 片选线上配一只 `10 kΩ` 弱上拉电阻默认稳稳拉高闲置，以及给 `I²C` 配对上拉、在电源旁贴放去耦电容，能让硬件稳定度提升十倍。
      - item:
          id: bus-matrix-match-c4
          type: match
          prompt: |
            把三大串行通信接口精确匹配到它们各自的关键技术规格。
          pairs:
            - ["**I²C**", "2 线开漏上拉同步、7 位地址可挂多设备、半双工、100 kHz–1 MHz"]
            - ["**SPI**", "4 线含独立片选线 CS 同步、多设备各占片选、全双工、可达几十 MHz"]
            - ["**UART**", "2 线（TX/RX）异步靠双方约定波特率、点对点（1 对 1）、全双工"]
          explain: |
            三种总线的区别主要看四点：几根线、同步还是异步、怎么选中设备、半双工还是全双工。
      - item:
          id: bus-rate-time-calc
          type: number
          prompt: |
            一条高速串行数据通道当前实测纯净有效吞吐率为 **`8000 字节/秒`**。现在需要完整传送出一包 **`4000 字节`** 传感器记录，最短需要耗费多少秒（填小数）？
          answer: 0.5
          hint: '用需要发走的总字节数除以该总线此刻的实际每秒有效字节吞吐速率。'
          explain: |
            `4000 / 8000 = 0.5 秒`（对比真跑 `10 MHz` SPI 实际每秒超过 1 兆字节，`4000` 字节才用区区 3~4 毫秒）。
      - item:
          id: choose-bus-display
          type: choice
          prompt: |
            你要给一款便携穿戴手环接两颗芯片：器件甲是**每秒只读 10 次的三轴计步芯片**，器件乙是需要以 **`30` 帧/秒流畅动画刷新的彩屏（每次刷新几万像素）**。主控引脚紧缺时最合理的搭配是？
          options:
            - text: 计步传感器走省引脚的 I²C 总线（只用 2 根脚还能顺便再挂颗电池电量计）；高速刷图彩屏走几十兆高速全双工 SPI 接口。
              correct: true
            - text: 计步芯片走 50 MHz SPI 并拉 8 根引脚，彩屏改塞进 100 kHz 慢速 I²C 里一帧刷一秒钟
              why: 100 kHz I²C 每秒有效传输才约 10 KB 左右，根本应付不了几万像素每秒 30 帧动态彩屏刷新。
            - text: 两颗芯片什么线都不接直接互相靠蓝牙对话
              why: 芯片内部主板连接优先选最贴合各自数据带宽吞吐和引脚数约束的板级硬件总线
          explain: |
            **用 I²C 挂载成群中低速配置/传感器，用 SPI 扛起屏幕、网卡与闪存的大带宽吞吐**，绝配。

  # ==== 采集 ====
  - id: acquisition
    chapter: 采集
    title: 采集系统设计、按带宽定采样率及离散微积分滤波算术
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            某温度控制炉子真实水温变化极慢（最高有效波动频率绝对不超过 `10 Hz`）。一位同学图安心直接把 12 位 **ADC** 采样率开到满负荷 **`1,000,000 Hz`（每秒 100 万次）**，另一位只开了 **`10 Hz`**（每 0.1 秒采 1 次），还有位折中取 **`100 Hz`**。三者谁最科学合理？
          options:
            - text: 选 `100 Hz` 最稳健合理。`10 Hz` 不足两倍最高频会混叠；而 `1 MHz` 暴采百兆冗余数据不仅白白塞爆存储和算力，还猛烧功耗。
              correct: true
            - text: 选 `10 Hz` 刚好等于 10 Hz 一模一样最省电又完美零失真
              why: 采样必须严格超过信号最高频率的两倍（$f_s > 2 f_{\max}$），等于 $f_{\max}$ 会彻底错失甚至把波折成静止假信号。
            - text: 采样率开成 1000 GHz 永远不考虑存储容量与微控制器算力和电耗代价
              why: 过高的冗余采样白白浪费内存缓冲、总线带宽和芯片电耗，工程讲求按信号带宽与滤波过渡余量适度匹配
          explain: |
            采样率至少要到信号最高频率的两倍，`10 Hz` 不够，会混叠；`1 MHz` 又远超需要，白白浪费存储、算力和功耗。这一课学 **按信号有效带宽选采样率**，再用 **离散累加（积分）和差分（求导）** 处理采到的序列。
      - card:
          title: 按信号带宽定采样率与离散微积分
          body: |
            - **采样节拍两头卡死**：
              1. **底线红线（防混叠）**：采样率 $f_s$ 至少严格大于信号及待留频带最高频率 $f_{\max}$ 的 **两倍（$f_s > 2 f_{\max}$）**，工程里因模拟滤波器斜坡过渡常选 **`5 ~ 10 倍` 过采样**；
              2. **上限红线（省资源）**：采样过快则无益增倍 RAM 缓存体积、CPU 运算与发射通信能耗（如采周期每 `2 ms = 2000 µs` 对应 $f_s = \frac{10^6}{2000} = \mathbf{500\text{ Hz}}$）；
            - **离散微积分**：固定步长 $\Delta t$ 采回来的数字流里，前后相减除以 $\Delta t$ 就是离散变化率（微分），按拍把样本一直累加乘 $\Delta t$ 就算出面积总量（离散积分，如库仑计累加电流算电量）。
          reveal:
            - title: 设计一套完整的微控制器数据采集系统要核对哪五笔账？
              body: |
                ① 前端传感器动态范围与最大带宽 $f_{\max}$；② 抗混叠模拟低通截频与采样频率 $f_s$；③ 满足信噪与分辨所需的 ADC 位数；④ 定时器节拍 + DMA 缓冲所需 RAM 字节数与 CPU 处理预算；⑤ 下游校准与控制输出执行器接口周期。
            - title: 为什么实时采集常用“前后差分均值”与“滑动平均”平滑毛刺？
              body: |
                刚采进内存的离散流往往带高频随机抖动：连续把最近 `M` 个样本加起来求平均（滑动平均低通滤波），既简单免乘法又直接按 $1/\sqrt{M}$ 压平毛刺。不过滑窗 `M` 开太大也会令阶跃温度突变响应变迟钝，因此工程总要在“平滑抗噪”与“实时响应延迟”间取折中窗口大小。
            - title: 为什么在 MCU 里直接算离散差分求速率前，必须先做一层平滑低通？
              body: |
                因为离散微分要拿相邻两点的差除以极小步长 $\Delta t$：假如每次读数仅仅晃动 `1 mV` 微弱高频随机噪音，可步长只有 `0.001 s`，这一除立刻把微弱毛刺暴力放大 **`1000` 倍**变成疯狂乱蹦的假尖峰。所以软件算速度、加速度或温度升速率时，必须先用滑动平均或一阶低通把高频噪抹平再做差分。
      - item:
          id: sampling-period-hz
          type: number
          prompt: |
            微控制器定时器每固定间隔 **`2000 µs`（即 `2 ms`）** 自动触发一次 **ADC** 采集样本。这套数据采集系统的物理采样频率 $f_s$ 是多少赫兹（Hz）？
          answer: 500
          hint: '一秒钟有整整 `1,000,000` 微秒（或 `1000` 毫秒），用 1 秒总时间除以单次采样周期间隔。'
          explain: |
            $f_s = 1\text{ s} / 0.002\text{ s} = 1,000,000 / 2000 = 500\text{ Hz}$（适合无混叠捕获最高带宽约 `50 ~ 100 Hz` 内的慢信号）。
      - item:
          id: nyquist-sensor-min
          type: number
          prompt: |
            一个声学震动传感器经前端调理后有效振动频率最高达到 `120 Hz`（更高频已被模拟低通提前狠砍压平）。仅按采样定理公式 $2 f_{\max}$ 计算出的理论**奈奎斯特采样率基准值**是多少赫兹（Hz，填整数）？
          answer: 240
          hint: '套用理论奈奎斯特基准下限公式：$2 \times f_{\max}$。'
          explain: |
            理论奈奎斯特采样率为 `2 × 120 = 240 Hz`，实际工程采集速率须**严格高于** `240 Hz`（考虑模拟滤波器温和滚降过渡余量，实用常取 `600 ~ 1200 Hz`）。
      - item:
          id: bandwidth-sampling-c4
          type: choice
          prompt: |
            为什么在设计数据采集软件与硬件前，必须紧紧按待测信号的有效带宽（$f_{\max}$）去合理选定采样率 $f_s$，而不是越慢越好或越快越好？
          options:
            - text: 采样率低于 $2 f_{\max}$ 会发生不可逆混叠失真把高频折叠成假信号；但若毫无节制把采样率飙得远超需求，又会白白消耗宝贵 RAM 存储、算力带宽和芯片功耗
              correct: true
            - text: 采样率哪怕只有 $0.1 f_{\max}$ 只要以后拿软件多插几个点就能彻底复原丢失的所有快脉冲
              why: 采样率一旦低于奈奎斯特极限两倍频，高频已经彻底伪装混淆成低频数字，再怎么软件插值都猜不回原始波形
            - text: 因为采样率跟信号本身携带的变化频率绝对没有任何关系
              why: 采集频率上卡资源功耗、下卡奈奎斯特抗混叠，核心锚定信号有效带宽。
          explain: |
            “既卡住 $> 2 f_{\max}$ 红线（再留模拟抗混叠滤波余量），又绝不白采无用冗余帧烧电”。
      - item:
          id: discrete-integral-use
          type: choice
          prompt: |
            电池电量计芯片每隔固定周期 $\Delta t = 0.01\text{ s}$ 采集一次当前放电电流整数 $I_k$（安培），并在控制器里逐拍做离散数值积分 $\sum I_k \cdot \Delta t$。这一步算出来物理上代表什么？
          options:
            - text: 累计从电池里总共流出去的总电荷量（库仑 / 安时），用来精确估算手机或无人机还剩百分之多少电量（SOC）
              correct: true
            - text: 电池当前承受的瞬时最大表面温度绝对值
              why: 电流随时间的积分 $\int I(t)\,dt$ 在物理上正是累计移出的总电量 `Q`；同理速度对时间离散积分算位移、位移对时间离散差分算瞬时速度。
            - text: 电池外壳长出了多少颗新金属晶体
              why: 固定等时间步长的离散求和与前后作差，让单片机轻松实时跑完微积分计算
          explain: |
            离散积分算累积、离散差分算瞬变速率（配合数字滤波去毛刺），单片机里到处都在用。

  - id: oversample
    chapter: 采集
    title: 过采样与平均提分辨率法则（每 4 倍 +1 位）与抖动白噪声前提
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            手头单片机片内只有一颗 **12 位 ADC**（本来只有 4096 级台阶），客户突然要求再挤出相当于 **13 位或 14 位** 的细微电压变化分辨力。换芯片太贵来不及，既然每格都带着微弱无规律随机跳动噪音，如果我们连续以 `4 倍` 或 `16 倍` 速度飞快连采好几遍然后算个平均值（**过采样与平均**），真能让 12 位 ADC 多分辨出 1~2 位小数吗？
          options:
            - text: 真能。如果输入信号里自带足量随机白噪声让样点在相邻台阶间按概率上下跳动，每 4 倍过采样求平均就能约多挤出 1 位有效分辨率（16 倍约多 2 位）。
              correct: true
            - text: 绝对不可能。只要连采 4 次算平均，精度不仅不涨还会反过来跌掉一半变成 6 位
              why: 统计理论证明 `N` 个独立噪声样本算均值，噪声标准差缩小为 $1/\sqrt{N}$（`4` 倍缩半 = 信噪比提升 6 dB = 整整 `+1 bit`）
            - text: 就算输入电压绝对静止死稳连一丝噪声抖动都没有，只要连采同一个死数 `100.0` 四次再平均就能 magically 算出 `100.25`
              why: 超级陷阱。如果毫无噪声抖动，连续采 4 次死死全都落进同一格 `100`，平均完依然是死板的 `100` 一丝没涨精度。
          explain: |
            噪声让样点在相邻台阶之间随机跳动，平均值就能落在台阶之间：每 4 倍过采样求平均约多出 1 位分辨率，16 倍约多出 2 位。这一课还要讲清一个容易漏掉的前提：**输入里必须有足够的随机噪声**。
      - card:
          title: 过采样（Oversampling）每 4 倍多 1 位与随机抖动（Dithering）前提
          body: |
            想用已有 **12 位 ADC** 额外榨出 $k$ 位新有效分辨率，需要把总平均样本数堆成 **`N = 4^k` 倍**：
            - **为什么是 $4^k$？（信噪比推导）**：平均 `N` 个样本使不相关白噪声 RMS 幅度按 **$1/\sqrt{N}$** 下降；当 $N = 4$ 时，噪声跌半（`+6 dB`，恰好等于 **多出 `1` 位分辨率**）；当 $N = 16$ 时噪声降到 $1/4$（**多出 `+2` 位**，变为有效 `14` 位）：
              $$\Delta\text{位数} = \log_2(\sqrt{N}) = \frac{1}{2}\log_2 N$$
            - **绝对不可缺少的前提条件**：信号上必须叠有**幅度至少涵盖半到一格 LSB 的近似白噪声随机扰动（必要时人为注入微小抖动 Dither）**。否则信号死卡在同一个整数台阶内每次采出完全相同整数，算一百万遍平均也无法突破原 1 位 LSB 台阶。
          reveal:
            - title: 过采样算术到底怎么处理累加整数才不丢那额外多出来的那 `1~2` 位？（工程技巧）
              body: |
                例如拿 12 位 ADC 连采 **`16` 次**（目标升成 14 位 = 多 2 位）：**千万不要傻乎乎加完直接除以 16（右移 4 位）**——除以 16 会直接把新攒出来的微小余数小数截掉丢光回退成 12 位。标准做法是把 16 次结果全加起来（此时是 16 位宽总和），然后只 **右移 `k = 2` 位（除以 $2^2 = 4$，称为抽取 Decimation）**。这样保留住高 14 位精细台阶变化，有效提升整整 `+2` 位且无需浮点小数运算。
            - title: 万一前端传感器噪声实在太弱（低于 `0.2 LSB`），怎么人为注入“人工抖动（Dither）”？
              body: |
                经典实战技巧：用微控制器的一根闲置 PWM 或 DAC 输出脚，经过一只几百千欧大电阻向 ADC 输入端叠加一点峰峰值约 `1 ~ 2 LSB` 的三角波或伪随机白噪声微扰（总和平均恰好为零）。这丝微弱人为抖动刚好把原本死卡在整数台阶间的信号推着来回跨线跳变，随后 4x/16x 过采样抽取平均把注入抖动本身也消干净，成功解锁高分辨率。
      - item:
          id: oversample-4x-c4
          type: number
          prompt: |
            一台设备采用片内 **12 位 ADC**，现把采样频率提高到原始需求带宽采样率的 **`4` 倍** 并在微控制器中连续每 4 组取平均输出。在满足噪声统计前提下，这大约能让系统额外多获得多少位（bit）有效分辨率？
          answer: 1
          hint: '代入有效位数增益规则 $\Delta\text{bits} = \log_2(\sqrt{N})$，看看 `4` 倍过采样把随机噪声标准差压低了多少倍。'
          explain: |
            $N = 4 \implies \sqrt{4} = 2 \implies \log_2(2) = 1$ 位（`12 位 → 有效约 13 位`）。
      - item:
          id: oversample-16x-bits
          type: number
          prompt: |
            紧接实战估算：若微控制器带宽与 CPU 余裕足够，现在直接将采样速率狂拉升至 **`16` 倍过采样**（连续每 16 个样本累积平均输出 1 帧）。理论上最多能额外提高多少位（bits）有效分辨率？
          answer: 2
          hint: '先算样本总数 `16` 开平方根看噪声降低倍率，再问这是 `2` 的几次方（或套“每 4 倍 + 1 位”）。'
          explain: |
            `16 = 4²` → $\log_2(\sqrt{16}) = \log_2 4 = 2$ 位（`12 位 ADC` 一跃变身约 `14 位` 细腻分度。若要升 `+3` 位则须 $4^3 = 64$ 倍）。
      - item:
          id: oversample-dither-precond-c4
          type: choice
          prompt: |
            如果拿一个超级干净光滑、几乎**一丁点随机噪声抖动都没有**的恒定直流 `1.0004 V`（正好卡在某两个量化台阶之间偏低位置，每次直接采全被截成完全一模一样的码字 `300`），就算连做 `16` 倍甚至 `256` 倍过采样求平均，最终有效分辨率依然**纹丝不动毫无提升**。这是因为过采样提精度的必备前提条件是什么？
          options:
            - text: 输入信号中必须包含足量（约 LSB 级别）的随机近似白噪声扰动让样点在相邻量化台阶间统计地来回跨格跳动（若原信号太纯净，必要时还需人为刻意加入微小噪声抖动 Dither）
              correct: true
            - text: 因为只能把芯片放进微波炉里彻底烧毁所有电路才算数
              why: 需要适度不相关随机微噪去“打破量化死台阶锁定”，让平均落脚点体现出亚 LSB 真实模拟位置占比（如 4 次中有 1 次跳进 `301`、3 次落在 `300`，均值精确算出 `300.25`）
            - text: 只要采样时钟设成偶数赫兹就算全踩同一死码 300 也能凭空算出小数 300.25
              why: 整数 `(300 + 300 + 300 + 300) / 4` 无论算多少回结果永远严严实实等于整数 `300`。
          explain: |
            这是一条反直觉但很实用的工程规律：**适量白噪声配合过采样，能让有效分辨率超过 ADC 的标称位数。**

  # ==== 执行器和软硬件接口 ====
  - id: capture-edge
    chapter: 执行器和软硬件接口
    title: 边沿触发接口、输入捕获测频测宽、键盘矩阵与多任务并发保护
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            给一台轮式机器人测车轮转速，轮轴转 1 圈光电编码器就吐出一个跳变脉冲。如果我们不用高精度的硬件定时测量电路，而是在主循环里看一眼看脉冲到没到——要是轮子越转越快、而且旁边还插着显示器和无线电任务忙得要命，软件轮询一下子就会错过脉冲或者算错转速。怎么在硬件接口层面“一丝不差”抓准两个相邻上升沿到底间隔了多少微秒？
          options:
            - text: 用定时器输入捕获（Input Capture）功能把硬件边沿和定时器自由计数器直连，在信号跳过那一微秒由硬件自己零软件延迟拍下当前时钟计数值。
              correct: true
            - text: 暂停整台机器人的全部电机与显示屏幕专门死死盯住编码器一分钟
              why: 忙等轮询（Busy-Wait）会被其他中断或任务拖出不可预测的软件抖动延迟；硬件输入捕获是亚微秒级的物理锁存。
            - text: 让用户拿着秒表在旁边盯着轮胎手动数圈数再输入进去
              why: 边沿触发输入捕获和输出比较定时同步协同后台标志/环形缓冲交接，既抓得准时间又不卡主流程。
          explain: |
            把微控制器的**边沿捕捉、周期配时、矩阵键盘接口与多路并发安全**汇成整套接口工程。
      - card:
          title: 边沿捕获测周期测频、接口时序与矩阵扫描
          body: |
            - **引脚配置与盲等/忙等接口**：读外设状态前核清建立/保持硬件时序，能用硬件就绪标志或边沿中断就别盲等固定死延时；
            - **矩阵键盘扫描**：用 $R$ 条行输出线逐行拉低、读回 $C$ 条列上拉输入线，只需 $R + C$ 根引脚（例如 `4 + 4 = 8` 根引脚）即可扫描 $R \times C = 16$ 颗按键。
            - **输入捕获测周期与频率**：连续两次上升沿捕获计时差 $\Delta t$ 就是周期 $T$，倒数即得精确频率 $f = 1 / T$。
          reveal:
            - title: 多任务并发协作、互斥保护区与 `SysTick` 心跳
              body: |
                当一个接口系统同时干“读取按键/串口/编码器计算/点屏幕”多路活时，常借助 `SysTick` 周期定时驱动轮流时间窗与中断信号交接。如果多个并发执行路径（例如主循环和捕获边沿中断）碰同一份共享队列或计数变量，修改前后必须设起极短**互斥保护区**（短时屏蔽对应中断保护读–改–写不被劈断）。
            - title: 为什么在矩阵键盘和高速开关输入口常要求“先配置上拉与防鬼影二极管”？
              body: |
                当 `4 × 4` 键盘同时按下三颗组成矩形三角的按键时，未隔离的行和列铜线会连成一条意外回流捷径，让单片机误以为第四颗没按下的“幽灵键（Ghost Key）”也按下了。在每颗按键开关旁串联一颗几分钱的小二极管，加上扫描行设开漏或三态浮空输出、读列开启内置弱上拉电阻，即可彻底杜绝多键并发鬼影及引脚输出对撞短路。
      - item:
          id: matrix-keypad-pins
          type: number
          prompt: |
            使用标准行列扫描法制作一块 `4 × 4`（共 `16` 颗按键）的数字小键盘接入微控制器数字端口（`4` 根行线逐行输出扫描 + `4` 根列线带输入读取，1.8）。比起每颗按键独占 1 根脚直接省下一半线，这一共只需接多少根 MCU GPIO 引脚？
          answer: 8
          hint: '分别数清需要几条行控制线与几条列读取线，两者相加。'
          explain: |
            `4 + 4 = 8` 根引脚就能识别 $4 \times 4 = 16$ 颗键（若 `8 × 8` 阵列则是仅 16 根引脚扫足 `64` 颗按键）。
      - item:
          id: keypad-8x8-count
          type: number
          prompt: |
            继续使用行列矩阵扫描原理：若微控制器接出一个共有 **`8` 根行线和 `8` 根列线**（占用 `16` 根引脚）的按键阵列，它最多能同时扫描识别多少颗互不冲突的独立按键？
          answer: 64
          hint: '每个行列交叉点都可以安放 1 颗机械按键，将行数与列数相乘。'
          explain: |
            $8 \times 8 = 64$ 颗按键（仅仅多用 16 根 GPIO 脚就省掉了 48 根脚。注意若需同时多键按不鬼影还需给每颗键串一颗小防倒灌二极管）。
      - item:
          id: freq-from-capture-hz
          type: number
          prompt: |
            微控制器开启 **输入捕获** 测车轮霍尔传感器的转速脉冲。已知连续两次上升沿之间定时器刚好计过 `2000` 微秒（即信号整周期 $T = 2\text{ ms}$）。此传感器输出脉冲频率是多少赫兹（Hz）？
          answer: 500
          hint: '频率是信号周期时间（单位秒）的倒数：$f = 1 / T$。'
          explain: |
            $T = 0.002\text{ s} \implies f = 1 / 0.002 = 500\text{ Hz}$。
      - item:
          id: interface-sync-choice
          type: choice
          prompt: |
            对比“**盲周期固定死等（Blind-Cycle）**”、“**忙等轮询（Busy-Wait）**”和“**边沿捕获/中断驱动同步（Interrupt-Driven）**”三类接口同步手段，哪个判断符合实际接口工程原则？
          options:
            - text: 盲周期硬等一旦外设因温度老化多拖半微秒直接出错；忙等占用全部 CPU 时间；而边沿中断与硬件捕获能在事件到达零瞬间准确响应且平时不浪费算力或可睡眠
              correct: true
            - text: 盲周期不需要知道外设响应要多久也不看真实时序就能 100% 永远完美工作
              why: 盲等必须严格保证最慢外设也已准备妥，毫无弹性裕量；高速或不确定到达时间的外部接口必用轮询或中断
            - text: 硬件中断处理共享区域永远不需要任何屏蔽保护，想怎么改共享队列都行
              why: 只要有共享状态跨中断和主循环同时读写，就必须严设极短互斥保护防撕裂竞态
          explain: |
            从硬件电气连线到软硬件同步时序与多任务并发共享隔离，才是完整的实时接口工程师视野。

  - id: motor
    chapter: 执行器和软硬件接口
    title: PWM 调压功率计算、H 桥正反转控制与感性负载续流保护
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            微控制器单个数字引脚只能吐出区区 `20 mA / 3.3 V` 电流，可你要驱动一辆智能小车里吃 **`12 V` 大电流、而且既要能往前飞转、又要能立刻倒车反转甚至紧急刹车** 的直流电机。直接把电机两头塞进单片机引脚行不行？要是外面用 4 只开关管搭一个桥，怎么靠 PWM 优雅调速又安全保护电路不被电感高压炸飞？
          options:
            - text: 单片机引脚推不动还会当场烧毁。必须外接 H 桥四开关驱动电路控制正反向导通方向，用 PWM 占空比 调平均电压，再在电路上必配 续流二极管 泄放电机停断刹那抽出的高压反向电动势。
              correct: true
            - text: 直接硬插进 STM32 两根 GPIO 脚就能安全带起十安培大马达倒车正转
              why: 大电流直接烧毁微控制器 IO 引脚内部金属连线与驱动管；且直流电感关断尖峰高压直接打穿数字逻辑区。
            - text: 想要反转只能人工跑去小车旁边拿扳手把电池正负极每次重新拔插反过来接
              why: 由对角两只开关交替通断即可纯靠电子控制无缝瞬间切换正转、反转与制动刹车。
          explain: |
            单片机引脚只能出几十毫安，直接接电机会烧坏。要外接 H 桥驱动：四个开关决定电流方向，PWM 占空比调平均电压，续流二极管泄放电机断电瞬间的反向高压。这一课把 **PWM 平均电压、H 桥和续流二极管** 讲清楚。
      - card:
          title: 'PWM 均值调速、H 桥正反转与续流二极管保命原理'
          body: |
            - **PWM 等效平均电压计算**：开关电源电压为 `V_supply`、占空比 `D` 时，经电机电感与转动惯性平滑后的平均驱动电压就是：
              $$V_{avg} = V_{supply} \times D$$
              （例如 **`12 V` 供电、占空比 `25%`** → $12 \times 0.25 = \mathbf{3\text{ V}}$）；
            - **为什么需要 H 桥？**：将电机横跨接在左右两组半桥共 **4 只电子开关（`Q1..Q4`）** 中央构成字母 `H` 形：闭合左上+右下对角则电流从左流向右**正转**；改闭右上+左下对角则电流掉头反向实现**反转**；同时短接下方两管则构成能量消耗**电磁刹车制动**（绝对严禁同一侧上下两管同时导通引发电源直通短路）。
          reveal:
            - title: 为什么关断瞬间电机一定要靠“续流二极管（Flyback Diode）”保命？以及积分控制
              body: |
                电机绕组是大感性负载（电感定律 $v = L \frac{di}{dt}$ 反对电流瞬间变零）：一旦 PWM 周期切入关断刹那把电流猛掐断，电感为了拼命续命会立刻在两端激发出几十上百伏特的极高**反向电动势（反冲尖峰）**。没有**续流二极管**（或内部体二极管旁路）给这股多余磁场电流兜圈泄放通路，高压直接生生把开关 MOS 管击穿烧炸。另在匀速稳速控制里常把速度误差经过**积分控制**累加调占空比以彻底消除上坡负载导致的稳态掉速。
            - title: 为什么 H 桥在上下开关交替切换瞬间必须加“死区时间（Dead Time）”？
              body: |
                任何真实功率 MOS 开关管从导通变成彻底关断都要几十到几百纳秒时间。如果程序一瞬间刚让左上管关断指令落地就同时合上左下管，半空未断净的那零点几微秒里，电源 `12 V` 直接通过同一侧上下两管零阻力短接直奔大地（Shoot-Through 直通炸管）。因此硬件 PWM 控制器总会插入极短暂两端全断的“死区安全窗口”。
            - title: 为什么在闭环直流电机调速上，“纯比例控制（P）”爬坡总会掉速而必须加“积分控制（I）”？
              body: |
                如果只按“目标转速减去实测转速”成正比调占空比，小车一旦驶上陡坡阻力增加，车轮速度势必略低于设定值才能靠这份偏差撑出更大力矩（永远消不净稳态静差）。引入**积分控制**：把历次微小速度欠缺一点点累加存起来推动占空比，直到真实速度完全追平设定目标，哪怕满载上坡也稳稳咬死目标转速。
      - item:
          id: pwm-12v-25pct-c4
          type: number
          prompt: |
            使用 **PWM**（脉宽调制）信号通过开关驱动器控制一台直流电机：已知主驱动供电电源电压固定为 **`12 V`**，当前设定的高电平有效占空比为 **`25%`**。电机两端感受到的等效平均直流电压是多少伏？
          answer: 3
          hint: '计算整个 PWM 脉冲周期内导通时间所占比例乘以全供电电源电压。'
          explain: |
            $V_{avg} = 12\text{ V} \times 25\% = 12 \times 0.25 = 3\text{ V}$。
      - item:
          id: pwm-12v-75pct-extra
          type: number
          prompt: |
            如果保持电机供电电源 `12 V` 不变，把高速 **PWM** 的高电平占空比调升到 `75%`（四分之三时间导通）让小车加速爬坡。电机两端等效平均驱动电压变为多少伏？
          answer: 9
          hint: '用总供电电压 `12 V` 乘以新的高电平占空比比例。'
          explain: |
            `12 × 0.75 = 9 V`。占空比从 `25%` 滑向 `75%`，等效直流推动电压也线性从 `3 V` 升至 `9 V`。
      - item:
          id: hbridge-flyback-c4
          type: choice
          prompt: |
            用微控制器控制直流电机时，硬件外围为什么几乎必须搭配 **H 桥** 与 **续流二极管**？
          options:
            - text: H 桥靠 4 只电子开关对角导通控制电流方向从而实现正转、反转和刹车制动；直流电机属大感性负载，关断瞬间电流不能突变会产生极高反向电动势，须靠续流二极管提供安全电流回流通路防击穿开关管。
              correct: true
            - text: 只要用单只开关管串联在电机一端就能实现正反转切换，H 桥只是为了把供电电压升高四倍
              why: 单只开关只能控制单向通断而无法掉转电流方向，必须靠四管 H 桥对角切换才能改变流过电机绕组的电流方向实现正反转。
            - text: 续流二极管的作用是阻止一切正常电流进入直流电机使其永远不能转动
              why: 正常驱动时续流二极管反向截止毫不影响电机全速工作，唯独在开关突然关断那微秒正向导通替电感泄放能量护航。
          explain: |
            千万别忘检查驱动板：**死区防同侧直通短路 + 续流泄放护开关**，做小车不烧驱动板全靠它俩。
      - item:
          id: actuator-types-match
          type: match
          prompt: |
            把执行器驱动及调速控制里四个核心构件对应到准确硬件作用。
          pairs:
            - ["二值开关型执行器（继电器/MOSFET）", "只受控全开或全关，常配光耦或续流二极管驱动加热丝、电磁阀等"]
            - ["H 桥四开关驱动拓扑", "对角切通改变直流电机电流方向实现正转、反转及制动刹车"]
            - ["反向续流二极管（Flyback Diode）", "开关断开瞬间为感性线圈残余电流提供安全回路，吸收防高反压击穿"]
            - ["DAC / PWM + 积分控制", "按误差积分实时平滑微调驱动出力以对抗斜坡/负载变化并消除稳态静差"]
          explain: |
            只懂采不懂控只是单向观察器，打通“传感采集 → 算法判定 → 安全强力执行驱动”闭环才是完整智能设备。

  - id: system-check
    chapter: 执行器和软硬件接口
    title: 混合信号系统整链验收：模拟滤波带宽、低功耗预算与可测试性设计
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            所有单点部件（电桥放大板、I²C 温度探头、ADC 采集代码、PWM 驱动模块）全部各自单独上桌测完貌似一切良好，可一旦焊死到同一块完整电路板装进金属外壳通电跑起闭环控制，结果出现电机一转、温度读数就剧烈跳动、而且设备还没带可拆插接测试点根本查不出哪一节掉链子。工程上出厂总装前怎么做才能避免“单块全好、装一起全崩”？
          options:
            - text: 按全链路做低噪声布线分割、电源功耗核算、系统级频响检验，并从设计第一天起就在板卡关键节点留足可测试性探针（DFT）测试焊盘和分段屏蔽开关。
              correct: true
            - text: 把电机大电流地线和微弱毫伏传感器地线胡乱绕成一团且从不留任何调试测试点
              why: 大电流 PWM 开关突变沿着共用长细地线制造严重地弹毛刺直接污染前端微弱放大器，必须模数分离单点共地与留设探针点。
            - text: 永远不在实体板上做联合压力验收，只靠心里空想祝一切顺利
              why: '**可测试性设计（Design for Testability）**与整链边界压力验收是保证量产质量的一道关闸。'
          explain: |
            全章收官总检查——从供电功耗预算、频响耦合验证到可测试性设计（DFT）完成整条硬件-软件采集接口验收。
      - card:
          title: 系统级联合验证：功耗核算、频响检查与可测试性设计
          body: |
            把采集与控制装进一台真产品前最后审查四张清单：
            1. **系统频响与抗混叠复核**：确保模拟低通在采样率一半以上已把电机与工频杂波砍到够深，避免信号越过有效带宽失真或混叠；
            2. **完整功耗预算**：统计传感器激励 + 放大器静态耗流 + 总线上拉耗电 + 执行器 + MCU 睡眠均值，校核电源芯片稳压余量与温升；
            3. **可测试性设计（DFT）**：在电桥输出后、调理放大后、总线引脚旁预先引出测试焊盘或跳线帽，方便用标准源直接灌入半截调试隔离分段定位故障。
          reveal:
            - title: 为什么大电流电机启动瞬间，同一块板上的传感器读数常常莫名跳变或单片机突然重启？
              body: |
                电机猛踩油门瞬间会吸走数安培浪涌电流，经过电池与细长铜皮电源路径时把整个公共供电 `VDD` 狠狠拽塌跌落半伏。如果前端基准源和传感器跟电机吃同一路未隔离未退耦的电，参考电压 `V_ref` 瞬间掉下去，ADC 读出来的数字马上一齐假性暴涨甚至触发 MCU 欠压复位。解法：**模拟参考加独立 LDO 低噪稳压供电、在芯片电源脚贴近放 `0.1 µF + 10 µF` 去耦电容、大功率电源与弱信号模拟地分走单点回源。**
            - title: 为什么高速采集与强电磁车间系统还要做好过压钳位与屏蔽接地？
              body: |
                工业传感器线暴露在外极易挨上静电脉冲或偶发线缆接错 `24 V`：在调理放大器输入端串入限流保护电阻配合双向钳位二极管导到供电轨/地，可护住娇嫩 CMOS 芯片输入脚；配合单端金属编织屏蔽网单点接地把外部工频耦合泄进大地而不产生地环路电流。
            - title: 量产上线前怎样用“三步验收清单”彻底验证整机接口不翻车？
              body: |
                第一查**零负荷空载与满载电池电流及关键稳压芯片温升**；第二查**已知精密毫伏/标准波形注入测试点后 ADC 与校准输出是否在容差范围内**；第三查**满速通讯与电机启停大负荷连续压测数小时有无任何丢包、重启或毛刺超标**。
      - item:
          id: dft-probe-why
          type: choice
          prompt: |
            画原理图与 PCB 时遵循 **可测试性设计（Design for Testability, DFT）**原则，在信号调理放大后、进 ADC 前多加一颗小跳线帽或 `1 mm` 测试铜焊盘，有什么不可替代的工程价值？
          options:
            - text: 一旦整机读数发疯，可以立刻断开跳线往后级单独注入已知精准测试电压、并用探头抓前级波形，一刀切开“究竟是前端传感漂了、运放挂了还是软件换算错了”。
              correct: true
            - text: 在信号链中间加测试焊盘会自动形成高阶低通滤波，完全取代抗混叠滤波器
              why: 测试点与 0 Ω 跳线本身不提供滤波衰减，它的工程作用是让研发和产线能够分段断开信号链、注入标准电压隔离定位故障
            - text: 为了故意多占电路板面积提高原料成本
              why: 一颗几分钱 0 Ω 跳线电阻就能替研发和售后省掉几百小时盲拆查修板子的惨痛代价
          explain: |
            能快速“切开分段单独灌入已知参考输入验证”的板子，调试时间缩短十倍。
      - item:
          id: ground-noise-isolation
          type: choice
          prompt: |
            同一块 PCB 上既有 `12 V` 大电流 PWM 驱动水泵电机，又有放大 `100` 倍测几毫伏热电偶的精密微伏通道。以下布线接地方式哪一种最能保住温度采集不被电机干扰污染？
          options:
            - text: 电机大功率回路单独走宽粗电源与功率地直回主电源端，模拟小信号前端独立采用干净线性稳压源与星形单点接地、紧靠芯片放置退耦电容
              correct: true
            - text: 拿热电偶放大器的负地线直接从大功率水泵负极绕十圈回芯片
              why: 电机几安培高频开关电流流经共用地线微弱毫欧电阻就会产生上百毫伏地电平上下跳动，经 100 倍放大直接掀翻测量端。
            - text: 彻底拔掉芯片上所有旁路去耦电容以防漏掉一毫安
              why: 电源引脚旁紧贴放置高频退耦电容是瞬间吸收芯片开关毛刺、稳住参考供电的关键护盾
          explain: |
            “模拟归模拟、数字归数字、功率走功率，单点汇合于源头”——混合信号电路铁律。
      - item:
          id: system-checklist-match
          type: match
          prompt: |
            把系统联合验收阶段的四类核查手段配对到各自要防范的隐藏工程问题。
          pairs:
            - ["系统频率响应与带宽审核", "保证有用变化顺畅无截顶穿过、高于半采样率高频杂波已提前狠压防混叠"]
            - ["分段功耗与电池预算", "算全激励桥电流、上拉漏耗、睡眠平均电流与电源 LDO 裕量防过热重启"]
            - ["可测试性设计（DFT 探针/跳线）", "预留标准参考注入点与总线测点，出问题瞬间二分拆解是前级模拟还是后级代码错"]
            - ["功率地与模拟参考电源隔离", "防止电机大电流开关压降通过共用地线串入高倍微小差分通道导致读数跳水"]
          explain: |
            恭喜打通《传感器与接口》全链路。从微伏电桥调理、精密度准确度双点校准、UART/I²C/SPI、过采样提精度直到底层 H 桥电机安全驱动与混合信号验收，嵌入式真实工程全链条已经完整掌握。

boss:
  items:
    - id: boss-cal-precision-c4
      type: choice
      prompt: |
        使用某温度计多次反复测量同一恒定 `20 °C` 温水，读数密集稳落在 `22.00、22.01、21.99 °C`。关于精密度和准确度的判断哪项准确？
      options:
        - text: 精密度（重复性）极高、波动极小，但准确度较差（稳偏高了 `+2 °C`），只需经一次校准减去系统偏移即可变得既精密又准确
          correct: true
        - text: 准确度完美无瑕，但精密度极差无比
          why: 多次集中抱团说明**精密度高**，集体偏离真值 2 度说明**准确度不佳**
        - text: 精密度和准确度都彻底无法挽救，哪怕校准也绝对没救
          why: 重复一致性优异正代表它随机噪声极小，减去稳定系统偏差或两点线性校斜率即达高精度。
        - text: 精密度高一定自动保证准确度也 100% 高，二者永远完全相等
          why: 一个坏零点未校准的精密仪完全可以做到“极其稳定地错在同一个偏置点上”
      explain: |
        稳稳偏在固定一处（精密度高、准确度低）恰恰最容易通过标定校准彻底修准。
    - id: boss-cal-45c-c4
      type: number
      prompt: |
        温度传感器两点线性标定结果为 `0 °C` 时输出 `0.52 V`，`100 °C` 时输出 `1.52 V`。已知线性关系，测得引脚读数 **`0.97 V`** 时对应真实温度是多少摄氏度（°C）？
      answer: 45
      explain: |
        斜率 $= (1.52 - 0.52) / 100 = 0.01\text{ V/}^\circ\text{C}$；对应温度 $= (0.97 - 0.52) / 0.01 = 45\ ^\circ\text{C}$。
    - id: boss-bus-compare-c4
      type: match
      prompt: |
        把三种常驻单片机接口总线的“线数、寻址方式、双工特性与典型速率”连对。
      pairs:
        - ["I²C", "2 线（SDA/SCL）开漏上拉、7 位地址可挂多设备、半双工、约 100 kHz~1 MHz"]
        - ["SPI", "4 线（SCLK/MOSI/MISO/CS）、每从机一根独立片选、全双工、可达几十 MHz"]
        - ["UART", "2 线（TX/RX）无公共时钟线异步约定波特率、点对点（1 对 1）、全双工"]
      explain: |
        若遇到两颗芯片的 I²C 地址冲突且无法改址引脚，可将它们分接入不同独立 I²C 总线或经过 I²C 多路复用器分时隔离切换。
    - id: boss-i2c-conflict-choice
      type: choice
      prompt: |
        如果电路上两颗传感器出厂 **I²C** 默认 7 位地址完全撞车冲突，正确靠谱的硬件解法组合是？
      options:
        - text: 若芯片提供了硬件地址选择引脚就改接成不同高/低电平地址；若地址彻底固化写死，则分别挂到不同的硬件 I²C 总线控制口或加入一颗 I²C 多路复用器
          correct: true
        - text: 只要给两颗芯片各自单独焊一套上拉电阻再并回同一对 SDA/SCL 线上，就能让主控区分它们
          why: 并回同一对 SDA/SCL 后依然是同一条电气总线，两颗同址从机收到相同 7 位地址仍会同时应答冲突
        - text: 直接把两颗同址传感器并接在同一对 SDA/SCL 线上，主控发起一次读取就能自动收到两者的平均值
          why: 两颗从机同时在 SDA 上抢拉 `ACK` 和发回不同数据比特会把电平拉撞成无意义的废码。
        - text: 像 SPI 那样给两颗 I²C 传感器的电源脚或 SDA 脚直接当片选信号高频拉低拉高，无需地址脚或多路复用器
          why: 标准 I²C 没有独立片选 CS 引脚，强行断电或拉死 SDA 会破坏总线开漏状态，正规做法是改地址引脚、分独立 I²C 总线或接 I²C 多路复用器
      explain: |
        分总线、改引脚或加一颗 I²C 多路器（如 TCA9548A），总有一招彻底解冲突。
    - id: boss-bridge-cond-c4
      type: choice
      prompt: |
        关于传感器“信号调理核心环节”以及“惠斯通电桥为什么特别适合测微电阻”，下面哪一项叙述完全正确？
      options:
        - text: 调理通常包括高阻缓冲匹配、放大至贴近 ADC 满量程、电平移位、滤波去噪/抗混叠、保护及线性化；惠斯通电桥平衡时输出 0、仅把微弱阻变单独转成差分电压送高输入阻抗仪表放大，并能抵消共模干扰和温漂
          correct: true
        - text: 信号调理不需要任何放大也不必管抗混叠，直接把毫伏级微弱传感器输出接进 0~3.3 V 的 ADC 就能获得满量程最高分辨率
          why: 几毫伏直进 ADC 仅占两三个量化刻度毫无分辨率可言，必须调理放大撑满量程并用模拟低通预先滤除高频混叠
        - text: 测微小电阻变化时，用单只电阻直接接进 3.3 V 电源测量绝对电压，比用四臂惠斯通电桥差分测量更能抑制共模温漂
          why: 单端测量会把庞大的 1.65 V 共模基准直流连同微伏变化一起放大导致运放饱和，惠斯通电桥恰恰靠四臂比例对称抵消直流底座与共模温漂。
        - text: 只要在 ADC 采样完之后用软件乘以一个放大系数，就能完全替代模拟前端的运放放大与抗混叠低通滤波
          why: 软件乘法只会把已经丢失在量化台阶里的微弱信号和已经折叠进低频的混叠假信号一并放大，无法替代模拟前端调理
      explain: |
        微伏变满幅、差分去共模、滤掉带外高频、对齐安全供电窗——前端调理全部灵魂就在这一句里。
    - id: boss-oversample-4x-c4
      type: number
      prompt: |
        若系统手头用一颗 **12 位 ADC**，现把实际采样速率升到需求带宽采样率的 **`4` 倍** 并每 4 个样点做累加抽样平均（满足随机白噪声前提条件）。大约能额外多挤出多少位（bits）有效分辨率？
      answer: 1
      explain: |
        每 **`4` 倍**过采样并累加平均（不截断新余位），随机白噪声标准差缩小至 $1/\sqrt{4} = 1/2$（SNR 提升 `+6 dB`），相当于多获得约 **`1` 位**有效分辨率（16 倍则多 `2` 位）。
    - id: boss-oversample-precond-c4
      type: choice
      prompt: |
        通过过采样与求平均来白嫖提升 ADC 有效位数时，有一个绝对少不了的前提条件，否则把同一个恒定数字连算 100 遍平均分辨率依然原地不动。这个关键前提是？
      options:
        - text: 输入信号必须叠加有足量（大约能跨越临近量化台阶的）近似白噪声随机微扰动，若原信号过度死稳平滑则须人为加入微小抖动（Dither）
          correct: true
        - text: 输入引脚必须绝对死静到连一丝微伏噪声波动都不许存在
          why: 没有随机微扰把读数按概率分布推到相邻两个台阶格之间时，无论采样平均多少倍全都是同一个死整数。
        - text: 必须把采样速率降低到原来的 1/4，才能让每次采样的电荷保持更久从而增加有效位数
          why: 过采样恰恰要求把采样率提高到原来的 $4^w$ 倍并求平均，降低采样率无法靠统计平均换取额外分辨率
        - text: 把 4 次采样相加之后必须立刻用整数除法丢掉全部小数位，绝对不能保留扩展出来的低位比特
          why: 若加总后直接截断回原来的 12 位整数，多算出来的分辨率位又被扔掉了，必须保留累加后的扩展位数（或浮点小数）。
      explain: |
        “4 倍 +1 位”靠的是随机白噪声统计跨越台阶的比例均值。
    - id: boss-pwm-hbridge-c4
      type: number
      prompt: |
        使用 **PWM**（脉宽调制）搭配 **H 桥**（外加 **续流二极管** 保护感性负载开关管不被高反压击穿）控制一台直流电机：已知电源电压为 **`12 V`**、PWM 占空比为 **`25%`**。电机实际等效承受的平均驱动电压是多少伏？
      answer: 3
      explain: |
        $12\text{ V} \times 25\% = 3\text{ V}$；H 桥对角切换控正反转，续流二极管为电机线圈电流提供关断泄放保护回路。
