skill: A.2.1
version: 2
authors: [main-agent]
brief:
  why: |
    面对真实数据，怎样从已知标签学出能预测新样本的规律、在没有任何标签时发掘内在结构与紧凑表示，又该如何在高维稀疏数据上做好特征编码并避免过拟合？这一关系统打通监督、无监督与半监督学习：从线性模型、逻辑回归、生成分类器、集成树到支持向量机，从 k-means、层次聚类到主成分分析、自编码器与低秩矩阵补全，再到特征工程、正则化、交叉验证与半监督训练。
  outcomes:
    - 区分监督、无监督与半监督任务，诊断欠拟合与过拟合，并在偏差–方差权衡下选型
    - 从零推通线性回归最小二乘/梯度下降及逻辑回归 Sigmoid 交叉熵梯度，对比 LDA/QDA/朴素贝叶斯、树集成与支持向量机
    - 掌握 k-means 迭代与层次聚类树状图，用协方差特征分解完成 PCA 降维与方差比例计算
    - 理解表示学习、分布式表示、流形假设、自编码器及缺失值低秩矩阵补全
    - 规范完成数值变换、独热/哈希/交互编码、样条与岭回归/Lasso，并在防数据泄漏的前提下执行 k 折交叉验证与半监督学习
terms:
  - term: 参数
    def: '模型内部由训练数据拟合决定的可调系数（如线性模型的权重 w 和截距 b），以及概率分布的特征常数'
  - term: 变量
    def: '描述样本属性或预测目标的量，包括输入特征（自变量 X）和输出目标（响应变量 Y）'
  - term: 监督学习
    def: '给定带有目标正确答案（标签 y）的历史样本，从输入特征 x 学习预测 y 的范式'
  - term: 无监督学习
    def: '只提供输入特征 x 而没有任何标签 y，从数据自身发掘群组、主方向或潜在结构的范式'
  - term: 损失函数
    def: '用来量化单个或整批样本上“模型预测与真实答案相差有多远”的非负代价函数'
  - term: 训练集
    def: '专门拿来给模型反复拟合参数的那部分带标注数据'
  - term: 验证集
    def: '在训练阶段从可用数据中留出、专门用于挑选超参数与比较不同候选模型的独立子集'
  - term: 测试集
    def: '直到所有调参和模型选择全部敲定之后才动用一次、专门用来汇报最终泛化误差的数据'
  - term: 过拟合
    def: '模型容量过高，把训练集里的偶然噪声也记了下来，导致训练误差很低而新样本误差明显升高的现象'
  - term: 欠拟合
    def: '模型过于简单、表达能力不足，连训练集上的基本真实规律都学不出来的现象'
  - term: 偏差–方差权衡
    def: '降低偏差往往需要提升复杂度，但这同时会放大随样本抖动的方差，需要找到测试误差最小的折中点'
  - term: 均方误差
    def: '各样本预测值与真实目标差值的平方平均值 MSE = (1/n) Σ (yᵢ − ŷᵢ)²'
  - term: 普通最小二乘
    def: '通过最小化残差平方和来求解线性回归系数的经典参数估计方法，简称 OLS'
  - term: 逻辑回归
    def: '把线性打分送入 Sigmoid 函数压缩到 (0, 1) 区间，直接输出类别概率的经典线性分类模型'
  - term: 交叉熵
    def: '用真实标签与预测概率对数的加权负值衡量分类预测误差的凸损失函数'
  - term: 广义线性模型
    def: '通过连接函数把非正态响应的期望映射到线性预测器 wᵀx + b 的统一建模框架'
  - term: 决策树
    def: '反复对特征阈值做二元分裂把特征空间切成矩形区域，并以叶节点多数类别或均值作预测的树形模型'
  - term: 随机森林
    def: '基于自助抽样训练多棵深树，并在每次分裂时仅从随机特征子集中挑最优切分以降低方差的集成方法'
  - term: 梯度提升
    def: '串行训练一连串浅层弱学习器，每一棵新树专门拟合前面模型尚未消除的残差梯度以逐步降低偏差的集成方法'
  - term: 支持向量机
    def: '在最大化类别间隔的基础上，借助核函数把线性不可分样本隐式映射到高维空间切分超平面的分类模型，简称 SVM'
  - term: 径向基核
    def: '按样本间欧氏距离的指数衰减计算内积的高斯核函数 K(x, x′) = exp(−γ‖x − x′‖²)，简称 RBF 核'
  - term: 聚类
    def: '在没有真实类别标签时，仅凭特征相似性把样本自动划分成若干内部紧凑、彼此分离的簇的无监督方法'
  - term: k-means
    def: '给定簇数 k，交替执行把每个点分配给最近中心和按簇内均值更新中心直到收敛的硬聚类算法'
  - term: 层次聚类
    def: '不预设固定簇数，自底向上把最相近的点和子簇逐步合并并记录成树状图谱的无监督聚类方法'
  - term: 解释方差比例
    def: '单个或多个主成分所保留的数据方差占全部原始特征总方差的百分比（PVE）'
  - term: 主成分回归
    def: '先无监督地对特征提取前 M 个主成分，再用这几个主成分对响应做线性回归的降维建模方法，简称 PCR'
  - term: 偏最小二乘
    def: '在构造降维线性组合时同时利用自变量方差与响应变量相关性、有监督提取成分的回归方法，简称 PLS'
  - term: 表示学习
    def: '从原始观测数据中自动提取低维、紧凑且解耦的有效特征表示，使后续分类或预测更容易的方法'
  - term: 分布式表示
    def: '用多个可同时激活的共享语义属性维度组合刻画样本，使少量维度能表达指数级概念组合的表示方式'
  - term: 流形假设
    def: '认为现实中的高维自然数据（如图片、语音）主要集中分布在低维光滑弯曲曲面附近的几何假设'
  - term: 自编码器
    def: '由把输入压缩到低维瓶颈的编码器和尽量还原原始输入的解码器组成的无监督表示学习模型'
  - term: 矩阵补全
    def: '假定含大量缺失项的高维数据表近似低秩，通过低维矩阵分解交替填补缺失条目的方法'
  - term: 稠密嵌入
    def: '把高基数离散符号映射为低维连续实数向量，使语义或行为相近的对象在向量空间中彼此靠近的表示方法'
  - term: 特征工程
    def: '结合领域知识与数学变换，对原始数值、分类与缺失字段进行缩放、编码和组合以提升模型效果的过程'
  - term: 独热编码
    def: '把有 K 个离散取值的分类特征展开成由 0 和 1 构成的指示向量，避免强加虚假大小顺序的编码方式'
  - term: 特征交叉
    def: '将两个或多个特征相乘或组合构造新特征列，使线性模型也能捕捉特征间的联合交互效应'
  - term: 基函数
    def: '一组预先选定的固定非线性函数 φₘ(x)，用来把线性模型拓展为拟合曲线和分段平面的非线性回归器'
  - term: 赤池信息准则
    def: '在对数似然或训练残差上为每个参数加上常数 2 的复杂度罚金以挑选模型的准则，简称 AIC'
  - term: 贝叶斯信息准则
    def: '在对数似然或训练残差上为每个参数加上 ln n 的复杂度罚金、比 AIC 更偏好精简模型的准则，简称 BIC'
  - term: 正则化
    def: '在损失函数后面加上惩罚系数幅度的约束项，牺牲少量偏差以显著降低方差、缓解过拟合与共线性的方法'
  - term: 岭回归
    def: '对系数平方和施加 L2 惩罚的线性回归，能把系数温和拉向零并在高维共线时稳住求解'
  - term: Lasso
    def: '对系数一阶大小之和施加 L1 惩罚的线性回归，倾向于把无关特征系数精确压成零从而同步完成筛选'
  - term: 交叉验证
    def: '把训练数据分成多折轮流做训练与验证、汇总平均验证误差以更稳健地选模型与调超参数的方法'
  - term: 自助法
    def: '从含 n 个样本的数据中有放回地重复抽取 n 个样本，用来估计统计量标准误或构建多样化集成的方法'
  - term: 自训练
    def: '先在少量标注数据上训练分类器，再挑高置信度未标注样本贴上伪标签并入训练集重训的半监督策略'
  - term: 协同训练
    def: '为同一样本构造两组互相条件独立且各自充分的特征视角，让两个分类器互相把高置信伪标签送给对方学习的半监督策略'
  - term: 半监督学习
    def: '同时利用少量有标签样本与大量无标签样本共同提升泛化性能的机器学习范式'

lessons:
  # =====================================================================
  # 第 1 章：回归/分类
  # =====================================================================
  - id: statistical-learning-basics
    chapter: 回归/分类
    title: 统计学习、损失与偏差–方差权衡
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一个模型把 200 条历史考题与成绩记得一字不差，训练集错误率只有 2%；结果一上考场做从未见过的新题，错误率升到了 15%。这种“平时高分、考场失常”的现象背后，最可能发生了什么？
          options:
            - text: 模型过于复杂，连历史数据里的偶然噪声都死记硬背了下来（过拟合）
              correct: true
            - text: 模型的表达能力还太简单，连训练集里的主干规律都没有学出来（欠拟合）
              why: 如果连基本规律都没学出来，训练误差本身也会很高，不会低到 2%
            - text: 只要训练集上的错误率降到 5% 以下，任何新测试集上的错误率都会自动降到 2% 以下
              why: 当模型开始背诵训练噪声时，训练误差继续降低，但新样本上的测试误差反而会掉头上升
          explain: |
            机器学习的核心目标不是把已知训练题背熟，而是在未见过的未知样本上保持良好的泛化准确度。
      - card:
          title: 为什么要估计 f，以及学习的两大取向
          body: |
            假设输入特征**变量（variable）** $X$ 和输出目标 $Y$ 满足 $Y = f(X) + \varepsilon$，其中 $f$ 是未知的真实规律，$\varepsilon$ 是均值为 0 的随机噪声。估计 $f$ 有两大目的：**预测**（给新样本尽可能准地估算 $Y$）和**推断**（弄清哪些特征影响 $Y$ 及如何影响）。
            按建模方式又分两路：**参数方法**先假定函数形式（如直线 $f(x) = wx + b$），只需由数据拟合少数可调**参数（parameter）**，好解释但可能设错形状；**非参数方法**不预设固定公式，直接顺着数据局部形态拟合灵活曲线，贴合度高但需要更多样本。
      - item:
          id: parametric-vs-interpretable
          type: choice
          prompt: |
            一家医院想先弄清“年龄、血压、胆固醇这几个指标里，到底哪个与患病风险相关性最强、大约强多少”，而不是做黑盒打分。面对参数简单的线性模型和复杂的深度黑盒，这更体现建模中的哪种考量？
          options:
            - text: 预测精度与模型可解释性的权衡，这里优先做机制推断，适合选结构清晰的参数模型
              correct: true
            - text: 参数模型在任何数据规模下的预测精度都高于非参数模型，因此复杂黑盒模型没有实用价值
              why: 当真实规律高度非线性且样本充足时，灵活的非参数或复杂模型往往预测精度更高，只是更难向人解释每个特征的独立作用
            - text: 只要不断增加模型的参数个数和灵活度，数据里的不可约随机误差项 $\varepsilon$ 最终就会被压缩到 0
              why: 不可约误差 $\mathrm{Var}(\varepsilon)$ 来自未观测变量或随机波动，即使知道了真实函数 $f$ 本身也无法把测试误差降到它以下
          explain: |
            预测看结果准不准，推断看变量关系清不清楚；根据任务重心选合适灵活度的模型，是建模的第一步。
      - card:
          title: 监督学习、无监督学习与两大监督任务
          body: |
            按数据有没有标准答案分成两大范式：
            - **监督学习**：每个样本都有明确目标标签 $y$。若 $y$ 是连续数值（如房价、销量），称为**回归**问题；若 $y$ 是离散类别（如垃圾邮件/正常邮件），称为**分类**问题。
            - **无监督学习**：数据只给特征 $x$、没有标签，目标是在没有现成答案的情况下发现分组、降维压缩或提炼特征结构。
            监督学习先选定**损失函数**来衡量预测错多少，其中回归常用**均方误差** $\mathrm{MSE} = \frac{1}{n}\sum_{i=1}^n (y_i - \hat{y}_i)^2$，分类常用错误率或概率代价。
      - item:
          id: task-type-regression-classification
          type: choice
          prompt: |
            预测“明天是否会下雨（下雨/不下雨）”以及预测“明天商场营业额具体多少万元”，在监督学习中分别属于什么任务？
          options:
            - text: 前者属于分类问题（输出离散类别标签），后者属于回归问题（输出连续数值）
              correct: true
            - text: 前者没有连续数值标签所以属于无监督学习，后者有具体金额所以属于监督学习
              why: 两者都有历史标准答案作为监督信号（下没下雨、实际营业额），都属于监督学习
            - text: 因为两项任务都要从历史观测样本中归纳规律，所以它们在统计学习里都属于无监督聚类任务
              why: 聚类没有目标标签 $y$，这里两项任务都有明确的预测目标变量
            - text: 只要在求解时使用了梯度下降法就一律归为回归问题，使用正规方程就一律归为分类问题
              why: 任务属于回归还是分类只取决于输出目标 $y$ 是连续数值还是离散类别，与选用什么优化算法无关
          explain: |
            先看目标值 $y$ 的性质：离散标签是分类，连续定量值是回归，没有标签才是无监督。
      - card:
          title: 训练、验证与测试分工，以及偏差–方差权衡
          body: |
            用来拟合模型参数的数据叫**训练集**，在训练期挑超参数与比模型的子集叫**验证集**，直到调参定稿后才测一次汇报最终表现的叫**测试集**。随着模型灵活度提高，期望测试误差拆为：$\mathrm{Var}(\hat{f}(x_0)) + [\mathrm{Bias}(\hat{f}(x_0))]^2 + \mathrm{Var}(\varepsilon)$。
            模型太死板会产生**欠拟合**（高偏差，训练和测试都错很多）；太灵活则会发生**过拟合**（高方差，训练误差很低而测试误差明显升高）。找总误差谷底正是**偏差–方差权衡**。
      - card:
          title: 例子：用训练和验证表现诊断过拟合
          body: |
            分别用 1 次直线、3 次曲线和 15 次高阶曲线去拟合一组带轻微噪声的 40 个数据点，观察训练和留出验证集上的 MSE 走势。
          reveal:
            - title: 三种复杂度的误差对比与诊断结论
              body: |
                1 次直线训练 MSE 为 18.4、验证 MSE 为 19.2，两条线都高，说明存在**欠拟合**；3 次曲线训练为 2.1、验证为 2.5，双低且接近；15 次曲线训练降到 0.2、验证却升到 14.8，明显出现**过拟合**。
            - title: 解决过拟合的三类常见工程方法
              body: |
                当训练误差（如 2%）远小于验证误差（如 15%）时，通常从三条路缓解高方差：收集更多训练样本或做数据增强；给参数加惩罚约束（正则化）或换更简洁的模型；在验证误差刚拐头上升时提前停止训练或删减无关特征。
      - item:
          id: bias-variance-tradeoff-curve
          type: choice
          prompt: |
            当模型复杂度从简单逐步调向复杂时，期望测试误差拆解出的偏差平方和方差通常各自怎样变化？
          options:
            - text: 偏差平方通常单调下降、方差单调上升，两者之和呈“先降后升”的 U 形曲线，谷底对应最优复杂度
              correct: true
            - text: 复杂度越高，方差一定越小、偏差反而越接近无穷大
              why: 越灵活的模型对特定训练样本噪声越敏感，方差随之升高，而对真实形状的近似偏差下降
            - text: 只要把训练集样本全背下来，方差就会降成严格等于 0
              why: 死背训练噪声意味着换一批抽样就会拟合出截然不同的弯曲曲线，方差很大
            - text: 不可约误差 $\mathrm{Var}(\varepsilon)$ 会随着模型参数超过十亿而完全归零
              why: $\mathrm{Var}(\varepsilon)$ 来自无法观测的客观随机噪声，再大的模型也消除不了它
          explain: |
            模型选择的技巧，本质上都是把“太死板的高偏差”和“太敏感的高方差”调到 U 形测试误差的谷底。
      - item:
          id: mse-compute
          type: number
          prompt: |
            某回归模型在 4 个测试样本上的预测值依次是 `3, 5, 4, 8`，对应真实值是 `2, 5, 6, 7`。这个测试集上的均方误差 $\mathrm{MSE} = \frac{1}{n}\sum (y_i - \hat{y}_i)^2$ 是多少？
          answer: 1.5
          hint: 先求四个样本各自的差值，全部平方后相加，再除以 4。
          explain: |
            四个差值依次为 $-1, 0, 2, -1$，平方分别为 $1, 0, 4, 1$，总和为 $6$，除以样本数 $4$ 得 $\mathrm{MSE} = 6/4 = 1.5$。
      - item:
          id: overfitting-remedies-choice
          type: choice
          prompt: |
            一个模型在训练集上的分类错误率只有 2%，在验证集上的错误率却高达 15%。下面哪组诊断和处理举措合理？
          options:
            - text: 模型发生了过拟合（高方差）；可以补充更多训练样本、施加正则化限制复杂度或提前停止训练
              correct: true
            - text: 模型处于严重欠拟合状态，应该继续大幅增加多项式阶数和模型参数量
              why: 增加复杂度只会进一步迎合训练噪声，把训练误差压到 0% 而让验证误差继续恶化
            - text: 为了压低验证误差，应该把所有验证集样本直接塞进训练集重新拟合后再在同一份验证集打分
              why: 把评估样本混进训练是严重的数据混用错误，会给出虚假的高分而无法改善真实泛化能力
            - text: 这是无法消除的不可约噪声 $\mathrm{Var}(\varepsilon)$，任何模型和训练策略都不可能让验证错误率靠近 2%
              why: 若真实信号足够清晰，训练集能到 2% 而验证停在 15% 往往有很大一部分来自高方差（过拟合），并非纯随机噪声
          explain: |
            “训练误差很低而验证误差明显升高”是高方差过拟合的典型信号，解决方法是限制模型自由度或补充更多真实训练样本。

  - id: linear-regression-gd
    chapter: 回归/分类
    title: 线性回归、梯度下降与近邻回归
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            用最小二乘法拟合直线 $y = wx + b$ 时，数据较少可以直接套封闭公式一步算出最优斜率和截距；可一旦特征数 $p$ 涨到几万、样本量几百万，求解器却普遍改用一步步更新的“梯度下降”。为什么不一直用现成封闭公式？
          options:
            - text: 特征很多时矩阵求逆计算代价过高，且梯度下降能直接推广到没有封闭解的模型
              correct: true
            - text: 因为在样本量超过一万以后，正规方程封闭公式算出来的斜率会有严重系统性偏差，不再等于最小二乘最优解
              why: 在凸的线性最小二乘问题上，只要矩阵可逆，正规方程和收敛后的梯度下降指向同一个全局最优解，差异在于高维计算效率与通用性
            - text: 因为当解释变量个数超过 4 个时，多元线性回归在数学上就不存在矩阵形式的封闭求解公式
              why: 只要特征矩阵列满秩，任意特征数 $p$ 都有正规方程解 $(\mathbf{X}^\top\mathbf{X})^{-1}\mathbf{X}^\top\mathbf{y}$，只是 $p$ 很大时求逆耗时且占内存
          explain: |
            正规方程给出了解析基准解，梯度下降则能通用于逻辑回归和深度神经网络等没有封闭解的损失函数。
      - card:
          title: 一元/多元线性回归与正规方程求解
          body: |
            给定样本 $(\mathbf{x}_i, y_i)$，线性回归用输入的加权和加上截距预测数值：$\hat{y}_i = w_1 x_{i1} + \dots + w_p x_{ip} + b$（一元情形就是 $\hat{y} = wx + b$）。在真实广告营销等分析里，多个渠道（电视、电台、网络）往往同步投入，单独看某一渠道容易被混杂因素误导，放到多元模型里才能观察“控制其他渠道不动时”的净增量和交互协同作用。
            通过最小化均方误差求解系数的**普通最小二乘（ordinary least squares, OLS）**可以直接由正规方程求解：对于单特征带截距，先算均值 $\bar{x}, \bar{y}$，最优斜率就是 $w = \frac{\sum (x_i - \bar{x})(y_i - \bar{y})}{\sum (x_i - \bar{x})^2}$、截距 $b = \bar{y} - w\bar{x}$。
      - card:
          title: 用梯度下降优化 MSE 与 KNN 回归对比
          body: |
            在样本庞大或损失复杂时，令 $L(w, b) = \frac{1}{n}\sum_{i=1}^n (wx_i + b - y_i)^2$。由多元微分的链式法则，对参数的偏导数（梯度）为：
            $$\frac{\partial L}{\partial w} = \frac{2}{n}\sum_{i=1}^n (wx_i + b - y_i)x_i,\qquad \frac{\partial L}{\partial b} = \frac{2}{n}\sum_{i=1}^n (wx_i + b - y_i)$$
            每步沿负梯度更新 $w \leftarrow w - \eta \frac{\partial L}{\partial w}$。相比之下，非参数的 **K 近邻（KNN）回归**不预设直线方程，而是直接找新点周围距离最近的 $K$ 个训练样本取平均：$K$ 越小曲线越曲折、高方差，$K$ 越大越平滑但容易产生偏差。
      - item:
          id: lr-gd-formula-calc
          type: choice
          prompt: |
            用最小均方误差 $L(w, b) = \frac{1}{n}\sum_{i=1}^n (wx_i + b - y_i)^2$ 拟合直线，关于一步梯度下降更新规则，哪一项准确？
          options:
            - text: 每个样本对 $\partial L/\partial w$ 的贡献正比于预测误差 $(wx_i + b - y_i)$ 乘以输入 $x_i$
              correct: true
            - text: 对截距求偏导的公式 $\partial L/\partial b$ 里也必须乘上输入特征的平方 $x_i^2$，否则截距项无法随样本均值自动平移
              why: $\partial (wx_i + b - y_i)/\partial b = 1$，所以对 $b$ 的偏导就是平均预测误差的两倍 $\frac{2}{n}\sum (wx_i + b - y_i)$，不乘 $x_i$
            - text: 当梯度下降迭代到达均方误差的全局最小值点时，损失函数对斜率和截距的偏导数会趋于无穷大以阻止参数继续移动
              why: 光滑凸函数的最小值点处梯度等于 0，因此参数更新步长自然变为 0
            - text: 当特征维数达到上万维且真实规律接近线性时，非参数 KNN 回归的泛化误差几乎总是低于线性回归
              why: 维度很高时样本点在空间里彼此距离都很远，局部近邻平均会受维度灾难影响而精度大幅下降
          explain: |
            预测误差乘以输入特征取值组成梯度，负梯度把预测往拉近真实答案的方向推；在低维非线性场景可选合适 $K$ 的 KNN，在高维或线性趋势明显场景优先选线性模型。
      - card:
          title: 例子：同一组点上的正规方程解与一步梯度下降
          body: |
            已知 4 个数据点 `(1, 1)`、`(2, 3)`、`(3, 2)`、`(4, 5)`，模型为 $\hat{y} = wx + b$，MSE 损失为 $L = \frac{1}{4}\sum (\hat{y}_i - y_i)^2$。对比精确解与一步梯度下降更新。
          reveal:
            - title: 第 1 步：用中心化正规方程求全局最优 (w, b)
              body: |
                均值 $\bar{x} = \frac{1+2+3+4}{4} = 2.5$，$\bar{y} = \frac{1+3+2+5}{4} = 2.75$。
                偏差 $x_i - \bar{x} = (-1.5, -0.5, 0.5, 1.5)$，$y_i - \bar{y} = (-1.75, 0.25, -0.75, 2.25)$。
                于是 $S_{xx} = 2.25 + 0.25 + 0.25 + 2.25 = 5$，$S_{xy} = 2.625 - 0.125 - 0.375 + 3.375 = 5.5$，斜率 $w = 5.5/5 = 1.1$，截距 $b = 2.75 - 1.1\times 2.5 = 0$。
            - title: 第 2 步：从 w=0, b=0 出发算梯度并按 lr=0.01 更新一步
              body: |
                在 $w=0, b=0$ 处，所有预测 $\hat{y}_i = 0$。$\sum y_i = 1+3+2+5 = 11$，$\sum x_i y_i = 1+6+6+20 = 33$。
                梯度：$\frac{\partial L}{\partial w} = \frac{2}{4}(-33) = -16.5$，$\frac{\partial L}{\partial b} = \frac{2}{4}(-11) = -5.5$。
                学习率 $\eta = 0.01$ 更新：$w_1 = 0 - 0.01(-16.5) = 0.165$，$b_1 = 0 - 0.01(-5.5) = 0.055$。
      - item:
          id: ols-slope-4pts
          type: number
          prompt: |
            数据点 `(1, 1)`、`(2, 3)`、`(3, 2)`、`(4, 5)` 用最小二乘法拟合直线 $\hat{y} = wx + b$，算得中心化偏差平方和 $S_{xx} = 5$、交叉乘积和 $S_{xy} = 5.5$。精确最优斜率 $w$ 是多少？
          answer: 1.1
          hint: 直接计算 $S_{xy} / S_{xx}$。
          explain: |
            最优斜率 $w = 5.5 / 5 = 1.1$，随后代回 $b = \bar{y} - w\bar{x} = 2.75 - 1.1\times 2.5 = 0$。
      - item:
          id: gd-step-4pts
          type: number
          prompt: |
            仍以 `(1, 1)`、`(2, 3)`、`(3, 2)`、`(4, 5)` 的 MSE $L = \frac{1}{4}\sum (wx_i + b - y_i)^2$ 为损失，从初始值 $w = 0, b = 0$ 出发，取学习率 $\eta = 0.01$ 做一步梯度下降后，新的斜率 $w_1$ 变成多少？
          answer: 0.165
          hint: 在 $w=0, b=0$ 时，$\partial L/\partial w = -\frac{2}{4}\sum x_i y_i = -0.5 \times (1+6+6+20) = -16.5$。
          explain: |
            $w_1 = 0 - 0.01 \times (-16.5) = 0.165$（同时 $b_1 = 0 - 0.01 \times (-5.5) = 0.055$），两参数同时向更小损失迈出第一步。
      - item:
          id: knn-bias-variance
          type: choice
          prompt: |
            将非参数的 KNN 回归用于二维平滑数据时，如果把超参数邻居数从 $K = 20$ 调小成 $K = 1$（每个预测点只取最近那 1 个训练样本的值），通常会发生什么变化？
          options:
            - text: 模型对单个噪声点变得很敏感，呈现低偏差、高方差的锯齿状过拟合
              correct: true
            - text: 预测曲面会退化成一条横跨整个特征空间的全局常数水平线，使估计方差降到 0
              why: 只有当 $K$ 取到整个训练集大小 $n$ 时才会退化成预测全局均值的常数线（低方差、高偏差）
            - text: 模型在训练集自身上的均方误差会从接近 0 大幅上升到全模型最高水平
              why: $K = 1$ 时每个训练点自己的最近邻就是它自己，训练误差为 0，只是在未知测试样本上方差很大
            - text: 模型的预测公式会自动等价于通过正规方程求出的全局参数线性回归直线
              why: $K = 1$ 是非参数的最近邻局部查表法，拟合结果呈阶梯状分块而非全局线性超平面
          explain: |
            对于 KNN，复杂度由 $1/K$ 控制：$K$ 越小越灵活（低偏差高方差），$K$ 越大越平滑（高偏差低方差）。

  - id: logistic-regression
    chapter: 回归/分类
    title: 逻辑回归、交叉熵与广义线性模型
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            想预测一名患者患某种疾病的概率 $P(Y=1 \mid x)$（取值只能在 0 到 1 之间），有人直接拿线性回归 $wx + b$ 去拟合标签 0 和 1。除了容易预测出大于 1 或小于 0 的数值，如果你把它套到 0/1/2 三种无序疾病的标签编码上，还会带来什么问题？
          options:
            - text: 线性回归默认假定 0、1、2 之间有大小顺序和相等间隔，调换三种疾病的编号顺序就会拟合出完全不同的模型
              correct: true
            - text: 当响应变量只取 0 和 1 两个离散值时，正规方程的分母恒等于 0，在数学上算不出任何一条直线
              why: 在两类 0/1 情况下线性回归算得出斜率，只是预测值会越出 $[0, 1]$；推广到三类以上更会把无序类别当成等距刻度
            - text: 普通线性回归只能接收整数型自变量 $x$，一旦输入身高、血压等连续特征就会报错
              why: 自变量本身可以是任意连续实数，问题出在输出端应当是有界的类别概率
          explain: |
            用回归直线直接拟合无序类别或 $(0, 1)$ 概率会破坏值域与类别对称性，我们需要专用的概率转换函数和分类损失。
      - card:
          title: Sigmoid 函数、逻辑回归与为什么不用 MSE
          body: |
            在分类设定下，理论上错误率最低的基准是总把后验概率 $P(Y=k \mid X=x)$ 最大的那一类判出的**贝叶斯最优分类器**。为用线性分数 $z = \mathbf{w}^\top\mathbf{x} + b$ 合法表达两类概率，**逻辑回归**套上 **Sigmoid 函数**把实数轴压进 $(0, 1)$：
            $$p = \sigma(z) = \frac{1}{1 + e^{-z}}$$
            训练时一般选用**交叉熵** $L = -[y \ln p + (1 - y)\ln(1 - p)]$ 而不用均方误差 $\frac{1}{2}(p - y)^2$：因为 Sigmoid 配上 MSE 关于 $(w, b)$ 非凸且存在平坦区，当预测严重出错（如 $y=1, p \to 0$）时 $\sigma'(z) = p(1-p)$ 也会趋近 0，导致梯度接近 0。交叉熵不仅关于 $(w, b)$ 严格凸，还是伯努利负对数似然，误差越大梯度推动力越强。
      - card:
          title: 例子：推导出简洁的交叉熵梯度并与泊松 GLM 对照
          body: |
            因为 $\sigma'(z) = p(1 - p)$，交叉熵的斜率抵消掉了分母上的激活导数，呈现出和线性回归一模一样优美的形式。同时把这种“线性预测器经过连接函数转换期望”的思路推广，就得到处理计数等非正态数据的**广义线性模型（generalized linear model, GLM）**。
          reveal:
            - title: 第 1 步：写出交叉熵对参数的简洁梯度公式
              body: |
                对单条样本求偏导：$\frac{\partial L}{\partial p} = -\frac{y}{p} + \frac{1 - y}{1 - p} = \frac{p - y}{p(1 - p)}$。
                乘上 $\frac{\partial p}{\partial z} = p(1 - p)$，分母分子恰好消掉，直接得出 $\frac{\partial L}{\partial z} = p - y$。再对参数求偏导：
                $$\frac{\partial L}{\partial \mathbf{w}} = (p - y)\mathbf{x},\qquad \frac{\partial L}{\partial b} = p - y$$
                梯度大小正比于概率误差 $p - y$，没有饱和减速的问题。
            - title: 第 2 步：对照广义线性模型（GLM）家族的三种典型配置
              body: |
                标准线性回归用恒等连接预测高斯均值；逻辑回归用对数发生比 $\ln\frac{p}{1-p} = z$（即 logit 连接）预测二元伯努利概率；当响应变量是非负整数计数（如每日进店人数、故障次数）时，则采用**泊松回归（Poisson regression）**配合对数连接 $\ln \mu = \mathbf{w}^\top\mathbf{x}+b$（即均值 $\mu = e^z$ 保证恒为正）。
      - item:
          id: logistic-step-trace
          type: sim
          sim: trace
          prompt: 先在心里把 Sigmoid 和交叉熵梯度代码走一遍，算出第 7 行后的 `p`、第 8 行后的 `dw` 以及第 9 行后的新权重 `w`。答完可单步观察数值变化。
          params:
            code: |
              import math
              def sigmoid(z):
                  return 1.0 / (1.0 + math.exp(-z))
              x, y = 2.0, 1.0
              w, b = 0.0, 0.0
              z = w * x + b
              p = sigmoid(z)
              dw = (p - y) * x
              w = w - 0.1 * dw
              print(p, dw, w)
          goal:
            ask:
              - { line: 7, var: p }
              - { line: 8, var: dw }
              - { line: 9, var: w }
          explain: |
            当 $w=0, b=0$ 时 $z=0$，因此 $p = \sigma(0) = 1/(1+1) = 0.5$。由 $(p-y)x = (0.5 - 1.0)\times 2.0 = -1.0$，沿学习率 $0.1$ 走一步得新权重 $w = 0 - 0.1 \times (-1.0) = 0.1$。
      - item:
          id: cross-entropy-vs-mse
          type: choice
          prompt: |
            用逻辑回归做二分类时，为什么损失函数普遍选用交叉熵，而不用直接把输出概率代入均方误差 $(p - y)^2$？
          options:
            - text: Sigmoid 配 MSE 非凸且在预测大错时因 $\sigma'(z)\approx 0$ 导致梯度接近 0；交叉熵关于参数严格凸且梯度为 $(p - y)\mathbf{x}$
              correct: true
            - text: 因为概率 $p$ 落在 $[0, 1]$ 开区间内时，均方误差 $(p - y)^2$ 会对负数开平方而产生复数，在实数域内无法计算损失值
              why: $(p - y)^2$ 是普通非负实数，完全可以算值；问题在于它与 Sigmoid 复合后的参数优化曲面非凸且在两端饱和区梯度趋近于零
            - text: 因为交叉熵对权重参数的偏导数恒等于 $\frac{1}{p(1-p)}\mathbf{x}$，当预测概率接近真实标签时梯度会自动放大以提高精度
              why: 分母 $p(1-p)$ 与 Sigmoid 导数 $p(1-p)$ 恰好约掉，最终梯度是 $(p - y)\mathbf{x}$，预测越准梯度越接近 0
            - text: 因为只要把损失函数换成交叉熵，不加任何非线性特征的线性逻辑回归也能在任意交错对角非线性数据集上达到 100% 准确率
              why: 损失函数只改变参数优化性质，线性逻辑回归的决策边界仍然是线性超平面，无法直接切开线性不可分的异或数据
          explain: |
            伯努利负对数似然直接导出交叉熵：预测越偏离真值（如 $y=1$ 时 $p=0.01$），误差 $|p-y| \approx 0.99$ 推动权重修正的幅度越大。
      - item:
          id: ce-gradient-calc
          type: number
          prompt: |
            已知某正样本特征取值 $x = 3$、真实标签 $y = 1$，逻辑回归当前给出线性打分 $z$ 经 Sigmoid 算出概率 $p = 0.2$。按二元交叉熵梯度公式 $\frac{\partial L}{\partial w} = (p - y)x$，当前对权重 $w$ 的梯度是多少？
          answer: -2.4
          hint: 代入 $(0.2 - 1) \times 3$。
          explain: |
            $\frac{\partial L}{\partial w} = (0.2 - 1)\times 3 = -2.4$；负梯度方向为正，下一步更新会把 $w$ 调大，让下次 $p$ 更靠近 1。
      - item:
          id: glm-poisson-choice
          type: choice
          prompt: |
            某快递网点需要用“星期几、天气、促销活动”预测“明天收到的包裹总件数”（非负整数计数），如果使用广义线性模型（GLM），合适的分布族与连接函数是什么？
          options:
            - text: 泊松回归，用对数连接 $\ln \mu = \mathbf{w}^\top\mathbf{x} + b$，保证预测均值 $\mu = e^{\mathbf{w}^\top\mathbf{x}+b} > 0$
              correct: true
            - text: 直接使用恒等连接的正态线性回归，即使在淡季预测出负数包裹量（如 $-3.7$ 件）也符合计数分布的方差规律
              why: 计数结果非负，且高峰日与低谷日的波动方差随均值变化，泊松对数连接比恒等正态模型更贴合计数的分布特性
            - text: 先把所有历史包裹件数大于 0 的天数都改标成 1，再套用带 logit 连接的二元逻辑回归来预测包裹具体件数
              why: 把件数二值化成 0/1 会丢失具体数量差异，只能预测“有没有包裹”而不能预测“有多少件包裹”
            - text: 广义线性模型只能处理连续正态响应，预测非负整数计数只能改用无监督的层次聚类算法
              why: 广义线性模型专门将线性回归推广到二项、泊松等指数族分布，泊松回归就是其中的标准计数模型
          explain: |
            广义线性模型通过更换匹配响应特征的分布族和连接函数，用同一套框架处理连续实数、二元概率与非负计数。

  - id: generative-classifiers
    chapter: 回归/分类
    title: 生成式分类器：LDA、QDA 与朴素贝叶斯
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            逻辑回归直接去学“给定特征时属于 A 类的概率 $P(Y=A \mid X)$”，而另一种分类思路是反过来先分别描写“A 类样本长什么分布 $P(X \mid Y=A)$”和“B 类长什么分布 $P(X \mid Y=B)$”，再用贝叶斯定理倒推类别概率。当各类别样本都大致呈钟形正态团、且样本量不大时，后一种“生成式”方法有什么优势？
          options:
            - text: 利用正态分布假设约束边界形状，参数估计更稳定，且在两类完全线性可分时系数不会发散
              correct: true
            - text: 生成式分类器属于无监督学习，在训练阶段不需要读取任何样本的真实类别标签就能算出判别边界
              why: 生成式分类器同样是监督分类方法，必须按每一类的真实标签分组统计均值、方差或条件概率分布
            - text: 当特征维度 $p$ 上万且特征间强相关时，为每类单独估计完整 $p \times p$ 协方差矩阵一定比线性模型更不易过拟合
              why: 每类单独估计完整协方差矩阵需要 $O(Kp^2)$ 个参数，特征多而样本少时反而很容易过拟合
          explain: |
            判别式（如逻辑回归）直接拟合分界线，生成式（LDA、QDA、朴素贝叶斯）先估计每类的条件分布 $P(X \mid Y)$ 与先验 $P(Y)$，再用贝叶斯定理求后验概率。
      - card:
          title: LDA、QDA 与朴素贝叶斯的几何边界
          body: |
            把概率论学过的贝叶斯定理写成分类器：$P(Y=k \mid X=x) \propto \pi_k f_k(x)$，其中 $\pi_k$ 是先验比例，$f_k(x)$ 是类条件密度。如果假定每一类都服从高斯（正态）分布：
            - **线性判别分析（LDA）**：假设所有类别共用同一个协方差矩阵 $\boldsymbol{\Sigma}$（各自中心不同、椭球形状与朝向完全相同）。同类椭圆平方项在比较对数概率比时刚好消掉，决策边界退化成一条**直线（线性超平面）**。
            - **二次判别分析（QDA）**：允许每个类别拥有自己独立的协方差矩阵 $\boldsymbol{\Sigma}_k$。椭圆形状互不相同，平方项消不掉，于是边界变成**二次曲线（椭圆/双曲线/抛物线）**。
      - card:
          title: 例子：高斯假设下的朴素贝叶斯简并计算
          body: |
            若特征维度 $p$ 很大、样本数 $n$ 有限，直接估完整 $\boldsymbol{\Sigma}_k$ 要 $Kp(p+1)/2$ 个参数，往往不够稳。**朴素贝叶斯（Naive Bayes）**假设“给定类别 $Y=k$ 时，所有 $p$ 个特征彼此条件独立”：$f_k(x) = \prod_{j=1}^p f_{kj}(x_j)$。
          reveal:
            - title: 高维情形的参数账对比
              body: |
                在 $p = 50$ 维、$K = 2$ 类的任务中：QDA 需要为每类分别估计 $50\times 51 / 2 = 1275$ 个协方差数字（共 $2550$ 个）；LDA 共享一个协方差矩阵需估 $1275$ 个；高斯朴素贝叶斯只看协方差对角线（仅每类每维的均值与方差），只需估计 $2 \times 50 = 100$ 个方差参数，靠简化特征相关性假设（略微增加偏差）换取显著更低的方差。
      - item:
          id: lda-vs-qda-boundary
          type: choice
          prompt: |
            在一维或二维分类任务里，已知 0 类的方差是 1，而 1 类的样本分散得多（方差为 9）。分别拿 LDA、QDA 和标准线性逻辑回归去拟合，哪个模型能画出一头窄一头宽、把 0 类包在中间的二次弯曲边界？
          options:
            - text: QDA，因为它允许每一类分别估计各自独立的协方差矩阵，保留了对数似然比中的二次项
              correct: true
            - text: LDA，因为 LDA 在推导贝叶斯后验概率时会保留每个类别各自不同的二次型曲率矩阵 $\boldsymbol{\Sigma}_k^{-1}$
              why: LDA 假设所有类别共享同一个协方差矩阵 $\boldsymbol{\Sigma}$，二次项在类别相减时彼此抵消，决策边界是线性超平面
            - text: 不加入任何二次平方项与乘积交互项的标准线性逻辑回归模型
              why: 标准线性逻辑回归的对数发生比是特征的一次线性函数，决策边界也是直线（超平面），无法把低方差类包在闭合曲线内
            - text: 只对输入特征计算样本协方差矩阵最大特征向量的无监督主成分分析（PCA）
              why: PCA 是不看类别标签的无监督降维方法，本身不是分类器
          explain: |
            共享协方差得出直线边界（LDA，低方差高偏差），各类独立协方差给出二次曲面边界（QDA，低偏差高方差）。
      - item:
          id: bayes-lda-1d-compare
          type: number
          prompt: |
            一维两类 LDA 模型中，假设先验相同 $\pi_0 = \pi_1 = 0.5$，共同方差 $\sigma^2 = 1$，0 类均值 $\mu_0 = -2$，1 类均值 $\mu_1 = 4$。两类判别得分恰好相等的决策分界点 $x^*$ 在哪里？
          answer: 1
          hint: 共享方差且先验相等时，对称点就在两类均值的正中间 $(\mu_0 + \mu_1)/2$。
          explain: |
            当先验相等且两类方差相同时，点到两条对称钟形线中心等距的地方即为中点 $x^* = (-2 + 4)/2 = 1$（大于 1 判 1 类，小于 1 判 0 类）。
      - item:
          id: compare-classifiers-scenario
          type: choice
          prompt: |
            以下关于常见分类方法适用场景的对比，哪一项判断准确？
          options:
            - text: 真实边界接近线性时逻辑回归与 LDA 表现相近；边界呈复杂弯曲月牙形时 KNN 或核方法更灵活
              correct: true
            - text: 因为朴素贝叶斯的“特征条件独立”假设在现实数据中恒成立，所以在低维强相关大样本数据上它一定优于 QDA
              why: 现实特征间常有较强相关性，当维度低而样本充足时 QDA 能学出相关性与弯曲边界，强行独立的朴素贝叶斯反而偏差较大
            - text: KNN 在训练阶段需要迭代求解大型海森矩阵的逆矩阵，因此训练耗时最长、预测耗时最短
              why: KNN 在训练阶段几乎只存储样本，计算开销主要发生在预测阶段检索全体训练样本寻找最近邻
            - text: 当两类训练样本能被一条直线完全分开时，不加正则化的普通逻辑回归求出的权重范数会收敛到 0
              why: 完美线性可分时，普通最大似然逻辑回归会把权重模长推向无穷大以使预测概率逼近 0 和 1，而基于高斯密度估计的 LDA 依然稳定
          explain: |
            选分类器要同时考虑“真实决策边界有多弯曲”“样本量相对特征维度的比例”以及“特征之间是否有强相关性”。
      - item:
          id: nb-highdim-advantage
          type: choice
          prompt: |
            如果某个文本或医疗分类任务有 $p = 500$ 维特征但只标了 $n = 200$ 个样本，为什么朴素贝叶斯常比估计完整协方差矩阵的 QDA 表现得更稳？
          options:
            - text: 朴素贝叶斯按条件独立假定只估每维单独的边缘参数（$O(Kp)$），避免了在高维小样本上估计完整 $p \times p$ 协方差矩阵的高方差
              correct: true
            - text: 因为朴素贝叶斯在每个类别下需要估计的自由参数个数是 QDA 的 $p$ 倍，模型容量更大、拟合能力更强
              why: QDA 每类要估 $p(p+1)/2$ 个协方差参数（$p=500$ 时超过 12 万个），在 $n=200$ 时严重过拟合且矩阵奇异；朴素贝叶斯参数少得多
            - text: 因为朴素贝叶斯在预测时直接忽略所有输入特征的似然项，只按均匀分布随机指派类别标签
              why: 朴素贝叶斯完整计算各维条件密度乘积与先验概率，只是把协方差矩阵的非对角相关项简化为 0
            - text: 因为当 $p > n$ 时，只有剪枝决策树能写出数学预测公式，逻辑回归与朴素贝叶斯都无法在 $p > n$ 时运行
              why: 朴素贝叶斯只对每个特征维度单独估计一维均值和方差（或词频比例），即使 $p \gg n$ 也能直接算出闭式估计
          explain: |
            面对高维少样本场景，省去特征间交叉协方差、只估计边缘分布的朴素贝叶斯用适度的模型偏差换取了大幅降低的估计方差。

  - id: trees-and-ensembles
    chapter: 回归/分类
    title: 决策树、随机森林与梯度提升
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            医院急诊分诊往往不是算一个长长的加权求和公式，而是顺着流程问：“体温超过 38.5 度吗？是 → 呼吸困难吗？是 → 优先处置。”这种按阈值一步步划分规则的模型很好懂，可单棵深树只要换一批病人训练，长相就可能大变样。怎么在保留树结构优势的前提下让预测又稳又准？
          options:
            - text: 用重抽样训练集和随机特征子集并行训练多棵树投票，或串行训练多棵小树逐步修补前序残差
              correct: true
            - text: 强制规定任何决策树都只允许在根节点比较一次阈值就停止分裂，永远不向下生长第二层子节点
              why: 单层树桩表达能力过弱（高偏差欠拟合），需要通过多棵树的集成（随机森林或梯度提升）才能兼顾表达能力与稳定性
            - text: 在训练单棵深树之前，先把数据表里的所有连续特征和分类特征全部替换成同一个固定常数
              why: 替换成固定常数会抹除所有输入信号；合理做法是让多棵树分别接触不同的自助抽样样本或随机特征子集
          explain: |
            单棵深树方差大（对样本变动敏感）、单棵浅树偏差大（表达力不足）；把多棵树组合起来的 Bagging、随机森林和梯度提升正是解决思路。
      - card:
          title: 决策树分裂准则、不纯度与剪枝
          body: |
            **决策树**通过贪心地依次寻找“哪个特征、哪个切分阈值”让子区域最纯，把特征空间切成若干矩形块。回归树寻找令组内残差平方和最小的切分，叶子里输出该区训练均值；分类树常最小化加权**基尼（Gini）不纯度**：$G = \sum_{k=1}^K p_k(1 - p_k)$（某节点全是同一类时 $G = 0$，两类对半掺杂时最大为 $0.5$）。
            如果不加限制，树会一路切分到每个叶子里只剩 1 个点（严重过拟合），因此通常通过设定最大深度、最小叶样本数，或利用交叉验证做**成本复杂度剪枝**来回缩枝杈。
      - card:
          title: 例子：用基尼不纯度挑选最优一刀
          body: |
            某节点共 8 个样本（正例 4 个、负例 4 个）。现在测试一个规则，把样本切分成左子节点（共 4 个：3 正 1 负）和右子节点（共 4 个：1 正 3 负）。切分前后不纯度降了多少？
          reveal:
            - title: 第 1 步：算切分前的基尼不纯度
              body: |
                父节点正例比例 $p_1 = 4/8 = 0.5$，负例比例 $p_0 = 0.5$。
                于是 $G_{\text{parent}} = 1 - (0.5^2 + 0.5^2) = 0.5$（二分类下最大混杂度）。
            - title: 第 2 步：算加权子节点基尼不纯度与纯度收益
              body: |
                左子节点（占比 $4/8$）：比例 $0.75, 0.25$，$G_{\text{left}} = 1 - (0.75^2 + 0.25^2) = 1 - 0.625 = 0.375$。
                右子节点对称同样得到 $G_{\text{right}} = 0.375$。
                按样本比例加权汇总后仍是 $0.5\times 0.375 + 0.5\times 0.375 = 0.375$，纯度提高了 $0.5 - 0.375 = 0.125$。
      - item:
          id: gini-node-calc
          type: number
          prompt: |
            一个二分类树节点里共有 10 个训练样本，其中 8 个正例、2 个负例。这个节点当前的基尼不纯度 $G = 1 - (p_1^2 + p_0^2)$ 是多少？
          answer: 0.32
          hint: 正例占比 $0.8$、负例占比 $0.2$，计算 $1 - (0.8^2 + 0.2^2)$。
          explain: |
            $p_1 = 0.8, p_0 = 0.2$，所以 $G = 1 - (0.64 + 0.04) = 0.32$；纯度明显高于对半混杂时的 $0.5$。
      - card:
          title: Bagging 与随机森林去相关
          body: |
            - **Bagging（自助聚合）**：有放回重抽样 $B$ 份训练集，并行训练 $B$ 棵未剪枝深树并对预测取平均，把单棵树较高的**方差**压缩下来。但如果有个强特征每次都被选作树根，所有树就会长得很像。
            - **随机森林**：在 Bagging 基础上，每次分裂只从随机挑出的 $m \approx \sqrt{p}$ 个候选特征里找最优切分，降低各棵树之间的相关性，从而进一步减小集成模型的方差。
      - item:
          id: rf-mtry-decorrelation
          type: choice
          prompt: |
            随机森林相比普通的树 Bagging，除了对训练样本做有放回抽样外，还规定“每次节点分裂只从随机挑选的 $m$ 个候选特征（常取 $\sqrt{p}$）里找最优切分”。这条限制的核心目的是什么？
          options:
            - text: 避免少数强特征在每棵树顶层都被重复选中，从而降低树与树之间的相关性、进一步减小集成平均后的方差
              correct: true
            - text: 为了保证随机森林里的每一棵单树在单独拿出来预测时，它的训练拟合偏差都比允许看全部 $p$ 个特征的单棵深树更低
              why: 限制候选特征会让单棵树的拟合能力略微受限（单树偏差略升），但因为多棵树之间的相关系数 $\rho$ 显著下降，平均后的总体方差降幅更大
            - text: 为了在每次分裂时自动把所有连续数值特征删掉，强制模型只使用二元 0/1 独热编码特征来建树
              why: 随机森林每次随机抽取的候选子集同时包含连续和离散特征，不会只留二元特征
            - text: 为了让第 $b$ 棵树必须等待第 $b-1$ 棵树算完预测残差之后才能开始训练，从而把并行集成改造成串行集成
              why: 串行拟合前序残差的是梯度提升（Boosting），随机森林里的各棵树依然彼此独立、可以并行训练
          explain: |
            各棵树之间的相关系数越高，求平均削减方差的效果越弱；每次分裂随机限制候选特征子集正是打破树间同质化的关键步骤。
      - card:
          title: 梯度提升（Boosting）与 BART 接力思路
          body: |
            与并行独立种树不同，**梯度提升**采用**串行接力**：先训一棵浅层小树给出初步预测，再依次训练下一棵小树去拟合前面模型尚剩下的误差梯度，每步乘以较小的学习率（如 `0.05`）累加修正，主要用来降低模型**偏差**。类似思路的贝叶斯加性回归树（**BART**）则给小树附上正则化概率先验，通过后验随机抽样迭代更新树群。
      - item:
          id: bagging-vs-boosting
          type: choice
          prompt: |
            对比表格数据上的两大主流树集成思路：并行训练多棵深树的随机森林，与串行训练众多浅树的梯度提升（Boosting），下面哪项概括正确？
          options:
            - text: 随机森林靠并行独立深树求平均主要降方差；梯度提升靠串行小步拟合残差主要降偏差，但树过多且学习率过大时可能过拟合
              correct: true
            - text: 随机森林里的每一棵树都必须拿前一棵树的预测残差作为新的训练标签，因此无法在多核处理器上并行训练
              why: 随机森林各棵树基于各自的自助样本独立生长，很容易并行；串行拟合残差的是梯度提升
            - text: 梯度提升因为每一步只拟合残差，所以无论串行叠加多少万棵树、无论数据里有多少离群噪点，验证集误差都只会单调下降
              why: 如果树的数量过多且学习率偏大，梯度提升会开始迎合训练集中的噪声点残差，导致验证误差掉头上升（过拟合）
            - text: 决策树和随机森林在特征空间里切出的是平滑的 45 度斜向线性超平面，在训练数据范围之外也能按斜率做线性外推
              why: 决策树每次切分都垂直于某个坐标轴，叶节点输出局部常数，因此在训练范围之外只能给出最边缘叶子的常数值，不能按斜率线性外推
          explain: |
            并行平均降方差（Bagging/随机森林），串行接力降偏差（Boosting）；分清这一点就能把握两类树集成的调参方向。

  - id: svm-and-margins
    chapter: 回归/分类
    title: 最大间隔、软间隔与支持向量机
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            如果两类二维点云之间隔出了一条清晰的无人空带，能把它们完全分开的直线其实有无数多条——有的紧贴着左边蓝点擦边而过，有的在空带正中央左右留出等宽距离。面对新来的测试样本，选哪条分界线更稳妥？
          options:
            - text: 选处在空带正中间、离两边最近训练点间隔尽可能宽的那一条，对新样本波动的容错空间最大
              correct: true
            - text: 选紧贴着其中一类训练点边缘穿过的那一条直线，因为这样离另一类样本的中心最远，分类把握最大
              why: 紧贴某一类边缘意味着该侧安全余量为 0，新测试样本只要比训练点往外偏一点就会被误判到另一侧
            - text: 只要在当前训练集上的分类错误率都是 0%，任何一条分界直线在未知测试集上的泛化准确率都完全相同
              why: 虽然训练误差同为 0%，但两侧留有宽安全间隔的超平面比紧贴边缘的超平面具有更低的泛化风险
          explain: |
            把分界线放在两群点正中央并让两侧安全带尽可能宽——这就是最大间隔分类器与支持向量机的核心直觉。
      - card:
          title: 最大间隔分类器、软间隔与支持向量
          body: |
            设线性超平面方程为 $\mathbf{w}^\top\mathbf{x} + b = 0$，样本点 $\mathbf{x}_i$ 到平面的几何垂直距离等于 $\frac{|\mathbf{w}^\top\mathbf{x}_i + b|}{\|\mathbf{w}\|_2}$。在两类都能分对（函数间隔 $y_i(\mathbf{w}^\top\mathbf{x}_i+b) \ge 1$，$y_i \in \{-1, +1\}$）时，**最大间隔**分类器把半宽度 $\frac{1}{\|\mathbf{w}\|_2}$ 拉到最大（等价于最小化 $\|\mathbf{w}\|_2^2$）。恰好落在间隔边界线上、共同决定超平面位置的少数关键样本点，就是**支持向量**。
            真实数据常有交错和个别离群点，强求全分对要么无解、要么被单个噪点拉偏。引入松弛变量并配惩罚参数 $C$ 后得到的软间隔分类器，允许少数样本跨进间隔甚至越线，用少许训练误差换取更宽、更稳的整体间隔。
      - item:
          id: svm-support-vector-and-c
          type: choice
          prompt: |
            在软间隔支持向量分类器中，以下哪两件事一旦发生，分别会如何影响分界超平面？
            (A) 删去一个远远落在正确一侧、间隔线之外的普通样本；(B) 把容错惩罚系数 $C$ 调得非常大（严格惩罚越线）。
          options:
            - text: (A) 超平面位置与法向量保持不变；(B) 容忍越线点变少、间隔收窄，更容易受个别边缘噪点影响
              correct: true
            - text: (A) 删掉任何一个训练样本都会使超平面法向量发生旋转；(B) 惩罚系数 $C$ 调得越大，两侧安全间隔带就会变得越宽
              why: 超平面完全由踩在间隔线上或跨入间隔内的支持向量决定，远离边界的样本不参与决定超平面；$C$ 越大越不允许犯错，间隔反而被迫收窄
            - text: (A) 训练集中的每一个样本点都是支持向量；(B) 参数 $C$ 代表要把样本聚成多少个无监督簇
              why: 只有落在间隔边界上或违背间隔约束的少数样本才是支持向量；$C$ 是对间隔松弛违约量的惩罚权重
            - text: (A) 会导致目标函数失去凸性而无法求解；(B) 把 $C$ 调小会让模型退化为只看 1 个最近邻的 KNN 分类器
              why: 删去非支持向量不改变最优解，而调小 $C$ 只会放宽间隔容错度（降低方差、增加偏差），不会变成 KNN
          explain: |
            支持向量机的特点是稀疏性（超平面只由支持向量决定）：$C$ 大则严格少错但间隔窄（低偏差高方差），$C$ 小则容错宽、边界稳（高偏差低方差）。
      - card:
          title: 核技巧非线性 SVM、多分类与逻辑回归关系
          body: |
            面对“圆心包围圆环”等非线性可分结构，**支持向量机（SVM）**借助只需计算内积的**核函数**——如多项式核或**径向基核（RBF kernel）** $K(\mathbf{x},\mathbf{x}') = \exp(-\gamma \|\mathbf{x}-\mathbf{x}'\|_2^2)$——免去显式展开高维特征列的开销，直接在原空间画出弯曲决策边界；多分类任务则常拆为一对一（OvO）或一对多（OvA）。
            若改写成“损失加 $L_2$ 正则化”，线性 SVM 优化的是**合页损失** $\max(0, 1 - y_i f(\mathbf{x}_i))$：它在间隔安全线之外（$y_i f(\mathbf{x}_i) \ge 1$）恒等于 0，而逻辑回归的交叉熵对远处点仍保留指数衰减的非零梯度。
      - card:
          title: 例子：计算二维最大间隔平面的半宽度与点位置
          body: |
            设二维平面上的最大间隔超平面已求得规范形式为 $3x_1 + 4x_2 - 5 = 0$，并且正负类边界平面分别落在 $3x_1 + 4x_2 - 5 = \pm 1$ 上。怎么直接算出它两侧的安全间隔宽度并检验某个点是否落在安全区外？
          reveal:
            - title: 第 1 步：算权重范数与半间隔 M
              body: |
                权重向量 $\mathbf{w} = (3, 4)$，其欧氏长度 $\|\mathbf{w}\|_2 = \sqrt{3^2 + 4^2} = \sqrt{25} = 5$。
                于是正类或负类边界线到中心分界平面的垂直几何距离（半间隔）就是 $M = \frac{1}{\|\mathbf{w}\|_2} = \frac{1}{5} = 0.2$，两侧合计安全走廊总宽度 $2M = 0.4$。
            - title: 第 2 步：检验正样本 (2, 1) 的间隔与合页损失
              body: |
                代入线性打分 $f(2, 1) = 3\times 2 + 4\times 1 - 5 = 5$，乘以 $y=+1$ 后函数间隔 $= 5 \ge 1$，说明该点远远落在间隔外部的安全侧，既不是支持向量，合页损失 $\max(0, 1 - 5) = 0$，删掉它超平面不会移动。
      - item:
          id: svm-margin-width
          type: number
          prompt: |
            某规范化后的线性最大间隔分类超平面满足边界方程 $\mathbf{w}^\top\mathbf{x} + b = \pm 1$，且权重向量为 $\mathbf{w} = (3, -4)$。这个分类器一侧的几何半间隔 $M = \frac{1}{\|\mathbf{w}\|_2}$ 是多少？
          answer: 0.2
          hint: 先算 $\|\mathbf{w}\|_2 = \sqrt{3^2 + (-4)^2}$，再取倒数。
          explain: |
            $\|\mathbf{w}\|_2 = \sqrt{9 + 16} = 5$，因此半间隔 $M = 1 / 5 = 0.2$。
      - item:
          id: svm-hinge-vs-logistic
          type: choice
          prompt: |
            把线性 SVM 优化的合页损失 $\max(0, 1 - y_i f(\mathbf{x}_i))$（$y_i \in \{-1, +1\}$）与逻辑回归优化的交叉熵损失作对比，两者的主要差异在哪里？
          options:
            - text: 对已落在间隔安全线外（$y_i f(\mathbf{x}_i) \ge 1$）的样本，合页损失恒为 0；而交叉熵对所有样本都保留非零值
              correct: true
            - text: 当样本被严重误分到超平面错误一侧（$y_i f(\mathbf{x}_i) < 0$）时，合页损失会自动截断为 0，不再对该误分样本施加任何惩罚
              why: 错分时 $y_i f(\mathbf{x}_i) < 0$，合页损失 $1 - y_i f(\mathbf{x}_i) > 1$ 随误分距离线性增长，持续施加惩罚
            - text: 只要给线性 SVM 换上径向基核（RBF 核），合页损失就会自动变成不需要类别标签 $y_i$ 的无监督聚类目标函数
              why: 核函数改变的是特征空间的内积度量，SVM 依然需要使用标签 $y_i \in \{-1, +1\}$ 计算合页损失做监督分类
            - text: 标准 SVM 的线性打分 $f(\mathbf{x}) = \mathbf{w}^\top\mathbf{x} + b$ 本身就是严格落在 $(0, 1)$ 内的校准概率，而逻辑回归不能输出概率
              why: 逻辑回归通过 Sigmoid 直接输出 $(0, 1)$ 内的类别概率，而 SVM 打分是无界实数，需要额外做 Platt 缩放等校准才能转成概率
          explain: |
            由于合页损失在 $y_i f(\mathbf{x}_i) \ge 1$ 时精确为 0，SVM 对远离边界的样本不敏感，边界只由支持向量决定；逻辑回归则能直接提供校准良好的类别概率估计。

  # =====================================================================
  # 第 2 章：聚类
  # =====================================================================
  - id: kmeans-clustering
    chapter: 聚类
    title: 无监督学习挑战与 k-means 聚类
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            拿到一份既没有消费等级、也没有行业标签的用户调查表，只知道每人“月消费额”和“线上活跃天数”。没有标准答案可做监督对照，凭直觉想把相似的用户自动分成 3 类并找到每类的代表画像。如果刚猜出 3 个临时中心点，下一步该怎么互相配合才能自动让中心落到团块正中间？
          options:
            - text: 交替执行两步：先把每个样本分给最近的中心，再把每簇的平均坐标更新为新中心，直到不再变化
              correct: true
            - text: 把随机挑出的 3 个初始样本点永久固定为最终簇中心，只做一次最近邻分配后就停止计算
              why: 随机挑的起始点通常偏离团块重心，如果不按簇内均值重新移动中心，划分结果会停留在随机初值附近
            - text: 因为数据表没有类别标签 $y$，可以直接把每条记录在表格里的行号当成连续目标值做普通最小二乘回归
              why: 表格行号只是记录存放顺序，不代表用户的业务分组，无监督聚类应当基于特征之间的距离或相似度
          explain: |
            无监督学习没有现成标签用来核对答案，但通过“按最近中心归队—按簇内均值更新中心”的交替优化，簇结构会逐步稳定下来。
      - card:
          title: 无监督挑战与 k-means 算法步骤
          body: |
            无监督**聚类**没有标签可对答案，往往由需求决定分几簇。原型方法 **k-means** 试图最小化所有簇内的平方距离和 $\sum_{j=1}^k \sum_{\mathbf{x}_i \in C_j} \|\mathbf{x}_i - \boldsymbol{\mu}_j\|_2^2$：先初始化 $k$ 个中心，再反复交替执行两步——把每个样本划归欧氏距离最近的中心、按各簇内均值重算质心——直到分配不再变。它对初值敏感且只保局部最优，常配合多次随机重启。
      - card:
          title: 例子：一维 6 点数据上的 k-means 手工迭代追踪
          body: |
            一维数轴上有 6 个点 `1, 2, 3, 10, 11, 12`，设簇数 $k = 2$，故意取很靠左的初始中心 $c_1^{(0)} = 1$、$c_2^{(0)} = 2$。跟踪每一轮的分配与中心变化（距离相等时默认归左侧簇）。
          reveal:
            - title: 第 1 轮：就近分配并更新中心
              body: |
                点 `1` 到中心 `1` 距离为 0、到中心 `2` 距离为 1，归第 1 簇；点 `2, 3, 10, 11, 12` 都离中心 `2` 更近，全归第 2 簇 `{2, 3, 10, 11, 12}`。
                更新质心：$c_1^{(1)} = 1$，$c_2^{(1)} = (2+3+10+11+12)/5 = 7.6$。
            - title: 第 2 轮与收敛检查
              body: |
                用新中心 `1` 和 `7.6`（中点边界 $4.3$）重新分配：`1, 2, 3` 全部 $\le 4.3$ 归第 1 簇；`10, 11, 12` 全归第 2 簇。
                再次更新质心：$c_1^{(2)} = (1+2+3)/3 = 2$，$c_2^{(2)} = (10+11+12)/3 = 11$。
                第 3 轮按中心 `2` 和 `11`（边界 $6.5$）分配结果依然是 `{1, 2, 3}` 与 `{10, 11, 12}`，划分不再改变，算法收敛。
      - item:
          id: kmeans-1d-step1
          type: number
          prompt: |
            沿用经典一维示例：数据点 `1, 2, 3, 10, 11, 12`，设 $k = 2$ 且初始中心分别为 $1$ 和 $2$。完成第 1 轮“把每个点分给最近中心并重算簇均值”后，原本位于 $2$ 的第二个中心会移动到哪个数值？
          answer: 7.6
          hint: 点 `1` 离 `1` 近，其余五个点 `2, 3, 10, 11, 12` 全都离 `2` 更近，求这五个点的平均数。
          explain: |
            第 1 轮第二个簇囊括了 `{2, 3, 10, 11, 12}` 五个点，均值为 $(2+3+10+11+12)/5 = 38/5 = 7.6$。
      - card:
          title: 动手试试：观察三团点上的 k-means 迭代过程
          body: |
            先在下方的三团二维点云里点几步“下一步”或“重来”，注意看每步里颜色区边界怎样随着星形质心的平移而自动更新。看清每一轮质心移动停下即达收敛后，到下一题正式运行到收敛。
          sim:
            name: kmeans
            params: { dataset: blobs3, k: 3 }
      - item:
          id: kmeans-blobs-run
          type: sim
          sim: kmeans
          prompt: 在下方 `blobs3` 数据集（$k=3$）的 k-means 实验里反复点击“下一步”，一直迭代到界面提示中心不再移动（收敛）为止，体验完整簇划分收敛过程。
          params:
            dataset: blobs3
            k: 3
          goal: {}
          solution:
            iterations: 4
          explain: |
            对这组三团点与初始中心，一共只需 4 轮“按最近划分—重算均值”交替迭代即可达到中心不再移动的稳定解。
      - item:
          id: kmeans-convergence-property
          type: choice
          prompt: |
            关于 k-means 聚类的收敛性与局部最优特征，下面哪一项陈述正确？
          options:
            - text: 每轮更新都不会增大簇内总平方误差，算法必在有限步内停止；但只保证局部最优，需用多组随机初值取最优解
              correct: true
            - text: 因为簇内平方距离和是关于所有簇划分的严格凸函数，所以无论初始中心选在哪里，k-means 都在一轮内收敛到同一个全局最优解
              why: 簇归属是离散组合变量，目标函数存在许多局部极小点，不同初始中心可能收敛到不同的划分，因此实践中常设 `n_init=10` 多次重启
            - text: k-means 在更新第一轮簇中心之前，必须先读取测试集的真实类别标签并通过交叉验证算出每个样本的先验概率
              why: k-means 是无监督聚类算法，全程不使用任何类别标签 $y$
            - text: 当两个真实簇呈套在一起的“同心圆环”形状时，基于欧氏距离的 k-means 依然能把内圈和外圈完整分开
              why: k-means 按到质心的欧氏距离划分，决策边界是平直的 Voronoi 多边形，无法直接切开同心圆环或弯曲月牙形非凸簇
          explain: |
            记住 k-means 的三条性质：每步单调降低簇内平方和、有限步收敛到局部最优、偏好球状凸簇且对初值敏感。

  - id: hierarchical-and-practical
    chapter: 聚类
    title: 层次聚类与树状图
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            分析一份基因或客户数据集时，研究团队还拿不准到底该分 2 类、4 类还是 6 类，想先画出一张像家族谱系一样的完整树结构图，之后再视需要从任意高度水平切开分成几大枝。哪个无监督方法能一次满足这个需求？
          options:
            - text: 自底向上的凝聚式层次聚类，它把各层合并过程记录在一棵树状图里，按不同高度横切即可得到不同簇数
              correct: true
            - text: 必须在运行前先指定单一固定簇数 $k$ 的标准 k-means 聚类算法，因为跑一次 $k=2$ 的 k-means 就能同时输出 $k=4$ 和 $k=6$ 的全部嵌套谱系
              why: 换一个 $k$ 就得重跑一遍 k-means，而且 $k=3$ 的簇未必是由 $k=4$ 中的某两个簇直接合并而成的
            - text: 只查找测试点周围 1 个最近训练样本标签的有监督 K 近邻（KNN）分类器
              why: KNN 是利用已知类别标签预测新样本的监督学习方法，不会构建无监督层次合并树状图
          explain: |
            层次聚类不需要事先锁定单一的 $k$ 值，树状图横切越低分得越细、横切越高合得越粗。
      - card:
          title: 凝聚式层次聚类、四种连接与树状图
          body: |
            自底向上凝聚的**层次聚类**一开始让每个点各自成簇，每轮把距离最近的一对簇合并成大簇并记录合并高度成**树状图**。定义两簇间距离常见四种连接准则：
            - **完全连接（Complete）**：取两簇最远点对距离（偏好紧凑均匀圆簇）；
            - **平均连接（Average）**：取所有点对距离均值；
            - **单连接（Single）**：取最近点对距离（易把零散过渡点粘成长链）；
            - **重心连接（Centroid）**：算均值点间距（偶发反转交叉）。
      - card:
          title: 例子：读树状图与衡量不同连接准则的差异
          body: |
            假设一维上有 4 个点 $A=0, B=1, C=4, D=6$（点对距矩阵中 $d(A,B)=1$、$d(B,C)=3$、$d(C,D)=2$）。用不同连接准则是按什么顺序一步步合并的？
          reveal:
            - title: 第 1 步与第 2 步的合并顺序（先合并谁）
              body: |
                起步所有点各自成簇。最近点对是 $(A, B)$（距离为 $1$），先合并 $\{A, B\}$；此时 $\{A,B\}$ 到 $C$ 最近距离是 $3$，而单点之间最近的是 $(C, D)$（距离为 $2$），所以第二步必合并 $\{C, D\}$。
            - title: 对比不同连接在合并两大簇时的高度
              body: |
                最后只剩两大簇 $\{A, B\} = \{0, 1\}$ 与 $\{C, D\} = \{4, 6\}$：
                - 单连接找最近两边界点 $1$ 与 $4$，合并高度 $= 3$；
                - 完全连接找最远两端 $0$ 与 $6$，合并高度 $= 6$；
                - 平均连接取全部 4 对距离 $(4, 6, 3, 5)$ 的均值 $= 4.5$。
                如果在树状图高度 $2.5$ 处水平切一刀，就会精确得到 $\{A, B\}$ 和 $\{C, D\}$ 两簇。
      - item:
          id: linkage-distance-calc
          type: number
          prompt: |
            现有两个样本簇 $G_1 = \{0, 2\}$ 和 $G_2 = \{5, 9\}$（一维坐标轴上各自包含 2 个点）。如果采用**完全连接（Complete linkage）**衡量这两个簇之间的距离，算出的簇间距离是多少？
          answer: 9
          hint: 完全连接看的是两簇之间所有配对点距离里的最大值 $\max_{x \in G_1, y \in G_2} |x - y|$。
          explain: |
            配对距离分别为 $|0-5|=5, |0-9|=9, |2-5|=3, |2-9|=7$，其中最大距离是 $9$。相比之下，单连接看最小距离 $3$，平均连接看 $(5+9+3+7)/4 = 6$。
      - card:
          title: 聚类实践的四条工程细节与陷阱
          body: |
            业务数据上做聚类有四点需要检查：
            1. **先标准化**：把量纲相差较大的列缩放到标准差 1，避免大数值列主导距离；
            2. **选恰当度量**：关心变化趋势或相对比例而非数值大小时，可改用相关系数距离或余弦距离；
            3. **看稳定与孤立点**：用肘部拐点选 $K$、排查拉偏质心的离群单点；
            4. **重抽样校验**：纯随机噪声也能被算法强行切出簇，需留出子样本验证簇结构能否稳定复现。
      - item:
          id: single-linkage-chaining
          type: choice
          prompt: |
            在凝聚式层次聚类中，如果数据团块之间夹杂着一连串稀疏散落的中间过渡点，哪种连接准则最容易发生“链式效应”（把分属两团的点群通过中间几个桥接点过早连成一条长链）？
          options:
            - text: 单连接（Single linkage），只要两簇边缘有一对点靠得较近，就会把整两个簇合并在一起
              correct: true
            - text: 完全连接（Complete linkage），因为它只看两簇中最远点对的距离，最容易把相距很远的点拉成一条细长链条
              why: 完全连接要求两簇里最远的一对点也足够近才肯合并，偏好紧凑的球状簇，反而能抑制链式效应
            - text: 平均连接（Average linkage），因为对所有点对距离求算术平均会自动忽略簇内所有大于 1 的距离
              why: 平均连接综合了所有配对点的距离，折中了单连接与完全连接的极端行为，不易被单个桥接点拉成长链
            - text: 带 $L_2$ 正则化惩罚项的岭回归，因为惩罚系数 $\lambda$ 会把所有层次聚类的树枝压缩到同一高度
              why: 岭回归是有监督线性回归方法，不是无监督层次聚类的连接准则
          explain: |
            当你想分离细长弯曲流形（如双月形）时单连接有用，但在含桥接噪点的表格数据上，完全连接或平均连接更能得到紧凑均衡的簇。
      - item:
          id: clustering-scaling-issue
          type: choice
          prompt: |
            某客户数据有两个特征：年消费额（单位元，范围 5000–200000）与年退货次数（0–10 次）。如果忘记标准化就直接用欧氏距离跑 k-means 或层次聚类，会发生什么？
          options:
            - text: 年消费额因数值跨度大几万倍而主导欧氏距离，退货次数的差异几乎不起作用
              correct: true
            - text: 年退货次数（0–10 次）因为数值范围更小，在计算欧氏平方距离时会被自动赋予一万倍的补偿权重
              why: 欧氏平方距离 $\Delta x_1^2 + \Delta x_2^2$ 直接按原始数值平方相加，数值跨度大的特征会占据主导地位
            - text: 欧氏距离在无监督聚类中具有尺度不变性，把年消费额从“元”改成“万元”不会改变任何样本的簇分配结果
              why: 欧氏距离受各坐标轴缩放比例影响很大，改变单个特征的单位会改变样本间的远近排序和聚类结果
            - text: 未标准化的数据矩阵会导致 k-means 算法在第一轮求簇内算术均值时出现除以零的运行错误
              why: 量纲不同不会造成除以零报错，隐患在于算法会安静地跑出几乎只按单一特征划分的偏颇簇
          explain: |
            除各特征本来就同属一种量纲且希望保留原始方差权重的情况外，聚类前通常应先把各特征标准化到相同的尺度。
      - item:
          id: dendrogram-cut-height-num
          type: number
          prompt: |
            有一棵含 4 个点 `{A, B, C, D}` 的层次聚类树状图：A 与 B 先在高度 `1.0` 合并成 `{A, B}`，接着 C 与 D 在高度 `2.0` 合并成 `{C, D}`，最后这两大枝直到高度 `4.5` 才并成一个总根。如果在高度 `2.5` 处水平横切整棵树，一共会得到几个簇？
          answer: 2
          hint: 高度 `2.5` 位于两次合并 `1.0, 2.0` 之上、最后总合 `4.5` 之下，数一数横截线穿过了几条垂直树枝。
          explain: |
            水平截线高于 `1.0` 与 `2.0`（所以 A 与 B 已合、C 与 D 已合），又低于最终合并线 `4.5`，水平线恰好横截到 2 根垂直枝条，分别对应 `{A, B}` 和 `{C, D}` 两簇。

  # =====================================================================
  # 第 3 章：降维
  # =====================================================================
  - id: pca-and-variance
    chapter: 降维
    title: 主成分分析与解释方差比例
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            把一团倾斜分布在二维平面上的扁平椭圆点云投影到一条一维直线上来减少维度。如果要让信息损失尽可能少，应该挑哪个方向的直线做正交投影？
          options:
            - text: 沿着点云伸展最长的那条主轴方向投影，使投影后的点在直线上散得最开
              correct: true
            - text: 沿着点云最扁的短轴方向投影，把所有样本点都集中压缩到一个很窄的数值区间里
              why: 沿短轴投影会抹掉点云在长轴方向上的主要差异，重构原始二维坐标时的平方误差反而最大
            - text: 无论点云倾斜成什么角度，都只保留原始坐标系中均值较大的那根坐标轴、直接删掉另一根坐标轴
              why: 原始坐标轴未必对齐点云倾斜伸展的主方向，直接删去一列会丢失两列协同变化的斜向信息
          explain: |
            投影后散得越开（投影方差越大），保留的样本差异信息就越多；由勾股定理，这也等价于让各点到投影直线的垂直重构误差平方和最小。
      - card:
          title: 主成分分析（PCA）的双重等价视角
          body: |
            利用特征分解，**主成分分析（PCA）**把去中心化后的特征做正交降维：
            1. **方差最大化视角**：第一主成分载荷向量 $\mathbf{v}_1$（$\|\mathbf{v}_1\|_2 = 1$）让投影得分方差最大，正好等于样本协方差矩阵 $\mathbf{S} = \frac{1}{n-1}\mathbf{X}^\top\mathbf{X}$ 最大特征值 $\lambda_1$ 对应的单位特征向量；后续成分依次在正交补空间找最大方差方向。
            2. **最小重构误差视角**：前 $M$ 个主成分张成的子空间也是使全体点垂直重构平方误差最小的逼近平面。
      - card:
          title: 解释方差比例（PVE）与 PCA 实践细节
          body: |
            第 $m$ 个主成分解释的方差占全部方差总和的百分比称为**解释方差比例（PVE）**：
            $$\mathrm{PVE}_m = \frac{\lambda_m}{\sum_{j=1}^p \lambda_j}$$
            实际常在碎石图折平的“肘部”截断取前 $M$ 维。注意三件事：第一，特征量纲不同时 PCA 前应**先做标准化**，免得大单位列主导主成分；第二，载荷方向允许**整体取反号**（$\mathbf{v}_1$ 与 $-\mathbf{v}_1$ 指向同一条直线）；第三，PCA 只看输入 $X$、不看目标 $Y$。
      - item:
          id: pca-properties-choice
          type: choice
          prompt: |
            如果在求主成分之前忘记把特征单位统一成标准差 1（例如一列用“毫米”、另一列用“米”），直接对原始协方差矩阵跑 PCA，通常会出现什么偏差？
          options:
            - text: 数值方差被放大百万倍的“毫米”列几乎独占第一主成分，掩盖了其他特征的真实协同结构
              correct: true
            - text: PCA 对任意单列线性缩放具有不变性，把某一列乘以 1000 后求出的第一主成分载荷向量与原来完全一致
              why: PCA 直接最大化样本方差；把某一坐标轴拉长 1000 倍会让该方向方差放大一百万倍，使第一主成分倒向该轴
            - text: 只有当原始特征之间彼此正交、相关系数全为 0 时，协方差矩阵才能做特征分解求出主成分
              why: 任何对称半正定的样本协方差矩阵都能做正交特征分解；恰恰在原始特征强相关时 PCA 降维效果最显著
            - text: 保留前 $M$ 个（$M < p$）主成分时，它们累积解释的方差比例之和通常会超过 100%
              why: 各正交主成分方差 $\lambda_m \ge 0$，前 $M$ 个之和除以全部 $p$ 个之和一定落在 $[0, 1]$ 之间
          explain: |
            除所有列本来就属于同一量纲（如同一张图片的像素灰度）外，跑 PCA 前先对各列做标准化是基本规范。
      - card:
          title: 例子：由 2×2 协方差矩阵手算第一主成分与 PVE
          body: |
            已知已去中心化二维特征的协方差矩阵为 $\mathbf{S} = \begin{pmatrix} 2 & 1 \\ 1 & 2 \end{pmatrix}$。怎样求出第一主成分方向，以及它解释了多少比例的原始方差？
          reveal:
            - title: 第 1 步：求协方差矩阵的特征值
              body: |
                解特征方程 $\det(\mathbf{S} - \lambda\mathbf{I}) = (2 - \lambda)^2 - 1 = 0$，展开 $\lambda^2 - 4\lambda + 3 = (\lambda - 3)(\lambda - 1) = 0$。
                于是两个特征值分别为 $\lambda_1 = 3$、$\lambda_2 = 1$（验证特征值之和 $3 + 1 = 4$ 恰好等于矩阵对角线迹 $2 + 2 = 4$）。
            - title: 第 2 步：算单位特征向量与解释方差比例
              body: |
                代入最大特征值 $\lambda_1 = 3$，方程 $(\mathbf{S} - 3\mathbf{I})\mathbf{v} = \begin{pmatrix} -1 & 1 \\ 1 & -1 \end{pmatrix}\mathbf{v} = \mathbf{0}$ 给出 $v_1 = v_2$。归一化为单位长度得第一主成分载荷方向 $\mathbf{v}_1 = \frac{1}{\sqrt{2}}(1, 1)^\top$（取反 $-\frac{1}{\sqrt{2}}(1,1)^\top$ 等价）。
                第一主成分解释的方差比例 $\mathrm{PVE}_1 = \frac{3}{3 + 1} = 0.75 = 75\%$，仅保留这 1 个主方向就抓住了全部变异的四分之三。
      - item:
          id: pca-pve-calc
          type: number
          prompt: |
            若协方差矩阵为 $\mathbf{S} = \begin{pmatrix} 2 & 1 \\ 1 & 2 \end{pmatrix}$，它算得的两个特征值为 $\lambda_1 = 3$ 与 $\lambda_2 = 1$。第一主成分所解释的方差占总方差的比例（填百分比前面的数值，如 `0.75` 表示 75%）是多少？
          answer: 0.75
          hint: 计算最大特征值占所有特征值总和的比重 $\lambda_1 / (\lambda_1 + \lambda_2)$。
          explain: |
            总方差为矩阵迹 $2 + 2 = 3 + 1 = 4$，第一主成分贡献方差 $3$，所以解释比例 $\mathrm{PVE}_1 = 3/4 = 0.75$（即 75%）。
      - item:
          id: pca-first-direction-choice
          type: choice
          prompt: |
            对于协方差矩阵 $\mathbf{S} = \begin{pmatrix} 2 & 1 \\ 1 & 2 \end{pmatrix}$，哪一对方向向量是正确的归一化第一主成分载荷向量？
          options:
            - text: $\pm\frac{1}{\sqrt{2}}(1, 1)^\top$（对应最大特征值 $\lambda_1 = 3$）
              correct: true
            - text: $\pm\frac{1}{\sqrt{2}}(1, -1)^\top$（对应特征值 $\lambda_2 = 1$，沿第二、四象限反相关对角线伸展）
              why: $(1, -1)^\top/\sqrt{2}$ 对应较小的特征值 $\lambda_2 = 1$，它是与第一主成分正交的第二主成分方向
            - text: $(1, 0)^\top$ 或 $(0, 1)^\top$（主成分载荷方向必须与原始坐标轴之一重合）
              why: 两个变量协方差为 $+1$（正相关），点云沿 45 度对角线方向拉长，最大方差方向不在原始坐标轴上
            - text: $(2, 1)^\top$（直接取协方差矩阵的第一行作为载荷向量，不需要求解特征方程也不做单位化）
              why: 主成分载荷向量必须是协方差矩阵对应最大特征值的单位长度特征向量
          explain: |
            因为两特征正相关，样本分布呈右上—左下方向拉长的椭圆，最大方差自然落在 45 度角方向 $(1, 1)/\sqrt{2}$。
      - item:
          id: pca-cumulative-pve
          type: number
          prompt: |
            对一份 4 维已标准化数据集做 PCA，算出 4 个特征值依次是 `6, 2, 1, 1`（各特征值之和为 10）。如果只保留前 2 个主成分降维到二维平面，它们累积解释的方差比例（小数表示，如 `0.75`）是多少？
          answer: 0.8
          hint: 前 2 个主成分解释的总方差之和除以全部 4 个特征值总和。
          explain: |
            前两个主成分贡献方差 $6 + 2 = 8$，占总方差 $6 + 2 + 1 + 1 = 10$ 的 $8/10 = 0.8$（即 $80\%$）。

  - id: pcr-pls-highdim
    chapter: 降维
    title: 降维回归（PCR/PLS）与高维问题
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            前面用 PCA 提取出了几个互不相关的主成分来代替几十个共线特征做线性回归。可是如果真正影响结果 $Y$ 的信号，恰好在自变量里的方差幅度较小（落在第 8 主成分而不是第 1 主成分上），只按方差大小选前 2 个 PCA 方向去做回归，会遇到什么问题？
          options:
            - text: PCA 全程不看目标 $Y$，可能保留了方差大却与 $Y$ 无关的方向，反而丢掉了真正能预测 $Y$ 的小方差信号
              correct: true
            - text: 不会有问题，因为自变量矩阵中方差最大的主成分在数学上必定是与响应变量 $Y$ 相关系数最高的方向
              why: 输入特征方差大只代表它自身波动大，不代表它与目标变量有关（例如背景亮度变化大却与识别数字无关）
            - text: PCA 提取出的主成分得分都只能取 0 或 1 两个离散值，无法代入最小二乘线性回归计算斜率
              why: 主成分得分是原始特征的连续线性组合，可以直接作为普通最小二乘回归的输入特征
          explain: |
            这正是“先无监督降维再回归（PCR）”与“结合响应变量有监督找方向（PLS）”之间的核心区别。
      - card:
          title: 主成分回归（PCR）与偏最小二乘（PLS）
          body: |
            - **主成分回归（PCR）**：两步走——先对输入特征矩阵 $\mathbf{X}$ 做无监督 PCA 取前 $M$ 个主成分得分，再用普通最小二乘去拟合 $Y$。虽然缓解了共线并减少待估参数，但它不看响应 $Y$：不保证高方差方向真与 $Y$ 有关，也**不做原始特征归零筛选**（每个主成分仍包含所有原始列）。
            - **偏最小二乘（PLS）**：构造线性组合时把监督响应 $Y$ 也纳入计算，优先挑选**既代表原特征较大变化、又与 $Y$ 强相关**的方向，依次正交提取下个方向继续拟合残差。两种方法的成分数 $M$ 都用交叉验证选出。
      - item:
          id: pcr-vs-pls-choice
          type: choice
          prompt: |
            相比先无监督抽取主成分再回归的 PCR，偏最小二乘（PLS）构建投影方向时最大的差别是什么？
          options:
            - text: PLS 同时利用 $\mathbf{X}$ 的方差与响应 $Y$ 的相关性确定投影方向，属于有监督降维
              correct: true
            - text: PLS 在求第一个投影方向之前，必须先把原始特征矩阵里方差较小的 90% 特征列直接删掉
              why: PLS 通过各特征与响应 $Y$ 的内积权重对全部特征做线性组合，不是预先按方差删列
            - text: PCR 与 PLS 都能自动把绝大多数无关原始特征的回归系数精确压成 0，实现稀疏特征筛选
              why: 只要主成分载荷不为 0，PCR 和 PLS 的每个综合成分都包含全部原始特征，不会像 Lasso 那样把原始特征系数清零
            - text: PCR 和 PLS 的正交投影变换只适用于二元 0/1 分类问题，不能用于预测连续数值响应
              why: 两者最初都是为高维共线连续响应回归设计的降维回归方法
          explain: |
            PCR 只关心输入 $\mathbf{X}$ 内部哪个方向方差大，PLS 则寻找“既在 $\mathbf{X}$ 里变化明显、又能解释 $Y$”的方向。
      - card:
          title: 高维困境（p 远大于 n）与解释警告
          body: |
            当特征数 $p$ 等于甚至大于样本数 $n$（如 60 位病人测 2000 个基因）时，只要 $p \ge n$ 且样本行线性无关，哪怕全是纯随机噪声特征，普通最小二乘也能精确穿过全部训练点使训练 $R^2 = 1$（过拟合），高维空间中样本点间距离也趋于相近而让近邻法失效。
            此时需要用正则化（岭回归/Lasso）或降维（PCR/PLS）限制有效自由度并在独立验证集上评估；同时也不能把某个被选中的高维特征直接当成唯一的因果变量，因为许多共线特征组合都能给出相近的预测。
      - card:
          title: 例子：对照 p > n 时训练 R² 的虚高现象
          body: |
            试想只取了 $n = 50$ 个样本，但构造了 $p = 60$ 个由随机数生成器独立产生的无关“噪声特征”，直接做普通最小二乘多元回归。
          reveal:
            - title: 为什么训练集上误差为 0，而在新样本上预测失灵？
              body: |
                样本只有 $n = 50$ 个方程，未知参数（截距+斜率）却有 $60 + 1 = 61$ 个。线性方程组有无穷多组解能精确穿过全部 50 个训练样本，使训练集 MSE 等于 $0$、训练 $R^2$ 等于 $1.00$。但换一组 50 个未参与训练的新样本测试时，那些为了凑齐训练噪声而学出的大权重会产生很大波动，测试 MSE 反而远高于只猜样本均值。
      - item:
          id: highdim-p-gt-n-trap
          type: choice
          prompt: |
            一份健康研究采集了 $n = 80$ 名受试者、每名检测了 $p = 500$ 个基因特征。研究员把 500 个基因全放进普通最小二乘线性回归，报告：“训练集 $R^2 = 1.000$，模型完美解释了健康指标。”对于这份报告，应当指出哪一点问题？
          options:
            - text: 当 $p \ge n$ 时任意无关噪声特征都能凑出训练 $R^2 = 1$（插值过拟合），未报告交叉验证或独立测试集误差则没有说服力
              correct: true
            - text: 训练集 $R^2 = 1.000$ 证明这 500 个基因全部都是该健康指标的独立因果决定因素，一个都不能删减
              why: 当特征数 $p$ 超过样本数 $n$ 时，代数上总能用线性组合精确插值所有训练点，不能由此推断特征具有真实预测力或因果性
            - text: 说明样本量 $n = 80$ 还是太多了，应当删掉一半受试者降到 $n = 40$ 以提高参数估计的稳定性
              why: 减小样本量只会让 $p/n$ 更加悬殊、加剧过拟合；高维问题需要更多样本、正则化约束和样本外验证
            - text: 在 $p = 500, n = 80$ 时，特征矩阵乘积 $\mathbf{X}^\top\mathbf{X}$ 必定是严格正定满秩矩阵，具有唯一最小二乘解
              why: $500 \times 500$ 矩阵 $\mathbf{X}^\top\mathbf{X}$ 的秩最多为 $n = 80$，存在至少 420 个零特征值，不可逆且解不唯一
          explain: |
            在高维情形（$p \ge n$）下，训练集上的普通 MSE 和普通 $R^2$ 不再能反映泛化好坏，必须依靠正则化约束与独立验证集评估。
      - item:
          id: highdim-causal-warning
          type: choice
          prompt: |
            在 $n = 100$、$p = 3000$ 的共线高维基因回归里，一个 Lasso 模型只挑出了第 17 号和第 82 号基因。关于如何向医学同事汇报这两个非零系数，下面哪句措辞最严谨？
          options:
            - text: 这两个基因是当前小样本下一组有效的预测代表，但因高维共线基因间可互相替代，不能仅凭此断定它们是唯一致病基因
              correct: true
            - text: 其余 2998 个系数被 Lasso 压成 0 的基因，已经在数学上被证明与该疾病没有任何生物学关联
              why: 当同一生物通路上的多个基因高度共线时，Lasso 往往只从中挑出一个代表并把其余相关基因系数压成 0，被归零不代表无关
            - text: 既然模型已经精简到只剩 2 个特征，就可以直接拿这 100 个样本上的重拟合训练 $R^2$ 当作无偏的临床泛化准确率
              why: 从 3000 个候选中挑出最贴合当前 100 个样本的 2 个特征本身已经消耗了大量选择自由度，仍需独立测试集或外层交叉验证评估
            - text: 如果把这两个基因删掉，再用无惩罚普通最小二乘（OLS）同时拟合其余 2998 个基因，就能得到唯一且无偏的系数估计
              why: 在 $p = 2998 \gg n = 100$ 上做无惩罚 OLS 依然奇异不可逆，不存在唯一系数解
          explain: |
            高维特征选择给出的是“可用于预测的代表变量组合”，汇报时应区分预测相关性与唯一因果性，并坚持样本外验证。

  # =====================================================================
  # 第 4 章：表示
  # =====================================================================
  - id: representation-and-autoencoders
    chapter: 表示
    title: 表示学习与分布式表示
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            想让模型识别一张手写数字图片里写的是几，如果直接把左上角第 1 排第 5 个像素的灰度当作独立判断规则，结果图片稍微往右平移 2 个像素，那个位置的像素灰度就全变了。什么样的内部特征表示才更有利于后续分类？
          options:
            - text: 从原始像素中提炼出刻画语义结构的紧凑属性（如笔画朝向、是否闭合），并对轻微平移等无关干扰保持稳定
              correct: true
            - text: 给训练集里的每一张图片分配一个互不相同的随机编号（如 1 到 50000），直接拿这个编号作为唯一的输入特征
              why: 孤立编号抹掉了图片之间的视觉相似性，遇到第 50001 张新图片时无法泛化
            - text: 把一张图片的原始像素向量原封不动地重复拼接 100 遍，靠增加输入向量的长度来提升线性分类器的表达能力
              why: 重复拷贝完全相同的像素列不会增加新信息，也不会解耦底层语义因素，反而加重共线性
          explain: |
            好的“表示”能把纠缠在原始像素或观测点背后的关键因素分离出来，让后续的简单分类器也能画出清晰的分界线。
      - card:
          title: 从手工特征到表示学习
          body: |
            在传统流程里，模型好坏很大程度上取决于人工设计的特征；而**表示学习（representation learning）**的目标是让算法直接从原始观测（如像素、音频波形、词语共现）中自动提取出低维、紧凑且把不同变化因素解耦出来的特征向量。
            对比两种刻画对象的方式：第一种是“局部互斥表示”（如 k-means 把每个样本只归入 $k$ 个互斥簇之一，或独热向量只在 1 个位置填 1），不同簇之间不共享参数；第二种则是用多个属性维度共同描述一个样本的分布式方式。
      - card:
          title: 分布式表示与指数级组合能力
          body: |
            **分布式表示（distributed representation）**不再给每个类别单独设一个互斥槽位，而是用 $d$ 个可同时激活的共享语义属性（如“颜色”“形状”“材质”“朝向”）共同编码每个样本。
            哪怕每个属性只取 $0$ 或 $1$ 两种状态，$d$ 个独立属性也能组合出 $2^d$ 种不同的概念配置。更重要的是，因为各属性维度在所有样本间共享训练信号，模型即使只见过“红色圆形”和“蓝色方形”，分别学懂“颜色”和“形状”两个维度后，遇到未曾见过的“红色方形”也能直接组合出合理表示。
      - item:
          id: distributed-rep-capacity
          type: number
          prompt: |
            对比两种数据表示方式：局部互斥聚类只能用 $k$ 个互斥槽位区分 $k$ 种模式；而分布式二元属性表示用 $d = 8$ 个彼此独立的 0/1 属性维共同编码物品，理论上最多能组合成多少种不同的离散模式？
          answer: 256
          hint: 8 个属性每位有 2 种取值（0 或 1），共有 $2^8$ 种组合。
          explain: |
            分布式表示利用多维度协同表达带来了 $2^8 = 256$ 种组合容量，且不同类别之间可共享各维度权重以相互泛化。
      - card:
          title: 例子：10 个分布式属性与 1000 个互斥簇的对比
          body: |
            假设我们要在系统里区分 1000 种不同款式的商品类别，对比“局部互斥簇表示”和“分布式二元属性表示”在参数效率与零样本泛化上的差异。
          reveal:
            - title: 第 1 步：比较所需维度数量
              body: |
                局部互斥表示中，一个维度只能代表一个孤立簇，要区分 1000 种商品类别就必须设立 1000 个互斥维度（每个簇能分到的训练样本也随之被摊薄为千分之一）。
                而采用分布式二元属性时，只需 $d = 10$ 个共享属性维度，就能组合出 $2^{10} = 1024 > 1000$ 种不同的特征配置。
            - title: 第 2 步：比较对新组合的泛化能力
              body: |
                互斥簇之间的边界彼此独立，学好第 1 簇对识别第 2 簇没有帮助；而分布式表示把 1000 种商品拆解到 10 个公共属性轴上，所有商品共同训练这 10 个属性判别器，遇到新的属性组合时无需从零收集样本就能识别。
      - item:
          id: distributed-vs-local-choice
          type: choice
          prompt: |
            关于“分布式表示”与“局部互斥表示（如独热编码或硬聚类）”的本质区别，下面哪一项描述准确？
          options:
            - text: 分布式表示用 $d$ 个共享属性维度的协同激活刻画样本，可表达指数级（如 $2^d$）概念组合并支持跨属性组合泛化
              correct: true
            - text: 局部互斥表示用 $d$ 个二元维度最多也能表达 $2^d$ 种互斥类别，因为每个样本允许同时在任意多个维度上取值为 1
              why: 局部互斥表示规定每个样本只能在唯一一个槽位上取 1（其余全为 0），因此 $d$ 个槽位只能区分 $d$ 种互斥状态
            - text: 分布式表示要求把数据表必须切分存放在多台不同物理服务器上，单台计算机内存无法计算分布式表示向量
              why: 表示学习里的“分布式”指概念信息分散在同一个特征向量的多个语义分量上，而非分布式计算的并行服务器集群
            - text: 只有在已知全部样本的真实监督标签时才能学习分布式表示，无监督学习算法只能产生局部互斥的聚类簇编号
              why: 主成分分析、自编码器和矩阵分解等无监督方法学出的连续潜向量同样属于典型的分布式表示
          explain: |
            把概念拆解为多个可共享、可组合的潜在属性维度，是分布式表示以少量维度刻画复杂世界的关键。

  - id: autoencoders-and-manifolds
    chapter: 表示
    title: 流形假设与自编码器
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一张 $100 \times 100$ 的灰度人脸照片有 10000 个像素。如果你让电脑随机生成 10000 个 0 到 255 之间的数字拼成一张图，看到的几乎永远是像电视雪花一样的杂乱噪点，而不是一张真人的脸。这说明真实的自然照片在 10000 维像素空间里是怎么分布的？
          options:
            - text: 真实人脸只集中分布在 10000 维空间里一块维度低得多的光滑曲面上（由姿态角度、光照方向、表情等少数自由度控制）
              correct: true
            - text: 真实人脸照片均匀地铺满了 10000 维像素超立方体的每一个角落，随机掷点没抽中人脸只是因为随机数种子没选好
              why: 自然图片受物理结构与光学规律约束，合法图片只占高维像素空间中极小的一部分，绝大多数组合都是无意义白噪声
            - text: 说明每张人脸照片实际上都只由最中间那 1 个像素的亮度唯一决定，其余 9999 个像素的数值在所有照片里都恒定不变
              why: 旋转头部或改变光照时，整张照片成千上万个像素会协同平滑变化，并非只有单个像素在动
          explain: |
            表面上有一万维像素，背后真正独立变化的物理自由度却只有十几个——这就是表示学习里的“流形假设”。
      - card:
          title: 流形假设：高维空间里的低维曲面
          body: |
            **流形假设（manifold hypothesis）**指出：现实中的高维自然数据（如图片、语音、人体动作）并不会均匀填满整个高维空间，而是紧密集中在一个维数低得多的光滑弯曲曲面（流形）附近。
            就像三维空间里卷起来的“瑞士卷”蛋糕皮：虽然每个点带有 $(x, y, z)$ 三个坐标，但顺着蛋糕皮表面走，其实只需要“沿卷轴位置”和“往里卷了多深”两个内在潜坐标就能完整定位。如果能学会把这块弯曲曲面展开铺平，就能用很少的潜变量无损概括原始高维输入。
      - card:
          title: 自编码器：用窄瓶颈迫使网络提炼主干
          body: |
            怎么在不给人工标签的情况下，让模型自己找出这套低维潜坐标？经典结构是**自编码器（autoencoder）**，它由两段映射串联而成：
            1. **编码器** $\mathbf{h} = f_{\text{enc}}(\mathbf{x})$：把高维输入 $\mathbf{x} \in \mathbb{R}^p$ 压缩到维数小得多的低维“瓶颈层”潜向量 $\mathbf{h} \in \mathbb{R}^d$（$d \ll p$）；
            2. **解码器** $\hat{\mathbf{x}} = g_{\text{dec}}(\mathbf{h})$：仅凭这 $d$ 个瓶颈数字尽力还原出原始输入，通过最小化重构误差 $\|\mathbf{x} - \hat{\mathbf{x}}\|_2^2$ 训练。
            当编码器和解码器都只用线性矩阵乘法时，瓶颈层张成的子空间与 **PCA** 的前 $d$ 个主成分子空间等价；换用多层非线性映射后，自编码器就能顺着弯曲流形做非线性降维。
      - item:
          id: autoencoder-mechanism
          type: choice
          prompt: |
            无监督训练自编码器（Autoencoder）提取低维紧凑表示时，如果不给隐藏瓶颈层加任何维数缩小或稀疏等约束（反而让中间层和输入维度一样宽甚至更宽，再直接最小化重构误差），会发生什么？
          options:
            - text: 网络可以直接学会原封不动“照抄输入到输出”的恒等映射，重构误差为 0 却没有提炼出任何紧凑表示
              correct: true
            - text: 即使中间隐藏层比输入层宽十倍，最小化重构平方误差也会自动迫使隐藏层只保留 1 个非零主成分方向
              why: 没有低维瓶颈、噪声扰动或稀疏正则限制时，宽隐藏层直接复制每个输入分量就能让重构误差降为 0，不会主动压缩信息
            - text: 解码器的输出层会自动把无监督重构目标转换成有监督的多分类交叉熵概率预测
              why: 自编码器的训练目标始终是用解码器复原输入特征 $\mathbf{x}$ 本身，不会凭空生成监督分类标签
            - text: 模型会自动退化为按欧氏距离就近分配簇中心的硬聚类 k-means 算法
              why: 宽层自编码器输出的是连续实数重构向量，不会自动离散化为有限个互斥聚类质心
          explain: |
            低维窄瓶颈（或去噪输入、稀疏惩罚）是迫使编码器舍弃无关噪声、只保留流形主干坐标的必要约束。
      - item:
          id: manifold-autoencoder-vs-pca
          type: choice
          prompt: |
            当高维数据沿着一条像瑞士卷一样卷曲的非线性流形分布时，对比线性的 PCA 和非线性自编码器，下面哪条总结准确？
          options:
            - text: PCA 只能在平直超平面上做正交投影，容易把卷曲多层压混在一起；非线性自编码器能顺着弯曲流形把内在低维坐标展开
              correct: true
            - text: 只要自编码器的编码器和解码器全部采用不带非线性激活函数的纯矩阵乘法，它同样能把瑞士卷流形平滑展开成平面
              why: 多个线性矩阵连乘的结果仍然只是一个线性矩阵，纯线性自编码器只能拟合平直子空间，表达上限等同于线性 PCA
            - text: 依据流形假设，高清自然照片在百万维像素超立方体的每一个局部区域里都具有完全相同的均匀概率密度
              why: 流形假设恰恰说明真实自然图片只集中在高维空间中极狭窄的低维光滑流形附近，其余绝大部分空间密度接近 0
            - text: 只要给自编码器加上多层非线性函数，无论瓶颈层设得多宽、训练样本多么稀少，它在训练集上都永远不会发生过拟合
              why: 容量过大而瓶颈过宽的非线性自编码器同样会把训练样本的偶然噪声死记硬背下来，需要控制瓶颈维数或加入正则化
          explain: |
            记住两者的几何对应：线性 PCA 对应平直子空间投影，非线性自编码器对应弯曲流形的非线性参数化与重构。
      - item:
          id: ae-vs-clustering-match
          type: match
          prompt: |
            把这四种表示学习核心概念与它们各自的关键机制配对。
          pairs:
            - ["分布式表示", "用多个共享语义维度的组合表达大量模式，支持新组合泛化"]
            - ["流形假设", "自然高维样本往往集中在低维光滑曲面附近"]
            - ["线性自编码器", "瓶颈层仅做线性矩阵重构时，子空间与 PCA 主成分等价"]
            - ["非线性自编码器", "编码与解码器采用非线性映射以展开弯曲流形"]
          explain: |
            分布式属性组合加上顺应低维流形的瓶颈重构，构成了从传统降维迈向现代深度表示学习的桥梁。

  - id: matrix-completion-embeddings
    chapter: 表示
    title: 缺失值、低秩矩阵补全与稠密嵌入
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一个流媒体推荐系统建了一张“100 万用户 × 5000 部电影”的评分表，但每个普通用户其实只看过并打分过其中不到 1% 的电影，整张大表超过 99% 的格子都是空白缺失。直接拿均值把所有空缺全填成 3.5 分会抹掉个人口味差异。凭什么数学结构可以由那 1% 的已填评分合理推算出大家没看过电影的打分？
          options:
            - text: 假设多数人的口味只由少数几个潜在维度（如科幻偏好、节奏快慢）决定，整张大表近似是低秩矩阵
              correct: true
            - text: 因为每位用户在所有未观看电影上的真实潜在评分在数学上都恒等于该电影的上映年份除以 1000
              why: 用户对未观看电影的潜在评分取决于个人偏好与电影属性的匹配程度，不是与用户无关的固定常数
            - text: 只需把 99% 的空白格子全部当作真实的 0 分（代表讨厌）写死，再对每一列单独求算术平均就能还原个性化评分
              why: 没看过不代表打了 0 分差评，把缺失项当成 0 分会严重拉低所有未观测项目的预测值，且列平均无法区分不同用户的口味
          explain: |
            假设庞大的交互表背后只由少数几个潜在因子驱动（低秩结构），正是矩阵补全和稠密嵌入的共同出发点。
      - card:
          title: 缺失值、矩阵补全与硬迭代算法
          body: |
            面对大量空缺的数据表时，**矩阵补全（matrix completion）**假设完整矩阵 $\mathbf{X}$ 可以由少量的 $M$ 个公共潜因子近似还原，即写成两个瘦矩阵的乘积：
            $$\hat{x}_{ij} = \sum_{m=1}^M a_{im} b_{jm}$$
            其中 $\mathbf{a}_i \in \mathbb{R}^M$ 是第 $i$ 行的低维潜在表示向量，$\mathbf{b}_j \in \mathbb{R}^M$ 是第 $j$ 列的潜在表示向量。求解时常用基于**奇异值分解**的交替补全法：先把空缺暂填为各列均值；随后重复“保留前 $M$ 个最大奇异值做低秩重构”并用重构值更新空缺格子（同时保持所有已观测真实格子的数值不变），直到空缺处数值收敛。
      - card:
          title: 例子：用低秩因子理解矩阵重构与稠密嵌入
          body: |
            对比“直接存整张大表”和“用低维潜向量内积重构大表”，看低秩分解如何引出**稠密嵌入（dense embedding）**。
          reveal:
            - title: 第 1 步：算低秩近似省了多少参数
              body: |
                假设 $1000 \times 500$ 的评分表有 $500{,}000$ 个潜在交互值；如果用 $M = 10$ 维潜表示 $\mathbf{A}_{1000\times 10}$ 和 $\mathbf{B}_{500\times 10}$ 相乘重构，总自由参数量只有 $1000\times 10 + 500\times 10 = 15{,}000$ 个——用 $3\%$ 的参数量就概括了整张表的协同偏好规律。
            - title: 第 2 步：从矩阵行向量推广到词或商品的稠密嵌入
              body: |
                在自然语言或推荐系统里，若对一万个词直接做稀疏独热编码，“苹果”和“梨子”的内积恒为 0（看不出相似性）；把每个离散符号映射为类似行向量 $\mathbf{a}_i$ 的低维连续**稠密嵌入**向量后，常出现在相似上下文里的对象会在低维空间彼此靠近，能直接用内积或余弦度量语义相似度。
      - item:
          id: low-rank-param-calc
          type: number
          prompt: |
            对一张包含 200 位用户、50 件商品的评分矩阵做秩 $M = 4$ 的低秩分解表示（每位用户给 4 维偏好向量，每件商品给 4 维属性向量），这两张小表示矩阵合起来一共有多少个可调数字（参数）？
          answer: 1000
          hint: 计算用户侧 $200 \times 4$ 加上商品侧 $50 \times 4$。
          explain: |
            总参数量 $= 200 \times 4 + 50 \times 4 = 800 + 200 = 1000$，仅为原矩阵总格数 $10{,}000$ 的十分之一。
      - item:
          id: matrix-completion-method
          type: choice
          prompt: |
            在通过截断奇异值分解做缺失值**矩阵补全**的交替更新步骤里，每次算完低秩重构矩阵后，对已知真实格子的数值和空白缺失格子分别怎么处理？
          options:
            - text: 只用低秩重构矩阵的对应值去更新原本缺失的空白格；已观测到的真实数值则保持原样不变
              correct: true
            - text: 每一轮都用低秩重构矩阵把整张表的所有格子全部覆盖掉，包括那些用户已经真实打过分的非缺失格子
              why: 已观测到的真实评分是约束低秩分解的唯一监督锚点，若每轮把已知真实值也改写掉，矩阵会偏离真实观测数据
            - text: 把所有缺失的空白格子固定设为 0 分并在后续每一轮奇异值分解中保持 0 不变，只去修改已观测到的那 1% 真实评分
              why: 矩阵补全的目标正是估算缺失空格的未知数值；锁死空缺为 0 而改动真实观测值恰好把已知和未知弄反了
            - text: 矩阵补全要求原始评分表必须是满秩方阵且任意两行之间完全正交，否则奇异值分解无法运行
              why: 奇异值分解对任意形状的矩形矩阵都存在，而且矩阵补全恰恰利用各行共享少量潜因子的低秩相关性来推算缺失项
          explain: |
            固定已知真实观测格、用低秩近似反复刷新缺失空位，是截断奇异值矩阵补全的核心步骤。
      - item:
          id: dense-embedding-vs-onehot
          type: choice
          prompt: |
            为什么在表示上万种商品、词汇或类别时，现代机器学习常把它们学习成低维稠密嵌入向量，而不是只用高维稀疏的独热编码？
          options:
            - text: 独热编码下任意两个不同类别的向量彼此正交（内积为 0），而低维稠密嵌入能让相似对象在向量空间中靠近并共享泛化信息
              correct: true
            - text: 因为低维稠密嵌入会把所有一万种不同商品都映射成完全相同的 1 维常数，从而不再需要任何矩阵乘法运算
              why: 若所有商品映射成同一个常数就无法区分不同商品；稠密嵌入通常用几十到几百维连续向量保留细粒度语义差异
            - text: 只要采用稠密嵌入表示，即使评分表 100% 全部为空白、没有任何一条历史观测记录，也能靠随机初始化向量准确预测偏好
              why: 稠密嵌入向量的坐标必须从真实共现、交互或监督任务数据中通过优化学习得到，随机初值本身不携带业务语义
            - text: 因为独热编码向量的欧氏长度等于类别总数 $K$，当 $K = 10000$ 时会直接造成浮点数上溢
              why: 独热编码向量只有一位是 1、其余全是 0，其欧氏长度恒为 1；它的局限在于维数过高且不同类别间正交无相似性度量
          explain: |
            稠密嵌入就像矩阵补全里的行向量 $\mathbf{a}_i$，把原本孤立正交的离散符号放进一张可以度量距离和方向的低维连续几何地图。
      - item:
          id: missing-mean-imputation-flaw
          type: choice
          prompt: |
            在一张有大量缺失项的特征表或评分表里，如果直接把所有缺失空格统一填成该列的样本均值（列均值插补），而不考虑行与列之间的协同关系，会带来什么副作用？
          options:
            - text: 抹平了不同样本间的个性化协同差异，同时人为压低了该列特征的样本方差并削弱它与其他特征的相关性
              correct: true
            - text: 列均值插补能够根据每位用户在其他列上的打分高低，为每位用户自动算出各不相同的个性化预测高分与低分
              why: 单纯的列均值插补给该列所有缺失用户都填入同一个常数均值，无法体现“科幻迷给科幻片打高分”的协同差异
            - text: 把缺失值填成列均值后，该列特征的样本方差会比真实方差自动放大 $n$ 倍
              why: 大量填入与均值完全相等的常数会让离差平方和 $(x_i - \bar{x})^2$ 在这些点上全为 0，除以样本量后样本方差反而被人为缩小
            - text: 只有当一列数据的缺失比例低于 1% 时列均值插补才会扭曲方差，当缺失比例高达 90% 时列均值插补没有任何偏差
              why: 缺失比例越高，填入同一个常数的格子就越多，造成的方差低估与相关性衰减反而越严重
          explain: |
            列均值插补适合缺失很少时的快速基线；当缺失较多且变量间有协同结构时，低秩矩阵补全或基于其他特征的条件插补更能保留分布结构。

  # =====================================================================
  # 第 5 章：特征工程与学习设置
  # =====================================================================
  - id: feature-engineering
    chapter: 特征工程与学习设置
    title: 特征工程：数值转换、分类编码与防泄漏
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            想用线性模型预测“周末打车贵不贵”，手里有两类原始字段：城市名（北京、上海、广州……用文本记录）和出发时段（1 到 24 的整数）。如果直接把“北京=1、上海=2、广州=3”放进线性方程 $w\cdot \text{城市}$ 里，会出现什么问题？
          options:
            - text: 线性模型会把它们当成等距定量数值，强制设定广州的效应是北京的三倍
              correct: true
            - text: 只要编成整数，线性回归就能自动忽略数字大小而把每个城市分开单独拟合各自权重
              why: 线性乘法 $w \cdot x$ 会把特征当成等距可加减的定量数值，不会自动把它看成无序类别
            - text: 因为只有 3 个城市，随便编成 1、2、3 也不会改变后续预测与权重关系
              why: 只要乘同一个斜率 $w$，就锁死了“3 是 1 的三倍效果”的虚构等距约束，换个编码顺序结果就会改变
          explain: |
            如何把文本、区间、日期和偏态数值转换成模型能合理利用的信号，正是**特征工程**的核心内容。
      - card:
          title: 数值特征工程的缩放、对数与分箱，以及数据泄漏红线
          body: |
            把原始字段加工成有效特征的**特征工程**在数值侧常用三类处理：Z-score **标准化** $(x-\mu)/\sigma$ 拉齐量纲；**对数变换** $\ln(1+x)$ 压缩长尾偏斜分布；**分箱**按区间分段捕捉门槛突变。
            防泄漏原则：所有均值 $\mu$、标准差 $\sigma$ 与分位桶边界**必须且只能**由训练集算出，随后原样套用在验证集和测试集上，不能划分前先全表统一缩放。
      - card:
          title: 分类编码（独热/哈希/均值编码）与特征交叉
          body: |
            无序分类变量不能直接编整数 1, 2, 3：**独热编码**展开 $K$ 个类别成 0/1 向量，在带截距线性回归时只放 $K - 1$ 个指示列避免全和等于 1 的哑变量共线。面对成千上万高基数类别时可用定宽映射的**特征哈希（Hashing）**或折外**目标均值编码**；想让线性模型学会“同时满足 A 与 B”的条件交互规则，只需相乘构造成**特征交叉（Feature Cross）**列。
      - item:
          id: feature-cross-purpose
          type: choice
          prompt: |
            在高基数类别和交互建模中，何时分别选用“特征哈希（Hashing）”和“特征交叉（Feature Cross）”？
          options:
            - text: 类别过多建词典占内存时用特征哈希降维；需线性模型拟合联合条件时构造特征交叉
              correct: true
            - text: 特征哈希只适用于预测连续数值目标 $Y$，在二分类与多分类任务中完全无法使用
              why: 特征哈希是在输入侧把高维独热向量压缩成固定长度表示的方法，对分类和回归同样适用
            - text: 构造“A × B”的特征交叉会迫使线性模型完全失去拟合原有单特征加和规律的能力
              why: 保留原有单独特征再加上乘积交叉项，线性模型既能表达基础加和效应，又能拟合组合协同非线性效果
            - text: 独热编码在碰到不断新增的百万种商品编号时，能够自动缩减特征矩阵的总列数
              why: 独热编码列数会随新发现种类不断增加，而特征哈希能把大量类别名称稳定投进固定宽度 $B$ 维向量里
          explain: |
            用独热或哈希处理稀疏离散名称，用特征交叉捕捉联合条件，都能明显提升线性模型的表达能力。
      - card:
          title: 例子：正确预防验证折里的数据泄漏与哑变量个数
          body: |
            设计一个预测二手车价格的工程流水线：共有特征“车龄”（连续，存在较长右偏尾）、“品牌”（4 种无序品牌：大众、丰田、本田、宝马）和“是否四驱”（0/1 二值）。应该怎样一步步正确编码并防范泄漏？
          reveal:
            - title: 第 1 步：分类列的无共线编码与交互构造
              body: |
                “品牌”有 $K = 4$ 种取值，放进含截距的普通线性回归时需造 $K - 1 = 3$ 列指示变量（比如拿“大众”作基线全 0，另外 3 列分别标出其余 3 个品牌），避免与截距列相加共线；若怀疑不同品牌折旧率（车龄斜率）不同，再加“车龄 × 品牌指示列”特征交叉项让各品牌拥有自己斜率。
            - title: 第 2 步：划分后仅从训练折估计缩放统计量
              body: |
                如果整份数据集先做了全表均值标准差标准化、再拆出 20% 当测试集，测试集的极值已经进入了训练特征的均方差计算里——这就造成**数据泄漏**。正确步骤是先锁好验证/测试集，只对当前训练折求 $\mu_{\text{train}}, \sigma_{\text{train}}$ 来转换验证折。
      - item:
          id: dummy-trap-cols
          type: number
          prompt: |
            某个含截距项 $\beta_0$ 的普通线性回归模型准备引入“季节”（春、夏、秋、冬共 4 个离散水平）作为独热指示特征。为了完全避免所有指示列相加恒等于全 1 截距列（哑变量陷阱），应当往特征矩阵里实际放入几列 0/1 指示变量？
          answer: 3
          hint: 有 $K$ 个互斥类别且模型已有全局截距项时，只需建 $K - 1$ 个指示列，省下那一类成为参照基线。
          explain: |
            若 4 个季节全放 4 列 0/1，则每行这 4 列之和恒等于 1，与全 1 截距列形成严格线性相关；放入 $4 - 1 = 3$ 列即可区分 4 类（三列全 0 即代表第 4 个对照基线季节）。
      - item:
          id: leakage-prevention-choice
          type: choice
          prompt: |
            小王在做一份客户流失建模时，为了方便，先把全量 10000 条样本做完标准化（用全体均值和标准差）并且算完“每个城市的平均流失率”目标编码列，然后再按 8:2 划分训练集和测试集，结果测试集效果虚高、上线后大幅下滑。他犯了什么错误？
          options:
            - text: 发生数据泄漏：测试集的特征分布和流失标签在划分前就渗进了特征转换参数
              correct: true
            - text: 他忘记把所有城市名称按汉字拼音首字母顺序编成 1 到 300 的整数顺序号
              why: 城市本就是无序分类变量，用整数大小排序更错；这里的问题是先用全表统计信息（含测试集目标值）再做划分
            - text: 不应当在训练集里做标准化，因为只要包含目标均值编码，标准化就会破坏树和线性模型的分裂边界
              why: 标准化本身很有必要，只是估算均值、标准差与目标均值编码映射表必须在划分以后仅限训练折内部算出
            - text: 只要改用 1000 个哈希桶的特征哈希编码，就算预先统计全表标签也绝不会出现信息泄漏
              why: 只要预先偷看了测试集的样本标签来构造特征映射统计量，依然会引发评估失真的泄漏问题
          explain: |
            把所有“由数据统计出来的转换规则（标准化参数、PCA、目标均值、词表阈值）”全部看作训练过程的一部分，切勿提前接触验证或测试样本。
      - item:
          id: log-transform-skew
          type: choice
          prompt: |
            一份电商“用户历史累计消费额”字段绝大多数集中在几十元到几百元，但有少量大客户消费高达几百万元（明显右偏长尾）。往线性回归里输入之前先对金额取 $\ln(1 + x)$ 变换，主要起什么作用？
          options:
            - text: 压缩右偏长尾分布，削弱少数百万元极端高值对回归斜率的拉偏
              correct: true
            - text: 因为 $\ln(1 + 0) = 0$，所以会直接删掉全部消费金额高于 100 元的样本，只留下低消费群体
              why: 对数变换保留全部非负样本，只是对较大数值做非线性平缓压缩
            - text: 取对数后所有连续消费金额的物理单位都自动转换成了彼此独立的离散百分比分类标签
              why: 对数金额依然是连续定量数值特征，可直接送入线性或树模型
            - text: 这能保证所有消费金额在变换后已经自动严格落在 $[-1, 1]$ 之间，再也不需要标准化
              why: 若金额仍跨较广范围或要配合正则化惩罚，对数变换后往往仍需按训练集均值和标准差做标准化
          explain: |
            金额、点击量、页面停留时间等天然长尾正数特征通常适合先观察分布，用 $\ln(1+x)$ 压缩尾端后再做标准化。

  - id: nonlinear-basis-splines
    chapter: 特征工程与学习设置
    title: 非线性基函数、样条与广义可加模型
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            想用一条曲线拟合一座城市全年每天平均气温的变化（冬天冷、夏天热），有同学放了最高 $x^{10}$ 的全局高次多项式。中间 4 月到 10 月贴得不错，可到了 1 月和 12 月边界两端，曲线大幅翘起或骤降。想避免“动一处整条全晃”的问题，应该怎么改造？
          options:
            - text: 按若干节点（knot）把区间切段，每段拟合低次多项式并在接缝处光滑连接
              correct: true
            - text: 把全局多项式阶数继续提高到 $x^{50}$，用更高次幂把边缘两端稳稳压平
              why: 高次全局多项式在区间边缘会产生明显的 Runge 震荡，阶数越高边缘外翻往往越显著
            - text: 直接退回到没有任何弯曲能力的一阶全局斜直线来拟合全年气温波动曲线
              why: 直线无法拟合“冬冷夏热”的单峰弯曲规律，属于严重欠拟合
          explain: |
            “局部低阶切段 + 接缝处导数连续平滑”，正是样条超越全局高次多项式的核心构造。
      - card:
          title: 多项式、阶梯函数、基函数与回归样条
          body: |
            为了延续线性模型高效求解又表达非线性曲线，我们把输入换成一组固定的非线性**基函数** $y_i = \beta_0 + \sum_{m=1}^M \beta_m b_m(x_i) + \varepsilon_i$。常见构造有：低次（2–3 次）**多项式**（高次边缘易甩尾）、分段常数**阶梯函数**（边界处会阶跃），以及用 $K$ 个**节点**把区间切成多段拟合低次三次曲线并强制值与一二阶导数连续的**回归样条**（加入两头边界以外沿直线延伸的**自然三次样条**可稳住边界）。
      - card:
          title: 平滑样条、局部回归与广义可加模型（GAM）
          body: |
            若不想手工挑节点位置，**平滑样条**把每个训练点设为节点，再往平方损失后加二阶曲率罚项 $\lambda \int g''(t)^2\,dt$ 用交叉验证选 $\lambda$；**局部回归（LOESS）**则针对每个待测点仅对邻近样本做加权局部低阶拟合。扩展到多变量时，**广义可加模型（GAM）**写成 $y_i = \beta_0 + \sum_{j=1}^p f_j(x_{ij}) + \varepsilon_i$，每个特征各自配一条光滑曲线再相加，兼具非线性灵活度与逐特征画图解释性。
      - item:
          id: spline-vs-poly-vs-gam
          type: choice
          prompt: |
            在面对多特征表格数据且希望清晰看出“年龄、工龄、受教育年限”各自呈现出的非线性弯曲规律时，下面哪个模型族能兼顾非线性表达力、避开高维交互灾难并保持良好逐变量解释性？
          options:
            - text: 广义可加模型（GAM），为每个特征各自拟合一条光滑曲线再相加
              correct: true
            - text: 直接使用 8 次全局多项式把全部特征的高阶交叉项一次性全部展开并做普通线性回归
              why: 多特征 8 次交叉展开不仅参数量暴涨易过拟合，而且高次端点还容易在边界产生大幅摆动
            - text: 强制只用带 0 个切分节点、仅含各特征一阶项的普通多元线性直线方程
              why: 一阶全局直线无法展现不同特征各自呈现出的弯曲非线性趋势
            - text: 对全部连续特征直接执行单连接（Single linkage）无监督层次聚类来代替监督预测
              why: 层次聚类属于无监督群组划分，不能输出带变量边际响应曲线的监督预测模型
          explain: |
            GAM 用“各自非线性 + 总体可加”打破了传统直线限制，同时避开了全特征高维网格式组合带来的维度难题。
      - card:
          title: 例子：数一数含 K 个节点的三次样条究竟剩几个自由度
          body: |
            刚听到“把实数线分成好几段、每段放一个 4 参数三次多项式”，有人会担心参数爆炸、接缝断裂。到底还留着多少真正能动弹的自由度？
          reveal:
            - title: 为什么带有 K 个内部节点的通用三次样条恰好只有 K + 4 个自由度？
              body: |
                虽然 $K$ 个内部节点把整条横轴切出了 $K + 1$ 个区间段，每段上的三次多项式 $a + bx + cx^2 + dx^3$ 表面上有 $4$ 个系数（共 $4K + 4$ 个参数）；但在每一个内接缝节点处，函数值、一阶切线斜率和二阶弯曲度这 **3 条**都要严丝合缝连续相等。减去 $3K$ 条连续约束方程，最终剩下的真正自由参数恰好是 $(4K + 4) - 3K = K + 4$。换成基函数表达正是常数 1、$x, x^2, x^3$ 这 4 项再加上 $K$ 个截断三次基 $(x - \xi_k)_+^3$。
      - item:
          id: cubic-spline-df
          type: number
          prompt: |
            已知带 $K$ 个内部节点的一般三次回归样条共有 $K + 4$ 个自由度（常数项 1 加三个幂次再加 $K$ 个截断三次基）。如果我们选了 $K = 3$ 个内部节点划分数据范围，整条三次回归样条模型合计有多少个待估计自由参数（自由度）？
          answer: 7
          hint: 直接代入公式 $K + 4$（4 项全局基础多项式 + 3 个节点基）。
          explain: |
            $3 + 4 = 7$ 个参数：截距、$x, x^2, x^3$ 共 4 个基础项加上 3 个节点处的截断三次基 $(x - \xi_k)_+^3$。
      - item:
          id: smoothing-spline-lambda
          type: choice
          prompt: |
            平滑样条优化目标 $\sum_{i=1}^n (y_i - g(x_i))^2 + \lambda \int g''(t)^2\,dt$ 中的调节参数 $\lambda$ 从 $0$ 一路调向 $+\infty$ 时，拟合出来的曲线 $g(x)$ 会怎么演变？
          options:
            - text: $\lambda=0$ 时可穿过全部样本点；$\lambda\to+\infty$ 时二阶导趋于 0，退化为最小二乘直线
              correct: true
            - text: $\lambda \to +\infty$ 时模型几乎不再受弯曲惩罚限制，曲线震荡得更厉害并准确穿过全部训练样本点
              why: $g''(t)$ 度量曲线的弯曲转折程度，$\lambda$ 越大惩罚越重，二阶导被迫接近 0——而二阶导恒为 0 的函数正是直线
            - text: $\lambda = 0$ 时惩罚最严厉，会把曲线从头到尾强行压扁成一条完全水平的常数直线
              why: 惩罚项系数为 0 代表取消弯曲限制，样条得以不受约束地穿过所有数据点
            - text: 平滑样条会把整个训练样本硬性切分并锁进互不连通的 2 个平坦阶梯常数区间里
              why: 阶梯函数才会产生不连续的平坦台阶，平滑样条保持二阶导数平滑连续
          explain: |
            惩罚总曲率 $\int g''(t)^2\,dt$ 是“在穿点贴合”和“拉成直线”之间连续滑行、免挑节点位置的经典做法。
      - item:
          id: natural-spline-boundary
          type: choice
          prompt: |
            与普通的全局多项式或无边界限制的三次回归样条相比，**自然三次样条（Natural Cubic Spline）**专门加上了什么附加约束来稳住边界两端？
          options:
            - text: 要求曲线在最小节点左侧与最大节点右侧的边缘外延区间上退化为一次线性
              correct: true
            - text: 把边缘外侧的高次幂系数放大 10 倍，允许曲线在两端区间外出现更大幅度的高方差摆动
              why: 自然三次样条恰好是为了消除边界外侧因三次项放大带来的高方差震荡才要求边缘变直
            - text: 删除全部内部切分节点，整条拟合曲线从最左端到最右端全区间共用一条水平零常数线
              why: 内部节点仍然保留完整的三次平滑弯曲能力，只在边缘节点外侧退成直线以节省边界自由度并提高稳定性
            - text: 允许在每个内部节点连接处放开连续性要求，让函数值本身可以发生上下跳跃断开
              why: 样条依然严格保持节点两边值、一阶导和二阶导连续
          explain: |
            省掉两侧高次边缘震荡、把节点范围之外拉成平稳直线，是自然三次样条在实际回归和 GAM 中的常见默认设定。

  - id: feature-selection-regularization
    chapter: 特征工程与学习设置
    title: 特征选择、信息准则、岭回归与 Lasso
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            研究小组收集了 30 个候选特征去建预测模型，但其实只有 5 个核心特征真起作用。用普通训练 $R^2$ 挑特征时却发现，每往方程里多加 1 个无关的随机特征，训练 $R^2$ 反倒会略微上升，好像“全选 30 个总是最高”。如果只能从已知训练集指标里挑选特征子集，评价标准必须加上什么条件？
          options:
            - text: 在残差平方和旁边加上针对“特征个数 $d$”的复杂度罚金，以抵消无效扩维带来的虚假收益
              correct: true
            - text: 直接选择让训练集残差平方和最小、也就是把全部 30 个候选特征全部放进回归方程的模型
              why: 增加任何变量都不可能增大普通训练误差，因此直接用训练残差或普通 $R^2$ 会一直偏向过拟合的大模型
            - text: 不再比较训练集误差或特征个数，每次建模前直接随机丢弃一半特征作为简化筛选规则
              why: 随机弃置很容易丢掉真正有价值的少数核心变量
          explain: |
            模型选择的所有信息准则和正则化手段，核心理念都是在“误差降幅”和“额外复杂度代价”之间算明白账。
      - card:
          title: 子集选择与调整后模型评价准则
          body: |
            挑干净特征子集时，**最优子集**要搜 $2^p$ 种组合（仅适于小 $p$）；大 $p$ 改用贪心**前向/后向逐步选择**（注：后向逐步不能直接用在 $p > n$ 情形）。
            因加无关列不会令训练误差升高，跨规模比拼时必须在**残差平方和（SSE）**后挂上特征数惩罚：Mallows $C_p$、**赤池信息准则（AIC）**给每个变量加固定罚金 2，**贝叶斯信息准则（BIC）**罚金随 $\ln n$ 增长（更偏好精简子集），调整 $R_a^2$ 则扣减自由度来拦截无关特征（也可用交叉验证直接测样本外误差）。
      - item:
          id: bic-vs-aic-vs-ols
          type: choice
          prompt: |
            在一份包含 $n = 200$ 个样本（此时 $\ln 200 \approx 5.3 > 2$）的数据上做特征子集挑选，对比 AIC、BIC 与普通训练残差平方和，下面哪项表现一致成立？
          options:
            - text: 样本较大时 BIC 惩罚系数 ln n 大于 AIC 的 2，更倾向于选精简模型；训练 SSE 则总是偏爱全特征
              correct: true
            - text: BIC 的复杂度惩罚系数总是严格小于 AIC，因此 BIC 最终挑选出来的特征数量常常比 AIC 多出一倍
              why: 只要样本数 $n \ge 8$，就有 $\ln n > 2$，因此 BIC 给每个额外特征挂上的罚金更重，选出的模型更精简
            - text: 调整 $R_a^2$ 即使在往回归方程里硬塞纯粹的随机噪声变量后，数值也依然只会严格升高而不降
              why: 随机噪声降不了多少 SSE，却实打实把自由度 $n - d - 1$ 扣小了，导致 $R_a^2$ 反而下降，从而拦截无关特征
            - text: 岭回归也能像最优子集或 Lasso 那样，把大多数无关噪声特征的权重系数直接压成精确的 0
              why: 圆球形 $L_2$ 约束会把无关特征压得接近 0，但一般不会把它们变成精确的 0
          explain: |
            想精简特征只留少数主因时常比较 BIC 或 Lasso；追求多个弱共线特征合力的预测稳健性时往往用 AIC/交叉验证配合岭回归。
      - card:
          title: 岭回归（L2 正则）与 Lasso（L1 稀疏收缩）
          body: |
            在损失后加幅度**正则化**约束能抑制过拟合方差：
            - **岭回归（$L_2$）**：加平方惩罚 $\lambda \sum_{j=1}^p w_j^2$，靠圆润限制把权重按比例拉小、抗共线与稳住 $p > n$ 求逆，但不把系数精确归零；
            - **Lasso（$L_1$）**：加绝对值惩罚 $\lambda \sum_{j=1}^p |w_j|$，菱形尖角易与等高线切在坐标轴顶点上，把多余特征系数**精确压成 0** 并自动筛选。两者超参数 $\lambda$ 靠交叉验证选出，且建模前**必须先把特征标准化**。
      - card:
          title: 例子：1 维去中心数据上的岭回归系数收缩
          body: |
            为看清惩罚系数 $\lambda$ 如何往零拽参数，考察一个去中心化的单特征例子：已知 $\sum x_i^2 = 10$、$\sum x_i y_i = 25$，模型为 $y = wx$。普通解、$\lambda=2.5$ 和 $\lambda=15$ 时的岭回归斜率分别是多少？
          reveal:
            - title: 从普通最小二乘到逐渐加大收缩参数 λ
              body: |
                由损失 $L = \frac{1}{2}\sum (wx_i - y_i)^2 + \frac{\lambda}{2} w^2$ 求导令零得闭式解：$\hat{w}_{\text{Ridge}} = \frac{\sum x_i y_i}{\sum x_i^2 + \lambda}$。
                当 $\lambda = 0$（普通最小二乘）时，$\hat{w} = 25 / 10 = 2.5$；
                当 $\lambda = 2.5$ 时，分母增大到 $12.5$，$\hat{w} = 25 / 12.5 = 2.0$；
                当 $\lambda = 15$ 时，分母变成 $25$，$\hat{w} = 25 / 25 = 1.0$。随着 $\lambda$ 增大斜率温和靠向 0，但只要 $\lambda$ 有限就不会完全消失为 0。
      - item:
          id: ridge-shrink-calc
          type: number
          prompt: |
            在不含截距的单特征线性模型中，测得 $\sum x_i^2 = 12$、$\sum x_i y_i = 30$。采用 $L_2$ 正则化的岭回归（目标求最小 $\sum (wx_i - y_i)^2 + \lambda w^2$），当惩罚系数取 $\lambda = 3$ 时，算出的斜率 $\hat{w}_{\text{Ridge}} = \frac{\sum x_i y_i}{\sum x_i^2 + \lambda}$ 是多少？
          answer: 2
          hint: 在分子不变的前提下，分母用特征平方和 12 加上正则惩罚 $\lambda = 3$。
          explain: |
            $\hat{w}_{\text{Ridge}} = \frac{30}{12 + 3} = \frac{30}{15} = 2$（相比之下无惩罚的 OLS 解为 $30/12 = 2.5$）。
      - item:
          id: lasso-vs-ridge-scale
          type: choice
          prompt: |
            工程上准备在 50 个不同量纲特征上运行 Lasso（$L_1$ 正则化）做自动特征筛选与预测建模。下面哪个做法会破坏筛选的公平性？
          options:
            - text: 不做标准化，直接把“身高（米）”与“年薪（分）”混用同一个惩罚系数 $\lambda$
              correct: true
            - text: 仅用当前训练折的均值和标准差对所有特征做标准化，再用 k 折交叉验证调优全局惩罚系数 $\lambda$
              why: 这是既消除量纲差异、又避免测试数据泄漏的标准规范流程
            - text: 把交叉验证找出的最优 $\lambda$ 固定下来，在完整训练集上重训并到封存测试集上做一次最终评测
              why: 在独立测试集做最后一次汇报是规范的工作流
            - text: 在特征真实存在稀疏性时借助 Lasso 让大批无关噪声特征的权重系数自然收缩并归零
              why: 这正是 $L_1$ 正则化相比普通最小二乘和岭回归的主要特点
          explain: |
            单位尺度变化会反向缩放对应权重大小：若把某列乘以 0.001，斜率 $w_j$ 就需放大 1000 倍来维持预测，惩罚项 $|w_j|$ 便会过度压制它，所以正则化前应在训练集内先做标准化。

  - id: validation-and-learning-settings
    chapter: 特征工程与学习设置
    title: 交叉验证、自助法与学习设定
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            要比较 5 个候选项的超参数好坏，有同学打算拿 50% 训练、50% 留作一次性的验证集打分。可同桌发现，只要换个随机种子重新切一次五五分，选出的最佳超参数就会换成另一个。为什么一次性对半验证既不稳定又容易高估错误率？
          options:
            - text: 每次只拿一半数据训练容易高估误差，且单次切分的随机波动较大
              correct: true
            - text: 因为随机划分验证集时通常没有使用梯度下降优化器来精确求解回归参数
              why: 这是数据利用率和划分随机方差的问题，即使改用正规方程精确求解依然存在切分波动
            - text: 因为对半切分只适合大样本，小样本上 50% 训练模型往往比 100% 样本更准
              why: 可用训练样本减半后学习效率下降，所得误差通常明显高估全量数据的真实泛化水平
          explain: |
            单次划分既少用了一半数据训练，评估结果又容易受随机切分影响；轮流做验证的**交叉验证**能缓解这两类问题。
      - card:
          title: 验证集、LOOCV 与 k 折交叉验证（5/10 折最优折中）
          body: |
            评估泛化误差有三把常用尺子：
            - **单次验证集划分**：简单快捷，但结果很看切分运气且因少用训练数据而高估误差；
            - **留一法（LOOCV）**：切成 $n$ 折每次仅测 1 点（线性回归有快捷封闭式），无随机拆分抖动，但对一般模型跑 $n$ 次太慢且各折高度重叠导致评估方差较大；
            - **k 折交叉验证（常用 $k = 5$ 或 $10$）**：用这套轮流划折再平均误差的**交叉验证**方法，每次挑 1 折验证、其余 $k-1$ 折训练，计算开销更低且处于**偏差–方差折中点**。
      - item:
          id: cv-5fold-sizes
          type: number
          prompt: |
            把包含 150 条可用训练样本的数据集做严格标准的 **5 折交叉验证**（不包含独立外挂测试集）。在每一轮迭代中，实际用来拟合模型参数的那部分训练子集包含多少条样本？
          answer: 120
          hint: 5 折里拿出 1 折（30 条）做验证，其余 4 折合并一起用于训练。
          explain: |
            每折 $150 / 5 = 30$ 条，每轮取其中 1 折验证、其余 $5 - 1 = 4$ 折共 $150 - 30 = 120$ 条用于训练，轮流 5 轮后每个样本都正好被独立验证一次。
      - card:
          title: 分类防泄漏、自助法与机器学习四大设定
          body: |
            任何基于数据分布统计量的处理（标准化、选特征）都必须在每折内部单独计算，不能提前全表跑完再划分。
            需要估算参数不确定性时，**自助法（Bootstrap）**从 $n$ 个样本有放回抽满 $n$ 个构成副本（约 $36.8\%$ 原样本未抽中）。真实场景还分四大设定：静态全部给齐的**离线批量**、流式逐条到达的**在线学习**、动作只见当前奖赏不改环境的**赌博机**，以及动作改变未来状态的**强化学习**。
      - card:
          title: 例子：对照单次留出、5 折交叉验证与自助重抽样
          body: |
            手头只有 $n = 100$ 条医学影像标注数据，同时备好了 20 条独立测试病例。想要从 4 种正则化超参数里挑出最好的一档，该怎么切分与评估？
          reveal:
            - title: 第 1 步：用 5 折交叉验证跑完超参数比拼（只动那 100 条）
              body: |
                先把 20 条独立测试病例始终隔离保存。把可用训练数据 100 条分成每份 20 条的 5 折：轮流执行 5 轮，每轮拿 80 条训练（且只在当轮 80 条里算均值和标准差来标准化这 80 条和当轮那 20 条验证折），算出 5 份验证误差求平均，挑出平均验证误差最小的超参数。
            - title: 第 2 步：全量重训并用 20 条测试集做唯一汇报
              body: |
                挑定最佳超参数后，用全部 100 条可用数据重新训练最终模型（此时用完整 100 条算标准化统计量），最后才解封那 20 条测试病例跑出无偏的最终泛化成绩。
      - item:
          id: bootstrap-prob-choice
          type: choice
          prompt: |
            自助法（Bootstrap）是从 $n$ 个原始样本中有放回地独立随机抽取 $n$ 次组成新样本集，而交叉验证往往无放回切成 $k$ 块。下面哪一项正确说出了自助法抽样结果的特点？
          options:
            - text: 每份自助样本里常含重复样本，约有 36.8% 的原始样本一次也没抽中
              correct: true
            - text: 因为恰好一共抽取了 $n$ 次，所以每次都能保证原始 $n$ 个样本刚好不重样地各出现 1 次
              why: 每次放回原池子后再抽，同一条样本可能被抽中多次，导致部分原样本一次都没被选中
            - text: 5 折和 10 折交叉验证比留一法（LOOCV）还要慢上数倍，工业界用 10 折只是为了多测试几种代码写法
              why: 在一般模型上 $n$ 次训练的 LOOCV 反而慢得多，5 折/10 折只需训练 5 到 10 次更快，也避免了各折高度重合引发的大方差
            - text: 为了提升挑选特征的效率，应当先拿测试集与训练集混合筛选十佳特征，再放进交叉验证里评估
              why: 先把全部数据拿来提前挑特征会使验证误差虚低，属于数据泄漏错误，特征挑选必须在每折训练过程内部重做
          explain: |
            牢记两点：第一，有放回抽满 $n$ 个会有约 $1/e \approx 36.8\%$ 留空（袋外）；第二，5/10 折交叉验证是耗时和偏差–方差的常用折中，且一切数据统计操作均应在每折内部进行。
      - item:
          id: learning-settings-choice
          type: choice
          prompt: |
            在线广告推荐系统面对的用户行为持续变化，系统展示出去的广告会收获点击/不点击反馈，却没法看到“没展出的其它广告如果展示出去了用户点不点”。这类每轮只拿所选动作即时反馈的设定，属于哪类学习设定？
          options:
            - text: 在线交互 / 上下文赌博机（只观测到所选动作的即时奖赏，不知未选动作的反事实结局）
              correct: true
            - text: 静态标准全量离线回归（所有标准答案在第一天就全部同时给出，数据分布长期静止不变）
              why: 推荐和交互广告边在线推流边接收当前动作单一反馈，数据分布也非静态封闭
            - text: 只包含输入 $X$ 没有任何点击奖赏反馈信号的纯无监督主成分分解模型
              why: 系统能明确获得所选动作的用户点击或收益数字作为反馈信号
            - text: 线性模型封闭方程一次求逆，上线之后从头到尾不再需要随数据分布持续更新参数
              why: 面对随时间变化的流式交互反馈，必须做在线更新并权衡探索与利用
          explain: |
            分辨四大设定看三点：全静态看批量、流式渐进看在线、部分行动反馈不改环境状态看赌博机、行动改环境状态看强化学习。

  - id: semi-supervised-learning
    chapter: 特征工程与学习设置
    title: 半监督学习：假设、自训练与协同训练
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            医院课题组手头攒了 10 万张肺部断层扫描影像，可请资深主任医师人工标注的成本很高，目前只有 200 张标上了“正常/患病”，剩下 99,800 张全部没有标签。在什么前提下，这 99,800 张**无标签**影像的分布 $p(x)$ 也能帮分类器画准分界线？
          options:
            - text: 样本在特征空间呈团簇间隙或低维流形，且类别边界恰好穿过低密度稀疏区
              correct: true
            - text: 哪怕两类完全混成均匀一团、疏密形状与类别毫无关系，无标签数据也能稳定把准确率拉高 30%
              why: 如果输入特征分布 $p(x)$ 的疏密高低跟类别条件边界 $P(Y \mid X)$ 毫无关系，再多无标签样本也帮不上忙
            - text: 算法会自动向主任医师发送消息索要剩余近十万张影像的隐藏真实标签
              why: 半监督算法能读到的依然只有那批无标签样本的纯特征形状 $x$，不会产生人工真标签
          explain: |
            **半监督学习**并非凭空生出信息——它成立的前提是特征空间的低密度间隙或流形结构能够提示分类边界的位置。
      - card:
          title: 为什么有效与模型假设翻车的风险
          body: |
            **半监督学习**联用少量有标签与海量无标签样本，通常基于**聚类假设**（边界走在低密度峡谷）与**流形假设**。但若模型分布假设设错，或**期望最大化（EM）算法**卡在劣质局部极大值，塞入大量无标签样本反而会让准确率低于只用少量标签。先聚类再按类内标签投票（Cluster-and-Label）的成败同样取决于簇是否真的对齐类别。
      - item:
          id: ssl-model-wrong-hurt
          type: choice
          prompt: |
            拿 20 个有标签点和 5000 个无标签点跑生成式混合高斯半监督算法，结果验证准确率不仅没升，反而从只用 20 个标签时的 82% 下降到了 61%。从半监督理论看，最合理的解释是什么？
          options:
            - text: 真实类别不符合假定的混合高斯分布（模型误设），或 EM 算法停在劣质局部极大值
              correct: true
            - text: 因为 5000 个无标签样本超过了常见统计软件一次读入的最大整型索引上限
              why: 5000 条只是轻量小数据集，问题出在错误的参数假定让大量无标签点按错形状挤歪了边界
            - text: 在任何条件下加入无标签数据都不可能降低准确率，这种情况只说明验证脚本算错了分数
              why: 这是半监督学习的核心教训：不同于增加真标签，错误模型假定下加无标签数据完全可能引起性能倒退
            - text: 因为 20 个有标签样本还是太多，只要把有标签样本全删成 0 个转无监督就能自动修正
              why: 删光真标签会丧失类别对齐锚点（不可辨识），模型连哪一团对应哪一类都无从得知
          explain: |
            模型正确性与可辨识性是半监督成败的关键：用无标签数据时务必在保留的带真标签验证集上核实效果确实提升，再行放量。
      - card:
          title: 自训练（Self-Training）与协同训练（Co-Training）
          body: |
            - **自训练**：先用标注集训出初模，再挑高置信未标注样本贴伪标签扩增训练集多轮迭代，但错误自信容易滚雪球（确认偏差）。
            - **协同训练与多视角学习**：把同一样本拆成互相条件独立且各自充分的两组**特征视角（View）**（如“网页正文文字”与“外部页面指向它的锚文字”），分别训 $f_1, f_2$ 让它们互相把高置信伪标签送给对方学习。
      - card:
          title: 例子：跟踪自训练伪标签扩增与协同训练的互斥检验
          body: |
            假设拿一份网页分类任务测试协同训练：每条样本既有“网页自身正文文本”（视角 1），又有“别人指向它的锚文本”（视角 2）。为什么比单一模型自己教自己的纯自训练更抗偏见？
          reveal:
            - title: 为什么交叉给对方贴高置信伪标签比自己教自己稳健得多？
              body: |
                单一模型的纯自训练容易越学越固执：如果它在视角 1 上碰巧误信了某个错误关键词，把一条错样本自信地塞进自己下轮训练集，下次再学只会把这错误关键词权重练得更牢。
                在协同训练里，假设视角 1 靠某个独有的词碰巧确信地把新网页标成正类，拿去喂给只看视角 2（别人怎么指向它）的模型 $f_2$ 时，这个样本相当于为视角 2 带来了一条新鲜的多特征样本信息，促使 $f_2$ 发现跨视角的通用特征——只要两视角真的条件独立且各自充分，相互教学就能突破单视角盲区。
      - item:
          id: co-training-assumptions
          type: choice
          prompt: |
            要让双模型互喂高置信度伪标签的**协同训练（Co-Training）**顺畅发挥作用，输入数据构造的两个特征视角 $(x^{(1)}, x^{(2)})$ 理想状态下应该满足哪两个经典条件？
          options:
            - text: 每个视角单独都足以准确分类（充分性），且给定真实标签时两视角特征条件独立
              correct: true
            - text: 两个视角必须是逐字复制的一模一样副本，并且每个视角单独看时分类准确率恰好为 0%
              why: 两个一模一样的视角会退化成自教自、毫无相互补盲信息量；而充分性要求单视角本来就有足够判别力
            - text: 必须在启动协同训练之前先把全部训练样本的真实人工类别标签全部清空
              why: 两视图模型均须由带真标签样本完成起步初始化，全空就没法对齐任何标签
            - text: 协同训练只允许用来处理 $k = 1$ 的 k-means 纯无监督聚簇划分问题
              why: 协同训练是面向有少量起始标注的两类/多类半监督学习与多视角学习经典方法
          explain: |
            两个互相独立却各自足以判别的视角，相当于从两个不同侧面给同一对象补充证词，能有效压制单一视角的确认偏差。
      - item:
          id: self-training-risk
          type: choice
          prompt: |
            执行**自训练（Self-Training）**迭代伪标签算法时，如果把入选门限设得过低（比如预测概率只要达到 0.52 就立刻贴上正类伪标签写进训练集再重训），最可能发生什么问题？
          options:
            - text: 边界模糊或猜错的样本被当成真标签回写训练集，引发错误不断放大（确认偏差）
              correct: true
            - text: 算法会自动放慢每轮的梯度更新步长，并最终收敛成一个完全无偏的直方图统计模型
              why: 把低把握甚至猜错的标签当真答案再塞给模型吃，只会让它沿错误方向偏离得更远
            - text: 逻辑回归模型会自动把所有概率约 0.52 的点转换生成一组全新的特征交叉列
              why: 伪标签改变的是训练标签集本身，不会自动在特征列里生成特征交叉项
            - text: 因为概率 0.52 非常接近 0.5，二元交叉熵对这批点的梯度会自动严格等于 0
              why: 把伪标签硬设成 $y=1$ 而当下概率仅 $0.52$ 时，梯度差值 $p - y = -0.48$ 并不为 0，会把边界错误推离
          explain: |
            自训练通常只挑选高置信度（如 $p > 0.95$）样本并控制每轮增量比例，同时保留带真标签的独立验证集核查效果。

  # =====================================================================
  # 结业挑战
  # =====================================================================
boss:
  items:
    - id: b-ols-gd
      type: number
      prompt: |
        使用均方误差损失 $L(w, b) = \frac{1}{4}\sum_{i=1}^4 (wx_i + b - y_i)^2$ 拟合样本 `(1, 1)`、`(2, 3)`、`(3, 2)`、`(4, 5)`，求出的偏导梯度 $\frac{\partial L}{\partial b} = \frac{1}{2}\sum_{i=1}^4 (wx_i + b - y_i)$ 在初值 $w=0, b=0$ 处等于 $-5.5$。若学习率取 $\eta = 0.01$ 做一步梯度下降，新的截距 $b_1$ 是多少？
      answer: 0.055
      hint: 代入 $b_1 = b_0 - \eta \frac{\partial L}{\partial b}$。
      explain: |
        $b_1 = 0 - 0.01 \times (-5.5) = 0.055$；注意更新是“减去”学习率乘以梯度。
    - id: b-logistic-ce
      type: choice
      prompt: |
        用 Sigmoid 逻辑回归处理二分类时，关于交叉熵损失及其梯度 $\frac{\partial L}{\partial \mathbf{w}} = (p - y)\mathbf{x}$，以下哪一句判断正确？
      options:
        - text: 交叉熵对权重线性部分严格凸，且预测误差 $|p - y|$ 越大时回传梯度越强
          correct: true
        - text: 如果某样本真值为 $y=1$ 而模型误判出 $p = 0.01$，交叉熵回传给该步的梯度会比用均方误差还要微弱得接近于 0
          why: 恰恰相反，交叉熵中预测越错 $|p - y| \approx 0.99$ 推力越强，而 MSE 会乘上接近 0 的 Sigmoid 导数 $p(1-p)$ 导致梯度饱和
        - text: Sigmoid 函数的输出范围固定落在 $(-1, 1)$ 之间，能够同时给出正负号来表示两类特征的协方差比值
          why: $\sigma(z) = 1/(1+e^{-z})$ 严格落在 $(0, 1)$ 之间，用来表示发生正类的后验概率
        - text: 只要不断把训练轮数拉长，不带特征交叉的普通线性逻辑回归也能精确切分出平面同心圆环的内外两圈边界
          why: 未经非线性特征变换或隐层复合的线性逻辑回归决策边界始终只是一条平坦超平面
      explain: |
        交叉熵配合 Sigmoid 让分母上导数相互抵消，留给参数的梯度恰好正比于预测误差 $(p - y)$，避免了 MSE 的 Sigmoid 饱和问题。
    - id: b-kmeans-1d
      type: number
      prompt: |
        一维数据点为 `1, 2, 3, 10, 11, 12`，取 $k = 2$，初始中心分别为 `1` 和 `2` 并运行 k-means 算法直到簇分配不再变化。收敛后，涵盖较大数值那一簇 `{10, 11, 12}` 的最终质心落在了哪个数值上？
      answer: 11
      hint: 第 1 轮右簇为 `{2, 3, 10, 11, 12}`，中心移至 `7.6`；第 2 轮分清为 `{1, 2, 3}` 和 `{10, 11, 12}`。
      explain: |
        第 2 轮完成清晰分割后两簇稳定收敛在 `{1, 2, 3}` 与 `{10, 11, 12}`，右侧簇最终质心为 $(10+11+12)/3 = 11$。
    - id: b-pca-pve
      type: choice
      prompt: |
        对已去中心化二维特征算得样本协方差矩阵 $\mathbf{S} = \begin{pmatrix} 2 & 1 \\ 1 & 2 \end{pmatrix}$。对于用它做主成分分析（PCA）得到的降维结果，哪一项正确？
      options:
        - text: 特征值为 $3$ 与 $1$，第一主成分方向 $\pm\frac{1}{\sqrt{2}}(1, 1)^\top$，解释 $75\%$ 方差
          correct: true
        - text: 第一主成分沿着原始第一坐标轴 $(1, 0)^\top$ 展开，独自保留并解释了原始数据中正好 $50\%$ 的总方差
          why: 非对角协方差 $+1$ 表明两特征正相关，主伸展方向沿 45 度角且抓住了 $3/(3+1) = 75\%$ 的方差
        - text: 因为矩阵主对角线全都是 $2$，所以两个特征值都等于 $2$，无论朝哪一条直线投影所保留的方差都完全相同
          why: 矩阵非对角线项等于 1 而非 0，点云呈倾斜椭圆拉长，两主轴方差比为 3:1
        - text: 用前 1 个主成分降维后做监督回归（PCR），准确率必定高于直接针对 $Y$ 有监督找方向的偏最小二乘（PLS）
          why: PCA 是只看输入 $X$ 的无监督降维，不保证方差最大方向正好就是最解释目标 $Y$ 的方向
      explain: |
        特征分解把协方差拆成互相正交的主轴，最大特征值对应的单位向量方向就是投影方差最大、重构失真最小的直线。
    - id: b-representation-ae
      type: choice
      prompt: |
        从特征表示学习与自编码器的原理角度看，下面哪一组论断准确？
      options:
        - text: 分布式表示用共享语义维度组合表达指数种模式；带窄瓶颈的非线性自编码器沿弯曲流形提炼紧凑特征
          correct: true
        - text: 不带任何瓶颈缩放或稀疏正则的宽自编码器只要学会照抄输入给输出、让重构误差达到 0 就能学出高质量特征
          why: 没有信息瓶颈或正则限制的宽网络只学会了恒等映射，没有完成压缩降噪或有效特征提炼
        - text: 对稀疏 99% 留空的评分表跑低秩矩阵补全迭代时，每一轮必须连同那 1% 的已打分真实条目一起永久覆盖改写
          why: 已有观测值提供低秩结构的锚点，每步只用重构更新未知空格、已知真实条目保持不变
        - text: 相比低维稠密嵌入向量，一万维独热编码能直接通过向量点积大小量度任意两种相似商品的语义距离
          why: 任意两个不同类别的独热向量彼此正交，点积恒等于 0，无法体现相似语义距离
      explain: |
        无论是分布式编码、低秩矩阵分解还是瓶颈自编码器，核心都是在海量观测背后捕捉少数稳定起作用的潜在自由度。
    - id: b-tree-svm-compare
      type: choice
      prompt: |
        对比集成树（随机森林 vs 梯度提升）与支持向量机（SVM）的偏差–方差行为，哪一句描述正确？
      options:
        - text: 随机森林靠去相关降方差；梯度提升靠拟合残差降偏差；SVM 用 $C$ 控制间隔宽窄与错分惩罚
          correct: true
        - text: 随机森林通过要求所有单棵树在分裂时都固定只看第 1 列特征来增大树间相关性，从而平均降方差
          why: 随机森林要让各棵树尽量不一样（降低彼此相关系数 $\rho$），平均之后的方差才会显著下降
        - text: 支持向量机惩罚参数 $C$ 调到接近无穷大时，哪怕训练集中有跨线错分点它也一律放行，从而把间隔拉到最宽
          why: 惩罚权重越大越不允许错分训练点，会把分界安全间隔压窄甚至过拟合边界噪声点
        - text: 决策树对特征的单调递增缩放十分敏感，把正数特征全取对数会让矩形切分出来的样本分组顺序发生根本颠倒
          why: 单调递增变换不改变特征的大小先后次序，决策树的阈值分割天然不受输入单调递增变换影响
      explain: |
        把每种算法和它的关键调节旋钮对应起来：随机森林靠自助抽样与子特征数 $m$ 去相关减方差、梯度提升靠小树轮数与学习率降偏差、SVM 靠 $C$ 与核参数控制间隔和边界复杂度。
    - id: b-cv-leakage
      type: choice
      prompt: |
        一家公司共有 120 条样本，要通过 6 折交叉验证调优岭回归惩罚系数 $\lambda$，并确保全程没有数据泄漏且评估严谨。正确步骤里必须包含下面哪项做法？
      options:
        - text: 每轮仅用该轮 100 条训练子集计算均值和标准差来标准化验证折，严禁跨折或偷看测试集
          correct: true
        - text: 先拿全量 120 条连同封存的独立测试集一起标准化、按相关性挑出 Top-5 特征，然后才拆开做 6 折交叉验证打分
          why: 先偷看全盘测试分布和标签筛特征会把未来信息注进每一折验证里，造成数据泄漏高估成绩
        - text: 若发现所有方案的训练误差只有 1% 而交叉验证误差高达 18%，应该去掉 $\lambda$ 正则项并改用更高次全局多项式
          why: 训练误差很低而验证误差很高是过拟合信号，应增强正则或简化结构而非进一步升高模型容量
        - text: 改用留一法 LOOCV 时，所有 $n$ 个子模型之间重叠样本很少、彼此之间高度无关，因此比 10 折交叉验证方差更低
          why: 留一法的每两次训练都重叠高达 $n-2$ 条同一样本，子模型高度相关，使得平均验证误差的方差反而可能大于 5 折/10 折交叉验证
      explain: |
        防泄漏的准则很简单：测试集只在最后动用一次，而在交叉验证里每一轮算出的任何统计量都必须限于该轮训练折内部。
    - id: b-ssl-pitfalls
      type: choice
      prompt: |
        关于同时使用少量有标签样本和大量无标签样本做半监督学习的适用边界，哪一条判断正确？
      options:
        - text: 低密度或流形假设成立且控制自训练置信门槛时有效；若模型假设误设，加无标签数据反而会降准
          correct: true
        - text: 无论遇上什么数据分布形状，往算法里多塞一万条无标签数据总能稳步拉升验证集准确率，不会出现倒退
          why: 当选用的参数生成假设错位时，大量无标签样本反而会把分类边界越拉越偏
        - text: 协同训练需要构建两组逐字一模一样的特征视角副本，并且要求两份视角在给定标签时保持 100% 相同
          why: 协同训练真正需要的是给定真标签时两个充分视角互相条件独立，才能给对方补充非重叠判断信息
        - text: 只要把自训练伪标签置信阈值设低到 $p > 0.501$，第一轮猜错的标签在后续多轮迭代中都会自动纠正回正轨
          why: 把只比抛硬币略高一点的错猜当成真标签回喂训练集，只会引发确认偏差螺旋放大
      explain: |
        半监督学习基于特征空间的几何结构先验，务必保留一份带真实人工标注的独立验证集核查它确实提升了泛化效果。
