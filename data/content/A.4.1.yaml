skill: A.4.1
version: 2
authors: [main-agent]
brief:
  why: |
    在笔记本里把准确率跑上 95%，离真正稳定上线服务百万用户仍有不小距离：训练与线上特征算法不一致会悄悄降低效果、脏数据涌入没人拦、上线新版本容易弄崩服务、几个月后环境悄悄变了却没察觉。这一关系统打通机器学习工程与 MLOps：从系统全景与数据血缘/模型注册表、无泄漏特征处理与特征存储、可复现训练管线与数据模型自动门禁，到多模式部署与 FastAPI 推理接口，再到数据/概念漂移与 PSI 线上监测。
  outcomes:
    - 说清真实机器学习系统中除模型训练外的工程主干组件，能记录完整数据与模型版本并通过注册表追踪血缘与回滚
    - 掌握无泄漏切分与分布式特征工程原则，借由特征存储消除训练–服务偏差并保障时间点一致特征读取
    - 把探索脚本重构为配置化可测试模块，搭建实验追踪、子群评估与持续训练自动化管线，配套数据与行为门禁测试
    - 合理选型批量、实时与流式服务，规范落地影子部署与金丝雀发布，并用 FastAPI + Pydantic 编写一次加载、带边界校验的最小推理接口
    - 区分数据漂移与概念漂移，会算并正确解读群体稳定性指数（PSI）及布置延迟真值反馈监控告警
terms:
  - term: 参数
    def: '包括模型拟合得到的权重参数、人工设定的超参数，以及运行脚本或接口传入的配置值'
  - term: 函数
    def: '用 def 定义、有名字、可以反复调用的一段代码；给它输入，它执行后返回结果'
  - term: 数据血缘
    def: '记录线上模型权重源自哪一版原始数据快照、哪些特征逻辑、哪段训练代码和哪套参数的全链条可追溯档案'
  - term: 模型注册表
    def: '集中存放已训练模型产物、版本号、性能指标、关联血缘并管理其从测试态升入生产态及一键回滚的中央仓库'
  - term: 特征存储
    def: '统一管理并同时对外提供离线训练批量读取与线上低延迟单点查询的特征数据中心，保证两边特征口径一致'
  - term: 训练–服务偏差
    def: '模型在生产推理阶段收到的特征计算方式或分布与离线训练阶段不一致，导致线上表现明显逊于评估成绩的故障'
  - term: 训练管线
    def: '把数据拉取检验、特征构建、模型训练、子群评估与注册打包成可一键按有向衔接顺序自动执行与重跑的流水线'
  - term: 实验追踪
    def: '在每次训练运行中自动记录代码版本、超参数组合、随机种子、验证指标与产出文件的系统化对比档案'
  - term: 影子部署
    def: '把线上真实请求同步复制一份发给新模型试算以对比效果和延迟，但决不把新结果返回给用户的低风险验证策略'
  - term: 金丝雀发布
    def: '先把极小比例（如 5%）真实用户流量切给新模型，盯紧延迟与错误无异动后再逐步放大流量的渐进上线方法'
  - term: 数据漂移
    def: '生产输入特征本身的分布 P(X) 发生显著偏移，例如用户年龄结构或下单时段分布大幅改变'
  - term: 概念漂移
    def: '同样输入条件下背后的真实规律 P(Y | X) 发生改变，例如利率突变后相同收入群体的违约风险直线上升'
  - term: 群体稳定性指数
    def: '按分桶比对上线真实分布与训练基准分布偏离程度的量化指标 PSI = Σ(aᵢ − eᵢ)ln(aᵢ / eᵢ)'

lessons:
  # =====================================================================
  # 第 1 章：数据/模型版本
  # =====================================================================
  - id: ml-systems-and-versioning
    chapter: 数据/模型版本
    title: 机器学习系统全景、产品定位与数据模型版本控制
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            许多新手以为做机器学习项目 90% 的时间都在调神经网络层数和拟合 `fit()` 代码，然而工业界大型机器学习系统画出来的架构图里，“真正写模型算法的那几行代码”往往只占一个小方块。其余绝大多数工程工作都花在哪些地方了？
          options:
            - text: '数据校验、特征、管线、部署和监控等周边系统'
              correct: true
            - text: '更大的模型结构、更多层数和更复杂的损失函数'
              why: '这些仍然属于“模型代码”那一小块；架构图里占大头的是围绕模型的数据校验、特征、管线、部署和监控。'
            - text: '调参用的超参数表和各种优化器的实现代码'
              why: '超参数和优化器是训练代码的一部分，也在中间那一小块里。'
          explain: |
            模型核心代码只占全系统的一小块；把数据、特征、训练、评测、上线与监控连成稳定闭环，正是机器学习工程与运维的目标。
      - card:
          title: 从产品需求立项到完整机器学习系统骨架
          body: |
            动手写建模代码之前，先定好**产品与业务指标**：问题是否需要**机器学习（ML）**（简单规则够不够），误报、漏报与单次毫秒延迟上限分别是多少，线下 **ROC 曲线下面积（AUC）** 跟线上留存或营收怎么对应。
            围绕业务主线，**机器学习运维（MLOps）**将系统依次衔接起来：原始数据入湖与校验 → 特征提取与共享 → **参数**配置与训练编排 → 自动质量评估 → 在线/离线推理服务 → 日志监控与再训练反馈回流。
      - item:
          id: product-latency-calc
          type: number
          prompt: |
            产品规定风控结账接口的总超时上限是 `80` 毫秒。上游身份鉴权固定消耗 `15` 毫秒，特征存储查库固定消耗 `25` 毫秒，网络序列传输来回耗去 `10` 毫秒。留给模型推理本身计算的最大延迟预算还剩多少毫秒？
          answer: 30
          hint: 从总上限 `80` 里减掉鉴权、特征查询与网络往返耗掉的时间。
          explain: |
            $80 - (15 + 25 + 10) = 30$ 毫秒；如果复杂大模型推理需要 120 毫秒，就算准确率高 1% 也没法满足这个产品场景的实时延迟约束，只能改用轻量化模型或蒸馏。
      - card:
          title: 数据版本、模型元数据与模型注册表（数据血缘）
          body: |
            只用 Git 管住代码远远不够——数据天天增量更新，同一套代码跑在昨天和今天的数据上产出的就是两个不同模型。必须同步管好两类档案：
            - **数据版本**：保留数据集内容指纹（快照哈希）、数据采集来源时间窗、划分边界与清洗规则版本；
            - **模型与实验档案**：锁死代码提交号、超参数、第三方库依赖锁文件、训练数据版本、分群评估指标及模型权重。
            所有产物统一登记进**模型注册表**（分配递增版本号并标记 `staging` / `production` / `archived` 阶段），建立端到端**数据血缘**，线上出故障时能快速回滚并追查受污染的数据源。
      - card:
          title: 例子：一次完整的线上故障追溯与注册表回滚实战
          body: |
            某天凌晨值班发现线上风控模型 `v14` 误杀率从 `0.5%` 突然抬升到 `4.0%`。借助模型注册表与**数据血缘**记录，怎样快速止血并查明原因？
          reveal:
            - title: 第 1 步：快速回滚保住业务，再按血缘顺藤摸瓜
              body: |
                直接在模型注册表里把处于 `production` 阶段标签的流量一键切回上一代稳定版本 `v13`（原状态切换为 `archived`），几秒内恢复正常拦截率。
                接着查 `v14` 在注册表里的档案记录：发现代码哈希和超参数跟 `v13` 一致，只有它关联的训练快照索引更新成了 `dataset_20261119_sha9f3a`——顺着血缘查验该快照，便能发现那天上游合作方把金额单位从“元”错写成了“分”。
      - item:
          id: ml-system-glue-choice
          type: choice
          prompt: |
            在真实的生产级机器学习系统里，“模型训练算法代码本身只占很小一部分比例”这一行业共识主要说明了什么？
          options:
            - text: '模型周边的数据校验、特征一致和监控决定系统能否长期稳定'
              correct: true
            - text: '模型算法不重要，选哪种模型对线上效果基本没有影响'
              why: '这条共识说的是工作量和故障多来自模型周边，不是说模型选择无关紧要。'
            - text: '只要把训练代码写得足够精简，整个系统的维护成本就会随之下降'
              why: '维护成本主要来自数据依赖、配置和管线，训练代码写得再短也省不掉这些。'
            - text: '团队应该先把监控和部署全部做完，再开始训练第一个模型'
              why: '共识不规定先后顺序；常见做法是先用简单基线打通整条管线，再逐步改进各部分。'
          explain: |
            好的模型决定能力理论上限，而围绕它的工程基础设施则决定了系统真实能发挥出的稳定性。
      - item:
          id: registry-metadata-match
          type: match
          prompt: |
            把版本治理里的四个关键要素与它们主要负责追踪、保障的目标配对。
          pairs:
            - ["数据快照哈希", "锁定训练数据当时精确内容与样本划分边界，确保可复现"]
            - ["模型注册表阶段标签", "区分候选验证、生产服务与已退役旧版，支持一键回滚"]
            - ["数据血缘记录", "从线上某版预测权重倒查所关联的数据快照、代码与参数"]
            - ["依赖环境锁定清单", "保证上线推理容器与线下训练使用的数学库版本完全一致"]
          explain: |
            代码 + 数据快照 + 运行环境 + 超参数指标四件套同时入库，才能把一次好实验变成可控的生产资产。
      - item:
          id: versioning-why-choice
          type: choice
          prompt: |
            某团队坚持“每次重训模型都要给训练集做一次原地覆写保存（文件名永远都叫 `train.parquet`），代码和 Git 倒是用得挺熟”。这种做法最大的危险是什么？
          options:
            - text: '数据被覆盖后，既复现不出旧模型，也查不清是哪批数据出了问题'
              correct: true
            - text: 'Git 记录了代码历史，只要回到旧代码就能重新训出同样的旧模型'
              why: '代码能回到旧版本，但训练数据已经被覆盖，输入不同，旧模型无法复现。'
            - text: '覆写只是多占一点磁盘空间，对复现和排查没有实际影响'
              why: '问题不在空间，而在历史数据丢了：既复现不了旧模型，也查不出是哪批数据出了问题。'
            - text: '把几十吉字节的 `train.parquet` 每次直接提交进 Git 就能解决'
              why: 'Git 不适合存大文件，仓库会迅速膨胀；数据应存成带编号的不可变快照，再在代码和实验记录里写下快照编号。'
          explain: |
            代码走 Git，数据配不可变快照哈希与元信息索引，训练产物进注册表，三条线索绑定清楚才不会丢失可追溯性。

  # =====================================================================
  # 第 2 章：特征服务
  # =====================================================================
  - id: data-prep-and-exploration
    chapter: 特征服务
    title: 数据准备、探索分析与无泄漏清理变换
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            准备预测电商下周用户的退货率，数据按订单时间戳排列长达两年。有同事直接把全部两年订单随机打乱切分出 80% 做训练、20% 做验证测试——这样随机混切在真实预测未来上线的任务里会产生什么问题？
          options:
            - text: '未来订单混进训练集，验证虚高、上线下滑'
              correct: true
            - text: '随机切分更公平，验证分数和按时间切分差不多'
              why: '时间数据随机切分会让训练集看到验证日期之后的订单，验证分数偏高，和上线后的真实表现对不上。'
            - text: '训练数据变少导致欠拟合，验证和上线分数都偏低'
              why: '随机切分不会减少数据量；真正的问题是未来信息进了训练集，让验证分数偏高。'
          explain: |
            数据准备先选对切分方式：让训练/验证/测试划分贴合业务发生的时间顺序和实体边界。
      - card:
          title: 切分策略与探索性数据分析（EDA）
          body: |
            数据准备先按业务流向切分：时序任务按时间截止点划分；多样本同属一个主体（如同一说话人或病例）时，按主体编号整组做**分组切分（Group Split）**，不让同一主体跨边。
            接着仅在训练集上做**探索性数据分析（EDA）**：核查缺失比例、极端离群数值、类别不平衡，以及“预测时刻尚不存在”的未来泄漏列。
      - card:
          title: 例子：抓出隐藏的“未来泄漏列”与正确按人分组划分
          body: |
            医院想做一个模型在患者**刚办理入院挂号那一刻**预测他会不会发生术后并发症。数据管理员提供的历史表里有四列字段：`年龄`、`术前血压`、`住院期间总用抗生素天数`、`出院结算总金额`。哪几列不能喂进训练集？
          reveal:
            - title: 为什么“高度相关”的列反而是上线失效的来源？
              body: |
                探索分析时如果发现某几列和目标标签相关性高得反常，很可能是**标签未来泄漏（Target Leakage）**。
                “住院期间用抗生素天数”和“出院结算金额”只有在病人住完院甚至出院后才会形成数字：发生并发症自然用药多、花钱多，训练时拿它当特征能跑出 99% AUC；但在病房刚挂号的那一瞬间要预测时，这两列全为空值（或尚未发生），模型就会失效。合法特征只限“预测时刻之前已确定记录的信息”。
      - item:
          id: eda-before-model
          type: choice
          prompt: |
            开始一个全新的回归或二分类项目并拿到原始表之后，进入正式建模之前最值得优先在探索分析（EDA）和基线流水线里核实哪件事？
          options:
            - text: '先查缺失、离群、类不平衡和泄漏列，再跑一个简单基线'
              correct: true
            - text: '先选一个最强的模型调参，等分数上去后再回头看数据质量'
              why: '数据里的缺失、错单位和泄漏列会让任何模型的分数失真；先看数据，才能判断分数是否可信。'
            - text: '在全部数据（含测试集）上画图找规律，据此设计特征'
              why: '探索分析只能在训练集上做；看过测试集再设计特征，测试分数会偏乐观。'
            - text: '把所有含缺失值的行直接删掉，保证数据干净再建模'
              why: '直接删行可能丢掉大量样本，缺失本身也可能和标签有关；应先看缺失比例和原因，再决定填补还是删除。'
          explain: |
            先摸清数据里的缺失、离群、偏态与泄漏并建立简单基线，后续改进才有稳固对照基准。
      - item:
          id: leakage-time-or-target
          type: choice
          prompt: |
            为银行开发“用户申请信用卡提交那一瞬间自动审单”的欺诈检测模型时，下列哪个输入字段一旦选进训练特征，就属于典型的**未来信息（目标）泄漏**？
          options:
            - text: 申请两周后“是否曾电话确认欺诈”标记或首期账单逾期天数
              correct: true
            - text: 申请人在提交当下表单之前过去 6 个月内的历史银行流水累计消费笔数
              why: 申请时刻之前的过去 6 个月流水已真实发生且实时可得，是合法的特征
            - text: 提交申请当下客户端传入的请求设备名称与所填月收入水平（做训练集对数/截尾变换后）
              why: 申请那一瞬间同步提交的属性在预测当下确定可见（注意对偏态收入仅用训练集参数做对数/截尾变换）
            - text: 申请人提交当前表单时所使用的手机操作系统版本大类
              why: 请求头设备属性在实时审单时即刻已知，没有跨时间未来穿越问题
          explain: |
            判断特征是否合法有一条清晰标准：假设模型正面对线上实时请求，在给出预测结果的那一瞬间，这个值是否已经真实确定存在？
      - item:
          id: group-split-calc
          type: choice
          prompt: |
            语音识别团队录了 `100` 位志愿者的朗读音频，每位志愿者贡献了 `50` 句话（合计 5000 段音频），目的是上线后听懂从未见过的新用户说话。如果没按说话人分组、直接把 5000 段短句随机打散划进训练集和测试集，验证准确率升到了 `98%`，真测全新路人却跌到 `71%`。为什么？
          options:
            - text: '同一人的声音同时出现在训练和测试集；应按说话人分组切分'
              correct: true
            - text: '100 位志愿者太少导致过拟合，换一个更大的模型就能解决'
              why: '更大的模型更容易记住每个人的声音；问题在切分让同一人同时出现在训练集和测试集，测试分数代表不了新用户。'
            - text: '98% 只是偶然，多做几次随机切分再取平均就能得到真实水平'
              why: '每次随机切分都会把同一人的句子分到两边，平均多少次都是同样偏高的分数；要按说话人分组切分。'
            - text: '路人录音环境更嘈杂，和切分方式无关，给训练数据加噪声即可'
              why: '噪声可能有一些影响，但 98% 到 71% 的落差主要来自同一说话人跨越训练和测试集；先按说话人分组切分，才能看到真实水平。'
          explain: |
            有多重观测归属同一个人、设备或病例时，按实体编号执行分组切分（Group Split），避免同一实体跨训练与测试边界。
      - card:
          title: 无泄漏清理变换：统计量只从训练集估计并冻存
          body: |
            把原始字段清干净（填补缺失值、做对数与截尾缩放、计算类别均值编码）时，任何由数据算出的统计量——例如填充中位数、标准化均值 $\mu$ 与标准差 $\sigma$、分箱边界——都**只能在训练集上拟合估计**，随后把这套固定参数原样套用到验证集和测试集上，不能先对全表统一拟合再切分。
      - card:
          title: 例子：对比先全表标准化再切分与先切分再拟合清理变换
          body: |
            假设某特征“月收入（千元）”共有 5 条样本，划分前 4 条为训练集 `[4, 6, 8, 10]`（均值 `7`），第 5 条为测试集极端高收入点 `[47]`。如果错误地把这 5 条混在一起先算全表均值 `(4+6+8+10+47)/5 = 15`，再按这 `15` 去中心化减均值并切出测试集：测试集那条极端值 `[47]` 已经把训练集的中心从 `7` 拉高到了 `15`。正确流程是在切分后只用训练集的均值 `7` 分别去转换训练集和那 1 条测试集。
      - item:
          id: clean-transform-leakage-choice
          type: choice
          prompt: |
            做缺失值填充与数值标准化时，以下哪种做法能在交付测试集评估时避免数据统计泄漏？
          options:
            - text: 先划分出测试集，只用训练集算出的中位数和均值标准差转换测试集
              correct: true
            - text: 先把全量包含测试集的数据合并计算出统一中位数和方差再做 8:2 随机划分切开
              why: 在切分前汇总全盘统计量，等于提前让测试集的极值和分布参与了训练特征工程构造
            - text: 验证集和独立测试集各自单独计算一份自己的均值和标准差来做零均值标准化变换
              why: 测试集每次可能只有少量样本甚至单条推理，并且用两套不同缩放口径会让模型收到的数值尺度与训练阶段错位
            - text: '做 5 折交叉验证时，先在全部训练数据上标准化一次，再切成 5 折'
              why: '这样每一折的验证部分也参与了均值和标准差的计算；应在每一折里只用该折的训练部分拟合，再转换验证部分。'
          explain: |
            把缺失填充、缩放和编码统计量全部封装进只在训练集上 `.fit()` 的转换流水线里，测试集仅调用 `.transform()`。

  - id: distributed-feature-processing
    chapter: 特征服务
    title: 分布式特征计算与数据倾斜处理
    minutes: 10
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            电商平台一天的用户行为日志膨胀到上亿行、几百吉字节。如果想把整张表一口气塞进一台普通电脑内存里用单机脚本按用户编号汇总“过去 7 天点击次数”，程序多半会怎样？
          options:
            - text: '内存耗尽，程序因内存溢出（OOM）崩溃'
              correct: true
            - text: '能跑完，只是慢一些，系统会把放不下的部分换到硬盘上'
              why: '换到硬盘会让读写慢上几个数量级；几百吉字节远超内存时，程序通常还是会因内存耗尽而崩溃或被系统终止。'
            - text: '能顺利跑完，pandas 读文件时会自动分块，不占多少内存'
              why: 'pandas 默认一次把整张表读进内存；只有显式按块读取、自己合并各块结果，才能省内存。'
          explain: |
            当数据规模突破单机**内存溢出（OOM）**上限时，就需要把数据和计算拆分给**分布式处理**集群协同完成。
      - card:
          title: 分布式特征计算：分区拆解与局部预聚合
          body: |
            在 **Spark** 等**分布式处理**框架里，巨型数据表会按时间或主键切成多个分区块交给多台工作节点并行处理：过滤、行内对数缩放等操作各节点独立完成；需要跨节点汇聚（如求全局点击均值）时，先由各节点在本地对各自区块算出局部求和与条数，再汇总合并，尽可能减少全网数据混洗与内存占满风险。
      - item:
          id: distributed-partial-agg-choice
          type: choice
          prompt: |
            用分布式集群对上亿条日志求全体用户的平均点击金额时，为什么推荐先让每台工作节点在本地算出“局部总和与局部条数”后再合并相除，而不是把全部原始记录直接发到同一台节点统一累加？
          options:
            - text: 减少跨节点网络混洗流量并避免单台汇总节点内存爆满
              correct: true
            - text: '各节点先算局部平均值，再把这些平均值取平均'
              why: '各分区条数不同时，局部平均值的平均不等于全表平均；要传局部总和与条数，汇总后再相除。'
            - text: '这样算出的平均值比单机累加更精确'
              why: '两种做法在数学上结果相同；先在本地汇总的好处是网络上传的数据少、单台机器内存不会爆满。'
            - text: '这样完全不需要网络传输，每台节点各自得到全局平均'
              why: '局部结果仍要经过网络汇总到一处才能得到全局平均，只是传的数据少得多。'
          explain: |
            满足可加结合律的统计量（计数、求和、均值的分子分母）应尽量先在局部区块预聚合，减少全表跨网络洗牌。
      - card:
          title: 热点键数据倾斜与两阶段随机加盐聚合
          body: |
            分布式聚合常遇到**数据倾斜（Data Skew）**：真实流量里少数热门大户或刷单爬虫账户可能独占几千万条点击，按 `user_id` 分派节点时所有同键记录全挤到同一台工作机上，其余节点早已空闲，这一台却卡死甚至**内存溢出（OOM）**。
            经典破解策略是**热点键加随机前缀打散与两阶段聚合**：第 1 阶段给超大热点 `user_id` 拼上随机前缀（如 `0..k-1`），把千万条记录均匀分拆给 `k` 台机器分别做局部累加；第 2 阶段去掉随机前缀，把那仅仅 `k` 条中间聚合结果再汇总成该用户的最终总计。
      - card:
          title: 例子：用两阶段随机前缀打散千万级热点账户点击统计
          body: |
            某天有 100 万普通用户各点击 10 次，但第 999 号爬虫账户 `u_999` 刷了 8000 万次点击。如果按 `user_id` 直接分发给 8 台工作机，第 999 号全落进第 3 号机器使其内存爆满。怎样借随机前缀（设 $k = 4$ 个盐桶）解开卡顿？
          reveal:
            - title: 第 1 步：加前缀打散局部求和，第 2 步：去前缀合并
              body: |
                第 1 阶段（局部聚合）：读取原日志时先给热点键 `u_999` 随机贴上 `#0`、`#1`、`#2`、`#3` 四个前缀标签，变成 `u_999#0` 到 `u_999#3`，每份约 2000 万条分配给 4 台机器各自就地算出局部点击数 `[2000万, 2000万, 2000万, 2000万]`。
                第 2 阶段（全局聚合）：剥掉 `#0..#3` 后缀还原成 `u_999`，此时只需要把这 4 个已经汇总好的数字相加，很快就算出精准总计 `8000万`，同时避免任何单节点爆内存。
      - item:
          id: distributed-skew-reason
          type: choice
          prompt: |
            对上亿条用户行为记录做大规模分布式特征聚合作业（按用户编号分组汇总过去 7 天点击次数）时，监控发现 99 台计算节点 1 分钟就全算完了，唯独最后 1 台卡住半小时下不来。最常见的原因与缓解策略是什么？
          options:
            - text: '数据倾斜：热点账户挤在一台；加随机前缀分两阶段聚合'
              correct: true
            - text: '最后那台机器硬件较旧，换一台更快的机器就能解决'
              why: '其他节点 1 分钟完成、这台要半小时，相差几十倍，不是硬件差异能解释的；分到它的数据远多于其他节点。'
            - text: '节点太少，把集群从 100 台加到 200 台就能均匀分摊'
              why: '同一个用户编号的记录总会分到同一台机器，加机器只会让其他节点更空闲，热点仍压在一台上。'
            - text: '网络抖动导致最后一台丢包重传，重跑一次作业即可'
              why: '重跑后热点账户仍会分到同一台节点，拖尾会重现；要处理的是数据分布不均。'
          explain: |
            少数热门或高频账户制造的数据倾斜很常见；用两阶段加随机前缀打散与过滤爬虫，能在等价结果下大幅消除单节点卡顿。

  - id: feature-store-and-skew
    chapter: 特征服务
    title: 特征存储与消除训练–服务偏差
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            算法团队在交互式笔记本里用离线结构化查询语句（**SQL**）从数仓算出“过去 7 天平均消费”训出一个效果良好的推荐模型。结果上线时，后台工程师为了追求速度，自己用另一套后台语言重写了缓存统计“最近一礼拜平均花费”的逻辑。上线后接口照样正常返回状态码（HTTP 200），推荐点击率却莫名下滑。问题出在哪儿？
          options:
            - text: '两套代码的时间窗、时区或缺失值处理不一致'
              correct: true
            - text: '两种语言的浮点精度不同，四舍五入误差让线上效果变差'
              why: '浮点精度差异通常很小；同一个特征被两套代码各写一遍时，时间窗、时区和缺失值处理的差别才会让数值明显不同。'
            - text: '上线后用户行为变了，模型已经过时，需要用新数据重训'
              why: '这是漂移的说法；但这里上线一开始就变差、两边算法是分开写的，应先查训练和线上的特征计算是否一致。'
          explain: |
            特征口径分叉是较难排查的上线问题：程序本身不会抛错崩溃，但线上模型收到的特征数值与训练时口径对齐不上。
      - card:
          title: 训练–服务偏差的三大来源与时间穿越隐患
          body: |
            只要线下训练算的特征和线上推理喂进模型的特征对不上口径，就产生了**训练–服务偏差**。常见来源有三条：
            1. **两套实现代码分叉**：离线 SQL 训模型，后台用另一门语言重写在线逻辑，时区、边界包含或缺失填补悄悄不一致；
            2. **训练用了未来信息（时间点未对齐）**：用全表按用户“今天刚算完的总点击数”回填半年以前的历史样本行，引入未来数据；
            3. **线上分布变化**：哪怕逻辑一字不差，外部环境改变同样会拉大训练与生产偏差。
      - item:
          id: skew-root-cause-choice
          type: choice
          prompt: |
            下列哪项开发习惯最容易直接制造出隐蔽且影响较大的**训练–服务偏差**？
          options:
            - text: 离线 SQL 缺省填 `-1` 且按自然周算，在线另一团队手写缺省填 `0` 且按 168 小时滚动
              correct: true
            - text: 把特征转换与读取逻辑收拢成特征存储里唯一一份共享定义，并记录线上实际送进模型的特征向量留待回溯比对
              why: 唯一共享特征逻辑再配合线上日志一致性检查，恰好是消除训练–服务偏差的规范实践
            - text: 训练完成后导出模型权重，并顺带保留当时估算好均值标准差的参数快照一起打包进推理服务容器
              why: 把训练集统计出来的均值方差跟模型一起冻存并在推理端直接套用，能保持分布标度一致
            - text: 上线前抽出 1000 条真实线上请求，把实时查出来的特征表与离线特征存储回算出来的值做逐字段精度对齐断言测试
              why: 一致性对比测试能提前把潜在单位错位、小数取整或缺失值填充差异在上线前拦截下来
          explain: |
            “同一套特征逻辑 + 冻结缩放参数 + 上线前逐字段对账 + 记录线上实际输入日志”能系统防住偏差。
      - card:
          title: 特征存储与离线/在线 FTI 一致性架构
          body: |
            工程上消除口径分裂常引入**特征存储（Feature Store）**，采用**特征–训练–推理（FTI）三段式架构**——只写**唯一一份**特征逻辑，同时推向两种介质：
            - **离线存储**：留存带时间戳的全部历史快照，按每条样本业务发生时刻做时间点一致的批量提取；
            - **在线存储**：只保留每个主体的最新特征数值，供在线接口按主键低延迟毫秒读取，并把线上实际传入值存回对账。
      - card:
          title: 例子：抓出历史训练拼接时没对齐时间戳的“时间穿越 Bug”
          body: |
            用户 A 在 `10月1日` 首次下单（当时历史累计消费额其实只有 `100` 元），后来又在 `10月15日` 大额买了一台电脑导致截至月末累计总额跳成 `10100` 元。模型打算在 `10月1日` 那单预测时读取“用户历史累计消费额”，应该连成哪个数值？
          reveal:
            - title: 为什么时间点一致连接（Point-in-Time / Time Join）是特征存储的核心？
              body: |
                如果只拿 user_id 做普通等值连接去贴最新的用户累计表，10月1日的历史训练样本就会读进 10月15日之后才涨上去的 `10100` 元。模型在训练里学会“累计超过 1 万的都很活跃”，可真新用户 `10月1日` 首次刚来下单时，线上查到的真实累计额其实只有 `100` 元。
                特征存储会对照主表业务发生时刻与特征计算时间戳，自动做**时间点一致连接（ASOF / Point-in-Time Join）**——只匹配“不晚于 `10月1日` 下单时刻的最近一版有效特征”（`100` 元），避免跨时间错误。
      - item:
          id: feature-store-dual-engines
          type: choice
          prompt: |
            成熟的**特征存储**通常同时维持一个“离线存储”和“在线存储”，以下关于这“一离线一在线”双引擎职责分工的说法哪项正确？
          options:
            - text: '离线存带时间的全历史供训练取数；在线只存最新值供快速查询'
              correct: true
            - text: '离线和在线存储各存一份同样的全历史，只是互为备份'
              why: '两边职责不同：离线保存带时间戳的全历史供训练取数，在线只存每个实体的最新值供低延迟查询。'
            - text: '在线存储负责给训练取数，离线存储负责线上推理查询'
              why: '方向反了：训练从离线存储取历史数据，线上推理从在线存储查最新值。'
            - text: '离线存储只存每个用户的最新特征值，训练时直接拼到历史样本上'
              why: '用最新值拼历史样本，会把样本时刻之后的信息带进训练；离线存储要保留带时间的全历史，按样本时间点取值。'
          explain: |
            同一份特征逻辑双写入（历史全量归离线库、最新数值推内存键值在线库），兼顾了无穿越训练与毫秒读取。
      - item:
          id: point-in-time-join-val
          type: number
          prompt: |
            用户在时间戳 $t = 10$ 秒时下了一单待预测交易。上游特征流先后记录了该用户的信用分快照：`t = 4` 时为 `620`，`t = 9` 时更新为 `650`，`t = 14` 时更新为 `710`。为了不引入未来信息穿越、保持“时间点一致”，构造 $t = 10$ 秒这行训练样本的特征时，应当取进哪个信用分值？
          answer: 650
          hint: 找到时间戳 $\le 10$ 秒、且离发生时刻 `10` 最近的那一版已知快照分数。
          explain: |
            在下单时刻 $t=10$ 这一瞬，`t=14` 时的 `710` 还没发生，而 `t=4` 的 `620` 已被覆盖，当时已确定且最新的一版就是 $t=9$ 写入的 `650`。
      - item:
          id: fti-pipelines-choice
          type: choice
          prompt: |
            用模块化的 FTI（Feature、Training、Inference 三段分离）架构组织大规模机器学习项目时，相比把特征计算、训练和预测揉成一个巨型单体脚本，最主要的工程优势是什么？
          options:
            - text: '三段经特征存储和注册表解耦，可分别更新和扩缩'
              correct: true
            - text: '拆成三段后就不需要模型注册表，推理直接读训练脚本的输出目录'
              why: '拆开以后正是靠模型注册表把训练和推理连起来，推理读取注册表里登记的版本。'
            - text: '三段拆开后，训练和推理可以各自用不同的特征计算公式'
              why: '拆分的前提是特征只在特征管线里定义一次，训练和推理都从特征存储读；公式各写一份正是训练–服务偏差的来源。'
            - text: '三段必须跑在同一台机器上，才能共享内存里的特征数据'
              why: '三段通过特征存储和模型注册表交换数据，可以分开部署、各自扩缩。'
          explain: |
            把特征产出（F）、参数训练（T）与业务服务（I）清晰拆开，大型机器学习团队就能按各自节奏安全协同演进。

  # =====================================================================
  # 第 3 章：训练管线
  # =====================================================================
  - id: reproducible-code-and-quality
    chapter: 训练管线
    title: 从笔记本走向可复现模块、CLI 配置与代码测试
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            实验室阶段大家喜欢在交互式代码笔记本里上下跳着格子执行代码跑通模型——可第 8 格改了个值忘记重运行第 3 格，重启后再跑就会报错或指标变化：要把原型放进自动按天重训的线上流水线，第一步最先该做哪件事？
          options:
            - text: '改成职责单一的模块和由配置文件驱动的脚本'
              correct: true
            - text: '每次运行前点“重启并运行全部”，笔记本就能直接放进线上流水线'
              why: '重启全跑能避免执行顺序的问题，但参数仍写死在格子里，代码难以测试，也不方便让流水线按天自动运行。'
            - text: '把笔记本导出成一个 .py 文件原样运行就够了'
              why: '导出只换了文件格式，全局变量、写死的路径和参数都还在，仍然难以测试和配置。'
          explain: |
            交互式代码笔记本适合早期探索画板，但生产系统需要的是边界清楚、配置文件可控、风格统一且带测试保护的模块化工程脚本。
      - card:
          title: 模块化脚本、命令行入参与配置文件约束
          body: |
            工程化第一步是把**交互式笔记本（Jupyter Notebook）**里的探索格子拆进边界清晰的 Python 模块，对外通过**命令行接口（CLI）**入参（如 `--lr 0.01`）和结构化的 **YAML 配置文件**控制超参数与路径，不写死本机路径或密钥。
            同步落实三项代码规范：给核心**函数**（用 `def` 定义、有名字、可以反复调用的一段代码）写清楚输入形状及作用文档；运行统一静态检查与格式化工具；挂上 **pre-commit 钩子**在提交前拦截语法错误、风格混杂或意外密钥。
      - item:
          id: cli-config-repro
          type: choice
          prompt: |
            把训练参数从硬编码数字抽出来改成 CLI 命令行参数加上版本化的 YAML 配置文件管理，主要收获了哪一项工程收益？
          options:
            - text: '不改代码就能按配置复现实验，也便于自动跑多组参数'
              correct: true
            - text: '参数从配置文件读入后，训练速度会明显变快'
              why: '读配置只发生一次，对训练速度几乎没有影响；收益在复现和自动化。'
            - text: '有了配置文件，就不需要再记录数据版本和代码提交号'
              why: '配置只记录参数；复现一次实验还需要同一份数据快照和同一版代码。'
            - text: '命令行参数能让程序自动选出最佳超参数'
              why: '命令行参数只是把值从外部传进去；选哪组参数仍要靠搜索和验证集比较。'
          explain: |
            代码与配置分离并配合命令行驱动，是打通自动化超参探索和持续重训管线的基础。
      - card:
          title: ML 代码不像普通软件：专测张量形状与“单批过拟合测试”
          body: |
            机器学习代码写错维度或忘记清旧梯度时常不抛运行报错而默默算出无效分数，因此单元测试须增加三项断言校验：
            1. **形状与有限值**：核对输出矩阵尺寸且无 `NaN`/`Inf`；
            2. **权重更新与种子可控**：步进前后确认目标权重真动、冻结权重不变；
            3. **小批过拟合冒烟**：只用 `2` 条模拟样本跑十来步看训练损失能否压向 `0`。
      - card:
          title: 例子：抓出默默不崩溃却学不出规律的无声 Bug
          body: |
            工程师把多分类模型写进正式模块准备批量重训，代码跑了一整晚一万轮无报错崩溃，可验证准确率一直停在接近瞎猜的 `10%`。写测试怎么快速排查出来？
          reveal:
            - title: 用简短的单批过拟合 + 权重变更单元测试定位无声 Bug
              body: |
                写进测试集的一个 3 秒单元测试：生成全零标签和 `4` 条固定假输入，把模型送进 `for step in range(40)` 循环并检查最终损失是否 `< 1e-3`，同时检查步前后权重是否发生更新。
                运行后马上报错定位出问题：前向传播里在进交叉熵损失之前多写了一遍输出 Softmax，等于做完 Softmax 又给函数套了一层重复指数归一。这种无声数值失真靠肉眼不易发现，靠极小样本能否顺利降到零损失的冒烟测试能很快拦出。
      - item:
          id: ml-unit-test-overfit
          type: choice
          prompt: |
            对新写的深度或统计训练脚本做自动化单元测试时，一个不到 `2 秒`、能抓出接线错误、梯度断链等无声错误的常见“冒烟断言测试”是什么？
          options:
            - text: 固定随机种子并用 2 条模拟样本训十来步，确认损失趋近 0、权重更新且无 NaN
              correct: true
            - text: 把学习率临时硬改成 `0`，然后检查训练前后全部网络权重是不是完全没有改变就放行
              why: 学习率为 `0` 时就算反向算子断开权重一样不变；必须用正学习率看着损失能降到近零才算过关
            - text: '在完整训练集上训练一个轮次，检查验证准确率是否高于随机猜测'
              why: '一个完整轮次要几分钟到几小时，不适合每次提交都跑；而且准确率高于随机也抓不出部分梯度断开这类错误。'
            - text: '只运行一次前向计算，检查输出张量的形状是否正确'
              why: '形状正确只说明维度接得上；损失写错、梯度断链时形状照样正确，要看损失能否在几步内降到接近 0。'
          explain: |
            新架构合入主线之前，先通过“2 条数据拟合到近零损失 + 输出尺寸和有限值检查 + 前后步权重更新核查”的快测，能拦截多数无声错。
      - item:
          id: precommit-gate-role
          type: choice
          prompt: |
            把规范检查、格式化与密钥扫描工具放进 **pre-commit** 钩子配置后，主要替机器学习团队解决哪类协作问题？
          options:
            - text: '提交前自动格式化、查语法并拦下误提交的密钥'
              correct: true
            - text: '合并前自动跑一遍完整训练，检查模型准确率有没有下降'
              why: 'pre-commit 在本地提交前运行，只做几秒钟能完成的检查；完整训练和模型评估放在 CI 和后面的自动化流程里。'
            - text: '代替代码审查，装了钩子就不需要同事再看改动'
              why: '钩子只查格式、语法和密钥这类机械问题，设计和逻辑仍需要人来审查。'
            - text: '保证代码上线后不会出现运行时错误'
              why: '格式化和静态检查发现不了大多数运行时错误，这要靠测试和线上监控。'
          explain: |
            自动格式化与提交前检查把低级风格与泄密风险挡在提交之前，让团队更专注模型与数据质量本身。
      - item:
          id: ml-step-assertion-calc
          type: number
          prompt: |
            某个二分类模型单元测验脚本在 `batch_size = 8`、`特征维度 = 16` 的模拟批量上测得输出概率向量应符合“每条样本 2 个互斥类概率之和等于 `1`”。如果断言全批所有 8 个样本的总概率求和 `preds.sum()`，理想容差范围下这个总和应等于多少？
          answer: 8
          hint: 每条样本输出的各类概率加总等于 `1.0`，共有 `8` 条相互独立样本。
          explain: |
            Softmax 保证每条样本预测概率各分量非负且单条加总为 `1.0`，因此 `8` 条样本拼成的 `(8, 2)` 预测矩阵全部概率值之和严格等于 `8.0`——既验证批量维度尺寸正确，也同时验证每行做好了概率归一。

  - id: training-tracking-and-pipelines
    chapter: 训练管线
    title: 训练管线、实验追踪、子群评估与自动化编排
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            一个信用违约预测新版本报告“测试集总体准确率高达 **98%**”，全组以为效果优于旧版。切开看明细却发现：总样本里有 97% 都是本来就不违约的稳健老客户，模型把“刚毕业新入职青年”那一关键小众人群误拦了近 50%。只盯着全集平均总指标看，漏掉了什么关键评估维度？
          options:
            - text: '总分被多数类撑高，掩盖了少数人群上的失败'
              correct: true
            - text: '测试集太小，98% 不可信，把测试集扩大到十倍就能解决'
              why: '问题不在测试集大小，而在 97% 都是不违约的客户，模型全猜“不违约”也有约 97%；要按人群分开看表现。'
            - text: '新入职青年本来就难预测，这部分错判可以接受，看总分即可'
              why: '总分被多数类撑高，掩盖了少数群体上的失败；这些高风险人群恰恰是业务最关心的，应分子群评估。'
          explain: |
            只看全集平均分远远不够；结合实验追踪记录、子群细分评估和有向流水线编排，才能稳妥推进版本升级。
      - card:
          title: 实验追踪与超参数搜索的规范闭环
          body: |
            为了不靠手工表格记录“哪组改动得分最高”，工程体系在每次训练启动时自动开启**实验追踪**：将每次运行的专属编号、全部超参数、Git 提交索引、训练曲线、评估指标和模型产物自动归档并支持并排对比。
            执行自动化超参数搜索（随机搜索或贝叶斯搜索往往比等间隔全网格更能迅速覆盖高敏维度区间）时，只拿交叉验证或验证集挑优，测试集保留至最终评估关口。
      - item:
          id: experiment-tracking-role
          type: choice
          prompt: |
            在训练流程里接好**实验追踪**工具（每次训练自动记下参数、数据版本、代码提交与评估曲线）后，面对几个月前那次表现很好、当下团队想找回重训的场景，它直接给出了什么决定性帮助？
          options:
            - text: '查回那次运行的参数、代码提交和数据快照'
              correct: true
            - text: '自动选出历史上最好的模型并直接部署到线上'
              why: '实验追踪负责记录和比较；上线要经过模型注册表、评估门禁和发布流程。'
            - text: '保证同样的参数每次重训都得到完全一样的分数'
              why: '它记下种子和版本，帮你尽量复现，但消除不了硬件和并行计算带来的微小随机差异。'
            - text: '只要记下了超参数，任何时候都能重训出同一个模型'
              why: '只有超参数不够，还要当时的数据快照和代码提交；实验追踪的价值就在把这些一起记下。'
          explain: |
            自动账本优于口头记忆：实验追踪配合数据版本，团队才能稳定在历史成果基础上推进。
      - card:
          title: 子群评估、概率校准与持续训练（CT）编排管线
          body: |
            模型评估须过三关：**总体指标**（类别不平衡时常看 F1 或 **精确率–召回率曲线下面积（PR-AUC）**）、**核心子群细分**（关键业务客群不退步）和**概率校准**（预测概率 `0.8` 应大致对应八成实际发生）。
            把“拉数 → 验数 → 特征 → 训练 → 评估 → 注册”连成**有向无环图（DAG）**，就构成了自动化**训练管线**：靠编排触发按时运行或由新数据到达唤醒**持续训练（CT）**，单步失败可自动重试与缓存复用。
      - card:
          title: 例子：对照“总体 94% 却把高净值核心客户子群拉低”的门禁表
          body: |
            当前在线旧模型总体准确率 `92%`（其中重点高净值核心客户子群准确率 `91%`）；新候选模型整体准确率涨到了 `94%`，但切开子群评估表发现常规用户升到 `96%`、高净值核心客户子群却从 `91%` 下滑到了 `76%`。如果设置自动晋升门禁，新模型能放行上线吗？
          reveal:
            - title: 为什么关键子群退步一票否决总分微涨？
              body: |
                虽然全体均值从 `92%` 涨到 `94%`，但高净值核心客户子群净下跌 `15` 个百分点——放行可能带来明显客户体验损伤或大额风险。
                成熟团队会在管线末端设明确门禁：**总体核心指标 $\ge$ 线上基准，且所有重点子群不得低于既定底线（如退步不超 1%）**。不达标时自动拦截晋升并输出细粒度分析报告。
      - item:
          id: slice-eval-imbalance-calc
          type: number
          prompt: |
            某 1000 条样本的数据集里包含 `900` 条正常样本（占 `90%`）和 `100` 条高风险欺诈样本（占 `10%`）。新模型对那 900 条正常样本全预测对了（准确率 100%），却把那 100 条高风险样本全猜错了（召回率 0%）。该模型在这批数据集上汇报出的“总体准确率”是百分之多少（填数字如 `90`）？
          answer: 90
          hint: 一共预测对了 900 条，除以总样本数 1000。
          explain: |
            $900 / 1000 = 90\%$，在高不平衡数据集上，就算模型完全没有识别出任何正例也能拿到 90% 的总体准确率——因此子群统计、正类召回率和 PR-AUC 等专项指标不能省。
      - item:
          id: ct-dag-order
          type: order
          prompt: |
            把一套自动化持续训练管线（DAG 编排）中关键阶段的上下游衔接先后次序排正确。
          steps:
            - "拉取最新数据分区快照并检验模式与空值等基本质量"
            - "通过统一特征逻辑做无泄漏划分并计算生成训练验证特征"
            - "按配置启动模型训练并将运行参数和指标写入实验追踪"
            - "做总体、重要业务子群与概率校准对照旧版的门槛评估"
            - "达标后打标签登记进模型注册表并通知下游准备灰度发布"
          explain: |
            先验数再制特征，练完再多维度评估对照、达标才能进注册表准备上线——任何一关报错立即中止，避免坏数据顺着流水线流入生产。
      - item:
          id: random-vs-grid-search
          type: choice
          prompt: |
            如果要同时搜 4 个重要程度非常悬殊的超参数（比如只有学习率高度敏感，另外 3 个参数改动几乎不影响表现），用固定格点的“网格搜索”跑 81 组，与随机撒 81 组点对比，为什么更常推荐**随机搜索（或贝叶斯自适应搜索）**？
          options:
            - text: '网格在关键参数上只试几个值，随机能试 81 个'
              correct: true
            - text: '随机搜索每组运行更快，同样时间能多试几倍的组合'
              why: '两种做法都是 81 组，每组训练时间一样；差别在于采样点在关键参数上分布得更细。'
            - text: '网格搜索会漏掉最优点，随机搜索保证能找到全局最优'
              why: '随机搜索也不保证找到最优；它只是在关键参数上试了更多不同的值，碰到好区域的机会更大。'
            - text: '网格搜索不能用于连续参数，学习率只能用随机搜索'
              why: '网格搜索可以给连续参数取几个格点，只是取值少；随机搜索在同样预算下能取到更多不同的值。'
          explain: |
            事前往往不知道哪些超参数更敏感，全网格在高维下容易在次要维度重复试探，随机加重点加密更高效。

  - id: data-model-checks-and-cicd
    chapter: 训练管线
    title: 数据检查、模型行为测试与 CI/CD 自动化门禁
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            在线情感打分模型测试集准确率一直较高。某天运营把评价页面里的“不错”改拼成大写或后面多加两个空格，模型立刻把它判成了“负面”。另一回上游表新增了一列或者出现年龄 `-5` 岁，管线却没发任何警告继续训练上线。只看“验证集总体平均分”为什么挡不住这类故障？
          options:
            - text: '平均分掩盖了特定输入上的失败，要加数据校验和行为测试'
              correct: true
            - text: '测试集不够有代表性，换一份更大的测试集重算总准确率就能发现'
              why: '平均准确率对少数特定输入的失败不敏感；要针对大小写、空格、非法年龄等情况写专门的数据校验和行为测试。'
            - text: '模型过拟合了，加大正则化重训就能处理大小写和异常年龄'
              why: '正则化不会让模型学会处理没见过的格式；异常值应在进入模型之前就被数据校验拦下。'
          explain: |
            软件工程靠单元和集成测试保证不退步，MLOps 则同样依靠“代码测试 + 数据契约检验 + 模型行为测试”三道自动门禁。
      - card:
          title: 数据验证门禁与三类模型行为测试
          body: |
            数据入库与模型过关须穿过两道自动化门禁：
            - **数据期待测试**：检查缺列、数据类型、业务值域（如年龄 $0 \le x \le 120$）及缺失比例上限，坏数据直接拦截；
            - **模型行为测试**：包含**不变性**（换无关人名或多余空格后结论不变）、**方向性**（单调抬升信用收入时不降低批贷分）与**最小基本功（MFT）**（简单核心基准例全部答对）。
      - item:
          id: behavioral-tests-match
          type: match
          prompt: |
            把上线前的三类模型行为断言测试加上一类数据契约检查，和各自对应的检验实例配对起来。
          pairs:
            - ["数据模式期待测试", "拦截上游突然出现的负年龄、新脏字符类别或超标空值比例"]
            - ["不变性测试（Invariance）", "仅替换句子里的人名或多余空格后，情感分类结论必须维持原判"]
            - ["方向性期望测试", "其余条件不动仅把房贷申请人的稳定收入拉高时，违约风险预测不该不降反升"]
            - ["最小基本功测试（MFT）", "专门检查像“产品满意”这类明确核心基础示例必须答对"]
          explain: |
            只靠大盘 AUC 像只考期末总分；加上数据契约与三类行为测试，等于加测常识边界、抗干扰与逻辑单调性。
      - card:
          title: 持续集成与持续交付（CI/CD）在 ML 中的落地
          body: |
            在成熟团队，每当有人提交特征或训练代码改动，或定期触发新模型产出，都会立刻跑起 **CI/CD 自动化工作流**：
            1. **CI（持续集成）**：自动拉起提交前风格规范检验、模块单元测试、快跑冒烟拟合测试与库依赖安全核验；
            2. **CT + CD（持续训练与自动交付卡点）**：新数据先过数据契约门禁 → 跑完训练与子群对比评估 → 全部通过三类模型行为测试后打版进模型注册表，交由上线编排按影子或金丝雀流程推进，避免人工手贴代码包出错。
      - card:
          title: 例子：抓出“升高信用收入后通过概率下降”的病态模型
          body: |
            贷款审批模型测试集 AUC 从 `0.81` 升到了 `0.83`。但做上线前行为定向门禁检查时，测试员拿同一个申请人记录复制 5 份，只把年收入依次调高（其他条件不变），却发现其中某档高收入算出的通过率下降了 8%。为什么必须拦住它？
          reveal:
            - title: 为什么违反基本业务单调性的模型上线会引爆合规投诉？
              body: |
                造成这反常台阶常是因为数据分箱断层、缺失共线或是模型过拟合了某段稀疏样本。一旦上线，“客户收入更高了，反而被拒绝贷款”既破坏合规可解释性，也可能诱导人故意低报收入钻空子。
                把这个单调性检验变成 CI/CD 自动行为测试门禁的一部分，就能在进入 `production` 前自动红牌叫停并提示添加单调性约束修补。
      - item:
          id: data-expectation-null-calc
          type: number
          prompt: |
            线上某重要“商户分类”字段历史长期稳定。数据校验门禁设定严厉阈值：**缺失值比例不得超过 `2%`**。今天拉到的新一批 `5000` 条训练新快照里统计出共有 `150` 条的商户分类为空值。今天这批数据的缺失百分比是百分之多少（只填数值，如 `3`）？它会被拦下吗？（回答百分数数字）
          answer: 3
          hint: 计算 `150 / 5000` 换成百分比数值。
          explain: |
            $150 / 5000 = 0.03 = 3\%$，已经超过 `2%` 门禁阈值，数据质量门槛会亮红灯暂停自动重训、防止脏特征流进生产模型。
      - item:
          id: cicd-vs-ml-diff-choice
          type: choice
          prompt: |
            和普通纯后台 Web 软件的 CI/CD 工作流相比，机器学习系统的 CI/CD 流程最显著的额外特征是什么？
          options:
            - text: '还要按数据变化触发重训，并过数据和模型行为检查'
              correct: true
            - text: '只在代码改动时触发 CI；模型上线以后就不需要再更新'
              why: '数据分布会变，模型要按新数据或漂移告警重训，这正是 ML 系统多出来的持续训练（CT）。'
            - text: 'CI 在每次提交时跑一遍完整训练，看准确率有没有提高'
              why: '每次提交跑完整训练太慢；CI 做单元测试和小规模冒烟训练，完整训练和评估由训练管线触发。'
            - text: '和普通软件一样只测代码，不需要额外检查数据和模型行为'
              why: 'ML 系统除了代码还依赖数据和训练出的模型，要额外做数据校验和模型行为测试。'
          explain: |
            传统 CI/CD 管“代码变更 → 测试上线”，MLOps 在里面再叠一层“数据与指标变更 → 验数重训 → 行为评估门禁后渐进发布”。
      - item:
          id: mft-vs-drift-why
          type: choice
          prompt: |
            开发完新版客服意图识别模型并跑出总体验证准确率 `93%`（优于旧版的 `91%`）。此时在 CI 自动化流里还运行了 500 条团队精挑细选的“常见核心投诉工单最小基本功测试（MFT）”，发现错误率从旧版 `0%` 升到这次 `12%`（把一些明显要求人工退款的工单判去了自动闲聊）。合理的流水线裁决是什么？
          options:
            - text: '阻止上线：总分略涨，但核心基础功能明显退步'
              correct: true
            - text: '允许上线：总准确率从 91% 升到 93%，说明新版整体更好'
              why: '总分小涨掩盖了核心基础功能的退步，而这些工单正是业务最在意的，应阻断并排查。'
            - text: '允许上线，同时把这 500 条测试的通过线调低一些'
              why: '调低门槛只会让检查失去作用；基本功测试就是用来拦下这类退步的。'
            - text: '放弃新版，以后只看最小功能测试，不再统计总体准确率'
              why: '两类指标各有用处：总体准确率看整体，最小功能测试看关键能力，上线要两者都满足。'
          explain: |
            “既看平均全局进步，又死守核心能力零退步红线”，这才是自动化门禁敢放心自动交付上线的底气来源。

  # =====================================================================
  # 第 4 章：部署
  # =====================================================================
  - id: serving-patterns-and-rollouts
    chapter: 部署
    title: 批量、在线与流式推理选型，及影子/金丝雀发布
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            团队验证出了一代效果更好的新反欺诈模型 `v2`，准备替换线上正在跑的稳定旧版 `v1`。如果直接关掉全部 `v1`、一秒切到 100% 用户全由 `v2` 接管，万一 `v2` 暗藏某种特征口径差异或高并发内存耗尽故障，大量交易会同时受影响。怎么安全、低风险地把新模型推到线上？
          options:
            - text: '先影子部署对账，再让少量真实用户试用（金丝雀发布）'
              correct: true
            - text: '先在离线测试集上再评估一遍 v2，分数没问题就直接全量切换'
              why: '离线测试集看不到线上的真实延迟、流量和输入变化；应先影子部署对账，再小流量试用。'
            - text: '让 v1 和 v2 各接一半真实流量，跑一个月再看哪个更好'
              why: '一下切一半流量风险太大，万一 v2 有问题会影响大量用户；应先影子部署，再从很小的比例开始放量。'
          explain: |
            部署模型既要选对推理形式（批量、流式还是实时接口），也要借**影子部署**与**金丝雀发布**控制上线风险。
      - card:
          title: 批量离线任务、实时在线服务与流式推理对比
          body: |
            按延迟与计算形态选用三类推理方式：
            - **批量预测（Batch Jobs）**：按天或按小时用大作业批算全盘分数存数据库，高吞吐、资源利用率高（适于次日推荐/日报）；
            - **在线实时 API（Online）**：请求到达即在几十毫秒内同步返回，常用**每秒请求数（QPS）**衡量并发负载（适于反欺诈或即时排序）；
            - **流式推理（Streaming）**：持续消费消息流对每条到达消息实时打分响应（如设备实时告警）。
      - item:
          id: batch-vs-qps-throughput
          type: number
          prompt: |
            某个在线实时推荐服务平时每秒要应付 `200` 次并发请求（200 QPS），目前部署在 `4` 个副本进程完全相同、均匀分担请求的服务器集群上。在正常均匀负载均衡的情况下，平均每个服务副本每秒需要独立处理多少个推理请求？
          answer: 50
          hint: 把总每秒请求数 `200` 平均摊到 `4` 个服务进程副本上。
          explain: |
            $200 / 4 = 50$ QPS；如果单进程单核实测最大吞吐能力只有 `60` QPS（且还要留突发翻倍冗余），那至少需要留 `4–8` 个并发副本或靠批量推理预计算分走部分流量。
      - card:
          title: 上线防翻车双保险：影子部署 vs 金丝雀发布
          body: |
            渐进推新有两重可控手段：
            - **影子部署**：仍由旧模型答复全部真实请求，后台把真实请求静默拷贝给新模型试跑对账，对外部用户零风险，验证特征口径与扛压性能（无法直接观察用户看到新结论后的反应）；
            - **金丝雀发布**：先把极小份额（如 `5%`）真实用户交给新模型直接返回响应，盯紧错率和延迟无异动后再逐步扩到 `100%`。
      - card:
          title: 例子：用延迟要求与风险属性敲定某场景的部署与灰度路线
          body: |
            评估两套真实项目需求：
            需求 A：视频平台每天清晨 6 点给全体活跃用户的邮箱发送一封“本周猜你喜欢”精选推荐邮件；
            需求 B：银行应用每次刷卡支付在 `100` 毫秒内判定要不要弹短信二次验证，刚训练出的新版高风险模型从未见过真实线上流量，想先测稳定再逐步过渡。该怎样分别选架构与切流方式？
          reveal:
            - title: 需求匹配：离线定时作业 vs 在线实时服务 + 影子再金丝雀
              body: |
                需求 A 每天清晨才统一发一次，推荐对象可提前几个小时批量预测写好（利用夜里空闲算力、无需搭高并发实时服务，发邮件前还有充足时间检验），适合**批量预测作业**。
                需求 B 必须在支付提交的那一瞬间靠当下这笔交易的实时上下文立刻给结论，因此必须做**在线实时服务**；为了控制风险，先跑几天**影子部署**核查新特征无偏差且 P99 延迟达标，确认无误后切 `5%` **金丝雀发布**放行观察真正线上拦截与用户投诉指标，稳定后再逐步放满全量。
      - item:
          id: batch-vs-online-match
          type: match
          prompt: |
            把这四种实际业务场景与最恰当的推理模式或上线策略配对。
          pairs:
            - ["夜间批量作业预测", "每周五深夜为全量几百万客户重算流失风险评分名单并存入报表"]
            - ["同步在线实时 API", "电商搜索栏敲入关键词时在 50 毫秒内动态重排当下推荐商品列表"]
            - ["影子部署验证", "新模型旁路接真实复制流量计算只写比对日志，不返回给外部用户"]
            - ["金丝雀发布放量", "先挑 5% 真实访问用户直接返回新模型结果，确认无误再扩至 100%"]
          explain: |
            离线大批省资源、实时 API 延迟低，影子验证一致与抗压、金丝雀小步真测用户反馈——按场景合理组合。
      - item:
          id: shadow-vs-canary-diff
          type: choice
          prompt: |
            对比**影子部署**与**金丝雀发布**在验证新上线模型时的本质区别，下列哪一项陈述正确？
          options:
            - text: '影子部署的结果不返回用户；金丝雀会把结果交给少量用户'
              correct: true
            - text: '两者一样，都是把一小部分用户的请求交给新模型并返回结果'
              why: '影子部署收到的是复制的流量，结果只记录、不返回；只有金丝雀会把新模型的结果真的交给用户。'
            - text: '影子部署只用历史日志离线回放，不接触线上实时请求'
              why: '影子部署接的是线上实时请求的副本，所以能看到真实延迟和输入；离线回放是另一种做法。'
            - text: '金丝雀发布不让任何用户看到新模型结果，只在后台对比'
              why: '这是影子部署的特点；金丝雀会把一小部分真实用户的请求交给新模型并返回结果。'
          explain: |
            记住核心差异：影子测“系统负载、真实输入延迟与特征对齐（用户无感知、需双份算力）”，金丝雀测“实际交由新模型做主后的小范围真实用户效果”。
      - item:
          id: canary-rollback-choice
          type: choice
          prompt: |
            刚向生产环境切了 `5%` 流量做金丝雀发布的新模型 `v3` 上线 10 分钟后，监控报警显示这 `5%` 流量里的 HTTP 500 错误率跳升到 `12%`（且平均接口耗时超过 800 毫秒，而旧版稳在 25 毫秒）。此刻最稳妥的第一步运维动作应该是什么？
          options:
            - text: '立即把流量调回 `0%` 退回 `v2`，再离线排查原因'
              correct: true
            - text: '保持 5% 再观察一小时，看错误率会不会自己降下来'
              why: '错误已经在影响真实用户，继续观察只会扩大损失；应先回滚止血，再离线排查。'
            - text: '把流量从 5% 降到 1%，在线上继续收集出错的请求来排查'
              why: '降到 1% 仍有用户收到错误；排查可以用已有日志在离线环境完成，线上应先完全回滚。'
            - text: '直接重启 v3 的服务实例，这类错误一般是临时的'
              why: '错误率和延迟同时升高，多半是代码、依赖或资源问题，重启不能保证解决；先回滚到稳定的 v2。'
          explain: |
            “快速发现问题并一键回退稳态”正是金丝雀切分发布的价值——拿最小可控代价当线上预警哨兵。

  - id: fastapi-inference-service
    chapter: 部署
    title: FastAPI 与 Pydantic 最小在线推理服务实战
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            刚学会用 Python 网络接口框架写 API，有人这样写 `POST /predict` 预测函数：“每收到 1 次用户请求，都在处理函数 `def predict()` 第一行现调用一次 `joblib.load('huge_model.pkl')` 把 500 兆字节的模型文件从磁盘读进内存，算出结果后函数结束再扔掉。”这个服务一上线并发上来就会发生什么？
          options:
            - text: '每次都要重新读取和加载模型，延迟变高、吞吐下降'
              correct: true
            - text: '没有影响，系统会缓存文件，第二次读取几乎不花时间'
              why: '缓存只省掉读硬盘；把文件内容还原成内存里的模型每次仍要重做，大模型每次可能要几秒。'
            - text: '每次读取最新的模型文件，可以随时更新模型，是推荐做法'
              why: '更新模型应通过发布新版本或显式重载完成；每个请求都加载，延迟和资源占用会大幅上升。'
          explain: |
            “模型加载只在进程启动时跑一次、请求到来时复用内存中已有权重计算、再在校验后随同版本号一起返回”——这是在线服务接口的三项核心规则。
      - card:
          title: 最小 FastAPI + Pydantic 在线推理服务的四条核心要素
          body: |
            用 **FastAPI** 与数据校验 **Pydantic** 搭最小推理接口只抓四点：
            1. **启动一次加载**：进程初始化时把模型载入内存，切忌每次请求现读磁盘；
            2. **边界自动校验**：定义继承 `BaseModel` 的输入约束（如 `age: int = Field(ge=0, le=120)`），脏入参直拒返回 HTTP **422**；
            3. **标准标量输出**：把预测转成原生 `float`/`int` 以便按 **JSON 数据格式**稳定序列化；
            4. **随带版本号**：JSON 里返回 `"model_version"` 方便排错追溯。
      - card:
          title: 例子：对照标准 FastAPI 推理代码并在沙盒中逐步跟踪校验逻辑
          body: |
            看下面这段可直接跑起的最小服务代码（涵盖启动预加载、边界检验及带版本号 JSON 输出）：
            ```python
            from fastapi import FastAPI
            from pydantic import BaseModel, Field
            import joblib

            app = FastAPI()
            model = joblib.load("model.joblib")  # 进程启动时加载一次

            class Features(BaseModel):
                age: int = Field(ge=0, le=120)
                income: float = Field(ge=0)

            @app.post("/predict")
            def predict(x: Features):
                p = model.predict_proba([[x.age, x.income]])[0, 1]
                return {"probability": float(p), "model_version": "v3"}
            ```
          reveal:
            - title: '当传入不合规入参 {"age": -5, "income": 10000} 时接口如何处理？'
              body: |
                请求刚到 API 接口门口进入 FastAPI 解析层，Pydantic 检查 `age = -5` 触犯了 `ge=0`（最小不能低于 0）的限制——它不会放这批脏数字继续进到后面的 `model.predict_proba(...)` 模型计算里，而是直接拦截并返回 **HTTP 422** 与指明 `age` 出错的 JSON 提示。
      - item:
          id: api-validate-trace
          type: sim
          sim: trace
          prompt: 下方纯 Python 函数模拟了 `/predict` 的“范围校验 + 对数几率计算概率”流程：请先推演第 8 行的 `p` 与第 12 行的两个返回状态 `r1["status"]`、`r2["status"]` 分别是多少，再单步执行追踪看清正常拦截流程。
          params:
            code: |
              import math
              def predict_one(age, income):
                  if not isinstance(age, int) or age < 0 or age > 120 or income < 0:
                      return {"status": 422, "prob": None}
                  z = 0.02 * age + 0.0001 * income - 2.0
                  p = round(1.0 / (1.0 + math.exp(-z)), 2)
                  return {"status": 200, "prob": p, "ver": "v3"}
              r1 = predict_one(50, 10000)
              r2 = predict_one(-5, 10000)
              s1 = r1["status"]
              p1 = r1["prob"]
              s2 = r2["status"]
              print(s1, p1, s2)
          goal:
            ask:
              - { line: 10, var: s1 }
              - { line: 11, var: p1 }
              - { line: 12, var: s2 }
          explain: |
            第一笔 `(50, 10000)` 合法：`z = 0.02×50 + 0.0001×10000 - 2.0 = 0`，Sigmoid 得 `0.5`，返回状态 `200`；第二笔 `age = -5` 越出合法范围直接返回拦截状态 `422` 而不进入模型计算。
      - item:
          id: startup-load-latency-calc
          type: number
          prompt: |
            某模型纯一次内存推理耗时 `5` 毫秒；而把权重文件从磁盘反序列化读取需要 `495` 毫秒。如果采用错误写法每次请求都重新 `joblib.load()` 一次，每次请求要花 `500` 毫秒；如果按正确设计改为“启动时一次载入”，单个已经启动好的服务平均每秒最多处理多少次单并发串联请求？（算吞吐 `1000 / 单次耗时`）
          answer: 200
          hint: 启动加载完毕后每次请求只消耗纯内存推断的 `5` 毫秒，计算 `1000 / 5`。
          explain: |
            省去每次重复读盘的 `495` 毫秒后，单次耗时降至 `5` 毫秒，每秒可顺畅处理 $1000 / 5 = 200$ 次请求——比每次现读盘的 `2` 次/秒快出 `100` 倍。
      - item:
          id: pydantic-422-why-choice
          type: choice
          prompt: |
            在定义对外推理 API 的输入模型时，专门使用 Pydantic 字段约束如 `age: int = Field(ge=0, le=120)` 和类型校验有什么直接工程好处？
          options:
            - text: '在脏输入进入模型前拒绝请求并返回 `422`'
              correct: true
            - text: '把超出范围的值自动修正到合法范围内，再交给模型预测'
              why: 'Field 约束不会改值，而是拒绝请求并返回 422，让调用方知道输入有误。'
            - text: '有了接口校验，训练数据就不再需要清洗'
              why: '接口校验只管线上请求的格式和范围，训练数据仍要自己清洗。'
            - text: '让模型对合法输入给出更准确的预测概率'
              why: '校验不改变模型本身，只是把无效输入挡在模型之外，避免对脏数据打分。'
          explain: |
            输入用 Pydantic 守门口拒脏值，内存常驻预加载省去重复 I/O，输出带上版本号贴铭牌，最小服务就能很扎实。
      - item:
          id: return-model-version-choice
          type: choice
          prompt: |
            为什么很多生产规范建议在 `/predict` 接口返还 JSON 结果时，额外加上一个字段如 `"model_version": "v3"`（同时内部也记在接口调用日志中）？
          options:
            - text: '多版本并存或事后排查时，能查到是哪个版本做的预测'
              correct: true
            - text: '让调用方在请求里自己选择用哪个版本的模型预测'
              why: '这个字段是返回值，记录这条预测由哪个版本做出；用哪个版本通常由服务端的流量路由决定。'
            - text: '方便接口按版本号缓存预测结果，提高响应速度'
              why: '版本号用于追溯和对比，和缓存无关。'
            - text: 'JSON 格式要求响应带版本字段，否则客户端无法解析'
              why: 'JSON 并不要求这个字段；加它是为了多版本并存和事后排查时能对上版本。'
          explain: |
            金丝雀期间同时有 `v2` 和 `v3` 在跑，响应带版本号就像给每条决策签发编号——多版本对比测试与故障回溯都离不开它。

  # =====================================================================
  # 第 5 章：监测与漂移
  # =====================================================================
  - id: monitoring-drift-and-psi
    chapter: 监测与漂移
    title: 线上日志监控、数据/概念漂移与 PSI 计算
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: |
            线上外卖送餐时长预测模型在三个月前上线时很准，系统界面也始终没有红字报错、接口响应快（全绿 200）。然而客服近期突然接到越来越多的“预估送达不准”投诉：可能同时或分别出了哪两类“软件没有崩溃，模型却越跑越错”的问题？
          options:
            - text: '输入分布变了，同样距离所需的时间规律也变了'
              correct: true
            - text: '接口一直返回 200，说明模型运行正常，投诉多半是用户的主观感受'
              why: '200 只说明服务没有出错，不代表预测仍然准确；输入分布或现实规律变了，模型就会变差。'
            - text: '模型参数在运行中慢慢损坏了，重新部署同一个模型文件就能恢复'
              why: '模型文件在运行中不会改变；变的是进来的数据和现实规律，需要检查漂移并用新数据重训。'
          explain: |
            代码没有故障，但现实世界在流动：区分输入分布变化与底层规律变化，并配合量化指标及时预警，上线运维才算闭环。
      - card:
          title: 生产日志监控与三大监控信号
          body: |
            推理接口必须持久化写下结构化日志（输入摘要、预测分、耗时及关联 `model_version`），从三层视角搭建监控面板：
            1. **系统资源健康**：接口 P95/P99 延迟、并发 QPS 与 422/500 错误率；
            2. **输入输出即时统计**：无需等待真值回流就能立即统计每日特征缺失率和打分分布是否偏移；
            3. **延后真值闭环对比**：等真实结局（如 90 天坏账结果或点击转化）收回后立刻计算真实 F1 并触发再训练告警。
      - item:
          id: delayed-feedback-choice
          type: choice
          prompt: |
            反欺诈或长期贷款坏账模型往往面临一个棘手难题：“今天批出一笔贷，到底会不会坏账往往要等 **90 天后**才能最终收回真实结果标签。”在这漫长等待真实标签的 90 天盲窗期内，线上监控应该靠什么先盯住变化而不至于完全失明？
          options:
            - text: '先监控输入特征、空值率和预测分数的分布，辅以代理信号'
              correct: true
            - text: '90 天内没有标签，只能等真实结果回来以后再评估模型'
              why: '等待期间可以先监控输入特征、空值率和预测分数的分布，以及近期的代理信号，尽早发现异常。'
            - text: '把模型自己的预测当作标签加入训练集，每周重训一次'
              why: '用自己的预测当标签重训会放大原有的错误，模型学不到新信息。'
            - text: '每月按固定计划重训一次，就不需要另外做监控'
              why: '固定重训发现不了突发变化，也无法判断新模型是否更好；仍要监控分布和代理信号。'
          explain: |
            标签虽迟但分布无延迟：用输入与输出分数的即时统计监控守好前线窗口，再拿延后归来的真值完成概念检验闭环。
      - card:
          title: 区分数据漂移与概念漂移，及 PSI 群体稳定性指数公式
          body: |
            线上效果退化分清两类根源：**数据漂移（Data Drift）**指输入特征分布 $P(X)$ 自己迁移（如客群变年轻）；**概念漂移（Concept Drift）**指同样特征对应的真实标签规律 $P(Y\mid X)$ 变了（如加息后相同收入却更易违约）。
            量化输入分箱分布 $a_i$ 与训练基线 $e_i$ 偏离常用**群体稳定性指数（PSI）**：
            $$\mathrm{PSI} = \sum_{i=1}^K (a_i - e_i)\,\ln\left(\frac{a_i}{e_i}\right)$$
            常用红线：**`< 0.1`** 稳定，**`0.1–0.2`** 轻微偏移需关注，**`> 0.2`** 显著变动须核查与评估重训。
      - card:
          title: 例子：完整手算某特征分四桶后的 PSI 并做出重训裁决
          body: |
            某关键特征在离线训练集上均匀划分了 4 个分位桶，预期占比全都是 `25%`（即 $e = (0.25, 0.25, 0.25, 0.25)$）。模型上线运行三个月后，从最新一周生产日志统计这四个同样边界桶的实际占比变成了 $a = (0.10, 0.20, 0.30, 0.40)$。算一算 PSI 到了多少，报警红灯亮没亮？
          reveal:
            - title: 逐桶算出 (aᵢ − eᵢ) · ln(aᵢ / eᵢ) 并汇总判定
              body: |
                依次算出 4 个桶各自对 PSI 的贡献（每一桶都非负）：
                - 桶 1：$(0.10 - 0.25)\ln(0.10 / 0.25) = (-0.15)\ln(0.4) \approx (-0.15)(-0.9163) \approx 0.1374$；
                - 桶 2：$(0.20 - 0.25)\ln(0.20 / 0.25) = (-0.05)\ln(0.8) \approx (-0.05)(-0.2231) \approx 0.0112$；
                - 桶 3：$(0.30 - 0.25)\ln(0.30 / 0.25) = (+0.05)\ln(1.2) \approx (+0.05)(+0.1823) \approx 0.0091$；
                - 桶 4：$(0.40 - 0.25)\ln(0.40 / 0.25) = (+0.15)\ln(1.6) \approx (+0.15)(+0.4700) \approx 0.0705$。
                全部四项相加得 $\mathrm{PSI} \approx 0.1374 + 0.0112 + 0.0091 + 0.0705 = 0.2282 > 0.2$——已跨过显著变动红线，说明人群或输入形态明显往第 4 桶大数迁移，需调查上游业务变故并把最新真实代表样本纳入再训练。
      - item:
          id: data-vs-concept-drift-choice
          type: choice
          prompt: |
            突发宏观经济变化过后，一家电商发现同一批消费金额相同、历史习惯相似的顾客，突然比去年更加倾向于退货并偏爱日用品——即“同样输入特征所对应发生的标签条件分布 $P(Y \mid X)$ 已经悄悄变样”。这属于哪种漂移？
          options:
            - text: '概念漂移：同样输入对应的结果变了，需重训'
              correct: true
            - text: '数据漂移：顾客的特征分布变了，需要重新标准化输入'
              why: '题目说的是特征相同的顾客行为变了，即 $P(Y \mid X)$ 变了，属于概念漂移；只调输入缩放解决不了。'
            - text: '没有漂移，只是季节性波动，等一段时间会自己恢复'
              why: '宏观变化后，同样的输入对应的结果系统性地改变，不能假设会自动恢复，应用近期带标签的数据检查并重训。'
            - text: '训练–服务偏差：线上特征的计算方式和训练时不一致'
              why: '训练–服务偏差是两边计算方式不同；这里特征计算没有变，是现实中输入与结果的关系变了。'
          explain: |
            区分：**数据漂移**看 $P(X)$（输入群体变了），**概念漂移**看 $P(Y \mid X)$（相同输入对应的结果规律变了）；后者需结合最新回流标签监控及时重训。
      - item:
          id: psi-full-calc
          type: number
          prompt: |
            使用公式 $\mathrm{PSI} = \sum_{i=1}^4 (a_i - e_i)\,\ln\left(\frac{a_i}{e_i}\right)$ 检查分布漂移：训练基准四个桶占比均为 $e = (0.25, 0.25, 0.25, 0.25)$，上线实际四个桶占比变为 $a = (0.10, 0.20, 0.30, 0.40)$。已知各桶算出的贡献依次约为 `0.1374`、`0.0112`、`0.0091` 和 `0.0705`。那么总 **PSI** 数值大约是多少？（保留至少三位小数）
          answer: 0.2282
          tolerance: 0.002
          hint: 把四个分桶的非负贡献 `0.1374 + 0.0112 + 0.0091 + 0.0705` 相加即可。
          explain: |
            算得总和 $\mathrm{PSI} \approx 0.2282 > 0.2$，已经超过 `0.2` 警报红线，需要排查分布变化原因并评估重训。
      - item:
          id: psi-threshold-stable-calc
          type: choice
          prompt: |
            对另一项二值分桶特征监测两周，算出它最新的生产分布相对于训练基线的 $\mathrm{PSI} = 0.041$（例如某桶预期 `50%/50%` 实际小幅浮动为 `40%/60%`）。按通用经验阈值解读，当前应该怎么处理？
          options:
            - text: '低于 0.1，属于稳定区间，维持常规监控即可'
              correct: true
            - text: 'PSI 大于 0 就说明分布变了，应立即用新数据重训'
              why: 'PSI 总会因随机波动略大于 0；按常用红线，小于 0.1 视为稳定。'
            - text: '处在 0.1 到 0.2 的轻微偏移区间，需要排查原因'
              why: '0.041 小于 0.1，属于稳定区间。'
            - text: '已超过 0.2 的显著变动红线，应核查数据并评估重训'
              why: '0.041 远小于 0.2，不需要触发重训。'
          explain: |
            合理设定分级响应线（`<0.1` 稳定 / `0.1–0.2` 关注 / `>0.2` 告警），才不至于被正常随机波动频繁误报。

  # =====================================================================
  # 结业挑战
  # =====================================================================
boss:
  items:
    - id: b-systems-skew
      type: choice
      prompt: |
        回顾真实 ML 系统架构和常见工程陷阱：关于“模型代码占比小”以及**训练–服务偏差**成因与预防，哪一句总结准确？
      options:
        - text: '主体在数据、特征、编排、部署与监控；偏差多因线上线下逻辑分叉或时间未对齐'
          correct: true
        - text: '模型代码占比小，说明模型选择对效果影响不大；训练–服务偏差主要由过拟合造成'
          why: '占比小是说工作量和故障多在周边；训练–服务偏差来自线上线下特征计算或时间对齐不一致，不是过拟合。'
        - text: '工程主体在训练代码；训练–服务偏差可以靠加大训练数据量消除'
          why: '工程主体在周边组件；偏差是线上线下特征口径不一致，数据再多也消除不了。'
        - text: '工程主体在数据和运维；训练–服务偏差主要来自高并发时的浮点精度误差'
          why: '前半句对，后半句不对：偏差主要来自两套特征逻辑分叉或时间未对齐，浮点误差一般很小。'
      explain: |
        保证“同一份特征口径 + 严格时间不穿越”，就已经躲开了 MLOps 里一大半工程隐患。
    - id: b-version-registry
      type: choice
      prompt: |
        要实现“线上任何一条不良预测，十分钟内就能查明原因并快速安全退回到稳定版本”，版本治理与**模型注册表**里最关键必须做到什么？
      options:
        - text: '注册表里绑定数据快照、代码提交、锁文件和切片指标'
          correct: true
        - text: '给每个模型文件起带日期的名字，统一存到共享网盘'
          why: '文件名记不下这个模型用的数据快照、代码提交和指标，出问题时查不清原因。'
        - text: '只在注册表里登记模型文件和总体准确率'
          why: '没有数据快照、代码提交和锁文件，就无法复现和定位问题；只看总分也发现不了哪个切片退步。'
        - text: '用 Git 管理全部训练数据和模型文件，回滚时切换提交即可'
          why: '大数据和大模型文件不适合放进 Git；数据用不可变快照，模型放注册表，两边互相记录版本。'
      explain: |
        血缘链不断、状态切换留痕——模型出故障时能在几分钟内退回稳态，才有从容查错和持续演进的基础。
    - id: b-tests-checks-match
      type: match
      prompt: |
        把训练管线中的四项自动化质量把关检查，各自匹配到对应的测试验证动作上。
      pairs:
        - ["单批 2 样本过拟合快测", "几秒内验证网络连线、损失和梯度链路能否压低到近零"]
        - ["数据期待契约检查", "新数据刚进门就核实无负年龄、空值比例未跨红线与字段未丢失"]
        - ["不变性行为测试", "略微替换同义词或人名后确认模型预测结果不会反常剧变"]
        - ["核心业务子群评估", "在整体均分之外单独盯紧少数高风险核心子群防止退步"]
      explain: |
        先验数据，再跑代码快测，接着在综合均分、子群和不变性常识三关都通过后再放入上线候补池。
    - id: b-serving-and-rollout
      type: choice
      prompt: |
        区分三种推理架构并恰当选型灰度切流：下列哪项决策在生产工程中准确？
      options:
        - text: '无需同步返回用批量；需低延迟用在线 API；先影子部署，再金丝雀放量'
          correct: true
        - text: '所有场景都用在线 API 最灵活；新版本先切一半流量对比效果'
          why: '不需要即时返回的任务用批量更省资源；新版本应先影子部署，再从很小比例放量。'
        - text: '低延迟场景提前用批量算好；新版本直接全量上线，出问题再回滚'
          why: '只有输入事先可知时才能提前批量算好；全量上线风险大，应先影子部署、再金丝雀放量。'
        - text: '无需同步返回用批量；需低延迟用在线 API；新版本先金丝雀放量，再做影子部署'
          why: '前两句对，顺序反了：影子部署不影响用户，应在金丝雀之前做。'
      explain: |
        找准延迟场景选架构，分清“影子不返回（测接口稳定与特征一致）”和“金丝雀返回给少数人（验真用户反馈）”。
    - id: b-psi-calc-boss
      type: number
      prompt: |
        线上特征按两个桶监控：离线训练时两桶期望分布为 $e_1 = 0.5, e_2 = 0.5$，本周线上实际监测变成 $a_1 = 0.4, a_2 = 0.6$。已知 $(0.4 - 0.5)\ln(0.4/0.5) \approx 0.0223$、$(0.6 - 0.5)\ln(0.6/0.5) \approx 0.0182$。此时总 $\mathrm{PSI}$ 大约是多少？（保留至少三位小数；据此判断是否小于稳定红线 0.1）
      answer: 0.0405
      tolerance: 0.002
      hint: 将两个分桶各自算得的非负项 `0.0223 + 0.0182` 相加。
      explain: |
        $\mathrm{PSI} \approx 0.0223 + 0.0182 = 0.0405 < 0.1$，低于轻微变化阈值 `0.1`，说明当前特征分布保持稳定。
    - id: b-drift-distinction
      type: choice
      prompt: |
        在产品上线半年后的生产监控大盘上，如何清晰分辨“数据漂移”与“概念漂移”，以及面对延后真值标签该怎样防范失控？
      options:
        - text: '$P(X)$ 变是数据漂移，$P(Y\mid X)$ 变是概念漂移；真值延后时先监控输入输出分布'
          correct: true
        - text: '$P(Y\mid X)$ 变是数据漂移，$P(X)$ 变是概念漂移；真值延后时只能等标签回来再查'
          why: '两个定义说反了；真值延后时可以先监控输入和预测分数的分布。'
        - text: '$P(X)$ 变是数据漂移，$P(Y\mid X)$ 变是概念漂移；真值延后时每月固定重训即可，不必监控'
          why: '定义对，处理不对：固定重训发现不了突发变化，仍要监控输入输出分布，并在真值回流后核查。'
        - text: '两种漂移都表现为接口报错增多，看错误率和延迟告警就能分辨'
          why: '漂移时服务通常照常返回 200，只是预测变差；要看数据分布和带标签的效果指标。'
      explain: |
        实时盯输入输出保前线，回收延后真值验概念，串联持续训练管线定时重练更新，形成生产监控闭环。
    - id: b-fastapi-best-practice
      type: choice
      prompt: |
        检查以下一份极简 FastAPI 在线推理代码骨架的要点时，哪项工程做法必须坚持才能既保性能又保可追溯性与接口健壮？
      options:
        - text: '启动时加载一次；Pydantic 校验并拒绝 `422`；返回原生 `float` 与 `model_version`'
          correct: true
        - text: '每个请求里加载最新模型；用 Pydantic 校验并拒绝 `422` 脏输入；返回 `model_version`'
          why: '每次请求都加载会让延迟和资源占用大增；应在启动时加载一次，换版本通过发布完成。'
        - text: '启动时加载一次模型；把非法输入自动修正到合法范围再预测；返回 `model_version`'
          why: '悄悄修正输入会产生无意义的预测；应拒绝并返回 422，让调用方修正。'
        - text: '启动时加载一次模型；用 Pydantic 校验并拒绝 `422` 脏输入；直接返回 NumPy 类型的概率'
          why: 'NumPy 的数值类型不能直接转成 JSON，要先转成 Python 原生的 `float`；还要返回 `model_version` 以便追溯。'
      explain: |
        单次启动加载 + 门前 Schema 校验防脏输入 + 结果带版本标识，构成了可靠极简 ML 服务 API 的基础规范。
