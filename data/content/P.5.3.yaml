skill: P.5.3
version: 2
authors: [main-agent]
brief:
  why: |
    代码在个人电脑上跑通只是软件生命周期的起点。真正上线给成千上万用户每天使用的服务，需要自动测试与打包上线流水线、与代码分离的配置和基础设施模板、能提前抓出异常的指标与错误预算告警、不中断用户访问的渐进发布策略、过载保护与无责备故障复盘，以及锁死第三方依赖与校验制品来源的供应链防线。本包只假设你学过 Python 基础（P.1.1），带你从零掌握现代 DevOps、持续交付与 SRE 站点可靠性工程的核心算术与实战规范。
  outcomes:
    - 区分持续集成、持续交付与持续部署，写出安全的最小权限 GitHub Actions 流水线完成测试与镜像打包
    - 践行环境变量配置分离与基础设施即代码（IaC），理解可观测性三大支柱（日志、指标、链路追踪）
    - 精准计算 SLI、SLO、30 天错误预算（如 99.9% = 43.2 分钟）与燃烧速率告警，并适配低流量服务场景
    - 运用蓝绿部署、金丝雀发布、功能开关与版本化更新降低发布爆炸半径，并按 N+1 冗余与退避限流应对过载
    - 用 `pip --require-hashes`、`npm ci`、可复现构建（`SOURCE_DATE_EPOCH`）、SLSA 构建溯源与 SBOM 守护软件供应链
terms:
  - term: 持续集成
    def: 开发者频繁把代码合入主分支后，自动触发依赖安装、静态检查、单元测试与构建的工程实践，越早暴露错误修复成本越低。
  - term: 持续交付
    def: 让主分支在每次通过自动验证后随时处于可安全发布状态，但仍保留最后一步人工审批或定时触发再上线。
  - term: 持续部署
    def: 在持续交付基础上连最后发布环节也完全自动化：每次提交只要通过全部自动关卡，就自动推向线上生产环境。
  - term: 分支
    def: 版本控制系统里彼此独立演进的代码开发线（如主干 `main` 或功能开发线），合入主干前应经过自动检查。
  - term: 环境变量
    def: 由运行程序时的操作系统或部署环境注入的键值对配置（如端口、数据库位置、密钥），与程序代码分离存放。
  - term: 基础设施即代码
    def: 用可版本管理、可审计、可重复执行的声明式文本模板（IaC）定义服务器、网络与云资源，取代手工点界面配置。
  - term: 可观测性
    def: 通过系统对外输出的日志、指标与链路追踪三大遥测信号，从外部准确推导出系统内部运行状态与故障根因的能力。
  - term: SLI
    def: 服务等级指标（Service Level Indicator）：用来定量衡量某项服务表现是否良好的真实比例或测量值（例如好请求数占总请求数的百分比）。
  - term: SLO
    def: 服务等级目标（Service Level Objective）：团队在特定统计窗口内为某项 SLI 设定的可靠性目标下限（例如 30 天内可用率不低于 99.9%）。
  - term: 错误预算
    def: 1 减去 SLO 后允许系统在统计窗口内出错或停机的最大余量（如 30 天 99.9% 目标对应的预算为 43.2 分钟），用来平衡迭代速度与稳定性。
  - term: 燃烧速率
    def: 当前错误预算消耗速度相对于“整整一整个周期恰好平均用完预算”基准速度的倍数（例如 10x 代表按当前出错率会在 1/10 周期内烧光全部预算）。
  - term: 蓝绿部署
    def: 同时维护两套环境（当前在线的蓝色旧版与待切入的绿色新版），验证就绪后将流量切换过去，异常时瞬间切回。
  - term: 金丝雀发布
    def: 先把极小比例流量（例如 1%–5%）或内部用户引导到新版实例验证关键指标，确认健康再分阶段放大范围以控制爆炸半径。
  - term: 功能开关
    def: 无需重新部署代码即可在运行期动态开启、关闭或按规则局部放量某项新功能的配置开关。
  - term: 锁文件
    def: 记录每个直接与间接依赖库精确版本号及校验哈希的清单文件，保证开发机、CI 服务器与上线环境装出完全一致的依赖树。
  - term: 构建溯源
    def: 由构建平台生成并附带防伪信息的可验证记录，写清某个成品究竟由哪份代码、在哪套平台通过哪组构建命令产出。
  - term: SBOM
    def: 软件物料清单（Software Bill of Materials）：以机器可读格式列明一个软件成品内部包含的所有第三方组件、版本与依赖关系的完整原料清单。

lessons:
  # ======================================================================== CI/CD
  - id: integrate
    chapter: CI/CD
    title: DevOps 与 SRE 关系、持续集成/交付/部署
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 某团队平时各自在自己电脑写代码，拖到一个月底才集中把十个人的改动凑到一起手工打包上线。每次“大合并周”都全站崩溃通宵救火，开发指责运维环境不行，运维抱怨开发代码太烂。哪一套工程思路能从根源打破这堵墙？
          options:
            - text: 高频小批量合入、自动跑全套测试与构建，并且让开发与运维共担同一套可靠性指标与上线运维责任
              correct: true
            - text: 改成每半年才合并一次代码，且彻底取消所有自动化测试
              why: 拖得越久、单次改动体积越大，合并冲突与隐藏故障呈指数级爆棚，必须小步快跑加上自动关卡校验
            - text: 把运维团队全部锁进地下室，禁止和开发团队说话
              why: DevOps 的核心正是打破“研发只管写完扔过去、运维只管背锅”的隔阂，用自动化流程和共享指标把两方变成一队
          explain: 这就是 **DevOps** 文化和 **SRE（站点可靠性工程）** 共同的起点：把手工救火变成自动化、可度量的日常流水线。
      - card:
          title: DevOps 与 SRE：用工程方法守住可靠性
          body: |
            如果说 **DevOps** 强调拆掉研发与运维之间的高墙、通过自动化文化加速交付，那么 **SRE（Site Reliability Engineering）** 就是 Google 给出的具体工程实现：把运维问题当成软件工程问题来解。

            SRE 反对靠大量重复体力操作人工盯盘，而是设定清晰量化指标、控制变更风险并自动处理故障恢复。
            两者的共同点是用自动化取代重复手工操作、用数据判断系统好坏；区别在于 DevOps 更像文化与协作方式，SRE 则给出量化可靠性目标等具体工程做法。
      - card:
          title: 持续集成、持续交付与持续部署
          body: |
            把改动送给用户的节奏，行业分三层递进：
            - **持续集成（CI）**：开发者每天多次把改动合入共享主**分支**，立即自动拉依赖、跑静态检查与单元测试（“测试左移”早抓虫）。
            - **持续交付（Continuous Delivery）**：CI 之外进一步自动构建打包，使主分支**随时可一键安全发布**，最后点击上线保留人工把关。
            - **持续部署（Continuous Deployment）**：连人工审批这步都自动化——只要全套自动验收通关，改动立即全自动上线。
      - item:
          id: q-ci-cd-match
          type: match
          prompt: 把三个核心自动化阶段与它们各自的准确边界对应起来。
          pairs:
            - ["**持续集成（CI）**", 每次改动提交到共享主分支都立即自动跑测试与集成校验，早发现破坏]
            - ["**持续交付（Continuous Delivery）**", 通过全套验证打包后确保随时具备一键可发布状态，但实际发布仍需人工审批触发]
            - ["**持续部署（Continuous Deployment）**", 全流水线无人工卡点，每次提交只要通过所有自动检查就直接自动推到生产环境]
          explain: 关键区别在于最后一步：“随时能发（靠人点发）”是持续交付；“完全不用人点、过关就发”才是持续部署。
      - card:
          title: 例题：为什么“测试左移”能把上线成本降一个数量级？
          body: |
            假设某团队原本只在周五上线前靠测试人员手动点一遍网页，改用每次提交自动跑 CI 单元测试与风格检查。具体变化拆两步算账：
          reveal:
            - title: 第 1 步：把发现错的时间从“上线前一晚”左移到“改完后 2 分钟”
              body: 写错一行逻辑时开发者大脑里还清清楚楚记得刚刚改了哪里，2 分钟内收到 CI 红灯报错，1 分钟就能顺手修好；若拖到三周后大合并才爆错，往往得翻几十个提交排查一整天。
            - title: 第 2 步：让可发布版本像流水线成品一样小步累积
              body: 持续交付并不是指“每小时强迫上线一百次”，而是保证主分支**始终健康**；即便团队决定每周只发一版，按下发布键的那一刻也只需放出经过每日检验的稳定包，绝不会在周末半夜被迫回滚十个人混杂的大补丁。
                持续集成、持续交付和持续部署三者的区别也正在最后一步：持续集成管合入并自动跑测试，持续交付停在“随时可以发布”并由人决定按不按按钮，持续部署则连发布这一步也交给自动化——能不能做到持续部署，取决于自动化测试是否可靠到足以替代人工把关。
      - item:
          id: q-shift-left-why
          type: choice
          prompt: DevOps 提倡在 CI 阶段尽量落实“**测试左移（Shift testing left）**”，它的真正含义和核心收益是什么？
          options:
            - text: 把单元测试、语法检查和安全扫描尽量提前到开发者刚提交代码（甚至编码阶段）就自动跑，在故障代价最低的早期当场抓出
              correct: true
            - text: 把单元测试推迟到代码合并上线之后的第 2 周再由人工补写，以免拖慢开发者当天的提交速度
              why: “左”指的是软件交付过程时间轴的早期（需求、编码、提交阶段），相对右边则是线上生产运行阶段
            - text: 取消全部单元测试，改由真正在线付钱的用户帮你当场踩坑报错
              why: 拿线上用户踩基础语法和逻辑错是灾难，单元测试应尽量左移拦截低级缺陷
          explain: 测试左移早拦截，配合后文要学的右移在线观察真实流量（金丝雀与遥测），构成完整闭环。
      - card:
          title: 例题：为什么大合并周容易崩溃，小步持续交付更稳？
          body: |
            假设 A 团队每月只合并一次 40 个人的全部修改，B 团队每人每天提交两次 30 行小改动跑自动测试。遇到线上突发缺陷时差别有多大？
          reveal:
            - title: 第 1 步：排查怀疑范围相差百倍
              body: 一次上线包含 400 个修改文件时，任何角落出了故障都像大海捞针，回退其中一人代码还会牵连卡死另外十个人的功能；小步集成时每次只进几十行，一旦报错只需看最后这一小笔提交就能定位。
            - title: 第 2 步：随时可发布的流水线消除半夜抢修
              body: 当每个提交在合并前已经自动装好依赖、跑完单元检验并打包验证过一次，团队对每一次合入都有稳定把握，不再依赖通宵“拼包联调”。
                所谓的“集成”，指的就是每天频繁把各人的小改动合到一起，让代码冲突和接口不兼容在只有几十行的时候就当场暴露并顺手修好，而不是攒成一座大山再一起排雷。
      - item:
          id: q-sre-devops-relation
          type: choice
          prompt: 按照 *The Site Reliability Workbook* 的说法，SRE（站点可靠性工程）与 DevOps 之间最贴切的关系是什么？
          options:
            - text: DevOps 是一套打破研发与运维隔离、强调自动化与共同负责的理念文化；SRE 则是把这套理念落成量化指标、错误预算和工程实践的具体范式
              correct: true
            - text: DevOps 只适用于前端团队，而 SRE 只允许用手工排班盯监控屏幕来替代一切自动化工具
              why: SRE 核心理念就是拒绝纯重复手工救火，改用软件工程手段（指标、自动化工具、容量规则）来管可靠性
            - text: SRE 要求绝对 100.00% 不准发布任何新功能
              why: 过度保守会扼杀业务，SRE 正是通过“错误预算”精准量化“可以稳妥跑多快”
          explain: 记一句话：**DevOps 说“应该拆墙协作并自动化”，SRE 回答“具体用哪些指标和工具来落地执行”**。

  - id: workflow
    chapter: CI/CD
    title: 最小权限 GitHub Actions 流水线与镜像打包
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你在仓库 `.github/workflows/ci.yml` 配了一条自动化测试与构建流水线。为了省事，你没写任何权限限制，默认把仓库最高读写写入权限和秘密令牌都放给了一段可能包含第三方测试脚本的步骤。这种偷懒做法潜藏什么风险？
          options:
            - text: 一旦工作流里某个依赖或外部插件被污染，它就能拿着默认高权限趁机篡改你的代码仓库、乱推假版本或偷走部署凭据
              correct: true
            - text: 因为没有授予写权限会导致 Python 连 `1 + 1` 都算不出来
              why: '跑本地单元测试与打包构建几乎只需要“只读拉取代码（`contents: read`）”，根本用不到向仓库反向写代码的权力'
            - text: GitHub 服务器看到高权限会自动帮你多买十台免费机器
              why: 最小权限原则是流水线安全的第一铁律：只给完成当前任务刚刚好的最小可读权限
          explain: 工作流默认权限太高，一个被污染的依赖或插件就能改代码、推假版本、偷部署凭据。所以下面写一份按最小权限配置的 GitHub Actions 文件。
      - card:
          title: GitHub Actions 触发条件与最小权限
          body: |
            一份规范的工作流文件放在仓库 `.github/workflows/*.yml`，包含三大块：
            1. **触发器 `on`**：例如只在代码合入主干 `main` 时触发，限制范围防浪费与乱触发。
            2. **最小权限 `permissions`**：显式声明 `contents: read`，明确关掉不必要的写权限。
               为什么要这样做？工作流里会运行第三方的动作和依赖包，其中任何一个被人动了手脚，就能用这份工作流拥有的全部权限去改代码、发版本、读密钥；只给 `contents: read`，它最多只能读代码。
            3. **任务与步骤 `jobs -> steps`**：依次检出源码、安装指定版本 Python、装依赖、跑测试、构建容器包。
      - card:
          title: 标准 YAML 实例：推送 main、测试并构建镜像
          body: |
            下面这份完整配置已通过结构验证（动作选用 2026 年主流 v7 版本）：
            ```yaml
            on:
              push:
                branches: ["main"]
            permissions:
              contents: read
            jobs:
              test-and-build:
                runs-on: ubuntu-latest
                steps:
                  - uses: actions/checkout@v7
                  - uses: actions/setup-python@v7
                    with:
                      python-version: "3.12"
                  - run: python -m pip install -r requirements.txt
                  - run: python -m pytest -q
                  - run: docker build -t demo:${{ github.sha }} .
            ```
      - item:
          id: q-gha-permissions
          type: choice
          prompt: '在一条推送 `main` 的 GitHub Actions 自动流水线配置里，显式写上 `permissions: { contents: read }` 的主要目的什么？'
          options:
            - text: 落实最小权限原则：只允许工作流读取仓库代码，防止某个构建脚本意外或被恶意劫持后向 `main` 分支强推修改或打假标签
              correct: true
            - text: 禁止任何用户通过浏览器看这个公开仓库的介绍文档
              why: '`permissions` 只约束 CI 工作流运行期间拿到的临时访问令牌（`GITHUB_TOKEN`）权限范围'
            - text: 让 `pytest` 在运行测试时自动跳过一半失败的测试用例
              why: 测试是否跑满看 `pytest` 与测试代码本身，最小权限锁住的是仓库内容不被流水线意外改写
          explain: 每个工作流默认应该收紧 `permissions`，哪步真要上传产物再单独放开那一步最小所需权限。
      - card:
          title: 例题：为什么构建命令用 `demo:${{ github.sha }}` 而不是只写 `demo:latest`？
          body: |
            注意流水线最后一行写着 `docker build -t demo:${{ github.sha }} .` 而不是永远覆盖同一个 `latest` 标签。背后的工程考虑分两步：
          reveal:
            - title: 第 1 步：每次提交与产出成品一一钉死追踪
              body: "`${{ github.sha }}` 会展开成触发本次运行的完整提交号。万一早上 10 点发布的包出故障，我们能在监控面板一秒看清线上正跑着哪个精确提交编出来的包，也能毫秒级指定回退到昨晚那个提交号对应的旧成品。"
            - title: 第 2 步：若写成可变的 `:latest`，回滚与排错全乱套
              body: 如果每次构建都无脑覆盖 `:latest`，新包把旧包标签顶掉之后，既分不清两台机器上同时跑着的 `:latest` 究竟谁新谁旧，真想紧急退回前一版时也早找不回原来的成品。
            - title: 第 3 步：同时在生产部署里直接锁定容器摘要实现完全不可变运行
              body: 更严谨的生产部署不仅带上提交标签 `${{ github.sha }}`，还会把构建完输出的不可变内容摘要写进部署清单；即使有人意外重新打了同名标签，节点也只按唯一指纹拉取经过验收的正式产物（这正是容器编排衔接点）。
      - item:
          id: q-gha-order
          type: order
          prompt: 请把这条最小权限 Python + Docker CI 流水线里的 `steps` 按合理先后执行顺序排好。
          steps:
            - "`actions/checkout@v7`（把当前提交的代码检出到运行机工作区）"
            - "`actions/setup-python@v7`（准备好指定的 Python 3.12 运行环境）"
            - "`python -m pip install -r requirements.txt` 与 `python -m pytest -q`（装依赖并先跑自动测试）"
            - "`docker build -t demo:${{ github.sha }} .`（全部测试绿灯通过后再打带提交指纹的成品镜像）"
          explain: 先检出源码并配环境，再用测试把劣质改动挡在外面，只有测试全部绿灯后才花算力打包正式成品。
      - card:
          title: 例题：为什么不能测试还没跑通就先提前构建推送成品镜像？
          body: |
            有新手把 `docker build` 与推送成品放在 `pytest` 单元测试前面执行，结果导致了哪些隐患？
          reveal:
            - title: 第 1 步：防止存在明显低级错的残次品污染成品库
              body: 如果还没过单元测试就把成品打标存入制品库甚至触发后续发布流水线，哪怕测试几秒后红灯报错，带缺陷的制品记录已经留下，极易被误拉取部署。
            - title: 第 2 步：尽早失败省掉无谓构建算力与等待时间
              body: 单元测试几秒就能拦下明显拼写和逻辑错，测试失败直接终止流水线，连耗时几分钟的容器镜像打包都不必浪费时间去跑。
            - title: 第 3 步：连同构建日志、提交指纹和依赖安装清单一并归档可追溯
              body: 当工作流所有测试与构建全部绿灯通过后，平台自动把本轮跑过的精确环境版本与构建输出产物清单关联留存，万一几周后回查某版容器包出自哪次校验，一点击提交哈希就能调出当年全套通过纪录。
      - item:
          id: q-workflow-match
          type: match
          prompt: 把 GitHub Actions YAML 文件里的四个关键字段与它们各自的职责配对。
          pairs:
            - ["`on: { push: { branches: [\"main\"] } }`", 仅当主分支收到新提交时才自动触发这条流水线]
            - ["`permissions: { contents: read }`", 将工作流自带的访问令牌锁成只读代码最小权限]
            - ["`runs-on: ubuntu-latest`", 指定由云端托管的全新隔离 Linux 虚拟机跑本次任务]
            - ["`docker build -t demo:${{ github.sha }} .`", 测试通过后构建以本次精确提交哈希命名标记的成品包]
          explain: 看清触发条件、权限边界、隔离运行机、测试关卡与不可变版本标签这五件事，就读懂了现代 CI 的骨干。

  # ======================================================================== 配置
  - id: config
    chapter: 配置
    title: 配置与代码分离：环境变量、验证与变更治理
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一位开发者把测试数据库密码、支付接口密钥和固定域名全硬编码写死在 Python 源码 `app.py` 里，直接提交进了团队 Git 仓库。上线后不仅密码躺在了仓库历史记录里，每想在测试环境试运行一次还得把代码改一遍再重编打包。哪里出了根本问题？
          options:
            - text: 违反了“代码与配置彻底分离”原则：同一份构建产物应当无需改源码就能通过外部配置（如环境变量）跑在开发、预发和生产等不同环境
              correct: true
            - text: 因为 Python 规定文件里面不允许写汉字以外的任何字符串
              why: 问题不在于语言语法，而是“代码应当跨环境不变、随部署环境变化的信息属于配置（尤其是机密口令绝不能进版本库）”
            - text: 只要把文件改名成 `secret_config.py` 一并提交进 Git 仓库别人就看不见了
              why: 只要提交进 Git 仓库历史，克隆代码的所有人（乃至自动化扫描工具）都能直接翻出这串密码
          explain: 同一份构建产物应该不改源码，只换外部配置就能跑在开发、预发和生产环境。SRE Workbook 与 Twelve-Factor 原则都强调：**把容易随环境变的设置、开关和密钥从代码里剥出来放进配置**。
      - card:
          title: 什么是好配置：与代码分离、按环境变量注入
          body: |
            判断某样东西该写进代码还是写进配置，问一句：“同一套程序搬去测试机或生产机运行时，它会不会变？”
            - 会变的（数据库连接目标、第三方 API 密钥、日志级别、外部服务入口、功能配额）全放**环境变量**或受保护的密钥库；
            - 同一份不可变构建成品（Artifact），只换一套外部环境变量就能在不同环境里安全启动，既零泄密又免去重复打包。
            密钥不进代码仓库，就不会随着代码被复制或公开而泄露；反过来，不随环境变的业务规则和默认取值留在代码里一起评审和测试，配置才不会膨胀成第二套程序。
      - card:
          title: 配置的五大工程纪律
          body: |
            光把配置剥出来还不够，大型系统大量灾难恰恰源自“改错一行配置把全站搞挂”：
            1. **人类可读可查**：优先简洁清晰结构，避免嵌套几十层神秘缩写和暗中互相覆盖的魔法默认值；
            2. **变更同样走评审与 CI 校验**：像审查代码一样审查配置改动，并在生效前跑格式与类型/范围检查；
            3. **启动前严格核对必填项**：缺失关键密钥或端口写成负数时立刻拒绝启动报错，别带病跑着拖到半夜才炸；
            4. **支持灰度回滚**：配置变动一样分批推并保留一键退回上一版的记录。
      - item:
          id: q-config-vs-code
          type: choice
          multi: true
          prompt: 正在做一个在线订餐后端项目，下面哪些信息属于应当抽离到外部**环境变量**或密钥系统、绝对不能硬编码写进版本控制源码里的**配置**？（多选）
          options:
            - text: 生产数据库的用户名、密码与连接目标配置字符串
              correct: true
            - text: 支付平台与签名令牌所用的私钥字符串
              correct: true
            - text: 区分当前运行于 `development` 还是 `production` 环境的模式开关与告警阈值
              correct: true
            - text: 计算购物车订单总价 `sum(item.price * item.qty for item in items)` 的核心业务公式函数
              why: 核心业务算术公式在各环境完全一致，本就该作为受单元测试覆盖的程序代码存在
          explain: 随环境迁移会变的设定与所有敏感密钥归配置，不变的核心逻辑归代码。
      - card:
          title: 例题：为什么一次“只改了一行超时配置”也会像改代码一样弄崩系统？
          body: |
            某工程师在晚高峰直接登录线上配置中心，把查询超时 `timeout_ms` 手抖少打了一个零（从 `5000` 改成 `500`）并点立即全量生效，结果全站接口在 10 秒内雪崩。如何按配置纪律治好这个病？
          reveal:
            - title: 第 1 步：配置也走版本库 + 双人评审 + Schema 自动预检
              body: 把可追踪的非密配置写进受版本管理的声明文件里，先由自动校验脚本（Schema 检查）核对 `timeout_ms` 必须在 `[1000, 30000]` 合理区间且类型正确，再找第二位同事看一遍差异并合并。
            - title: 第 2 步：灰度推送配置 + 快速回滚
              body: 不要一次把新配置推给全球 100% 实例。像发布新代码那样先推给 5% 实例观察几分钟错误率与延迟无异常，再推全量；一旦异常立刻回退到上一份带版本号的配置快照。
                另外，数据库密码和 API 密钥等机密凭据绝不写进普通配置文件或代码版本库，而是统一放进受保护的密钥库按最小权限读取，避免跟着配置仓库一起扩散泄露。
      - item:
          id: q-config-fail-fast
          type: choice
          prompt: 一项生产服务依赖环境变量 `PAYMENT_SECRET` 对交易请求做验签。如果部署时运维人员漏填了这个环境变量，程序启动脚本在 `main()` 刚开始时应该怎样表现最好？
          options:
            - text: 立刻在启动阶段校验缺失并返回清晰报错（`Missing required PAYMENT_SECRET`）主动失败退出，拒绝带病上线接流量
              correct: true
            - text: 默默用一个空字符串 `""` 或 `"dev-secret-123"` 当默认兜底继续启动接真钱交易
              why: 在生产环境悄悄退回测试默认密钥会导致伪造签名满天飞，属于灾难级安全漏洞。
            - text: 随机生成一个连服务自己下次重启都会忘记的文本并隐藏不报
              why: 没有一致配置还装作启动成功只会把小配置错拖成大规模线上交易错乱
          explain: 配置检验的铁律叫 **Fail Fast（尽早暴露失败）**：必填项缺失或非法值在启动第一秒或 CI 验证阶段直接拦下，绝不在生产环境拿危险默认值硬撑。
      - card:
          title: 例题：为什么可读、扁平的配置比嵌套十层的“魔法配置”更安全？
          body: |
            某服务的配置支持从默认文件、环境变量、命令参数和远程配置五处静默互相覆盖，还写了层层缩写字段 `c.r.mx_t`。出事时为什么大家不敢动它？
          reveal:
            - title: 第 1 步：清晰的单一来源与完整命名防误解
              body: 按配置的最佳实践，把字段起全称如 `request_timeout_ms` 并附清晰校验注释，避免只有原作者才记得含义的神秘缩写；同时尽量减少隐蔽层级覆盖，在启动日志打印非机密最终生效配置供人一眼核实。
            - title: 第 2 步：把配置变更当作代码变更走评审与对比
              body: 对任意一条调整先跑自动格式与区间校验，再在仓库里展示清晰的修改前后对比（例如把超时从 `3000` 调到 `5000`），配合灰度下发，防止黑夜救火时凭印象误改全站崩盘。
      - item:
          id: q-config-match
          type: match
          prompt: 把下面四种围绕配置工程实践的做法与它们各自解决的问题对应起来。
          pairs:
            - [机密口令与连接串改用环境变量注入, 避免把敏感口令提交进版本库历史，且支持同一构建包跨多环境部署]
            - [CI 阶段对配置做类型与合理数值范围校验（Schema Check）, 在合并和生效前提前拦截写错类型或少打一个零导致的危险阈值]
            - [启动时缺少核心配置立刻拒绝启动报错（Fail Fast）, 防止程序靠危险的默认空值或测试口令带病上线接收真实请求]
            - [配置改动也保留版本历史与分批下发, 让一次手误只影响小批实例，必要时能像回退代码一样秒级还原旧配置]
          explain: 对待配置，必须给予和核心程序代码完全同等级别的审慎待遇。

  - id: iac
    chapter: 配置
    title: 基础设施即代码（IaC）与不可变环境实践
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 初创公司最早只有一台服务器，运维同学每次靠在云控制台网页上一路点鼠标勾选安全组端口、手工 SSH 上去跑七八条安装命令配环境。半年后大促流量暴涨，老板要 10 分钟内再复制出 20 台一模一样的服务器。手工点出来的环境会怎么崩溃？
          options:
            - text: 谁也记不清当初那台老机器顺手点过哪几下勾选、装过哪个临时补丁，新机器和老机器处处“配置漂移”，急忙拷贝出来一半跑不起来
              correct: true
            - text: 云控制台网页创建的机器在重启后会自动清空磁盘，只有命令行创建的机器才能保留数据
              why: 问题不在云厂商限制鼠标点击次数，而在于纯靠人工记忆点出来的状态既不可复现、也没有差异审计记录
            - text: 手工配置的机器天生比文本模板配置的机器算术速度快十倍
              why: 硬件和系统性能完全一样，区别在于能否零偏差、可审查、毫秒级精准批量复制整套环境
          explain: 这就是为什么要从“手工点网页养宠物机器”转向 **基础设施即代码（IaC）**：机器的配置写在代码里，谁都能重建出一模一样的环境。
      - card:
          title: 什么是基础设施即代码（IaC）
          body: |
            **基础设施即代码（Infrastructure as Code）**把原本在云网页里鼠标点出来的虚拟机、数据库、网络安全组、负载均衡器和权限规则，全部写成**声明式文本模板文件**并存进版本仓库：
            - 看懂当前线上有哪些资源：直接看仓库代码；
            - 新增或扩充环境：CI 流水线跑一遍同一个 IaC 模板（用 GitHub Actions 自动校验和下发修改）；
            - 测试环境与生产环境共用同款模板，彻底消除“我测试好好的，生产少了条规则”。
      - card:
          title: 防止配置漂移与原地不改环境思路
          body: |
            靠手工登录机器微调久了，集群里十台机器会悄悄变成十个长相各异的物种，这叫**配置漂移（Configuration Drift）**。

            防漂移的核心两条：
            1. **禁止线上手工乱改**：需要开新端口或改架构，一律改 IaC 模板走评审→CI 自动下发（先 `plan` 预览变更再应用 `apply`）；
            2. **只新建重建不就地补丁**：要升级系统版本时，不再登录老机器就地打补丁覆盖，而是直接按新模板造出全新一台、切流验证后销毁老的。
      - item:
          id: q-iac-why
          type: choice
          multi: true
          prompt: 将原本云控制台手工点的服务器、数据库与防火墙规则全部转成 **基础设施即代码（IaC）** 并纳入 GitHub Actions 自动流水线后，有哪些工程红利？（多选）
          options:
            - text: 测试/预发环境与生产环境可以用同一套模板参数化拉起，大幅减少“测试能跑、上线缺规则”的环境差异坑
              correct: true
            - text: 每一次网络端口放行或规格扩容都有版本库里的修改记录、修改人评审意见和预览差异报告可查
              correct: true
            - text: 遇到故障整片机房不可用时，能按同一份模板在另一片区域迅速重现整套基础设施
              correct: true
            - text: 写了 IaC 模板以后，云厂商就不会再收一分钱服务器费用了
              why: IaC 管理的是自动化、一致性与可追溯性，真正跑起来的云资源仍按所用规格计费
          explain: 环境和建筑图纸一样：有精确图纸（IaC），随时按图盖出十座一模一样的大楼；只靠口头回忆砌砖，盖第二座必出歪斜。
      - card:
          title: 例题：用 GitHub Actions + IaC 安全变更云资源
          body: |
            团队想用 IaC 给某后端加一条只允许内网调用数据库的防火墙规则，直接一改模板就盲目自动强覆盖生产机房风险太大，标准两阶段流程怎么走？
          reveal:
            - title: 第 1 步：提交修改提案阶段先自动 `Plan` 预览差异
              body: 开发者开一条更改分支并在提案阶段触发流水线执行静态语法检查与 `plan`（只读预览），工作流把“将新增 1 条规则、修改 0 个数据库、销毁 0 台实例”的清晰差异清单自动贴在评审讨论区里供同事核对。
            - title: 第 2 步：合并主分支后按审批受控 `Apply` 应用并保留只读隔离
              body: 同事确认“没有误删生产库”并批准合并主分支后，才由受限角色按受保护流程执行应用更新，杜绝人类手滑误点删库或偷偷手动登录云控制台破坏一致性。
      - item:
          id: q-drift-prevention
          type: choice
          prompt: 当团队已经采用 IaC 管理线上集群，某天值班工程师紧急救火时绕过 IaC 仓库直接登录云网页手工顺手改了一条网络防火墙规则，之后一直没回写到模板里。一个月后别人再跑一次原本稳稳的 IaC 流水线，发生了什么？
          options:
            - text: 产生了“配置漂移”：模板里并不知道那条手工紧急放行的规则，下次跑 IaC 对齐状态时可能按模板把它悄无声息覆盖抹掉，再次引发隐蔽故障
              correct: true
            - text: 云网页会自动反过来修改并推送回你电脑里的模板源码文件
              why: 控制台单向人工改动不会自动同步回你的 Git 仓库，必须把一切紧急修正尽快通过 IaC 提案回写进唯一真相源
            - text: 两个不匹配的规则会自动叠加让网速翻倍
              why: 唯一真相源只能有一处，手工破例改线上不回写仓库正是造成“再也不敢跑自动部署”的罪魁祸首
          explain: 一切基础设施变更都应把 **IaC 仓库作为唯一真相源**；哪怕紧急救火手改了，事后第一件事就是补齐 IaC 模板对齐状态。
      - card:
          title: 例题：当某云区域整体断网时，靠 IaC 模板如何半小时在备用区原地拉起全站？
          body: |
            如果团队当初全靠工程师用鼠标在云控制台里慢慢勾选项、手敲了几十条装软件命令才拼出线上集群，一旦该云机房区域彻底断开半天就会束手无策；换成声明式 **IaC** 模板后怎么做灾难恢复？
          reveal:
            - title: 第 1 步：只改一个“目标地域参数”，其余架构声明 100% 原样复用
              body: 因为网络安全组、负载均衡监听规则、数据库主从规格与应用实例数量全部参数化写死在受版本管理的 IaC 模板里，灾难切换时只需把地域变量从 `region-a` 切到 `region-b`，先执行 `plan` 检查拟新建资源清单一目了然无错漏，即可一键在备用区精确拉出一套长相和端口一模一样的全新集群。
            - title: 第 2 步：把“从零拉起备用环境”列入每季度定期消防演习
              body: 从来没在非紧急日子真正从零跑过一遍的灾备模板，真到灾年往往会因某项配额或隐藏手改依赖卡死；每季度让自动化流水线在孤立测试区照模板跑通一次完整新建和销毁验收，就能确保图纸永远真实管用。
            - title: 第 3 步：同时把数据库异步灾备快照与区域域名切换演练串进同一张剧本
              body: 光把无状态计算节点和网段声明式重建好还不够，真实业务还指望用户数据尽快在备用区恢复读写；将最新异地快照恢复检查与入口流量切换检验写进标准灾备手册并自动计时验收，才能做到“半小时恢复全站可用”。
      - item:
          id: q-iac-match
          type: match
          prompt: 把下面三种配置与基础设施管理术语和它们的精准定义配对。
          pairs:
            - ["**声明式 IaC 模板**", 用代码描述“系统最终应该由哪些服务器、网络和规则组成”，由工具自动对比并补齐差异]
            - ["**配置漂移（Drift）**", 线上实际跑着的环境状态因为手工临改补丁而慢慢偏离版本仓库里的原始记录]
            - ["**`Plan` 预览后再 `Apply`**", 正式改线上资源前先让机器算出一份清晰的“拟增删改清单一览”，确认无误删再应用]
          explain: “声明即图纸、先预览后动手、一切走版本控制”让百台千台机器管理起来和管一个项目目录一样稳健。
      - card:
          title: 例题：如何避免 IaC 模板改了半天把线上生产数据库“意外删掉重建”？
          body: |
            新手写 IaC 时修改了某台生产数据库的硬盘加密参数，结果工具在执行变更时为了生效“先销毁旧库再新建一台”导致数据瞬间蒸发。规范怎么防呆？
          reveal:
            - title: 第 1 步：必看 `Plan` 变更计划里的“销毁/替换（Destroy/Replace）”红灯标志
              body: 在人工评审合并任何 IaC 改动前，CI 自动跑 `plan` 把“原地修改（update in-place）”和“删除旧物再造新物（destroy + create）”用醒目红字标出；遇到关键有状态存储资源出现任何销毁提示，必须当场打回改走双写平滑迁移方案，绝不贸然点通过。
            - title: 第 2 步：给核心存储与关键网络加“防误删保护锁”
              body: 所有生产级数据库与主干网络资源在模板里均开启云厂商的删除保护标志（Deletion Protection），即使哪天人工流水线脚本出了罕见偏差，底层平台也直接报错拒绝删除命令，留出双层安全防线。
            - title: 第 3 步：高敏生产 Apply 步骤强制开启环境审批与状态文件锁机制
              body: 当工作流合并后真要应用线上变更时，在生产部署环境配齐两人手动审批确认，同时为 IaC 状态记录开启独占状态锁避免两个人同时改同一套基础架构导致状态踩踏乱套。
      - item:
          id: q-iac-immutable-replace
          type: choice
          prompt: 按照 **只重造不就地覆盖** 的基础设施更新理念，当线上一批应用机器需要升级底层运行库版本时，以下哪种升级做法最不容易留下历史配置残渣与“长歪了”的环境差异？
          options:
            - text: 用更新后的模板与镜像重新创建一批全新实例通过健康检查并切流，确认平稳后再统一销毁旧实例
              correct: true
            - text: 分别登录每台线上正在接流量的老机器，逐台手工执行升级命令原地覆盖旧文件
              why: 在线就地手改极其容易留下历史包冲突、部分机器升级半截失败、且导致集群内部版本参差不齐
            - text: 只升级其中 1 台老机器作为幸运儿，其他 9 台保留一年前的旧运行库
              why: 集群各节点环境不一致会导致请求落在不同机器上出现难以复现的诡异故障
          explain: “只替换重建、不登录手改覆盖”，让每台线上机器永远和模板声明一字不差。

  # ======================================================================== 可观测性
  - id: signals
    chapter: 可观测性
    title: 可观测性三支柱：日志、指标与链路追踪
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 大促当晚用户反馈“点结算按钮转圈 8 秒后报错”，你的监控图只画了一条干巴巴的曲线：“某台机器当前繁忙度 35%”。这既不知道是哪个微服务慢了、也不知道具体哪一行查库超了时。要想从外部准确看穿复杂分布系统的毛病，至少需要哪三类互补信号？
          options:
            - text: 可聚合绘图的数值测量时间序列（指标）、带上下文的离散事件记录（日志），以及串起整条跨服务调用链耗时画面的（链路追踪）
              correct: true
            - text: 只需把所有报错截图用邮件发给客户自己分析即可
              why: 故障分析需要系统自己持续对外输出结构化的遥测数据，靠人工事后瞎猜无异于盲人摸象
            - text: 只要每分钟自动把服务器重启一遍就不需要监控数据
              why: 重启不仅会掩盖真正的根因线索，还会直接踢掉正在支付的用户连接
          explain: 这三大遥测支柱统称**可观测性（Observability）**的基石（OpenTelemetry 标准也按这三类来定义）。
      - card:
          title: 什么是可观测性，以及监控数据来自哪里
          body: |
            传统“监控”往往只检查预先写死的已知红灯（比如“磁盘满了吗”）；**可观测性（observability）**强调系统向外吐出足够丰富的结构化信号，让你即使遇到**从未见过的新奇故障**，也能不用重启或临时打断点，从外部反推出内部到底哪里卡住了。

            数据来源包括系统自身主动埋点上报（白盒监控）以及从外部模拟真实用户发探针请求检查（黑盒监控）。
      - card:
          title: 可观测性三支柱的分工
          body: |
            三种遥测信号各有所长、缺一不可：
            1. **指标（Metrics）**：按时间隔采样或计数汇总的数值（如每秒请求数、错误占比、耗时 P99 分位数）。体积小、适合画趋势大图并用来触发实时告警。
            2. **日志（Logs）**：某具体瞬间发生离散事件的结构化文本/JSON 详情（如 `order_id=91` 支付网关超时报错）。适合查单笔请求具体死因。
            3. **链路追踪（Traces）**：给一次请求贴上统一身份追踪号，记录它经过网关 → 订单 → 库存 → 数据库每一跳各耗时几毫秒，一眼揪出跨服务性能瓶颈。
      - item:
          id: q-three-pillars-match
          type: match
          prompt: 把可观测性三大支柱与工程师在排错时各自回答的核心问题连线。
          pairs:
            - ["**指标（Metrics）**", “整体大盘现在正常吗？”——体积小易聚合的时序数值，适合画仪表盘和算比例触发告警]
            - ["**日志（Logs）**", “14:03:12 这笔具体失败报错到底写了啥细节？”——带时间与上下文字段的离散事件记录]
            - ["**链路追踪（Traces）**", “这 1 次用户下单耗时 3 秒，究竟卡在网关、库存还是数据库那一跳？”——串联跨多个微服务的全链路时间轴]
          explain: 口诀记死：**指标看宏观触发告警，追踪定位跨服务卡在哪一跳，日志钻进该跳看具体报错原文**。
      - card:
          title: 例题：给线上结算变慢事故跑一遍“三支柱联合破案”
          body: |
            晚 8 点大盘突然报警，从 19:55 开始结算接口达标率掉线且耗时 P99 飙到 4 秒。值班工程师按顺序打开三样面板怎么 3 分钟定位？
          reveal:
            - title: 第 1 步：指标定范围，追踪找卡点服务
              body: 工程师先在**指标（Metrics）**图看出只有“创建订单”报错上升、商品浏览完全正常，排除了全网机房断网；接着点开一条慢请求的**链路追踪（Trace）**，发现前两跳只花 12 毫秒，唯独调用外部“优惠券核销服务”那一跳耗时 3,850 毫秒。
            - title: 第 2 步：带 TraceID 精准捞出那一句报错日志
              body: 复制追踪面板里的全局 `trace_id`，一键筛选**日志（Logs）**库，瞬间跳出核销服务日志：`WARN connection pool exhausted waiting for coupon_db (wait=3800ms)`。三大支柱联动把原本全靠猜半天的排查压缩到几分钟。
      - item:
          id: q-whitebox-vs-blackbox
          type: choice
          prompt: 除了让应用程序内部汇报延迟指标和错误日志，SRE 团队还经常从机房外部定期向公开域名发真实 HTTP 探针测试页面能否打开。这两种监控视角的区别是什么？
          options:
            - text: 内部上报是白盒监控（看得到内部队列、依赖耗时与连接堵死细节）；外部探针是黑盒监控（站在真实用户立场验证外部可达性，能捕捉 DNS、防火墙或证书故障）
              correct: true
            - text: 外部黑盒探针会把程序内部每一行 Python 变量全打印出来
              why: 黑盒探针站在外部只能看到外网是否连得通、响应多快和返回对不对，看不到机房内部实现细节
            - text: 有了黑盒探针就绝对不需要记录内部日志和追踪了
              why: 黑盒告诉你“外面用户现在已经打不开了”，白盒立即告诉你“内部究竟是哪个数据库连不上导致打不开”，两者必须互补
          explain: 外部黑盒看症状“真坏没坏”，内部白盒查病因“为什么坏”。
      - card:
          title: 例题：如何把一次用户投诉串联起“指标、追踪、日志”三件证物？
          body: |
            如果网关转发请求时忘记往下游微服务继续透传统一的请求追踪编号，排错现场会瞬间落入“各服务各自喊冤、日志对不上号”的混乱。具体该怎么接通（OpenTelemetry 规范）？
          reveal:
            - title: 第 1 步：请求刚一进边缘网关即刻生成全局统一追踪编号
              body: 无论是用户按下的搜索按钮还是提交订单，入口网关一律检查或分配一个全局唯一 `trace_id`，并在向订单、库存、优惠券和数据库发出每一跳内部调用时原封不动放进标准请求头里一直传下去，同时记下每一跳精确耗时切片（Span）。
            - title: 第 2 步：给时序指标与结构化日志都挂上可联动的上下文维度
              body: 指标记录全局报错比例上升拉响总警报；顺着那一瞬的异常追踪记录找到耗时最长或直接抛错的那一跳微服务；最后用同一串 `trace_id` 在日志平台里毫秒级把跨十台机器散落的现场详情按时间排成一条清晰故事线，彻底告别猜谜式抓虫。
      - item:
          id: q-structured-logs
          type: choice
          prompt: 同样记录一条失败日志，工程实践为什么大力推荐写结构化 JSON 日志（带 `{"level":"error","trace_id":"abc","order_id":91}` 字段）而不是随手 `print("oops fail 91")`？
          options:
            - text: 结构化键值对能直接被日志系统按字段快速检索、精确关联追踪号，并统计各错误码分布，而无需写脆弱的正则到处猜文字
              correct: true
            - text: 因为电脑硬盘根本存不下不带大括号的普通英文句
              why: 纯文本日志照样占存储且很难靠工具稳定切分解析“到底哪个数字是订单号、哪个是报错耗时”
            - text: 写了 JSON 日志就自动再也不用写任何单元测试了
              why: 结构化日志大幅提升线上可观测与排障效率，依然需要测试提前拦错
          explain: 记住：日志不只是给人眼看的，更是给成千上万条汇总查询与聚合工具检索的——带统一 `trace_id` 的结构化日志是排障利器。
      - card:
          title: 例题：为什么高负载下监控不能保存“每笔请求完整全量文本日志”作图表？
          body: |
            假设某服务每秒有 5,000 次成功请求。若把每一次请求的完整输入输出都用日志逐条长期保存并拿来直接扫全表画延迟曲线，为什么会拖垮成本与速度？
          reveal:
            - title: 第 1 步：用轻量化时序指标（Metrics）承接全量统计
              body: 把每次耗时压缩进直方图计数器，不管每秒 5,000 次还是 50,000 次请求，传向指标系统的只是几个汇总分位数值，几乎不占额外带宽与磁盘，就能实时秒级画出 P99 曲线与触发告警。
            - title: 第 2 步：日志与追踪采用“错误优先与按比例采样”
              body: 正常成功链路只需按 1%–5% 抽样保留追踪轨迹；一旦碰到 5xx 报错或耗时超 2 秒的异常请求（尾采样），立刻 100% 完整记下结构化详情与全链路踪迹，既省出百倍存储又不错过任何一条现场证据。
      - item:
          id: q-trace-sampling-cost
          type: choice
          prompt: 在每秒几万次请求的高并发在线系统里，为了控制 **链路追踪（Traces）** 和详尽调试 **日志（Logs）** 带来的存储与带宽成本，常见工程做法是什么？
          options:
            - text: 用轻量聚合指标承担 100% 全量趋势与告警计算，而对高开销链路追踪采取低比例抽样加上对报错/慢请求的优先保留策略
              correct: true
            - text: 干脆关掉所有错误日志和一切监控统计，等客户投诉了再去猜
              why: 关掉全部遥测等于盲飞；按信号特长分工采样才兼顾了“全盘不漏警”与“成本可控”
            - text: 把普通指标曲线也写进几百 MB 文本文件发给全公司每人邮箱
              why: 时序指标本身极省空间且专为高速聚合查询设计，不应当用低效冗余文本替代指标存储
          explain: 三大支柱各有经济适用区：指标全量聚合低开销、追踪定性抽样加错误保底、日志专抓离散关键故障上下文。

  - id: monitor
    chapter: 可观测性
    title: 监控核心信号、预期变更与依赖观测
    minutes: 12
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一位运维给服务器配了一整面墙几十张监控图表：磁盘温度、每秒硬件切换次数、每个网卡包的详细分布……结果真正上线发布时，新版本悄悄把所有结算请求都返回了 `500`，整面墙却全绿没任何主要告警。挑选有效监控指标应该紧盯哪几个与用户直接相关的黄金视角？
          options:
            - text: 紧盯面向服务流量状态的“流量、错误、延迟、饱和度”核心信号，加上刻意变更事件、关键外部依赖表现与队列积压情况
              correct: true
            - text: 指标图数量越多越好，把 500 个互相重复的底层数字全设为半夜响铃告警
              why: 冗余噪声只会让值班工程师疲惫麻木（告警疲劳），反而会漏掉真正影响用户的大故障
            - text: 只收集底层机器的磁盘硬件温度与风扇转速计数，不采集业务接口的 HTTP 错误率与延迟分位数
              why: 与用户服务请求直接相关的延迟、错误率和资源饱和度才是定位线上异常的抓手
          explain: 监控要 **有目的（Purposeful Metrics）**：少而精地盯住服务状态、饱和度、依赖和有意变更。
      - card:
          title: 有意变更、外部依赖、饱和度与流量状态
          body: |
            高质量监控围绕四个维度展开：
            - **服务流量状态**：用户到底拿到多少正常响应、多少错误响应与延迟；
            - **饱和度**：连接池或队列离塞满还剩多少余量，比平均忙碌更早预警崩溃；
            - **外部依赖**：下游库或支付接口的成功率与超时；
            - **预期变更**：在曲线图上标出每次上线和配置更改竖线。
      - card:
          title: 管理监控系统与测试告警逻辑
          body: |
            监控系统本身也是线上软件，同样需要靠机制保障可用：
            1. 监控规则和告警阈值应当**放进版本控制并自动测试（Testing Alerting Logic）**，拿历史故障样本或模拟注入故障跑一遍，验证该响的时候真会响、恢复后会停；
            2. 删除长期没人看、永远没响过或响了也不需要采取任何行动的废规则；
            3. 监控采集本身不能把业务服务器拖垮，监控管线与业务库要做好隔离。
      - item:
          id: q-four-dimensions-match
          type: match
          prompt: 把四个监控关键维度与它们各自的排错洞察对应起来。
          pairs:
            - ["**服务流量状态（Status of Served Traffic）**", 从真实请求视角衡量有多少失败（5xx）、多少超时与分布延迟]
            - ["**饱和度（Saturation）**", 看数据库连接池或等待队列离“100% 彻底堵死”还差几毫米，提前预警雪崩]
            - ["**外部依赖（Dependencies）**", 区分清楚到底是自家业务逻辑写炸了，还是下游第三方短信/支付接口拖垮了你]
            - ["**预期变更标记（Intended Changes）**", 在指标曲线图上叠出“14:05 发布新版 / 14:10 改配置”竖线，秒级建立因果线索]
          explain: 当服务在 14:06 突然掉线，图上那条“14:05 部署 v2.8”的变更事件竖线往往能帮你省下 90% 的猜谜时间。
      - card:
          title: 例题：为什么“平均占用 45%”的机器依然可能在队列上卡死？
          body: |
            值班同学看主面板写着“机器平均忙碌 45%”，觉得稳得很，却不断收到用户超时报错。用**饱和度与核心信号**一查原因分两步看：
          reveal:
            - title: 第 1 步：平均值掩盖了单个关键瓶颈资源已 100% 饱满
              body: 机器总体有 16 个计算单元，平均忙碌看似才 45%；但数据库连接池上限只设了 20 条，这 20 条连接已经 **100% 占满（饱和）**，后来的请求全都在排队干等拿连接。
            - title: 第 2 步：盯饱和度与尾延迟，并给告警规则写测试验证
              body: 监控加上“等待队列长度 / 连接池占满率”与 P99 尾延迟（最慢那 1% 请求花了多久），并在测试环境中用脚本注入一段连续报错序列，确认告警引擎能按预期精准触发与恢复。
      - item:
          id: q-monitor-self-check
          type: choice
          prompt: 团队编写了几十条 Prometheus / 监控告警规则后，怎样做才能防止“平时看着全绿，真出大故障那天告警规则写错了字完全没响”？
          options:
            - text: 把告警规则纳入版本控制并编写自动化规则单元测试，用模拟故障指标时间序列喂给告警引擎验证它会按预期精确触发和恢复
              correct: true
            - text: 永远不去验证告警，等真正全站宕机两个小时客户打爆电话时顺便看看响没响
              why: 告警和备份一样——从来没验证演练过的告警规则，在危急关头往往根本指望不上
            - text: 永远不在测试环境校验告警规则语法，只在每年线上发生真实P0事故时顺便看一眼告警有没有响
              why: 验证告警逻辑完全可以在离线单元测试或沙箱回放历史指标序列里安全自动完成，无需拿生产服务冒险断电
          explain: 告警脚本也是生产代码——**版本化 + 自动化规则单元测试**能把“坏了的报警器”提前修好。
      - card:
          title: 例题：为什么一定要在监控图上标出“预期变更（Intended Changes）”竖线？
          body: |
            周二下午 15:02，商品详情页的 5xx 错误率突然从 0.01% 笔直跳到了 3%，紧接着 15:05 大家手忙脚乱猜了 20 分钟到底是机房波动还是外部攻击。加上变更标记后能快多少？
          reveal:
            - title: 第 1 步：CI 发布、配置更新与扩缩容一律向监控画布打点标线
              body: 每当生产流水线完成一次新版本推流、运维切换了一条功能开关或者集群触发了自动扩缩容，都自动往监控面板打上一条带改动人和版本说明的垂直标记线；这样任何人一眼就能看见“15:01:40 刚把排序模块升到了 commit-9f2a，紧接着 20 秒后错误曲线就猛蹿”。
            - title: 第 2 步：先把最近这笔“嫌疑最大的关联变更”退回止损，再查细节
              body: 正是因为有时间对齐的变更事件竖线，值班员不必把几十个无辜下游全排查一遍，立刻果断先把 15:01 那次上线拨回旧版，2 分钟恢复全站绿灯后再慢条斯理看 `commit-9f2a` 到底改坏了哪一行条件判断。
      - item:
          id: q-purposeful-alert
          type: choice
          prompt: 某团队设了一条半夜叫醒值班人员的紧急电话告警：“单台服务器忙碌度瞬间高于 80% 就半夜发短信叫醒人”，结果每周半夜吵醒值班 20 次，每次起来一看所有用户请求都在 20 毫秒内正常完成，根本不用干任何事。按“有目的的监控”原则，这条告警该怎么处置？
          options:
            - text: 把无效噪声告警降级为仅记录或直接删除，改按真正影响用户达标与消耗错误预算的速度来叫醒真人
              correct: true
            - text: 保持不变，同时再多雇十个值班人员专门半夜起来接这些无事发生的电话
              why: 只靠堆人接虚假告警只会造成严重告警疲劳，最终真出大事时大家也会误以为又是假警报而延误处理
            - text: 把机器强制降频让它在 85% 时彻底卡死这样告警就不算假了
              why: 要修正的是不合理的噪声告警规则，而不是蓄意弄坏健康服务器
          explain: 一条值得把工程师从睡梦中吵醒的紧急告警必须满足三个条件：**真实可感知用户受损、需要立即人为干预、能直接采取恢复动作**。
      - card:
          title: 例题：为什么“监控系统本身”和“告警规则”也需要像线上软件一样管理与隔离？
          body: |
            曾有事故中业务机房断网，而团队把告警中心恰好装在同一个出事集群里，结果全网都瘫痪了却发不出一封告警邮件。如何规避这种尴尬？
          reveal:
            - title: 第 1 步：把监控存储与发信通道和业务生产机房物理隔离
              body: 监控采集代理虽在业务侧轻量化运行，但核心时序存储、告警评估器与短信通知网关必须部署在独立故障域里，甚至叠加一台外部机房的极简黑盒拨测器（死信哨兵），确保主站全灭时依然能发出最后一道求救电话。
            - title: 第 2 步：给监控平台自身建立自检“心跳（Dead Man's Switch）”
              body: 让告警平台每隔几分钟向外部独立看门狗发一次正常“存活心跳”。一旦连续 5 分钟外部没收到这条正常心跳信号，哪怕一条业务警报也没弹，外部看门狗也会立刻拉响警报通知工程师“监控系统自己先挂了”。
      - item:
          id: q-monitor-isolation
          type: choice
          prompt: 为什么不能把监控评估与发告警系统全部塞在和业务服务器完全同一批故障域里、共用同一个数据库？
          options:
            - text: 一旦业务集群或那套共享数据库发生大面积连带故障，监控报警本身会和业务一起盲掉失声，必须在故障域上对监控基础设施进行隔离解耦
              correct: true
            - text: 因为监控系统采集的数据格式与普通业务数据库不兼容，物理上无法写进同一个数据库实例
              why: 故障域隔离（Fault Isolation）保障“当主业务大厦停电时，消防报警铃自带独立备用电池照样响亮”
            - text: 因为数据库语法不允许同时保存两张不同名字的表
              why: 物理和网络故障域隔离与数据库能否建表无关，关键在于主系统崩盘时不能连带拖哑了告警器
          explain: “别把消防警铃和着火机器接在同一条易烧断的保险丝上”，这是运维基础设施高可用的第一原则。

  # ======================================================================== SLO
  - id: indicator
    chapter: SLO
    title: 从零定指标：SLI 与 SLO 的选取和计算
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个团队骄傲地宣称：“我们要对公司所有服务承诺 **100.000% 绝对全年零故障**。”但一位资深 SRE 马上摇头反对这个目标。为什么追求“100% 永不出错”在工程上不仅不现实，还会直接拖死产品？
          options:
            - text: 追求 100% 可用性意味着几乎不敢做任何版本升级或架构变更，而且用户端本身网络与设备也达不到 100%，硬投入极高成本却换不来用户能感知的收益
              correct: true
            - text: 因为电脑算不出小数点后面全是零的数字
              why: 问题不是数学写法，而是最后那百分之零点几到 100% 之间的投入呈无限增大飙升，且完全窒息了正常开发进化空间
            - text: 因为如果达到 100%，法律规定团队成员全部自动下岗
              why: 工程上需要的是**刚刚好让用户满意（如 99.9%）**，并把剩下那 `0.1%` 留作功能发布与实验的合法容错余量
          explain: 这就是为什么 SRE 要围绕“**怎么用定量指标衡量服务健康**”以及“**该定多高的可靠目标线**”展开理性管理。
      - card:
          title: 用公式看懂 SLI 与常见指标类型
          body: |
            **SLI（服务等级指标）** 最标准的写法就是“**良好事件数 ÷ 有效事件总和**”：
            - **可用率/成功率 SLI**：`返回非 5xx 正常响应的请求数 ÷ 有效用户请求总和`。例：收到 `1000` 个请求里出了 `2` 个故障，好事件是 `998`，SLI = `998 / 1000 = 99.8%`（和 `1996 / 2000 = 99.8%` 同比例）。
            - **延迟 SLI**：`耗时 <= 250ms 的好请求数 ÷ 有效请求总和`。

            注意剔除明显由客户端输入写错导致的 `400/404`，集中看真正反映用户体验的服务端健康度。
      - card:
          title: 怎么选定起步 SLO 目标
          body: |
            定 **SLO（服务等级目标）** 绝不是拍脑袋喊个“五个九（99.999%）”：
            1. **先量后定**：对照近几个月的真实历史 SLI，定在用户刚好觉得好用且团队不用天天加班救火的水准（例如用户完全感知不到偶发 1 次闪断时，定 **99.9%** 远比硬冲 99.99% 明智）；
            2. **SLO 必须略低于内部理论上限、高于对外 SLA 合同赔偿线**：给自己留出提前反应和止损的缓冲余地。
      - item:
          id: q-sli-fraction-calc
          type: number
          prompt: 某接口在一分钟内共收到 `2000` 个有效请求，其中服务器端返回 `500` 错误 `4` 个，其余全部正常成功。该分钟的可用率 **SLI** 是百分之多少？（填入精确小数，如 `99.8` 代表 99.8%）
          answer: 99.8
          explain: 好事件数 = `2000 - 4 = 1996`；SLI = `1996 / 2000 = 0.998 = 99.8%`（与每 `1000` 次错 `2` 次结果一样）。与目标 SLO `99.9%` 相比，该分钟实测 `99.8% < 99.9%`，说明正在超额消耗预算。
      - card:
          title: 例题：同样错 `2` 个请求，为什么小样本和高并发差异天壤之别？
          body: |
            假设某天两个接口同样出了失败请求：接口 A 收到 `1000` 请求错 `2` 个，接口 B 收到 `20` 个请求错 `2` 个，谁更值得警惕？按比率定义算两步：
          reveal:
            - title: 第 1 步：先分别算出“好事件 ÷ 有效总事件”比率
              body: 接口 A 的 SLI = `(1000 - 2) / 1000 = 0.998`（即 `99.8%`，略低于 `99.9%` 目标）；接口 B 的 SLI = `(20 - 2) / 20 = 0.90`（即 `90.0%`），错误率暴增至 `10%`。
            - title: 第 2 步：同时看清哪些请求才算进“有效事件”
              body: 制定计算口径时，爬虫瞎扫根本不存在路径造成的 `404` 或用户少填字段造成的 `400` 通常不计入服务端故障分子；只有服务端自己崩溃（`5xx`）或超过可用延迟阈值才扣分，这样算出来的 SLI 才真实可信。
      - item:
          id: q-sli-slo-match
          type: match
          prompt: 把可靠性指标体系里的三个高频缩写概念与它们各自的角色准确匹配。
          pairs:
            - ["**SLI（Indicator）**", 对系统真实运行表现的定量测量比例（如“过去 1 小时好请求占有效总请求的 99.8%”）]
            - ["**SLO（Objective）**", 团队内部追求并围绕它排期发布节奏的可靠性目标线（如“30 天周期内 SLI 须不低于 99.9%”）]
            - ["**SLA（Agreement）**", 写进对外商业合同里的承诺底线与违约赔偿条款，通常设定得比内部 SLO 更宽松留余地]
          explain: '**SLI 是实测仪表盘读数，SLO 是内部努力守住的及格线，SLA 是对外合同赔钱线**（SLO 必须比 SLA 严格，才能赶在赔钱之前自己先警觉救火）。'
      - card:
          title: 例题：为什么把 `400/404` 用户写错请求排除出“服务器失败率 SLI”之外？
          body: |
            假设某服务一分钟收到了 `1,000` 条外部请求，其中 `50` 条是爬虫瞎撞不存在路径引起的 `404`、另外 `2` 条是后端数据库超时返回的 `500`。这分钟可用率 SLI 怎么界定才公道？
          reveal:
            - title: 第 1 步：区分“服务器故障责任”和“合法拒绝恶意或无效入参”
              body: 如果把爬虫胡乱撞路径造成的 50 个 `404` 也算作服务挂了，可用率看似跌成了 `94.8%` 立刻拉响无意义警报，其实你的后端每一步都完好运行。因此规范的可用性 SLI 通常只统计真正代表服务自身故障的 `5xx` 及网关内部超时失败作为坏事件，不因为外来爬虫乱访问惩罚自家研发指标。
            - title: 第 2 步：但若某天 `400` 骤增十倍，也要靠独立辅助监控防前端发版传错参
              body: 排除出可用率 SLI 并不意味着对客户端报错视而不见——如果刚刚发布的前端网页意外拼错了必填参数名导致全体真用户连续吃 `400`，面向业务漏斗或客户端埋点的监控同样会立刻暴露异常，各司其职互不搅浑。
      - item:
          id: q-not-100-percent
          type: choice
          prompt: 为什么 SRE 实践普遍主张对绝大多数普通网络服务设定 `99.9%` 或 `99.95%` 这样的 **SLO**，而不是咬死追求 `100%`？
          options:
            - text: 接近 100% 所需的硬件冗余和变更停滞成本呈陡峭飙升，而且客户端 Wi-Fi 与运营商本身就不可能 100% 不抖动，适当留出余量才能安全持续更新产品
              correct: true
            - text: 因为数学上 `100%` 大于 `1`，而服务器不喜欢大于 1 的整数
              why: '`100% = 1` 本身数值合法，拒绝 100% 目标是出于用户边际感知收益与持续演进空间的现实工程权衡'
            - text: 因为定了 99.9% 就可以理直气壮把数据库全部删掉
              why: 99.9% 的余量只允许极其有限的短暂故障（30 天里才 43.2 分钟），旨在平衡发布新功能的合理风险，绝非纵容敷衍质量
          explain: 给系统定一个“**让绝大多数用户察觉不到异常、又允许团队持续发新版**”的科学 SLO，比空喊 100% 永不出错高明得多。
      - card:
          title: 例题：为什么测量 SLI 尽量选“客户端近端或边缘网关”而非只看后端函数内部？
          body: |
            假设某天负载均衡器证书过期，用户在浏览器里 100% 连不上网站报错，但后端业务机房因为根本没收到任何流量，内部监控却显示“成功处理率 100%”。怎么定测量位置？
          reveal:
            - title: 第 1 步：越靠近真实用户入口，指标越贴近真实体感
              body: 优先在负载均衡入口、API 网关或搭配外部真实用户端侧采样统计 SLI，这样域名劫持、入口限流错杀或网络证书失效才不会从你的统计分母里隐形逃脱；同时可补充多条关键业务动作分别度量（比如“登录”和“结算”拆开）。
            - title: 第 2 步：同时补足延迟分布与起步阈值校对
              body: 仅看“有没有报 500”还不够——如果一个网页每次转圈 15 秒才勉强吐出 HTTP 200，用户早把标签页关掉了。因此现代核心服务通常同时制定“可用性（不出错）”与“响应速度（如 99% 请求 <= 300ms）”两套双柱 SLI/SLO，且对照前三个月真实基准定下合理起步线。
            - title: 第 3 步：定期每季度回看 SLI 与真实客诉工单是否匹配
              body: 如果大盘全月显示绿油油的 `99.95%` 达标、客服邮箱却天天被“打不开/转圈太久”挤爆，说明当前挑选的 SLI 根本没测在用户痛点上，应当立刻修正测量点或收紧延迟门槛。
      - item:
          id: q-sli-latency-good-event
          type: choice
          prompt: 团队除了设置“可用率 99.9%”外，还要为商品详情页加一条“延迟 **SLI**”：规定单次接口在 `300ms` 内完整返回才算良好体验，目标要求 `99%` 请求达标。一小时共 `10,000` 个有效请求里，有 `9,920` 个耗时 <= 300ms、`80` 个耗时在 `350ms–900ms`。这小时延迟 SLI 达标了吗？
          options:
            - text: 达标：`9,920 / 10,000 = 99.2%`，高于 `99.0%` 的延迟 SLO 目标，仍在正常余量内
              correct: true
            - text: 没达标：只要有哪怕 1 个请求慢于 300ms 就算全站彻底失败
              why: 按良好请求占比口径算得 `99.2% >= 99.0%`，这正是百分位比率 SLI 允许极少数长尾抖动而不死板抓狂的原因
            - text: 延迟没法写进 SLI，只能用服务器硬盘容量代替
              why: 延迟是推荐的核心请求类 SLI（以“满足耗时阈值的良好请求 ÷ 总有效请求”衡量）
          explain: 可用率、延迟、乃至后台批处理的数据新鲜度与正确率，全都可以统一套进“良好事件数 ÷ 有效事件总数”这把通用标尺。

  - id: budget
    chapter: SLO
    title: 统计窗口、错误预算算术与策略治理
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 假设你的团队给核心支付 API 设了 **30 天滚动窗口内 99.9% 可用性 SLO**。月底算账时有人说：“我们只看那剩下微不足道的 `0.1%` 容错额度，难道还能拿来做工程决策？”请问：在 30 天里，`0.1%` 允许出错的时间一共有几分钟？
          options:
            - text: 恰好 `43.2` 分钟（`30 × 24 × 60 × 0.001 = 43.2`）；这 43.2 分钟就是团队能拿去承接正常上线、灰度和实验的宝贵“错误预算”。
              correct: true
            - text: 一共有 4,320 分钟（整整三天三夜随便挂）
              why: 30 天总共只有 `30 × 24 × 60 = 43,200` 分钟，它的千分之一（0.1%）不是三天，而仅仅只有 `43.2` 分钟。
            - text: 只剩 0.432 秒，打个喷嚏就超了
              why: 43,200 分钟乘上千分之一等于 43.2 分钟，这就是 30 天、99.9% 时的错误预算
          explain: 把 `99.9%` 翻译成人话就是“每月满打满算总共 `43,200` 分钟，最多只准出事故耗掉 **`43.2` 分钟**”——这就是直观可感、开发与运维共同遵守的**错误预算（Error Budget）**。
      - card:
          title: 统计窗口与错误预算算术
          body: |
            计算“时间口径的**错误预算**”只需三步：
            1. 算出统计窗口总分钟数：`30 天 = 30 × 24 × 60 = 43,200` 分钟；
            2. 允许不达标比例 = `1 - SLO` = `1 - 0.999 = 0.001`（`0.1%`）；
            3. 总错误预算 = `43,200 × 0.001 = 43.2` 分钟。若本周期某次故障已经消耗了 `30` 分钟（或 `35` 分钟），剩余预算就只剩 **`13.2` 分钟**（或 `8.2` 分钟）。窗口推荐采用持续前进的**滑动 30 天滚动窗口**，防止每月 1 号突然一笔勾销所有坏账忘记惨痛教训。
      - card:
          title: 预算快烧光或耗尽了怎么办？（2.7–2.9 错误预算政策）
          body: |
            光算数字不立规矩等于没定预算。团队提前签署好并写成书面文档的**错误预算政策**规定：
            - **预算充足时**：开发放心按正常节奏发新功能、做高价值实验；
            - **预算耗尽或见底（≤ 0）时**：**自动冻结非紧急高风险新功能上线**。全员优先投入做架构加固、补自动化测试、修高发慢查询和改进自动回滚，直到滚动窗口重新攒回正预算为止。（同时要把预算曲线贴进日常仪表盘，透明同步全体成员。）
      - item:
          id: q-budget-remaining-30m
          type: number
          prompt: 服务采用 `30` 天窗口、`99.9%` 可用率 **SLO**。目前本窗口内一次发布回滚延迟已累计耗掉了 `30` 分钟错误预算，当前还剩多少分钟错误预算？（填入精确小数）
          answer: 13.2
          explain: 总预算 = `30 × 24 × 60 × (1 - 0.999) = 43,200 × 0.001 = 43.2` 分钟；剩余 = `43.2 - 30 = 13.2` 分钟（若已用 `35` 分钟则剩 `8.2` 分钟，用 `40` 分钟则只剩 `3.2` 分钟）。
      - card:
          title: 例题：当预算只剩 3.2 分钟，研发催着周五必须上线大改版怎么办？
          body: |
            如果团队原本总预算 `43.2` 分钟，月内两次事故已经花掉了 `40` 分钟（仅余 `3.2` 分钟，且接近归零），此时业务团队想在周五上线一个高风险重构大版本。按错误预算政策该怎么裁决？
          reveal:
            - title: 第 1 步：用客观数字替代双方扯皮吵架
              body: 运维不再只是凭直觉喊“我觉得不稳别上线”，开发也不再抱怨“运维刻意刁难卡脖子”——白纸黑字事先共同签过字的 **SLO 预算看板**清楚写着余额已跌到红线附近。
            - title: 第 2 步：暂缓常规特性发布，把工程精力优先投向可靠性还债
              body: 依据事先一致通过的错误预算政策：暂缓这次高风险重构大版本（只保留直接修复当前故障原因或高危安全漏洞的紧急补丁），把人手调去补齐导致前面丢掉 40 分钟的缺失告警、自动回滚与压力测试。等窗口期慢慢滑过旧事故重获安全预算，再稳妥放行新版。
      - item:
          id: q-budget-exhausted-action
          type: choice
          prompt: 当某核心服务在 30 天滚动窗口里的 **错误预算** 已经全部耗尽甚至跌为负数，根据 SRE 错误预算政策，接下来团队最合理的做法是什么？
          options:
            - text: 暂停非紧急的新功能上线，只允许发修复可靠性与安全隐患的变更，把研发重心切到加固系统、补充测试和提升回滚速度，直到预算恢复正值
              correct: true
            - text: 干脆悄悄把公开仪表盘上的 SLO 目标改成 `50%`，立刻多出几万分钟预算继续狂发缺陷代码
              why: 随意调低 SLO 自欺欺人会彻底破坏用户信任与目标的约束意义
            - text: 把还在跑的服务直接关停一个月等日历翻篇
              why: 停服只会让预算继续每秒倒扣；正确做法是通过冻结高风险新特性把精力花在提升当前服务本身稳定性上
          explain: '**错误预算把研发“快发需求”与运维“稳固线上”绑成一条绳上的利益共同体**——不乱搞事才能多攒预算发好新功能。'
      - item:
          id: q-window-type-why
          type: choice
          prompt: 选择统计窗口时，为什么相比固定每个自然月 1 号清零重算的“日历月窗口”，现代 SRE 更常使用每天随时间向前推进的“**30 天滚动窗口（Rolling Window）**”？
          options:
            - text: 防止上个月 29 号刚发生一次长达两小时的惨痛大宕机，结果隔两天到了下月 1 号账面预算瞬间自动洗白归满，导致团队失去修复动力
              correct: true
            - text: 因为电脑不会识别日历上写着“1 号”的日子
              why: 日历窗口实现极其简单，只是会在跨月边界产生“大故障记忆一夜清零”的反直觉错觉
            - text: 滚动窗口能把一天从 24 小时自动变成 48 小时
              why: 无论日历月还是 30 天滚动窗口，30 天总长度同样是 43,200 分钟，只是滚动窗口会持续背负最近整整 30 天的真实历史账单
          explain: 滚动窗口让团队对近期的稳定性持续负责，也顺便让故障后修复隐患的动力不会在月初莫名其妙消失。
      - card:
          title: 例题：当预算耗尽冻结新功能时，这四项变更到底谁能过、谁得先停？
          body: |
            假设某服务 30 天预算 `43.2` 分钟已经跌破 0。业务部门当天报上来四项需求，按标准错误预算政策逐项裁决：
          reveal:
            - title: 第 1 步：放行“专治漏洞与提升回滚稳固性”的紧急加固单
              body: “修补刚才引发 500 宕机的连接池泄露补丁”和“把版本回滚耗时从 15 分钟缩短到 30 秒的发布工具升级”必须优先上线——因为它们正是在直接修复可靠性。同样，高危安全漏洞热补丁也属于政策白名单必发项。
            - title: 第 2 步：明确延后高风险日常大需求，直到窗口攒回正预算
              body: “重构首页推荐排序弹窗”、“改写大块实验性积分引擎”这类不关安全也非修稳定性的高风险特性先暂缓排队；团队集中精力写完回放压测和故障演练把稳定性稳住，等过去坏账随滚动窗口滑出、预算恢复正值再继续推进常规业务演化。
      - card:
          title: 例题：怎么写一份大家真会照着执行、不沦为废纸的错误预算政策？
          body: |
            算清 `43.2` 分钟只是第一步，如果没提前把规则写进共享政策文档和日常大屏，到了真要停工修bug那天大家还会扯皮：
          reveal:
            - title: 第 1 步：政策文档事先由研发、SRE 与产品负责人共同签字确认
              body: 文档里用极简条款写明三件事：本服务靠哪些精准 SLI/SLO 算分、每月预算花到 0 以下时谁有权力暂停常规版本推新、出现严重高危事故连续超过多少分钟触发强制无责备复盘会。
            - title: 第 2 步：把“剩余预算分钟数”摆在每日例会都能抬头看到的公共仪表盘
              body: 把当前 30 天滚动剩余预算（例如绿灯 `28.5m` 或红灯 `-4.1m`）挂在构建平台顶部与周报首页；只有所有角色天天看得见同一张透明账单，决策才会又快又心服口服。
            - title: 第 3 步：同时警惕“季度末剩余预算还剩 99% 从不花掉”的过分保守陷阱
              body: 设定错误预算不是为了把 43.2 分钟供在柜子里一点都不许动——如果一连几个季度预算几乎没消耗、业务需求却排队积压几个月不敢推新，反而说明发布频率过于保守或者把精力过度浪费在无意义加码上，可以适度加速有价值的功能上线。
      - item:
          id: q-budget-remaining-40m
          type: number
          prompt: 还是 `30` 天滚动窗口（共 `43,200` 分钟）与 `99.9%` **SLO**。如果先发生一次事故花了 `25` 分钟，几天后又因故障花了 `15` 分钟，此时累计共耗时 `40` 分钟，该周期还剩多少分钟错误预算？（填精确小数）
          answer: 3.2
          explain: 30 天总预算 `43.2` 分钟；扣去累计 `25 + 15 = 40` 分钟后，就只剩 `43.2 - 40 = 3.2` 分钟，已经亮起红灯需要立即控变更保稳定性。

  - id: burn
    chapter: SLO
    title: 精确率/召回率与多窗多燃烧速率告警
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 很多团队还在设老式主机告警：“只要机器过去 5 分钟负载超过 80% 就半夜发短信叫醒人”。结果经常半夜叫醒了结果所有用户请求正常、或者负载才 30% 但数据库死卡把全站用户全拦在了 `500` 门外。用 **错误预算消耗速度** 触发告警，能怎样同时解决这两类病？
          options:
            - text: 直接盯着真正代表用户受损的错误率与预算消耗速度报警——只要预算正在以十倍百倍高速狂烧，无论机器忙碌 20% 还是 90% 都能立刻精准抓到真故障。
              correct: true
            - text: 把告警评估周期拉长到每隔 30 天才汇总检查一次，这样中间任何短暂抖动都不会吵醒值班人员
              why: 严重事故几十分钟就能把整月 43.2 分钟预算烧穿，必须依靠及时且高精准度的多窗口指标告警第一时间发现
            - text: 继续只按单台机器瞬时 CPU 超过 80% 发紧急电话，但把阈值微调到 82% 就认为彻底解决了误报
              why: 告警机制的核心在于“真正用户受损时及时响（高召回），没影响用户时别乱吵（高精确）”
          explain: 机器忙不忙不等于用户受不受损；直接盯错误预算的消耗速度，预算一旦十倍百倍地狂烧就报警。这就是“按错误预算消耗倍率 + 多窗口校验”的现代告警模型。
      - card:
          title: 评价告警好坏的四个指标与燃烧速率计算
          body: |
            好告警盯四个数：高**精确率（Precision）**（响了几乎都是真事故、少误报）、高**召回率（Recall）**（真事故不漏报）、短**检测时间**与短**复位时间**。

            核心抓手叫 **燃烧速率（Burn Rate）** = `当前错误率 ÷ (1 - SLO)`：
            - 例：`SLO = 99.9%`（允许错率为 `0.001 = 0.1%`）；
            - 若当前错误率飙到 **`0.01（1%）`**，燃烧速率 = `0.01 / 0.001 = 10`（**`10x`**，按这速度只需 3 天就烧光整整 30 天预算）；
            - 若错误率是 `0.005（0.5%）`，燃烧速率 = `0.005 / 0.001 = 5`（**`5x`**）。
      - card:
          title: 多窗多速率告警与低流量挑战
          body: |
            光看单一瞬间燃烧速率会“故障都修好了告警却迟迟不复位”：
            - **双窗口组合（Multiwindow）**：要求**长窗口（如 1 小时）和短窗口（如 5 分钟）同时**越过阈值才响。一旦故障修好，短窗口 error 降到 0，5 分钟内告警立刻干脆清零复位。
            - **低流量服务**：冷门内部工具 5 分钟一共只来了 2 个请求，错 1 个错误率就变 `50%`（假警报爆炸），解决靠拉长最小窗口样本门槛或混入合成人工探针流量保样本量。
      - item:
          id: q-burn-rate-10x
          type: number
          prompt: '服务 `SLO = 99.9%`（30 天允许出错率基线为 `0.001`）。如果某分钟突发故障导致错误率飙升至 `0.01`（即 `1%` 的请求返回 `500`），此时的 **燃烧速率（Burn Rate）** 是基准消耗速率的多少倍？（填整数）'
          answer: 10
          explain: 燃烧速率 = `0.01 / 0.001 = 10` 倍。如果错误率是 `0.5%`（`0.005`），则燃烧速率 = `0.005 / 0.001 = 5` 倍。按 10 倍速一直错下去，本来能撑 30 天的 43.2 分钟预算只需 `30 / 10 = 3` 天（其实按高危突发若错全垮只需几十分钟）就烧干了。
      - card:
          title: 例题：为什么不能直接设“1 小时窗口燃烧 14x 就一直响”，而必须加上“5 分钟短窗也超标”？
          body: |
            对比“单看 1 小时窗口”与“1 小时 + 5 分钟双窗口与（AND）条件”：假设 10:00 到 10:05 发生了一次严重暴错随后在 10:05 完全修好恢复正常。两个规则表现差在哪？
          reveal:
            - title: 第 1 步：只有 1 小时窗口时，修完故障还会傻响整整 55 分钟（复位时间太长）
              body: 尽管 10:05 之后已经全绿色零报错，但那 5 分钟的大量错误样本一直留在“过去 1 小时”均值里拉高统计，单窗告警从 10:05 到 10:59 还在持续亮红灯，搞得交接班工程师糊涂以为还没修好。
            - title: 第 2 步：加上“AND 最近 5 分钟窗口燃烧同样 >= 14x”，故障一好 5 分钟立刻自动消警
              body: 只有在“正在发生连续问题”（短窗口 5m 仍超标）并且“累计确实已经严重耗损了预算”（长窗口 1h 达标）同时满足时才响；一旦 10:05 彻底修好，10:10 时短窗口立刻回归 0%，**复位时间从 55 分钟缩短到 5 分钟**。
      - item:
          id: q-low-traffic-false-alert
          type: choice
          prompt: 某团队维护一个每天半夜才跑几十次请求的管理后台接口，设了 `99.9%` SLO 和快速 5 分钟告警。结果半夜某位管理员不小心传了个特殊故障参数导致 2 个请求里坏了 1 个（表面错误率 `50%` > `2%`），告警电话瞬间响爆。这个低流量坑怎样治？
          options:
            - text: 适当拉大告警统计窗口以凑够有统计学意义的最小样本量、区分客户端参数错不计入服务端故障，或定时发射轻量合成探测请求稳定基线流量
              correct: true
            - text: 半夜只要请求量小于 100 就干脆关掉整台后台服务器
              why: 后台低频服务同样要保持在线等待管理员使用，问题在于用超高敏感的短窗百分比算法去套小样本分母
            - text: 把管理员踢出系统永远不准他在夜间打开后台
              why: 低流量下避免“错 1 个就 50%”的方案是：合大窗口、增样本或采用按连续失败次数的门限
          explain: 当分母太小时（比如只有几条请求），百分比极其失真，这是做 **SLO** 告警最容易踩中的经典小样本陷阱。
      - item:
          id: q-burn-alert-match
          type: match
          prompt: 把下面四种告警设计要素与它们各自解决的问题精确连线。
          pairs:
            - [用“错误预算燃烧速率”替代“机器忙碌度 > 80%”, 直接把报警钩在用户体验受损与预算损耗速度上，大幅压低假警报]
            - [长短双窗口共同触发（如 1h AND 5m）, 既能防住 1 秒偶发毛刺乱叫，又能保证故障修好后短短几分钟内干脆消警复位]
            - [快速高燃烧率发电话页（Page）、慢速低燃烧率建工单（Ticket）, 把严重突发急病留给人立即救火，把缓慢老化小病留给白天从容排队排查]
            - [低流量服务加大窗口或叠加合成探测（Synthetic Probe）, 避免分母只有一两个请求时出错一笔瞬间飙出 50% 错误率的假炸雷]
          explain: 学完这一课，你配出来的监控告警就是一套分轻重缓急、低误报快复位的现代 SRE 告警体系。
      - card:
          title: 例题：用精确数字比一比“10x 急病发电话”和“2x 慢性消耗发工单”该怎么配阈值
          body: |
            面对 `30` 天共 `43.2` 分钟的错误预算（基线允许错率 `0.1%`），推荐把**多级燃烧速率（Multiple Burn Rate）**配成不同紧迫级别：
          reveal:
            - title: 第 1 步：突发急病（如 14.4x 或 10x 速率）——直接拉响值班电话 Page
              body: 在 10 倍速下（错误率 `1%`），整月预算 `3` 天烧完；14.4 倍下只撑得住 `2` 天，且一小时就啃掉整月 `2%` 预算。这种突发重创必须在 5 分钟级别立刻电话叫醒人上场止血。
            - title: 第 2 步：慢性渗漏（如 2x 或 1.5x 速率）——白天建工单 Ticket 从容排期修复
              body: 如果当前错误率只是悄悄变成 `0.2%`（2 倍速），按这速度半个月后预算才会耗尽，根本不必凌晨三点发电话把睡觉值班员吵醒；系统自动建一张中高优先工单，让白天清醒的研发人员早上班时悠哉修掉就行，极大保护了团队精力。
      - item:
          id: q-burn-exact-threshold
          type: choice
          prompt: '假设服务设定 `SLO = 99.9%`（即 30 天允许出错率基准是 `0.1% = 0.001`）。如果告警系统设定：当 1 小时与 5 分钟双窗口同时超过 `2%` 错误率（`0.02`）时立刻发紧急电话告警，并另设超过 `0.5%`（`0.005`）的 6 小时长窗建白天跟进工单。那 `0.02` 错误率对应的是多少倍燃烧速率？'
          options:
            - text: '`20` 倍燃烧速率（`0.02 ÷ 0.001 = 20x`），短短 1 小时就烧掉了整月近 `2.8%` 的预算'
              correct: true
            - text: '`0.2` 倍燃烧速率，非常慢不用管'
              why: 用当前错误率除以允许基线错误率：`0.02 / 0.001 = 20`，是基准允许上限的整整 20 倍。
            - text: '`200` 倍燃烧速率，错率高达 20%'
              why: '`2%` 即 `0.02`，除以 `0.001` 得 `20` 倍（而 `0.5%` 则对应 `5` 倍）'
          explain: 只要拿实测错误率除以 `1 - SLO`（例如 `0.001`），无论多少百分比都能一秒心算出对应的燃烧速率倍数。

  # ======================================================================== 发布策略
  - id: rollouts
    chapter: 发布策略
    title: 蓝绿部署、功能开关与版本化无停机更新
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 传统小作坊更新网站时，半夜两点发一则公告：“今晚停服维护 2 小时”，然后停掉老服务、手动替换文件、重跑数据库迁移再重启——一旦新版本有错还得再停机 1 小时回滚。现代高可用系统怎样把发布停服时间压缩到几乎为零？
          options:
            - text: 准备并验证好全新版本集群再瞬间切入流量（蓝绿部署），把高频变化与慢速组件解耦，配合版本化迁移与功能开关实现零停机切换和秒级退回
              correct: true
            - text: 把用户浏览器网线拔掉两小时假装服务器没有停过
              why: 无停机发布靠的是新旧版本并存接替和向后兼容的演化方案，让用户无感过渡
            - text: 干脆永远不再做任何代码更新、把软件封死十年
              why: 工程目标是在几乎不停服、不影响用户体验的前提下持续安全演化发布新版
          explain: 先在新集群准备好新版本，再瞬间切入流量，出问题能秒级切回；数据库迁移分版本做，配合功能开关，就能零停机。这一课讲 **发布策略** 与无停机更新的方法。
      - card:
          title: 蓝绿部署与按变化频率分层拆分
          body: |
            - **蓝绿部署（Blue/Green Deployment）**：同时维护两套完整环境——当前接线上真流量的叫“蓝（旧版）”，旁边预先部署并跑通冒烟测试的全新环境叫“绿（新版）”。一切就绪后只需拨转路由器流量指向绿环境；万一 1 分钟内报错上升，直接拨回蓝环境秒级止损。
            - **分离变化节奏不同的组件**：把天天改动的业务文案/规则与一年都不大变的底层引擎拆开部署，减小每次上线的风险包袱。
      - card:
          title: 功能开关（Feature Flags）与版本化无停机更新
          body: |
            - **功能开关（Feature Flags）**：把“代码部署上线”和“用户看到新功能”解耦。新版代码带着关闭状态开关静悄悄上线；之后随时动态切开先让内部同事试用，有问题不用重新打包回滚代码，关掉开关即可瞬间止血。
            - **无停机版本化迁移**：改数据库表结构或接口格式时坚持**向后兼容（先扩再迁后删）**——比如新版旧版新旧实例并存那几分钟里，两个版本都能读写同一份数据结构，互不报错崩溃。
      - item:
          id: q-blue-green-how
          type: choice
          prompt: 团队采用 **蓝绿部署** 发布订单服务新版本 v2.0（当前在线跑的是 v1.9）。把 v2.0 部署在绿色集群且冒烟自检全绿后把入口流量切向绿色集群，2 分钟后监控显示支付成功指标异常下降。此时最快最稳的止损动作是什么？
          options:
            - text: 保留依然在线热备的蓝色 v1.9 集群不动，立即把入口流量切回蓝色环境，让用户秒级恢复正常再从容调查绿色环境故障日志
              correct: true
            - text: 赶紧把蓝色 v1.9 服务器彻底销毁然后现场在线手改 v2.0 代码热更新
              why: 保留未受污染的旧版本热环境正是蓝绿部署能“秒级无痛回滚”的核心保险
            - text: 让全部用户先等两个小时把旧版重装一遍
              why: 流量切回已跑着的蓝环境只需几秒钟，这比现场重装回退快两个数量级
          explain: 蓝绿部署最大的优点是“上线切换平滑、回滚更是按秒计”；代价是需要预备两套环境的短期冗余容量。
      - card:
          title: 例题：为什么改数据库字段绝对不能“删掉旧列、直接上线新版读取新列”？
          body: |
            如果订单表原本有 `user_name` 列，团队想改名成 `account_name`。在无停机更新切换过程中，有 5 分钟老版本 v1 和新版本 v2 实例会同时运行。直接一步改名会怎么炸？按三步走怎么安全迁移？
          reveal:
            - title: 第 1 步：一步强改名会导致滚雪球报错
              body: 如果先改数据库列名为 `account_name`，还在跑最后几十秒流量的老代码 v1 去查 `user_name` 瞬间报错崩掉；反过来如果先上新代码 v2 去查还不存在的 `account_name`，同样全部报错。
            - title: 第 2 步：采用“先加新列并双写 → 全量升 v2 → 最后下线老列”三段演进
              body: 第 1 版只新增 `account_name` 并让新写入同时写新旧两列（历史数据后台慢慢回填）；等全站稳稳升完 v2 只读 `account_name` 确认无任何旧版残留读请求后，最后单独一次清理掉老列 `user_name`。全程零停机。
      - item:
          id: q-feature-flag-benefit
          type: choice
          prompt: 把 **功能开关（Feature Flags）** 引进生产环境后，相比把新功能死绑定在单一一次大发布里，有哪些主要工程优势？
          options:
            - text: 把“代码上线”与“功能对外露脸”拆开：可先向 1% 用户做渐进实验验证，异常时无需重走构建回滚流水线，关掉开关即瞬间恢复旧行为
              correct: true
            - text: 有了功能开关就永远不用担心任何外部依赖或数据库挂掉
              why: 功能开关主要控制特性放量范围、渐进实验和快速降级关闭高耗新功能，不能免除底层基础架构冗余与容灾
            - text: 功能开关要求每位用户必须手工重新打包整个网页
              why: 开关在服务端或配置系统动态下发判定，用户端无需任何干预
          explain: 记得给临时用于灰度的功能开关设“清理过期日”，否则一年后代码里会留下一堆谁也不敢删的死分支。
      - card:
          title: 例题：为什么把变更频率完全不同的组件拆分部署更稳？
          body: |
            假设某商城主页每秒读几百次极少改动的“商品类目总表”，但运营规则每天修改三次折扣公式。如果不拆分硬塞进同一个大包发布会有什么隐患？
          reveal:
            - title: 第 1 步：把高频变化层与慢速稳定底座彻底剥离
              body: 如果每次调折扣率都得把整个 1 GB 底座和状态重发重启，原本 99.9% 稳稳跑着的底层无端端跟着一天震荡三次，既拉长打包与上线时间，也让重型模块承担本不该有的发布风险。
            - title: 第 2 步：独立短小发布配合热开关让回滚降至秒级
              body: 把营销规则引擎拆出为轻巧独立模块并配上功能开关后，每天发五次只需几秒热切换且范围严格受限；底座则可以安安静静稳定跑上几个季度零重发。
      - item:
          id: q-rollout-match
          type: match
          prompt: 把发布策略中的四项核心做法与它们各自的核心收益精确匹配。
          pairs:
            - ["**蓝绿部署**", 维护一旧一新两套并行环境，验收完新环境后瞬间切换流量并留老环境作秒级回滚垫]
            - ["**功能开关（Feature Flags）**", 运行期无需重部署代码即可动态分人群放量或秒关异常新功能]
            - ["**向后兼容的“先扩再迁后删”**", 保障新旧版本并发交替那几分钟内共享数据与接口互相兼容、零停机平滑升级]
            - ["**拆开快变与慢变组件**", 减少每次常规小改动需要顺带重新发布重型核心引擎的风险频率]
          explain: 发布策略的终极目的不是“禁止上线”，而是让每次上线变成“低风险、可控半径、随时可秒退”的无感例行小事。

  - id: canary
    chapter: 发布策略
    title: 金丝雀发布、指标评估与生产向右测试
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 当天团队要上线一项搜索推荐新算法：线下单元测试和模拟压测全部顺利通过，但真实世界里用户搜索词千奇百怪。如果一次性直接切换给 100% 全部用户，万一漏掉一个冷门坑就会让全站同时挂掉。怎样把新版本的“爆炸半径”锁死在极小一撮用户身上先试水？
          options:
            - text: 先把新版本推向只接 1%–5% 真实流量的极少数实例（金丝雀实例），用对照指标证明跟旧版一样健康后再分阶放大范围
              correct: true
            - text: 永远不上生产，所有用户只能靠开发自己手写假请求凑热闹
              why: 线上真实流量复杂性无法在本地完全模拟，受控放小流试跑再逐步推开是最稳的验证之道
            - text: 把新算法直接全量覆盖到 100% 线上机器，但关闭所有监控告警等用户打电话投诉再回滚
              why: 控制比例放量给新旧两版同时服务，其余 95%–99% 用户依然稳妥享受旧版正常服务
          explain: 这就是名字源自矿井预警鸟的 **金丝雀发布（Canarying）**：先让新版本只接很少一部分真实流量，和旧版对照指标，确认一样健康再逐步放大。
      - card:
          title: 金丝雀发布工作流、规模与持续时间选择
          body: |
            一次靠谱的**金丝雀发布**：
            1. 划出极小比例（如 `1%–5%`）金丝雀群跑新版，**同时同条件下留一小批旧版实例作“对照组（Baseline）”**（不能拿今天的新版直接对比昨天半夜的旧版，昼夜流量根本不同）；
            2. 设置合理的规模与观察期：太少样本抓不到稀罕崩溃，太短时间看不到慢慢泄露越积越慢的问题；
            3. 对比错误率、延迟分位和资源消耗，一旦变差或威胁错误预算，**宁可先自动回退旧版止损再查**——切忌现场头铁往前滚修。
      - card:
          title: 特殊场景金丝雀、人工造压、流量镜像与向右测试
          body: |
            如果上线前真流量不能随便冒失或离线批处理没法按用户切流，还有三招：
            - **人工造压（Artificial Load Generation）**：在孤立金丝雀环境里用脚本构造典型高频请求先踩一遍；
            - **流量镜像（Traffic Teeing / Shadowing）**：把线上 1% 真实请求**异步复制拷贝**一份悄悄喂给新版，新版的回答只算指标验证不发回给用户，用户零风险感知；
            - **向右测试（Shift right）**：在可控保护下用真实线上指标验证假设。
      - item:
          id: q-canary-baseline-control
          type: choice
          prompt: 某工程师上线金丝雀版本时，图省事只拿“今天下午 3 点的新版 2% 流量延迟”去对比“今天凌晨 3 点的全站旧版延迟”，发现延迟翻了三倍，吓得立马误判回滚。按金丝雀评估的规则规范，正确的评估对照方式是什么？
          options:
            - text: 同时同流量时段下设置“金丝雀新版组”与规模相同的“当前稳定旧版对照组”，对比两者在同一分钟相同业务分布下的错误率与延迟差异
              correct: true
            - text: 永远拿新版去对比去年大促零点的峰值数据
              why: 业务流量早晚波峰波谷和调用分布每小时都在变，只有同时刻同条件对照组才能隔离出真正由“新代码”引起的变动
            - text: 完全不需要看指标，只要机器没有着火冒烟就立刻推 100%
              why: 金丝雀的意义就是依靠精细指标（如 P99 延迟、5xx 错误率、资源占比）量化证明健康后才放行下一阶段
          explain: 金丝雀评测就像科学对照试验：**同一时间、同一批入口、仅代码版本不同**，才能一针见血验出“新版是不是真比旧版差”。
      - card:
          title: 例题：当金丝雀报错 2% 仅剩一小半预算时，选择“回退（Rollback）”还是“向前赶修（Roll Forward）”？
          body: |
            假设某服务 30 天预算本来一共只剩 `10` 分钟。此时 5% 的金丝雀实例突然因一处边界故障不断抛 500 错误（预计 15 分钟烧光余量），开发喊“给我 10 分钟我马上写个热修复补丁顺着往前再推一版”。该怎么决策？
          reveal:
            - title: 第 1 步：线上止损永远优先“一秒切回已知健康旧版”
              body: “往前赶修补丁”最乐观也得经历改代码、跑完 CI 测试、重打镜像、再发布走一遍流程，而且急匆匆写的补丁极容易顺手引入第二个新故障。先立即把那 5% 流量撤出金丝雀回退到上一分钟还好好跑着的旧版，误差预算瞬间止血停止流逝。
            - title: 第 2 步：还要核查共享依赖与非交互批处理隔离
              body: 别忘了检查这 5% 金丝雀有没有往公共生产数据库写坏格式数据污染全局（依赖隔离）。而对没有实时请求流量的定时离线批处理任务，可以先只喂 1% 少量历史无害任务试跑新逻辑核对产出一致，再全面切换。
            - title: 第 3 步：金丝雀环境本身也用“人工探测请求”预先热身冷门分支
              body: 对白天低频或危险边缘接口，发布流放进真实用户前先让测试脚本往金丝雀实例打一轮人工合成边界流量，既帮热身也把最明显的崩溃直接拦在真实用户撞上之前。
      - item:
          id: q-traffic-teeing-why
          type: choice
          prompt: 对一个事关资金结账的极其敏感服务重构了底层引擎，上线前即使 1% 真实用户也不允许冒算错账的风险。采用 **流量镜像（Traffic Teeing）** 是怎样验证新引擎的？
          options:
            - text: 线上只用稳妥的旧引擎计算并给真实用户回包，同时在旁路把真实请求复制一份异步发给隔离的新引擎试跑，只记录对比两边的耗时与算账一致性
              correct: true
            - text: 直接把所有用户的银行卡双倍扣款两次验证结果是否一样
              why: 镜像流量旁路验证的前提必须是新引擎试跑产生**只读无外部破坏副作用**的影子结果，绝不能拿用户真账户扣两次钱。
            - text: 直接在客户端浏览器里同时向新旧两套后端发送两遍结账请求，让前端代码自己比对哪边算得快
              why: “镜像（Teeing）”是在服务端网关或代理层旁路复制一份真实请求流量给隔离的影子环境，绝不是让客户端重复发两次请求。
          explain: 流量镜像让我们能以“对真实用户零影响”的方式用海量真实复杂输入提前踩爆隐患（需注意屏蔽会重复扣钱/发短信的外部写副作用）。
      - card:
          title: 例题：金丝雀到底该放多少流量、观察多久才算过关？
          body: |
            如果给一个每秒有 2,000 次请求的站点只放 1 个用户去试跑 30 秒，或者反过来上来就切 50% 跑一分钟，为什么两端都不靠谱？
          reveal:
            - title: 第 1 步：样本量和窗口时长必须足以让隐藏慢病暴露
              body: 放 1 个用户跑 30 秒可能恰好全踩到最简单的首页请求，一遇到稍微稀有的边界参数就崩掉了；而持续增长的池耗尽或连接泄露需要跑到十几到几十分钟以上才会抬高 P99 延迟曲线，因此常从 `1%` 到 `5%` 稳跑 15–30 分钟以上再进下一梯队。
            - title: 第 2 步：按可量化门槛指标自动拦截
              body: 金丝雀评估指标不能靠人肉眼看“我觉得挺快”，必须事前定死如“金丝雀组的 5xx 错误率不得高于对照组 +0.1%、P99 延迟不超 +10%”，监控数据只要不满足采样完整要求或越过红线就自动暂停并回退。
      - item:
          id: q-canary-bluegreen-diff
          type: choice
          prompt: 对比 **蓝绿部署** 与 **金丝雀发布**，两者最核心的区别在于什么？
          options:
            - text: 蓝绿部署往往准备完整两套并行环境一次性在旧版与新版间整切流量；金丝雀则是先切极小比例（如 1%–5%）真实流量给少数新版实例检验健康，再逐步分批扩大替代旧版
              correct: true
            - text: 蓝绿部署不需要额外准备第二套运行环境，而金丝雀发布要求在切流前先把旧版机器全部停机销毁
              why: 恰恰相反，蓝绿部署需要同时准备蓝绿两套环境以支持整切与快速回退，而金丝雀发布是新旧版本同时在线并按小比例渐进切流。
            - text: 金丝雀发布完全不允许监控任何指标
              why: 金丝雀极度依赖细粒度实时对比监控，甚至比蓝绿更依赖精确自动度量
          explain: 两招并非水火不容：完全可以先靠“小比例金丝雀分批验证新代码”，高风险重型环境切换再用“蓝绿热备秒回滚”。

  # ======================================================================== 故障恢复与容量
  - id: incident
    chapter: 故障恢复与容量
    title: 值班（On-Call）、故障应急响应与无责备复盘
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 半夜一点核心登录接口突然大面积挂掉，微信群里同时有三十个人七嘴八舌：“谁刚改了数据库？是不是网关炸了？我先重启试试吧。”结果两个人同时朝相反方向重启机器越救越乱。事故应急响应第一时间缺了哪三根定海神针？
          options:
            - text: 明确的单一现场指挥角色（Incident Commander）、清晰的职责分工（沟通与排查分离）、标准应急手册（Runbook）与事后只找机制漏洞的无责备复盘
              correct: true
            - text: 第一时间立刻召开全员追责大会，把最后敲回车的那个人当场开除
              why: 半夜火场最重要的是“先止血救人恢复服务”，且事后惩罚动手的人只会让大家以后隐瞒错误和不敢改系统
            - text: 把告警群全部解散假装什么也没发生，等到天亮看情况
              why: 结构化的故障响应能让团队在高压下冷静分工、有序止损
          explain: SRE Workbook 第 5、6、7 章专门梳理了**可持续的值班（On-Call）、高效故障应急与无责备事后复盘文化**。
      - card:
          title: 可持续值班与结构化故障响应
          body: |
            - **健康的值班（On-Call）**：值班不是当“7×24 全年无休人肉肉盾”。每班控制负荷与交接清晰，高频触发的噪声警报（让人疲惫麻木的干扰）必须限期根治削减，且每条告警都应附带清晰排障指南入口（Runbook）。
            - **故障响应（Incident Response）**：火场中切忌群龙无首。设**事故指挥官（IC）**总协调判断、**沟通官（CL）**对外更新状态页面让排查人员专心查错、**行动组（OL）**执行止损回滚并留下详细时间线日志。**第一原则是止血恢复服务，根因调查可以留到恢复之后。**
      - card:
          title: 无责备事后复盘（Blameless Postmortem）
          body: |
            大故障往往价值连城——前提是你不能靠开除一个人草草收场。**无责备事后复盘（7 章）**的核心前提：
            - **假设当事人在当时所知条件下做了他以为最合理的决定**；与其斥责“你怎么这么粗心手抖少输一个参数”，不如深挖“为什么系统允许一个人没经任何检验就把危险操作瞬间全网生效？”
            - **产出可追踪行动项（Action Items）**：写清时间线、根因、影响面与几项真正能堵住同类系统漏洞的改造任务并定下期限跟进落实。
      - item:
          id: q-incident-roles
          type: match
          prompt: 把大型故障应急响应团队里的角色或环节与各自的关键职责对应起来。
          pairs:
            - ["**事故指挥官（IC）**", 全局统筹决策、控制止损优先顺序与协调分工，防止多人乱改冲突]
            - ["**沟通负责人（CL）**", 专职向客服、管理层与外部状态页同步简洁准确的进度通告，让一线排查者专心排障]
            - ["**首要救火目标**", 先靠回滚/切流/降级尽快恢复线上用户服务止血，把深度根因源码分析放到止损之后]
            - ["**无责备复盘行动项**", 针对暴露的系统防御空洞（缺测试/缺限流/缺预检）建明确整改工单并闭环验收]
          explain: 好指挥机制把一团乱麻的群聊救火变成按剧本推进的消防队协同。
      - card:
          title: 例题：实习生误删了测试库表还是设计机制出了问题？做一次“无责备复盘”
          body: |
            某团队新人按文档清理一条多余配置，却不小心在命令窗口连错库，误删了生产环境一张关键配置表导致全站停服 20 分钟。两种截然不同的复盘会结果怎样对比？
          reveal:
            - title: 第 1 步：责备型做法——训斥新人、写份“以后小心点”检讨完事
              body: 新人从此吓得再也不敢碰运维脚本；其他人也只学会出事互相甩锅。可是那条毫无防护、权限通天、测试库和生产库长得一模一样的窗口依然原封不动挂在那里——三个月后另一位十年老兵一样会在疲惫时踩中同一个陷阱。
            - title: 第 2 步：无责备 SRE 复盘——改造防呆边界与权限隔离
              body: 复盘会平心静气核对操作记录后立即立下三条工程改造：① 生产库平时默认只给只读凭证，高危变更全改由 CI 审批与 IaC 预览流水线代劳；② 测试环境与生产环境域名、提示色严格强制隔离区分；③ 给该配置表加上定期自动快照并实战演练恢复验证，把恢复时间从 20 分钟压到 2 分钟。
      - item:
          id: q-blameless-why
          type: choice
          prompt: 为什么 SRE 文化大力推崇 **无责备事后复盘（Blameless Postmortem）**？难道工程师犯了低级失误不用改进吗？
          options:
            - text: 无责备不是不改进，而是禁止把故障简单归因成“某某某不认真”，从而迫使大家把焦点投向“系统为何缺拦截校验/防呆机制与自动恢复”，并鼓励员工坦诚还原真相共同筑牢防线
              correct: true
            - text: 无责备是指故障发生后绝对不准写任何事件复盘文档或时间线
              why: 正相反，应当针对达标受损或高影响故障写出详尽、公开共享时间线与整改行动项的事后复盘报告
            - text: 无责备的意思是事故发生后不召开任何复盘会、不查明技术根因也不跟踪任何架构整改项
              why: 复盘既不惩罚也不搞赏罚闹剧，目标是用坦诚无恐惧的信息流通把系统漏洞彻底修补好
          explain: 惩罚人类换不来高可用；**用防呆工具链和自动安全门锁住“人类肯定会偶发手滑”的事实**，才是长久之道。
      - item:
          id: q-oncall-health
          type: choice
          prompt: 评估一支团队的 **值班（On-Call）** 制度是否健康可持续，以下哪项做法是对的？
          options:
            - text: 每周复盘半夜响过的告警，清理无意义误报并持续缩减低价值人工值守琐事，让每个班次在合理工作载荷内保持充沛精力应对真故障
              correct: true
            - text: 规定同一名工程师连续 365 天 24 小时接听每 5 分钟响一次的所有假警报
              why: 长期高负荷假警报会迅速制造告警疲劳与人员耗竭离职，直接毁掉真实事故时的响应质量
            - text: 不写任何应急处理手册，全靠每位值班员半夜自己冥想猜步骤
              why: 清晰的排障手册（Runbook）和自动一键止损脚本，能在半夜三点救命
          explain: 对值班员最大的尊重，就是把虚假噪声降到接近零、把常用恢复动作变成一键脚本。
      - card:
          title: 例题：为什么事故发生前先练好“一分钟回滚与标准排障手册”比写万字报告更关键？
          body: |
            假设某服务深夜报错骤升，刚轮岗两周的新值班员接到电话。如果现场什么文档与自动化开关都没有，和配齐了手册与一键退回开关，差别有多大？
          reveal:
            - title: 第 1 步：没有应急手册时——新值班员深夜翻遍几十个文件不敢乱动
              body: 半夜刚醒时大脑反应最慢，盲猜命令极其容易造成二次误操作把次生故障放大；往往找不着该看哪张监测大盘入口、也不知道最近谁发布了什么版本，单单确认现状就白白耗掉半小时黄金止血时间。
            - title: 第 2 步：有 Runbook + 单一指挥权时——三分钟冷静止血后再留足复盘证据
              body: 告警消息直接自带排障入口网址与最近变更版本对照表；值班员按事先演练通过的步骤立即拨回旧版或启用降级开关，待核心服务恢复绿灯后再在清晰时间线基础上组织无责备事后复盘，彻底把个人慌乱变成稳健机制。
      - item:
          id: q-runbook-handoff
          type: choice
          prompt: 在跨班次 **值班（On-Call）** 交接与故障升级过程中，为什么每条叫醒值班员的紧急告警都应当绑定一份最新的 **应急手册（Runbook）**？
          options:
            - text: 让凌晨三点刚被吵醒、可能不熟悉该子系统的新值班员，不用翻几百页代码猜谜，顺着经过演练的安全检查与一键回退步骤立即安全止损
              correct: true
            - text: 因为电脑程序必须先念完一份操作手册才肯继续运行
              why: Runbook 是写给人看的结构化紧急操作清单（含观测网址、常见误判排查和一键降级/回滚步骤）
            - text: 有了 Runbook 以后团队就可以彻底删除所有备份和监控告警
              why: 手册只是加速排障恢复的操作剧本，监控告警和备份容灾依然不可或缺
          explain: “没有 Runbook 的半夜告警就是把新人扔进黑暗迷宫”，平时把演练过的止损步骤记进手册能立省大半恢复时间（MTTR）。

  - id: capacity
    chapter: 故障恢复与容量
    title: 负载均衡管理、N+1 容量算术与过载自救
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 平时某接口高峰只需要 3 台服务器刚好能扛住所有并发请求。为了省钱，运维只部署了刚好够用的 **3 台**机器。结果第二天其中 1 台机器因为例行系统升级暂时离线，剩下 2 台瞬间超载报错——接着用户不断疯狂点刷新重试，把最后那 2 台也彻底拖垮（全站雪崩）。错在哪里？
          options:
            - text: 既没有保留“坏掉至少 1 台还能完整撑住峰值”的 N+1 容量冗余，也没有在过载关头开启限流降级拒绝掉超出承受能力的溢出请求
              correct: true
            - text: 因为服务器必须同时开 10,000 台才准许上线
              why: 盲目买几百倍机器太浪费，标准最低工程安全基线是保证即使损失 `1` 台实例（或一整区）仍有足够余量扛住峰值（`N+1`）
            - text: 因为用户手太快不准在网页端按 F5 刷新按钮
              why: 系统自己必须具备优雅降级与反重试风暴防线（带随机抖动的退避），不能指望用户自觉不点刷新
          explain: 容量要留出“坏掉一台还能撑住峰值”的 N+1 冗余，过载时要限流、降级，把超出能力的请求拒掉。这一课讲容量计算和从过载中自救的工具。
      - card:
          title: N+1 冗余与容量估算公式（8 章、综合验证算术）
          body: |
            计算单个机群到底至少需要配几台可用实例？用好两条基线：
            1. 设业务高峰需求量为 `Peak`，单台健康实例在延迟和饱和度安全范围内稳妥承载量为 `Unit`，则仅保底需要台数 `N = ceil(Peak / Unit)`（向上取整，小数也必须凑整加一台）；
            2. 为了在单机随时重启、升级或突然宕机时仍不崩，至少再加 `1` 台冗余缓冲，即 **`N + 1 = ceil(Peak / Unit) + 1`**（若跨机房容灾则是 `N+2` 或整区冗余）。
            - 例：`Peak = 250` QPS、每台稳扛 `100` QPS -> `ceil(250/100) + 1 = 3 + 1 = 4` 台。
      - card:
          title: 过载自救：降载、有界队列、退避加抖动与优雅降级（11 章）
          body: |
            突发洪峰远超 `N+1` 时硬撑必雪崩，记住四招自保（11 章）：
            - **优雅降级**：先砍掉推荐、富图等非核心消耗，保住登录结账核心；
            - **主动拒载（Load Shedding）与限流**：宁可拒掉溢出的 30% 保住 70% 丝滑完成，也不让全库拖死；
            - **有界排队**（拒绝无限排队）；**指数退避加抖动**防重试惊群共振。
      - item:
          id: q-capacity-n-plus-1
          type: number
          prompt: 某实时查询服务在晚高峰每秒最高需要承载 `380` 次查询，单台应用实例在稳妥延迟基线内最多稳扛 `120` 次查询/秒。按至少保 **N+1**（单机故障升级也不影响峰值）的最低实例数要求，至少应当部署多少台实例？（填整数）
          answer: 5
          explain: 仅扛峰值需要 `N = ceil(380 / 120) = ceil(3.166...) = 4` 台；加上至少能容忍随时挂掉或例行升级 `1` 台冗余后，最少需要 **`4 + 1 = 5`** 台。（同理：`ceil(250/100)+1 = 4`，`ceil(300/80)+1 = 4+1 = 5`。）
      - card:
          title: 例题：为什么过载时“无限重排队”和“全员立即同步重试”是雪崩加速器？
          body: |
            线上数据库因偶然抖动慢了 5 秒，为什么常常抖动过去 20 分钟后整个系统还死死趴在地上起不来？按 11 章过载恢复机制看两步：
          reveal:
            - title: 第 1 步：长队列里全是在等“已经等不及关掉页面的过期请求”
              body: 如果接口前面没设请求超时和有界队列长度上限，上万个早就超时离开网页的废请求依然牢牢堵在队伍最前面，机器花光所有算力全在做无用功处理已过期废单，真正刚刚点进来的新活人请求反倒永远排不到。
            - title: 第 2 步：客户端整齐“立刻重试”放大 5 倍冲击力，必须带抖动退避
              body: 如果后端刚刚失败一次，10 万台客户端立刻在 1 秒后原样重试（或者全部精准第 2 秒、第 4 秒齐步重撞），原本 1 万的流量瞬间乘以重试次数膨胀成 5 万。给重试加上“指数级拉长等待 + 随机几百毫秒抖动散开（Jitter）”，同时服务端在过载门前果断返回快速拒绝（429/503），才能瞬间打散洪峰让系统迅速爬出泥潭。
      - item:
          id: q-load-shedding-why
          type: choice
          prompt: 在面对远超平时 5 倍的突发洪峰导致服务彻底 **过载（Overload）** 时，SRE 为什么主张采用“主动降载拒绝溢出请求（Load Shedding）+ 保留核心结账优雅降级”，而不是“来者不拒全部放进无限长队伍里死等”？
          options:
            - text: 主动切掉部分超出物理上限的溢流请求并关停次要耗费算力的推荐组件，能保证系统不发生连环雪崩，稳妥保住绝大多数有效用户的正常响应与极速恢复
              correct: true
            - text: 因为主动报错可以让用户误以为自己家里手机欠费断网了
              why: 主动快速返回清晰的“系统繁忙请稍候”不仅节省客户端傻等 60 秒的时间，更保护后端连接池不被废排队榨干
            - text: 因为无限队列不会占用机器任何系统资源或连接句柄
              why: 每个排队等待的请求都挂着数据库连接与对象开销，无限排队必会导致整机资源瞬间耗光宕机
          explain: 当水库就要决堤时，宁可开闸科学分洪保住大坝（拒绝溢流、限流降级），绝不能看着大坝连带下游城市一起垮掉。
      - card:
          title: 例题：同样遇到突然暴涨流量，为什么“快速拒绝 + 优雅降级”能让系统 10 秒爬回正常？
          body: |
            假设数据库平时最多稳稳服务每秒 `400` 次查询。现在外部突然涌来每秒 `1,200` 次请求。对比“全放进去排队硬扛”与“入口限载 + 降级保核”两种命运（11 章）：
          reveal:
            - title: 第 1 步：不拒绝的话，1,200 个请求全部卡超时——有效产出跌回零
              body: 数据库池被 1,200 个请求彻底挤满争抢锁资源后，连原本能轻松做完的每秒 400 单也会被拖垮到 10 秒全部失败超时，此时全站真实有效成交量反而是 `0`。更糟糕的是，这 `1,200` 个失败客户端接着立刻全体同时重试，把原本 `1,200` 的洪峰瞬间放大成 `3,600`。
            - title: 第 2 步：入口立刻切流限载并关闭推荐花哨卡片，核心结账保持稳产 400 单
              body: 网关对超出核心上限的那 800 次非紧急请求毫秒级返回轻量提示 `429/503`（不让它们进后面浪费数据库宝贵连接），同时开关暂时降级关闭推荐猜你喜欢查询，于是每秒稳稳保住核心 `400` 单下单成功结账。洪峰一退，后端毫发无损瞬间恢复绿色。
      - item:
          id: q-backoff-jitter
          type: choice
          prompt: '当客户端调用后端失败准备自动发起重试时，为什么现代工程库强烈规定必须写 **指数退避 + 随机抖动（Exponential Backoff + Jitter）**，而不是写 `for _ in range(3): call()` 或固定等整整 `2.0s` 再重发？'
          options:
            - text: 防止故障瞬间海量客户端在同一精准时刻反复齐步压向刚要喘口气恢复的后端（惊群共振效应），通过指数拉长间隔并随机分散时间削平二次尖峰
              correct: true
            - text: 因为 Python 规定在循环里调用网络请求时随机数函数会自动加速
              why: 加入随机抖动专门用来把原本同时失败的几万个客户端时间轴“错峰打散”，给后端留出恢复呼吸窗口
            - text: 因为固定等 2.0 秒会让请求永远发不出去
              why: 固定统一等 2.0 秒发得出去，问题正出在几万个同时出错的客户端 2.0 秒后又像方阵一样一齐撞回来。
          explain: "**限流降载守入口 + 有界超时的短队列 + 带抖动退避控重试**，合称高并发抗过载三件套。"
      - item:
          id: q-capacity-250-n-plus-1
          type: number
          prompt: 另一条订单接口高峰每秒请求量约为 `250` 次，单台实例稳妥容量为 `100` 次/秒。为保证随时坏掉或重启 `1` 台仍不超载（**N+1**），至少需部署多少台？（填整数）
          answer: 4
          explain: 峰值需 `ceil(250 / 100) = 3` 台；加上 `1` 台单机失效与滚动更新缓冲，最少需要 **`3 + 1 = 4`** 台。
      - card:
          title: 例题：为什么容量估算不能只按“全年平均每秒 50 次请求”来买机器？
          body: |
            很多初学者算平均一天请求总数除以 86,400 秒，得出“平均每秒才 50 次，一台机器就够用啦”。实际部署时会怎么踩坑（8、11 章）？
          reveal:
            - title: 第 1 步：流量呈昼夜尖峰分布，必须用“高峰 QPS + 冗余裕量”定规模
              body: 真实用户集中在晚 8 点到 10 点下单或早上 9 点打卡，晚高峰的峰值流量常常是全天均值的 6 到 10 倍。按全天均值买机器，每天准点晚高峰必然全站卡死。必须以实测峰值（例如 300 QPS）除以单机稳妥上限，再向上取整叠加至少 `N+1`（跨机房多活甚至要保证整片区失联时其余区仍撑得住峰值）来算基线容量。
            - title: 第 2 步：还要定期实弹做“限载压测”验证降级开关真管用
              body: 从来没在压测环境中真实打满过流量上限的系统，真到大促溢流那天往往直接整个崩掉而不是按预想优雅降级；因此第 8 与 11 章建议配合受控负载演练，确保超限拒载和带抖动退避按设计起作用。

  # ======================================================================== 制品与依赖锁定
  - id: locks
    chapter: 制品与依赖锁定
    title: 制品库、依赖锁定与哈希安装验证
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 你昨天在自己笔记本上用宽松的 `requirements.txt`（只写了 `flask>=3.0`）装包调试一切顺利；今天代码原封不动推上 CI 流水线重新跑 `pip install -r requirements.txt`，却莫名其妙全部报错挂了。罪魁祸首最常见是什么？
          options:
            - text: 昨天到今天之间上游某个第三方小库悄然发布了含破坏性修改（或被投毒）的小版本更新，宽松版本声明没锁定确切版本与内容哈希，CI 装到了不同的依赖树
              correct: true
            - text: 因为 Python 运行环境在每周三会自动切换不同的内置语法规则，导致昨天的代码报错
              why: 你的业务代码一行没变，变的是依赖生态里偷偷飘动升级的间接子依赖版本
            - text: 因为 CI 服务器每天规定只能装昨天以前发布过的包
              why: 缺的是一份把全树所有直接/间接依赖精确钉死并带加密指纹校验的“锁定清单”
          explain: 要保证“我本地怎么过、CI 和生产就怎么过、一字都不差”，必须管好依赖制品与精确版本冻结清单。
      - card:
          title: 不可变制品库与锁文件的双重价值
          body: |
            现代工程严格区分两份清单：
            - **意愿声明文件**（如 `package.json`、`pyproject.toml`）：写人话，“我需要 flask 3.x”；
            - **锁文件**（Lockfile，如 `package-lock.json`、`poetry.lock` 或带 `--hash` 的锁定版 `requirements.txt`）：由包管理锁定全部直接及深层子依赖的**精确小版本号与文件 SHA-256 哈希**并提交进版本库。

            打包产出的成品推送到**不可变制品库**——一旦版本号入库就禁止覆盖篡改，做到全链路可回溯。
      - card:
          title: 严格防漂移与防投毒命令：`pip --require-hashes` 与 `npm ci`
          body: |
            开发期加新库才去更新锁文件；在 **CI 构建和生产部署**里，绝不允许重新解析改写锁文件：
            - **Python：`pip install --require-hashes -r requirements.txt`**：强制要求清单里**每一项**依赖及其所有子依赖都必须附上 SHA-256 校验哈希，下载回来哈希对不上当场报错中止，防包仓库源被劫持或悄悄偷换。
            - **Node.js：`npm ci`**：严格按照已提交的 `package-lock.json` 原样干净重装进全新 `node_modules`，若发现 `package.json` 与锁文件不一致直接报错失败，绝不自作主张改写锁文件。
      - item:
          id: q-pip-npm-ci-match
          type: match
          prompt: 把两类依赖锁紧命令与它们各自的精确检验行为匹配起来。
          pairs:
            - ["`pip install --require-hashes -r requirements.txt`", 要求全部直接和间接依赖均声明加密哈希并在安装前逐一核验，防下载被偷梁换柱]
            - ["`npm ci`", 按锁文件 `package-lock.json` 干净严格重装精确依赖版本，且发现不匹配立即报错绝不改写锁文件]
            - ["宽松 `package>=1.0` 无锁装包", 每次构建都会去上游重查最新满足的版本，极易发生今天过明天挂的不可控依赖漂移]
            - [把锁文件提交进版本库跟踪评审, 让全队和 CI 随时通过差异审查看清引入或升级了哪些底层子库]
          explain: 开发期谨慎升级并用 PR 审查锁文件变化，构建阶段用 `npm ci` 和 `--require-hashes` 绝对照单严格复装，一个字都不能少。
      - card:
          title: 例题：为什么用常规 `npm install` 在 CI 跑构建比 `npm ci` 更危险？
          body: |
            小李在公司项目修改了 `package.json` 里的某个库版本，却忘了运行更新对应的 `package-lock.json` 就直接提了代码。对比 CI 里跑 `npm install` 与 `npm ci` 的区别：
          reveal:
            - title: 第 1 步：CI 偷跑普通 `npm install` 会“悄无声息顺便另算出一套未评审的树”
              body: "`npm install` 在发现 `package.json` 与 `package-lock.json` 冲突时，会现场联网去挑一个新兼容组合在本地改掉锁文件状态继续往下跑——最后打出来的生产成品装的究竟是哪版子依赖，Git 仓库里完全查不到真实记录。"
            - title: 第 2 步：改用 `npm ci` 当场红灯拦下不一致与潜在篡改
              body: "`npm ci` 一上来先把旧 `node_modules` 彻底清空保证环境干净，发现 `package.json` 与 `package-lock.json` 有丝毫对不上立刻报错拒绝构建，逼着开发者把确切算好哈希的锁文件修改一并提交评审，把依赖树变更透明摊在阳光下。"
      - item:
          id: q-require-hashes-security
          type: choice
          prompt: 使用 `pip install --require-hashes -r requirements.txt` 时，如果某个软件镜像源被攻击者临时替换了 `requests-2.32.3.whl` 安装包里面的两行代码（但版本号文件名伪装得一模一样），执行安装会发生什么？
          options:
            - text: 文件下载完计算出的 SHA-256 哈希与 `requirements.txt` 锁定的哈希不匹配，`pip` 当场拒绝安装并抛出哈希校验错误中止流程
              correct: true
            - text: "`pip` 会贴心地自己重新计算坏包的哈希再帮黑客改写并继续安装"
              why: "`--require-hashes` 是以仓库里提交锁定的原始哈希作只读权威标准，任何内容哪怕只改 1 个比特也会因哈希不符而彻底被拦截"
            - text: 如果黑客没改版本号只改了函数实现，哈希校验是发现不了的
              why: SHA-256 加密哈希校验的是整个归档文件完整内容，无论版本号写什么，内容变动 1 比特都会导致哈希完全面目全非
          explain: 锁定精确版本号防“上游意外升版本飘移”，叠加 **SHA-256 哈希校验**进一步防“同版本号被偷换恶意文件”。
      - card:
          title: 例题：当线上依赖突然爆出高危漏洞需要紧急升级，如何按标准工作流更新锁文件？
          body: |
            有些新手遇到安全补丁时图省事直接手工登录发布脚本改个数字或者 CI 里跳过锁校验；规范利用锁文件推进安全修复应该怎么拆两步走？
          reveal:
            - title: 第 1 步：在开发分支受控升级那一个库并重新生成完整锁文件
              body: 开发者在本地工作区运行包管理升级命令把那个漏洞依赖拉到修复版，由工具重新算好整棵依赖树与全部 SHA-256 校验哈希，提交清晰的锁文件变化差异给团队审查确认——既看清升级是否顺带牵动了十个无关底层库，又防止恶意包偷偷换掉原仓库来源。
            - title: 第 2 步：合并主干后 CI 照旧用严格模式 (`npm ci` / `--require-hashes`) 重装构建
              body: CI 流水线始终保持最高戒备的严格锁定安装开关绝对不放松；等新提交经过单元测试与打包验证合入主分支，生产环境就能零偏差稳妥装上经过哈希检验的干净新版本，做到“平时锁得死、该升能透明升”。
      - item:
          id: q-lockfile-in-git
          type: choice
          prompt: 关于应用程序的锁文件（如 `package-lock.json`、`poetry.lock` 或带哈希锁定的 `requirements.txt`），应当怎样对待版本管理（Git）？
          options:
            - text: 必须提交进版本库并保留在代码评审中——因为没有锁文件，CI、同事电脑和生产构建装出的深层间接依赖就会各不相同
              correct: true
            - text: 必须写进 `.gitignore` 彻底忽略不提交，让每个人每天各自随机下载不同小版本
              why: 应当写进 `.gitignore` 忽略的是几百 MB 的下载安装目录本身（如 `node_modules/`），而体积轻巧、记录精确版本与哈希的**锁文件**必须提交进 Git。
            - text: 应该用纯手工瞎改锁文件里的哈希字符串
              why: 锁文件应由包管理器自动计算生成并配合 PR 审查确认，绝不要手工编造里面的哈希值
          explain: 牢记黄金配对：**`node_modules/` 等已装依赖目录绝不提交进 Git，而精确记录它们的 `锁文件` 必须老老实实提交进 Git**。
      - card:
          title: 例题：为什么需要“不可变制品库”而不是反复覆盖同一个 `v1.0.0.tar.gz`？
          body: |
            有团队发布成品时直接用新构建的文件覆写制品库里已存在的 `app-1.0.0.whl`，后来审计时发现三台生产机跑的竟是两份不同的 `1.0.0`。怎么规范（制品管理）？
          reveal:
            - title: 第 1 步：每次发布必须带严格递增或提交指纹号、严禁同号覆盖
              body: 只要改过哪怕一行代码或更新过依赖锁文件，就必须打出新版本或带新 `sha` 标签推进制品库；制品库策略应禁止普通流水线直接覆盖或删除已签收版本。
            - title: 第 2 步：部署节点只拉取不可变精确哈希摘要
              body: 上线拉取成品时不仅核对版本号，更以 SHA-256 摘要固定拉取；无论半年后扩容新加机器还是半夜紧急回退旧版，拿到的永远是完全同一份历经全套验收测试的成品。
      - item:
          id: q-immutable-artifact-repo
          type: choice
          prompt: 在制品管理实践中，为什么生产流水线强调“不可变制品（Immutable Artifacts）”，禁止重新打包覆盖制品库里已经发布的同一版本号文件？
          options:
            - text: 覆盖旧编号会导致“同样挂着 v1.2 标签的两台机器实际跑着不同代码”，彻底破坏可追溯性、审核一致性与紧急回滚可靠性
              correct: true
            - text: 因为硬盘物理上不允许任何文件重命名或新版本增加 1 个号
              why: 我们正应该推进新版本（如 `v1.2.1` 或带提交哈希标签），绝不要偷改旧号对应内容
            - text: 覆盖同一个文件名会让下载速度慢一万倍
              why: 核心问题是丧失单一可验证真相、导致线上集群“同版本号不同内容”的隐蔽错乱
          explain: “制品一旦打出入库就只读不可变，任何小修小改都往前滚新号”，这是可信发布的基础规矩。

  - id: repro
    chapter: 制品与依赖锁定
    title: 可复现构建、环境变量与构建环境固化
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 两台干净构建服务器拿了**完全同一份源码和锁文件**先后相隔 5 分钟各打包出一个压缩制品 `app.zip`。拿去一算 SHA-256 摘要，结果却完全不一样。这难道一定意味着其中一台构建服务器刚才已经被黑客植入后门篡改了吗？
          options:
            - text: 不一定。就算完全没遭篡改，当前时间、文件扫描排列顺序、绝对构建路径、时区和随机数等非确定因素一样会让同一份源码编出不同摘要——必须控制好全部可变输入再谈对比验证
              correct: true
            - text: 百分之百确定肯定是被外星黑客当场注入后门病毒了，可以立刻报警
              why: 常规软件打包过程默认往里塞入时间戳、绝对目录名和操作系统遍历顺序，因此默认压出来的成品每次摘要都不同，所以摘要不同不能直接说明被篡改。
            - text: 因为 SHA-256 算法每隔一分钟结果就会随机变一次
              why: 对一模一样的一串文件内容，SHA-256 计算结果永远绝对一字不差；差异来自两个 `app.zip` 内部本身藏了细微不同的时间戳或顺序
          explain: 这就是 **可复现构建（Reproducible Builds）** 的迷人与严谨之处。
      - card:
          title: 什么是可复现构建与受控的七类隐形变量
          body: |
            如果拿同一份源码与清晰环境说明，由两台互不相干的机器编出**逐位相等、SHA-256 完全相同**的产物，就叫**可复现构建（Reproducible Builds）**。想消除非恶意差异，前四项常见变量必须先控死：
            1. 时间戳（统一用 **`SOURCE_DATE_EPOCH`** 环境变量替代当前系统时间）；
            2. 输入与归档写入顺序（先 `sorted()` 排序，18.4/18.10/18.11）；
            3. 构建目录路径（映射成统一相对路径）；
            4. 区域与时区（如固定 `LC_ALL=C`、`TZ=UTC`，18.8–18.9）。
      - card:
          title: 补齐工具链/依赖/随机性，以及它的认知边界
          body: |
            除时间顺序外，还要锁死后三项：工具链精确版本、锁死的依赖清单，以及消掉随机种子或未控镜像差。
            - **发现篡改原理**：官方包若多了一行源码里没有的暗桩，独立重编的摘要立刻不匹配。
            - **重要边界**：反之**不一致本身只能报警排查，不能单独直接等价于“一定遭恶意篡改”**——也可能是遗漏的时间戳或环境差在作祟。
      - item:
          id: q-repro-factors
          type: choice
          multi: true
          prompt: 想要把一条普通构建改造成真正的 **可复现构建（Reproducible Builds）**，应当消除或固定下列哪些常见隐形变量？（多选）
          options:
            - text: 使用 `SOURCE_DATE_EPOCH` 固定所有嵌入档案时间戳与时区（如 `TZ=UTC`、`LC_ALL=C`）
              correct: true
            - text: 在把目录打包进归档前先按文件名稳定排序（避免文件系统列目录顺手乱序）并抹除归档内多余宿主属性
              correct: true
            - text: 固定构建目录路径（或映射相对路径）、固定构建工具链与依赖确切版本并消除未设种子的随机数值
              correct: true
            - text: 让构建脚本故意在每次打包构建时把当前计算机开机总秒数和 `random()` 写进正文里
              why: 实时开机秒数和未控随机数会故意破坏两次构建的逐位一致，必须从构建输出中剔除或用确定性配置替代
          explain: 只要把时间、顺序、路径、地区时区、工具链、依赖和随机性这 7 项杂音全收编，同一段源码放两地重新编也能算出完全相等的指纹。
      - card:
          title: 例题：用 Python 实测“仅仅条目顺序或日期差一天，ZIP 指纹就变天”（verify 实验）
          body: |
            假设把完全相同的两个小文本文件 `app.txt` 与 `docs.txt` 打进一个 ZIP 压缩包。只是两个参数稍微变了一丁点，SHA-256 怎么跳变？看真实实验结果：
          reveal:
            - title: 第 1 步：文件条目写入顺序颠倒，内容一模一样摘要却完全不等
              body: 仅把归档列表从 `["app.txt", "docs.txt"]` 颠倒成 `["docs.txt", "app.txt"]`（连文件内部字都一个没改），两份 ZIP 的整个压缩体排布就不同，算出来的 SHA-256 完全对不上；同样，如果只把里面时间从 `11 月 1 日` 改到 `11 月 2 日`（即未锁 `SOURCE_DATE_EPOCH`），摘要照样大变。
            - title: 第 2 步：加上 `sorted()` 排序 + 固定时间后，摘要逐位严格相等
              body: 对两台不同主机收集的文件列表统一调用 `sorted(names)` 稳定排序，再把条目修改时间全部锁死到环境变量 `SOURCE_DATE_EPOCH` 指定的同一秒（例如 `(2026, 11, 1, 0, 0, 0)`），两份 ZIP 算出的 SHA-256 立马严丝合缝一字不差。
      - item:
          id: q-repro-mismatch-conclusion
          type: choice
          prompt: 两个独立构建节点拿同一份公开项目代码与声明好的锁文件分别构建后，产出的可执行产物 SHA-256 摘要**不一致**。据此能直接得出什么结论？
          options:
            - text: 可以发现并定位两边产物存在差异，触发人工核查（差异既可能是恶意后门篡改，也可能是某个未消除的时间戳/路径/环境差异），不一致本身还不能单独证明一定存在恶意篡改
              correct: true
            - text: 既然不匹配，就证明开源社区一定已经全部被黑客接管，无需做任何差异对比直接定罪
              why: 不一致性只是敏感的“报警哨子”，最终必须靠检查差异点究竟是无害的时间戳/路径偏移，还是真正凭空多出的未声明代码，来区分环境噪点与真正恶意篡改
            - text: 一致与否没有任何用处，就算多被插了一千行后门也不影响摘要
              why: 一旦环境全实现可复现控制，插进哪怕多 1 行后门也会立刻打破一致性而被抓个现行。
          explain: 永远牢记精确的逻辑边界：**可复现构建是高效敏锐的警报器——一致则强力印证未篡改，不一致提示深入排查差异来源（不可武断直接定性为恶意篡改）**。
      - card:
          title: 例题：为什么构建环境说明必须覆盖基础系统与底层非主流环境差异？
          body: |
            只把项目自己的工具小版本号记下来往往还不够。在 D 18.14 与 19 章里，哪些经常被忽略的环境细节会悄悄破坏复现？
          reveal:
            - title: 第 1 步：固定系统镜像摘要、本地语言区域与构建目录前缀映射
              body: 不同操作系统版本甚至默认地区设置（如中文排序顺序 vs `LC_ALL=C` 排序顺序）都会让归档里文件的排放次序暗暗改变；如果在产物里嵌入了构建机绝对目录（如 `/home/alice/...` 与 `/home/ci/...`），两地摘要也对不上，必须用固定相对路径映射和锁定容器基础系统摘要消除。
            - title: 第 2 步：对受限专有操作系统的应对策略
              body: 像完全开放组件可以用完全公开可检验的容器底座记录；哪怕必须跑在闭源专有操作系统上，也应当把精确补丁级数、工具版本与受控环境清单随产物一并记录归档，方便尽量隔离差异缩小排查范围。
      - item:
          id: q-source-date-epoch
          type: choice
          prompt: 在构建软件或生成制品时，设置标准环境变量 **`SOURCE_DATE_EPOCH`** 的作用是什么？
          options:
            - text: 告诉打包工具、文档生成器和归档程序不要写“当前真实跑构建这一秒的时钟时间”，统一改用这一个源自最后一次代码提交的固定时间戳，消除构建时间引起的差异
              correct: true
            - text: 让构建工具自动删光软件里所有写着年份的版权说明
              why: 不会删光日期，而是用统一、明确、可重复的统一构建基准时间替换掉每次构建都会变的时钟值
            - text: 让所有用户电脑上的系统日历都停留在 1970 年
              why: "`SOURCE_DATE_EPOCH` 只影响当前构建产物内部打上的时间标记，完全不干扰运行期系统的真实时钟"
          explain: "`SOURCE_DATE_EPOCH`是整个 Reproducible Builds 标准生态里流传最广、见效最快的基准规范之一。"

  # ======================================================================== 构建溯源与软件物料清单
  - id: provenance
    chapter: 构建溯源与软件物料清单
    title: SLSA 框架、构建溯源与隔离级别
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 可复现构建能检查“这包东西是不是源码编的”。但更多公司业务内部根本来不及让全球每个人都从零重编一遍成品。用户只从网上拉取你发布的一份镜像或安装包，怎么才能不从头自己重编，也能放心验证“它确实出自正规官方 Git 仓库主分支的那条官方流水线、中途没在某个开发者私人笔记本上被私塞后门”？
          options:
            - text: 由受信任隔离的官方构建平台在打包完那一刻自动生成一份带签名防伪的“出处出生证明文件”，写死源码仓库提交号、平台和构建配方供用户当场验签。
              correct: true
            - text: 只需在软件官网主页大字写一句“我们保证绝对没问题请信任我”
              why: 口头文字承诺既不能防中途假冒官网，也不能阻止个人电脑被病毒偷偷替换打包成品
            - text: 把项目源码仓库设为只读，并让开发者自己在本地生成一份没有数字签名的 TXT 说明文件一起上传
              why: 现代供应链防线的核心思想是由独立隔离平台自动签发防伪出身证明，而不是手动信任私人电脑
          explain: 这正是 **SLSA（Supply-chain Levels for Software Artifacts）v1.2** 规范解决的核心信任问题。
      - card:
          title: 什么是 SLSA 与构建溯源（Build Provenance）
          body: |
            如果把软件比作食品，**构建溯源**（Build Provenance）就是由“经认证的全自动中央厨房（官方 CI 平台）”开出的一张带防伪数字印章的“出生证”：
            - 记录清楚三大真相：**产物哈希是谁（Subject）**、**从哪份代码提交与源仓库（Source）编出来的**、**由哪个构建平台按哪步脚本流程（Builder）跑出来的**；
            - 用平台私钥签名后连同制品一起分发，下游部署前随时验证“出身是否清白”。注意 SLSA **不**代替代码逻辑安全审计或漏洞管理，它专心管防篡改供应链出身真伪。
      - card:
          title: SLSA Build Levels（构建等级）与平台隔离强度
          body: |
            **SLSA Build Levels** 按防伪隔离能力逐级抬高信任：
            - **L1**：有自动化生成的结构化记录证明基本出身与构建过程，防人为拿错包；
            - **L2**：跑在受管云构建平台并由平台签名签发溯源证明，阻止包在流出后遭偷换；
            - **L3**：每次构建都在全新临时隔离机跑，脚本拿不到签名私钥，防同平台串味或伪造印章。
      - item:
          id: q-slsa-provenance-what
          type: choice
          prompt: 一份符合 **SLSA** 规范的 **构建溯源（Build Provenance）** 证明文件里，核心必须包含并经平台签名的可验证事实是什么？
          options:
            - text: 生成产物的精确哈希指纹、所用构建平台的身份、构建入口配置脚本，以及拉取构建的精准代码仓库和提交版本等上游材料来源
              correct: true
            - text: 生产数据库里所有用户的业务表行数据与明文连接密码
              why: 构建溯源聚焦软件制品的供应链来源证明，不含私人隐私与非构建信息
            - text: 用肉眼很难看懂但其实完全没有数字签名的纯文本草稿
              why: 在 SLSA L2 及以上等级，必须由构建平台使用受保护的签名密钥对溯源信息进行数字签名，否则攻击者也能随手伪造假溯源文本
          explain: '**构建溯源 = “谁（平台）用哪段剧本（工作流）拿哪一版原料（仓库提交）造出了这个确切指纹成品（哈希）”的数字防伪出生证**。'
      - card:
          title: 例题：为什么 SLSA L3 要求“构建脚本绝对拿不到平台签名密钥”？
          body: |
            如果某条 CI 流水线为了给制品开溯源证明，把签发溯源的私钥直接作为环境变量塞进了用户的构建运行脚本里（L2 与 L3 差异所在）。老练的攻击者会怎么趁虚而入？拆两步看：
          reveal:
            - title: 第 1 步：一旦构建脚本能摸到私钥，恶意代码就能自签任何假出身证
              body: 假设上游不小心引入了一个在 `setup.py` / 构建步骤里暗藏偷窥逻辑的依赖库，构建一启动它就能顺手读取运行环境里的签名私钥发回给黑客——甚至当场直接伪造一份写着“纯洁无害主干代码生成”的假溯源盖章，欺骗下游全部验签关口。
            - title: 第 2 步：高隔离（SLSA L3）把“造成品沙箱”和“签发证明控制面”隔绝开
              body: 真正的 SLSA L3 构建平台每次拉起彻底干净的一次性隔离沙箱跑用户构建命令，签名私钥牢牢锁在外部受控平台控制面里面。用户脚本只能吐出最终成品，再由平台控制面根据真实拉取到的提交信息独立算出成品哈希并亲手盖章，绝不让不受信构建脚本碰到钥匙半根毫毛。
            - title: 第 3 步：每次运行销毁沙箱，阻断上一个恶意构建残留下次复用污染
              body: 哪怕有恶意脚本试图修改宿主机工具链或者留下驻留程序篡改下一位用户的正常任务，由于每次任务都建在用完立刻销毁的一次性新环境里，污染完全留不下来，从根本上隔断跨任务横向投毒。
      - item:
          id: q-slsa-levels-match
          type: match
          prompt: 把 **SLSA** 构建安全分级与它们各自重点防御的风险层级对应起来。
          pairs:
            - ["**SLSA Build L1**", 自动化产出标准格式的构建溯源说明，消除“这包从哪随便拷来的”盲区与无意失误]
            - ["**SLSA Build L2**", 使用集中托管平台生成并签名溯源，阻断成品在离开构建机后被人半路偷换篡改]
            - ["**SLSA Build L3**", 全新一次性隔离构建 + 用户脚本彻底碰不到签名密钥，防同一平台上不同构建间交叉投毒或偷印假章]
            - ["**下游验签守门（Verify Provenance）**", 上线部署前先核对制品哈希与溯源签名确实来自指定官方仓库分支才放行安装]
          explain: 溯源不只是生产方发完就丢，必须在**部署验收门前**写一条校验策略真正卡住未经官方认证的来路不明成品。
      - card:
          title: 例题：用 SLSA 验签门卫拦截“绕过正规仓库直接偷传上线的私人假包”
          body: |
            假设某攻击者虽然偷到了制品仓库某个普通上传接口凭证，在自己电脑上私编了一个带后门的容器包强推上去试图鱼目混珠。按 SLSA 策略怎么当场挡住它？
          reveal:
            - title: 第 1 步：先查验防伪签名的签发身份（Builder）与签名完整性
              body: 部署平台准入验证器收到要发布的制品哈希后，读取伴随它的溯源证明文件并核对数字签名：这名攻击者手里根本没有官方托管高隔离构建平台控制面死守的签名公钥对应私钥。只要没有受托官方 Builder 签出的合法证书，或者签名与制品 SHA-256 对不上，第一步就立刻亮红灯拒收。
            - title: 第 2 步：再核对溯源记录里的源仓库与触发分支白名单
              body: 哪怕有同平台其他无关公开测试仓库也跑过一次官方构建想混进来顶替，部署策略进一步核对溯源声明里的 `Source` 字段必须精确匹配本公司核心业务仓库的 `main` 保护分支以及正规发布工作流文件路径，彻底把“来路不对的合法构建包”也一并拦在生产大门之外。
      - item:
          id: q-slsa-scope-limit
          type: choice
          prompt: SLSA 规范有明确不覆盖的范围。下面哪项问题是单靠“通过 SLSA L3 构建溯源验证”**仍然无法自动替你解决**的？
          options:
            - text: 正规研发自己亲手写进官方仓库代码里的逻辑漏洞（如 SQL 注入或业务算术写错），因为溯源只保证“包确实诚实出自这段正式代码”，并不负责代码本身没有缺陷
              correct: true
            - text: 防止外人拿私人电脑瞎编一个混进木马的包冒充官方渠道发布的成品
              why: 识别并挡住来历不正、不是出自官方隔离流水线产出的伪冒成品，正是 SLSA 溯源的核心看家本领
            - text: 验证官方成品对应的究竟是哪一条 Git 分支和提交号
              why: 精准记录关联触发构建的精确源码仓库与提交指纹，正是溯源陈述里的关键必选项
          explain: 分清防线各自边界：**代码自身有没有写错**靠 CI 测试与安全审查，**手里成品是不是正经按这套官方流程打出来的**靠 SLSA 构建溯源。
      - card:
          title: 例题：为什么选对受托构建平台与正确分发验证策略一样重要？
          body: |
            哪怕构建平台给你盖好了漂亮的 L3 防伪印章，为什么生产部署前仍常掉链子？关键看生产者与分发链路：
          reveal:
            - title: 第 1 步：确保平台统一强制走一致构建流程
              body: 如果官方流水线允许在发布前由开发者手动通过命令额外覆写成品参数，就会破坏构建过程一致性；合格的 Producer 必须要求从一致的声明式工作流出发产出唯一可信成品与对应溯源证书。
            - title: 第 2 步：把溯源随制品一起公开分发，并在上线网关强制查验策略
              body: 证明只躺在构建机硬盘里没人检查等于白签。必须把防伪溯源记录与成品一并推送到制品库，由上线部署平台最后一道关口强制核验“签名私钥属于受托官方平台 + Source 仓库与主分支完全匹配”，验不过一律拒之门外。
            - title: 第 3 步：同时验证源构建工具链与独立输出摘要的一致性
              body: 如果官方流水线同时还公布了可复现配方与固定工具链版本，合规要求极高的核心安全团队甚至可以直接抽检独立重编出一模一样的产物散列，实现“受控出身证明（SLSA）+ 独立内容验算（Reproducible Builds）”双保险。
      - item:
          id: q-slsa-source-vs-build-prov
          type: choice
          prompt: 按照 SLSA 规范，当你想向客户证明“成品包确实是官方流水线从特定源码仓提交编出的”（Build Provenance），还需要配合注意哪一层防线避免“上游仓库本身在拉取前已被坏人强推了未审核脏代码”？
          options:
            - text: 结合源仓库分支保护、双人代码评审与源码溯源（Source Provenance），保证连触发构建的源提交本身也经过正规授权审核合入
              correct: true
            - text: 只要在打包后把所有 Git 历史全部删掉就彻底不用管源码审核了
              why: 删掉代码历史只会毁掉审计追踪；SLSA 把“Build 环节防篡改”和“Source 源头分支审核合规”清晰拆开协同设防
            - text: Build Provenance 会自动改写开发者在自己电脑上写错的 Python 业务逻辑
              why: 构建溯源忠实证明“输入某版源码按此流程输出了该成品”，源码本身正确与合规性需源头分支保护和 CI 测试守门
          explain: “源头有人审、代码合并受保护（Source），加上构建全程隔离签名不出岔子（Build）”，两端合起来才是完整供应链防线。
      - card:
          title: 例题：如何同时向客户验证“源仓库代码合规”与“构建输出未被调包”？
          body: |
            把 **SLSA** 当作软件出厂安检站：仅仅证明“包裹是从正规工厂流水线打包出来的”够了吗？如果工厂大门没锁，半夜有人偷偷往原料筐里塞了烂苹果呢？
          reveal:
            - title: 第 1 步：源头端用受保护主分支 + 强制两人代码评审守住“Source Provenance”
              body: 在项目代码库设定分支保护规则，严禁任何个人跳过检查直接向主干强制覆盖推送，要求每条改动必须由至少两位独立同行审查通过并跑完自动化测试，从根源避免带私货代码混进源仓库主线。
            - title: 第 2 步：构建端由托管高隔离平台（L3）出证并留存不可变摘要对应关系
              body: 当流水线从受保护主线拉取特定提交号后，在一次性隔离沙箱内禁止构建脚本摸到签名私钥，最终由平台控制面为成品哈希签发带源提交号的防伪溯源证；下游部署只要一行验证两条都符合政策预期，假冒或篡改包绝无漏洞可钻。

  - id: sbom
    chapter: 构建溯源与软件物料清单
    title: 软件物料清单（SBOM）、CycloneDX 模型与合规质量
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 周五晚上突然爆出一个全行业惊天高危漏洞：某个小众日志压缩开源库 `libtinyzip 1.4.2` 存在远程漏洞。老板冲进来急问：“我们公司线上跑着的 40 个服务容器包里，到底哪几个用到了这个库、究竟是不是这个版本？”如果你们没有提前准备每份成品的完整材料清单，会面临什么困境？
          options:
            - text: 只能通宵翻几十个早已归档的老仓库重新拉源码、猜当初哪个间接子依赖顺手装了什么版本——而如果随成品产出了一张机器可读的软件物料清单，10 秒钟就能全局精准检索定位受影响成品。
              correct: true
            - text: 只检查顶层手写的直接依赖清单（如只看 `package.json` 的前 5 行），完全忽略所有三四层深的间接传递依赖
              why: 现代软件往往嵌套成百上千层间接传递依赖，唯有发布时同步产出的结构化原料账本才能瞬间回答“成品肚子里到底装了啥”
            - text: 干脆把全部 40 个服务直接关掉重做一套新电脑系统
              why: 漏洞应急响应最讲究的是在 1 分钟内精准圈出“到底谁中招了、谁完全安全不必跟着恐慌停服”
          explain: 就像食品袋背面明确列出每克配料表一样，软件交付必须配上机器可读的配料表——现代软件物料账本。
      - card:
          title: 什么是 SBOM 与 CycloneDX 关键结构
          body: |
            **SBOM**（软件物料清单）以机器可读格式（如 **CycloneDX** 或 **SPDX** 的 JSON/XML）完整记下成品全部零件：
            1. **清单元数据**：标明本清单为哪份主体成品由谁生成及唯一序号；
            2. **组件清单**：列出每个直接与传递子依赖的名称、确切版本、许可、唯一标识（PURL）与内容哈希；
            3. **依赖关系图**：清晰记录是谁带进了底层漏洞组件。
      - card:
          title: NTIA 最低要素、成熟度与质量核查
          body: |
            不能随手输出一个空壳列表就当交差，优质 SBOM 必须满足：
            - **NTIA 最低合规要素**：包含供应商、组件名称、版本号、其他唯一标识、**依赖关系**、SBOM 生成者与生成时间戳这 7 项核心字段；
            - **全面性与准确度**：覆盖深层传递子依赖，精确给出版本而非含糊写 `>=1.0`，理想应在真实**构建流水线末尾连同打包成品同步生成**（而不是全靠上线半年后反猜扫描残余）。
      - item:
          id: q-sbom-purpose-match
          type: match
          prompt: 把 **SBOM** 的实际工程用途以及与它紧密协作的其他供应链文档各自区分对应起来。
          pairs:
            - ["**SBOM（软件物料清单）**", 列出成品内部所含的全部直接与间接开源组件、精确版本、依赖链条与许可证，用于秒级排查已知漏洞和合规盘点]
            - ["**SLSA 构建溯源（Provenance）**", 证明这个成品究竟由哪份代码、在哪套受控构建平台按哪步流程编出来，解决“是不是正牌出品”的来源真实性]
            - ["**锁文件（Lockfile）**", 保存在代码仓库里告诉构建工具本次该装哪些确切版本与哈希的依赖清单，保证构建前后一致]
            - [随 CI 构建完成同步产出的结构化 JSON, 确保清单实时完整反映刚打入成品容器里的真实现场组件，不漏掉传递依赖]
          explain: 记住供应链防线“黄金三角”：**锁文件**管装得准不准、**构建溯源**管是不是正厂出的、**SBOM** 管肚子里装了哪几百样零件随时查漏洞。
      - card:
          title: 例题：同样是零日漏洞爆发，对比“有 SBOM”与“无 SBOM”的应急响应效率
          body: |
            某天高危组件 `lodash` 旧版漏洞公告发布，某企业生产环境同时跑着 Java、Python 与 Node.js 混杂构建的 60 个微服务镜像。有、无高质量 SBOM 时排障过程对比两步看：
          reveal:
            - title: 第 1 步：没有 SBOM——逐个服务拆黑盒，耗时数天还容易漏掉间接依赖
              body: 很多团队只会搜索直属配置里有没有显式写过那个名字——结果早就通过某个 UI 库间接三层传进来的坏版本完美躲过了人工检索。而且不同历史老项目当初构建环境早已失踪，重跑一遍又不知不觉漂了版本。
            - title: 第 2 步：每次 CI 构建生成并留存 SBOM 进制品库——一条查询秒级圈出精确名单
              body: 当每个正式上线包都随手绑定一份符合 NTIA 要素和 CycloneDX 规范的结构化 SBOM 存进审计库后，安全人员只需输入受影响组件名称及漏洞版本区间一查，30 秒内就准确得出“只有第 7、23、41 号镜像包深层带入了旧版，其余 57 个安全”，紧接着只针对这 3 个仓库精准打补丁升锁重发。
            - title: 第 3 步：同时结合 VEX/可利用性评估聚焦真正需要半夜紧急修补的漏洞
              body: 面对每天成百上千条安全告警，并非每个在库里的组件函数都真被业务路径调用到；把 SBOM 组件列表配合具体接口调用上下文和可利用性说明（VEX），既不遗漏任何实质风险，也避免研发团队被无关告警搞到筋疲力尽。
      - item:
          id: q-sbom-ntia-elements
          type: choice
          multi: true
          prompt: 根据 NTIA 最低要素与 SBOM 质量规范，一份真正合格且可用于自动化漏洞排查的 **SBOM** 应当包含哪些核心信息？（多选）
          options:
            - text: 清单的创建作者、生成时间戳以及唯一清单标识等元数据
              correct: true
            - text: 每个直接与传递依赖组件的供应商/来源、准确名称、确切版本号以及唯一标准包标识符（如 PURL）与校验哈希
              correct: true
            - text: 清晰记录组件之间的依赖调用关系树（能查明“某个坏子库是谁带进来的”）
              correct: true
            - text: 只写一句“本程序包含大量流行优秀开源库”的纯手工 Word 散文段落
              why: 纯散文既无法被漏洞扫描引擎机读解析，也丢光了精确版本号、传递树和唯一标识符等核心关键字段
          explain: 机器可读（JSON/XML 遵循 CycloneDX 或 SPDX 标准）+ 确切版本号 + 依赖传递关系 + 全量覆盖，才是能拿来救火的真 SBOM。
      - card:
          title: 例题：除了查已知漏洞，一份高成熟度的 SBOM 在日常合规里还管哪两件大事？
          body: |
            不要以为 SBOM 只有在零日安全漏洞大爆发那天才翻出来救命。按 CycloneDX 20.2 与 SCVS 成熟度模型，平时工程与法务合规还会靠它干两件事：
          reveal:
            - title: 第 1 步：自动扫描许可证法律风险，防止不小心引入强传染性条款
              body: 一个业务工程动辄挂上两三百个传递开源小库，开发者很难靠肉眼翻遍每层子依赖的许可协议；借助机器可读的 CycloneDX SBOM 里的组件许可字段，每次合并代码 CI 都能自动检查有没有意外带上与产品商用模式冲突的许可证，在上线前就提前更换合规替代库。
            - title: 第 2 步：追踪老旧停止维护依赖与验证“每件组件均带准确哈希”
              body: 质量过关的 SBOM要求拒绝含糊不清的组件名字和空版本号，为每一个直接及传递部件写明标准定位符、来源机构和散列摘要，同时持续盘点哪些组件已落后大版本多年无人修护，帮团队有计划地推进稳妥升级换代。
            - title: 第 3 步：对接企业内部资产管理，形成完整软件资产档案库
              body: 对长期维护的多产品线企业来说，每次发版同步把结构化 CycloneDX 文件推入资产管理后台，新接手团队再也不必去老员工电脑里翻历史说明书就能看清任一线上模块的全套成分构成。
      - item:
          id: q-sbom-vs-provenance-limit
          type: choice
          prompt: 同事把公司新成品的 **SBOM** 看了又看，高兴地说：“这份软件物料清单里每个版本号写得清清楚楚，所以绝对能证明黑客没在最后打包发版前一秒偷往成品发布文件里夹带一行私有木马。”这位同事搞混了什么？
          options:
            - text: SBOM 主要是一份“组件原料目录”，它能高效排查已知开源组件漏洞与许可证合规；要防“打包成品与官方源码不符或被中途夹带篡改”，必须配合 SLSA 构建溯源验签 与 可复现构建
              correct: true
            - text: 因为 SBOM 只能记录图片大小，不能记录库版本号
              why: SBOM 恰恰就是用来精确记录各种库版本号、许可证与依赖关系的
            - text: 因为任何黑客在改代码时都会先礼貌发邮件主动往你 SBOM 里给自己添一条木马登记
              why: 没人会往物料清单里自首写了木马。只有不可篡改的构建平台签名溯源与源码复现对比，才能守住制作环节完整性
          explain: 守住全链路供应链安全，要靠 **锁文件（控输入） + 隔离平台签名溯源（证清白） + 可复现构建（可核验） + SBOM（查零件）** 四环相扣。
      - card:
          title: 例题：把 CycloneDX SBOM 接入发布流水线的最后十秒，顺手解决了哪两大盲区？
          body: |
            很多团队虽然早早就建立了依赖锁文件，为什么还是在漏洞突发夜彻夜加班排查（20–21 章）？把标准机读 **SBOM** 嵌进发布流水线最后一环后效果立竿见影：
          reveal:
            - title: 第 1 步：把跨语言项目（Python + JS + 系统底座包）全部摊成一张统一全局清单
              body: 线上服务往往一边跑着 Python 接口框架、一边带着前端静态脚本和容器底层基础库；锁文件各用各的格式分散在不同角落，唯有在构建收尾时刻统一汇总吐出一份遵循 CycloneDX 或 SPDX 的机读 JSON 物料清单，才真正做到横跨全栈技术栈用同一套工具一键搜索。
            - title: 第 2 步：随制品长期封存进审计仓库，无需翻老源码重编即可回答“三年前这包用了啥”
              body: 当年跑构建的机器与临时依赖早已退役多年，但只要每个正式上线成品出库时顺手绑定好完整 SBOM 归档留底，哪怕三年后某个老旧组件新曝出漏洞，安全台账依然能在一秒钟之内精准查出到底哪几个还在跑的历史服务包含该组件版本。
      - item:
          id: q-sbom-serialization-quality
          type: choice
          prompt: 按照 OWASP CycloneDX 的成熟度规范，同一套服务在什么时候生成 **SBOM** 最准确可靠，且推荐保存为什么样的数据格式？
          options:
            - text: 在 CI/CD 实际构建打包现场随最终成品一并自动生成（利用锁文件与真实构建上下文），并序列化输出为标准的 CycloneDX JSON/XML 等机读结构化文件
              correct: true
            - text: 等软件上线三年后再雇两位实习生凭回忆手写一份 Word 表格附在文件夹里
              why: 事后手工回猜既必然遗漏深层传递依赖，也无法被自动化漏洞扫描和安全工具批量检索解析
            - text: 把依赖库名称全部截图存成 10 张没有文字的纯照片
              why: 图片无法直接用查询工具精准检索组件名称、版本范围、PURL 和传递依赖关系
          explain: 随着构建同步自动生成机器可读、覆盖全部传递依赖和准确哈希的 CycloneDX/SPDX JSON，是高效 SBOM 落地的黄金标准。

boss:
  items:
    - id: boss-ci-cd-deploy-diff
      type: match
      prompt: 把 CI/CD 与发布工程中的五种核心模式与其精确含义一一配对。
      pairs:
        - ["**持续集成（CI）**", 频繁合入共享主分支后立即自动跑测试与集成检查，早暴露问题]
        - ["**持续交付（Continuous Delivery）**", 通过全套自动验证打包后始终保持随时可发布状态，但正式上线保留人工审批触发]
        - ["**持续部署（Continuous Deployment）**", 全过程无人干预，每次提交过关后直接自动上线生产环境]
        - ["**蓝绿部署**", 维护新旧两套完整环境，验证绿版无误后一次性切换流量并留蓝版作秒级退回垫]
        - ["**金丝雀发布**", 先让极小比例（如 1%–5%）实例接真实流量对比指标，健康后再逐步放量控住爆炸半径]
      explain: 分清“随时可发 vs 全自动发”，以及“并行双环境整切 vs 小流渐进对照”，就拿下了现代交付体系的半壁江山。
    - id: boss-gha-min-perm
      type: choice
      prompt: 你为 Python 仓库写 GitHub Actions（推送 `main` 时先装依赖测试、再打提交指纹镜像），以下哪项配置既符合标准实践又严守安全最小权限原则？
      options:
        - text: "限定 `on: { push: { branches: [\"main\"] } }`，显式锁紧 `permissions: { contents: read }`，先过 `pytest` 后构建带 `${{ github.sha }}` 的镜像"
          correct: true
        - text: 不限制 `permissions` 保留全仓库默认最高读写全权限，且测试失败了依然继续往正式仓库推覆盖 `:latest` 标签
          why: 不设 `permissions` 易被恶意依赖越权改库，测试不过还硬推 `:latest` 会直接把坏包送上网覆盖旧版
        - text: 把正式生产数据库超级密码直接明文写进 `ci.yml` 提交给全世界围观
          why: 任何仓库 YAML 都是源码历史一部分，机密口令必须走环境变量或平台受保护加密密钥注入
        - text: 在 `steps` 一开始完全不检出代码也不跑测试，直接发布一个空包上线
          why: 流水线的灵魂就是先拉指定代码过自动单元测试关卡，验证绿灯后才打标有确切提交号的不可变包
      explain: 好流水线记住五要素：收紧触发、只读权限、先测后包、不可变提交指纹命名、分离环境密钥。
    - id: boss-iac-config
      type: choice
      prompt: 关于系统配置与基础设施管理的工程铁律，下列哪一组组合**全部正确**？
      options:
        - text: 敏感密钥与环境差异放外部环境变量（缺失核心配置启动时立刻报错退出），云资源与防线写进声明式 IaC 模板先预览再应用，禁止跳过仓库线上乱手改防漂移
          correct: true
        - text: 把生产支付密钥直接写死在 Python 源码提交进版本库，且缺配置时悄悄默认退回测试密码 `123456` 继续跑
          why: 密钥入库易泄漏，而生产回退危险默认值会酿成极其严重的伪造验签安全灾难
        - text: 全部云主机安全规则坚持只用鼠标登录控制台瞎点记忆维护，绝不写进版本文本模板
          why: 手工配置不可追踪、一扩机就产生严重的配置漂移，无法满足自动化容灾和一致复制要求
        - text: 直接登录线上配置中心随手改个千倍缩小的超时阈值立刻全局覆盖，不预览不评审也不做灰度
          why: 未经校验评审和分批发布的单行配置错误是生产雪崩的第一大杀手
      explain: 记住配置治理核心：与代码分离、严检 Fail Fast、IaC 作唯一真相源先 Plan 再 Apply。
    - id: boss-obs-three-pillars
      type: match
      prompt: 面对一次复杂线上支付抖动事故，把可观测性四大核心手段与各自最拿手的破案作用连线。
      pairs:
        - ["**指标（Metrics）**", 按周期聚合成趋势曲线与分位数字（P99/错误率），最适合做宏观大盘监控与触发燃烧速率告警]
        - ["**日志（Logs）**", 按唯一请求号检索具体时刻单笔故障发生的上下文变量与精细报错原文]
        - ["**链路追踪（Traces）**", 穿针引线画出一条请求跨网关、订单、优惠券、数据库每一跳的时间耗时分解图]
        - ["**变更标记与饱和度监控**", 把刚刚发布的版本竖线叠加到延迟曲线上，并盯紧连接池或排队深度预防全面塞死]
      explain: 指标抓整体、追踪找瓶颈那一跳、日志查精准错误文本、变更线与饱和度一锤定音。
    - id: boss-budget-remain-math
      type: number
      prompt: '某核心服务设定的 **SLO** 为 `30` 天滚动窗口内可用率不低于 `99.9%`。一次版本回滚拖延累计消耗了 `35` 分钟不可用时间，请问当前周期里还剩下多少分钟错误预算？（填入精确小数）'
      answer: 8.2
      explain: '30 天总分钟数 = `30 × 24 × 60 = 43,200` 分钟；总错误预算 = `43,200 × (1 - 0.999) = 43.2` 分钟；扣去已用 `35` 分钟后剩余 = `43.2 - 35 = 8.2` 分钟。'
    - id: boss-burn-rate-math
      type: number
      prompt: '某服务 `SLO = 99.9%`（即允许基线错误率为 `0.001`）。现在观测到真实错误率突发飙高到 `0.005`（即 `0.5%`），此时的错误预算 **燃烧速率（Burn Rate）** 是基准消耗速率的多少倍？（填整数）'
      answer: 5
      explain: '燃烧速率 = 当前错误率 ÷ `(1 - SLO)` = `0.005 ÷ 0.001 = 5` 倍（`5x`）；而若错误率达到 `1%` (`0.01`)，燃烧速率就是 `10x`。配合长短双窗口校验，既能防偶发毛刺误报，又能在修完故障后极快恢复消警。'
    - id: boss-capacity-n-plus-1
      type: number
      prompt: '某高频微服务高峰每秒流量为 `300` QPS，单台健康实例稳妥承载容量上限为 `80` QPS。为满足至少能扛住任意 1 台实例挂掉或下线升级（**N+1** 冗余）的最低台数需求，集群至少需要准备多少台实例？（填整数）'
      answer: 5
      explain: '保底扛峰需要 `N = ceil(300 / 80) = ceil(3.75) = 4` 台；再加上 1 台应对单机宕机或滚动更新时的冗余，最少需要 **`4 + 1 = 5`** 台。'
    - id: boss-overload-incident
      type: choice
      prompt: 遇到突发 8 倍峰值流量引发大面积报错并触发深夜火警时，下面哪一组应急响应与后续复盘操作最符合 SRE 准则？
      options:
        - text: 由单一事故指挥官统筹优先通过回滚/切流/优雅降级与主动限载尽快恢复核心可用性，客户端重试用带随机抖动的指数退避，事后开无责备复盘会锁定系统防呆改进工单
          correct: true
        - text: 群里所有人互相猜疑抢着乱点重启，客户端写个死循环零等待瞬间重试撞翻机器，事后开除那位值班工程师就算彻底结束
          why: 无统一指挥会自乱阵脚，零间隔重试会放大雪崩，而惩罚个人却不改防呆机制会让几个月后别人再栽进同一口坑
        - text: 面对低流量服务 2 笔请求错了 1 笔立刻定性为 50% 全网毁灭级故障，完全不考虑小样本窗口调节与合成探测
          why: 低流量小样本极易制造假百分比告警，需要调优窗口或引入连续错误门槛与合成流量
        - text: 发现错误预算早已跌到负数依然硬上毫无安全保障的高危大型重构特性
          why: 预算见底必须执行事先签好的错误预算政策——先暂停常规高危功能更新，全员投身可靠性加固
      explain: 止损靠统筹降载退避、防重演靠机制性无责备改造，预算见底知止损换挡，这就是 SRE 工程成熟度的体现。
    - id: boss-repro-conclusion
      type: choice
      prompt: 团队为了实现 **可复现构建**，在构建工具里已经开启排序输入并设定 `SOURCE_DATE_EPOCH`。现在两台构建节点针对相同源码分别产出了产物 `A` 和 `B`，算出的 SHA-256 却仍然不相等。对此最科学的解读是什么？
      options:
        - text: 只能确认产物存在比特级差异需启动比对排查（原因可能是尚未封堵的绝对路径、随机种子或工具链差异，也可能是途中真的遭到了恶意植入篡改），差异本身还不能单独直接证明存在恶意攻击
          correct: true
        - text: 不一致必然 100% 证明其中那台服务器已经遭到了黑客后门入侵，不用任何进一步比对差异文件即可结案
          why: 只要还有一处隐藏的本地时间戳、随机 ID 或未固定的构建目录名泄漏进压缩包，合法构建照样产出不同哈希，必须先查明差异究竟在哪
        - text: 只要在构建文件名后面硬改成一样的名字，系统就会自动忽略里面不同的恶意代码
          why: 加密哈希计算的是实际内容与内部结构，改外表文件名绝对骗不过指纹比对
        - text: 这证明全世界任何两台计算机在物理上永远算不出完全相同的摘要指纹
          why: 只要按 Reproducible Builds 规范受控处理时间、顺序、路径、时区、工具链、依赖和随机性，全球各地独立编出的产物摘要可以做到 100% 逐位一致
      explain: 一致性强力支撑“没遭暗改”；不一致则是精准警报哨，提醒工程师对比排查究竟是漏网构建杂音还是供应链被动手脚。
    - id: boss-supply-chain-all
      type: match
      prompt: 把现代软件供应链安全的四条防线命令/标准文件与它们各自把守的那一道关口连线。
      pairs:
        - ["`pip install --require-hashes` / `npm ci`", 锁死精确依赖树与加密内容指纹，不匹配绝不装、绝不私自篡改锁文件]
        - ["`SOURCE_DATE_EPOCH` + 有序无差异归档", 消除时间、顺序、路径等非确定噪点，让独立重编的成品指纹严格一致可互验]
        - ["**SLSA 构建溯源（L2/L3 隔离平台签名）**", 由受控隔离构建平台签发防伪“出生证”，证明包确实从指定正式仓库提交按正式脚本打出]
        - ["**SBOM（CycloneDX / SPDX 物料清单）**", 完整列明成品所含全部直接与传递零件及版本树，在零日漏洞爆发时秒级精准排查受波及范围]
      explain: 装得对（锁文件）+ 编得出同一份（可复现）+ 出身可验（SLSA 溯源）+ 配料一目了然（SBOM），构成完整可信交付链。
