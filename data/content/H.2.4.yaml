skill: H.2.4
version: 2
authors: [main-agent]
brief:
  why: 数字芯片由几十亿个晶体管组成，设计它要同时管住功能、速度、功耗和面积。这一站从短沟道晶体管和反相器的延迟讲起，经过各种逻辑门、加法器和寄存器的电路设计，再到标准单元、功耗和时钟，最后是从硬件描述到版图的自动化流程、静态时序分析和芯片测试。
  outcomes:
    - 用速度饱和的器件模型和等效电阻估算门的电流和延迟，说明电源电压和阈值电压怎样影响速度、能量和漏电
    - 比较静态 CMOS、有比逻辑、传输管、DCVSL 和动态逻辑，算伪 NMOS 的低电平和动态门的电荷分享
    - 用建立时间、保持时间、时钟到输出延迟、偏斜和抖动算最高频率和时序裕量，说明怎样修建立和保持违例
    - 说出标准单元的版图格式和单元库的几种视图，用延迟表插值，估算核心区面积
    - 计算开关功耗、活动因子和漏电，说明门控时钟、电源门控、多阈值等省电办法
    - 用逻辑努力确定一条路径的尺寸和级数，估算连线的 Elmore 延迟、缓冲器链、IR 压降和去耦电容
    - 写出从 RTL 到 GDS 的流程，说明综合、工艺映射、布局、布线、静态时序分析和时序例外各做什么
    - 用路径敏化找固定型故障的测试向量，估算缺陷水平和扫描测试的时间，说明 BIST 和 IDDQ 测试
terms:
  - term: 本征延迟
    def: 门只驱动自己的寄生电容时的延迟；管子加宽时电阻和自身电容同比例变化，延迟停在这个下限上。
  - term: 能量–延迟积
    def: 每次翻转的能量乘以延迟，用来同时衡量省电和速度，越小越好。
  - term: 复合门
    def: 把几级与、或、非合成一个门的静态 CMOS 门，如与或非门，只要一级延迟。
  - term: 有比逻辑
    def: 输出能否到达合格的低电平取决于上拉管和下拉管强弱比的电路，例如伪 NMOS，输出为低时有静态电流。
  - term: 传输管
    def: 让信号从源极和漏极之间穿过、由栅极决定通断的晶体管，用来搭逻辑可以少用管子。
  - term: 阈值损失
    def: NMOS 传 1 时输出最高只到电源电压减阈值电压、PMOS 传 0 时最低只到阈值电压的现象。
  - term: 传输门
    def: 一个 NMOS 和一个 PMOS 并联、栅极接互补控制信号的开关，能把 0 和 1 都完整地传过去。
  - term: 电平恢复
    def: 用后级反相器输出控制的 PMOS 把传输管输出的不满的高电平拉到电源电压的做法。
  - term: 差分级联电压开关逻辑
    def: 两个互补的 NMOS 下拉网络加两个交叉耦合 PMOS 的电路，同时输出 F 和它的反，稳定后没有直流通路。
  - term: 动态逻辑
    def: 先由时钟把输出预充到高电平、再按输入决定是否放电的逻辑，输出值靠节点电容暂存。
  - term: 预充
    def: 动态逻辑里时钟为 0 的阶段，上拉管把输出节点充到电源电压。
  - term: 求值
    def: 动态逻辑里时钟为 1 的阶段，下拉网络导通就把输出放电到 0，否则输出保持高电平。
  - term: 多米诺逻辑
    def: 每个动态门后面接一个静态反相器、一级级串起来的动态逻辑，保证下一级的输入在求值时只从 0 变 1。
  - term: 电荷分享
    def: 动态节点和原来放了电的内部节点接通后电荷重新分配、使输出电压下降的现象。
  - term: 保持管
    def: 动态节点上一个由后级反相器控制的弱 PMOS，节点为高时不断补充漏掉的电荷。
  - term: 超前进位加法器
    def: 用每一位的生成和传播信号直接算出各位进位、不必逐位等待的加法器，分组成树时延迟按位数的对数增长。
  - term: 进位选择加法器
    def: 每块同时算出进位输入为 0 和为 1 两份结果、真实进位到来时用多路选择器挑一份的加法器。
  - term: 部分积
    def: 二进制乘法 A×B 中 B 的某一位和 A 相与得到的一行，各行错位相加得到乘积。
  - term: 阵列乘法器
    def: 把生成部分积的与门和加法器排成方阵、逐行累加部分积的乘法器。
  - term: 桶形移位器
    def: 一步就能把数据移动任意位数的移位器，位数多时常做成每级移 2 的幂位的对数结构。
  - term: 模块
    def: 芯片按功能划出的一块电路，如处理器核或某个接口，可以单独设计、单独断电。
  - term: 全定制
    def: 每个晶体管的尺寸和版图都手工设计的方式，性能和密度最好，花的人力最多。
  - term: 标准单元
    def: 事先设计好、高度统一的门和触发器版图，由软件摆放和连线组成芯片。
  - term: 门阵列
    def: 晶体管预先做好、只为每个设计定制上面几层金属连线的芯片做法。
  - term: 位片
    def: 数据通路里一位的全部部件横向排成的一条版图，复制 N 份竖着叠起来组成 N 位数据通路。
  - term: 位距
    def: 位片式数据通路里每个位片的高度，所有部件按同一位距设计才能对齐。
  - term: 建立时间
    def: 寄存器要求数据在时钟沿之前保持稳定的最短时间。
  - term: 保持时间
    def: 寄存器要求数据在时钟沿之后继续保持稳定的最短时间。
  - term: 时钟到输出延迟
    def: 从时钟沿到寄存器输出变成新值所用的时间。
  - term: 寄存器
    def: 一组共享时钟的触发器；电路设计里单个边沿触发的存储单元（触发器）本身也常叫寄存器。
  - term: 主从寄存器
    def: 两个在相反时钟电平下透明的锁存器串联而成、只在时钟沿采样的寄存器。
  - term: 竞争
    def: 时钟和反相时钟重叠时主从两个锁存器同时透明、新数据一路穿到输出的现象。
  - term: 动态锁存器
    def: 用传输门把数据送到反相器栅极、断开后靠栅极电容保持数值的锁存器，时钟不能太慢。
  - term: C²MOS 寄存器
    def: 用时钟控制的反相器代替传输门的动态寄存器，时钟沿足够陡时对时钟重叠不敏感。
  - term: 两相不重叠时钟
    def: 轮流为高、中间留有两者都为低的间隙的两路时钟，保证两个锁存器不会同时透明。
  - term: 真单相时钟寄存器
    def: 只用一路时钟、靠电路结构保证只在一个时钟沿采样的动态寄存器。
  - term: 脉冲寄存器
    def: 一个只在时钟沿后的窄脉冲期间透明的锁存器，表现得像寄存器，保持时间约等于脉冲宽度。
  - term: 借时间
    def: 锁存器流水线里一段逻辑超出自己的半个周期时占用下一段的时间，只要两段合计不超过一个周期。
  - term: 平均无故障时间
    def: 同步器平均多久出一次亚稳态没能及时消失的错误，随解决时间按指数增长。
  - term: 棍图
    def: 只用不同颜色的线表示各层和连接关系、不管尺寸的版图草图。
  - term: 欧拉路径
    def: 在图里一笔走完所有边的路径；上拉和下拉网络有共同的欧拉路径时，有源区可以不断开。
  - term: 视图
    def: 单元库为同一个单元准备的一份描述，不同的工具用不同的视图，如 LEF、GDS、时序库。
  - term: LEF
    def: 只含单元外框、引脚形状和禁止走线区域的抽象视图，给布局布线工具用。
  - term: Liberty 时序库
    def: 记录每个单元逻辑功能、引脚电容、延迟和功耗表的文件，给逻辑综合和静态时序分析用。
  - term: 单元表征
    def: 用电路仿真扫一组输入转换时间和负载电容、测出单元的延迟和功耗填进时序库的过程。
  - term: 开关功耗
    def: 给负载电容充放电消耗的功耗，等于活动因子、电容、电源电压平方和时钟频率的乘积。
  - term: 短路功耗
    def: 输入翻转过程中上拉和下拉短暂同时导通、电流直接从电源流到地造成的功耗。
  - term: 漏电功耗
    def: 关断的晶体管仍有微小电流造成的功耗，电路不翻转时也一直存在。
  - term: 活动因子
    def: 平均每个时钟周期里一个节点从 0 变到 1 的次数，时钟线为 1。
  - term: 毛刺
    def: 输入到达时间不同使门的输出在稳定前来回翻转的多余变化，和正常翻转一样耗电。
  - term: 门控时钟
    def: 在一组寄存器不需要更新的周期里停止给它们送时钟，以省掉时钟网络的翻转功耗。
  - term: 格雷码
    def: 相邻两个数只有一位不同的编码，用来减少翻转，也用于跨时钟域传递计数值。
  - term: 亚阈值漏电
    def: 栅压低于阈值时沟道没有完全关死而流过的电流，随栅压和阈值之差指数变化。
  - term: 栅极漏电
    def: 栅氧化层很薄时电子直接穿过绝缘层形成的电流，用高介电常数材料可以减小。
  - term: 堆叠效应
    def: 两个关断的晶体管串联时漏电比单个关断管小得多的现象。
  - term: 电源门控
    def: 用一个高阈值的大晶体管把空闲模块和电源断开、以省掉它的漏电的做法。
  - term: 电气努力
    def: 一个门的负载电容和它自己输入电容之比。
  - term: 逻辑努力
    def: 一个门要输出和反相器一样的电流时，它的输入电容是反相器的几倍。
  - term: 寄生延迟
    def: 门自己的输出电容带来、和负载无关的那部分延迟，反相器约为 1 个单位。
  - term: 路径努力
    def: 一条路径上各级逻辑努力的乘积再乘以总的电气努力，决定这条路径的最小延迟。
  - term: Elmore 延迟
    def: 把每段电阻乘以它下游的全部电容再相加，估算电阻电容网络延迟的方法。
  - term: 灵敏放大器
    def: 把线上很小的电压差放大成满摆幅逻辑电平的接收电路。
  - term: 缓冲器链
    def: 一串逐级放大的反相器，用来让小门驱动大负载，每级放大约 4 倍时最快。
  - term: 低摆幅驱动
    def: 让长线上只摆动一个小电压、接收端再用灵敏放大器恢复的驱动方式，能量约降为摆幅和电源电压之比。
  - term: IR 压降
    def: 电流流过电源网格的电阻产生的电压降，离电源入口越远的单元拿到的电压越低。
  - term: 去耦电容
    def: 放在电路附近的电容，电流突增时就近供电，减小电源电压的瞬间下陷。
  - term: 时钟偏斜
    def: 同一个时钟沿到达接收寄存器和发送寄存器的时刻之差。
  - term: 时钟抖动
    def: 同一位置相邻时钟沿之间的间隔偏离标称周期的随机变化。
  - term: H 树
    def: 从中心一层层对称分叉成 H 形的时钟线，到每个端点的路径一样长，每层端点数乘 4。
  - term: 时钟树综合
    def: 布局之后按寄存器的实际位置建一棵插了缓冲器的时钟树、让各端点延迟平衡的步骤。
  - term: 时钟网格
    def: 铺满芯片、从多点同时驱动的金属网格时钟网络，偏斜小但电容大、耗电多。
  - term: 锁相环
    def: 用压控振荡器产生高频时钟、分频后与参考时钟比相位来锁定的电路，输出频率是参考的 N 倍。
  - term: 延迟锁相环
    def: 用可调延迟线把时钟延迟到和参考对齐的电路，不能倍频，抖动不会逐周期叠加。
  - term: 自定时电路
    def: 不用全局时钟、每一级做完后用请求和应答信号与下一级握手的电路。
  - term: 电子设计自动化
    def: 设计芯片用的软件的统称，包括仿真、综合、布局布线、时序分析和物理验证工具。
  - term: 寄存器传输级
    def: 描述有哪些寄存器、每个时钟周期数据经过什么逻辑在它们之间传递的设计层次。
  - term: 逻辑综合
    def: 把寄存器传输级描述化简、变成由库里的标准单元组成的门级网表的步骤。
  - term: 布图规划
    def: 确定芯片尺寸、大模块和输入输出的位置以及电源网络的步骤。
  - term: 布局
    def: 把标准单元摆进单元行里、让连线短且满足时序的步骤。
  - term: 布线
    def: 给所有信号线定下具体走哪些金属轨道、在哪里打通孔的步骤。
  - term: 签核
    def: 流片前最后的全面检查，包括静态时序分析、功耗和 IR 压降分析、DRC 和 LVS。
  - term: 字面量
    def: 逻辑式里变量（含取反的变量）出现的次数，用来衡量逻辑式的大小。
  - term: 工艺映射
    def: 把化简后的逻辑网络用单元库里的门覆盖、使面积或延迟最小的步骤。
  - term: 查找表
    def: FPGA 的基本逻辑单元，K 输入的查找表存 2 的 K 次方位真值表，能实现任意 K 输入函数。
  - term: 打包
    def: FPGA 流程里把查找表和触发器装进逻辑块、使块内连线多块间连线少的步骤。
  - term: 半周长线长
    def: 框住一条线网全部引脚的最小矩形的长加宽，布局时用来估算线长。
  - term: 划分
    def: 把网表切成两半、使被切断的线网最少，再分到芯片不同区域的布局方法。
  - term: 模拟退火
    def: 随机交换单元，变差时也以一定概率接受（温度越高越容易接受），温度逐步降低的优化方法。
  - term: 解析布局
    def: 把总线长写成坐标的二次函数、解线性方程求单元位置再挪到合法位置的布局方法。
  - term: 迷宫布线
    def: 在网格上从起点一圈圈向外标记步数、到达终点后倒推出最短路径的布线方法，也叫 Lee 算法。
  - term: 功能验证
    def: 检查电路的逻辑是否符合设计意图，用仿真和形式化的等价性检查。
  - term: 时序验证
    def: 检查在真实的门和连线延迟下，每个寄存器能否按时收到正确的数据。
  - term: 后仿真
    def: 把从版图提取出的真实延迟反标回门级网表再做的仿真。
  - term: 事件驱动仿真
    def: 按时间顺序处理信号变化事件、只重新计算受影响的门的仿真方法。
  - term: 动态时序分析
    def: 用带延迟的仿真加输入序列检查时序，结果取决于输入有没有激活最慢的路径。
  - term: 到达时间
    def: 静态时序分析中信号最晚到达某个节点的时刻，取各输入的最晚到达时间加上这一段延迟。
  - term: 要求时间
    def: 静态时序分析中数据最晚必须到达某个节点的时刻。
  - term: 时序裕量
    def: 要求时间减到达时间，为正表示满足时序，为负表示违例。
  - term: 关键路径
    def: 时序裕量最小的路径，它限制了电路的最高频率。
  - term: 未约束路径
    def: 没有给出时序要求、静态时序分析不检查的路径，例如没有说明外部延迟的输入输出端口。
  - term: 跨时钟域
    def: 信号从一个时钟控制的电路进入另一个不相关时钟控制的电路，要用同步器或握手处理。
  - term: 时序例外
    def: 用约束告诉静态时序分析某些路径不按默认的一个周期检查，如多周期路径和伪路径。
  - term: 多周期路径
    def: 数据本来就每隔 N 个周期才被采一次、可以按 N 个周期检查建立时间的路径。
  - term: 伪路径
    def: 结构上存在、实际工作中永远不会用到的路径，标出后静态时序分析不再检查。
  - term: 故障模型
    def: 把制造缺陷对电路逻辑的影响抽象出来的模型，如固定型故障、桥接故障。
  - term: 固定型故障
    def: 某根线不管电路怎样工作都永远是 0 或永远是 1 的故障模型。
  - term: 路径敏化
    def: 激活故障、让差异沿一条路径传到输出，并倒推出所需输入的找测试向量方法。
  - term: 自动测试向量生成
    def: 自动为每个故障找出能发现它的输入向量、并报告故障覆盖率的程序。
  - term: 故障覆盖率
    def: 测试向量能发现的故障占全部故障的比例。
  - term: 缺陷水平
    def: 通过测试出厂的芯片里实际是坏片的比例，常用百万分之几表示。
  - term: 可测性设计
    def: 在设计中加入便于制造后测试的结构，如扫描链和内建自测试。
  - term: 扫描触发器
    def: 前面多一个二选一多路选择器的触发器，测试时能从扫描输入接收数据。
  - term: 扫描链
    def: 把扫描触发器首尾相接串成的移位寄存器，用来直接设定和读出所有寄存器的值。
  - term: 内建自测试
    def: 把产生测试向量和检查结果的电路也做进芯片、让芯片自己测试自己的做法。
  - term: 线性反馈移位寄存器
    def: 把几位异或后送回第一位的移位寄存器，选对反馈位时 n 位能走遍 2 的 n 次方减 1 个状态。
  - term: IDDQ 测试
    def: 给一组输入、等电路稳定后测电源静态电流，电流偏大就判为有缺陷的测试方法。
lessons:
  - id: inverter-dc
    chapter: CMOS 数字设计
    title: 短沟道器件和反相器的直流特性
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个沟道只有 0.25 μm 长的 NMOS，按长沟道的平方律算出饱和电流 0.43 mA。实测会怎样？
          options:
            - text: 明显小于 0.43 mA
              correct: true
            - text: 正好 0.43 mA，平方律对任何尺寸都成立
              why: 平方律假设载流子速度和电场成正比；沟道很短时电场很强，速度饱和，电流上不去
            - text: 明显大于 0.43 mA，沟道短了电流更大
              why: 沟道短确实让电流变大，但这一点平方律里的 $W/L$ 已经算进去了；速度饱和让实际电流比平方律小
          explain: 0.25 μm 沟道上加 2.5 V，平均电场约 $10^5$ V/cm，电子早已速度饱和。用把速度饱和考虑进去的模型算，电流只有平方律的一半左右。
      - card:
          title: 速度饱和的器件模型
          body: |
            沟道很短时，$V_{DS}$ 还没到 $V_{GS} - V_{th}$，载流子在漏端就已经速度饱和，电流提前停止增长。把电流开始饱和的漏源电压记作 $V_{DSAT}$（0.25 μm 工艺的 NMOS 约 0.63 V），一个常用的统一模型是

            $$I_D = k'\frac WL\left(V_{GT}V_{min} - \frac{V_{min}^2}{2}\right)(1 + \lambda V_{DS})$$

            其中 $V_{GT} = V_{GS} - V_{th}$，$V_{min}$ 取 $V_{GT}$、$V_{DS}$、$V_{DSAT}$ 三者中最小的一个，$k' = \mu_nC_{ox}$。$V_{min} = V_{DS}$ 是三极管区，$V_{min} = V_{GT}$ 是长沟道的饱和，$V_{min} = V_{DSAT}$ 是速度饱和。
      - card:
          title: 例题：算短沟道 NMOS 的电流
          body: 0.25 μm 工艺的 NMOS，$k' = 115\ \text{μA/V}^2$，$W/L = 1.5$，$V_{th} = 0.43$ V，$V_{DSAT} = 0.63$ V，$\lambda = 0.06\ \text{V}^{-1}$。$V_{GS} = V_{DS} = 2.5$ V，求 $I_D$。
          reveal:
            - title: 第 1 步：定出 V_min
              body: $V_{GT} = 2.07$ V，三个候选 2.07、2.5、0.63 V 中最小的是 $V_{DSAT} = 0.63$ V，速度饱和。
            - title: 第 2 步：代入括号
              body: $V_{GT}V_{min} - V_{min}^2/2 = 2.07\times0.63 - 0.198 = 1.106\ \text{V}^2$。
            - title: 第 3 步：乘上其余因子
              body: $I_D = 115\times10^{-6}\times1.5\times1.106\times(1 + 0.06\times2.5) = 0.219$ mA。平方律给出 0.425 mA，约是它的两倍。
      - item:
          id: unified-low-vgs
          type: number
          prompt: 同一个 0.25 μm NMOS（$k' = 115\ \text{μA/V}^2$，$W/L = 1.5$，$V_{th} = 0.43$ V，$V_{DSAT} = 0.63$ V，$\lambda = 0.06\ \text{V}^{-1}$），$V_{GS} = 1.2$ V，$V_{DS} = 2.5$ V。漏极电流是多少微安？
          answer: 56.9
          tolerance: 0.2
          unit: μA
          hint: 这时 $V_{GT}$、$V_{DS}$、$V_{DSAT}$ 哪个最小？
          explain: $V_{GT} = 0.77$ V，仍比 $V_{DSAT} = 0.63$ V 大，$V_{min} = 0.63$ V。$I_D = 115\times1.5\times(0.77\times0.63 - 0.198)\times1.15 = 56.9$ μA。
      - item:
          id: unified-triode
          type: number
          prompt: 同一个 0.25 μm NMOS（$k' = 115\ \text{μA/V}^2$，$W/L = 1.5$，$V_{th} = 0.43$ V，$V_{DSAT} = 0.63$ V，$\lambda = 0.06\ \text{V}^{-1}$），$V_{GS} = 2.5$ V，$V_{DS} = 0.3$ V。漏极电流是多少微安？
          answer: 101
          tolerance: 0.5
          unit: μA
          hint: $V_{GT}$、$V_{DS}$、$V_{DSAT}$ 三个候选里哪个最小？
          explain: $V_{min} = V_{DS} = 0.3$ V，三极管区：$115\times1.5\times(2.07\times0.3 - 0.045)\times(1 + 0.018) = 101$ μA。
      - card:
          title: 描述反相器直流特性的几个数
          body: |
            CMOS 反相器的电压传输特性用几个数概括：输出高低电平 $V_{OH} = V_{DD}$、$V_{OL} = 0$；转折电压 $V_M$（输入等于输出的点）；增益为 $-1$ 的两点 $V_{IL}$、$V_{IH}$ 和噪声容限。

            速度饱和时 $V_M$ 由两管的饱和电流相等决定，近似为 $V_M \approx \dfrac{rV_{DD}}{1 + r}$，$r = \dfrac{v_{sat,p}W_p}{v_{sat,n}W_n}$。想让 $V_M = V_{DD}/2$，PMOS 要做得比 NMOS 宽：0.25 μm 工艺里按完整的饱和电流式算要宽 3 倍多（这个近似式略去了阈值等项，只用来看趋势）。
      - item:
          id: vm-direction
          type: choice
          prompt: CMOS 反相器的 PMOS 加宽一倍，其他不变。转折电压 $V_M$ 怎样变？
          options:
            - text: 升高
              correct: true
            - text: 降低
              why: PMOS 变宽，上拉更强，NMOS 要在更高的输入下才拉得过它，转折点往高处移，不是往低处
            - text: 不变，$V_M$ 只由电源电压决定
              why: $V_M$ 由两管的强弱比决定，只在两管对称时才等于 $V_{DD}/2$
          explain: PMOS 宽了，上拉更强，输入要升得更高才能让 NMOS 的电流赶上它，$V_M$ 升高。调 $W_p/W_n$ 就是调转折点。
  - id: inverter-delay
    chapter: CMOS 数字设计
    title: 传播延迟和寄生电容
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个反相器驱动下一级反相器。把下一级的管子都加宽一倍，这一级的延迟会怎样？
          options:
            - text: 变长，下一级的栅电容变大了
              correct: true
            - text: 变短，下一级更强了
              why: 下一级更强只让下一级自己的输出变快；对这一级来说，它要驱动的栅电容变成两倍
            - text: 不变，延迟只由这一级自己决定
              why: 延迟取决于驱动能力和负载电容两方面，负载正是下一级的输入电容
          explain: 延迟 ∝ 等效电阻 × 负载电容。下一级加宽，输入电容加倍，这一级的延迟也变长。这是“扇出越大越慢”的原因。
      - card:
          title: 用等效电阻算延迟
          body: |
            输出翻转时，导通的管子在饱和区和三极管区之间变化，电流不恒定。工程上把它在这段时间里的平均作用折算成一个等效电阻 $R_{eq}$，于是输出像 RC 电路一样充放电，到一半所用的时间是

            $$t_{pHL} = 0.69R_{eq,n}C_L,\qquad t_{pLH} = 0.69R_{eq,p}C_L$$

            反相器的传播延迟（输入变到一半到输出变到一半）取两者的平均 $t_p = (t_{pHL} + t_{pLH})/2$。0.25 μm 工艺、$V_{DD} = 2.5$ V 时，$W/L = 1$ 的 NMOS 约 13 kΩ，PMOS 约 31 kΩ；等效电阻和 $W/L$ 成反比。
      - card:
          title: 例题：一个反相器的延迟
          body: 0.25 μm 工艺，NMOS $W/L = 1.5$，PMOS $W/L = 4.5$，负载电容 6 fF，$V_{DD} = 2.5$ V。求 $t_{pHL}$、$t_{pLH}$ 和 $t_p$。
          reveal:
            - title: 第 1 步：两管的等效电阻
              body: $R_{eq,n} = 13/1.5 = 8.67$ kΩ，$R_{eq,p} = 31/4.5 = 6.89$ kΩ。
            - title: 第 2 步：两个方向的延迟
              body: $t_{pHL} = 0.69\times8.67\ \text{kΩ}\times6\ \text{fF} = 35.9$ ps，$t_{pLH} = 0.69\times6.89\ \text{kΩ}\times6\ \text{fF} = 28.5$ ps。
            - title: 第 3 步：取平均
              body: $t_p = (35.9 + 28.5)/2 = 32.2$ ps。PMOS 做宽 3 倍以后上升反而比下降快。
      - item:
          id: tphl-small
          type: number
          prompt: 0.25 μm 工艺，$W/L = 1$ 的 NMOS 等效电阻约 13 kΩ。一个 NMOS $W/L = 2$ 的反相器驱动 10 fF 的负载，$t_{pHL}$ 是多少皮秒？
          answer: 44.9
          tolerance: 0.2
          unit: ps
          hint: 等效电阻和 $W/L$ 是什么关系？
          explain: $R_{eq,n} = 13/2 = 6.5$ kΩ，$t_{pHL} = 0.69\times6.5\ \text{kΩ}\times10\ \text{fF} = 44.9$ ps。
      - card:
          title: 负载电容从哪里来
          body: |
            负载电容 $C_L$ 有三部分：本级漏区和衬底之间反偏 PN 结的耗尽电容（叫漏区结电容），下一级的栅电容（扇出），以及连线电容。还有一项：输入和输出之间的栅漏交叠电容，输入和输出朝相反方向变化，它两端的电压变化是单边的两倍，等效到输出要乘 2（密勒效应）。

            管子加宽能减小 $R_{eq}$，但本级的漏区结电容也跟着变大，所以单纯加宽不能无限地减小延迟：本级自己的电容占主导以后，再加宽延迟几乎不变，这个下限叫**本征延迟（intrinsic delay）**。
      - item:
          id: self-loading
          type: choice
          prompt: 一个反相器只驱动很小的连线、几乎没有外部负载。把它的两个管子都加宽 4 倍，延迟怎样变？
          options:
            - text: 几乎不变
              correct: true
            - text: 变成四分之一，管子强了 4 倍
              why: 只有负载由外部电容主导时才成立；这里负载主要是本级的漏区结电容，它和管子宽度一起变大
            - text: 变成 4 倍，电容大了 4 倍
              why: 电容大了，可等效电阻也小了同样的倍数，两者相乘几乎不变
          explain: $t_p \propto R_{eq}(C_{int} + C_{ext})$。$C_{ext} \approx 0$ 时，$R_{eq} \propto 1/W$、$C_{int} \propto W$，乘积和宽度无关，延迟停在本征延迟上。
      - item:
          id: miller-overlap
          type: number
          prompt: 反相器的栅漏交叠电容是 0.3 fF。输入和输出同时朝相反方向翻转，把它等效成输出端对地的电容，是多少飞法？
          answer: 0.6
          tolerance: 0.001
          unit: fF
          hint: 输入升高一个 $V_{DD}$、输出降低一个 $V_{DD}$，这个电容两端的电压变了多少？
          explain: 电容两端的电压变化是 $2V_{DD}$，搬的电荷是只有输出变化时的两倍，等效为 $2\times0.3 = 0.6$ fF。
  - id: voltage-scaling
    chapter: CMOS 数字设计
    title: 电源电压和阈值电压
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 把一个 CMOS 电路的电源电压从 2.5 V 降到 1.0 V。每次翻转消耗的能量会怎样？
          options:
            - text: 降到原来的约六分之一
              correct: true
            - text: 降到原来的五分之二，和电压成正比
              why: 每次翻转的能量是 $C_LV_{DD}^2$，和电压的平方成正比，$(1/2.5)^2 = 0.16$
            - text: 不变，能量只由电容决定
              why: 电容上存的能量 $\tfrac12CV^2$ 和电压有关，电压越低，充放电搬的能量越少
          explain: $C_LV_{DD}^2$ 里电压是平方：$(1.0/2.5)^2 = 0.16$，约六分之一。降电压是省电最有效的办法，代价是变慢。
      - card:
          title: 电压降低，电路变慢
          body: |
            电源电压降低时，过驱动电压 $V_{DD} - V_{th}$ 变小，导通电流减小，等效电阻变大。0.25 μm 工艺、$W/L = 1$ 的 NMOS，$V_{DD} = 2.5$ V 时 $R_{eq} \approx 13$ kΩ，1.5 V 时约 19 kΩ，1.0 V 时约 35 kΩ。

            $V_{DD}$ 远大于 $V_{th}$ 时延迟随电压降低变化不大；接近 $V_{th}$ 时，过驱动电压所剩无几，延迟急剧增加。
      - item:
          id: delay-1v
          type: number
          prompt: 0.25 μm 工艺，$W/L = 1$ 的 NMOS 等效电阻在 $V_{DD} = 2.5$ V 时约 13 kΩ，1.0 V 时约 35 kΩ。负载电容不变，电源从 2.5 V 降到 1.0 V，下降延迟变成原来的几倍？
          answer: 2.69
          tolerance: 0.01
          hint: 延迟和等效电阻是什么关系？
          explain: $t_{pHL} = 0.69R_{eq}C_L \propto R_{eq}$，$35/13 = 2.69$ 倍。电压降到 40%，速度只剩约 37%。
      - card:
          title: 能量–延迟积
          body: |
            只看能量，电压越低越好；只看速度，电压越高越好。常用两者的乘积**能量–延迟积（energy-delay product）**衡量：每次翻转的能量乘以延迟，越小越好。

            把电源从 2.5 V 降到 1.0 V，能量降到 0.16 倍，延迟升到约 2.7 倍，乘积降到约 0.43 倍，仍然划算。电压再往下逼近阈值，延迟上升得比能量下降得快，乘积反而变大。
      - item:
          id: edp-ratio
          type: number
          prompt: 电源电压从 2.5 V 降到 1.0 V，每次翻转的能量变为 $(1.0/2.5)^2$ 倍，延迟变为 2.69 倍。能量–延迟积变为原来的几倍？
          answer: 0.43
          tolerance: 0.002
          hint: 两个倍数怎样组合？
          explain: $0.16\times2.69 = 0.43$。乘积下降，说明这次降压在能量和速度之间是划算的交换。
      - card:
          title: 阈值电压能不能跟着降
          body: |
            降低 $V_{th}$ 能让过驱动电压回升、电路变快，但关断时的漏电流（叫**亚阈值漏电（subthreshold leakage）**）按指数增加：栅压每低一个亚阈值斜率 $S$（实际工艺约 80–100 mV/dec），漏电增加 10 倍。

            所以 $V_{th}$ 不能随便降。常用的办法是一块芯片上放几种阈值的单元：最慢、决定时钟周期的那条路径（叫**关键路径（critical path）**）用低阈值的快单元，其余用高阈值的低漏电单元。
      - item:
          id: vt-leakage
          type: number
          prompt: 某工艺的亚阈值斜率 $S = 90$ mV/dec。阈值电压降低 0.1 V，关断漏电流变为原来的几倍？
          answer: 12.9
          tolerance: 0.05
          hint: 0.1 V 是几个 90 mV？
          explain: $10^{100/90} = 10^{1.11} = 12.9$ 倍。阈值电压降 0.1 V，漏电增加一个多数量级。
      - item:
          id: scaling-choice
          type: choice
          prompt: 一个由电池供电、对速度要求不高的传感器芯片，想尽量省电。下面哪种做法最合适？
          options:
            - text: 降低电源电压，同时用高阈值的单元
              correct: true
            - text: 提高电源电压，让电路尽快做完然后关掉
              why: 动态能量和电压的平方成正比，提高电压每次翻转都更费电；对速度要求不高时没必要
            - text: 降低阈值电压让电路更快
              why: 低阈值单元漏电大，对长时间待机的电池设备反而不利
          explain: 速度要求低时，低电压省动态能量，高阈值省漏电。这正是物联网芯片常见的设计取向。
  - id: static-cmos
    chapter: CMOS 数字设计
    title: 静态 CMOS 复合门
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 要实现 $Y = \overline{AB + C}$，可以用一个与门、一个或门再加一个反相器，也可以直接做成一个门。直接做成一个门有什么好处？
          options:
            - text: 晶体管更少，信号只过一级，更快
              correct: true
            - text: 没有好处，只是画起来简单
              why: 三个门要十几个晶体管、信号过三级；直接做成一个门只要 6 个晶体管、一级延迟
            - text: 能输出不取反的结果
              why: 静态 CMOS 门天然输出取反的结果，合成一个门也一样，所以式子外面有一道横线
          explain: 静态 CMOS 门天然实现“与或非”。$\overline{AB + C}$ 正好是一个门：下拉网络 A、B 串联再和 C 并联，上拉网络取对偶。6 个晶体管，一级延迟。
      - card:
          title: 复合门的构造
          body: |
            把几级与、或、非合成一个静态 CMOS 门，叫**复合门（complex gate）**。下拉网络由 NMOS 组成，按式子里取反之前的部分连接：与对应串联，或对应并联。上拉网络是它的对偶：串联换成并联，并联换成串联，用 PMOS。

            例如与或非门（AOI21）$Y = \overline{AB + C}$：下拉是“A、B 串联”再和“C”并联；上拉是“A、B 并联”再和“C”串联。每个输入接一个 NMOS 和一个 PMOS，共 6 个晶体管。
      - item:
          id: oai-count
          type: number
          prompt: 或与非门 $Y = \overline{(A + B)(C + D)}$ 做成一个静态 CMOS 复合门，一共要几个晶体管？
          answer: 8
          hint: 每个输入接几个晶体管？
          explain: 4 个输入，每个接一个 NMOS 和一个 PMOS，共 8 个。下拉是“A∥B”和“C∥D”串联，上拉是“A、B 串联”和“C、D 串联”再并联。
      - item:
          id: aoi-pulldown
          type: choice
          prompt: 静态 CMOS 门 $Y = \overline{AB + C}$ 的下拉网络怎样连？
          options:
            - text: A、B 两个 NMOS 串联，再和 C 的 NMOS 并联
              correct: true
            - text: A、B 两个 NMOS 并联，再和 C 的 NMOS 串联
              why: 那是上拉网络的连法（换成 PMOS）；下拉网络里“与”对应串联
            - text: 三个 NMOS 全部串联
              why: 全部串联对应 $\overline{ABC}$，三个输入都为 1 才拉低；这里 C 单独为 1 也要拉低
          explain: $AB + C = 1$ 时输出要拉低：A、B 同时导通（串联）或者 C 导通（并联）都能把输出接地。
      - card:
          title: 例题：确定复合门的尺寸
          body: 参考反相器 NMOS 宽 1、PMOS 宽 2（单位宽度）。要让 $Y = \overline{AB + C}$ 在最坏情况下和反相器一样快，各管多宽？
          reveal:
            - title: 第 1 步：下拉网络的最坏路径
              body: 经 A、B 的路径有两个管子串联，每个加宽到 2；C 单独一条路径，宽 1 就和反相器一样。
            - title: 第 2 步：上拉网络的最坏路径
              body: 上拉是“A∥B”再串联 C，最坏情况是 A、B 只有一个导通，路径上有两个 PMOS 串联，每个要宽 $2\times2 = 4$。
            - title: 第 3 步：汇总
              body: NMOS：A、B 各 2，C 为 1；PMOS：A、B、C 各 4。输入 A、B 的电容各是 2 + 4 = 6，C 是 1 + 4 = 5，几个输入的电容并不相等。
      - item:
          id: nand4-nmos
          type: number
          prompt: 参考反相器 NMOS 宽 1。四输入静态 CMOS 与非门的下拉网络要和反相器一样快，每个 NMOS 要多宽？
          answer: 4
          tolerance: 0.001
          hint: 串联管子的电阻怎样相加？
          explain: 四个 NMOS 串联，电阻是一个的 4 倍，每个加宽到 4。管子越宽，每个输入的电容越大，所以扇入大的门很慢。
      - card:
          title: 扇入和扇出
          body: |
            扇入（输入个数）越多，串联的管子越多：不加宽时电阻按扇入线性增加，串联节点上的寄生电容也按扇入增加，延迟大约和扇入的平方成正比。所以扇入一般不超过 4，更大的功能拆成几级小门。

            扇出（驱动的下一级个数）越多，负载电容越大，延迟和扇出成正比。
      - item:
          id: fanin-split
          type: choice
          prompt: 要做一个 8 输入的与功能（8 个输入都为 1 时输出 1）。下面哪种做法通常更快？
          options:
            - text: 两个四输入与非门，输出再接一个二输入或非门
              correct: true
            - text: 一个 8 输入的静态 CMOS 与非门再接一个反相器
              why: 8 个 NMOS 串联，电阻和串联节点电容都很大，延迟约随扇入的平方增长，比两级小门慢
            - text: 两个四输入与非门的输出直接接在一起
              why: CMOS 门的输出不能直接相连：一个输出高、一个输出低时，电源经两个门直接通到地
          explain: 两个与非门输出 $X = \overline{ABCD}$、$Y = \overline{EFGH}$，或非门给出 $\overline{X + Y} = \overline{X}\cdot\overline{Y} = ABCD\cdot EFGH$。两级小门比一个大扇入的门快。
  - id: ratioed-logic
    chapter: CMOS 数字设计
    title: 有比逻辑：伪 NMOS
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个 8 输入的或非门，静态 CMOS 要 8 个 PMOS 串联上拉，很慢。如果把上拉网络换成一个一直导通的 PMOS，代价是什么？
          options:
            - text: 输出为低时有电流一直从电源流到地，而且低电平不是 0
              correct: true
            - text: 没有代价，只是少用了晶体管
              why: 一直导通的 PMOS 在下拉网络导通时和它“打架”，电源到地有直流通路，输出也拉不到 0
            - text: 输出高电平达不到电源电压
              why: 下拉网络全部关断时，导通的 PMOS 能把输出一直拉到 $V_{DD}$，高电平没有问题；问题出在低电平
          explain: 上拉管一直导通，输出低时它和下拉网络同时导通，像电阻负载的反相器一样有静态电流，低电平由两者的强弱比决定。
      - card:
          title: 伪 NMOS
          body: |
            把静态 CMOS 门的整个上拉网络换成一个栅极接地、一直导通的 PMOS，下拉网络不变，叫伪 NMOS（pseudo-NMOS）门。$N$ 个输入只要 $N + 1$ 个晶体管，输入电容也只有 NMOS 那一份，大扇入的或非门因此又快又小。

            代价是输出为低时 PMOS 和下拉网络同时导通：有静态电流，输出低电平 $V_{OL}$ 大于 0，大小取决于两者的强弱比。电路能不能工作靠尺寸比例，所以叫**有比逻辑（ratioed logic）**；静态 CMOS 不管尺寸如何都能输出满摆幅，叫无比逻辑。
      - item:
          id: pseudo-count
          type: number
          prompt: 一个 6 输入的伪 NMOS 或非门一共用几个晶体管？
          answer: 7
          hint: 下拉网络每个输入一个 NMOS，上拉网络有几个管子？
          explain: 6 个 NMOS 并联下拉，加 1 个一直导通的 PMOS 上拉，共 7 个；静态 CMOS 要 12 个，其中 6 个 PMOS 还是串联的。
      - card:
          title: 例题：算伪 NMOS 的输出低电平
          body: 伪 NMOS 反相器，$V_{DD} = 2.5$ V，两管阈值都是 0.4 V，NMOS 的 $k_n = k'_n(W/L)_n$ 是 PMOS $k_p = k'_p(W/L)_p$ 的 4 倍（长沟道模型，这里的 $k$ 已经乘了 $W/L$）。输入为高时求 $V_{OL}$。
          reveal:
            - title: 第 1 步：判断两管的区域
              body: PMOS 的 $V_{SG} = 2.5$ V、$V_{SD} = 2.5 - V_{OL}$ 很大，在饱和区；NMOS 的 $V_{GS} = 2.5$ V、$V_{DS} = V_{OL}$ 很小，在三极管区。
            - title: 第 2 步：写出电流相等
              body: $\tfrac12k_p(2.1)^2 = k_n\left[2.1V_{OL} - V_{OL}^2/2\right]$，两边除以 $k_p$：$2.205 = 4(2.1V_{OL} - V_{OL}^2/2)$，即 $2V_{OL}^2 - 8.4V_{OL} + 2.205 = 0$。
            - title: 第 3 步：取合理的根
              body: $V_{OL} = \dfrac{8.4 - \sqrt{70.56 - 17.64}}{4} = 0.281$ V。另一个根超过电源，舍去。
      - item:
          id: pseudo-vol-ratio2
          type: number
          prompt: 伪 NMOS 反相器，$V_{DD} = 2.5$ V，两管阈值都是 0.4 V，NMOS 的 $k_n$ 只是 PMOS $k_p$ 的 2 倍（长沟道模型）。输入为高时 $V_{OL}$ 是多少伏？
          answer: 0.615
          tolerance: 0.002
          unit: V
          hint: 电流相等的方程里，4 换成 2 以后二次方程变成什么？
          explain: $2.205 = 2(2.1V - V^2/2)$，即 $V^2 - 4.2V + 2.205 = 0$，$V = (4.2 - \sqrt{17.64 - 8.82})/2 = 0.615$ V。强弱比从 4 降到 2，低电平从 0.28 V 升到 0.62 V，噪声容限明显变小。
      - item:
          id: pseudo-power
          type: number
          prompt: 伪 NMOS 门的 PMOS $k_p = 100\ \text{μA/V}^2$，$|V_{tp}| = 0.4$ V，$V_{DD} = 2.5$ V，输出为低时 PMOS 在饱和区。这时的静态功耗是多少毫瓦？
          answer: 0.551
          tolerance: 0.002
          unit: mW
          hint: 输出为低时 PMOS 流过多大的饱和电流？
          explain: $I = \tfrac12\times100\times2.1^2 = 220.5$ μA，$P = 2.5\times0.2205 = 0.551$ mW。一万个这样的门同时输出低就是 5.5 W，所以伪 NMOS 只用在少数需要大扇入、又对速度要求高的地方。
      - item:
          id: ratioed-meaning
          type: choice
          prompt: 为什么伪 NMOS 叫“有比逻辑”？
          options:
            - text: 低电平取决于上下拉管的强弱比
              correct: true
            - text: 它的输出电压和输入电压成比例变化
              why: 它仍是数字门，输入高输出低；“有比”说的是两个管子的尺寸比例
            - text: 它的延迟和扇入成比例
              why: 静态 CMOS 门的延迟也随扇入增加；“有比”特指低电平靠尺寸比例保证
          explain: 下拉网络要比上拉 PMOS 强好几倍，$V_{OL}$ 才足够低。静态 CMOS 的上拉和下拉不会同时导通，输出总是 0 或 $V_{DD}$，和尺寸比无关。
  - id: pass-transistor
    chapter: CMOS 数字设计
    title: 传输管、传输门和差分逻辑
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个 NMOS 的栅极接 2.5 V，漏极接 2.5 V，源极接一个电容。电容最终能充到多少伏？
          options:
            - text: 比 2.5 V 低零点几伏到将近 1 V
              correct: true
            - text: 正好 2.5 V，开关闭合了
              why: 电容电压升高时，栅源电压 $2.5 - V$ 越来越小，降到阈值电压时管子就关断了，充不满
            - text: 0 V，NMOS 只能传 0
              why: NMOS 能把电容往上充，只是充到离栅压还差一个阈值电压的地方就停了
          explain: NMOS 导通要栅源电压大于阈值电压。源极就是电容这一端，电容越充越高，栅源电压越来越小，到阈值时停下。再算上背栅效应，阈值还会升高，最后只到约 1.8 V。
      - card:
          title: 用晶体管当开关传信号
          body: |
            静态 CMOS 门里，输入只接栅极。另一种做法是让输入信号从晶体管的源极和漏极之间“穿过去”，栅极上的信号决定通不通，这样的晶体管叫**传输管（pass transistor）**。用它搭逻辑，管子更少：一个二选一多路选择器只要两个 NMOS。

            代价是 NMOS 传 1 时有**阈值损失（threshold drop）**：输出最高只到 $V_{DD} - V_{tn}$，并且这时源极电压不为零，背栅效应让 $V_{tn}$ 变大，损失更多。同理 PMOS 传 0 时输出最低只到 $|V_{tp}|$。
      - card:
          title: 例题：NMOS 传输管能传多高
          body: 0.25 μm 工艺，$V_{DD} = 2.5$ V，NMOS 的 $V_{th0} = 0.43$ V，$\gamma = 0.4\ \text{V}^{1/2}$，$-2\phi_p = 0.6$ V。栅极和输入都是 2.5 V，求输出最终的电压。
          reveal:
            - title: 第 1 步：写出停下来的条件
              body: 输出 $V_x$ 就是源极电压，$V_{SB} = V_x$。管子在 $V_{GS} = V_{th}$ 时关断：$2.5 - V_x = 0.43 + 0.4\left(\sqrt{0.6 + V_x} - \sqrt{0.6}\right)$。
            - title: 第 2 步：解这个方程
              body: 没有背栅效应时 $V_x = 2.07$ V。代入 2.07 V，右边是 $0.43 + 0.4\times(1.634 - 0.775) = 0.77$ V，左边只有 0.43 V，说明还要更低。逐步试，$V_x = 1.76$ V 时两边都是 0.74 V。
            - title: 第 3 步：看后果
              body: 输出只有 1.76 V，比电源低 0.74 V。阈值从 0.43 V 升到了 0.74 V。
      - item:
          id: pass-drop-noeffect
          type: number
          prompt: NMOS 传输管的栅极和输入都接 $V_{DD} = 1.8$ V，阈值电压 0.4 V。不计背栅效应，输出最终充到多少伏？
          answer: 1.4
          tolerance: 0.001
          unit: V
          hint: 管子在栅源电压降到多少时关断？
          explain: 输出升到 $V_{DD} - V_{tn} = 1.8 - 0.4 = 1.4$ V 时栅源电压等于阈值，管子关断。计入背栅效应，阈值会升高，输出还要更低。
      - item:
          id: pass-static-current
          type: choice
          prompt: NMOS 传输管把一个“1”传成 1.76 V，送进一个 $V_{DD} = 2.5$ V 的 CMOS 反相器，PMOS 阈值 $|V_{tp}| = 0.4$ V。会出现什么问题？
          options:
            - text: 反相器的 PMOS 没有完全关断，电源到地有静态电流
              correct: true
            - text: 反相器把 1.76 V 当成 0，输出错误
              why: 1.76 V 高于这个反相器的转折电压，输出仍然是低；问题不在逻辑值，而在 PMOS 没关断
            - text: 没有问题，CMOS 反相器不消耗静态功耗
              why: 只有输入是满摆幅时才不耗电；这里 PMOS 的 $V_{SG} = 0.74$ V，大于 0.4 V，它和 NMOS 同时导通
          explain: PMOS 的 $V_{SG} = 2.5 - 1.76 = 0.74$ V，超过 $|V_{tp}|$，PMOS 仍导通。它和导通的 NMOS 形成电源到地的直流通路。所以传输管的输出后面要想办法把高电平拉满。
      - card:
          title: 传输门和电平恢复
          body: |
            把一个 NMOS 和一个 PMOS 并联，栅极分别接控制信号 $C$ 和它的反 $\overline C$，就是**传输门（transmission gate）**。传 1 时 PMOS 负责拉满，传 0 时 NMOS 负责拉到底，输出是满摆幅，代价是每个开关两个管子，还要一路反相的控制信号。

            另一种办法是保留单个 NMOS，在后面的反相器上加一个 PMOS 做反馈：反相器输出为低时它导通，把输入节点拉到 $V_{DD}$。这叫**电平恢复（level restoring）**，那个 PMOS 叫电平恢复管。
      - item:
          id: tg-mux-count
          type: number
          prompt: 用传输门搭一个二选一多路选择器，选择信号 $S$ 只有一路，$\overline S$ 要自己用一个 CMOS 反相器产生。一共要几个晶体管？
          answer: 6
          hint: 两个传输门各几个管子？反相器几个？
          explain: 两个传输门各 2 个管子共 4 个，产生 $\overline S$ 的反相器 2 个，合计 6 个。静态 CMOS 做同样的功能要 12 个左右。
      - item:
          id: tg-why-both
          type: choice
          prompt: 传输门为什么要把一个 NMOS 和一个 PMOS 并在一起，而不是用两个 NMOS？
          options:
            - text: 两种电平都能传满
              correct: true
            - text: 两个 NMOS 并联电阻更小，传 1 也能传满
              why: 并联只让电阻减半，两个 NMOS 都停在 $V_{DD} - V_{tn}$，阈值损失还在
            - text: PMOS 比 NMOS 快，用来加速
              why: 同尺寸的 PMOS 反而比 NMOS 慢；它的作用是在传 1 时把输出拉满
          explain: NMOS 传 1 停在 $V_{DD} - V_{tn}$，PMOS 传 0 停在 $|V_{tp}|$。两者并联，总有一个管子能把输出拉到底，所以传输门是满摆幅的。
      - card:
          title: 差分级联电压开关逻辑
          body: |
            还有一种办法同时得到满摆幅和低静态功耗：两个互补的 NMOS 下拉网络，一个实现 $F$ 的下拉、一个实现 $\overline F$ 的下拉，顶上两个 PMOS 交叉耦合（每个 PMOS 的栅极接另一边的输出）。哪一边下拉导通，那边输出被拉低，同时打开另一边的 PMOS，把另一边拉满。这叫**差分级联电压开关逻辑（DCVSL）**。

            它同时给出 $F$ 和 $\overline F$，稳定后没有直流通路。代价是输入也要成对提供，下拉网络多一份。
      - item:
          id: dcvsl-and
          type: choice
          prompt: 用 DCVSL 做与/与非门（输出 $AB$ 和 $\overline{AB}$）。两个下拉网络应该怎样连？
          options:
            - text: 一边 A、B 两个 NMOS 串联，另一边 $\overline A$、$\overline B$ 两个 NMOS 并联
              correct: true
            - text: 两边都是 A、B 串联
              why: 两边的下拉必须互补，任何输入下恰好一边导通；两边一样会同时导通或同时关断
            - text: 一边 A、B 串联，另一边 A、B 并联
              why: 另一边要在 $AB = 0$ 时导通，也就是 $\overline A + \overline B$，用的是反相的输入
          explain: A、B 串联的一边在 $AB = 1$ 时把它那边的输出拉低；$\overline A$、$\overline B$ 并联的一边在 $\overline A + \overline B = 1$，也就是 $AB = 0$ 时导通。两边互补，交叉耦合的 PMOS 把另一边拉满。
  - id: dynamic-logic
    chapter: CMOS 数字设计
    title: 动态逻辑
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个门的输出节点先被充到 $V_{DD}$，然后断开上拉，只留下拉网络。如果下拉网络一直不导通，输出会怎样？
          options:
            - text: 靠节点电容暂时保持高电平，但会因为漏电慢慢下降
              correct: true
            - text: 立刻变成 0，因为没有东西把它拉高了
              why: 节点上有电容，充上去的电荷不会立刻消失，没有导通的路径就能保持一段时间
            - text: 永远保持高电平
              why: 关断的晶体管仍有很小的漏电流，电荷会一点点漏掉，时间长了电压就掉下来
          explain: 电荷存在节点电容上，下拉不导通就保持住。可是关断的管子有漏电，所以只能保持有限时间。下面这种逻辑就利用了这种“暂存”。
      - card:
          title: 预充和求值
          body: |
            **动态逻辑（dynamic logic）**的门由时钟 $\phi$ 分两段工作。$\phi = 0$ 时是**预充（precharge）**：顶上的 PMOS 导通，把输出充到 $V_{DD}$，底下一个时钟控制的 NMOS 关断，下拉网络不起作用。$\phi = 1$ 时是**求值（evaluate）**：PMOS 关断，底下的 NMOS 导通，下拉网络导通就把输出放电到 0，不导通就保持高电平。

            $N$ 个输入只要 $N$ 个 NMOS 加两个时钟管，共 $N + 2$ 个；输入电容只有 NMOS 那一份，也没有上拉和下拉“打架”。
      - item:
          id: dyn-count
          type: number
          prompt: 一个 4 输入的动态逻辑门，下拉网络每个输入一个 NMOS。加上预充管和求值管，一共几个晶体管？
          answer: 6
          hint: 除了下拉网络，时钟控制的管子有几个？
          explain: 4 个输入 NMOS，加 1 个预充 PMOS 和 1 个求值 NMOS，共 $N + 2 = 6$ 个。静态 CMOS 要 8 个，有比逻辑要 5 个但有静态电流。
      - item:
          id: dyn-once
          type: choice
          prompt: 动态门在求值阶段，输入先是 1 让输出放电到 0，接着输入又变回 0。输出会怎样？
          options:
            - text: 保持 0，要等下一次预充才能回到 1
              correct: true
            - text: 回到 1，因为下拉网络又关断了
              why: 求值阶段上拉 PMOS 是关断的，放掉的电荷没有办法补回来
            - text: 停在 $V_{DD}/2$
              why: 节点已经放电到 0，下拉关断后没有任何电流流进来，它就停在 0
          explain: 求值阶段只能放电、不能充电。所以动态门的输入在求值时只能从 0 变到 1，不能反过来，否则会错放电。
      - card:
          title: 多米诺逻辑
          body: |
            动态门预充后输出是 1。如果把它直接接到下一个动态门的输入，下一级一开始求值就会看到 1 而错误放电，等这一级真正的结果（可能是 0）到来时已经晚了。

            解决办法是在每个动态门后面接一个静态反相器：预充时反相器输出 0，求值时只可能从 0 变到 1，正好满足下一级的要求。一级一级像推倒的骨牌一样往下传，叫**多米诺逻辑（domino logic）**。代价是每个多米诺门只能实现不取反的函数。
      - item:
          id: domino-why
          type: choice
          prompt: 多米诺逻辑为什么在每个动态门后面接一个反相器？
          options:
            - text: 让下一级的输入只会从 0 变 1
              correct: true
            - text: 让输出变成满摆幅，不再有阈值损失
              why: 动态门的输出本来就是满摆幅的 0 或 $V_{DD}$；反相器是为了让下一级的输入单调上升
            - text: 让一级门实现取反的函数，和静态 CMOS 一样
              why: 加了反相器以后，一级多米诺门实现的是不取反的函数，比如与、或
          explain: 预充后动态节点是 1，反相器输出是 0。求值时动态节点只会从 1 变 0，反相器输出只会从 0 变 1，下一级就不会被错误放电。
      - card:
          title: 例题：电荷分享
          body: 动态门输出节点电容 $C_L = 50$ fF，预充到 2.5 V。下拉网络里 A、B 两个 NMOS 串联，它们中间的节点电容 $C_a = 15$ fF，原来是 0 V。求值时 A = 1、B = 0，输出变成多少？
          reveal:
            - title: 第 1 步：电荷流到哪里
              body: A 导通、B 关断，输出和中间节点连通，但没有通到地。输出电容上的电荷分给两个电容，这叫**电荷分享（charge sharing）**。
            - title: 第 2 步：电荷守恒
              body: 原来的电荷 $50\ \text{fF}\times2.5\ \text{V}$，现在两个电容并联：$V = 2.5\times\dfrac{50}{50 + 15} = 1.92$ V。
            - title: 第 3 步：会不会出错
              body: 输出掉了 0.58 V，比后面反相器 PMOS 的阈值（约 0.4 V）还多，这个 PMOS 开始导通，反相器输出离开 0、出现静态电流，噪声容限也被吃掉一大块。所以内部节点电容要小，或者把内部节点也预充。
      - item:
          id: charge-share-max
          type: number
          prompt: 动态门输出电容 $C_L = 30$ fF，预充到 $V_{DD} = 2.5$ V。要让电荷分享造成的压降小于 0.43 V，原来放电到 0 的内部节点电容 $C_a$ 最大是多少飞法？
          answer: 6.23
          tolerance: 0.02
          unit: fF
          hint: 分享后两个电容电压相同、总电荷不变；压降正好 0.43 V 时，$C_a$ 和 $C_L$ 是什么比例？
          explain: $2.5\,C_a/(C_a + 30) = 0.43$，即 $2.07\,C_a = 12.9$，$C_a = 6.23$ fF。内部节点电容要比输出小很多，压降才可控。压降小于 NMOS 阈值时，中间那个管子会在内部节点升到 $V_{DD} - V_{tn}$ 时先关断，压降按 $C_a(V_{DD} - V_{tn})/C_L$ 算，在 0.43 V 这一点两种算法给出同一个 $C_a$。
      - card:
          title: 漏电和保持管
          body: |
            求值阶段下拉不导通时，输出靠电容保持高电平，可关断的晶体管仍有漏电，电压会慢慢往下掉。时钟太慢，或者电路要停住时钟，动态节点就会丢失数据，所以动态逻辑有最低工作频率。

            常用的办法是加一个弱的 PMOS，栅极接后面反相器的输出：动态节点是高电平时它导通，不断补充漏掉的电荷，叫**保持管（keeper）**。它要足够弱，下拉网络导通时才能压过它。
      - item:
          id: dyn-leak-time
          type: number
          prompt: 动态节点电容 20 fF，预充到高电平后漏电流约 1 nA。电压下降 0.5 V 要多少微秒？
          answer: 10
          tolerance: 0.01
          unit: μs
          hint: 电容上的电压变化等于漏掉的电荷除以什么？
          explain: $\Delta t = C\Delta V/I = 20\ \text{fF}\times0.5\ \text{V}/1\ \text{nA} = 10$ μs。时钟周期远短于这个时间，动态节点就来得及在掉下去之前被重新预充。
  - id: adders
    chapter: CMOS 数字设计
    title: 加法器、乘法器和移位器
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个 32 位行波进位加法器和一个 16 位行波进位加法器，用同样的全加器。最坏情况下 32 位的大约慢多少？
          options:
            - text: 大约两倍
              correct: true
            - text: 一样快，每一位是同时算的
              why: 每一位的和要等低一位的进位，最坏情况下进位要从最低位一路传到最高位
            - text: 大约四倍，延迟和位数的平方成正比
              why: 进位每过一位多一级延迟，总延迟和位数成正比，不是平方
          explain: 最坏情况下进位从第 0 位一路传到最高位，过多少位就有多少级进位延迟。位数翻倍，延迟约翻倍。
      - card:
          title: 行波进位的延迟
          body: |
            全加器算出 $S = A\oplus B\oplus C_{in}$、$C_{out} = AB + C_{in}(A\oplus B)$；把 $N$ 个全加器的进位首尾相接，就是行波进位加法器。最坏情况下进位穿过前 $N - 1$ 位，最高位再算一次和：

            $$t_{add} = (N - 1)\,t_{carry} + t_{sum}$$

            所以电路设计的重点是让进位那一路尽量快。把全加器直接按公式搭成静态 CMOS 要 28 个晶体管；利用“输入全部取反，输出也全部取反”的性质，可以做成上下对称的镜像加法器，只要 24 个，进位一路只过一级门。
      - item:
          id: ripple-16
          type: number
          prompt: 16 位行波进位加法器，每位进位延迟 $t_{carry} = 40$ ps，求和延迟 $t_{sum} = 60$ ps。最坏情况下加法要多少皮秒？
          answer: 660
          tolerance: 0.5
          unit: ps
          hint: 进位要穿过几位，最后还要做什么？
          explain: $t = (16 - 1)\times40 + 60 = 660$ ps。进位链上的 15 级占了绝大部分时间。
      - card:
          title: 让进位更快
          body: |
            行波进位慢在逐位等待，改进的思路是让进位提前知道。

            **超前进位加法器（carry-lookahead adder）**用每位的生成 $G_i = A_iB_i$、传播 $P_i = A_i\oplus B_i$ 直接展开 $C_{i+1} = G_i + P_iC_i$。位数多时展开式太长，就分组做成树：先算每 4 位一组的组生成、组传播，再在组之间超前，延迟按 $\log N$ 增长。

            **进位选择加法器（carry-select adder）**把位分成几块，每块同时算“进位输入为 0”和“为 1”两份结果，真实进位一到，用多路选择器挑一份，代价是加法电路多一倍。
      - item:
          id: cla-c2
          type: choice
          prompt: 超前进位里 $C_2 = G_1 + P_1G_0 + P_1P_0C_0$。某次相加，第 1 位 $A_1 = 1$、$B_1 = 0$，第 0 位 $A_0 = B_0 = 1$，$C_0 = 0$。$C_2$ 是多少，为什么？
          options:
            - text: 1，第 0 位生成了进位，第 1 位把它传了上去
              correct: true
            - text: 0，第 1 位的 $A_1$、$B_1$ 不全是 1，不产生进位
              why: 第 1 位确实不生成进位（$G_1 = 0$），但 $P_1 = 1$，它会把低位来的进位传上去
            - text: 0，$C_0 = 0$，没有进位输入
              why: $C_0 = 0$ 只让最后一项为 0；第 0 位 $A_0 = B_0 = 1$，自己就生成了进位 $G_0 = 1$
          explain: $G_0 = 1\cdot1 = 1$，$P_1 = 1\oplus0 = 1$，$G_1 = 0$，所以 $C_2 = 0 + 1\cdot1 + 0 = 1$。
      - item:
          id: carry-select-cost
          type: choice
          prompt: 进位选择加法器比行波进位加法器快，它付出的主要代价是什么？
          options:
            - text: 每块的加法电路做两份，再加多路选择器，面积和功耗变大
              correct: true
            - text: 结果偶尔会错，要再算一遍
              why: 两份结果都是精确算出来的，选择器按真实进位挑一份，结果总是对的
            - text: 只能做无符号数的加法
              why: 补码加法和无符号加法用的是同一套加法电路，进位选择也一样
          explain: 每一块同时算出进位为 0 和为 1 的结果，真实进位到来时只需一级多路选择器的延迟。速度换来的是大约多一倍的加法电路。
      - card:
          title: 乘法器和移位器
          body: |
            二进制乘法和手算竖式一样：$B$ 的每一位分别和 $A$ 相与，得到一行**部分积（partial product）**，各行错位相加。$N$ 位乘 $N$ 位有 $N$ 行、每行 $N$ 位，要 $N^2$ 个与门，结果有 $2N$ 位。把加法器排成方阵逐行累加，就是**阵列乘法器（array multiplier）**。

            移位器把一个数左移或右移若干位。**桶形移位器（barrel shifter）**一步移任意位数；位数多时常做成对数结构：第 $k$ 级按控制位决定移 $2^k$ 位或不移，32 位只要 5 级。
      - item:
          id: pp-count
          type: number
          prompt: 一个 16 位乘 16 位的阵列乘法器，生成部分积要几个与门？
          answer: 256
          hint: 有几行部分积，每行几位？
          explain: 16 行，每行 16 位，共 $16^2 = 256$ 个与门。乘积有 32 位。
      - item:
          id: log-shifter-stages
          type: number
          prompt: 用对数结构做一个 64 位移位器，能移 0 到 63 位。要几级？
          answer: 6
          hint: 每一级移 1、2、4……位，几级的组合能凑出 0 到 63？
          explain: 6 级分别移 1、2、4、8、16、32 位，任意 0 到 63 都能由它们组合出来，$\log_2 64 = 6$。
  - id: datapath-design
    chapter: CMOS 数字设计
    title: 设计方法和数据通路版图
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个 32 位的数据通路里，加法器、移位器、寄存器每一位的电路都一样。画版图时最省事的做法是什么？
          options:
            - text: 画好一位，再把它复制 32 份排起来
              correct: true
            - text: 32 位每一位都单独画，好分别优化
              why: 每一位的功能和连线方式都相同，单独画只会多花时间，还容易出错
            - text: 交给软件自动摆放，不按位排列
              why: 让软件自动摆放也可以，但对这种规整的结构，按位排列能得到更短、更整齐的连线
          explain: 每一位相同，就画一位、复制 32 份。这种做法叫位片，是数据通路版图的基本方法。
      - card:
          title: 几种设计方式
          body: |
            一块大芯片按功能分成若干**模块（module）**，如处理器核、各种接口，每个模块可以用不同的方式做出来，区别在于有多少是专门设计的。

            **全定制（full custom）**：每个晶体管的尺寸和版图都手工设计，性能和密度最好，花的人力最多。**标准单元（standard cell）**：先做好一套固定高度的门和触发器，用软件把它们摆放、连线，现在大多数数字芯片这样做。**门阵列（gate array）**：晶体管预先做好，只为每个设计定制最上面几层金属连线。**FPGA**：芯片做好后通过编程改变功能，不用再流片。
      - item:
          id: style-choice
          type: choice
          prompt: 一个小团队要做 50 块板子验证一个新算法，三个月内要用上。下面哪种实现方式最合适？
          options:
            - text: FPGA
              correct: true
            - text: 全定制芯片
              why: 全定制要几个月的版图设计，再加几个月流片，前期费用很高，50 块的量摊不开
            - text: 标准单元芯片
              why: 标准单元芯片比全定制快，但仍要流片，掩模费用高、周期以月计，50 块的量划不来
          explain: 量小、要得急，用 FPGA：不用流片，编程就能改。量大、追求性能和功耗时才值得做专用芯片。
      - item:
          id: style-full-custom
          type: choice
          prompt: 一款每年卖几千万片的处理器，它的加法器、寄存器堆这些关键电路常用哪种方式设计？
          options:
            - text: 全定制
              correct: true
            - text: FPGA，改设计不用重新流片
              why: FPGA 的可编程连线带来很大的面积、延迟和功耗开销，量大时单片成本也高
            - text: 门阵列，晶体管已经预先做好
              why: 门阵列的晶体管尺寸和位置是预先定好的，没法为关键路径专门优化
          explain: 产量大，设计上多花的人力能摊薄；关键电路手工优化能换来更高频率、更小面积。芯片的其余部分通常还是用标准单元。
      - card:
          title: 位片式的数据通路
          body: |
            数据通路由寄存器堆、加法器、移位器这些按位重复的部件组成。版图上把一位的所有部件横着排成一条，叫一个**位片（bit slice）**；再把 $N$ 个位片竖着叠起来。数据沿位片横向在部件之间流动，控制信号竖着穿过所有位，电源线沿位片走。

            每个位片的高度叫**位距（bit pitch）**，所有部件按同一个位距设计，叠起来才能对齐。整个数据通路高 $N\times$ 位距，宽是各部件宽度之和。
      - card:
          title: 例题：估算数据通路的面积
          body: 一个 32 位的数据通路，位距 12 μm。横向依次是寄存器堆（宽 200 μm）、加法器（150 μm）、移位器（100 μm）。它占多大面积？
          reveal:
            - title: 第 1 步：高度
              body: 32 个位片竖着叠：$32\times12 = 384$ μm。
            - title: 第 2 步：宽度
              body: 三个部件横向相加：$200 + 150 + 100 = 450$ μm。
            - title: 第 3 步：面积
              body: $384\times450 = 172\,800\ \text{μm}^2$，约 0.173 mm²。位距只要每个部件里最高的那一位能放下就行，所以部件之间要协调好。
      - item:
          id: datapath-area
          type: number
          prompt: 一个 64 位的数据通路，位距 9 μm，各部件宽度加起来 600 μm。它的面积是多少平方毫米？
          answer: 0.3456
          tolerance: 0.0005
          unit: mm²
          hint: 高度是多少？1 mm² 是多少 μm²？
          explain: 高 $64\times9 = 576$ μm，面积 $576\times600 = 345\,600\ \text{μm}^2 = 0.3456\ \text{mm}^2$。
      - item:
          id: bitslice-control
          type: choice
          prompt: 位片式数据通路里，加法器的“做加法还是减法”这个控制信号应该怎样走线？
          options:
            - text: 竖着穿过所有位片，每一位都接到同一根线
              correct: true
            - text: 沿着位片横着走，和数据线并排
              why: 横着走的是在部件之间流动的数据；同一个控制信号要送到每一位，竖着穿过最短
            - text: 每一位单独引一根线到控制电路
              why: 32 位都要同一个值，一根竖线就够了，分别引线浪费面积
          explain: 数据横走、控制竖走，两类线用不同的金属层，互不干扰，版图规整、连线最短。
  - id: latches-registers
    chapter: CMOS 数字设计
    title: 锁存器、寄存器和它们的时序参数
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 两个寄存器之间夹着一段组合逻辑，逻辑最慢要 600 ps。时钟周期能不能也设成 600 ps？
          options:
            - text: 不能，寄存器还有两段开销
              correct: true
            - text: 能，周期只要不比逻辑延迟短就行
              why: 数据从前一个寄存器出来要一段时间，到了后一个寄存器还要在时钟沿之前提前一段时间稳定，这两段都要算进周期
            - text: 不能，周期至少要是逻辑延迟的两倍
              why: 周期只需比逻辑延迟多出寄存器的两项开销，几十皮秒，不用翻倍
          explain: 周期要容纳三段：前一个寄存器从时钟沿到输出更新的时间、组合逻辑延迟、后一个寄存器要求数据提前站稳的时间。只给 600 ps，数据来不及在时钟沿之前站稳。
      - card:
          title: 时序元件的分类和三个时间量
          body: |
            锁存器在时钟为某一电平时透明，寄存器（触发器）只在时钟沿采样；电路设计里，单个边沿触发的存储单元本身也常叫**寄存器（register）**。按存储方式还可以分成静态（靠反馈环保持）和动态（靠电容上的电荷保持）。

            寄存器的时序用三个时间量描述：**建立时间（setup time）** $t_{setup}$，数据在时钟沿之前要稳定多久；**保持时间（hold time）** $t_{hold}$，时钟沿之后还要稳定多久；**时钟到输出延迟（clock-to-Q delay）** $t_{c\text-q}$，时钟沿之后多久输出才变成新值。
      - card:
          title: 两条约束
          body: |
            数据从前一个寄存器出发，经过最慢的组合逻辑，要在下一个时钟沿之前 $t_{setup}$ 到达，所以时钟周期

            $$T \ge t_{c\text-q} + t_{logic} + t_{setup}$$

            另一方面，时钟沿刚过，前一个寄存器最快的新数据经过最短的逻辑到达后一个寄存器，不能早于后一个寄存器要求的保持时间：

            $$t_{c\text-q,cd} + t_{logic,cd} \ge t_{hold}$$

            右下角的 $cd$ 表示最短延迟（contamination delay）。第一条决定最高频率，第二条和频率无关。
      - item:
          id: fmax-regs
          type: number
          prompt: 寄存器的 $t_{c\text-q} = 100$ ps、$t_{setup} = 60$ ps，两个寄存器之间最慢的组合逻辑 1.2 ns。最高时钟频率是多少兆赫？
          answer: 735
          tolerance: 0.5
          unit: MHz
          hint: 最短周期由哪三段相加？
          explain: $T_{min} = 100 + 1200 + 60 = 1360$ ps，$f_{max} = 1/1.36\ \text{ns} = 735$ MHz。
      - item:
          id: hold-slack-basic
          type: number
          prompt: 寄存器最短的时钟到输出延迟 60 ps，保持时间 50 ps，两个寄存器之间最短的组合逻辑只有 20 ps。保持时间的裕量（实际到达比要求晚了多少）是多少皮秒？
          answer: 30
          tolerance: 0.01
          unit: ps
          hint: 新数据最早什么时候到达后一个寄存器？
          explain: 最早在 $60 + 20 = 80$ ps 到达，要求不早于 50 ps，裕量 $80 - 50 = 30$ ps，满足保持约束。
      - card:
          title: 静态锁存器和主从寄存器
          body: |
            一种常见的静态锁存器用两个传输门和两个反相器：时钟为 1 时，第一个传输门把 $D$ 接进来，反相器把它送到输出；时钟为 0 时，第一个传输门断开，第二个传输门闭合，两个反相器首尾相接形成反馈环，把值锁住。两个反相器首尾相接有两个稳定状态，叫双稳态电路。

            把两个这样的锁存器串起来，前一个在时钟为 0 时透明、后一个在时钟为 1 时透明，就是**主从寄存器（master-slave register）**：时钟上升沿那一刻，主锁存器锁住 $D$，从锁存器把它送到输出。
      - item:
          id: ms-count
          type: number
          prompt: 一种静态锁存器用两个传输门（一个接入 $D$，一个闭合反馈环）和两个 CMOS 反相器。用两个这样的锁存器串成主从寄存器，一共用几个晶体管（不算产生反相时钟的电路）？
          answer: 16
          hint: 一个锁存器几个管子？主从寄存器有几个锁存器？
          explain: 一个传输门 2 个管子，一个反相器 2 个，一个锁存器 $2\times2 + 2\times2 = 8$ 个，两个锁存器共 16 个。
      - item:
          id: ms-edge
          type: choice
          prompt: 主从寄存器的主锁存器在时钟为 0 时透明、从锁存器在时钟为 1 时透明。它在哪个时刻采样 $D$？
          options:
            - text: 时钟从 0 变到 1 的上升沿
              correct: true
            - text: 时钟为 0 的整个期间
              why: 时钟为 0 时主锁存器透明，$D$ 的变化只走到主锁存器的输出，从锁存器关着，输出不变
            - text: 时钟从 1 变到 0 的下降沿
              why: 下降沿时主锁存器重新打开，从锁存器锁住的是上升沿时的值；下降沿不改变输出
          explain: 上升沿那一刻主锁存器关上，锁住当时的 $D$；同时从锁存器打开，把这个值送到输出。整体只在上升沿采样一次。
  - id: dynamic-registers
    chapter: CMOS 数字设计
    title: 时钟重叠和动态寄存器
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 主从寄存器的两个锁存器分别由时钟 $CLK$ 和它的反 $\overline{CLK}$ 控制。$\overline{CLK}$ 由一个反相器产生，比 $CLK$ 晚一点点。这会带来什么风险？
          options:
            - text: 有一小段时间两个锁存器同时透明，数据可能直接穿过去
              correct: true
            - text: 没有风险，晚一点点不影响逻辑
              why: 在这一小段时间里两个时钟同时是 1（或同时是 0），主从两个锁存器可能同时打开
            - text: 寄存器会在两个沿各采样一次
              why: 问题不是多采样一次，而是在重叠的那一小段时间里，新数据能一路穿到输出
          explain: 反相器有延迟，$CLK$ 和 $\overline{CLK}$ 会短暂地同时为高或同时为低。两个锁存器同时透明时，输入的新数据可以直接穿到输出。
      - card:
          title: 时钟重叠造成的竞争
          body: |
            传输门式主从寄存器里，主锁存器的传输门 T1 由 $\overline{CLK}$ 打开，从锁存器的传输门 T2 由 $CLK$ 打开。上升沿附近如果 $CLK$ 和 $\overline{CLK}$ 同时为 1，T1 和 T2 都导通，$D$ 经 T1、主锁存器的反相器 I1、T2 一路穿进从锁存器、到达输出，这叫**竞争（race）**。

            只要重叠的时间比数据穿过 T1、I1、T2 的延迟短，新数据就来不及穿过去。所以要么把两路时钟做得重叠很少，要么换一种对重叠不敏感的结构。
      - item:
          id: overlap-max
          type: number
          prompt: 传输门式主从寄存器里，数据穿过主锁存器传输门 30 ps、反相器 40 ps、从锁存器传输门 30 ps。两路时钟同时为 1 的重叠时间最多可以是多少皮秒，数据才不会在重叠期间穿进从锁存器？
          answer: 100
          tolerance: 0.01
          unit: ps
          hint: 数据要走完哪几段才能进入从锁存器？
          explain: 数据要穿过 T1、I1、T2 三段，共 $30 + 40 + 30 = 100$ ps。重叠时间小于 100 ps，数据还在半路时 T1 或 T2 已经关上。
      - card:
          title: 动态锁存器和 C²MOS
          body: |
            如果不要反馈环，只用一个传输门把 $D$ 送到反相器的栅极，传输门断开后，值靠反相器栅极上的电容保持，这就是**动态锁存器（dynamic latch）**。它管子少、快，但和动态逻辑一样会漏电，时钟不能太慢，也不能停。

            另一种动态寄存器把传输门换成由时钟控制的反相器：上拉、下拉各串一个时钟管，叫**C²MOS 寄存器（clocked CMOS register）**。只要时钟沿足够陡，$CLK$ 和 $\overline{CLK}$ 同时为 1 或同时为 0 都不会让数据穿过去。
      - item:
          id: dyn-reg-hold
          type: number
          prompt: 动态寄存器的存储节点电容 5 fF，漏电流 10 pA，节点电压允许下降 0.3 V。存储的值能保持多少微秒？
          answer: 150
          tolerance: 0.1
          unit: μs
          hint: 漏掉多少电荷电压才降 0.3 V？
          explain: $\Delta t = C\Delta V/I = 5\ \text{fF}\times0.3\ \text{V}/10\ \text{pA} = 150$ μs。时钟停住超过这个时间，值就可能丢失。
      - item:
          id: dyn-vs-static
          type: choice
          prompt: 一个低功耗芯片在空闲时要把时钟完全停住，过一会儿再恢复，寄存器里的值不能丢。它的寄存器应该用哪种？
          options:
            - text: 静态寄存器
              correct: true
            - text: 动态寄存器，因为管子少、功耗低
              why: 动态寄存器靠电容存值，时钟停住后电荷会漏掉，值会丢失
            - text: 哪种都行，时钟停住时寄存器不工作
              why: 不工作也要保住值；动态寄存器在时钟停住时没有东西补充漏掉的电荷
          explain: 静态寄存器靠反相器的反馈环保持，只要有电就不会丢；动态寄存器有最低时钟频率，不能停时钟。
      - card:
          title: 两相时钟和单相时钟
          body: |
            避免竞争的一种老办法是用**两相不重叠时钟（two-phase non-overlapping clock）** $\phi_1$、$\phi_2$：两路时钟轮流为高，中间留一段两者都为低的间隙，两个锁存器永远不会同时透明。代价是要产生、分配两路时钟，间隙也占用了周期。

            另一种做法是只用一路时钟，靠电路结构保证只在一个沿采样，比如**真单相时钟寄存器（TSPC register）**，时钟分配简单，适合高速电路。
      - item:
          id: two-phase-high
          type: number
          prompt: 两相不重叠时钟的周期是 2 ns，两次相位切换处各留 0.1 ns 的间隙（这段时间两路都为低）。两路时钟时长相等，每一路为高的时间是多少纳秒？
          answer: 0.9
          tolerance: 0.001
          unit: ns
          hint: 一个周期里，两段间隙之外的时间怎样分给两路？
          explain: $(2 - 2\times0.1)/2 = 0.9$ ns。间隙越大越安全，但能做逻辑的时间越少。
  - id: pulse-registers
    chapter: CMOS 数字设计
    title: 脉冲寄存器、借时间和亚稳态
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个锁存器只在每个时钟上升沿之后透明 90 ps，其余时间锁住。它的行为更像锁存器还是寄存器？
          options:
            - text: 像寄存器，每个周期只在沿附近采样一次
              correct: true
            - text: 像锁存器，它本身就是锁存器
              why: 结构是锁存器，但透明的窗口很窄、紧跟在沿后面，对外表现为每个沿采样一次
            - text: 两者都不像，它会一直输出 0
              why: 透明的 90 ps 里输入照常传到输出，之后锁住这个值，输出不会一直是 0
          explain: 透明窗口很窄，一个周期只开一次，效果和沿触发的寄存器一样。下面的寄存器就利用了这一点。
      - card:
          title: 脉冲寄存器
          body: |
            **脉冲寄存器（pulse register）**用一个锁存器加一个窄脉冲发生器：把时钟和它经过三个反相器后的信号（延迟了，相位也反了）相与，在每个上升沿后得到一个宽度约等于三个反相器延迟的脉冲，锁存器只在脉冲期间透明。

            它只有一个锁存器，比主从寄存器快、管子少。代价是保持时间变长：脉冲期间锁存器一直透明，数据要在整个脉冲宽度里保持不变，保持时间约等于脉冲宽度。
      - item:
          id: pulse-hold
          type: number
          prompt: 脉冲发生器把时钟和它经过三个反相器后的信号相与，每个反相器延迟 30 ps。脉冲寄存器的保持时间大约是多少皮秒？
          answer: 90
          tolerance: 0.01
          unit: ps
          hint: 锁存器透明多久？
          explain: 脉冲宽度约是三个反相器的延迟 $3\times30 = 90$ ps。透明期间输入变了会传到输出，所以数据要在这 90 ps 内保持，保持时间约 90 ps。
      - card:
          title: 锁存器系统可以借时间
          body: |
            用寄存器时，每一级组合逻辑必须在自己的一个周期里做完，哪一级稍长，整个周期就得放长。

            用两相锁存器流水线时（相邻锁存器交替在时钟高、低时透明），数据到达一个锁存器时如果它还透明，就直接穿过去，进入下一段逻辑。于是一段逻辑超出了自己那半个周期，可以占用下一段的时间，只要两段加起来不超过一个周期。这叫**借时间（time borrowing）**。
      - item:
          id: borrow-amount
          type: number
          prompt: 两相锁存器流水线，时钟周期 1 ns，每段逻辑名义上分到半个周期 500 ps。第一段逻辑要 650 ps，第二段要 300 ps。第一段从第二段借了多少皮秒？（不计锁存器自身延迟）
          answer: 150
          tolerance: 0.01
          unit: ps
          hint: 第一段超出了它那半个周期多少？
          explain: 第一段超出 $650 - 500 = 150$ ps，这 150 ps 从第二段借来；第二段剩 $500 - 150 = 350$ ps，只用 300 ps，来得及。两段合计 950 ps，小于 1 ns。
      - card:
          title: 亚稳态和平均无故障时间
          body: |
            异步输入恰好在时钟沿附近变化时，寄存器会停在中间电压（亚稳态），经过一段随机的时间才倒向 0 或 1。给它的解决时间 $t_r$ 越长，到时还没决定的概率按指数下降，用**平均无故障时间（MTBF, mean time between failures）**衡量：

            $$\text{MTBF} = \frac{e^{t_r/\tau}}{T_0\,f_{clk}\,f_{data}}$$

            $\tau$ 是寄存器反馈环的时间常数，$T_0$ 是和寄存器有关的时间窗口，$f_{clk}$、$f_{data}$ 是时钟和异步数据的变化频率。
      - card:
          title: 例题：一个同步器的 MTBF
          body: $\tau = 20$ ps，$T_0 = 20$ ps，时钟 1 GHz，异步数据每秒变化 $10^8$ 次。给寄存器 800 ps 的解决时间，MTBF 是多少？
          reveal:
            - title: 第 1 步：分子
              body: $e^{800/20} = e^{40} = 2.35\times10^{17}$。
            - title: 第 2 步：分母
              body: $T_0f_{clk}f_{data} = 20\times10^{-12}\times10^9\times10^8 = 2\times10^6\ \text{s}^{-1}$。
            - title: 第 3 步：相除
              body: MTBF $= 2.35\times10^{17}/(2\times10^6) = 1.18\times10^{11}$ s，约 3700 年。再串一级寄存器，解决时间多出一个周期（1 ns），MTBF 再乘 $e^{50}$，就是常用的两级同步器。
      - item:
          id: mtbf-ratio
          type: number
          prompt: 同步器里寄存器的时间常数 $\tau = 25$ ps。把解决时间多给 250 ps，平均无故障时间变为原来的多少倍？
          answer: 22026
          tolerance: 5
          hint: 分母不变，分子里的指数增加了多少？
          explain: MTBF 和 $e^{t_r/\tau}$ 成正比，指数增加 $250/25 = 10$，倍数是 $e^{10} = 22026$。解决时间多一点，可靠性就大大提高。
      - item:
          id: sync-why
          type: choice
          prompt: 一个按键信号接进芯片，要在 500 MHz 的时钟域里使用。为什么要先过两级串联的寄存器？
          options:
            - text: 第一级可能亚稳态，多给它一个周期的解决时间，第二级输出几乎不会是中间电压
              correct: true
            - text: 为了让按键信号延迟两个周期，过滤掉抖动
              why: 两个周期只有几纳秒，按键的机械抖动是毫秒级的，要另外去抖；两级寄存器解决的是亚稳态
            - text: 一级寄存器不能采样外部信号
              why: 一级能采样，只是它的输出有一定概率处在亚稳态，直接用可能让后面的逻辑出错
          explain: 异步信号可能在时钟沿附近变化，第一级寄存器有一定概率亚稳态。第二级在下一个沿采样，第一级已经有一个周期去倒向 0 或 1，MTBF 增加 $e^{T/\tau}$ 倍。
  - id: cell-layout
    chapter: 标准单元
    title: 门的版图和标准单元
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 标准单元库里有反相器、与非门、触发器，功能和管子数都不一样。它们的版图在哪个尺寸上必须一样？
          options:
            - text: 高度一样，宽度随功能变化
              correct: true
            - text: 宽度和高度都一样
              why: 触发器的管子比反相器多得多，硬塞进同样的面积要么浪费、要么放不下；只统一高度
            - text: 宽度一样，高度随功能变化
              why: 单元要一个挨一个排成行，共用顶上和底下的电源线，高度不一样就接不上
          explain: 标准单元高度固定，电源线在固定位置，单元一个接一个排成一行时电源线自然连通。宽度按功能需要来定。
      - card:
          title: 反相器的版图
          body: |
            CMOS 反相器的版图从上到下：顶上一条金属的电源线 $V_{DD}$，下面是做在 n 阱里的 PMOS，再下面是做在 p 型衬底上的 NMOS，最底下一条金属的地线。一条竖着的多晶硅同时穿过 PMOS 和 NMOS 的有源区，就是两个管子共用的栅极，也就是输入。

            两个管子的源极经接触孔分别连到电源线和地线，两个漏极用一段金属连起来，就是输出。这样的排布让电源线和地线水平贯穿，便于相邻单元首尾相接。
      - card:
          title: 棍图和欧拉路径
          body: |
            画版图之前，常先画一张不管尺寸、只用不同颜色的线表示各层和连接关系的草图，叫**棍图（stick diagram）**。

            多输入门里，如果几个输入的多晶硅按某个次序排列，能让 NMOS 的有源区和 PMOS 的有源区都连成一整条、中间不断开，面积最小。办法是把下拉网络和上拉网络各画成一张图（节点是连接点，每个管子是一条边），找一个对两张图都适用的输入次序，使它在两张图里都是一笔走完所有边的路径，叫**欧拉路径（Euler path）**。
      - item:
          id: euler-order
          type: choice
          prompt: 与或非门 $Y = \overline{AB + C}$ 的下拉网络是 A、B 串联再和 C 并联，上拉网络是 A、B 并联再和 C 串联。多晶硅按下面哪个次序排列，上拉和下拉的有源区都能各连成一条、中间不断开？
          options:
            - text: A、B、C
              correct: true
            - text: A、C、B
              why: 下拉网络能一笔走完，可上拉网络里 A 走完到达 $V_{DD}$ 或中间节点，接着 C 走到输出，B 就接不上了，PMOS 的有源区要断开
            - text: 任何次序都不行，复合门的有源区总要断开
              why: A、B、C 这个次序在两张图里都是一笔走完的路径，有源区可以不断开
          explain: 下拉：输出 →A→ 中间节点 →B→ 地 →C→ 输出；上拉：中间节点 →A→ $V_{DD}$ →B→ 中间节点 →C→ 输出。两张图都按 A、B、C 一笔走完（下拉这一笔起点终点都是输出，是一个回路），所以 NMOS 和 PMOS 的有源区各自连成一条。
      - card:
          title: 标准单元的格式
          body: |
            标准单元库里的单元有统一的格式：高度相同，电源线和地线在顶上和底下固定的位置；宽度是一个最小宽度单位（叫 site）的整数倍；引脚落在连线网格上。单元由软件自动摆放，叫**布局（placement）**；再由软件连线，叫**布线（routing）**。单元排成一行行，相邻两行上下翻转，共用中间那条电源线或地线。

            例如开源的 SkyWater 130 nm 工艺，它的高密度标准单元库单元高 2.72 μm，最小宽度单位 0.46 μm。
      - card:
          title: 例题：估算标准单元区的面积
          body: 一个设计综合后有 10 000 个标准单元，平均每个宽 6 个最小宽度单位。用高 2.72 μm、最小宽度单位 0.46 μm 的库，单元排布的利用率取 70%（其余留给布线和插入缓冲器），核心区要多大？
          reveal:
            - title: 第 1 步：一个单元的平均面积
              body: $6\times0.46 = 2.76$ μm 宽，乘高度 $2.76\times2.72 = 7.51\ \text{μm}^2$。
            - title: 第 2 步：全部单元的面积
              body: $10\,000\times7.51 = 75\,072\ \text{μm}^2$。
            - title: 第 3 步：除以利用率
              body: $75\,072/0.7 = 107\,246\ \text{μm}^2$，约 0.107 mm²。
      - item:
          id: row-sites
          type: number
          prompt: 一行标准单元长 500 μm，库的最小宽度单位是 0.46 μm。这一行最多能放几个最小宽度单位？（只算整的）
          answer: 1086
          hint: 500 除以 0.46，余下不够一个的怎么办？
          explain: $500/0.46 = 1086.96$，只能放整的 1086 个，剩下不到一个单位的空隙留空。
      - item:
          id: core-area
          type: number
          prompt: 一个设计有 20 000 个标准单元，平均宽 5 个最小宽度单位，库的单元高 2.72 μm、最小宽度单位 0.46 μm，利用率取 80%。核心区面积是多少平方毫米？
          answer: 0.1564
          tolerance: 0.0002
          unit: mm²
          hint: 全部单元加起来多大？利用率 80% 意味着核心区比它大还是小？
          explain: 单元面积 $20\,000\times5\times0.46\times2.72 = 125\,120\ \text{μm}^2$，除以 0.8 得 $156\,400\ \text{μm}^2 = 0.1564\ \text{mm}^2$。
  - id: cell-library
    chapter: 标准单元
    title: 单元库的视图和表征
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 布局布线软件要把上万个标准单元摆好、连上线。它需要知道每个单元的什么信息？
          options:
            - text: 外框尺寸、引脚在哪一层的什么位置、哪里不能走线
              correct: true
            - text: 每个晶体管的全部版图细节
              why: 摆放和连线只需要外框、引脚和禁止走线的区域；全部细节数据量太大，留到最后合并版图时才用
            - text: 单元内部的晶体管尺寸
              why: 晶体管尺寸影响的是延迟和功耗，这些由时序库描述；摆放和连线不需要知道
          explain: 布局布线只关心单元的外形和引脚。所以单元库给它一份只有外形和引脚的简化描述，完整版图另放一份，最后流片前再合并。
      - card:
          title: 一个单元，几种描述
          body: |
            标准单元库给每个单元准备几份描述，分别给不同的工具用，每一份叫一个**视图（view）**。

            - **LEF（library exchange format）**：抽象视图，只有外框、引脚形状和所在金属层、禁止走线的区域，给布局布线用；
            - **GDS**：完整版图，每一层的全部几何图形，用来做 DRC、LVS 和流片。
      - item:
          id: view-for-fab
          type: choice
          prompt: 设计做完，交给晶圆厂做掩模的是标准单元库里每个单元的哪一种视图（和整块芯片的连线合并在一起）？
          options:
            - text: GDS
              correct: true
            - text: LEF
              why: LEF 只有外框、引脚和禁止走线的区域，单元里面的晶体管图形都没有，做不出掩模
            - text: 记录延迟和功耗的时序数据
              why: 那是给时序分析用的数，没有任何几何图形
          explain: 做掩模要每一层的全部图形。布局布线时用 LEF 占位，最后把每个单元的 GDS 填进去，和连线合成整块芯片的 GDS 交给晶圆厂。
      - card:
          title: 给综合和仿真用的视图
          body: |
            - **Liberty 时序库（Liberty）**：每个单元的逻辑功能、各引脚的电容、延迟和功耗表，给综合工具（把硬件描述变成门）和静态时序分析用；
            - 电路网表：给晶体管级电路仿真程序 SPICE 用的网表、Verilog 写的门级网表，给仿真和 LVS 用。

            开源流程 OpenLane 的工艺配置里，就分别指定单元库的 LEF、GDS、Liberty 文件和布线网格。
      - item:
          id: view-for-sta
          type: choice
          prompt: 静态时序分析算一条路径的延迟时，从单元库的哪个视图里取每个门的延迟？
          options:
            - text: Liberty 时序库
              correct: true
            - text: LEF，布局布线用的抽象视图
              why: LEF 只有外框和引脚的几何形状，没有任何延迟信息
            - text: GDS，含全部几何图形的完整版图
              why: GDS 是全部版图图形，要从里面得到延迟得重新做电路仿真；时序分析直接查时序库里已经算好的表
          explain: 延迟、引脚电容、功耗都事先测好写进 Liberty 时序库，综合和时序分析直接查表。
      - card:
          title: 用 SPICE 表征单元
          body: |
            时序库里的数是用电路仿真测出来的，叫**单元表征（cell characterization）**。对每个单元，用 SPICE 扫一组输入转换时间（输入从 10% 变到 90%（有的库取 20% 到 80%）所用的时间）和一组输出负载电容，每种组合做一次瞬态仿真，量出延迟（输入过 50% 到输出过 50%）和输出转换时间，填成二维表。

            同样的仿真还要在不同的工艺角（快、典型、慢）、电压和温度下各做一遍，因为晶体管的快慢会随它们变化。工具用到表里没有的点时，在相邻的四个格点之间插值。
      - card:
          title: 例题：查延迟表
          body: 某个门的延迟表：输入转换时间 0.1 ns、负载 10 fF 时 50 ps；0.1 ns、20 fF 时 80 ps；0.2 ns、10 fF 时 60 ps；0.2 ns、20 fF 时 92 ps。求输入转换时间 0.15 ns、负载 15 fF 时的延迟。
          reveal:
            - title: 第 1 步：先沿负载方向插值
              body: 0.1 ns 那一行在 15 fF 处取 50 和 80 的中点 65 ps；0.2 ns 那一行取 60 和 92 的中点 76 ps。
            - title: 第 2 步：再沿转换时间方向插值
              body: 0.15 ns 在 0.1 和 0.2 正中间，取 65 和 76 的中点 70.5 ps。
            - title: 第 3 步：这叫什么
              body: 先在一个方向、再在另一个方向做线性插值，叫双线性插值。先沿哪个方向做，结果都一样。
      - item:
          id: nldm-interp
          type: number
          prompt: 某个门的延迟表：输入转换时间 0.1 ns、负载 10 fF 时 50 ps；0.1 ns、20 fF 时 80 ps；0.2 ns、10 fF 时 60 ps；0.2 ns、20 fF 时 92 ps。输入转换时间 0.2 ns、负载 14 fF 时，按线性插值延迟是多少皮秒？
          answer: 72.8
          tolerance: 0.05
          unit: ps
          hint: 0.2 ns 正好是表里的一行，只要沿哪个方向插值？
          explain: 在 0.2 ns 这一行，14 fF 在 10 和 20 之间的 40% 处：$60 + 0.4\times(92 - 60) = 72.8$ ps。
      - item:
          id: spice-energy
          type: number
          prompt: 用 SPICE 仿真一个电路，电源 1.8 V，在一段 10 ns 的时间里电源电流的平均值是 50 μA。这段时间电源送出了多少皮焦的能量？
          answer: 0.9
          tolerance: 0.001
          unit: pJ
          hint: 能量是电源电压乘以电流对时间的积分，平均电流乘时长等于什么？
          explain: $E = V_{DD}\int i\,dt = 1.8\times50\ \text{μA}\times10\ \text{ns} = 0.9$ pJ。仿真里量能量和功耗，就是对电源电流积分再乘电源电压。
      - item:
          id: corner-why
          type: choice
          prompt: 为什么单元表征要在“慢工艺、低电压、高温”这样的工艺角下也测一遍？
          options:
            - text: 最坏条件下也要满足时序
              correct: true
            - text: 为了找出单元在什么条件下最省电
              why: 慢角主要用来检查建立时间；功耗和保持时间另看快角等其他角
            - text: 慢角下测出的延迟最准确，最有代表性
              why: 每个角下测的都一样准，区别是代表不同的工作条件，签核时要每个角都满足
          explain: 同一个设计流片后，有的芯片快、有的慢，电压和温度也会变。时序分析要在最慢的角下检查建立时间、在最快的角下检查保持时间，都满足才能保证每颗芯片都能工作。
  - id: power-components
    chapter: 时序/功耗/面积
    title: 功耗从哪里来
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个门的输出平均每 8 个时钟周期才从 0 变到 1 一次。和每个周期都翻转的时钟线相比，同样的负载电容，它的动态功耗大约是多少？
          options:
            - text: 约八分之一
              correct: true
            - text: 一样，动态功耗只看时钟频率
              why: 动态功耗来自给电容充电，只有输出真的从 0 变到 1 时电源才送出电荷，不翻转就不耗这部分能量
            - text: 约一半，因为输出不是 0 就是 1
              why: 关键是每秒从 0 变到 1 的次数，不是输出处于 1 的时间比例
          explain: 每次 0 到 1 的翻转从电源取 $C_LV_{DD}^2$ 的能量。翻转次数只有时钟的八分之一，动态功耗也约是八分之一。
      - card:
          title: 功耗的三个组成部分
          body: |
            CMOS 电路的功耗分三部分。**开关功耗（switching power）**：给负载电容充放电，每次输出从 0 变到 1，电源送出 $C_LV_{DD}^2$ 的能量。**短路功耗（short-circuit power）**：输入翻转的过程中，上拉和下拉有一小段时间同时导通，电源直接流到地。**漏电功耗（leakage power）**：管子关断时仍有很小的电流，$P = I_{leak}V_{DD}$，不翻转也一直在耗。

            输入和输出的转换时间相近时，短路功耗通常不到总功耗的一成；工艺越先进，漏电所占比例越大。
      - card:
          title: 活动因子
          body: |
            动态功耗 $P = C_LV_{DD}^2f$ 里，$f$ 是每秒充放电的来回数。电路里大多数节点并不是每个时钟周期都翻转，于是把它写成

            $$P_{sw} = \alpha\,C_LV_{DD}^2f_{clk}$$

            $f_{clk}$ 是时钟频率，$\alpha$ 是**活动因子（activity factor）**：平均每个时钟周期里，这个节点从 0 变到 1 的次数。时钟线每个周期翻转一个来回，$\alpha = 1$；输入随机时，一个门的 $\alpha$ 等于“这一周期是 0”乘“下一周期是 1”的概率。
      - item:
          id: pdyn-exercise
          type: number
          prompt: 一块芯片的等效开关电容 $C = 1$ nF，电源 1.0 V，时钟 1 GHz，活动因子 $\alpha = 0.1$。开关功耗是多少瓦？
          answer: 0.1
          tolerance: 0.0001
          unit: W
          hint: 四个量怎样相乘？
          explain: $P = 0.1\times10^{-9}\times1.0^2\times10^9 = 0.1$ W。
      - item:
          id: pdyn-08v
          type: number
          prompt: 一块芯片的等效开关电容 $C = 1$ nF，活动因子 $\alpha = 0.1$，时钟 1 GHz。电源从 1.0 V 降到 0.8 V，频率不变，开关功耗降低了百分之几？
          answer: 36
          tolerance: 0.01
          unit: '%'
          hint: 功耗和电压是几次方关系？
          explain: 功耗正比于 $V^2$，变为 $0.8^2 = 0.64$ 倍，即 0.064 W，降低 36%。
      - card:
          title: 例题：或非门的活动因子
          body: 两输入或非门，两个输入都是随机的（每个周期为 0、为 1 各一半，前后互不相关）。求输出的活动因子。
          reveal:
            - title: 第 1 步：输出为 1 的概率
              body: 只有两个输入都是 0 时输出才是 1，概率 $\tfrac12\times\tfrac12 = \tfrac14$；输出为 0 的概率是 $\tfrac34$。
            - title: 第 2 步：从 0 变到 1 的概率
              body: 这一周期是 0、下一周期是 1：$\tfrac34\times\tfrac14 = \tfrac{3}{16}$。
            - title: 第 3 步：和时钟比
              body: $\alpha = 3/16 \approx 0.19$。同样的负载，它的开关功耗只有时钟线的约五分之一。
      - item:
          id: nand3-alpha
          type: number
          prompt: 三输入与非门，三个输入都是随机的（每个周期为 0、为 1 各一半，前后互不相关）。输出的活动因子是多少？
          answer: 0.109
          tolerance: 0.001
          hint: 输出为 0 的概率是多少？
          explain: 只有三个输入全是 1 时输出为 0，概率 $1/8$；输出为 1 的概率 $7/8$。$\alpha = \tfrac18\times\tfrac78 = \tfrac{7}{64} = 0.109$。
      - item:
          id: leak-power
          type: number
          prompt: 一块芯片待机时时钟全部停住，电源 1.0 V，测得电源电流 50 mA。它的漏电功耗是多少毫瓦？
          answer: 50
          tolerance: 0.01
          unit: mW
          hint: 时钟停住后还剩哪一种功耗？
          explain: 不翻转就没有开关功耗和短路功耗，剩下的是漏电：$P = 1.0\times50\ \text{mA} = 50$ mW。
      - item:
          id: dvfs-why
          type: choice
          prompt: 动态电压频率调节（DVFS）在负载轻时把电源电压降低。为什么降电压时通常还要同时降低时钟频率？
          options:
            - text: 电路变慢，原来的频率满足不了时序
              correct: true
            - text: 降频是为了让功耗再降一点，和时序无关
              why: 降频确实也省功耗，但更根本的原因是电压低了电路变慢，不降频就会有路径来不及在一个周期里算完
            - text: 电压低了，时钟发生器只能输出较低的频率
              why: 时钟频率由时钟产生电路决定，可以独立设置；问题出在逻辑电路变慢
          explain: 电压降低，过驱动电压变小，等效电阻变大，关键路径变长。频率不跟着降，数据就来不及在时钟沿之前到达。
  - id: dynamic-power-reduction
    chapter: 时序/功耗/面积
    title: 减少翻转来省电
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个逻辑门的两个输入一个早到、一个晚到，最终输出不变。在这段时间里输出会怎样？
          options:
            - text: 可能先变一下再变回来，白白翻转两次
              correct: true
            - text: 一直保持不变，因为最终结果不变
              why: 早到的输入先让门算出一个中间结果，晚到的输入再把它改回来，中间那一下真的翻转了
            - text: 门会停下来等两个输入都到齐
              why: 静态 CMOS 门没有“等待”的机制，输入一变就开始改变输出
          explain: 输入到达的时间不同，门会先按部分新输入算出一个错误的中间值，再改回来。这种多余的翻转叫毛刺，它和正常翻转一样耗电。
      - card:
          title: 毛刺和路径平衡
          body: |
            信号经过级数不同的路径到达同一个门，门的输出可能在最终值稳定之前来回翻转几次，这种多余的翻转叫**毛刺（glitch）**。级数很深的电路，比如串成一长链的异或门或者阵列乘法器，毛刺可能占翻转的很大一部分。

            办法是让到达同一个门的各路信号延迟接近：例如把四个数相加做成 $(A + B) + (C + D)$ 的树，而不是 $((A + B) + C) + D$ 的链，各路延迟更均衡，毛刺更少，关键路径也更短。
      - item:
          id: tree-vs-chain
          type: choice
          prompt: 八个数做异或得到奇偶校验位。做成一串七个异或门首尾相接，或做成三层的树。为什么树形结构通常更省电？
          options:
            - text: 各路信号到得早晚接近，毛刺少
              correct: true
            - text: 树形结构用的异或门比链少一半
              why: 两种做法都是七个两输入异或门；差别在各路信号到达的早晚
            - text: 树形结构可以用更低的电源电压
              why: 电源电压和结构无关；省电来自更少的多余翻转
          explain: 一串门里，后面的门一个输入早就稳定、另一个要等很多级，输出会跟着前面的变化来回翻。树形结构每层的输入同时到达，毛刺少，级数也从 7 降到 3。
      - card:
          title: 门控时钟
          body: |
            时钟线每个周期都翻转，又连着成千上万个寄存器，是芯片里最耗电的网络之一。一组寄存器在某些周期不需要更新时，可以干脆不给它送时钟，这叫**门控时钟（clock gating）**。

            直接用与门把时钟和使能信号相与，使能在时钟为高时变化会切出毛刺。标准单元库里有专门的门控时钟单元：一个锁存器在时钟为低时锁住使能，再和时钟相与，保证送出去的时钟脉冲完整。
      - item:
          id: clock-gating-save
          type: number
          prompt: 一组寄存器的时钟负载 2 pF，电源 1.0 V，时钟 500 MHz。加了门控时钟以后，只有 20% 的周期送时钟。时钟网络这一部分省下多少毫瓦？
          answer: 0.8
          tolerance: 0.001
          unit: mW
          hint: 时钟线的活动因子是多少？不送时钟的周期占几成？
          explain: 不门控时 $P = 1\times2\ \text{pF}\times1.0^2\times500\ \text{MHz} = 1$ mW。只在 20% 的周期送时钟，剩下 0.2 mW，省下 0.8 mW。
      - card:
          title: 编码和其他办法
          body: |
            按顺序变化的计数器，或者按顺序读存储器时送出的位置编号，用二进制时每次可能好几位一起变（从 0111 到 1000 四位全变），用**格雷码（Gray code）**每次只有一位变。这类连到远处、负载大的总线，换成格雷码能明显减少翻转。

            其他常见办法：输入没用时把运算单元的输入锁住不让它乱翻（操作数隔离），把不在关键路径上的模块放到更低的电源电压上，以及从算法和结构上减少运算次数。
      - card:
          title: 例题：数一数翻转次数
          body: 一个 3 位计数器从 0 数到 7 再回到 0。分别用二进制和格雷码，一圈下来总共有多少位翻转？
          reveal:
            - title: 第 1 步：二进制
              body: 000→001→010→011→100→101→110→111→000，每步翻转的位数依次是 1、2、1、3、1、2、1、3，合计 14。
            - title: 第 2 步：格雷码
              body: 000→001→011→010→110→111→101→100→000，每步只变一位，8 步合计 8。
            - title: 第 3 步：比较
              body: 格雷码的翻转次数是二进制的 $8/14 \approx 57\%$。位数越多差得越多。
      - item:
          id: binary-flips-4
          type: number
          prompt: 一个 4 位二进制计数器从 0 数到 15，再回到 0，一圈下来总共有多少位翻转？
          answer: 30
          hint: 最低位每步都翻，次低位每两步翻一次……每一位一圈翻几次？
          explain: 最低位翻 16 次，第 1 位 8 次，第 2 位 4 次，第 3 位 2 次，合计 30。同样一圈，格雷码只翻 16 次。
      - item:
          id: gating-glitch
          type: choice
          prompt: 为什么门控时钟不直接用一个与门把时钟和使能信号相与？
          options:
            - text: 使能在时钟为高时变化，会切出半截的时钟脉冲
              correct: true
            - text: 与门太慢，时钟会晚到
              why: 与门的延迟能在时钟树里补偿；真正的问题是使能在时钟为高期间变化会产生残缺的脉冲
            - text: 与门不能驱动寄存器
              why: 驱动能力可以用缓冲器补；问题出在输出波形可能有毛刺
          explain: 时钟为高时使能从 1 变 0，与门输出会提前结束，寄存器看到一个很窄的脉冲，可能误动作。门控时钟单元先用锁存器在时钟为低时锁住使能，就不会出现这种情况。
  - id: leakage-power
    chapter: 时序/功耗/面积
    title: 漏电功耗
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 手机待机时屏幕关着、处理器几乎不干活，电池还是会慢慢掉电。芯片里一个不翻转的 CMOS 门为什么还耗电？
          options:
            - text: 关断的晶体管仍有很小的电流流过
              correct: true
            - text: 不翻转的门完全不耗电，掉电全是别的部件
              why: 静态 CMOS 门在理想情况下不耗电，可真实的晶体管关断时仍有漏电流，上亿个管子加起来不小
            - text: 门的输出电容一直在充电
              why: 电容充满以后就没有充电电流了；持续的电流来自关断的管子漏电
          explain: 关断的晶体管不是理想开关，源漏之间、栅极和沟道之间都有微小电流。芯片里有几十亿个管子，加起来就是可观的待机功耗。
      - card:
          title: 漏电从哪里来
          body: |
            亚阈值漏电：栅压低于阈值时沟道没有完全关死，电流按 $I \approx I_0\cdot10^{(V_{GS} - V_{th})/S}$ 随栅压指数变化，$S$ 是亚阈值斜率（室温下理论上最小约 60 mV/dec，实际 80–100 mV/dec）。阈值越低、温度越高，漏电越大。

            **栅极漏电（gate leakage）**：栅氧化层薄到几个原子层时，电子会直接穿过它。改用介电常数更高的材料（高 k 介质），可以在电容不变的情况下把绝缘层做厚。此外还有 PN 结的反向漏电。
      - item:
          id: vt-raise-leak
          type: number
          prompt: 某工艺亚阈值斜率 $S = 85$ mV/dec。把阈值电压提高 0.1 V，亚阈值漏电流降为原来的几分之一？（填分母）
          answer: 15
          tolerance: 0.05
          hint: 0.1 V 相当于几个 85 mV？每一个让电流变几倍？
          explain: $10^{100/85} = 10^{1.18} = 15.0$，漏电降为原来的约 1/15。理论上最陡的 60 mV/dec 时是 46 倍，实际工艺只有十几倍。代价是过驱动电压变小，门变慢。
      - card:
          title: 堆叠效应和多阈值
          body: |
            两个关断的 NMOS 串联时，中间节点的电压会升到几十毫伏以上：上面那个管子的栅源电压变成负的，源极抬高还带来背栅效应，阈值变大，两者都让漏电大减。所以两个串联的关断管漏电比一个小得多，叫**堆叠效应（stack effect）**。

            标准单元库常提供几种阈值电压的同一种门。综合时先全部用高阈值的低漏电单元，只在不满足时序的路径上换成低阈值的快单元，这叫多阈值设计。
      - item:
          id: stack-which
          type: choice
          prompt: 一个两输入与非门的下拉网络是两个串联的 NMOS。输入为下面哪种情况时，经下拉网络的漏电最小？
          options:
            - text: A = 0、B = 0，两个 NMOS 都关断
              correct: true
            - text: A = 1、B = 0，只有一个 NMOS 关断
              why: 只有一个关断管时没有堆叠效应，它的漏电比两个都关断时大
            - text: A = 1、B = 1，两个 NMOS 都导通
              why: 两个都导通时输出被拉低，这时漏电走的是上拉网络里关断的 PMOS，经下拉网络的不是漏电而是导通
          explain: 两个都关断时中间节点升高，上面那个管子的栅源电压为负、阈值又因背栅效应升高，漏电大大减小。电路待机时，有的设计专门把输入置成让关断管串联最多的状态。
      - card:
          title: 电源门控
          body: |
            一个模块长时间不用，可以把它的电源整个断开。办法是在模块和电源线之间串一个高阈值的大晶体管，工作时导通、休眠时关断，这叫**电源门控（power gating）**，那个管子叫休眠管。接在电源一侧用 PMOS，接在地一侧用 NMOS。

            断电后模块里寄存器的值会丢，要保留的状态先存到不断电的保持寄存器里。重新上电要时间，上电瞬间的大电流还会冲击电源网络，所以只用在休眠时间够长的模块上。
      - item:
          id: power-gating-avg
          type: number
          prompt: 一个模块工作时漏电功耗 10 mW，90% 的时间空闲。加电源门控后，空闲时漏电只剩原来的 5%。整体平均漏电功耗是多少毫瓦？
          answer: 1.45
          tolerance: 0.001
          unit: mW
          hint: 工作时间和空闲时间各占多少，各自的漏电是多少？
          explain: 工作的 10% 时间漏电 10 mW，空闲的 90% 时间漏电 $10\times5\% = 0.5$ mW。平均 $0.1\times10 + 0.9\times0.5 = 1.45$ mW，比不门控的 10 mW 低得多。
      - item:
          id: gating-cost
          type: choice
          prompt: 电源门控能省掉空闲模块的漏电。为什么不把每一个空闲几微秒的小模块都做电源门控？
          options:
            - text: 断电再上电要时间和能量，不划算
              correct: true
            - text: 空闲模块的漏电本来就小，加休眠管省不下多少
              why: 先进工艺里漏电占总功耗的比例不小，空闲模块的漏电正是电源门控要省的；问题出在空闲时间太短
            - text: 电源门控只能用在整块芯片上
              why: 电源门控可以按模块分区做，现代芯片里常有几十个可以单独断电的区域
          explain: 每次断电再上电都要花时间恢复状态，给模块的电容重新充电也要耗能量。只有空闲时间长到省下的漏电超过这些开销，电源门控才划算。
  - id: logical-effort
    chapter: 时序/功耗/面积
    title: 逻辑努力
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个最小尺寸的反相器要驱动一个比它的输入电容大 64 倍的负载。直接驱动，还是中间插几级逐渐变大的反相器？
          options:
            - text: 插几级逐渐变大的反相器更快
              correct: true
            - text: 直接驱动最快，多一级就多一级延迟
              why: 小反相器直接驱动 64 倍的负载，充电电流太小，延迟是负载比的 64 倍；分几级每级只放大几倍，总延迟小得多
            - text: 两种一样快，总负载没变
              why: 延迟取决于每一级驱动的负载和自己大小的比值；分级后每一级的比值都小，加起来更快
          explain: 每一级的延迟和“负载电容除以自己的输入电容”成正比。分三级、每级放大 4 倍，总延迟远小于一级放大 64 倍。
      - card:
          title: 一个门的延迟模型
          body: |
            把延迟用一个反相器的单位延迟 $\tau$ 来量，一个门的延迟写成

            $$d = gh + p$$

            $h = C_{out}/C_{in}$ 是**电气努力（electrical effort）**：负载电容是这个门输入电容的几倍。$g$ 是**逻辑努力（logical effort）**：要输出和反相器一样的电流，这个门的输入电容是反相器的几倍。$p$ 是**寄生延迟（parasitic delay）**：门自己的输出电容带来的延迟，反相器约为 1。
      - card:
          title: 常见门的逻辑努力
          body: |
            取 PMOS 宽是 NMOS 两倍时上下拉一样强，参考反相器 NMOS 宽 1、PMOS 宽 2，输入电容 3。

            二输入与非门：两个 NMOS 串联，各宽 2；两个 PMOS 并联，各宽 2。一个输入接一个 NMOS 和一个 PMOS，电容 4，$g = 4/3$。二输入或非门：NMOS 各宽 1，PMOS 串联各宽 4，$g = 5/3$。一般地，$n$ 输入与非门 $g = (n + 2)/3$，或非门 $g = (2n + 1)/3$；两者的寄生延迟都约为 $n$。或非门的逻辑努力比与非门大，这是电路里多用与非门的原因。
      - item:
          id: nand2-delay
          type: number
          prompt: 一个二输入与非门（逻辑努力 $g = 4/3$，寄生延迟 $p = 2$）驱动的负载电容是它自己输入电容的 3 倍。按 $d = gh + p$，它的延迟是多少个 $\tau$？
          answer: 6
          tolerance: 0.001
          hint: 二输入与非门的 $g$ 和 $p$ 各是多少？
          explain: $g = 4/3$、$h = 3$、$p = 2$，$d = 4/3\times3 + 2 = 6\tau$。
      - item:
          id: nor3-g
          type: number
          prompt: 参考反相器 NMOS 宽 1、PMOS 宽 2。三输入或非门要和反相器一样强，每个输入的电容是反相器的几倍（逻辑努力 $g$）？
          answer: 2.333
          tolerance: 0.002
          hint: 三个 PMOS 串联，每个要多宽？NMOS 并联要多宽？
          explain: PMOS 串联 3 个，各宽 $2\times3 = 6$；NMOS 并联，各宽 1。一个输入的电容 $6 + 1 = 7$，反相器是 3，$g = 7/3 = 2.333$。
      - card:
          title: 一条路径怎样定尺寸最快
          body: |
            一条 $N$ 级的路径，把各级的逻辑努力乘起来得 $G$，把整条路径的负载和第一级输入电容之比记为 $H$，**路径努力（path effort）** $F = GH$（中途一个门同时驱动几路负载时，还要乘上分出去的倍数）。

            可以证明，各级的 $gh$ 相等时总延迟最小，每级努力 $f = F^{1/N}$，最小延迟

            $$D = NF^{1/N} + P$$

            $P$ 是各级寄生延迟之和。级数也可以选：每级努力在 4 左右时最快，所以级数约为 $\log_4F$。
      - card:
          title: 例题：与非、或非、反相器三级
          body: 一条路径依次是二输入与非门、二输入或非门、反相器，最后的负载是第一级输入电容的 12 倍。求最小延迟和各级的输入电容。
          reveal:
            - title: 第 1 步：路径努力
              body: $G = \tfrac43\times\tfrac53\times1 = \tfrac{20}{9}$，$H = 12$，$F = GH = 26.7$。
            - title: 第 2 步：每级努力和延迟
              body: $f = 26.7^{1/3} = 2.99$，$P = 2 + 2 + 1 = 5$，$D = 3\times2.99 + 5 = 14.0\tau$。
            - title: 第 3 步：从后往前定尺寸
              body: 每级输入电容 $= g\times$ 输出电容 $/f$。以第一级输入电容为 1，负载为 12：反相器 $12/2.99 = 4.02$，或非门 $\tfrac53\times4.02/2.99 = 2.24$，与非门 $\tfrac43\times2.24/2.99 = 1.00$，回到了 1，说明算得对。
      - item:
          id: inv-chain-64
          type: number
          prompt: 用 3 级反相器驱动一个是第一级输入电容 64 倍的负载，各级努力相等。最小延迟是多少个 $\tau$？（反相器 $g = 1$、$p = 1$）
          answer: 15
          tolerance: 0.001
          hint: 路径努力是多少？三级每级分到多少？
          explain: $F = 64$，$f = 64^{1/3} = 4$，$D = 3\times4 + 3 = 15\tau$。如果只用一级，$D = 64 + 1 = 65\tau$。
      - item:
          id: stages-choice
          type: choice
          prompt: 用反相器链驱动一个是第一级输入电容 64 倍的负载（反相器 $g = 1$、$p = 1$），3 级时最小延迟是 15τ。改用 4 级、各级努力相等，最小延迟会怎样？
          options:
            - text: 略大于 15τ，4 级时每级努力约 2.8，偏离了 4 左右的最佳值
              correct: true
            - text: 小于 15τ，级数越多越快
              why: 多一级就多一份寄生延迟；4 级时 $D = 4\times64^{1/4} + 4 = 15.3\tau$，反而略慢
            - text: 正好 15τ，级数不影响
              why: 级数决定每级努力和寄生延迟之和，4 级算出来是 15.3τ
          explain: $64^{1/4} = 2.83$，$D = 4\times2.83 + 4 = 15.3\tau$，比 3 级的 15τ 略大。$\log_464 = 3$，3 级正好是最佳级数。
  - id: interconnect
    chapter: 时序/功耗/面积
    title: 连线的电容、电阻和延迟
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 芯片上一条连线加长一倍，宽度和别的都不变。它本身造成的 RC 延迟大约怎样变？
          options:
            - text: 变成约 4 倍
              correct: true
            - text: 变成约 2 倍
              why: 长度加倍，电阻和电容各自加倍，延迟和两者的乘积成正比，是 4 倍
            - text: 不变，信号以光速传播
              why: 芯片上的长连线电阻不小，信号要给沿途的电容充电，延迟由 RC 决定，远慢于光速
          explain: 连线的电阻和电容都和线长成正比，RC 乘积和线长的平方成正比。所以长连线要分段、中间插缓冲器。
      - card:
          title: 连线电容
          body: |
            连线和下面的衬底（或下层金属）之间像一个平板电容：$C_{pp} = \varepsilon\dfrac{WL}{t}$，$W$ 是线宽、$L$ 是线长、$t$ 是介质厚度。线越窄，从线的两个侧边伸出去的电场线占的比例越大，这部分叫边缘电容，和线长成正比、几乎和线宽无关。于是常用

            $$C_{wire} = c_{area}WL + 2c_{fringe}L$$

            $c_{area}$ 是单位面积电容，$c_{fringe}$ 是每条边在每单位线长上的边缘电容。旁边还有别的线时，线与线之间还有耦合电容。
      - item:
          id: wire-cap
          type: number
          prompt: 某层金属单位面积电容 30 aF/μm²，每条边的边缘电容 40 aF/μm。一条宽 1 μm、长 500 μm 的线，对地电容是多少飞法？（1 fF = 1000 aF）
          answer: 55
          tolerance: 0.01
          unit: fF
          hint: 平板部分和两条边的边缘部分各是多少？
          explain: 平板 $30\times1\times500 = 15\,000$ aF，边缘 $2\times40\times500 = 40\,000$ aF，合计 55 fF。线不宽时，边缘电容比平板部分还大。
      - card:
          title: 连线电阻和 Elmore 延迟
          body: |
            线的电阻 $R = \rho\dfrac{L}{WH}$，同一层金属厚度 $H$ 固定，常写成 $R = R_\square\dfrac{L}{W}$，$R_\square$ 叫方块电阻，$L/W$ 是这条线有多少个“方块”。

            信号经过一串电阻、沿途挂着电容时，常用 **Elmore 延迟（Elmore delay）**估算：对每个电容，把它到源端路径上的电阻加起来再乘它；或等价地，每段电阻乘它下游的全部电容，再全部相加：$\tau = \sum_i R_iC_{\text{下游},i}$。
      - item:
          id: elmore-two
          type: number
          prompt: 信号源经电阻 100 Ω 接到节点 1（电容 10 fF），节点 1 再经 200 Ω 接到节点 2（电容 20 fF）。节点 2 的 Elmore 时间常数是多少皮秒？
          answer: 7
          tolerance: 0.001
          unit: ps
          hint: 100 Ω 下游有哪些电容？200 Ω 下游呢？
          explain: $100\times(10 + 20)\ \text{fF} + 200\times20\ \text{fF} = 3 + 4 = 7$ ps。
      - card:
          title: 例题：一条 1 mm 的连线
          body: 金属方块电阻 0.08 Ω/□，线宽 0.2 μm，长 1 mm，每微米电容 0.2 fF。求它的电阻、电容和延迟。
          reveal:
            - title: 第 1 步：电阻和电容
              body: 方块数 $1000/0.2 = 5000$，$R = 0.08\times5000 = 400$ Ω；$C = 0.2\times1000 = 200$ fF。
            - title: 第 2 步：分布式 RC 的延迟
              body: 电阻和电容沿线均匀分布，用 Elmore 方法把线切成很多小段再求和，时间常数趋于 $RC/2$；到 50% 的延迟约为 $0.38RC = 0.38\times400\times200\ \text{fF} = 30.4$ ps。
            - title: 第 3 步：和集中在两头的模型比
              body: 如果把全部电阻放在一头、全部电容放在另一头，算出的是 $0.69RC = 55.2$ ps，把延迟高估了将近一倍。线长到 5 mm，延迟是 $25\times30.4 = 760$ ps。
      - item:
          id: tg-chain
          type: number
          prompt: 4 个传输门串联，每个导通时的等效电阻 10 kΩ，每个传输门输出端的节点电容 5 fF。最后一个节点的 Elmore 时间常数是多少皮秒？
          answer: 500
          tolerance: 0.1
          unit: ps
          hint: 第 $k$ 个电容到源端经过几个电阻？
          explain: 第 $k$ 个节点的电容前面有 $k$ 个电阻，$\tau = RC(1 + 2 + 3 + 4) = 10\ \text{kΩ}\times5\ \text{fF}\times10 = 500$ ps。$n$ 个串联时是 $RC\,n(n + 1)/2$，随级数平方增长，所以传输门链每隔几级要插缓冲器。
      - item:
          id: wire-scaling
          type: choice
          prompt: 工艺缩小时，晶体管变快了，同样长（比如跨越整块芯片）的连线延迟往往反而变长。主要原因是什么？
          options:
            - text: 单位长度电阻变大，电容变化不大
              correct: true
            - text: 晶体管变快以后，驱动不了长线的大电容
              why: 晶体管更快意味着驱动更强；问题出在线本身的 RC 变大
            - text: 连线变短了，所以要绕路
              why: 跨越整块芯片的距离并没有随工艺缩小，线宽和厚度却缩小了
          explain: 电阻 $\propto L/(WH)$，$W$、$H$ 都缩小，每单位线长的电阻按平方增大；电容主要取决于线和周围的几何比例，变化不大。长线的 RC 因此变大，现代芯片要靠插缓冲器和粗的顶层金属来走长线。
  - id: buffer-chains
    chapter: 时序/功耗/面积
    title: 驱动大负载和低摆幅驱动
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 芯片的输出引脚要驱动 2 pF 的负载，而内部一个最小反相器的输入电容只有 2 fF。中间大约要插几级反相器？
          options:
            - text: 五级左右
              correct: true
            - text: 一级，用一个超大的反相器
              why: 超大的反相器输入电容也很大，前一级小反相器驱动它同样很慢；要一级一级逐渐放大
            - text: 一千级，每级放大一点点
              why: 级数太多，每一级自己的寄生延迟加起来反而更慢
          explain: 负载是输入的 1000 倍，每级放大约 4 倍时，$4^5 = 1024$，五级左右最快。
      - card:
          title: 缓冲器链
          body: |
            驱动大负载用一串逐级变大的反相器，叫**缓冲器链（buffer chain）**。用逻辑努力来算：全是反相器，$G = 1$，$F = H = C_L/C_{in}$。$N$ 级时每级放大 $f = F^{1/N}$ 倍，总延迟 $D = Nf + N$（每个反相器的寄生延迟按 1 算）。

            不计寄生延迟时，最佳的每级放大倍数是 $e \approx 2.7$；计入寄生延迟，最佳值升到约 3.6，实际设计常取 4 左右，在这附近延迟变化很平缓。
      - item:
          id: buffer-stages
          type: number
          prompt: 一个反相器链要驱动是第一级输入电容 4096 倍的负载，每级放大 4 倍。要几级？
          answer: 6
          hint: 每级放大 4 倍，$N$ 级一共放大多少倍？
          explain: $4^6 = 4096$，6 级。总延迟 $D = 6\times4 + 6 = 30\tau$。
      - card:
          title: 例题：五级缓冲器
          body: 用反相器链从 2 fF 的输入电容驱动 2 pF 的负载，取 5 级。求每级的放大倍数和总延迟，并和直接用一个反相器比。
          reveal:
            - title: 第 1 步：路径努力
              body: $F = 2000/2 = 1000$。
            - title: 第 2 步：每级放大倍数
              body: $f = 1000^{1/5} = 3.98$，各级输入电容依次约 2、8、32、126、502 fF。
            - title: 第 3 步：总延迟
              body: $D = 5\times3.98 + 5 = 24.9\tau$。一个最小反相器直接驱动是 $1000 + 1 = 1001\tau$，慢 40 倍。
      - item:
          id: buffer-delay
          type: number
          prompt: 用 5 级反相器从输入电容 2 fF 驱动 2 pF 的负载，各级放大倍数相等，每个反相器寄生延迟 $p = 1$。总延迟是多少个 $\tau$？
          answer: 24.9
          tolerance: 0.05
          hint: 每级放大多少倍？
          explain: $f = 1000^{1/5} = 3.98$，$D = 5\times3.98 + 5 = 24.9\tau$。
      - card:
          title: 低摆幅驱动
          body: |
            一条又长又重的总线，每次翻转要给大电容充电，耗能 $C V_{DD}^2$。如果线上只摆动一个小电压 $V_{swing}$，再在接收端用**灵敏放大器（sense amplifier）**把小信号放大成满摆幅，耗能降到约 $C V_{DD}V_{swing}$，这叫**低摆幅驱动（low-swing signaling）**。

            代价是接收端的放大器更复杂、抗噪声能力变差，常用差分的两根线来抵消噪声。
      - item:
          id: low-swing-energy
          type: number
          prompt: 一条 1 pF 的总线，电源 1.2 V，采用 0.3 V 的低摆幅驱动，每次翻转耗能约 $CV_{DD}V_{swing}$。每次翻转耗能多少皮焦？
          answer: 0.36
          tolerance: 0.001
          unit: pJ
          hint: 三个量相乘，单位怎么换？
          explain: $1\ \text{pF}\times1.2\ \text{V}\times0.3\ \text{V} = 0.36$ pJ。满摆幅是 $1\times1.2^2 = 1.44$ pJ，低摆幅省了四分之三。
      - item:
          id: low-swing-cost
          type: choice
          prompt: 低摆幅驱动这么省电，为什么芯片里普通的门与门之间不用它？
          options:
            - text: 接收端要加放大器，噪声容限也小
              correct: true
            - text: 低摆幅只能用在差分信号上，普通门是单端的
              why: 单端的低摆幅也有，差分只是更抗噪声；真正的门槛是每个接收端都要加放大器，短线上省下的能量抵不过这份开销
            - text: 低摆幅信号传得更慢，普通的门等不起
              why: 摆幅小反而充放电更快；不普遍使用是因为接收电路复杂、抗噪声差
          explain: 短线的电容小，翻转耗能本来就不多；加灵敏放大器、处理噪声的开销在这里得不偿失。只有片上长总线、片外连线这种大电容才值得。
  - id: power-distribution
    chapter: 时序/功耗/面积
    title: 电源网络
    minutes: 13
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一块芯片工作电压 1.0 V、功耗 10 W。电源线上流的电流大约是多少？
          options:
            - text: 10 A
              correct: true
            - text: 10 mA
              why: $I = P/V = 10/1.0 = 10$ A，不是毫安
            - text: 0.1 A
              why: 那是把功率和电压相除算反了；电流是功率除以电压，10 A
          explain: $I = P/V = 10$ A。电压越低、功耗越大，电流越大。电源线上即使只有几毫欧的电阻，也会产生几十毫伏的压降。
      - card:
          title: IR 压降
          body: |
            电源从封装的引脚或凸点进入芯片，经过一层层金属网格才到达每个单元。网格有电阻，电流流过时产生压降 $\Delta V = IR$，叫 **IR 压降（IR drop）**。离电源入口越远的单元，拿到的电压越低，门就越慢，严重时会违反时序。

            办法是用最上面最厚的几层金属做成粗的网格，多放电源入口，并在签核时专门做 IR 压降分析。
      - item:
          id: ir-drop
          type: number
          prompt: 芯片某区域从电源网格取 2 A 电流，从电源入口到那里的网格电阻 20 mΩ。这段的 IR 压降是多少毫伏？
          answer: 40
          tolerance: 0.01
          unit: mV
          hint: 压降等于什么乘什么？
          explain: $\Delta V = 2\ \text{A}\times20\ \text{mΩ} = 40$ mV。电源只有 0.9 V 时，这已经是 4% 以上，会明显拖慢那里的门。
      - card:
          title: 电感上的压降和去耦电容
          body: |
            封装引脚和键合线有电感。电路突然开始大量翻转时，电流在很短时间内大幅增加，电感上产生 $L\,\dfrac{di}{dt}$ 的压降，芯片内的电源电压瞬间下陷。

            办法是在芯片内靠近电路的地方放大量电容，叫**去耦电容（decoupling capacitor）**：电流突增的头几纳秒由它就近供电，电源电压只下降 $\Delta V = I\Delta t/C$，等外面的电流慢慢跟上。标准单元行里的空隙常用去耦电容单元填满。
      - item:
          id: ldidt
          type: number
          prompt: 封装电源路径的电感 0.5 nH。电流在 1 ns 内从 0 增加到 1 A，电感上的压降约是多少伏？
          answer: 0.5
          tolerance: 0.001
          unit: V
          hint: $di/dt$ 是多少？
          explain: $L\,di/dt = 0.5\ \text{nH}\times1\ \text{A}/1\ \text{ns} = 0.5$ V。电源才 1 V 左右，这样的下陷不能接受，所以要片上去耦电容和多个并联的电源引脚。
      - card:
          title: 例题：要多少去耦电容
          body: 一个模块突然多取 1 A 电流，外面的电源要 1 ns 才跟得上。要求这期间片上电压下降不超过 50 mV，片上去耦电容至少多大？
          reveal:
            - title: 第 1 步：这段时间要补多少电荷
              body: $Q = I\Delta t = 1\ \text{A}\times1\ \text{ns} = 1$ nC。
            - title: 第 2 步：电容和压降的关系
              body: 电容放出电荷 $Q$，电压下降 $\Delta V = Q/C$。
            - title: 第 3 步：求电容
              body: $C = Q/\Delta V = 1\ \text{nC}/0.05\ \text{V} = 20$ nF。片上能做的电容有限，所以还要靠封装上的电容和多个电源引脚分担。
      - item:
          id: decap-size
          type: number
          prompt: 一个模块突然多取 0.5 A 电流，持续 2 ns 后外面的电源才跟上。要求片上电压下降不超过 30 mV，片上去耦电容至少多少纳法？
          answer: 33.3
          tolerance: 0.05
          unit: nF
          hint: 这 2 ns 里要由电容补多少电荷？
          explain: $Q = 0.5\times2 = 1$ nC，$C = 1\ \text{nC}/0.03\ \text{V} = 33.3$ nF。
      - item:
          id: ir-vs-ldi
          type: choice
          prompt: 芯片的电源电压在大量电路同时开始翻转的那一刻突然下陷，过几纳秒又回升。这主要是哪种效应？
          options:
            - text: 封装电感上的 $L\,di/dt$ 压降
              correct: true
            - text: 电源网格电阻上的 IR 压降，电流大了压降就大
              why: IR 压降跟着电流大小走，电流稳定后也一直存在；“一开始下陷、过一会回升”说明和电流的变化率有关
            - text: 芯片发热，漏电突然增加
              why: 漏电随温度慢慢变化，不会在翻转开始的瞬间突增
          explain: 电感阻碍电流变化，电流突然增大的那一刻压降最大，电流稳定后电感压降消失，只剩电阻上的 IR 压降。去耦电容就是用来顶过这一瞬间的。
  - id: clock-skew-jitter
    chapter: 时序/功耗/面积
    title: 时钟偏斜和抖动
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 两个寄存器之间有一段组合逻辑。时钟到达后一个寄存器比到达前一个晚 50 ps。这对“数据来得及在时钟沿之前站稳”是有利还是不利？
          options:
            - text: 有利，数据多出 50 ps 赶路
              correct: true
            - text: 不利，时钟不同步总是坏事
              why: 对建立时间来说，采样沿晚到等于多给了数据一点时间；坏处在保持时间那一边
            - text: 没有影响，两个寄存器用的是同一个时钟
              why: 同一个时钟源经过不同的连线和缓冲器，到达两处的时刻不同，这个差直接加减在时序裕量上
          explain: 后一个寄存器的时钟沿晚 50 ps，数据就多 50 ps 赶路，建立时间更容易满足。可同一个时钟沿之后，新数据也更可能冲掉后一个寄存器还没采稳的旧数据，对保持时间不利。
      - card:
          title: 偏斜和抖动
          body: |
            同一个时钟沿到达芯片上不同寄存器的时刻不同，差值叫**时钟偏斜（clock skew）**，记作 $\delta$：取后一个（接收数据的）寄存器的时钟到达时刻减前一个的，可正可负（说整个时钟网络的偏斜时，常指最晚减最早）。它是空间上的差，一般每个周期都一样。

            同一个位置，相邻两个时钟沿之间的间隔也不完全等于标称周期，会一周期一周期地随机变化，这叫**时钟抖动（clock jitter）**。它是时间上的变化。
      - card:
          title: 偏斜进入时序约束
          body: |
            时钟沿到达接收寄存器晚了 $\delta$，数据的时间就多了 $\delta$，建立约束变成

            $$T + \delta \ge t_{c\text-q} + t_{logic} + t_{setup}$$

            保持约束则多了一份要求：新数据要等接收寄存器那个晚到的沿过去之后再到：

            $$t_{c\text-q,cd} + t_{logic,cd} \ge t_{hold} + \delta$$

            所以 $\delta > 0$ 帮建立、害保持；$\delta < 0$ 反过来。
      - item:
          id: skew-setup
          type: number
          prompt: 寄存器 $t_{c\text-q} = 80$ ps、$t_{setup} = 40$ ps，最慢的组合逻辑 700 ps。时钟到达接收寄存器比到达发送寄存器晚 40 ps。最短时钟周期是多少皮秒？（不计抖动）
          answer: 780
          tolerance: 0.01
          unit: ps
          hint: 偏斜在建立约束里站在哪一边？
          explain: $T \ge 80 + 700 + 40 - 40 = 780$ ps。没有偏斜要 820 ps，正偏斜帮了 40 ps。
      - item:
          id: skew-hold
          type: number
          prompt: 寄存器最短的时钟到输出延迟 50 ps、保持时间 30 ps，两个寄存器之间最短的组合逻辑 40 ps。时钟到达接收寄存器比到达发送寄存器晚 70 ps。保持时间的裕量是多少皮秒？（负数表示违例）
          answer: -10
          tolerance: 0.01
          unit: ps
          hint: 新数据最早什么时候到？接收端要求它不早于什么时候？
          explain: 最早到达 $50 + 40 = 90$ ps，要求不早于 $30 + 70 = 100$ ps，裕量 $90 - 100 = -10$ ps，违例。没有偏斜时裕量是 +60 ps。
      - card:
          title: 例题：偏斜加上抖动
          body: 寄存器 $t_{c\text-q} = 80$ ps、$t_{setup} = 40$ ps，最慢逻辑 700 ps，偏斜 $\delta = +50$ ps，每个时钟沿相对标称位置最多偏 20 ps（抖动）。求最短周期。
          reveal:
            - title: 第 1 步：抖动的最坏情况
              body: 发送沿晚 20 ps、接收沿早 20 ps，这一个周期实际短了 40 ps，相当于 $T$ 里要扣掉 $2t_{jitter}$。
            - title: 第 2 步：写出约束
              body: $T + \delta - 2t_{jitter} \ge t_{c\text-q} + t_{logic} + t_{setup}$。
            - title: 第 3 步：代入
              body: $T \ge 80 + 700 + 40 - 50 + 40 = 810$ ps。保持约束检查的是同一个沿，两个寄存器看到的都是这一个沿，周期间的抖动对它影响小。
      - card:
          title: 偏斜和抖动从哪里来
          body: |
            偏斜的来源：时钟线到各处的长短不同；沿途缓冲器的晶体管因工艺偏差快慢不一；树上各路挂的负载不同；芯片各处温度不同，热的地方门更慢。

            抖动的来源：电源噪声让缓冲器的延迟一周期一周期地变；相邻信号线翻转通过耦合电容干扰时钟线；产生时钟的电路自身输出的时钟也有抖动。
      - item:
          id: jitter-source
          type: choice
          prompt: 下面哪一个主要造成时钟抖动，而不是偏斜？
          options:
            - text: 电源电压每个周期都在波动
              correct: true
            - text: 到两个寄存器的时钟线长度不同
              why: 线长不同造成的到达时刻差每个周期都一样，属于偏斜
            - text: 芯片一侧比另一侧热
              why: 温度变化很慢，造成的是两处之间几乎不变的到达时刻差，属于偏斜
          explain: 抖动是同一处的时钟沿在周期之间的随机变化。电源噪声随电路的翻转情况每周期都不一样，让缓冲器延迟忽快忽慢，造成抖动。
  - id: clock-distribution
    chapter: 时序/功耗/面积
    title: 时钟分配和自定时电路
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 时钟从芯片中心出发，要同时到达分布在整块芯片上的上万个寄存器。怎样走线最容易做到“同时”？
          options:
            - text: 对称分叉，路径一样长
              correct: true
            - text: 一根线依次串过所有寄存器
              why: 串在后面的寄存器比前面的晚很多，偏斜很大
            - text: 每个寄存器单独拉一根线到中心
              why: 上万根长线面积和功耗都不可接受，长短也各不相同
          explain: 对称分叉的树，从根到每片叶子的线长和缓冲器级数相同，偏斜自然很小。
      - card:
          title: H 树和时钟树综合
          body: |
            从芯片中心画一个“H”，四个端点各是一块区域的中心；在每块区域里再画一个小一号的 H，如此反复。从根到每个端点的路径一样长，叫 **H 树（H-tree）**。每多一层，端点数乘 4。

            真实芯片上寄存器分布不均匀，各处负载也不同，工具会按实际位置建一棵插了缓冲器的树，让各端点的延迟平衡，这一步叫**时钟树综合（clock tree synthesis, CTS）**。
      - item:
          id: htree-levels
          type: number
          prompt: 一棵 H 树每一层把每个端点分成 4 个。要得到 1024 个端点，要几层？
          answer: 5
          hint: 每多一层端点数乘 4，$N$ 层一共多少个端点？
          explain: $4^5 = 1024$，5 层。
      - card:
          title: 时钟网格
          body: |
            另一种做法是在芯片上铺一张金属网格，从许多点同时驱动，寄存器就近接到网格上，叫**时钟网格（clock grid）**。网格把各点短接在一起，局部的快慢差被拉平，偏斜很小，对工艺和温度的变化也不敏感。

            代价是网格的金属很多，电容大、耗电多，每个周期都要给它充放电。高性能处理器常用“树驱动网格”：先用树把时钟送到网格的各个驱动点，再由网格分到寄存器。
      - item:
          id: grid-cost
          type: choice
          prompt: 时钟网格偏斜小、对工艺偏差不敏感。它最主要的缺点是什么？
          options:
            - text: 时钟功耗高
              correct: true
            - text: 偏斜比 H 树大
              why: 网格把各点短接，偏斜通常比单纯的树更小
            - text: 只能用在很小的芯片上
              why: 正是大芯片、高性能处理器在用网格；问题在功耗
          explain: 时钟线每个周期都充放电，活动因子是 1，网格的大电容直接变成大功耗。所以低功耗芯片多用树，高性能芯片才肯付网格的功耗。
      - card:
          title: 锁相环和延迟锁相环
          body: |
            芯片外的晶体振荡器只有几十兆赫兹。**锁相环（PLL, phase-locked loop）**用一个压控振荡器产生高频时钟，把它分频 $N$ 倍后和外部参考时钟比相位，用误差去调振荡器，锁定后输出 $f_{out} = Nf_{ref}$，相位也对齐。

            **延迟锁相环（DLL, delay-locked loop）**没有振荡器，只用一串可调的延迟单元，把时钟延迟到和参考对齐，用来消除时钟经过缓冲器后的延迟。它不能倍频，但抖动不会像振荡器那样一个周期接一个周期地叠加。
      - item:
          id: pll-n
          type: number
          prompt: 外部参考时钟 25 MHz，要用锁相环产生 2 GHz 的片上时钟。反馈路径里的分频比 $N$ 应该是多少？
          answer: 80
          hint: 锁定时 $f_{out}$ 和 $f_{ref}$ 是什么关系？
          explain: $N = f_{out}/f_{ref} = 2000/25 = 80$。
      - card:
          title: 自定时电路
          body: |
            不用全局时钟也能做同步：每一级做完时发出“完成”信号，通过请求、应答两根线和下一级握手，下一级收到请求才开始，这叫**自定时电路（self-timed circuit）**。它按每次实际用的时间走，没有时钟偏斜问题，也不必按最坏情况定周期。

            要知道“做完了”，常用双轨编码：一位数据用两根线，一根为 1 表示“这位是 0”，另一根为 1 表示“这位是 1”，两根都是 0 表示还没算好。所有位都有一根线变成 1，就说明结果齐了。
      - item:
          id: dual-rail-wires
          type: number
          prompt: 用双轨编码传 16 位数据，数据线一共要几根？
          answer: 32
          hint: 每一位用几根线？
          explain: 每位两根，$16\times2 = 32$ 根。线翻倍是自定时电路的代价之一。
      - item:
          id: self-timed-cost
          type: choice
          prompt: 自定时电路没有时钟偏斜问题，还能按实际时间而不是最坏情况工作。为什么大多数芯片仍用同步时钟？
          options:
            - text: 完成检测和握手要额外的电路和连线，设计和验证工具也远不如同步设计成熟
              correct: true
            - text: 自定时电路比同步电路慢
              why: 它按每次实际用的时间走，平均情况下可能更快；不普及的原因是代价和工具
            - text: 自定时电路不能串成流水线
              why: 握手正好可以把各级串成异步流水线；不普及的原因是代价和工具
          explain: 双轨编码让连线加倍，完成检测和握手也占面积；静态时序分析、逻辑综合这些工具都是围绕时钟设计的。所以自定时多用在局部或特殊场合。
  - id: design-flow
    chapter: 逻辑综合与布局布线
    title: 从硬件描述到版图的流程
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 现在一块几十亿晶体管的芯片，工程师主要写的是什么？
          options:
            - text: 用硬件描述语言写的寄存器和逻辑
              correct: true
            - text: 一个个晶体管的版图，靠人手工画出来
              why: 几十亿个晶体管不可能手画；只有少数关键电路手工设计，其余由工具从描述生成
            - text: 门电路的连线图
              why: 门级网表也由工具从更高层的描述综合出来，人很少直接画
          explain: 设计者用 Verilog 等语言描述寄存器之间的逻辑，后面的综合、布局、布线都由电子设计自动化工具完成，人负责约束、检查和修改。
      - card:
          title: 电子设计自动化工具
          body: |
            设计芯片的软件叫**电子设计自动化（EDA, electronic design automation）**工具：仿真器查功能，综合工具把描述变成门，布局布线工具生成版图，时序和物理验证工具做最后检查。商用工具主要来自 Synopsys、Cadence、Siemens EDA；开源的有 Yosys（综合）、OpenROAD（布局布线）和 OpenLane（整套流程）。

            设计从**寄存器传输级（RTL, register-transfer level）**描述开始：有哪些寄存器，每个周期它们之间经过什么逻辑传数据。
      - item:
          id: rtl-meaning
          type: choice
          prompt: “寄存器传输级”描述说清楚的是什么？
          options:
            - text: 有哪些寄存器，每个时钟周期数据经过什么运算从一组寄存器传到另一组
              correct: true
            - text: 每个晶体管怎样连接
              why: 那是晶体管级网表；RTL 只描述寄存器和它们之间的逻辑功能，不涉及用什么门、什么管子实现
            - text: 芯片每一层的几何图形
              why: 几何图形是版图（GDS）；RTL 在流程的最前端，和几何无关
          explain: RTL 只管功能和时钟周期，至于用哪些标准单元、怎么摆放，留给后面的工具决定。
      - card:
          title: 从 RTL 到 GDS
          body: |
            标准单元芯片的流程：**逻辑综合（logic synthesis）**把 RTL 变成由库里的单元构成的门级网表；**布图规划（floorplanning）**定芯片尺寸、大模块和输入输出的位置、电源网络；布局把标准单元摆进行里；时钟树综合；布线连上所有信号线；**签核（signoff）**做静态时序分析、功耗和 IR 压降分析、DRC 和 LVS，全部通过后输出 GDS 交给晶圆厂，叫流片。
      - item:
          id: flow-order
          type: order
          prompt: 把标准单元芯片从逻辑综合到签核的步骤按先后排好。
          steps:
            - 逻辑综合
            - 布图规划
            - 布局
            - 时钟树综合
            - 布线
            - 签核
          explain: 先有门级网表才能规划和摆放；时钟树要在单元位置确定之后按实际位置建；布线要连的包括时钟树里新插的缓冲器；最后签核检查一切都满足才流片。
      - item:
          id: die-area
          type: number
          prompt: 布图规划时核心区定为 2 mm × 1.5 mm，四周各留 0.25 mm 放输入输出单元和电源环。整块芯片面积是多少平方毫米？
          answer: 5
          tolerance: 0.001
          unit: mm²
          hint: 四周各留 0.25 mm，长和宽各加多少？
          explain: 长 $2 + 2\times0.25 = 2.5$ mm，宽 $1.5 + 2\times0.25 = 2$ mm，面积 $5\ \text{mm}^2$。
      - card:
          title: FPGA 厂商在 EDA 里的角色
          body: |
            给 FPGA 用的流程类似：综合把 RTL 变成 FPGA 里的查找表（存着真值表的小存储器）和触发器，再在芯片上固定的资源里布局布线，最后生成配置文件（比特流）下载进去。

            FPGA 芯片内部的结构和连线资源由厂商定义、不公开全部细节，所以布局布线和生成比特流的工具只能由厂商自己提供，比如 AMD（原 Xilinx）的 Vivado、Intel（Altera）的 Quartus。综合这一步可以用第三方工具，后面几步离不开厂商。
      - item:
          id: fpga-vendor
          type: choice
          prompt: 为什么 FPGA 的布局布线工具基本都由 FPGA 厂商自己提供？
          options:
            - text: 布局布线要知道芯片内部资源和连线的全部细节，这些只有厂商掌握
              correct: true
            - text: 厂商的工具免费，第三方的工具要收费
              why: 价格不是原因；第三方即使愿意做，也拿不到芯片内部结构和比特流格式
            - text: FPGA 不需要布局布线
              why: FPGA 同样要把逻辑放到具体的查找表上、选好连线开关，只是资源是固定的
          explain: 布局布线要把逻辑落到具体的查找表和连线开关上，再编成比特流。这些结构和格式由厂商掌握，所以这几步的工具只能来自厂商。
      - item:
          id: cts-step
          type: choice
          prompt: 哪一步专门负责插入缓冲器、让时钟到达各寄存器的时刻尽量一致？
          options:
            - text: 时钟树综合
              correct: true
            - text: 逻辑综合，生成网表时就插好
              why: 逻辑综合时还不知道寄存器摆在哪里，没法平衡时钟线的长短
            - text: 签核，最后统一调整时钟
              why: 签核只检查偏斜是否满足，不负责建时钟树
          explain: 时钟树综合在布局之后进行，按寄存器的实际位置建一棵插了缓冲器的树，控制偏斜和延迟。
  - id: synthesis-mapping
    chapter: 逻辑综合与布局布线
    title: 逻辑综合、工艺映射和打包
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 设计者写了 $Y = AB + AC$。综合工具通常会把它实现成什么？
          options:
            - text: $A(B + C)$
              correct: true
            - text: 原样做两个与门加一个或门
              why: 提出公因子 $A$ 后少用一个门；综合工具会自动做这种化简
            - text: 一个三输入与门
              why: $ABC$ 是三者都为 1，和 $AB + AC$ 不同：$A = 1$、$B = 1$、$C = 0$ 时 $AB + AC = 1$，$ABC = 0$
          explain: 提出公因子 $A$ 得 $A(B + C)$，门更少、面积更小。逻辑综合的一部分工作就是这样化简布尔式。
      - card:
          title: 两级和多级的逻辑优化
          body: |
            逻辑综合先把 RTL 翻译成布尔逻辑网络，再化简。两级逻辑（与或式）的化简就是卡诺图做的事，变量多时用 Quine–McCluskey 方法或启发式的 Espresso。

            实际电路是多级的：提取公因子（$AB + AC = A(B + C)$）、找出几个式子共用的子式只算一次、利用不会出现的输入组合（无关项）。衡量大小常数**字面量（literal）**：变量（含取反的变量）在式子里出现的次数，$AB + AC$ 有 4 个，$A(B + C)$ 有 3 个。
      - item:
          id: literal-count
          type: number
          prompt: $Y = AB + AC + AD$ 提出公因子以后，字面量（变量在式子里出现的次数）有几个？
          answer: 4
          hint: 公因子是谁？提出来以后括号里剩什么？
          explain: $Y = A(B + C + D)$，字面量 $A$、$B$、$C$、$D$ 各一次，共 4 个；原式有 6 个。
      - card:
          title: 工艺映射
          body: |
            化简后的逻辑要用单元库里的门来实现，叫**工艺映射（technology mapping）**。常用做法：先把逻辑网络全部拆成二输入与非门和反相器，得到一棵“主题树”；库里每个单元也写成同样由与非门、反相器组成的小树（模式）；然后用模式去覆盖主题树，使总面积最小。

            覆盖用动态规划从输入往输出算：每个节点的最小代价 = 在所有能匹配到这里的模式中，取“模式代价 + 它各输入节点的最小代价”最小的那个。
      - card:
          title: 例题：覆盖一棵小树
          body: 主题树是 $\text{INV}(\text{NAND2}(\text{NAND2}(a, b), \text{INV}(c)))$，即 $AB + C$ 再取反（INV 是反相器，NAND2 是二输入与非门）。库：INV 代价 2，NAND2 代价 3，AND2（模式 INV 接在 NAND2 后）代价 4，AOI21（模式正好是整棵树）代价 6。求最小代价。
          reveal:
            - title: 第 1 步：逐个门照搬
              body: INV + NAND2 + NAND2 + INV $= 2 + 3 + 3 + 2 = 10$。
            - title: 第 2 步：顶上两个门用 AND2
              body: AND2 盖住最上面的 INV 和它下面的 NAND2，再加 NAND2 和 INV：$4 + 3 + 2 = 9$。
            - title: 第 3 步：整棵树用 AOI21
              body: 一个 AOI21 全部盖住，代价 6，最小。动态规划在每个节点比较所有能匹配的模式，自动找到这个解。
      - item:
          id: cover-nand3
          type: number
          prompt: 主题树是 $\text{NAND2}(\text{INV}(\text{NAND2}(a, b)), c)$。库：INV（反相器）代价 2，NAND2（二输入与非门）代价 3，AND2（二输入与门，模式 INV 接在 NAND2 后）代价 4，NAND3（三输入与非门，模式正好是这整棵树）代价 4。覆盖整棵树的最小代价是多少？
          answer: 4
          hint: 这棵树算的是什么函数？库里有没有一个单元正好就是它？
          explain: 三种覆盖：逐个门 $3 + 2 + 3 = 8$；顶上 NAND2 加下面的 AND2 $3 + 4 = 7$；整棵树就是 $\overline{ABC}$，一个 NAND3 代价 4，最小。
      - card:
          title: FPGA 的查找表和打包
          body: |
            FPGA 的基本逻辑单元是**查找表（LUT, look-up table）**：一个 $K$ 输入查找表就是一块 $2^K$ 位的小存储器，存下真值表的每一行，所以能实现任意 $K$ 输入的函数。映射到 FPGA 时，目标是用最少的查找表盖住逻辑网络。

            映射之后，把查找表和触发器按 FPGA 的结构装进逻辑块（每块含几个查找表和触发器、共用输入和时钟），叫**打包（packing）**。装得好，块内连线多、块间连线少，布线更容易，延迟也更短。
      - item:
          id: lut6-bits
          type: number
          prompt: 一个 6 输入查找表要存多少位配置数据？
          answer: 64
          hint: 查找表要为每一种输入组合存下什么？
          explain: 6 个输入有 $2^6 = 64$ 种组合，每种存 1 位输出，共 64 位。所以任意 6 输入函数都能放进一个查找表。
      - item:
          id: packing-goal
          type: choice
          prompt: FPGA 流程里“打包”这一步主要想达到什么？
          options:
            - text: 把关系紧密的查找表和触发器装进同一个逻辑块，减少块之间的连线
              correct: true
            - text: 把设计压缩成更小的比特流文件
              why: 比特流的大小由芯片决定，和打包无关；打包决定逻辑放进哪些逻辑块
            - text: 把多个设计合并到一块 FPGA 上
              why: 打包处理的是同一个设计里的查找表和触发器怎样分组
          explain: 块内连线快、块间连线慢且资源有限。把连在一起的查找表、触发器放进同一块，布线更容易，延迟也更短。
  - id: place-route
    chapter: 逻辑综合与布局布线
    title: 布局和布线
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 要把 100 个单元放进 100 个位置，让总连线最短。把所有摆法都试一遍要试多少种？
          options:
            - text: $100!$ 种，试不完
              correct: true
            - text: $100^2 = 10\,000$ 种
              why: 第一个单元有 100 个位置可选，第二个 99 个……摆法是 $100\times99\times\cdots\times1$
            - text: 100 种
              why: 每个单元都能放在任何一个空位上，组合数是阶乘，远不止 100
          explain: 摆法数是 $100!$，大约 $9.3\times10^{157}$。真实芯片有上百万个单元，只能用启发式的方法找一个好的摆法。
      - card:
          title: 布局的目标
          body: |
            布局要让连线尽量短，同时考虑时序（关键路径上的单元靠近）和拥塞（别让一块区域的线多到布不下）。

            线长在布线之前不知道，常用**半周长线长（HPWL, half-perimeter wirelength）**估算：把一条线网的所有引脚框进最小的矩形，取长加宽。所有线网的半周长加起来就是总线长的估计。
      - item:
          id: hpwl
          type: number
          prompt: 一条线网有三个引脚，坐标是 (1, 2)、(4, 6)、(3, 1)（单位：网格）。它的半周长线长是多少？
          answer: 8
          hint: 框住三个点的矩形，横向多宽、纵向多高？
          explain: 横向从 1 到 4 宽 3，纵向从 1 到 6 高 5，半周长 $3 + 5 = 8$。
      - card:
          title: 三类布局方法
          body: |
            **划分（partitioning）**：把网表切成两半，让被切断的线网最少，两半分到芯片的左右两边；再对每一半照样切，一直切到每块只剩几个单元。

            **模拟退火（simulated annealing）**：随机交换两个单元，变好就接受；变差了 $\Delta$ 也以概率 $e^{-\Delta/T}$ 接受，$T$ 叫温度，从高往低慢慢降。早期能跳出局部最优，后期逐渐只接受改进。

            **解析布局（analytic placement）**：把总线长写成坐标的二次函数 $\sum w_{ij}(x_i - x_j)^2$，求导令其为零，解一组线性方程，再把单元挪到最近的合法位置。
      - item:
          id: anneal-prob
          type: number
          prompt: 模拟退火中，一次交换让代价增加 5，当前温度 $T = 10$。这次交换被接受的概率是多少？
          answer: 0.607
          tolerance: 0.001
          hint: 接受概率的公式是什么？
          explain: $e^{-5/10} = e^{-0.5} = 0.607$。温度降到 1 时，同样的交换只有 $e^{-5} = 0.0067$ 的概率被接受。
      - card:
          title: 例题：一个单元被两个引脚拉着
          body: 一维解析布局：一个可移动单元连着 $x = 0$ 处的固定引脚（权重 2）和 $x = 6$ 处的固定引脚（权重 1）。求使 $2x^2 + (x - 6)^2$ 最小的 $x$。
          reveal:
            - title: 第 1 步：求导
              body: 导数 $4x + 2(x - 6) = 6x - 12$。
            - title: 第 2 步：令导数为零
              body: $6x = 12$，$x = 2$。
            - title: 第 3 步：看结果的意思
              body: $x = (2\times0 + 1\times6)/(2 + 1) = 2$，正是两个引脚位置按权重的加权平均，权重大的引脚把单元拉得更近。
      - item:
          id: quad-place
          type: number
          prompt: 一维解析布局：一个可移动单元连着两个固定引脚，一个在 $x = 0$（连线权重 1），一个在 $x = 10$（权重 3）。使 $1\cdot(x - 0)^2 + 3\cdot(x - 10)^2$ 最小的 $x$ 是多少？
          answer: 7.5
          tolerance: 0.001
          hint: 这个二次式在哪一点取最小值？
          explain: 导数 $2x + 6(x - 10) = 0$，$8x = 60$，$x = 7.5$。单元被拉到两个引脚的加权平均位置，权重大的那边拉得更近。
      - card:
          title: 布线和迷宫布线
          body: |
            布线分两步：全局布线把每条线网分配到粗的区域和走向上，控制每块区域的线数；详细布线在每块区域里定下每条线走哪条轨道、在哪里打通孔换层。

            经典的**迷宫布线（maze routing）**也叫 Lee 算法：把布线区划成网格，从起点开始一圈圈向外标记“走几步能到”（就是宽度优先搜索），遇到障碍绕开，标记到终点后沿着步数递减的方向倒推回起点，得到最短路径。只要有路，它一定找得到最短的那条，代价是网格大时很费存储空间和时间。
      - card:
          title: 例题：绕过一堵墙
          body: 5 × 5 的网格，坐标 (x, y) 从 0 到 4。起点 (0, 0)，终点 (4, 0)，x = 2 那一列 y = 0 到 3 的格子是障碍，只有 (2, 4) 能过。每步走到上下左右相邻的格子。最短路径多少步？
          reveal:
            - title: 第 1 步：波前从起点向外蔓延
              body: 标记会先在 x = 0、1 两列里向上蔓延，因为向右被障碍挡住。(2, 4) 第一次被标记时是第 6 步（向右 2、向上 4）。
            - title: 第 2 步：越过缺口继续蔓延
              body: 从 (2, 4) 往右下蔓延，到 (4, 0) 还要向右 2、向下 4，再 6 步。
            - title: 第 3 步：倒推路径
              body: 终点标记为 12。从终点沿 11、10……递减的格子倒推回起点，就是一条 12 步的最短路径。
      - item:
          id: lee-steps
          type: number
          prompt: 5 × 5 的网格，坐标 (x, y) 从 0 到 4。起点 (0, 2)，终点 (4, 2)，x = 2 那一列 y = 1 到 4 的格子是障碍，只有 (2, 0) 能过。每步走到上下左右相邻的格子。最短路径多少步？
          answer: 8
          hint: 要过障碍，必须经过哪个格子？从起点到它、从它到终点各要几步？
          explain: 必须经过缺口 (2, 0)。从 (0, 2) 到 (2, 0) 要向右 2、向下 2，共 4 步；从 (2, 0) 到 (4, 2) 也是 4 步，合计 8 步。没有障碍时只要 4 步，绕路多了 4 步。迷宫布线的波前会自动找到这个缺口。
  - id: timing-verification
    chapter: 逻辑综合与布局布线
    title: 时序验证、仿真和动态时序分析
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个 64 输入的组合逻辑块，想把所有输入组合都仿真一遍，每秒仿真 $10^9$ 组。大约要多久？
          options:
            - text: 几百年
              correct: true
            - text: 几秒
              why: 64 个输入有 $2^{64} \approx 1.8\times10^{19}$ 种组合，每秒 $10^9$ 组要 $1.8\times10^{10}$ 秒
            - text: 几天
              why: $1.8\times10^{10}$ 秒约是 585 年，远不止几天
          explain: $2^{64}/10^9 \approx 1.8\times10^{10}$ 秒，约 585 年。所以既不能靠穷举仿真查功能，更不能靠它查时序。
      - card:
          title: 功能验证和时序验证
          body: |
            验证要回答两个不同的问题。**功能验证（functional verification）**：逻辑对不对，输入什么、输出什么符合设计意图；用 RTL 仿真，以及形式化的等价性检查（证明综合后的网表和 RTL 功能相同）。**时序验证（timing verification）**：在真实的门延迟和连线延迟下，每个寄存器能不能在时钟沿之前收到正确的数据。

            功能对了不代表时序对；时序检查也不管逻辑本身算得对不对。两者都要做。
      - item:
          id: exhaustive-years
          type: number
          prompt: 一个 64 输入的组合逻辑块，每秒仿真 $10^9$ 组输入，把 $2^{64}$ 组全部仿真完要多少年？（一年按 365.25 天）
          answer: 585
          tolerance: 1
          unit: 年
          hint: $2^{64}$ 是多少？一年有多少秒？
          explain: $2^{64} = 1.845\times10^{19}$，除以 $10^9$ 得 $1.845\times10^{10}$ 秒，除以一年的 $3.156\times10^7$ 秒，约 585 年。
      - card:
          title: 布局布线后的仿真
          body: |
            布局布线完成后，从版图里提取每条连线的电阻和电容，算出每个门和每段线的实际延迟，写成标准延迟格式（SDF）文件，再把它反标回门级网表做仿真，叫**后仿真（post-layout simulation）**。

            这样的仿真带着真实延迟，能看到毛刺和来不及的情况，可它和所有仿真一样，只能检查给出的那些输入序列。
      - card:
          title: 事件驱动仿真
          body: |
            带延迟的门级仿真通常是**事件驱动仿真（event-driven simulation）**：把“某时刻某根线变成某值”叫一个事件，按时间排进队列。每次取出最早的事件，只重新计算以这根线为输入的门，如果门的输出要变，就在“当前时刻 + 门延迟”处排一个新事件。

            大多数时刻只有少数线在变，只算受影响的门比每个时间步把所有门都算一遍快得多。用仿真带着延迟检查时序，叫**动态时序分析（dynamic timing analysis）**。
      - item:
          id: event-glitch
          type: number
          prompt: $Y = \overline{A\cdot\overline A}$：$A$ 经一个延迟 1 ns 的反相器得到 $\overline A$，$A$ 和 $\overline A$ 一起接到一个延迟 2 ns 的二输入与非门。$A$ 在 $t = 0$ 从 0 变到 1。按事件驱动仿真，$Y$ 上出现的低电平毛刺有多宽（纳秒）？
          answer: 1
          tolerance: 0.001
          unit: ns
          hint: $t = 0$ 到 1 ns 之间，与非门的两个输入分别是什么？它的输出事件排在什么时刻？
          explain: $t = 0$ 时 $A = 1$、$\overline A$ 还是 1，与非门输出要变 0，排在 $t = 2$。$t = 1$ 时 $\overline A$ 变 0，输出要变回 1，排在 $t = 3$。所以 $Y$ 在 2 到 3 ns 是低电平，毛刺宽 1 ns。逻辑上 $Y$ 恒为 1，只有带延迟的仿真才看得到它。
      - card:
          title: 动态和静态时序分析
          body: |
            动态时序分析和输入有关：只有仿真的输入序列碰巧激活了最慢的那条路径，才能发现它；设计大了，仿真既慢又覆盖不全。

            静态时序分析不用输入序列，直接按电路结构把每条路径的延迟算出来，和时钟约束比较，几分钟就能检查上亿条路径，所以是时序签核的主要手段。它的缺点是偏保守：有些路径在逻辑上永远不会被激活，它也照算，要由设计者把它们标出来。功能仍靠仿真和形式验证检查。
      - item:
          id: sta-vs-dta
          type: choice
          prompt: 为什么时序签核主要靠静态时序分析，而不是带延迟的仿真？
          options:
            - text: 不依赖输入，能查全部路径，还快
              correct: true
            - text: 静态分析能同时检查逻辑功能对不对
              why: 静态时序分析只算延迟、不管逻辑值，功能要靠仿真和形式验证
            - text: 仿真算出的延迟不准
              why: 后仿真用的是同样提取出来的延迟，并不更不准；问题在于它只覆盖给定的输入序列
          explain: 仿真能不能发现最慢的路径，要看输入有没有碰巧激活它；静态分析按结构把所有路径都算一遍，覆盖完整、速度快。
  - id: sta-setup
    chapter: 逻辑综合与布局布线
    title: 静态时序分析和建立时间检查
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个门的两个输入，一个在 300 ps 时稳定，一个在 450 ps 时稳定，门延迟 100 ps。门的输出最晚什么时候稳定？
          options:
            - text: 550 ps
              correct: true
            - text: 400 ps，从早到的输入算起
              why: 早到的输入稳定了，另一个还在变，输出也会跟着变；要以最后一个稳定的输入为准
            - text: 475 ps，取两个输入的平均
              why: 输出要等所有输入都稳定之后再过一个门延迟，取的是最大值，不是平均
          explain: 输出要等最晚的输入稳定，再加上门延迟：$450 + 100 = 550$ ps。静态时序分析就是把这个“取最大再加延迟”的规则用到整张电路图上。
      - card:
          title: 到达时间和要求时间
          body: |
            静态时序分析把电路看成一张图：节点是各个引脚，边是门和连线的延迟。从发送寄存器的时钟沿出发，往前推每个节点的**到达时间（arrival time, AT）**：输入里最晚的到达时间加上这一段的延迟。

            再从接收寄存器往回推**要求时间（required time, RT）**（也叫要求到达时间）：数据最晚必须在这个时刻到达。两者之差 $RT - AT$ 叫**时序裕量（slack）**，也叫松弛量，为正表示满足，为负表示违例。裕量最小的那条路径就是关键路径，它决定了能跑多快。
      - item:
          id: slack-sign
          type: number
          prompt: 静态时序分析算出某个接收寄存器输入端的到达时间是 480 ps，要求时间是 460 ps。这里的时序裕量是多少皮秒？
          answer: -20
          tolerance: 0.01
          unit: ps
          hint: 裕量是谁减谁？
          explain: 裕量 $= RT - AT = 460 - 480 = -20$ ps。为负说明数据晚到了 20 ps，这条路径违例。
      - card:
          title: 时钟周期约束
          body: |
            时钟周期是给静态时序分析的主要约束。不计偏斜时，接收寄存器的要求时间是

            $$RT = T - t_{setup}$$

            发送寄存器的数据从时钟沿后 $t_{c\text-q}$ 开始出发，所以 $AT = t_{c\text-q} + t_{logic}$。建立时间裕量 $= RT - AT = T - t_{setup} - t_{c\text-q} - t_{logic}$，令它不小于零，就是寄存器的建立约束 $T \ge t_{c\text-q} + t_{logic} + t_{setup}$。
      - card:
          title: 例题：找关键路径
          body: 发送寄存器 $t_{c\text-q} = 100$ ps，它的输出分两路：经门 G1（150 ps）或门 G2（250 ps），两路汇到门 G3（200 ps），G3 输出接接收寄存器（$t_{setup} = 50$ ps）。时钟周期 600 ps，求裕量和关键路径。
          reveal:
            - title: 第 1 步：往前推到达时间
              body: G1 输出 $100 + 150 = 250$ ps，G2 输出 $100 + 250 = 350$ ps；G3 取较晚的 350，输出 $350 + 200 = 550$ ps。
            - title: 第 2 步：要求时间
              body: $RT = 600 - 50 = 550$ ps。
            - title: 第 3 步：裕量和关键路径
              body: 裕量 $550 - 550 = 0$，刚好满足。关键路径是 寄存器 → G2 → G3 → 寄存器。经 G1 那一路的裕量是 $550 - (100 + 150 + 200) = 100$ ps。
      - item:
          id: sta-slack
          type: number
          prompt: 发送寄存器 $t_{c\text-q} = 80$ ps，输出分两路经门 X（120 ps）或门 Y（200 ps），汇到门 Z（90 ps），再经门 W（60 ps）到接收寄存器（$t_{setup} = 40$ ps）。时钟周期 500 ps。建立时间裕量是多少皮秒？
          answer: 30
          tolerance: 0.01
          unit: ps
          hint: Z 的输入取哪一路的到达时间？要求时间是多少？
          explain: $AT = 80 + \max(120, 200) + 90 + 60 = 430$ ps，$RT = 500 - 40 = 460$ ps，裕量 30 ps。
      - item:
          id: sta-fmax
          type: number
          prompt: 一个设计里裕量最小的路径：$t_{c\text-q}$ 加组合逻辑一共 430 ps，接收寄存器 $t_{setup} = 40$ ps。不计偏斜，最高时钟频率是多少吉赫兹？
          answer: 2.128
          tolerance: 0.002
          unit: GHz
          hint: 裕量恰好为零时周期是多少？
          explain: $T_{min} = 430 + 40 = 470$ ps，$f_{max} = 1/470\ \text{ps} = 2.128$ GHz。
      - item:
          id: critical-meaning
          type: choice
          prompt: 一个设计报告了上千条路径的裕量。下面哪一条是关键路径？
          options:
            - text: 裕量最小的那条
              correct: true
            - text: 经过的门最多的那条
              why: 门多不一定慢，门少但每个都驱动大负载、走长线的路径可能更慢；看的是裕量
            - text: 物理上最长的那条连线
              why: 一条长线只是延迟的一部分；关键路径要把整条路径上门和线的延迟加起来比
          explain: 关键路径是裕量最小的路径，它限制了最高频率。优化时序先改它，改完之后另一条又可能成为新的关键路径。
  - id: skew-hold
    chapter: 逻辑综合与布局布线
    title: 偏斜、保持时间检查和修时序
    minutes: 14
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一块芯片测出保持时间违例：某条路径的数据到得太早。把时钟频率降一半能解决吗？
          options:
            - text: 不能，保持时间检查和时钟周期无关
              correct: true
            - text: 能，频率低了什么时序问题都会消失
              why: 降频只多给建立时间；保持检查比的是同一个时钟沿前后的两件事，周期不出现在式子里
            - text: 能，但要降到原来的四分之一
              why: 降到多少都没用，保持约束里没有周期
          explain: 保持检查是“同一个沿之后，新数据不能太早到”，和下一个沿什么时候来无关。保持违例只能在路径上加延迟或减小偏斜来修。
      - card:
          title: 带偏斜的两种检查
          body: |
            静态时序分析里，时钟到达接收寄存器比到达发送寄存器晚 $\delta$（可正可负）时：

            $$\text{建立裕量} = (T + \delta - t_{setup}) - AT_{max}$$

            $$\text{保持裕量} = AT_{min} - (t_{hold} + \delta)$$

            $AT_{max}$ 用最慢的路径，$AT_{min}$ 用最快的路径（$t_{c\text-q}$ 和组合逻辑都取最短延迟）。建立检查要在慢工艺角下做，保持检查要在快工艺角下做。
      - item:
          id: hold-slack-skew
          type: number
          prompt: 一条路径的最短 $t_{c\text-q}$ 是 60 ps，最短组合逻辑 30 ps；接收寄存器 $t_{hold} = 40$ ps；时钟到达接收寄存器比到达发送寄存器晚 80 ps。保持裕量是多少皮秒？（负数表示违例）
          answer: -30
          tolerance: 0.01
          unit: ps
          hint: $AT_{min}$ 是多少？要求它不早于多少？
          explain: $AT_{min} = 60 + 30 = 90$ ps，要求不早于 $40 + 80 = 120$ ps，裕量 $-30$ ps。
      - card:
          title: 怎样修建立和保持违例
          body: |
            建立违例（路径太慢）：把路径上的门换成驱动更强或阈值更低的单元；改写逻辑减少级数；缩短长线、插缓冲器；把一段逻辑拆成两级流水线；实在不行降低频率。

            保持违例（路径太快）：在这条路径上插入延迟单元或缓冲器，让数据晚一点到；或者减小这里的时钟偏斜。降频没有用。插延迟时要检查同一条路径的建立裕量是否还够。
      - card:
          title: 例题：插缓冲器修保持
          body: 一条路径的保持裕量是 $-30$ ps，建立裕量是 $+200$ ps。库里一个延迟缓冲器约 12 ps。要插几个？
          reveal:
            - title: 第 1 步：至少要补多少
              body: 保持裕量要从 $-30$ 补到不小于 0，至少加 30 ps 的最短延迟。
            - title: 第 2 步：算个数
              body: $30/12 = 2.5$，要取整到 3 个，加 36 ps，保持裕量变成 $+6$ ps。
            - title: 第 3 步：回头查建立
              body: 这 36 ps 也让最慢延迟变长，建立裕量从 200 ps 降到约 164 ps，仍然满足。
      - item:
          id: hold-buffers
          type: number
          prompt: 一条路径的保持裕量是 $-25$ ps，建立裕量很充足。每个延迟缓冲器约 10 ps。至少要插几个缓冲器？
          answer: 3
          hint: 要补多少皮秒？个数能不能是小数？
          explain: 要补 25 ps，$25/10 = 2.5$，取整到 3 个，补 30 ps，保持裕量变成 +5 ps。
      - item:
          id: skew-tradeoff
          type: choice
          prompt: 一条路径建立时间很紧，工具故意让接收寄存器的时钟晚到 30 ps（有意的偏斜）。这样做的副作用是什么？
          options:
            - text: 这条路径的保持裕量少了 30 ps，接收寄存器后面那条路径的建立裕量也少了 30 ps
              correct: true
            - text: 没有副作用，偏斜晚到只帮建立
              why: 同一个偏斜出现在保持约束里是减项；接收寄存器的时钟晚了，从它出发的下一段路径也少了这段时间
            - text: 整块芯片的时钟频率都要降低
              why: 有意偏斜的目的正是不降频；代价只在局部的保持裕量和相邻路径上
          explain: 偏斜对建立和保持是一正一负；而且接收寄存器同时也是下一段路径的发送端，它的时钟晚了，下一段就少了时间。所以有意偏斜是在相邻路径之间“挪”裕量。
  - id: timing-exceptions
    chapter: 逻辑综合与布局布线
    title: 未约束路径、跨时钟域和时序例外
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一个配置寄存器只在上电时写一次，之后再也不变。从它出发、穿过很长一段逻辑的路径，静态时序分析报告建立违例。该怎么办？
          options:
            - text: 告诉工具这条路径不必一个周期走完
              correct: true
            - text: 降低整块芯片的时钟频率
              why: 这条路径实际工作时永远不会在一个周期内需要传出新值，为它降频是白白损失性能
            - text: 不用管，静态时序分析的报告可以忽略
              why: 不能整体忽略报告；要明确地把这一条标成例外，别的路径照常检查
          explain: 静态时序分析默认每条寄存器到寄存器的路径都要在一个周期里走完。实际上不需要的，要用约束明确告诉工具。
      - card:
          title: 未约束路径
          body: |
            静态时序分析只检查有约束的路径。如果一个输入端口没有说明外部信号在时钟沿后多久到达，或一个输出端口没有说明外部要求它多久稳定，从它出发或到它的路径就没有要求时间，叫**未约束路径（unconstrained path）**。工具不会报它违例，可它实际可能很慢。

            所以签核时要检查未约束路径的报告，把该约束的都补上约束，确实不需要按一个周期检查的，用约束标成**时序例外（timing exception）**。
      - card:
          title: 跨时钟域
          body: |
            芯片里常有好几个互不相关的时钟。信号从一个时钟域进入另一个，叫**跨时钟域（CDC, clock domain crossing）**。两个时钟的相位关系一直在变，静态时序分析算不出有意义的裕量，这类路径通常标成不检查，改由电路结构保证正确：

            单个位用两级寄存器同步器；多位的数据不能每位各自同步（各位可能在不同周期被采到，拼出一个从没出现过的值），要用握手，或者用异步先进先出队列，读、写位置的计数值用格雷码传过去。
      - item:
          id: gray-6
          type: text
          prompt: 异步先进先出队列里，写位置的计数值要传到读时钟域，先把它从二进制转成格雷码（$G = B \oplus (B \gg 1)$，即每一位和它左边那一位异或，最高位不变）。3 位二进制 110 对应的格雷码是什么？
          format: 写三位二进制，如 011
          answers: ['101']
          hint: 最高位照抄；第二位是二进制的第一、二位异或；第三位呢？
          explain: 最高位 1 照抄；$1\oplus1 = 0$；$1\oplus0 = 1$，得 101。相邻的数转成格雷码只差一位，在另一个时钟域里即使恰好采在变化的那一刻，读到的也只会是旧值或新值。
      - item:
          id: cdc-bus
          type: choice
          prompt: 一个 8 位计数器的值要送到另一个不相关的时钟域。给每一位各接一个两级同步器，有什么问题？
          options:
            - text: 接收端可能拼出一个从没出现过的值
              correct: true
            - text: 没有问题，每一位都已经同步了
              why: 每一位经过同步器最后都会变成干净的 0 或 1，但哪一位在哪个周期变过去由各自随机的解决时间决定；从 0111 变到 1000 时可能有的位先变、有的后变，拼出 1111
            - text: 同步器把 8 位都延后固定的两个周期，所以能对齐
              why: 每一位延后几个周期取决于它在第一级是否亚稳态、解决得多快，不一定都相同
          explain: 多位同时变化时，各位的同步结果可能差一个周期，拼出错误的值。所以多位数据要么转成每次只变一位的格雷码，要么用握手保证数据稳定以后再采。
      - card:
          title: 多周期路径和伪路径
          body: |
            **多周期路径（multicycle path）**：数据本来就每隔 $N$ 个周期才被采一次（比如接收寄存器只在每两个周期使能一次），可以告诉工具按 $N$ 个周期检查建立时间；保持检查通常要同时调整回原来的那个沿，否则会过于严格。

            **伪路径（false path）**：结构上存在、实际工作中永远不会被用到的路径，比如上电后不变的配置寄存器出发的路径、已经由同步器处理的跨时钟域路径。标成伪路径后工具不再检查。标错了会把真正的违例藏起来，所以每一条例外都要有依据。
      - card:
          title: 例题：按两个周期检查
          body: 一条路径 $t_{c\text-q} = 0.1$ ns、组合逻辑 1.5 ns，接收寄存器 $t_{setup} = 0.05$ ns，时钟 1 ns，接收寄存器每两个周期采一次。求按 2 个周期检查的建立裕量。
          reveal:
            - title: 第 1 步：要求时间
              body: 按 2 个周期检查，$RT = 2T - t_{setup} = 2 - 0.05 = 1.95$ ns。
            - title: 第 2 步：到达时间
              body: $AT = t_{c\text-q} + t_{logic} = 0.1 + 1.5 = 1.6$ ns。
            - title: 第 3 步：裕量
              body: $1.95 - 1.6 = 0.35$ ns，满足。按默认的一个周期检查是 $0.95 - 1.6 = -0.65$ ns，会被误报为违例。
      - item:
          id: multicycle-slack
          type: number
          prompt: 一条路径 $t_{c\text-q} = 0.1$ ns、组合逻辑 1.6 ns，接收寄存器 $t_{setup} = 0.05$ ns，时钟周期 1 ns。接收寄存器每两个周期才采一次，按 2 个周期的多周期路径检查。建立裕量是多少纳秒？
          answer: 0.25
          tolerance: 0.001
          unit: ns
          hint: 按 2 个周期检查时，要求时间是多少？
          explain: $RT = 2\times1 - 0.05 = 1.95$ ns，$AT = 0.1 + 1.6 = 1.7$ ns，裕量 0.25 ns。按一个周期检查会是 $-0.75$ ns 的违例。
      - item:
          id: false-path-risk
          type: choice
          prompt: 为了让时序报告“干净”，有人把所有违例的路径都标成伪路径。后果是什么？
          options:
            - text: 真正会出错的慢路径不再被检查，芯片做出来可能跑不到目标频率
              correct: true
            - text: 没有后果，伪路径只是不显示在报告里
              why: 标成伪路径的路径工具完全不分析；如果它其实会被用到，违例就被藏起来了
            - text: 工具会自动判断哪些是真的伪路径
              why: 工具只按约束执行，不会替你判断这条路径在实际工作中会不会用到
          explain: 伪路径必须是确实永远不会用到的路径。乱标会掩盖真实的违例，问题要到芯片回来才暴露，那时已经来不及改了。
  - id: fault-models
    chapter: 芯片测试
    title: 缺陷、故障模型和测试向量
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 晶圆厂做出来的芯片，总有一部分因为尘埃、刻蚀不完全等原因坏了。出厂前怎样把坏的挑出来？
          options:
            - text: 加精心挑选的输入，看输出
              correct: true
            - text: 用显微镜检查每个晶体管
              why: 几十亿个晶体管，又藏在多层金属下面，不可能逐个看；要靠电学测试
            - text: 不用挑，设计验证过的芯片不会坏
              why: 设计正确只说明图纸对；制造时的缺陷是随机的，每一片都要测
          explain: 设计验证查的是图纸对不对，制造测试查的是这一片有没有做坏。办法是加测试输入、比较输出，输入要挑得能发现尽量多的缺陷。
      - card:
          title: 从缺陷到故障模型
          body: |
            制造缺陷是物理的：两条线短路、一条线断开、接触孔没打通。直接针对每一种几何缺陷生成测试太复杂，于是把缺陷对逻辑的影响抽象成**故障模型（fault model）**。

            最常用的是**固定型故障（stuck-at fault）**：某根线永远是 0（固定 0）或永远是 1（固定 1）。另外还有桥接故障（两根线短接）、固定开路故障（某个管子永远不导通）和延迟故障（逻辑对、但太慢）。通常假设一次只有一个故障，$N$ 根线就有 $2N$ 个单固定型故障。
      - item:
          id: stuck-count
          type: number
          prompt: 一个电路有 12 根线（含输入、输出和内部连线）。按单固定型故障模型，一共要考虑多少个故障？
          answer: 24
          hint: 每根线可能固定成哪几种值？
          explain: 每根线可能固定 0 或固定 1，$12\times2 = 24$ 个。实际工具还会合并效果相同的故障，减少要测的数量。
      - card:
          title: 路径敏化
          body: |
            要发现一根线 $x$ 的固定 0 故障，测试向量要做到三件事：**激活**，让 $x$ 在好电路里是 1，故障电路里它是 0，两者不同；**传播**，让这个差异沿一条路径传到输出，路径上每个门的其他输入要取“不起决定作用”的值（与门、与非门取 1，或门、或非门取 0）；**确认**，倒推出能满足这些要求的输入组合。

            这叫**路径敏化（path sensitization）**。自动完成这件事的程序叫**自动测试向量生成（ATPG, automatic test pattern generation）**。
      - card:
          title: 例题：找一个测试向量
          body: 电路 $Y = AB + C$（一个与门接一个或门）。找一个能发现“输入 $A$ 固定 0”的测试向量。
          reveal:
            - title: 第 1 步：激活
              body: $A$ 固定 0，好电路里要让 $A = 1$，差异才出现。
            - title: 第 2 步：传播
              body: 经过与门，另一个输入 $B$ 取 1；经过或门，另一个输入 $C$ 取 0。
            - title: 第 3 步：检查
              body: $A = 1$、$B = 1$、$C = 0$：好电路 $Y = 1$，故障电路 $AB = 0$，$Y = 0$，输出不同，能发现。
      - item:
          id: test-b-sa1
          type: text
          prompt: 电路 $Y = AB + C$（一个与门接一个或门）。能发现“输入 $B$ 固定 1”的测试向量是什么？
          format: 按 A、B、C 的顺序写三个 0 或 1，用空格隔开，如 0 1 1
          answers: ['1 0 0']
          hint: 激活固定 1 故障，好电路里 $B$ 要取什么？与门、或门的另一个输入各取什么才能把差异传出去？
          explain: 激活：$B = 0$。传播：与门另一个输入 $A = 1$，或门另一个输入 $C = 0$。好电路 $Y = 0$，故障电路 $B$ 当成 1，$Y = 1$，输出不同。
      - card:
          title: 故障覆盖率和缺陷水平
          body: |
            测试向量能发现的故障占全部故障的比例叫**故障覆盖率（fault coverage）**。覆盖率不到 100% 时，会有坏片漏过测试被当成好片出厂。

            一个常用的估计是 Williams–Brown 公式：出厂的“好片”里实际是坏片的比例 $DL = 1 - Y^{1 - FC}$，$Y$ 是良率（真正好的芯片的比例），$FC$ 是故障覆盖率，$DL$ 叫**缺陷水平（defect level）**，常用百万分之几（ppm）表示。
      - item:
          id: defect-level
          type: number
          prompt: 良率 50%、故障覆盖率 95% 时，按 $DL = 1 - Y^{1 - FC}$，出厂芯片里坏片的比例是百分之几？
          answer: 3.41
          tolerance: 0.01
          unit: '%'
          hint: 指数 $1 - FC$ 是多少？
          explain: $1 - 0.5^{0.05} = 1 - 0.9659 = 0.0341$，即 3.41%，约 34 000 ppm。覆盖率提高到 99.9%，就降到约 690 ppm。
  - id: scan-bist
    chapter: 芯片测试
    title: 扫描链、内建自测试和 IDDQ 测试
    minutes: 15
    flow:
      - guess:
          id: guess
          type: choice
          prompt: 一块芯片里有上万个寄存器，状态藏在内部。只靠芯片的输入输出引脚，要把某个寄存器设成想要的值再观察结果，难在哪里？
          options:
            - text: 可能要先送很多个周期的输入才能把内部状态推到想要的值
              correct: true
            - text: 寄存器的值一上电就固定了，改不了
              why: 寄存器每个周期都会按输入和当前状态更新；难的是从外面要绕很多步才能控制它
            - text: 引脚太少，一次只能读一个寄存器
              why: 问题不只是读，设定内部状态同样难；扫描设计正是同时解决这两件事
          explain: 时序电路的内部状态要靠一串输入一步步推出来，测试向量又长又难找。扫描设计让每个寄存器都能直接设定、直接读出。
      - card:
          title: 扫描链
          body: |
            在设计里加入方便测试的结构，叫**可测性设计（DFT, design for testability）**。最常用的是扫描：把每个寄存器换成**扫描触发器（scan flip-flop）**，前面多一个二选一多路选择器，测试使能为 1 时选“扫描输入”，否则选正常的数据输入。

            所有扫描触发器首尾相接，串成一条移位寄存器，叫**扫描链（scan chain）**。测试时：移位模式下把测试向量逐位移进去，设好全部寄存器；切回正常模式打一个时钟，让寄存器采下组合逻辑的结果；再切回移位模式把结果移出比较，同时移进下一组向量。
      - item:
          id: scan-why
          type: choice
          prompt: 加了扫描链以后，ATPG 为什么只需要为组合逻辑生成测试向量？
          options:
            - text: 每个寄存器都能直接设定和读出，寄存器之间的逻辑就成了可以单独测试的组合电路
              correct: true
            - text: 扫描链把寄存器都去掉了
              why: 寄存器还在，只是多了一个测试用的输入，能被串起来直接移入移出
            - text: 扫描链会自动检查组合逻辑
              why: 扫描链只负责送入和取出数据，测试向量仍要 ATPG 生成、结果仍要和期望值比较
          explain: 寄存器的值能直接移进移出，相当于把它们变成了额外的输入和输出。时序电路的测试问题于是变成组合电路的测试问题，ATPG 就简单得多。
      - card:
          title: 例题：扫描测试要多久
          body: 一块芯片有 10 000 个扫描触发器，串成一条链；ATPG 给出 1000 组向量；扫描时钟 100 MHz。测试大约要多久？
          reveal:
            - title: 第 1 步：每组向量要几个周期
              body: 移进 10 000 位，再打 1 个采样时钟；移出结果和移进下一组同时进行，所以每组约 10 001 个周期，最后一组的结果再单独移出 10 000 个周期。
            - title: 第 2 步：总周期数
              body: $1000\times10\,001 + 10\,000 = 10\,011\,000$ 个周期。
            - title: 第 3 步：换成时间
              body: $10\,011\,000/10^8 = 0.1$ s。分成 10 条链并行移位，每条 1000 位，周期数约降到十分之一，约 10 ms。测试机按时间收费，所以链要多分几条。
      - item:
          id: scan-time
          type: number
          prompt: 一块芯片有 20 000 个扫描触发器，平均分成 4 条链并行移位；ATPG 给出 2000 组向量；扫描时钟 50 MHz。每组向量移位加 1 个采样周期，最后一组的结果还要单独移出一次。测试要多少毫秒？
          answer: 200.14
          tolerance: 0.05
          unit: ms
          hint: 每条链多长？每组向量要几个周期？
          explain: 每条链 5000 位，每组 $5000 + 1$ 个周期，总共 $2000\times5001 + 5000 = 10\,007\,000$ 个周期，除以 $5\times10^7$ 得 0.200 s，约 200.1 ms。
      - card:
          title: 内建自测试
          body: |
            把产生向量和检查结果的电路也做进芯片，叫**内建自测试（BIST, built-in self-test）**。向量常由**线性反馈移位寄存器（LFSR, linear feedback shift register）**产生：一串触发器移位，把其中几位异或后送回第一位。选对反馈位时，$n$ 位的 LFSR 会走遍除全 0 以外的全部 $2^n - 1$ 个状态再重复，输出像随机数一样。

            结果用另一个类似的寄存器压缩成一小段数据（叫签名，像指纹），和预先算好的签名比较。BIST 能在芯片的工作频率下测试，装进产品后也能自检，存储器几乎都带 BIST。
      - item:
          id: lfsr-period
          type: number
          prompt: 一个反馈位选得最好的 10 位线性反馈移位寄存器，从一个非零状态开始，要过多少个时钟才回到起始状态？
          answer: 1023
          hint: 它能走遍多少个状态？哪个状态走不到？
          explain: 10 位共 $2^{10} = 1024$ 个状态，全 0 状态进去就出不来，所以只走遍其余 1023 个，周期 1023。
      - card:
          title: IDDQ 测试
          body: |
            静态 CMOS 电路稳定以后，电源到地几乎没有电流。如果有桥接故障，某些输入下上拉和下拉会同时导通，电源电流就大得多。给一组向量、等电路稳定后测电源的静态电流，偏大就判为坏片，这叫 **IDDQ 测试（IDDQ testing）**，Q 指静态。

            它能发现一些逻辑测试测不出的缺陷。但工艺进入深亚微米以后，正常芯片的漏电本身就大、而且片与片差得很多，故障带来的那点额外电流淹没在里面，IDDQ 测试的作用大大减弱。
      - item:
          id: iddq-limit
          type: choice
          prompt: 为什么 IDDQ 测试在先进工艺上不如在老工艺上好用？
          options:
            - text: 好片漏电就很大，分辨不出故障电流
              correct: true
            - text: 先进工艺的芯片不会有桥接故障
              why: 线越密，桥接越容易发生；问题出在背景漏电太大
            - text: 先进工艺的芯片电源电流太小，测不准
              why: 正好相反，先进工艺的漏电比老工艺大得多，故障电流被淹没
          explain: IDDQ 靠的是“好片几乎零电流、坏片明显有电流”的反差。漏电随工艺缩小急剧增加，好片的静态电流就很大且分散，这个反差消失了。
boss:
  items:
    - id: b-unified
      type: number
      prompt: 0.25 μm 工艺的 NMOS，$k' = 115\ \text{μA/V}^2$，$W/L = 3$，$V_{th} = 0.43$ V，$V_{DSAT} = 0.63$ V，$\lambda = 0.06\ \text{V}^{-1}$。$V_{GS} = 1.5$ V，$V_{DS} = 2.5$ V。按速度饱和的统一模型，漏极电流是多少微安？
      answer: 188.7
      tolerance: 0.3
      unit: μA
      hint: $V_{GT}$、$V_{DS}$、$V_{DSAT}$ 里哪个最小？
      explain: $V_{GT} = 1.07$ V，最小的是 $V_{DSAT} = 0.63$ V。$I_D = 115\times3\times(1.07\times0.63 - 0.198)\times1.15 = 188.7$ μA。
    - id: b-charge-share
      type: number
      prompt: 动态门的输出节点电容 40 fF，预充到 2.5 V。求值时它和一个原来是 0 V、电容 10 fF 的内部节点接通，没有通到地。输出变成多少伏？
      answer: 2
      tolerance: 0.001
      unit: V
      hint: 电荷在两个电容之间怎样重新分配？
      explain: 电荷守恒：$V = 2.5\times40/(40 + 10) = 2.0$ V，掉了 0.5 V，超过后级反相器 PMOS 的阈值（约 0.4 V），它开始导通，噪声容限被吃掉一块。
    - id: b-fmax
      type: number
      prompt: 寄存器 $t_{c\text-q} = 90$ ps、$t_{setup} = 45$ ps，两个寄存器之间最慢的组合逻辑 850 ps，不计偏斜和抖动。最高时钟频率是多少兆赫？
      answer: 1015
      tolerance: 1
      unit: MHz
      hint: 最短周期由哪几段相加？
      explain: $T_{min} = 90 + 850 + 45 = 985$ ps，$f_{max} = 1/985\ \text{ps} = 1015$ MHz。
    - id: b-domino
      type: choice
      prompt: 两个动态门直接串联（前一级的输出接后一级的输入，中间没有反相器）。求值刚开始时会出什么问题？
      options:
        - text: 后一级可能被错误放电
          correct: true
        - text: 后一级永远不会放电
          why: 正好相反，前一级预充后是 1，后一级的下拉网络会立刻导通
        - text: 两级同时预充，电源电流过大
          why: 预充电流不是问题所在；问题是后一级在前一级算出真实结果之前就看到了 1
        - text: 前一级的输出会被后一级拉低
          why: 后一级的输入只接栅极，不会把前一级的输出拉低
      explain: 求值阶段只能放电不能充电。前一级还没算完时输出仍是预充的 1，后一级看到 1 就放电，等前一级真正输出 0 时已经晚了。多米诺逻辑在每级后面加反相器解决这个问题。
    - id: b-nldm
      type: number
      prompt: 某个门的延迟表：输入转换时间 0.05 ns、负载 8 fF 时 30 ps；0.05 ns、16 fF 时 48 ps；0.15 ns、8 fF 时 38 ps；0.15 ns、16 fF 时 58 ps。输入转换时间 0.08 ns、负载 12 fF 时，按双线性插值延迟是多少皮秒？
      answer: 41.7
      tolerance: 0.05
      unit: ps
      hint: 12 fF 落在 8 和 16 之间的几成处？0.08 ns 呢？
      explain: 0.05 ns 行在 12 fF（正中间）处：$(30 + 48)/2 = 39$ ps；0.15 ns 行：$(38 + 58)/2 = 48$ ps。0.08 ns 在两行之间的 30% 处：$39 + 0.3\times9 = 41.7$ ps。
    - id: b-core-area
      type: number
      prompt: 一个设计有 50 000 个标准单元，平均宽 4 个最小宽度单位。单元库的单元高 2.72 μm、最小宽度单位 0.46 μm，利用率取 75%。核心区面积是多少平方毫米？
      answer: 0.3337
      tolerance: 0.0005
      unit: mm²
      hint: 全部单元的面积是多少？利用率怎样用？
      explain: $50\,000\times4\times0.46\times2.72 = 250\,240\ \text{μm}^2$，除以 0.75 得 $333\,653\ \text{μm}^2 \approx 0.3337\ \text{mm}^2$。
    - id: b-pdyn
      type: number
      prompt: 一块芯片等效开关电容 2 nF，活动因子 0.15，电源 0.9 V，时钟 800 MHz。开关功耗是多少瓦？
      answer: 0.1944
      tolerance: 0.0005
      unit: W
      hint: 四个量怎样相乘？
      explain: $P = 0.15\times2\times10^{-9}\times0.9^2\times8\times10^8 = 0.1944$ W。
    - id: b-logical-effort
      type: number
      prompt: 一条路径依次是二输入与非门、二输入或非门、反相器，最后的负载是第一级输入电容的 18 倍。按逻辑努力（$g$ 分别为 4/3、5/3、1，寄生延迟分别为 2、2、1），最小延迟是多少个 $\tau$？
      answer: 15.26
      tolerance: 0.02
      hint: 路径努力是多少？三级每级分到多少？
      explain: $F = \tfrac43\times\tfrac53\times18 = 40$，$f = 40^{1/3} = 3.42$，$D = 3\times3.42 + 5 = 15.26\tau$。
    - id: b-skew-jitter
      type: number
      prompt: 寄存器 $t_{c\text-q} = 100$ ps、$t_{setup} = 50$ ps，最慢组合逻辑 650 ps。时钟到达接收寄存器比到达发送寄存器晚 30 ps，每个时钟沿相对标称位置最多偏 25 ps。最短时钟周期是多少皮秒？
      answer: 820
      tolerance: 0.01
      unit: ps
      hint: 偏斜在约束里加还是减？抖动的最坏情况要扣掉多少？
      explain: $T + \delta - 2t_{jitter} \ge t_{c\text-q} + t_{logic} + t_{setup}$，$T \ge 100 + 650 + 50 - 30 + 50 = 820$ ps。
    - id: b-sta-slack
      type: number
      prompt: 发送寄存器 $t_{c\text-q} = 70$ ps。从它到接收寄存器有三条组合路径：经门 A（150 ps）再经门 C（120 ps）；经门 B（180 ps）再经门 C；经门 D（400 ps）直达。接收寄存器 $t_{setup} = 30$ ps，时钟周期 520 ps。建立裕量是多少皮秒？
      answer: 20
      tolerance: 0.01
      unit: ps
      hint: 三条路径里哪一条到得最晚？
      explain: 三条路径的逻辑延迟是 270、300、400 ps，最晚的是经 D 的 400 ps。$AT = 70 + 400 = 470$ ps，$RT = 520 - 30 = 490$ ps，裕量 20 ps。
    - id: b-hold-fix
      type: number
      prompt: 一条路径的保持裕量是 $-52$ ps，建立裕量很充足。每个延迟缓冲器约 15 ps。至少要插几个？
      answer: 4
      hint: 要补多少？个数能不能是小数？
      explain: $52/15 = 3.47$，取整到 4 个，补 60 ps，保持裕量变成 +8 ps。
    - id: b-hold-how
      type: choice
      prompt: 静态时序分析报告某条路径保持时间违例。下面哪种改法是对的？
      options:
        - text: 在这条路径上插入延迟缓冲器
          correct: true
        - text: 降低时钟频率
          why: 保持约束里没有时钟周期，降频改变不了它
        - text: 把这条路径上的门换成驱动更强的
          why: 门变强让数据到得更早，保持违例更严重
        - text: 把这段逻辑拆成两级流水线
          why: 拆流水线是修建立违例（太慢）的办法；保持违例是太快
      explain: 保持违例是新数据到得太早，要让这条路径变慢：插延迟缓冲器，或者减小这里的时钟偏斜。
    - id: b-multicycle
      type: number
      prompt: 一条路径 $t_{c\text-q} = 0.12$ ns、组合逻辑 2.6 ns，接收寄存器 $t_{setup} = 0.08$ ns，时钟周期 1 ns，接收寄存器每三个周期采一次，按 3 个周期的多周期路径检查。建立裕量是多少纳秒？
      answer: 0.2
      tolerance: 0.001
      unit: ns
      hint: 要求时间是几个周期减建立时间？
      explain: $RT = 3 - 0.08 = 2.92$ ns，$AT = 0.12 + 2.6 = 2.72$ ns，裕量 0.2 ns。
    - id: b-test-vector
      type: text
      prompt: 电路 $Y = (A + B)C$（一个或门接一个与门）。能发现“输入 $A$ 固定 0”的测试向量是什么？
      format: 按 A、B、C 的顺序写三个 0 或 1，用空格隔开，如 0 1 1
      answers: ['1 0 1']
      hint: 激活要 $A$ 取什么？或门、与门的另一个输入各取什么才能把差异传到输出？
      explain: 激活：$A = 1$。经过或门，另一个输入 $B = 0$；经过与门，另一个输入 $C = 1$。好电路 $Y = 1$，故障电路 $Y = 0$。
    - id: b-defect-level
      type: number
      prompt: 良率 70%、故障覆盖率 98% 时，按 $DL = 1 - Y^{1 - FC}$，出厂芯片里坏片的比例是百分之几？
      answer: 0.711
      tolerance: 0.002
      unit: '%'
      hint: 指数是多少？
      explain: $1 - 0.7^{0.02} = 0.00711$，即 0.711%，约 7100 ppm。
    - id: b-scan-time
      type: number
      prompt: 一块芯片有 8000 个扫描触发器，平均分成 8 条链并行移位；ATPG 给出 500 组向量；扫描时钟 100 MHz。每组向量移位加 1 个采样周期，最后一组的结果还要单独移出一次。测试要多少毫秒？
      answer: 5.015
      tolerance: 0.005
      unit: ms
      hint: 每条链多长？总周期数是多少？
      explain: 每条链 1000 位，总周期 $500\times1001 + 1000 = 501\,500$，除以 $10^8$ 得 5.015 ms。
