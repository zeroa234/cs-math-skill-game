# id: { pack, file (inside the zip; omitted for a single-file pack), title }
tracks:
  grasslands: { pack: jrpg-exploration, file: Exploration1 - Grasslands.ogg, title: Grasslands }
  prairie-nights: { pack: jrpg-exploration, file: Exploration4 - Prairie Nights.ogg, title: Prairie Nights }
  home-town: { pack: jrpg-towns, file: Town1 - Home Town.ogg, title: Home Town }
  where-time-stands-still: { pack: jrpg-towns, file: Town2 - Where Time Stands Still.ogg, title: Where Time Stands Still }
  peaceful-days: { pack: jrpg-calm, file: Calm3 - Peaceful Days.ogg, title: Peaceful Days }
  innocence: { pack: jrpg-calm, file: Calm6 - Innocence.ogg, title: Innocence }
  childhood-friends: { pack: jrpg-calm, file: Calm2 - Childhood Friends.ogg, title: Childhood Friends }
  preparing-for-battle: { pack: jrpg-action, file: Action3 - Preparing For Battle.ogg, title: Preparing For Battle }
  encounter-with-the-witches: { pack: jrpg-action, file: Action1 - Encounter With The Witches.ogg, title: Encounter With The Witches }
  chip-title: { pack: retro-game-music, file: "Juhani Junkala [Retro Game Music Pack] Title Screen.wav", title: Title Screen }
  chip-level-1: { pack: retro-game-music, file: "Juhani Junkala [Retro Game Music Pack] Level 1.wav", title: Level 1 }
  chip-level-3: { pack: retro-game-music, file: "Juhani Junkala [Retro Game Music Pack] Level 3.wav", title: Level 3 }
  chip-stage-1: { pack: chiptune-adventures, file: "Juhani Junkala [Chiptune Adventures] 1. Stage 1.ogg", title: Stage 1 }
  chip-stage-2: { pack: chiptune-adventures, file: "Juhani Junkala [Chiptune Adventures] 2. Stage 2.ogg", title: Stage 2 }
  chip-stage-select: { pack: chiptune-adventures, file: "Juhani Junkala [Chiptune Adventures] 4. Stage Select.ogg", title: Stage Select }
  chip-boss-fight: { pack: chiptune-adventures, file: "Juhani Junkala [Chiptune Adventures] 3. Boss Fight.ogg", title: Boss Fight }
  chip-old-tower-inn: { pack: old-tower-inn-chiptune, title: The Old Tower Inn (chiptune) }
  bards-tale: { pack: bards-tale, title: The Bard's Tale }
  old-tower-inn: { pack: old-tower-inn, title: The Old Tower Inn }
