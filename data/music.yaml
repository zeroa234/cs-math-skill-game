# Background music. Every pack is CC0 (public domain), checked on its OpenGameArt page 2026-11-03.
# scripts/music/encode-music.mjs downloads each pack (or uses temp/music-src/ if it is already there),
# matches loudness and writes assets/music/<track>.ogg; scripts/build-data.mjs turns this file into
# src/gen/music.json for the game (src/game/app/music.js). See assets/music/README.md.
#
# Scenes: title (the intro), explore (camp, routes, map, skill pages, profile, lab), focus (lessons and
# review), challenge (final challenges). A scene plays its tracks one after another, starting at a
# random one; a scene with one track loops it.

packs:
  jrpg-exploration:
