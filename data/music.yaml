  autumn: { pack: chill-beats, file: Chill Beats/28 HoliznaCC0 - Autumn.ogg, title: Autumn }

# The first style is the default.
styles:
  - id: rpg
    name: 像素 RPG
    desc: 日式 RPG 风格的小编制配乐
    scenes:
      title: [grasslands]
      explore: [home-town, where-time-stands-still, prairie-nights]
      focus: [peaceful-days, innocence, childhood-friends]
      challenge: [preparing-for-battle, encounter-with-the-witches]
  - id: chip
    name: 8-bit 芯片
    desc: 红白机风格的芯片音乐
    scenes:
      title: [chip-title]
      explore: [chip-stage-1, chip-stage-2, chip-level-1]
      focus: [chip-old-tower-inn, chip-stage-select]
      challenge: [chip-boss-fight, chip-level-3]
  - id: medieval
    name: 中世纪奇幻
    desc: 鲁特琴、长笛和鼓的酒馆与城堡
    scenes:
      title: [bards-tale]
      explore: [bards-tale, minstrel-dance, kings-feast]
      focus: [old-tower-inn, bards-tale]
      challenge: [medieval-battle]
  - id: lofi
    name: Lo-fi 学习
    desc: 放松的 lo-fi 节拍，适合专心做题
    scenes:
      title: [families]
      explore: [families, opinions, autumn]
      focus: [autumn, families, opinions]
      challenge: [opinions]
