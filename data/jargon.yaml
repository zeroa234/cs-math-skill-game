# Technical words a complete beginner does not know. A content pack written to the beginner standard
# (version: 2) may use one of these only after a card has defined it (**术语** in a card, and an entry in
# the pack's `terms`), or when the pack lists it under `assumes` because a prerequisite skill teaches it.
# Checked by scripts/lib/packs.mjs; text inside code, math and lesson titles is not scanned.
# Add words here whenever a review finds one that slipped through: the list is meant to grow.
#
# Code is checked through `code` (at the end): a program shown in a fenced block, an item's `code` or a
# traced program that contains one of a term's keywords uses that term. Added 2026-11-04 after a player
# found a for loop in P.1.1's "改动列表和字典", two lessons before for is taught.
