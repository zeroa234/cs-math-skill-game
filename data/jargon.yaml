# term: keywords whose use in a shown program means the program uses that term (whole words, after
# string literals and comments are removed). Only keywords that mean the same idea in every language
# the packs show (Python, C, shell, pseudocode). "a / b" means teaching either term is enough. The
# lesson that defines the term may use its keywords before the defining card (scripts/lib/beginner.mjs).
code:
  循环: [for, while]
  分支: [if]
  函数: [def, return, lambda]
  模块 / 标准库 / 第三方库: [import]
  异常: [try, except, raise]
