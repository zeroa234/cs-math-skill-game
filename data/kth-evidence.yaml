# KTH course prerequisites used as a second, independent check of the skill tree's required edges.
# A viewer pointed to https://www.kth.se/student/kurser/sokkurs?l=en ("KTH spells out prerequisites").
# Quotes: the "Specific prerequisites" section of each course page, verbatim, read on 2026-11-03 by
# loading https://www.kth.se/student/kurser/kurs/<code>?l=en (first located by a pi research run,
# reports/research/kth-and-hpn.md, then re-read by the main agent; where the two differed the page wins,
# e.g. IK1552 says "General entry requirements…", not "No information inserted").
#
# skill: the tree skill whose content the course matches (a judgement, stated in `fit`).
# needs: the course's prerequisite courses, each mapped to the tree skill it corresponds to.
# scripts/build-data.mjs checks every `needs` skill lies in the required closure of `skill`.
