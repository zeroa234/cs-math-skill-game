# Publishes the committed web build (output/web, built without the mentor characters by
# scripts/publish-github.mjs) to GitHub Pages. Nothing is built here: the build needs the sibling
# cs-math-skill-tree checkout and Python, and the committed copy is what was tested.
name: Pages
on:
  push:
    branches: [main]
    paths: [output/web/**]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: output/web
      - id: deployment
        uses: actions/deploy-pages@v5
