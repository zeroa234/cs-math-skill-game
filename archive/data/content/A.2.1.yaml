skill: A.2.1
version: 1
authors: [pi-ml]
brief:
  why: |
    机器学习就是让程序从数据里找规律，而不是把规则一条条写死。这一关用最小的模型走一遍最重要的几张图景：
    怎么衡量“错多少”、怎么让参数朝更小的损失走、怎么把没有标签的点分组、怎么把高维数据压到低维，
    以及训练集、验证集、测试集这套评估规矩为什么不能省。
  outcomes:
    - 说清回归和分类的区别，写出均方误差、sigmoid 与交叉熵
    - 用梯度下降更新线性回归的参数，解释学习率太大或太小会怎样
    - 运行 k-means，说出“分配—更新”两步，并解释结果为什么依赖初始中心
    - 把 PCA 的第一主成分解释为方差最大的方向，算出解释方差比例
    - 用自己的话说明表示学习、自编码器与流形假设
    - 划分训练/验证/测试集，认出过拟合并说出至少三种应对办法
lessons:
  - id: regression-classification
    chapter: 回归/分类
    title: 从“错多少”到“往哪改”
    minutes: 10
    warmup:
      id: guess
      type: choice
      prompt: 把梯度下降的学习率调大，会更快到达最小值吗？
      options:
        - { text: 会，步子大走得快, why: 步子太大可能直接跨过最小值，在两边来回跳甚至越走越远 }
        - { text: 不一定，太大可能震荡或发散, correct: true }
        - { text: 学习率和收敛速度无关, why: 学习率决定每步走多远，直接影响收敛快慢和是否稳定 }
      explain: |
        学习率是每步的步长。太小会走得很慢，太大会一步跨过谷底；在二次损失上，
        学习率超过某个界限后误差会越来越大，这就叫发散。合适的值要在“走得动”和“不跨过头”之间取。
    cards:
      - title: 回归预测数，分类预测类别
        body: |
          **回归（regression）**的输出是一个数，比如预测房价；**分类（classification）**的输出是一个类别，比如判断邮件是不是垃圾邮件。

          最简单的回归模型是直线 $\hat y=wx+b$。给定数据 $(x_i,y_i)$，用**均方误差（mean squared error, MSE）**
          $$L(w,b)=\frac1n\sum_{i=1}^n (wx_i+b-y_i)^2$$
          衡量这条线离点有多远。让 $L$ 最小的 $w,b$ 就是最小二乘解；例如对 $(1,1),(2,3),(3,2),(4,5)$，解是 $w=1.1$、$b=0$。
          分类则在算出一个分数后，用 sigmoid 把它压到 0 和 1 之间，当作“属于正类的概率”。
      - title: 梯度下降：沿着最陡的方向下山
        body: |
          损失 $L$ 是参数的函数，像一片地形。**梯度（gradient）**指向上升最快的方向，所以往反方向走一小步就能让损失变小：
          $$w\leftarrow w-\eta\frac{\partial L}{\partial w},\qquad b\leftarrow b-\eta\frac{\partial L}{\partial b}.$$
          这里的 $\eta$ 就是学习率。

          把 $b$ 固定成 0、用上面四个点，损失只随 $w$ 变：
          $$L(w)=\frac14(30w^2-66w+39),$$
          它是一条开口向上的抛物线，最低点在 $w=\frac{33}{30}=1.1$。拖动学习率和步数，看能不能走到谷底：
        sim:
          name: descent
          params:
            f: "(30x^2-66x+39)/4"
            x0: 0
      - title: 分类：概率、阈值与交叉熵
        body: |
          sigmoid 把任意实数压到 $(0,1)$：
          $$\sigma(z)=\frac{1}{1+e^{-z}},\qquad p=\sigma(w_1x_1+w_2x_2+b).$$
          预测时通常取 $p>0.5$ 为正类，也就是看 $w_1x_1+w_2x_2+b$ 的符号——这正是一条直线把平面切成两半。
          单个样本的**交叉熵（cross-entropy）**损失是
          $$L=-[y\ln p+(1-y)\ln(1-p)].$$
          它对参数的梯度是 $(p-y)x$：预测离答案越远，梯度越大。分类一般不用均方误差，因为 sigmoid 饱和时它的梯度接近 0，而且损失关于参数不是凸的。

          单个神经元只能画一条直线，所以 AND、OR 能分对（线性可分），XOR 怎么调都只能到 75%：
        sim:
          name: neuron
          params:
            gate: xor
    items:
      - id: sim-descent
        type: sim
        sim: descent
        prompt: |
          固定 $b=0$ 时，损失是 $L(w)=\frac14(30w^2-66w+39)$，最低点在 $w=1.1$。
          调整学习率和步数，让最终的 $w$ 落在 1.1 的 $\pm0.01$ 以内，并且总步数不超过 15。
        params:
          f: "(30x^2-66x+39)/4"
          x0: 0
        goal:
          target: 1.1
          tol: 0.01
          maxSteps: 15
        solution: { lr: 0.05, steps: 6 }
        hint: 先试 0.05 左右的学习率；步数够多就会慢慢靠近 1.1。
        explain: |
          对 $L(w)=7.5w^2-16.5w+9.75$ 求导得 $15w-16.5$，在 $w=0$ 处梯度是 $-16.5$，所以第一步会往右走。
          学习率 0.05、走 6 步后 $w\approx1.0997$，误差约 0.0003，满足要求。
          学习率超过约 0.13 时，每步会跨过谷底并且越跨越远，这就是发散。
      - id: gd-one-step
        type: number
        prompt: |
          数据仍是 $(1,1),(2,3),(3,2),(4,5)$，模型 $\hat y=wx+b$，损失
          $$L=\frac1n\sum(\hat y-y)^2.$$
          从 $w=b=0$ 出发、学习率 0.01 做**一步**梯度下降，更新后的 $w$ 是多少？
        answer: 0.165
        tolerance: 0.001
        hint: 先算 $\frac{\partial L}{\partial w}=\frac2n\sum(wx_i+b-y_i)x_i$ 在 $w=b=0$ 处的值。
        explain: |
          在原点，$\frac{\partial L}{\partial w}=\frac24\sum(-y_i)x_i=-\frac12\cdot33=-16.5$，
          $\frac{\partial L}{\partial b}=\frac24\sum(-y_i)=-\frac12\cdot11=-5.5$。
          所以 $w=0-0.01\times(-16.5)=0.165$，$b=0.055$。
          只走一步离最优的 $w=1.1$ 还很远，梯度下降要反复迭代。
      - id: sim-and
        type: sim
        sim: neuron
        params:
          gate: and
        prompt: |
          调 $w_1,w_2,b$，让这个神经元在 AND 的四个输入 $(0,0),(0,1),(1,0),(1,1)$ 上全部答对（准确率 1）。
        goal:
          accuracy: 1
        solution: { w1: 1, w2: 1, b: -1.5 }
        hint: 需要 $w_1+w_2+b>0$，但单独一个 1 加上 $b$ 要小于等于 0。
        explain: |
          取 $w_1=w_2=1$、$b=-1.5$：只有 $(1,1)$ 满足 $1+1-1.5=0.5>0$，其余三个和都小于 0。
          边界线是 $x_1+x_2=1.5$，它把 $(1,1)$ 单独划到一边。AND 是线性可分的，所以一个神经元就够。
      - id: why-cross-entropy
        type: choice
        prompt: 分类问题为什么通常用交叉熵而不是均方误差？
        options:
          - { text: 交叉熵的梯度与预测误差成正比，不会因为 sigmoid 饱和而消失；均方误差在预测严重错误时梯度反而接近 0, correct: true }
          - { text: 均方误差只能用于回归，不能用于分类, why: 均方误差也能算，只是优化起来效果差、学得慢 }
          - { text: 交叉熵不需要标签, why: 交叉熵里就有 $y$，它是有监督损失 }
        explain: |
          对 sigmoid 输出用均方误差时，预测错得离谱会让 sigmoid 进入平坦区，梯度接近 0，参数几乎不动；
          交叉熵对 logit 的梯度是 $p-y$，错得越远改得越多。交叉熵也是伯努利分布的负对数似然，和“输出是概率”的假设一致。
      - id: cross-entropy-value
        type: number
        prompt: |
          一个正样本（$y=1$）被预测为 $p=0.9$。用 $L=-[y\ln p+(1-y)\ln(1-p)]$ 算损失，保留三位小数。
        answer: 0.105
        tolerance: 0.001
        hint: $y=1$ 时第二项是 $0\cdot\ln 0.1$，只剩 $-\ln 0.9$。
        explain: |
          $L=-\ln 0.9\approx0.105$。预测得越接近 1，损失越接近 0；
          若预测成 $p=0.5$，损失是 $-\ln0.5\approx0.693$，明显更大。

  - id: clustering
    chapter: 聚类
    title: 没有答案时，按距离分组
    minutes: 10
    warmup:
      id: guess
      type: choice
      prompt: 同一批数据、同样的 $k$，k-means 从不同的初始中心出发，结果一定相同吗？
      options:
        - { text: 一定相同，算法会找到全局最优, why: k-means 只保证每一步不使目标变差，可能停在局部最优 }
        - { text: 不一定，可能收敛到不同的分组, correct: true }
        - { text: 只有 $k=1$ 时才可能不同, why: '$k=1$ 时只有一个中心，结果反而唯一；不同结果出现在 $k\ge2$' }
      explain: |
        k-means 每步只做“把点分给最近的中心”和“把中心移到组内均值”，它保证目标函数不上升，
        但可能停在某个局部最优（local optimum）。初始中心选得不同，最后的分组就可能不同，所以实践中会多试几组初始化。
    cards:
      - title: 无监督：没有标签，只有点
        body: |
          **无监督学习（unsupervised learning）**拿到的数据只有特征 $x$，没有答案 $y$。
          聚类的任务是：把彼此靠近的点分到一组，让组内的点尽量相似、组间的点尽量不同。

          k-means 用**簇内平方和（within-cluster sum of squares, SSE）**衡量分组好坏：
          $$\mathrm{SSE}=\sum_{i=1}^{n}\lVert x_i-c_{a(i)}\rVert^2,$$
          其中 $c_{a(i)}$ 是第 $i$ 个点所属簇的中心。SSE 越小，组内的点离中心越近。
      - title: 分配、更新、重复
        body: |
          算法只有两步，来回做：

          1. **分配**：把每个点分给距离最近的中心。
          2. **更新**：把每个中心移到它这一组所有点的均值。

          重复到分配不再变化（等价于中心不再移动）就停止。每一步都不会让 SSE 变大，而分组方式只有有限多种，
          所以一定会停；但停下来的可能只是局部最优。实际使用时会多跑几次不同的初始化，取 SSE 最小的那组。
          拖动迭代次数，看三个中心怎么移动：
        sim:
          name: kmeans
          params:
            dataset: blobs3
            k: 3
      - title: 一维例子：一步一步算
        body: |
          数据是 $1,2,3,10,11,12$，$k=2$，初始中心取 $1$ 和 $2$。

          第 1 轮分配：$1$ 离中心 $1$ 最近，其余 $2,3,10,11,12$ 都离中心 $2$ 更近。
          更新中心：第一组只有 $1$，中心仍是 $1$；第二组的均值是 $(2+3+10+11+12)/5=7.6$。

          第 2 轮分配：$1,2,3$ 都离中心 $1$ 更近，$10,11,12$ 都离中心 $7.6$ 更近。
          更新后中心变成 $(1+2+3)/3=2$ 和 $(10+11+12)/3=11$。第 3 轮分配不变，算法停止，两个簇是 $\{1,2,3\}$ 和 $\{10,11,12\}$。
    items:
      - id: sim-kmeans
        type: sim
        sim: kmeans
        params:
          dataset: blobs3
          k: 3
        prompt: |
          让这三个中心跑到收敛：不断增加迭代次数，直到分配不再变化（中心不再移动）。
        goal: {}
        solution: { iterations: 4 }
        hint: 观察中心的位置，如果这一轮和上一轮完全一样，就已经收敛了。
        explain: |
          在这组数据和默认初始化下，算法迭代 4 次后中心不再移动，分配也稳定下来。
          再增加迭代次数不会有变化；如果换一组初始中心，可能要更多或更少次，甚至停到另一个分组。
      - id: one-d-center
        type: number
        prompt: |
          对数据 $1,2,3,10,11,12$ 做 $k=2$ 的 k-means，初始中心为 $1$ 和 $2$。收敛后较大的那个中心是多少？
        answer: 11
        hint: 先按“离哪个中心近”分一次，再用每组的平均值更新中心。
        explain: |
          第 1 轮后中心是 $1$ 和 $7.6$；第 2 轮把 $1,2,3$ 和 $10,11,12$ 分开，中心变成 $2$ 和 $11$；
          第 3 轮分配不变，收敛。较大的中心是 $11$。
      - id: one-d-sse
        type: number
        review: false
        prompt: |
          接上一题，收敛后的分组是 $\{1,2,3\}$ 与 $\{10,11,12\}$，中心是 $2$ 和 $11$。
          这时的 SSE 是多少？
        answer: 4
        hint: 每个点减去它所属的中心，平方后加起来。
        explain: |
          第一组：$(1-2)^2+(2-2)^2+(3-2)^2=1+0+1=2$；
          第二组：$(10-11)^2+(11-11)^2+(12-11)^2=1+0+1=2$。合计 4。
          这已经是最小的可能值，把 $3$ 和 $10$ 分到同一边会让 SSE 变大。
      - id: stop-condition
        type: choice
        prompt: k-means 在什么条件下停止？
        options:
          - { text: 每个点所属的簇不再变化（中心也不再移动）, correct: true }
          - { text: SSE 达到 0, why: 只有每个点都正好等于中心时 SSE 才是 0，通常做不到 }
          - { text: 中心的个数达到 $k$, why: 中心数从一开始就是 $k$，这不是停止条件 }
        explain: |
          当一轮分配后没有任何点换组，更新步骤算出的中心就和上一轮相同，再做下去也不会变。
          实现时还会设一个最大迭代次数，防止极端情况下一直来回摆动。
      - id: match-kmeans
        type: match
        prompt: 把 k-means 里的名词和它的意思连起来。
        pairs:
          - ["簇", "被分到同一组的点的集合"]
          - ["中心", "簇内所有点的均值"]
          - ["SSE", "每个点到所属中心距离的平方和"]
          - ["初始化", "一开始把中心放在哪里，会影响最终结果"]
        explain: |
          k-means 用中心代表一个簇，用 SSE 评价分组好坏；初始化决定从哪片地形开始下山，
          所以同一批数据可能得到不同的局部最优。

  - id: dimensionality
    chapter: 降维
    title: 找数据变化最大的方向
    minutes: 10
    warmup:
      id: guess
      type: choice
      prompt: PCA 的第一主成分是哪个方向？
      options:
        - { text: 数据投影到这个方向后，方差最大的方向, correct: true }
        - { text: 数据均值所在的方向, why: PCA 先把均值减掉，均值本身是原点，不是要找的方向 }
        - { text: 离原点最近的那个数据点所在的方向, why: 单个点不能代表整批数据的变化方向 }
      explain: |
        方差大意味着数据在这个方向上拉得最开，投影后保留的差异最多。
        PCA 先中心化，再找一个单位方向 $u$，让所有点投影到 $u$ 上之后的方差最大。
    cards:
      - title: 降维：用更少的坐标描述同一批点
        body: |
          二维数据可以画在纸上，一百维的数据就没法看了；而且很多特征高度相关，信息是重复的。
          **降维（dimensionality reduction）**想用少数几个新坐标概括原来的数据，同时尽量少丢信息。

          **主成分分析（principal component analysis, PCA）**是线性的降维方法。先把数据中心化（每列减去均值），
          再找单位向量 $u$，把点 $x$ 投影成标量 $u^{\mathsf T}x$。投影后的方差是
          $$\frac1n\sum_{i=1}^n (u^{\mathsf T}x_i)^2=u^{\mathsf T}\Sigma u,$$
          其中 $\Sigma$ 是协方差矩阵。PCA 要选让这个方差最大的 $u$。
      - title: 特征值就是方差
        body: |
          在约束 $\lVert u\rVert=1$ 下最大化 $u^{\mathsf T}\Sigma u$，用拉格朗日乘子会得到
          $$\Sigma u=\lambda u.$$
          也就是说，主成分方向是协方差矩阵的**特征向量（eigenvector）**，对应的**特征值（eigenvalue）** $\lambda$ 正是数据在这个方向上的方差。
          对称协方差矩阵可以选出一组彼此正交的特征向量，所以第一、第二主成分是互相垂直的方向。

          对 $\Sigma=\begin{bmatrix}2&1\\1&2\end{bmatrix}$，特征值是 $3$ 和 $1$，第一主成分方向是 $(1,1)/\sqrt2$。
          它解释了 $3/(3+1)=75\%$ 的总方差。
      - title: 保留几个主成分？
        body: |
          把所有主成分按特征值从大到小排，取前 $k$ 个，就得到 $k$ 个新坐标 $u_1^{\mathsf T}x,\dots,u_k^{\mathsf T}x$。
          原来的数据被压缩成 $k$ 个数，丢掉的是较小特征值对应的方向。

          **解释方差比例（explained variance ratio）**是 $\lambda_i/\sum_j\lambda_j$，总方差等于特征值之和。
          如果前两个主成分已经解释了 95% 的方差，用二维表示这批数据通常就够用了。
          PCA 只用特征 $X$、不用标签 $y$，所以它是无监督方法；它找的是“变化最大”的方向，不保证这个方向对分类最有帮助。
    items:
      - id: pca-eigen
        type: number
        prompt: |
          协方差矩阵是 $\Sigma=\begin{bmatrix}2&1\\1&2\end{bmatrix}$。它的较大特征值是多少？
        answer: 3
        hint: 解 $\lambda^2-(\operatorname{tr}\Sigma)\lambda+\det\Sigma=0$，迹是 4，行列式是 3。
        explain: |
          特征方程是 $\lambda^2-4\lambda+3=(\lambda-3)(\lambda-1)=0$，两个特征值是 3 和 1，较大的是 3。
          它对应特征向量 $(1,1)$，也就是第一主成分的方向。
      - id: pca-ratio
        type: number
        prompt: |
          同一个协方差矩阵 $\Sigma=\begin{bmatrix}2&1\\1&2\end{bmatrix}$。第一主成分的解释方差比例是多少？（填 0 到 1 之间的小数）
        answer: 0.75
        tolerance: 0.001
        hint: 用较大的特征值除以两个特征值之和。
        explain: |
          总方差是 $3+1=4$，第一主成分的方差是 3，所以比例是 $3/4=0.75$，即 75%。
          剩下的 25% 在方向 $(1,-1)$ 上，投影到第一主成分时会被丢掉。
      - id: pca-direction
        type: number
        prompt: |
          第一主成分的单位方向可以写成 $(a,a)$，其中 $a>0$。求 $a$。（保留三位小数）
        answer: 0.7071
        tolerance: 0.001
        hint: 特征向量 $(1,1)$ 的长度是 $\sqrt2$，单位化就是除以它。
        explain: |
          $(1,1)$ 的长度是 $\sqrt{1^2+1^2}=\sqrt2$，所以 $a=1/\sqrt2\approx0.7071$。
          这个方向与 $(1,-1)/\sqrt2$ 正交，后者是第二主成分。
      - id: pca-unsupervised
        type: choice
        prompt: 关于 PCA，下面哪个说法正确？
        options:
          - { text: 它不需要标签，找的是数据方差最大的方向, correct: true }
          - { text: 它需要标签，按类别把数据分开, why: 那是线性判别分析等有监督方法；PCA 只看特征 }
          - { text: 它找的是均值最大的方向, why: 中心化之后均值为 0，PCA 关心的是方差 }
        explain: |
          PCA 只对特征矩阵 $X$ 做分解，不使用 $y$，所以属于无监督学习。
          它选择投影后方差最大的方向，因为这些方向保留了最多的变化；分类是否有用要看具体任务。
      - id: match-pca
        type: match
        prompt: 把 PCA 里的名词和它的意思连起来。
        pairs:
          - ["协方差矩阵", "描述各特征如何一起变化"]
          - ["特征向量", "主成分的方向"]
          - ["特征值", "数据在该方向上的方差"]
          - ["解释方差比例", "某个主成分占总方差的比例"]
        explain: |
          协方差矩阵概括了数据的形状；它的特征向量给出主成分方向，特征值给出该方向的方差。
          把特征值从小到大排，丢掉小的那些，就完成了一次降维。

  - id: representation
    chapter: 表示
    title: 换一套坐标，问题就变简单了
    minutes: 10
    warmup:
      id: guess
      type: choice
      prompt: 训练一个自编码器时，用来和输出比较的“标准答案”是什么？
      options:
        - { text: 人工标注的类别标签, why: 自编码器属于无监督方法，不需要人工标签 }
        - { text: 输入本身, correct: true }
        - { text: 不需要比较，只要能压缩就行, why: 没有重构目标，编码器可以随便输出，学不到有用的表示 }
      explain: |
        自编码器让输出尽量等于输入：编码器把 $x$ 压成表示 $z$，解码器再从 $z$ 还原出 $\hat x$，
        损失是 $\lVert\hat x-x\rVert^2$。标准答案就是输入自己，所以它不需要人工标注。
    cards:
      - title: 表示学习：换坐标，让规律露出来
        body: |
          **表示（representation）**是描述一个对象所用的那组数。同一个对象可以有很多种表示：一张人脸可以用像素值表示，
          也可以用“眼睛间距、肤色、朝向”表示。像素表示里，光照一变，很多像素值都会跟着变；好的表示会把光照这种与任务无关的变化压掉。

          **表示学习（representation learning）**就是不靠人手工设计特征，而是让算法自己找一组坐标，
          使得后续任务（分类、检索、预测）在这组坐标里更容易。理想的表示保留与任务相关的因素，丢掉无关因素，
          并且让不同的因素尽量分开（disentanglement）。
      - title: 自编码器：压进瓶颈，再还原
        body: |
          自编码器（autoencoder）由两部分组成：编码器 $f$ 把输入 $x$ 映射成低维表示 $z=f(x)$，
          解码器 $g$ 再从 $z$ 还原 $\hat x=g(z)$。训练目标是重构误差
          $$L=\lVert x-\hat x\rVert^2.$$
          中间那层很窄，叫**瓶颈（bottleneck）**：想还原得好，$z$ 就必须保留输入里最重要的信息。

          如果 $f$、$g$ 都是线性的、损失用均方误差，学到的最优子空间和 PCA 的主成分子空间一致；
          加上非线性后，自编码器能抓住弯曲的低维结构。神经网络的隐藏层也在做类似的事：把输入换成一组新坐标，输出层再在这组坐标里划线。
          把隐藏单元设为 0，模型只能画一条直线；加上隐藏层后再训练看看：
        sim:
          name: mlp
          params:
            dataset: circle
            hidden: 0
      - title: 流形与分布式表示
        body: |
          **流形假设（manifold hypothesis）**说：高维数据并不是均匀填满整个空间，而是集中在一个低维曲面（流形）附近。
          手写数字的图片有成千上万个像素，但真正变化的可能只有笔画粗细、倾斜角度等几个因素。
          自编码器和 PCA 都在寻找一个低维坐标来描述数据，只是 PCA 限制这个坐标必须是线性的。

          **分布式表示（distributed representation）**用多个单元的组合表示一个概念，比如“红色”“圆形”“大”各占一些单元，
          “大红圆”就是这几个单元同时活跃。它和 one-hot 相反：one-hot 每个类别独占一个单元，类别之间没有共享；
          分布式表示让相似概念共享参数，因此对没见过的组合也可能给出合理结果。
    items:
      - id: sim-mlp
        type: sim
        sim: mlp
        params:
          dataset: circle
          hidden: 0
        prompt: |
          隐藏单元为 0 时，这只是一个线性分类器，圆环数据分不开。加上隐藏层并训练，让准确率达到 0.9 以上。
        goal:
          accuracy: 0.9
        solution: { hidden: 6, activation: tanh, lr: 1, epochs: 600, seed: 1 }
        hint: 先把隐藏单元调到 4 以上，学习率可以试 1，训练轮数要够多。
        explain: |
          隐藏层把每个点映射到新的坐标，输出层在新坐标里画一条直线；回到原来的平面，这条边界就弯了。
          隐藏单元 6 个、tanh、学习率 1、训练 600 轮时，准确率可以到 100%。
          隐藏单元为 0 时没有这层表示，准确率一直停在 50% 左右。
      - id: weights-count
        type: number
        prompt: |
          一个全连接层把 10 维输入映射成 4 维表示，每个输出单元都连接到全部输入。
          不计偏置，这一层一共有多少个权重？
        answer: 40
        hint: 4 个输出单元，每个都要 10 个权重。
        explain: |
          每个输出单元有 10 个权重，4 个单元共 $4\times10=40$ 个。
          如果把每个单元的偏置也算上，还要再加 4 个，共 44 个参数。
      - id: good-representation
        type: choice
        prompt: 下面哪句话最符合“好的表示”？
        options:
          - { text: 保留与任务相关的信息，忽略无关的变化，让后续模型更容易学, correct: true }
          - { text: 维度越多越好，信息一点都不能丢, why: 维度高不等于有用，无关信息和噪声反而让任务更难 }
          - { text: 必须和原始输入一一对应，不能有任何压缩, why: 自编码器的瓶颈正是靠压缩逼出重要信息 }
        explain: |
          表示是为后续任务服务的：留下能区分目标的因素，压掉光照、噪声这类无关变化，后续模型就不必自己学会忽略它们。
          这也是自编码器要用窄瓶颈的原因——不压缩，网络可以直接把输入抄到输出，学不到概括性的表示。
      - id: match-representation
        type: match
        prompt: 把表示学习里的名词和它的意思连起来。
        pairs:
          - ["表示", "描述一个对象所用的那组数"]
          - ["自编码器", "用编码器和解码器重构输入的模型"]
          - ["瓶颈", "中间那层很窄的表示，迫使模型保留重要信息"]
          - ["流形假设", "高维数据集中在一个低维曲面附近"]
          - ["分布式表示", "用多个单元的组合表示一个概念"]
        explain: |
          这五个词连起来是一条线：数据需要一种表示；自编码器用瓶颈逼出表示；流形假设说明为什么低维表示可能够用；
          分布式表示说明概念可以怎样由多个单元共享地组合出来。
      - id: onehot-vs-distributed
        type: choice
        prompt: 和 one-hot 编码相比，分布式表示的主要好处是什么？
        options:
          - { text: 相似概念可以共享参数，没见过的特征组合也可能被处理好, correct: true }
          - { text: 它用的维度一定比 one-hot 少, why: 维度可以少，但关键区别是共享与组合，不是单纯的维度大小 }
          - { text: 它让每个类别各占一个独立的单元, why: 那正是 one-hot（局部表示）的做法 }
        explain: |
          one-hot 里“猫”和“狗”对应的两个单元毫无关系，模型无法从“猫”的例子迁移到“狗”。
          分布式表示让它们共享一部分单元，相似性就体现在坐标的距离上，参数也能在不同概念间复用。

  - id: features-setup
    chapter: 特征工程与学习设置
    title: 数据怎么分，特征怎么喂
    minutes: 10
    warmup:
      id: guess
      type: choice
      prompt: 一个模型训练误差 2%、验证误差 15%。最可能是什么问题？
      options:
        - { text: 过拟合：模型记住了训练数据，换一批数据就不行, correct: true }
        - { text: 欠拟合：模型太简单，两组误差都高, why: 欠拟合时训练误差也会很高，不会只有 2% }
        - { text: 没有问题，验证误差高是正常的, why: 2% 和 15% 差了 7 倍，说明泛化能力明显不足 }
      explain: |
        训练误差低、验证误差高，是**过拟合（overfitting）**的典型信号，也叫高方差。
        模型把训练集里的噪声也学进去了，所以在没见过的数据上表现差。接下来要看怎么划分数据和怎么加约束。
    cards:
      - title: 训练、验证、测试各管一件事
        body: |
          把数据分成三份：**训练集（training set）**用来拟合参数；**验证集（validation set）**用来选超参数（hyperparameter）、比较模型；
          **测试集（test set）**只在最后报告一次成绩。

          测试集必须一直“锁起来”。如果你反复用测试集调参，等于把答案泄露给了模型选择过程，最后报出的成绩会偏乐观。
          数据少的时候用 **$k$ 折交叉验证（k-fold cross-validation）**：把数据分成 $k$ 份，轮流拿 1 份当验证集、其余 $k-1$ 份训练，
          得到 $k$ 个验证误差取平均；它比单次划分更稳定，也更能用完每一份数据。
      - title: 特征工程：让模型看得见规律
        body: |
          数值特征常做**标准化（standardization）**：
          $$z=\frac{x-\mu}{\sigma},$$
          让不同量纲的特征（比如米和克）走到同一尺度。$\mu$ 和 $\sigma$ 只能从训练集算，再套到验证集和测试集上，否则测试集的信息会漏进训练。
          分箱（binning）把连续值切成区间；多项式特征（polynomial features）让线性模型能表达曲线，特征交叉（feature crosses）让它能表达特征之间的交互。

          分类特征不能直接当数字用：把城市编码成 1、2、3 会让模型以为“3 比 1 大”。**独热编码（one-hot encoding）**给每个类别一个 0/1 单元，
          城市 A、B、C 分别变成 $(1,0,0)$、$(0,1,0)$、$(0,0,1)$。类别很多时，独热会变得很宽，可以用嵌入（embedding）或特征哈希压到低维。
      - title: 过拟合、欠拟合与对策
        body: |
          看两条误差：训练误差低、验证误差高，是过拟合（overfitting，高方差 high variance）；两条都高，是欠拟合（underfitting，高偏差 high bias），说明模型连训练数据都没学好。

          缓解过拟合的常见办法：增加训练数据或做数据增强（data augmentation）；加**正则化（regularization）**，例如 L2 惩罚大的权重或用 dropout；
          降低模型复杂度；**早停（early stopping）**，在验证误差开始上升时停下；也可以做特征选择，去掉噪声特征。
          如果模型欠拟合，则相反：换更大的模型、加更有用的特征，或者减小正则化强度。
    items:
      - id: test-size
        type: number
        prompt: 1000 条数据按 70% / 15% / 15% 分成训练、验证、测试三份。测试集有多少条？
        answer: 150
        hint: 先算 1000 的 15% 是多少。
        explain: |
          $1000\times15\%=150$，验证集也是 150 条，训练集是 700 条。
          三份加起来正好 1000 条，划分时不能重叠。
      - id: standardize-value
        type: number
        prompt: |
          某个特征的训练集均值是 10、标准差是 2。用 $z=(x-\mu)/\sigma$ 标准化，原始值 14 会变成多少？
        answer: 2
        hint: 先做减法，再除以标准差。
        explain: |
          $(14-10)/2=2$，表示这个值比均值高两个标准差。
          这里的 $\mu$ 和 $\sigma$ 必须来自训练集，验证集和测试集只能套用同一组值。
      - id: one-hot-choice
        type: choice
        prompt: 城市有 A、B、C 三个取值，用独热编码，下面哪一组编码是对的？
        options:
          - { text: "A → (1,0,0)，B → (0,1,0)，C → (0,0,1)", correct: true }
          - { text: "A → 1，B → 2，C → 3", why: 这样编码暗示了大小和顺序，模型会以为 C 离 A 比 B 离 A 更远 }
          - { text: "三个城市都用 (0,0,0)", why: 三者完全一样，模型无法区分它们 }
        explain: |
          独热编码让每个类别占一个位置，任意两个不同类别的距离都相同，不会引入虚假的顺序。
          代价是维度等于类别数；类别成千上万时要考虑嵌入或哈希。
      - id: kfold-size
        type: number
        prompt: 有 500 个样本，做 5 折交叉验证。每一折里验证集有多少个样本？
        answer: 100
        hint: 五折就是把数据平均分成五份，每份轮流当验证集。
        explain: |
          $500/5=100$。每一轮用 100 个样本验证、400 个训练，五轮下来每个样本都当过一次验证样本，最后把五个验证误差平均。
      - id: overfit-wrong
        type: choice
        prompt: 模型已经过拟合，下面哪个做法会让情况更糟？
        options:
          - { text: 增加模型的层数和参数, correct: true }
          - { text: 收集更多训练数据, why: 更多数据能稀释对噪声的记忆，通常缓解过拟合 }
          - { text: 加 L2 正则化, why: 正则化限制权重大小，能降低方差 }
          - { text: 用验证误差做早停, why: 在验证误差回升前停下，避免继续拟合噪声 }
        explain: |
          过拟合的模型已经太复杂，再增加容量只会更容易记住训练集的噪声。
          其余三项分别从数据、参数约束和训练时长三个方向降低方差，都是常见对策。

boss:
  items:
    - id: boss-slope
      type: number
      prompt: |
        数据 $(1,1),(2,3),(3,2),(4,5)$，模型 $\hat y=wx+b$。用最小二乘（正规方程）求出的 $w$ 是多少？
      answer: 1.1
      tolerance: 0.001
      hint: $\bar x=2.5$，$\bar y=2.75$，$S_{xy}=5.5$，$S_{xx}=5$，斜率是 $S_{xy}/S_{xx}$。
      explain: |
        $w=\frac{S_{xy}}{S_{xx}}=\frac{5.5}{5}=1.1$，$b=\bar y-w\bar x=2.75-1.1\times2.5=0$。
        这条直线是 $\hat y=1.1x$，它让四个点的误差平方和最小。
    - id: boss-cluster
      type: number
      prompt: |
        一维数据 $1,2,3,10,11,12$，$k=2$，初始中心为 $1$ 和 $2$。k-means 收敛后，较大的那个中心是多少？
      answer: 11
      hint: 第一轮先把点分给最近的中心，再用组内均值更新。
      explain: |
        第一轮：$1$ 归中心 $1$，其余归中心 $2$，新中心为 $1$ 和 $7.6$。
        第二轮：$1,2,3$ 归第一个中心，$10,11,12$ 归第二个，新中心为 $2$ 和 $11$；第三轮分配不变，收敛。
    - id: boss-pca
      type: number
      prompt: |
        协方差矩阵 $\Sigma=\begin{bmatrix}2&1\\1&2\end{bmatrix}$。第一主成分解释了总方差的多少？（填 0 到 1 之间的小数）
      answer: 0.75
      tolerance: 0.001
      hint: 特征值是 3 和 1，比例是最大的特征值除以它们的和。
      explain: |
        特征值 $3$ 和 $1$，总方差 $3+1=4$，所以第一主成分解释 $3/4=0.75$，即 75%。
        第一主成分方向是 $(1,1)/\sqrt2$，第二主成分 $(1,-1)/\sqrt2$ 解释剩下的 25%。
