skill: M.1.1
version: 1
authors: [pi-calc]
brief:
  why: |
    微积分研究“变化”和“无限逼近”。极限是把“越来越接近”变成精确数学的第一步：没有它，导数、积分、概率里的连续分布都无从定义。
    这一关从数列和函数在一点附近的行为出发，走过无穷小的比较、连续性，最后到达闭区间上连续函数的几条保命性质。
    它们看起来抽象，其实回答的都是很具体的问题：曲线会不会穿过某条水平线？函数一定有最大值吗？靠近 0 时谁下降得更快？
  outcomes:
    - 用数值表和图像估计数列、函数在一点或无穷远处的极限，并说清极限与函数值无关
    - 判断两个无穷小谁更快趋于 0，会用等价无穷小做乘除替换
    - 用“极限等于函数值”判断连续性，认出可去、跳跃、无穷三类间断
    - 说出介值定理与最值定理的条件，并用它们判断方程有根、函数有最值
lessons:
  - id: limits
    chapter: 数列与函数极限
    title: 越来越近，近到什么程度
    minutes: 9
    warmup:
      id: guess
      type: choice
      prompt: |
        $n$ 越来越大时，$\frac{1}{n}$ 会怎样？
      options:
        - text: 最终等于 $0$
          why: 对每个具体的 $n$，$\frac{1}{n}$ 都是正数，永远不会等于 0
        - text: 无限接近 $0$，但永远不等于 $0$
          correct: true
        - text: 变成负数
          why: $n$ 是正整数，$\frac{1}{n}$ 始终为正
      explain: |
        对每个具体的 $n$，$\frac{1}{n}$ 都是正数；但 $n$ 越大它越小，可以比任何正数还小。
        极限描述的是这种“最终能任意接近”的趋势，而不是某一项真的取到了那个值。所以 $\lim_{n\to\infty}\frac1n=0$，尽管没有任何一项等于 0。
    cards:
      - title: 先把 n 代进去看
        body: |
          数列（sequence）是一串按顺序排好的数 $a_1,a_2,a_3,\dots$。想知道 $n$ 很大时它趋向哪里，最直接的办法是代入越来越大的 $n$：

          | $n$ | 1 | 10 | 100 | 1000 |
          |---|---|---|---|---|
          | $\frac{3n^2-n}{2n^2+5}$ | 0.2857 | 1.4146 | 1.4946 | 1.4995 |

          数字越来越靠近 $1.5$。分子分母的最高次都是 $n^2$，把上下同除以 $n^2$ 得 $\frac{3-1/n}{2+5/n^2}$；当 $n\to\infty$ 时 $1/n$ 和 $5/n^2$ 都趋于 0，于是极限是 $\frac32$。

          记作 $\lim_{n\to\infty}a_n=\frac32$：它不是“某一项等于 1.5”，而是“想要多接近 1.5，都能在足够靠后找到项”。
      - title: 函数在一点附近做什么
        body: |
          函数极限看的是 $x$ 靠近 $a$（但不必等于 $a$）时 $f(x)$ 的去向。$f(x)=\frac{x^2-4}{x-2}$ 在 $x=2$ 没有定义，可是：

          | $x$ | 1.9 | 1.99 | 2.01 | 2.1 |
          |---|---|---|---|---|
          | $f(x)$ | 3.9 | 3.99 | 4.01 | 4.1 |

          只要 $x\ne2$ 就可以约分：$\frac{x^2-4}{x-2}=x+2$，所以 $\lim_{x\to2}f(x)=4$。这个极限和 $f(2)$ 存不存在完全无关，图像上只是留了一个“洞”。

          $\varepsilon$-$\delta$ 只是把“想要多近”说精确：对任意 $\varepsilon>0$，都能找到 $\delta>0$，使 $0<|x-a|<\delta$ 时 $|f(x)-L|<\varepsilon$。例如 $\lim_{x\to2}(3x+1)=7$：要让 $|(3x+1)-7|<\varepsilon$，只要 $|x-2|<\varepsilon/3$，取 $\delta=\varepsilon/3$ 就够了。这里看懂意思即可，不需要写证明。
        sim:
          name: plot
          params: {mode: limit, f: "(x^2-4)/(x-2)", a: 2}
      - title: 极限怎么算，什么时候不存在
        body: |
          极限满足四则运算：若 $\lim f=A$、$\lim g=B$，则 $\lim(f\pm g)=A\pm B$，$\lim(fg)=AB$，当 $B\ne0$ 时 $\lim(f/g)=A/B$。遇到 $\frac00$ 不能直接除，要先约分或有理化。

          左极限和右极限都存在且相等，极限才存在。$f(x)=\frac{|x|}{x}$ 在 $x=0$ 左侧是 $-1$、右侧是 $1$，所以极限不存在。

          $x\to0$ 时 $\sin\frac1x$ 在 $-1$ 和 $1$ 之间来回振荡，也没有极限；但 $x\sin\frac1x$ 被夹在 $-|x|$ 和 $|x|$ 之间，随 $x\to0$ 被压向 0。
    items:
      - id: sim-sinx
        type: sim
        sim: plot
        prompt: |
          让点越来越靠近 $x=0$，观察 $\frac{\sin x}{x}$ 的值，然后填出它的极限。
        params: {mode: limit, f: "sin(x)/x", a: 0}
        goal: {value: 1, tol: 0.001}
        solution: {guess: 1}
        hint: 试试 $x=0.1$、$0.01$、$0.001$，看比值靠近哪个数。
        explain: |
          用弧度制时 $\lim_{x\to0}\frac{\sin x}{x}=1$。$x=0.1$ 时比值约 0.9983，$x=0.01$ 时约 0.99998，越来越靠近 1。
          注意 $x=0$ 时 $\frac00$ 没有定义，极限说的是 $x\ne0$ 而不断靠近 0 的过程。
      - id: seq-limit
        type: number
        prompt: |
          $\lim_{n\to\infty}\frac{3n^2-n}{2n^2+5}$ 等于多少？
        answer: 1.5
        tolerance: 0.001
        hint: 分子分母同除以 $n^2$，再看 $1/n$ 和 $1/n^2$ 的去向。
        explain: |
          上下同除以 $n^2$：$\frac{3-1/n}{2+5/n^2}$。$n\to\infty$ 时 $1/n\to0$、$5/n^2\to0$，所以极限是 $\frac32=1.5$。
          也可以只比较最高次项的系数：$\frac32$。
      - id: hole
        type: choice
        prompt: |
          $f(x)=\frac{x^2-4}{x-2}$，$f(2)$ 没有定义。$\lim_{x\to2}f(x)$ 是什么？
        options:
          - text: "$4$"
            correct: true
          - text: 不存在，因为 $f(2)$ 没有定义
            why: 极限只看 $x$ 靠近 2 时 $f(x)$ 的去向，不要求 $f(2)$ 存在
          - text: "$0$"
            why: 分子在 $x=2$ 时为 0，但分母也同时为 0；约分后是 $x+2$，不是 0
        explain: |
          $x\ne2$ 时 $\frac{x^2-4}{x-2}=x+2$，所以 $x\to2$ 时函数值趋向 $2+2=4$。
          $f(2)$ 有没有定义是另一件事；图像在 $x=2$ 处是一个“洞”。
      - id: simplify
        type: number
        prompt: |
          $\lim_{x\to3}\frac{x^2-9}{x-3}$ 等于多少？
        answer: 6
        tolerance: 0.001
        hint: 把分子分解成 $(x-3)(x+3)$，再约掉公因子。
        explain: |
          $x\ne3$ 时 $\frac{x^2-9}{x-3}=x+3$，代入 $x=3$ 得 6。这类 $\frac00$ 的极限，先化简再代入。
      - id: no-limit
        type: choice
        prompt: 下面哪个极限不存在？
        options:
          - text: '$\lim_{x\to0}\sin\frac1x$'
            correct: true
          - text: '$\lim_{x\to0}x\sin\frac1x$'
            why: 它被夹在 $-|x|$ 与 $|x|$ 之间，两边都趋于 0，所以极限是 0
          - text: '$\lim_{x\to1}\frac{x^2-1}{x-1}$'
            why: 约分后是 $x+1$，代入得 2
        explain: |
          $x\to0$ 时 $\frac1x$ 越来越大，$\sin\frac1x$ 在 $-1$ 和 $1$ 之间反复振荡，不会稳定靠近任何数，所以极限不存在。
          乘上一个趋于 0 的 $x$ 后，振荡被压平，极限才变成 0。

  - id: infinitesimals
    chapter: 无穷小
    title: 谁更快变成 0
    minutes: 8
    warmup:
      id: guess
      type: choice
      prompt: |
        $x\to0$ 时 $x$ 和 $x^2$ 都趋于 0。哪一个“更快”地变成 0？
      options:
        - text: $x$
          why: 取 $x=0.1$，$x$ 是 0.1，而 $x^2$ 只有 0.01；$x$ 反而更大
        - text: $x^2$
          correct: true
        - text: 一样快
          why: 两者的比值 $\frac{x^2}{x}=x$ 还趋于 0，说明 $x^2$ 缩小得更快
      explain: |
        $x^2$ 更快。$x=0.1$ 时 $x^2=0.01$，$x=0.01$ 时 $x^2=0.0001$；$x^2$ 总是 $x$ 再乘一个很小的 $x$。
        用比值看：$\frac{x^2}{x}=x\to0$，所以 $x^2$ 是比 $x$ 高阶的无穷小。
    cards:
      - title: 无穷小不是“很小的数”
        body: |
          当 $x\to0$ 时，$x$、$x^2$、$\sin x$、$1-\cos x$、$\tan x$ 都趋于 0，这类“极限为 0 的量”叫无穷小（infinitesimal）。
          它描述的是一个过程，不是一个固定的、特别小的数：$10^{-100}$ 是一个很小的数，但作为常数它的极限是它自己，不是 0。

          相应地，若 $|g(x)|$ 可以任意大，就说它趋于无穷大；$x\to0^+$ 时 $\frac1x\to+\infty$。无穷大不是数，不能拿来做普通的四则运算。
      - title: 比一比谁更快
        body: |
          设 $\alpha,\beta$ 都是 $x\to a$ 时的无穷小，看比值 $\frac{\beta}{\alpha}$：

          - 比值趋于 0：$\beta$ 比 $\alpha$ 高阶（更快变小），记 $\beta=o(\alpha)$，例如 $\frac{x^2}{x}=x\to0$。
          - 比值趋于非零常数 $c$：两者同阶，例如 $\frac{1-\cos x}{x^2}\to\frac12$。
          - 比值趋于 1：两者等价，记 $\alpha\sim\beta$，例如 $\frac{\sin x}{x}\to1$，所以 $\sin x\sim x$。

          同阶说明“变小速度是同一个量级”，等价说明“两者的比值越来越接近 1，乘除时可以直接互换”。
      - title: 常用的等价无穷小
        body: |
          当 $x\to0$ 时：
          $$\sin x\sim x,\quad \tan x\sim x,\quad 1-\cos x\sim\frac{x^2}{2},\quad e^x-1\sim x,\quad \ln(1+x)\sim x,\quad (1+x)^a-1\sim ax.$$

          这些在**乘除**里可以直接替换，例如 $\frac{\sin 3x}{x}=\frac{\sin 3x}{3x}\cdot3\to3$。
          **加减**里不能随便换：$x-\sin x$ 中把 $\sin x$ 换成 $x$ 会得到 0，但真实极限是 $\frac{x-\sin x}{x^3}\to\frac16$——两个 $x$ 抵消后，剩下的是更细的 $x^3$ 项。
    items:
      - id: one-minus-cos
        type: number
        prompt: |
          求 $\lim_{x\to0}\frac{1-\cos x}{x^2}$。
        answer: 0.5
        tolerance: 0.001
        hint: 用半角公式 $1-\cos x=2\sin^2\frac x2$，再把 $\sin^2\frac x2$ 与 $\left(\frac x2\right)^2$ 比一比。
        explain: |
          $1-\cos x=2\sin^2\frac x2$，所以
          $$\frac{1-\cos x}{x^2}=2\cdot\left(\frac{\sin(x/2)}{x/2}\right)^2\cdot\frac14\to2\cdot1^2\cdot\frac14=\frac12.$$
          也就是说 $1-\cos x\sim\frac{x^2}{2}$：它和 $x^2$ 同阶，但比值是 $\frac12$ 而不是 1。
      - id: order
        type: choice
        prompt: |
          当 $x\to0$ 时，$1-\cos x$ 与 $x^2$ 的关系是？
        options:
          - text: 同阶，比值趋于 $\frac12$
            correct: true
          - text: 等价，比值趋于 1
            why: 等价要求比值趋于 1；这里的比值是 $\frac12$，所以只是同阶
          - text: 前者是后者的高阶无穷小
            why: 高阶无穷小要求比值趋于 0；这里比值趋于 $\frac12$，不是 0
        explain: |
          比值趋于非零常数 $\frac12$，所以两者同阶但不等价。等价的是 $1-\cos x$ 与 $\frac{x^2}{2}$，不是与 $x^2$ 本身。
      - id: sim-exp
        type: sim
        sim: plot
        prompt: |
          让 $x$ 靠近 0，观察 $\frac{e^x-1}{x}$ 的值，然后填出极限。
        params: {mode: limit, f: "(exp(x)-1)/x", a: 0}
        goal: {value: 1, tol: 0.001}
        solution: {guess: 1}
        hint: 试 $x=0.1$、$0.01$、$0.001$，看比值靠近哪个数。
        explain: |
          $x=0.1$ 时 $\frac{e^{0.1}-1}{0.1}\approx1.0517$，$x=0.01$ 时约 $1.0050$，越来越靠近 1。
          这就是等价无穷小 $e^x-1\sim x$：在 0 附近，$e^x$ 的切线斜率是 1，所以 $e^x\approx1+x$。
      - id: sqrt
        type: number
        prompt: |
          求 $\lim_{x\to0}\frac{\sqrt{1+x}-1}{x}$。
        answer: 0.5
        tolerance: 0.001
        hint: 分子有理化：上下同乘 $\sqrt{1+x}+1$。
        explain: |
          $$\frac{\sqrt{1+x}-1}{x}=\frac{(1+x)-1}{x\left(\sqrt{1+x}+1\right)}=\frac{1}{\sqrt{1+x}+1}\to\frac{1}{1+1}=\frac12.$$
          这也符合 $(1+x)^a-1\sim ax$ 在 $a=\frac12$ 时的情形。
      - id: add-trap
        type: choice
        prompt: |
          有人算 $\lim_{x\to0}\frac{x-\sin x}{x^3}$ 时，把 $\sin x$ 换成 $x$，得到 0。错在哪？
        options:
          - text: 加减中不能直接用等价无穷小替换；两个 $x$ 抵消后要看更高阶的项
            correct: true
          - text: $\sin x$ 与 $x$ 不等价
            why: 它们确实等价，但等价替换只保证乘除，不保证加减
          - text: 极限其实等于 0，只是过程写错了
            why: 真实极限是 $\frac16$，不是 0
        explain: |
          等价替换 $\sin x\sim x$ 会给出 $x-x=0$，把真正起作用的项丢掉了。实际上 $x-\sin x\sim\frac{x^3}{6}$，所以比值趋于 $\frac16$。
          加减法里要保留到抵消之后仍然存在的最高阶项。

  - id: continuity
    chapter: 连续性
    title: 一笔画过去
    minutes: 8
    warmup:
      id: guess
      type: choice
      prompt: |
        一个函数在某点有定义，并且那里的极限存在。它就一定连续吗？
      options:
        - text: 一定
          why: 还差一个条件：极限必须正好等于函数值
        - text: 不一定，还要极限等于函数值
          correct: true
        - text: 一定不
          why: 很多函数三条都满足，比如多项式在所有点都连续
      explain: |
        连续要求三件事同时成立：函数在该点有定义、极限存在、极限等于函数值。
        只满足前两条时，图像上可能只是一个“洞”，补上或改掉那一点的值就能变连续。
    cards:
      - title: 连续的定义
        body: |
          设 $f$ 在 $a$ 附近有定义。如果
          $$\lim_{x\to a}f(x)=f(a),$$
          就说 $f$ 在 $a$ 处连续（continuous）。这句话包含三件事：$f(a)$ 有定义、极限存在、两者相等，缺一不可。

          多项式、$\sin x$、$\cos x$、$e^x$ 在所有点连续；有理函数在分母不为 0 的点连续。
          图像上，连续就是“一笔画过去不用抬笔”。
      - title: 间断的三种样子
        body: |
          间断（discontinuity）有三种常见样子：

          - **可去间断**：极限存在，但函数值没定义或不等于极限，图像上是一个洞。$\frac{x^2-1}{x-1}$ 在 $x=1$ 处极限是 2，补上 $f(1)=2$ 就连续了。
          - **跳跃间断**：左右极限都存在但不相等，图像在这里“跳”一下。
          - **无穷间断**：函数值趋向无穷，例如 $\frac1x$ 在 $x=0$ 附近。

          拖动点靠近 $x=1$，看这个洞是怎么出现的。
        sim:
          name: plot
          params: {mode: limit, f: "(x^2-1)/(x-1)", a: 1}
      - title: 连续函数能直接代入
        body: |
          连续函数的和、差、积、商（分母不为 0）仍连续，复合函数也连续。
          所以对连续函数求极限可以直接代入：$\lim_{x\to2}(x^2+3x-1)=4+6-1=9$。

          遇到 $\frac00$ 时不能直接代入，但这不代表极限不存在；约分后可能得到一个连续的函数，再代入即可。
    items:
      - id: fill-value
        type: number
        prompt: |
          $f(x)=\frac{x^2-16}{x-4}$（$x\ne4$），$f(4)=a$。$a$ 取何值时 $f$ 在 $x=4$ 处连续？
        answer: 8
        tolerance: 0.001
        hint: 先求 $x\to4$ 时的极限：把分子分解成 $(x-4)(x+4)$。
        explain: |
          $x\ne4$ 时 $f(x)=x+4$，所以 $\lim_{x\to4}f(x)=8$。要连续，必须让 $f(4)=a$ 等于这个极限，因此 $a=8$。
      - id: sim-hole
        type: sim
        sim: plot
        prompt: |
          让 $x$ 靠近 3，观察 $\frac{x^2-9}{x-3}$ 的值，填出它在 $x=3$ 处的极限。
        params: {mode: limit, f: "(x^2-9)/(x-3)", a: 3}
        goal: {value: 6, tol: 0.01}
        solution: {guess: 6}
        hint: 约分后是 $x+3$，再代入 $x=3$。
        explain: |
          $x\ne3$ 时 $\frac{x^2-9}{x-3}=x+3$，所以极限是 $3+3=6$。
          函数在 $x=3$ 没定义，但极限存在；把 $f(3)$ 定义为 6，它就变成连续的了。
      - id: removable
        type: choice
        prompt: |
          $f(x)=\frac{x^2-1}{x-1}$（$x\ne1$），并且规定 $f(1)=1$。$f$ 在 $x=1$ 处是哪种间断？
        options:
          - text: 可去间断
            correct: true
          - text: 跳跃间断
            why: 左右极限都存在且都等于 2，并没有跳开
          - text: 无穷间断
            why: $x$ 靠近 1 时函数值靠近 2，没有趋向无穷
        explain: |
          $x\ne1$ 时 $f(x)=x+1$，所以 $\lim_{x\to1}f(x)=2$。极限存在但不等于 $f(1)=1$，这是可去间断；把 $f(1)$ 改成 2 就连续了。
      - id: match-discontinuity
        type: match
        prompt: 把每种情形和它的间断类型连起来。
        pairs:
          - ['$f(x)=\frac1x$ 在 $x=0$', 无穷间断]
          - ['$f(x)=\frac{x^2-1}{x-1}$ 在 $x=1$', 可去间断]
          - ["分段函数在 $x=0$ 左极限 0、右极限 1", 跳跃间断]
        explain: |
          $\frac1x$ 在 0 附近无界，是无穷间断；$\frac{x^2-1}{x-1}$ 的极限存在（等于 2）只是没定义，是可去间断；左右极限不相等则是跳跃间断。
      - id: continuous-at-zero
        type: choice
        prompt: 下面哪个函数在 $x=0$ 处不连续？
        options:
          - text: $f(x)=\frac1x$
            correct: true
          - text: $f(x)=|x|$
            why: $|x|$ 在 0 处有定义，$\lim_{x\to0}|x|=0=|0|$，所以连续
          - text: $f(x)=x^2+1$
            why: 多项式在所有点都连续，在 0 处当然也连续
        explain: |
          $\frac1x$ 在 $x=0$ 没有定义，而且 $x\to0^+$ 时趋向 $+\infty$、$x\to0^-$ 时趋向 $-\infty$，是无穷间断。
          $|x|$ 和 $x^2+1$ 在 0 处都满足“极限等于函数值”。

  - id: compact
    chapter: 紧致区间上的基本性质
    title: 闭区间上的保命性质
    minutes: 9
    warmup:
      id: guess
      type: choice
      prompt: |
        一条连续的曲线从高度 $-1$ 走到高度 $+1$。它一定要经过高度 $0$ 吗？
      options:
        - text: 一定
          correct: true
        - text: 不一定
          why: 只要曲线连续，从负到正中间不能“瞬移”过去
        - text: 只有直线才一定
          why: 弯曲的连续曲线也必须经过中间的每一个高度
      explain: |
        连续意味着高度不能跳变：从 $-1$ 连续地变到 $+1$，途中必须经过 0。
        这正是介值定理的直观版本；它只要求函数在闭区间上连续。
    cards:
      - title: 介值定理：中间的高度都得经过
        body: |
          介值定理（Intermediate Value Theorem）：若 $f$ 在闭区间 $[a,b]$ 上连续，$M$ 严格介于 $f(a)$ 与 $f(b)$ 之间，那么存在 $c\in(a,b)$ 使 $f(c)=M$。

          直观上，连续曲线从一头走到另一头，中间的高度都得经过。用它找根：$g(x)=x^3+x-1$ 连续，$g(0)=-1<0$，$g(1)=1>0$，所以存在 $c\in(0,1)$ 使 $g(c)=0$。

          条件里的“连续”不能丢：$f(x)=\frac1x$ 在 $[-1,1]$ 上不连续（$x=0$ 处断了），$f(-1)=-1$、$f(1)=1$，但在 $[-1,1]$ 上永远取不到 0。
      - title: 最值定理：闭区间才保险
        body: |
          最值定理（Extreme Value Theorem）：若 $f$ 在**闭区间** $[a,b]$ 上连续，那么 $f$ 在 $[a,b]$ 上一定取到最大值和最小值。

          “闭”和“有界”都不能少。$f(x)=\frac1x$ 在 $(0,1]$ 上连续，但 $x\to0^+$ 时 $f\to+\infty$，没有最大值；$(0,1]$ 不是闭区间，所以不违反定理。换成 $[1,2]$，最大值是 $f(1)=1$，最小值是 $f(2)=\frac12$。
          再看 $f(x)=x$ 在 $[0,+\infty)$ 上连续却没有最大值：区间有界也重要。

          定理只保证“存在”，不告诉你在哪里；先确认条件，再谈结论。
      - title: 一致连续：一个 δ 管整段
        body: |
          有界闭区间 $[a,b]$ 也叫紧致区间（compact interval）。还有一个更细的性质叫一致连续（uniform continuity）：整段区间上可以用同一个 $\delta$ 应付所有点——不管在哪个位置，只要两点离得小于 $\delta$，函数值就离得小于事先给定的 $\varepsilon$。

          $f(x)=\frac1x$ 在 $(0,1]$ 上不一致连续：越靠近 0，曲线越陡，同样大小的 $\Delta x$ 会引起越来越大的 $\Delta y$。在 $[1,2]$ 上就不会这样。
          闭区间上的连续函数一定一致连续，这是“紧致”带来的好处；这里只要知道直观意思。
    items:
      - id: bisect-root
        type: number
        prompt: |
          用介值定理知道 $x^3+x-1=0$ 在 $(0,1)$ 内有根。试算找出这个根，误差不超过 $0.01$。
        answer: 0.6823
        tolerance: 0.01
        hint: 算 $g(0.6)$ 和 $g(0.7)$，看零点落在哪一半，再继续二分。
        explain: |
          $g(0.6)=0.216+0.6-1=-0.184$，$g(0.7)=0.343+0.7-1=0.043$，所以根在 0.6 和 0.7 之间。
          继续试 $g(0.68)=-0.0056$、$g(0.69)=0.0185$，根约为 $0.682$。这种每次把区间折半的方法叫二分法。
          又因为 $g'(x)=3x^2+1>0$，$g$ 严格递增，所以这个根是唯一的。
      - id: open-interval
        type: choice
        prompt: |
          $f(x)=x$ 在开区间 $(0,1)$ 上没有最大值。这违反最值定理吗？
        options:
          - text: 不违反，因为 $(0,1)$ 不是闭区间
            correct: true
          - text: 违反，连续函数就应该有最大值
            why: 最值定理的前提是闭区间 $[a,b]$，开区间不满足前提
          - text: 不违反，因为 $f(x)=x$ 不连续
            why: $f(x)=x$ 是多项式，处处连续；问题出在区间不是闭的
        explain: |
          $x$ 在 $(0,1)$ 上可以任意接近 1 但永远取不到 1，也可以任意接近 0 但取不到 0，所以既没有最大值也没有最小值。
          最值定理要求闭区间 $[a,b]$，前提不成立，就不能套用结论。
      - id: evt-conditions
        type: choice
        prompt: 下面哪组条件能保证函数在区间上一定取到最大值？
        options:
          - text: 在闭区间 $[a,b]$ 上连续
            correct: true
          - text: 在开区间 $(a,b)$ 上连续
            why: 例如 $x$ 在 $(0,1)$ 上连续，却没有最大值
          - text: 在闭区间 $[a,b]$ 上有界
            why: 有界还不够；例如 $f(x)=x$（$x<1$）、$f(1)=0$ 在 $[0,1]$ 上有界，却取不到上确界 1
        explain: |
          最值定理的条件是“闭区间 + 连续”。只有连续，开区间可能取不到端点值；只有有界，函数可能不连续，最大值也未必能取到。
      - id: ivt-counterexample
        type: choice
        prompt: |
          $f(x)=\frac1x$ 在 $[-1,1]$ 上（$x=0$ 除外）满足 $f(-1)=-1$、$f(1)=1$，却取不到 0。这说明什么？
        options:
          - text: 介值定理还要求函数在闭区间上连续，而 $\frac1x$ 在 0 处不连续
            correct: true
          - text: 介值定理是错的
            why: 定理有前提；这里前提不满足，不能拿它当反例
          - text: 因为 $f$ 不是单调函数
            why: 单调性与介值定理无关；$\frac1x$ 在 $[-1,0)$ 和 $(0,1]$ 上其实都是递减的
        explain: |
          介值定理的前提是“在闭区间上连续”。$\frac1x$ 在 $x=0$ 没有定义，图像在那里断开，函数值从 $-\infty$ 跳到 $+\infty$，所以完全可以跳过 0。

boss:
  items:
    - id: sin3x
      type: number
      prompt: |
        $\lim_{x\to0}\frac{\sin 3x}{x}$ 等于多少？
      answer: 3
      tolerance: 0.01
      hint: 把 $\sin 3x$ 写成 $3x\cdot\frac{\sin 3x}{3x}$。
      explain: |
        $\frac{\sin 3x}{x}=3\cdot\frac{\sin 3x}{3x}$。$x\to0$ 时 $3x\to0$，而 $\frac{\sin u}{u}\to1$，所以极限是 $3\cdot1=3$。
        也可以直接用等价无穷小 $\sin 3x\sim3x$。
    - id: continuity-a
      type: number
      prompt: |
        $f(x)=\frac{x^2-4}{x-2}$（$x\ne2$），$f(2)=a$。$a$ 取何值时 $f$ 在 $x=2$ 处连续？
      answer: 4
      tolerance: 0.001
      hint: 先求 $x\to2$ 的极限，再让 $a$ 等于它。
      explain: |
        $x\ne2$ 时 $f(x)=x+2$，所以 $\lim_{x\to2}f(x)=4$。连续要求 $f(2)=a$ 等于这个极限，因此 $a=4$。
    - id: evt-1overx
      type: choice
      prompt: |
        $f(x)=\frac1x$ 在 $(0,1]$ 上没有最大值。为什么这不违反闭区间上连续函数的最值定理？
      options:
        - text: 因为 $(0,1]$ 不是闭区间，定理的前提不成立
          correct: true
        - text: 因为 $\frac1x$ 在 $(0,1]$ 上不连续
          why: 它在 $(0,1]$ 的每一点都连续，问题出在区间左端不是闭的
        - text: 因为最大值在无穷远处取到
          why: 区间里没有“无穷远”这个点，而且 $\frac1x$ 在 $(0,1]$ 上无界
      explain: |
        最值定理要求函数在闭区间 $[a,b]$ 上连续。$(0,1]$ 不是闭区间，而且 $x\to0^+$ 时 $\frac1x\to+\infty$，所以没有最大值并不矛盾。
        换成 $[1,2]$，最大值为 $f(1)=1$，最小值 $f(2)=\frac12$，定理就成立了。



