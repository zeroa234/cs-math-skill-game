skill: C.3.2
version: 1
authors: [content-author]
brief:
  why: |
    打开一个网页只要几百毫秒，这期间你的电脑把请求切成小包，交给了四层协议、好几个路由器，还要先问 DNS 名字对应哪个地址。懂一点网络，你才能解释页面为什么慢、连接为什么被重置、视频为什么宁可花屏也不卡住，也才看得懂抓包工具里那些头部字段。整个技能沿着“一次真实请求”走一遍：分层与 IP/TCP、路由、拥塞控制、名称系统与应用协议。
  outcomes:
    - 说出打开网页时 HTTP 报文依次被加上哪些头部，以及每一层各自负责什么
    - 用前缀长度算出子网的网络地址、广播地址和可用主机数，并把掩码写成二进制
    - 排出 TCP 三次握手的顺序，解释为什么不能只握手两次
    - 按 cwnd 与 ssthresh 的规则算出每个 RTT 的发送窗口，区分超时与重复 ACK 两种拥塞信号
    - 用 Dijkstra 在带权图上算出最短距离和下一跳，说出链路状态与距离向量的区别
    - 排出 DNS 解析的顺序，解释 TCP 套接字为什么没有消息边界
lessons:
  - id: layers-ip-transport
    chapter: 链路/IP/TCP/UDP
    title: 打开一个网页，数据怎么出门
    minutes: 10
    warmup:
      id: guess-port
      type: choice
      prompt: 同一个 Wi-Fi 下，你的电脑同时开着浏览器和游戏。服务器回给你的数据包到达网卡后，操作系统凭什么知道这一包该交给浏览器还是游戏？
      options:
        - text: 看数据包里的目的端口号
          correct: true
        - text: 看数据包里的目的 IP 地址
          why: 目的 IP 通常就是你这一台电脑的地址，浏览器和游戏共用它，靠它分不开两个程序
        - text: 看数据包里的目的 MAC 地址
          why: 一块网卡只有一个 MAC 地址，所有程序共用，它只能区分“哪台机器”而不是“哪个程序”
      explain: |
        一台电脑上可以同时跑很多程序，它们共用同一个 IP 地址和同一块网卡。传输层给每个程序分配**端口号（port）**，数据包到达后，操作系统按目的端口把数据交给对应的进程。浏览器的端口是连接时临时分配的，服务器的端口是固定的（HTTP 80、HTTPS 443），所以服务器那一端才需要靠四元组把不同客户端区分开。
    cards:
      - title: 四层信封：一次请求被层层包起来
        body: |
          在地址栏敲下网址回车，浏览器先要用 DNS 把域名换成 IP 地址，再向那个地址的 443 端口（纯 HTTP 站点是 80）建立 TCP 连接，然后才发送一条 HTTP 请求。请求离开电脑前，会被一层层加上头部：

          - **应用层（application layer）**：HTTP 报文本身，例如 `GET /index.html HTTP/1.1` 加几个头部字段。
          - **传输层（transport layer）**：加 TCP 头，写明源端口、目的端口、序号、确认号。
          - **网络层（network layer）**：加 IP 头，写明源 IP、目的 IP、TTL（这个包还能经过几跳）。
          - **链路层（link layer）**：加以太网帧头（源 MAC、目的 MAC）和帧尾（FCS 校验），交给网卡发出去。

          服务器收到后反过来逐层拆开，把 HTTP 报文交给 Web 服务器进程，这叫**封装（encapsulation）**与解封装。分层的好处是每层只管一件事：从网线换成 Wi-Fi，只动链路层，TCP 和 HTTP 一行都不用改。
      - title: IP 地址、前缀与子网
        body: |
          IPv4 地址是 32 位数，习惯写成四段十进制（点分十进制），每段 0–255，例如 192.168.10.77。斜线后面的数字叫**前缀长度（prefix length）**，表示前多少位是网络号：`/26` 表示前 26 位定网络，剩下 6 位定主机，一块有 $2^6 = 64$ 个地址。

          一个子网里，主机位全 0 的那个地址是**网络地址（network address）**，主机位全 1 的是**广播地址（broadcast address）**，两者都不能分给主机，所以 /26 有 $64 - 2 = 62$ 个可用地址。把前缀写成 1/0 就是**掩码（netmask）**：/26 → 255.255.255.192，最后一个字节 $11000000_2 = 192$。

          不同子网之间的转发交给路由器；在同一段链路上，网卡先用 **ARP** 把下一跳的 IP 问出对应的 MAC 地址，再把帧发给它。下面的 8 位寄存器可以先练手：每一位都点亮就是 255，也就是 /24 掩码的最后一个字节。
        sim:
          name: bits
          params: { bits: 8, signed: false, start: 0 }
      - title: TCP、UDP、端口与握手
        body: |
          **TCP** 提供可靠的、按序的字节流：每个字节有序号，收到要确认（ACK），丢了就重传，还带流量控制和拥塞控制。**UDP** 只做多路复用和一点校验，不保证送达、不保证顺序，开销小、延迟低，适合语音、视频和 DNS 这种“重发也来不及”的场合。

          端口号是 16 位，共 65536 个（0–65535）。一条 TCP 连接由**四元组**（源 IP、源端口、目的 IP、目的端口）唯一确定；服务器 `accept` 出来的那条连接，就是靠这个四元组找到对应的缓冲区。

          建立连接要**三次握手（three-way handshake）**：客户端发 SYN（带初始序号 x），服务器回 SYN-ACK（序号 y、确认 x+1），客户端再回 ACK（确认 y+1）。关闭时通常要**四次挥手（four-way teardown）**：一方发 FIN，对方先回 ACK，等自己的数据也发完了再发 FIN，最后再回一个 ACK——因为 TCP 是全双工的，两个方向要各自关。
    items:
      - id: layer-match
        type: match
        prompt: 把 TCP/IP 分层的每一层和它负责的事、代表协议连起来。
        pairs:
          - ["应用层", "直接为程序服务：HTTP、DNS"]
          - ["传输层", "端到端传输，用端口区分程序：TCP、UDP"]
          - ["网络层", "寻址与逐跳转发：IP、ICMP"]
          - ["链路层", "相邻节点之间传帧：以太网、Wi-Fi"]
        explain: |
          应用层产生和解释报文，传输层负责端到端的可靠性或多路复用，网络层负责把包送到目的主机（跨过很多路由器），链路层只负责把帧交给**相邻**的下一台设备。同一个 HTTP 请求往下走时会依次被加上 TCP 头、IP 头、以太网帧头，每层只读自己那一层的头部。
      - id: mask-26-sim
        type: sim
        sim: bits
        prompt: /26 的掩码写成点分十进制是 255.255.255.x。把最后一个字节 x 用二进制拨出来（每一位代表 128、64、32 … 2、1 中的一个）。
        params: { bits: 8, signed: false, start: 0 }
        goal: { value: 192 }
        solution: [1, 1, 0, 0, 0, 0, 0, 0]
        explain: |
          /26 表示前 26 位是 1：三个字节 24 位，再加 2 位，所以最后一个字节是 $11000000_2 = 128 + 64 = 192$，掩码为 255.255.255.192。主机号剩 6 位，一块 64 个地址，去掉网络地址和广播地址后能分给 62 台主机。
      - id: hosts-26
        type: number
        prompt: 主机地址 192.168.10.77 配上前缀 /26，这个子网能分给主机使用的地址有多少个？
        answer: 62
        unit: 个
        hint: 主机号有几位？2 的那么多次方，再减掉两个特殊地址。
        explain: |
          /26 的主机号是 6 位，$2^6 = 64$ 个地址。主机位全 0 的 192.168.10.64 是网络地址，全 1 的 192.168.10.127 是广播地址，都不能给主机，所以可用地址是 62 个，范围是 .65 到 .126。192.168.10.77 正好落在里面。
      - id: handshake-order
        type: order
        prompt: 把 TCP 三次握手的报文排成正确顺序。
        steps:
          - "客户端发 SYN，报头里带自己的初始序号 seq = x"
          - "服务器回 SYN-ACK，序号 seq = y，确认号 ack = x + 1"
          - "客户端回 ACK，确认号 ack = y + 1，连接建立，双方开始发数据"
        explain: |
          三次握手要让双方都确认两件事：对方能收到我的报文、我的初始序号被对方记住了。服务器发出 SYN-ACK 后还不知道客户端收没收到，所以要有第三个 ACK。只握手两次的话，网络里滞留的旧 SYN 可能让服务器单方面建立一条客户端根本不知道的连接，白白占着资源。
      - id: socket-four-tuple
        type: choice
        prompt: 一台 Web 服务器同时保持上万条 TCP 连接，所有连接的目的端口都是 443。它靠什么判断某个到达的 TCP 分段属于哪一条连接？
        options:
          - text: "看四元组：源 IP、源端口、目的 IP、目的端口"
            correct: true
          - text: 看客户端的 MAC 地址
            why: MAC 地址只在同一段链路上有效，包每经过一个路由器，帧头就被换成下一跳的 MAC，服务器根本看不到客户端的原始 MAC
          - text: 看 HTTP 请求里的 User-Agent
            why: HTTP 头部在连接建立之后才到达，太晚了；而且内容可以随便伪造，不能当连接标识
        explain: |
          目的端口都相同，区分靠的是另外三项：每个客户端的内核会随机分配一个源端口，加上源 IP，就构成了不同的四元组。操作系统为每条连接维护一个 socket，收到分段时按四元组找到它，把数据放进对应的接收缓冲区，再唤醒阻塞在 `recv` 上的进程。这也是为什么服务器的 443 端口能被上万个客户端同时使用。

  - id: routing
    chapter: 路由
    title: 每一跳怎么决定下一步
    minutes: 10
    warmup:
      id: guess-hop
      type: choice
      prompt: 你从家里访问一台在日本的服务器。数据包经过的第一个路由器，怎么知道下一步该往哪里发？
      options:
        - text: 用目的 IP 查自己的转发表，选前缀匹配最长的那一条
          correct: true
        - text: 出发前就把整条路径写进包里，沿途照单走
          why: 这叫源路由，IP 的常规做法不是这样；包只带目的地址，每一跳各自决定下一步
        - text: 问 DNS 服务器该往哪走
          why: DNS 只把域名翻译成 IP 地址，不管数据包怎么走
      explain: |
        IP 包只写明目的地址，不写路线。每台路由器维护一张**转发表（forwarding table）**，按目的地址查表，选一条出链路交给下一跳。表是从哪来的、怎么保证没环路，是**路由协议**要解决的问题；查表转发本身则简单到可以用硬件做。
    cards:
      - title: 转发：查表、改帧头、交给下一跳
        body: |
          你的包从家里出发，经过家用路由器、运营商的好几台路由器，才到服务器所在的机房。每一台路由器只做三步：收下帧、按目的 IP 查转发表、把包重新封装成下一段链路的帧发出去。

          转发表的一行是“前缀 → 下一跳/出接口”。一个目的地址可能同时匹配好几行，这时选**前缀最长**的那条，因为它描述的范围最小、最精确。例如目的地址 192.168.6.7 同时匹配 192.168.0.0/16、192.168.4.0/22 和老老实实的 192.168.6.0/24，就选 /24。

          IP 头沿途基本不变，只有 **TTL** 每跳减 1；减到 0 就丢弃并回一个 ICMP 超时，防止包在环里永远转。帧头里的 MAC 地址则每跳都换，所以 MAC 只在同一段链路上有意义。
      - title: 链路状态：人人都有全网地图
        body: |
          **链路状态（link state）**路由让每台路由器把自己直连的链路和代价泛洪（flooding）给全网，于是所有人拿到同一张带权图，再各自以自己为根跑 **Dijkstra**，算出到每个目的地的最短距离和第一跳，填进转发表。OSPF 就是这类协议。

          Dijkstra 的步骤：先把起点距离设为 0、其余设为无穷大；每轮从未确定的节点里挑距离最小的确定下来，再用它松弛邻居；重复到所有节点确定。要求所有链路代价非负。

          以无向图 A–B 1、A–C 4、B–C 2、B–D 5、C–D 1 为例，从 A 出发：B = 1，C = 1 + 2 = 3（比直连的 4 更短），D = 3 + 1 = 4。A 的转发表里，去 B、C、D 的下一跳都是 B。
      - title: 距离向量与域间路由
        body: |
          **距离向量（distance vector）**路由只和邻居打交道：每个路由器把自己的“到各目的地距离”表发给邻居，收到后按 Bellman–Ford 更新 $D_x(y) = \min_v \left(c(x,v) + D_v(y)\right)$。它简单、消息少，但坏消息传得慢：一条链路断了，邻居可能互相“借道”把距离一点点往上加，出现**无穷计数（count-to-infinity）**。RIP 用跳数当代价，上限 15 跳，16 就表示不可达。

          实际网络还分层：一个自治系统（AS）内部用 OSPF 或 RIP，AS 之间用 **BGP**。BGP 交换的是 AS 路径（path vector），既能避免环路，也让运营商能按商业策略选路，而不是只选最短。
    items:
      - id: longest-prefix
        type: choice
        prompt: 路由器收到目的地址 192.168.6.7 的包，转发表里有 192.168.0.0/16、192.168.4.0/22、192.168.6.0/24 三行都能匹配。它该选哪一行？
        options:
          - text: 192.168.6.0/24
            correct: true
          - text: 192.168.0.0/16
            why: 前缀越短覆盖范围越大；选它等于放弃更具体那条路由的信息，包可能被送到只笼统负责整个 /16 的下一跳，绕远甚至送错
          - text: 192.168.4.0/22
            why: /22 覆盖 192.168.4.0 到 192.168.7.255，虽然也包含目的地址，但不如 /24 精确
        explain: |
          三条都匹配时取**最长前缀**：/24 的 24 位全部对上，范围最小，说明这条路由最具体。默认路由 0.0.0.0/0 前缀长度为 0，只在没有更具体的路由时才用。这也是 CIDR 让路由表能变小的原因：短的聚合前缀负责兜底，长的具体前缀负责精确。
      - id: dijkstra-distance
        type: number
        prompt: 无向图有四个节点：A–B 代价 1，A–C 代价 4，B–C 代价 2，B–D 代价 5，C–D 代价 1。用 Dijkstra 求 A 到 D 的最短距离。
        answer: 4
        hint: 先算 A 到 C：直连要 4，绕 B 只要 1 + 2。
        explain: |
          A 到 B 是 1；到 C 走 A→B→C 是 $1+2=3$，比直连的 4 短；到 D 走 A→B→C→D 是 $3+1=4$，比 A→B→D 的 $1+5=6$ 短。所以最短距离是 4，路径是 A→B→C→D，A 的下一跳对 C 和 D 都是 B。
      - id: dijkstra-order
        type: order
        prompt: 对无向图 A–B 1、A–C 4、B–C 2、B–D 5、C–D 1，从 A 出发跑 Dijkstra。把执行步骤排成正确顺序。
        steps:
          - "把 A 的距离设为 0，B、C、D 设为无穷大"
          - "挑出未确定节点里距离最小的 B（1），确定它"
          - "用 B 更新邻居：C 从 4 改成 3，D 从无穷大改成 6"
          - "挑出 C（3），用 C 更新 D：3 + 1 = 4，比 6 小，改成 4"
          - "挑出 D（4）并确定，得到 A 到各点的最短距离"
        explain: |
          每一轮都从“还没确定”的节点里挑当前距离最小的，确定后不可能再变短（因为链路代价非负，绕远只会更贵），再用它更新邻居。这个过程叫松弛（relaxation）。注意 C 是被 B 更新的，说明最短路径不一定走直连的那条边。
      - id: subnet-of-130
        type: number
        prompt: 地址 192.168.10.130 配上前缀 /26，它所在子网的网络地址是 192.168.10.___。填最后一个字节。
        answer: 128
        hint: /26 把最后一个字节按 64 一块切开：0–63、64–127、128–191、192–255。
        explain: |
          每块 64 个地址，130 落在第三块 128–191 里，所以网络地址是 192.168.10.128，广播地址是 192.168.10.191，可用范围 .129–.190。它不在 192.168.10.64/26 里——那个子网到 .127 就结束了，这一点靠“块大小 64、按 64 对齐”就能判断。
      - id: mask-22-sim
        type: sim
        sim: bits
        prompt: 把网络 192.168.4.0/22 的掩码第三个字节用二进制拨出来（每一位代表 128、64、32 … 2、1 中的一个）。
        params: { bits: 8, signed: false, start: 0 }
        goal: { value: 252 }
        solution: [1, 1, 1, 1, 1, 1, 0, 0]
        explain: |
          /22 是 16 + 6，第三个字节只有前 6 位是 1：$11111100_2 = 252$，掩码是 255.255.252.0。这一个子网覆盖 $2^{10} = 1024$ 个地址（192.168.4.0 到 192.168.7.255），能分给主机 1022 个。也正因为如此，192.168.4.0/24、5.0/24、6.0/24、7.0/24 四条路由可以聚合成一条 /22，路由表能省下三行。

  - id: congestion-control
    chapter: 拥塞控制
    title: 网络堵了，发送方怎么知道
    minutes: 10
    warmup:
      id: guess-loss
      type: choice
      prompt: 一条 TCP 连接发现自己的报文一直收不到确认，判定发生了丢包。发送方通常怎么调整发送速率？
      options:
        - text: 把发送速率降下来
          correct: true
        - text: 提高发送速率，把丢掉的部分补回来
          why: 丢包通常是链路或路由器的队列满了，加快只会让队列更长、丢得更多
        - text: 保持原速率，等网络自己恢复
          why: 不减速的话，同一批连接会继续以同样速率灌包，拥塞不会自己缓解
      explain: |
        TCP 把丢包当成**拥塞信号**：网络里的队列已经溢出，才轮到这个包被丢掉。所以发送方不查网络状态，只看有没有丢包，再用窗口（cwnd）控制自己在途的数据量。丢包时减小窗口，收到确认时慢慢增大，这就是 TCP 拥塞控制的基本回路。
    cards:
      - title: 流量控制管接收方，拥塞控制管网络
        body: |
          发送方能在途多少数据，由两个上限决定：

          - **rwnd（接收窗口）**：接收方在 TCP 头里通告“我的缓冲区还能放多少”，这是**流量控制（flow control）**，防止压垮一台慢接收方。
          - **cwnd（拥塞窗口）**：发送方自己维护的估计值，代表“网络大概还能承受多少”，这是**拥塞控制（congestion control）**，防止压垮链路和路由器。

          实际发送窗口取 $\min(\text{cwnd}, \text{rwnd})$。窗口里的数据可以连续发出，不必等一个确认再发下一个；收到 ACK 窗口才向前滑动，这叫**滑动窗口（sliding window）**。所以 TCP 的吞吐大致是“窗口 ÷ 往返时间”，窗口越大、延迟越小，传得越快——前提是网络吃得下。
      - title: 慢启动与拥塞避免：先翻倍，再一步一挪
        body: |
          连接刚建立时，发送方不知道网络能承受多少，于是把 cwnd 设成 1 MSS（一个最大报文段），这叫**慢启动（slow start）**。每收到一个 ACK，cwnd 就加 1 MSS，于是一个往返时间（RTT）里能发的量翻一倍：1、2、4、8……

          指数增长不能一直继续。发送方记着一个门限 **ssthresh**：cwnd 涨到 ssthresh 以后，转入**拥塞避免（congestion avoidance）**，每个 RTT 只加 1 MSS，从翻倍变成线性增长。

          以初始 cwnd = 1 MSS、ssthresh = 8 MSS、全程不丢包为例，第 1 到第 6 个 RTT 开始时的 cwnd 是 1、2、4、8、9、10。第 4 个 RTT 已经到达门限，所以这一步之后不再翻倍。名字叫“慢启动”，其实它是从很小开始、涨得最快的阶段。
      - title: AIMD：加性增、乘性减
        body: |
          拥塞避免阶段每 RTT 加 1，丢包时把窗口砍下来，合起来叫 **AIMD（additive increase, multiplicative decrease）**。TCP 用两种信号判断丢包，反应不同：

          - **超时**（重传定时器 RTO 到期）：可能丢得很厉害，把 ssthresh 设为当前 cwnd 的一半，cwnd 回到 1 MSS，重新慢启动。
          - **3 个重复 ACK**：说明后面某个段丢了，但网络还在送数据。立刻**快重传（fast retransmit）**补发那一段；ssthresh 同样设为 cwnd 的一半，进入**快恢复（fast recovery）**，暂时把 cwnd 设为 ssthresh + 3（三个重复 ACK 说明又有三个包离开了网络），收到新数据的 ACK 后回到拥塞避免。

          于是 cwnd 画出来是锯齿：线性爬升，丢包时掉一半或掉到 1。加性增让先到的连接和后来的连接逐渐靠近同一个份额，乘性减让所有连接同时退让，避免一起把网络压垮。
    items:
      - id: cwnd-6th-rtt
        type: number
        prompt: TCP 连接的初始 cwnd = 1 MSS，ssthresh = 8 MSS，全程没有丢包。第 6 个 RTT 开始时 cwnd 是多少 MSS？
        answer: 10
        unit: MSS
        hint: 到 ssthresh 之前每个 RTT 翻倍；到达门限之后每个 RTT 只加 1。
        explain: |
          第 1–4 个 RTT 开始时是 1、2、4、8：前三个 RTT 还在慢启动，第 4 个 RTT 的 cwnd 已经等于 ssthresh。之后进入拥塞避免，每 RTT 加 1，所以第 5 个 RTT 是 9，第 6 个是 10。关键在门限的判断：cwnd 一旦不小于 ssthresh，就不能再翻倍。
      - id: timeout-order
        type: order
        prompt: 发送方在拥塞避免阶段发现重传定时器超时。把它的反应排成正确顺序。
        steps:
          - "重传定时器到期，发送方判定有报文段丢失"
          - "把 ssthresh 设为当前 cwnd 的一半"
          - "把 cwnd 降回 1 MSS，重新进入慢启动"
          - "cwnd 每个 RTT 翻倍，直到长到 ssthresh"
          - "此后转入拥塞避免，每个 RTT 只加 1 MSS"
        explain: |
          超时被当作严重拥塞的信号：既把门限砍半，又把窗口清零重来。砍半是为了让所有连接大致公平地退让，回到 1 是因为发送方已经不确定网络还能承受多少，只能再从探路开始。真实实现里 ssthresh 还有下限（至少 2 个 MSS），免得窗口小到无法有效传输。
      - id: dupack-ssthresh
        type: number
        prompt: 一条连接当前 cwnd = 10 MSS，ssthresh = 15 MSS，随后收到 3 个重复 ACK。发送方把 ssthresh 改成多少 MSS？
        answer: 5
        unit: MSS
        hint: 3 个重复 ACK 也被当作拥塞信号，门限按当前窗口的一半来算。
        explain: |
          重复 ACK 说明有段丢了，发送方把 ssthresh 设为当前 cwnd 的一半，也就是 5 MSS，然后快重传那一段。快恢复期间 cwnd 临时设为 ssthresh + 3 = 8 MSS，收到新的 ACK 后再回落到 ssthresh = 5，从拥塞避免继续。和超时不同，这里不把 cwnd 降到 1，因为网络显然还在正常送数据。
      - id: flow-vs-congestion
        type: choice
        prompt: 接收方通告的 rwnd 和发送方维护的 cwnd，各自是为了防止什么？
        options:
          - text: rwnd 防止压垮接收方，cwnd 防止压垮网络
            correct: true
          - text: rwnd 防止压垮网络，cwnd 防止压垮接收方
            why: 反了：rwnd 是接收方按自己缓冲区剩余空间算的，cwnd 是发送方对网络容量的估计
          - text: rwnd 是链路的物理带宽，cwnd 是网卡的发送速度
            why: 两者都是窗口（能容纳多少未确认数据），不是带宽或速率；物理带宽发送方根本不知道
        explain: |
          流量控制是端到端的：接收方处理不过来就把 rwnd 调小，发送方最多发到 rwnd 那么多未确认数据。拥塞控制是看网络的：中间路由器排队溢出才会丢包，发送方用 cwnd 试探网络容量。发送窗口取两者中小的那个，所以一个慢接收方和一条拥塞的链路都能让发送方放慢甚至停下，但原因不同。
      - id: slowstart-rtts
        type: number
        prompt: 慢启动从一个 MSS 开始，每个 RTT 翻一倍，全程不丢包、没有门限限制。cwnd 从 1 MSS 长到 8 MSS 需要几个 RTT？
        answer: 3
        unit: 个
        hint: 数一数：RTT 1 开始是 1，RTT 2 开始是几？
        explain: |
          第 1 个 RTT 开始时是 1，第 2 个是 2，第 3 个是 4，第 4 个是 8：所以长了 3 个 RTT。指数增长看起来很快，但代价是这段时间窗口很小；从 8 到 16 也只要 1 个 RTT，所以慢启动很快就会撞上门限或丢包。

  - id: dns-app-protocols
    chapter: 名称系统与应用协议
    title: 名字怎么变成地址，网页怎么拿到
    minutes: 10
    warmup:
      id: guess-dns
      type: choice
      prompt: 在浏览器地址栏输入 www.example.com 并回车，浏览器要先弄清什么，才能向服务器发请求？
      options:
        - text: 这个域名对应哪个 IP 地址
          correct: true
        - text: 服务器网卡的 MAC 地址
          why: MAC 只在同一段链路上用；远端服务器的 MAC 由沿途路由器逐跳换成下一跳的，浏览器不需要知道
        - text: 网站的标题和图标
          why: 这些要等 HTTP 响应回来以后才拿得到，不能用来发请求
      explain: |
        域名是给人看的名字，IP 包只认 IP 地址。把名字翻译成地址靠 **DNS（Domain Name System）**：先查本机缓存，再问本地 DNS 服务器；缓存没有命中时，本地 DNS 要依次去问根、顶级域和权威服务器。拿到地址后，浏览器才能向那个 IP 的 443 端口建立 TCP 连接。
    cards:
      - title: 域名树与一次解析
        body: |
          域名是从右往左读的层级：根（.）→ 顶级域（TLD，如 com）→ 权威域（example.com），最左边是主机名 www。DNS 服务器也按这个层级分工：

          1. **本地 DNS（递归解析器）**：由运营商或公司提供，负责替你的电脑跑完整条查询；它先看自己缓存里有没有，没有才继续。
          2. **根服务器**：不认识 www.example.com，但知道 .com 的顶级域服务器在哪。
          3. **.com 的 TLD 服务器**：知道 example.com 的权威服务器是哪一台。
          4. **权威服务器**：存着这个域的正式记录，返回 A 记录里的 IPv4 地址。

          答案会按 **TTL** 缓存在本地 DNS 和本机，没过期就直接返回，省掉后面三步。DNS 默认用 53 端口，多数查询走 UDP，应答太大或做区域传送时才用 TCP。
      - title: HTTP、HTTPS 与三个版本
        body: |
          **HTTP** 是一问一答的请求/响应协议：客户端发方法、路径、头部（可能还有正文），服务器用状态码回答（200 成功、301 跳转、404 找不到、500 服务器出错）。HTTP 本身不记录状态，网站靠 Cookie 之类的头部把“你是谁”带上。

          **HTTPS** 就是 HTTP 跑在 **TLS** 上，默认端口 443。TLS 握手先验证服务器证书，确认这个域名确实属于对方，再协商出一把对称密钥，之后用它加密 HTTP 内容；TLS 1.3 的完整握手只需 1 个 RTT。

          HTTP/1.1 默认一条连接上一个请求处理完再发下一个（管线化规范里有，但实际很少启用）；**HTTP/2** 在一条 TCP 连接上多路复用多个请求，但 TCP 按字节顺序交付，前面丢一个段，后面所有流都得等（队头阻塞）；**HTTP/3** 改用跑在 UDP 上的 **QUIC**，每条流单独重传，就不会被别的流拖住。**RPC** 让远程调用写起来像本地函数，**WebSocket** 用一次 HTTP 升级握手换来一条双向长连接，适合聊天和服务器主动推送。
      - title: 套接字：程序看到的网络接口
        body: |
          程序通过**套接字（socket）**使用传输层。TCP 服务器的顺序是：`socket()` 创建 → `bind()` 绑定端口 → `listen()` 开始排队 → `accept()` 取出一条新连接；客户端是 `socket()` → `connect()` 连到服务器的 IP 和端口 → `send()`/`recv()`。

          TCP 提供的是**字节流**，不保留消息边界：发送方 `send` 两次，接收方可能一次 `recv` 全收到，也可能分几次收到。应用层要自己定协议分帧，例如先发 4 字节长度再发正文，或用换行分隔。

          `recv` 返回空字节串表示对方已经关闭了发送方向，不是“暂时没数据”；没有数据又没关闭时，阻塞的 `recv` 会一直等下去。
    items:
      - id: dns-order
        type: order
        prompt: 本机缓存和本地 DNS 缓存都没有 www.example.com 的记录时，一次完整的域名解析按什么顺序进行？把步骤排好。
        steps:
          - "浏览器和操作系统查本地缓存，没有再向配置的本地 DNS 服务器发起查询"
          - "本地 DNS 缓存也没命中，向根服务器查询，根服务器返回 .com 顶级域服务器的地址"
          - "本地 DNS 去问 .com 的 TLD 服务器，得到 example.com 权威服务器的地址"
          - "本地 DNS 向权威服务器查询，拿到 www.example.com 的 A 记录（IP 地址）"
          - "本地 DNS 按 TTL 缓存这条记录，把 IP 返回给浏览器，浏览器用它建立 TCP 连接"
        explain: |
          根服务器只负责指路，不存具体域名的地址；TLD 服务器只知道自己这个顶级域下各域的权威服务器；只有权威服务器握着最终答案。整条链走完可能几十毫秒，所以每一级都缓存，TTL 到期才重新查。缓存命中时第 2 步到第 4 步全部跳过。
      - id: protocol-purpose
        type: match
        prompt: 把应用层的协议和它的作用连起来。
        pairs:
          - ["DNS", "把域名翻译成 IP 地址，常用 UDP 的 53 端口"]
          - ["HTTP/3", "基于 QUIC 跑在 UDP 上，各条流独立重传"]
          - ["RPC", "让远程调用写起来像调用本地函数"]
          - ["WebSocket", "一次握手后保持双向长连接，适合服务器推送"]
        explain: |
          这四个协议经常同时出现在一个网页里：DNS 先把域名变成 IP，HTTP/3（或 HTTP/2）取回页面资源，页面里的脚本再用 WebSocket 保持长连接、用 RPC 调后端接口。它们都建立在传输层之上，区别在于各自需要什么样的传输服务：一次性的小查询、多个并行的请求、长期的推送，或者像本地函数一样的调用。
      - id: recv-boundary
        type: choice
        prompt: 客户端连续两次调用 send，先发 `hello` 再发 `world`；服务器调用一次 recv(1024)。下面哪种结果可能发生？
        options:
          - text: 一次收到 `helloworld`，也可能只收到 `hello`，两种都正常
            correct: true
          - text: 一定收到两条独立消息，先 `hello` 后 `world`
            why: TCP 只保证字节顺序，不保留 send 的边界；不看应用层自定的分帧规则，就分不清哪里是第一条的结尾
          - text: 一定报错，因为两次 send 必须配两次 recv
            why: recv 只是从字节流里取走当前已有的部分，调用次数不需要和 send 配对
        explain: |
          TCP 是字节流：它保证字节按序、不丢、不重，但“一次 send 的内容”并不是一个传输单位。服务器可能一次拿到 10 个字节，也可能先拿到 5 个。所以应用协议要自己划边界：先发长度、用分隔符，或者像 HTTP 那样用空行和 Content-Length。recv 返回空串才表示对方关闭了连接。
      - id: port-count
        type: number
        prompt: TCP 和 UDP 头里的端口号字段都是 16 位。端口号一共有多少个取值（从 0 到 65535）？
        answer: 65536
        unit: 个
        explain: |
          $2^{16} = 65536$。0–1023 是分配给常见服务的知名端口（HTTP 80、HTTPS 443、DNS 53），更高的端口留给普通程序；客户端连接时由内核临时分配一个源端口。服务器端口固定、客户端端口随机，正是四元组能区分成千上万条连接的原因。
      - id: http3-why
        type: choice
        prompt: 为什么 HTTP/3 改用跑在 UDP 上的 QUIC，而不是继续直接用 TCP？
        options:
          - text: QUIC 在 UDP 之上自己做可靠传输和按流重传，一条流丢包不会卡住其他流
            correct: true
          - text: UDP 本身不会丢包，所以比 TCP 快
            why: UDP 不保证送达，丢包照样发生；QUIC 只是把重传和排序搬到了用户态，由自己按流处理
          - text: 因为 TCP 不能加密，只有 UDP 能配 TLS
            why: TLS 完全可以跑在 TCP 上，HTTPS 一直就是这么做的
        explain: |
          HTTP/2 的多条流共用一条 TCP 连接，而 TCP 必须按字节顺序向上交付：前面一个段丢了，后面所有流的数据都得在接收缓冲区里等，这就是 TCP 层的队头阻塞。QUIC 为每条流单独编号、单独重传，丢掉的数据只影响那一条流；它还内建了 TLS 1.3 握手，所以 HTTP/3 把传输层换成了 UDP + QUIC。

boss:
  items:
    - id: boss-subnet
      type: number
      prompt: 主机地址 192.168.10.77/26 所在子网的网络地址是 192.168.10.___。填最后一个字节。
      answer: 64
      hint: /26 把最后一个字节按 64 一块切开，看 77 落在哪一块。
      explain: |
        每块 64 个地址：0–63、64–127、128–191、192–255。77 落在第二块，所以网络地址是 192.168.10.64，广播地址是 192.168.10.127，可用范围是 .65–.126，共 62 个可用主机地址。
    - id: boss-cwnd
      type: number
      prompt: 一条 TCP 连接的初始 cwnd = 1 MSS，ssthresh = 8 MSS，全程没有丢包。第 8 个 RTT 开始时 cwnd 是多少 MSS？
      answer: 12
      unit: MSS
      explain: |
        第 1–4 个 RTT 开始时是 1、2、4、8：慢启动一直翻倍，到第 4 个 RTT 已经碰到 ssthresh。之后每个 RTT 只加 1，所以第 5–8 个 RTT 开始时是 9、10、11、12。若中途超时，cwnd 会先掉到 1、ssthresh 减半，再重新爬。
    - id: boss-next-hop
      type: text
      prompt: 无向图 A–B 代价 1，A–C 代价 4，B–C 代价 2，B–D 代价 5，C–D 代价 1。A 的转发表里，目的地 D 的下一跳是哪个节点？填节点字母。
      answers: ["B"]
      placeholder: 填一个节点字母
      explain: |
        A 的最短路径是 A→B（1）、A→B→C（3，比直连的 4 短）、A→B→C→D（4，比 A→B→D 的 6 短）。所以去 B、C、D 的下一跳都是 B。转发表只记“目的前缀 → 下一跳”，不记整条路径。
