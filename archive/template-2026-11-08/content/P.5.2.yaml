skill: P.5.2
version: 2
brief:
  why: 移动页面随生命周期、窗口和权限变化。用一个待办和计数器学习状态、网络、持久化及不同平台的交付。
  outcomes:
    - 选择可恢复的界面状态和合适的自适应布局
    - 接入设备能力与网络并处理失败
    - 设计离线同步、测试与发布流程
terms:
  - term: 生命周期
    def: 运行对象经历创建、可见、活动和退出等状态的过程。
  - term: 进程
    def: 正在运行并拥有资源的程序实例。
lessons:
  - id: toolchain
    chapter: 平台生命周期
    title: 从一个最小页面确认工具链能运行
    minutes: 13
    flow:
      - guess:
          id: toolchain-guess
          type: choice
          prompt: 第一次开 Android 工程，应该先接后端还是先确认空白页面能运行？
          options:
            - text: 先确认模板在目标环境能运行
              correct: true
            - text: 必须先写完所有业务才知道工具可用
              why: 空白模板可单独验证构建、安装和显示。
          explain: 把环境故障与业务问题分开。
      - card:
          title: 以 Android Studio 的 Compose 模板为起点
          body: >-
            选择支持 Compose 的 Empty Activity，确认 Kotlin、Android SDK
            和项目构建配置。可用模拟设备或已授权的测试设备。先运行模板，再改一处文本验证变更，记录构建或安装的报错信息。
      - item:
          id: toolchain-practice
          type: choice
          prompt: 项目能构建但无法安装到所选设备，第一步查什么？
          options:
            - text: 先改计数器业务逻辑
              why: 逻辑代码未解释设备安装失败。
            - text: 核对设备连接、系统要求及安装错误
              correct: true
          explain: 按构建、安装、启动逐层定位。
      - card:
          title: 先熟悉 Kotlin 的值、数据类与函数
          body: '`val` 绑定不能重新赋值，`var` 可重新赋值。数据类可把相关字段放到一起，并用 `copy` 创建部分字段改变的新值。Compose 页面描述输入状态对应的界面，下一课再看何时保存。'
      - item:
          id: toolchain-apply
          type: choice
          prompt: Kotlin 已写 `val old = CounterState(1)`，怎样得到一份计数为 2 的新值并保留 old？
          options:
            - text: 把不可重绑的 old 改为任意新值
              why: copy 会给出新状态，不需改 old。
            - text: 用 `old.copy(count = 2)`
              correct: true
          explain: 把业务变化表示为状态转换。
  - id: lifecycle
    chapter: 平台生命周期
    title: 页面暂离、重建与应用被终止分开处理
    minutes: 13
    flow:
      - guess:
          id: lifecycle-guess
          type: choice
          prompt: 旋转屏幕后，普通页面成员里的计数丢了。最可能发生了什么？
          options:
            - text: 旋转保证只改变屏幕角度，页面对象不变
              why: 常见配置变化会触发重建。
            - text: 系统按默认配置重建了 Activity
              correct: true
          explain: 页面对象与界面状态有不同寿命。
      - card:
          title: 用回调理解页面当前能做什么
          body: >-
            **生命周期（lifecycle）**描述一个运行对象经历的状态。Android Activity 常见启动为 onCreate → onStart → onResume；退到后台常经过
            onPause、onStop。系统可终止应用的**进程（process）**，即正在运行的程序实例，退出前不一定执行 onDestroy。
      - item:
          id: lifecycle-practice
          type: order
          prompt: 普通 Android Activity 初次启动进入可交互状态，排列三个回调。
          steps:
            - onCreate
            - onStart
            - onResume
          explain: 先创建，再可见，最后进入前台交互状态。
      - card:
          title: 按需要恢复的范围选择存放位置
          body: >-
            ViewModel 可跨配置重建保留状态，进程终止时也会失去。少量可恢复界面数据用 SavedStateHandle、保存实例状态或
            rememberSaveable，前提是系统提供恢复机会。待办、草稿等长期数据应持久保存。
      - item:
          id: lifecycle-apply
          type: choice
          prompt: 用户关闭应用再打开，希望所有待办仍在。主要依靠什么？
          options:
            - text: 持久数据存储
              correct: true
            - text: 普通 Activity 成员变量
              why: 旧 Activity 可能已不存在。
          explain: 按保存时长选择状态边界。
  - id: navigation
    chapter: 平台生命周期
    title: 让导航传标识，状态从持有者取
    minutes: 13
    flow:
      - guess:
          id: navigation-guess
          type: choice
          prompt: 列表点一条任务进入详情。如果把整份可变数据塞进导航，任务后来更新会怎样？
          options:
            - text: 详情可能使用旧快照，需清楚重新读取
              correct: true
            - text: 传入对象会永远自动同步数据库
              why: 导航参数与实际存储没有天然同步。
          explain: 用稳定身份定位当前数据。
      - card:
          title: 导航记录目的地与返回路径
          body: 导航图描述列表、详情、设置等目的地和到达方式。详情可带任务编号，进入后从资料库加载。返回栈表示先后访问，深链进入时要验证参数与账号权限。
      - item:
          id: navigation-practice
          type: choice
          prompt: 详情打开时发现任务已被删，应该怎样处理？
          options:
            - text: 假定导航参数仍含一份有效副本
              why: 记录可能已变化。
            - text: 按缺失状态显示提示并提供返回路径
              correct: true
          explain: 导航参数应允许业务状态变化。
      - card:
          title: 把状态持有与界面渲染分工
          body: 界面发出事件并显示可观察状态。ViewModel 可以协调界面数据和工作，资料库负责读取及保存。状态提升把持有位置放到共同使用者，减少同一值有两个来源。
      - item:
          id: navigation-apply
          type: choice
          prompt: 列表和详情都要看任务完成状态。哪种方案更利于保持一致？
          options:
            - text: 在两个页面保存各自副本并独立修改
              why: 副本可能相互冲突。
            - text: 从共享资料来源读取状态，事件更新同一记录
              correct: true
          explain: 避免同一业务状态被重复持有。
  - id: kotlin-state
    chapter: 界面状态
    title: 先测状态转换，再接按钮
    minutes: 13
    flow:
      - guess:
          id: kotlin-state-guess
          type: choice
          prompt: 计数从 0 开始，按两次 +1 再按重置。界面应显示多少？
          options:
            - text: '2'
              why: 重置产生初始状态。
            - text: '0'
              correct: true
          explain: 先把事件和预期状态写清。
      - card:
          title: 用 Kotlin 表达不依赖界面的状态转换
          body: |
            `data class` 表达状态字段，函数根据输入返回新状态。下面演示两次增量和重置。可以先在 Kotlin/JVM 中验证逻辑，再接到界面。

            ```kotlin
            data class CounterState(val count: Int = 0)

            fun increment(state: CounterState): CounterState =
                state.copy(count = state.count + 1)

            fun main() {
                val initial = CounterState()
                val twice = increment(increment(initial))
                val reset = CounterState()
                println("${initial.count}/${twice.count}/${reset.count}")
            }
            // expect: 0/2/0
            ```
      - item:
          id: kotlin-state-practice
          type: number
          prompt: 计数状态为 2，连续收到三次 +1。结果是多少？
          answer: 5
          explain: 每次使用当前值加一，2+3=5。
      - card:
          title: 用可空类型和集合处理真实数据
          body: '`String?` 允许 null，使用前检查或提供默认。Kotlin 列表可用 `map` 转换、`filter` 挑选。函数能接收回调，界面按钮只报告事件，状态持有者据业务规则产生新结果。'
      - item:
          id: kotlin-state-apply
          type: choice
          prompt: 数据显示任务标题，但标题可能缺失。如何处理？
          options:
            - text: 让所有空值在界面绘制时崩溃
              why: 缺失是可能状态，应有约定。
            - text: 用可空类型并定义缺失时的显示
              correct: true
          explain: 类型与界面都表达这一分支。
  - id: compose-counter
    chapter: 界面状态
    title: 让 Compose 根据状态绘制计数器
    minutes: 13
    flow:
      - guess:
          id: compose-counter-guess
          type: choice
          prompt: 点击 +1 后，声明式界面代码应先改变什么？
          options:
            - text: 改变计数状态，由界面重新描述文本
              correct: true
            - text: 找到文本对象并绕过状态直接改显示
              why: 显示和业务值可能从此不一致。
          explain: 状态是界面的输入。
      - card:
          title: 使用 Compose 模板运行小界面
          body: >
            下面的函数可放进已有 Material 3 Compose 项目，由 Activity 的 setContent 入口调用
            CounterScreen。读取的状态改变后，框架会重新执行需要更新的部分。小计数通过 rememberSaveable 跨受支持的重建恢复。


            ```kotlin

            import androidx.compose.foundation.layout.Column

            import androidx.compose.material3.Button

            import androidx.compose.material3.Text

            import androidx.compose.runtime.Composable

            import androidx.compose.runtime.getValue

            import androidx.compose.runtime.mutableStateOf

            import androidx.compose.runtime.setValue

            import androidx.compose.runtime.saveable.rememberSaveable


            @Composable

            fun CounterScreen() {
                var count by rememberSaveable { mutableStateOf(0) }
                Column {
                    Text("Count: $count")
                    Button(onClick = { count += 1 }) { Text("+1") }
                    Button(onClick = { count = 0 }) { Text("重置") }
                }
            }

            ```
      - item:
          id: compose-counter-practice
          type: choice
          prompt: 重置按钮做了什么？
          options:
            - text: 只清空 Text 的显示，count 仍保留旧值
              why: 代码写入的是 count。
            - text: 把 count 设为 0，文本读取新状态后更新
              correct: true
          explain: 状态变化带来新的界面描述。
      - card:
          title: 提升状态可让组件复用和易于测试
          body: >-
            当多个控件共享计数，可把 count 和按钮事件移交给共同的状态持有者，让子组件只接收当前值和操作回调。小界面状态可恢复，长期业务记录用持久层。Flutter 的有状态组件也可通过状态变化重建
            UI。
      - item:
          id: compose-counter-apply
          type: choice
          prompt: 同一页两个控件都显示计数，若各保存不同副本，最可能发生什么？
          options:
            - text: 两个显示可能不一致，适合提升到共同持有处
              correct: true
            - text: 框架会按组件名自动合并两个值
              why: 组件各自的状态不会自动共享。
          explain: 确定单一状态来源。
  - id: lists-theme
    chapter: 界面状态
    title: 用稳定的项目身份渲染列表
    minutes: 13
    flow:
      - guess:
          id: lists-theme-guess
          type: choice
          prompt: 列表删除第一项后，第二项仍应保持自己的选择状态。用位置当身份有什么风险？
          options:
            - text: 位置是业务主键，删除前后不会改变
              why: 删除会改变后续项所在位置。
            - text: 位置移动会把旧状态关联到另一条数据
              correct: true
          explain: 用能跨排序和更新保持的业务标识。
      - card:
          title: 可滚动列表按可见范围构造界面
          body: Compose 的 LazyColumn 可按需要显示项目，稳定 key 帮助识别排序或删除后的同一项。先用数据结构描述任务，再用标题、完成状态和回调组成行；空、载入和失败状态也要画出来。
      - item:
          id: lists-theme-practice
          type: choice
          prompt: 列表的顺序会改变。选择哪一项更适合作为 key？
          options:
            - text: 任务稳定编号
              correct: true
            - text: 任务当前所在行号
              why: 排序会改变行号。
          explain: 身份应跟着数据，而非显示位置。
      - card:
          title: 主题表达一致的颜色、排版与组件规则
          body: Material 主题管理色彩、字形和组件样式。多种屏幕和主题都核对对比度、放大文字、触控区域与语义描述。不要只用颜色表示完成状态，给屏幕阅读器可读的信息。
      - item:
          id: lists-theme-apply
          type: choice
          prompt: 完成任务只由绿色标识，没有文字或语义。如何改进？
          options:
            - text: 只换成更鲜艳的绿色
              why: 依赖颜色仍无法让所有用户区分。
            - text: 增加可读的完成状态和合适的语义
              correct: true
          explain: 状态应有多种可感知信号。
  - id: adaptive-android
    chapter: 界面状态
    title: 让布局随可用窗口与输入能力变化
    minutes: 13
    flow:
      - guess:
          id: adaptive-android-guess
          type: choice
          prompt: 同一平板开分屏后，只剩一条窄窗口。应该按什么决定列表与详情并排？
          options:
            - text: 看当前可用窗口宽度
              correct: true
            - text: 只根据设备是平板永远并排
              why: 分屏改变了可用空间。
          explain: 以当前布局条件为准。
      - card:
          title: 用窗口信息和内容约束选布局
          body: 窄屏可在列表与详情之间导航，宽屏可并排。验证多窗口、旋转、折叠区域和文字放大。布局改变时保留当前选择，避免每次变化都回到起点。
      - item:
          id: adaptive-android-practice
          type: choice
          prompt: 宽屏选择了任务 A，再缩成窄屏，怎样处理合理？
          options:
            - text: 丢掉选择并重置所有业务数据
              why: 显示变化不需要清空业务状态。
            - text: 保留任务 A 的选择并切到适合的单栏布局
              correct: true
          explain: 把布局和业务状态分开。
      - card:
          title: 现有 View 与 Compose 可以渐进共存
          body: >-
            旧 Android 页面可用 ComposeView 放入 Compose 内容，Compose 也能用 AndroidView 嵌入既有
            View。给两侧明确状态来源和页面销毁时的资源处理。不要因混用而建立两份互相竞争的业务状态。
      - item:
          id: adaptive-android-apply
          type: choice
          prompt: 迁移旧页面的一部分到 Compose，怎样避免列表状态不一致？
          options:
            - text: 每一侧同时各保存一份数据并自行修改
              why: 两份状态可能分叉。
            - text: 共用业务状态持有者，逐步替换显示层
              correct: true
          explain: 迁移界面而维持稳定的状态契约。
  - id: adaptive-flutter
    chapter: 界面状态
    title: 按约束布局，处理安全区域与可访问输入
    minutes: 13
    flow:
      - guess:
          id: adaptive-flutter-guess
          type: choice
          prompt: 移动端的全屏内容被刘海遮住。应硬编码顶部距离吗？
          options:
            - text: 所有机型都使用同一个固定上边距
              why: 不同设备与窗口的遮挡不同。
            - text: 使用系统提供的安全区域和当前尺寸信息
              correct: true
          explain: 让布局读取安全显示范围。
      - card:
          title: Flutter 用当前约束和系统信息调整
          body: >-
            SafeArea 为系统侵入区域留空间，MediaQuery 提供窗口和显示信息，LayoutBuilder
            可按局部约束选结构。宽屏或折叠屏可考虑双栏，并避开铰链。响应式调整大小，自适应还可变更布局或交互方式。
      - item:
          id: adaptive-flutter-practice
          type: choice
          prompt: 内容所在卡片变窄，整窗宽度却没变。哪个依据更合适？
          options:
            - text: 按卡片实际收到的布局约束调整
              correct: true
            - text: 继续只按整窗宽度决定卡片布局
              why: 局部空间才限制卡片内容。
          explain: 整窗信息与局部约束解决不同问题。
      - card:
          title: 验证输入、可访问性与平台差异
          body: 支持键盘焦点、触控、鼠标和屏幕阅读。按平台习惯选择组件，框架可适配一部分交互，但权限和特性需查询支持情况。系统策略或硬件缺少时提供可用回退。
      - item:
          id: adaptive-flutter-apply
          type: choice
          prompt: 桌面版只在触摸时出现一个关键按钮。还应测什么？
          options:
            - text: 键盘导航与焦点能否使用同一操作
              correct: true
            - text: 只把触控动画速度提高
              why: 动画速度无法补齐键盘能力。
          explain: 让不同输入方式达成同一任务。
  - id: device
    chapter: 设备能力
    title: 在用户需要时申请最小设备能力
    minutes: 13
    flow:
      - guess:
          id: device-guess
          type: choice
          prompt: 待办可以手动输入，也能扫描纸条。用户拒绝相机后，应用应该怎样？
          options:
            - text: 保留手动输入，说明扫描需要授权
              correct: true
            - text: 让所有待办都不可用
              why: 核心功能有不需要相机的替代路径。
          explain: 权限只对应使用到的能力。
      - card:
          title: 先检查硬件与权限，再启动能力
          body: 相机、位置、蓝牙与不同传感器的可用性及权限依平台和版本而异。选择足够窄的访问方式，例如只选一张照片。用户主动操作时解释目的，请求授权，处理拒绝、撤回或设备缺少。
      - item:
          id: device-practice
          type: order
          prompt: 为可选的扫描功能安排一次权限流程。
          steps:
            - 确认设备和平台支持
            - 在用户主动扫描时说明并请求必要权限
            - 授权后启用扫描
            - 被拒或缺少能力时提供手动输入
          explain: 请求紧贴使用目的，失败时仍能完成核心任务。
      - card:
          title: 限制传感器与连接的工作范围
          body: 加速度传感器报告运动，位置来源提供估计位置，蓝牙连接外设。只在需要时注册监听，退出时释放，按体验与电量选择更新频率。测试权限中途被撤回、外设断开和读数不可用。
      - item:
          id: device-apply
          type: choice
          prompt: 离开传感器页面后，不再需要连续读数。怎样减轻电量负担？
          options:
            - text: 继续最高频率读取并丢掉结果
              why: 读取本身仍消耗资源。
            - text: 注销监听或暂停采样
              correct: true
          explain: 把设备使用和业务范围关联。
  - id: stacks
    chapter: 设备能力
    title: 按设备、交付和维护选客户端方案
    minutes: 13
    flow:
      - guess:
          id: stacks-guess
          type: choice
          prompt: 团队要同时交 Android 和 iOS，并用到两侧不同硬件能力。选型先看什么？
          options:
            - text: 只看框架能否画同一个按钮
              why: 关键硬件能力可能要求平台实现。
            - text: 核对共享收益、插件与原生维护成本
              correct: true
          explain: 按真实约束验证平台覆盖。
      - card:
          title: 原生、跨平台和桌面各有强项
          body: >-
            Kotlin/Swift 原生可直接用各自 SDK。Flutter 用 Dart 和自己的渲染体系，React Native 用 React 模型与原生能力。Flutter
            也支持桌面目标，仍要按平台构建、测试和适配。Qt 可用原生 C++ 生态，选型看已有技能与分发。
      - item:
          id: stacks-practice
          type: choice
          prompt: 原生蓝牙库只支持 Android。使用共享 UI 是否会自动支持 iOS？
          options:
            - text: 仍要提供 iOS 实现或说明该能力不可用
              correct: true
            - text: 共享 UI 会自动生成所有平台硬件支持
              why: 界面复用不等同原生能力复用。
          explain: 检查每个目标的插件与硬件依赖。
      - card:
          title: Electron 带运行时，要明确权限隔离
          body: >-
            Electron 包含 Chromium 和 Node.js，体积和运行资源受应用、窗口与平台影响。渲染侧关闭 nodeIntegration，启用 contextIsolation 与
            sandbox，preload 只暴露必要操作；限制内容来源、验证 IPC 发送方与输入。
      - item:
          id: stacks-apply
          type: choice
          prompt: 桌面渲染侧需要读取某个业务文件。安全的接口是什么？
          options:
            - text: 暴露任意路径读取给整个渲染环境
              why: 任意读取会放大内容被利用后的权限。
            - text: 只暴露受验证的指定业务读取动作
              correct: true
          explain: 按最小授权公开跨边界能力。
  - id: platform-code
    chapter: 设备能力
    title: 通过窄接口连接平台代码
    minutes: 13
    flow:
      - guess:
          id: platform-code-guess
          type: choice
          prompt: Flutter 想用平台提供的传感器能力。插件没有对应方法时，怎样组织桥接？
          options:
            - text: 声明平台操作契约，各支持平台实现
              correct: true
            - text: 把所有平台差异散在每个界面里
              why: 分散会使平台判断重复。
          explain: 把差异集中在跨平台边界。
      - card:
          title: 平台通道传消息，原生绑定适合受支持的库
          body: >-
            Flutter 可用 MethodChannel 等在 Dart 和平台代码之间交换值。用明确的方法名、数据格式、执行位置的约定和错误。需要调用 C 接口时可评估
            FFI，核对类型、资源归属、支持的目标与构建方式。
      - item:
          id: platform-code-practice
          type: choice
          prompt: 平台通道传递设备读数失败。返回什么更适合调用方处理？
          options:
            - text: 只返回一个正常范围内的数来代表所有失败
              why: 调用者会把失败当正常数据。
            - text: 明确的错误类别和可用的回退信息
              correct: true
          explain: 跨边界错误要能区分。
      - card:
          title: 不同平台需要分别验证能力与失败
          body: 移动端、桌面和 Web 对插件、文件、后台与权限的支持不同。先检查目标平台的实现和权限声明，遇到不支持时提供替代体验，避免要求所有系统假装有同样能力。
      - item:
          id: platform-code-apply
          type: choice
          prompt: Web 目标缺少一个原生库，哪种设计更稳妥？
          options:
            - text: 平台边界报告不支持并使用替代路径
              correct: true
            - text: 强行执行桌面库并吞掉所有错误
              why: 构建或运行时都会缺少实现。
          explain: 支持矩阵要体现在代码和测试中。
  - id: network
    chapter: 设备能力
    title: 把读取结果分成载入、成功与失败
    minutes: 13
    flow:
      - guess:
          id: network-guess
          type: choice
          prompt: 页面从网上读任务，连接还没结束。让用户看到空列表就足够吗？
          options:
            - text: 空列表可以代表所有错误和等待
              why: 不同情况需要不同反馈与动作。
            - text: 应区分仍在载入与确实没有项目
              correct: true
          explain: 网络状态是界面状态的一部分。
      - card:
          title: 读取数据和图片都需要失败路径
          body: >-
            用 HTTP 请求获取数据，检查状态、内容类型及 JSON 结构。认证请求通过平台客户端带上受限凭据。图片加载要有占位、失败和大小控制。Flutter 可用 http 包；Android
            可选择合适的网络和图片库。
      - item:
          id: network-practice
          type: choice
          prompt: 服务端返回未授权，客户端应该当成空任务列表吗？
          options:
            - text: 按认证失败处理，给出重新登录或重试路径
              correct: true
            - text: 直接显示没有任务并假定正常
              why: 未授权没有返回可信任务数据。
          explain: 让响应类别对应合适的界面状态。
      - card:
          title: 区分超时、权限拒绝和数据不合法
          body: 对读取可按策略重试短暂故障，避免无限等待。敏感信息不放 URL 或日志。若有本地数据，可显示旧数据并标刷新失败。取消页面后，根据业务与生命周期停止无用读取或忽略过期结果。
      - item:
          id: network-apply
          type: choice
          prompt: 切换到新账号后，旧账号的读取请求才返回。界面应怎样处理？
          options:
            - text: 把旧结果立即覆盖新账号的界面
              why: 会显示错误账号的数据。
            - text: 核对请求所属账号与当前状态，忽略过期结果
              correct: true
          explain: 响应要和请求身份及当前页面关联。
  - id: api-writes
    chapter: 设备能力
    title: 发送新增、更新和删除时明确身份
    minutes: 13
    flow:
      - guess:
          id: api-writes-guess
          type: choice
          prompt: 更新请求发出去后连接断开。用户再点一次时，怎样避免把同一操作当两次？
          options:
            - text: 为同一次业务操作复用稳定编号
              correct: true
            - text: 重试时换全新编号并重复提交
              why: 服务端无法据编号判定重试。
          explain: 网络失败后保留足够身份信息。
      - card:
          title: 写入契约明确路径、方法和数据格式
          body: |
            Flutter 可通过 POST、PUT/PATCH、DELETE 请求完成新增、更新和删除，具体语义由 API 约定。检查响应并处理验证失败、冲突和权限。下例仅生成同一操作的数据，不发送请求。

            ```dart
            import 'dart:convert';

            void main() {
              final operation = {'opId': 'op-17', 'done': true};
              final body = jsonEncode(operation);
              final parsed = jsonDecode(body) as Map<String, dynamic>;
              print('${parsed['opId']}:${parsed['done']}');
            }
            // expect: op-17:true
            ```
      - item:
          id: api-writes-practice
          type: choice
          prompt: 一次更新已给编号 op-17。超时重试同一更新时应选哪个？
          options:
            - text: 换 op-18 以便服务端认为是新操作
              why: 题设需要识别同一操作。
            - text: 继续用 op-17
              correct: true
          explain: 请求编号与业务动作绑定。
      - card:
          title: 身份、资源版本与重试是不同检查
          body: 客户端附认证凭据，服务端检查权限与资源版本。版本不符时先获取当前记录再按规则合并或让用户选择。重试应考虑操作是否能安全重复执行，防重实现由服务端和客户端共同兑现。
      - item:
          id: api-writes-apply
          type: choice
          prompt: 服务端拒绝旧版本修改。更合适的下一步是什么？
          options:
            - text: 无条件强制把旧版本覆写到最新记录
              why: 可能覆盖另一个设备的新编辑。
            - text: 取回新版本，按业务冲突规则处理
              correct: true
          explain: 把冲突当成需要处理的状态。
  - id: local-data
    chapter: 离线同步与发布
    title: 把持久记录与小型设置分开保存
    minutes: 13
    flow:
      - guess:
          id: local-data-guess
          type: choice
          prompt: 应用重启后，用户要看全部待办，还要记住深色模式。两项都适合放在一个临时界面变量里吗？
          options:
            - text: 界面变量会跨所有重启自动保存
              why: 界面可能被销毁。
            - text: 待办用持久记录，主题可用小型设置
              correct: true
          explain: 数据寿命和访问方式决定存储。
      - card:
          title: Room 管结构化表，DataStore 管小设置
          body: SQL 可查询表、过滤和更新行。Room 在 Android 对 SQLite 提供实体、数据访问对象及迁移支持。DataStore 适合小型偏好或配置。业务记录需要考虑版本、事务和索引设计。
      - item:
          id: local-data-practice
          type: choice
          prompt: 要按账号查询未完成待办，还要维护版本，哪项更贴合？
          options:
            - text: 使用结构化本地数据库
              correct: true
            - text: 把所有待办只拼成一个主题偏好字符串
              why: 缺少可靠的筛选、更新和迁移边界。
          explain: 按访问路径与维护要求选存储。
      - card:
          title: 先本地提交变更，再让界面观察本地结果
          body: 离线优先的数据层让界面读取持久本地记录，网络刷新再写回本地。把本地业务更新与待发操作放同一事务，避免改了显示却丢同步意图。先定义数据迁移和清理政策。
      - item:
          id: local-data-apply
          type: choice
          prompt: 保存本地待办时系统在一半失败，如何防止只改任务、未登记待上传操作？
          options:
            - text: 将两项变动放在同一个本地事务
              correct: true
            - text: 靠界面颜色表示已经登记
              why: 显示状态不能保证数据同成同败。
          explain: 事务为相关持久操作提供原子边界。
  - id: flutter-storage
    chapter: 离线同步与发布
    title: 在 Flutter 中按数据形状选择落盘方式
    minutes: 13
    flow:
      - guess:
          id: flutter-storage-guess
          type: choice
          prompt: 缓存一张已下载的图片和保存多条可筛选待办，是否应该用同一种结构？
          options:
            - text: 图片可用文件或缓存，待办更适合有结构的数据库
              correct: true
            - text: 只要都持久保存就一定用同一方式
              why: 二者的读取、更新与寿命不同。
          explain: 分清文件、偏好和查询需求。
      - card:
          title: 键值、文件和 SQLite 各服务一种访问路径
          body: Flutter 可用偏好存储小设置，文件放应用允许的目录，SQLite 或支持相应平台的数据库保存可查询记录。选择库前核对桌面、移动和 Web 的支持。敏感秘密应使用平台提供的适当保护。
      - item:
          id: flutter-storage-practice
          type: match
          prompt: 为三项需求选一种常见本地存放方式。
          pairs:
            - - 主题颜色和排序偏好
              - 小型键值设置
            - - 大块本地图片内容
              - 应用管理的文件
            - - 按编号和完成状态筛选许多待办
              - 结构化数据库
          explain: 先看读写方式，再看生命周期与权限。
      - card:
          title: 落盘要考虑迁移、失败与恢复
          body: 写文件可能中途失败，关键数据可写入临时位置并按平台支持的方式替换。数据库升级要迁移和验证旧记录。模拟存储不足、应用被终止与不同版本升级，检查用户重要数据能否保留。
      - item:
          id: flutter-storage-apply
          type: choice
          prompt: 新版新增一个待办字段。测试应覆盖哪条真实路径？
          options:
            - text: 只在全新安装上检查页面
              why: 新安装未经过旧结构迁移。
            - text: 从旧版本数据升级并核对原有任务仍可读
              correct: true
          explain: 验证已有用户状态。
  - id: background-sync
    chapter: 离线同步与发布
    title: 断网先提交本地，再让后台可靠重试
    minutes: 13
    flow:
      - guess:
          id: background-sync-guess
          type: choice
          prompt: 地铁上完成一个待办，网络不可用。应用如何既立即显示变化又等联网后上传？
          options:
            - text: 只更新临时界面，关闭页面后再试网络
              why: 应用退出会丢失临时修改。
            - text: 在本地保存修改和待同步操作
              correct: true
          explain: 把同步意图持久化。
      - card:
          title: 本地记录与待发送队列一起更新
          body: |
            下面把任务改为完成，并在同一个 SQLite 事务里登记操作及其基础版本。界面读本地数据。工作任务重启后仍能读取待发操作，成功确认后再清理。

            ```sql
            BEGIN;
            UPDATE Task SET done = 1 WHERE id = 'task-7';
            INSERT INTO Pending(op_id, task_id, base_revision, done)
            VALUES ('op-17', 'task-7', 4, 1);
            COMMIT;
            ```
      - item:
          id: background-sync-practice
          type: order
          prompt: 把离线编辑到成功同步的步骤排成一条路径。
          steps:
            - 同一事务保存修改与待发记录
            - 界面从本地读取新状态
            - 联网后用原编号上传
            - 确认成功后清理或标记待发记录
          explain: 不依赖页面存活，也不把发送当成已确认。
      - card:
          title: WorkManager 负责约束和重试，冲突按业务定义
          body: >-
            Android 的 WorkManager
            可安排有网络约束的持久后台工作，但不承诺精确时间。服务器按操作编号防重，版本冲突可按字段、明确规则或用户选择处理。设备时钟有偏差，避免把本地时间戳直接当可靠先后。
      - item:
          id: background-sync-apply
          type: choice
          prompt: 同步请求已执行但确认丢失，后台任务重启。怎样处理 op-17？
          options:
            - text: 删掉记录假定成功，或换编号执行一次
              why: 前者可能漏更，后者可能重复。
            - text: 用同一编号重试并由服务端识别已有结果
              correct: true
          explain: 利用持久编号与确认管理重试。
  - id: release
    chapter: 离线同步与发布
    title: 把测试环境、签名与分发轨道分开
    minutes: 13
    flow:
      - guess:
          id: release-guess
          type: choice
          prompt: 测试版连测试服务，生产版连正式服务。构建时如何减少误发？
          options:
            - text: 区分构建配置，逐个检查产物的环境与身份
              correct: true
            - text: 让所有构建只靠操作者临时手改服务端点
              why: 手动改动容易漏掉或混用。
          explain: 发布包要能追溯配置来源。
      - card:
          title: 构建变体区分应用身份与服务配置
          body: >-
            Android 可用 product flavors，iOS/macOS 可通过工程的 scheme 与配置。为测试和生产分开应用身份、服务端点和签名。Dart
            混淆可增加分析成本，保留符号以便诊断，不能保护随包分发的秘密。
      - item:
          id: release-practice
          type: choice
          prompt: 计划把正式环境长期服务密钥写入混淆后的 Dart 代码。合适吗？
          options:
            - text: 混淆后等同安全密钥库
              why: 密钥仍随客户端分发。
            - text: 长期秘密应留在服务端，客户端用受限凭据
              correct: true
          explain: 把配置和秘密分开。
      - card:
          title: 移动发布检查版本、签名、验证与回退
          body: Android 可构建签名 AAB，使用内测轨道并按规则增加 versionCode；iOS 用目标平台签名和归档，先向测试渠道交付再提交审核。检查权限、升级迁移、错误指标和暂停分发策略。
      - item:
          id: release-apply
          type: order
          prompt: 给一次常规移动版本排列发布步骤。
          steps:
            - 确定变体、目标与版本号
            - 构建并验证签名产物
            - 交测试渠道验证升级与核心流程
            - 按发布规则逐步分发并观察
          explain: 从可追溯产物到验证，再扩大分发。
  - id: multi-release
    chapter: 离线同步与发布
    title: 让各目标平台的构建和验证可重复
    minutes: 13
    flow:
      - guess:
          id: multi-release-guess
          type: choice
          prompt: 同一 Flutter 源码要发 Windows、Linux、macOS 和 Web。能把同一个桌面应用包发给所有目标吗？
          options:
            - text: 同一源码意味着构建产物可在各系统通用
              why: 系统接口和分发方式不同。
            - text: 需要按目标的构建工具、包格式和能力分别产出
              correct: true
          explain: 共享项目代码仍需目标特定交付。
      - card:
          title: 按目标平台设置变体、打包与发布
          body: Windows 与 Linux 可用各自工程和打包配置区分环境；macOS 需对应构建和签名；Web 产出静态资源并配置托管路径和缓存。检查每个目标的图标、版本、权限、更新和支持的插件。
      - item:
          id: multi-release-practice
          type: match
          prompt: 给发布检查配主要对象。
          pairs:
            - - 托管路径、静态资源和缓存
              - Web
            - - 适配该系统的应用包及安装包
              - Windows 或 Linux 桌面目标
            - - 归档签名和系统平台分发条件
              - macOS 目标
          explain: 平台交付要求影响最后的制品与验收。
      - card:
          title: 自动化交付仍需显式校验与发布门槛
          body: 持续交付流程可测试、为各目标构建、记录制品版本，再向测试或批准的渠道分发。签名凭据由受限环境管理。保留可追溯的制品与验证记录，明确数据迁移后能否回退。
      - item:
          id: multi-release-apply
          type: choice
          prompt: 桌面 CI 通过但 Web 的核心插件不受支持。能否据桌面结果发布 Web？
          options:
            - text: 可以，所有平台共享源码就自动通过
              why: 不同目标的插件能力和运行环境不同。
            - text: 应为 Web 单独验证能力和关键流程
              correct: true
          explain: 按目标分别验证。
boss:
  items:
    - id: life
      type: choice
      prompt: Android Activity 初次启动进入前台，哪个顺序常见？
      options:
        - text: onCreate → onStart → onResume
          correct: true
        - text: onResume → onStop → onCreate
          why: 创建和可见应先于前台交互。
      explain: 按生命周期安排获取和清理。
    - id: restore
      type: choice
      prompt: 待办要跨用户关闭应用和进程终止保留。最合适的是？
      options:
        - text: 单个普通界面字段
          why: 运行对象可能已被销毁。
        - text: 持久数据库
          correct: true
      explain: 业务数据需要独立于显示对象。
    - id: counter
      type: number
      prompt: 计数器起始为 0，按三次 +1 再按一次重置，最后显示多少？
      answer: 0
      explain: 重置把当前计数恢复为 0。
    - id: permission
      type: choice
      prompt: 扫描是可选功能，用户拒绝相机授权。合理的回退是什么？
      options:
        - text: 阻断所有待办操作
          why: 核心功能不依赖相机。
        - text: 保留手动录入
          correct: true
      explain: 权限应与需要的能力相称。
    - id: adapt
      type: choice
      prompt: 设备分屏后可用宽度缩小，优先用什么决定布局？
      options:
        - text: 当前窗口或局部布局约束
          correct: true
        - text: 只用机器型号
          why: 分屏改变空间而不改变设备型号。
      explain: 按实际可用条件适配。
    - id: sync
      type: choice
      prompt: 同步提交超时，服务器可能已经执行。客户端应该怎样重试？
      options:
        - text: 换一个编号让它再次独立执行
          why: 可能重复产生影响。
        - text: 继续使用原操作编号，并由服务端识别重复
          correct: true
      explain: 保留操作身份直到获得确认。
    - id: local
      type: choice
      prompt: 离线修改要立即显示且重启后能上传，哪项设计更可靠？
      options:
        - text: 同一事务保存本地记录和待发记录
          correct: true
        - text: 只改界面，不登记待发操作
          why: 离开页面可能丢失修改意图。
      explain: 本地提交和后续同步需要持久证据。
    - id: desktop
      type: choice
      prompt: Electron 的渲染页面要发业务请求，如何限制权限？
      options:
        - text: 在所有渲染页面暴露整个系统能力
          why: 会扩大不可信内容可用的权限。
        - text: 通过隔离的窄接口传递，验证发送方与输入
          correct: true
      explain: 限制跨边界操作。
    - id: release
      type: choice
      prompt: 发布前想找出从旧版本升级时的数据错误，最直接的办法是什么？
      options:
        - text: 用旧版本数据安装升级包并核对迁移结果
          correct: true
        - text: 只测全新安装
          why: 全新安装没有旧结构可迁。
      explain: 发布验证包括已有用户路径。
