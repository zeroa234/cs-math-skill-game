skill: P.1.3
version: 2
brief:
  why: 同一任务既可逐步执行，也可用函数组合、规则或查询表达。用 OCaml、Prolog 和 SQL 比较它们怎样组织数据和计算。
  outcomes:
    - 构造新值并用高阶函数组合处理步骤
    - 用模式匹配处理可缺值、记录和树
    - 写规则与查询，并解释搜索或分组结果
terms:
  - term: 副作用
    def: 计算对外部可观察状态产生的改变。
  - term: 数组
    def: 按位置访问的一组元素。
  - term: 高阶函数
    def: 接收函数或返回函数的函数。
  - term: 柯里化
    def: 用逐个接收输入的一串函数表示多参数函数。
  - term: 递归
    def: 把问题缩小后调用同一函数或规则。
  - term: 折叠
    def: 反复把当前元素合入一个累积结果。
  - term: 变体
    def: 用不同构造值表示多种数据形状。
  - term: 模式匹配
    def: 按值的构造或结构选择分支并取出内部值。
  - term: 代数数据类型
    def: 由字段组合或多种构造选择组成的数据类型。
  - term: Horn 子句
    def: 可表达结论及其成立所需条件的逻辑子句。
  - term: 合一
    def: 寻找使两个逻辑项相同的变量替换。
  - term: 回溯
    def: 撤回当前选择后的绑定，继续尝试其他路径。
lessons:
  - id: expressions
    chapter: 不可变数据
    title: 用 let 给结果取名字
    minutes: 13
    flow:
      - guess:
          id: expressions-guess
          type: choice
          prompt: 若一条 if 表达式在条件成立时给 8，否则给 0，条件为真时结果是什么？
          options:
            - text: '8'
              correct: true
            - text: 没有结果，因为 if 只能执行动作
              why: OCaml 的 if 也能返回值。
          explain: 先区分执行动作和算出一个值。
      - card:
          title: 表达式先求值，名字绑定到值
          body: >
            OCaml 的 `let x = 3` 把 x 绑定到一个值。`let x = 4 in x + 1` 在局部范围使用新绑定。分支本身可产生值，两个结果应有相容类型。`let area width
            height = ...` 定义有两个参数的函数。


            ```ocaml

            let area width height = width * height

            let sides = if true then 4 else 2

            let () = Printf.printf "%d\n" (area sides 3)

            (* expect: 12 *)

            ```
      - item:
          id: expressions-practice
          type: number
          prompt: 函数 `let area width height = width * height`。调用 `area 5 2`，结果是多少？
          answer: 10
          explain: OCaml 用空格依次传入参数，5 乘 2 得 10。
      - card:
          title: 看类型错误，再用小输入核对结果
          body: 整数用 `+`，浮点数加法用 `+.`。程序若不能运行，先看报错指向的表达式和预期类型。程序能运行却算错时，缩小输入，在关键步骤打印或断言结果，分别判断哪里偏离预期。
      - item:
          id: expressions-apply
          type: choice
          prompt: 表达式写成 `2 + 3.5`，类型检查拒绝它。若目标是浮点相加，应怎样写？
          options:
            - text: '`2 +. 3.5`，整数会自动变成浮点数'
              why: OCaml 不会替这里的整数做隐式转换。
            - text: '`2.0 +. 3.5`'
              correct: true
          explain: 让运算符和两侧值的类型一致。
  - id: immutable
    chapter: 不可变数据
    title: 在旧列表前接新元素，保留两个版本
    minutes: 13
    flow:
      - guess:
          id: immutable-guess
          type: choice
          prompt: 备忘录先保存了一个项目清单，再做一份带新项的版本。旧记录还能保留吗？
          options:
            - text: 必须就地改旧清单，才能加新项
              why: 有持久的旧值时可以构造新值。
            - text: 可以，构造新清单并保留旧清单
              correct: true
          explain: 区分修改旧对象与产生另一个值。
      - card:
          title: 不可变数据可安全共享未改的部分
          body: |
            OCaml 列表写成 `[2; 3]`。`1 :: old` 把 1 接到头部，尾部仍是原列表。旧值不变，新旧版本可共享尾部。重新用同名 `let` 绑定只影响此后的名字查找。

            ```ocaml
            let old = [2; 3]
            let next = 1 :: old
            let () = Printf.printf "%d/%d\n" (List.length old) (List.length next)
            (* expect: 2/3 *)
            ```
      - item:
          id: immutable-practice
          type: choice
          prompt: '已有 `old = [2; 3]`，求 `1 :: old` 后原来的 old 是什么？'
          options:
            - text: 仍为 `[2; 3]`
              correct: true
            - text: 变为 `[1; 2; 3]`
              why: 接到头部产生新列表，未改原来的列表。
          explain: 共享旧尾部与更新旧值是不同操作。
      - card:
          title: 纯函数不改变外部可观察的状态
          body: '**副作用（side effect）**包括修改共享状态、写文件或打印等。纯函数的结果由输入决定，执行不产生外部可观察的改变。可把计算与界面读写分开，计算较容易用小输入测试。'
      - item:
          id: immutable-apply
          type: choice
          prompt: 两个函数都返回加价后的金额。一个只计算，另一个还写入销售日志。哪一个可作为纯计算替换而不改变外部状态？
          options:
            - text: 只计算金额的函数
              correct: true
            - text: 写日志的函数，因为返回值相同
              why: 日志是调用后可观察的变化。
          explain: 比较结果和影响，不能只看返回值。
  - id: mutation
    chapter: 不可变数据
    title: 需要改状态时，把改变圈在小范围
    minutes: 13
    flow:
      - guess:
          id: mutation-guess
          type: choice
          prompt: 两个人持有同一个可修改计数盒。甲往盒中放新值，乙再打开同一个盒，会读到什么？
          options:
            - text: 新值
              correct: true
            - text: 旧值，因为变量名不同
              why: 两个名字可以指同一个盒。
          explain: 判断是否共享可变对象。
      - card:
          title: ref 可读可写，别名能看见更新
          body: >
            `ref 0` 建立可改变的盒。`!count` 取出值，`count := 3` 写新值。用类型声明 `mutable` 可让记录中的特定字段可改，用 `<-`
            更新。把改变限制在明确位置，避免计算依赖隐藏的外部状态。


            ```ocaml

            let count = ref 0

            let alias = count

            let () = count := 3

            let () = Printf.printf "%d\n" !alias

            (* expect: 3 *)

            ```
      - item:
          id: mutation-practice
          type: choice
          prompt: 若要保留过去的计数快照，应让 `saved` 绑定什么？
          options:
            - text: 绑定 `count` 盒本身并一直从盒里读
              why: 盒以后还能被写，读到的未必是旧值。
            - text: 绑定当时的 `!count` 数值
              correct: true
          explain: 快照要保存内容或独立对象。
      - card:
          title: 数组可就地更新，循环也可用于局部变动
          body: >
            **数组（array）**把值放在按位置访问的序列中。OCaml 数组写成 `[|2; 4|]`，读下标用 `a.(0)`，更新用 `<-`。`for ... do ... done`
            可遍历并改变本地数组。列表和数组有不同的修改语义。


            ```ocaml

            let values = [|2; 4|]

            let () =
              for i = 0 to Array.length values - 1 do
                values.(i) <- values.(i) + 1
              done
            let () = Printf.printf "%d/%d\n" values.(0) values.(1)

            (* expect: 3/5 *)

            ```
      - item:
          id: mutation-apply
          type: choice
          prompt: 怎样在不改变输入数组的情况下把每一项加一？
          options:
            - text: 遍历每项并用 `<-` 改输入数组
              why: 原数组会被就地更新。
            - text: 用 `Array.map (fun x -> x + 1) values` 生成结果数组
              correct: true
          explain: 选与调用方能否保留输入相符的操作。
  - id: higher
    chapter: 高阶函数
    title: 把行为作为参数，也可以先交一部分参数
    minutes: 13
    flow:
      - guess:
          id: higher-guess
          type: choice
          prompt: 两段代码都对同一数据做两次相同操作，一段递增、一段翻倍。什么可以作为参数？
          options:
            - text: 只能传数据，函数永远不能传给别的函数
              why: 函数也可以作为输入。
            - text: 要执行的操作本身
              correct: true
          explain: 提取的是重复的过程，变化行为由调用者提供。
      - card:
          title: 高阶函数可接收或返回函数
          body: >
            **高阶函数（higher-order function）**把函数当输入或结果。`fun x -> x + 1` 是一个函数值。下面 `twice` 不知道 `f`
            的细节，只在同一个输入类型上连续应用两次。


            ```ocaml

            let twice f x = f (f x)

            let inc x = x + 1

            let () = Printf.printf "%d\n" (twice inc 5)

            (* expect: 7 *)

            ```
      - item:
          id: higher-practice
          type: number
          prompt: '`twice f x = f (f x)`，如果 f 把输入乘 2，x 为 3，结果是多少？'
          answer: 12
          explain: 先从 3 变 6，再从 6 变 12。
      - card:
          title: 柯里化使每次应用接收一个参数
          body: >-
            `let add a b = a + b` 可以看成 `fun a -> fun b -> a + b`。**柯里化（currying）**把多输入写成逐个接收输入的一串函数。`add 2`
            是部分应用，返回仍需一个输入的函数。
      - item:
          id: higher-apply
          type: choice
          prompt: 已定义 `let add a b = a + b`，`let bonus = add 2` 后 `bonus` 是什么？
          options:
            - text: 等于 2 的整数
              why: 第二个输入尚未给出。
            - text: 输入一个数并加 2 的函数
              correct: true
          explain: 看函数应用之后还有哪些输入待提供。
  - id: map-filter
    chapter: 高阶函数
    title: 把逐项转换和按条件挑选分开
    minutes: 13
    flow:
      - guess:
          id: map-filter-guess
          type: choice
          prompt: 有 [2; 3; 4]。每项加一和只保留偶数，哪个动作会减少元素数？
          options:
            - text: 只保留偶数
              correct: true
            - text: 每项加一
              why: 转换为每个输入给一个输出。
          explain: 先明确新序列长度是否应变。
      - card:
          title: map 为每个元素算一个结果
          body: >
            `List.map f xs` 按原顺序对每项调用 f，结果可以是另一种类型。**递归（recursion）**让函数调用自己处理更小的输入。手写时，空列表给空列表，`x :: rest`
            把变换后的头接到处理过的尾前。下面用 `function` 直接检查传入列表的形状。


            ```ocaml

            let rec map f = function
              | [] -> []
              | x :: rest -> f x :: map f rest
            let result = map (fun n -> n + 1) [2; 3; 4]

            let () = List.iter (Printf.printf "%d\n") result

            (* expect: 3|4|5 *)

            ```
      - item:
          id: map-filter-practice
          type: choice
          prompt: 把 `[2; 3; 4]` 送入 `List.map (fun x -> x * 2)`，得到什么？
          options:
            - text: '`[4; 8]`，因为不保留奇数'
              why: map 只变换，没有筛除规则。
            - text: '`[4; 6; 8]`'
              correct: true
          explain: 转换给每个原项留下一个新项。
      - card:
          title: filter 保留条件为真的原项
          body: |
            `List.filter p xs` 对每项判断条件。手写时若头满足 p，把它接到递归结果；否则只返回其余元素的结果。条件不负责计算新的值。

            ```ocaml
            let rec filter p = function
              | [] -> []
              | x :: rest -> if p x then x :: filter p rest else filter p rest
            let result = filter (fun n -> n mod 2 = 0) [2; 3; 4]
            let () = List.iter (Printf.printf "%d\n") result
            (* expect: 2|4 *)
            ```
      - item:
          id: map-filter-apply
          type: choice
          prompt: 要先去掉不及格分数，再给剩余分数加 5。合适顺序是什么？
          options:
            - text: 先 filter，再 map
              correct: true
            - text: 只 map，因为加 5 后会自动去掉不及格项
              why: map 不会删掉项。
          explain: 题目要求按原分数筛选，再转换保留下来的值。
  - id: fold
    chapter: 高阶函数
    title: 把逐项计算累积成一个结果
    minutes: 13
    flow:
      - guess:
          id: fold-guess
          type: choice
          prompt: 从 0 开始，依次处理 2、3、4，每次把当前数加到累积结果。处理完 3 时结果是多少？
          options:
            - text: '9'
              why: 4 还未处理。
            - text: '5'
              correct: true
          explain: 每一步都可说明新的累积状态。
      - card:
          title: 左折叠更新累积值并继续处理
          body: |
            **折叠（fold）**把一个合并函数反复应用于累积值和当前元素。下面的 foldl 把新的累积值交给下一步。**递归（recursion）**让函数处理较小的问题，空列表返回累积值。

            ```ocaml
            let rec foldl f acc = function
              | [] -> acc
              | x :: rest -> foldl f (f acc x) rest
            let () = Printf.printf "%d\n" (foldl ( + ) 0 [2; 3; 4])
            (* expect: 9 *)
            ```
          reveal:
            - title: 确定初值
              body: 空列表的和为 0，从 0 开始。
            - title: 一步步更新
              body: 读 2 得 2，读 3 得 5，读 4 得 9。
      - item:
          id: fold-practice
          type: number
          prompt: 左折叠从 10 开始，依次用减法合并 [2; 3]。最后的累积值是多少？
          answer: 5
          explain: 左折叠先算 10−2，再算 8−3。
      - card:
          title: 尾递归在递归调用返回后没有后续工作
          body: '`x + sum rest` 要在子调用返回后做加法，通常还要保存本层信息。foldl 先算新累积值再递归，返回后直接交结果，OCaml 可优化这种尾调用，避免为每个列表元素保留一次调用。'
      - item:
          id: fold-apply
          type: choice
          prompt: 下面哪个表达式中的递归调用处于尾位置？
          options:
            - text: '`x + sum rest`'
              why: sum 返回之后，本层仍要加 x。
            - text: '`foldl f (f acc x) rest`'
              correct: true
          explain: 检查返回后还剩多少本层工作。
  - id: pipeline
    chapter: 高阶函数
    title: 把数据沿清楚的顺序送给各步骤
    minutes: 13
    flow:
      - guess:
          id: pipeline-guess
          type: choice
          prompt: 先把分数加 5 再筛及格，和先筛及格再加 5，结果一定一样吗？
          options:
            - text: 不一定，原本差一点及格的分数可能被保留
              correct: true
            - text: 一定一样，map 与 filter 可任意调换
              why: 筛选条件看到的分数可能不同。
          explain: 操作顺序由业务要求决定。
      - card:
          title: 管道把左边的值交给右边函数
          body: |
            `x |> f` 等于 `f x`。列表可先筛，再转换，最后折叠。相同思想也可用在 `Array.map` 上；需要把缺失情况保留下来时，可用 `Option.map` 只变换存在的值。

            ```ocaml
            let result =
              [55; 60; 75]
              |> List.filter (fun x -> x >= 60)
              |> List.map (fun x -> x + 5)
              |> List.fold_left ( + ) 0
            let () = Printf.printf "%d\n" result
            (* expect: 145 *)
            ```
      - item:
          id: pipeline-practice
          type: number
          prompt: 55、60、75 先筛 ≥60，再各加 5 后求和。总和是多少？
          answer: 145
          explain: 留下 60、75，转换为 65、80，再相加。
      - card:
          title: 代数规律帮助安全合并无副作用的步骤
          body: >-
            对纯函数，`map identity` 保留原值序列，连续 `map f` 与 `map g` 可合为一次 `map (fun x -> g (f
            x))`。若函数记录日志，两次遍历和合并遍历可能产生不同的日志次序。含减法的折叠也不能任意重排。
      - item:
          id: pipeline-apply
          type: choice
          prompt: 两次 map 的函数都只计算值。先把每项加 1，再把每项乘 2，可合为哪个变换？
          options:
            - text: '`fun x -> x * 2 + 1`'
              why: 交换运算顺序会改变结果。
            - text: '`fun x -> (x + 1) * 2`'
              correct: true
          explain: 合并时保留先后应用的顺序。
  - id: variants
    chapter: 模式匹配
    title: 用不同构造值表达明确的状态
    minutes: 13
    flow:
      - guess:
          id: variants-guess
          type: choice
          prompt: 查找结果要区分没找到和找到一个 0。都用数字 0 能做到吗？
          options:
            - text: 能，看到 0 时总能猜出原意
              why: 0 也可能是真实结果。
            - text: 不能，要给缺失独立表示
              correct: true
          explain: 不同状态在类型中有不同形状。
      - card:
          title: 变体用构造值选择形状
          body: >
            **变体（variant）**可用不同构造值表示多种情形。OCaml 的 `None` 表示缺失，`Some x` 表示含有一个值。`match ... with`
            检查形状并在相应分支给内部值命名。


            ```ocaml

            let display value =
              match value with
              | None -> "missing"
              | Some n -> string_of_int n
            let () = print_endline (display (Some 0))

            let () = print_endline (display None)

            (* expect: 0|missing *)

            ```
      - item:
          id: variants-practice
          type: choice
          prompt: 输入 `Some 0` 时应进哪条分支？
          options:
            - text: Some 分支，内部 n 等于 0
              correct: true
            - text: None 分支，因为 n 为零
              why: 构造值是 Some，内部数值不决定构造值。
          explain: 先看外层形状，再处理内部数据。
      - card:
          title: 对每种情况给出处理方式
          body: '**模式匹配（pattern matching）**按结构匹配值。类型检查通常能提示遗漏的分支。把 `None` 写成明确的默认、提示或传播缺失，调用方可看到这里怎样处理未知数据。'
      - item:
          id: variants-apply
          type: choice
          prompt: 只写 `Some n -> n` 而遗漏 None，输入 None 时会怎样？
          options:
            - text: 缺失分支会被警告，执行到此时可触发匹配失败
              correct: true
            - text: 语言一定自动替你选 0
              why: 语言不知道该业务的缺失值应怎样处理。
          explain: 把所有可出现的构造值列进约定。
  - id: structured
    chapter: 模式匹配
    title: 用元组和记录解构相关数据
    minutes: 13
    flow:
      - guess:
          id: structured-guess
          type: choice
          prompt: 预约里有房间、日期和人数。若不同调用方总记错字段的位置，怎么让访问更清楚？
          options:
            - text: 用有字段名的记录
              correct: true
            - text: 加更多无名的位置
              why: 位置越多越难判断每项的含义。
          explain: 字段名能把数据含义放到类型里。
      - card:
          title: 元组按位置，记录按字段名
          body: >
            `(name, score)` 是有两个位置的元组。`let (n, s) = pair` 可同时取出值。记录先声明字段类型，再用 `{ name = ...; score = ... }`
            构造；`{ old with score = new_score }` 产生保留其他字段的新记录。


            ```ocaml

            type student = { name : string; score : int }

            let old = { name = "Mei"; score = 70 }

            let updated = { old with score = 85 }

            let () = Printf.printf "%d/%d\n" old.score updated.score

            (* expect: 70/85 *)

            ```
      - item:
          id: structured-practice
          type: choice
          prompt: 只更新新记录的 score，旧记录的分数会怎样？
          options:
            - text: 同时更新，因为记录字段名相同
              why: 新记录复制未改字段，未就地修改旧记录。
            - text: 保持原值
              correct: true
          explain: 区分构造新值和修改现有对象。
      - card:
          title: 用更具体的模式先匹配，再给通用情况兜底
          body: |
            模式可以嵌套，可以用 `_` 忽略，也可用 `when` 附加条件。按书写顺序尝试分支。如果通用模式先成功，后面的具体模式就无法处理该值。

            ```ocaml
            let classify = function
              | (name, score) when score >= 80 -> name ^ ":pass"
              | (name, _) -> name ^ ":retry"
            let () = print_endline (classify ("Bo", 82))
            (* expect: Bo:pass *)
            ```
      - item:
          id: structured-apply
          type: choice
          prompt: 若把无条件的 `(name, _)` 分支放在前面，82 分会被哪一条接走？
          options:
            - text: 后面的带条件分支，因为更具体就有优先权
              why: OCaml 先采用第一条成功的分支。
            - text: 前面的通用分支
              correct: true
          explain: 把通用兜底放在更具体的分支之后。
  - id: trees
    chapter: 模式匹配
    title: 对每种构造值写规则，让函数沿树走
    minutes: 13
    flow:
      - guess:
          id: trees-guess
          type: choice
          prompt: 一个分支节点有两个子树，空树没有子树。算深度时可以给两种形状不同处理吗？
          options:
            - text: 都直接返回同一个常量
              why: 多层树需要累加节点层数。
            - text: 空树用基线，分支用两棵子树结果算
              correct: true
          explain: 结构告诉函数如何缩小问题。
      - card:
          title: 用代数数据类型表达可组合的形状
          body: >
            **代数数据类型（algebraic data type）**可组合多种选择与字段组合。`Leaf` 是空树，`Node (left, value, right)`
            含三个部分。这里深度按节点层数计算，空树为 0；镜像保留值并交换两棵子树的镜像。


            ```ocaml

            type 'a tree = Leaf | Node of 'a tree * 'a * 'a tree

            let rec depth = function
              | Leaf -> 0
              | Node (left, _, right) -> 1 + max (depth left) (depth right)
            let rec mirror = function
              | Leaf -> Leaf
              | Node (left, v, right) -> Node (mirror right, v, mirror left)
            let tree = Node (Node (Leaf, "left", Leaf), "top", Leaf)

            let () = Printf.printf "%d/%b\n" (depth tree) (mirror (mirror tree) = tree)

            (* expect: 2/true *)

            ```
          reveal:
            - title: 从空树开始
              body: 约定 Leaf 深度为 0。
            - title: 算有值的节点
              body: 先取两个子树的深度中较大的一项，再加 1。
      - item:
          id: trees-practice
          type: number
          prompt: 按空树深度 0 的约定，根下只有一侧还有一个有值节点，另一侧为空。整棵树深度是多少？
          answer: 2
          explain: 子节点深度为 1，根取较大子树深度 1 再加 1。
      - card:
          title: 自然数也可以用构造值定义
          body: >
            `Zero` 表示零，`Succ n` 表示 n 加一。处理 `Zero` 用基线；处理 `Succ n` 先对更小的 n 调用同一函数，再用结果。例如 `to_int` 对 Zero 给 0，对
            Succ 加 1。


            ```ocaml

            type nat = Zero | Succ of nat

            let rec to_int = function
              | Zero -> 0
              | Succ n -> 1 + to_int n
            let () = Printf.printf "%d\n" (to_int (Succ (Succ Zero)))

            (* expect: 2 *)

            ```
      - item:
          id: trees-apply
          type: match
          prompt: 按本课定义，将不同构造值配给其作用。
          pairs:
            - - Leaf
              - 空树
            - - Node
              - 有值、可能有子树的节点
            - - Succ
              - 一个自然数的后继
          explain: 先识别外层构造值，再处理里面更小的数据。
  - id: prolog
    chapter: 规则与查询式表达
    title: 给事实和规则，让查询找满足条件的值
    minutes: 13
    flow:
      - guess:
          id: prolog-guess
          type: choice
          prompt: 知道甲是乙的父母，乙是丙的父母。要让系统回答祖辈是谁，可以给它什么？
          options:
            - text: 给亲子事实和祖辈规则，再提出查询
              correct: true
            - text: 把每个祖辈查询的答案都提前写成输出
              why: 规则可以从现有事实推出新答案。
          explain: 描述成立条件，让求解器找证明。
      - card:
          title: 事实直接成立，规则写结论和需要证明的目标
          body: >
            Prolog 用小写名称表示常量，用大写开头的名字表示逻辑变量。**Horn 子句（Horn clause）**可表达一个结论与一串条件。事实没有条件；规则的 `:-`
            右边用逗号连接子目标，查询问哪些变量绑定能让目标成立。


            ```prolog

            parent(tom, bob).

            parent(bob, ann).

            parent(bob, pat).


            grandparent(X, Z) :- parent(X, Y), parent(Y, Z).

            ```
      - item:
          id: prolog-practice
          type: choice
          prompt: 查询 `grandparent(tom, X)`，已知 tom 的孩子是 bob，bob 的孩子是 ann 和 pat。有哪些答案？
          options:
            - text: 只有 bob
              why: bob 只满足第一个亲子目标。
            - text: ann 和 pat
              correct: true
          explain: 让同一个中间 Y 同时满足两个子目标。
      - card:
          title: 把谓词名和参数个数一起看
          body: '`parent/2` 表示有两个参数的谓词。查询 `?- parent(bob, X).` 可逐个得到候选值；固定两个参数时问该目标是否可证明。相同变量在一条规则中要有相容的绑定。'
      - item:
          id: prolog-apply
          type: choice
          prompt: 查询 `parent(bob, ann)`，它对应哪种目标？
          options:
            - text: 检查一个已指定的关系是否成立
              correct: true
            - text: 请求替程序寻找两个未知变量
              why: 两个参数都是指定常量。
          explain: 是否返回绑定取决于查询中是否有待求变量。
  - id: unification-search
    chapter: 规则与查询式表达
    title: 用合一推进子目标，回溯再试另一条路
    minutes: 13
    flow:
      - guess:
          id: unification-search-guess
          type: choice
          prompt: 已知 `parent(tom,bob)`，查询 `parent(tom,Y)`。怎样让两项匹配？
          options:
            - text: 把 tom 改成任意人
              why: 第一个位置已固定为 tom。
            - text: 绑定 Y 为 bob
              correct: true
          explain: 逐个位置匹配，并保留变量间一致的绑定。
      - card:
          title: 合一找一致的绑定，归结缩减待证明目标
          body: |
            **合一（unification）**找出使两个项相同的变量替换。若目标与规则头合一，可把该目标换成规则的子目标继续证明，这一步叫归结。以下程序先尝试直接亲子关系，再尝试经中间人延伸。

            ```prolog
            parent(tom, bob).
            parent(bob, ann).
            parent(bob, pat).

            ancestor(X, Y) :- parent(X, Y).
            ancestor(X, Y) :- parent(X, Z), ancestor(Z, Y).

            :- initialization(main).
            main :-
                findall(X, ancestor(X, ann), Xs),
                writeln(Xs),
                halt.
            % expect: [bob,tom]
            ```
          reveal:
            - title: 先试直接规则
              body: parent(bob, ann) 成立，得到 bob。
            - title: 沿中间人继续
              body: 回到另一个分支。tom 的孩子是 bob，bob 又是 ann 的祖先，得到 tom。
      - item:
          id: unification-search-practice
          type: choice
          prompt: 在课中三条 parent 事实下，`ancestor(X,ann)` 的前两个答案按当前规则顺序是什么？
          options:
            - text: 先 bob，再 tom
              correct: true
            - text: 先 tom，再 bob
              why: 程序先试直接规则，并按事实和规则的书写顺序查找。
          explain: 先列当前执行顺序，再区分逻辑上的答案集合。
      - card:
          title: 回溯退到选择点，顺序也影响能否找到答案
          body: >-
            **回溯（backtracking）**在需要更多答案或一条路失败时，撤回这一分支的绑定并试下一条。常见 Prolog
            从左到右尝试子目标、从上到下选子句，并沿一条路深入。关系有环或过早递归时可能反复走下去；可改目标顺序、限制访问或选有记录搜索结果的机制。
      - item:
          id: unification-search-apply
          type: choice
          prompt: 祖先事实出现环，查询一直返回或继续展开。最贴合的解释是什么？
          options:
            - text: 只要是声明式，执行器就保证每个查询结束
              why: 逻辑规则的含义与具体查找是否结束是不同问题。
            - text: 当前查找可能沿循环重复，需显式处理环或采用合适的求解方式
              correct: true
          explain: 检查递归方向和所用的执行机制。
  - id: lists-db
    chapter: 规则与查询式表达
    title: 用列表规则表达关系，明确何时修改事实库
    minutes: 13
    flow:
      - guess:
          id: lists-db-guess
          type: choice
          prompt: 同一个规则希望能问某项是否在列表里，也能列出列表里有什么。参数需要一直是同一个固定输入方向吗？
          options:
            - text: 同一关系可有多种查询方式，前提是求解顺序能支持
              correct: true
            - text: 只能有一个输入方向，否则不能表达关系
              why: 逻辑变量可在查询中由求解器绑定。
          explain: 从参数关系出发，再验证不同调用方式。
      - card:
          title: 空表和头尾模式给关系分情况
          body: |
            Prolog 的 `[Head|Tail]` 把非空列表分成第一项和余下列表。成员关系可先匹配第一项，也可继续检查余下列表；空列表没有候选。示例按当前顺序列出两个答案。

            ```prolog
            member_of(X, [X|_]).
            member_of(X, [_|Tail]) :- member_of(X, Tail).

            :- initialization(main).
            main :-
                findall(X, member_of(X, [red,blue]), Xs),
                writeln(Xs),
                halt.
            % expect: [red,blue]
            ```
      - item:
          id: lists-db-practice
          type: choice
          prompt: 对本课成员规则查询 `member_of(X,[red,blue])`，先找到哪个？
          options:
            - text: blue，因为总是先递归到最后
              why: 第一条规则先匹配当前头部。
            - text: red
              correct: true
          explain: 看子句顺序和匹配到的位置。
      - card:
          title: 动态事实库会改变随后能证明的内容
          body: >
            SWI-Prolog 可用 `dynamic` 声明动态谓词，再用 `assertz` 加子句、`retract`
            移去匹配子句。这样会修改求解依赖的状态，测试要明确初始数据并清理新增事实。静态规则、逻辑变量和关系查询仍有价值，也要考虑顺序、终止与可移植性。


            ```prolog

            :- dynamic available/1.

            :- initialization(main).

            main :-
                assertz(available(book)),
                findall(X, available(X), Before),
                writeln(Before),
                retract(available(book)),
                findall(X, available(X), After),
                writeln(After),
                halt.
            % expect: [book]|[]

            ```
      - item:
          id: lists-db-apply
          type: choice
          prompt: 添加 `available(book)` 后再删除这条事实。若原来没有事实，也没写其他规则，再查询会怎样？
          options:
            - text: 删除动作只改了当前显示，事实仍会被查询到
              why: retract 改动了动态谓词。
            - text: 找不到相应答案
              correct: true
          explain: 动态修改有副作用，注意在测试结束后还原。
  - id: sql
    chapter: 规则与查询式表达
    title: 用 SQL 描述按课分组后的目标结果
    minutes: 13
    flow:
      - guess:
          id: sql-guess
          type: choice
          prompt: 要保留平均分达到 80 的课程，应该先删掉低于 80 的单个分数再求平均吗？
          options:
            - text: 应该先删低分，否则不能得到及格课程
              why: 删掉低分会改变课程原本的平均分。
            - text: 应该先用每门课的所有已有分数求平均，再筛课程
              correct: true
          explain: 看要筛选的是单条记录还是聚合后的整组。
      - card:
          title: GROUP BY 分组，HAVING 按组筛选
          body: >
            `GROUP BY course` 把选课记录按课程归组，`AVG(grade)` 对各组的非空分数求平均，`HAVING` 按该平均分筛选整组。`ORDER BY ... DESC`
            将结果降序排列。这题未读取学生姓名，选课表已够用。


            ```sql

            SELECT course, AVG(grade) AS avg_grade

            FROM Enroll

            GROUP BY course

            HAVING AVG(grade) >= 80

            ORDER BY avg_grade DESC;

            ```
      - item:
          id: sql-practice
          type: number
          prompt: 某课程的两条有效成绩是 70、90，另有一条 NULL。按 SQL AVG，这门课的平均分是多少？
          answer: 80
          explain: AVG 忽略 NULL，用 70 和 90 求平均，刚好满足 80 的下限。
      - card:
          title: 声明所需结果，执行器安排处理步骤
          body: >-
            SQL 查询指定结果的条件与顺序。数据库会选择如何读取和汇总；命令式实现要自己维护每门课的总和与计数。需要确定同分顺序时，可补一个排序字段。Prolog 的规则查询也强调成立关系，但其查找顺序和
            SQL 执行方式不同。
      - item:
          id: sql-apply
          type: choice
          prompt: 若要保留整门课平均分不少于 80，而又不能丢弃低分，应把条件放在哪里？
          options:
            - text: '`HAVING AVG(grade) >= 80`'
              correct: true
            - text: '`WHERE grade >= 80`'
              why: WHERE 会在计算平均分前丢弃低分。
          explain: 按组计算的条件使用 HAVING。
boss:
  items:
    - id: reuse
      type: choice
      prompt: '用 `1 :: old` 构造新列表。原来的 old 是否变化？'
      options:
        - text: 旧列表不变，新的前缀可共享旧尾部
          correct: true
        - text: old 的首项被覆盖
          why: 连接构造新列表节点，未修改旧尾部。
      explain: 区分构造与就地修改。
    - id: effects
      type: choice
      prompt: 两个函数同输入同返回值，一个还写日志。它们是否都无副作用？
      options:
        - text: 两者都无副作用，返回值相同即可
          why: 日志是可观察的改变。
        - text: 只有不写日志且无其他外部改变的那个
          correct: true
      explain: 无副作用不只约束返回值。
    - id: steps
      type: order
      prompt: 要保留原始及格分数，给保留项加五分，再算总和。按顺序排列。
      steps:
        - 按原分数筛选
        - 给每个保留项加五
        - 折叠求总和
      explain: 先筛原值，再转换和累计。
    - id: tail
      type: choice
      prompt: 递归求和形如 `x + sum rest`。它是尾递归吗？
      options:
        - text: 是，语句中出现了递归就属于尾递归
          why: 判断依据是返回后是否还需处理。
        - text: 不是，子调用之后还要相加
          correct: true
      explain: 可改用累积参数先计算再递归。
    - id: option
      type: choice
      prompt: 读取结果 `Some 0`。和 `None` 有何区别？
      options:
        - text: 前者包含有效值 0，后者表示缺失
          correct: true
        - text: 两者都表示缺失
          why: 外层构造值不同。
      explain: 先按构造形状分情况。
    - id: tree
      type: number
      prompt: 空树深度为 0，节点深度为左右子树较大的深度再加 1。若两子树深度分别为 2、0，节点深度是多少？
      answer: 3
      explain: 较大值 2 加本节点 1。
    - id: logic
      type: choice
      prompt: '`parent(tom,bob)` 与 `parent(tom,X)` 合一，X 如何绑定？'
      options:
        - text: bob
          correct: true
        - text: tom
          why: X 位于第二个参数的位置。
      explain: 匹配固定参数再确定变量绑定。
    - id: sql
      type: choice
      prompt: 按课程筛选 AVG(grade) 不低于 80，应该用哪一条？
      options:
        - text: '`WHERE grade >= 80`'
          why: WHERE 会先删掉原始低分。
        - text: '`HAVING AVG(grade) >= 80`'
          correct: true
      explain: 分组条件在组值算出后执行。
